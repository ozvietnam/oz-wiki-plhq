# lumina.config.yaml — workspace config managed by lumina-wiki installer.
# Lives at _lumina/config/lumina.config.yaml. Editable by hand.

project_name: oz-kb-xnk
locale: vi
communication_language: Tiếng Việt
document_output_language: Tiếng Việt
created_at: '2026-10-04'
ide_targets:
  claude_code: true
  codex: true
  cursor: true
  gemini_cli: true
  qwen: false
  iflow: false
  generic: true
packs:
  core: true
  research: false
  reading: false
  learning: false
paths:
  raw: raw
  wiki: wiki
  agents: .agents
  _lumina: _lumina
  index: wiki/index.md
  log: wiki/log.md
wiki:
  link_syntax: obsidian
  log_prefix: '## [{{date}}] {{skill}} | {{details}}'
  bidirectional_links:
    mode: exempt-only
    exemptions:
      - foundations/**
      - outputs/**
      - '*://*'
  graph:
    enabled: true
lint:
  default_mode: report
  checks:
    broken_links: true
    orphan_pages: true
    missing_reverse_links: true
    log_format: true
    index_freshness: true
    stale_claims: false
integrations:
  qmd_search: false
  obsidian_vault: false
  marp_slides: false
telemetry: false
