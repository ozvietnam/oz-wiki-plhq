      noi_dung: 'Điều 3. Điều khoản. chuyển tiếp Trong thời gian nâng cấp Hệ thống xử lý dữ liệu điện tử hải quan dé đáp ứng các quy định tại Thông tư này: 1. Đối với doanh nghiệp được chỉ định theo quy định của Luật Bưu chính: Thực hiện thủ tục hải quan đối với gói, kiện hàng hóa xuất khâu, nhập khâu nhóm | theo quy định tại khoản 4 Điêu 1 Thông tư này. 2. Đối với doanh nghiệp chuyển phát nhanh:'
      trang_pdf: 33
    - dieu: 4
      noi_dung: Điều 4. Trách nhiệm tổ chức thực hiện 1. Tổng cục Hải quan có trách nhiệm xây dựng Hệ thống xử ly dit liệu điện tử hải quan đáp ứng các yêu câu quy định tại Thông tư này. 2. _ Trường hợp theo Điều ước quốc tế mà Việt Nam là thành viên có quy định về thời gian giải phóng hàng, Tổng, cục Hải quan có trách nhiệm tổ chức thực hiện đảm bảo theo đúng điều ước quốc tế đó.
