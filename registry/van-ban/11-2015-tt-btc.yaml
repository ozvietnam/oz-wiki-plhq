xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF Công báo số 277+278 ngày 26-02-2015 (congbaocdn.chinhphu.vn, 9 trang, người ký Thứ trưởng Trương Chí Trung) và đối chiếu CSDLQG vbpl.vn (ID 56479): Điều 12 quy định Thông tư có hiệu lực thi hành từ ngày 20-03-2015 và thay thế Thông tư 27/2003/TT-BTC ngày 01-04-2003 của Bộ Tài chính; hướng dẫn Quyết định 14/2014/QĐ-TTg ngày 14-02-2014 của Thủ tướng Chính phủ. Hiện vẫn còn hiệu lực thi hành.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng Thông tư này hướng dẫn lập dự toán và cơ chế quản lý tài chính cho hoạt động tư vấn, phản biện và giám định xã hội của hệ thống Liên hiệp các Hội Khoa học và Kỹ thuật Việt Nam, bao gồm: Liên hiệp các Hội Khoa học và Kỹ thuật ở Trung ương (sau đây gọi là Liên hiệp Hội Việt Nam) và các hội khoa học và kỹ thuật chuyên ngành toàn quốc của Liên hiệp Hội Việt Nam (sau đây gọi là hội ngành toàn quốc), Liên hiệp các Hội Khoa học và Kỹ thuật ở các tỉnh, thành phố trực thuộc Trung ương (sau đây gọi là Liên hiệp hội địa phương), và các tổ chức, cá nhân có liên quan.'
      trang_pdf: 1
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 3
      noi_dung: 'Điều 3. Nguyên tắc tài chính - Hoạt động tư vấn, phản biện và giám định xã hội của Liên hiệp các Hội Khoa học và Kỹ thuật Việt Nam là hoạt động mang tính chất xã hội, độc lập khách quan, không vì mục đích lợi nhuận. Việc phê duyệt các nhiệm vụ tư vấn, phản biện và giám định xã hội cần gắn với việc phê duyệt dự toán kinh phí và dự kiến các nguồn kinh phí thực hiện. - Các nhiệm vụ tư vấn, phản biện và giám định xã hội có sử dụng ngân sách nhà nước phải được xây dựng và thực hiện phù hợp với định mức kinh tế, kỹ thuật hiện hành, chế độ, định mức chi tiêu và khả năng cân đối của ngân sách nhà nước.'
      trang_pdf: 2
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 4
      noi_dung: 'Điều 4. Nguồn kinh phí cho các hoạt động tư vấn, phản biện và giám định xã hội 1. Chi sự nghiệp khoa học và công nghệ bố trí trong dự toán chi ngân sách nhà nước thường xuyên hàng năm của Liên hiệp Hội Việt Nam và Liên hiệp hội địa phương theo phân cấp ngân sách. 2. Chi sự nghiệp khoa học và công nghệ ngân sách nhà nước bố trí hàng năm để thực hiện nhiệm vụ tư vấn, phản biện và giám định xã hội đối với các đề án về đường lối, chủ trương, chính sách quan trọng của Đảng, các chương trình, dự án lớn, công trình quan trọng quốc gia; chương trình, dự án lớn, chiến lược, quy hoạch, kế hoạch phát triển khoa học và công nghệ, giáo dục và đào tạo, chính sách xây dựng, phát triển đội ngũ trí thức thuộc thẩm quyền quyết định, phê duyệt của Quốc hội, Chính phủ, Thủ tướng Chính phủ; các chương trình, dự án lớn, chủ trương quan trọng của các tỉnh, thành phố trực thuộc Trung ương liên quan đến khoa học và công nghệ, giáo dục và đào tạo, xây dựng đội ngũ trí thức và các nội dung khác. 3. Kinh phí thực hiện nhiệm vụ tư vấn, phản biện và giám định xã hội do các tổ chức, cá nhân đặt hàng trên cơ sở hợp đồng theo quy định của pháp luật. 4. Các nguồn kinh phí hợp pháp khác.'
      trang_pdf: 3
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 8
      noi_dung: 'Điều 8. Quy định chung về quản lý ngân sách nhà nước 1. Nhà nước bố trí dự toán chi sự nghiệp khoa học và công nghệ thuộc ngân sách nhà nước để thực hiện các nhiệm vụ tư vấn, phản biện và giám định xã hội của Liên hiệp Hội Việt Nam và Liên hiệp hội địa phương theo phân cấp ngân sách. 2. Kinh phí chi cho công tác quản lý hoạt động tư vấn, phản biện và giám định xã hội và các nhiệm vụ tư vấn, phản biện và giám định xã hội của Liên hiệp Hội Việt Nam và các hội ngành toàn quốc được bố trí trong dự toán chi ngân sách nhà nước của Liên hiệp Hội Việt Nam. Kinh phí thực hiện các nhiệm vụ tư vấn, phản biện và giám định xã hội của Liên hiệp hội địa phương được bố trí trong dự toán chi ngân sách nhà nước giao cho các Liên hiệp hội địa phương. Trường hợp Liên hiệp Hội Việt Nam ký hợp đồng với Liên hiệp hội địa phương thực hiện nhiệm vụ thì Liên hiệp Hội Việt Nam có trách nhiệm bố trí kinh phí trong dự toán chi ngân sách của mình và các nguồn kinh phí hợp pháp khác để chuyển giao cho Liên hiệp hội địa phương thực hiện. 3. Liên hiệp Hội Việt Nam và Liên hiệp hội địa phương chịu trách nhiệm quản lý, hướng dẫn các tổ chức và cá nhân sử dụng kinh phí đúng mục đích, đúng chế độ, có hiệu quả, đảm bảo quyết toán kinh phí được cấp theo các quy định hiện hành.'
      trang_pdf: 7
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 10
      khoan: 2
      noi_dung: '2. Kiểm soát chi đối với nhiệm vụ tư vấn, phản biện và giám định xã hội: - Tạm ứng kinh phí: căn cứ hợp đồng công việc được ký kết, Liên hiệp Hội Việt Nam và Liên hiệp hội địa phương rút dự toán để tạm ứng kinh phí thực hiện và cấp cho tổ chức chủ trì tối đa không quá 70% dự toán nhiệm vụ được giao trong năm thực hiện. - Thanh toán tạm ứng và thanh toán thực chi: sau khi nhiệm vụ đã hoàn thành khối lượng công việc trong năm kế hoạch, tổ chức chủ trì gửi bảng kê thanh toán và chứng từ gốc để đối chiếu. Liên hiệp Hội Việt Nam và Liên hiệp hội địa phương xác nhận khối lượng công việc đã hoàn thành và thực hiện đối chiếu kinh phí đề nghị thanh toán; gửi hồ sơ thanh toán tạm ứng và thanh toán thực chi cho Kho bạc Nhà nước nơi giao dịch. Hồ sơ thanh toán, bao gồm: giấy đề nghị thanh toán, bảng kê thanh toán, bản xác nhận khối lượng công việc đã hoàn thành.'
      trang_pdf: 8
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 12
      noi_dung: 'Điều 12. Hiệu lực thi hành Thông tư này có hiệu lực thi hành từ ngày 20/3/2015. Thông tư này thay thế Thông tư số 27/2003/TT-BTC ngày 01/4/2003 của Bộ Tài chính về việc hướng dẫn cơ chế tài chính cho hoạt động tư vấn, phản biện và giám định xã hội của Liên hiệp các Hội Khoa học và Kỹ thuật Việt Nam. Các nhiệm vụ tư vấn, phản biện có sử dụng ngân sách nhà nước đã được cấp có thẩm quyền phê duyệt trước thời điểm Thông tư này có hiệu lực thi hành thì thực hiện theo quy định hiện hành tại thời điểm phê duyệt.'
      trang_pdf: 9
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
    - dieu: 13
      noi_dung: 'Điều 13. Tổ chức thực hiện Trong quá trình thực hiện, nếu có vướng mắc, đề nghị phản ánh kịp thời về Bộ Tài chính để nghiên cứu sửa đổi, bổ sung cho phù hợp./.'
      trang_pdf: 9
      sha256_pdf: 721598f178f23b5ad395613d3c46c4834c131f402e6dc90bfbc2788248d778a8
ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #400). Hướng dẫn cơ chế tài chính cho hoạt động tư vấn, phản biện và giám định xã hội của Liên hiệp các Hội Khoa học và Kỹ thuật Việt Nam (theo Quyết định 14/2014/QĐ-TTg); không điều chỉnh trực tiếp thủ tục hải quan hay biểu thuế XNK.'
