  pham_vi: Đã đối chiếu tên, ngày ban hành (15/12/2021), ngày hiệu lực (01/02/2022) và tình trạng còn hiệu lực (được sửa đổi, bổ sung bởi Thông tư 45/2023/TT-BCT ngày 29/12/2023 có hiệu lực từ ngày 15/02/2024) trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn, datafiles.chinhphu.vn) và Công báo Chính phủ (congbao.chinhphu.vn).
