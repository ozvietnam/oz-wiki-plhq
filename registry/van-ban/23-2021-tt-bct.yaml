ghi_chu: |
  Trong bản chụp Biểu thuế XNK, Thông tư 23/2021/TT-BCT được liệt kê ở nhóm văn bản được sửa đổi/thay thế bởi Thông tư 45/2023/TT-BCT ngày 29/12/2023. Thực tế theo Thông tư 45/2023/TT-BCT (có hiệu lực từ ngày 15/02/2024), Thông tư 23/2021/TT-BCT vẫn còn hiệu lực và được sửa đổi, bổ sung một số điều và Phụ lục (nguồn A: https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=205006, https://congbao.chinhphu.vn/van-ban/thong-tu-so-45-2023-tt-bct-40975/48170.htm).
