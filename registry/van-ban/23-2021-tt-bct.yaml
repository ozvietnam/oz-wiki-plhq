  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Pham vi điều chỉnh Thông tư này quy định danh mục chủng loại, tiêu chuẩn chất lượng khoáng sản xuất khâu đối với các loại khoáng sản do Bộ Công Thương quản lý (trừ khoáng sản làm vật liệu xây dựng và than đá) theo quy định của pháp luật vê khoáng sản.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với cơ quan quản lý nhà nước và thương nhân có hoạt động liên quan đến xuất khẩu khoáng sản. "
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ ` Trong Thông tư này, những từ ngữ dưới đây được hiểu như sau: 1. Chế biến khoáng sản là quá trình áp dụng từng phương pháp riêng biệt hoặc kết hợp các phương pháp (chon tay, rửa, nghién-sang phan loại theo cỡ hạt; nung, sấy, cưa, cắt, tuyển trọng lực, tuyển từ, tuyên điện, hoá tuyển, thủy luyện;'
      trang_pdf: 1
    - dieu: 4
      noi_dung: Điều 4. Danh mục chủng loại, tiêu chuẩn chất lượng khoáng sản xuất khẩu 1. Khoáng sản xuất khẩu là khoáng sản có nguồn gốc hợp pháp, có tên trong Danh mục chủng loại va đáp ứng tiêu chuẩn chất lượng tương ứng tại Phụ lục 1 Thông tư này.
      trang_pdf: 2
    - dieu: 5
      noi_dung: 'Điều 5. Báo cáo thực hiện xuất khẩu khoáng sản 1. Nội dung báo cáo thực hiện xuất khâu khoáng sản theo Mẫu s số 01 và Mau số 02 tại Phụ lục 2 kèm theo Thông tư này. ; 2. Báo cáo xuất khâu khoáng sản thực hiện như sau:'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Trách nhiệm quản lý 1. Cục Công nghiệp (Bộ Công Thương) chịu trách nhiệm chủ trì, phối hợp với các Bộ, ngành và địa phương liên quan định kỳ tô chức kiểm tra việc chấp _ hành các quy định về xuất khẩu khoáng sản theo Thông t tư này và quy định của
      trang_pdf: 2
    - dieu: 7
      noi_dung: Điều 7. Hiệu lực thi hành 1. Thông tư này có hiệu lực từ ngày@ƒ..tháng.22.năm 2022 va thay thế Thông tư sô 41/2012/TT-BCT ngày 21 tháng 12 năm 2012 của Bộ trưởng Bộ Công Thương quy định về xuất khẩu khoáng sản, Thông tư số 12/2016/TT-BCT ngày 05 tháng 7 năm 2016 về sửa đôi một số điều của Thông tư số 41/2012/TT- BCT ngày 21 tháng 12 năm 2012 của Bộ trưởng Bộ Công Thương.
      trang_pdf: 3
    - dieu: 8
      noi_dung: Điều 8. Tổ chức thực hiện Các cơ quan quản lý nhà nước và thương nhân có hoạt động liên quan đến xuất khâu khoáng sản chịu trách nhiệm thực hiện Thông tư này. Trong quá trình thực hiện nêu có vướng mắc, tô chức, cá nhân phản ánh kịp thời bằng văn bản về Bộ Công Thương dé xem xét, xử lý./.
      trang_pdf: 3
ghi_chu: |
  Trong bản chụp Biểu thuế XNK, Thông tư 23/2021/TT-BCT được liệt kê ở nhóm văn bản được sửa đổi/thay thế bởi Thông tư 45/2023/TT-BCT ngày 29/12/2023. Thực tế theo Thông tư 45/2023/TT-BCT (có hiệu lực từ ngày 15/02/2024), Thông tư 23/2021/TT-BCT vẫn còn hiệu lực và được sửa đổi, bổ sung một số điều và Phụ lục (nguồn A: https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=205006, https://congbao.chinhphu.vn/van-ban/thong-tu-so-45-2023-tt-bct-40975/48170.htm).
