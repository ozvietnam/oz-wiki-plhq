  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/19/6.VBDI_25124.pdf, id=101373, SHA-256 7302eca0f447908774e85a98939aff29ee936be0795cf9116d4f2d3f821d6439): Thông báo số 25124/TB-CHQ ngày 18-09-2025 của Cục Hải quan (ký số 19-09-2025, trên mục lục cổng ghi ký hiệu 25124/CHQ-NVTHQ) về kết quả xác định trước mã số theo đơn đề nghị số 03-2025/TGC-XDTMS ngày 25-04-2025 đối với mặt hàng Xe vận chuyển hàng hóa trong phạm vi hẹp (nhà kho của sân gôn), loại chạy điện hiệu LEROAD, tên thương mại SHUTTLE 2 WITH CARGO BED (ELECTRIC VEHICLE), model LRGD/2 (4 bánh, động cơ điện 2 chiều AC 48V công suất 5kW, pin Lithium 48V-105Ah, vận tốc lớn nhất 25km/h, trọng lượng toàn bộ xe 630kg, tải trọng hàng hóa tối đa ở thùng hàng 390kg, 2 chỗ ngồi kể cả lái xe, kích thước xe 3290 x 1204 x 1790mm, thùng chở hàng bằng hợp kim nhôm cố định 1 bên có thể dùng tay nâng hỗ trợ xuống hàng, không có cơ cấu càng nâng thùng hàng, không đăng ký lưu hành, không tham gia giao thông, nhà sản xuất Jiaxing Leroad Special Vehicle Co., Ltd), phân loại vào nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29; có hiệu lực kể từ ngày ban hành'
