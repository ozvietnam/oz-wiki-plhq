ghi_chu: 'Xác định trước mã số mặt hàng Xe vận chuyển hàng hóa trong phạm vi hẹp chạy điện hiệu LEROAD SHUTTLE 2 WITH CARGO BED model LRGD/2 (4 bánh, AC 48V 5kW, trọng lượng xe 630kg, tải trọng thùng hàng 390kg, không có cơ cấu càng nâng thùng hàng, không tham gia giao thông) thuộc nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29.'
