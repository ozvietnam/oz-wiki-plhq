ghi_chu: >-
  Nạp theo issue #87 (PR #1, vai trò "quy chế phân loại hàng"). Đây là quy chế của ngành Hải quan về
  phân tích, phân loại hàng hoá — bên cạnh nhánh "phân loại hàng hoá" của Bộ Tài chính (TT
  49/2010/TT-BTC rồi TT 14/2015/TT-BTC). Điều 1 quy chế định nghĩa PTPL; Điều 4 quy định đơn
  vị PTPL là Trung tâm Phân tích, phân loại hàng hoá XNK và các chi nhánh.
  ĐÃ HẾT HIỆU LỰC từ 09-12-2013. Văn bản thay thế là Quyết định 4023/QĐ-TCHQ ngày
  09-12-2013 của Tổng cục Hải quan — CHƯA có trong sổ; cần nạp để chốt quan hệ chiều đi. Sau đó
  còn 2131/QĐ-TCHQ (31-07-2015) → 2999/QĐ-TCHQ (06-09-2017) → 2166/QĐ-TCHQ (04-08-2021) →
  2169/QĐ-CHQ (31-12-2025, hiện hành từ 01-02-2026). Điều 17.1 TT 14/2015/TT-BTC là căn cứ cho
  quy chế phân tích để phân loại của ngành Hải quan.
