  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Nghị định này quy định các hành vi vi phạm hành chính, hình thức, mức xử phạt, biện pháp khắc phục hậu quả đối với từng hành vi vi phạm hành chính, thẩm quyền lập biên bản, thẩm quyền xử phạt, mức phạt tiền cụ thể theo từng chức danh đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình. 2. Các hành vi vi phạm hành chính trong các lĩnh vực khác trực tiếp liên quan đến lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình không được quy định tại Nghị định này thì áp dụng quy định tại các Nghị định khác của Chính phủ về xử phạt vi phạm hành chính trong lĩnh vực quản lý nhà nước có liên quan để xử phạt.'
    - dieu: 2
      noi_dung: '1. Cá nhân, tổ chức Việt Nam; cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình trong phạm vi lãnh thổ, vùng nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế và thềm lục địa của nước Cộng hòa xã hội chủ nghĩa Việt Nam; trên tàu bay mang quốc tịch Việt Nam, tàu biển mang cờ quốc tịch Việt Nam. 2. Công dân, tổ chức Việt Nam thực hiện hành vi vi phạm quy định tại Nghị định này ở ngoài lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam có thể bị xử phạt vi phạm hành chính theo quy định của Nghị định này. 3. Cơ quan, người có thẩm quyền xử phạt vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình và cá nhân, tổ chức có liên quan.'
    - dieu: 4
      khoan: 2
      noi_dung: '2. Số lợi bất hợp pháp có được do thực hiện hành vi vi phạm hành chính theo quy định tại Nghị định này là vật, tiền, giấy tờ có giá hoặc tài sản khác có được từ vi phạm hành chính mà cá nhân, tổ chức đó đã thực hiện và được xác định như sau: a) Số lợi bất hợp pháp thu được bằng tiền là toàn bộ số tiền tổ chức, cá nhân thu được từ hành vi vi phạm hành chính và được tính bằng số tiền thu được từ việc chuyển nhượng, tiêu thụ hàng hóa, cung cấp dịch vụ vi phạm sau khi đã trừ chi phí trực tiếp cấu thành hàng hóa, dịch vụ căn cứ vào hồ sơ, chứng từ chứng minh tính hợp pháp, hợp lệ của các chi phí đó do cá nhân, tổ chức vi phạm cung cấp; b) Số lợi bất hợp pháp thu được bằng giấy tờ có giá là toàn bộ giấy tờ có giá mà tổ chức, cá nhân vi phạm thu được từ hành vi vi phạm hành chính. Trường hợp giấy tờ có giá đã được chuyển nhượng thì số lợi bất hợp pháp được xác định bằng số tiền thực tế thu được tại thời điểm chuyển nhượng; trường hợp giấy tờ có giá đã bị tẩu tán, tiêu hủy thì số lợi bất hợp pháp được xác định theo giá trị sổ sách của tổ chức phát hành giấy tờ có giá tại thời điểm tẩu tán, tiêu hủy; c) Số lợi bất hợp pháp là vật, tài sản khác mà tổ chức, cá nhân vi phạm thu được từ hành vi vi phạm hành chính là các tài sản khác theo quy định của Bộ luật Dân sự. Trường hợp vật, tài sản khác đã được chuyển nhượng, tiêu thụ hoặc tiêu hủy thì số lợi bất hợp pháp được xác định bằng số tiền tương đương giá trị thị trường của tài sản cùng loại hoặc xác định theo giá trị sổ sách của tài sản (nếu không có giá trị thị trường) hoặc xác định bằng giá trị tiền của tài sản ghi trên tờ khai xuất khẩu, tờ khai nhập khẩu (nếu là hàng hóa xuất khẩu, nhập khẩu) của tổ chức, cá nhân vi phạm sau khi trừ chi phí trực tiếp cấu thành hàng hóa căn cứ vào hồ sơ, chứng từ chứng minh tính hợp pháp, hợp lệ của các chi phí đó.'
    - dieu: 5
      noi_dung: '1. Mức phạt tiền tối đa trong lĩnh vực phòng, chống bạo lực gia đình đối với cá nhân là 30.000.000 đồng, đối với tổ chức là 60.000.000 đồng; mức phạt tiền tối đa trong lĩnh vực an ninh, trật tự, an toàn xã hội đối với cá nhân là 40.000.000 đồng, đối với tổ chức là 80.000.000 đồng; mức phạt tiền tối đa trong lĩnh vực phòng, chống tệ nạn xã hội đối với cá nhân là 75.000.000 đồng, đối với tổ chức là 150.000.000 đồng. 2. Mức phạt tiền quy định tại Chương II Nghị định này là mức phạt được áp dụng đối với hành vi vi phạm hành chính của cá nhân. Đối với tổ chức có cùng hành vi vi phạm, mức phạt tiền gấp 02 lần mức phạt tiền đối với cá nhân. 3. Tổ chức quy định tại các khoản 1 và 2 Điều này bao gồm: a) Tổ chức kinh tế và các đơn vị phụ thuộc được thành lập theo quy định của pháp luật; b) Mặt trận Tổ quốc Việt Nam, tổ chức chính trị - xã hội, tổ chức chính trị xã hội - nghề nghiệp, tổ chức xã hội, tổ chức xã hội - nghề nghiệp, quỹ xã hội, quỹ từ thiện, tổ chức phi chính phủ và tổ chức trực thuộc các cơ quan, tổ chức này; c) Cơ quan nhà nước, đơn vị vũ trang nhân dân, cơ quan thuộc hệ thống tổ chức Đảng Cộng sản Việt Nam (trừ các cơ quan, đơn vị có hành vi vi phạm mà hành vi đó thuộc nhiệm vụ quản lý nhà nước được giao); d) Đơn vị sự nghiệp; đ) Tổ chức tôn giáo, tổ chức tôn giáo trực thuộc, tổ chức nước ngoài; e) Tổ chức khác được thành lập theo quy định của pháp luật. 4. Hộ gia đình, hộ kinh doanh đăng ký kinh doanh theo quy định của pháp luật vi phạm các quy định của Nghị định này bị xử phạt như đối với cá nhân.'
    - dieu: 6
      noi_dung: '1. Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình là 01 năm. 2. Thời điểm để tính thời hiệu xử phạt vi phạm hành chính quy định tại khoản 1 Điều này thực hiện theo quy định tại Điều 6 Luật Xử lý vi phạm hành chính.'
    - dieu: 13
      khoan: 5
      noi_dung: '5. Hành vi chế tạo, sản xuất, mua, bán, nhập khẩu, xuất khẩu, tàng trữ, vận chuyển trái phép pháo hoa, thuốc pháo có mức phạt tiền như sau: a) Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với trường hợp có số lượng dưới 05 kg pháo hoa hoặc dưới 0,5 kg thuốc pháo; b) Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với trường hợp có số lượng từ 05 kg đến dưới 10 kg pháo hoa hoặc từ 0,5 kg đến dưới 01 kg thuốc pháo; c) Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với trường hợp có số lượng từ 10 kg đến dưới 20 kg pháo hoa hoặc từ 01 kg đến dưới 02 kg thuốc pháo; d) Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với trường hợp có số lượng từ 20 kg đến dưới 40 kg pháo hoa hoặc từ 02 kg đến dưới 05 kg thuốc pháo; đ) Phạt tiền từ 30.000.000 đồng đến 35.000.000 đồng đối với trường hợp có số lượng từ 40 kg đến dưới 50 kg pháo hoa hoặc từ 05 kg đến dưới 10 kg thuốc pháo; e) Phạt tiền từ 35.000.000 đồng đến 40.000.000 đồng đối với trường hợp có số lượng từ 50 kg pháo hoa trở lên hoặc từ 10 kg thuốc pháo trở lên.'
    - dieu: 14
      noi_dung: '1. Phạt tiền từ 1.000.000 đồng đến 2.000.000 đồng đối với một trong những hành vi sau đây: a) Không thông báo cho cơ quan Công an nơi gần nhất việc mất, thất lạc dao có tính sát thương cao trong quá trình sản xuất, kinh doanh, xuất khẩu, nhập khẩu, vận chuyển; b) Mang dao có tính sát thương cao vào nơi công cộng mà không bọc hoặc cất giữ, bảo quản chặt chẽ, an toàn; c) Sử dụng dao có tính sát thương cao trong lao động, sản xuất, sinh hoạt nhưng không thực hiện các biện pháp quản lý, bảo quản để người khác lợi dụng sử dụng vào mục đích trái pháp luật. 2. Phạt tiền từ 2.000.000 đồng đến 4.000.000 đồng đối với một trong những hành vi sau đây: a) Không quản lý chặt chẽ, bảo đảm an toàn, phòng cháy, chữa cháy, bảo vệ môi trường trong quá trình sản xuất dao có tính sát thương cao; không bọc kín, đóng gói hoặc đóng thùng sản phẩm dao có tính sát thương cao; b) Không thực hiện các biện pháp bảo đảm an toàn trong quá trình kinh doanh, xuất khẩu, nhập khẩu, vận chuyển dao có tính sát thương cao; c) Sản xuất, kinh doanh, xuất khẩu, nhập khẩu dao có tính sát thương cao không rõ nguồn gốc xuất xứ, không đóng tên cơ sở sản xuất hoặc nhãn hiệu, ký hiệu trên sản phẩm; d) Không cung cấp thông tin về số lượng, chủng loại sản phẩm, nhãn hiệu, tên cơ sở sản xuất dao có tính sát thương cao khi có yêu cầu của cơ quan Công an có thẩm quyền theo quy định của pháp luật. 3. Biện pháp khắc phục hậu quả: Buộc thực hiện các biện pháp bảo đảm an toàn trong quá trình sản xuất, kinh doanh, xuất khẩu, nhập khẩu, vận chuyển dao có tính sát thương cao đối với hành vi vi phạm quy định tại điểm a và b khoản 2 Điều này.'
    - dieu: 58
      noi_dung: '1. Công chức Hải quan đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 2.000.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; đến 3.750.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực phòng, chống tệ nạn xã hội; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 2. Đội trưởng Hải quan cửa khẩu/ngoài cửa khẩu, Đội trưởng Đội Phúc tập và Kiểm tra sau thông quan, Đội trưởng Đội Thông quan, Đội trưởng Đội Kiểm soát hải quan thuộc Chi cục Hải quan khu vực; Đội trưởng Đội kiểm soát chống buôn lậu thuộc Chi cục Điều tra chống buôn lậu; Đội trưởng Đội Kiểm tra sau thông quan khu vực thuộc Chi cục Kiểm tra sau thông quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 12.000.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; đến 22.500.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực phòng, chống tệ nạn xã hội; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này; d) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 3. Chi cục trưởng Chi cục Điều tra chống buôn lậu, Chi cục trưởng Chi cục Kiểm tra sau thông quan, Chi cục trưởng Chi cục Hải quan khu vực có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 20.000.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; đến 37.500.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực phòng, chống tệ nạn xã hội; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 4. Cục trưởng Cục Hải quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 40.000.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; đến 75.000.000 đồng đối với hành vi vi phạm hành chính trong lĩnh vực phòng, chống tệ nạn xã hội; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.'
    - dieu: 64
      khoan: 6
      noi_dung: '6. Người có thẩm quyền xử phạt của Hải quan có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại các điểm c và đ khoản 3, điểm c khoản 4 Điều 8; các Điều 12, 13, 14; điểm n khoản 3 Điều 15; các Điều 21, 26 và 30 Nghị định này theo thẩm quyền quy định tại Điều 58 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.'
    - dieu: 69
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 15 tháng 12 năm 2025, trừ trường hợp quy định tại khoản 2 Điều này.'
    - dieu: 69
      khoan: 2
      noi_dung: '2. Quy định tại Điều 14 Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026.'
    - dieu: 70
      noi_dung: '1. Đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình; hàng không dân dụng xảy ra và kết thúc trước thời điểm Nghị định này có hiệu lực mà bị phát hiện hoặc đang xem xét, giải quyết khi Nghị định này đã có hiệu lực thì áp dụng Nghị định của Chính phủ về xử phạt vi phạm hành chính và các văn bản quy phạm pháp luật có liên quan có hiệu lực tại thời điểm thực hiện hành vi vi phạm để xử lý. 2. Đối với hành vi vi phạm hành chính trong lĩnh vực an ninh, trật tự, an toàn xã hội; phòng, chống tệ nạn xã hội; phòng, chống bạo lực gia đình; hàng không dân dụng xảy ra trước thời điểm Nghị định này có hiệu lực nhưng vẫn đang diễn ra khi Nghị định này đã có hiệu lực thì áp dụng quy định của Nghị định này để xử lý. 3. Đối với quyết định xử phạt vi phạm hành chính đã được ban hành hoặc đã được thi hành xong trước thời điểm Nghị định này có hiệu lực thi hành, mà cá nhân, tổ chức bị xử phạt vi phạm hành chính còn khiếu nại thì áp dụng quy định của Luật Xử lý vi phạm hành chính, Nghị định của Chính phủ về xử phạt vi phạm hành chính và các văn bản quy phạm pháp luật có liên quan có hiệu lực tại thời điểm ban hành quyết định xử phạt vi phạm hành chính để xử lý.'
    - dieu: 71
      noi_dung: '1. Bộ trưởng Bộ Công an chịu trách nhiệm hướng dẫn, kiểm tra, đôn đốc và tổ chức thực hiện Nghị định này. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
