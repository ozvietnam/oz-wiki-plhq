xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=216804) và toàn văn PDF ký số (07-bnnmt.pdf, 24 điều, Thứ trưởng Hoàng Trung ký): ban hành 23-01-2026, có hiệu lực từ 23-01-2026 (khoản 1 Điều 23); bãi bỏ Thông tư 11/2022/TT-BNNPTNT (khoản 2 Điều 23); sửa đổi, bổ sung Thông tư 43/2018/TT-BNNPTNT (Điều 19), 21/2015/TT-BNNPTNT (Điều 20), 12/2025/TT-BNNMT (Điều 21) và 05/2015/TT-BNNPTNT (Điều 22)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định chi tiết: a) Khoản 5 Điều 67 Luật Bảo vệ và kiểm dịch thực vật, được sửa đổi, bổ sung bởi khoản 6 Điều 2 của Luật sửa đổi, bổ sung một số điều của 15 Luật trong lĩnh vực nông nghiệp và môi trường (sau đây gọi là Luật Bảo vệ và kiểm dịch thực vật);'
      trang_pdf: 1
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với cơ quan nhà nước, tổ chức, cá nhân có hoạt động liên quan đến nội dung quy định tại Điều 1 Thông tư này. Chương II QUY ĐỊNH CHI TIẾT KHOẢN 5 ĐIỀU 67 CỦA LUẬT BẢO VỆ VÀ KIỂM DỊCH THỰC VẬT
      trang_pdf: 2
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 3
      noi_dung: 'Điều 3. Hồ sơ, trình tự, thủ tục và thẩm quyền cấp Giấy phép nhập khẩu thuốc bảo vệ thực vật 1. Hồ sơ gồm: a) Trường hợp nhập khẩu thuốc bảo vệ thực vật chưa có trong Danh mục thuốc bảo vệ thực vật được phép sử dụng tại Việt Nam để tạm nhập, tái xuất hoặc nhập khẩu để sản xuất tại Việt Nam nhằm mục đích xuất khẩu theo hợp đồng đã ký với nước ngoài: Đơn đề nghị cấp Giấy phép nhập khẩu thuốc bảo vệ thực vật theo Mẫu số 03 Phụ lục II ban hành kèm'
      trang_pdf: 2
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 7
      noi_dung: 'Điều 7. Hồ sơ, trình tự, thủ tục tự công bố lưu hành giống cây trồng 1. Hồ sơ tự công bố lưu hành giống cây trồng gồm: a) Bản tự công bố lưu hành giống cây trồng theo Mẫu số 19 Phụ lục II ban hành kèm theo Thông tư này;'
      trang_pdf: 8
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 9
      noi_dung: 'Điều 9. Ghi nhãn và quảng cáo giống cây trồng 1. Ghi nhãn giống cây trồng thực hiện theo quy định của pháp luật về nhãn hàng hóa và bao gồm các nội dung sau: a) Tên giống cây trồng; b) Cấp giống theo quy định tại tiêu chuẩn quốc gia.'
      trang_pdf: 11
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 12
      noi_dung: Điều 12. Phân loại phân bón 1. Nhóm phân bón hóa học (còn gọi là phân bón vô cơ) gồm các loại phân bón được sản xuất từ nguyên liệu chính là các chất vô cơ hoặc hữu cơ tổng hợp, được xử lý qua quá trình hóa học hoặc chế biến khoáng sản và tùy theo thành phần, hàm lượng hoặc chức năng của chỉ tiêu chất lượng chính đối với cây trồng hoặc liên kết hóa học của các nguyên tố dinh dưỡng trong phân bón được phân loại chi tiết trong quy chuẩn kỹ thuật
      trang_pdf: 14
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 14
      noi_dung: 'Điều 14. Hồ sơ, trình tự, thủ tục và thẩm quyền cấp lại Quyết định công nhận phân bón lưu hành tại Việt Nam 1. Hồ sơ gồm: a) Đơn đề nghị cấp lại Quyết định công nhận theo Mẫu số 30 Phụ lục II ban hành kèm theo Thông tư này; b) Văn bản của cơ quan quản lý nhà nước có thẩm quyền về sở hữu trí tuệ hoặc của tòa án về việc vi phạm nhãn hiệu hàng hóa (trường hợp thay đổi tên phân bón);'
      trang_pdf: 16
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 17
      noi_dung: 'Điều 17. Hồ sơ, trình tự, thủ tục và thẩm quyền cấp Giấy phép nhập khẩu phân bón 1. Hồ sơ gồm: a) Đơn đăng ký nhập khẩu phân bón theo Mẫu số 33 Phụ lục II ban hành kèm theo Thông tư này; b) Tờ khai kỹ thuật theo Mẫu số 34 Phụ lục II ban hành kèm theo Thông tư này; c) Văn bản của nhà sản xuất về chỉ tiêu chất lượng, hướng dẫn sử dụng,'
      trang_pdf: 17
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 19
      noi_dung: Điều 19. Sửa đổi, bổ sung một số điều của Thông tư số 43/2018/TTBNNPTNT ngày 28/12/2018 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định một số nội dung về xuất khẩu, nhập khẩu giống cây trồng, giống vật nuôi, nguồn gen cây trồng;
      trang_pdf: 19
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
    - dieu: 23
      noi_dung: Điều 23. Hiệu lực thi hành 1. Thông tư này có hiệu lực kể từ ngày 23 tháng 01 năm 2026. 2. Thông tư số 11/2022/TT-BNNPTNT ngày 20 tháng 9 năm 2022 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số quy định về thủ tục hành chính trong lĩnh vực bảo vệ và kiểm dịch thực vật hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 22
      sha256_pdf: a0907b7a011a62eaed8e2ff4c4351a9e9fa669063eeeda4459116385fb8d392b
ghi_chu: Trinh sát WebSearch trạm BNNMT đêm 30/10 (bổ sung đợt 29/10). Lõi KDTV — luật KDTV mới (170/2024/QH15) thay Luật BVTT 41/2013, TT này là văn bản chi tiết kèm KDTV XNK. Ưu tiên nạp toàn văn + bóc quan hệ với chuỗi VBHN 06→19→99.
