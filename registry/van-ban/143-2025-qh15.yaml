xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=216524, luat143-2025.pdf 76 trang có lớp chữ, Chủ tịch Quốc hội Trần Thanh Mẫn ký thông qua ngày 11-12-2025) và CSDLQG về VBPL (vbpl.vn ItemID=187601): Điều 51 quy định có hiệu lực từ 01-03-2026 (riêng Điều 7 và Phụ lục IV ngành, nghề đầu tư kinh doanh có điều kiện có hiệu lực từ 01-07-2026; khoản 3 Điều 50 có hiệu lực từ 01-01-2026), thay thế Luật Đầu tư số 61/2020/QH14 (chưa ghi vào quan_he vì 61/2020/QH14 chưa có trong sổ); Điều 50 khoản 1 sửa Luật Dược 105/2016/QH13; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: ong-w15-nap-gap@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hoạt động đầu tư kinh doanh tại Việt Nam và hoạt động đầu tư kinh doanh từ Việt Nam ra nước ngoài.
      trang_pdf: 1
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với nhà đầu tư và cơ quan, tổ chức, cá nhân liên quan đến hoạt động đầu tư kinh doanh.
      trang_pdf: 1
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Chấp thuận chủ trương đầu tư là việc cơ quan nhà nước có thẩm quyền chấp thuận về mục tiêu, địa điểm, quy mô, tiến độ, thời hạn thực hiện dự án; nhà đầu tư hoặc hình thức lựa chọn nhà đầu tư và cơ chế, chính sách đặc biệt (nếu có) để thực hiện dự án đầu tư.'
      trang_pdf: 1
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 9
      noi_dung: Điều 9. Bảo đảm quyền sở hữu tài sản 1. Tài sản hợp pháp của nhà đầu tư không bị quốc hữu hóa hoặc bị tịch thu bằng biện pháp hành chính. 2. Trường hợp Nhà nước trưng mua, trưng dụng tài sản vì lý do quốc phòng, an ninh hoặc vì lợi ích quốc gia, tình trạng khẩn cấp, phòng, chống thiên tai thì nhà đầu tư được thanh toán, bồi thường theo quy định của pháp luật về trưng mua, trưng dụng tài sản và quy định của pháp luật khác có liên quan.
      trang_pdf: 8
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 14
      noi_dung: 'Điều 14. Ưu đãi đầu tư và hỗ trợ đầu tư 1. Đối tượng được hưởng ưu đãi đầu tư bao gồm: a) Dự án đầu tư thuộc ngành, nghề ưu đãi đầu tư quy định tại Điều 15 của Luật này; b) Dự án đầu tư tại địa bàn ưu đãi đầu tư quy định tại Điều 15 của Luật này;'
      trang_pdf: 10
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 20
      noi_dung: Điều 20. Thực hiện hoạt động đầu tư của tổ chức kinh tế có vốn đầu tư nước ngoài 1. Tổ chức kinh tế phải đáp ứng điều kiện và thực hiện thủ tục đầu tư theo quy định đối với nhà đầu tư nước ngoài khi đầu tư góp vốn, mua cổ phần, mua phần vốn góp của tổ chức kinh tế khác;
      trang_pdf: 15
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 25
      noi_dung: Điều 25. Thẩm quyền chấp thuận chủ trương đầu tư 1. Quốc hội chấp thuận chủ trương đầu tư đối với dự án đầu tư quy định tại khoản 20 Điều 24 của Luật này.
      trang_pdf: 19
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 30
      noi_dung: 'Điều 30. Bảo đảm thực hiện dự án đầu tư 1. Nhà đầu tư phải ký quỹ hoặc phải có bảo lãnh ngân hàng về nghĩa vụ ký quỹ để bảo đảm thực hiện dự án đầu tư có đề nghị Nhà nước giao đất, cho thuê đất, cho phép chuyển mục đích sử dụng đất, trừ các trường hợp sau đây: a) Nhà đầu tư trúng đấu giá quyền sử dụng đất; b) Nhà đầu tư trúng đấu thầu thực hiện dự án đầu tư có sử dụng đất;'
      trang_pdf: 23
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 35
      noi_dung: Điều 35. Ngừng hoạt động của dự án đầu tư 1. Nhà đầu tư ngừng hoạt động của dự án đầu tư phải thông báo bằng văn bản cho cơ quan đăng ký đầu tư. Trường hợp ngừng hoạt động của dự án đầu tư vì lý do bất khả kháng thì nhà đầu tư được Nhà nước miễn tiền thuê đất, giảm tiền sử dụng đất trong thời gian ngừng hoạt động để khắc phục hậu quả do bất khả kháng gây ra.
      trang_pdf: 27
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 41
      noi_dung: 'Điều 41. Ngành, nghề đầu tư ra nước ngoài có điều kiện 1. Ngành, nghề đầu tư ra nước ngoài có điều kiện bao gồm: a) Ngân hàng; b) Bảo hiểm; c) Chứng khoán; d) Báo chí, phát thanh, truyền hình; đ) Kinh doanh bất động sản.'
      trang_pdf: 30
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 46
      noi_dung: 'Điều 46. Hệ thống thông tin quốc gia về đầu tư 1. Hệ thống thông tin quốc gia về đầu tư bao gồm: a) Hệ thống thông tin quốc gia về đầu tư trong nước; b) Hệ thống thông tin quốc gia về đầu tư nước ngoài vào Việt Nam; c) Hệ thống thông tin quốc gia về đầu tư của Việt Nam ra nước ngoài; d) Hệ thống thông tin quốc gia về xúc tiến đầu tư; đ) Hệ thống thông tin quốc gia về khu công nghiệp, khu kinh tế;'
      trang_pdf: 35
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
    - dieu: 52
      noi_dung: Điều 52. Điều khoản chuyển tiếp 1. Nhà đầu tư đã được cấp Giấy phép đầu tư, Giấy chứng nhận ưu đãi đầu tư, Giấy chứng nhận đầu tư, Giấy chứng nhận đăng ký đầu tư, văn bản quyết định chủ trương đầu tư, chấp thuận chủ trương đầu tư trước ngày Luật này có hiệu lực thi hành được thực hiện dự án đầu tư theo Giấy phép đầu tư, Giấy chứng nhận ưu
      trang_pdf: 39
      sha256_pdf: 567993cfb60108a6d21b4dd102cfbad156db78953b6753a07ccf4e202964a6cb
ghi_chu: Luật Đầu tư năm 2025 (thông qua 11-12-2025, hiệu lực chính từ 01-03-2026; Điều 7 và Phụ lục IV ngành nghề kinh doanh có điều kiện từ 01-07-2026). Có hiệu lực đồng bộ với Luật Dược hợp nhất 76-VBHN/VPQH và quy định các ngành, nghề kinh doanh có điều kiện liên quan đến xuất nhập khẩu, dược phẩm, hóa chất, thương mại quốc tế.
