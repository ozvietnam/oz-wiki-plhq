  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/3/VB_7306.pdf, id=102533, SHA-256 714a91b57a47d7fdf6416e2af17e1a1b2a1dd93b034c52695299b28aa522e9c5): Thông báo số 7306/TB-CHQ đề ngày 29-01-2026 của Cục Hải quan (ký số 30-01-2026, trên mục lục cổng ghi ngày 30-01-2026 và ký hiệu 7306/CHQ-NVTHQ) về kết quả xác định trước mã số theo Đơn đề nghị số 325/NVL/SC/2025 của Công ty TNHH Nestlé Việt Nam đối với mặt hàng Nguyên liệu thực phẩm: Viên nén trà xanh Dolce Gusto - Sbux Matcha Latte 12Cap 3x148.2g XX, ký mã hiệu Sbux Matcha Latte 12Cap 3x148.2g XX (quy cách 6 viên trà và 6 viên sữa/hộp, 3 hộp/thùng; tỷ lệ trong thành phẩm 24,7g gồm viên nén sữa 16,1g chiếm 65,18% [sữa bột nguyên kem 47,97%, đường 16,11%, dầu triglycerid 1,1%] và viên nén matcha 8,6g chiếm 34,82% [đường 25,63%, bột trà xanh Matcha 4,74%, sữa bột nguyên kem 4,01%, dầu triglycerid 0,45%]; trạng thái viên nén dạng bột bên trong, dùng để pha trà, nhà sản xuất Công ty TNHH Nestlé Việt Nam), phân loại vào nhóm 21.01, phân nhóm 2101.20, mã số 2101.20.30; có hiệu lực từ ngày ký'
