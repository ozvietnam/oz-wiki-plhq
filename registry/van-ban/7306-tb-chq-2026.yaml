ghi_chu: 'Xác định trước mã số mặt hàng Viên nén trà xanh Dolce Gusto - Sbux Matcha Latte 12Cap 3x148.2g XX (quy cách 6 viên trà matcha và 6 viên sữa/hộp; thành phẩm gồm viên nén sữa 65,18% và viên nén matcha 34,82% chứa bột trà xanh Matcha, sữa bột nguyên kem, đường, dầu triglycerid; dùng để pha trà) thuộc nhóm 21.01, phân nhóm 2101.20, mã số 2101.20.30. Văn bản đề ngày 29/01/2026, ký số ngày 30/01/2026.'
