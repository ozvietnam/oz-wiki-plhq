xac_minh:
  muc: NGUON_B
  pham_vi: 'Số hiệu 2538/QĐ-TCHQ, ngày ban hành 01-11-2024, cơ quan ban hành Tổng cục Hải quan, đối chiếu qua nguồn bậc B (thuvienphapluat.vn) và bản PDF đăng lại trên cổng VASEP (QD 2538 TCHQ.pdf, 3.420.594 byte): quy định quy trình thủ tục hải quan đối với hàng hóa XNK, hàng vận chuyển chịu sự giám sát hải quan và hàng gửi qua dịch vụ chuyển phát nhanh khi hệ thống điện tử của hải quan gặp sự cố (liên kết quy trình tại Quyết định 1966/QĐ-TCHQ ngày 10-07-2015). Đã rà soát ngày 18-11-2026 trên Cổng Hải quan (customs.gov.vn — OZV-1421), Hệ thống văn bản Chính phủ (vanban.chinhphu.vn — classid=1,2), Công báo (congbao.chinhphu.vn) và Cổng Bộ Tài chính (mof.gov.vn): đều không đăng tải bản gốc bậc A của quyết định quy trình nội bộ này. Giữ NGUON_B.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  chan:
    ma: THIEU_PDF_A
    ngay: '2026-11-18'
    viec_tiep: 'Quyết định quy trình nghiệp vụ nội bộ ngành hải quan (áp dụng khi hệ thống điện tử gặp sự cố, không đăng Công báo); đã quét customs.gov.vn (OZV-1421), vanban.chinhphu.vn (classid=1,2), congbao.chinhphu.vn và mof.gov.vn đều không có bản gốc bậc A. Chờ Cục Hải quan công bố bản gốc trên customs.gov.vn.'
ghi_chu: 'HIỆN HÀNH của sổ tay quy trình thủ tục hải quan TCHQ (gia đình sổ tay hải quan — rà 30/10).'
