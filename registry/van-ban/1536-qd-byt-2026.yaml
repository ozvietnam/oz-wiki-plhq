  pham_vi: 'đối chiếu thông tin ký ban hành của Thứ trưởng Bộ Y tế Nguyễn Tri Thức ngày 28-05-2026 (có hiệu lực từ ngày ký 28-05-2026) cùng toàn văn các văn bản QPPL gốc về quản lý mỹ phẩm và CGMP-ASEAN trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=216427 cho Thông tư 47/2025/TT-BYT ngày 30-12-2025, docid=219432 và 18-vbhn-byt.signed.pdf cho VBHN 18/VBHN-QĐ-BYT ngày 10-09-2026) và CSDL Quốc gia về VBPL (vbpl.vn ItemID=15266 cho Quyết định 24/2006/QĐ-BYT): sửa đổi, bổ sung một số nội dung công bố thủ tục hành chính trong lĩnh vực Mỹ phẩm tại Quyết định 7866/QĐ-BYT ngày 28-12-2018 (đồng bộ việc bãi bỏ thời hạn 02 năm của GCN CGMP-ASEAN và Mẫu số 01/CGMP-MP theo khoản 2 Điều 2 Thông tư 47/2025/TT-BYT từ 15-02-2026); đính chính trích yếu nguyên văn (không phải văn bản danh mục hàng hóa kèm mã HS); đang còn hiệu lực'
