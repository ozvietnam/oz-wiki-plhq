    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định Danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc lĩnh vực công nghệ thông tin và viễn thông thuộc trách nhiệm quản lý của Bộ Khoa học và Công nghệ (sau đây gọi tắt là Danh mục sản phẩm, hàng hóa nhóm 2); nguyên tắc quản lý sản phẩm, hàng hóa nhóm 2; quy định một số trường hợp ngưng hiệu lực, chưa bắt buộc áp dụng một phần/toàn bộ của một số quy chuẩn kỹ thuật.
      trang_pdf: 2
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với: 1. Tổ chức, cá nhân có hoạt động sản xuất, kinh doanh sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa nhóm 2 tại Việt Nam. 2. Tổ chức, cá nhân có hoạt động liên quan đến quản lý chất lượng sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa nhóm 2 tại Việt Nam.'
      trang_pdf: 2
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 3
      noi_dung: 'Điều 3. Danh mục sản phẩm, hàng hóa nhóm 2 Danh mục sản phẩm, hàng hóa nhóm 2 và biện pháp quản lý được quy định như sau: 1. Danh mục sản phẩm, hàng hóa lĩnh vực công nghệ thông tin và viễn thông bắt buộc phải chứng nhận hợp quy và công bố hợp quy được quy định tại Phụ lục I ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 4
      noi_dung: Điều 4. Nguyên tắc quản lý sản phẩm, hàng hóa nhóm 2 1. Việc quản lý chất lượng sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa nhóm 2 được thực hiện theo quy định của Bộ Khoa học và Công nghệ về chứng
      trang_pdf: 2
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 5
      noi_dung: Điều 5. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 31 tháng 12 năm 2025. 2. Thông tư số 02/2024/TT-BTTTT ngày 29 tháng 3 năm 2024 của Bộ trưởng Bộ Thông tin và Truyền thông quy định Danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý của Bộ Thông tin và Truyền thông hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 3
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 6
      noi_dung: Điều 6. Điều khoản chuyển tiếp Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy đã được cấp cho sản phẩm, hàng hóa thuộc phạm vi điều chỉnh Thông tư này đến trước ngày Thông tư này có hiệu lực thi hành vẫn còn giá trị sử dụng cho đến hết thời hạn ghi trong Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy.
      trang_pdf: 3
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
    - dieu: 7
      noi_dung: Điều 7. Tổ chức thực hiện 1. Chánh Văn phòng, Chủ tịch Ủy ban Tiêu chuẩn Đo lường Chất lượng Quốc gia, Thủ trưởng các cơ quan, đơn vị thuộc Bộ Khoa học và Công nghệ và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. 2. Trong quá trình áp dụng Thông tư này, các tổ chức, cá nhân có trách nhiệm phản ánh kịp thời những vấn đề vướng mắc và thực hiện theo hướng dẫn của Bộ Khoa học và Công nghệ./. BỘ TRƯỞNG Nguyễn Mạnh Hùng
      trang_pdf: 4
      sha256_pdf: 45126def4da6e0a9db26f9d080d13a222e3737cebd0a723b3e4bd779afbad5ee
