xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=180609, Bộ trưởng Nguyễn Quân ký) và toàn văn PDF ký số đính kèm (11-tt-bkhcn.signed.pdf, 24 trang): số hiệu 11/2015/TT-BKHCN, ban hành ngày 26-06-2015, có hiệu lực thi hành từ ngày 11-08-2015 (Điều 31, thay thế Thông tư 37/2011/TT-BKHCN); đang còn hiệu lực, quy định chi tiết và hướng dẫn thi hành một số điều của Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (được sửa đổi, bổ sung một số điều bởi Thông tư 06/2024/TT-BKHCN ngày 30-09-2024, hợp nhất tại 04/VBHN-BKHCN ngày 15-11-2024, và sửa đổi, bổ sung tiếp bởi Thông tư 66/2026/TT-BKHCN ngày 31-10-2026).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Thông tư này quy định chỉ tiết và hướng dẫn thi hành một số điều của Nghị định số 99/2013/NĐ-CP ngày 29/8/2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (sau đây gọi tat là Nghị định 99/2013/NĐ-CP). 2. Dối tượng áp dụng: a) Tổ chức, cá nhân có hành vi vi phạm hành chính trong lĩnh vực sở hữu công nghiệp; b) Tổ chức, cá nhân có thẩm quyền xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp;'
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng bị xử phạt vi phạm hành chính 1. Cá nhân có hành vi vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, gồm: a) Công dân Việt Nam hoặc người nước ngoài; b) Hộ kinh doanh được thành lập và hoạt động theo quy định của pháp luật đăng ký kinh doanh. 2. Tổ chức có hành vi vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, gồm: l a) Đơn vị sự nghiệp công lập, tô chức chính trị, tổ chức chính trị - xã hội,'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Hình thức xử phạt bỗ sưng Tịch thu tang vật, phương tiện vi phạm hành chính quy định tại Điểm a Khoản 2 Điều 3 và Điểm a Khoản 12 Điều 12 Nghị định 99/2013/NĐ-CP được áp dụng đổi với vi phạm do lỗi cỗ ý và có một trong các căn cứ sau đây: 1, Khi thấy cần thiết để đảm bảo tang vật, phương tiện vi phạm không bị tiêu hủy, tau tan, thay đổi hiện trạng hoặc ngăn ngừa khả năng dẫn đến hành vi vi phạm tiếp theo.'
      trang_pdf: 2
    - dieu: 8
      noi_dung: 'Điều 8. Hành vi vi phạm quy định về đại diện sở hữu công nghiệp quy định tại Điều 7 Nghị định 99/2013/NĐ-CP 1. Hành vi “đồng thời là đại diện cho các bên tranh chấp với nhau về quyền sở hữu công nghiệp” quy định tại Điểm a Khoản 2 Diều 7 Nghị định 99/2013/NĐ-CP được hiểu là một trong các hành vi sau đây:'
      trang_pdf: 7
    - dieu: 11
      noi_dung: 'Điều 11. Hành vi xâm phạm quyền đối với sáng chế Khi xác định hành vi xâm phạm quyền đối với sáng chế phải tuân theo quy định tại các điều 5 và 8 Nghị định 105/2006/NĐ-CP sửa đổi và một số hướng dẫn sau:'
      trang_pdf: 9
    - dieu: 15
      noi_dung: 'Điều 15. Hành vi xâm phạm quyền đối với chỉ dẫn địa lý Khi xác định hành vi xâm phạm quyền đối với chỉ dẫn địa lý phải tuân theo quy định tại các điều 5 và 12 Nghị định 105/2006/NĐ-CP sửa đôi và một số hướng dẫn sau: _1. Căn cứ đánh giá khả năng gây nhằm lẫn của dấu hiệu với chỉ dẫn địa lý có thê được áp dụng một cách thích hợp tương tự như cách áp dụng căn cứ đánh giá khả năng gây nhâm lần của dâu hiệu với nhãn hiệu được bảo hộ.'
      trang_pdf: 13
    - dieu: 18
      noi_dung: Điều 18. Nhập khẩu song song 1. Nhập khẩu song song theo quy định tại Khoản 2 Điều 26 Nghị định 99/2013/NĐ-CP là việc tổ chức, cá nhân nhập khẩu sản phẩm do chính chủ sở hữu hoặc tổ chức, cá nhân được chuyển giao quyên sử dụng, kể cả chuyển giao quyền sử dụng theo quyết định bắt buộc, người có quyền sử dụng trước đôi tượng sở hữu công nghiệp đã đưa ra thị trường trong nước hoặc nước ngoài một cách hợp pháp, mặc dù không được sự đồng ý.của chủ
      trang_pdf: 14
    - dieu: 22
      noi_dung: 'Điều 22. Ủy quyền yêu cầu xứ lý vi phạm Văn bản ủy quyền yêu cầu xử lý vi phạm khi được nộp kèm theo đơn yêu cầu xử lý vi phạm phải đáp ứng các điều kiện theo quy định tại Điều 23 Nghị định 99/2013/NĐ-CP và lưu ý một số trường hợp sau:'
      trang_pdf: 17
    - dieu: 26
      noi_dung: Điều 26. Phối hợp xử lý vi phạm _ 1. Cục Sở hữu trí tuệ, Viện Khoa học sở hữu trí tuệ và các cơ quan có thầm quyền xử lý xâm phạm quyên sở hữu công nghiệp có trách nhiệm phôi hợp xử ly vi phạm khi nhận được yêu cầu phối hợp xử lý vi phạm theo quy định tại Khoản 1 Điều 29 Nghị định 99/2013/NĐ-CP.
      trang_pdf: 21
    - dieu: 31
      noi_dung: Điều 31. Hiệu lực thi hành Thông tư này có hiệu lực kể từ ngày 11 tháng 8 năm 2015 và thay thế Thông tư số 37/2011/T1-BKHCN ngày 27 tháng 12 năm 2011 của Bộ trưởng Bộ Khoa học và Công nghệ hướng dẫn thi hành một số điều của Nghị định số 23
      trang_pdf: 23
ghi_chu: Văn bản hướng dẫn Nghị định 99/2013/NĐ-CP xác định hành vi xâm phạm quyền SHCN, hàng hóa giả mạo nhãn hiệu/chỉ dẫn địa lý, cạnh tranh không lành mạnh và thủ tục xử lý vi phạm (được sửa đổi bởi TT 06/2024/TT-BKHCN, hợp nhất tại 04/VBHN-BKHCN và sửa đổi tiếp bởi TT 66/2026/TT-BKHCN).
