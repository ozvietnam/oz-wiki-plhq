ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành ấn chỉ bán thu tiền từ ngày 10-07-2026: (1) Tem điện tử xì gà nhập khẩu mẫu XGNK, ký hiệu tem AA/2026 (175.000 chiếc, từ 0000001 đến 0175000, giá bán 472 đồng/chiếc); (2) Tem điện tử rượu nhập khẩu độ cồn <30 độ mẫu RD30 (giá bán 868 đồng/chiếc) gồm 3 dải AB/2025 (4.999.999 chiếc, từ 5000001 đến 9999999), AC/2025 (9.999.999 chiếc, từ 0000001 đến 9999999) và AD/2025 (6.133.385 chiếc, từ 0000001 đến 6133385). Chưa gắn quan_he tới 23/2021/TT-BTC, 31/2025/TT-BTC và 1887/QĐ-CHQ/2025 vì chưa có trong sổ (tránh điểm mù Cao).'
