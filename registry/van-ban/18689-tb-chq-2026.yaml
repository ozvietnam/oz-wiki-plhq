  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/14/VB_18689.pdf, id=105112, SHA-256 7499098a5648b417b4e25ba6f3c39236c5583298032e28640b88c95cf8108fd6): Thông báo số 18689/TB-CHQ ngày 09-07-2026 (ký số 09-07-2026 17:08:40 +07:00) của Cục Hải quan về việc phát hành ấn chỉ bán thu tiền từ ngày 10-07-2026 (căn cứ Thông tư 23/2021/TT-BTC ngày 30-03-2021, Thông tư 31/2025/TT-BTC ngày 31-05-2025 của Bộ trưởng Bộ Tài chính và Quyết định 1887/QĐ-CHQ ngày 25-11-2025 của Cục trưởng Cục Hải quan): (1) Tem điện tử xì gà nhập khẩu: ký hiệu mẫu XGNK, ký hiệu tem AA/2026, số lượng 175.000 chiếc (từ số 0000001 đến số 0175000), giá bán 472 đồng/chiếc, ngày bắt đầu sử dụng 10/7/2026; (2) Tem điện tử rượu nhập khẩu độ cồn <30 độ: ký hiệu mẫu RD30, giá bán 868 đồng/chiếc, ngày bắt đầu sử dụng 10/7/2026, gồm 3 dải: AB/2025 (4.999.999 chiếc, từ 5000001 đến 9999999), AC/2025 (9.999.999 chiếc, từ 0000001 đến 9999999) và AD/2025 (6.133.385 chiếc, từ 0000001 đến 6133385); người ký Trịnh Văn Nhuận (TL. Cục trưởng, Trưởng ban Tài vụ - Quản trị)'
