    Điều 1 (Phạm vi điều chỉnh): ban hành Danh mục thiết bị y tế XNK đã được xác định mã số theo Danh mục hàng hóa XNK VN.
    Điều 2: ban hành Danh mục kèm theo.
    Điều 3: nguyên tắc áp dụng Danh mục.
    Điều 4.1: hiệu lực 16/11/2024.
    Điều 4.2: thay thế TT 14/2018/TT-BYT ngày 15/5/2018 (Bộ trưởng Bộ Y tế) kể từ ngày TT này có hiệu lực.
    Điều 5: trách nhiệm thi hành.
    Căn cứ: Luật HQ 54/2014/QH13, NĐ 08/2015/NĐ-CP (sửa bởi NĐ 59/2018), NĐ 98/2021/NĐ-CP (quản lý thiết bị y tế, sửa bởi NĐ 07/2023 + NĐ 96/2023), NĐ 96/2023/NĐ-CP.
