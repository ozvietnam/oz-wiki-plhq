  boi: gd-bo-ba@ozvietnam
ghi_chu: >-
  Hướng dẫn phân loại phụ gia thực phẩm nhũ hóa (RIKEMAL P-200S, RIKEN DMG TYPE P(V), RIMULSOFT SUPER (V)) giữa nhóm
  38.24 và nhóm 34.04: phải căn cứ tài liệu kỹ thuật và thực tế hàng hóa nhập khẩu theo khoản 1 Điều 26 Luật Hải quan
  54/2014/QH13 và Thông tư 31/2022/TT-BTC, không xác định mã số chỉ dựa trên tên thương mại hay việc thay đổi mã HS của
  nước xuất khẩu.
