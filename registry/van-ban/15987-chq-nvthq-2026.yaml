  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/DONG_NAI/2026/5/8/15987_CHQ_GSQL_07_05_2026.pdf, id=103573, SHA-256
    c1582928f3c4dae426eeba4d76c637ba9175b040683a695daeb0b8e0b194be1f): Công văn số 15987/CHQ-NVTHQ ngày 07-05-2026 của
    Cục Hải quan hướng dẫn việc phân loại mặt hàng phụ gia thực phẩm (RIKEMAL P-200S, RIKEN DMG TYPE P(V), RIMULSOFT
    SUPER (V)) khi doanh nghiệp đề nghị thay đổi mã HS nước nhập khẩu theo mã HS nước xuất khẩu: căn cứ khoản 1 Điều 26
    Luật Hải quan số 54/2014/QH13 và Thông tư 31/2022/TT-BTC (nội dung nhóm 38.24 "Chất gắn đã điều chế dùng cho các
    loại khuôn đúc hoặc lõi đúc; các sản phẩm và chế phẩm hóa học của ngành công nghiệp hóa chất hoặc các ngành công
    nghiệp có liên quan..." và nhóm 34.04 "Sáp nhân tạo và sáp đã được chế biến"), việc phân loại phải căn cứ hồ sơ hải
    quan, tài liệu kỹ thuật và thực tế hàng hóa nhập khẩu chứ không chỉ dựa vào tên thương mại hoặc mã HS nước xuất
    khẩu; đang còn hiệu lực
  hieu_luc_da_doi_chieu: true
