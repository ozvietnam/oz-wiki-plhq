xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF Công báo số 87 + 88 ngày 25-01-2019 (25285-1-201987-8826-2018-tt-bnnptnt.pdf, có lớp chữ đầy đủ, lưu tại raw/download/congbaocdn.chinhphu.vn/26-2018-tt-bnnptnt.pdf) và thẻ vanban.chinhphu.vn (docid=196078, tệp đính kèm 26-bnnptnt.signed.pdf): số hiệu 26/2018/TT-BNNPTNT, trích yếu "Quy định về quản lý giống thủy sản, thức ăn thủy sản, sản phẩm xử lý môi trường nuôi trồng thủy sản", Thứ trưởng Phùng Đức Tiến ký ngày 15-11-2018, có hiệu lực thi hành từ ngày 01-01-2019 theo khoản 1 Điều 16; cấu trúc gồm 4 Chương, 18 Điều và 07 Phụ lục (Phụ lục I–VII). Khoản 2 Điều 16 thay thế 21 văn bản (các Quyết định 10/2007/QĐ-BTS, 06/2008/QĐ-BNN, 108/2008/QĐ-BNN, 123/2008/QĐ-BNN và các Thông tư 57/2009, 67/2009, 71/2009, 74/2009, 12/2010, 13/2010, 64/2010, 62/2011, 65/2011, 04/2012, 36/2012, 37/2012, 26/2013, 08/2013, 09/2013, 39/2013, 11/2014/TT-BNNPTNT); khoản 3 Điều 16 bãi bỏ các Quyết định 176/QĐ-BTS, 456/QĐ-BNN-NTTS, 1673/QĐ-BNN-TCTS, cụm từ Saponin từ bột hạt trà, Rotenon có số thứ tự 14 và 15 tại Phụ lục XLIV Thông tư 13/2016/TT-BNNPTNT, khoản 6 Điều 3, Điều 31 và Điều 32 Thông tư 04/2015/TT-BNNPTNT, và nội dung quản lý về thức ăn thủy sản tại Thông tư 20/2017/TT-BNNPTNT. Được sửa đổi, bổ sung từ ngày 04-03-2022 bởi Điều 8 Thông tư 01/2022/TT-BNNPTNT ngày 18-01-2022 (hợp nhất tại Văn bản hợp nhất 19/VBHN-BNNPTNT ngày 30-12-2022) và các Điều 3, 4, 5, 6 Thông tư 10/2025/TT-BNNMT ngày 19-06-2025; hết hiệu lực toàn bộ kể từ ngày 09-03-2026 theo điểm a khoản 2 Điều 20 Thông tư 16/2026/TT-BNNMT ngày 09-03-2026 (vanban.chinhphu.vn docid=217170).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Văn bản gốc của Văn bản hợp nhất 19/VBHN-BNNPTNT ngày 30-12-2022 (hợp nhất Thông tư 26/2018/TT-BNNPTNT và Thông tư 01/2022/TT-BNNPTNT). Chỉ khai quan_he.bai_bo đối với 20/2017/TT-BNNPTNT đã có trong sổ; các văn bản bị thay thế/bãi bỏ khác tại khoản 2, khoản 3 Điều 16 và văn bản thay thế 16/2026/TT-BNNMT ngày 09-03-2026 chưa có trong sổ nên ghi nhận đầy đủ tại xac_minh.pham_vi.'
