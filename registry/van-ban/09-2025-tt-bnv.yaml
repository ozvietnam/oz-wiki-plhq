      noi_dung: Điều 19. Điều khoản chuyển tiếp và trách nhiệm thi hành 1. Điều khoản chuyển tiếp a) Đối với các hồ sơ đã nộp trước ngày Thông tư này có hiệu lực, cơ quan tiếp nhận hồ sơ tiếp tục giải quyết theo các quy định hiện hành cho đến khi kết thúc thủ tục hành chính; b) Trường hợp điều kiện thực hiện nhiệm vụ quy định tại Điều 16 Thông tư này tại địa phương chưa bảo đảm được thì Bộ Nội vụ (Cục Việc làm) tiếp tục thực hiện trách nhiệm tiếp nhận, xử lý hồ sơ đăng ký kiểm tra chất lượng sản phẩm, hàng hóa nhập khẩu theo đề nghị của tổ chức, cá nhân sản xuất, kinh doanh, nhập khẩu sản phẩm, hàng hóa đến hết ngày 31 tháng 12 năm 2025. 2. Trách nhiệm thi hành a) Ủy ban nhân dân các cấp có trách nhiệm chỉ đạo các cơ quan chức năng có liên quan kiểm tra, thực hiện Thông tư này; b) Trường hợp phát sinh vướng mắc trong quá trình thực hiện, các cơ quan, tổ chức, đơn vị, cá nhân liên quan có trách nhiệm phản ánh về Bộ Nội vụ để xem xét, hướng dẫn theo quy định của pháp luật./.
