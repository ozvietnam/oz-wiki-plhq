  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh, đối tượng áp dụng 1. Thông tư này quy định thẩm quyền, trình tự, thủ tục thực hiện nhiệm vụ, quyền hạn của cơ quan, người có thẩm quyền theo quy định tại các Thông tư, Thông tư liên tịch do Bộ trưởng Bộ Nội vụ ban hành, liên tịch ban hành nhằm phân định thẩm quyền và phân cấp trong lĩnh vực nội vụ. 2. Thông tư này áp dụng đối với cơ quan, tổ chức, người có thẩm quyền thực hiện nhiệm vụ phân định thẩm quyền và phân cấp trong lĩnh vực nội vụ. 50 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025
      trang_pdf: 1
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 2
      noi_dung: Điều 2. Về phí, lệ phí 1. Các thủ tục hành chính khi giải quyết mà phải nộp phí, lệ phí theo quy định của pháp luật về phí, lệ phí thì khi người dân, tổ chức nộp hồ sơ đề nghị giải quyết thủ tục hành chính đồng thời nộp phí, lệ phí cho cơ quan tiếp nhận hồ sơ. 2. Mức phí, lệ phí, việc quản lý, sử dụng phí, lệ phí thực hiện theo quy định của Chính phủ, Bộ trưởng Bộ Tài chính hoặc Hội đồng nhân dân cấp tỉnh đối với phí, lệ phí tương ứng. Chương II QUY ĐỊNH CỤ THỂ VỀ PHÂN ĐỊNH THẨM QUYỀN
      trang_pdf: 2
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 3
      noi_dung: Điều 3. Cơ sở y tế có thẩm quyền kết luận thương tích cần điều trị, điều dưỡng để làm căn cứ xác định thời gian điều trị, điều dưỡng để bình xét danh hiệu “Lao động tiên tiến”, “Chiến sĩ tiên tiến” Cá nhân tham gia chiến đấu, phục vụ chiến đấu hoặc có hành động dũng cảm cứu người, cứu tài sản của Nhà nước, của Nhân dân quy định tại Thông tư số 01/2024/TT-BNV ngày 24 tháng 02 năm 2024 của Bộ trưởng Bộ Nội vụ quy định biện pháp thi hành Luật Thi đua, khen thưởng và Nghị định số 98/2023/NĐ-CP ngày 31 tháng 12 năm 2023 của Chính phủ quy định chi tiết thi hành một số điều của Luật Thi đua, khen thưởng dẫn đến bị thương tích cần điều trị, điều dưỡng theo kết luận của Bệnh viện hoặc Trung tâm y tế khu vực trở lên thì thời gian điều trị, điều dưỡng được tính để bình xét danh hiệu “Lao động tiên tiến”, “Chiến sĩ tiên tiến”.
      trang_pdf: 2
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 4
      noi_dung: 'Điều 4. Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp xã về khen thưởng cá nhân, tập thể thuộc cơ quan đảng, đoàn thể Việc khen thưởng đối với cá nhân, tập thể chuyên trách công tác đảng, đoàn thể quy định tại Thông tư số 01/2024/TT-BNV thực hiện như sau: Cá nhân, tập thể chuyên trách công tác đảng, đoàn thể thuộc cấp xã do Chủ tịch Ủy ban nhân dân cấp xã khen thưởng hoặc trình Chủ tịch Ủy ban nhân dân cấp tỉnh khen thưởng hoặc trình cấp trên khen thưởng.'
      trang_pdf: 2
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 5
      noi_dung: 'Điều 5. Khen thưởng trong Hội đồng nhân dân cấp xã Việc khen thưởng trong Hội đồng nhân dân cấp xã quy định tại Thông tư số 01/2024/TT-BNV thực hiện như sau: Việc khen thưởng đối với Chủ tịch, Phó Chủ tịch Hội đồng nhân dân, các Ban của Hội đồng nhân dân, đại biểu Hội đồng nhân dân chuyên trách, đại biểu Hội đồng nhân dân hoạt động kiêm nhiệm được thực hiện theo nguyên tắc cấp nào quản lý về tổ chức, cán bộ, quỹ lương thì cấp đó có trách nhiệm xét, khen thưởng và đề nghị cấp trên khen thưởng.'
      trang_pdf: 3
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 6
      noi_dung: 'Điều 6. Thẩm quyền của Bộ Chỉ huy quân sự cấp tỉnh (hoặc đơn vị quản lý cũ) về xác nhận giấy tờ xét khen thưởng thành tích kháng chiến chống Mỹ Việc khen thưởng thành tích kháng chiến chống Mỹ quy định tại khoản 2 Điều 4 Thông tư số 02/2024/TT-BNV ngày 12 tháng 6 năm 2024 của Bộ trưởng Bộ Nội vụ quy định biện pháp thi hành Nghị định số 28/2024/NĐ-CP ngày 06 tháng 3 năm 2024 của Chính phủ quy định chi tiết trình tự, thủ tục xét tặng, truy tặng “Huy chương Thanh niên xung phong vẻ vang” và việc khen thưởng tổng kết thành tích kháng chiến thực hiện như sau: Đối với đề nghị khen thưởng của quân nhân phục viên, xuất ngũ phải có quyết định phục viên, xuất ngũ, chuyển ngành; trong trường hợp đã mất giấy tờ thì có thể lấy giấy xác nhận của Bộ Chỉ huy quân sự cấp tỉnh (hoặc đơn vị quản lý cũ) về quá trình tại ngũ trong đó ghi rõ căn cứ vào tài liệu nào, quyển sổ bao nhiêu, số thứ tự trong danh sách; ngày nhập ngũ, ngày xuất ngũ, thời gian tham gia chiến trường B, C, K (nếu có) và ngày, tháng, năm được biên chế vào đơn vị hoặc đăng ký quân dự bị tại Bộ Chỉ huy quân sự cấp tỉnh, kèm theo bản sao danh sách có tên của người được xác nhận (bản sao có dấu của Bộ Chỉ huy quân sự cấp tỉnh hoặc đơn vị quản lý cũ).'
      trang_pdf: 3
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 7
      noi_dung: 'Điều 7. Hồ sơ, thủ tục hỗ trợ chi phí y tế và thu nhập thực tế bị mất hoặc bị giảm sút, nguồn kinh phí Thủ tục hỗ trợ chi phí y tế và thu nhập thực tế bị mất hoặc bị giảm sút, nguồn kinh phí quy định tại khoản 1, 2 Điều 5 Thông tư liên tịch số 02/2013/TTLT-BNVBLĐTBXH-BTC-BYT ngày 09 tháng 7 năm 2013 của Bộ trưởng Bộ Nội vụ, Bộ Lao động - Thương binh và Xã hội, Bộ Tài chính, Bộ Y tế hướng dẫn quy trình, thủ tục, hồ sơ, mức hỗ trợ người đang trực tiếp tham gia hoạt động chữ thập đỏ bị tai nạn dẫn đến thiệt hại về sức khỏe thực hiện như sau: 52 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 1. Trong thời hạn 10 ngày, kể từ ngày người bị tai nạn đã được cứu chữa, phục hồi sức khỏe và chức năng bị mất hoặc giảm sút, Hội Chữ thập đỏ quản lý người bị tai nạn lập 01 bộ hồ sơ gửi Phòng Văn hóa - Xã hội thuộc Ủy ban nhân dân cấp xã cùng địa bàn để thẩm định. Hồ sơ do Hội Chữ thập đỏ lập, gồm: a) Công văn đề nghị thẩm định của Hội Chữ thập đỏ (bản chính); b) Biên bản xác nhận tình trạng của người bị tai nạn do Hội Chữ thập đỏ lập có xác nhận của Ủy ban nhân dân cấp xã nơi xảy ra tai nạn hoặc cơ quan công an nơi xảy ra tai nạn (bản chính hoặc bản sao có chứng thực nếu gửi qua đường bưu điện, bản sao và bản chính để đối chiếu nếu gửi trực tiếp); c) Giấy ra viện, hóa đơn thanh toán chi phí khám bệnh, chữa bệnh và những chi phí không nằm trong danh mục do bảo hiểm y tế chi trả với người lao động tham gia bảo hiểm y tế (bản chính hoặc bản sao có chứng thực nếu gửi qua đường bưu điện, bản sao và bản chính để đối chiếu nếu gửi trực tiếp); d) Văn bản, giấy tờ hợp lệ về thu nhập thực tế theo tiền lương, tiền công hằng tháng của người bị tai nạn có xác nhận của tổ chức hoặc cá nhân sử dụng người lao động để cơ quan nhà nước có thẩm quyền xác định thu nhập thực tế bị mất hoặc giảm sút (bản chính hoặc bản sao có chứng thực nếu gửi qua đường bưu điện, bản sao và bản chính để đối chiếu nếu gửi trực tiếp), gồm: Hợp đồng lao động, quyết định nâng lương của tổ chức hoặc cá nhân sử dụng người lao động hoặc bản kê có thu nhập thực tế của người bị tai nạn và các giấy tờ chứng minh thu nhập thực tế hợp pháp khác (nếu có). 2. Trong thời hạn 20 ngày, kể từ ngày nhận đủ hồ sơ quy định tại khoản 1 Điều này, Phòng Văn hóa - Xã hội thuộc Ủy ban nhân dân cấp xã phối hợp với cơ quan bảo hiểm xã hội, cơ quan có liên quan thẩm định và có văn bản trả lời Hội Chữ thập đỏ. 3. Trong thời hạn 10 ngày, kể từ ngày nhận được văn bản thẩm định của Phòng Văn hóa - Xã hội thuộc Ủy ban nhân dân cấp xã, Hội Chữ thập đỏ xem xét, chi trả chi phí. Trường hợp không đồng ý, có văn bản trả lời nêu rõ lý do.'
      trang_pdf: 3
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 8
      noi_dung: 'Điều 8. Nhiệm vụ, quyền hạn của Ban Công tác người cao tuổi cấp tỉnh Nhiệm vụ, quyền hạn của Ban Công tác người cao tuổi cấp tỉnh quy định tại điểm a khoản 1 Điều 1; điểm b, d khoản 1 Điều 2 Thông tư số 08/2014/TT-BNV ngày 19 tháng 9 năm 2014 của Bộ trưởng Bộ Nội vụ quy định về Ban Công tác người cao tuổi tỉnh, thành phố trực thuộc Trung ương và Ban Công tác người cao tuổi huyện, quận, thị xã, thành phố thuộc tỉnh thực hiện như sau: 1. Ban Công tác người cao tuổi cấp tỉnh là tổ chức phối hợp liên ngành giúp Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo, phối hợp giữa các cơ quan chuyên môn thuộc Ủy ban nhân dân cấp tỉnh, Ủy ban nhân dân cấp xã, tổ chức có liên quan trong việc giải quyết những vấn đề về cơ chế, chính sách để thực hiện công tác về người cao tuổi. 2. Giúp Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo, phối hợp hoạt động giữa các sở, ngành, Ủy ban nhân dân cấp xã, tổ chức có liên quan trong việc xây dựng kế hoạch, thực hiện công tác người cao tuổi và Chương trình hành động Quốc gia về người cao tuổi từng giai đoạn. 3. Giúp Chủ tịch Ủy ban nhân dân cấp tỉnh đôn đốc, kiểm tra, đánh giá hoạt động của các sở, ngành, Ủy ban nhân dân cấp xã, tổ chức có liên quan việc thực hiện quy định của pháp luật và các chính sách hỗ trợ người cao tuổi. Sơ kết, tổng kết và định kỳ báo cáo Chủ tịch Ủy ban nhân dân cấp tỉnh, Ủy ban Quốc gia người cao tuổi Việt Nam tình hình thực hiện công tác chăm sóc và phát huy vai trò người cao tuổi.'
      trang_pdf: 5
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 9
      noi_dung: 'Điều 9. Thẩm quyền của Sở Nội vụ, Ủy ban nhân dân cấp xã về xây dựng cơ sở dữ liệu đối với người lao động Việc xây dựng cơ sở dữ liệu về người lao động quy định tại Điều 12 Thông tư số 11/2022/TT-BLĐTBXH ngày 30 tháng 6 năm 2022 của Bộ trưởng Bộ Lao động Thương binh và Xã hội hướng dẫn một số nội dung thực hiện hỗ trợ việc làm bền vững thuộc Chương trình mục tiêu quốc gia giảm nghèo bền vững giai đoạn 2021 - 2025 thực hiện như sau: 1. Sở Nội vụ tham mưu, giúp Ủy ban nhân dân cấp tỉnh tổ chức thực hiện những việc sau: 54 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 a) Xây dựng kế hoạch tổ chức thu thập, cập nhật, chỉnh sửa, tổng hợp thông tin về người lao động của địa phương; b) Hướng dẫn Ủy ban nhân dân cấp xã tổ chức thực hiện việc thu thập, cập nhật, chỉnh sửa thông tin về người lao động cư trú trên địa bàn quản lý; c) Tổng hợp, đồng bộ cơ sở dữ liệu về người lao động theo hướng dẫn của Bộ Nội vụ để xây dựng cơ sở dữ liệu về người lao động trong phạm vi cả nước. 2. Ủy ban nhân dân cấp xã căn cứ vào nguồn lực, hướng dẫn của Ủy ban nhân dân cấp tỉnh và Sở Nội vụ để thực hiện: a) Lập kế hoạch và tổ chức thu thập, cập nhật, chỉnh sửa thông tin về người lao động cư trú trên địa bàn quản lý; xử lý các vấn đề phát sinh; b) Thiết lập cơ chế đối soát, cập nhật, chia sẻ dữ liệu người lao động thu thập với dữ liệu quốc gia về dân cư và các cơ sở dữ liệu khác là cơ sở để xác thực hoàn thiện và cung cấp sổ lao động điện tử của người lao động. 3. Mẫu biểu thu thập thông tin người lao động từ 15 tuổi trở lên đang cư trú tại địa bàn được quy định tại Mẫu số 01 Phụ lục I kèm theo Thông tư này.'
      trang_pdf: 5
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 10
      noi_dung: 'Điều 10. Nhiệm vụ của Ủy ban nhân dân cấp xã về báo cáo thực hiện chính sách việc làm công Việc báo cáo thực hiện chính sách việc làm công quy định tại Điều 7 Thông tư số 11/2017/TT-BLĐTBXH ngày 20 tháng 4 năm 2017 của Bộ trưởng Bộ Lao động Thương binh và Xã hội hướng dẫn thực hiện một số điều của Nghị định số 61/2015/NĐ-CP ngày 09 tháng 7 năm 2015 của Chính phủ quy định về chính sách hỗ trợ tạo việc làm và quỹ quốc gia về việc làm về chính sách việc làm công thực hiện như sau: Ủy ban nhân dân cấp xã báo cáo kết quả thực hiện các dự án, hoạt động thực hiện chính sách việc làm công do Ủy ban nhân dân cấp xã là chủ đầu tư theo Mẫu số 02 Phụ lục I kèm theo Thông tư này gửi Ủy ban nhân dân cấp tỉnh thông qua Sở Nội vụ trước ngày 05 tháng 12 hằng năm.'
      trang_pdf: 6
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 11
      noi_dung: Điều 11. Thủ tục thực hiện chế độ đối với quân nhân, cán bộ đi chiến trường B, C, K trong thời kỳ chống Mỹ cứu nước không có thân nhân phải trực tiếp nuôi dưỡng và quân nhân, cán bộ được Đảng cử ở lại miền Nam hoạt động sau Hiệp định Giơnevơ năm 1954 Thủ tục thực hiện chế độ đối với quân nhân, cán bộ đi chiến trường B, C, K trong thời kỳ chống Mỹ cứu nước quy định tại Mục III Thông tư liên tịch
      trang_pdf: 6
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 11
      noi_dung: 'số 17/1999/TTLT-BLĐTBXH-BTC-BTCCBCP của Bộ trưởng Bộ Lao động Thương binh và Xã hội, Bộ Tài chính, Trưởng Ban Tổ chức cán bộ Chính phủ hướng dẫn thi hành Nghị định số 23/1999/NĐ-CP ngày 15 tháng 4 năm 1999 của Chính phủ về chế độ đối với quân nhân, cán bộ đi chiến trường B, C, K trong thời kỳ chống Mỹ cứu nước không có thân nhân phải trực tiếp nuôi dưỡng và quân nhân, cán bộ được Đảng cử ở lại miền nam hoạt động sau Hiệp định Giơnevơ năm 1954 thực hiện như sau: 1. Trách nhiệm của đối tượng và cơ quan quản lý hồ sơ, lý lịch: a) Đối tượng được hưởng làm bản khai theo Mẫu số 03 Phụ lục I kèm theo Thông tư này. Bản kê khai phải có sự chứng nhận của cơ quan nơi người đó công tác nếu còn đang làm việc hoặc chứng nhận của Ủy ban nhân dân cấp xã về nơi cư trú đối với đối tượng còn lại. Sau đó đối tượng nộp bản khai cá nhân cho các cơ quan tiếp nhận theo quy định sau: - Đối với cán bộ, sĩ quan thuộc lực lượng vũ trang: nếu đang làm việc thì nộp cho đơn vị đang công tác; nếu là quân nhân đã nghỉ hưu, nghỉ mất sức lao động, nghỉ bệnh binh, tai nạn lao động, bệnh nghề nghiệp, xuất ngũ, chuyển ngành thì nộp cho Ban Chỉ huy quân sự cấp xã; nếu là Công an nhân dân đã nghỉ hưu, nghỉ mất sức lao động, nghỉ bệnh binh, tai nạn lao động, bệnh nghề nghiệp, xuất ngũ, chuyển ngành thì nộp cho Công an cấp xã; - Đối với cán bộ dân, chính, đảng (đang làm việc hoặc đã nghỉ) thì nộp cho Ủy ban nhân dân cấp xã. b) Đối với cơ quan quản lý hồ sơ, lý lịch có trách nhiệm trích sao và xác nhận theo quy định dưới đây về thời gian chiến đấu, công tác ở chiến trường B, C, K của đối tượng ở một trong các hồ sơ, lý lịch: cán bộ, đảng viên, quân nhân hoặc hưu trí, mất sức: - Đối với đối tượng đang làm việc trong lực lượng vũ trang, cơ quan, doanh nghiệp Nhà nước thì thủ trưởng cơ quan, đơn vị, doanh nghiệp nơi đối tượng đang làm việc căn cứ hồ sơ, lý lịch quản lý có trách nhiệm trích sao và xác nhận cho đối tượng theo quy định; - Đối với đối tượng đang làm việc ở ngoài khu vực Nhà nước, đối tượng đã nghỉ hưu, nghỉ mất sức lao động, bệnh binh, tai nạn lao động, bệnh nghề nghiệp, xuất ngũ thì Ủy ban nhân dân cấp xã đề nghị cơ quan quản lý hồ sơ cấp xã trích sao và xác nhận cho đối tượng;'
      trang_pdf: 7
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 11
      noi_dung: '56 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 Riêng đối với người đã từ trần hoặc hy sinh thì đại diện thân nhân có trách nhiệm làm các thủ tục, hồ sơ như ở điểm a, b khoản 1 Điều 11 Thông tư này và tờ khai theo Mẫu số 04 Phụ lục I kèm theo Thông tư này. 2. Trách nhiệm của cơ quan, đơn vị tiếp nhận hồ sơ, xét duyệt và chi trả chế độ 01 lần: a) Đối với đơn vị lực lượng vũ trang: - Ban Chỉ huy quân sự cấp xã, Công an cấp xã có trách nhiệm tiếp nhận, tập hợp tờ khai, trích sao hồ sơ, lý lịch về thời gian chiến đấu, công tác cho đối tượng (nếu quản lý hồ sơ, lý lịch) và gửi về Bộ Chỉ huy quân sự cấp tỉnh, Công an cấp tỉnh; - Bộ Chỉ huy quân sự cấp tỉnh, Công an cấp tỉnh căn cứ hồ sơ lưu trữ có trách nhiệm xét duyệt đối tượng được hưởng chế độ trong phạm vi quản lý. Đồng thời tập hợp lập danh sách kèm theo tờ khai cá nhân, bản trích sao lý lịch gửi lên Bộ Quốc phòng, nếu là Quân đội và Bộ Công an, nếu là Công an; - Bộ Quốc phòng, Bộ Công an có trách nhiệm duyệt đối tượng được hưởng chế độ trong phạm vi quản lý, đồng thời tập hợp, kiểm tra, xác nhận và lập dự toán gửi Bộ Tài chính để xét cấp kinh phí. Căn cứ vào đề nghị của Bộ Quốc phòng và Bộ Công an, Bộ Tài chính sẽ cấp bằng hạn mức kinh phí hoặc lệnh chi tiền cho Bộ Quốc phòng và Bộ Công an thực hiện chi trả theo đối tượng và quyết toán theo quy định hiện hành. b) Đối với cơ quan dân, chính, đảng: - Ủy ban nhân dân cấp xã có trách nhiệm tiếp nhận tờ khai cá nhân, đề nghị cơ quan quản lý hồ sơ, lý lịch cấp xã trích sao lý lịch cho đối tượng và tập hợp danh sách gửi Chủ tịch Ủy ban nhân dân cấp tỉnh; - Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo các cơ quan có liên quan xét duyệt đối tượng được hưởng chế độ trong phạm vi quản lý, tập hợp, xác nhận và lập dự toán gửi Bộ Tài chính để xét cấp kinh phí. Căn cứ đề nghị của Ủy ban nhân dân cấp tỉnh, Bộ Tài chính cấp kinh phí theo quy định; - Đối với đối tượng thuộc diện Trung ương quản lý, căn cứ hồ sơ lưu trữ, đề nghị Ban Tổ chức Trung ương xét duyệt đối tượng được hưởng đồng thời tập hợp, xác nhận, lập dự toán và có công văn gửi về Bộ Tài chính để xét cấp kinh phí. Căn cứ vào danh sách xét duyệt của Ban Tổ chức Trung ương, Bộ Tài chính cấp bằng'
      trang_pdf: 8
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 11
      noi_dung: 'hạn mức kinh phí hoặc lệnh chi tiền cho các Bộ, Ban, ngành để chi trả cho đối tượng và quyết toán theo quy định hiện hành. c) Bộ Quốc phòng, Bộ Công an, các Bộ, Ban, ngành, đoàn thể ở Trung ương và các địa phương tiến hành tổ chức giám sát việc chi trả theo đúng đối tượng, mức hưởng và quyết toán kinh phí theo quy định hiện hành. Bộ Tài chính chỉ cấp kinh phí đợt tiếp theo cho những đơn vị đã có báo cáo quyết toán kinh phí được cấp của một đợt trước đó. d) Đối với những người hy sinh hoặc từ trần thì chế độ được cấp cho đại diện thân nhân chủ yếu (có ủy quyền của các thân nhân khác) của đối tượng gồm: bố đẻ, mẹ đẻ, vợ hoặc chồng, con đẻ, con nuôi hợp pháp.'
      trang_pdf: 9
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 12
      noi_dung: 'Điều 12. Hồ sơ xét hưởng chế độ trợ cấp đối với thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến Hồ sơ xét hưởng chế độ trợ cấp đối với thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến quy định tại Điều 4 Thông tư liên tịch số 08/2012/TTLTBLĐTBXH-BNV-BTC ngày 16 tháng 4 năm 2012 của Bộ trưởng Bộ Lao động Thương binh và Xã hội, Bộ Nội vụ, Bộ Tài chính hướng dẫn thực hiện chế độ trợ cấp đối với thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến theo Quyết định số 40/2011/QĐ-TTg ngày 27 tháng 7 năm 2011 của Thủ tướng Chính phủ, được sửa đổi bổ sung tại Thông tư số 08/2023/TT-BLĐTBXH ngày 29 tháng 8 năm 2023 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội, bao gồm: 1. Một trong các giấy tờ sau đây chứng minh là thanh niên xung phong (là bản chính hoặc bản sao có chứng thực của Ủy ban nhân dân cấp xã): a) Lý lịch cán bộ hoặc lý lịch đảng viên khai trước ngày 29 tháng 4 năm 1999; b) Giấy tờ do cơ quan có thẩm quyền cấp trước khi thanh niên xung phong trở về địa phương như: Giấy chứng nhận hoàn thành nhiệm vụ của đơn vị quản lý thanh niên xung phong; Giấy chuyển thương, chuyển viện, phiếu sức khỏe; Giấy khen trong thời gian tham gia lực lượng thanh niên xung phong; Giấy chứng nhận tham gia thanh niên xung phong; Giấy điều động công tác, bổ nhiệm, giao nhiệm vụ; c) Trường hợp thanh niên xung phong không còn một trong các giấy tờ quy định tại điểm a và b khoản này thì phải nộp bản khai có chứng thực của Ủy ban nhân dân cấp xã nơi đăng ký hộ khẩu thường trú trước khi tham gia thanh niên 58 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 xung phong (bản chính). Ủy ban nhân dân cấp xã có trách nhiệm xác nhận bản khai đối với đối tượng là người địa phương đi thanh niên xung phong nhưng hiện đang đăng ký thường trú ở địa phương khác (nội dung xác nhận theo Mẫu số 08 Phụ lục I kèm theo Thông tư này). 2. Bản khai cá nhân, cụ thể: a) Trường hợp thanh niên xung phong còn sống, lập đề nghị hưởng trợ cấp một lần theo Mẫu số 05 Phụ lục I kèm theo Thông tư này; b) Trường hợp thanh niên xung phong đã từ trần thì thân nhân thanh niên xung phong lập theo Mẫu số 06 Phụ lục I kèm theo Thông tư này; c) Trường hợp đề nghị hưởng trợ cấp hằng tháng thì lập theo Mẫu số 07 Phụ lục I kèm theo Thông tư này. 3. Đối với đối tượng đủ điều kiện hưởng chế độ trợ cấp hằng tháng, ngoài các giấy tờ quy định tại khoản 1, 2 Điều này phải có giấy chứng nhận sức khỏe của Bệnh viện hoặc Trung tâm y tế khu vực trở lên (bản chính).'
      trang_pdf: 9
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 13
      noi_dung: 'Điều 13. Thẩm quyền của Ủy ban nhân dân cấp xã, Ủy ban nhân dân cấp tỉnh và trình tự, thời hạn giải quyết chế độ trợ cấp cho thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến Việc giải quyết chế độ trợ cấp cho thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến quy định tại Điều 5 Thông tư liên tịch số 08/2012/TTLTBLĐTBXH-BNV-BTC thực hiện như sau: 1. Đối tượng thanh niên xung phong hoặc thân nhân của thanh niên xung phong (trường hợp thanh niên xung phong đã từ trần) nộp 01 bộ hồ sơ theo quy định tại Điều 12 Thông tư này cho Ủy ban nhân dân cấp xã nơi đăng ký thường trú. 2. Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định (theo từng đợt), Ủy ban nhân dân cấp xã có trách nhiệm: a) Tổ chức hội nghị và lập biên bản xác nhận hồ sơ xét hưởng chế độ trợ cấp theo Mẫu số 08 Phụ lục I kèm theo Thông tư này. Thành phần hội nghị gồm đại diện lãnh đạo cấp xã (Ủy ban nhân dân, Đảng ủy, Mặt trận Tổ quốc, Hội cựu thanh niên xung phong hoặc Ban liên lạc cựu thanh niên xung phong), Trưởng thôn có đối tượng thanh niên xung phong đề nghị giải quyết chế độ trợ cấp; b) Tổng hợp hồ sơ xét hưởng chế độ trợ cấp đối với thanh niên xung phong báo cáo Ủy ban nhân dân cấp tỉnh thông qua Sở Nội vụ. 3. Trong thời hạn 10 ngày, kể từ ngày nhận đủ hồ sơ theo quy định (theo từng đợt), Ủy ban nhân dân cấp tỉnh có trách nhiệm: a) Hoàn thành xét duyệt, thẩm định, tổng hợp, ra quyết định hưởng chế độ trợ cấp theo Mẫu số 09, Mẫu số 10, Mẫu số 11, kèm theo biểu tổng hợp danh sách thanh niên xung phong đề nghị hưởng chế độ trợ cấp lập theo Mẫu số 12, Mẫu số 13, Mẫu số 14 Phụ lục I kèm theo Thông tư này; Đối với trường hợp thanh niên xung phong không còn một trong các giấy tờ chứng minh quy định tại điểm a, b khoản 1 Điều 12 Thông tư này, tổng hợp, chuyển danh sách đối tượng đến Hội cựu thanh niên xung phong cấp tỉnh để kiểm tra, xác nhận, tham gia ý kiến trước khi quyết định. b) Hoàn thành việc tổng hợp danh sách đối tượng được hưởng trợ cấp một lần theo Mẫu số 15 Phụ lục I kèm theo Thông tư này sau khi có Quyết định về giải quyết chế độ trợ cấp đối với thanh niên xung phong (theo từng đợt), kèm theo công văn đề nghị bổ sung dự toán chi chế độ trợ cấp một lần, gửi 02 bản về Bộ Nội vụ. Đồng thời, tổ chức thực hiện việc chi trả chế độ trợ cấp hằng tháng cho các đối tượng được hưởng theo quy định hiện hành; c) Lưu giữ hồ sơ đối tượng được hưởng chế độ trợ cấp theo quy định.'
      trang_pdf: 10
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 14
      noi_dung: 'Điều 14. Thẩm quyền, trách nhiệm của Ủy ban nhân dân cấp xã về giải quyết trợ cấp một lần đối với người được cử làm chuyên gia sang giúp Lào và Campuchia theo Quyết định số 57/2013/QĐ-TTg ngày 14 tháng 10 năm 2013 của Thủ tướng Chính phủ về trợ cấp một lần đối với người được cử làm chuyên gia sang giúp Lào và Campuchia Thẩm quyền, trách nhiệm của Ủy ban nhân dân cấp xã tại Điều 4 Thông tư liên tịch số 17/2014/TTLT-BLĐTBXH-BTC ngày 01 tháng 8 năm 2014 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội, Bộ Tài chính hướng dẫn thực hiện trợ cấp một lần đối với người được cử làm chuyên gia sang giúp Lào và Campuchia theo Quyết định số 57/2013/QĐ-TTg ngày 14 tháng 10 năm 2013 của Thủ tướng Chính phủ thực hiện như sau: 1. Hướng dẫn người hưởng trợ cấp hoặc thân nhân người hưởng trợ cấp lập hồ sơ theo quy định. 60 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 2. Kiểm tra tính hợp lệ của hồ sơ; chuyển trả hồ sơ không hợp lệ cho người nộp hồ sơ hoàn thiện. 3. Hằng tháng tiếp nhận hồ sơ hợp lệ của người hưởng trợ cấp hoặc thân nhân người hưởng trợ cấp có đăng ký thường trú tại địa phương; tổng hợp, lập danh sách đề nghị người hưởng trợ cấp theo Mẫu số 16 Phụ lục I kèm theo Thông tư này xong trước ngày 10 hằng tháng. 4. Công khai danh sách người hưởng trợ cấp trong thời hạn 10 ngày kể từ ngày tổng hợp xong danh sách đề nghị người hưởng trợ cấp; tiếp nhận ý kiến có liên quan đến người hưởng trợ cấp hoặc thân nhân người hưởng trợ cấp trong thời gian công khai danh sách; thông báo lại nội dung ý kiến phản ánh liên quan cho người hưởng trợ cấp hoặc thân nhân người hưởng trợ cấp; tổng hợp ý kiến báo cáo Ủy ban nhân dân cấp tỉnh xem xét, quyết định. 5. Gửi danh sách kèm theo hồ sơ của người hưởng trợ cấp về Ủy ban nhân dân cấp tỉnh thông qua Sở Nội vụ trong thời hạn 05 ngày làm việc kể từ ngày hết hạn công khai danh sách đề nghị người hưởng trợ cấp.'
      trang_pdf: 11
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 15
      noi_dung: 'Điều 15. Thủ tục xác nhận và giải quyết chế độ ưu đãi người có công với cách mạng và thân nhân Thủ tục xác nhận và giải quyết chế độ ưu đãi người có công với cách mạng và thân nhân tại Điều 26 Thông tư số 05/2013/TT-BLĐTBXH ngày 15 tháng 5 năm 2013 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội hướng dẫn về thủ tục lập hồ sơ, quản lý hồ sơ, thực hiện chế độ ưu đãi người có công với cách mạng và thân nhân thực hiện như sau: 1. Người mắc bệnh hoặc thân nhân làm đơn đề nghị giải quyết chế độ kèm theo các giấy tờ sau gửi Ủy ban nhân dân cấp xã: a) Một trong các giấy tờ sau: Phiếu chuyển thương, chuyển viện; bản sao lý lịch đảng viên, lý lịch quân nhân, lý lịch công an nhân dân có ghi đầy đủ quá trình công tác; Giấy xác nhận hoạt động tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn do Thủ trưởng cơ quan, đơn vị có thẩm quyền cấp căn cứ vào hồ sơ, lý lịch và địa bàn hoạt động;'
      trang_pdf: 12
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 15
      noi_dung: Quyết định giao đi làm nghĩa vụ quốc tế do Thủ trưởng cơ quan, đơn vị có thẩm quyền cấp; Trường hợp sau khi xuất ngũ mà bệnh cũ tái phát dẫn đến tâm thần làm mất năng lực hành vi thì căn cứ xác nhận của cơ quan có thẩm quyền theo quy định của Bộ Quốc phòng, Bộ Công an. b) Các giấy tờ được cấp trong thời gian tại ngũ có ghi mắc bệnh kèm bệnh án điều trị tâm thần do bệnh cũ tái phát của bệnh viện cấp tỉnh hoặc tương đương trở lên. Trường hợp sau khi xuất ngũ mà bệnh cũ tái phát dẫn đến tâm thần làm mất năng lực hành vi thì căn cứ vào bệnh án điều trị của bệnh viện cấp tỉnh hoặc tương đương trở lên. c) Quyết định phục viên hoặc quyết định xuất ngũ. Trường hợp không còn quyết định thì phải có giấy xác nhận của Bộ Chỉ huy quân sự cấp tỉnh hoặc cơ quan có thẩm quyền theo quy định của Bộ Công an. 2. Ủy ban nhân dân cấp xã trong thời gian 15 ngày kể từ ngày nhận đơn có trách nhiệm xác minh, lập biên bản đề nghị xác nhận bệnh binh kèm giấy tờ quy định tại khoản 1 Điều này gửi Bộ Chỉ huy quân sự cấp tỉnh hoặc cơ quan có thẩm quyền theo quy định của Bộ Công an. 3. Bộ Chỉ huy quân sự cấp tỉnh hoặc cơ quan có thẩm quyền theo quy định của Bộ Công an trong thời gian 15 ngày kể từ ngày nhận đủ giấy tờ hợp lệ quy định tại khoản 2 Điều này, có trách nhiệm kiểm tra, cấp giấy xác nhận về thời gian phục vụ trong quân đội, công an (trong trường hợp không còn quyết định phục viên hoặc xuất ngũ); chuyển các giấy tờ đến cơ quan, đơn vị có thẩm quyền cấp giấy chứng nhận bệnh tật theo quy định của Bộ Quốc phòng hoặc Bộ Công an. 4. Cơ quan, đơn vị có thẩm quyền theo quy định của Bộ Quốc phòng hoặc Bộ Công an có trách nhiệm cấp giấy chứng nhận bệnh tật và giới thiệu ra Hội đồng giám định y khoa có thẩm quyền. 5. Cơ quan có thẩm quyền của Bộ Quốc phòng hoặc Bộ Công an căn cứ biên bản kết luận của Hội đồng giám định y khoa để ra quyết định cấp giấy chứng nhận bệnh binh và trợ cấp, phụ cấp; chuyển Sở Nội vụ nơi bệnh binh cư trú để thực hiện chế độ ưu đãi.
      trang_pdf: 13
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
