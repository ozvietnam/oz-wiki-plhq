    - dieu: 16
      noi_dung: Điều 16. Phân cấp Ủy ban nhân dân cấp tỉnh thực hiện nhiệm vụ quản lý chất lượng sản phẩm, hàng hóa có khả năng mất an toàn khi nhập khẩu 1. Ủy ban nhân dân cấp tỉnh tổ chức tiếp nhận, xử lý hồ sơ đăng ký kiểm tra chất lượng sản phẩm, hàng hóa nhập khẩu đối với sản phẩm, hàng hóa có khả năng gây mất an toàn theo Danh mục tại Phụ lục II kèm theo Thông tư này. 2. Việc kiểm tra nhà nước về chất lượng hàng hóa nhập khẩu được thực hiện theo quy định tại khoản 2b Điều 7 Nghị định số 132/2008/NĐ-CP ngày 31 tháng 12 năm 2008 của Chính phủ quy định chi tiết một số điều của Luật Chất lượng sản phẩm, hàng hóa được bổ sung theo quy định tại khoản 3 Điều 1 Nghị định số 74/2018/NĐ-CP ngày 15 tháng 5 năm 2018 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 132/2008/NĐ-CP ngày 31 tháng 12 năm 2008 của Chính phủ quy định chi tiết thi hành một số điều Luật Chất lượng sản phẩm, hàng hóa.
      trang_pdf: 14
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 17
      noi_dung: 'Điều 17. Thực hiện nhiệm vụ nhận và ban hành văn bản chấp thuận chuẩn bị nguồn lao động cho doanh nghiệp dịch vụ Thành phần hồ sơ chuẩn bị nguồn lao động của doanh nghiệp dịch vụ quy định tại điểm a khoản 1 Điều 10 và điểm 1 Mục 3 Phụ lục II của Nghị định số 128/2025/NĐ-CP ngày 11 tháng 6 năm 2025 của Chính phủ quy định về phân quyền, phân cấp trong quản lý nhà nước lĩnh vực nội vụ hướng dẫn cụ thể như sau: 1. Văn bản chuẩn bị nguồn lao động theo Mẫu số 17 Phụ lục I kèm theo Thông tư này. 2. Bản sao văn bản đề nghị của bên nước ngoài tiếp nhận lao động hoặc thỏa thuận hợp tác giữa doanh nghiệp Việt Nam với bên nước ngoài tiếp nhận lao động kèm theo bản dịch tiếng Việt; gồm những nội dung sau: a) Số lượng lao động mà doanh nghiệp Việt Nam cần chuẩn bị, ngành nghề, giới tính người lao động; b) Yêu cầu về trình độ, kỹ năng nghề, ngoại ngữ của người lao động; c) Thông tin cơ bản về việc làm ở nước ngoài (nơi làm việc, mức lương, thời hạn hợp đồng lao động);'
      trang_pdf: 14
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 17
      noi_dung: 'd) Thời gian dự kiến tuyển chọn. 3. Tài liệu chứng minh được cơ quan chức năng nước cho phép tuyển dụng lao động nước ngoài đối với bên nước ngoài lần đầu hợp tác với doanh nghiệp dịch vụ Việt Nam: a) Trường hợp bên nước ngoài là người sử dụng lao động, tài liệu chứng minh bao gồm: 01 bản sao giấy phép kinh doanh hoặc giấy tờ khác tương đương do cơ quan chức năng cấp cho người sử dụng lao động thể hiện lĩnh vực kinh doanh phù hợp với ngành, nghề công việc tuyển dụng lao động nước ngoài, kèm bản dịch tiếng Việt; Đối với nước có quy định về điều kiện tiếp nhận lao động nước ngoài thì cung cấp 01 bản sao tài liệu thể hiện người sử dụng lao động đáp ứng quy định này, kèm bản dịch tiếng Việt. b) Trường hợp bên nước ngoài là tổ chức dịch vụ việc làm, tài liệu chứng minh bao gồm: 01 bản sao giấy phép kinh doanh hoặc giấy tờ khác tương đương do cơ quan chức năng cấp hoặc xác nhận cho tổ chức dịch vụ việc làm thể hiện ngành, nghề kinh doanh bao gồm dịch vụ việc làm, kèm bản dịch tiếng Việt; 01 bản sao thỏa thuận hợp tác giữa tổ chức dịch vụ với người sử dụng lao động về việc tuyển dụng lao động Việt Nam hoặc văn bản của người sử dụng lao động đề nghị tổ chức dịch vụ việc làm chuẩn bị nguồn hoặc tuyển dụng lao động Việt Nam, kèm bản dịch tiếng Việt; Tài liệu chứng minh đối với người sử dụng lao động quy định tại điểm a khoản này. 4. Phương án chuẩn bị nguồn lao động bao gồm các nội dung sau: a) Số lượng lao động dự kiến (tối đa bằng số lượng nêu tại điểm a khoản 2 Điều này); ngành nghề; giới tính; trình độ, kỹ năng nghề và ngoại ngữ của người lao động; b) Phương thức chuẩn bị nguồn: Sơ tuyển (nếu có): Thời gian bắt đầu sơ tuyển, địa điểm sơ tuyển;'
      trang_pdf: 15
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 17
      noi_dung: '64 CÔNG BÁO/Số 887 + 888/Ngày 15-7-2025 Dự kiến bồi dưỡng kỹ năng nghề (nếu có): Thời gian (thời điểm bắt đầu, thời điểm kết thúc), địa điểm, hình thức bồi dưỡng (trực tiếp/liên kết); Dự kiến bồi dưỡng ngoại ngữ (nếu có): Thời gian (thời điểm bắt đầu, thời điểm kết thúc), địa điểm, hình thức bồi dưỡng (trực tiếp/liên kết). 5. Văn bản cam kết của doanh nghiệp dịch vụ về việc ưu tiên tuyển chọn người lao động đã tham gia hoạt động chuẩn bị nguồn lao động. Chương IV TỔ CHỨC THỰC HIỆN'
      trang_pdf: 16
      sha256_pdf: a02a2320858e20956306e3f9aff617a31f2ca30af38a8fedee9cb1a34b4d57e6
    - dieu: 18
      noi_dung: 'Điều 18. Điều khoản thi hành 1. Thông tư này có hiệu lực từ ngày 01 tháng 7 năm 2025. 2. Đối với các hồ sơ đã được cơ quan, đơn vị, tổ chức, cá nhân triển khai thực hiện trước ngày Thông tư này có hiệu lực và thuộc phạm vi điều chỉnh tại Điều 1 Thông tư này thì tiếp tục thực hiện theo quy định tại văn bản quy phạm pháp luật liên quan về phân cấp, phân quyền trước đó cho đến khi nhiệm vụ, công việc được hoàn thành. 3. Đối với những nhiệm vụ, thẩm quyền có thủ tục hành chính, cơ quan, tổ chức, người tiếp nhận nhiệm vụ, thẩm quyền thực hiện thủ tục hành chính như đối với thủ tục hành chính hiện hành, trừ trường hợp được quy định cụ thể tại Thông tư này. Trên cơ sở thủ tục hành chính hiện hành, Ủy ban nhân dân cấp tỉnh có thể quy định cụ thể phù hợp với tình hình địa phương, bảo đảm không làm tăng thêm thủ tục thành phần hồ sơ, thời hạn, chi phí giải quyết thủ tục hành chính. 4. Thay thế cụm từ “Ủy ban nhân dân cấp huyện” bằng cụm từ “Ủy ban nhân dân cấp xã” tại điểm a, b khoản 4 Điều 4 Thông tư số 17/2014/TTLT-BLĐTBXH-BTC. 5. Bãi bỏ một số nội dung của các Thông tư, Thông tư liên tịch sau: a) Khoản 2, 3 Điều 7 Thông tư số 11/2017/TT-BLĐTBXH ngày 20 tháng 4 năm 2017 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội hướng dẫn thực hiện một số điều của Nghị định số 61/2015/NĐ-CP ngày 09 tháng 7 năm 2015 của Chính phủ quy định về chính sách hỗ trợ tạo việc làm và quỹ quốc gia về việc làm về chính sách việc làm công;'
      trang_pdf: 16
