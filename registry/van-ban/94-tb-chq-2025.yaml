xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/18/VB_94.pdf, id=99620, SHA-256 a611c87ab8ff3656c2ad285148a3e87ff6c192e52e41e24bc812dbd323ee61b1): Thông báo số 94/TB-CHQ ngày 12-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ cổng nối truyền dẫn tín hiệu và cấp điện cho bảng giá điện tử ESL dạng thanh ray (tên thương mại Power Rail Gateway Set / Power Rail Gateway + Rail, ký mã hiệu ER100XABX0/WWW; cấu tạo gồm thanh ray nhựa ABS gắn thanh cái Busbar có 04 dải tiếp điểm bằng đồng chạy dọc chiều dài thanh ray và cổng nối Power Rail Gateway tích hợp IC bộ nhớ Flash, bộ vi điều khiển MCU truyền nhận Bluetooth năng lượng thấp BLE 2.4GHz, khối UART, đèn LED và 4 chân tiếp điểm GND/SDA/SCL/VCC giao tiếp I2C; dùng gắn bảng giá điện tử ESL, nhận nguồn 3V từ bộ pin ngoài và truyền dẫn tín hiệu hiển thị từ máy chủ qua Gateway tới bảng giá điện tử ESL), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Bộ cổng nối truyền dẫn tín hiệu và cấp điện cho bảng giá điện tử ESL dạng thanh ray (Power Rail Gateway Set / Power Rail Gateway + Rail, ký mã hiệu ER100XABX0/WWW, gồm thanh ray nhựa ABS gắn thanh cái Busbar 4 dải tiếp điểm đồng và cổng nối Power Rail Gateway tích hợp MCU BLE 2.4GHz giao tiếp I2C dùng cấp điện và truyền dẫn tín hiệu hiển thị cho bảng giá điện tử ESL) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
