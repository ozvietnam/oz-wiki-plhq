xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo CDN (Số 1495+1496 ngày 26-12-2024, 4 Điều + Phụ lục): sửa đổi khoản 2, khoản 3 Điều 5, bãi bỏ khoản 5 Điều 5, Điều 6, khoản 1 Điều 13 và Phụ lục I, thay thế Mẫu số 01, Mẫu số 02 Phụ lục III của TT 26/2018/TT-BLĐTBXH; có hiệu lực từ 2025-02-01 (Điều 4 khoản 1); hết hiệu lực từ 2026-07-28 do bị thay thế bởi 16/2026/TT-BNV (Điều 7 khoản 2 điểm c TT 16/2026/TT-BNV)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Sửa đổi, bổ sung khoản 2 Điều 5 Thông tư số 26/2018/TT-BLĐTBXH như sau: “2. Nguyên tắc, trình tự, hồ sơ, xử lý hồ sơ công bố hợp quy, trách nhiệm của tổ chức, cá nhân công bố hợp quy được thực hiện theo quy định tại Thông tư số 28/2012/TT-BKHCN ngày 12 tháng 12 năm 2012 của Bộ trưởng Bộ Khoa học và Công nghệ quy định về công bố hợp chuẩn, công bố hợp quy và phương thức đánh giá sự phù hợp với tiêu chuẩn, quy chuẩn kỹ thuật được sửa đổi, bổ sung bởi Thông tư số 02/2017/TT-BKHCN ngày 31 tháng 3 năm 2017 của Bộ trưởng Bộ Khoa học và Công nghệ sửa đổi, bổ sung một số điều của Thông tư số 28/2012/TT-BKHCN ngày 12 tháng 12 năm 2012 của Bộ trưởng Bộ Khoa học và Công nghệ quy định về công bố hợp chuẩn, công bố hợp quy và phương thức đánh giá sự phù hợp với tiêu chuẩn, quy chuẩn kỹ thuật.”'
      trang_pdf: 2
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 1
      khoan: 2
      noi_dung: '2. Sửa đổi, bổ sung khoản 3 Điều 5 Thông tư số 26/2018/TT-BLĐTBXH như sau: “3. Khi công bố hợp quy, tổ chức, cá nhân sản xuất các sản phẩm, hàng hóa nhóm 2 thuộc trách nhiệm quản lý nhà nước của Bộ Lao động - Thương binh và Xã hội phải đăng ký bản công bố hợp quy tại Sở Lao động - Thương binh và Xã hội nơi tổ chức, cá nhân đó đăng ký hoạt động sản xuất, kinh doanh theo quy định tại khoản 2 Điều 14 Nghị định số 127/2007/NĐ-CP ngày 01 tháng 8 năm 2007 của Chính phủ quy định chi tiết thi hành một số điều của Luật Tiêu chuẩn và Quy chuẩn kỹ thuật.”'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 2
      noi_dung: 'Điều 2. Bãi bỏ khoản 5 Điều 5, Điều 6, khoản 1 Điều 13 và Phụ lục I của Thông tư số 26/2018/TT-BLĐTBXH.'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 3
      noi_dung: 'Điều 3. Thay thế Mẫu số 01, Mẫu số 02 của Phụ lục III ban hành kèm theo Thông tư số 26/2018/TT-BLĐTBXH bằng Mẫu số 01, Mẫu số 02 của Phụ lục ban hành kèm theo Thông tư này.'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 4
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực thi hành kể từ ngày 01/02/2025.'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 4
      khoan: 2
      noi_dung: '2. Các hồ sơ công bố hợp quy được tiếp nhận theo quy định tại Thông tư số 26/2018/TT-BLĐTBXH trước thời điểm Thông tư này có hiệu lực thi hành thì thực hiện theo quy định tại Thông tư số 26/2018/TT-BLĐTBXH.'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
    - dieu: 4
      khoan: 3
      noi_dung: '3. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, các cơ quan, tổ chức, cá nhân phản ánh về Bộ Lao động - Thương binh và Xã hội để nghiên cứu, giải quyết./.'
      trang_pdf: 3
      sha256_pdf: be3f9d182844a013a56fc2e792b30f9b72173add145bb657bde709a957d9c859
