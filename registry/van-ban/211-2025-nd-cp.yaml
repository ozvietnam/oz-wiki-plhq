ghi_chu: 'Đã chuẩn hóa trường ten theo đúng trích yếu trên Công báo (bỏ tiền tố thừa "Nghị định số 211/2025/NĐ-CP của Chính phủ: "). Các văn bản hết hiệu lực theo khoản 2 Điều 12 (58/2016/NĐ-CP, 53/2018/NĐ-CP, 32/2023/NĐ-CP), các văn bản được sửa đổi, bổ sung tại Điều 11 (15/2020/NĐ-CP, 14/2022/NĐ-CP) và văn bản căn cứ (Luật An toàn thông tin mạng số 86/2015/QH13) chưa mở mục riêng trong registry/van-ban/ nên ghi nhận đầy đủ tại pham_vi, không đưa vào quan_he để tránh tham chiếu treo. Lưu ý nghiệp vụ XNK từ ngày 01-09-2026: Chính phủ đã ban hành Nghị định số 341/2026/NĐ-CP ngày 01-09-2026 quy định về hoạt động mật mã dân sự (thi hành khoản 5 Điều 28 Luật An ninh mạng số 116/2025/QH15, docid=219343, Công báo Số 506 ngày 11-09-2026 — chưa mở mục trong sổ) có hiệu lực từ 01-09-2026 kèm Phụ lục I, II, III mới về Danh mục sản phẩm mật mã dân sự xuất khẩu, nhập khẩu theo giấy phép và quy định chuyển tiếp tại Điều 18 (giấy phép cấp trước 01-07-2026 tiếp tục sử dụng đến hết thời hạn ghi trên giấy phép), trong khi Điều 17 NĐ 341/2026/NĐ-CP không bãi bỏ tường minh NĐ 211/2025/NĐ-CP và Chương IV (Điều 11) của NĐ 211/2025/NĐ-CP sửa đổi NĐ 15/2020/NĐ-CP vẫn giữ nguyên hiệu lực.'
