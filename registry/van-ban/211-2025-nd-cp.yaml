xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo Số 1053 + 1054 ngày 10-08-2025 (có lớp chữ, lưu tại raw/download/congbaocdn.chinhphu.vn/211-2025-nd-cp.pdf) và tệp ký số 211-ndcp.signed.pdf trên vanban.chinhphu.vn (docid=214736): số hiệu 211/2025/NĐ-CP, trích yếu "Quy định về hoạt động mật mã dân sự và sửa đổi, bổ sung một số điều của Nghị định số 15/2020/NĐ-CP ngày 03 tháng 02 năm 2020 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực bưu chính, viễn thông, tần số vô tuyến điện, công nghệ thông tin và giao dịch điện tử được sửa đổi, bổ sung một số điều tại Nghị định số 14/2022/NĐ-CP ngày 27 tháng 01 năm 2022 của Chính phủ", ngày ký 25-07-2025, người ký Thủ tướng Phạm Minh Chính (căn cứ Luật An toàn thông tin mạng ngày 19-11-2015 và Luật Xử lý vi phạm hành chính 2012 sửa đổi 2020, 2025). Cấu trúc 5 Chương / 14 Điều / 3 Phụ lục: Chương I (Đ1–3) Quy định chung; Chương II (Đ4–7) Quản lý kinh doanh sản phẩm, dịch vụ mật mã dân sự và xuất khẩu, nhập khẩu sản phẩm mật mã dân sự; Chương III (Đ8–10) Quản lý nghiên cứu, sản xuất, sử dụng sản phẩm mật mã dân sự và đánh giá sự phù hợp đối với sản phẩm mật mã dân sự; Chương IV (Đ11) Sửa đổi, bổ sung một số điều của Nghị định số 15/2020/NĐ-CP được sửa đổi, bổ sung tại Nghị định số 14/2022/NĐ-CP (sửa đổi, bổ sung các Điều 3, 93a, 93b, 114, 114a, 115, 116, 117, 118, 119, 120, 121); Chương V (Đ12–14) Điều khoản thi hành; Phụ lục I (Danh mục sản phẩm, dịch vụ mật mã dân sự), Phụ lục II (Danh mục sản phẩm mật mã dân sự xuất khẩu, nhập khẩu theo giấy phép — 34 dòng mã HS thuộc các nhóm 8443, 8471, 8517, 8523, 8525, 8526, 8528, 8529, 8542, 8543), Phụ lục III (Biểu mẫu hồ sơ, giấy phép). Trích nguyên văn Chương V — Điều khoản thi hành: Điều 12 (Hiệu lực thi hành): "1. Nghị định này có hiệu lực thi hành từ ngày 09 tháng 9 năm 2025. 2. Nghị định số 58/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ quy định chi tiết về kinh doanh sản phẩm, dịch vụ mật mã dân sự và xuất khẩu, nhập khẩu sản phẩm mật mã dân sự; Nghị định số 53/2018/NĐ-CP ngày 16 tháng 4 năm 2018 của Chính phủ sửa đổi, bổ sung Nghị định số 58/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ quy định chi tiết về kinh doanh sản phẩm, dịch vụ mật mã dân sự và xuất khẩu, nhập khẩu sản phẩm mật mã dân sự và Nghị định số 32/2023/NĐ-CP ngày 09 tháng 6 năm 2023 của Chính phủ sửa đổi, bổ sung Nghị định số 53/2018/NĐ-CP ngày 16 tháng 4 năm 2018 của Chính phủ sửa đổi, bổ sung Nghị định số 58/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ quy định chi tiết về kinh doanh sản phẩm, dịch vụ mật mã dân sự và xuất khẩu, nhập khẩu sản phẩm mật mã dân sự hết hiệu lực kể từ ngày Nghị định này có hiệu lực." Điều 13 (Quy định chuyển tiếp, khoản 1–4): Giấy phép kinh doanh sản phẩm, dịch vụ mật mã dân sự và Giấy phép xuất khẩu, nhập khẩu sản phẩm mật mã dân sự đã cấp trước ngày 09-09-2025 tiếp tục có giá trị theo thời hạn ghi trên giấy phép; hồ sơ tiếp nhận trước ngày 09-09-2025 giải quyết theo NĐ 58/2016/NĐ-CP, 53/2018/NĐ-CP, 32/2023/NĐ-CP. Điều 14 (Trách nhiệm thi hành): "Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân cấp tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn (id=45739), vanban.chinhphu.vn (docid=214736) và đối chiếu trực tiếp toàn văn ký số Nghị định số 341/2026/NĐ-CP ngày 01-09-2026 quy định về hoạt động mật mã dân sự (docid=219343, Công báo Số 506 ngày 11-09-2026, hướng dẫn Luật An ninh mạng số 116/2025/QH15): Chương V (Điều 17 Hiệu lực thi hành, Điều 18 Quy định chuyển tiếp, Điều 19 Trách nhiệm thi hành) của NĐ 341/2026/NĐ-CP chỉ quy định "Nghị định này có hiệu lực thi hành kể từ ngày 01 tháng 9 năm 2026", không có điều khoản bãi bỏ hay thay thế tường minh đối với NĐ 211/2025/NĐ-CP; đồng thời toàn bộ Chương IV (Điều 11) của NĐ 211/2025/NĐ-CP sửa đổi, bổ sung NĐ 15/2020/NĐ-CP và NĐ 14/2022/NĐ-CP về xử phạt vi phạm hành chính vẫn đang có hiệu lực nguyên vẹn và không thuộc phạm vi điều chỉnh của NĐ 341/2026/NĐ-CP. Vì vậy trên cổng Công báo và Cổng TTĐT Chính phủ, NĐ 211/2025/NĐ-CP đang ở trạng thái CON_HIEU_LUC.'
  hieu_luc_da_doi_chieu: true
