    truy_cap: '2026-11-06'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Tên nguyên văn (dài, trích nguyên văn dòng tiêu đề), cơ quan (CP, Thủ tướng Phạm Minh Chính ký), ngày ban hành 25/07/2025, ngày hiệu lực 09/09/2025 xác minh trực tiếp tại vanban.chinhphu.vn. Nội dung giấy phép XNK sản phẩm mật mã dân sự (Phụ lục II — phải trùng cả mã HS, mô tả hàng hoá và đặc tính kỹ thuật mật mã; giấy phép của Ban Cơ yếu Chính phủ) theo Thư viện Pháp luật, báo Chính phủ, ExtendMax (nguồn thứ cấp). Chưa khẳng định chắc tình trạng hiện tại: từ 01/09/2026 có NĐ 341/2026/NĐ-CP quy định lại cùng lĩnh vực (thi hành Luật An ninh mạng về MMDS, hiệu lực ngay 01/09/2026) nhưng điều khoản thi hành của 341/2026 không dùng chữ "bãi bỏ" và không nêu đích danh 211/2025 (theo phân tích nguồn thứ cấp); vanban.chinhphu.vn đang bảo trì nên chưa đọc được điều khoản bãi bỏ của văn bản gốc 341/2026.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Nhu cầu ghi "211/2025/N" (khuyết chữ hiệu) — đã hiệu đính thành 211/2025/NĐ-CP theo nguồn chính thống. Liên quan XNK: sản phẩm mật mã dân sự (mã hoá) nhập khẩu thuộc Phụ lục II phải có giấy phép XNK của Ban Cơ yếu Chính phủ — thủ tục kiểm tra chuyên ngành/giấy phép khách XNK hay vướng khi khai báo máy mã hoá, modem, thiết bị an ninh mạng. Lưu ý theo dõi NĐ 341/2026/NĐ-CP (hiệu lực 01/09/2026, thời hạn giấy phép XNK 3 năm) — nhiều khả năng thay phần lớn nội dung substantive của NĐ này.'
