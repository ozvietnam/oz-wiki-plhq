xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=162374): ban hành 11-11-2011, hiệu lực 01-07-2012; toàn văn Điều 1-70 từ tệp .doc gốc datafiles.chinhphu.vn (raw/download/datafiles.chinhphu.vn/luat-khieu-nai-02-2011.doc, wiki/sources/02-2011-qh13.md); đối chiếu còn hiệu lực sau sửa đổi bởi Luật 42/2013/QH13 và Luật 81/2025/QH15'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về khiếu nại và giải quyết khiếu nại đối với quyết định hành chính, hành vi hành chính của cơ quan hành chính nhà nước, của người có thẩm quyền trong cơ quan hành chính nhà nước; khiếu nại và giải quyết khiếu nại quyết định kỷ luật cán bộ, công chức; tiếp công dân; quản lý và giám sát công tác giải quyết khiếu nại.
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này các từ ngữ dưới đây được hiểu như sau: 1. Khiếu nại là việc công dân, cơ quan, tổ chức hoặc cán bộ, công chức theo thủ tục do Luật này quy định, đề nghị cơ quan, tổ chức, cá nhân có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính của cơ quan hành chính nhà nước, của người có thẩm quyền trong cơ quan hành chính nhà nước hoặc quyết định kỷ luật cán bộ, công chức khi có căn cứ cho rằng quyết'
    - dieu: 3
      noi_dung: Điều 3. Áp dụng pháp luật về khiếu nại và giải quyết khiếu nại 1. Khiếu nại của cơ quan, tổ chức, cá nhân nước ngoài tại Việt Nam và việc giải quyết khiếu nại được áp dụng theo quy định của Luật này, trừ trường hợp điều ước quốc tế mà Cộng hoà xã hội chủ nghĩa Việt Nam là thành viên có quy định khác.
    - dieu: 13
      noi_dung: 'Điều 13. Quyền, nghĩa vụ của người bị khiếu nại 1. Người bị khiếu nại có các quyền sau đây: a) Đưa ra chứng cứ về tính hợp pháp của quyết định hành chính, hành vi hành chính bị khiếu nại; b) Được biết, đọc, sao chụp, sao chép các tài liệu, chứng cứ do người giải quyết khiếu nại thu thập để giải quyết khiếu nại, trừ thông tin, tài liệu thuộc bí mật nhà nước;'
    - dieu: 22
      noi_dung: Điều 22. Thẩm quyền của Thủ trưởng cơ quan thuộc bộ, thuộc cơ quan ngang bộ, thuộc cơ quan thuộc Chính phủ Thủ trưởng cơ quan thuộc bộ, thuộc cơ quan ngang bộ, thuộc cơ quan thuộc Chính phủ (sau đây gọi chung là Thủ trưởng cơ quan thuộc bộ) có thẩm quyền giải quyết khiếu nại đối với quyết định hành chính, hành vi hành chính của mình, của cán bộ, công chức do mình quản lý trực tiếp.
    - dieu: 31
      noi_dung: Điều 31. Quyết định giải quyết khiếu nại lần đầu 1. Người giải quyết khiếu nại lần đầu phải ra quyết định giải quyết khiếu nại.
    - dieu: 41
      noi_dung: Điều 41. Gửi, công bố quyết định giải quyết khiếu nại 1. Trong thời hạn 07 ngày, kể từ ngày có quyết định giải quyết khiếu nại, người giải quyết khiếu nại lần hai phải gửi quyết định giải quyết khiếu nại cho người khiếu nại, người bị khiếu nại, người giải quyết khiếu nại lần đầu, người có quyền, nghĩa vụ liên quan, cơ quan, tổ chức, cá nhân có thẩm quyền chuyển khiếu nại đến.
    - dieu: 50
      noi_dung: 'Điều 50. Thời hạn thụ lý và giải quyết khiếu nại Thời hạn thụ lý và giải quyết khiếu nại lần đầu, lần hai như sau: Trong thời hạn 10 ngày, kể từ ngày nhận được đơn khiếu nại, người có thẩm quyền giải quyết khiếu nại phải thụ lý để giải quyết và thông báo cho người khiếu nại biết.'
    - dieu: 59
      noi_dung: Điều 59. Trụ sở tiếp công dân, địa điểm tiếp công dân 1. Trụ sở tiếp công dân của Đảng và Nhà nước được tổ chức ở trung ương và địa phương để tiếp công dân đến khiếu nại, tố cáo, kiến nghị, phản ánh theo quy định của cơ quan, tổ chức có thẩm quyền. Địa điểm tiếp công dân là nơi tiếp công dân do cơ quan, tổ chức, cá nhân có thẩm quyền bố trí để tiếp công dân đến khiếu nại, tố cáo, kiến nghị, phản ánh theo quy định của pháp luật.
    - dieu: 69
      noi_dung: Điều 69. Hiệu lực thi hành và điều khoản chuyển tiếp 1. Luật này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2012. Những quy định về khiếu nại và giải quyết khiếu nại trong Luật khiếu nại, tố cáo số 09/1998/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 26/2004/QH11 và Luật số 58/2005/QH11 hết hiệu lực thi hành kể từ ngày Luật này có hiệu lực.
ghi_chu: Sửa đổi bởi Luật 42/2013/QH13 (Điều 75, 78 — chưa nạp) và Luật 81/2025/QH15 (chưa nạp) — vẫn còn hiệu lực theo bản đã sửa.
