  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/9/424VB_22776.pdf, id=106320, SHA-256 64d81ef17d19ea6d10563e1ac047fd0db2569a7dd00a9bfb306fc9b6fb16ba00): Thông báo số 22776/TB-CHQ ngày 09-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị điện tử đặt chân iTera-Bio Foot Massager Model JC-02A (vỏ nhựa ABS, kích thước 371 x 379,5 x 212,5 mm, trọng lượng khoảng 4,7 kg, điện áp định mức 220-240V, tần số 50/60Hz, công suất định mức 245W; cấu tạo gồm cụm tạo trường điện xoay chiều dạng tiếp xúc qua hai tấm kim loại trên khay đặt chân, kết hợp màng gia nhiệt bố trí dưới tấm kim loại làm ấm vùng bàn chân, bộ phát ion âm > 10.000.000 ions/cm3 và chức năng Terahertz bổ trợ; không có cơ cấu massage cơ học như động cơ rung, con lăn hay túi khí, dùng thư giãn và chăm sóc cơ thể tại nhà, không dùng để chẩn đoán hay điều trị bệnh), phân loại vào nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90; có hiệu lực từ ngày ký'
