ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị điện tử đặt chân iTera-Bio Foot Massager Model JC-02A (điện áp 220-240V, tần số 50/60Hz, công suất 245W, vỏ nhựa ABS, trọng lượng khoảng 4,7 kg; sử dụng đầu ra trường điện xoay chiều dạng tiếp xúc qua hai tấm kim loại trên khay đặt chân kết hợp màng gia nhiệt dưới tấm kim loại, bộ phát ion âm và chức năng Terahertz để làm ấm vùng bàn chân, thư giãn tại nhà; không có động cơ rung, con lăn hay túi khí) thuộc nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90.'
