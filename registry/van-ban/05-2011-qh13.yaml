  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hoạt động cơ yếu; nhiệm vụ, quyền hạn, nguyên tắc tổ chức và hoạt động của lực lượng cơ yếu; chế độ, chính sách đối với người làm việc trong tổ chức cơ yếu; quyền, nghĩa vụ, trách nhiệm của cơ quan, tổ chức, cá nhân liên quan đến hoạt động cơ yếu.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức cơ yếu, người làm việc trong tổ chức cơ yếu và cơ quan, tổ chức, cá nhân liên quan đến hoạt động cơ yếu.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Hoạt động cơ yếu là hoạt động cơ mật đặc biệt, thuộc lĩnh vực an ninh quốc gia, sử dụng nghiệp vụ mật mã, kỹ thuật mật mã và các giải pháp có liên quan để bảo vệ thông tin bí mật nhà nước, do lực lượng chuyên trách đảm nhiệm.'
      trang_pdf: 1
    - dieu: 9
      noi_dung: Điều 9. Mã hoá thông tin bí mật nhà nước 1. Thông tin bí mật nhà nước được truyền bằng các phương tiện thông tin, viễn thông phải được mã hóa bằng mật mã của cơ yếu. 2. Thông tin bí mật nhà nước lưu giữ trong các phương tiện thiết bị điện tử, tin học và trên mạng viễn thông được mã hoá bằng mật mã của cơ yếu. Chính phủ quy định loại thông tin bí mật nhà nước cần được mã hóa quy định tại khoản này.
      trang_pdf: 1
    - dieu: 13
      noi_dung: Điều 13. Sản xuất và cung cấp sản phẩm mật mã 1. Nhà nước độc quyền sản xuất và cung cấp sản phẩm mật mã cho các cơ quan, tổ chức để bảo vệ thông tin bí mật nhà nước. 2. Ban Cơ yếu Chính phủ xây dựng kế hoạch, tổ chức sản xuất, cung cấp sản phẩm mật mã và trực tiếp quản lý các cơ sở sản xuất mật mã để bảo vệ thông tin bí mật nhà nước.
      trang_pdf: 1
    - dieu: 18
      noi_dung: Điều 18. Triển khai sản phẩm mật mã bảo vệ thông tin bí mật nhà nước lưu giữ trong các thiết bị điện tử, tin học và trên mạng viễn thông 1. Cơ quan, tổ chức, cá nhân có thông tin bí mật nhà nước lưu giữ trong các thiết bị điện tử, tin học và trên mạng viễn thông quy định tại khoản 2 Điều 9 của Luật này phải có văn bản yêu cầu triển khai sản phẩm mật mã gửi tổ chức cơ yếu có thẩm quyền.
      trang_pdf: 1
    - dieu: 22
      noi_dung: 'Điều 22. Tổ chức của lực lượng cơ yếu 1. Ban Cơ yếu Chính phủ. 2. Cơ yếu các bộ, ngành bao gồm: a) Hệ thống tổ chức cơ yếu Quân đội nhân dân; b) Hệ thống tổ chức cơ yếu Công an nhân dân; c) Hệ thống tổ chức cơ yếu Ngoại giao; d) Hệ thống tổ chức cơ yếu trong cơ quan của Đảng, cơ quan khác của Nhà nước ở trung ương và địa phương.'
      trang_pdf: 1
    - dieu: 27
      noi_dung: Điều 27. Hạn tuổi phục vụ của người làm công tác cơ yếu 1. Hạn tuổi phục vụ của người làm công tác cơ yếu là quân nhân, Công an nhân dân thực hiện theo quy định của pháp luật về Quân đội nhân dân và Công an nhân dân. Người làm công tác cơ yếu không phải là quân nhân, Công an nhân dân thực hiện theo quy định của Bộ luật lao động.
      trang_pdf: 1
    - dieu: 31
      noi_dung: Điều 31. Chế độ, chính sách đối với người làm công tác cơ yếu 1. Người làm công tác cơ yếu là quân nhân, Công an nhân dân được hưởng chế độ tiền lương và phụ cấp, các chế độ, chính sách khác theo quy định đối với Quân đội nhân dân, Công an nhân dân.
      trang_pdf: 1
    - dieu: 37
      noi_dung: Điều 37. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 02 năm 2012. Pháp lệnh cơ yếu số 33/2001/PL-UBTVQH10 hết hiệu lực kể từ ngày Luật này có hiệu lực.
      trang_pdf: 1
ghi_chu: Luật Cơ yếu năm 2011 — căn cứ pháp lý được viện dẫn tại các thông tư của Bộ Quốc phòng về quản lý sản phẩm mật mã dân sự xuất khẩu, nhập khẩu.
