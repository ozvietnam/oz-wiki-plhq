ghi_chu: 'Xác định trước mã số mặt hàng Hương vải (tên thương mại LYCHEE FLAVOR S2313394, ký mã hiệu S2313394, dạng chất lỏng không màu đến vàng nhạt, thành phần Propylene glycol 80-100%, hương liệu 5-10% gồm Ketones ~ Ethyl maltol và Acids ~ Isobutyric acid, tỷ trọng riêng 1,0298-1,0498 ở 20 độ C, dùng làm hương liệu trong sản xuất bánh ngọt nhân kem, kẹo) thuộc nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30.'
