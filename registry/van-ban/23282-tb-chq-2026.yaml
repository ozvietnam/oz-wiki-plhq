  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/22/VB_23282.pdf, id=106463, SHA-256 1a14449ef1a42d16bf28b4665ac6f3bb29dd2e37858bcc04c58e0ec704eb7b3f): Thông báo số 23282/TB-CHQ ngày 21-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Hương vải (LYCHEE FLAVOR S2313394, thành phần Propylene glycol 80-100%, hương liệu 5-10%, dạng chất lỏng không màu đến vàng nhạt, không chứa cồn, dùng làm hương liệu trong sản xuất bánh ngọt nhân kem, kẹo), phân loại vào nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30; có hiệu lực kể từ ngày ban hành'
