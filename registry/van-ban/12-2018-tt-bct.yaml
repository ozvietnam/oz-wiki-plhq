ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 37 mã HS). Tiêu đề đã đối chiếu (congbao.chinhphu.vn). Sửa số hiệu: biểu thuế (enrichment) ghi nhầm "12/2018/TT-BTC"; văn bản đúng là 12/2018/TT-BCT của Bộ Công Thương (quy định chi tiết Luật Quản lý ngoại thương và NĐ 69/2018/NĐ-CP) — theo ghi chú đã đối chiếu của hs-code-api. GHI CHÚ NGHIỆP VỤ (hs-code-api): TYPO trong enrichment: Gemini ghi ''12/2018/TT-BTC'' nhưng văn bản đúng là 12/2018/TT-BCT (Bộ Công Thương). Cite ở HS 1701/2401 (hạn ngạch thuế quan đường/thuốc lá) — đúng phạm vi 12/2018/TT-BCT. TT-BTC thật là về giám sát tài chính TCTD, không liên quan HS. Đã đối chiếu PDF Công báo: hiệu lực từ ngày ký 15-06-2018 (sửa từ 30-07-2018 trên sổ cũ). Bị TT 48/2026/TT-BCT bãi bỏ từ 05-09-2026 (Điều 20 khoản 2 điểm đ); ghi HET_HIEU_LUC_MOT_PHAN và het_hieu_luc_tu 31-12-2026 vì Phụ lục I còn áp dụng chuyển tiếp đến hết ngày đó (Điều 21 khoản 3); giấy phép đã cấp theo TT 12/2018 trước 05-09-2026 tiếp tục thực hiện theo thời hạn (Điều 21 khoản 1). Mọi nội dung khác (thủ tục cấp phép…) từ 05-09-2026 theo TT 48/2026.'
