  pham_vi: 'PDF Công báo CDN; Điều 17 khoản 1 hiệu lực kể từ ngày ký (15-06-2018); khoản 2 bãi bỏ 04/2014, 11/2017, 49/2015 TT-BCT; tình trạng hiện tại: Điều 20 khoản 2 điểm đ TT 48/2026/TT-BCT (PDF Công báo số 521 ngày 23-09-2026, tr. 59) bãi bỏ toàn bộ TT 12/2018 từ 05-09-2026; Điều 21 khoản 3 cho Phụ lục I (danh mục thiết bị y tế đã qua sử dụng cấm nhập khẩu, sửa bởi Phụ lục I TT 08/2023) tiếp tục thực hiện đến hết 31-12-2026'
