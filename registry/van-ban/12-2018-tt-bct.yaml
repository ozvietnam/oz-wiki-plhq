xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo CDN; Điều 17 khoản 1 hiệu lực kể từ ngày ký (15-06-2018); khoản 2 bãi bỏ 04/2014, 11/2017, 49/2015 TT-BCT; tình trạng hiện tại: Điều 20 khoản 2 điểm đ TT 48/2026/TT-BCT (PDF Công báo số 521 ngày 23-09-2026, tr. 59) bãi bỏ toàn bộ TT 12/2018 từ 05-09-2026; Điều 21 khoản 3 cho Phụ lục I (danh mục thiết bị y tế đã qua sử dụng cấm nhập khẩu, sửa bởi Phụ lục I TT 08/2023) tiếp tục thực hiện đến hết 31-12-2026'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-04'
  boi: claude-code@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Chi tiết Danh mục hàng tiêu dùng, thiết bị y tế, phương tiện đã qua sử dụng cấm nhập khẩu theo mã số hàng hóa (mã HS) thuộc thẩm quyền quản lý của Bộ Công Thương.'
      trang_pdf: 1
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 1
      khoan: 2
      noi_dung: '2. Chi tiết Danh mục hàng hóa tạm ngừng kinh doanh tạm nhập, tái xuất, chuyển khẩu theo mã HS.'
      trang_pdf: 1
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với thương nhân Việt Nam; tổ chức, cá nhân có liên quan đến hoạt động ngoại thương theo quy định tại Luật Quản lý ngoại thương.'
      trang_pdf: 2
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 3
      noi_dung: 'Điều 3. Danh mục hàng hóa cấm nhập khẩu Ban hành chi tiết Danh mục hàng tiêu dùng, thiết bị y tế, phương tiện đã qua sử dụng cấm nhập khẩu theo mã HS thuộc thẩm quyền quản lý của Bộ Công Thương tại Phụ lục I kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 4
      noi_dung: 'Điều 4. Danh mục hàng hóa tạm ngừng kinh doanh tạm nhập, tái xuất, chuyển khẩu 1. Ban hành chi tiết Danh mục hàng hóa tạm ngừng kinh doanh tạm nhập, tái xuất, chuyển khẩu theo mã HS tại Phụ lục II kèm theo Thông tư này. 2. Danh mục hàng hóa quy định tại khoản 1 Điều này không áp dụng đối với trường hợp kinh doanh chuyển khẩu theo hình thức hàng hóa được vận chuyển thẳng từ nước xuất khẩu đến nước nhập khẩu, không qua cửa khẩu Việt Nam.'
      trang_pdf: 2
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 11
      noi_dung: 'Điều 11. Danh mục hàng hóa quản lý theo hạn ngạch thuế quan nhập khẩu Mã HS STT Tên hàng hóa (Áp dụng đối với toàn bộ các mã 8 số thuộc nhóm 4 số) 1 Đường tinh luyện, đường thô 1701 2 Muối 2501 3 Thuốc lá nguyên liệu 2401 4 Trứng gia cầm 0407 (Không bao gồm trứng đã thụ tinh để ấp thuộc các mã HS: 04071110, 04071190, 04071911, 04071919, 04071991 và 04071999)'
      trang_pdf: 5
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 14
      noi_dung: 'Điều 14. Đối tượng được xem xét cấp Giấy phép nhập khẩu theo hạn ngạch thuế quan 1. Đối với mặt hàng thuốc lá nguyên liệu: Thương nhân có giấy phép sản xuất thuốc lá điếu do Bộ Công Thương cấp và có nhu cầu sử dụng thuốc lá nguyên liệu nhập khẩu cho sản xuất thuốc lá điếu. 2. Đối với mặt hàng muối: Thương nhân có nhu cầu sử dụng muối cho sản xuất được cơ quan quản lý chuyên ngành xác nhận. 3. Đối với mặt hàng trứng gia cầm: Thương nhân có nhu cầu nhập khẩu trứng gia cầm. 4. Đối với mặt hàng đường tinh luyện, đường thô: Thực hiện theo hướng dẫn hàng năm của Bộ Công Thương trên cơ sở trao đổi ý kiến với Bộ Nông nghiệp và Phát triển nông thôn, Bộ Tài chính. 5. Bộ Công Thương xác định thời điểm phân giao hạn ngạch thuế quan đối với mặt hàng quy định tại khoản 1 Điều này. Đối với các mặt hàng quy định tại khoản 2, khoản 3, khoản 4 Điều này, Bộ Công Thương trao đổi với Bộ Nông nghiệp và Phát triển nông thôn, Bộ Tài chính để xác định thời điểm phân giao hạn ngạch thuế quan.'
      trang_pdf: 6
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
    - dieu: 17
      noi_dung: 'Điều 17. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày ký. 2. Thông tư này bãi bỏ các văn bản sau đây: a) Thông tư số 04/2014/TT-BCT ngày 27 tháng 01 năm 2014 của Bộ Công Thương quy định chi tiết thi hành một số điều của Nghị định số 187/2013/NĐ-CP ngày 20 tháng 11 năm 2013 của Chính phủ quy định chi tiết thi hành Luật Thương mại về hoạt động mua bán hàng hóa quốc tế và các hoạt động đại lý mua, bán, gia công và quá cảnh hàng hóa với nước ngoài; b) Thông tư số 11/2017/TT-BCT ngày 28 tháng 7 năm 2017 của Bộ Công Thương quy định hoạt động tạm nhập, tái xuất, tạm xuất, tái nhập, chuyển khẩu hàng hóa; c) Thông tư số 49/2015/TT-BCT ngày 21 tháng 12 năm 2015 của Bộ Công Thương quy định về hoạt động sản xuất, gia công xuất khẩu quân phục cho các lực lượng vũ trang nước ngoài. 3. Trong quá trình thực hiện Thông tư này, nếu phát sinh vướng mắc, thương nhân, các cơ quan, tổ chức có liên quan phản ánh bằng văn bản về Bộ Công Thương để xử lý./.'
      trang_pdf: 8
      sha256_pdf: 7ed1c0f70a5fc0a9ad835cbe87bf17d67cb1be6328c49f70fe62432ef731951f
ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 37 mã HS). Tiêu đề đã đối chiếu (congbao.chinhphu.vn). Sửa số hiệu: biểu thuế (enrichment) ghi nhầm "12/2018/TT-BTC"; văn bản đúng là 12/2018/TT-BCT của Bộ Công Thương (quy định chi tiết Luật Quản lý ngoại thương và NĐ 69/2018/NĐ-CP) — theo ghi chú đã đối chiếu của hs-code-api. GHI CHÚ NGHIỆP VỤ (hs-code-api): TYPO trong enrichment: Gemini ghi ''12/2018/TT-BTC'' nhưng văn bản đúng là 12/2018/TT-BCT (Bộ Công Thương). Cite ở HS 1701/2401 (hạn ngạch thuế quan đường/thuốc lá) — đúng phạm vi 12/2018/TT-BCT. TT-BTC thật là về giám sát tài chính TCTD, không liên quan HS. Đã đối chiếu PDF Công báo: hiệu lực từ ngày ký 15-06-2018 (sửa từ 30-07-2018 trên sổ cũ). Bị TT 48/2026/TT-BCT bãi bỏ từ 05-09-2026 (Điều 20 khoản 2 điểm đ); ghi HET_HIEU_LUC_MOT_PHAN và het_hieu_luc_tu 31-12-2026 vì Phụ lục I còn áp dụng chuyển tiếp đến hết ngày đó (Điều 21 khoản 3); giấy phép đã cấp theo TT 12/2018 trước 05-09-2026 tiếp tục thực hiện theo thời hạn (Điều 21 khoản 1). Mọi nội dung khác (thủ tục cấp phép…) từ 05-09-2026 theo TT 48/2026. Tra 17-11-2026: không có TT mới thay riêng phần chuyển tiếp TB YT sau 31-12-2026. Tra lại 19-11-2026: xác nhận — phần chuyển tiếp hết hạn đúng kỳ 31-12-2026, khung đã thay bằng TT 48/2026/TT-BCT. Tra lại 20-11-2026: xác nhận — chưa có TT-BCT mới thay riêng phần chuyển tiếp Phụ lục I (tra vanban.chinhphu.vn 50 VB mới nhất 11–17/11/2026, Công báo số 584 ngày 20/11/2026 mục BCT, moit.gov.vn/van-ban-phap-luat tháng 11/2026; TT-BCT XNK gần nhất là 65/2026/TT-BCT ngày 01/10/2026 về kinh doanh XNK gạo theo NĐ 365/2026/NĐ-CP — không liên quan phần chuyển tiếp).'
