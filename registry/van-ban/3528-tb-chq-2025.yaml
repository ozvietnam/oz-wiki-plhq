  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/29/VB_3528.pdf, id=99937, SHA-256 3d90fb7f9e739045c10c20cb5398556cb19189ff1f39ce8d7c472e752b0e6955): Thông báo số 3528/TB-CHQ ngày 26-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ điều khiển phân tán OptiFlexTM Advanced Equipment Controller (tên gọi theo cấu tạo, công dụng: Bộ điều khiển phân tán giám sát và điều khiển từng vùng hoặc thiết bị hệ thống cơ điện tòa nhà giao tiếp mạng LAN Ethernet bằng giao thức BACnet/IP kết nối phần mềm WebCTRL; ký, mã hiệu OF022-E2, nhà sản xuất Automated Logic; tích hợp 2 cổng Ethernet 10/100Mbps, 1 cổng Rnet, 1 cổng USB, 2 ngõ vào đa dụng Universal Input, 2 ngõ ra Analog Output, bộ nhớ Flash 16GB, RAM 512MB, đồng hồ thời gian thực, vỏ nhựa ABS, điện áp 24V AC/DC, kích thước 14.00x14.93x5.11cm, trọng lượng 0.34kg), phân loại vào nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.92; có hiệu lực từ ngày ký'
