ghi_chu: 'Xác định trước mã số mặt hàng Bộ điều khiển phân tán OptiFlexTM Advanced Equipment Controller (ký, mã hiệu OF022-E2, nhà sản xuất Automated Logic; bộ điều khiển phân tán giám sát và điều khiển thiết bị hệ thống cơ điện tòa nhà giao tiếp mạng LAN Ethernet bằng giao thức BACnet/IP kết nối phần mềm WebCTRL; tích hợp 2 cổng Ethernet 10/100Mbps, 1 cổng Rnet, 1 cổng USB, 2 ngõ vào đa dụng Universal Input, 2 ngõ ra Analog Output, bộ nhớ Flash 16GB, RAM 512MB, vỏ nhựa ABS, điện áp 24V AC/DC) thuộc nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.92.'
