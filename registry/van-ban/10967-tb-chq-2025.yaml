  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/30/VB_10967.pdf, id=100492, SHA-256 97b35e63cb43a5ef5ef967dd1cc45ca86ad68eaeb392419d9b39ba932be361e4): Thông báo số 10967/TB-CHQ ngày 30-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Khung điện thoại dạng bán thành phẩm (tên gọi theo cấu tạo, công dụng: Khung điện thoại dạng bán thành phẩm; ký, mã hiệu CNC1; thành phần hợp kim nhôm với Al còn lại, Si 0.5-0.8%, Fe <= 0.2%, Cu 0.55-0.75%, Mn 0.1-0.2%, Mg 0.8-1.05%, Cr <= 0.1%, Zn <= 0.1%, Ti <= 0.1%; kích thước dài 172mm x rộng 86,6mm x cao 8,05mm, khối lượng 0,21kg; bán thành phẩm thuộc giai đoạn thứ 3 qua ép đùn nhôm, mài nhẵn 2 mặt và gia công khoan phay lỗ định vị, dùng đảm bảo cấu trúc tổng thể bên trong và cố định vị trí khung bên ngoài của điện thoại di động), phân loại vào nhóm 76.16, phân nhóm 7616.99, mã số 7616.99.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
