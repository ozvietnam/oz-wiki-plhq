ghi_chu: 'Xác định trước mã số mặt hàng Khung điện thoại dạng bán thành phẩm (ký, mã hiệu CNC1; hợp kim nhôm gồm Al còn lại, Si 0.5-0.8%, Fe <= 0.2%, Cu 0.55-0.75%, Mn 0.1-0.2%, Mg 0.8-1.05%, Cr <= 0.1%, Zn <= 0.1%, Ti <= 0.1%; kích thước 172mm x 86,6mm x 8,05mm, trọng lượng 0,21kg; bán thành phẩm gia công ép đùn, mài nhẵn 2 mặt, khoan phay và khoan lỗ định vị để làm khung điện thoại di động) thuộc nhóm 76.16, phân nhóm 7616.99, mã số 7616.99.90.'
