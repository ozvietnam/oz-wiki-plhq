xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF 47 trang có dấu đỏ và chữ ký xác thực của Thứ trưởng Nguyễn Sinh Nhật Tân ngày 09-06-2026 trên Cổng TTĐT Bộ Công Thương (moit.gov.vn): hợp nhất Thông tư 38/2014/TT-BCT ngày 24-10-2014 (HL 01-11-2014) với 7 Thông tư sửa đổi, bổ sung gồm 28/2017/TT-BCT ngày 08-12-2017 (HL 01-01-2018), 42/2019/TT-BCT ngày 18-12-2019 (HL 01-02-2020), 17/2021/TT-BCT ngày 15-11-2021 (HL 02-01-2022), 18/2025/TT-BCT ngày 13-03-2025 (HL 02-05-2025), 50/2025/TT-BCT ngày 07-11-2025 (HL 01-01-2026), 21/2026/TT-BCT ngày 28-04-2026 (HL 15-06-2026) và 26/2026/TT-BCT ngày 20-05-2026 (HL 20-05-2026); gồm 15 Điều và Phụ lục biểu mẫu (Mẫu số 1 đến Mẫu số 7, 7A, 11, 12)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 12 Thông tư này quy định chỉ tiết một số điều của Nghị định số 83/2014/NĐ-CP ngày 03 tháng 9 năm 2014 của Chính phủ về kinh doanh xăng dầu (Nghị định số 83/2014/NĐ-CP) và Nghị định số 95/NĐ-CP ngày 01 tháng 11 năm 2021 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 83/2014/NĐ-CP ngày 03 tháng 9 năm 2014 của Chính phủ về kinh doanh xăng dầu (Nghị định số 95/2021/NĐ-CP).
      trang_pdf: 3
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ 1. Bên giao đại ly: là thương nhân đầu mối hoặc thương nhân phân phối xăng dầu hoặc tổng đại lý kinh doanh xăng dầu khi giao xăng dầu cho bên đại lý. 2. Bên đại ly: là tổng đại lý kinh doanh xăng dầu hoặc đại lý bán lẻ xăng dầu khi nhận xăng dầu của bên giao đại lý.'
      trang_pdf: 3
    - dieu: 3
      noi_dung: 'Điều 3. Hợp đồng đại lý xăng dầu 1. Hợp đồng đại lý xăng dầu phải được lập thành văn bản, có các nội dung chủ yếu sau: a) Tên, địa chỉ, mã số thuế của bên đại lý và bên giao đại lý; hình thức đại lý; sô lượng, chất lượng, chủng loại xăng dầu, cách thức giao nhận, giá bán, thù lao đại lý; các cam kết khác theo quy định của pháp luật và của Thông tư này;'
      trang_pdf: 5
    - dieu: 6
      noi_dung: Điều 6. Kiểm tra và cấp Giấy xác nhận, Giấy chứng nhan® 1. Thương nhân có nhu cầu cấp mới, cấp bổ sung, sửa déi hoặc cấp lại Giấy xác nhận đủ điều kiện làm thương nhân đầu mối kinh doanh xăng dầu, Giấy xác nhận đủ điều kiện làm thương nhân phân phối xăng dầu; Giấy xác nhận đủ điều kiện làm đại lý bán lẻ xăng dầu; Giấy chứng nhận cửa hàng đủ điều kiện bán lẻ xăng dầu;
      trang_pdf: 6
    - dieu: 8
      noi_dung: 'Điều 8. Thương nhân phân phối xăng dầu Thương nhân phân phối xăng dầu có trách nhiệm: 1. Đăng ký định kỳ hệ thống phân phối xăng dầu với Bộ Công Thương trước ngày 31 tháng 01 hàng năm, theo Mẫu số 1 tại Phụ lục ban hành kèm theo Thông tư này. Khi có sự thay đổi trong hệ thống phân phối xăng dầu của mình, trong vòng mười (10) ngày làm việc từ khi có sự thay đôi, thương nhân phải gửi đăng ký điều chỉnh về Bộ Công Thương.'
      trang_pdf: 10
    - dieu: 10
      noi_dung: 'Điều 10. Đại lý bán lẻ xăng dau Thương nhân là đại lý bán lẻ xăng dầu có trách nhiệm: 1.2° Đăng ký định kỳ hệ thống phân phối xăng dầu của đại ly bán lẻ xăng dầu với Sở Công Thương địa phương nơi thương nhân có hệ thống phân phối trước ngày 10 tháng 01 hàng năm tại biểu số 2 của Mẫu số 1 Phụ lục ban hành kèm theo Thông tư số 38/2014/TT-BCT.'
      trang_pdf: 11
    - dieu: 13
      noi_dung: Điều 13. Xuất khẩu xăng dầu và nguyên liệu 1. Thương nhân đầu mối kinh doanh xăng dầu” chỉ được phép xuất khẩu xăng dầu sau khi Bộ Công Thương chấp thuận. 2. Bộ Công Thương xem xét đề nghị xuất khâu xăng dầu của thương nhân trên cơ sở cân đối nguồn cung, nhu cầu tiêu thụ trong nước, dé đảm bảo việc xuât khẩu không ảnh hưởng đến cung cầu xăng dầu tại thị trường trong nước. 3. Việc xuất khẩu nguyên liệu (không bao gồm xăng dầu) không phải cấp phép.
      trang_pdf: 14
    - dieu: 15
      noi_dung: Điều 15. Sản xuất xăng dầu, nhập khẩu nguyên liệu để sản xuất xăng dầu __ 1, Thương nhân đầu mối sản xuất xăng dầu?! phải đăng ký kế hoạch sản xuât xăng dâu, nhập khâu nguyên liệu dé sản xuất xăng dâu, tiêu thụ sản phâm xăng dâu với Bộ Công Thuong. 2. Việc nhập khẩu nguyên liệu để sản xuất xăng dầu, việc xuất khẩu xăng dầu do thương nhân sản xuất ra thực hiện theo kế hoạch đăng ký và được Bộ Công Thương xác nhận.
      trang_pdf: 16
    - dieu: 17
      noi_dung: Điều 17. Gia công xuất khẩu xăng dầu 1. Chỉ thương nhân đầu mdi sản xuất xăng dau?* được nhận gia công xuất khâu xăng dầu. 2. Trường hợp bên đặt gia công chỉ định bán sản phẩm xăng dầu gia công cho thương nhân Việt Nam để tiêu thụ trong nước, sản phẩm gia công chỉ được bán cho thương nhân đầu mối và tuân thủ các quy định hiện hành về quy chuẩn chất lượng xăng dầu nhập khẩu, lưu thông trên thị trường trong nước.
      trang_pdf: 18
    - dieu: 28
      noi_dung: Điều 28. Điều khoản chuyển tiếp 1. Đôi với hô sơ đề nghị giải quyết thủ tục hành chính thuộc các lĩnh vực được quy định tại Thông tư này đã được cơ quan có thẳm quyền tiếp nhận hoặc đã được đóng dấu bưu chính trước ngày Thông tư này có hiệu lực thì thực hiện theo quy định của pháp luật đang có hiệu lực điều chỉnh trong lĩnh vực đó tại thời điểm hồ sơ được tiếp nhận.
      trang_pdf: 20
ghi_chu: 'Trinh thám 29/10 — hoàn thiện gia đình xăng dầu #240 (hợp nhất TT 38/2014/TT-BCT qua 7 lần sửa đổi đến TT 26/2026/TT-BCT). Canh: Chính phủ yêu cầu NĐ MỚI về kinh doanh xăng dầu — radar sẽ bắt.'
