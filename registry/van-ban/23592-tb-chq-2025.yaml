xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/15/26.VBDI_23592.pdf, id=101316, SHA-256 94adfb7e32ecb391efc022a59fb7ef6bd8009ef89ef7a67c1dfaeddc8c964d47): Thông báo số 23592/TB-CHQ ngày 11-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị liên lạc trong nhà dùng cho hệ thống liên lạc nội bộ hữu tuyến (ký, mã hiệu Aiphone IXG-2C7; cấu tạo gồm vỏ nhựa PC và nhựa ABS chống cháy, màn hình màu cảm ứng 7 inch TFT LCD độ phân giải 800 x 480, tích hợp loa và micro đàm thoại, phím bấm chức năng cảm ứng; không tích hợp camera trên thiết bị, bộ nhớ trong lưu tối đa 20 bản ghi cuộc gọi và có khe cắm thẻ nhớ SD tối đa 32GB để ghi lại video/âm thanh lịch sử cuộc gọi; nguồn 48V DC / cấp nguồn PoE IEEE 802.3af, công suất tiêu thụ tối đa 5.9W, kích thước 148 x 227 x 25.3 mm, kết nối tối đa 8 camera IP, hỗ trợ chuyển cuộc gọi và hình ảnh khách tới ứng dụng trên điện thoại thông minh; lắp gắn tường bên trong căn hộ chung cư, kết nối hữu tuyến với camera chuông cửa và các trạm gọi/trạm bảo vệ để đàm thoại, quan sát và kiểm soát an ninh ra vào căn hộ), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
