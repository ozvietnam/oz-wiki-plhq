ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị liên lạc trong nhà dùng cho hệ thống liên lạc nội bộ hữu tuyến (ký, mã hiệu Aiphone IXG-2C7; vỏ nhựa PC và ABS chống cháy, màn hình cảm ứng 7 inch TFT LCD 800x480, nguồn 48V DC / PoE IEEE 802.3af, công suất tối đa 5.9W, kích thước 148 x 227 x 25.3 mm, tích hợp loa và micro đàm thoại, không tích hợp camera, có khe cắm thẻ nhớ SD tối đa 32GB, kết nối hữu tuyến với camera chuông cửa và trạm bảo vệ để kiểm soát an ninh căn hộ) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
