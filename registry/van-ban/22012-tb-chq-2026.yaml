  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_22012.pdf, id=106032, SHA-256 ffb54881ecb20ea8e5e7e7ac57999888496a340e6991b8ed61f01497d75c68fa): Thông báo số 22012/TB-CHQ ngày 21-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chất xử lý RB-76 (Treatment Agent RB-76, ký mã hiệu RB-76; thành phần gồm N-Heptane CAS 142-82-5 hàm lượng 15%-25%, Ethyl acetate CAS 141-78-6 hàm lượng 20%-25%, Methyl Acetate CAS 79-20-9 hàm lượng 30%-40%, Polyurethane resin CAS 9009-54-5 hàm lượng 1%-15%; dạng chất lỏng trong suốt, mùi dung môi, pH 6~8, nhiệt độ sôi 56~115 °C, điểm chớp cháy 4,4 °C, đóng gói 15 kg/thùng; dùng để xử lý bề mặt của giày, xử lý vết keo dính dơ trên mặt giày và tăng cường độ bám dính trong sản xuất giày), phân loại vào nhóm 32.08, phân nhóm 3208.90, mã số 3208.90.90; có hiệu lực kể từ ngày ban hành'
