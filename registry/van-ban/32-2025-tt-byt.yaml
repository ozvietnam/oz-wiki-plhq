  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=214395) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (32-byt.pdf): ban hành ngày 01-07-2025, có hiệu lực thi hành từ ngày 01-07-2025; đang còn hiệu lực.'
