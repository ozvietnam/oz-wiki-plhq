  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Dược ngày 06 tháng 4 năm 2016 và Luật sửa đổi, bổ sung một số điều của Luật Dược ngày 21 tháng 11 năm 2024 (sau đây gọi là Luật Dược), bao gồm: Áp dụng tiêu chuẩn chất lượng thuốc cổ truyền, vị thuốc cổ truyền, dược liệu; công bố tiêu chuẩn chất lượng vị thuốc cổ truyền, dược liệu;'
      trang_pdf: 1
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 2
      noi_dung: 2 1. Lô dược liệu là một lượng xác định dược liệu có cùng nơi nuôi, trồng hoặc thu hái, được sơ chế, chế biến theo cùng một quy trình trong một khoảng thời gian xác định tại cùng một cơ sở và đạt tiêu chuẩn làm thuốc. 2. Lô vị thuốc cổ truyền là một lượng xác định vị thuốc cổ truyền được sơ chế, chế biến, sản xuất từ dược liệu theo cùng một quy trình trong một khoảng thời gian xác định tại cùng một cơ sở và đạt tiêu chuẩn làm thuốc.
      trang_pdf: 2
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 3
      noi_dung: Điều 3. Quy định chung 1. Cơ sở kinh doanh dược, cơ sở khám bệnh, chữa bệnh được lựa chọn áp dụng tiêu chuẩn chất lượng của thuốc cổ truyền, vị thuốc cổ truyền, dược liệu theo một trong các dược điển quy định tại Điều 4 Thông tư này hoặc theo tiêu chuẩn cơ sở do cơ sở xây dựng quy định tại Điều 5 Thông tư này.
      trang_pdf: 2
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 7
      noi_dung: 'Điều 7. Đối tượng và yêu cầu công bố tiêu chuẩn chất lượng vị thuốc cổ truyền, dược liệu 1. Vị thuốc cổ truyền, dược liệu phải công bố tiêu chuẩn chất lượng trước khi lưu hành thuộc một trong các trường hợp sau: a) Vị thuốc cổ truyền, dược liệu chưa có tiêu chuẩn chất lượng quy định trong dược điển Việt Nam hoặc dược điển tham chiếu quy định tại Điều 4 Thông tư này;'
      trang_pdf: 5
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 9
      noi_dung: 'Điều 9. Kiểm nghiệm thuốc cổ truyền, vị thuốc cổ truyền, dược liệu 1. Việc kiểm nghiệm phải được thực hiện theo tiêu chuẩn chất lượng thuốc cổ truyền, vị thuốc cổ truyền, dược liệu đã được phê duyệt hoặc công bố và cập nhật cụ thể như sau: a) Trường hợp tiêu chuẩn chất lượng thuốc cổ truyền, vị thuốc cổ truyền, dược liệu chưa được cập nhật, cơ sở kiểm nghiệm áp dụng dược điển tương ứng quy định tại khoản 1 và khoản 2 Điều 6 Thông tư này để kiểm'
      trang_pdf: 7
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 12
      noi_dung: Điều 12. Tài liệu chứng minh nguồn gốc, xuất xứ của thuốc cổ truyền, vị thuốc cổ truyền, dược liệu 1. Tài liệu chứng minh nguồn gốc, xuất xứ của thuốc cổ truyền là giấy đăng ký lưu hành thuốc cổ truyền hoặc quyết định cấp giấy đăng ký lưu hành.
      trang_pdf: 12
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 15
      noi_dung: 'Điều 15. Trình tự thu hồi thuốc cổ truyền, vị thuốc cổ truyền, dược liệu theo hình thức bắt buộc 1. Tiếp nhận thông tin về thuốc cổ truyền, vị thuốc cổ truyền, dược liệu vi phạm của Cục Quản lý Y, Dược cổ truyền: a) Thông tin đánh giá thuốc cổ truyền không bảo đảm hiệu quả điều trị, tính an toàn của Hội đồng tư vấn đăng ký thuốc; b) Thông tin về chất lượng thuốc cổ truyền, vị thuốc cổ truyền, dược liệu không đạt từ cơ sở kiểm nghiệm thuốc;'
      trang_pdf: 14
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 18
      noi_dung: Điều 18. Xử lý vị thuốc cổ truyền, dược liệu không đạt tiêu chuẩn chất lượng do cơ sở kiểm nghiệm nhà nước thông báo 1. Trong thời hạn 24 giờ kể từ thời điểm nhận được Phiếu kiểm nghiệm hoặc Phiếu phân tích do cơ sở kiểm nghiệm gửi tới, cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh tiến hành niêm phong vị thuốc cổ truyền, dược liệu không đạt chất lượng tại cơ sở đã lấy mẫu;
      trang_pdf: 22
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 20
      noi_dung: 'Điều 20. Tạm ngừng kinh doanh, sử dụng và niêm phong bảo quản thuốc cổ truyền, vị thuốc cổ truyền, dược liệu có dấu hiệu không an toàn cho người sử dụng 1. Cục Quản lý Y, Dược cổ truyền tiếp nhận thông tin kèm theo hồ sơ tài liệu liên quan (nếu có) đối với thuốc cổ truyền, vị thuốc cổ truyền, dược liệu có dấu hiệu không an toàn cho người sử dụng từ: a) Cơ quan chức năng (bao gồm công an, hải quan, quản lý thị trường, thanh tra, cơ quan ngoại'
      trang_pdf: 26
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
    - dieu: 24
      noi_dung: Điều 24. Điều khoản chuyển tiếp Hồ sơ công bố tiêu chuẩn chất lượng dược liệu đã nộp trước ngày Thông tư này có hiệu lực thì tiếp tục thực hiện theo Thông tư số 38/2021/TT-BYT ngày 31 tháng 12 năm 2021 của Bộ trưởng Bộ Y tế quy định chất lượng dược liệu, thuốc cổ truyền.
      trang_pdf: 32
      sha256_pdf: 8986c29a1c4c39eaba709854d9366a3f0482a78a20e48108290c9de7384d14b9
