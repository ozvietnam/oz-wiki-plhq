xac_minh:
  muc: NGUON_A
  pham_vi: Đã đối chiếu tên, ngày thông qua (11/01/2022), ngày hiệu lực (01/03/2022) trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn, datafiles.chinhphu.vn). Phần sửa đổi, bổ sung Luật Thuế tiêu thụ đặc biệt (Điều 8) hết hiệu lực từ ngày 01/01/2026 khi Luật Thuế tiêu thụ đặc biệt số 66/2025/QH15 có hiệu lực thi hành và thay thế Luật Thuế tiêu thụ đặc biệt số 27/2008/QH12 đã được sửa đổi, bổ sung một số điều theo Luật số 70/2014/QH13, Luật số 71/2014/QH13, Luật số 106/2016/QH13 và Luật số 03/2022/QH15 (khoản 2 Điều 11 Luật 66/2025/QH15).
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: |
  HET_HIEU_LUC_MOT_PHAN: chỉ Điều 8 (sửa đổi, bổ sung điểm g khoản 4 Điều 2 và Mục I Điều 7 Biểu thuế tiêu thụ đặc biệt của Luật Thuế tiêu thụ đặc biệt số 27/2008/QH12) hết hiệu lực từ ngày 01/01/2026 theo khoản 2 Điều 11 Luật Thuế tiêu thụ đặc biệt số 66/2025/QH15 ngày 14/06/2025; các điều sửa đổi, bổ sung các luật khác (Luật Đầu tư công, Luật Đầu tư theo phương thức đối tác công tư, Luật Đầu tư, Luật Nhà ở, Luật Đấu thầu, Luật Điện lực, Luật Doanh nghiệp, Luật Thi hành án dân sự) vẫn còn hiệu lực (nguồn A: https://vanban.chinhphu.vn/default.aspx?docid=214598&pageid=27160, https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/66qhm.signed.pdf).
