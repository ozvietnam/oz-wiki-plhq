xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=208028, người ký Thứ trưởng Nguyễn Đức Chi, tệp đính kèm 33-btc.signed.pdf) và cạnh ngược trong sổ: Thông tư 33/2023/TT-BTC của Bộ trưởng Bộ Tài chính quy định về xác định xuất xứ hàng hóa xuất khẩu, nhập khẩu, ban hành ngày 31-05-2023, có hiệu lực thi hành từ ngày 15-07-2023; đối chiếu đang còn hiệu lực, đã được bổ sung khoản 10 Điều 15 kể từ ngày 22-08-2026 bởi Điều 1 Thông tư 124/2026/TT-BTC'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh __ Thông tư này quy định hồ sơ, kiểm tra xác định trước xuất xứ; khai và ` nộp chứng từ chứng nhận xuất xứ hàng hóa xuất khẩu, nhập khẩu; thủ tục, nội
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Người khai hải quan. 2. Cơ quan hải quan, công chức hải quan. 3. Cơ quan, tổ chức cấp giấy chứng nhận xuất xứ hàng hóa; thương nhân phát hành chứng từ tự chứng nhận xuất xứ hàng hoá. 4. Tổ chức, cá nhân khác có quyền và nghĩa vụ điên quan đến xác định xuất xứ hàng hoá xuất khẩu, nhập khẩu. _ ChươngH XÁC ĐỊNH TRƯỚC XUAT XỨ HANG HÓA XUẤT KHAU, NHẬP KHẨU.
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Hồ sơ đề nghị xác định trước xuất xứ Trước khi làm thủ tục hải quan đối với lô hàng xuất khâu, nhập khẩu, tô chức, cá nhân có đề nghị xác định trước xuất xứ hàng hóa thì nộp bộ hồ sơ đề nghị xác định trước xuất xứ, gồm: 1. Đơn đề nghị xác định trước xuất xứ hàng hoá xuất khẩu, nhập khẩu theo mẫu tại Phụ lục I ban hành kèm Thông tư này: 01 bản chính;'
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Kiểm tra, xác định xuất xứ hàng hóa xuất khẩu trong thông quan 1. Chi cục Hải quan nơi đăng ký tờ khai hải quan kiểm tra, xác định xuất xứ hàng hóa xuất khẩu trên cơ sở kiểm tra nội dung khai của người khai hải quan, văn bản thông báo kết quả xác định trước xuất xứ hàng hóa xuất khẩu (nếu có),. chứng từ thuộc hd sơ hải quan, kết quả kiểm tra thực tế hàng hóa (nếu có) và xử lý như sau:'
      trang_pdf: 4
    - dieu: 7
      noi_dung: Điều 7. Xác minh tại cơ quan, tỗ chức cấp chứng từ chứng nhận xuất xứ hàng hóa xuất khẩu 1. Cục Hải quan tỉnh, thành phố nơi đăng ký tờ khai hải quan gửi văn bản đề nghị xác minh kèm theo các thông tin nghỉ van liên quan xuất xứ hàng hóa đến cơ quan, tổ chức cấp chứng từ chứng nhận xuất xứ hàng hóa xuất khẩu.
      trang_pdf: 5
    - dieu: 9
      noi_dung: 'Điều 9. Xử lý kết quả xác mình tai cơ quan, tổ chức cấp chứng từ chứng nhận XuẤt, xứ hàng hóa xuất khẩu, kết quả kiểm tra tại cơ sở san xuất hàng hóa xuất khẩu Căn cứ thông tin, hồ sơ, chứng từ, tài liệu, dữ liệu, kết quả xác minh tại cơ quan, tô chức cap chứng từ chứng nhận xuất xứ hàng hóa, két quả kiểm tra tại co SỞ sản xuat, nội dung giải trình của người khai hải quan, cơ quan hải quan xử lý như sau: .'
      trang_pdf: 7
    - dieu: 11
      noi_dung: Điều 11. Khai chứng từ chứng nhận xuất xứ hàng hóa nhập khẩu 1. Trường hợp nộp chứng từ chứng nhận xuất xứ hàng hóa tại thời điểm làm thủ tục hải quan, người khai hai quan khai số tham chiếu và ngày cấp của giấy chứng nhận xuất xứ hàng hóa hoặc mã nhà xuất khâu đủ điêu kiện cấp chứng từ tự chứng nhận xuất xứ hàng hóa (mã REX theo Hiệp định EVFTA, mã EORI theo Hiệp định UKVFTA, mã CE theo Hiệp định ATIGA hoặc RCEP) tại ô “Phần ghi chú” trên tờ
      trang_pdf: 9
    - dieu: 14
      noi_dung: Điều 14. Từ chối chứng từ chứng nhận xuất xứ hàng hoá nhập khẩu Cơ quan hải quan từ chối chứng từ chứng nhận xuất xứ hàng hoá trong
      trang_pdf: 12
    - dieu: 15
      noi_dung: 'Điều 15. Kiểm tra chứng từ chứng nhận xuất xứ hang hóa nhập khẩu : 1, Trường hợp hàng hóa. nhập khâu từ nước, nhóm nước hoặc vùng lãnh thé có thỏa thuận wu đãi đặc biệt về thuế nhập khâu trong quan hệ thương mại với Việt Nam, cơ quan hải quan căn cứ quy tắc xuất xứ hàng hóa theo từng Hiệp định thương mại tự do được quy định tại Thông tư hướng dẫn của Bộ Công Thương, kiểm tra, đối chiếu với các thông tin khai báo trên giấy chứng nhận xuất xứ hàng'
      trang_pdf: 13
    - dieu: 19
      noi_dung: Điều 19. Xác minh xuất xứ hàng hóa nhập khẩu 1. Trường hợp nội dung thông tin trên chứng từ chứng nhận xuất xứ hàng hóa không phù hợp với nội dung khai của người khai hải quan, các chứng từ thuộc hồ sơ hải quan và kết quả kiểm tra thực tế (nếu có), Chi cục Hải quan nơi đăng ký tờ khai-hai quan đề nghị người khai hải quan giải trình, chứng minh nội dung không phù hợp của chứng từ-chứng nhận xuất xứ hàng hóa. ;
      trang_pdf: 20
