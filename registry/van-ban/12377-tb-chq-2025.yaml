  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/7/4/VB_12377.pdf, id=100568, SHA-256 93028accc5fdb6286ad004a1ddc44d377681d9c4977a8b62fc5b13a01bab1f09): Thông báo số 12377/TB-CHQ ngày 03-07-2025 của Cục Hải quan về thông tin tài khoản thu NSNN; căn cứ QĐ 382/QĐ-BTC (26-02-2025) sửa đổi bởi QĐ 2019/QĐ-BTC (11-06-2025); tiếp theo Thông báo 11801/TB-CHQ ngày 30-06-2025, cập nhật sửa đổi, bổ sung thông tin thu của một số đơn vị Hải quan cửa khẩu/ngoài cửa khẩu thuộc Chi cục HQKV II, XII, XIX (phụ lục kèm theo — danh sách đơn vị và mã KBNN); người ký Đào Thu Hương; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
