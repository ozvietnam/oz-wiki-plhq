ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Cập nhật thông tin KBNN/tài khoản thu của đơn vị thuộc HQKV II (cảng Phú Mỹ, Cái Mép, KCN Việt Hương…), HQKV XII (cảng Kỳ Hà), HQKV XIX (cửa khẩu Vĩnh Long). Văn bản gốc nêu tiếp theo 11801/TB-CHQ ngày 30-06-2025 — 11801 chưa có trong sổ nên chưa gắn quan_he.sua_doi (tránh điểm mù Cao); nạp 11801 rồi bổ sung quan hệ.'
