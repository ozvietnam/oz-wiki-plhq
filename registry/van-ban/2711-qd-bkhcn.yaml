    - dieu: 1
      noi_dung: 'Điều 1. Công bố. sản phẩy, hàng hóa nhóm 2 thuộc trách nhiệm quản lý của Bộ Khoa học và Công nghệ.tại Phụ lục ban hành kèm theo Quyết định này, bao gồm mã HS, quý chuẩn kỹ;thuật quốc gia (QCVN) tương ứng và văn ban quy phạm pháp: luật t quản lý. Pp x * a'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Giao Tổng cục Tiêu chuân Đo lường Chất lượng chủ trì, phối hợp với cơ quan, đơn vị liên quan hăng năm tổ chức rà soát, đề xuất Lãnh đạo Bộ Khoa học và Công nghệ công bố sửa đổi, bd sung sản phẩm, hàng hóa nhóm. 2 thuộc trách nhiệm quản lý của Bộ Khoa học và Công nghệ phù hợp với yêu cầu quản lý (nếu có).
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực ké từ ngày ký ban hành. 1. Đối với sản phẩm xăng, nhiên liệu diézen và nhiên liệu sinh học thực hiện theo quy định tại Quy chuẩn kỹ thuật quốc gia QCVN 1:2015/BKHCN và Sửa đổi 1:2017 QCVN 1:2015/BKHCN cho đến khi Quy chuẩn kỹ thuật quốc gia QCVN 01:2022/BKHCN có hiệu lực thi hành theo quy định tại Thông | tư sô 16/2022/TT-BKHCN ngày 15/12/2022 của Bộ Khoa học và Công nghệ. “ - ý
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Tổng cục trưởng Tổng cục Tiêu chuẩn Do lường Chất lượng, Vụ trưởng Vụ Pháp chế và các tổ chức, cá nhân liên quan có trách nhiệm thi hành Quyết định này. yop —~
