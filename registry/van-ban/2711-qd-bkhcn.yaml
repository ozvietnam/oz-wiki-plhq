  pham_vi: 'Đã đối chiếu toàn văn PDF ký số trên Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn docid=207275, datafiles.chinhphu.vn 2711-bkhcn.signed.pdf, 43 trang, Thứ trưởng Lê Xuân Định ký ngày 30/12/2022): Điều 3 quy định có hiệu lực kể từ ngày ký (30/12/2022), thay thế QĐ 3810/QĐ-BKHCN (18/12/2019) và QĐ 3115/QĐ-BKHCN (13/11/2020); đã được sửa đổi, bổ sung một phần bởi QĐ 366/QĐ-BKHCN (14/03/2023), QĐ 367/QĐ-BKHCN (12/03/2024) và QĐ 3830/QĐ-BKHCN (21/11/2025).'
