ghi_chu: 'Xác định trước mã số mặt hàng Polystyrene ở dạng cục (Polystyrene lumps; dạng khối rắn màu trắng, không xốp, không giãn nở, hàm lượng > 99%, sản xuất từ xốp Polystyrene đã qua sử dụng bằng phương pháp nấu chảy ở 175°C - 180°C và làm lạnh trong khuôn chuyển sang dạng nguyên sinh để làm nguyên liệu sản xuất hạt nhựa) thuộc nhóm 39.03, phân nhóm 3903.19, mã số 3903.19.90.'
