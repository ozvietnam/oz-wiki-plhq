  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/1/VB_16859.pdf, id=104216, 3 trang, SHA-256 0d8407492b79588179a7f308b90c7c345fa3c84816a9d184014e77210a661d86): Thông báo số 16859/TB-CHQ ngày 28-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Polystyrene ở dạng cục (Tên thương mại: Polystyrene lumps; dạng khối rắn màu trắng, không mùi, không đồng đều, không xốp, không giãn nở, không tan trong nước, hàm lượng Polystyrene > 99% tính theo trọng lượng; được sản xuất từ bọt xốp Polystyrene đã qua sử dụng nghiền và nấu chảy ở 175°C - 180°C rồi đưa vào khuôn thép làm mát chuyển sang dạng nguyên sinh, dùng trực tiếp làm nguyên liệu đầu vào sản xuất hạt nhựa Polystyrene), phân loại vào nhóm 39.03, phân nhóm 3903.19, mã số 3903.19.90; có hiệu lực kể từ ngày ban hành'
