xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu cổng Bộ Khoa học và Công nghệ (mst.gov.vn/van-ban-phap-luat/25532.htm) và toàn văn PDF ký số trên Cổng TTĐT Chính phủ (25-vbhn-bkhcn.signed.pdf, 42 trang, Thứ trưởng Hoàng Minh ký xác thực ngày 30-09-2026): hợp nhất Nghị định 99/2013/NĐ-CP ngày 29-08-2013 (có hiệu lực từ 15-10-2013) với 3 Nghị định sửa đổi, bổ sung gồm Nghị định 126/2021/NĐ-CP ngày 30-12-2021 (có hiệu lực từ 01-01-2022), Nghị định 46/2024/NĐ-CP ngày 04-05-2024 (có hiệu lực từ 01-07-2024) và Nghị định 186/2026/NĐ-CP ngày 26-05-2026 (có hiệu lực từ 15-07-2026); gồm 4 Chương, 35 Điều.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh? ''Nghi định số 126/2021/NĐ-CP có căn cứ ban hành như sau: “Can cứ Luật Tổ chức Chính phi ngày 19 tháng 6 năm 2015; Luật sửa đồi, bồ sung một số điều của Luật Tổ chức Chính phi và Luật Tổ chức chính quyên địa phương ngày 22 tháng 11 năm 2019; Căn cứ Luật Xứ lý vi phạm hành chính ngày 20 tháng 6 năm 2012; Luật sửa đôi, bô sung một số ý điều cua Luật Xứ lý vi phạm hành chính ngày 13 tháng 11 năm 2020;'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Quy định về mức phạt tiền tối đa, thẩm quyền xử phạt đối với cá nhân, tô chức 1. Mức phat tiễn đối với các hành vi quy định tại Chương II của Nghị định này là mức phạt tiền đối với cá nhân. Mức phạt tiền tối đa đối với cá nhân là *Khoản này được sửa đổi, bỏ sung theo quy định tại khoản | Điều | của Nghị định số 46/2024/NĐ-CP. có hiệu lực kể từ ngày 01 tháng 7 năm 2024.
      trang_pdf: 3
    - dieu: 3
      noi_dung: 'Điều 3. Hình thức xử phạt, biện pháp khắc phục hậu quả 1; Đối với mỗi hành vi vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, tô chức, cá nhân vi phạm phải chịu một trong các hình thức xử phạt chính là cảnh cáo hoặc phạt tiên. 2. Tùy theo tính chất, mức độ vi phạm, tô chức, cá nhân vi phạm còn có thê bị áp dụng một hoặc các hình thức xử phạt bô sung sau đây:'
      trang_pdf: 4
    - dieu: 7
      noi_dung: Điều 7. Vi phạm quy định về đại diện sở hữu công nghiệp |. Phat tiền từ 6.000.000 đồng đến 15.000.000 đồng đối với một trong các hành vi sau day:** a) Không thông báo bằng văn bản cho cơ quan nhà nước có thâm quyền xác lập, bảo vệ quyền sở hữu công nghiệp khi có thay đổi về tên, địa chỉ, tư cách pháp lý của đại diện sở hữu công nghiệp, thay đồi liên quan đến bên ủy quyền và bên nhận ủy quyền đại diện sở hữu công nghiệp;
      trang_pdf: 8
    - dieu: 9
      noi_dung: Điều 9. Vi phạm quy định về niêm phong, tạm giữ tang vật, phương tiện vi phạm trong quá trình thanh tra, kiểm traŠ 1. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với hành vi không dam bảo nguyên trang, tháo gỡ, phá bỏ niêm phong tang vật, phương tiện vi phạm đang bị niêm phong, tạm giữ.
      trang_pdf: 12
    - dieu: 14
      noi_dung: 'Điều 14. Cạnh tranh không lành mạnh trong lĩnh vực sở hữu công nghiệp |. Phat cảnh cáo hoặc phạt tiền từ 500.000 đồng đến 2.000.000 đồng đối với một trong các hành vi sau đây trong trường hợp giá trị hàng hóa, dịch vụ vi phạm đên 3.000.000 dong:'
      trang_pdf: 21
    - dieu: 20
      noi_dung: 'Điều 20. Tham quyền xử phat của Công an nhân dân”! 1. Chiến sĩ Công an nhân dân đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phat tiền đến 25.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 2. Trưởng đồn Công an, Trưởng trạm, Đội trưởng có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 75.000.000 đồng;'
      trang_pdf: 28
    - dieu: 23
      noi_dung: Điều 23. Ủy quyền yêu cầu xử lý hành vi xâm phạm quyền sở hữu công kayi . Chủ thé quyền sở hữu công nghiệp quy định tại khoản 2 Điều 22 của Nghị ie này trực tiêp nộp don yêu câu xử lý xâm phạm quyền sở hữu công nghiệp hoặc uy quyên cho người đứng đầu văn phòng đại diện, chỉ nhánh, đại lý của mình hoặc đại diện sở hữu công nghiệp tại Việt Nam nộp đơn. 2. Việc ủy quyền phải được làm bằng văn bản dưới hình thức giấy ủy quyền hoặc hợp đồng ủy quyền,
      trang_pdf: 32
    - dieu: 29
      noi_dung: 'Điều 29. Phối hợp xứ lý vi phạm 1. Yêu cầu phối hợp xử lý vi phạm: a) Trường hợp vụ việc vi phạm có tinh tiết phức tạp hoặc có liên quan đến nhiều tô chức, cá nhân khác nhau thì cơ quan có thâm quyền thụ lý đơn yêu. cầu xử lý vi phạm có thể yêu cầu cơ quan có thắm quyền và cơ quan nhà nước vé SỞ hữu công nghiệp ở địa phương liên quan phối hợp xử lý vi phạm.'
      trang_pdf: 36
    - dieu: 33
      noi_dung: 'Điều 33. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành ké từ ngày 15 tháng 10 năm 2013. 2. Nghị định số 97/2010/NĐ-CP ngày 21 tháng 9 năm 2010 của Chính phủ quy định xử phat vi phạm hành chính trong lĩnh vực sở hữu công nghiệp hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành. 2H idu 6, Điều 7 của Nghị định số 126/2021/NĐ-CP, có hiệu lực kẻ tir ngày 01 tháng 01 năm 2022 quy định như sau: “Dieu 6. Trách nhiệm tổ chúc thực hiện'
      trang_pdf: 41
ghi_chu: Văn bản hợp nhất Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp qua 3 lần sửa đổi, bổ sung (126/2021/NĐ-CP, 46/2024/NĐ-CP, 186/2026/NĐ-CP). Lưu toan_van bằng bản HTML từ mst.gov.vn vì tệp PDF gốc nặng 19,4 MB.
