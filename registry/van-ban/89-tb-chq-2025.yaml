ghi_chu: 'Xác định trước mã số mặt hàng Cổng kết nối truyền tín hiệu cho bảng giá điện tử ESL (Newton Gateway, ký, mã hiệu EGS501NA0S/WWW; kết nối hữu tuyến với máy chủ qua cáp mạng Ethernet và truyền nhận tín hiệu không dây tần số 2.4GHz qua BLE đến bảng giá điện tử ESL) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.43.'
