  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/17/VB_89.pdf, id=99606, SHA-256 7954094248e99403446baea7bf483503ee0fd17c32cc17cd9018b9bb5d7be34b): Thông báo số 89/TB-CHQ ngày 12-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cổng kết nối truyền tín hiệu cho bảng giá điện tử ESL (tên trên tài liệu kỹ thuật Newton Gateway, ký, mã hiệu EGS501NA0S/WWW; là cổng kết nối gateway để kết nối với máy chủ server bằng phương pháp hữu tuyến qua cáp mạng Ethernet 10/100/1000Mbps, cấp nguồn DC 5~12V hoặc PoE 36~57VDC, công suất 10W, và truyền nhận tín hiệu sóng vô tuyến không dây cự li ngắn tần số 2.4GHz đến bảng giá điện tử ESL qua kết nối BLE Bluetooth Low Energy), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.43; có hiệu lực từ ngày ký'
