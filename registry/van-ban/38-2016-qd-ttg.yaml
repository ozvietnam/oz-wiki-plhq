  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Quan điểm chỉ đạo phát triển rừng 1. Nhà nước khuyến khích các tổ chức, hộ gia đình, cá nhân thuộc các thành phần. kinh tế đầu tư trồng rừng và chế biến lâm sản theo quy định của pháp luật về bảo vệ và phát triển rừng. . 2. Rùng sản xuất là rừng đa mục tiêu, trồng rừng sản xuất nhằm tăng thu nhập cho người làm nghề rừng và góp phần bảo vệ môi trường, sinh thái.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh: Quyết định này quy định một sỐ cơ chế, chính sách đối với việc bảo vệ rừng và phát triển ngành lâm nghiệp bền vững.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Mục tiêu phát triển rừng 1. Mục tiêu đến năm 2020: Trồng 900.000 ha rừng sản xuất, bình quân mỗi năm trồng 180.000 ha. Trồng 75.000 ha rừng phòng hộ, đặc dụng, mỗi năm trồng 15.000 ha. Khoanh nuôi tái sinh rừng 360.000 ha. 2. Giải quyết việc làm, tăng thu nhập nhằm én định đời sống cho đồng bào miền núi.'
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Hỗ trợ trồng rừng phòng hộ, đặc dụng, khoanh nuôi tái sinh rừng, khoán quản lý bảo vệ rừng 1. Đầu tư trồng rừng phòng hộ, đặc dụng: Mức kế hoạch vốn từ ngân sách trung ương là 30 triệu đồng/ha; mức đầu. tư cụ thể được xác định trên cơ sở định mức kinh tế kỹ thuật và dự án được cấp có thâm quyền phê duyệt, Ủy ban nhân dân cấp tỉnh và cơ quan quyết định đầu tư trung ương tự cân đối bổ sung phần ngân sách còn thiếu theo dự toán được duyệt.'
      trang_pdf: 4
    - dieu: 9
      noi_dung: 'Điều 9. Quyền và nghĩa vụ tổ chức, hộ gia đình, cá nhân và cộng đồng (gọi tắt là chủ rừng) khi trồng rùng phòng hộ; bảo vệ, khoanh nuôi tái sinh rừng tự nhiên 1. Quyền lợi: Được hưởng hỗ trợ của ngân sách nhà nước theo quy định tại Quyết định này và toàn bộ sản phâm của rừng mang lại khi được phép khai thác từ rừng theo quy định của Nhà nước.'
      trang_pdf: 6
    - dieu: 11
      noi_dung: 'Điều 11. Hỗ trợ đầu tư xây dựng các trung tâm sản xuất giống cây rừng chất lượng cao 1. Tiêu chí trung tâm giống được hỗ trợ: a) Là cơ sở nuôi cấy mô có quy mô tối thiểu 1 triệu cây/năm. b) Diện tích đất tập trung xây dựng trung tâm giống tối thiểu là 3,0 ha (bao gồm đất dé xây dựng nhà, xưởng, dat làm vườn ươm). 2. Điều kiện nhận hỗ trợ đầu tư: a) Đối với tỉnh chưa có cơ sở nuôi cấy mô thì được hỗ trợ đầu tư xây'
      trang_pdf: 7
    - dieu: 13
      noi_dung: 'Điều 13. Hỗ trợ đầu tư đường lâm nghiệp 1. Đường ranh phòng chống cháy rừng (đường ranh can lửa) a) Tiêu chuẩn hỗ trợ: Đường ranh phòng chống cháy rừng kết hợp làm đường vận xuất, vận chuyển cây giống, vật tư, trong nội vùng dự án được quy hoạch với mức 15 - 20 mét đường/ha.'
      trang_pdf: 8
    - dieu: 15
      noi_dung: Điều 15. Hỗ trợ đầu tư và đặt hàng đối với các công ty nông lâm nghiệp (quy định tại khoản 2 Điều 1 Nghị định số 118/2014/NĐ-CP)
      trang_pdf: 10
    - dieu: 18
      noi_dung: Điều 18. Về đất đai 1, Đối với đất được quy hoạch để trồng rừng sản xuất mà hiện nay do các tô chức của Nhà nước quản lý nếu chưa có đủ điều kiện để giao đất cho các tổ chức, hộ gia đình, cá nhân và cộng đồng thì trước khi áp dụng Quyết
      trang_pdf: 11
    - dieu: 21
      noi_dung: Điều 21. Hiệu lực thi hành 1. Quyết định này có hiệu lực thi hành từ ngày 01 tháng 11 năm 2016 và thay thế Quyết định sô 147/2007/QD- -TTg ngày 07 thang 9 năm 2007 về một sô chính sách phát triển rừng sản xuất giai đoạn 2007 - 2015 và Quyết định số 66/2011/QĐ-TTg ngày 09 tháng 12 năm 201 lcủa Thủ Tướng Chính phủ về sửa đổi, bd sung một số Điều của Quyết định số 147/2007/QĐ-TTg.
      trang_pdf: 15
ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #381). Chính sách hỗ trợ bảo vệ, phát triển rừng và công ty nông lâm nghiệp.'
