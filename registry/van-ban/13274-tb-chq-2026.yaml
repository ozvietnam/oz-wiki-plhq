ghi_chu: 'Xác định trước mã số mặt hàng Bộ toan áo phẫu thuật chung Universal Pack (ký, mã hiệu V-UNP-302; vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, tiệt trùng bằng khí EO dùng 1 lần trong phòng mổ; gồm toan trải bàn dụng cụ lớn và nhỏ, toan phủ đầu, toan phủ bên, toan phủ chân, khăn thấm và áo choàng phẫu thuật) thuộc nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90.'
