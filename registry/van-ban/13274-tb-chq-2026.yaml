  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/5/VB_13274.pdf, id=102692, SHA-256 bcbafba96281c4ba40ab691f62b5ce807167ff60d68d286e839a1dab8af73fc1): Thông báo số 13274/TB-CHQ ngày 04-03-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ toan áo phẫu thuật chung Universal Pack (ký, mã hiệu V-UNP-302; chất liệu vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, vải Kamisoft 5720F 55 gsm mềm mại thoáng khí, định lượng 43-65 gsm, ép nhiệt và cắt may, khử trùng bằng khí EO dùng 1 lần; bộ gồm toan trải bàn dụng cụ lớn 180 x 200 cm, toan trải bàn dụng cụ nhỏ 120 x 140 cm, toan phủ đầu 132 x 250 cm, toan phủ bên 117 x 200 cm, toan phủ chân 200 x 210 cm, khăn thấm 30 x 40 cm 4 lớp và áo choàng phẫu thuật), phân loại vào nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90; có hiệu lực từ ngày ký'
