    - so_hieu: 82/2022/NĐ-CP
      pham_vi: 'bổ sung trường hợp ngoại trừ đối với một số hóa chất thuộc Danh mục hóa chất hạn chế sản xuất, kinh doanh trong lĩnh vực công nghiệp tại Phụ lục II (STT 55 Asen và hợp chất của asen: ngoại trừ Arsenic trichloride mã HS 2812.10, CAS 7784-34-1; STT 79 Xyanua và hợp chất xyanua: ngoại trừ Cyanogen chloride mã HS 2853.10, CAS 506-77-4 và Hydrogen cyanide mã HS 2811.12, CAS 74-90-8)'
      tu_ngay: '2024-05-19'
      can_cu: Điều 5 khoản 2 và Điều 40 khoản 1 NĐ 33/2024/NĐ-CP
  bai_bo:
    - so_hieu: 113/2017/NĐ-CP
      pham_vi: 'bãi bỏ một số hóa chất thuộc Danh mục hóa chất sản xuất, kinh doanh có điều kiện tại Phụ lục I (STT 263, 333, 489, 618, 720) và Danh mục hóa chất phải khai báo tại Phụ lục V (STT 137, 198, 242, 291, 374, 527, 677, 795, 922, 974, 987, 989, 990) được sửa đổi, bổ sung bởi NĐ 82/2022/NĐ-CP'
