      can_cu: Điều 5 khoản 3, khoản 4 và Điều 40 khoản 1 NĐ 33/2024/NĐ-CP
    - so_hieu: 82/2022/NĐ-CP
      pham_vi: 'bãi bỏ một số hóa chất thuộc Phụ lục I và Phụ lục V NĐ 113/2017/NĐ-CP được sửa đổi, bổ sung bởi NĐ 82/2022/NĐ-CP'
      tu_ngay: '2024-05-19'
      can_cu: Điều 5 khoản 3, khoản 4 và Điều 40 khoản 1 NĐ 33/2024/NĐ-CP
