      pham_vi: 'bãi bỏ một số hóa chất thuộc Danh mục hóa chất sản xuất, kinh doanh có điều kiện tại Phụ lục I (STT 263, 333, 489, 618, 720) và Danh mục hóa chất phải khai báo tại Phụ lục V (STT 137, 198, 242, 291, 374, 527, 677, 795, 922, 974, 987, 989, 990) được sửa đổi, bổ sung bởi NĐ 82/2022/NĐ-CP'
