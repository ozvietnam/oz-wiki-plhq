      pham_vi: 'bổ sung trường hợp ngoại trừ đối với một số hóa chất thuộc Danh mục hóa chất hạn chế sản xuất, kinh doanh trong lĩnh vực công nghiệp tại Phụ lục II (STT 55 Asen và hợp chất của asen: ngoại trừ Arsenic trichloride mã HS 2812.10, CAS 7784-34-1; STT 79 Xyanua và hợp chất xyanua: ngoại trừ Cyanogen chloride mã HS 2853.10, CAS 506-77-4 và Hydrogen cyanide mã HS 2811.12, CAS 74-90-8)'
      tu_ngay: '2024-05-19'
