xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 499+500 và 501+502 ngày 12-04-2024 (có lớp chữ) và tệp ký số 33-nd-cp.signed.pdf trên vanban.chinhphu.vn (docid=209957): số hiệu 33/2024/NĐ-CP, trích yếu, ngày ký 27-03-2024, người ký Phó Thủ tướng Trần Lưu Quang; cấu trúc 6 Chương / 41 Điều / 3 Phụ lục (Phụ lục I: Danh mục hóa chất Bảng 1, 2, 3 kèm mã số HS và mã CAS; Phụ lục II: Bảng kê khai; Phụ lục III: 14 mẫu văn bản). Điều 40 (Hiệu lực thi hành, tr. 42–43 Công báo 499+500): "1. Nghị định này có hiệu lực thi hành từ ngày 19 tháng 5 năm 2024. 2. Nghị định này thay thế các văn bản quy phạm pháp luật; điểm, khoản, điều của các văn bản quy phạm pháp luật sau đây: a) Nghị định số 38/2014/NĐ-CP ngày 06 tháng 5 năm 2014 của Chính phủ về quản lý hóa chất thuộc diện kiểm soát của Công ước cấm phát triển, sản xuất, tàng trữ, sử dụng và phá hủy vũ khí hóa học (https://vanban.chinhphu.vn/?pageid=27160&docid=173712); b) Điều 9, điểm a khoản 2 Điều 47 Nghị định số 77/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ (https://vanban.chinhphu.vn/?pageid=27160&docid=185657); c) Điều 12 và 13 Nghị định số 08/2018/NĐ-CP ngày 15 tháng 01 năm 2018 của Chính phủ (https://vanban.chinhphu.vn/?pageid=27160&docid=192607); d) Điều 6 và 7 Nghị định số 17/2020/NĐ-CP ngày 05 tháng 02 năm 2020 của Chính phủ (https://vanban.chinhphu.vn/?pageid=27160&docid=199044). 3. Bãi bỏ Quyết định số 76/2002/QĐ-TTg ngày 14 tháng 6 năm 2002 của Thủ tướng Chính phủ về việc thành lập Tổ công tác thực hiện Công ước cấm phát triển, sản xuất, tàng trữ, sử dụng vũ khí hóa học và phá huỷ các loại vũ khí này (Công ước Cấm vũ khí hóa học) (https://vanban.chinhphu.vn/?pageid=27160&docid=10891)." Điều 38 khoản 6 quy định việc báo cáo hóa chất Bảng, DOC, DOC-PSF tại điểm c khoản 2 các Điều 23, 24, 25, 26 qua Cơ sở dữ liệu hóa chất quốc gia áp dụng từ 15-02-2025. Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn, vanban.chinhphu.vn và vbpl.vn: khoản 4 Điều 31 Nghị định 26/2026/NĐ-CP ngày 17-01-2026 (https://vanban.chinhphu.vn/?docid=216673&pageid=27160, Công báo số 78 ngày 02-02-2026) bãi bỏ khoản 2 Điều 34 của NĐ 33/2024/NĐ-CP từ ngày 17-01-2026; toàn bộ các điều khoản quản lý xuất nhập khẩu hóa chất Bảng và Phụ lục I, II, III của NĐ 33/2024/NĐ-CP vẫn đang CON_HIEU_LUC.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Được biểu thuế XNK (hs-code-api) dẫn tại 60 mã HS thuộc Phụ lục I (Danh mục hóa chất Bảng 1, 2, 3). Các văn bản bị thay thế toàn bộ hoặc một phần theo khoản 2, khoản 3 Điều 40 gồm: NĐ 38/2014/NĐ-CP ngày 06-05-2014 (https://vanban.chinhphu.vn/?pageid=27160&docid=173712), Điều 9 và điểm a khoản 2 Điều 47 NĐ 77/2016/NĐ-CP ngày 01-07-2016 (https://vanban.chinhphu.vn/?pageid=27160&docid=185657), Điều 12 và 13 NĐ 08/2018/NĐ-CP ngày 15-01-2018 (https://vanban.chinhphu.vn/?pageid=27160&docid=192607), Điều 6 và 7 NĐ 17/2020/NĐ-CP ngày 05-02-2020 (https://vanban.chinhphu.vn/?pageid=27160&docid=199044) và QĐ 76/2002/QĐ-TTg ngày 14-06-2002 (https://vanban.chinhphu.vn/?pageid=27160&docid=10891) chưa có mục riêng trong sổ nên ghi nhận tại pham_vi và ghi_chu, không đưa vào quan_he để tránh phát sinh điểm mù THIEU_VAN_BAN. Tình trạng hiệu lực hiện tại: khoản 2 Điều 34 (về căn cứ thanh tra đột xuất) đã bị bãi bỏ từ 17-01-2026 theo khoản 4 Điều 31 NĐ 26/2026/NĐ-CP (https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-26-2026-nd-cp-468804.htm).'
