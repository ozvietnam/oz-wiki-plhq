ghi_chu: 'Xác định trước mã số mặt hàng Thiếc dạng bán cầu đường kính 20mm ký mã hiệu TBC20 nhãn hiệu BOA (Sn >= 99,95%, đúc rót khuôn bán cầu chưa gia công tiếp theo, dùng trong sản xuất linh kiện điện tử, hóa chất và mỹ nghệ) thuộc nhóm 80.01, mã số 8001.10.00.'
