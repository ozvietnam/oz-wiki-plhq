  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/10/5/1.VBDI_26548.pdf, id=101523, SHA-256 9c673a3a799f5b9f87f5d5ca3d335a9d4e8e5f059507ce85415c3ec5e47f23ab): Thông báo số 26548/TB-CHQ ngày 29-09-2025 của Cục Hải quan (ký số 29-09-2025, trên mục lục cổng ghi ký hiệu 26548/CHQ-NVTHQ) về kết quả xác định trước mã số theo đơn đề nghị số 12-VQB ngày 07-07-2025 và công văn số 2409/XNK-CV ngày 24-09-2025 của Công ty Cổ phần Tập đoàn Khoáng sản và Thương mại VQB đối với mặt hàng Thiếc dạng bán cầu, đường kính mặt đáy 20mm, ký mã hiệu TBC20, nhãn hiệu BOA (dùng trong sản xuất linh kiện điện tử, hóa chất và mỹ nghệ; thành phần hóa học Sn >= 99,95%, Bi <= 0,006%, Pb <= 0,03%, Fe <= 0,005%, As <= 0,007%, Cu <= 0,003%, Sb <= 0,01%; đúc từ thiếc tinh 99,95% qua điện phân nóng chảy ở 232 độ C rót khuôn bán cầu đường kính 20mm không qua gia công tiếp theo, trọng lượng ~12g/viên, nhà sản xuất Công ty Cổ phần Tập đoàn Khoáng sản và Thương mại VQB), phân loại vào nhóm 80.01, mã số 8001.10.00; có hiệu lực từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
