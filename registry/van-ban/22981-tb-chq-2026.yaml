xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/16/VB_22981.pdf, id=106384, SHA-256 230fbd31c34107569949d4189d951e22807f62837ca5ed12bbefa82b9c9fbcd9): Thông báo số 22981/TB-CHQ ngày 14-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thức ăn bổ sung dạng hỗn hợp chứa axit hữu cơ dùng bổ sung vào nước uống và thức ăn lỏng cho vật nuôi (thành phần gồm hỗn hợp của Axit Formic HCOOH hàm lượng 51%–63% và Natri Formate HCOONa hàm lượng 28%–36% tính trên trọng lượng; dạng lỏng, không màu, mùi hắc nhẹ của Axit Formic, dễ tan trong nước, điểm sôi trên 100 độ C; dùng bổ sung trong dinh dưỡng vật nuôi như heo và gia cầm giúp hạ và ổn định pH của nước uống và thức ăn, tăng cường enzyme nội sinh cải thiện hệ số chuyển hóa thức ăn và ức chế sự phát triển của các vi sinh vật có hại trong nước uống và đường ruột), phân loại vào nhóm 23.09, phân nhóm 2309.90, mã số 2309.90.20; có hiệu lực từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Thức ăn bổ sung dạng hỗn hợp chứa axit hữu cơ dùng bổ sung vào nước uống và thức ăn lỏng cho vật nuôi (hỗn hợp của Axit Formic HCOOH 51%–63% và Natri Formate HCOONa 28%–36% tính trên trọng lượng; dạng lỏng, không màu, mùi hắc nhẹ, dễ tan trong nước, điểm sôi > 100 độ C; dùng bổ sung trong dinh dưỡng vật nuôi giúp hạ và ổn định pH của nước uống và thức ăn, hỗ trợ ức chế vi khuẩn có hại E.Coli, Salmonella, Campylobacter và cải thiện hệ số chuyển hóa thức ăn) thuộc nhóm 23.09, phân nhóm 2309.90, mã số 2309.90.20.'
