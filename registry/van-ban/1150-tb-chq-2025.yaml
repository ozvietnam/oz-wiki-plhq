xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/15/VB_1150.pdf, id=99811, SHA-256 2594c1e8da85755b1a290dadfa166429fbe9fc63ffae94674e8eefd817d110ef): Thông báo số 1150/TB-CHQ ngày 04-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Source PCB Assembly (tên gọi theo cấu tạo, công dụng: Bản mạch in đã lắp ráp Source PCB Assembly của mô-đun màn hình OLED 15.6 inch dùng lắp đặt màn hình hiển thị trên ô tô; ký, mã hiệu 6871L-8301A, nhà sản xuất LTE Mountis; gồm mạch in, chip điện tử, cuộn cảm, đi-ốt, điện trở cố định, IC, RAM điện từ, tụ điện, transistor, 01 khe nối cáp và mạch định giờ Timing control IC; kích thước 298mm x 55mm x 0.8mm, trọng lượng 30.5g, điện áp 24V; chức năng biến đổi và truyền dẫn tín hiệu video nhận từ bản mạch chính Set Main Board đến Source Drive IC trên mô-đun màn hình OLED), phân loại vào nhóm 85.29, phân nhóm 8529.90, mã số 8529.90.53; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
