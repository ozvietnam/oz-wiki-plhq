ghi_chu: 'Xác định trước mã số mặt hàng Bản mạch in đã lắp ráp Source PCB Assembly của mô-đun màn hình OLED 15.6 inch dùng lắp đặt màn hình hiển thị trên ô tô (ký, mã hiệu 6871L-8301A, nhà sản xuất LTE Mountis; kích thước 298x55x0.8mm, nặng 30.5g, điện áp 24V, có chức năng biến đổi và truyền dẫn tín hiệu video từ Set Main Board đến Source Drive IC trên mô-đun màn hình OLED) thuộc nhóm 85.29, phân nhóm 8529.90, mã số 8529.90.53.'
