xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 78 ngày 02-02-2026 (có lớp chữ) và tệp ký số 26-cp.signed.pdf trên vanban.chinhphu.vn (docid=216673): số hiệu, trích yếu, ngày ký 17-01-2026, người ký Phó Thủ tướng Bùi Thanh Sơn. Cấu trúc 5 Chương / 31 Điều / 0 Phụ lục (toàn văn không có phụ lục riêng; chỉ tham chiếu Phụ lục III của NĐ 24/2026/NĐ-CP tại Điều 14, 16). Chương I (Đ1–3) QUY ĐỊNH CHUNG: Đ1 Phạm vi điều chỉnh, Đ2 Giải thích từ ngữ, Đ3 Trách nhiệm quản lý nhà nước về hóa chất. Chương II (Đ4–22) QUẢN LÝ HOẠT ĐỘNG HÓA CHẤT: Đ4 ĐK chung an toàn SX hóa chất, Đ5 ĐK chung an toàn KD hóa chất, Đ6 Khai báo hóa chất NK, Đ7 ĐK SX hóa chất có ĐK, Đ8 ĐK KD hóa chất có ĐK, Đ9 Hồ sơ/trình tự/thủ tục cấp GCN đủ ĐK SX hóa chất có ĐK, Đ10 XK/NK hóa chất có ĐK, Đ11 ĐK SX hóa chất cần kiểm soát đặc biệt, Đ12 ĐK KD hóa chất cần kiểm soát đặc biệt, Đ13 Hồ sơ cấp Giấy phép SX, Đ14 Hồ sơ cấp Giấy phép KD, Đ15 Công bố loại hóa chất và mục đích SD, Đ16 ĐK SX hóa chất cấm, Đ17 Hồ sơ cấp GCN hóa chất cấm, Đ18 XK/NK hóa chất cấm, Đ19 ĐK cấp GCN đủ ĐK dịch vụ tồn trữ hóa chất, Đ20 Hồ sơ cấp GCN dịch vụ tồn trữ, Đ21 Miễn cấp GCN, Đ22 Thu hồi GCN. Chương III (Đ23–27) THÔNG TIN HÓA CHẤT: Đ23 Đăng ký hóa chất mới, Đ24 Tổ chức đánh giá hóa chất mới, Đ25 Quản lý hóa chất mới, Đ26 Bảo mật thông tin, Đ27 Chuyển đổi số trong QLNN về hóa chất. Chương IV (Đ28–29) HÓA CHẤT NGUY HIỂM TRONG SẢN PHẨM, HÀNG HOÁ: Đ28 Kiểm soát HC nguy hiểm trong SX SP, Đ29 Công bố thông tin hàm lượng HC nguy hiểm trong SP/hàng hóa. Chương V (Đ30–31) ĐIỀU KHOẢN THI HÀNH: Đ30 Điều khoản chuyển tiếp, Đ31 Hiệu lực thi hành. Điều 31: khoản 1 hiệu lực từ ngày ký (17-01-2026); khoản 2 quy định Điều 19, Điều 20 hiệu lực từ 01-07-2026; khoản 3 cho NĐ 113/2017/NĐ-CP và NĐ 82/2022/NĐ-CP hết hiệu lực từ 17-01-2026; khoản 4 bãi bỏ một phần NĐ 17/2020/NĐ-CP (Điều 8), NĐ 33/2024/NĐ-CP (khoản 2 Điều 34), NĐ 146/2025/NĐ-CP (Điều 14–16 và Phụ lục II). Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn (https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-26-2026-nd-cp-468804.htm), vanban.chinhphu.vn (https://vanban.chinhphu.vn/?docid=216673&pageid=27160) và sổ đồng bộ ozvietnam/hs-code-api (data/plhq-registry.json, syncedAt 2026-11-12): không có văn bản nào sửa đổi, bổ sung, thay thế hay bãi bỏ NĐ 26/2026/NĐ-CP sau ngày 17-01-2026; toàn bộ Nghị định (kể cả Điều 19, 20 từ 01-07-2026) đang CON_HIEU_LUC.'
