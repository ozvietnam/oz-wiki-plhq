ghi_chu: 'Nghị định quy định chi tiết và hướng dẫn thi hành Luật Hóa chất số 69/2025/QH15 (được hướng dẫn chi tiết bởi Thông tư 01/2026/TT-BCT ban hành cùng ngày 17-01-2026). Danh mục hóa chất ban hành riêng tại NĐ 24/2026/NĐ-CP (cùng ngày 17-01-2026, chưa đăng ký sổ). Điều 30 có quy định chuyển tiếp: giấy chứng nhận/giấy phép cấp theo NĐ 113/2017/NĐ-CP được dùng tiếp tới 31-12-2026, 31-12-2027 hoặc hết hạn tuỳ trường hợp (khoản 2–7). Khoản 4 Điều 31 (bãi bỏ một phần NĐ 17/2020/NĐ-CP, 33/2024/NĐ-CP, 146/2025/NĐ-CP) ghi nhận tại pham_vi, chưa đưa vào quan_he vì các văn bản đó chưa có trong sổ. Đã đối chiếu tình trạng hiện tại ngày 2026-11-12 trên Công báo và Cổng TTĐT Chính phủ: chưa có văn bản sửa đổi, bổ sung hay thay thế.'
