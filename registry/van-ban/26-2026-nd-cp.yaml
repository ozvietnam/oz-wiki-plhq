xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 78 ngày 02-02-2026 (có lớp chữ) và tệp ký số 26-cp.signed.pdf trên vanban.chinhphu.vn (docid=216673): số hiệu, trích yếu, ngày ký 17-01-2026, người ký Phó Thủ tướng Bùi Thanh Sơn. Cấu trúc 5 Chương / 31 Điều / 0 Phụ lục (toàn văn không có phụ lục riêng; chỉ tham chiếu Phụ lục III của NĐ 24/2026/NĐ-CP tại Điều 14, 16). Chương I (Đ1–3) QUY ĐỊNH CHUNG: Đ1 Phạm vi điều chỉnh, Đ2 Giải thích từ ngữ, Đ3 Trách nhiệm quản lý nhà nước về hóa chất. Chương II (Đ4–22) QUẢN LÝ HOẠT ĐỘNG HÓA CHẤT: Đ4 ĐK chung an toàn SX hóa chất, Đ5 ĐK chung an toàn KD hóa chất, Đ6 Khai báo hóa chất NK, Đ7 ĐK SX hóa chất có ĐK, Đ8 ĐK KD hóa chất có ĐK, Đ9 Hồ sơ/trình tự/thủ tục cấp GCN đủ ĐK SX hóa chất có ĐK, Đ10 XK/NK hóa chất có ĐK, Đ11 ĐK SX hóa chất cần kiểm soát đặc biệt, Đ12 ĐK KD hóa chất cần kiểm soát đặc biệt, Đ13 Hồ sơ cấp Giấy phép SX, Đ14 Hồ sơ cấp Giấy phép KD, Đ15 Công bố loại hóa chất và mục đích SD, Đ16 ĐK SX hóa chất cấm, Đ17 Hồ sơ cấp GCN hóa chất cấm, Đ18 XK/NK hóa chất cấm, Đ19 ĐK cấp GCN đủ ĐK dịch vụ tồn trữ hóa chất, Đ20 Hồ sơ cấp GCN dịch vụ tồn trữ, Đ21 Miễn cấp GCN, Đ22 Thu hồi GCN. Chương III (Đ23–27) THÔNG TIN HÓA CHẤT: Đ23 Đăng ký hóa chất mới, Đ24 Tổ chức đánh giá hóa chất mới, Đ25 Quản lý hóa chất mới, Đ26 Bảo mật thông tin, Đ27 Chuyển đổi số trong QLNN về hóa chất. Chương IV (Đ28–29) HÓA CHẤT NGUY HIỂM TRONG SẢN PHẨM, HÀNG HOÁ: Đ28 Kiểm soát HC nguy hiểm trong SX SP, Đ29 Công bố thông tin hàm lượng HC nguy hiểm trong SP/hàng hóa. Chương V (Đ30–31) ĐIỀU KHOẢN THI HÀNH: Đ30 Điều khoản chuyển tiếp, Đ31 Hiệu lực thi hành. Điều 31: khoản 1 hiệu lực từ ngày ký (17-01-2026); khoản 2 quy định Điều 19, Điều 20 hiệu lực từ 01-07-2026; khoản 3 cho NĐ 113/2017/NĐ-CP và NĐ 82/2022/NĐ-CP hết hiệu lực từ 17-01-2026; khoản 4 bãi bỏ một phần NĐ 17/2020/NĐ-CP (Điều 8), NĐ 33/2024/NĐ-CP (khoản 2 Điều 34), NĐ 146/2025/NĐ-CP (Điều 14–16 và Phụ lục II). Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn (https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-26-2026-nd-cp-468804.htm), vanban.chinhphu.vn (https://vanban.chinhphu.vn/?docid=216673&pageid=27160) và sổ đồng bộ ozvietnam/hs-code-api (data/plhq-registry.json, syncedAt 2026-11-12): không có văn bản nào sửa đổi, bổ sung, thay thế hay bãi bỏ NĐ 26/2026/NĐ-CP sau ngày 17-01-2026; toàn bộ Nghị định (kể cả Điều 19, 20 từ 01-07-2026) đang CON_HIEU_LUC.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Nghị định này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Hóa chất về quản lý hoạt động hóa chất và hóa chất nguy hiểm trong sản phẩm, hàng hóa bao gồm: 1. Khoản 5 Điều 2 về các tiêu chí cụ thể đối với “chất độc”.'
      trang_pdf: 1
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Hóa chất Bảng là hóa chất được kiểm soát theo quy định của Công ước cấm phát triển, sản xuất, tàng trữ, sử dụng và phá hủy vũ khí hóa học và được ban hành tại Danh mục của Nghị định số 24/2026/NĐ-CP ngày 17 tháng 01 năm 2026 của Chính phủ quy định các danh mục hóa chất thuộc phạm vi điều chỉnh của Luật Hóa chất.'
      trang_pdf: 3
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 3
      noi_dung: 'Điều 3. Trách nhiệm quản lý nhà nước về hóa chất 1. Bộ Công Thương trong phạm vi nhiệm vụ, quyền hạn của mình thực hiện các nội dung quản lý nhà nước về hoạt động hóa chất sau đây: a) Quản lý hóa chất sử dụng trong công nghiệp, hóa chất là tiền chất thuộc Danh mục do Chính phủ ban hành theo phân công của Chính phủ và hóa chất thuộc Công ước cấm phát triển, sản xuất, tàng trữ, sử dụng và phá hủy vũ khí hóa học;'
      trang_pdf: 4
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 8
      noi_dung: Điều 8. Điều kiện kinh doanh hóa chất có điều kiện 1. Tổ chức kinh doanh hóa chất có điều kiện là tổ chức được thành lập theo quy định của pháp luật. 2. Thuê kho của tổ chức được cơ quan có thẩm quyền cấp Giấy chứng nhận đủ điều kiện hoạt động dịch vụ tồn trữ hóa chất phù hợp với quy mô, loại hóa chất của tổ chức thực hiện kinh doanh hoặc có kho tồn trữ hóa chất phải đáp ứng quy định tại khoản 2, 3, 4, 5 Điều 4 của Nghị định này.
      trang_pdf: 9
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 11
      noi_dung: 'Điều 11. Điều kiện sản xuất hóa chất cần kiểm soát đặc biệt 1. Tổ chức sản xuất hóa chất cần kiểm soát đặc biệt là tổ chức được thành lập theo quy định của pháp luật. 2. Nhà xưởng, kho chứa sản xuất hóa chất phải đáp ứng các điều kiện sau: a) Đáp ứng quy định tại khoản 2, 3, 4, 5 Điều 4 của Nghị định này; b) Phải có quy trình thao tác an toàn. Quy trình phải được niêm yết tại khu vực sản xuất hoá chất cần kiểm soát đặc biệt.'
      trang_pdf: 15
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 15
      noi_dung: Điều 15. Công bố loại hóa chất và mục đích sử dụng 1. Tổ chức, cá nhân sử dụng hóa chất cần kiểm soát đặc biệt để sản xuất hàng hóa, dịch vụ có nghĩa vụ công bố loại hóa chất và mục đích sử dụng hóa chất trên Cơ sở dữ liệu chuyên ngành hóa chất trước 30 ngày khi đưa hóa chất vào sử dụng lần đầu hoặc khi thay đổi mục đích sử dụng đã công bố.
      trang_pdf: 22
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 19
      noi_dung: 'Điều 19. Điều kiện cấp Giấy chứng nhận đủ điều kiện hoạt động dịch vụ tồn trữ hóa chất Tổ chức thực hiện dịch vụ tồn trữ hóa chất đối với hóa chất có điều kiện, hóa chất cần kiểm soát đặc biệt phải được cấp Giấy chứng nhận đủ điều kiện hoạt động dịch vụ tồn trữ hóa chất khi đáp ứng các điều kiện sau đây: 1. Tổ chức thực hiện dịch vụ tồn trữ hóa chất là tổ chức được thành lập theo quy định của pháp luật.'
      trang_pdf: 28
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 23
      noi_dung: 'Điều 23. Đăng ký hóa chất mới 1. Hồ sơ đăng ký hóa chất mới bao gồm: a) Văn bản đăng ký hóa chất mới; b) Kết quả đánh giá hóa chất mới bao gồm thông tin về tính chất vật lý, hóa học và đặc tính nguy hiểm của hóa chất được cung cấp bởi tổ chức đánh giá hóa chất mới quy định tại Điều 21 của Luật Hóa chất.'
      trang_pdf: 34
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 26
      noi_dung: Điều 26. Bảo mật thông tin 1. Tổ chức, cá nhân khai báo, đăng ký, báo cáo, cập nhật thông tin, cập nhật dữ liệu theo quy định của Luật Hóa chất có quyền yêu cầu cơ quan, tổ chức tiếp nhận có trách nhiệm bảo mật thông tin có liên quan đến bí quyết công nghệ, bí mật thương mại trừ trường hợp quy định tại khoản 2 Điều 26 của Luật Hóa chất.
      trang_pdf: 37
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
    - dieu: 31
      noi_dung: Điều 31. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành. 2. Quy định về Giấy chứng nhận đủ điều kiện hoạt động dịch vụ tồn trữ hóa chất tại Điều 19, Điều 20 Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026.
      trang_pdf: 42
      sha256_pdf: e75a28f83e47aaf86858859afa42da0677deac34f82f926b996b095c0d7656d6
ghi_chu: 'Nghị định quy định chi tiết và hướng dẫn thi hành Luật Hóa chất số 69/2025/QH15 (được hướng dẫn chi tiết bởi Thông tư 01/2026/TT-BCT ban hành cùng ngày 17-01-2026). Danh mục hóa chất ban hành riêng tại NĐ 24/2026/NĐ-CP (cùng ngày 17-01-2026, chưa đăng ký sổ). Điều 30 có quy định chuyển tiếp: giấy chứng nhận/giấy phép cấp theo NĐ 113/2017/NĐ-CP được dùng tiếp tới 31-12-2026, 31-12-2027 hoặc hết hạn tuỳ trường hợp (khoản 2–7). Khoản 4 Điều 31 (bãi bỏ một phần NĐ 17/2020/NĐ-CP, 33/2024/NĐ-CP, 146/2025/NĐ-CP) ghi nhận tại pham_vi, chưa đưa vào quan_he vì các văn bản đó chưa có trong sổ. Đã đối chiếu tình trạng hiện tại ngày 2026-11-12 trên Công báo và Cổng TTĐT Chính phủ: chưa có văn bản sửa đổi, bổ sung hay thay thế.'
