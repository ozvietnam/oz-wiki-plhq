ghi_chu: 'Nghị định hướng dẫn Luật Hóa chất số 69/2025/QH15. Danh mục hóa chất ban hành riêng tại NĐ 24/2026/NĐ-CP (cùng ngày 17-01-2026, chưa đăng ký sổ). Điều 30 có quy định chuyển tiếp: giấy chứng nhận/giấy phép cấp theo NĐ 113/2017 được dùng tiếp tới 31-12-2026, 31-12-2027 hoặc hết hạn tuỳ trường hợp (khoản 2–7). Chưa kiểm tình trạng hiện tại (văn bản sửa đổi sau) nên hieu_luc_da_doi_chieu: false. Khoản 4 Điều 31 (bãi bỏ một phần NĐ 17/2020, 33/2024, 146/2025) chưa ghi vào quan_he vì các văn bản đó chưa có trong sổ.'
