  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/13/1.VB_18550.pdf, id=105086, SHA-256 12f091fdf9a43499ce794f3e76c75e61f005decb42c72ed8a48edff0fe50cf15): Thông báo số 18550/TB-CHQ ngày 06-07-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 18550/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Bột từ gan gà Chicken Liver Powder T-742E (thành phần gồm gan gà Chicken Liver 99.88%, Enzyme gồm Protease và Dextrin 0.10%, hỗn hợp Tocopherol cô đặc và dầu hạt cải chống oxy hóa 0.02%; dạng bột màu nâu, mùi gan gà nấu chín, độ ẩm <= 6.0%, hàm lượng Nitơ tổng số >= 9.0%, sản xuất qua nghiền, phối trộn gia nhiệt >= 92 độ C, tách dầu, lọc, xử lý từ tính, sấy phun và sàng 24 mesh; nhà sản xuất Thai Nikken Food Co.,Ltd.; dùng làm nguyên liệu tạo hương vị trong chế biến thực phẩm cho người), phân loại vào nhóm 02.10, phân nhóm 0210.99, mã số 0210.99.90; có hiệu lực từ ngày ký'
