ghi_chu: 'Xác định trước mã số mặt hàng Bột từ gan gà Chicken Liver Powder T-742E (99.88% gan gà, 0.10% enzyme Protease và Dextrin, 0.02% hỗn hợp Tocopherol cô đặc; chế biến qua nghiền, gia nhiệt, tách dầu, sấy phun và sàng 24 mesh; dùng làm nguyên liệu tạo hương vị trong chế biến thực phẩm cho người) thuộc nhóm 02.10, phân nhóm 0210.99, mã số 0210.99.90.'
