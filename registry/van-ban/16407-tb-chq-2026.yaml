  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/21/23.VB_16407.pdf, id=103923, SHA-256 1234b65701beef759124cb7ad77049df1fee2288b6fb59086805afabf40912bf): Thông báo số 16407/TB-CHQ ngày 18-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cao cô đặc xương ngựa bạch (tên khoa học Equus ferus caballus; dạng bánh/cao đặc màu nâu; thành phần sau chiết xuất chứa protein, collagen, tổng hàm lượng 18 axit amin > 70 g/100g, béo tổng tối đa 3 g/100g, Canxi > 18 mg/100g, Magie > 5 mg/100g, Phospho tổng số > 70 mg/kg; đóng gói túi PE kín 3-30 kg/gói trong hộp carton; dùng làm nguyên liệu để tiếp tục chế biến sản xuất thực phẩm, thực phẩm bổ sung, thực phẩm bảo vệ sức khỏe), phân loại vào nhóm 21.06, phân nhóm 2106.90, mã số 2106.90.99; có hiệu lực kể từ ngày ký'
