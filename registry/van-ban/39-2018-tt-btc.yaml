    - dieu: 3
      noi_dung: Điều 3. Điều khoản chuyến tiếp 1. Trong trường hợp Hệ thống xử lý dữ liệu điện tử hải quan gặp sự cố hoặc chưa có chức năng đáp ứng yêu cầu truyền nhận thông tin điện tử theo quy định tại Thông tư này, người khai hải quan và cơ quan hải quan thực hiện các thủ tục có liên quan trên hồ sơ giấy.
      trang_pdf: 188
    - dieu: 4
      noi_dung: Điều 4. Trách nhiệm tổ chức thực hiện 1. Tổng cục trưởng Tổng cục Hải quan căn cứ vào hướng dẫn tại Thông tư này hướng dẫn các đơn vị hải quan thực hiện thống nhất, bảo đám vừa tạo điều kiện thông thoáng cho hoạt động xuất khẩu, nhập khẩu, vừa thực hiện tốt công tác quản lý hải quan.
      trang_pdf: 188
    - dieu: 5
      noi_dung: Điều 5. Hiệu lực thihành 1. Thông tư này có hiệu lực ké từ ngày 05 tháng 06 năm 2018. 2. Quá trình thực biện, nếu các văn bản liên quan dé cập tại Thông tư này được sửa đổi, bổ sung hoặc thay thé thì thực hiện theo văn bản mới được sửa đổi, bé sung hoặc thay thế./.
      trang_pdf: 189
