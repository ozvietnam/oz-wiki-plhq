ghi_chu: 'Nạp đợt "làm tất" 6/11 (#87 P1/P2 + #209). CẢNH BÁO NHẪM: issue #87 gán "78/2014/NĐ-CP — Vận chuyển hàng hóa XNK (sửa bởi 59/2018, 160/2023?)" — SAI; đây là NĐ về giải thưởng KHCN. Hệ thống quốc gia KHÔNG cho thấy 59/2018/NĐ-CP hay 160/2023/NĐ-CP sửa NĐ này (chỉ có 60/2019/NĐ-CP). Thủ tục TTHC đối với hàng XNK, quá cảnh và phương tiện vận tải xuất nhập cảnh hiện tập trung tại NĐ 336/2026/NĐ-CP (22/8/2026, HL 15/10/2026, thay NĐ 85/2019/NĐ-CP) — nếu cần VB vận tải gốc cũ phải săn riêng, lượt này không xác định được số hiệu. Liên quan XNK: không liên quan; gắn nhãn quan-ly-ngoai-thuong tạm để theo mẫu sổ, nên bỏ khi hợp nhất.'
