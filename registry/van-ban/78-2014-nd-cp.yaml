  pham_vi: 'Đọc bản scan ký số (OCR trang đầu và điều cuối): số 78/2014/NĐ-CP ngày 30/7/2014; Điều 34 hiệu lực 15/9/2014. Sửa đổi: NĐ 60/2019/NĐ-CP ngày 05/07/2019 (trích yếu hệ thống quốc gia, docid 197341); TT 31/2014/TT-BKHCN chỉ là hướng dẫn. Hết hiệu lực: Điều 30 khoản 2 NĐ 18/2024/NĐ-CP (ngày 21/02/2024) — đọc trực tiếp bản scan NĐ 18/2024: NĐ 78/2014 và NĐ 60/2019 hết hiệu lực từ 10/04/2024 (ngày NĐ 18/2024 có hiệu lực).'
