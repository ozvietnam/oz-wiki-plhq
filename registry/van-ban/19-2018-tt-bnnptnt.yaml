xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF ký số bậc A trên datafiles.chinhphu.vn (2019/01/19-bnnptnt.signed.pdf, 26 trang, Văn phòng Chính phủ ký số ngày 22-01-2019) và Điều 1 Thông tư 01/2022/TT-BNNPTNT ngày 18-01-2022: số hiệu 19/2018/TT-BNNPTNT, trích yếu "Hướng dẫn về bảo vệ và phát triển nguồn lợi thủy sản", Thứ trưởng Phùng Đức Tiến ký ngày 15-11-2018, có hiệu lực thi hành từ ngày 01-01-2019 theo khoản 1 Điều 17; cấu trúc gồm 6 Chương, 18 Điều và 03 Phụ lục (Phụ lục I–III). Khoản 2 Điều 17 bãi bỏ các Chỉ thị 08/2005/CT-BTS, 02/2007/CT-BTS, Quyết định 105/2007/QĐ-BNN, 82/2008/QĐ-BNN, Thông tư 01/2011/TT-BNNPTNT, 53/2009/TT-BNN và thay thế các Thông tư 02/2006/TT-BTS, 62/2008/TT-BNNPTNT, 89/2011/TT-BNNPTNT, 29/2013/TT-BNNPTNT, 44/2013/TT-BNNPTNT. Được sửa đổi, bổ sung một số điều, phụ lục và bãi bỏ điểm b khoản 4 Điều 11, khoản 2 Điều 15 kể từ ngày 04-03-2022 theo Điều 1 Thông tư 01/2022/TT-BNNPTNT ngày 18-01-2022.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh _ Thông tư này quy định về quy trình, hướng dẫn thực hiện điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản; trình tự, thủ tục lập, thấm định dự án thành lập, nội dung quyết định thành lập khu bảo tồn biển cấp tỉnh; hướng dẫn quan lý khu bảo vệ nguồn lợi thủy sản; tiêu chí và ban hành Danh mục nghề, ngư cụ cấm sử dụng khai thác thủy sản; Danh mục khu vực cấm khai thác thuỷ sản có thời hạn;
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài có hoạt động liên quan đến. bảo vệ và phát triển nguồn lợi thủy sản, khai thác thủy sản trong nội địa, đảo, quần đảo và vùng biển Việt Nam. CHƯƠNG II DIEU TRA, DANH GIÁ NGUON LOI THUY SAN VA MOI TRUONG SONG CUA LOAI THUY SAN
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Quy trình điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản Điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản được thực hiện theo quy trình sau đây: 1. Thiết kế điều tra. 2. Chuẩn bị điều tra.'
      trang_pdf: 1
    - dieu: 6
      noi_dung: Điều 6. Hướng dẫn thực hiện điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản theo chuyên đề 1. Nội dung điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản theo chuyên đề bao gồm ít nhất một trong các nội dung quy định tại khoản 1 Điều 4 của Thông tư này.
      trang_pdf: 3
    - dieu: 7
      noi_dung: 'Điều 7. Kết quả điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản Kết quả điều tra, đánh giá nguồn lợi thủy sản và môi trường sống của loài thủy sản bao gồm: 1. Bộ đữ liệu điều tra về nguồn lợi thủy sản và nghề cá thương phẩm;'
      trang_pdf: 3
    - dieu: 9
      noi_dung: 'Điều 9. Trinh tự, thủ tục thẫm định dự án thành lập khu bảo tồn biển cấp tỉnh 1. Hồ sơ thâm định dự án: a) Tờ trình đề nghị thẩm định dự án thành lập khu bao tồn biển cấp tỉnh; b) Dự án thành lập khu bảo tồn biển cấp tinh theo mẫu số 01 Phụ lục I ban hành kèm theo Thông tư này;'
      trang_pdf: 4
    - dieu: 11
      noi_dung: Điều 11. Quản lý khu bảo vệ nguồn lợi thủy sản 1. Căn cứ vào tình hình thực tế của địa phương, khu bảo vệ nguồn lợi thủy sản được giao cho cơ quan quản lý nhà nước về thủy sản cấp tỉnh hoặc chính 5
      trang_pdf: 5
    - dieu: 13
      noi_dung: 'Điều 13. Nghề, ngư cụ cắm sử dụng khai thác thủy sản 1. Tiêu chí xác định nghề, ngư cụ cắm sử dụng khai thác thủy sản Nghề, ngư cụ cam sử dụng khai thác thủy sản được xác định bởi một trong các tiêu chí sau đây: a) Nghề, ngư cu gây nguy hai, hủy diệt nguồn lợi thủy sản, môi trường sông của loài thủy sản, hệ sinh thái thủy sinh đã được đánh giá tác động;'
      trang_pdf: 7
    - dieu: 14
      noi_dung: 'Điều 14. Khu vực cấm khai thác thủy sản có thời hạn 1. Tiêu chí xác định khu vực cắm khai thác thủy sản có thời hạn. Khu vực cấm khai thác thủy sản có thời hạn được xác định bởi một trong các tiêu chí sau đây: a) Khu vực tập trung sinh sản của loài thủy sản, khu vực có mật độ phân bố trứng của các loài thủy sản cao hơn so với vùng lân cận; b) Khu vực tập trung sinh sống của thủy sản chưa thành thục sinh sản, khu'
      trang_pdf: 7
    - dieu: 17
      noi_dung: 'Điều 17. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2019. 2. Thông tư này thay thế, bãi bỏ nội dung các văn bản sau: a) Bãi bỏ Chỉ thị số 08/2005/CT-BTS ngày 25 tháng 8 năm 2005 của Bộ trưởng Bộ Thủy sản về việc triển khai hoạt động thu mẫu thống kê các số liệu nghề cá cơ bản; b) Bãi bó Chỉ thị số 02/2007/CT-BTS ngày 15 tháng 6 năm 2007 của Bộ trưởng Bộ Thủy sản về việc tăng cường quản lý nghề cá nội địa;'
      trang_pdf: 8
