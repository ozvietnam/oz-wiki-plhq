# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 38/2018/TT-NHNN
loai: THONG_TU
ten: Quy định việc nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền của Ngân hàng Nhà nước Việt Nam
co_quan: NHNN
ngay_ban_hanh: '2018-12-25'
hieu_luc_tu: '2019-02-08'
tinh_trang: CON_HIEU_LUC
nhanh:
  - kiem-tra-chuyen-nganh/bct
xac_minh:
  muc: NGUON_A
  pham_vi: 'Công báo Số 15 + 16 ngày 04-01-2019 (id=27960), toàn văn PDF/txt (raw/download/congbaocdn.chinhphu.vn/38-2018-tt-nhnn.pdf, wiki/sources/38-2018-tt-nhnn.md, 9 Điều + Phụ lục, người ký Phó Thống đốc Đào Minh Tú) và cạnh ngược trong sổ: Thông tư 38/2018/TT-NHNN ban hành ngày 25-12-2018, có hiệu lực thi hành kể từ ngày 08-02-2019 theo khoản 1 Điều 9 (khoản 2 Điều 9 thay thế TT 18/2014/TT-NHNN và TT 15/2017/TT-NHNN); đối chiếu đang còn hiệu lực, đã được sửa đổi, bổ sung một số điều kể từ ngày 14-08-2023 bởi Điều 1 Thông tư 07/2023/TT-NHNN'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định việc nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền của Ngân hàng Nhà nước Việt Nam (sau đây gọi tắt là Ngân hàng Nhà nước) theo phương thức chỉ định thương nhân được quy định tại Phụ lục II ban hành kèm theo Nghị định số 69/2018/NĐ-CP ngày 15 tháng 5 năm 2018 của Chính phủ quy định chi tiết một số điều của Luật Quản lý ngoại thương.'
      trang_pdf: 1
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 2
      khoan: 1
      noi_dung: '1. Thương nhân là cơ sở in, đúc tiền được chỉ định để thực hiện việc in, đúc tiền theo hợp đồng giữa Ngân hàng Nhà nước với cơ sở in, đúc tiền.'
      trang_pdf: 1
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 2
      khoan: 2
      noi_dung: '2. Ngân hàng Nhà nước; cơ quan, tổ chức và cá nhân có liên quan đến việc nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền của Ngân hàng Nhà nước.'
      trang_pdf: 1
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 3
      khoan: 1
      noi_dung: '1. Danh mục hàng hóa chỉ định cơ sở in, đúc tiền nhập khẩu phục vụ hoạt động in, đúc tiền của Ngân hàng Nhà nước được quy định tại Phụ lục ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 3
      khoan: 2
      noi_dung: '2. Ngân hàng Nhà nước có văn bản chỉ định và cho phép cơ sở in, đúc tiền được nhập khẩu hàng hóa quy định tại khoản 1 Điều này.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 4
      khoan: 1
      noi_dung: '1. Căn cứ văn bản chỉ định và cho phép cơ sở in, đúc tiền được nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền quy định tại khoản 2 Điều 3 Thông tư này và hợp đồng in, đúc tiền giữa cơ sở in, đúc tiền với Ngân hàng Nhà nước, cơ sở in, đúc tiền thực hiện việc nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 4
      khoan: 2
      noi_dung: '2. Thống đốc Ngân hàng Nhà nước ủy quyền Cục trưởng Cục Phát hành và Kho quỹ có văn bản xác nhận việc cơ sở in, đúc tiền nhập khẩu hàng hóa phục vụ hoạt động in, đúc tiền của Ngân hàng Nhà nước theo hợp đồng mua bán hàng hóa hoặc các hình thức văn bản khác giữa cơ sở in, đúc tiền và đơn vị cung cấp hàng hóa.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 4
      khoan: 3
      noi_dung: '3. Khi làm thủ tục nhập khẩu, cơ sở in, đúc tiền gửi Cơ quan hải quan 01 (một) bản chính văn bản xác nhận của Ngân hàng Nhà nước kèm hồ sơ nhập khẩu theo quy định của Cơ quan hải quan.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 5
      khoan: 1
      noi_dung: '1. Kiểm tra, theo dõi và quản lý việc sử dụng hàng hóa nhập khẩu phục vụ hoạt động in, đúc tiền của cơ sở in, đúc tiền.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 5
      khoan: 2
      noi_dung: '2. Thực hiện các trách nhiệm khác theo quy định tại Điều 4 Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 6
      khoan: 1
      noi_dung: '1. Thực hiện nhập khẩu đúng số lượng, chất lượng, chủng loại hàng hóa và tuân thủ các quy định của pháp luật về nhập khẩu hàng hóa.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 6
      khoan: 2
      noi_dung: '2. Cơ sở in, đúc tiền phải sử dụng hàng hóa đã nhập khẩu đúng mục đích.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 6
      khoan: 3
      noi_dung: '3. Định kỳ hàng quý (chậm nhất vào ngày 18 của tháng đầu quý tiếp theo), cơ sở in, đúc tiền phải báo cáo bằng văn bản gửi Ngân hàng Nhà nước (qua Cục Phát hành và Kho quỹ) về tình hình nhập khẩu và sử dụng hàng hóa đã nhập khẩu.'
      trang_pdf: 2
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 8
      noi_dung: 'Điều 8. Trách nhiệm tổ chức thực hiện Chánh Văn phòng, Cục trưởng Cục Phát hành và Kho quỹ, Thủ trưởng các đơn vị thuộc Ngân hàng Nhà nước, Chủ tịch Hội đồng quản trị, Hội đồng thành viên, Tổng Giám đốc (Giám đốc) cơ sở in, đúc tiền chịu trách nhiệm tổ chức thực hiện Thông tư này.'
      trang_pdf: 3
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 9
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực thi hành kể từ ngày 08 tháng 02 năm 2019.'
      trang_pdf: 3
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
    - dieu: 9
      khoan: 2
      noi_dung: '2. Thông tư này thay thế Thông tư số 18/2014/TT-NHNN ngày 01/8/2014 của Ngân hàng Nhà nước hướng dẫn hoạt động nhập khẩu hàng hóa thuộc diện quản lý chuyên ngành của Ngân hàng Nhà nước Việt Nam và Thông tư số 15/2017/TT-NHNN ngày 05/10/2017 của Ngân hàng Nhà nước sửa đổi, bổ sung một số điều của Thông tư số 18/2014/TT-NHNN ngày 01/8/2014 hướng dẫn hoạt động nhập khẩu hàng hóa thuộc diện quản lý chuyên ngành của Ngân hàng Nhà nước Việt Nam./.'
      trang_pdf: 3
      sha256_pdf: 5c1b31500641f88525e1140fa85e572591c221115b3b11ac3ee682136ac21207
