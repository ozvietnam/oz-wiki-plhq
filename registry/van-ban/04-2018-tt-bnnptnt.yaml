  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định tiêu chí, trình tự, thủ tục công nhận tiến bộ kỹ thuật về giống, sản phẩm, quy trình sản xuất, giải pháp kỹ thuật, giải pháp quản lý trong nông nghiệp (sau đây viết tắt là tiến bộ kỹ thuật).
      trang_pdf: 1
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với tổ chức, cá nhân có hoạt động liên quan đến công nhận tiến bộ kỹ thuật trong nông nghiệp.
      trang_pdf: 2
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 3
      noi_dung: 'Điều 3. Cơ quan thực hiện Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn giao Tổng cục, Cục thuộc Bộ tiếp nhận hồ sơ, xem xét công nhận hoặc hủy bỏ tiến bộ kỹ thuật theo lĩnh vực được phân công quản lý: 1. Tổng cục Thủy sản đối với lĩnh vực thủy sản. 2. Tổng cục Thủy lợi đối với lĩnh vực thủy lợi. 3. Tổng cục Lâm nghiệp đối với lĩnh vực lâm nghiệp. 4. Tổng cục Phòng, chống thiên tai đối với lĩnh vực phòng, chống thiên tai.'
      trang_pdf: 2
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 4
      noi_dung: 'Điều 4. Tiêu chí công nhận tiến bộ kỹ thuật 1. Tiêu chí đối với tiến bộ kỹ thuật công nhận lần đầu: a) Có tính mới, tính sáng tạo, tính ổn định và khả năng cạnh tranh cao; b) Đảm bảo chất lượng, giảm thiểu tác động đến môi trường, có triển vọng mở rộng sản xuất.'
      trang_pdf: 2
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 5
      noi_dung: Điều 5. Hồ sơ đăng ký, tiếp nhận, kiểm tra, thẩm định hồ sơ, công nhận tiến bộ kỹ thuật 1. Hồ sơ đăng ký Tổ chức, cá nhân có nhu cầu đăng ký công nhận tiến bộ kỹ thuật (sau đây viết tắt là tổ chức, cá nhân đăng ký) gửi trực tiếp hoặc qua đường bưu điện 01 bộ hồ sơ về Bộ Nông nghiệp và Phát triển nông thôn theo quy định tại Điều 3 Thông tư này (sau đây viết tắt là cơ quan có thẩm quyền).
      trang_pdf: 3
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 6
      noi_dung: 'Điều 6. Thành phần, phương thức, trình tự phiên họp của hội đồng 1. Thành phần hội đồng a) Hội đồng có 07 thành viên gồm: chủ tịch, phó chủ tịch, 02 ủy viên phản biện, ủy viên thư ký và các ủy viên; trong đó có 01 thành viên đại diện tổ chức, địa phương nơi ứng dụng tiến bộ kỹ thuật; b) Những người không được tham gia hội đồng: tác giả, đồng tác giả đăng ký công nhận tiến bộ kỹ thuật; cá nhân thuộc tổ chức đăng ký công nhận tiến bộ kỹ thuật.'
      trang_pdf: 4
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 7
      noi_dung: 'Điều 7. Hủy bỏ quyết định công nhận tiến bộ kỹ thuật 1. Tiến bộ kỹ thuật bị hủy bỏ khi thuộc một trong các trường hợp sau đây: a) Không được ứng dụng vào sản xuất trong 03 năm liên tiếp tính đến thời điểm rà soát; b) Có sự gian lận hồ sơ đăng ký công nhận tiến bộ kỹ thuật do cơ quan có thẩm quyền kết luận. 2. Cơ quan có thẩm quyền tổ chức rà soát, ban hành Quyết định hủy bỏ tiến bộ kỹ thuật theo Mẫu số 9 ban hành kèm theo Thông tư này.'
      trang_pdf: 5
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 8
      noi_dung: Điều 8. Ban hành Danh mục tiến bộ kỹ thuật 1. Hàng năm, Vụ Khoa học, Công nghệ và Môi trường tổng hợp, trình Bộ trưởng ban hành Danh mục tiến bộ kỹ thuật theo Mẫu số 10 ban hành kèm theo Thông tư này. 2. Trong thời hạn 03 ngày kể từ ngày ban hành, Vụ Khoa học, Công nghệ và Môi trường đăng tải Danh mục tiến bộ kỹ thuật trên cổng thông tin điện tử Bộ Nông nghiệp và Phát triển nông thôn. Chương III TỔ CHỨC THỰC HIỆN
      trang_pdf: 6
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 9
      noi_dung: 'Điều 9. Trách nhiệm của các cơ quan, đơn vị thuộc Bộ Nông nghiệp và Phát triển nông thôn 1. Vụ Khoa học, Công nghệ và Môi trường có trách nhiệm: a) Tổng hợp, báo cáo hàng năm hoặc đột xuất theo yêu cầu của Bộ trưởng về hoạt động công nhận tiến bộ kỹ thuật; b) Tổng hợp trình Bộ trưởng ban hành Danh mục tiến bộ kỹ thuật.'
      trang_pdf: 6
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm của Sở Nông nghiệp và Phát triển nông thôn các tỉnh, thành phố trực thuộc Trung ương 1. Chỉ đạo triển khai và giám sát việc ứng dụng tiến bộ kỹ thuật đã được công nhận tại địa phương. 2. Phối hợp với cơ quan có thẩm quyền trong quá trình thẩm định hồ sơ đề nghị công nhận tiến bộ kỹ thuật đã được ứng dụng tại địa phương.
      trang_pdf: 7
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 11
      noi_dung: Điều 11. Quyền và nghĩa vụ của tổ chức, cá nhân có tiến bộ kỹ thuật được công nhận 1. Quyền của tổ chức, cá nhân có tiến bộ kỹ thuật được công nhận a) Được quảng cáo, công bố, ứng dụng và chuyển giao tiến bộ kỹ thuật vào sản xuất theo quy định của pháp luật; b) Khiếu nại, tố cáo về các hành vi vi phạm về quyền và lợi ích hợp pháp của mình theo quy định của pháp luật.
      trang_pdf: 7
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực và điều khoản thi hành 1. Thông tư này có hiệu lực từ ngày 01 tháng 7 năm 2018. 2. Thông tư này thay thế Thông tư số 13/2015/TT-BNNPTNT ngày 25 tháng 3 năm 2015 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn về hướng dẫn trình tự, thủ tục công nhận tiến bộ kỹ thuật và công nghệ mới ngành Nông nghiệp và Phát triển nông thôn.
      trang_pdf: 7
      sha256_pdf: d1e2e37a1d1d6f0e8579c70f5c75b30f387fcefbe65260f14822657b6ab1d45b
ghi_chu: Quy định tiêu chí, trình tự, thủ tục công nhận tiến bộ kỹ thuật trong nông nghiệp.
