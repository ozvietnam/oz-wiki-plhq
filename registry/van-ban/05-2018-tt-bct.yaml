  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định về quy tắc xuất xứ hàng hóa và kê khai xuất xứ đối với hàng hóa xuất khẩu, hàng hóa nhập khẩu.
      trang_pdf: 1
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với thương nhân, cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa; các cơ quan, tổ chức, cá nhân khác có hoạt động liên quan đến xuất xứ hàng hóa.
      trang_pdf: 1
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 3
      noi_dung: 1. C/O là từ viết tắt của “Giấy chứng nhận xuất xứ hàng hóa”. 2. CNM là từ viết tắt của “Giấy chứng nhận hàng hóa không thay đổi xuất xứ”. 3. Hệ thống hài hòa là cụm từ viết tắt của thuật ngữ “Hệ thống hài hòa mô tả và mã hóa hàng hóa” được định nghĩa tại Công ước quốc tế về Hệ thống hài hòa mô tả và mã hóa hàng hóa của Tổ chức Hải quan Thế giới, trong đó bao gồm tất cả các ghi chú đã có hiệu lực và được sửa đổi sau này.
      trang_pdf: 2
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 4
      noi_dung: Điều 4. Nguyên tắc chung để xác định xuất xứ hàng hóa Hàng hóa được xác định xuất xứ theo quy định tại Thông tư này có xuất xứ tại nước, nhóm nước, hoặc vùng lãnh thổ nơi thực hiện quy trình sản xuất cuối cùng làm thay đổi cơ bản hàng hóa đó.
      trang_pdf: 2
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 5
      noi_dung: Điều 5. Quy tắc xuất xứ hàng hóa ưu đãi 1. Đối với hàng hóa xuất khẩu, hàng hóa nhập khẩu thuộc diện được hưởng chế độ ưu đãi thuế quan và phi thuế quan, quy tắc xuất xứ ưu đãi được thực hiện theo Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập và theo quy định của Bộ Công Thương hướng dẫn Điều ước quốc tế đó.
      trang_pdf: 2
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 6
      noi_dung: Điều 6. Quy tắc xuất xứ hàng hóa không ưu đãi 1. Hàng hóa xuất khẩu, hàng hóa nhập khẩu được coi là có xuất xứ thuần túy hoặc được sản xuất toàn bộ tại một nước, nhóm nước, hoặc vùng lãnh thổ nếu đáp ứng quy định tại Điều 7 Nghị định số 31/2018/NĐ-CP ngày 08 tháng 3 năm 2018 của Chính phủ quy định chi tiết Luật Quản lý ngoại thương về xuất xứ hàng hóa (sau đây gọi tắt là Nghị định số 31/2018/NĐ-CP).
      trang_pdf: 3
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 7
      noi_dung: 'Điều 7. Kê khai, cam kết xuất xứ hàng hóa 1. Thương nhân đề nghị cấp C/O sử dụng các mẫu sau để kê khai, cam kết hàng hóa xuất khẩu đạt tiêu chí xuất xứ ưu đãi hoặc tiêu chí xuất xứ không ưu đãi theo quy định tại điểm e khoản 1 Điều 15 Nghị định số 31/2018/NĐ-CP: a) Bảng kê khai hàng hóa xuất khẩu đạt tiêu chí “Xuất xứ thuần túy” (WO) theo mẫu quy định tại Phụ lục II ban hành kèm theo Thông tư này trong trường hợp nguyên liệu được thu mua trong'
      trang_pdf: 5
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 8
      noi_dung: Điều 8. Kê khai C/O 1. C/O mẫu B của Việt Nam cấp cho hàng hóa xuất khẩu theo mẫu quy định tại Phụ lục XI ban hành kèm theo Thông tư này được kê khai bằng tiếng Anh và đánh máy.
      trang_pdf: 7
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 9
      noi_dung: Điều 9. Kê khai Tờ khai bổ sung C/O 1. Trong trường hợp nhiều mặt hàng không thể kê khai trên cùng một C/O mẫu B của Việt Nam, thương nhân đề nghị cấp C/O sử dụng Tờ khai bổ sung C/O mẫu B của Việt Nam theo mẫu quy định tại Phụ lục XII ban hành kèm theo Thông tư này. Tờ khai bổ sung C/O mẫu B được kê khai bằng tiếng Anh và đánh máy.
      trang_pdf: 8
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 10
      noi_dung: Điều 10. Kê khai CNM CNM do các cơ quan, tổ chức cấp C/O cấp theo mẫu quy định tại Phụ lục XIII ban hành kèm theo Thông tư này được kê khai bằng tiếng Anh và đánh máy.
      trang_pdf: 8
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 11
      noi_dung: 'Điều 11. Tổ chức thực hiện 1. Thông tư này được đăng tải công khai hoặc được niêm yết tại: a) Cổng thông tin điện tử của Bộ Công Thương tại địa chỉ: www.moit.gov.vn; b) Hệ thống quản lý và cấp chứng nhận xuất xứ điện tử của Bộ Công Thương tại địa chỉ www.ecosys.gov.vn; c) Trụ sở của các cơ quan, tổ chức cấp C/O.'
      trang_pdf: 9
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành Thông tư này có hiệu lực thi hành kể từ ngày 03 tháng 4 năm 2018./. BỘ TRƯỞNG Trần Tuấn Anh
      trang_pdf: 9
      sha256_pdf: 1fa7fb9e8281beff519acb7b05c2a001f3cf007a555ac1498c7dbe5942fa06d1
