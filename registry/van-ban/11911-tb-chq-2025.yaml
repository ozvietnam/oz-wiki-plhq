ghi_chu: 'Xác định trước mã số mặt hàng Ống kính zoom góc rộng máy chiếu 1-Chip DLP Projector Zoom Lens ET-C1W300 (ký, mã hiệu ET-C1W300, nhà sản xuất Panasonic; gồm nhiều thấu kính quang học đa lớp đã lắp ráp vào vỏ hợp kim nhôm và nhựa, cơ chế zoom và lấy nét bằng motor điện, khẩu độ F 1.94-2.28, tiêu cự 9.9-12.3 mm, tỷ lệ phóng 0.550-0.690:1; dùng cho máy chiếu Panasonic dòng PT-REQ12/10/80 và PT-REZ12/10/80) thuộc nhóm 90.02, phân nhóm 9002.90, mã số 9002.90.30.'
