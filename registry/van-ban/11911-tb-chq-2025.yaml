xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/7/2/VB_11911.pdf, id=100531, SHA-256 910574b10dad267455dd8b0f63a01924443450af1474a77859072e67dd350683): Thông báo số 11911/TB-CHQ ngày 02-07-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Ống kính góc rộng máy chiếu (tên thương mại 1-Chip DLP Projector Zoom Lens ET-C1W300, ký, mã hiệu ET-C1W300, nhà sản xuất Panasonic; cấu tạo gồm hệ thống nhiều thấu kính quang học đa lớp đã lắp ráp vào vỏ bằng hợp kim nhôm và nhựa cao cấp, cơ chế zoom và lấy nét bằng motor điện; khẩu độ F 1.94-2.28, tiêu cự 9.9-12.3 mm, tỷ lệ phóng 0.550-0.690:1 cho khung hình 16:10 và 16:9, kích thước 154 x 155 x 245 mm, trọng lượng 2.6 kg; thiết kế sử dụng cho các máy chiếu Panasonic PT-REQ12, PT-REQ10, PT-REQ80, PT-REZ12, PT-REZ10, PT-REZ80), phân loại vào nhóm 90.02, phân nhóm 9002.90, mã số 9002.90.30; có hiệu lực từ ngày ký'
