  pham_vi: 'tình trạng hiện tại: Điều 4 khoản 2 TT 28/2026/TT-BCT (PDF Công báo số 328 ngày 14-06-2026, lớp chữ) chấm dứt Khoản 1 Điều 2 và Phụ lục 2 từ 17-07-2026; Phụ lục 1 (chất lượng nhóm 2) chưa bị điều khoản này bãi — khung NĐ 37/2026/NĐ-CP bỏ khái niệm nhóm 2 từ 01-07-2026 nhưng chưa đối chiếu điều khoản bãi Phụ lục 1 trên nguồn A của TT 33/2026/TT-BCT'
