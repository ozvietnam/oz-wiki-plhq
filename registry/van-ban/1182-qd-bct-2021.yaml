ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 249 mã HS). Tiêu đề đã đối chiếu (thuvienphapluat.vn + caselaw.vn (PDF gốc BCT)). KHUNG KTCN 2026: QĐ công bố danh mục theo khung cũ — Phụ lục 2 (ATTP) đã bị TT 28/2026/TT-BCT vượt qua; Phụ lục 1 (chất lượng nhóm 2) chuyển sang đối chiếu TT 33/2026/TT-BCT. Quan hệ pháp lý chính thức: CHƯA XÁC MINH. GHI CHÚ NGHIỆP VỤ (hs-code-api): [PL2] Phụ lục 2 của QĐ 1182/QĐ-BCT — Danh mục kiểm tra chuyên ngành về an toàn thực phẩm (sữa; nước giải khát, rượu, bia, cồn; dầu thực vật; bột, tinh bột, bánh, mứt, kẹo) · [PL1] Phụ lục 1 của QĐ 1182/QĐ-BCT — Danh mục kiểm tra chuyên ngành về chất lượng sản phẩm, hàng hóa nhóm 2 CẬP NHẬT 04/10/2026: hết hiệu lực từ 17/7/2026 theo Điều 4 TT 28/2026/TT-BCT (Hermes-211 (hs-code-api nhánh hermes/ktcn-2026-kiem-chung, reports/ktcn-2026/KIEM-CHUNG.md, 04/10/2026)). Phụ lục 1 (chất lượng nhóm 2) có thuộc phạm vi bãi bỏ không: cần đọc nguyên văn Điều 4.'
