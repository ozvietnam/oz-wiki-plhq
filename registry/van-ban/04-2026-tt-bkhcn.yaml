  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=217125) và toàn văn PDF sao y 11 trang (04-bkhcn.pdf, Bộ trưởng Nguyễn Mạnh Hùng ký ngày 27-02-2026): Điều 1 sửa đổi khoản 1, khoản 3 Điều 4 Thông tư 22/2013/TT-BKHCN (đo lường trong kinh doanh vàng); Điều 2 sửa đổi điểm b mục 3.4.2 QCVN 19:2019/BKHCN kèm Thông tư 08/2019/TT-BKHCN (sản phẩm chiếu sáng LED); Điều 3 sửa đổi mục 4.4.3 QCVN 03:2019/BKHCN kèm Thông tư 09/2019/TT-BKHCN (an toàn đồ chơi trẻ em); Điều 4 sửa đổi khoản 1 Điều 4 Thông tư 23/2013/TT-BKHCN (đã sửa bởi 07/2019/TT-BKHCN và 03/2024/TT-BKHCN) ban hành bảng 69 nhóm phương tiện đo nhóm 2 và chu kỳ kiểm định; Điều 5 bãi bỏ điểm 5.3 Điều 5 QCVN 25:2025/BKHCN kèm Thông tư 01/2025/TT-BKHCN; Điều 6 quy định có hiệu lực từ 15-04-2026 (riêng Điều 2 hết hiệu lực từ 01-06-2026)'
