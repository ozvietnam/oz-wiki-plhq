xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Cổng TTĐT Bộ Xây dựng (moc.gov.vn, vID=897, kèm PDF BXD_81-2026-TT-BXD_04112026.pdf, 1.008.688 byte) và Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=220199, kèm PDF có chữ ký số 81-bxd.signed.pdf trên datafiles.chinhphu.vn, 1.110.695 byte): số ký hiệu 81/2026/TT-BXD, ngày ban hành 04-11-2026, người ký Thứ trưởng Nguyễn Văn Sinh, trích yếu nguyên văn "Quy định việc dán nhãn năng lượng đối với vật liệu xây dựng thuộc phạm vi quản lý của Bộ Xây dựng". Theo khoản 1 Điều 17, Thông tư có hiệu lực thi hành kể từ ngày 01-01-2027; theo khoản 2 Điều 4 và Phụ lục I, lộ trình bắt buộc dán nhãn năng lượng đối với Nhóm 1 (kính xây dựng, sơn tường dạng nhũ tương, tôn lợp và tấm ốp kim loại) từ ngày 01-01-2029 và Nhóm 2 (tấm xốp cách nhiệt, vật liệu xây không nung, tấm trần vách ngăn) từ ngày 01-01-2031 (trước thời điểm bắt buộc khuyến khích tự nguyện công bố, dán nhãn; Phụ lục I mô tả nhóm vật liệu và tiêu chuẩn thử nghiệm, không gắn mã HS).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định danh mục vật liệu xây dựng phải dán nhãn năng lượng và lộ trình thực hiện; nội dung, quy cách nhãn năng lượng; điều kiện đối với phòng thử nghiệm; hướng dẫn việc công bố, dán nhãn năng lượng; kiểm tra, báo cáo, đình chỉ, thu hồi dán nhãn năng lượng đối với vật liệu xây dựng thuộc phạm vi quản lý của Bộ Xây dựng.
      trang_pdf: 1
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Cơ sở sản xuất, doanh nghiệp nhập khẩu, tổ chức, cá nhân phân phối, kinh doanh, kể cả thương mại điện tử vật liệu xây dựng thuộc danh mục phải dán nhãn năng lượng quy định tại Phụ lục I ban hành kèm theo Thông tư này. 2. Phòng thử nghiệm thực hiện thử nghiệm đặc tính nhiệt của vật liệu xây dựng để dán nhãn năng lượng.
      trang_pdf: 1
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Nhãn năng lượng đối với vật liệu xây dựng quy định tại Thông tư này là nhãn cung cấp thông tin về đặc tính nhiệt giúp người tiêu dùng so sánh với các sản phẩm cùng loại trên thị trường để nhận biết và lựa chọn sản phẩm tiết kiệm năng lượng.'
      trang_pdf: 2
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 6
      noi_dung: 'Điều 6. Hồ sơ công bố dán nhãn năng lượng Hồ sơ công bố dán nhãn năng lượng đối với vật liệu xây dựng gồm các thành phần quy định tại khoản 1 Điều 12 Nghị định số 30/2026/NĐ-CP, gồm: a) Thông số kỹ thuật của vật liệu xây dựng, trong đó xác định rõ kiểu, loại sản phẩm và đặc tính nhiệt công bố; b) Kết quả thử nghiệm đặc tính nhiệt do các phòng thử nghiệm đã được Bộ Xây dựng công bố trên Cổng thông tin điện tử của Bộ;'
      trang_pdf: 3
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 7
      noi_dung: Điều 7. Phương thức và trình tự công bố dán nhãn năng lượng 1. Trước khi đưa vật liệu xây dựng thuộc danh mục phải dán nhãn năng lượng ra thị trường theo lộ trình quy định tại Điều 4 Thông tư này, cơ sở sản xuất, doanh nghiệp nhập khẩu gửi hồ sơ công bố dán nhãn năng lượng đến Bộ Xây dựng bằng phương thức điện tử để công bố trên Cổng Thông tin điện tử của Bộ Xây dựng, đồng thời công bố trên Trang thông tin điện tử của doanh nghiệp.
      trang_pdf: 4
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 9
      noi_dung: 'Điều 9. Thay đổi thông tin đã công bố 1. Cơ sở sản xuất, doanh nghiệp nhập khẩu phải thử nghiệm đặc tính nhiệt và thực hiện công bố lại việc dán nhãn năng lượng khi thay đổi một trong các yếu tố: cấu tạo sản phẩm, nguyên liệu chính, công nghệ sản xuất, nơi sản xuất.'
      trang_pdf: 4
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 11
      noi_dung: Điều 11. Mẫu thử nghiệm và giá trị sử dụng của kết quả thử 1. Mẫu thử nghiệm để công bố dán nhãn năng lượng là mẫu đại diện cho kiểu, loại sản phẩm hoặc lô sản phẩm. 2. Việc lấy mẫu, số lượng mẫu, kích thước mẫu, chuẩn bị mẫu và điều kiện thử nghiệm thực hiện theo tiêu chuẩn tương ứng. 3. Cơ sở sản xuất, doanh nghiệp nhập khẩu chịu trách nhiệm về tính đại diện của mẫu thử nghiệm đối với sản phẩm được công bố dán nhãn năng lượng.
      trang_pdf: 5
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 13
      noi_dung: Điều 13. Đình chỉ, thu hồi dán nhãn năng lượng 1. Các trường hợp đình chỉ, thu hồi dán nhãn năng lượng đối với vật liệu xây dựng quy định tại khoản 1, khoản 2 Điều 13 Nghị định số 30/2026/NĐ-CP. 2. Ủy ban nhân dân cấp tỉnh căn cứ theo kết quả thanh tra, kiểm tra ra quyết định đình chỉ, thu hồi và gửi thông báo về Bộ Xây dựng để công bố trên Cổng thông tin điện tử của Bộ Xây dựng.
      trang_pdf: 6
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 14
      noi_dung: Điều 14. Trách nhiệm của Bộ Xây dựng 1. Tổ chức tiếp nhận hồ sơ, công khai thông tin công bố dán nhãn năng lượng; công bố, cập nhật danh sách phòng thử nghiệm đặc tính nhiệt của vật liệu xây dựng trên Cổng thông tin điện tử của Bộ Xây dựng. 2. Kiểm tra việc thực hiện thử nghiệm đặc tính nhiệt của vật liệu xây dựng tại các phòng thử nghiệm.
      trang_pdf: 6
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
    - dieu: 17
      noi_dung: Điều 17. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2027. 2. Vật liệu xây dựng được sản xuất trong nước hoặc hoàn thành thủ tục nhập khẩu trước thời điểm bắt buộc dán nhãn năng lượng đối với nhóm sản phẩm tương ứng theo quy định tại Điều 4 Thông tư này được tiếp tục lưu thông mà không bắt buộc phải dán nhãn năng lượng, nếu có tài liệu chứng minh thời điểm sản xuất hoặc nhập khẩu.
      trang_pdf: 7
      sha256_pdf: cfb6f5f6fe1e7506e915004f0765a12df5692d49902d67f99f69d188771090aa
ghi_chu: Nhãn năng lượng đối với vật liệu xây dựng nhập khẩu và sản xuất trong nước thuộc phạm vi quản lý của Bộ Xây dựng (không áp dụng đối với hàng tạm nhập tái xuất, quá cảnh, chuyển khẩu, gia công xuất khẩu, phi thương mại theo khoản 4 Điều 2).
