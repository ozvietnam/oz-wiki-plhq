xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/19/4.VBDI_24778.pdf, id=101368, SHA-256 1acdfc7812ed9a2c96db7e26c48db80768bd19fc7bb06ada5b0b999050e49691): Thông báo số 24778/TB-CHQ ngày 17-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module màn hình tinh thể lỏng LCD 14 inch dùng cho máy tính xách tay (TFT-LCM, ký, mã hiệu B140XTN07.4; kích thước 309.399 x 173.952 mm, độ dày kính 0.4 mm, khối lượng 300 g, điện áp nguồn tối đa 3.6V, công suất tối đa 2.5W, độ sáng 300 cd/m2; cấu tạo gồm tấm màn hình tinh thể lỏng LCD 14 inch công nghệ TFT, tấm lưng bằng nhôm, bảng mạch PCB gắn phía sau panel LCD có IC T-CON giao tiếp eDP và IC LED Driver cùng các linh kiện điện tử cấp nguồn/truyền tín hiệu, IC điều khiển hiển thị X-Driver IC, cáp kết nối, tấm phân cực Polarizer film và đèn nền LED Backlight; không bao gồm IC giải mã hay xử lý tín hiệu video), phân loại vào nhóm 85.24, phân nhóm "- Loại khác", mã số 8524.91.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Module màn hình tinh thể lỏng LCD 14 inch dùng làm linh kiện sản xuất máy tính xách tay, đã có trình điều khiển (TFT-LCM, ký, mã hiệu B140XTN07.4; kích thước 309.399 x 173.952 mm, gồm tấm LCD 14 inch, tấm lưng nhôm, PCB gắn IC T-CON và IC LED Driver, X-Driver IC, cáp kết nối, tấm phân cực và đèn nền LED Backlight) thuộc nhóm 85.24, mã số 8524.91.00.'
