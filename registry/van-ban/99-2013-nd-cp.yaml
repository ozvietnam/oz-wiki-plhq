xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=169530, Thủ tướng Nguyễn Tấn Dũng ký), toàn văn PDF đính kèm (99-nd.pdf) và CSDL quốc gia vbpl.vn (ItemID=170812): số hiệu 99/2013/NĐ-CP, tiêu đề ''Quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp'', ban hành ngày 29-08-2013, có hiệu lực thi hành từ ngày 15-10-2013 (Điều 45, thay thế Nghị định 97/2010/NĐ-CP); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 126/2021/NĐ-CP từ 01-03-2022, Nghị định 46/2024/NĐ-CP từ 01-07-2024 và Nghị định 186/2026/NĐ-CP từ 15-07-2026; được hướng dẫn thi hành bởi Thông tư 11/2015/TT-BKHCN và Thông tư 66/2026/TT-BKHCN)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về các hành vi vi phạm, hình thức xử phạt, mức phạt, biện pháp khắc phục hậu quả; thủ tục nộp đơn yêu cầu xử lý vi phạm, thấm quyên, thủ tục giải quyết đơn yêu cầu xử lý vi phạm; thấm quyền xử phạt và thi hành quyết định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Quy định về mức phạt tiền tối đa, thẩm quyền xử phạt đối với cá nhân, tổ chức 1. Mức phạt tiền đối với các hành vi quy định tại Chương II của Nghị định này là mức phạt tiền đối với cá nhân. Mức phạt tiền tối đa đối với cá nhân là 250.000.000 đồng. Đối với cùng một hành vi vi phạm. hành chính thì mức phat | tiền đối với tổ chức gấp 02 lần mức phạt tiền đối với cá nhân. Mức phạt tiền tối đa đối với tổ chức là 500.000.000 đồng.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Hình thức xử phạt, biện pháp khắc phục hậu quả 1. Đối với mỗi hành vi vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, tổ chức, cá nhân vi phạm phải chịu một trong các hình thức xử phạt chính là cảnh cáo hoặc phạt tiền. 2. Tùy theo tính chất, mức độ vi phạm, tổ chức, cá nhân vi phạm còn có thé bị áp dụng một hoặc các hình thức xử phạt bé sung sau đây:'
      trang_pdf: 2
    - dieu: 8
      noi_dung: 'Điều 8. Vi phạm quy định về giám định số hữu công nghiệp 1. Phạt cảnh cáo hoặc phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với một trong các hành vi sau đây: a) Vi phạm quy định về trình tự, thủ tục giám định, thời hạn giám định; b) Không có mặt theo giấy triệu tập của cơ quan trưng cầu giám định mà không có lý do chính đáng, không thực hiện việc giải thích kết luận giám định khi có yêu cầu của cơ quan trưng cầu giám định.'
      trang_pdf: 7
    - dieu: 12
      noi_dung: 'Điều 12. Sản xuất, nhập khẩu, buôn bán, vận chuyển, tàng trữ để bán hàng hóa giả mạo nhãn hiệu, chỉ dân địa lý 1. Phạt tiền từ 4.000.000 đồng đến 8.000.000 đồng đôi với một trong các hành vi sau đây trong trường hợp giá trị hàng hóa vi phạm đến 5.000.000 đồng: a) Bán; chào hàng; vận chuyến, kể cả quá cảnh; tàng trữ; trưng bay để ban hàng hóa giả mạo nhãn hiệu, chỉ dẫn địa lý;'
      trang_pdf: 13
    - dieu: 17
      noi_dung: 'Điều 17. Tham quyền xử phạt của Thanh tra Thông tin và Truyén thông 1. Thanh tra viên thuộc Thanh tra Bộ Thông tin và Truyền thông, Thanh tra Sở Thông tin và Truyền thông đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 500.000 đồng: c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá mức tiền phạt được quy định tại Điểm b Khoản này;'
      trang_pdf: 21
    - dieu: 20
      noi_dung: 'Điều 20. Tham quyền xứ phạt của Công an nhân dân 1. Trạm trưởng trạm Công an cửa khâu, khu chế xuất có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 2.500.000 đồng: c) Tịch thu tang vat, phuong tién vi phạm hành chính có giá trị không vượt quá mức tiền phạt được quy định tại Điểm b Khoản này; d) Áp dụng biện pháp khắc phục hậu quả quy định tại Điểm d Khoản 3 Điều 3 Nghị định này.'
      trang_pdf: 24
    - dieu: 24
      noi_dung: Điều 24. Đơn yêu cầu xử lý vi phạm 1. Yêu cầu xử lý vi phạm phải được thé hiện bằng văn bản dưới hình thức đơn yêu cầu xử lý vi phạm, trong đó nêu rõ ngày làm đơn, tên co quan nhận đơn hoặc các cơ quan nhận đơn, thông tin về tổ chức, cá nhân yêu cau xử ly vi phạm; người đại điện hợp pháp hoặc tổ chức, cá nhân được ủ ủy quyền; đối tượng sở hữu công nghiệp hén quan; hang hóa, dich vụ có dấu hiệu vi phạm; tên, địa chỉ tổ chức, cá nhân vi phạm;
      trang_pdf: 28
    - dieu: 27
      noi_dung: 'Điều 27. Xứ lý vụ việc vi phạm khi có tranh chấp 1. Trường hợp có phát sinh khiếu nại, tố cáo hoặc tranh chấp về quyền đăng ký, quyên sở hữu, quyền yêu cầu xử lý vi phạm, điều kiện bảo hộ, phạm vi bảo hộ quyên sở hữu công nghiệp liên quan sau khi đơn yêu cầu xử lý vi phạm được thụ lý thì cơ quan có thâm quyền thụ lý vụ:việc thực hiện các biện pháp xử ly sau đây: "'
      trang_pdf: 31
    - dieu: 33
      noi_dung: Điều 33. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày 15 tháng 10 năm 2013. 2. Nghị định số 97/2010/NĐ-CP ngày 21 tháng 9 năm 2010 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp hết hiệu lực kế từ ngày Nghị định này có hiệu lực thi hành.
      trang_pdf: 35
ghi_chu: Sửa đổi bởi NĐ 126/2021/NĐ-CP, NĐ 46/2024/NĐ-CP và NĐ 186/2026/NĐ-CP; hướng dẫn bởi TT 11/2015/TT-BKHCN (sửa đổi bởi TT 66/2026/TT-BKHCN). Văn bản chế tài chính khi hàng XNK xâm phạm nhãn hiệu/kiểu dáng.
