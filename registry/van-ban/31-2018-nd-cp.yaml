xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=193105, người ký Thủ tướng Nguyễn Xuân Phúc, tệp đính kèm 31.signed.pdf) và quan hệ trong sổ: Nghị định 31/2018/NĐ-CP của Chính phủ quy định chi tiết Luật Quản lý ngoại thương (05/2017/QH14) về xuất xứ hàng hóa, ban hành ngày 08-03-2018, có hiệu lực thi hành kể từ ngày ký ban hành 08-03-2018; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về xuất xứ hàng hóa xuất khâu, xuất xứ hàng hóa nhập khẩu.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với thương nhân, các cơ quan, tổ chức, cá nhân khác có hoạt động liên quan đến xuất xứ hàng hóa.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Theo Nghị định này, các từ ngữ sau đây được hiểu như sau: 1. Xuất xứ hàng hóa là nước, nhóm nước, hoặc vùng lãnh thổ nơi sản xuất ra toàn bộ hàng hóa hoặc nơi thực hiện công đoạn chế biến cơ bản cuối cùng đối với hàng hóa trong trường hợp có nhiều nước, nhóm nước, hoặc vùng lãnh thổ tham gia vào quá trình sản xuất ra hàng hóa đó.'
      trang_pdf: 1
    - dieu: 9
      noi_dung: 'Điều 9. Công đoạn gia công, chế biến đơn giản Công đoạn gia công, chế biến sau đây khi được thực hiện riêng rễ hoặc kết hợp với nhau, được xem là đơn giản và không được xét đên khi xác định xuất xứ hàng hoá tại một nước, nhóm nước, hoặc vùng lãnh tho:'
      trang_pdf: 5
    - dieu: 13
      noi_dung: 'Điều 13. Đăng ky hồ sơ thương nhân 1. Thương nhân đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa lần đầu tiên phải đăng ký hồ sơ thương nhân với cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa và chỉ được xem xét cấp Giấy chứng nhận xuất xứ hàng hóa khi đã đăng ký hồ sơ thương nhân đầy đủ và hợp lệ. Hồ sơ thương nhân bao gồm:'
      trang_pdf: 7
    - dieu: 17
      noi_dung: Điều 17. Giấy chứng nhận xuất xứ hàng hóa cấp sau 1. Trong trường hợp Giấy chứng nhận xuất xứ hàng hóa không được cấp vào thời điểm xuất khẩu, Giấy chứng nhận xuất xứ hàng hóa được phép cap sau và có giá trị hiệu lực tinh từ thời điểm giao hàng nhưng không qua l năm kể từ ngày giao hàng và phải được đóng dau “ISSUED RETROACTIVELY/ ISSUED RETROSPECTIVELY” lên Giấy chứng nhận xuất xứ hàng hóa.
      trang_pdf: 12
    - dieu: 21
      noi_dung: Điều 21. Từ chối cấp Giấy chứng nhận xuất xứ hàng hóa Cơ quan, tô chức cấp Giấy chứng nhận xuất xứ hàng hóa từ chối cấp Giấy chứng nhận xuất xứ hàng hóa bằng văn bản hoặc thông báo tại Hệ thống quản lý và cấp chứng nhận xuất xứ điện tử của Bộ Công Thương tại địa chỉ www.ecosys.gov.vn hoặc trang điện tử khác của các cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa được Bộ Công Thương ủy quyền và nêu rõ lý do từ chối trong những trường hợp
      trang_pdf: 16
    - dieu: 25
      noi_dung: Điều 25. Tự chứng nhận xuất xứ hàng hóa Thực hiện Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập, căn cứ quy định của nước nhập khẩu về tự chứng nhận xuất xứ hàng hóa, Bộ Công Thương quy định tiêu chí lựa chọn thương nhân; quy trình, thủ tục tự chứng nhận xuất xứ; nghĩa vụ và trách nhiệm của thương nhân tự chứng nhận xuất xứ; cơ chế kiểm tra, xác minh việc tự chứng nhận xuất xứ hàng hóa xuất khâu của thương nhân và chế tài xử lý vi phạm.
      trang_pdf: 18
    - dieu: 29
      noi_dung: 'Điều 29. Biện pháp chống gian lận xuất xứ 1. Cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa áp dụng các biện pháp chống gian lận xuất xứ đối với các trường hợp sau: a) Tạm dừng cấp Giấy chứng nhận xuất xứ hàng hóa trong thời hạn 3 tháng ké từ lần đầu tiên thương nhân đăng tải các thông tin, dữ liệu không liên quan đến việc đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa trên Hệ thống'
      trang_pdf: 20
    - dieu: 34
      noi_dung: Điều 34. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 08 tháng 3 năm 2018. 2. Nghị định này thay thế Nghị định SỐ, 19/2006/NĐ-CP ngày 20 tháng 02 năm 2006 của Chính phủ quy định chi tiệt Luật Thương mại về xuất xứ hàng hóa và các Thông tư hướng dẫn Nghị định sô 19/2006/NĐ-CP.
      trang_pdf: 23
