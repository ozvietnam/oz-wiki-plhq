  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=193105, người ký Thủ tướng Nguyễn Xuân Phúc, tệp đính kèm 31.signed.pdf) và quan hệ trong sổ: Nghị định 31/2018/NĐ-CP của Chính phủ quy định chi tiết Luật Quản lý ngoại thương (05/2017/QH14) về xuất xứ hàng hóa, ban hành ngày 08-03-2018, có hiệu lực thi hành kể từ ngày ký ban hành 08-03-2018; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về xuất xứ hàng hóa xuất khâu, xuất xứ hàng hóa nhập khẩu.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với thương nhân, các cơ quan, tổ chức, cá nhân khác có hoạt động liên quan đến xuất xứ hàng hóa.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Theo Nghị định này, các từ ngữ sau đây được hiểu như sau: 1. Xuất xứ hàng hóa là nước, nhóm nước, hoặc vùng lãnh thổ nơi sản xuất ra toàn bộ hàng hóa hoặc nơi thực hiện công đoạn chế biến cơ bản cuối cùng đối với hàng hóa trong trường hợp có nhiều nước, nhóm nước, hoặc vùng lãnh thổ tham gia vào quá trình sản xuất ra hàng hóa đó.'
      trang_pdf: 1
    - dieu: 4
      noi_dung: 'Điều 4. Quy tắc xuất xứ ưu đãi theo Điều ước quốc tế Việc xác định xuất xứ hàng hóa xuất khẩu, hàng hóa nhập khẩu dé được hưởng chế độ ưu đãi về thuế quan và phi thuế quan được áp dụng theo Điều ước quốc tế mà Việt Nam ký kết, hoặc gia nhập và theo quy định của Bộ Công Thương hướng dẫn Điều ước quốc tế đó.'
      trang_pdf: 3
    - dieu: 5
      noi_dung: 'Điều 5. Quy tắc xuất xứ ưu đãi theo chế độ ưu đãi thuế quan phé cập và các ưu đãi đơn phương khác Việc xác định xuất xứ bàng hoá xuất khẩu để được hưởng chế độ ưu đãi thuế quan phổ cập và các ưu đãi đơn phương khác được thực hiện theo quy tắc xuất xứ của nước nhập | khẩu dành cho các ưu đãi này và theo quy định của Bộ Công Thương hướng dẫn quy tắc xuất xứ đó.'
      trang_pdf: 3
    - dieu: 6
      noi_dung: 'Điêu 6. Hàng hoá có xuat xứ Hàng hoá được coi là có xuất xứ khi thuộc một trong các trường hợp sau: 1. Hàng hóa có xuất xứ thuần túy hoặc được sản xuất toàn bộ tại một nước, nhóm nước, hoặc vùng lãnh thô theo quy định tại Điều 7 Nghị định này; hoặc'
      trang_pdf: 3
    - dieu: 7
      noi_dung: 'Điều 7. Hàng hoá có xuất xứ thuần túy Hàng hóa quy định tại khoản 1, Điều 6 Nghị định này được coi là có xuất xứ thuần túy hoặc được sản xuất toàn bộ tại lãnh thổ của một nước, nhóm nước, hoặc vùng lãnh thé trong các trường hợp sau: 1. Cây trồng và các sản phẩm từ cây trồng được trồng và thu hoạch tại nước, nhóm nước, hoặc vùng lãnh thé đó.'
      trang_pdf: 4
    - dieu: 8
      noi_dung: '1. Hàng hóa quy định tại khoản 2, Điều 6 Nghị định này được col là có xuất xứ không thuân túy hoặc không được sản xuất toàn bộ tại lãnh thô của một nước, nhóm nước, hoặc vùng lãnh thô nếu hàng hóa đó đáp ứng tiêu chí xuất xứ thuộc Danh mục Quy tắc cụ thê mặt hàng do Bộ Công Thương quy định. 2. Bộ Công Thương ban hành Danh mục Quy tắc cụ thé mặt hàng nêu tại khoản 1 Điều này và hướng dẫn cách xác định các tiêu chí xuât xứ hàng hóa.'
      trang_pdf: 5
    - dieu: 9
      noi_dung: 'Điều 9. Công đoạn gia công, chế biến đơn giản Công đoạn gia công, chế biến sau đây khi được thực hiện riêng rễ hoặc kết hợp với nhau, được xem là đơn giản và không được xét đên khi xác định xuất xứ hàng hoá tại một nước, nhóm nước, hoặc vùng lãnh tho:'
      trang_pdf: 5
    - dieu: 10
      noi_dung: 'Điều 10. Xác định xuất xứ của bao bì, phụ kiện, phụ tùng, dụng cụ, hàng hoá chưa được lắp ráp hoặc tháo rời 1. Trường hợp hàng hóa áp dụng tiêu chí “chuyển đổi mã số hàng hóa”, vật liệu đóng gói và bao gói chứa đựng hàng hóa dùng để bán lẻ, khi được phân loại cùng hàng hóa đó, được loại trừ khỏi các nguyên liệu không có xuất xứ được sử dụng trong việc sản xuất ra hàng hóa.'
      trang_pdf: 5
    - dieu: 11
      noi_dung: 'Điều 11. Tỷ lệ nguyên liệu không đáp ứng tiêu chí chuyển đỗi mã số hàng hóa (De Minimis) 1. Hàng hóa không đáp ứng tiêu chí “chuyên đổi mã số hàng hóa” thuộc Danh mục Quy tắc cụ thé mặt hàng theo quy định tại Điều 8 Nghị định này vẫn được coi là hàng hóa có xuất xứ nếu: a) Đối với hàng hóa có mã HS không thuộc từ Chương 50 đến Chương 63, trị giá của tất cả nguyên liệu không có xuất xứ được sử dụng để sản xuất ra hàng hóa không đáp ứng yêu cầu về chuyển đổi mã số hàng hóa không được vượt quá 15% trị giá FOB của hàng hóa;'
      trang_pdf: 6
    - dieu: 12
      noi_dung: 'Điều 12. Các yếu tô gián tiếp Các yếu tố gián tiếp được sử dụng trong quá trình sản xuất, kiểm tra, hoặc thử nghiệm hàng hóa nhưng không câu thành hàng hóa đó, hoặc các yêu tố được sử dụng trong việc bảo đưỡng nhà xưởng, hoặc vận hành thiệt bị có liên quan tới việc sản xuât hàng hóa sau đây không cân xét dén khi xác định xuât xứ hàng hóa: : 1. Nhiên liệu và năng lượng. 2. Dụng cụ, khuôn rập và khuôn đúc.'
      trang_pdf: 7
    - dieu: 13
      noi_dung: 'Điều 13. Đăng ky hồ sơ thương nhân 1. Thương nhân đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa lần đầu tiên phải đăng ký hồ sơ thương nhân với cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa và chỉ được xem xét cấp Giấy chứng nhận xuất xứ hàng hóa khi đã đăng ký hồ sơ thương nhân đầy đủ và hợp lệ. Hồ sơ thương nhân bao gồm:'
      trang_pdf: 7
    - dieu: 15
      noi_dung: 'Điều 15. Hồ sơ cấp Giấy chứng nhận xuất xứ hàng hóa 1. Đối với thương nhân đề nghị cấp Giấy chứng nhận xuất xứ "hàng hóa lần đầu hoặc cho sản phẩm mới xuất khẩu lần đầu hoặc cho sản phẩm không cố định (có thay đổi về định mức số lượng, định mức trọng lượng, mã HS, tri giá và nguồn cung nguyên liệu đối với cả nguyên liệu đầu vào hoặc sản phẩm đầu ra mỗi lần cấp Giấy chứng nhận xuất xứ hàng hóa), hồ sơ đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa gồm: a) Đơn đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa được kê khai hoàn chỉnh và hợp lệ theo Mẫu số 04 quy định tại Phụ lục ban hành kèm theo Nghị định này;'
      trang_pdf: 8
    - dieu: 16
      noi_dung: 'Điều 16. Quy trình khai báo va cấp Giấy chứng nhận xuất xứ hàng hóa 1. Thương nhân đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa khai báo hồ sơ đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa theo biêu mẫu điện tử sẵn có trên Hệ thống quản lý và cấp chứng nhận xuất xứ điện tử của Bộ Công Thương tại địa chỉ www.ecosys.gov.vn hoặc trang điện tử khác của các cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa được Bộ Công Thương ủy quyền. Mã HS của hàng hóa khai báo trên Giấy chứng nhận xuất xứ hàng hóa là mã HS của nước xuất khẩu.'
      trang_pdf: 11
    - dieu: 17
      noi_dung: Điều 17. Giấy chứng nhận xuất xứ hàng hóa cấp sau 1. Trong trường hợp Giấy chứng nhận xuất xứ hàng hóa không được cấp vào thời điểm xuất khẩu, Giấy chứng nhận xuất xứ hàng hóa được phép cap sau và có giá trị hiệu lực tinh từ thời điểm giao hàng nhưng không qua l năm kể từ ngày giao hàng và phải được đóng dau “ISSUED RETROACTIVELY/ ISSUED RETROSPECTIVELY” lên Giấy chứng nhận xuất xứ hàng hóa.
      trang_pdf: 12
    - dieu: 18
      noi_dung: 'Điều 18. Cấp lại Giấy chứng nhận xuất xứ hàng hóa 1. Cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa cấp lại Giấy chứng nhận xuất xứ hàng hóa trong các trường hợp sau đây: a) Trong trường hợp Giấy chứng nhận xuất xứ hàng hóa bị mat, thất lạc hoặc hư hỏng, thương nhân nộp đơn đề nghị cấp lại Giấy chứng nhận xuất xứ hàng hóa theo Mẫu sô 04 quy định tại Phụ lục ban hành kèm theo Nghị định này cho cơ quan, tổ chức Giấy chứng nhận xuất xứ hàng, nêu rõ lý do đề nghị cap lại.'
      trang_pdf: 12
    - dieu: 19
      noi_dung: 'Điều 19. Cấp Giấy chứng nhận hàng hóa không thay đổi xuất xứ 1. Đối với hàng hóa từ nước ngoài đưa vào kho ngoại quan, sau đó đưa từ kho ngoại quan ra nước ngoài, cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa xem xét cấp Giây chứng nhận hàng hóa không thay đỗi xuất xứ, bao gôm thông tin tối thiểu như sau: a) Nước xuất xứ ban đầu của hàng hóa, nước đến cuối cùng của hàng hóa; b) Số tham chiếu và ngày cấp Giấy chứng nhận xuất xứ hàng hóa ban đầu;'
      trang_pdf: 14
    - dieu: 20
      noi_dung: 'Điều 20. Cấp Giấy chứng nhận xuất xứ hàng hóa giáp lưng 1. Đối với hàng hóa từ nước ngoài đưa vào kho ngoại quan, sau đó đưa từ kho ngoại quan ra nước ngoài, cơ quan, tô chức cấp Giấy chứng nhận xuất xứ hàng hóa xem xét cấp Giấy chứng nhận xuất xứ hàng hóa giáp lưng theo Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập. 2. Hồ sơ, thủ tục đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa giáp lưng nêu tại khoản 1 Điều này bao gồm:'
      trang_pdf: 15
    - dieu: 21
      noi_dung: Điều 21. Từ chối cấp Giấy chứng nhận xuất xứ hàng hóa Cơ quan, tô chức cấp Giấy chứng nhận xuất xứ hàng hóa từ chối cấp Giấy chứng nhận xuất xứ hàng hóa bằng văn bản hoặc thông báo tại Hệ thống quản lý và cấp chứng nhận xuất xứ điện tử của Bộ Công Thương tại địa chỉ www.ecosys.gov.vn hoặc trang điện tử khác của các cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa được Bộ Công Thương ủy quyền và nêu rõ lý do từ chối trong những trường hợp
      trang_pdf: 16
    - dieu: 22
      noi_dung: 'Điều 22. Thu hồi Giấy chứng nhận xuất xứ hàng hóa đã cấp 1. Cơ quan, tổ chức cấp Giấy, chứng nhận xuất xứ hàng hóa thu hồi Giấy chứng nhận xuất xứ hàng hóa đã cấp trong những trường hợp sau: a) Giấy chứng nhận xuất xứ hàng hóa đã cấp không phù hợp các quy định về xuat xứ; b) Giấy chứng nhận xuất xứ hàng hóa đã cấp trùng số tham chiếu;'
      trang_pdf: 16
    - dieu: 25
      noi_dung: Điều 25. Tự chứng nhận xuất xứ hàng hóa Thực hiện Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập, căn cứ quy định của nước nhập khẩu về tự chứng nhận xuất xứ hàng hóa, Bộ Công Thương quy định tiêu chí lựa chọn thương nhân; quy trình, thủ tục tự chứng nhận xuất xứ; nghĩa vụ và trách nhiệm của thương nhân tự chứng nhận xuất xứ; cơ chế kiểm tra, xác minh việc tự chứng nhận xuất xứ hàng hóa xuất khâu của thương nhân và chế tài xử lý vi phạm.
      trang_pdf: 18
    - dieu: 26
      noi_dung: 'Điều 26. Chứng từ chứng nhận xuất xứ hàng hóa nhập khẩu 1. Trong những trường hợp sau, chứng từ chứng nhận xuất xứ hàng hóa đôi với hàng hoá nhập khẩu phải nộp cho co quan hải quan: a) Hàng hoá có xuất xứ từ nước, nhóm nước, hoặc vùng lãnh thổ được Việt Nam cho hưởng các ưu đãi về thuế quan và phi thuế quan theo quy định của pháp luật Việt Nam và theo Điều ude quốc tế mà Việt Nam ký kết hoặc gia nhập, nếu người nhập khẩu muốn được hưởng các chế độ ưu đãi đó;'
      trang_pdf: 18
    - dieu: 27
      noi_dung: 'Điều 27. Xác định trước xuất xứ hàng hóa nhập khẩu Thương nhân có nhu cầu xác định trước xuất xứ cho hàng hóa nhập khẩu phải gửi văn bản, tài liệu liên quan de nghị cơ quan hải quan xác nhận bắng văn bản về xuất xứ cho lô hàng sắp được nhập khâu.'
      trang_pdf: 19
    - dieu: 28
      noi_dung: 'Điều 28. Kiểm tra, xác minh xuất xứ hàng hóa xuất khẩu, nhập khẩu 1. Bộ Công Thương hướng dẫn việc kiểm tra, xác minh xuất xứ hàng hóa xuất khẩu trước va sau khi cấp Giấy chứng nhận xuat xứ hàng hóa và việc tự chứng nhận xuất xứ hàng hóa xuất khâu của thương nhân trong các trường hợp sau: a) Kiểm tra hồ sơ, chứng từ chứng nhận xuất xứ hàng hóa do Bộ Công Thương cấp hoặc do cơ quan, tô chức được Bộ Công Thương ủy quyền cấp hoặc do thương nhân tự chứng nhận xuất xứ theo yêu cầu của cơ quan hải quan nước nhập khẩu;'
      trang_pdf: 19
    - dieu: 29
      noi_dung: 'Điều 29. Biện pháp chống gian lận xuất xứ 1. Cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa áp dụng các biện pháp chống gian lận xuất xứ đối với các trường hợp sau: a) Tạm dừng cấp Giấy chứng nhận xuất xứ hàng hóa trong thời hạn 3 tháng ké từ lần đầu tiên thương nhân đăng tải các thông tin, dữ liệu không liên quan đến việc đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa trên Hệ thống'
      trang_pdf: 20
    - dieu: 30
      noi_dung: 'Điều 30. Lưu trữ hồ sơ _ 1, Cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa lưu trữ hồ sơ đề nghị cap Giây chứng nhận xuất xứ hàng hóa và các chứng từ liên quan tới việc cấp đó dưới dạng văn bản hoặc dạng điện tử trong thời hạn tối thiểu 5 năm kể từ ngày cấp. 2. Cơ quan hải quan lưu trữ hồ sơ liên quan đến xác định xuất xứ hàng hóa nhập khâu dưới dạng văn bản hoặc dạng điện tử trong thời hạn tối thiểu 5 năm ké từ ngày đăng ky tờ khai hải quan.'
      trang_pdf: 21
    - dieu: 34
      noi_dung: Điều 34. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 08 tháng 3 năm 2018. 2. Nghị định này thay thế Nghị định SỐ, 19/2006/NĐ-CP ngày 20 tháng 02 năm 2006 của Chính phủ quy định chi tiệt Luật Thương mại về xuất xứ hàng hóa và các Thông tư hướng dẫn Nghị định sô 19/2006/NĐ-CP.
      trang_pdf: 23
    - dieu: 35
      noi_dung: 'Điều 35. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương trong phạm vi chức năng, nhiệm vụ của mình chịu trách nhiệm hướng dẫn và thi hành Nghị định này./.'
