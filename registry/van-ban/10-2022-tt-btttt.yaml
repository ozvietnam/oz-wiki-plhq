xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 637+638 ngày 31-07-2022 (lớp chữ): Điều 3 khoản 1 hiệu lực 15-09-2022; thẻ Công báo «Hiệu lực: 15/09/2022»; tình trạng hiện tại: sổ không có văn bản sau ghi thay/bãi TT 10/2022; TT 36/2026/TT-BKHCN không nêu 10/2022 (kiểm đến 04-10-2026)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Sửa đổi Điều 6 như sau: “Cục An toàn thông tin - Bộ Thông tin và Truyền thông là cơ quan cấp Giấy phép nhập khẩu”.'
      trang_pdf: 2
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 2
      noi_dung: '2. Bãi bỏ khoản 2 Điều 7.'
      trang_pdf: 2
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 3
      noi_dung: '3. Sửa đổi khoản 5 Điều 8 như sau: “Đối với hình thức nộp trực tuyến, thực hiện tại Cổng dịch vụ công của Bộ Thông tin và Truyền thông, địa chỉ https://dichvucong.mic.gov.vn hoặc Cổng dịch vụ công quốc gia”.'
      trang_pdf: 2
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 4
      noi_dung: '4. Sửa đổi khoản 6 Điều 8 như sau: “Doanh nghiệp nhận Giấy phép nhập khẩu trực tiếp tại trụ sở Cục An toàn thông tin hoặc thông qua dịch vụ bưu chính hoặc bản điện tử trên Cổng dịch vụ công”.'
      trang_pdf: 2
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 5
      noi_dung: '5. Sửa đổi khoản 3 Điều 9 như sau: “Trong thời hạn 05 (năm) ngày làm việc kể từ ngày hồ sơ hợp lệ, Cục An toàn thông tin - Bộ Thông tin và Truyền thông thẩm định và trả kết quả giải quyết hồ sơ cho doanh nghiệp. Trường hợp đáp ứng đủ các điều kiện theo quy định tại Khoản 3 Điều 48 Luật An toàn thông tin mạng, Cục An toàn thông tin - Bộ Thông tin và Truyền thông cấp Giấy phép nhập khẩu cho doanh nghiệp theo Mẫu số 03 tại Phụ lục II của Thông tư này. Trường hợp không đáp ứng đủ các điều kiện theo quy định, Cục An toàn thông tin - Bộ Thông tin và Truyền thông thông báo bằng văn bản cho doanh nghiệp, trong đó nêu rõ lý do không cấp phép”.'
      trang_pdf: 2
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 6
      noi_dung: '6. Sửa đổi Điều 10 như sau: “1. Đối với Giấy phép nhập khẩu còn hiệu lực nhưng bị mất hoặc bị hư hỏng, doanh nghiệp gửi đơn đề nghị cấp lại Giấy phép nhập khẩu theo Mẫu số 02 tại Phụ lục II của Thông tư này tới Cục An toàn thông tin - Bộ Thông tin và Truyền thông. 2. Trong thời hạn 02 (hai) ngày làm việc kể từ ngày nhận được đơn hợp lệ, Cục An toàn thông tin - Bộ Thông tin và Truyền thông cấp lại Giấy phép nhập khẩu cho doanh nghiệp”.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 1
      khoan: 7
      noi_dung: '7. Thay thế Phụ lục I và Phụ lục II tại Thông tư số 13/2018/TT-BTTTT ngày 15 tháng 10 năm 2018 của Bộ trưởng Bộ Thông tin và Truyền thông bằng Phụ lục I và Phụ lục II kèm theo Thông tư này.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 2
      khoan: 1
      noi_dung: '1. Các Giấy phép nhập khẩu đã được cấp trước thời điểm có hiệu lực của Thông tư này vẫn được sử dụng cho đến hết thời hạn được ghi trên giấy phép.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 2
      khoan: 2
      noi_dung: '2. Mã HS 8517.62.43 tại Phụ lục I của Thông tư này áp dụng từ ngày 01/12/2022.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 3
      khoan: 1
      noi_dung: '1. Thông tư có hiệu lực từ ngày 15 tháng 9 năm 2022.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 3
      khoan: 2
      noi_dung: '2. Trong quá trình thực hiện, nếu phát sinh vướng mắc, đề nghị các tổ chức, cá nhân phản ánh về Cục An toàn thông tin - Bộ Thông tin và Truyền thông để xem xét, giải quyết.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 3
      khoan: 3
      noi_dung: '3. Trường hợp có sự khác biệt trong việc xác định mã HS sản phẩm, hàng hóa tại Phụ lục I của Thông tư này và Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam, Bộ Thông tin và Truyền thông (Cục An toàn thông tin) phối hợp với Bộ Tài chính (Tổng cục Hải quan) để quyết định mã HS đối với hàng hóa xuất khẩu, nhập khẩu.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
    - dieu: 3
      khoan: 4
      noi_dung: '4. Chánh Văn phòng, Cục trưởng Cục An toàn thông tin, Thủ trưởng các cơ quan, đơn vị thuộc Bộ Thông tin và Truyền thông, các doanh nghiệp, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này./.'
      trang_pdf: 3
      sha256_pdf: 5458f8d83f65c07ea02a535562943b26d8f744c6b91363f0ae115e3dabf507a2
ghi_chu: Nhập từ hs-code-api data/legal-docs.json (3 mã HS). Thay Phụ lục I, II TT 13/2018/TT-BTTTT (danh mục SP an toàn thông tin mạng NK theo giấy phép). mst.gov.vn là cổng Bộ cũ (bậc C) — toàn văn lấy từ Công báo CDN. Bộ TT&TT sáp nhập vào Bộ KH&CN từ 03/2025 — theo dõi văn bản thay thế.
