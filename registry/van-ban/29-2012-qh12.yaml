xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=164963), toàn văn 19_xuatban.doc (Chủ tịch Quốc hội Nguyễn Sinh Hùng ký) và CSDL quốc gia vbpl.vn (ItemID=113345): Luật Xuất bản thông qua ngày 20-11-2012 có số hiệu chính thức trên nguồn A là 19/2012/QH13 (bản ghi gốc từ issue #212 gõ nhầm thành 29/2012/QH12; còn số hiệu 29/2012/QH13 ngày 21-06-2012 trên docid=162989 và Công báo id=11007 là Nghị quyết về một số chính sách thuế tháo gỡ khó khăn cho tổ chức và cá nhân). Luật Xuất bản 19/2012/QH13 có hiệu lực từ 01-07-2013 theo Điều 53 (thay thế Luật Xuất bản 30/2004/QH11 và Luật 12/2008/QH12), đang còn hiệu lực (được sửa đổi một số điều liên quan đến quy hoạch bởi Luật 35/2018/QH14 từ 01-01-2019).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về tổ chức và hoạt động xuất bản; quyền và nghĩa vụ của cơ quan, tổ chức, cá nhân tham gia hoạt động xuất bản. Hoạt động xuất bản bao gồm các lĩnh vực xuất bản, in và phát hành xuất bản phẩm.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với cơ quan, tổ chức, cá nhân trong nước, tổ chức nước ngoài hoạt động trên lãnh thổ Việt Nam, cá nhân nước ngoài cư trú tại Việt Nam có liên quan đến hoạt động xuất bản.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Vị trí, mục đích của hoạt động xuất bản Hoạt động xuất bản thuộc lĩnh vực văn hóa, tư tưởng nhằm phổ biến, giới thiệu tri thức thuộc các lĩnh vực của đời sống xã hội, giá trị văn hóa dân tộc và tinh hoa văn hóa nhân loại, đáp ứng nhu cầu đời sống tinh thần của nhân dân, nâng cao dân trí, xây dựng đạo đức và lối sống tốt đẹp của người Việt Nam, mở rộng giao lưu văn hóa với các nước, phát triển kinh tế - xã hội, đấu tranh chống mọi tư
      trang_pdf: 1
    - dieu: 11
      noi_dung: Điều 11. Xử lý vi phạm trong hoạt động xuất bản 1. Tổ chức có hành vi vi phạm quy định của Luật này và quy định khác của pháp luật có liên quan thì tùy theo tính chất, mức độ vi phạm mà bị xử phạt vi phạm hành chính; nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.
      trang_pdf: 1
    - dieu: 18
      noi_dung: 'Điều 18. Nhiệm vụ và quyền hạn của tổng giám đốc (giám đốc), tổng biên tập nhà xuất bản 1. Tổng giám đốc (giám đốc) nhà xuất bản có nhiệm vụ và quyền hạn sau đây: a) Điều hành hoạt động của nhà xuất bản đúng tôn chỉ, mục đích, chức năng, nhiệm vụ ghi trong giấy phép và quyết định thành lập nhà xuất bản; b) Xây dựng bộ máy tổ chức và nhân lực của nhà xuất bản;'
      trang_pdf: 1
    - dieu: 25
      noi_dung: 'Điều 25. Cấp giấy phép xuất bản tài liệu không kinh doanh 1. Việc xuất bản tài liệu không kinh doanh mà không thực hiện qua nhà xuất bản thì phải được cơ quan quản lý nhà nước về hoạt động xuất bản sau đây cấp giấy phép xuất bản tài liệu không kinh doanh: a) Bộ Thông tin và Truyền thông cấp giấy phép xuất bản tài liệu không kinh doanh của cơ quan, tổ chức ở trung ương và tổ chức nước ngoài;'
      trang_pdf: 1
    - dieu: 31
      noi_dung: Điều 31. Hoạt động của cơ sở in xuất bản phẩm 1. Cơ sở in chỉ được in xuất bản phẩm sau khi được cấp giấy phép hoạt động in xuất bản phẩm. 2. Cơ sở in chỉ được nhận in xuất bản phẩm theo quy định tại Điều 33 của Luật này.
      trang_pdf: 1
    - dieu: 38
      noi_dung: Điều 38. Cấp giấy phép hoạt động kinh doanh nhập khẩu xuất bản phẩm 1. Tổ chức, cá nhân trong nước, tổ chức, cá nhân nước ngoài được nhập khẩu xuất bản phẩm vào Việt Nam theo quy định của pháp luật Việt Nam và phù hợp với Điều ước quốc tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.
      trang_pdf: 1
    - dieu: 45
      noi_dung: Điều 45. Điều kiện xuất bản và phát hành xuất bản phẩm điện tử 1. Việc xuất bản điện tử phải do nhà xuất bản hoặc cơ quan, tổ chức có giấy phép xuất bản tài liệu không kinh doanh thực hiện và phải tuân theo quy định của Luật này.
      trang_pdf: 1
    - dieu: 53
      noi_dung: Điều 53. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2013 và thay thế Luật xuất bản số 30/2004/QH11 đã được sửa đổi, bổ sung một số điều theo Luật số 12/2008/QH12.
      trang_pdf: 1
ghi_chu: Số hiệu chính thức của Luật Xuất bản ngày 20-11-2012 trên nguồn A là 19/2012/QH13 (đã gắn vào so_hieu_khac; giữ khoá file 29-2012-qh12 tương thích bản ghi gốc). Khung pháp lý xuất bản-in; hoạt động in ấn, nhập khẩu thiết bị in thực hiện theo Luật này, NĐ 195/2013/NĐ-CP và NĐ 60/2014/NĐ-CP (sửa đổi bởi NĐ 25/2018/NĐ-CP).
