  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21662.pdf, id=106028, SHA-256 420f56307b76b27d5e367c387d837e7fb34c5a10d2609b21c97baec8a26332f3): Thông báo số 21662/TB-CHQ ngày 14-09-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 21662/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng 1,4-Butanediol (BDO) — Bio-BDO® 1,4-Butanediol (công thức hóa học C4H10O2, CAS 110-63-4, độ tinh khiết > 99%, dạng lỏng trong suốt, nhớt, không màu, tan hoàn toàn trong nước, sản xuất bằng phương pháp lên men sinh học GENO BDO™ từ đường Sucrose/Glucose với vi sinh vật tái tổ hợp Escherichia coli biến đổi gen qua các công đoạn hòa tan nguyên liệu thô, khử trùng, lên men, lọc, trao đổi ion, bay hơi và chưng cất; dùng làm nguyên liệu hóa chất trung gian trong sản xuất dung môi, nhựa, polyester nhiệt dẻo, sợi Spandex, chất kết dính, chất hóa dẻo và polyurethane), phân loại vào nhóm 29.05, phân nhóm "- Rượu hai chức:", mã số 2905.39.00; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng 1,4-Butanediol (BDO, Bio-BDO® C4H10O2, CAS 110-63-4, độ tinh khiết > 99%, dạng lỏng không màu sản xuất bằng quy trình lên men sinh học GENO BDO™ từ đường Sucrose/Glucose, dùng làm nguyên liệu hóa chất trung gian trong sản xuất dung môi, nhựa, polyester nhiệt dẻo, sợi Spandex, chất kết dính, chất hóa dẻo và polyurethane) thuộc nhóm 29.05, mã số 2905.39.00.'
