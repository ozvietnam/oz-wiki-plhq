  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/8/VB_18172.pdf, id=100916, SHA-256 72bb360ed9a3ee8f59f89b5a0bf53f966e91e228e8f607cdccf524ed6e1d0b9d): Thông báo số 18172/TB-CHQ ngày 07-08-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Khung điện thoại (ký, mã hiệu CNC8; cấu tạo bằng nhôm hợp kim với thành phần Al còn lại, Si 0.5-0.8%, Fe <= 0.2%, Cu 0.55-0.75%, Mn 0.1-0.2%, Mg 0.8-1.05%, Cr <= 0.1%, Zn <= 0.1%, Ti <= 0.1%; kích thước 162.137 x 77.835 x 7.449 mm, trọng lượng 0.039 kg; sản xuất qua 21 bước ép đùn nhôm, khoan phay, phun cát, khắc và hàn laser, đúc chèn Insert Molding, đánh bóng; là bán thành phẩm ở giai đoạn gia công cuối cùng xử lý vùng dẫn điện và lỗ răng, dùng để cố định khung bên ngoài và đảm bảo cấu trúc tổng thể bên trong của điện thoại di động Samsung A56), phân loại vào nhóm 85.17, phân nhóm 8517.79, mã số 8517.79.99; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Khung điện thoại bằng nhôm hợp kim dùng cho điện thoại di động Samsung A56 (ký, mã hiệu CNC8; thành phần Al balance, Si 0.5-0.8%, Fe <= 0.2%, Cu 0.55-0.75%, Mn 0.1-0.2%, Mg 0.8-1.05%, Cr/Zn/Ti <= 0.1%; kích thước 162.137 x 77.835 x 7.449 mm, trọng lượng 0.039 kg; bán thành phẩm giai đoạn gia công cuối cùng đảm bảo cấu trúc tổng thể bên trong và cố định vị trí khung ngoài của điện thoại) thuộc nhóm 85.17, phân nhóm 8517.79, mã số 8517.79.99.'
