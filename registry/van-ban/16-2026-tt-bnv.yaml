  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ kèm theo mã hàng hóa (HS) và yêu cầu quản lý chất lượng tương ứng.
      trang_pdf: 1
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với: 1. Các tổ chức, cá nhân trong nước và nước ngoài hoạt động trên lãnh thổ Việt Nam sản xuất, nhập khẩu, xuất khẩu, kinh doanh, sử dụng các sản phẩm, hàng hóa thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ. 2. Tổ chức, cá nhân liên quan đến hoạt động đánh giá sự phù hợp chất lượng sản phẩm, hàng hóa thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ. 3. Các cơ quan quản lý nhà nước về chất lượng các sản phẩm, hàng hóa thuộc trách nhiệm quản lý của Bộ Nội vụ và các tổ chức, cá nhân khác có liên quan.'
      trang_pdf: 1
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 3
      noi_dung: Điều 3. Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ 1. Ban hành kèm theo Thông tư này Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ và mã HS của sản phẩm, hàng hóa. 2. Danh mục sản phẩm, hàng hóa có mức độ rủi ro cao, yêu cầu quản lý chất lượng tương ứng đối với sản phẩm, hàng hóa có mức độ rủi ro cao được quy định tại Mục I Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao ban hành kèm theo Thông tư này. 3. Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, yêu cầu quản lý chất lượng tương ứng đối với sản phẩm, hàng hóa có mức độ rủi ro trung bình được quy định tại Mục II Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao ban hành kèm theo Thông tư này.
      trang_pdf: 2
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 4
      noi_dung: Điều 4. Nguyên tắc quản lý sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao 1. Việc quản lý chất lượng sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao được thực hiện theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa, tiêu chuẩn và quy chuẩn kỹ thuật; quy định về chứng nhận hợp quy, công bố hợp quy, kiểm tra chất lượng đối với sản phẩm, hàng hóa và các quy chuẩn kỹ thuật quốc gia tương ứng. 2. Sản phẩm, hàng hóa thuộc Danh mục ban hành kèm theo Thông tư này đồng thời thuộc đối tượng áp dụng của hai hoặc nhiều quy chuẩn kỹ thuật quốc gia thì phải đáp ứng đầy đủ các quy chuẩn kỹ thuật quốc gia tương ứng; thực hiện đánh giá sự phù hợp, chứng nhận hợp quy, công bố hợp quy theo mức độ rủi ro, yêu cầu quản lý chất lượng tương ứng quy định tại Danh mục ban hành kèm theo Thông tư này, quy chuẩn kỹ thuật quốc gia tương ứng và quy định của pháp luật về chất lượng sản phẩm, hàng hóa, pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật; bảo đảm không thực hiện trùng lặp nội dung đánh giá sự phù hợp đối với cùng một yêu cầu kỹ thuật đã được đánh giá theo quy chuẩn kỹ thuật quốc gia tương ứng.
      trang_pdf: 2
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 5
      noi_dung: Điều 5. Trách nhiệm quản lý nhà nước về chất lượng sản phẩm, hàng hoá 1. Cục Việc làm là cơ quan kiểm tra chất lượng sản phẩm, hàng hoá ở Trung ương, thực hiện chức năng quản lý nhà nước về chất lượng sản phẩm, hàng hoá của Bộ Nội vụ. 2. Cơ quan kiểm tra chất lượng sản phẩm, hàng hóa ở địa phương là Ủy ban nhân dân các cấp, cơ quan chuyên môn thuộc Ủy ban nhân dân tỉnh, thành phố do Uỷ ban nhân dân quyết định, thực hiện chức năng quản lý nhà nước về chất lượng sản phẩm, hàng hóa thuộc trách nhiệm quản lý nhà nước của Bộ Nội vụ ở địa phương, tiến hành việc kiểm tra chất lượng sản phẩm, hàng hóa trên địa bàn quản lý theo quy định của pháp luật;
      trang_pdf: 2
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 5
      noi_dung: Tổ chức, cá nhân nhập khẩu thực hiện đăng ký kiểm tra nhà nước về chất lượng sản phẩm, hàng hoá nhập khẩu tại Uỷ ban nhân dân các cấp, cơ quan chuyên môn thuộc Ủy ban nhân dân tỉnh, thành phố nơi được phân công thực hiện tiếp nhận, giải quyết thủ tục hành chính kiểm tra chất lượng hàng hoá nhập khẩu.
      trang_pdf: 3
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 6
      noi_dung: Điều 6. Điều khoản chuyển tiếp 1. Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy đã được cấp cho sản phẩm, hàng hóa thuộc phạm vi điều chỉnh Thông tư này đến trước ngày Thông tư này có hiệu lực thi hành vẫn còn giá trị sử dụng cho đến hết thời hạn ghi trong Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy. 2. Các hồ sơ đăng ký chứng nhận hợp quy đã được tiếp nhận trước ngày 01 tháng 7 năm 2026 nhưng chưa được giải quyết xong thì tiếp tục được thực hiện theo quy định của pháp luật tại thời điểm tiếp nhận hồ sơ. 3. Các tổ chức đánh giá sự phù hợp đã được chỉ định thực hiện đánh giá sự phù hợp đối với sản phẩm, hàng hóa nhóm 2 thuộc trách nhiệm quản lý của Bộ Nội vụ và quyết định chỉ định còn hiệu lực thì được tiếp tục thực hiện đánh giá sự phù hợp theo quy định tại Thông tư này cho đến hết thời hạn hiệu lực của quyết định chỉ định. 4. Trong thời gian Cổng thông tin một cửa quốc gia điều chỉnh, nâng cấp để phù hợp với Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao ban hành kèm theo Thông tư này, tổ chức, cá nhân nhập khẩu sản phẩm, hàng hóa thuộc Danh mục thực hiện đăng ký kiểm tra nhà nước về chất lượng hàng hóa nhập khẩu trên Cổng Dịch vụ công quốc gia hoặc theo hướng dẫn của cơ quan kiểm tra. Việc tiếp nhận, xử lý hồ sơ, trả kết quả kiểm tra nhà nước về chất lượng hàng hóa nhập khẩu được thực hiện theo quy định tại Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026 của Chính phủ và các quy định pháp luật có liên quan; bảo đảm không làm gián đoạn hoạt động nhập khẩu hợp pháp của tổ chức, cá nhân.
      trang_pdf: 3
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 7
      noi_dung: 'Điều 7. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày ký. 2. Các Thông tư sau đây hết hiệu lực kể từ ngày Thông tư này có hiệu lực: a) Thông tư số 01/2021/TT-BLĐTBXH ngày 03 tháng 6 năm 2021 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội quy định Danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Lao động - Thương binh và Xã hội; b) Thông tư số 26/2018/TT-BLĐTBXH ngày 25/12/2018 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội quy định về quản lý chất lượng sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Lao động - Thương binh và Xã hội;'
      trang_pdf: 3
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 7
      noi_dung: c) Thông tư số 13/2024/TT-BLĐTBXH ngày 05 tháng 12 năm 2024 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội sửa đổi, bổ sung một số điều của Thông tư số 26/2018/TT-BLĐTBXH ngày 25 tháng 12 năm 2018 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội quy định về quản lý chất lượng sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Lao động - Thương binh và Xã hội; d) Điều 16 Thông tư số 09/2025/TT-BNV ngày 18 tháng 6 năm 2025 của Bộ trưởng Bộ Nội vụ quy định về phân định thẩm quyền và phân cấp thực hiện nhiệm vụ quản lý nhà nước trong lĩnh vực Nội vụ. 3. Trường hợp các văn bản quy phạm pháp luật, quy chuẩn kỹ thuật được viện dẫn trong Thông tư này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản mới. 4. Trường hợp quy chuẩn kỹ thuật quốc gia đối với các sản phẩm, hàng hoá thuộc Danh mục ban hành kèm theo Thông tư này ban hành trước thời điểm Thông tư này có hiệu lực có quy định khác về biện pháp quản lý chất lượng thì thực hiện theo quy định tại Thông tư này. 5. Trường hợp quy chuẩn kỹ thuật quốc gia được ban hành mới, sửa đổi, bổ sung hoặc thay thế quy chuẩn kỹ thuật quốc gia quy định tại Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao; hoặc quy chuẩn kỹ thuật quốc gia được ban hành mới để áp dụng bổ sung đối với sản phẩm, hàng hóa thuộc Danh mục ban hành kèm theo Thông tư này thì áp dụng theo quy định tại văn bản ban hành quy chuẩn kỹ thuật quốc gia đó kể từ thời điểm quy chuẩn kỹ thuật quốc gia có hiệu lực thi hành. 6. Đối với sản phẩm, hàng hóa quy định tại Danh mục ban hành kèm theo Thông tư này chưa được liệt kê, xác định mã HS hoặc có sự khác biệt, không thống nhất trong việc phân loại và xác định mã HS, việc xác định mã HS thực hiện theo quy định của pháp luật về hải quan.
      trang_pdf: 4
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 8
      noi_dung: Điều 8. Tổ chức thực hiện 1. Cục Việc làm, Bộ Nội vụ chủ trì, phối hợp với các cơ quan liên quan căn cứ vào tình hình thực tế và yêu cầu quản lý bao gồm cả việc phát sinh sản phẩm, công nghệ mới, cảnh báo trong nước và quốc tế về rủi ro sản phẩm, hàng hóa để rà soát, trình Bộ trưởng Bộ Nội vụ xem xét cập nhật, bổ sung Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình và mức độ rủi ro cao thuộc phạm vi quản lý, bảo đảm công khai, minh bạch và phù hợp với quy định pháp luật; Cục Việc làm chủ trì, phối hợp với các cơ quan, đơn vị thuộc Bộ Nội vụ rà soát các quy chuẩn kỹ thuật quốc gia tương ứng với sản phẩm, hàng hóa thuộc Danh mục ban hành kèm theo Thông tư này; đề xuất ban hành mới, sửa đổi, bổ sung hoặc thay thế quy chuẩn kỹ thuật quốc gia theo lộ trình phù hợp, bảo đảm yêu cầu quản lý chất lượng tương ứng với mức độ rủi ro của sản phẩm, hàng hóa.
      trang_pdf: 4
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
    - dieu: 8
      noi_dung: 2. Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương có trách nhiệm tổ chức triển khai thực hiện tuyên truyền, phổ biến, hướng dẫn các tổ chức, cá nhân sản xuất, kinh doanh trên địa bàn thực hiện Thông tư này; chỉ đạo các cơ quan chuyên môn và các cơ quan có liên quan thực hiện công tác quản lý, kiểm tra chất lượng sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao theo quy định của pháp luật; tổng hợp khó khăn, vướng mắc phát sinh trong quá trình thực hiện và kịp thời báo cáo, kiến nghị Bộ Nội vụ để xem xét, hướng dẫn hoặc sửa đổi, bổ sung Danh mục cho phù hợp với thực tiễn quản lý. 3. Trong quá trình thực hiện, nếu có khó khăn vướng mắc, các cơ quan, tổ chức, cá nhân phản ánh về Bộ Nội vụ để nghiên cứu, giải quyết./.
      trang_pdf: 5
      sha256_pdf: b907d726b9a2a51eb3268c8c7f956af7fd3ed756068c6ab48007c72d8e392667
