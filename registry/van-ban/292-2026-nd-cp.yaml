  da_doi_chieu: false
  ghi_chu: 'CHỈ trích Phụ lục V — Danh mục hàng hóa cấm kinh doanh tạm nhập, tái xuất, chuyển khẩu (PDF trang 63-65, có mã HS); Phụ lục I-IV, VI theo mô tả (tầng 2 chưa làm), Phụ lục VII là mẫu biểu. Mục Chương 28-29 dẫn NĐ 33/2024/NĐ-CP — ghi dan_chieu. loai_tac_dong KHAC: cấm KINH DOANH TNTX/chuyển khẩu, không cấm nhập khẩu thông thường (vd 7204 phế liệu vẫn NK theo giấy phép QĐ 13/2023) — không dùng CAM_NHAP_KHAU để tránh cờ đỏ sai. #1143-muc1: lấp cs chết 69/2018/NĐ-CP (nhóm Cấm KD TNTX); nhóm "hàng ĐQSD kinh doanh TNTX có ĐK" (8415.81-83) KHÔNG được NĐ 292 kế thừa danh mục mã.'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 456 ngày 03-08-2026 (raw/download/congbaocdn.chinhphu.vn/292-2026-nd-cp.pdf, 97 trang, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 31-07-2026, SHA-256 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740), thẻ vanban.chinhphu.vn (docid=218958) và trang wiki/sources/292-2026-nd-cp.md: Phó Thủ tướng Phạm Gia Túc ký ban hành ngày 22-07-2026; cấu trúc 8 Chương / 65 Điều / 07 Phụ lục; Điều 65 khoản 1 có hiệu lực thi hành từ ngày 05-09-2026 và thay thế toàn bộ NĐ 69/2018/NĐ-CP.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Nghị định này quy định chi tiết khoản 1 Điều 10, khoản 1 Điều 28, khoản 1 Điều 31, Điều 38, Điều 39, khoản 2 Điều 40, Điều 41, Điều 42, Điều 43, khoản 4 Điều 44, khoản 3 Điều 110, khoản 4 Điều 111 Luật Quản lý ngoại thương và quy định biện pháp để tổ chức, hướng dẫn thi hành Luật Quản lý ngoại thương về: a) Hoạt động mua bán hàng hóa quốc tế được thực hiện dưới các hình thức xuất khẩu, nhập khẩu; tạm nhập, tái xuất; tạm xuất, tái nhập; chuyển khẩu; quá cảnh và các hoạt động khác có liên quan đến hoạt động mua bán hàng hóa quốc tế theo quy định của pháp luật và điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. b) Giải quyết tranh chấp về áp dụng biện pháp quản lý ngoại thương. 2. Việc nhập khẩu hàng hóa là tài sản di chuyển của tổ chức, cá nhân; hành lý của khách xuất cảnh, nhập cảnh; hàng hóa của tổ chức, cá nhân nước ngoài được hưởng quyền ưu đãi, miễn trừ; quà biếu, quà tặng, hàng mẫu tuân thủ quy định của pháp luật có liên quan hoặc theo quy định riêng của Thủ tướng Chính phủ. 3. Nghị định này áp dụng đối với: a) Cơ quan quản lý nhà nước. b) Thương nhân tham gia hoạt động ngoại thương. c) Tổ chức, cá nhân trong nước và nước ngoài khác có liên quan.'
      trang_pdf: 1
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 3
      noi_dung: '1. Thương nhân Việt Nam không là tổ chức kinh tế có vốn đầu tư nước ngoài được kinh doanh xuất khẩu, nhập khẩu và thực hiện các hoạt động khác có liên quan không phụ thuộc vào ngành, nghề đăng ký kinh doanh theo quy định tại Điều 4 Nghị định này, trừ hàng hóa thuộc Danh mục cấm xuất khẩu, cấm nhập khẩu theo quy định tại Nghị định này; hàng hóa cấm xuất khẩu, cấm nhập khẩu khác theo quy định của pháp luật; hàng hóa tạm ngừng xuất khẩu, tạm ngừng nhập khẩu. Chi nhánh của thương nhân Việt Nam được thực hiện hoạt động ngoại thương theo ủy quyền của thương nhân. 2. Tổ chức kinh tế có vốn đầu tư nước ngoài, chi nhánh của thương nhân nước ngoài tại Việt Nam khi tiến hành hoạt động xuất khẩu, nhập khẩu thuộc phạm vi điều chỉnh của Nghị định này phải thực hiện các cam kết của Việt Nam trong các điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên, Danh mục hàng hóa và lộ trình do Bộ Công Thương công bố. Tổ chức kinh tế có vốn đầu tư nước ngoài được trực tiếp xuất khẩu hoặc ủy thác xuất khẩu sản phẩm do tổ chức đó sản xuất; trực tiếp nhập khẩu hoặc ủy thác nhập khẩu máy móc, thiết bị, nguyên liệu, vật tư, phụ tùng, linh kiện và các hàng hóa khác để triển khai hoạt động đầu tư phù hợp với mục tiêu của dự án đầu tư quy định tại Giấy chứng nhận đăng ký đầu tư. 3. Thương nhân nước ngoài không có hiện diện tại Việt Nam kinh doanh hàng hóa tại Việt Nam chỉ được thực hiện trong phạm vi quyền xuất khẩu, quyền nhập khẩu theo quy định hiện hành của Chính phủ. Thương nhân nước ngoài không có hiện diện tại Việt Nam được mua hàng hoá để giao cho thương nhân trong nước hoặc cho thương nhân trong nước thuê, mượn để phục vụ hợp đồng gia công cho chính thương nhân không hiện diện đó; được mua hàng hóa hoặc nhận sản phẩm gia công, nguyên liệu, phụ liệu, vật tư, linh kiện, bán thành phẩm dư thừa của hợp đồng gia công và bán cho thương nhân trong nước để phục vụ sản xuất hàng xuất khẩu.'
      trang_pdf: 3
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 4
      noi_dung: '1. Đối với hàng hóa xuất khẩu, nhập khẩu theo giấy phép, thương nhân xuất khẩu, nhập khẩu phải có giấy phép theo quy định pháp luật. 2. Đối với hàng hóa xuất khẩu, nhập khẩu theo điều kiện, thương nhân xuất khẩu, nhập khẩu phải đáp ứng điều kiện theo quy định pháp luật. 3. Hàng hóa xuất khẩu, nhập khẩu phải tuân thủ, đáp ứng chính sách quản lý mặt hàng theo quy định. Đối với hàng hóa thuộc Danh mục hàng hóa xuất khẩu, nhập khẩu phải kiểm tra theo quy định tại Điều 65 Luật Quản lý ngoại thương, thương nhân xuất khẩu, nhập khẩu hàng hóa phải chịu sự kiểm tra của cơ quan có thẩm quyền theo quy định pháp luật.'
      trang_pdf: 3
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 5
      khoan: 1
      noi_dung: '1. Hàng hóa cấm xuất khẩu, cấm nhập khẩu thực hiện theo quy định tại các văn bản pháp luật hiện hành và Danh mục hàng hóa cấm xuất khẩu, cấm nhập khẩu quy định tại Phụ lục I Nghị định này. 2. Căn cứ Phụ lục I Nghị định này và các văn bản pháp luật hiện hành, Bộ trưởng, Thủ trưởng cơ quan ngang Bộ có trách nhiệm công bố chi tiết hàng hóa cấm xuất khẩu, cấm nhập khẩu kèm theo mã số hàng hóa (mã HS), trừ trường hợp pháp luật hiện hành đã có quy định chi tiết mã HS các hàng hóa này. Hàng hóa cấm xuất khẩu, cấm nhập khẩu theo quy định tại Phụ lục I Nghị định này là hàng hóa có mã HS và mô tả chi tiết hàng hóa thuộc Danh mục chi tiết do Bộ trưởng, Thủ trưởng cơ quan ngang Bộ công bố.'
      trang_pdf: 4
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 8
      noi_dung: '1. Hàng hóa xuất khẩu, nhập khẩu theo giấy phép, theo điều kiện thực hiện theo quy định tại các văn bản pháp luật hiện hành và Danh mục hàng hóa xuất khẩu, nhập khẩu theo giấy phép, điều kiện quy định tại Phụ lục III Nghị định này. 2. Căn cứ Phụ lục III Nghị định này và các văn bản pháp luật hiện hành, Bộ trưởng, Thủ trưởng cơ quan ngang bộ có trách nhiệm công bố chi tiết hàng hóa kèm theo mã HS, trừ trường hợp pháp luật hiện hành đã có quy định chi tiết mã HS các hàng hóa này. 3. Bộ trưởng, Thủ trưởng cơ quan ngang Bộ ban hành hoặc trình cơ quan có thẩm quyền ban hành quy định chi tiết về trình tự, thủ tục cấp giấy phép xuất khẩu, nhập khẩu và thực hiện việc cấp phép theo quy định. 4. Căn cứ mục tiêu điều hành trong từng thời kỳ, Bộ trưởng Bộ Công Thương quy định việc áp dụng Giấy phép xuất khẩu tự động, Giấy phép nhập khẩu tự động đối với một số loại hàng hóa.'
      trang_pdf: 7
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 11
      noi_dung: '1. Trong trường hợp cần thiết, để đảm bảo yêu cầu quản lý, các Bộ, cơ quan ngang Bộ căn cứ thẩm quyền quản lý quy định tại Phụ lục IV Nghị định này, trình Chính phủ ban hành văn bản quy định hàng hóa nhập khẩu phải nộp CFS cho cơ quan có thẩm quyền và công bố chi tiết Danh mục hàng hóa kèm theo mã HS hàng hóa. 2. Bộ, cơ quan ngang Bộ có thẩm quyền quản lý quy định hoặc báo cáo cấp có thẩm quyền quy định các thông tin tối thiểu cần có trên CFS nhập khẩu, hoặc quy định mẫu CFS đối với hàng hóa nhập khẩu. 3. Bộ, cơ quan ngang Bộ có thẩm quyền quản lý quy định cụ thể trường hợp CFS được áp dụng cho nhiều lô hàng; quy định cụ thể thời hạn CFS nhập khẩu được chấp nhận trong trường hợp CFS không quy định thời hạn hiệu lực. 4. CFS đối với hàng hóa nhập khẩu thể hiện bằng tiếng Anh. Trường hợp CFS được thể hiện bằng ngôn ngữ khác không phải tiếng Anh thì phải được dịch sang tiếng Việt, có xác thực bởi thương nhân nhập khẩu. 5. Trường hợp có yêu cầu của Bộ, cơ quan ngang Bộ có thẩm quyền quản lý, CFS phải được hợp pháp hóa lãnh sự theo quy định của pháp luật, trừ trường hợp được miễn hợp pháp hóa lãnh sự theo quy định của pháp luật về chứng nhận lãnh sự, hợp pháp hóa lãnh sự. 6. Trường hợp có nghi ngờ tính xác thực của CFS hoặc hàng hóa nhập khẩu không phù hợp với nội dung CFS, cơ quan có thẩm quyền gửi yêu cầu kiểm tra, xác minh tới cơ quan, tổ chức cấp CFS.'
      trang_pdf: 7
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 12
      khoan: 1
      noi_dung: '1. Ủy ban nhân dân cấp tỉnh là cơ quan có thẩm quyền cấp CFS đối với hàng hóa xuất khẩu theo các quy định sau: a) Có yêu cầu của thương nhân xuất khẩu về việc cấp CFS cho hàng hóa. b) Hàng hóa có tiêu chuẩn công bố hoặc phiếu công bố sản phẩm hoặc giấy đăng ký lưu hành theo quy định của pháp luật hiện hành.'
      trang_pdf: 8
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 13
      noi_dung: '1. Danh mục hàng hóa cấm kinh doanh tạm nhập, tái xuất, chuyển khẩu quy định tại Phụ lục V ban hành kèm theo Nghị định này. 2. Danh mục hàng hóa quy định tại khoản 1 Điều này không áp dụng đối với trường hợp hàng hóa kinh doanh chuyển khẩu theo hình thức hàng hóa được vận chuyển thẳng từ nước xuất khẩu đến nước nhập khẩu, không qua cửa khẩu Việt Nam. 3. Trong trường hợp để ngăn ngừa tình trạng gây ô nhiễm môi trường, dịch bệnh, ảnh hưởng đến sức khỏe, tính mạng con người, chuyển tải bất hợp pháp, nguy cơ gian lận thương mại, Bộ trưởng Bộ Công Thương quyết định cụ thể hàng hóa tạm ngừng kinh doanh tạm nhập, tái xuất, chuyển khẩu và công bố công khai Danh mục kèm theo mã HS hàng hóa.'
      trang_pdf: 9
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 14
      noi_dung: '1. Ủy ban nhân dân cấp tỉnh là cơ quan có thẩm quyền cấp Giấy phép kinh doanh tạm nhập, tái xuất đối với hàng hóa quy định tại điểm a khoản 1 Điều 39 Luật Quản lý ngoại thương, trừ trường hợp quy định tại khoản 2, khoản 3 Điều này. Hồ sơ, quy trình cấp phép thực hiện theo quy định tại Điều 20, 21 Nghị định này. 2. Đối với tổ chức kinh tế có vốn đầu tư nước ngoài, chỉ được thực hiện tạm nhập, tái xuất hàng hóa theo quy định tại Điều 16 Nghị định này, không được thực hiện hoạt động kinh doanh tạm nhập, tái xuất hàng hóa. 3. Trường hợp pháp luật hiện hành đã có quy định hàng hóa thuộc diện phải cấp giấy phép khi tạm nhập, tái xuất; thương nhân thực hiện theo quy định đó, không phải có Giấy phép kinh doanh tạm nhập, tái xuất theo quy định tại Nghị định này. 4. Hàng hóa kinh doanh tạm nhập, tái xuất chịu sự kiểm tra, giám sát của cơ quan hải quan từ khi tạm nhập cho tới khi hàng hóa thực tái xuất ra khỏi Việt Nam. Không chia nhỏ hàng hóa vận chuyển bằng công-ten-nơ trong suốt quá trình vận chuyển hàng hóa từ cửa khẩu tạm nhập đến khu vực chịu sự giám sát của cơ quan hải quan, cửa khẩu tái xuất theo quy định. Trường hợp do yêu cầu vận chuyển cần phải thay đổi hoặc chia nhỏ hàng hóa vận chuyển bằng công-ten-nơ để tái xuất thì thực hiện theo quy định của cơ quan hải quan. 5. Hàng hóa kinh doanh tạm nhập, tái xuất được lưu lại tại Việt Nam không quá 60 ngày, kể từ ngày hoàn thành thủ tục hải quan tạm nhập. Trường hợp cần kéo dài thời hạn, thương nhân có văn bản đề nghị gia hạn gửi cơ quan hải quan nơi thực hiện thủ tục tạm nhập; thời hạn gia hạn mỗi lần không quá 30 ngày và không quá 02 lần gia hạn cho mỗi lô hàng tạm nhập, tái xuất. Quá thời hạn nêu trên, thương nhân phải tái xuất hàng hóa ra khỏi Việt Nam hoặc tiêu hủy. Trường hợp tiêu hủy hàng hóa kinh doanh tạm nhập, tái xuất do quá thời hạn lưu tại Việt Nam, thương nhân tự tổ chức tiêu hủy và chịu trách nhiệm thực hiện việc tiêu hủy theo quy định của pháp luật về bảo vệ môi trường và pháp luật về hải quan. Trường hợp nhập khẩu vào Việt Nam, thương nhân phải tuân thủ các quy định về quản lý nhập khẩu hàng hóa và thuế. 6. Kinh doanh tạm nhập, tái xuất được thực hiện trên cơ sở hai hợp đồng riêng biệt: Hợp đồng xuất khẩu và hợp đồng nhập khẩu. Hợp đồng xuất khẩu có thể ký trước hoặc sau hợp đồng nhập khẩu. 7. Việc thanh toán tiền hàng theo phương thức tạm nhập, tái xuất phải tuân thủ các quy định về quản lý ngoại hối và hướng dẫn của Ngân hàng Nhà nước Việt Nam.'
      trang_pdf: 10
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 18
      noi_dung: '1. Hàng hóa tạm nhập, tái xuất; tạm xuất, tái nhập được tạm nhập, tái xuất; tạm xuất, tái nhập qua các cửa khẩu quốc tế, cửa khẩu chính. 2. Trường hợp hàng hóa nước ngoài gửi vào kho ngoại quan để xuất khẩu, tái xuất qua các tỉnh biên giới thì cửa khẩu tạm nhập để gửi kho ngoại quan và cửa khẩu xuất khẩu, tái xuất hàng hóa qua các tỉnh biên giới thực hiện theo quy định tại Điều này.'
      trang_pdf: 14
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 19
      noi_dung: '1. Ủy ban nhân dân cấp tỉnh là cơ quan có thẩm quyền cấp Giấy phép kinh doanh chuyển khẩu đối với hàng hóa quy định tại khoản 1 Điều 43 Luật Quản lý ngoại thương, trừ trường hợp quy định tại khoản 2 Điều này. Hồ sơ, quy trình cấp phép thực hiện theo quy định tại Điều 20, Điều 21 Nghị định này. 2. Đối với tổ chức kinh tế có vốn đầu tư nước ngoài, chỉ được thực hiện kinh doanh chuyển khẩu theo hình thức hàng hóa được vận chuyển thẳng từ nước xuất khẩu đến nước nhập khẩu, không qua cửa khẩu Việt Nam. Hàng hóa kinh doanh chuyển khẩu phải phù hợp với ngành, nghề kinh doanh đã đăng ký hoặc nội dung Giấy chứng nhận đăng ký đầu tư đối với tổ chức kinh tế có vốn đầu tư nước ngoài thuộc trường hợp phải thực hiện thủ tục cấp giấy chứng nhận đăng ký đầu tư. 3. Chuyển khẩu hàng hóa được thực hiện trên cơ sở hai hợp đồng riêng biệt: Hợp đồng mua hàng và hợp đồng bán hàng do thương nhân ký với thương nhân nước ngoài. Hợp đồng mua hàng có thể ký trước hoặc sau hợp đồng bán hàng. 4. Đối với hình thức chuyển khẩu hàng hóa có qua cửa khẩu Việt Nam, hàng hóa kinh doanh chuyển khẩu phải được đưa vào, đưa ra khỏi Việt Nam tại cùng một khu vực cửa khẩu và chịu sự kiểm tra, giám sát của cơ quan hải quan từ khi đưa vào Việt Nam cho tới khi được đưa ra khỏi Việt Nam. 5. Việc thanh toán tiền hàng kinh doanh chuyển khẩu phải tuân thủ các quy định về quản lý ngoại hối và hướng dẫn của Ngân hàng Nhà nước Việt Nam.'
      trang_pdf: 14
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 24
      noi_dung: '1. Căn cứ chức năng nhiệm vụ được giao theo quy định của pháp luật tổ chức triển khai thực hiện, kiểm tra, kiểm soát, giám sát chặt chẽ hàng hóa tạm nhập, tái xuất từ khi nhập khẩu vào Việt Nam cho đến khi thực xuất khẩu ra khỏi Việt Nam hoặc chuyển tiêu thụ nội địa, tiêu hủy trong trường hợp được chuyển tiêu thụ nội địa, tiêu hủy theo quy định của pháp luật hiện hành. 2. Định kỳ vào ngày 15 của tháng đầu tiên của quý (hoặc vào ngày làm việc tiếp theo trong trường hợp ngày 15 trùng với ngày nghỉ, ngày lễ) cung cấp thông tin, số liệu thống kê về hoạt động kinh doanh tạm nhập tái xuất của quý liền trước cho Bộ Công Thương và cung cấp thông tin, số liệu đột xuất theo đề nghị của Bộ Công Thương để phục vụ công tác chỉ đạo, điều hành. 3. Thông báo cho Bộ Công Thương và Ủy ban nhân dân cấp tỉnh có liên quan trong các trường hợp sau để phối hợp điều hành, xử lý: a) Doanh nghiệp vi phạm quy định về kinh doanh tạm nhập, tái xuất và kinh doanh chuyển khẩu. b) Có hiện tượng ách tắc hàng hóa kinh doanh tạm nhập, tái xuất, chuyển khẩu tại các cảng, cửa khẩu.'
      trang_pdf: 18
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 39
      khoan: 1
      noi_dung: '1. Ủy ban nhân dân cấp tỉnh là cơ quan có thẩm quyền cấp Giấy phép gia công quân phục trên cơ sở lấy ý kiến của Bộ Quốc phòng, Bộ Công an. 2. Quân phục quy định tại Điều này được hiểu là đồng phục của quân nhân thuộc các lực lượng vũ trang nước ngoài, được sản xuất theo kiểu mẫu, quy cách thống nhất, mang mặc theo quy định của các lực lượng vũ trang nước ngoài. Danh mục sản phẩm quân phục trang bị cho các lực lượng vũ trang nước ngoài quy định tại Phụ lục VI Nghị định này. Sản phẩm dệt may thuộc Danh mục này nhưng không phải là sản phẩm quân phục trang bị cho lực lượng vũ trang nước ngoài không phải thực hiện theo quy định tại Điều này. 3. Quân phục gia công xuất khẩu cho lực lượng vũ trang nước ngoài không được tiêu thụ tại Việt Nam.'
      trang_pdf: 26
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 48
      noi_dung: '1. Hàng hóa xuất khẩu theo hợp đồng đại lý bán hàng tại nước ngoài được nhập khẩu trở lại Việt Nam trong trường hợp không tiêu thụ được tại nước ngoài. 2. Hàng hóa nhập khẩu trở lại Việt Nam nêu tại khoản 1 Điều này không phải chịu thuế nhập khẩu và được hoàn thuế xuất khẩu (nếu có) theo quy định pháp luật về thuế.'
      trang_pdf: 32
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 62
      khoan: 6
      noi_dung: '6. Các cơ quan cấp phép quy định tại Nghị định này chịu trách nhiệm tổ chức thực hiện cấp phép theo đúng quy định và đảm bảo cung cấp dịch vụ công trực tuyến đối với tất cả các thủ tục hành chính. Trường hợp thủ tục hành chính không được thực hiện thông qua Cổng thông tin một cửa quốc gia, cơ quan cấp phép có trách nhiệm thực hiện liên thông với Cổng thông tin một cửa quốc gia để kết nối, chia sẻ dữ liệu hoặc cập nhật, đăng tải giấy phép trên Cổng thông tin một cửa quốc gia để cơ quan hải quan có căn cứ giải quyết thông quan hàng hóa theo quy định.'
      trang_pdf: 42
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 64
      noi_dung: '1. Các Giấy phép do các cơ quan có thẩm quyền cấp cho thương nhân theo quy định tại Nghị định số 69/2018/NĐ-CP của Chính phủ quy định chi tiết một số Điều của Luật Quản lý ngoại thương và các văn bản hướng dẫn liên quan trước khi Nghị định này có hiệu lực được tiếp tục thực hiện theo các nội dung và thời hạn hiệu lực của các Giấy phép này. Trường hợp sửa đổi, bổ sung Giấy phép được cấp trước ngày Nghị định này có hiệu lực phải thực hiện theo quy định tại Nghị định này. 2. Các Mã số kinh doanh tạm nhập, tái xuất hàng thực phẩm đông lạnh, hàng đã qua sử dụng, hàng có thuế tiêu thụ đặc biệt đã được cấp hết hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026, các doanh nghiệp đã được cấp Mã số kinh doanh tạm nhập, tái xuất được rút số tiền đã ký quỹ tại tổ chức tín dụng nơi doanh nghiệp đã thực hiện ký quỹ để phục vụ việc cấp Mã số kinh doanh tạm nhập, tái xuất. Tổ chức tín dụng có trách nhiệm hoàn trả lại số tiền doanh nghiệp đã ký quỹ cho doanh nghiệp. 3. Các CFS đối với hàng hóa xuất khẩu do cơ quan có thẩm quyền cấp cho thương nhân trước khi Nghị định này có hiệu lực được tiếp tục thực hiện theo thời hạn hiệu lực của các CFS này hoặc được thực hiện đến hết ngày 31 tháng 12 năm 2027 đối với các trường hợp không ghi thời hạn hiệu lực trên CFS. 4. Các văn bản quy phạm pháp luật đang có hiệu lực của các Bộ, cơ quan ngang Bộ hướng dẫn thi hành Nghị định số 69/2018/NĐ-CP của Chính phủ được tiếp tục thực hiện đến hết ngày 31 tháng 12 năm 2026. 5. Các hồ sơ thủ tục hành chính đầy đủ đã được cơ quan có thẩm quyền tiếp nhận trước ngày Nghị định này có hiệu lực thi hành thì cơ quan có thẩm quyền đã tiếp nhận hồ sơ tiếp tục thực hiện theo quy định của văn bản quy phạm pháp luật tại thời điểm tiếp nhận hồ sơ.'
      trang_pdf: 43
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
    - dieu: 65
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 05 tháng 9 năm 2026 và thay thế Nghị định số 69/2018/NĐ-CP của Chính phủ quy định chi tiết một số điều của Luật Quản lý ngoại thương. 2. Nghị định này bãi bỏ: a) Điều 31 và Phụ lục X Nghị định số 146/2025/NĐ-CP của Chính phủ quy định về phân quyền, phân cấp trong lĩnh vực công nghiệp và thương mại. b) Mục B.I Nghị quyết số 19/2026/NQ-CP của Chính phủ về cắt giảm, phân cấp, đơn giản hóa thủ tục hành chính, điều kiện kinh doanh thuộc phạm vi quản lý của Bộ Công Thương. c) Điểm B.I, B.II mục 1; D.I, D.II, D.III, D.IV tiểu mục 2.2; các biểu mẫu số 03, 04, 05 mục 4 Phụ lục I.2 Nghị quyết số 66.18/2026/NQ-CP của Chính phủ phân quyền, cắt giảm, đơn giản hóa thủ tục hành chính, điều kiện kinh doanh. d) Quyết định số 11/2013/QĐ-TTg ngày 24 tháng 01 năm 2013 của Thủ tướng Chính phủ về việc cấm xuất khẩu, nhập khẩu, mua bán mẫu vật một số loài động vật hoang dã thuộc các Phụ lục của Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp. 3. Trường hợp các văn bản được dẫn chiếu trong Nghị định này bị thay thế hoặc sửa đổi, bổ sung thì thực hiện theo văn bản thay thế hoặc văn bản đã được sửa đổi, bổ sung. 4. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân cấp tỉnh chịu trách nhiệm hướng dẫn và thi hành Nghị định này.'
      trang_pdf: 44
      sha256_pdf: 08a857e7822e0be21f2ccf8b568070051551ce7b7dc986ec7a170ceffe954740
ghi_chu: 'Điều 65 khoản 2 còn bãi bỏ Điều 31 và Phụ lục X NĐ 146/2025/NĐ-CP, Mục B.I NQ 19/2026/NQ-CP, một số điểm/mẫu Phụ lục I.2 NQ 66.18/2026/NQ-CP, QĐ 11/2013/QĐ-TTg — chưa ghi thành quan hệ (chưa có trong sổ). Được TT 48/2026/TT-BCT hướng dẫn. Trang tổng hợp Meta AI ghi sai hiệu lực (22-07). Đầu mối: trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) — mọi thông tin dưới đây lấy từ nguồn bậc A, không lấy từ trang đó.'
