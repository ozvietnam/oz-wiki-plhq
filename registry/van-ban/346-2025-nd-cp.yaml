  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn bản ký số 10 trang trên vanban.chinhphu.vn (docid=216402, Phó Thủ tướng Hồ Đức Phớc ký, raw/download/datafiles.chinhphu.vn/346-2025-nd-cp.pdf, SHA-256 d4a255f0c5080fa037ca91a29245b0af249cc5d52d6fefc95b108a7e1b7f4db2) và trang wiki/sources/346-2025-nd-cp.md: số hiệu 346/2025/NĐ-CP, tên, ngày ban hành 29/12/2025, Điều 10 khoản 1 hiệu lực từ 01/01/2026 và thay thế toàn bộ Nghị định 53/2020/NĐ-CP ngày 05/05/2020'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Nghị định này quy định về đối tượng chịu phí, tổ chức thu phí, người nộp phí, các trường hợp miễn phí, mức phí, xác định số phí phải nộp, khai, thu, nộp, quản lý và sử dụng phí bảo vệ môi trường đối với nước thải. 2. Nghị định này áp dụng đối với người nộp phí, tổ chức thu phí bảo vệ môi trường đối với nước thải và cơ quan nhà nước, tổ chức, cá nhân khác có liên quan đến thu, nộp, quản lý và sử dụng phí bảo vệ môi trường đối với nước thải.'
    - dieu: 2
      noi_dung: 'Đối tượng chịu phí bảo vệ môi trường đối với nước thải theo quy định tại Nghị định này là nước thải công nghiệp và nước thải sinh hoạt, trừ trường hợp đã nộp giá dịch vụ thoát nước theo quy định của pháp luật về giá, pháp luật về thoát nước và xử lý nước thải và các trường hợp miễn phí theo quy định tại Điều 5 Nghị định này, cụ thể như sau: 1. Đối tượng chịu phí bảo vệ môi trường đối với nước thải công nghiệp là toàn bộ nước thải phát sinh từ cơ sở sản xuất, kinh doanh, dịch vụ, khu sản xuất, kinh doanh, dịch vụ tập trung, cụm công nghiệp (sau đây gọi chung là cơ sở) xả vào nguồn tiếp nhận theo quy định của pháp luật về bảo vệ môi trường, trừ đối tượng chịu phí bảo vệ môi trường đối với nước thải sinh hoạt quy định tại khoản 2 Điều này. 2. Đối tượng chịu phí bảo vệ môi trường đối với nước thải sinh hoạt bao gồm: a) Nước thải sinh hoạt và nước thải phát sinh từ cơ sở thuộc danh mục các loại hình kinh doanh, dịch vụ phát sinh nước thải được quản lý như nước thải sinh hoạt (sau đây gọi chung là nước thải sinh hoạt) theo quy định tại Quy chuẩn kỹ thuật quốc gia về nước thải sinh hoạt và nước thải đô thị, khu dân cư tập trung do Bộ Nông nghiệp và Môi trường ban hành. b) Nước thải của cơ sở phát sinh tổng lượng nước thải trung bình năm dưới 20 m³/ngày (tương ứng với 7.300 m³/năm) trong trường hợp sử dụng nước từ hệ thống cung cấp nước sạch.'
    - dieu: 3
      noi_dung: 'Tổ chức thu phí bảo vệ môi trường đối với nước thải gồm: 1. Cơ quan quản lý nhà nước về môi trường cấp tỉnh, cấp xã theo quy định của pháp luật về bảo vệ môi trường là tổ chức thu phí đối với đối tượng chịu phí quy định tại khoản 1 Điều 2 Nghị định này. Căn cứ tình hình thực tế quản lý, Ủy ban nhân dân cấp tỉnh quyết định cơ quan thực hiện thu phí bảo vệ môi trường đối với nước thải công nghiệp của các cơ sở trên địa bàn quy định tại khoản này. 2. Tổ chức cung cấp nước sạch là tổ chức thu phí đối với đối tượng chịu phí quy định tại khoản 2 Điều 2 Nghị định này.'
    - dieu: 4
      noi_dung: 'Tổ chức, hộ gia đình, cá nhân xả nước thải quy định tại Điều 2 Nghị định này là người nộp phí bảo vệ môi trường đối với nước thải.'
    - dieu: 5
      noi_dung: 'Miễn phí bảo vệ môi trường đối với nước thải trong các trường hợp sau: 1. Nước xả ra từ nhà máy thủy điện bao gồm nước xả ra từ tua bin phát điện của nhà máy thủy điện lấy từ đập, hồ chứa của nhà máy, không qua bất kỳ công đoạn sản xuất, vận hành nào có khả năng gây ô nhiễm (không bao gồm nước thải từ sinh hoạt, từ hoạt động bảo dưỡng, sửa chữa, vệ sinh công trình và hoạt động cơ khí, kỹ thuật, tổ chức, vận hành khác của nhà máy có tiếp xúc với chất gây ô nhiễm). 2. Nước thải từ nước biển dùng vào sản xuất muối. 3. Nước thải sinh hoạt của tổ chức, hộ gia đình, cá nhân ở địa bàn cấp xã có điều kiện kinh tế - xã hội đặc biệt khó khăn theo quy định của pháp luật đầu tư; nước thải sinh hoạt của tổ chức (trừ cơ sở phát sinh tổng lượng nước thải trung bình từ 20 m³/ngày (tương ứng với 7.300 m³/năm) trở lên), hộ gia đình, cá nhân ở địa bàn chưa có hệ thống cung cấp nước sạch hoặc tự khai thác nước để sử dụng. 4. Nước trao đổi nhiệt theo quy định của pháp luật về bảo vệ môi trường. 5. Nước thải từ nước mưa tự nhiên chảy tràn. 6. Nước thải từ phương tiện đánh bắt thủy sản, hải sản. 7. Nước thải của hệ thống xử lý nước thải tập trung đô thị theo quy định của pháp luật về thoát nước và xử lý nước thải và nước thải của hệ thống thoát nước và xử lý nước thải của khu chung cư cao tầng, cụm chung cư, khu dân cư tập trung theo quy định của pháp luật về bảo vệ môi trường. 8. Nước thải từ hoạt động khai thác khoáng sản theo quy định của pháp luật về địa chất và khoáng sản. 9. Nước thải từ hoạt động sản xuất, chế biến của cơ sở được tái sử dụng theo quy định của pháp luật về bảo vệ môi trường. 10. Nước thải từ hoạt động nuôi trồng thủy sản, hải sản.'
    - dieu: 6
      noi_dung: '1. Mức phí bảo vệ môi trường đối với nước thải sinh hoạt: Mức phí bảo vệ môi trường đối với nước thải sinh hoạt là 10% trên giá bán của 01 m³ nước sạch chưa bao gồm thuế giá trị gia tăng. Trường hợp cần áp dụng mức phí cao hơn, Hội đồng nhân dân cấp tỉnh quyết định mức phí cụ thể cao hơn đối với từng đối tượng chịu phí. 2. Số phí bảo vệ môi trường phải nộp đối với nước thải sinh hoạt được xác định như sau: Số phí phải nộp (đồng) = Số lượng nước sạch sử dụng (m³) x Giá bán nước sạch (đồng/m³) x Mức phí. Trong đó: a) Số lượng nước sạch sử dụng được xác định theo đồng hồ đo lượng nước sạch tiêu thụ của người nộp phí. b) Giá bán nước sạch là giá bán nước sinh hoạt (chưa bao gồm thuế giá trị gia tăng) do Ủy ban nhân dân cấp tỉnh ban hành. c) Mức phí được quy định tại khoản 1 Điều này.'
    - dieu: 7
      khoan: 1
      noi_dung: '1. Trường hợp cơ sở không thuộc đối tượng phải thực hiện quan trắc theo quy định của pháp luật về bảo vệ môi trường mà không tự thực hiện quan trắc để tính phí, mức phí và số phí phải nộp trong quý xác định theo công thức sau: Fq = Lq x 1.700. Trong đó: a) Fq là số phí phải nộp trong quý (đồng). b) Lq là tổng lượng nước thải trong quý nộp phí (m³) được xác định căn cứ kết quả thực tế của đồng hồ đo lưu lượng đầu ra theo quy định của pháp luật về bảo vệ môi trường. c) 1.700 là mức phí tính cho 01 m³ nước thải (đồng/m³).'
    - dieu: 7
      khoan: 2
      noi_dung: '2. Trường hợp cơ sở thực hiện quan trắc các thông số ô nhiễm có trong nước thải để tính phí (bao gồm trường hợp không thuộc đối tượng phải thực hiện quan trắc theo quy định của pháp luật về bảo vệ môi trường nhưng tự thực hiện quan trắc với tần suất 01 lần/năm để tính phí cho cả năm và các trường hợp phải thực hiện quan trắc theo quy định của pháp luật bảo vệ môi trường), mức phí và xác định số phí phải nộp trong quý được xác định như sau: Fq = Lq x C. Trong đó: a) Fq là số phí phải nộp trong quý (đồng). b) Lq là tổng lượng nước thải trong quý nộp phí (m³) được xác định căn cứ kết quả thực tế của đồng hồ đo lưu lượng đầu ra theo quy định của pháp luật về bảo vệ môi trường. c) C là tổng mức phí của tất cả thông số ô nhiễm có trong nước thải phải tính phí (đồng/m³) được tính theo công thức sau: C = Σ (Hi x 0,001 x Pi). Trong đó: Hi là hàm lượng thông số ô nhiễm thứ i (mg/l); Pi là mức phí của thông số ô nhiễm thứ i theo biểu sau:'
    - dieu: 8
      khoan: 1
      noi_dung: '1. Phí bảo vệ môi trường đối với nước thải sinh hoạt: a) Người nộp phí thực hiện nộp phí bảo vệ môi trường đối với nước thải sinh hoạt cùng với hóa đơn thanh toán tiền sử dụng nước sạch cho tổ chức cung cấp nước sạch. b) Tổ chức thu phí mở sổ sách kế toán theo dõi riêng số tiền phí bảo vệ môi trường đối với nước thải sinh hoạt thu được; không hạch toán vào doanh thu hoạt động kinh doanh số tiền phí thu được phải nộp ngân sách nhà nước. c) Hằng tháng, chậm nhất là ngày 20 của tháng tiếp theo, tổ chức thu phí thực hiện nộp toàn bộ số tiền phí thu được vào tài khoản phí chờ nộp ngân sách nhà nước. d) Tổ chức thu phí thực hiện khai phí theo quy định của pháp luật về quản lý thuế và nộp số tiền phí phải nộp ngân sách nhà nước từ tài khoản phí chờ nộp ngân sách nhà nước vào ngân sách nhà nước. đ) Hằng năm, tổ chức thu phí thực hiện quyết toán số phí thu được theo quy định của pháp luật về quản lý thuế. e) Kho bạc Nhà nước thực hiện hạch toán số tiền phí bảo vệ môi trường đối với nước thải do tổ chức thu phí nộp vào ngân sách nhà nước theo quy định.'
    - dieu: 9
      noi_dung: '1. Tổ chức cung cấp nước sạch được để lại 10% trên tổng số tiền phí thu được để trang trải chi phí cho hoạt động thu phí. Trường hợp cần thiết, Hội đồng nhân dân cấp tỉnh quyết định tỷ lệ để lại cho tổ chức cung cấp nước sạch phù hợp với điều kiện, chi phí thực tế tại địa phương nhưng tối đa không quá 10%. Số tiền phí được để lại là doanh thu của tổ chức cung cấp nước sạch. Tổ chức cung cấp nước sạch kê khai, nộp thuế theo quy định của pháp luật về quản lý thuế và tự quyết định việc quản lý, sử dụng số tiền phí được để lại.'
    - dieu: 10
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026. Thay thế Nghị định số 53/2020/NĐ-CP ngày 05 tháng 5 năm 2020 của Chính phủ quy định phí bảo vệ môi trường đối với nước thải. 2. Kể từ ngày Nghị định này có hiệu lực thi hành, trường hợp Hội đồng nhân dân cấp tỉnh chưa ban hành mức phí bảo vệ môi trường đối với nước thải sinh hoạt theo quy định tại khoản 1 Điều 6 Nghị định này và tỷ lệ để lại tiền phí bảo vệ môi trường đối với nước thải sinh hoạt theo quy định tại khoản 1 Điều 9 Nghị định này thì tiếp tục thực hiện theo văn bản đã ban hành theo quy định tại Nghị định số 53/2020/NĐ-CP. Hội đồng nhân dân cấp tỉnh ban hành văn bản mới thay thế tại kỳ họp gần nhất. 3. Việc kê khai, thẩm định tờ khai, thu, nộp, quyết toán, quản lý và sử dụng phí đối với các trường hợp phát sinh trước ngày Nghị định này có hiệu lực thi hành thì tiếp tục thực hiện theo quy định tại Nghị định số 53/2020/NĐ-CP. 4. Việc nộp phí bảo vệ môi trường đối với nước thải theo quy định tại Nghị định này không là căn cứ xác nhận việc xả thải hợp pháp của cơ sở thải nước thải. Cơ sở thải nước thải vi phạm các quy định của pháp luật về bảo vệ môi trường sẽ bị xử lý vi phạm theo quy định của pháp luật về bảo vệ môi trường. 5. Trong quá trình thực hiện, nếu các văn bản quy phạm pháp luật quy định viện dẫn tại Nghị định này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản sửa đổi, bổ sung hoặc thay thế đó.'
    - dieu: 11
      noi_dung: '1. Bộ Nông nghiệp và Môi trường có trách nhiệm: a) Hướng dẫn về hoạt động quan trắc, xác định lưu lượng nước thải, hàm lượng thông số ô nhiễm tính phí bảo vệ môi trường đối với nước thải. b) Tổng hợp đề xuất, kiến nghị sửa đổi, bổ sung văn bản thu phí (nếu có) gửi Bộ Tài chính tổng hợp trình Chính phủ. 2. Ủy ban nhân dân cấp tỉnh có trách nhiệm: a) Quyết định cơ quan thực hiện thu phí bảo vệ môi trường đối với nước thải công nghiệp của các cơ sở trên địa bàn quy định tại khoản 1 Điều 3 Nghị định này. b) Trình Hội đồng nhân dân cùng cấp quy định cụ thể mức phí bảo vệ môi trường đối với nước thải sinh hoạt theo quy định tại khoản 1 Điều 6 Nghị định này và tỷ lệ để lại tiền phí bảo vệ môi trường đối với nước thải sinh hoạt theo quy định tại khoản 1 Điều 9 Nghị định này. c) Chỉ đạo các tổ chức thu phí quy định tại khoản 1 Điều 3 Nghị định này phối hợp với các cơ quan liên quan rà soát, phân loại, điều chỉnh đối tượng nộp phí (nếu có) theo quý và thông báo đến người nộp phí chậm nhất là ngày 10 tháng 3 hằng năm. Trường hợp cơ sở bắt đầu hoạt động sau ngày 31 tháng 3 thì thực hiện thông báo đến người nộp phí chậm nhất là ngày cuối cùng của tháng đầu tiên của quý tiếp theo. d) Chỉ đạo các tổ chức thu phí quy định tại khoản 1 Điều 3 Nghị định này tiếp nhận, theo dõi việc tự xác định và nộp phí của người nộp phí. đ) Tổng hợp số liệu về phí bảo vệ môi trường đối với nước thải tại địa phương, báo cáo Bộ Nông nghiệp và Môi trường trước ngày 31 tháng 5 năm sau. 3. Cơ quan thuế có trách nhiệm kiểm tra việc khai, nộp và quyết toán phí bảo vệ môi trường đối với nước thải của tổ chức thu phí trên địa bàn. 4. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm thi hành Nghị định này.'
ghi_chu: Nạp từ điểm mù CAO (OZV-556) — thay thế Nghị định 53/2020/NĐ-CP từ 01/01/2026; đồng thời chỉnh lại chiều quan hệ thay_the từ 53-2020-nd-cp.yaml sang 346-2025-nd-cp.yaml.
