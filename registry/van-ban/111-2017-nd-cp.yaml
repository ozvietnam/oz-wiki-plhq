xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo Số 769 + 770 (id=24846): Nghị định 111/2017/NĐ-CP của Chính phủ quy định về tổ chức đào tạo thực hành trong đào tạo khối ngành sức khỏe, ban hành 05-10-2017, có hiệu lực từ 20-11-2017; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ; ngoài phạm vi hàng hóa XNK)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Nghị định này quy định về chương trình, kế hoạch, hợp đồng đào tạo thực hành; yêu cầu trong tổ chức đào tạo thực hành; quyền và trách nhiệm của tổ chức, cá nhân liên quan trong tổ chức đào tạo thực hành khối ngành sức khỏe.
      trang_pdf: 1
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Nghị định này các từ ngữ dưới đây được hiểu như sau: 1. Cơ sở thực hành của cơ sở giáo dục trong đào tạo khối ngành sức khỏe (sau đây viết tắt là cơ sở thực hành) là cơ sở khám bệnh, chữa bệnh; cơ sở y tế dự phòng và các cơ sở y tế khác đáp ứng yêu cầu trong tổ chức đào tạo thực hành theo quy định tại Nghị định này.'
      trang_pdf: 1
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc trong tổ chức đào tạo thực hành khối ngành sức khỏe 1. Bảo đảm sự an toàn, tôn trọng và giữ bí mật thông tin cho người sử dụng dịch vụ y tế tại cơ sở thực hành. 2. Lấy người học thực hành làm trung tâm, được đào tạo để đạt các phẩm chất, năng lực đã được xác định trong chương trình đào tạo thực hành theo chuẩn năng lực nghề nghiệp.
      trang_pdf: 2
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 6
      noi_dung: Điều 6. Hợp đồng đào tạo thực hành 1. Hợp đồng đào tạo thực hành bao gồm hợp đồng nguyên tắc và hợp đồng chi tiết, được ký theo thỏa thuận giữa cơ sở giáo dục và cơ sở thực hành đáp ứng các yêu cầu trong đào tạo thực hành quy định tại Chương III Nghị định này. Trường hợp cơ sở thực hành trực thuộc cơ sở giáo dục hoặc cơ sở giáo dục trực thuộc cơ sở thực hành thì không bắt buộc phải ký hợp đồng đào tạo thực hành.
      trang_pdf: 3
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 8
      noi_dung: 'Điều 8. Yêu cầu đối với người giảng dạy thực hành 1. Yêu cầu chung đối với người giảng dạy thực hành: a) Có văn bằng, trình độ, kinh nghiệm chuyên môn tối thiểu 12 tháng liên tục đến thời điểm giảng dạy thực hành phù hợp với trình độ, ngành/chuyên ngành giảng dạy thực hành; trình độ của người giảng dạy thực hành không được thấp hơn trình độ đang được đào tạo của người học thực hành;'
      trang_pdf: 4
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 10
      noi_dung: Điều 10. Yêu cầu đối với cơ sở giáo dục 1. Có chương trình, kế hoạch và hợp đồng đào tạo thực hành theo quy định tại các Điều 4, 5 và 6 Nghị định này.
      trang_pdf: 6
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 13
      noi_dung: 'Điều 13. Quyền và trách nhiệm của cơ sở thực hành 1. Cơ sở thực hành có các quyền sau đây: a) Được ưu tiên tham gia các chương trình, dự án đầu tư trong lĩnh vực y tế và đào tạo nhân lực y tế; b) Được sử dụng cơ sở vật chất và trang thiết bị của cơ sở giáo dục (nếu có) đặt tại cơ sở thực hành trong hoạt động chuyên môn; c) Được tính điểm khi đánh giá chất lượng và xếp hạng cơ sở y tế theo quy định của Bộ trưởng Bộ Y tế;'
      trang_pdf: 8
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 15
      noi_dung: 'Điều 15. Quyền và trách nhiệm của cơ sở giáo dục 1. Cơ sở giáo dục có quyền sau đây: a) Quyết định việc chi trả thù lao và các chế độ khác (nếu có) cho người giảng dạy thực hành của cơ sở thực hành tham gia hoạt động xây dựng chương trình đào tạo, biên soạn tài liệu đào tạo, nghiên cứu khoa học tại cơ sở giáo dục theo quy định;'
      trang_pdf: 9
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 17
      noi_dung: Điều 17. Quyền và trách nhiệm của người học thực hành 1. Được tham gia các hoạt động chuyên môn phù hợp với năng lực, trình độ, chuyên môn của người học thực hành và nhu cầu của cơ sở thực hành dưới sự giám sát, hướng dẫn của người giảng dạy thực hành; được hưởng chế độ thù lao tương ứng với mức độ tham gia theo quy chế chi tiêu nội bộ trong trường hợp được cơ sở thực hành bố trí tham gia các hoạt động chuyên môn phù hợp.
      trang_pdf: 11
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
    - dieu: 20
      noi_dung: Điều 20. Hiệu lực thi hành Nghị định này có hiệu lực thi hành từ ngày 20 tháng 11 năm 2017.
      trang_pdf: 12
      sha256_pdf: 6648e943fb02a1f59f9aa7fd0bf41223c986d2aaf8dae8d948f3010b9b40f608
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: KHÔNG — NĐ về tổ chức đào tạo thực hành khối ngành sức khỏe, ngoài phạm vi hàng hóa XNK; nạp để xác nhận miss/khách tra nhầm số hiệu (cảnh báo cho kho). Không gắn nhánh.'
