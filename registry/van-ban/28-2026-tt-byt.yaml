      noi_dung: 'Điều 3. Trách nhiệm thi hành 1. Cục Quản lý Dược có trách nhiệm: a) Tổ chức triển khai, hướng dẫn, kiểm tra việc thực hiện Thông tư này trong phạm vi toàn quốc; b) Rà soát, đề xuất Bộ Y tế điều chỉnh, cập nhật, bổ sung các Danh mục quy định tại Điều 2 Thông tư này.'
      trang_pdf: 2
      sha256_pdf: b20ea7b104046ff48611c9566e184db7505701c2031b561f7f6b88540762a422
    - dieu: 3
      khoan: 2
      noi_dung: '2. Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương có trách nhiệm: a) Tổ chức triển khai, hướng dẫn, kiểm tra việc thực hiện Thông tư này trên địa bàn quản lý; b) Chỉ đạo các cơ quan có liên quan trong công tác quản lý, kiểm tra chất lượng thuốc hóa dược, thuốc dược liệu, vắc xin, sinh phẩm, nguyên liệu làm thuốc, bán thành phẩm thuốc và bán thành phẩm dược liệu có mức độ rủi ro cao, mức độ rủi ro trung bình theo quy định của pháp luật về dược.'
      trang_pdf: 2
      sha256_pdf: b20ea7b104046ff48611c9566e184db7505701c2031b561f7f6b88540762a422
    - dieu: 3
      khoan: 3
      noi_dung: '3. Cơ sở kiểm nghiệm thuốc, nguyên liệu làm thuốc của nhà nước có trách nhiệm thực hiện kiểm tra chất lượng thuốc hóa dược, thuốc dược liệu, vắc xin, sinh phẩm, nguyên liệu làm thuốc, bán thành phẩm thuốc và bán thành phẩm dược liệu có mức độ rủi ro cao, mức độ rủi ro trung bình theo quy định của pháp luật về dược.'
