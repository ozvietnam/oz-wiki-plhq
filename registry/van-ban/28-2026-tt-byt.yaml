    Điều 1.1: Phạm vi — thuốc hóa dược + thuốc dược liệu + vắc xin + sinh phẩm + nguyên liệu + bán thành phẩm thuộc BYT.
    Điều 1.2: KHÔNG điều chỉnh nguyên liệu làm thuốc là dược liệu.
    Điều 2: Ban hành Danh mục rủi ro cao (Phụ lục I) + rủi ro trung bình (Phụ lục II).
    Điều 3: Trách nhiệm thi hành (Cục Quản lý Dược, UBND các tỉnh).
    Điều 4: Hiệu lực 01/07/2026.
    Căn cứ: Luật Chất lượng SPHH 05/2007/QH12 (sửa bởi 78/2025/QH15), Luật Dược 105/2016/QH13 (sửa bởi 44/2024/QH15), NĐ 37/2026/NĐ-CP, NĐ 163/2025/NĐ-CP, NĐ 42/2025/NĐ-CP.
