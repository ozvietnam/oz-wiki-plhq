xac_minh:
  muc: NGUON_B
  pham_vi: 'Đã đọc toàn văn trên thuvienphapluat.vn: tên, số hiệu, ngày ban hành 09/04/2019, người ký Trần Xuân Hà (Thứ trưởng BTC), nội dung duy nhất là bãi bỏ TT 304/2016/TT-BTC; luatvietnam.vn corroborate. Còn thiếu: đối chiếu Công báo gốc; ngày hiệu lực phụ thuộc ngày NĐ 20/2019/NĐ-CP có hiệu lực nên chưa chốt.'
