ghi_chu: 'Nạp đợt "làm tất" 6/11 (#87 P1/P2 + #209). CẢNH BÁO NHẪM: issue #87 gán 19/2019/TT-BTC là "Quy định NSW Cổng thông tin một cửa" — SAI; toàn văn TTPL xác nhận đây là TT bãi bỏ TT 304/2016/TT-BTC (Bảng giá tính lệ phí trước bạ ô tô, xe mô tô), có hiệu lực khi NĐ 20/2019/NĐ-CP có hiệu lực. Đã đối chiếu thêm 06-11-2026 trên hệ thống văn bản quốc gia: các ứng viên "TT NSW" đều là TT khác (18/2019/TT-BTC và 06/2019/TT-BTC, 02/2018/TT-BTC, 03/2020/TT-BTC, 27/2023/TT-BTC — tra từng số, không TT nào về NSW); khung NSW cho hàng XNK thực tế là QĐ 1254/QĐ-TTg (26/9/2018) → NĐ 85/2019/NĐ-CP (HL 01/01/2020) → NĐ 336/2026/NĐ-CP (HL 15/10/2026, Điều 48 thay thế 85/2019). Liên quan XNK: gián tiếp — ô tô nhập khẩu nộp lệ phí trước bạ tính trên giá tính thuế XNK, việc bãi bỏ bảng giá 304/2016 chuyển sang cách tính theo NĐ 20/2019/NĐ-CP sửa NĐ 140/2016/NĐ-CP.'
