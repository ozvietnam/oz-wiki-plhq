  pham_vi: 'PDF Công báo số 751+752 ngày 15-06-2025 (lớp chữ) — tổng hợp Điều 1, Điều 2 và Phụ lục: (1) Điều 1: bãi bỏ điểm c khoản 2 Điều 3 TT 01/2018/TT-BCT và thay thế toàn bộ Phụ lục I ban hành kèm theo TT 01/2018/TT-BCT bằng Phụ lục ban hành kèm theo TT 33/2025/TT-BCT; (2) Điều 2 hiệu lực thi hành kể từ ngày 21 tháng 7 năm 2025; (3) Phụ lục — Danh mục hàng hóa mua bán, trao đổi qua cửa khẩu phụ, lối mở biên giới nằm ngoài khu kinh tế cửa khẩu, nguyên tắc áp dụng mã HS 2/4/6/8 số theo Chương/nhóm/phân nhóm/mã 8 số, gồm 28 Chương HS biên giới: Chương 07 (sắn), 08 (hạt điều 0801), 10 (ngô 1005), 11 (toàn bộ), 12 (đậu tương 1201 — lưu ý body nêu 1212 nhưng mã nằm trong Chương 12, ghi nhận cả 1201 và 1212), 25 (toàn bộ trừ nhóm 2501), 26 (toàn bộ trừ 2618.00.00, 2619.00.00 và nhóm 2620, 2621), 27 (than đá 2701; than cốc 2704), 39 (toàn bộ trừ nhóm 3915–3926), 40 (toàn bộ trừ 4004.00.00 và nhóm 4010–4017), 41 (toàn bộ trừ nhóm 4101–4103), 44 (toàn bộ trừ nhóm 4403, 4407, 4414–4420), 50 (toàn bộ), 51 (toàn bộ trừ nhóm 5103), 52 (toàn bộ trừ nhóm 5202), 53 (toàn bộ), 54 (toàn bộ), 55 (toàn bộ), 56 (toàn bộ), 58 (toàn bộ trừ nhóm 5805, 5811), 59 (toàn bộ), 60 (toàn bộ), 72 (gang thỏi 7201, hợp kim fero 7202), 73 (toàn bộ trừ nhóm 7321–7326), 74 (toàn bộ trừ 7404.00.00 và nhóm 7418), 75 (toàn bộ trừ 7503.00.00), 76 (toàn bộ trừ 7602.00.00 và nhóm 7615, 7616), 78 (toàn bộ trừ 7802.00.00 và nhóm 7806), 79 (toàn bộ trừ 7902.00.00 và nhóm 7907), 80 (toàn bộ trừ 8002.00.00 và nhóm 8007). Tổng hợp Chương HS biên giới áp dụng: 07, 08, 10, 11, 12, 25, 26, 27, 39, 40, 41, 44, 50, 51, 52, 53, 54, 55, 56, 58, 59, 60, 72, 73, 74, 75, 76, 78, 79, 80 (đếm đủ 30 Chương vì 50–56 là 7 Chương liên tiếp và 58–60 là 3 Chương liên tiếp, cộng 72–80 là 7 Chương). Tình trạng hiện tại: sổ không có văn bản sau ghi thay/bãi TT 33/2025; Điều 20 TT 48/2026/TT-BCT (PDF Công báo số 521) không liệt kê TT 33/2025'
