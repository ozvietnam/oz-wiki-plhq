ghi_chu: 'Nền pháp lý mỹ phẩm; còn hiệu lực. Bị sửa bởi TT 09/2015 (quảng cáo), NĐ 155/2018 (điều kiện đầu tư), TT 29/2020, TT 34/2025 (HL 18/8/2025). Đọc bản hợp nhất 09/VBHN-BYT thay bản gốc. CẢNH BÁO NGUỒN: các nhắc "TT 64/2015/TT-BYT, 03/2022/TT-BYT sửa 06/2011" trên web là NHIỄU (64/2015 là TT-BTNMT; 03/2022 là chức danh nghề nghiệp) — đã loại khỏi sổ. Điểm nhập khẩu theo VBHN: CFS (Đ4, miễn theo điều kiện CPTPP/ASEAN), ký điện tử (Đ5), nộp Cổng DVC quốc gia theo NĐ 118/2025/NĐ-CP (Đ7), số tiếp nhận Phiếu công bố có giá trị 05 năm (Đ10, PL 01-MP).'
