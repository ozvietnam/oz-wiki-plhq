xac_minh:
  muc: NGUON_A
  pham_vi: 'số hiệu, tiêu đề, ngày ban hành 25/01/2011, hiệu lực 01/04/2011 (vanban.chinhphu.vn docid=99376); còn hiệu lực, chuỗi sửa đổi đối chiếu NGUYÊN VĂN đầu VBHN 09/VBHN-BYT (25/07/2025): NĐ 155/2018/NĐ-CP + TT 09/2015/TT-BYT + TT 29/2020/TT-BYT + TT 34/2025/TT-BYT'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Thông tư này quy định việc quản lý các sản phẩm mỹ phẩm sản xuất trong nước, mỹ phẩm nhập khẩu để lưu thông trong phạm vi lãnh thổ Việt Nam, bao gồm: công bố sản phẩm mỹ phẩm; hồ sơ thông tin sản phẩm; yêu cầu về an toàn sản phẩm; ghi nhãn mỹ phẩm; quảng cáo mỹ phẩm; xuất khẩu, nhập khẩu mỹ phẩm; lấy mẫu mỹ phẩm để kiểm tra chất lượng; kiểm tra, thanh tra và xử lý vi phạm;'
      trang_pdf: 2
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích thuật ngữ Trong Thông tư này các từ ngữ dưới đây được hiểu như sau: 1. Sản phẩm mỹ phẩm là một chất hay chế phẩm được sử dụng để tiếp xúc với những bộ phận bên ngoài cơ thể con người (da, hệ thống lông tóc, móng tay, móng chân, môi và cơ quan sinh dục ngoài) hoặc răng và niêm mạc miệng với mục đích chính là để làm sạch, làm thơm, thay đổi diện mạo, hình thức, điều chỉnh mùi cơ thể, bảo vệ cơ thể hoặc giữ cơ thể trong điều kiện'
      trang_pdf: 2
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 3
      noi_dung: Điều 3. Quy định về việc công bố sản phẩm mỹ phẩm 1. Các tổ chức, cá nhân chịu trách nhiệm đưa sản phẩm mỹ phẩm ra thị trường chỉ được phép đưa mỹ phẩm ra lưu thông khi đã được cơ quan quản lý nhà nước có thẩm quyền cấp số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm và phải hoàn toàn chịu trách nhiệm về tính an toàn, hiệu quả và chất lượng sản phẩm. Cơ quan nhà nước có thẩm quyền sẽ tiến hành kiểm tra hậu mại khi sản phẩm lưu thông trên thị trường.
      trang_pdf: 5
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 11
      noi_dung: Điều 11. Quy định chung về Hồ sơ thông tin sản phẩm mỹ phẩm Mỗi sản phẩm mỹ phẩm khi đưa ra lưu thông trên thị trường phải có Hồ sơ thông tin sản phẩm (PIF - Product Information File) theo hướng dẫn của ASEAN lưu giữ tại địa chỉ của tổ chức, cá nhân chịu trách nhiệm đưa sản phẩm ra thị trường.
      trang_pdf: 10
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 18
      noi_dung: Điều 18. Nội dung bắt buộc phải ghi trên nhãn 1. Nhãn sản phẩm mỹ phẩm phải phù hợp với yêu cầu ghi nhãn mỹ phẩm của ASEAN.
      trang_pdf: 13
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 25
      noi_dung: 'Điều 25. Hồ sơ đăng ký quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm 1. Hồ sơ đăng ký quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm bao gồm các tài liệu sau: a) Phiếu đăng ký quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm (Phụ lục số 10-MP); b) Bản sao Phiếu công bố sản phẩm mỹ phẩm đã được cấp (có đóng dấu của tổ chức, cá nhân đăng ký quảng cáo);'
      trang_pdf: 16
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 31
      noi_dung: 'Điều 31. Các trường hợp hết hiệu lực của nội dung quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm 1. Nội dung quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm hết giá trị trong các trường hợp sau: a) Mỹ phẩm có số đăng ký lưu hành, số Phiếu tiếp nhận bản công bố tiêu chuẩn chất lượng mỹ phẩm, số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm đã hết giá trị;'
      trang_pdf: 19
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 38
      noi_dung: Điều 38. Vận chuyển và bàn giao mẫu 1. Sau khi hoàn tất việc lấy mẫu, người lấy mẫu phải chuyển các mẫu đã lấy kèm biên bản lấy mẫu mỹ phẩm và bàn giao ngay cho cơ quan kiểm nghiệm. Trường hợp đặc biệt, mẫu có thể gửi đến cơ quan kiểm nghiệm qua đường bưu điện.
      trang_pdf: 23
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 45
      noi_dung: 'Điều 45. Đình chỉ lưu hành và thu hồi mỹ phẩm 1. Mỹ phẩm bị đình chỉ lưu hành và thu hồi khi xảy ra một trong các trường hợp sau: a) Mỹ phẩm lưu thông khi chưa được cơ quan quản lý nhà nước có thẩm quyền cấp số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm; b) Mỹ phẩm không đạt chất lượng, không an toàn cho người sử dụng; c) Mỹ phẩm lưu thông có công thức không đúng như hồ sơ đã công bố;'
      trang_pdf: 26
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
    - dieu: 53
      noi_dung: Điều 53. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01/4/2011. 2. Bãi bỏ Quyết định số 48/2007/QĐ-BYT ngày 31/12/2007 của Bộ trưởng Bộ Y tế về việc ban hành Quy chế quản lý mỹ phẩm, Quyết định số 40/2008/QĐ-BYT
      trang_pdf: 33
      sha256_pdf: 291578c5f4dea820235a38d44e93377cb1a6c8c11869288fde67c410db069b06
ghi_chu: 'Nền pháp lý mỹ phẩm; còn hiệu lực. Bị sửa bởi TT 09/2015 (quảng cáo), NĐ 155/2018 (điều kiện đầu tư), TT 29/2020, TT 34/2025 (HL 18/8/2025). Đọc bản hợp nhất 09/VBHN-BYT thay bản gốc. CẢNH BÁO NGUỒN: các nhắc "TT 64/2015/TT-BYT, 03/2022/TT-BYT sửa 06/2011" trên web là NHIỄU (64/2015 là TT-BTNMT; 03/2022 là chức danh nghề nghiệp) — đã loại khỏi sổ. Điểm nhập khẩu theo VBHN: CFS (Đ4, miễn theo điều kiện CPTPP/ASEAN), ký điện tử (Đ5), nộp Cổng DVC quốc gia theo NĐ 118/2025/NĐ-CP (Đ7), số tiếp nhận Phiếu công bố có giá trị 05 năm (Đ10, PL 01-MP).'
