  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/18/3.VB_19758.pdf, id=101031, SHA-256 dcfda6f0194602182da787e7759a2b21df8d5f5a483cc69c2d4df6a45e2d0e0c): Thông báo số 19758/TB-CHQ ngày 15-08-2025 của Cục Hải quan về sửa đổi, thay thế Thông báo kết quả xác định trước mã số số 18172/TB-CHQ ngày 07-08-2025; mặt hàng Khung điện thoại (ký mã hiệu CNC8; nhôm hợp kim Al balance, Si 0.5-0.8%, Fe<=0.2%, Cu 0.55-0.75%, Mn 0.1-0.2%, Mg 0.8-1.05%, Cr/Zn/Ti<=0.1%; kích thước 162.137 x 77.835 x 7.449 mm, trọng lượng 0.039 kg; bán thành phẩm giai đoạn gia công cuối cùng dùng cho điện thoại di động Samsung A56), phân loại vào nhóm 85.17, phân nhóm 8517.79, mã số 8517.79.21; lý do sửa đổi: xác định lại mã số hàng hóa; có hiệu lực kể từ ngày ban hành'
