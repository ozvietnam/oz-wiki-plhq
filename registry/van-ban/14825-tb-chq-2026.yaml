  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/3/VB_14825.pdf, id=103001, SHA-256 e8f38d302f7cf726e262a17dd1a6d03404a189ed0ebd4127f4e9b7cae52f2d82): Thông báo số 14825/TB-CHQ ngày 03-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chế phẩm diệt khuẩn, khử trùng Nipacide BIT 20 Plus (thành phần gồm Propylene Glycol CAS 57-55-6 30,0-50,0%, Glycerine CAS 56-81-5 10,0-30,0%, Nước CAS 7732-18-5 10,0-30,0%, 1,2-Benzisothiazol-3(2H)-one CAS 2634-33-5 10,0-25,0% và Sodium hydroxide CAS 1310-73-2 5,0-10,0%; hàm lượng Assay Nipacide BIT 19,0-21,0%, tỷ trọng ở 20°C 1,1000-1,2400, pH 10% 10,0-13,5; dạng lỏng, đóng gói 25,00 kg/thùng, không đóng gói dạng bình xịt; dùng làm chất bảo quản kháng khuẩn trong sản xuất và lưu kho nước giặt, nước xả vải), phân loại vào nhóm 38.08, phân nhóm 3808.94, mã số 3808.94.90; có hiệu lực kể từ ngày ban hành'
