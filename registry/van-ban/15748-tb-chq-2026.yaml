ghi_chu: 'Xác định trước mã số mặt hàng Chất tẩy rửa gốc nước TEXMO WATER-BASED CLEANERS / Chất tẩy rửa Q-1 (ký, mã hiệu TEXMO Q-1; gồm Surfactant CAS 126-66-9 17,5%, chất ức chế ăn mòn kim loại CAS 2492-26-4 0,5%, chất bảo quản kiềm CAS 2799-17-9 10%, nước CAS 7732-18-5 72%; dạng lỏng, đóng gói 18 lít/thùng, dùng làm sạch dầu mỡ và cặn bám trên bề mặt kim loại, máy móc) thuộc nhóm 34.02, phân nhóm 3402.90, mã số 3402.90.12.'
