  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/29/4.VB_15748.pdf, id=103436, SHA-256 e23fc2471377694e9bc402a1213c02a04c185b2d0bd28edb613ddda6ae3a087f): Thông báo số 15748/TB-CHQ ngày 28-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chất tẩy rửa gốc nước TEXMO WATER-BASED CLEANERS / Chất tẩy rửa Q-1 (ký, mã hiệu TEXMO Q-1; thành phần theo trọng lượng gồm chất hoạt động bề mặt Surfactant CAS 126-66-9 17,5%, chất ức chế ăn mòn kim loại CAS 2492-26-4 0,5%, chất bảo quản kiềm CAS 2799-17-9 10%, nước CAS 7732-18-5 72%; dạng chất lỏng, tỷ trọng 1,03 ở 20 °C, độ pH 9,0-11,3, sức căng bề mặt trung bình của dung dịch nước 5% ở 25 °C là 28,2 mN/m, đóng gói 18 lít/thùng; dùng làm sạch dầu mỡ, bụi bẩn và cặn bám trên bề mặt kim loại, máy móc và thiết bị công nghiệp), phân loại vào nhóm 34.02, phân nhóm 3402.90, mã số 3402.90.12; có hiệu lực kể từ ngày ban hành'
