xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo (id=25118) và cạnh ngược trong sổ: Thông tư 20/2017/TT-BNNPTNT ban hành 10-11-2017 hướng dẫn thực hiện một số nội dung của Nghị định 39/2017/NĐ-CP về quản lý thức ăn chăn nuôi, thủy sản; đã được sửa đổi, bổ sung một số điều từ ngày 01-01-2019 bởi Thông tư 34/2018/TT-BNNPTNT; đối chiếu không có cạnh thay thế hoặc bãi bỏ toàn bộ trong sổ'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này hướng dẫn thực hiện một số nội dung của Nghị định số 39/2017/NĐ-CP ngày 04/4/2017 của Chính phủ về quản lý thức ăn chăn nuôi, thủy sản (sau đây gọi chung là Nghị định số 39/2017/NĐ-CP).
      trang_pdf: 1
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với tổ chức, cá nhân trong nước và nước ngoài có hoạt động liên quan đến thức ăn chăn nuôi, thủy sản trên lãnh thổ Việt Nam. Chương II NỘI DUNG HƯỚNG DẪN
      trang_pdf: 1
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 3
      noi_dung: 1. Chất chính trong thức ăn hỗn hợp hoàn chỉnh và thức ăn đậm đặc cho gia súc, gia cầm và thủy sản, thức ăn tinh cho gia súc ăn cỏ là protein thô và lysine tổng số. 2. Chất chính trong thức ăn hỗn hợp hoàn chỉnh cho động vật cảnh là protein thô.
      trang_pdf: 2
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 5
      noi_dung: Điều 5. Sử dụng thuốc thú y có thành phần kháng sinh trong thức ăn chăn nuôi gia súc, gia cầm 1. Thuốc thú y được sử dụng trộn vào thức ăn chăn nuôi nhằm mục đích phòng bệnh, trị bệnh cho gia súc, gia cầm phải có tên trong danh mục thuốc thú y được phép lưu hành tại Việt Nam hoặc được Cơ quan thẩm quyền cho phép để phòng bệnh, trị bệnh cho gia súc, gia cầm.
      trang_pdf: 3
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 6
      noi_dung: Điều 6. Quy trình thẩm định chỉ định tổ chức chứng nhận sự phù hợp thức ăn chăn nuôi, thủy sản xuất khẩu, nhập khẩu 1. Trong thời gian không quá 15 ngày làm việc kể từ khi nhận được hồ sơ hợp lệ quy định tại Khoản 2 Điều 17 Nghị định số 39/2017/NĐ-CP, Tổng cục Thủy sản, Cục Chăn nuôi tiến hành thành lập đoàn đánh giá năng lực của tổ chức đăng ký thông qua việc thẩm định hồ sơ, đánh giá năng lực thực tế tại cơ sở (nếu cần), đánh giá quy trình
      trang_pdf: 4
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 7
      noi_dung: 'Điều 7. Căn cứ kiểm tra chất lượng, độ dao động cho phép trong kiểm tra chất lượng thức ăn chăn nuôi, thủy sản 1. Căn cứ kiểm tra chất lượng thức ăn chăn nuôi, thủy sản a) Tiêu chuẩn công bố áp dụng: Các nội dung bắt buộc phải có trong tiêu chuẩn công bố áp dụng của sản phẩm thức ăn chăn nuôi, thủy sản được quy định tại Phụ lục 1 ban hành kèm theo Thông tư này.'
      trang_pdf: 5
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 8
      noi_dung: Điều 8. Thử nghiệm chất lượng thức ăn chăn nuôi, thủy sản 1. Việc thử nghiệm thức ăn chăn nuôi, thủy sản theo yêu cầu quản lý nhà nước phải được thực hiện tại phòng thử nghiệm và theo phương pháp thử được Bộ Nông nghiệp và Phát triên nông thôn hoặc Tổng cục Thủy sản, Cục Chăn nuôi, Cục Quản lý chất lượng Nông Lâm sản và Thủy sản chỉ định.
      trang_pdf: 5
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 9
      noi_dung: Điều 9. Xử lý kết quả kiểm tra chất lượng thức ăn chăn nuôi, thủy sản 1. Đối với thức ăn chăn nuôi, thủy sản lưu thông trong nước Khi kết quả kiểm tra chất lượng không đạt yêu cầu, cơ quan kiểm tra thông báo cho cơ sở được kiểm tra kết quả kiểm tra bằng văn bản qua bưu điện, fax hoặc thư điện tử.
      trang_pdf: 6
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 10
      noi_dung: 'Điều 10. Cấp giấy xác nhận chất lượng và giám sát lô hàng đối với thức ăn chăn nuôi, thủy sản nhập khẩu 1. Cấp giấy xác nhận chất lượng a) Đối với lô hàng thức ăn chăn nuôi, thủy sản được áp dụng chế độ kiểm tra thông thường, chế độ kiểm tra chặt: Cơ quan kiểm tra cấp giấy xác nhận chất lượng cho lô hàng thức ăn chăn nuôi, thủy sản có kết quả kiểm tra đạt yêu cầu trong thời hạn không quá 02 ngày làm việc kể từ ngày có kết quả thử nghiệm;'
      trang_pdf: 7
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
    - dieu: 12
      noi_dung: Điều 12. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 25 tháng 12 năm 2017. 2. Thông tư này thay thế Thông tư số 66/2011/TT-BNNPTNT ngày 10/10/2011 của Bộ Nông nghiệp và Phát triển nông thôn quy định chi tiết một số điều Nghị định số 08/2010/NĐ-CP ngày 05/02/2010 của Chính phủ về quản lý thức ăn chăn nuôi, Thông tư số 81/2011/TT-BNNPTNT ngày 01/12/2011, Thông tư số 50/2014/ TT-BNNPTNT ngày 24/12/2014, Thông tư số
      trang_pdf: 8
      sha256_pdf: c923cafb44781588004d2b95f5e899918cb4e98c0d7c067b7465e36a8ca43239
