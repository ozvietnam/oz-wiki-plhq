  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/29/1.VB_18154.pdf, id=104916, SHA-256 179e8f56a2595d94fd9bb19569cbeedcc9681b51f7902f3df35b06c05becce3b): Thông báo số 18154/TB-CHQ ngày 26-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ linh kiện đồng bộ dùng để sản xuất bình chữa cháy khí CO2 MT3 (3 kg) / CO2 Fire Extinguisher MT3 Assembly Kit (ký mã hiệu CKD-MT3; bình chữa cháy khí CO2 MT3 bán thành phẩm ở dạng chưa lắp ráp, tháo rời, cấu tạo gồm 04 chi tiết: 01 vỏ bình chữa cháy CO2 bằng thép chịu áp lực dung tích danh định 4,5 lít có cụm van chữa cháy bằng hợp kim đồng và thép không gỉ được cuốn băng tan PTFE và ống siphon siết cố định, 01 chốt cài an toàn bằng thép mạ kẽm, 01 khóa niêm phong bằng nhựa, 01 loa phun CO2 bằng nhựa kỹ thuật chịu lạnh; nhập khẩu để lắp ráp, nạp khí CO2 3 kg và dán tem nhãn thành bình chữa cháy CO2 hoàn chỉnh công suất 34B, C), phân loại vào nhóm 84.24, phân nhóm 8424.10, mã số 8424.10.90; có hiệu lực kể từ ngày ban hành'
