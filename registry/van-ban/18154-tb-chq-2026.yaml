ghi_chu: 'Xác định trước mã số mặt hàng Bộ linh kiện đồng bộ dùng để sản xuất bình chữa cháy khí CO2 MT3 (3 kg) ở dạng chưa lắp ráp, tháo rời (ký hiệu CKD-MT3; gồm vỏ bình thép chịu áp lực 4,5 lít gắn cụm van và ống siphon, chốt cài an toàn, khóa niêm phong, loa phun CO2) thuộc nhóm 84.24, phân nhóm 8424.10, mã số 8424.10.90.'
