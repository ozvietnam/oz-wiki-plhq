xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF Công báo số 1139+1140 ngày 10-12-2020 có lớp chữ (raw/download/congbaocdn.chinhphu.vn/137-2020-nd-cp.pdf, 25 trang, SHA-256 b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13), thẻ vanban.chinhphu.vn (docid=201733) và toàn văn PDF ký số (137.signed.pdf): ban hành 27-11-2020, có hiệu lực từ 11-01-2021 (thay thế Nghị định 36/2009/NĐ-CP), trích nguyên văn các điều khoản về phân loại pháo nổ, pháo hoa nổ, pháo hoa, điều kiện và thủ tục cấp giấy phép xuất khẩu, nhập khẩu, vận chuyển pháo hoa nổ, pháo hoa, thuốc pháo, thẩm quyền ban hành danh mục mã số HS các loại pháo và kiểm soát hải quan tại cửa khẩu; đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 56/2023/NĐ-CP).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định về quản lý, sử dụng pháo, thuốc pháo; nguyên tắc, trách nhiệm của cơ quan, tổ chức, cá nhân trong quản lý, sử dụng pháo, thuốc pháo nhằm bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội, bảo vệ quyền con người, quyền công dân và phục vụ phát triển kinh tế - xã hội.'
      trang_pdf: 1
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 2
      noi_dung: 'Nghị định này áp dụng đối với cơ quan, tổ chức, doanh nghiệp, cá nhân liên quan đến quản lý, sử dụng pháo, thuốc pháo.'
      trang_pdf: 1
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 3
      noi_dung: 'Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Pháo là sản phẩm có chứa thuốc pháo, khi có tác động của xung kích thích cơ, nhiệt, hóa hoặc điện gây ra phản ứng hóa học nhanh, mạnh, sinh khí, tạo ra hiệu ứng âm thanh, ánh sáng, màu sắc trong không gian, gây ra tiếng nổ hoặc không gây ra tiếng nổ. Pháo bao gồm: Pháo nổ, pháo hoa. a) Pháo nổ là sản phẩm được chế tạo, sản xuất thủ công hoặc công nghiệp, khi có tác động của xung kích thích cơ, nhiệt, hóa hoặc điện gây ra tiếng nổ hoặc gây ra tiếng rít, tiếng nổ và hiệu ứng màu sắc trong không gian; Pháo nổ gây ra tiếng rít, tiếng nổ và hiệu ứng màu sắc trong không gian được gọi là pháo hoa nổ; Pháo hoa nổ tầm thấp là quả pháo có đường kính không lớn hơn 90 mm hoặc tầm bắn không vượt quá 120 m. Pháo hoa nổ tầm cao là quả pháo có đường kính trên 90 mm hoặc tầm bắn trên 120 m; b) Pháo hoa là sản phẩm được chế tạo, sản xuất thủ công hoặc công nghiệp, khi có tác động của xung kích thích cơ, nhiệt, hóa hoặc điện tạo ra các hiệu ứng âm thanh, ánh sáng, màu sắc trong không gian, không gây ra tiếng nổ. 2. Thuốc pháo, bao gồm: a) Thuốc pháo nổ là sản phẩm trực tiếp dùng để sản xuất pháo nổ, dưới tác động của xung kích thích cơ, nhiệt, hóa hoặc điện tạo ra phản ứng hóa học nhanh, mạnh, tỏa nhiệt, sinh khí và tạo ra áp suất lớn gây ra tiếng nổ; b) Thuốc pháo hoa là sản phẩm trực tiếp dùng để sản xuất pháo hoa, dưới tác động của xung kích thích cơ, nhiệt, hóa hoặc điện tạo ra phản ứng hóa học nhanh, mạnh, tỏa nhiệt, sinh khí và hiệu ứng ánh sáng màu sắc nhưng không gây ra tiếng nổ. 3. Bắn pháo hoa nổ tầm thấp là việc sử dụng thiết bị kỹ thuật chuyên dụng để đẩy quả pháo hoa nổ lên độ cao không vượt quá 120 m. Ban pháo hoa nổ tầm cao là việc sử dụng ống phóng chuyên dụng và thiết bị bắn để đẩy quả pháo hoa nổ lên độ cao trên 120 m.'
      trang_pdf: 2
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 4
      noi_dung: '1. Tuân thủ Hiến pháp và pháp luật của nước Cộng hòa xã hội chủ nghĩa Việt Nam. 2. Việc quản lý, sử dụng pháo hoa, pháo hoa nổ, thuốc pháo phải bảo đảm đúng mục đích, đúng quy định và bảo đảm an toàn, bảo vệ môi trường. 3. Người quản lý, sử dụng pháo hoa, pháo hoa nổ, thuốc pháo phải bảo đảm đủ điều kiện theo quy định. 4. Pháo hoa, pháo hoa nổ, thuốc pháo và các loại giấy phép bị mất, hư hỏng phải kịp thời báo cáo cơ quan quản lý có thẩm quyền. 5. Pháo hoa, pháo hoa nổ, thuốc pháo khi không còn nhu cầu, hết hạn sử dụng, không còn khả năng sử dụng phải được tiêu hủy theo quy định. 6. Việc tiêu hủy pháo, thuốc pháo phải bảo đảm đúng trình tự, an toàn, bảo vệ môi trường và theo quy định của pháp luật.'
      trang_pdf: 3
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 5
      noi_dung: '1. Nghiên cứu, chế tạo, sản xuất, mua bán, xuất khẩu, nhập khẩu, tàng trữ, vận chuyển, sử dụng hoặc chiếm đoạt pháo nổ; trừ trường hợp tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được Thủ tướng Chính phủ giao nhiệm vụ nghiên cứu, sản xuất, nhập khẩu, xuất khẩu, cung cấp, vận chuyển, sử dụng pháo hoa nổ theo quy định tại Nghị định này. 2. Nghiên cứu, chế tạo, sản xuất, mua bán, xuất khẩu, nhập khẩu, tàng trữ, vận chuyển, sử dụng trái phép pháo hoa, thuốc pháo. 3. Mang pháo, thuốc pháo trái phép vào, ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam hoặc vào nơi cấm, khu vực cấm, khu vực bảo vệ và mục tiêu bảo vệ. 4. Lợi dụng, lạm dụng việc sử dụng pháo để xâm phạm an ninh quốc gia, trật tự, an toàn xã hội, tính mạng, sức khỏe, tài sản, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân. 5. Trao đổi, tặng, cho, gửi, mượn, cho mượn, thuê, cho thuê, cầm cố pháo hoa nổ hoặc thuốc pháo để sản xuất pháo trái phép; vận chuyển, bảo quản, tiêu hủy pháo không bảo đảm an toàn hoặc làm ảnh hưởng đến môi trường. 6. Chiếm đoạt, mua, bán, trao đổi, tặng, cho, mượn, cho mượn, thuê, cho thuê, cầm cố, làm giả, sửa chữa, tẩy xóa các loại giấy phép về pháo. 7. Giao pháo hoa nổ, thuốc pháo cho cơ quan, tổ chức, cá nhân không đủ điều kiện theo quy định. 8. Hướng dẫn, huấn luyện, tổ chức huấn luyện cách thức chế tạo, sản xuất, sử dụng trái phép pháo dưới mọi hình thức. 9. Cố ý cung cấp thông tin sai lệch về quản lý, bảo quản pháo, thuốc pháo; không báo cáo hoặc báo cáo không kịp thời, che giấu hoặc làm sai lệch thông tin về việc mất, thất thoát, tai nạn, sự cố về pháo, thuốc pháo.'
      trang_pdf: 4
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 9
      noi_dung: '1. Pháo hoa, pháo hoa nổ được sử dụng theo quy định tại Điều 11 và Điều 17 Nghị định này. 2. Các cơ quan, tổ chức sử dụng pháo hoa nổ để biểu diễn, thi đấu phải được Thủ tướng Chính phủ cho phép và do tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được giao nhiệm vụ sản xuất, cung cấp.'
      trang_pdf: 6
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 10
      noi_dung: '1. Việc nghiên cứu, sản xuất, cung cấp pháo hoa nổ theo đơn đặt hàng của các cơ quan nhà nước phải bảo đảm quy định của pháp luật về an ninh, trật tự, phòng cháy, chữa cháy, bảo vệ môi trường; có nội quy, phương án bảo vệ; bảo đảm nguồn lực, trang thiết bị đáp ứng khả năng phòng ngừa và ứng phó sự cố môi trường; địa điểm nghiên cứu, sản xuất và kho bảo quản phải bảo đảm khoảng cách an toàn đối với khu dân cư, công trình công cộng, văn hóa, xã hội, lịch sử, khu vực bảo vệ, nơi cấm, khu vực cấm; người quản lý và người lao động trực tiếp tham gia nghiên cứu, sản xuất phải được huấn luyện về kỹ thuật an toàn, phòng cháy, chữa cháy, phòng ngừa, ứng phó sự cố, bảo đảm an toàn, vệ sinh lao động trong quá trình nghiên cứu, sản xuất. 2. Thủ tướng Chính phủ quyết định tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được phép nghiên cứu, sản xuất, xuất khẩu, nhập khẩu, cung cấp pháo hoa nổ theo đơn đặt hàng của cơ quan nhà nước và đề nghị của Bộ trưởng Bộ Quốc phòng. Việc cung cấp cho các cơ quan, tổ chức được phép sử dụng pháo hoa nổ chỉ được thực hiện trong các trường hợp quy định tại Điều 11 Nghị định này. 3. Việc nghiên cứu, sản xuất pháo hoa nổ theo đơn đặt hàng của các cơ quan nhà nước được thực hiện theo Nghị định số 32/2019/NĐ-CP ngày 10 tháng 4 năm 2019 của Chính phủ quy định giao nhiệm vụ, đặt hàng hoặc đấu thầu cung cấp sản phẩm, dịch vụ công sử dụng ngân sách nhà nước từ nguồn kinh phí chi thường xuyên. 4. Hồ sơ đề nghị cấp giấy phép xuất khẩu, nhập khẩu bao gồm: Văn bản đề nghị, trong đó nêu cụ thể chủng loại, số lượng pháo hoa nổ, thuốc pháo nổ và thiết bị, phụ kiện bắn pháo hoa nổ, phương tiện vận chuyển; bản sao quyết định thành lập hoặc bản sao giấy chứng nhận đăng ký doanh nghiệp; giấy giới thiệu kèm theo bản sao một trong các loại giấy tờ sau: Căn cước công dân, Chứng minh nhân dân, Hộ chiếu hoặc Chứng minh quân nhân của người đến liên hệ. Hồ sơ đề nghị lập thành 01 bộ, nộp tại Cục Cảnh sát quản lý hành chính về trật tự xã hội, Bộ Công an; trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ, Cục Cảnh sát quản lý hành chính về trật tự xã hội, Bộ Công an có trách nhiệm cấp giấy phép xuất khẩu, nhập khẩu theo mẫu quy định tại Phụ lục I ban hành kèm theo Nghị định này; truờng hợp không cấp, phải trả lời bằng văn bản và nêu rõ lý do. Giấy phép xuất khẩu, nhập khẩu có thời hạn 60 ngày.'
      trang_pdf: 7
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 13
      noi_dung: '1. Tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được Thủ tướng Chính phủ giao nhiệm vụ nghiên cứu, sản xuất, nhập khẩu, xuất khẩu, cung cấp pháo hoa nổ thì được phép vận chuyển pháo hoa nổ, thuốc pháo nổ. 2. Việc vận chuyển pháo hoa nổ, thuốc pháo nổ thực hiện theo quy định sau đây: a) Phải có giấy phép vận chuyển hoặc mệnh lệnh vận chuyển của cơ quan có thẩm quyền; b) Người và phương tiện chuyên dùng vận chuyển pháo hoa nổ, thuốc pháo nổ phải đáp ứng yêu cầu về vận chuyển vật liệu nổ công nghiệp theo quy định; c) Sử dụng phương tiện chuyên dùng bảo đảm điều kiện vận chuyển pháo hoa nổ, thuốc pháo nổ và bảo đảm an toàn, phòng cháy và chữa cháy, bảo vệ môi trường; d) Không được chở pháo hoa nổ, thuốc pháo nổ, phụ kiện bắn pháo hoa nổ và người trên cùng một phương tiện, trừ người có trách nhiệm trong việc vận chuyển; đ) Không dừng, đỗ phương tiện vận chuyển pháo hoa nổ, thuốc pháo nổ ở nơi đông người, khu vực dân cư, gần trạm xăng dầu, nơi có công trình quan trọng về quốc phòng, an ninh, kinh tế, văn hóa, ngoại giao. Trường hợp cần nghỉ qua đêm hoặc do sự cố phải thông báo ngay cho cơ quan Quân sự, cơ quan Công an nơi gần nhất để phối hợp bảo vệ khi cần thiết và có phương án bảo đảm an toàn, phòng chống cháy nổ, hư hỏng, mất. 3. Việc vận chuyển pháo hoa nổ, thuốc pháo nổ của các tổ chức, doanh nghiệp thuộc Bộ Quốc phòng sản xuất, cung cấp phục vụ bắn pháo hoa nổ theo quy định tại Điều 11 Nghị định này. Hồ sơ, thủ tục gồm: a) Hồ sơ đề nghị, gồm: Văn bản đề nghị nêu rõ lý do, số lượng, chủng loại pháo hoa nổ, thuốc pháo nổ cần vận chuyển, nơi đi, nơi đến, thời gian và tuyến đường vận chuyển, họ và tên, địa chỉ của người chịu trách nhiệm vận chuyển, người điều khiển phương tiện, biển kiểm soát của phương tiện; đơn đặt hàng của cơ quan nhà nước hoặc giấy phép xuất khẩu, nhập khẩu của cơ quan có thẩm quyền; giấy giới thiệu kèm theo bản sao một trong các loại giấy tờ sau: Căn cước công dân, Chứng minh nhân dân, Hộ chiếu hoặc Chứng minh quân nhân của người đến liên hệ. Trường hợp vận chuyển pháo hoa nổ quy định tại khoản 7 và khoản 8 Điều 11 Nghị định này thì hồ sơ phải có thêm văn bản đồng ý của Thủ tướng Chính phủ; b) Hồ sơ quy định tại điểm a khoản này lập thành 01 bộ và nộp tại Bộ Tổng tham mưu Quân đội nhân dân Việt Nam; c) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ, Bộ Tổng tham mưu Quân đội nhân dân Việt Nam cấp giấy phép vận chuyển theo mẫu quy định tại Phụ lục IV ban hành kèm theo Nghị định này; trường hợp không cấp phải trả lời bằng văn bản và nêu rõ lý do. Giấy phép vận chuyển chỉ có giá trị cho một lượt vận chuyển; trong thời hạn 07 ngày kể từ ngày hoàn tất việc vận chuyển, phải nộp lại cho cơ quan đã cấp giấy phép.'
      trang_pdf: 10
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 14
      noi_dung: '1. Việc nghiên cứu, sản xuất pháo hoa, thuốc pháo hoa do tổ chức, doanh nghiệp thuộc Bộ Quốc phòng thực hiện và phải bảo đảm các điều kiện sau đây: a) Tổ chức, doanh nghiệp được Bộ trưởng Bộ Quốc phòng giao nhiệm vụ nghiên cứu, sản xuất pháo hoa, thuốc pháo hoa; b) Phải được cơ quan Công an có thẩm quyền cấp Giấy chứng nhận đủ điều kiện về an ninh, trật tự; bảo đảm các điều kiện về phòng cháy, chữa cháy, phòng ngừa, ứng phó sự cố và bảo vệ môi trường; c) Có nội quy ra, vào tổ chức, doanh nghiệp, phương án bảo đảm an ninh, trật tự; kiểm soát phương tiện, đồ vật, hàng hóa được vận chuyển ra, vào tổ chức, doanh nghiệp; tổ chức lực lượng bảo vệ 24/24 giờ; d) Có nội quy, trang bị đầy đủ phương tiện, tổ chức lực lượng, kiểm tra an toàn phòng cháy, chữa cháy, phương án chữa cháy, cứu nạn, cứu hộ; tổ chức diễn tập phương án ứng phó sự cố cháy, nổ và các biện pháp bảo đảm an toàn phòng cháy, chữa cháy theo quy định; đ) Thực hiện các biện pháp giảm thiểu, thu gom, xử lý nguyên liệu, phế thải và xử lý ô nhiễm môi trường tại chỗ; không để rò rỉ, phát tán độc hại ra môi trường; bảo đảm nguồn lực, trang thiết bị đáp ứng khả năng phòng ngừa và ứng phó sự cố môi trường; e) Địa điểm nghiên cứu, sản xuất và kho bảo quản phải bảo đảm khoảng cách an toàn đối với khu dân cư, công trình công cộng, văn hóa, xã hội, lịch sử, khu vực bảo vệ, nơi cấm, khu vực cấm; g) Phải có phương tiện, thiết bị phù hợp để kiểm tra, giám sát các thông số kỹ thuật và phục vụ công tác kiểm tra chất lượng sản phẩm trong quá trình nghiên cứu, sản xuất; có nơi thử nghiệm riêng biệt; h) Sản phẩm phải bảo đảm chất lượng, tiêu chuẩn, quy chuẩn kỹ thuật; sản phẩm phải có nhãn hiệu, nước sản xuất, năm sản xuất, hạn sử dụng; i) Người quản lý và người lao động trực tiếp tham gia nghiên cứu, sản xuất phải được huấn luyện về kỹ thuật an toàn. 2. Việc kinh doanh pháo hoa phải bảo đảm các điều kiện sau đây: a) Chỉ tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được kinh doanh pháo hoa và phải được cơ quan Công an có thẩm quyền cấp Giấy chứng nhận đủ điều kiện về an ninh, trật tự; bảo đảm các điều kiện về phòng cháy, chữa cháy, phòng ngừa, ứng phó sự cố và bảo vệ môi trường; b) Kho, phương tiện vận chuyển, thiết bị, dụng cụ phục vụ kinh doanh pháo hoa phải phù hợp, bảo đảm điều kiện về bảo quản, vận chuyển, phòng cháy và chữa cháy; c) Người quản lý, người phục vụ có liên quan đến kinh doanh pháo hoa phải được huấn luyện về kỹ thuật an toàn; d) Chỉ được kinh doanh pháo hoa bảo đảm tiêu chuẩn, quy chuẩn kỹ thuật theo quy định. 3. Việc xuất khẩu, nhập khẩu pháo hoa, thuốc pháo hoa phải bảo đảm các điều kiện sau đây: a) Tổ chức, doanh nghiệp thuộc Bộ Quốc phòng được phép nghiên cứu, sản xuất pháo hoa, thuốc pháo hoa thì được xuất khẩu, nhập khẩu pháo hoa, thuốc pháo hoa; b) Pháo hoa xuất khẩu, nhập khẩu phải bảo đảm tiêu chuẩn, quy chuẩn kỹ thuật; chủng loại, nhãn hiệu, số hiệu, ký hiệu, nước sản xuất, năm sản xuất, hạn sử dụng trên từng loại pháo hoa.'
      trang_pdf: 12
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 15
      khoan: 1
      noi_dung: '1. Hồ sơ đề nghị bao gồm: Văn bản đề nghị, trong đó nêu cụ thể chủng loại, số lượng pháo hoa, thuốc pháo hoa, phương tiện vận chuyển; bản sao quyết định thành lập hoặc bản sao giấy chứng nhận đăng ký doanh nghiệp; giấy giới thiệu kèm theo bản sao một trong các loại giấy tờ sau: Căn cước công dân, Chứng minh nhân dân, Hộ chiếu hoặc Chứng minh quân nhân của người đến liên hệ.'
      trang_pdf: 12
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 17
      noi_dung: '1. Cơ quan, tổ chức, cá nhân có năng lực hành vi dân sự đầy đủ được sử dụng pháo hoa trong các trường hợp sau: Lễ, tết, sinh nhật, cưới hỏi, hội nghị, khai trương, ngày kỷ niệm và trong hoạt động văn hóa, nghệ thuật. 2. Cơ quan, tổ chức, cá nhân khi sử dụng pháo hoa chỉ được mua pháo hoa tại các tổ chức, doanh nghiệp được phép sản xuất, kinh doanh pháo hoa.'
      trang_pdf: 14
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 19
      khoan: 2
      noi_dung: '2. Việc sản xuất, kinh doanh, xuất khẩu, nhập khẩu pháo hoa, pháo hoa nổ, thuốc pháo phải bảo đảm tiêu chuẩn, quy chuẩn kỹ thuật, chủng loại, nhãn hiệu, nước sản xuất, năm sản xuất, hạn sử dụng.'
      trang_pdf: 17
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 20
      noi_dung: '1. Giúp Chính phủ thực hiện thống nhất quản lý nhà nước về pháo trong lĩnh vực bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội, đấu tranh phòng, chống tội phạm. 2. Thực hiện chức năng quản lý nhà nước về pháo theo quy định của Nghị định này và quy định khác của pháp luật có liên quan, bao gồm: a) Kiến nghị Chính phủ ban hành, sửa đổi, bổ sung hoặc ban hành theo thẩm quyền các văn bản quy phạm pháp luật về quản lý, sử dụng pháo; b) Tổ chức tuyên truyền, phổ biến các văn bản quy phạm pháp luật về công tác quản lý, sử dụng pháo; vận động nhân dân giao nộp pháo; c) Tổ chức đăng ký và cấp giấy phép về pháo theo thẩm quyền; d) Phòng ngừa, đấu tranh với các hành vi vi phạm pháp luật về pháo; đ) Tổ chức thực hiện việc thu hồi, phân loại, bảo quản, thanh lý, tiêu hủy đối với pháo do cơ quan, tổ chức, doanh nghiệp thuộc phạm vi quản lý của Bộ Công an giao nộp; e) Kiểm tra việc quản lý, sử dụng pháo đối với các đối tượng thuộc phạm vi quản lý của Bộ Công an; g) Thống kê, tổng hợp tình hình, kết quả về công tác quản lý, sử dụng pháo theo thẩm quyền; h) Thực hiện kiểm tra, thanh tra, giải quyết khiếu nại, tố cáo; khen thưởng và xử lý vi phạm pháp luật về quản lý, sử dụng pháo; i) Bộ trưởng Bộ Công an ban hành danh mục pháo hoa, pháo hoa nổ; quy định danh mục chi tiết mã số HS các loại pháo. 3. Chủ trì, phối hợp với Bộ Quốc phòng, Bộ Công Thương xây dựng bộ quy chuẩn kỹ thuật an toàn trong nghiên cứu, sản xuất, kinh doanh, bảo quản, sử dụng và tiêu hủy pháo.'
      trang_pdf: 18
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 23
      noi_dung: '1. Bộ Công Thương có trách nhiệm chỉ đạo các lực lượng chức năng kiểm tra, kiểm soát, đấu tranh phòng ngừa, phát hiện, ngăn chặn, xử lý các hành vi sản xuất, mua, bán, vận chuyển, tàng trữ, nhập khẩu, xuất khẩu, sử dụng trái phép các loại pháo. 2. Bộ Tài chính có trách nhiệm chỉ đạo lực lượng Hải quan tiến hành kiểm soát chặt chẽ các cửa khẩu để ngăn chặn, xử lý các trường hợp nhập khẩu, xuất khẩu trái phép các loại pháo; bảo đảm kinh phí phục vụ cho việc tổ chức thực hiện Nghị định này. 3. Bộ Thông tin và Truyền thông có trách nhiệm chỉ đạo các cơ quan thông tin, truyền thông tuyên truyền, phổ biến các quy định của pháp luật về quản lý, sử dụng pháo; tuyên truyền, vận động nhân dân phát hiện, giao nộp pháo. 4. Bộ Giáo dục và Đào tạo, Bộ Lao động - Thương binh và Xã hội căn cứ chức năng, nhiệm vụ có trách nhiệm tuyên truyền, phổ biến các quy định của pháp luật về quản lý, sử dụng pháo trong hệ thống giáo dục. 5. Các bộ, ngành có liên quan trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm quy định cụ thể việc quản lý, sử dụng pháo; cung cấp số liệu phục vụ thống kê nhà nước và thực hiện các nhiệm vụ khác thuộc nội dung quản lý nhà nước về pháo. 6. Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị - xã hội tổ chức tuyên truyền, vận động nhân dân thực hiện đúng quy định của pháp luật về sử dụng pháo.'
      trang_pdf: 19
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 25
      noi_dung: 'Nghị định này có hiệu lực thi hành từ ngày 11 tháng 01 năm 2021, thay thế Nghị định số 36/2009/NĐ-CP ngày 15 tháng 4 năm 2009 của Chính phủ về quản lý, sử dụng pháo.'
      trang_pdf: 20
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
    - dieu: 26
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương và cơ quan, tổ chức, doanh nghiệp, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./.'
      trang_pdf: 20
      sha256_pdf: b79fe7c22c7071d7ca12af6534e4629d68a0f114b1d6e8ad26724b5055673c13
ghi_chu: Nghị định quản lý, sử dụng pháo — quy định điều kiện, thẩm quyền cấp phép xuất khẩu, nhập khẩu pháo hoa, pháo nổ và thuốc pháo.
