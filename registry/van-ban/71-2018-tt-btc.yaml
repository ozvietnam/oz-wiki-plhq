xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn Công báo số 1029+1030 ngày 10-11-2018 (31 trang có lớp chữ, SHA-256 796856a43b52...): ban hành ngày 10-08-2018, hiệu lực từ 01-11-2018; hết hiệu lực từ 18-05-2026 theo Thông tư 35/2026/TT-BTC ngày 31-03-2026'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Thông tư này quy định chế độ tiếp khách nước ngoài vào làm việc tại Việt Nam, chế độ chi tổ chức hội nghị, hội thảo quốc tế tại Việt Nam và chế độ tiếp khách trong nước của các cơ quan nhà nước, đơn vị sự nghiệp công lập, tổ chức chính trị, các tổ chức chính trị - xã hội, các tổ chức sử dụng kinh phí do ngân sách nhà nước hỗ trợ (sau đây gọi tắt là cơ quan, đơn vị).
      trang_pdf: 2
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ, cơ quan nhà nước khác ở trung ương (sau đây gọi tắt là cơ quan Trung ương). 2. Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương (sau đây gọi tắt là địa phương). 3. Tổ chức chính trị, các tổ chức chính trị - xã hội. 4. Cơ quan nhà nước, đơn vị sự nghiệp công lập. 5. Các tổ chức sử dụng kinh phí do ngân sách nhà nước hỗ trợ.
      trang_pdf: 2
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 3
      noi_dung: Điều 3. Nguồn kinh phí thực hiện chế độ tiếp khách nước ngoài làm việc tại Việt Nam, chế độ tổ chức hội nghị, hội thảo quốc tế tại Việt Nam và chế độ tiếp khách trong nước 1. Ngân sách nhà nước. 2. Nguồn thu từ hoạt động sự nghiệp của đơn vị sự nghiệp công lập. 3. Các khoản đóng góp, ủng hộ, tài trợ của các tổ chức, doanh nghiệp, cá nhân trong và ngoài nước.
      trang_pdf: 2
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 8
      noi_dung: 'Điều 8. Tiêu chuẩn ăn hàng ngày (bao gồm 2 bữa trưa, tối) 1. Mức chi ăn hàng ngày quy định tại Điều này đã bao gồm tiền đồ uống (khuyến khích sử dụng đồ uống sản xuất tại Việt Nam); cụ thể: a) Khách hạng đặc biệt: Thủ trưởng cơ quan, đơn vị được giao nhiệm vụ đón tiếp phê duyệt trong chương trình, đề án đón đoàn; b) Đoàn là khách hạng A: 1.500.000 đồng/ngày/người; c) Đoàn là khách hạng B: 1.000.000 đồng/ngày/người;'
      trang_pdf: 5
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 13
      noi_dung: 'Điều 13. Chế độ, tiêu chuẩn chi khi đưa đoàn khách nước ngoài đi công tác địa phương và cơ sở 1. Trường hợp cần thiết phải đưa khách đi thăm, làm việc tại các địa phương hoặc cơ sở theo chương trình, kế hoạch đã được cấp có thẩm quyền quyết định thì tiêu chuẩn đón tiếp như sau: a) Cơ quan, đơn vị chủ trì đón tiếp khách chịu trách nhiệm chi toàn bộ chi phí đưa đón khách từ nơi ở chính tới địa phương, cơ sở và chi phí ăn, nghỉ cho khách trong'
      trang_pdf: 9
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 17
      noi_dung: 'Điều 17. Chế độ tiếp các đại sứ, trưởng đại diện các tổ chức quốc tế khi kết thúc nhiệm kỳ công tác tại Việt Nam Cơ quan, đơn vị được tổ chức mời cơm thân mật khi chia tay đại sứ, trưởng đại diện các tổ chức quốc tế khi kết thúc nhiệm kỳ công tác tại Việt Nam, mức chi: 1.000.000 đồng/người bao gồm cả đại diện phía Việt Nam, mức chi này bao gồm cả tiền đồ uống (khuyến khích sử dụng đồ uống sản xuất tại Việt Nam);'
      trang_pdf: 11
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 21
      noi_dung: 'Điều 21. Chi tổ chức hội nghị cấp Bộ trưởng 1. Đối với đại biểu và các đoàn khách dự các hội nghị cấp Bộ trưởng a) Đối tượng được Việt Nam đài thọ:'
      trang_pdf: 13
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 25
      noi_dung: Điều 25. Nội dung và mức chi đặc thù của các hội nghị quốc tế tổ chức theo hình thức luân phiên 1. Nội dung chi Ngoài những nội dung chi quy định tại Thông tư này, trường hợp phát sinh các nội dung chi khác theo thông lệ của các hội nghị quốc tế tổ chức theo hình thức luân phiên, thì thực hiện theo thông lệ của các hội nghị quốc tế này.
      trang_pdf: 20
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 30
      noi_dung: 'Điều 30. Chi giải khát Chi giải khát, mức chi: 30.000 đồng/buổi (nửa ngày)/người.'
      trang_pdf: 23
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
    - dieu: 35
      noi_dung: Điều 35. Hiệu lực thi hành 1. Thông tư này có hiệu lực kể từ ngày 01 tháng 11 năm 2018. 2. Bãi bỏ Thông tư số 01/2010/TT-BTC ngày 06/01/2010 của Bộ Tài chính quy định chế độ chi tiêu đón tiếp khách nước ngoài vào làm việc tại Việt Nam, chi tiêu tổ chức các hội nghị, hội thảo quốc tế tại Việt Nam và chi tiêu tiếp khách trong nước.
      trang_pdf: 28
      sha256_pdf: 796856a43b5211433d21f15f765229de3dc925090002afaca740f376f8bf4b21
ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #416). Đã hết hiệu lực từ 18-05-2026 (thay bởi TT 35/2026/TT-BTC).'
