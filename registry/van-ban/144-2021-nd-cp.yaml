  pham_vi: 'Đã đối chiếu trực tiếp vanban.chinhphu.vn (docid 204979) và toàn văn NĐ 282/2025/NĐ-CP (docid 215770): số hiệu, tên nguyên văn, cơ quan Chính phủ (ký Phạm Bình Minh), ngày ban hành 31/12/2021, ngày hiệu lực 01/01/2022; hết hiệu lực từ 15/12/2025 do bị NĐ 282/2025/NĐ-CP (30/10/2025) thay thế toàn bộ theo Điều 69 NĐ 282/2025/NĐ-CP. Lưu ý phân biệt: NĐ 144/2021/NĐ-CP thứ hai (cùng số, đăng ký doanh nghiệp) bị thay bởi NĐ 168/2025/NĐ-CP — không phải văn bản này.'
