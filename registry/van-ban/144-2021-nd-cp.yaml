ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: Điều 22 xử phạt vận chuyển, tàng trữ, mua bán, tiêu thụ hàng cấm, hàng hóa nhập lậu, hàng giả chưa đến mức truy cứu TNHS — chế tài hay dùng cho hàng XNK lậu lưu thông nội địa (thay cho NĐ 167/2013 khi ban hành). Bị thay thế bởi NĐ 282/2025/NĐ-CP từ 15/12/2025 (cạnh thay_the ghi ở 282-2025-nd-cp.yaml đúng chiều đi).'
