quan_he:
  thay_the:
    - so_hieu: 282/2025/NĐ-CP
      pham_vi: toàn bộ
      can_cu: 'TVPL (NĐ 282/2025/NĐ-CP ngày 30/10/2025 xử phạt VPHC lĩnh vực an ninh, trật tự, ATXH) và bài điểm mới của Công an Gia Lai: 282/2025 thay thế 144/2021, hiệu lực 01/01/2026.'
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: Điều 22 xử phạt vận chuyển, tàng trữ, mua bán, tiêu thụ hàng cấm, hàng hóa nhập lậu, hàng giả chưa đến mức truy cứu TNHS — chế tài hay dùng cho hàng XNK lậu lưu thông nội địa (thay cho NĐ 167/2013 khi ban hành).'
