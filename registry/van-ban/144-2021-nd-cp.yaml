xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu trực tiếp vanban.chinhphu.vn (docid 204979) và trang mirrored tư liệu Đảng: số hiệu, tên nguyên văn (gồm cả cụm "cứu nạn, cứu hộ; phòng, chống bạo lực gia đình"), cơ quan Chính phủ (ký Phạm Bình Minh), ngày ban hành 31/12/2021, ngày hiệu lực 01/01/2022. Tình trạng hết hiệu lực từ 01/01/2026 do bị NĐ 282/2025/NĐ-CP (30/10/2025) thay thế — theo TVPL và Công an Gia Lai (congan.gialai.gov.vn); 1 kết quả search nêu thời điểm 15/12/2025, chưa đối chiếu trực tiếp toàn văn NĐ 282/2025. Lưu ý phân biệt: NĐ 144/2021/NĐ-CP thứ hai (cùng số, đăng ký doanh nghiệp) bị thay bởi NĐ 168/2025/NĐ-CP — không phải văn bản này.'
