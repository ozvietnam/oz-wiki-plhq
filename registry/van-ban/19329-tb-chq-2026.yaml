ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị trình diễn, diễu hành và giải trí tự hành trong công viên chủ đề (Theme Park Parade Entertainment Float, model BES-EC2A / BES-EC2B; sân khấu di động gắn cố định mô hình nghệ thuật FRP trên khung bệ thép tự hành truyền động điện 5.000W, không chở khách hay hàng hóa) thuộc nhóm 87.05, mã số 8705.90.90.'
