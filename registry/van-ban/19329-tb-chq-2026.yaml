  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/24/VB_19329.pdf, id=105236, SHA-256 4fdd858c4ed31f34caf4f45e59f81d26efbbf9c77bb9d3f353b9b889b4451619): Thông báo số 19329/TB-CHQ ngày 23-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị trình diễn, diễu hành và giải trí tự hành trong công viên chủ đề (tên thương mại Theme Park Parade Entertainment Float, model BES-EC2A / BES-EC2B; cấu tạo gồm nền khung bệ đỡ chịu lực bằng thép dạng khung kín tích hợp cố định với hệ thống mô hình nghệ thuật ba chiều bằng composite sợi thủy tinh FRP/nhựa epoxy và hệ thống chiếu sáng trình diễn, sử dụng hệ thống truyền động motor điện 5.000W, điện áp 60V, tốc độ 15-30 km/h, kích thước khoảng 8.500 x 2.000 x 3.000 mm, chỉ có 01 vị trí người điều khiển, không có ghế hay khoang chở hành khách/hàng hóa, chỉ vận hành trong khuôn viên khép kín của công viên chủ đề), phân loại vào nhóm 87.05, mã số 8705.90.90; có hiệu lực từ ngày ký'
