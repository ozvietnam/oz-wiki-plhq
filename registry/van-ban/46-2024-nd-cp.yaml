      noi_dung: Điều 3. Trách nhiệm tổ chức thực hiện 1. Bộ Khoa học và Công nghệ hướng dẫn việc thực hiện Nghị định này. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm tổ chức thi hành Nghị định này.
