xac_minh:
  muc: NGUON_A
  pham_vi: 'Điều 5 đọc nguyên văn trên Công báo số 629+630 (12-04-2025): hiệu lực 02-11-2024 (sổ ghi nhầm 04-11-2024), khoản 2 thay TT 28/2021/TT-BYT. Còn được TT 27/2026/TT-BYT (hiệu lực 01-07-2026, datafiles.chinhphu.vn) dẫn làm căn cứ mã HS cho cả 8 nhóm sản phẩm → đang áp dụng tại 07/2026. Chưa kiểm văn bản ban hành sau 07/2026.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-10-04'
  boi: claude-code@ozvietnam
ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 186 mã HS). Tiêu đề đã đối chiếu (thuvienphapluat.vn). KHUNG KTCN 2026 (tin cậy LOW): Kiểm tra ATTP vẫn theo NĐ 15/2018/NĐ-CP. Bộ Y tế ra thêm TT 27/2026/TT-BYT (thực phẩm, bao gói tiếp xúc thực phẩm — rủi ro trung bình). Chưa thấy nguồn nói TT 27/2026 thay TT 15/2024 — cần đối chiếu. CẬP NHẬT 04/10/2026: QĐ 988/QĐ-BYT ngày 24-03-2025 (cùng số Công báo, trang 94–95) đính chính TT 15/2024 — sửa viện dẫn điểm d khoản 4 Điều 3 và bỏ dòng thừa "II. Phụ gia thực phẩm đơn chất:" đầu bảng; không đổi mã HS.'
