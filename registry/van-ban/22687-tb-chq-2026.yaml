  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/8/VB_22687.pdf, id=106314, SHA-256 cebd082cec6c353cd8e8c28438b956d1b51a829b5923f3a5d5715523981de77d): Thông báo số 22687/TB-CHQ ngày 08-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chế phẩm Energydot (dạng dung dịch màu đen, thành phần chính là các hạt Nano Carbon chấm lượng tử Quantum Carbon Dots - QCDs kích thước siêu nhỏ < 10nm với hàm lượng chất hữu cơ 45%, tổng carbon hữu cơ TOC 20%, phụ gia PEG 5%, TWEEN 80 2% và nước, độ pH 5-6,5, tỉ trọng 1,2 g/ml, dùng phun trực tiếp hoặc trộn lẫn với phân bón lá để phun trong nông nghiệp), phân loại vào nhóm 38.24, phân nhóm 3824.99, mã số 3824.99.99; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
