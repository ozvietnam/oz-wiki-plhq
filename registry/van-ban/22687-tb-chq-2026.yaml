ghi_chu: 'Xác định trước mã số mặt hàng Chế phẩm Energydot (tên thương mại Energydot, không có ký mã hiệu, dạng dung dịch màu đen, thành phần chính gồm các hạt Nano Carbon chấm lượng tử Quantum Carbon Dots - QCDs kích thước < 10nm, hàm lượng chất hữu cơ 45%, tổng carbon hữu cơ TOC 20%, độ pH 5-6,5, tỉ trọng 1,2 g/ml, phụ gia PEG 5%, TWEEN 80 2% và nước, dùng phun trực tiếp hoặc trộn lẫn với phân bón lá/thuốc bảo vệ thực vật để phun trong nông nghiệp) thuộc nhóm 38.24, phân nhóm 3824.99, mã số 3824.99.99.'
