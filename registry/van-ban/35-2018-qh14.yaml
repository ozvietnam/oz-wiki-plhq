      noi_dung: 'Điều 1. Sửa đổi, bỗ sung một số điều của Luật Giao thông đường bộ 1. Sửa đôi, bd sung Điều 6 như sau: “Điều 6. Quy hoạch mạng lưới đường bộ'
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Sửa doi, bd sung một số điều của Bộ luật Hàng hải Việt Nam 1. Sửa đổi, bd sung khoản 2 Điều 7 như sau:'
      trang_pdf: 4
    - dieu: 3
      noi_dung: 'Điều 3. Sửa déi, bd sung một số điều của Luật Đường sắt 1. Sửa đổi, bỗ sung Điều 7 như sau: “Điều 7. Quy hoạch mạng lưới đường sắt 1. Quy hoạch mạng lưới đường sắt là quy hoạch ngành quốc gia, làm cơ sở định hướng đầu tu, phát triển, khai thác mạng lưới đường sắt. 2. Bộ Giao thông vận tải tô chức lập quy hoạch mạng lưới đường sắt trình Thủ tướng Chính phủ phê duyệt theo quy định của pháp luật về quy hoạch.”.'
      trang_pdf: 8
    - dieu: 8
      noi_dung: 'Điều 8. Sửa đổi, bo sung một số điều của Luật Khoáng sản 1. Bồ sung khoản 8 vào Điều 2 như sau: “8, Quy hoạch khoảng sản bao gồm quy hoạch điều tra cơ bản địa chất về khoáng sản; quy hoạch thăm dò, khai thác, chế biến và sử dụng các loại khoáng sản; quy hoạch thăm dò, khai thác, chế biến và sử dụng quặng phóng xạ; quy hoạch thăm dò, khai thác, chế biến và sử dụng các loại khoáng sản làm vật liệu xây dựng.”.'
      trang_pdf: 33
    - dieu: 11
      noi_dung: 'Điều 11. Sửa đổi, bỗ sung một số điều của Luật Tài nguyên, môi trường biến và hai đảo 1. Sửa đôi, bỗ sung một số khoản của Điều 3 như sau: a) Sửa đổi, bd sung khoản 5 như sau: “5, Quy hoạch sử dụng biển của cả nước là một nội dung của quy hoạch không gian biển quốc gia và được thực hiện theo quy định của pháp luật về quy hoạch.”; b) Sửa đối, bd sung khoản 7 như sau: .'
      trang_pdf: 38
    - dieu: 15
      noi_dung: 'Điều 15. Sửa déi, bd sung một số điều của Luật Năng lượng nguyên tử 1. Sửa đôi, bỗ sung khoản 1 Điều 9 như sau: “1. Hội đồng phát triển, ứng dung năng lượng nguyên tử quốc gia là cơ quan tư vấn của Thủ tướng Chính phủ về chiến lược, chính sách, kế hoạch phát triển ứng dụng năng lượng nguyên tử vì mục đích hòa bình, có trách nhiệm giúp'
      trang_pdf: 49
    - dieu: 19
      noi_dung: 'Điều 19. Sửa đỗi, bỗ sung một số điều của Luật Xuất bản 1. Sửa đôi, bd sung điểm a khoản 1 Điều 6 như sau:'
      trang_pdf: 53
    - dieu: 23
      noi_dung: 'Điều 23. Sửa đỗi, bo sung một số điều của Luật Thực hành tiết kiệm, chống lãng phí 1. Sửa đổi, bd sung khoản 10 Điều 27 như sau: “10. Cấp phép thành lập trường học, cơ sở khám bệnh, chữa bệnh không phi hợp với chiên lược, kê hoạch phát triên giáo dục, y tê, quy hoạch có liên quan theo quy định của pháp luật về quy hoạch và quy định khác của pháp luật có liên quan.”. 2. Sửa đổi, bd sung khoản 1 Điều 46 như sau:'
      trang_pdf: 55
    - dieu: 26
      noi_dung: 'Điều 26. Sửa déi, bo sung một số điều của Luật Điện ảnh 1. Sửa đổi, bổ sung khoản 6 Điều 5 như sau: “6. Chính phủ quy định cụ thê việc thực hiện các chính sách quy định tại Điều nay.”. 2. Sửa đổi, bỗ sung khoản 1 Điều 8 như sau: “1. Xây dựng và tổ chức thực hiện chính sách, chiến lược, kế hoạch phát triển sự nghiệp điện ảnh, định hướng phát triển cơ sở điện ảnh trong quy hoạch'
      trang_pdf: 57
    - dieu: 31
      noi_dung: 'Điều 31. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2019. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XIV, ky họp thứ 6 thông qua ngày 20 thang 1] năm 2018. CHỦ TỊCH QUOC HỘI Đã ký: Nguyễn Thị Kim Ngân VĂN PHONG CHỦ TỊCH NƯỚC Số: 42 /SY-VPCTN'
      trang_pdf: 69
ghi_chu: 'Nạp tối thiểu theo rà soát PL hải quan 29/10: phần sửa Luật HQ đã nằm trong VBHN 54/VBHN-VPQH (có sẵn) — file riêng để cạnh sửa đổi truy xuất được. PHÂN BIỆT: luật sửa Luật HQ là 35/2018/QH14; 102/2020/QH14 trong sổ là Nghị quyết phê chuẩn EVFTA (khác hoàn toàn).'
