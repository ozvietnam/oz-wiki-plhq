  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/29/VB_22274.pdf, id=106190, SHA-256 601e53c87d9fdd0be144320ace135910e54dca7ab96c8b0c60264bddd3d19e06): Thông báo số 22274/TB-CHQ ngày 28-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module truyền nhận tín hiệu Bluetooth/Wi-Fi (Model CM01WTA01M, Product Code CM01WTA01MDWSM; cấu tạo gồm bản mạch in PCB vật liệu FR-4 4 lớp tích hợp anten vi dải Pattern Antenna, gắn vi xử lý trung tâm kiêm bộ thu phát vô tuyến Wi-Fi/BLE SoC RTL8720CM băng tần 2,4 GHz, chip bộ nhớ Flash 64 Mbit EN25QH64A-104HIP, thạch anh dao động 40 MHz, vi mạch ổn áp LDO 3,3 V DC, mạch phối hợp trở kháng RF Matching và nắp bảo vệ kim loại Shield Can; chuẩn Wi-Fi IEEE 802.11 b/g/n và Bluetooth Low Energy BLE 4.2, giao tiếp SPI và UART, kích thước 20 x 35 x 4,8 mm; trình bày dạng module không có vỏ để gắn trực tiếp vào bảng mạch điều khiển của thiết bị điện tử nhằm thu, phát, chuyển đổi và truyền nhận dữ liệu qua mạng không dây), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
