ghi_chu: 'Xác định trước mã số mặt hàng Module truyền nhận tín hiệu Bluetooth/Wi-Fi (Model CM01WTA01M, Product Code CM01WTA01MDWSM; bản mạch PCB FR-4 4 lớp tích hợp Pattern Antenna, gắn vi mạch Wi-Fi/BLE SoC RTL8720CM băng tần 2,4 GHz, chip nhớ Flash 64 Mbit, chuẩn Wi-Fi IEEE 802.11 b/g/n và BLE 4.2, dạng module không có vỏ dùng gắn vào bảng mạch điều khiển của thiết bị điện tử) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
