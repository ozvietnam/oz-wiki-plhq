ghi_chu: 'Xác định trước mã số mặt hàng Nước yến đường phèn (thực phẩm chế biến sẵn dạng lỏng sệt dùng trực tiếp không có ga, thành phần nước 91.303%, đường phèn 8%, phụ gia INS 415, INS 327, INS 401, INS 406, INS 202 và hương yến tổng hợp 0.689%, tổ yến tươi 0.008% tương ứng 100 mg/lít, tiệt trùng ở 119 độ C) thuộc nhóm 22.02, phân nhóm 2202.99, mã số 2202.99.50.'
