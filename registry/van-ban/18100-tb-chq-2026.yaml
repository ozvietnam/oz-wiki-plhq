  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/26/VB_18100.pdf, id=104901, SHA-256 b68cff1dfd47252e7c7af36c7f85c37a369c8fd9382802f414c2c9837c9c7d3c): Thông báo số 18100/TB-CHQ ngày 26-06-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 18100/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Nước yến đường phèn (thực phẩm chế biến sẵn dạng lỏng sệt, chưng từ tổ yến hàm lượng thấp 100 mg yến tươi/lít với đường phèn, dùng trực tiếp; tỷ lệ hàm lượng gồm Nước 91.303%, Đường phèn 8%, Phụ gia 0.689% gồm chất làm dày INS 415, INS 327, chất ổn định INS 401, INS 406, chất bảo quản INS 202, hương yến tổng hợp, và Tổ yến tươi 0.008%; tiệt trùng ở 119 độ C trong 15-38 phút; quy cách hũ 70 ml, hộp 6 hũ x 70 ml, hũ 190 ml, chai 180 ml hoặc thể tích thực khác), phân loại vào nhóm 22.02, phân nhóm 2202.99, mã số 2202.99.50; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
