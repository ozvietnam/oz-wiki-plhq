  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/5/VB_13272.pdf, id=102688, SHA-256 3b215faed0201820ac51c422c93d4e06aea183da8d6b0cd9226cf59542513467): Thông báo số 13272/TB-CHQ ngày 04-03-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ toan áo phẫu thuật cột sống Spinal Laminectomy Pack (ký, mã hiệu V-SLP-002; chất liệu vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, định lượng 43-65 gsm, ép nhiệt và cắt may, khử trùng bằng khí EO dùng 1 lần; bộ gồm 1 toan trải bàn dụng cụ lớn 180 x 200 cm, 1 toan trải bàn dụng cụ nhỏ 120 x 140 cm, 1 toan phẫu thuật cột sống 254 x 350 cm, 2 toan vải không dệt 40 x 65 cm, 10 khăn thấm 30 x 40 cm và 4 áo choàng phẫu thuật), phân loại vào nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90; có hiệu lực từ ngày ký'
