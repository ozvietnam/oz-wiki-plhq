ghi_chu: 'Xác định trước mã số mặt hàng Bảng giá điện tử ESL Electronic Shelf Labels (ký, mã hiệu EL029F5W4C/WWW; dạng màn hình dẹt sử dụng công nghệ mực điện tử E-ink 4 màu độ phân giải 384x168 pixel, đèn LED 7 màu, dùng 2 pin CR2450 3V, giao tiếp không dây BLE 2.4GHz và NFC, hiển thị thông tin sản phẩm như tên, giá, mã vạch, mã QR, khuyến mãi, tồn kho trên quầy kệ) thuộc nhóm 85.31, phân nhóm 8531.80, mã số 8531.80.29.'
