  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/5/VB_7204.pdf, id=100275, SHA-256 4a0e68f43573bec5239e603026ad9d09aea8a203bfe514444ceff7e03402d509): Thông báo số 7204/TB-CHQ ngày 02-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bảng giá điện tử ESL Electronic Shelf Labels (ký, mã hiệu EL029F5W4C/WWW; cấu tạo gồm vỏ nhựa, nắp pin, 02 pin CR2450 3V, bản mạch PCB gắn màn hình hiển thị dạng dẹt công nghệ mực điện tử E-ink 4 màu Red/Black/White/Yellow độ phân giải 384x168 pixel khung hiển thị 67,6x29,6mm, đèn LED 7 màu, IC Bluetooth-MCU giao tiếp BLE 2.4GHz qua cổng Gateway, IC NFC, IC bộ nhớ và thạch anh crystal; kích thước 85.67x42.79x11.62mm, dùng gắn lên quầy kệ hiển thị tên, giá, mã vạch, mã QR, tồn kho sản phẩm), phân loại vào nhóm 85.31, phân nhóm 8531.80, mã số 8531.80.29; có hiệu lực từ ngày ký'
