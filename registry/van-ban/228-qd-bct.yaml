ghi_chu: 'Đã hiệu đính ten về đúng nguyên văn trích yếu trên bản gốc ký số và chuyển tinh_trang từ CON_HIEU_LUC sang HET_HIEU_LUC (het_hieu_luc_tu: 2026-06-14) sau khi hết thời hạn 120 ngày kể từ ngày có hiệu lực 14-02-2026. Mã vụ việc AD22 (2 mã HS: 7005.29.20, 7005.29.90; khởi xướng điều tra tại QĐ 2093/QĐ-BCT ngày 18-07-2025). Mức thuế CBPG tạm thời tại Mục 2 Thông báo kèm theo QĐ 228/QĐ-BCT: Indonesia từ 15,17% đến 43,78%; Malaysia từ 41,07% đến 63,39%. Từ ngày 14-06-2026 chuyển sang áp dụng thuế CBPG chính thức (Indonesia 32,78%–43,78%, Malaysia 41,07%–63,39%) theo Quyết định số 1400/QĐ-BCT ngày 12-06-2026 (https://pvtm.gov.vn/default.aspx?page=news-detail&do=detail&category_id=91b07cf1-3658-4f39-b688-73b9e8ff8a05&id=ab1a7f48-87fc-41f9-8992-f72fba3e4e6b, toàn văn PDF: https://pvtm.gov.vn/data/00195410-a87c-4a80-989d-83a83a4e020d/userfiles/files/QD%201400%20QD%20BCT%2012_06_2026.pdf; mục 1400-qd-bct-2025.yaml trong sổ sẽ cập nhật ở thẻ riêng).'
