  muc: NGUON_A
  pham_vi: 'PDF bản gốc ký số trên cổng Bộ Công Thương (moit.gov.vn, lưu tại raw/download/moit.gov.vn/228-qd-bct.pdf) và cổng Cục Phòng vệ thương mại (pvtm.gov.vn, 7 trang gồm Quyết định và Thông báo kèm theo): số hiệu 228/QĐ-BCT, ban hành ngày 30-01-2026, trích yếu "Áp dụng thuế chống bán phá giá tạm thời đối với một số sản phẩm kính nổi không màu có xuất xứ từ Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a", người ký Thứ trưởng Nguyễn Sinh Nhật Tân (căn cứ Luật Quản lý ngoại thương ngày 12-6-2017; Nghị định 40/2025/NĐ-CP ngày 26-02-2025; Nghị định 86/2025/NĐ-CP ngày 11-4-2025; Thông tư 26/2025/TT-BCT ngày 15-5-2025; Quyết định 536/QĐ-BCT ngày 28-02-2025; Quyết định 2093/QĐ-BCT ngày 18-7-2025). Trích nguyên văn các điều của Quyết định: "Điều 1. Áp dụng thuế chống bán phá giá tạm thời đối với một số sản phẩm kính nổi không màu có xuất xứ từ Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a được phân loại theo các mã HS 7005.29.20, 7005.29.90 (mã vụ việc: AD22) với nội dung chi tiết nêu tại Thông báo kèm theo Quyết định này. Điều 2. Quyết định này có hiệu lực sau 15 ngày kể từ ngày ban hành. Điều 3. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại và Thủ trưởng các đơn vị, các bên liên quan chịu trách nhiệm thi hành Quyết định này./." Trích nguyên văn Mục 3 Thông báo kèm theo Quyết định số 228/QĐ-BCT ngày 30-01-2026: "3. Hiệu lực và thời hạn áp dụng thuế chống bán phá giá tạm thời: a) Hiệu lực: Thuế chống bán phá giá tạm thời có hiệu lực sau 15 (mười lăm) ngày kể từ ngày Quyết định áp dụng thuế CBPG tạm thời được ban hành. b) Thời hạn áp dụng: Thuế chống bán phá giá tạm thời có thời hạn áp dụng là 120 (một trăm hai mươi) ngày kể từ ngày có hiệu lực (trừ trường hợp được gia hạn, thay đổi, hủy bỏ theo quy định pháp luật)." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên pvtm.gov.vn và moit.gov.vn: biện pháp thuế CBPG tạm thời 120 ngày theo QĐ 228/QĐ-BCT (có hiệu lực từ 14-02-2026 đến hết 13-06-2026) đã HET_HIEU_LUC từ ngày 14-06-2026 và chuyển sang áp dụng thuế CBPG chính thức (05 năm kể từ ngày 14-06-2026) theo Quyết định số 1400/QĐ-BCT ngày 12-06-2026 của Bộ trưởng Bộ Công Thương (Điều 2 QĐ 1400/QĐ-BCT: "Quyết định này có hiệu lực kể từ ngày 14 tháng 6 năm 2026"; Mục 4 Thông báo kèm theo QĐ 1400/QĐ-BCT: "a) Hiệu lực: Thuế chống bán phá giá chính thức có hiệu lực kể từ ngày 14 tháng 6 năm 2026. b) Thời hạn áp dụng: Thuế chống bán phá giá chính thức có thời hạn áp dụng là 05 (năm) năm kể từ ngày có hiệu lực (trừ trường hợp được gia hạn, thay đổi, hủy bỏ theo Quyết định khác của Bộ trưởng Bộ Công Thương)").'
