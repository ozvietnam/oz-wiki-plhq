xac_minh:
  muc: NGUON_A
  pham_vi: "Văn bản hợp nhất toàn bộ 3 văn bản (105/2016, 28/2018, 44/2024). Đã đọc chi tiết toàn văn 14 Chương, 119 Điều. Cấu trúc: Chương I (Điều 1-6, Quy định chung - gồm Điều 2 giải thích từ ngữ, Điều 6 hành vi nghiêm cấm); Chương II (Điều 7-10, Chính sách NN); Chương III (Điều 11-31, Hành nghề dược); Chương IV (Điều 32-65, Kinh doanh dược); Chương V (Điều 54-65, Đăng ký lưu hành - Điều 54 miễn đăng ký cho thuốc NK theo Điều 60, Điều 60 NK thuốc chưa GĐKLH 9 trường hợp - đặc biệt Điều 60.2b dược liệu lần đầu dùng làm thuốc); Chương VI (Điều 66-73, Dược liệu + Thuốc cổ truyền - Điều 73.3 Bộ Y tế hướng dẫn thuốc cổ truyền dạng bào chế hiện đại); Chương VII-XIV (Đơn thuốc, Thông tin thuốc, Dược lâm sàng, Quản lý thuốc trong cơ sở KCB, Thử thuốc lâm sàng, Quy chuẩn chất lượng, Quản lý giá, Điều khoản thi hành). 12 Mục chia nhỏ trong 14 Chương."
  hieu_luc_da_doi_chieu: true
  ngay: 2026-10-09
  boi: hermes
  canh_bao: "Chương VI Điều 73.3: Bộ Y tế giao hướng dẫn 'thuốc cổ truyền có dạng bào chế hiện đại' (bao gồm cao dán) — chưa có TT hướng dẫn cụ thể → vùng xám pháp lý"
ghi_chu: "Điều 2 khoản 2: 'Thuốc là chế phẩm có chứa dược chất hoặc dược liệu dùng cho người nhằm mục đích phòng bệnh, chẩn đoán bệnh, chữa bệnh, điều trị bệnh, giảm nhẹ bệnh, điều chỉnh chức năng sinh lý cơ thể người'. Điều 2 khoản 8: 'Thuốc cổ truyền là thuốc có thành phần từ một hoặc nhiều dược liệu được phối ngũ theo lý luận y học cổ truyền'. Điều 60.2b: cho phép cấp phép NK thuốc chưa có GĐKLH nếu chứa dược liệu lần đầu sử dụng làm thuốc tại VN - cơ sở pháp lý cho DN NK cao dán gừng + ngải cứu dù chưa có trong DM 09/2024/TT-BYT."
tu_khoa: [dược-phẩm, thuốc, nguyên-liệu-làm-thuốc, y-hoc-co-truyen, kiem-soat-dac-biet]
