xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Công báo nước CHXHCN Việt Nam (congbao.chinhphu.vn, Công báo số 195 + 196 ngày 23-02-2016, trang 71 — Thông báo số 06/2016/TB-LPQT ngày 05-02-2016 của Bộ Ngoại giao về việc điều ước quốc tế có hiệu lực, kèm tệp PDF có chữ ký số của Văn phòng Chính phủ trên congbaocdn.chinhphu.vn): xác nhận "Công ước của Liên hợp quốc về mua bán hàng hóa quốc tế (United Nations Convention on Contracts for the International Sale of Goods)" ký tại Viên ngày 11-04-1980 có hiệu lực đối với Việt Nam kể từ ngày 01-01-2017, kèm nguyên văn Tuyên bố bảo lưu của Việt Nam theo Điều 12 và Điều 96 (yêu cầu hình thức văn bản đối với hợp đồng mua bán hàng hóa quốc tế khi có bên có trụ sở thương mại tại Việt Nam). Đối chiếu bổ sung trên trang trạng thái thành viên UNCITRAL (uncitral.un.org) và thông cáo UNIS/L/226: Việt Nam nộp văn kiện gia nhập ngày 18-12-2015 (thành viên thứ 84), Công ước đang còn hiệu lực đối với Việt Nam từ ngày 01-01-2017 (không có thông báo đình chỉ, rút lui hay rút bảo lưu trên Công báo và UNCITRAL).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: khung pháp lý chung cho hợp đồng mua bán hàng hoá quốc tế giữa doanh nghiệp VN và đối tác tại quốc gia thành viên khác (Trung Quốc, Singapore, EU...) — áp dụng tự động trừ khi các bên thỏa thuận loại trừ; lưu ý VN tuyên bố giữ yêu cầu hợp đồng bằng văn bản theo Điều 12, 96. Ghi chú nhu cầu có nhắc "nghị định 83/2019/NĐ-CP" như nghị định thi hành — đã kiểm tra và KHÔNG xác nhận được mối liên quan: NĐ 83/2019/NĐ-CP (12/11/2019) là văn bản sửa đổi NĐ 94/2014/NĐ-CP về Quỹ phòng, chống thiên tai (nguồn thứ cấp), nên không ghi quan hệ vào entry này.'
