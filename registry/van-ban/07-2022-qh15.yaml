  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 573 + 574 ngày 16-07-2022 (raw/download/congbaocdn.chinhphu.vn/07-2022-qh15.pdf, 72 trang, trang 3–74 của số Công báo, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 19-07-2022, SHA-256 26ee7ef2a9680660d886a96b5ea5c4d30809a5bbffdde73050fcc34f8dfea72e), raw/download/congbao.chinhphu.vn/07-2022-qh15.html, VBHN 155/VBHN-VPQH (09-09-2025) và trang wiki/sources/07-2022-qh15.md: Quốc hội khóa XV kỳ họp thứ 3 thông qua ngày 16-06-2022, Chủ tịch Quốc hội Vương Đình Huệ ký, gồm 4 Điều (Điều 1 gồm 83 khoản sửa đổi, bổ sung Luật Sở hữu trí tuệ 50/2005/QH11; Điều 2 sửa đổi Luật Hải quan 54/2014/QH13, Luật KH&CN 29/2013/QH13, Luật Quản lý, sử dụng tài sản công 15/2017/QH14 và Luật Giá 11/2012/QH13; Điều 3 hiệu lực thi hành từ 01-01-2023; Điều 4 quy định chuyển tiếp).'
