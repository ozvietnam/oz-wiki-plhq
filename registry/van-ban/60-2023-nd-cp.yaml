ten: 'Quy định về việc kiểm tra, chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường ô tô nhập khẩu và linh kiện nhập khẩu theo các Điều ước quốc tế mà Việt Nam là thành viên'
