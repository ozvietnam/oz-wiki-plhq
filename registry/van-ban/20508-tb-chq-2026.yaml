  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/22/VB_20508.pdf, id=105540, SHA-256 ba7f9a152be9a602558e5f05e682c571ea699b9162f48050cfb26ef3810f7569): Thông báo số 20508/TB-CHQ ngày 17-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng LED COB PCB module (ký, mã hiệu COB160110-600W; các đi-ốt phát quang LED được lắp ráp trên tấm mạch in nền nhôm PCB kích thước 150x60mm dày 1,5mm theo cấu hình 60Sx11P gồm 660 chip LED, không có mạch điện để điều khiển điện áp và dòng điện DC đến mức mà đèn LED có thể sử dụng được; sử dụng để lắp vào vỏ của bộ đèn LED phù hợp và kết hợp với bộ nguồn/driver và bộ tản nhiệt, dùng chiếu ánh sáng LED ngoài trời, công suất 600W, điện áp vào 168-185VDC), phân loại vào nhóm 85.41, mã số 8541.41.00; có hiệu lực từ ngày ký'
