ghi_chu: 'Xác định trước mã số mặt hàng LED COB PCB module (ký, mã hiệu COB160110-600W; các đi-ốt phát quang LED được lắp ráp trên tấm mạch in PCB, không có mạch điện điều khiển điện áp và dòng điện DC, dùng làm cụm phát sáng/nguồn sáng LED công suất 600W, điện áp vào 168-185VDC để lắp trong đèn LED chiếu sáng ngoài trời kết hợp với driver và bộ tản nhiệt) thuộc nhóm 85.41, mã số 8541.41.00.'
