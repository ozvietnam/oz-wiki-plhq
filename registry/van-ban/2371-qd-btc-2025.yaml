xac_minh:
  muc: NGUON_A
  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A của Bộ Tài chính trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/LANG_SON/2025/7/11/QĐ 2371.pdf, id=100663, SHA-256
    5ef42d48657e752fab450d70472a961242ec18fe41efd828e5b21dbe0034adc7): Quyết định số 2371/QĐ-BTC ngày 04-07-2025 của Bộ
    trưởng Bộ Tài chính (Thứ trưởng Cao Anh Tuấn ký) công bố 01 thủ tục hành chính được sửa đổi, bổ sung trong lĩnh vực
    hải quan thuộc phạm vi chức năng quản lý của Bộ Tài chính (mã hồ sơ TTHC 1.007902: Thủ tục kiểm tra hóa đơn giá trị
    gia tăng kiêm tờ khai hoàn thuế và hàng hóa cho người nước ngoài, người Việt Nam định cư ở nước ngoài mang theo khi
    xuất cảnh theo Điều 33 Nghị định số 181/2025/NĐ-CP ngày 01-07-2025 và Mẫu tham khảo số 1 Phụ lục III Thông tư số
    32/2025/TT-BTC ngày 31-05-2025); Điều 2 quy định có hiệu lực từ ngày 01-07-2025 và bãi bỏ nội dung tại Stt 3 Mục B
    Phần I, Stt 3 Mục II Phần II Phụ lục kèm theo Quyết định số 814/QĐ-BTC ngày 03-06-2020 và Stt 182 Mục I Phụ lục kèm
    theo Quyết định số 1474/QĐ-BTC ngày 24-04-2025
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
  dieu_khoan:
    - dieu: 1
      tieu_de: Công bố thủ tục hành chính được sửa đổi, bổ sung trong lĩnh vực hải quan
      noi_dung: >-
        Điều 1. Công bố kèm theo Quyết định này 01 thủ tục hành chính được sửa đôi, bô sung trong lĩnh vực hải quan
        thuộc phạm vi chức năng quản lý của Bộ Tài chính.
      trang_pdf: 1
    - dieu: 2
      tieu_de: Hiệu lực thi hành
      noi_dung: >-
        Điều 2. Quyết định này có hiệu lực từ ngày 01 tháng 7 năm 2025. Bai bỏ nội dung đã được công bố tại Stt 3 Mục B
        Phan I và Stt 3 Mục II Phân II Phụ lục ban hành kèm theo Quyêt định sỐ 814/QĐ-BTC ngày 03 tháng 6 năm 2020 của
        Bộ trưởng Bộ Tài chính về công bô thủ tục hành chính trong lĩnh vực hai quan và Stt 182 Mục I lĩnh vực hai quan
        ban hành kèm theo Quyệt định sô 1474/QĐ-BTC ngày 24 tháng 4 năm 2025 của Bộ trưởng Bộ Tài chính về công bô danh
        mục thủ tục hành chính thuộc phạm vi chức năng quản lý của Bộ Tài chính.
      trang_pdf: 1
    - dieu: 3
      tieu_de: Trách nhiệm thi hành
      noi_dung: >-
        Điều 3. Chánh Văn phòng Bộ, Cục trưởng Cục Quản lý, giám sát chính sách, thuế, phí và lệ phí, Cục trưởng Cục
        Thuế, Cục trưởng Cục Hải quan, Chi cục trưởng các Chi cục Hai quan khu vực và các tô chức, cá nhân có liên quan
        chịu trách nhiệm thi hành Quyết định này.
      trang_pdf: 2
ghi_chu: >-
  Công bố quy trình TTHC mã 1.007902 về kiểm tra hóa đơn GTGT kiêm tờ khai hoàn thuế và hàng hóa tại quầy kiểm tra của
  Hải quan cửa khẩu/ngoài cửa khẩu đối với người nước ngoài, người Việt Nam định cư ở nước ngoài khi xuất cảnh (theo
  Điều 33 Nghị định số 181/2025/NĐ-CP ngày 01/07/2025).
