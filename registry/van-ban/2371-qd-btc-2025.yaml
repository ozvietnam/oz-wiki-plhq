ten: >-
  Về việc công bố thủ tục hành chính được sửa đổi, bổ sung trong lĩnh vực hải quan thuộc phạm vi chức năng quản lý của
  Bộ Tài chính
co_quan: BTC
ngay_ban_hanh: '2025-07-04'
