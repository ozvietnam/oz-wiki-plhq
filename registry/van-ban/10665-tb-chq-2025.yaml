  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/30/VB_10665.pdf, id=100494, SHA-256 14a7c89ec874d615eda8f1231e84e2e99cc9518c7793f8c5cb874cb7eae4654f): Thông báo số 10665/TB-CHQ ngày 25-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp điều khiển chưa gắn đầu nối, cách điện bằng cao su, 2 lõi x 1.5mm2 (ký, mã hiệu Part number 745A47, nhà sản xuất Rifen; cấu tạo gồm lớp vỏ ngoài bằng cao su tổng hợp synthetic rubber, bên trong gồm 02 dây cáp dẫn điện có vỏ bọc cách điện bằng cao su tổng hợp và lõi tiết diện tổng 1.5mm2 đường kính ~0.69mm gồm nhiều sợi đồng kích thước dưới 5mm xoắn lại với nhau; sử dụng cho điện áp 450/750V, không dùng cho viễn thông, dùng làm cáp truyền tín hiệu điều khiển trong công nghiệp), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.42; có hiệu lực từ ngày ký'
