ghi_chu: 'Xác định trước mã số mặt hàng Cáp điều khiển chưa gắn đầu nối, cách điện bằng cao su tổng hợp, 2 lõi x 1.5mm2 (ký, mã hiệu Part number 745A47, nhà sản xuất Rifen; vỏ ngoài và vỏ bọc cách điện từng dây bằng cao su tổng hợp synthetic rubber, mỗi lõi tiết diện 1.5mm2 đường kính ~0.69mm gồm nhiều sợi đồng xoắn lại; điện áp 450/750V, không dùng cho viễn thông, dùng truyền tín hiệu điều khiển trong công nghiệp) thuộc nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.42.'
