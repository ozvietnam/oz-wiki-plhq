  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/1/28/23.VB_6746.pdf, id=102476, SHA-256 cf893710322316d0ac136ed85c9eaa3bbeeba660a5d8e720e0e3c4a8ce92953a): Thông báo số 6746/TB-CHQ ngày 27-01-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bình tích áp bằng thép, dung tích 21 lít, kèm theo van (ký, mã hiệu RO-152; thân 2 lớp gồm vỏ thép ngoài và lớp nhựa PP nguyên sinh bên trong ngăn cách khoang chứa nước với khoang khí nén nạp sẵn áp suất 6–7 PSI bằng màng cao su; là linh kiện của máy lọc nước gia đình công suất 6–15 lít/giờ, có chức năng chứa nước sau lọc, duy trì/tăng áp suất nước đầu ra và tạo tín hiệu áp lực điều khiển hệ thống máy lọc nước vận hành tự động qua van áp cao), phân loại vào nhóm 84.21, phân nhóm 8421.99, mã số 8421.99.94; có hiệu lực kể từ ngày ban hành'
