ghi_chu: 'Xác định trước mã số mặt hàng Bình tích áp bằng thép, dung tích 21 lít, kèm theo van (ký, mã hiệu RO-152; linh kiện của máy lọc nước gia đình công suất 6–15 lít/giờ, chứa nước và duy trì/tăng áp suất nước đầu ra, tạo tín hiệu áp lực điều khiển hệ thống máy lọc nước vận hành tự động qua van áp cao) thuộc nhóm 84.21, phân nhóm 8421.99, mã số 8421.99.94.'
