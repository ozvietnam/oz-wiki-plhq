  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21168.pdf, id=106017, SHA-256 55c6c7c242247e69d0e26f2da38cd01031e7cb5a6b1768a8046f952442c90c0f): Thông báo số 21168/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị cung cấp nguồn cho máy chủ (Power Supply Unit for Server / PSU for Server, Model No PWS-802A-1R, Product code PSSF801202A; cấu tạo vỏ kim loại nhôm bọc ngoài có đầu kết nối, bên trong là bản mạch gắn IC điều khiển chương trình, IC logic, IC khuếch đại tín hiệu, IC quản lý - điều khiển nguồn, đi-ốt, điện trở, tụ điện, cuộn cảm, transistor, biến áp, LED, dây dẫn, cầu chì, tấm chắn cách điện và quạt tản nhiệt; kích thước 40 x 76 x 360 mm, trọng lượng 1,26 kg, công suất tối đa 800 W, chuẩn 80PLUS Titanium, hỗ trợ Active PFC; chuyển đổi từ điện xoay chiều AC 100-240 VAC / 10-5 A hoặc điện một chiều điện áp cao DC 200-240 VDC / 5 A sang điện một chiều điện áp thấp 12 VDC / 66 A ở chế độ hoạt động Active và 5 VDC / 4 A ở chế độ chờ Standby để cung cấp nguồn điện cho máy chủ server hoạt động, không phải bộ nguồn cấp điện liên tục UPS), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.19; có hiệu lực từ ngày ký'
