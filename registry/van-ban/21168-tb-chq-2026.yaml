ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị cung cấp nguồn cho máy chủ (Power Supply Unit for Server, công suất tối đa 800 W, vỏ nhôm 40 x 76 x 360 mm, trọng lượng 1,26 kg, chuyển đổi điện xoay chiều AC 100-240 VAC hoặc một chiều điện áp cao DC 200-240 VDC sang điện một chiều điện áp thấp 12 VDC / 66 A và 5 VDC / 4 A dùng cho máy chủ, không phải bộ nguồn cấp điện liên tục UPS) thuộc nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.19.'
