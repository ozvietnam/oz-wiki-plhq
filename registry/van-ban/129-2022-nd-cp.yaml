# Sổ đăng ký văn bản — crawl từ vanban.chinhphu.vn (sheet HT biểu thuế)
so_hieu: 129/2022/NĐ-CP
loai: NGHI_DINH
ten: Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Kinh tế Toàn diện Khu vực giai đoạn 2022 - 2027
co_quan: CP
ngay_ban_hanh: '2022-12-30'
hieu_luc_tu: '2022-12-30'
tinh_trang: CON_HIEU_LUC
nhanh:
  - thue/bieu-thue
  - xuat-xu-fta/hiep-dinh
  - thue/bieu-thue-xnk
xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=207257), toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/129-2022-nd-cp.pdf, 196 trang, SHA-256 98eb81e24651b161ad35cdcc6fa1bb22f36cb830c64189a13bab756343583b2f) và trang wiki/sources/129-2022-nd-cp.md: ban hành 30-12-2022, có hiệu lực từ ngày ký 30-12-2022 đến hết 31-12-2027, gồm 8 Điều và 06 Phụ lục Biểu thuế (Phụ lục A đến Phụ lục F dành cho ASEAN, Ôt-xtrây-lia, Trung Quốc, Nhật Bản, Hàn Quốc, Niu Di-lân) thực hiện Hiệp định Đối tác Kinh tế Toàn diện Khu vực (RCEP) giai đoạn 2022 - 2027, kèm quy định xử lý tiền thuế nộp thừa hồi tố từ ngày 01-01-2022'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  ghi_chu: 'Crawl từ vanban.chinhphu.vn + datafiles.chinhphu.vn'
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định thuế suất thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Kinh tế Toàn diện Khu vực (RCEP) giai đoạn 2022 - 2027 và điều kiện được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định này.'
    - dieu: 2
      noi_dung: '1. Người nộp thuế theo quy định của Luật Thuế xuất khẩu, thuế nhập khẩu. 2. Cơ quan hải quan, công chức hải quan. 3. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hàng hoá xuất khẩu, nhập khẩu.'
    - dieu: 3
      khoan: 1
      noi_dung: '1. Ban hành kèm theo Nghị định này các Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Kinh tế Toàn diện Khu vực giai đoạn 2022 - 2027 (thuế suất thuế nhập khẩu ưu đãi đặc biệt áp dụng sau đây gọi là thuế suất RCEP), bao gồm: Phụ lục A: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho các nước ASEAN theo quy định tại khoản 2 Điều 4 và Điều 5 Nghị định này; Phụ lục B: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho Ôt-xtrây-lia; Phụ lục C: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho Trung Quốc; Phụ lục D: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho Nhật Bản; Phụ lục E: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho Hàn Quốc; Phụ lục F: Biểu thuế nhập khẩu ưu đãi đặc biệt dành cho Niu Di-lân.'
    - dieu: 3
      khoan: 2
      noi_dung: '2. Cột “Mã hàng” và cột “Mô tả hàng hóa” tại các Phụ lục ban hành kèm theo Nghị định này được xây dựng trên cơ sở Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam và chi tiết theo cấp mã 8 số hoặc 10 số. Trường hợp Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam được sửa đổi, bổ sung, người khai hải quan kê khai mô tả, mã hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu sửa đổi, bổ sung và áp dụng thuế suất của mã hàng hoá được sửa đổi, bổ sung quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này.'
    - dieu: 3
      khoan: 3
      noi_dung: '3. Cột “Thuế suất RCEP (%)”: Thuế suất áp dụng cho các giai đoạn khác nhau, bao gồm: a) 2022: từ ngày 01 tháng 01 năm 2022 đến ngày 31 tháng 12 năm 2022 đối với các nước Bru-nây Đa-rút-xa-lam, Vương quốc Cam-pu-chia, Cộng hoà Dân chủ Nhân dân Lào, Cộng hoà Xinh-ga-po, Vương quốc Thái Lan, Ôt-xtrây-lia, Trung Quốc, Nhật Bản, Niu Di-lân, và khu phi thuế quan của Việt Nam; từ ngày 01 tháng 02 năm 2022 đến ngày 31 tháng 12 năm 2022 đối với Hàn Quốc; từ ngày 18 tháng 3 năm 2022 đến ngày 31 tháng 12 năm 2022 đối với Ma-lay-xi-a; b) 2023: từ ngày 01 tháng 01 năm 2023 đến ngày 31 tháng 12 năm 2023 đối với các nước Bru-nây Đa-rút-xa-lam, Vương quốc Cam-pu-chia, Cộng hoà Dân chủ Nhân dân Lào, Ma-lay-xi-a, Cộng hoà Xinh-ga-po, Vương quốc Thái Lan, Ôt-xtrây-lia, Trung Quốc, Nhật Bản, Hàn Quốc, Niu Di-lân, và khu phi thuế quan của Việt Nam; từ ngày 02 tháng 01 năm 2023 đến ngày 31 tháng 12 năm 2023 đối với Cộng hoà In-đô-nê-xi-a; c) 2024: từ ngày 01 tháng 01 năm 2024 đến ngày 31 tháng 12 năm 2024; d) 2025: từ ngày 01 tháng 01 năm 2025 đến ngày 31 tháng 12 năm 2025; đ) 2026: từ ngày 01 tháng 01 năm 2026 đến ngày 31 tháng 12 năm 2026; e) 2027: từ ngày 01 tháng 01 năm 2027 đến ngày 31 tháng 12 năm 2027.'
    - dieu: 3
      khoan: 4
      noi_dung: '4. Ký hiệu “*”: hàng hóa nhập khẩu không được hưởng thuế suất RCEP tại thời điểm tương ứng.'
    - dieu: 3
      khoan: 5
      noi_dung: '5. Đối với hàng hóa nhập khẩu áp dụng hạn ngạch thuế quan gồm một số mặt hàng thuộc các nhóm hàng 04.07, 17.01, 24.01, 25.01, thuế nhập khẩu ưu đãi đặc biệt trong hạn ngạch là mức thuế suất quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này; danh mục và lượng hạn ngạch thuế quan nhập khẩu hàng năm theo quy định của Bộ Công Thương và mức thuế suất thuế nhập khẩu ngoài hạn ngạch áp dụng theo quy định tại Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khẩu ngoài hạn ngạch thuế quan của Chính phủ tại thời điểm nhập khẩu.'
    - dieu: 4
      noi_dung: 'Hàng hóa nhập khẩu được áp dụng thuế suất RCEP phải đáp ứng đủ các điều kiện sau: 1. Thuộc Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này. 2. Được nhập khẩu từ các nước là thành viên của Hiệp định RCEP, bao gồm các quốc gia và vùng lãnh thổ sau: a) Bru-nây Đa-rút-xa-lam; b) Vương quốc Cam-pu-chia; c) Cộng hòa In-đô-nê-xi-a; d) Cộng hoà Dân chủ Nhân dân Lào; đ) Ma-lay-xi-a; e) Cộng hoà Xinh-ga-po; g) Vương quốc Thái Lan; h) Ôt-xtrây-lia; i) Cộng hòa Nhân dân Trung Hoa (Trung Quốc); k) Đại hàn Dân Quốc (Hàn Quốc); l) Nhật Bản; m) Niu Di-lân. 3. Đáp ứng các quy định về xuất xứ hàng hóa (bao gồm cả quy định về vận chuyển trực tiếp) và có chứng từ chứng nhận xuất xứ hàng hóa theo quy định của Hiệp định RCEP và quy định hiện hành của pháp luật.'
    - dieu: 5
      noi_dung: 'Hàng hóa từ khu phi thuế quan của Việt Nam nhập khẩu vào thị trường trong nước được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định RCEP phải đáp ứng đủ các điều kiện quy định tại khoản 1 và khoản 3 Điều 4 Nghị định này.'
    - dieu: 6
      khoan: 1
      noi_dung: '1. Hàng hóa nhập khẩu từ một nước thành viên của Hiệp định RCEP (bao gồm cả hàng hóa từ khu phi thuế quan của Việt Nam) nếu đáp ứng các điều kiện quy định tại Nghị định này và không có mức thuế suất RCEP khác nhau giữa các Phụ lục Biểu thuế ban hành kèm theo Nghị định này thì được áp dụng mức thuế suất RCEP tại Phụ lục Biểu thuế dành cho nước thành viên đó.'
    - dieu: 6
      khoan: 2
      noi_dung: '2. Hàng hóa nhập khẩu từ một nước thành viên của Hiệp định RCEP (bao gồm cả hàng hóa từ khu phi thuế quan của Việt Nam) nếu đáp ứng các điều kiện quy định tại Nghị định này và có mức thuế suất RCEP khác nhau giữa các Phụ lục Biểu thuế ban hành kèm theo Nghị định này thì mức thuế suất RCEP áp dụng như sau: a) Mức thuế suất tại Phụ lục Biểu thuế dành cho nước thành viên được xác định là nước xuất xứ theo quy định hiện hành của pháp luật; b) Trường hợp không áp dụng điểm a khoản này, người nhập khẩu được kê khai theo một trong các mức thuế suất RCEP dưới đây: - Mức thuế suất cao nhất tại các Phụ lục Biểu thuế áp dụng cho cùng hàng hóa có xuất xứ từ các nước thành viên của Hiệp định RCEP (bao gồm khu phi thuế quan của Việt Nam) có đóng góp nguyên liệu có xuất xứ được sử dụng để sản xuất ra hàng hóa nhập khẩu, với điều kiện người nhập khẩu chứng minh được thông tin kê khai; - Mức thuế suất cao nhất tại các Phụ lục Biểu thuế áp dụng cho cùng hàng hóa có xuất xứ từ các nước thành viên của Hiệp định RCEP (bao gồm khu phi thuế quan của Việt Nam).'
    - dieu: 7
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực từ ngày ký ban hành.'
    - dieu: 7
      khoan: 2
      noi_dung: '2. Đối với hàng hóa được nhập khẩu từ các nước Bru-nây Đa-rút-xa-lam, Vương quốc Cam-pu-chia, Cộng hoà Dân chủ Nhân dân Lào, Cộng hoà Xinh-ga-po, Vương quốc Thái Lan, Ôt-xtrây-lia, Trung Quốc, Nhật Bản, Niu Di-lân, khu phi thuế quan của Việt Nam và đăng ký tờ khai hải quan nhập khẩu từ ngày 01 tháng 01 năm 2022, đối với hàng hóa được nhập khẩu từ Hàn Quốc và đăng ký tờ khai hải quan nhập khẩu từ ngày 01 tháng 02 năm 2022, đối với hàng hóa được nhập khẩu từ Ma-lay-xi-a và đăng ký tờ khai hải quan nhập khẩu từ ngày 18 tháng 3 năm 2022 đến trước ngày Nghị định này có hiệu lực thi hành, nếu đáp ứng đủ các điều kiện để được hưởng thuế suất RCEP theo quy định tại Nghị định này và nếu đã nộp thuế theo mức thuế cao hơn thì được cơ quan hải quan xử lý tiền thuế nộp thừa theo quy định của pháp luật về quản lý thuế.'
    - dieu: 7
      khoan: 3
      noi_dung: '3. Đối với hàng hóa được nhập khẩu từ Cộng hòa In-đô-nê-xi-a và đăng ký tờ khai hải quan nhập khẩu từ ngày 02 tháng 01 năm 2023, nếu đáp ứng đủ các điều kiện thì được hưởng thuế suất RCEP theo quy định tại Nghị định này.'
    - dieu: 8
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
