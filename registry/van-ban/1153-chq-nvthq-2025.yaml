xac_minh:
  muc: NGUON_A
  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/DONG_NAI/2025/4/4/1153_CHQ_NVTHQ_04_04_2025.pdf, id=99764, SHA-256
    bcfb7767210cfe7c79eaeb969dab5a8ed8d83e59528a3ba2040be40b6ce5d761): Công văn số 1153/CHQ-NVTHQ ngày 04-04-2025 của
    Cục Hải quan hướng dẫn nguyên tắc phân loại mặt hàng Bộ cửa nhôm: căn cứ khoản 1 Điều 26 Luật Hải quan số
    54/2014/QH13 ("Khi phân loại hàng hóa phải căn cứ hồ sơ hải quan, tài liệu kỹ thuật và các thông tin khác có liên
    quan đến hàng hóa xuất khẩu, nhập khẩu để xác định tên gọi, mã số của hàng hóa theo Danh mục hàng hóa xuất khẩu,
    nhập khẩu Việt Nam"), trường hợp chỉ cung cấp tên hàng, một số hình ảnh, thông tin khái quát về mục đích sử dụng,
    cấu tạo, nguyên lý vận hành và các bước gia công lắp đặt nhưng không có chứng thư giám định về thành phần hàm lượng
    mặt hàng và không có tài liệu kỹ thuật chi tiết về cấu tạo, cách thức sử dụng để đối chiếu thì chưa đủ cơ sở hướng
    dẫn áp mã số cụ thể; việc khai báo mã số phải căn cứ thực tế hàng hóa nhập khẩu và tài liệu kỹ thuật liên quan; đang
    còn hiệu lực
