ghi_chu: >-
  Nguyên tắc phân loại mặt hàng Bộ cửa nhôm theo khoản 1 Điều 26 Luật Hải quan 54/2014/QH13: cần có chứng thư giám định
  thành phần hàm lượng và tài liệu kỹ thuật chi tiết về cấu tạo, cách thức sử dụng đối chiếu với thực tế hàng hóa nhập
  khẩu; không đủ cơ sở xác định mã số nếu chỉ có tên hàng, hình ảnh và mô tả khái quát.
