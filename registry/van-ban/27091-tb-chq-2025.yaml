xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/10/2/VBDI_27091.pdf, id=101520, SHA-256 c795720bf0bfa7c2fdb364fab550b190a0e09e201a59fa1bd0cfc1b053926eb3): Thông báo số 27091/TB-CHQ ngày 01-10-2025 của Cục Hải quan về thông tin tài khoản thu NSNN; căn cứ QĐ 382/QĐ-BTC (26-02-2025) sửa đổi bởi QĐ 2019/QĐ-BTC (11-06-2025); tiếp theo Thông báo 11801/TB-CHQ ngày 30-06-2025, cập nhật sửa đổi, bổ sung thông tin thu của đơn vị Hải quan Buôn Ma Thuột thuộc Chi cục Hải quan khu vực XIV (mã đơn vị 40BC, mã cơ quan thu 2995067, mã KBNN 2961, mã NH 66701001, Kho bạc Nhà nước khu vực XIV - Phòng Nghiệp vụ 2 / KBNN Đắk Lắk, TK 7111/3511/3591); người ký Mai Thị Vân Anh; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Cập nhật thông tin KBNN/tài khoản thu của Hải quan Buôn Ma Thuột (mã 40BC, mã cơ quan thu 2995067, mã KBNN 2961, mã NH 66701001, Kho bạc Nhà nước khu vực XIV - Phòng Nghiệp vụ 2 / KBNN Đắk Lắk, các tài khoản 7111 thu nộp NSNN, 3511 thu phí lệ phí HQ, 3591 tạm thu chờ nộp NSNN) thuộc Chi cục HQKV XIV (tiêu đề trên trang cổng ghi nhầm là khu vực XIX nhưng toàn văn và phụ lục PDF ký số đều ghi rõ Chi cục HQKV XIV). Văn bản gốc nêu tiếp theo 11801/TB-CHQ ngày 30-06-2025 — 11801 chưa có trong sổ nên chưa gắn quan_he.sua_doi (tránh điểm mù Cao); nạp 11801 rồi bổ sung quan hệ.'
