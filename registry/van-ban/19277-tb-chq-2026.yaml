  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/24/VB_19277.pdf, id=105237, SHA-256 7029f78f5aec103bb668db8ea9746328a14624179a55ff930ef90d9c8fceb313): Thông báo số 19277/TB-CHQ ngày 22-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Miếng bảo vệ bằng nhôm của tai nghe không dây Bluetooth (ký, mã hiệu B4; thanh kim loại dạng dẹt hình chữ nhật bo tròn hai đầu gắn màng lưới bảo vệ mic, chế tạo từ hợp kim nhôm gồm Al > 97%, Cr < 0,10%, Zn < 0,10%, Ti < 0,10%, Cu 0,55-0,75%, Mn 0,10-0,20%, Mg 0,80-1,05%, Fe < 0,20%, Si 0,50-0,80%; kích thước dài 29,10 mm x rộng 5,84 mm x dày 5,41 mm, khối lượng 0,000487 kg; lắp cố định trên mặt ngoài vỏ tai nghe không dây Bluetooth để bảo vệ và gia cường kết cấu), phân loại vào nhóm 85.18, phân nhóm 8518.90, mã số 8518.90.90; có hiệu lực từ ngày ký'
