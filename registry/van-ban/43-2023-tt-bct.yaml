      noi_dung: 5 1. Trường hợp đã tiếp nhận hồ sơ đối với các thủ tục hành chính quy định tại Điều 2 của Thông tư này trước ngày Thông tư này có hiệu lực thì tiếp tục thực hiện theo quy định của pháp luật tại thời điểm tiếp nhận hồ sơ. 2. Đối với các văn bản phê duyệt, chấp thuận đối với các thủ tục hành chính quy định tại Điều 2 của Thông tư này trước ngày Thông tư này có hiệu lực thì vẫn có hiệu lực cho đến hết thời hạn của văn bản.
