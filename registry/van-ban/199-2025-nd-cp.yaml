xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=214494), toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/199-2025-nd-cp.pdf, 7 trang, 3 Điều + Phụ lục I, II, Phó Thủ tướng Hồ Đức Phớc ký, SHA-256 0f35182faf44ca0d23bb5748e2329aba7265c6337f822e80a0261afbacf837b4) và trang wiki/sources/199-2025-nd-cp.md: Nghị định 199/2025/NĐ-CP ban hành 08-07-2025, có hiệu lực thi hành kể từ ngày ký ban hành 08-07-2025 theo khoản 1 Điều 3; đối chiếu đang còn hiệu lực, sửa đổi, bổ sung khoản 3 Điều 8 (điểm c.3.6, c.3.7; bãi bỏ điểm a.7), bãi bỏ điểm 1 phần Chú giải mặt hàng Chương 72 Mục I Phụ lục II và sửa đổi mức thuế suất thuế xuất khẩu (Phụ lục I: nhóm 28.04), thuế nhập khẩu ưu đãi (Phụ lục II: nhóm 39.01, 39.02, 72.09) của Nghị định 26/2023/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Bổ sung điểm c.3.6 và c.3.7 vào khoản 3 Điều 8 Nghị định số 26/2023/NĐ-CP như sau: “c.3.6) Trường hợp doanh nghiệp sản xuất, lắp ráp xe ô tô xét ưu đãi theo điểm c.3.2, c.3.3, c.3.4 khoản này có sản xuất, lắp ráp thêm xe ô tô chạy điện, xe ô tô sử dụng pin nhiên liệu, xe ô tô hybrid, xe ô tô sử dụng nhiên liệu sinh học hoàn toàn, xe ô tô sử dụng khí thiên nhiên thì được cộng số lượng xe ô tô chạy điện, xe ô tô sử dụng pin nhiên liệu, xe ô tô hybrid, xe ô tô sử dụng nhiên liệu sinh học hoàn toàn, xe ô tô sử dụng khí thiên nhiên trong kỳ xét ưu đãi vào sản lượng chung tối thiểu và sản lượng riêng tối thiểu của từng nhóm xe, mẫu xe sử dụng nhiên liệu xăng, dầu tương ứng để xác định sản lượng chung tối thiểu và sản lượng riêng tối thiểu của nhóm xe, mẫu xe khi xét ưu đãi. c.3.7) Trường hợp doanh nghiệp nắm giữ trên 35% vốn điều lệ của các công ty sản xuất, lắp ráp xe ô tô đã được Bộ Công Thương cấp giấy chứng nhận đủ điều kiện sản xuất, lắp ráp ô tô (gọi tắt là doanh nghiệp sở hữu) thì các công ty sản xuất, lắp ráp xe ô tô nếu đáp ứng các điều kiện theo quy định được cộng gộp sản lượng xe ô tô sản xuất, lắp ráp của các công ty đó để tính sản lượng tối thiểu khi xét điều kiện hưởng ưu đãi của Chương trình ưu đãi thuế. Doanh nghiệp sở hữu chịu trách nhiệm về việc xác định tổng sản lượng của các công ty sản xuất, lắp ráp xe ô tô đủ điều kiện áp dụng Chương trình ưu đãi thuế và tỷ lệ nắm giữ vốn điều lệ trên 35% trong kỳ xét ưu đãi thuế. Cơ quan hải quan nơi công ty sản xuất, lắp ráp xe ô tô đăng ký tham gia Chương trình ưu đãi thuế thực hiện hoàn thuế tương ứng với sản lượng xe ô tô do công ty đó sản xuất, lắp ráp đã xuất xưởng trong kỳ xét ưu đãi. Trường hợp doanh nghiệp sở hữu, công ty sản xuất, lắp ráp xe ô tô kê khai không đúng thực tế thì bị truy thu thuế và xử phạt vi phạm pháp luật về thuế.”'
    - dieu: 1
      khoan: 2
      noi_dung: '2. Sửa đổi mức thuế suất thuế xuất khẩu, mức thuế suất thuế nhập khẩu ưu đãi đối với một số mặt hàng quy định tại Phụ lục I - Biểu thuế xuất khẩu, Phụ lục II - Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế ban hành kèm theo Nghị định số 26/2023/NĐ-CP thành các mức thuế suất thuế xuất khẩu, mức thuế suất thuế nhập khẩu ưu đãi mới quy định tại Phụ lục I và Phụ lục II ban hành kèm theo Nghị định này.'
    - dieu: 2
      khoan: 1
      noi_dung: '1. Bãi bỏ điểm a.7 khoản 3 Điều 8 Nghị định số 26/2023/NĐ-CP.'
    - dieu: 2
      khoan: 2
      noi_dung: '2. Bãi bỏ điểm 1, phần “Chú giải mặt hàng”, Chương 72, Mục I, Phụ lục II - Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế ban hành kèm theo Nghị định số 26/2023/NĐ-CP.'
    - dieu: 3
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành.'
    - dieu: 3
      khoan: 2
      noi_dung: '2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
