  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/3/1087.TCHQ.Thuc Hien QD460.pdf, id=99314, SHA-256 9465ff164f7d417344726650e8ce7b77a1db05269fc156f76e3f4219f9ed66dd): Công văn số 1087/TCHQ-TXNK ngày 28-02-2025 của Tổng cục Hải quan (Phó Tổng cục trưởng Âu Anh Tuấn ký) hướng dẫn các Cục Hải quan tỉnh, thành phố thực hiện Quyết định số 460/QĐ-BCT ngày 21-02-2025 của Bộ trưởng Bộ Công Thương về việc áp dụng biện pháp chống bán phá giá tạm thời đối với một số sản phẩm thép cán nóng có xuất xứ từ Cộng hòa Ấn Độ và Cộng hòa nhân dân Trung Hoa (mã vụ việc AD20; hướng dẫn khai báo mã GK tại chỉ tiêu 1.95 khi có C/O từ nước khác hoặc từ Ấn Độ, mã G189/G188 mức 27,83% khi không nộp C/O hoặc không khớp Giấy chứng nhận nhà sản xuất Trung Quốc, và mã G172 đến G187 theo từng nhà sản xuất/xuất khẩu); hết hiệu lực từ ngày 06-07-2025 khi Quyết định số 1959/QĐ-BCT áp dụng thuế chống bán phá giá chính thức có hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn kê khai mã thuế chống bán phá giá tạm thời trên tờ khai hải quan nhập khẩu VNACCS (mã GK tại chỉ tiêu 1.95, các mã G172 đến G189) theo Quyết định số 460/QĐ-BCT ngày 21/02/2025 của Bộ Công Thương đối với thép cán nóng (mã vụ việc AD20).'
