  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/11/15/21.VB_35802.pdf, id=101863, SHA-256 eb1ecb5a9adc5b23b89b31a99350f5ccda7bc4279c553b9e815228af29d9dd96): Thông báo số 35802/TB-CHQ ngày 14-11-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Đầu cắm kết nối/Connector dạng đầu cái (socket) dùng hàn lên bảng mạch in SMD (Surface Mount Device) để kết nối với cáp dẹt và mạch in linh hoạt FFC/FPC bước chân 0.50mm (ký, mã hiệu CONNECTOR,05010HR-24A00G,24PIN; cấu tạo gồm vỏ housing bằng nhựa PA6T, chân kết nối terminal bằng đồng phốt pho C5210 mạ vàng, móc giữ hook bằng đồng thau C2680 mạ thiếc; điện áp định mức AC/DC 50V, dòng điện định mức AC/DC 0.5A), phân loại vào nhóm 85.36, phân nhóm 8536.69, mã số 8536.69.32; có hiệu lực từ ngày ký'
