  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/15/48.VBDI_24188.pdf, id=101338, SHA-256 0619811cf588f9c95e456dfa2ce019cbbc668cc61cdf5c7151709693621544b8): Thông báo số 24188/TB-CHQ ngày 15-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị tường lửa thế hệ mới (ký, mã hiệu Axgate 13000S; cấu tạo gồm CPU 16 Core 2.9 GHz x 2, RAM 96GB, lưu trữ hệ thống SSD 250GB, lưu trữ nhật ký SSD 4TB, hệ điều hành chuyên dụng AOS, 4 cổng mạng 10GBASE-R tối đa 32 cổng, 8 cổng 1GBASE-R tối đa 64 cổng và khả năng mở rộng cổng 40G, cổng console RS-232, nguồn điện 100-240VAC hỗ trợ nguồn dự phòng kép, công suất tiêu thụ AVG 144.3W / MAX 450W, khung máy rackmount 2U tiêu chuẩn kích thước 438 x 598 x 88 mm, khối lượng 16 kg; băng thông tường lửa 320 Gbps, băng thông chống xâm nhập 49.3 Gbps, băng thông IPS VPN 41.7 Gbps; hoạt động theo mô hình NGFW thực hiện Packet Inspection, Stateful Inspection, DPI, IPS/IDS, Anti-DDoS, lọc URL/nội dung, kiểm soát băng thông, VPN và mã hóa để phát hiện và ngăn chặn các cuộc tấn công mạng bảo vệ hệ thống mạng nội bộ trong quá trình truyền nhận dữ liệu), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.49; có hiệu lực từ ngày ký'
