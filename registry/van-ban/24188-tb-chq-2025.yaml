ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị tường lửa thế hệ mới để phát hiện và ngăn chặn các cuộc tấn công mạng bảo vệ hệ thống mạng nội bộ dùng cho hệ thống hữu tuyến kỹ thuật số (ký, mã hiệu Axgate 13000S; khung rackmount 2U, CPU 16 Core 2.9 GHz x 2, RAM 96GB, SSD 250GB + 4TB, 4 cổng 10GBASE-R, 8 cổng 1GBASE-R, hệ điều hành AOS, băng thông tường lửa 320 Gbps, tích hợp DPI, IPS/IDS, Anti-DDoS, VPN) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.49.'
