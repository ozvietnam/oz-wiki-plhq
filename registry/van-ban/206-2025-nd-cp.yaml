# Sổ đăng ký văn bản — crawl từ vanban.chinhphu.vn (sheet HT biểu thuế)
so_hieu: 206/2025/NĐ-CP
loai: NGHI_DINH
ten: Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân Lào giai đoạn 2025 - 2030
co_quan: CP
ngay_ban_hanh: '2025-07-15'
hieu_luc_tu: '2025-07-15'
het_hieu_luc_tu: '2030-02-24'
tinh_trang: CON_HIEU_LUC
nhanh:
  - thue/bieu-thue
