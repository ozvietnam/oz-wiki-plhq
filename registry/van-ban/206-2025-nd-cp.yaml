xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=214630), toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/206-2025-nd-cp.pdf, 17 trang, 10 Điều + Phụ lục I, II, III, Phó Thủ tướng Hồ Đức Phớc ký, SHA-256 c9b84dd5d8ae49e663884f4038262aa5b508c050ac8c7ba7202b8cc1218e7992) và trang wiki/sources/206-2025-nd-cp.md: Nghị định 206/2025/NĐ-CP ban hành 15-07-2025, có hiệu lực từ ngày ký ban hành 15-07-2025 đến hết ngày 24-02-2030 theo khoản 1 Điều 9 (khoản 2 Điều 9 quy định xử lý tiền thuế nộp thừa đối với tờ khai đăng ký từ 24-02-2025 đến trước ngày Nghị định có hiệu lực; khoản 3 Điều 9 bãi bỏ NĐ 127/2022/NĐ-CP); đối chiếu đang còn hiệu lực về Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại Việt Nam - Lào giai đoạn 2025 - 2030'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định thuế suất thuế nhập khẩu ưu đãi đặc biệt và điều kiện hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định Thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân Lào (sau đây viết tắt là Hiệp định Thương mại Việt Nam - Lào) từ ngày 24 tháng 02 năm 2025 đến hết ngày 24 tháng 02 năm 2030.'
    - dieu: 2
      noi_dung: '1. Người nộp thuế theo quy định của Luật Thuế xuất khẩu, thuế nhập khẩu. 2. Cơ quan hải quan, công chức hải quan. 3. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hàng hóa xuất khẩu, nhập khẩu.'
    - dieu: 3
      noi_dung: 'Ban hành kèm theo Nghị định này: 1. Phụ lục I - Danh mục hàng hóa được hưởng ưu đãi giảm 50% thuế suất ATIGA của Việt Nam theo Hiệp định Thương mại Việt Nam - Lào. 2. Phụ lục II - Danh mục hàng hóa không được hưởng ưu đãi thuế quan theo Hiệp định Thương mại Việt Nam - Lào. 3. Phụ lục III - Danh mục hàng hóa được hưởng chế độ hạn ngạch thuế quan hàng năm theo Hiệp định Thương mại Việt Nam - Lào.'
    - dieu: 4
      noi_dung: 'Hàng hóa nhập khẩu có xuất xứ từ Lào, trừ hàng hóa nhập khẩu thuộc Danh mục hàng hóa quy định tại Phụ lục I, Phụ lục II và Phụ lục III ban hành kèm theo Nghị định này, được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm) nếu đáp ứng các điều kiện quy định tại Điều 8 Nghị định này.'
    - dieu: 5
      noi_dung: 'Hàng hóa nhập khẩu từ Lào, thuộc danh mục hàng hóa quy định tại Phụ lục I ban hành kèm theo Nghị định này được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt bằng 50% thuế suất Hiệp định Thương mại hàng hóa ASEAN (ATIGA) quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định số 126/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ ban hành Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại Hàng hóa ASEAN giai đoạn 2022 - 2027 nếu đáp ứng các điều kiện quy định tại Điều 7 và Điều 8 Nghị định này. Trong trường hợp thuế suất ATIGA cao hơn thuế suất thuế nhập khẩu ưu đãi quy định tại Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khẩu ngoài hạn ngạch thuế quan của Chính phủ tại thời điểm nhập khẩu và các văn bản sửa đổi, bổ sung (nếu có) (sau đây gọi là Biểu thuế MFN) thì áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt bằng 50% thuế suất quy định tại Biểu thuế MFN.'
    - dieu: 6
      noi_dung: 'Hàng hóa thuộc Phụ lục II ban hành kèm theo Nghị định này sẽ không được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định Thương mại Việt Nam - Lào khi nhập khẩu vào Việt Nam.'
    - dieu: 7
      khoan: 1
      noi_dung: '1. Đối với mặt hàng lúa gạo - mã số HS 10.06 (03 dòng hàng HS 8 số chi tiết tại Phụ lục III ban hành kèm theo Nghị định này): a) Mặt hàng lúa gạo có xuất xứ từ Lào nhập khẩu trong hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng điều kiện quy định tại Điều 8 Nghị định này và quy định của Bộ Công Thương về việc nhập khẩu theo hạn ngạch thuế quan thì được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm). b) Mặt hàng lúa gạo có xuất xứ từ Lào nhập khẩu vượt số lượng hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng các điều kiện quy định tại Điều 8 Nghị định này thì số lượng nhập khẩu vượt hạn ngạch thuế quan áp dụng mức thuế suất quy định tại Điều 5 của Nghị định này.'
    - dieu: 7
      khoan: 2
      noi_dung: '2. Đối với mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá - mã số HS 24.01 (13 dòng hàng HS 8 số chi tiết tại Phụ lục III ban hành kèm theo Nghị định này): a) Mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá có xuất xứ từ Lào thuộc danh mục hàng hóa nhập khẩu áp dụng chế độ hạn ngạch thuế quan quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng điều kiện quy định tại Điều 8 của Nghị định này và quy định của Bộ Công Thương về việc nhập khẩu theo hạn ngạch thuế quan thì được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm). b) Mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá có xuất xứ từ Lào nhập khẩu vào Việt Nam vượt số lượng hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này thì không được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định Thương mại Việt Nam - Lào.'
    - dieu: 7
      khoan: 3
      noi_dung: '3. Đối với mặt hàng đường và các sản phẩm có liên quan - mã số HS 17.01 (5 dòng hàng HS 8 số chi tiết tại Phụ lục I ban hành kèm theo Nghị định này): a) Mặt hàng đường và các sản phẩm có liên quan có xuất xứ từ Lào quy định tại Phụ lục I ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng đủ các điều kiện quy định tại Điều 8 Nghị định này và số lượng nhập khẩu nằm trong hạn ngạch theo quy định của Bộ Công Thương về việc nhập khẩu theo hạn ngạch thuế quan thì được hưởng ưu đãi giảm 50% thuế suất nhập khẩu ATIGA. b) Mặt hàng đường và các sản phẩm có liên quan xuất xứ từ Lào quy định tại Phụ lục I ban hành kèm theo Nghị định này khi nhập khẩu vượt số lượng hạn ngạch theo quy định của Bộ Công Thương khi nhập khẩu vào Việt Nam thì không được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định Thương mại Việt Nam - Lào.'
    - dieu: 8
      noi_dung: 'Hàng hóa nhập khẩu quy định tại Điều 4, Điều 5 và Điều 7 của Nghị định này được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định Thương mại Việt Nam - Lào phải đáp ứng đủ các điều kiện sau: 1. Được nhập khẩu từ Lào vào Việt Nam. 2. Đáp ứng các quy định về xuất xứ hàng hóa (bao gồm cả quy định về vận chuyển trực tiếp) và có Giấy chứng nhận xuất xứ hàng hóa mẫu S (C/O form S) do cơ quan có thẩm quyền của Lào cấp, theo quy định của Hiệp định Thương mại Việt Nam - Lào.'
    - dieu: 9
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực từ ngày ký ban hành đến hết ngày 24 tháng 02 năm 2030.'
    - dieu: 9
      khoan: 2
      noi_dung: '2. Đối với hàng hóa được nhập khẩu từ Lào vào Việt Nam và đăng ký tờ khai hải quan nhập khẩu từ ngày 24 tháng 02 năm 2025 đến trước ngày Nghị định này có hiệu lực thi hành, nếu đáp ứng đủ các điều kiện để được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo quy định tại Nghị định này và nếu đã nộp thuế theo mức thuế cao hơn thì được cơ quan hải quan xử lý tiền thuế nộp thừa theo quy định của pháp luật về quản lý thuế.'
    - dieu: 9
      khoan: 3
      noi_dung: '3. Nghị định này bãi bỏ Nghị định số 127/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ về Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân Lào từ ngày 30 tháng 12 năm 2022 đến ngày 04 tháng 10 năm 2023.'
    - dieu: 10
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này./.'
