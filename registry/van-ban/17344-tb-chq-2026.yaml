  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/11/VB_17344.pdf, id=104621, 5 trang, SHA-256 0214b04ba29fc0b0cdc9eb06c055d903e5b9339110efe43e6ebe24c2555842a6): Thông báo số 17344/TB-CHQ ngày 10-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Băng keo hai mặt DS10A1 (Double-sided Adhesive Tape DS10A1, ký mã hiệu DS10A1; dạng cuộn jumbo bán thành phẩm dùng để chia cuộn nhỏ slitting hoặc gia công die-cut, kích thước dày 140 µm, rộng 1020 mm, dài 1000 m; thành phần theo trọng lượng gồm 2 lớp dính Acrylic Polymer ~52,6%, chất nền giấy Tissue 5,8%, lớp release Silicone 0,4%, lớp giấy chống dính Blank Paper 41,2%; dùng để dán liên kết các vật liệu như nhựa, kim loại, giấy, vải, dán màn hình, bảng mạch, linh kiện), phân loại vào nhóm 35.06, phân nhóm 3506.91, mã số 3506.91.90; có hiệu lực kể từ ngày ban hành'
