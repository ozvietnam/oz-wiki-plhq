xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 517+518 và 519+520 ngày 17-04-2024 (có lớp chữ) và tệp ký số 34-nd-cp.signed.pdf trên vanban.chinhphu.vn (docid=210000): số hiệu 34/2024/NĐ-CP, trích yếu, ngày ký 31-03-2024, người ký Phó Thủ tướng Trần Hồng Hà; cấu trúc 6 Chương / 35 Điều / 5 Phụ lục (Phụ lục I: Danh mục hàng nguy hiểm phân theo số hiệu UN, loại/nhóm hàng và số hiệu nguy hiểm, không có cột mã HS). Điều 34 (Hiệu lực thi hành, tr. 24–25 Công báo 517+518): "1. Nghị định này có hiệu lực thi hành kể từ ngày 15 tháng 5 năm 2024 và thay thế Nghị định số 42/2020/NĐ-CP ngày 08 tháng 4 năm 2020 của Chính phủ quy định danh mục hàng hóa nguy hiểm, vận chuyển hàng hóa nguy hiểm bằng phương tiện giao thông cơ giới đường bộ và vận chuyển hàng hóa nguy hiểm trên đường thủy nội địa (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=199749). 2. Các tổ chức, cá nhân đã được cấp Giấy phép vận chuyển hàng hóa nguy hiểm trước ngày Nghị định này có hiệu lực thi hành tiếp tục được sử dụng, không phải thực hiện cấp lại cho đến khi hết hiệu lực của Giấy phép hoặc đến khi thực hiện cấp lại." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn và vanban.chinhphu.vn: từ ngày 01-01-2025, Nghị định số 161/2024/NĐ-CP ngày 18-12-2024 của Chính phủ quy định Danh mục hàng hóa nguy hiểm, vận chuyển hàng hóa nguy hiểm và trình tự, thủ tục cấp giấy phép, cấp giấy chứng nhận hoàn thành chương trình tập huấn cho người lái xe hoặc người áp tải vận chuyển hàng hóa nguy hiểm trên đường bộ (https://vanban.chinhphu.vn/?pageid=27160&docid=212127, https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/12/161_2024_nd-cp_18122024-signed.pdf) sửa đổi, bổ sung một số quy định của NĐ 34/2024/NĐ-CP để tách phần vận chuyển hàng hóa nguy hiểm trên đường bộ sang NĐ 161/2024/NĐ-CP; NĐ 34/2024/NĐ-CP tiếp tục CON_HIEU_LUC đối với phạm vi vận chuyển hàng hóa nguy hiểm trên đường thủy nội địa.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Biểu thuế XNK Tổng cục (nhu-cau/bieu-thue-van-ban.json) liệt kê số hiệu 34/2024/NĐ-CP với vai trò HIEN_HANH (0 mã HS) nhưng gắn nhầm dòng mô tả nội dung của Điều 5 NĐ 33/2024/NĐ-CP ("Danh mục hóa chất Bảng 1,2,3 / Danh mục hóa chất nhập khẩu phải khai báo... / Hóa chất cấm đầu tư kinh doanh..."). Trên thực tế nguồn bậc A, NĐ 34/2024/NĐ-CP do Bộ Giao thông vận tải trình, quy định Danh mục hàng hóa nguy hiểm theo số hiệu Liên hợp quốc (UN) và số hiệu nguy hiểm (không có bảng mã HS), phục vụ kiểm tra, giám sát vận chuyển hàng nguy hiểm (xếp nhánh hai-quan/kiem-tra-giam-sat). Văn bản bị thay thế toàn bộ là NĐ 42/2020/NĐ-CP ngày 08-04-2020 (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=199749) và văn bản sửa đổi, bổ sung một phần từ 01-01-2025 là NĐ 161/2024/NĐ-CP ngày 18-12-2024 (https://vanban.chinhphu.vn/?pageid=27160&docid=212127) đều chưa có mục riêng trong sổ nên ghi nhận kèm URL tại pham_vi và ghi_chu, không đưa vào quan_he.'
