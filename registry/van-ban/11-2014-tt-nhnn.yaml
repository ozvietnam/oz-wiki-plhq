  pham_vi: 'Đối chiếu PDF ký số Chính phủ 5 trang đã OCR (SHA-256 ebe6fa4db2caa7959316f617ffa6246aa767a45fb75c080bb0dfde6c52839916): ban hành 28-03-2014, hiệu lực từ 15-05-2014 (Điều 6), thay thế Quyết định 1165/2001/QĐ-NHNN.'
