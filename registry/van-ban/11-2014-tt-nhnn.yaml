  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh va đối tượng áp dụng Thông tư này quy định việc mang theo vàng miếng, vàng nguyên liệu, vàng trang sức, mỹ nghệ khi xuất cảnh, nhập cảnh trong các trường hợp sau:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Mang vàng khi xuất cảnh, nhập cảnh bằng hộ chiếu 1. Cá nhân Việt Nam và cá nhân nước ngoài xuất cảnh, nhập cảnh bằng hộ chiêu không được phép mang theo vàng miệng, vàng nguyên liệu. Trường |
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Mang vàng khi xuất cảnh, nhập cảnh bằng giấy thông hành biên giới, giấy thông hành nhập xuất cánh, chứng minh thư biên giới 1. Cá nhân Việt Nam và cá nhân nước ngoài khi xuất cảnh, nhập cảnh bằng giấy thông hành biên giới, giấy thông hành nhập xuất cảnh, chứng minh thư biên giới không được mang theo vàng nguyên liệu,-vàng miếng, vàng trang sức, mỹ nghệ trừ trường hợp quy định tại khoản 2 Điều này.
      trang_pdf: 2
    - dieu: 4
      noi_dung: 'Điều 4. Mang vàng khi xuất cảnh, nhập cảnh trong trường hợp định cư 1. Cá nhân nước ngoài được phép định cư ở Việt Nam khi nhập cảnh mang theo vàng nguyên liệu, vàng miếng, vàng trang sức, mỹ nghệ có tong khôi lượng từ 300g (ba trăm gam) trở lên phải khai báo với cơ quan Hải quan. 2. Cá nhân Việt Nam được phép định cư ở nước ngoài khi xuất cảnh được mang theo vàng (vàng nguyên liệu, vàng miếng, vàng trang sức, mỹ nghệ) theo quy định sau:'
      trang_pdf: 2
    - dieu: 5
      noi_dung: 'Điều 5. Thủ tục cấp giấy phép mang vàng khi xuất cảnh định cư ở nước ngoài 1. Cá nhân Việt Nam được phép định cư ở nước ngoài có nhu cầu mang vàng khi xuất cảnh theo quy định tại điểm b khoản 2 Điều 4 Thông tư này phải gửi trực tiếp hoặc qua đường bưu điện 01 (một) bộ hồ sơ đến Ngân hàng Nhà nước chi nhánh tỉnh, thành phố trực thuộc Trung ương nơi cá nhân đó cư trú. Hồ sơ gồm:'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 15 tháng S năm 2014 và thay thê Quyét định số 1165/2001/QD- NHNN naày 12/9/2001 của Thông doc Ngân hàng Nhà nước về việc mang vàng của cá nhân khi xuất cảnh, nhập cảnh.
      trang_pdf: 3
ghi_chu: Quy định định mức và hồ sơ mang vàng của cá nhân khi xuất cảnh, nhập cảnh.
