xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo (id=915) và quan hệ trong sổ: Luật Xử lý vi phạm hành chính số 15/2012/QH13 thông qua ngày 20-06-2012; đối chiếu đang còn hiệu lực (đã được sửa đổi, bổ sung một số điều bởi Luật 67/2020/QH14, Luật 56/2024/QH15 và Luật 88/2025/QH15)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về xử phạt vi phạm hành chính và các biện pháp xử lý hành chính.
      trang_pdf: 1
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Vi phạm hành chính là hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định của pháp luật về quản lý nhà nước mà không phải là tội phạm và theo quy định của pháp luật phải bị xử phạt vi phạm hành chính.'
      trang_pdf: 1
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 3
      noi_dung: 'Điều 3. Nguyên tắc xử lý vi phạm hành chính 1. Nguyên tắc xử phạt vi phạm hành chính bao gồm: a) Mọi vi phạm hành chính phải được phát hiện, ngăn chặn kịp thời và phải bị xử lý nghiêm minh, mọi hậu quả do vi phạm hành chính gây ra phải được khắc phục theo đúng quy định của pháp luật; b) Việc xử phạt vi phạm hành chính được tiến hành nhanh chóng, công khai, khách quan, đúng thẩm quyền, bảo đảm công bằng, đúng quy định của pháp luật;'
      trang_pdf: 3
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 23
      noi_dung: Điều 23. Phạt tiền 1. Mức phạt tiền trong xử phạt vi phạm hành chính từ 50.000 đồng đến 1.000.000.000 đồng đối với cá nhân, từ 100.000 đồng đến 2.000.000.000 đồng đối với tổ chức, trừ trường hợp quy định tại khoản 3 Điều 24 của Luật này.
      trang_pdf: 14
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 43
      noi_dung: 'Điều 43. Thẩm quyền của Kiểm lâm 1. Kiểm lâm viên đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 500.000 đồng.'
      trang_pdf: 26
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 62
      noi_dung: Điều 62. Chuyển hồ sơ vụ vi phạm có dấu hiệu tội phạm để truy cứu trách nhiệm hình sự 1. Khi xem xét vụ vi phạm để quyết định xử phạt vi phạm hành chính, nếu xét thấy hành vi vi phạm có dấu hiệu tội phạm, thì người có thẩm quyền xử phạt phải chuyển ngay hồ sơ vụ vi phạm cho cơ quan tiến hành tố tụng hình sự.
      trang_pdf: 41
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 82
      noi_dung: 'Điều 82. Xử lý tang vật, phương tiện vi phạm hành chính bị tịch thu 1. Tang vật, phương tiện vi phạm hành chính bị tịch thu được xử lý như sau: a) Đối với tang vật vi phạm hành chính là tiền Việt Nam, ngoại tệ, chứng chỉ có giá, vàng, bạc, đá quý, kim loại quý thì phải nộp vào ngân sách nhà nước;'
      trang_pdf: 51
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 101
      noi_dung: 'Điều 101. Lập hồ sơ đề nghị áp dụng biện pháp đưa vào cơ sở giáo dục bắt buộc 1. Việc lập hồ sơ đề nghị áp dụng biện pháp đưa vào cơ sở giáo dục bắt buộc đối với đối tượng quy định tại Điều 94 của Luật này được thực hiện như sau: a) Đối với người vi phạm có nơi cư trú ổn định thì Chủ tịch Ủy ban nhân dân cấp xã nơi người đó cư trú lập hồ sơ đề nghị áp dụng biện pháp đưa vào cơ sở giáo dục bắt buộc.'
      trang_pdf: 62
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 121
      noi_dung: Điều 121. Huỷ bỏ hoặc thay thế biện pháp ngăn chặn và bảo đảm xử lý vi phạm hành chính 1. Trường hợp việc áp dụng biện pháp ngăn chặn và bảo đảm xử lý vi phạm hành chính không còn phù hợp với mục đích và điều kiện áp dụng theo quy định của Luật này thì quyết định áp dụng biện pháp đó phải được huỷ bỏ.
      trang_pdf: 73
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
    - dieu: 141
      noi_dung: Điều 141. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2013, trừ các quy định liên quan đến việc áp dụng các biện pháp xử lý hành chính do Tòa án nhân dân xem xét, quyết định thì có hiệu lực kể từ ngày 01 tháng 01 năm 2014.
      trang_pdf: 88
      sha256_pdf: f7976dbe499aa641266c631553b1b300d2c6059f09903a943037a112c8cf2fba
