xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=218769), toàn văn PDF ký số (83-btc.signed.pdf, 29 trang, 4 chương 16 điều và Phụ lục 8 biểu mẫu, Thứ trưởng Nguyễn Đức Chi ký) và cổng Cục Hải quan KV03: ban hành 30-06-2026, có hiệu lực từ 01-07-2026 (khoản 1 Điều 15); khoản 2 Điều 15 bãi bỏ toàn bộ Thông tư 12/2015/TT-BTC, Thông tư 22/2019/TT-BTC và Thông tư 25/2026/TT-BTC kể từ ngày 01-07-2026'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định về tiêu chuẩn hoạt động đại lý làm thủ tục hải quan, tiêu chuẩn nhân viên dai lý làm thủ tục hải quan; tổ chức thi, cấp chứng chỉ nghiệp vụ khai hải quan; quản lý hoạt động đại lý làm thủ tục hải quan, nhân viên đại lý làm thủ tục hải quan.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 2. Nhân viên đại lý làm thủ tục hải quan. 3. Tô chức, cá nhân sử dụng dịch vụ đại lý làm thủ tục hải quan. 4. Người dự thi cấp chứng chỉ nghiệp vụ khai hải quan. 5. Công chức hải quan và cơ quan hải quan các cấp. 6. Té chức, cá nhân khác có liên quan đến việc thi, cấp, quan lý chứng chỉ nghiệp vụ khai hải quan; cập nhật kiến thức của người tham gia hoạt động kinh doanh dịch vụ đại lý làm thủ tục hải quan.
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Tiêu chuẩn hoạt động đại lý làm thú tục hải quan, tiêu chuẩn nhân viên đại lý làm thủ tục hải quan 1. Tiêu chuan đối với dai lý làm thủ tục hải quan: a) Là doanh nghiệp được thành lập và đang hoạt động theo quy định của pháp luật. Người đứng tên thành lập doanh nghiệp không thuộc trường hợp quy định tại điểm g khoản 6 Điều 11 Thông tư nay;'
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Thi cấp chứng chi nghiệp vụ khai hai quan 1. Căn cứ thông báo của Hội đồng thi, người đăng ký dự thi cấp chứng chỉ nghiệp vụ khai hải quan qua hệ thống dịch vụ công trực tuyến Cục Hải quan theo mẫu số 01 ban hành kèm theo Thông tư này, bằng tốt nghiệp trình độ cao đăng trở lên và một (01) ảnh màu 3x4cm chụp trong thời gian 03 (ba) tháng tính đến thời điểm dự thi dé thực hiện việc cấp chứng chỉ nghiệp vụ khai
      trang_pdf: 3
    - dieu: 7
      noi_dung: Điều 7. Hoạt động của đại lý làm thủ tục hải quan 1. Đại lý làm thủ tục hải quan là doanh nghiệp đáp ứng đủ tiêu chuẩn quy định tại khoản 1 Điều 3 Thông tư này, trong phạm vi được ủy quyền theo thỏa thuận trong hợp đồng ký với người có hàng hóa xuất khẩu, nhập khẩu (sau đây gọi là chủ hàng), thay mặt chủ hàng thực hiện toàn bộ hoặc một phần nghĩa vụ của người khai hải quan quy định tại khoản 3 Điều 18 Luật Hải quan.
      trang_pdf: 6
    - dieu: 8
      noi_dung: 'Điều 8. Tạm dừng, thu hồi quyền hoạt động đại lý làm thủ tục hải quan 1. Tạm dừng quyên hoạt động đại lý làm thủ tục hải quan trên hệ thong xử ly dữ liệu điện tử hải quan a) Đại lý làm thủ tục hải quan bị tạm dừng quyền hoạt động đại lý làm thủ tục hải quan trên hệ thông xử lý dữ liệu điện tử hải quan trong các trường hợp sau đây:'
      trang_pdf: 7
    - dieu: 10
      noi_dung: Điều 10. Quyền, trách nhiệm của chủ hàng 1. Cung cấp đầy đủ, chính xác các chứng từ, thông tin cần thiết cho việc làm thủ tục hải quan của lô hàng xuât khâu, nhập khâu cho đại lý làm thủ tục hải quan. 2. Chịu trách nhiệm trước pháp luật về các chứng từ thuộc hồ sơ hải quan cung cap cho dai lý làm thủ tục hải quan.
      trang_pdf: 10
    - dieu: 11
      noi_dung: Điều 11. Mã số nhân viên đại lý làm thủ tục hải quan 1. Nhân viên đại lý làm thủ tục hải quan đáp ứng đủ tiêu chuẩn quy định tại khoản 2 Điêu 3 Thông tư này và được đại lý làm thủ tục hải quan gửi thông báo đáp ứng đủ tiêu chuẩn theo Mẫu số 06 ban hành kèm Thông tư này kèm tài liệu chứng minh đến Cục Hải quan qua hệ thống dịch vụ công trực tuyến của Cục Hải quan thì được cấp mã sô nhân viên đại lý làm thủ tục hải quan.
      trang_pdf: 11
    - dieu: 13
      noi_dung: Điều 13. Quản lý và sử dụng mã số nhân viên đại lý làm thủ tục hải quan 1. Mã số nhân viên đại lý làm thủ tục hải quan được Cục trưởng Cục Hải quan cấp được cập nhật vào hệ thống của cơ quan hải quan.
      trang_pdf: 14
    - dieu: 15
      noi_dung: Điều 15. Điều khoản thi hành 1. Thông tư này có hiệu lực ké từ ngày 01 tháng 7 năm 2026. 2. Thông tư này bãi bỏ toàn bộ các Thông tư sau
      trang_pdf: 15
ghi_chu: Trinh sát đêm 10/11, đối chiếu nguồn A ngày 14/11. Đại lý HQ chuyển quản lý công nhận → tiêu chuẩn thông báo (Luật HQ sửa đổi bởi Luật 90/2025/QH15). Khoản 2 Điều 15 bãi bỏ toàn bộ 12/2015/TT-BTC, 22/2019/TT-BTC và 25/2026/TT-BTC từ 01-07-2026 (22/2019/TT-BTC chưa có mục riêng trong sổ nên ghi nhận tại pham_vi).
