xac_minh:
  muc: NGUON_A
  pham_vi: số hiệu, trích yếu, ngày ban hành 01-07-2024, hiệu lực 01-07-2024 và tệp 09-ttg.signed.pdf trên vanban.chinhphu.vn (docid=210557); còn hiệu lực
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Quyết định này quy định về điều kiện, hồ sơ, thủ tục đề nghị chấp thuận mức cap tín dụng tối đa vượt giới hạn của tổ chức tín dung, chi nhánh ngân hàng nước ngoài đối với một khách hàng, một khách hàng và người có liên quan của khách hàng đó theo quy định tại khoản 1, khoản 2 và khoản 7 Điều 136 Luật Các tổ chức tín dụng năm 2024.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng „1 Tổ chức tín dụng, chỉ nhánh ngân hàng nước ngoài (sau đây gọi tắt là tô chức tín dụng) bao gom: a) Ngân hàng: Ngân hàng thương mại, ngân hàng hợp tác xã, ngân hàng liên doanh, ngân hàng 100% von nước ngoài;'
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Điều kiện xem xét chấp thuận khoản cấp tín dụng vượt giới hạn 1. Khách hàng vay vốn, dự án, phương án được đề nghị cấp tín dụng vượt giới hạn đáp ứng các điêu kiện sau:'
      trang_pdf: 2
    - dieu: 4
      noi_dung: 'Điều 4. Hồ sơ đề nghị cấp tín dụng vượt giới hạn 1. Hồ sơ tổ chức tin dụng báo cáo Ngân hang Nhà nước Việt Nam: Hồ sơ dé nghị cấp tín dụng vượt giới hạn của tổ chức tin dụng đối với một khách hàng, một khách hàng và người có liên quan của khách hàng đó gửi Ngân hàng Nhà nước Việt Nam là bản sao được cấp từ số gốc hoặc bản sao có chứng thực hoặc bản sao có dẫu xác nhận của tổ chức tín dụng, bao gồm:'
      trang_pdf: 3
    - dieu: 5
      noi_dung: 'Điều 5. Xác định mức cấp tín dụng tối đa vượt giới hạn Mức cấp tín dụng tối đa vượt giới hạn đối với một khách hàng, một khách hàng và người có liên quan của khách hàng đó được xác định theo công thức: MCTDTD = TMDN + DN'
      trang_pdf: 4
    - dieu: 6
      noi_dung: 'Điều 6. Thủ tục xem xét cấp tín dụng vượt giới hạn 1. Tổ chức tín dụng gửi Ngân hàng Nhà nước Việt Nam 01 bộ hồ sơ theo quy định tại khoản 1 Điều 4 Quyết định này trực tiếp tại Bộ phận một cửa hoặc qua dịch vụ bưu chính. 2. Trong thời hạn 15 ngày, ké từ ngày nhận được day đủ hồ sơ của tổ chức tín dụng:'
      trang_pdf: 5
    - dieu: 7
      noi_dung: Điều 7. Tổ chức thực biện 1. Ngân hàng Nhà nước Việt Nam a) Chịu trách nhiệm thâm định hé sơ do tổ chức tín dụng cung cấp và trình Thủ tướng Chính phủ xem xét quyết định đối với đề nghị câp tín dụng vượt giới han của tổ chức tin dụng, mức cấp tín dụng tối đa vượt giới hạn, dam bảo tuân thủ các điều kiện, thủ tục theo quy định tại Quyết định này; b) Thanh tra, giám sát việc thực hiện cấp tín dụng vượt giới hạn của tổ chức tín dụng;
      trang_pdf: 6
    - dieu: 8
      noi_dung: Điều 8. Quy định chuyến tiếp Các trường hợp cấp tín dụng vượt giới hạn đã được Thủ tướng Chính phủ phê duyệt trước ngày Quyết định này có hiệu lực tiếp tục thực hiện theo các văn bản phê duyệt trước đó.
      trang_pdf: 7
    - dieu: 9
      noi_dung: Điều 9. Hiệu lực thi hành 1. Quyết định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2024. 2. Quyết định này thay thế Quyết định số 13/2018/QĐ-TTg ngày 06 tháng 3 năm 2018 của Thủ tướng Chính phủ quy định về điều kiện, hồ sơ, trình tự đề nghị chấp thuận mức cấp tín dụng tối đa vượt giới hạn của tổ chức tín dung, chi nhánh ngân hàng nước ngoài.
      trang_pdf: 7
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Hội đồng thành viên, Chủ tịch Hội đồng quản trị, Tổng giám đốc (Giám đốc) các tổ chức tín dụng và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Quyết định này.
      trang_pdf: 8
ghi_chu: Quyết định của Thủ tướng Chính phủ hướng dẫn Luật Các tổ chức tín dụng 2024 về thủ tục đề nghị chấp thuận mức cấp tín dụng tối đa vượt giới hạn.
