# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 09/2024/QĐ-TTg
loai: QUYET_DINH
ten: Quy định về điều kiện, hồ sơ, thủ tục đề nghị chấp thuận mức cấp tín dụng tối đa vượt giới hạn của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài
co_quan: TTG
ngay_ban_hanh: '2024-07-01'
hieu_luc_tu: '2024-07-01'
