  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Vị trí và chức năng Bộ Xây dựng là cơ quan của Chính phủ, thực hiện chức năng quản lý nhà nước về: Quy hoạch xây dựng, kiến trúc; hoạt động đầu tư xây dựng; phát triển đô thị; hạ tầng kỹ thuật; nhà ở; thị trường bất động sản; vật liệu xây dựng; giao thông vận tải đường bộ, đường sắt, đường thủy nội địa, hàng hải, hàng không dân dụng trong phạm vi cả nước;'
      trang_pdf: 1
      sha256_pdf: 6782947013c11e78532c39cd6b147665204c62c6c19db099088cd8345dfe883e
    - dieu: 2
      noi_dung: 'Điều 2. Nhiệm vụ và quyền hạn Bộ Xây dựng thực hiện các nhiệm vụ, quyền hạn theo quy định của Luật Tổ chức Chính phủ, quy định của Chính phủ về chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của bộ, cơ quan ngang bộ và những nhiệm vụ, quyền hạn cụ thể sau đây: 1. Trình Chính phủ dự án luật, dự thảo nghị quyết của Quốc hội, dự án pháp lệnh, dự thảo nghị quyết của Ủy ban Thường vụ Quốc hội;'
      trang_pdf: 1
      sha256_pdf: 6782947013c11e78532c39cd6b147665204c62c6c19db099088cd8345dfe883e
    - dieu: 3
      noi_dung: Điều 3. Cơ cấu tổ chức 1. Văn phòng. 2. Thanh tra. 3. Vụ Hợp tác quốc tế. 4. Vụ Pháp chế. 5. Vụ Tổ chức cán bộ. 6. Vụ Kế hoạch - Tài chính. 7. Vụ Quy hoạch - Kiến trúc. 8. Vụ Vận tải và An toàn giao thông. 9. Vụ Khoa học công nghệ, môi trường và Vật liệu xây dựng. 10. Cục Kinh tế - Quản lý đầu tư xây dựng. 11. Cục Giám định nhà nước về chất lượng công trình xây dựng.
      trang_pdf: 17
      sha256_pdf: 6782947013c11e78532c39cd6b147665204c62c6c19db099088cd8345dfe883e
    - dieu: 4
      noi_dung: 'Điều 4. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 3 năm 2025. 2. Nghị định này thay thế các Nghị định sau: a) Nghị định số 52/2022/NĐ-CP ngày 08 tháng 8 năm 2022 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Xây dựng; b) Nghị định số 56/2022/NĐ-CP ngày 24 tháng 8 năm 2022 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Giao thông vận tải.'
      trang_pdf: 18
      sha256_pdf: 6782947013c11e78532c39cd6b147665204c62c6c19db099088cd8345dfe883e
    - dieu: 5
      noi_dung: Điều 5. Trách nhiệm thi hành Bộ trưởng Bộ Xây dựng, các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm thi hành Nghị định này./.
      trang_pdf: 19
      sha256_pdf: 6782947013c11e78532c39cd6b147665204c62c6c19db099088cd8345dfe883e
