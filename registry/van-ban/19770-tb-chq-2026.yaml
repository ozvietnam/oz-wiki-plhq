ghi_chu: 'Xác định trước mã số mặt hàng Cảm biến hồng ngoại (IR OPTICS SENSOR, ký mã hiệu IMS1910, gồm vi mạch tích hợp đèn LED hồng ngoại và đi-ốt quang gắn trên bảng mạch in FR-4, tích hợp bộ chuyển đổi ADC, dùng lắp trong tai nghe bluetooth, đồng hồ thông minh, thiết bị cầm tay để nhận diện tiếp xúc với da) thuộc nhóm 90.31, phân nhóm 9031.49, mã số 9031.49.90.'
