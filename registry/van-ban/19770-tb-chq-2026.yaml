xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/7/VB_19770.pdf, id=105349, SHA-256 f3bbfdbd03553e0b65506f069aa976d3a6e594d9e77eb2fa41507bf10975e465): Thông báo số 19770/TB-CHQ ngày 03-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cảm biến hồng ngoại (IR OPTICS SENSOR, ký, mã hiệu IMS1910, kích thước 4,4mm x 3,80mm, trọng lượng 6,8mg, điện áp 1,62-1,98V; cấu tạo gồm vi mạch tích hợp Model W3111 chứa đèn LED hồng ngoại và đi-ốt quang gắn trên lớp nền silicon, bảng mạch in FR-4 2 lớp dày 0,2mm, hợp chất đúc bán dẫn quang học và bộ chuyển đổi tín hiệu ADC tích hợp sẵn; dùng lắp đặt trên tai nghe bluetooth, thiết bị đeo tay thông minh, thiết bị cầm tay để phát hiện thiết bị có đang tiếp xúc với da hay không), phân loại vào nhóm 90.31, phân nhóm 9031.49, mã số 9031.49.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
