xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF ký số của Bộ Tài chính trên Cổng thông tin điện tử Hải quan (files.customs.gov.vn, 78_2026_TT_BTC_30_06_2026.pdf, 10 trang, Thứ trưởng Nguyễn Đức Chi ký ngày 30-06-2026): sửa đổi, bổ sung Điều 3, 5, 8, 9, 10, 11 và thay thế một số cụm từ của Thông tư 203/2014/TT-BTC hướng dẫn xử lý hàng hóa tồn đọng thuộc địa bàn hoạt động hải quan (đồng thời sửa cụm từ tại điểm e, g khoản 4 Điều 7 Thông tư 66/2025/TT-BTC theo khoản 2 Điều 9); khoản 1 Điều 9 quy định có hiệu lực kể từ ngày 01-07-2026, đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đối, bổ sung Điều 3 như sau: “Điều 3. Nguyên tắc quản lý, xử lý hàng hóa tồn đọng 1. Việc xử lý hàng hóa tồn đọng phải tuân theo thời gian, trình tự, thủ tục quy định tại Thông tư này và pháp luật có liên quan. 2. Việc xử lý hàng hóa tồn đọng phải kịp thời, công khai, minh bạch, đúng chế độ quy định.'
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đối, bổ sung Điều 5 như sau: “Điều 5. Xác định hàng hóa mà chủ hàng hóa tuyên bố từ bỏ hoặc thực hiện hành vi chứng tỏ việc từ bỏ 1. Hàng hóa mà chủ hàng hóa tuyên bố từ bỏ là hàng hóa mà chủ hàng hóa có văn bản thông báo từ bỏ; hàng hóa do người vận chuyển bỏ lại dia bàn hoạt động hải quan và người vận chuyển có văn bản từ bỏ quyền lưu giữ.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Sửa đối, bỗ sung Điều 8 như sau: “Điều 8. Thông báo tìm chủ hàng hóa tồn đọng 1. Đối với hàng hóa tồn đọng quy định tại các điểm b, c và d khoản 2 Điều 1 Thông tư này, trong thời hạn 05 ngày làm việc, kể từ ngày nhận được thông báo của doanh nghiệp quản lý hàng hóa tồn đọng về hàng hóa tồn đọng, hải quan cửa khâu/ngoài cửa khẩu nơi quản lý địa bàn lưu giữ hàng hóa tồn đọng phải thông báo về hàng hóa tồn đọng.'
      trang_pdf: 4
    - dieu: 4
      noi_dung: 'Điều 4. Sửa đối, bố sung Điều 9 như sau: “Điều 9. Hội đồng xử lý hàng hóa tồn đọng 1. Chỉ cục trưởng Chỉ cục Hải quan khu vực có trách nhiệm quyết định thành lập Hội đồng thường trực để xử lý hàng hóa tồn đọng. Thành phần Hội đồng thường trực bao gồm: a) Chủ tịch Hội đồng: Lãnh đạo Chi cục Hải quan khu vực; b) Các thành viên: b.1) Lãnh đạo bộ phận chuyên môn nghiệp vụ thuộc Chi cục Hải quan khu vực;'
      trang_pdf: 5
    - dieu: 5
      noi_dung: 'Điều 5. Sửa đối, bo sung Điều 10 như sau: “Điều 10. Nguyên tắc hoạt động của Hội đồng xử lý hàng hóa tồn đọng 1. Hội đồng xử lý hàng hóa tồn đọng làm việc theo nguyên tắc tập thé. Các phiên họp của Hội đồng do Chủ tịch Hội đồng xử lý hàng hóa tồn đọng điều hành và phải có ít nhất 2/3 tổng số thành viên của Hội đồng tham dự. Trường hợp Chủ tịch Hội đồng không tham dự được thì ủy quyền cho Phó Chủ tịch Hội đồng điều hành phiên họp.'
      trang_pdf: 6
    - dieu: 6
      noi_dung: 'Điều 6. Sửa đổi, bổ sung Điều 11 như sau: *Điều 11. Trách nhiệm của Chủ tịch và các thành viên Hội đồng xử lý hàng hóa tồn đọng 1. Chủ tịch Hội đồng xử lý hàng hóa tồn đọng có trách nhiệm: a) Phân công nhiệm vụ cho các thành viên Hội đồng; b) Quyết định thành lập các bộ phận chuyên môn giúp việc cho Hội đồng: c) Quyết định kế hoạch, thời gian thực hiện xử lý hàng hóa tồn đọng; d) Điều hành các phiên họp của Hội đồng;'
      trang_pdf: 7
    - dieu: 7
      noi_dung: Điều 7. Thay thế một cụm từ của Thông tư số 203/2014/TT-BTC hướng dẫn xử lý hàng hóa tồn đọng thuộc địa bàn hoạt động hải quan 1. Thay thế cụm từ “khoản 7 Điều 17 Thông tư này” bằng cụm từ “khoản 2 Điều 42 Nghị định số 77/2025/NĐ-CP" tại khoản 3 Điều 7 Thông tư số 203/2014/TT-BTC. 2. Thay thế cụm từ “Tổng cục Hải quan” bằng cụm từ “Cục Hải quan”; 3. Thay thế cụm từ “Cục Hải quan” bằng cụm từ “Chi cục Hải quan khu ” vực”;
      trang_pdf: 8
    - dieu: 8
      noi_dung: Điều 8. Điều khoản chuyền tiếp 1. Đối với hàng hóa tồn đọng trước ngày Thông tư này có hiệu lực thi hành mà cơ quan có thâm quyền đã ban hành Quyết định xác lập quyền sở hữu toàn dân thì tiếp tục xử lý theo quy định của pháp luật trước ngày Thông tư này có hiệu lực.
      trang_pdf: 9
    - dieu: 9
      noi_dung: Điều 9. Điều khoản thi hành 1. Thông tư này có hiệu lực kể từ ngày 01/7/2026. 2. Thay thế một số cụm từ tại Thông tư số 66/2025/TT-BTC quy định phân cấp thâm quyền quản lý nội ngành của Bộ trưởng Bộ Tài chính trong các lĩnh vực quản lý ngân sách, tài sản công, đầu tư xây dựng, đầu tư ứng dụng công nghệ thông tin
      trang_pdf: 9
ghi_chu: Sửa đổi, bổ sung một số điều của Thông tư 203/2014/TT-BTC ngày 22-12-2014 hướng dẫn xử lý hàng hóa tồn đọng thuộc địa bàn hoạt động hải quan (có hiệu lực từ 01-07-2026 theo khoản 1 Điều 9).
