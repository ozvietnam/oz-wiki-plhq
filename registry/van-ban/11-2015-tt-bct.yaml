  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định về thủ tục cấp giấy phép quá cảnh hàng hóa, vận chuyển hàng hóa quá cảnh theo quy định của Hiệp định giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa nhân dân Trung Hoa về quá cảnh hàng hóa ngày 09 tháng 4 năm 1994 (sau đây viết tắt là Hiệp định).
      trang_pdf: 1
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với cơ quan, tổ chức và cá nhân tham gia các hoạt động có liên quan đến quá cảnh hàng hóa theo quy định của Hiệp định.
      trang_pdf: 1
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 3
      noi_dung: Điều 3. Hàng hóa quá cảnh 1. Hàng hóa cấm xuất khẩu, tạm ngừng xuất khẩu, cấm nhập khẩu, tạm ngừng nhập khẩu không được phép quá cảnh lãnh thổ Việt Nam.
      trang_pdf: 1
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 6
      noi_dung: 'Điều 6. Trình tự, thời hạn giải quyết hồ sơ 1. Đối với thủ tục cấp giấy phép quá cảnh hàng hóa quy định tại Khoản 2 Điều 3 Thông tư này (trừ vật liệu nổ công nghiệp), trình tự, thời hạn giải quyết hồ sơ như sau:'
      trang_pdf: 2
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 8
      noi_dung: Điều 8. Tuyến đường quá cảnh Tuyến đường vận chuyển hàng hóa quá cảnh thực hiện theo quy định tại Thông tư số 15/2014/TT-BGTVT ngày 13 tháng 5 năm 2014 của Bộ Giao thông vận tải hướng dẫn về tuyến đường quá cảnh hàng hóa qua lãnh thổ Việt Nam.
      trang_pdf: 3
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 10
      noi_dung: Điều 10. Chứng từ khi làm thủ tục hải quan cho hàng hóa quá cảnh Chủ hàng hoặc người chuyên chở phải nộp, xuất trình cho cơ quan Hải quan Giấy phép quá cảnh được Bộ Công Thương cấp theo quy định tại Thông tư này, Hợp đồng vận chuyển hàng quá cảnh và các loại chứng từ theo quy định của pháp luật về hải quan.
      trang_pdf: 4
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 12
      noi_dung: Điều 12. Thời gian quá cảnh hàng hóa Hàng hóa quá cảnh được phép lưu lại trên lãnh thổ Việt Nam trong thời gian tối đa là 30 ngày kể từ ngày hoàn thành thủ tục hải quan tại cửa khẩu nhập khẩu, trừ trường hợp được gia hạn thời gian quá cảnh theo quy định tại Điều 13 Thông tư này.
      trang_pdf: 4
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 14
      noi_dung: Điều 14. Thay đổi cửa khẩu quá cảnh hàng hóa 1. Việc thay đổi cửa khẩu xuất khẩu, nhập khẩu trong phạm vi quy định tại Điều 7 Thông tư này do cơ quan cấp giấy phép quá cảnh xem xét, giải quyết.
      trang_pdf: 5
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 16
      noi_dung: Điều 16. Quyền và nghĩa vụ của chủ hàng và người chuyên chở hàng hóa quá cảnh 1. Chủ hàng, người chuyên chở thực hiện hoạt động quá cảnh hàng hóa qua lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam có các quyền và nghĩa vụ theo quy định tại Hiệp định, Thông tư này và các văn bản pháp luật khác có liên quan. 2. Chủ hàng quá cảnh phải nộp lệ phí hải quan và các loại phí khác áp dụng cho hàng hóa quá cảnh theo quy định pháp luật.
      trang_pdf: 7
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
    - dieu: 19
      noi_dung: Điều 19. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 20 tháng 7 năm 2015. 2. Thông tư này thay thế Quyết định số 305/2001/QĐ-BTM ngày 26 tháng 3 năm 2001 của Bộ trưởng Bộ Thương mại ban hành Quy chế về hàng hóa của Cộng hòa nhân dân Trung Hoa quá cảnh lãnh thổ Cộng hòa xã hội chủ nghĩa Việt Nam.
      trang_pdf: 8
      sha256_pdf: 267b934af56ea561fc9af548e2ba78395cf59d1a005a3f928dfbc4758ff21d1a
