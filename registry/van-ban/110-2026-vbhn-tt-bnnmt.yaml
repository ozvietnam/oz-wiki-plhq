xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=220189) và toàn văn PDF ký số (110-vbhn-bnnmt.signed.pdf, 27 trang, 3 chương 12 điều và Phụ lục I–VII, Thứ trưởng Nguyễn Hoàng Hiệp ký): xác thực ngày 03-11-2026 (hiệu đính ngày ban hành từ 02-11-2026 theo đúng thẻ và PDF ký số), đang còn hiệu lực; hợp nhất Thông tư 36/2014/TT-BNNPTNT ngày 31-10-2014 (hiệu lực 01-01-2015) và Thông tư 12/2025/TT-BNNMT ngày 19-06-2025 (hiệu lực 01-07-2025)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Thông tư này quy định về quy trình phân tích nguy cơ dịch hại đối với vật thể thuộc diện kiểm dịch thực vật phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam (sau đây gọi tắt là vật thể phải phân tích nguy cơ).
      trang_pdf: 2
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Vùng phân tích nguy cơ dịch hại là một quốc gia, một phần của quốc gia, hoặc toàn bộ hoặc nhiều phần của vài quốc gia được công nhận chính thức (sau đây gọi tắt là vùng).'
      trang_pdf: 2
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 3
      noi_dung: Điều 3. Yêu cầu chung 1. Đối với vật thể phải phân tích nguy cơ, Cục Trồng trọt và Bảo vệ thực vật sẽ xem xét và quyết định việc thực hiện phân tích nguy cơ trở thành cỏ dại trước khi thực hiện phân tích nguy cơ dịch hại theo Thông tư này; 3
      trang_pdf: 3
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 4
      noi_dung: Điều 4. Kinh phí thực hiện Hàng năm, Nhà nước đảm bảo cấp kinh phí thực hiện phân tích nguy cơ dịch hại đối với vật thể phải phân tích nguy cơ. Chương II QUY TRÌNH PHÂN TÍCH NGUY CƠ DỊCH HẠI
      trang_pdf: 4
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 5
      noi_dung: Điều 5. Giai đoạn khởi đầu quá trình phân tích nguy cơ dịch hại 1. Điểm khởi đầu khi thực hiện phân tích nguy cơ dịch hại a) Xác định đường lan truyền sinh vật gây hại mà theo đó đối tượng kiểm dịch thực vật có thể du nhập, lan rộng; b) Xác định sinh vật gây hại thuộc đối tượng kiểm dịch thực vật.
      trang_pdf: 4
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 6
      noi_dung: Điều 6. Xem xét lại kết quả phân tích nguy cơ dịch hại đã thực hiện 1. Xem xét báo cáo phân tích nguy cơ dịch hại có liên quan đã thực hiện. Nếu đã có sự đánh giá đầy đủ trước đây về phân tích nguy cơ dịch hại thì sử dụng kết quả đó. 2. Xem xét thực trạng hàng hóa cùng loại nhập khẩu từ các nước khác mà đã được phân tích nguy cơ dịch hại.
      trang_pdf: 5
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 7
      noi_dung: Điều 7. Đánh giá nguy cơ trở thành cỏ dại Đánh giá nguy cơ trở thành cỏ dại đối với vật thể phải phân tích nguy cơ có khả năng sử dụng để trồng trọt thực hiện theo quy định tại quy chuẩn kỹ thuật quốc gia.
      trang_pdf: 5
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 8
      noi_dung: '6 1. Phân tích số liệu sinh vật gây hại được phát hiện trên vật thể thuộc diện kiểm dịch thực vật cùng loại đã được nhập khẩu vào Việt Nam: Tổng hợp số liệu về việc phát hiện sinh vật gây hại trên hàng hóa nhập khẩu được thực hiện theo mẫu quy định tại Bảng 1, Phụ lục V ban hành kèm theo Thông tư này.'
      trang_pdf: 6
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 9
      noi_dung: 'Điều 9. Quản lý nguy cơ dịch hại 1. Biện pháp quản lý Trên cơ sở kết quả đánh giá nguy cơ dịch hại đối với vật thể phải phân tích nguy cơ, có sự tham khảo ý kiến của các bên liên quan như: các nhà khoa học, quản lý, sản xuất, nhập khẩu để đưa ra các yêu cầu quản lý cụ thể nhằm giảm thiểu nguy cơ dịch hại như sau: a) Yêu cầu nước xuất khẩu thực hiện các biện pháp kiểm dịch thực vật cụ thể đối với vật thể phải phân tích nguy cơ vào Việt Nam;'
      trang_pdf: 8
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm của Cục Trồng trọt và Bảo vệ thực vật6 1. Xây dựng kế hoạch và tổ chức thực hiện phân tích nguy cơ dịch hại theo quy định tại Thông tư này. 2. Thông báo kết quả phân tích nguy cơ dịch hại bằng văn bản cho cơ quan có thẩm quyền về kiểm dịch thực vật của nước xuất khẩu và các tổ chức, cá nhân liên quan.
      trang_pdf: 9
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 11
      noi_dung: Điều 11. Hiệu lực thi hành Thông tư này có hiệu lực kể từ ngày 01 tháng 01 năm 2015.
      trang_pdf: 10
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
    - dieu: 12
      noi_dung: Điều 12. Tổ chức thực hiện Cục trưởng Cục Trồng trọt và Bảo vệ thực vật7, Thủ trưởng các đơn vị, tổ chức và cá nhân có liên quan chịu trách nhiệm tổ chức thực hiện Thông tư này. Trong quá trình thực hiện, nếu có vướng mắc, đề nghị các cơ quan, tổ chức, cá nhân kịp thời phản ánh về Bộ Nông nghiệp và Môi trường 8 (Cục Trồng trọt và Bảo vệ thực vật9) để tổng hợp, trình Bộ trưởng xem xét, quyết định./.
      trang_pdf: 10
      sha256_pdf: 71a753c890f154b0cc1350a08925621ee7d99281923bf0fda8124d8e174b0451
ghi_chu: Trinh sát đêm 7/11. Quy trình PRA — cổng quyết định có cho nhập nhóm thực vật chưa có trong danh mục. Đủ họ với 109.
