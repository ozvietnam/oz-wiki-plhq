ghi_chu: 'Xác định trước mã số mặt hàng Mô đun camera / Webcam dùng chụp và gửi hình ảnh hàng hóa trên kệ hàng về máy chủ hỗ trợ quản lý cửa hàng (Newton Eye Camera Module, ký mã hiệu EC120THWXC/WWW, độ phân giải FF 5M Pixel 2593x1944 JPEG, góc nhìn tối đa 120 độ, khoảng cách tiêu cự 0.8~3m, kết nối BLE/WiFi 2.4/5GHz, nguồn 5V USB Type-C) thuộc nhóm 85.25, phân nhóm 8525.89, mã số 8525.89.30.'
