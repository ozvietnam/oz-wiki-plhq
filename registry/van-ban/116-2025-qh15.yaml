  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=216499) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (luat116-2025.pdf): Quốc hội thông qua ngày 10-12-2025, có hiệu lực thi hành từ ngày 01-07-2026; đang còn hiệu lực. Đã OCR 37 trang bản scan thành raw/ocr/116-2025-qh15.ocr.txt.'
  hieu_luc_da_doi_chieu: true
