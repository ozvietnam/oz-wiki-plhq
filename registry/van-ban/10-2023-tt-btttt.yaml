  pham_vi: 'đối chiếu PDF trên Cổng Hải quan (id=88775, 8 trang, Bộ trưởng Bộ Thông tin và Truyền thông Nguyễn Mạnh Hùng ký ngày 05-09-2023, SHA-256 af24270b5b54ba9c912efb7640424dd5893dd10def8a4f31081a732a7d7bb8e9): ngưng hiệu lực áp dụng một phần/toàn bộ một số quy chuẩn kỹ thuật (QCVN) tại Phụ lục I và Phụ lục II của Thông tư 04/2023/TT-BTTTT (các điểm 1.1.1, 1.1.2, 1.1.10, 2.1..2.4 Phụ lục I ngưng đến hết 31-12-2023; các điểm 1.1.3..1.1.6, 1.1.8, 1.1.9, 1.1.11, 1.1.12, 1.1.14 Phụ lục I và các điểm tại Phụ lục II ngưng đến hết 30-06-2024); áp dụng hồi tố cho hồ sơ từ 15-07-2023; đã hết thời hạn ngưng hiệu lực từ 01-07-2024 (Điều 1 khoản 3, 4 và Điều 3 khoản 3)'
