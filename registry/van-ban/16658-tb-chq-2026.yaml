ghi_chu: 'Xác định trước mã số mặt hàng chất khơi mào phản ứng (ký mã hiệu Trigonox 93; thành phần theo trọng lượng gồm Tert-Butyl peroxybenzoate 77,5-81,0% và Acetylacetone CAS 123-54-6 19,0-22,5%; dung dịch trong suốt màu vàng nhạt, tỷ trọng ở 20 độ C đạt 1030 kg/m3, độ nhớt 4 mPa.s; dùng làm chất khơi mào gốc tự do trong quá trình trùng hợp và liên kết chéo sản xuất nhựa) thuộc nhóm 38.15, mã số 3815.90.00.'
