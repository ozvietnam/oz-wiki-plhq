  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/26/7.VB_16658.pdf, id=104026, SHA-256 a0bdff856bf8993e7fd1efa5cd6cb0c7fa29a06979deb278e8f1ed27bb8d7b1a): Thông báo số 16658/TB-CHQ ngày 25-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng chất khơi mào phản ứng (phụ gia sản xuất đá nhân tạo / nhựa, ký mã hiệu Trigonox 93; thành phần theo trọng lượng gồm Tert-Butyl peroxybenzoate C6H5COOOC(CH3)3 77,5-81,0% và Acetylacetone CAS 123-54-6 19,0-22,5%; dung dịch trong suốt ở nhiệt độ phòng màu vàng nhạt, mùi thơm, tỷ trọng ở 20 độ C đạt 1030 kg/m3, độ nhớt ở 20 độ C đạt 4 mPa.s, đóng gói trong can nhựa HDPE 30L cho 25 kg; dùng làm chất khơi mào gốc tự do trong các phản ứng trùng hợp và liên kết chéo sản xuất nhựa), phân loại vào nhóm 38.15, mã số 3815.90.00; có hiệu lực từ ngày ký'
