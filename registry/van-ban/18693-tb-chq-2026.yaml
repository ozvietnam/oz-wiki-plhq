  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/13/4.VB_18693.pdf, id=105089, SHA-256 46725b19d1f4f678e95382a16fd6f8599194ee5f871d67369df4951c740c7a73): Thông báo số 18693/TB-CHQ ngày 09-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Máy tách hạt từ quả (trái) tươi (Seed Extraction Machine, ký mã hiệu EMM-1100; cấu tạo gồm phễu nạp liệu bằng kim loại tích hợp đường nước phun, cơ cấu cơ học 04 trục quay gắn chốt kim loại làm vỡ cấu trúc trái mà không làm tổn hại hạt, bộ sàng tách 02 rổ inox kích thước lỗ 1,25–18 mm, bộ cánh đảo bằng vật liệu tổng hợp arnite, thùng thu hạt 65 lít, hệ thống rửa nước ~3600 lít/giờ, khung Inox 304 và nhôm; nguồn điện 380–415V 3 pha, công suất tối đa 5,5 kW, năng suất 50–750 kg quả/giờ, dùng tách đồng thời hạt, dịch quả và phần thịt quả từ các loại quả rau màu và quả vỏ cứng tươi, không sử dụng gia nhiệt hay sấy), phân loại vào nhóm 84.38, mã số 8438.60.00; có hiệu lực kể từ ngày ban hành'
