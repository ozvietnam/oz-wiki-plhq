ghi_chu: 'Xác định trước mã số mặt hàng Máy tách hạt từ quả (trái) tươi (Seed Extraction Machine, ký mã hiệu EMM-1100, sử dụng cơ cấu cơ học làm vỡ cấu trúc trái kết hợp sàng và rửa nước công suất 50–750 kg quả/giờ để tách hạt giống, dịch quả và phần thịt quả mà không làm tổn hại hạt) thuộc nhóm 84.38, mã số 8438.60.00.'
