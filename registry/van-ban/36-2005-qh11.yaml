xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=14765, Chủ tịch Quốc hội Nguyễn Văn An ký) và toàn văn tệp đính kèm (15224_l36qh.rtf): số hiệu 36/2005/QH11, tiêu đề ''Luật Thương mại'', được Quốc hội khóa XI thông qua ngày 14-06-2005 (thẻ Cổng Chính phủ ghi 27-06-2005 theo ngày Lệnh công bố), có hiệu lực thi hành từ ngày 01-01-2006 (Điều 323, thay thế Luật Thương mại ngày 10-05-1997); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Luật Quản lý ngoại thương 05/2017/QH14 và Luật Phòng, chống tác hại của rượu, bia 44/2019/QH14)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Hoạt động thương mại thực hiện trên lãnh thổ nước Cộng hoà xã hội chủ nghĩa Việt Nam. 2. Hoạt động thương mại thực hiện ngoài lãnh thổ nước Cộng hoà xã hội chủ nghĩa Việt Nam trong trường hợp các bên thoả thuận chọn áp dụng Luật này hoặc luật nước ngoài, điều ước quốc tế mà Cộng hoà xã hội chủ nghĩa Việt Nam là thành viên có quy định áp dụng Luật này.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Thương nhân hoạt động thương mại theo quy định tại Điều 1 của Luật này. 2. Tổ chức, cá nhân khác hoạt động có liên quan đến thương mại. 3. Căn cứ vào những nguyên tắc của Luật này, Chính phủ quy định cụ thể việc áp dụng Luật này đối với cá nhân hoạt động thương mại một cách độc lập, thường xuyên không phải đăng ký kinh doanh.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Hoạt động thương mại là hoạt động nhằm mục đích sinh lợi, bao gồm mua bán hàng hoá, cung ứng dịch vụ, đầu tư, xúc tiến thương mại và các hoạt động nhằm mục đích sinh lợi khác. 2. Hàng hóa bao gồm: a) Tất cả các loại động sản, kể cả động sản hình thành trong tương lai; b) Những vật gắn liền với đất đai.'
      trang_pdf: 1
    - dieu: 49
      noi_dung: Điều 49. Nghĩa vụ bảo hành hàng hoá 1. Trường hợp hàng hoá mua bán có bảo hành thì bên bán phải chịu trách nhiệm bảo hành hàng hoá đó theo nội dung và thời hạn đã thỏa thuận. 2. Bên bán phải thực hiện nghĩa vụ bảo hành trong thời gian ngắn nhất mà hoàn cảnh thực tế cho phép. 3. Bên bán phải chịu các chi phí về việc bảo hành, trừ trường hợp có thoả thuận khác.
      trang_pdf: 1
    - dieu: 95
      noi_dung: Điều 95. Quyền của thương nhân thực hiện khuyến mại 1. Lựa chọn hình thức, thời gian, địa điểm khuyến mại, hàng hóa, dịch vụ dùng để khuyến mại. 2. Quy định các lợi ích cụ thể mà khách hàng được hưởng phù hợp với khoản 4 Điều 94 của Luật này. 3. Thuê thương nhân kinh doanh dịch vụ khuyến mại thực hiện việc khuyến mại cho mình. 4. Tổ chức thực hiện các hình thức khuyến mại quy định tại Điều 92 của Luật này.
      trang_pdf: 1
    - dieu: 140
      noi_dung: Điều 140. Quyền và nghĩa vụ của thương nhân kinh doanh dịch vụ hội chợ, triển lãm thương mại 1. Niêm yết chủ đề, thời gian tiến hành hội chợ, triển lãm thương mại tại nơi tổ chức hội chợ, triển lãm thương mại đó trước ngày khai mạc hội chợ, triển lãm thương mại. 2. Yêu cầu bên thuê dịch vụ cung cấp hàng hoá để tham gia hội chợ, triển lãm thương mại theo thời hạn đã thoả thuận trong hợp đồng.
      trang_pdf: 1
    - dieu: 186
      noi_dung: Điều 186. Người tổ chức đấu giá, người bán hàng 1. Người tổ chức đấu giá là thương nhân có đăng ký kinh doanh dịch vụ đấu giá hoặc là người bán hàng của mình trong trường hợp người bán hàng tự tổ chức đấu giá. 2. Người bán hàng là chủ sở hữu hàng hoá, người được chủ sở hữu hàng hoá uỷ quyền bán hoặc người có quyền bán hàng hoá của người khác theo quy định của pháp luật.
      trang_pdf: 1
    - dieu: 231
      noi_dung: Điều 231. Bảo đảm thực hiện hợp đồng 1. Các bên có thể thỏa thuận bên trúng thầu phải đặt cọc, ký quỹ hoặc được bảo lãnh để bảo đảm thực hiện hợp đồng. Số tiền đặt cọc, ký quỹ do bên mời thầu quy định, nhưng không quá 10% giá trị hợp đồng. 2. Biện pháp bảo đảm thực hiện hợp đồng có hiệu lực cho đến thời điểm bên trúng thầu hoàn thành nghĩa vụ hợp đồng.
      trang_pdf: 1
    - dieu: 277
      noi_dung: Điều 277. Khắc phục, thay thế hàng hoá cho thuê không phù hợp với hợp đồng 1. Trong trường hợp bên thuê từ chối nhận hàng hoá cho thuê do không phù hợp với hợp đồng, nếu thời hạn thực hiện việc giao hàng vẫn còn thì bên cho thuê có thể thông báo ngay cho bên thuê về việc khắc phục hoặc thay thế hàng hoá và thực hiện việc khắc phục hoặc thay thế hàng hoá đó trong khoảng thời gian còn lại.
      trang_pdf: 1
    - dieu: 323
      noi_dung: Điều 323. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2006. Luật này thay thế Luật thương mại ngày 10 tháng 5 năm 1997.
      trang_pdf: 1
ghi_chu: Điều 27-28 là căn cứ quyền mua bán hàng quốc tế của thương nhân VN — ca giao thẳng nước thứ ba (#227).
