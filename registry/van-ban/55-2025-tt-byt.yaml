xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ văn bản trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=216450) và toàn văn PDF lớp chữ 100% (raw/download/datafiles.chinhphu.vn/55-2025-tt-byt.pdf, 15 trang, 5 Chương, 16 Điều và 2 Phụ lục, SHA-256 a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7): Thông tư số 55/2025/TT-BYT ban hành ngày 31-12-2025 bởi Bộ Y tế quy định về kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược trong cơ sở khám bệnh, chữa bệnh; Điều 12 quy định hiệu lực thi hành từ 01-03-2026 và thay thế Thông tư 44/2018/TT-BYT ngày 28-12-2018; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Thông tư này quy định kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược trong điều trị nội trú, điều trị ban ngày và điều trị ngoại trú tại cơ sở khám bệnh, chữa bệnh. 2. Thông tư này áp dụng đối với các cơ sở khám bệnh, chữa bệnh, bao gồm cơ sở khám bệnh, chữa bệnh thuộc Bộ Quốc phòng và Bộ Công an; cơ quan, tổ chức, cá nhân có liên quan đến kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược.'
      trang_pdf: 1
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 2
      khoan: 1
      noi_dung: 'Điều 2. Giải thích từ ngữ 1. Thuốc cổ truyền có dạng bào chế truyền thống và dạng bào chế hiện đại.'
      trang_pdf: 1
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 2
      khoan: 2
      noi_dung: '2. Thuốc thang là một dạng bào chế truyền thống của thuốc cổ truyền dùng trong cơ sở khám bệnh, chữa bệnh, được người hành nghề kê đơn, cân (bốc) từ một hoặc nhiều vị thuốc cổ truyền theo lý luận của y học cổ truyền hoặc theo kinh nghiệm dân gian, được đóng gói hoặc chế biến, bào chế dùng để phòng bệnh, chữa bệnh.'
      trang_pdf: 1
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 2
      khoan: 3
      noi_dung: '3. Thuốc nam là thuốc cổ truyền có nguồn gốc từ dược liệu nuôi trồng, thu hái trong nước được dùng trực tiếp, dùng tươi hoặc dùng sống hoặc chế biến, bào chế theo kinh nghiệm dân gian hoặc lý luận của y học cổ truyền, có dạng bào chế là thuốc thang hoặc dạng bào chế truyền thống hoặc dạng bào chế hiện đại.'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 1
      noi_dung: 'Điều 3. Nguyên tắc kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược Việc kê đơn thuốc phải thực hiện theo các quy định tại Điều 62, Điều 63 Luật Khám bệnh, chữa bệnh số 15/2023/QH15 và các nguyên tắc sau đây: 1. Phù hợp với một trong các tài liệu sau đây: a) Tờ hướng dẫn sử dụng thuốc đã được Bộ Y tế phê duyệt; b) Hướng dẫn chẩn đoán và điều trị do Bộ trưởng Bộ Y tế ban hành hoặc Hướng dẫn chẩn đoán và điều trị của cơ sở khám bệnh, chữa bệnh xây dựng theo quy định tại Điều 6 Thông tư số 21/2013/TT-BYT ngày 08 tháng 08 năm 2013 của Bộ trưởng Bộ Y tế quy định về tổ chức và hoạt động của Hội đồng Thuốc và điều trị trong bệnh viện trong trường hợp chưa có hướng dẫn chẩn đoán và điều trị của Bộ Y tế; c) Dược điển Việt Nam hiện hành hoặc dược điển nước ngoài được Bộ Y tế công nhận; d) Dược thư quốc gia Việt Nam hiện hành.'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 2
      noi_dung: '2. Được kê đơn khi có sự trùng lặp một số vị thuốc cổ truyền, dược liệu trong thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại theo quy định tại khoản 2 Điều 2 Thông tư số 32/2020/TT-BYT ngày 31 tháng 12 năm 2020 của Bộ trưởng Bộ Y tế quy định tiêu chuẩn chế biến, bào chế thuốc cổ truyền trong các cơ sở khám bệnh, chữa bệnh bằng y học cổ truyền (sau đây gọi là thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại), thuốc dược liệu.'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 3
      noi_dung: '3. Được kê đơn thuốc thang riêng lẻ hoặc kê đơn kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu với liều lớn hơn theo quy định tại điểm a, b và điểm c khoản 1 Điều này khi có sự trùng lặp các vị thuốc cổ truyền, dược liệu trong mỗi lần kê đơn thuốc kết hợp hoặc kê đơn thuốc riêng lẻ theo cách ghi đơn thuốc quy định tại điểm b khoản 5 Điều 8 Thông tư này.'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 4
      noi_dung: '4. Được kê đơn kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu với thuốc hóa dược hoặc kê đơn riêng lẻ từng hình thức kê đơn thuốc trong mỗi lần kê đơn thuốc.'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 5
      noi_dung: '5. Trường hợp kê đơn thuốc kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu với thuốc hóa dược trong điều trị ngoại trú thì việc kê đơn thuốc hóa dược thực hiện theo quy định tại Thông tư số 26/2025/TTBYT ngày 30 tháng 6 năm 2025 của Bộ trưởng Bộ Y tế quy định về đơn thuốc và việc kê đơn thuốc hóa dược, sinh phẩm trong điều trị ngoại trú tại cơ sở khám bệnh, chữa bệnh (sau đây gọi là Thông tư số 26/2025/TT-BYT).'
      trang_pdf: 2
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 3
      khoan: 6
      noi_dung: '6. Trường hợp kê đơn thuốc trong điều trị nội trú và điều trị ban ngày thực hiện theo quy định tại Thông tư số 23/2011/TT-BYT ngày 10 tháng 6 năm 2011 của Bộ trưởng Bộ Y tế hướng dẫn sử dụng thuốc trong các cơ sở y tế có giường bệnh và các văn bản có liên quan.'
      trang_pdf: 3
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 4
      khoan: 1
      noi_dung: 'Điều 4. Thẩm quyền kê đơn thuốc cổ truyền, thuốc dược liệu Người có chứng chỉ hành nghề khám bệnh, chữa bệnh hoặc giấy phép hành nghề khám bệnh, chữa bệnh (sau đây gọi chung là người hành nghề) được kê đơn thuốc cổ truyền, thuốc dược liệu. 1. Người hành nghề được kê đơn thuốc thang, kê đơn thuốc thang kết hợp thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, bao gồm các chức danh chuyên môn sau: a) Bác sĩ chuyên khoa y học cổ truyền; bác sĩ chuyên khoa y học dân tộc; bác sĩ y khoa hoặc bác sĩ đa khoa có chứng chỉ đào tạo định hướng về chuyên khoa y học cổ truyền có thời gian tối thiểu 6 tháng; bác sĩ có chứng chỉ chuyên khoa cơ bản y học cổ truyền; b) Bác sĩ y học cổ truyền có văn bằng cử nhân y học cổ truyền do cơ sở giáo dục nước ngoài cấp được Bộ trưởng Bộ Giáo dục và Đào tạo công nhận trình độ đại học và đã được cấp giấy chứng nhận hoàn thành chương trình đào tạo bổ sung bác sỹ y học cổ truyền theo quy định của Bộ trưởng Bộ Y tế; c) Y sĩ y học cổ truyền, y sĩ y học cổ truyền có văn bằng cao đẳng y sỹ y học cổ truyền hoặc cao đẳng y học cổ truyền hoặc y sĩ đa khoa có chứng chỉ định hướng y học cổ truyền; d) Y sĩ y học cổ truyền có văn bằng tốt nghiệp do cơ sở giáo dục nước ngoài cấp được cơ quan nhà nước có thẩm quyền công nhận tương đương văn bằng cao đẳng y sĩ y học cổ truyền hoặc cao đẳng y học cổ truyền, trừ y sĩ y học cổ truyền có chứng chỉ hành nghề hoặc có giấy phép hành nghề phương pháp không dùng thuốc; đ) Lương y; e) Lương y với phạm vi hành nghề khám bệnh, chữa bệnh bằng thuốc nam thì người hành nghề chỉ được kê đơn thuốc nam ở dạng bào chế thuốc thang trong cơ sở khám bệnh, chữa bệnh trong trường hợp được cấp chứng chỉ hành nghề hoặc giấy phép hành nghề.'
      trang_pdf: 3
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 4
      khoan: 2
      noi_dung: '2. Người hành nghề được kê đơn thuốc cổ truyền Người hành nghề được kê đơn thuốc cổ truyền dạng bào chế truyền thống và dạng bào chế hiện đại, bao gồm các chức danh chuyên môn sau: a) Người hành nghề quy định tại điểm a, b, c, d và điểm đ khoản 1 Điều này; b) Bác sĩ y khoa, bác sĩ đa khoa, bác sĩ chuyên khoa, bác sĩ răng hàm mặt, bác sĩ y học dự phòng; c) Y sĩ đa khoa.'
      trang_pdf: 3
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 4
      khoan: 3
      noi_dung: '3. Người hành nghề được kê đơn thuốc dược liệu: Người hành nghề quy định tại điểm a, b, c và điểm d khoản 1; điểm b và điểm c khoản 2 Điều này.'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 4
      khoan: 4
      noi_dung: '4. Người có giấy chứng nhận bài thuốc gia truyền chỉ được kê đơn bài thuốc gia truyền được cấp có thẩm quyền cấp phép.'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 5
      noi_dung: 'Điều 5. Hình thức kê đơn thuốc cổ truyền, thuốc dược liệu 1. Kê đơn riêng lẻ một trong các loại thuốc sau: thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống và dạng bào chế hiện đại, thuốc dược liệu. 2. Kê đơn kết hợp các hình thức quy định tại khoản 1 Điều này. 3. Kê đơn bài thuốc gia truyền.'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 6
      noi_dung: 'Điều 6. Thẩm quyền kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược 1. Người hành nghề được kê đơn kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống và dạng bào chế hiện đại, thuốc dược liệu với thuốc hóa dược phù hợp với chẩn đoán, tình trạng bệnh của người bệnh, phạm vi hoạt động chuyên môn và phân cấp chuyên môn kỹ thuật của cơ sở khám bệnh, chữa bệnh được cấp có thẩm quyền phê duyệt với các chức danh chuyên môn sau: a) Người hành nghề quy định tại điểm a khoản 1 Điều 4 Thông tư này; b) Người hành nghề quy định tại điểm b và điểm d khoản 1 Điều 4 Thông tư này chỉ được thực hiện khi được người chịu trách nhiệm chuyên môn của cơ sở khám bệnh, chữa bệnh cho phép bằng văn bản. 2. Bác sĩ y khoa hoặc bác sĩ đa khoa, bác sĩ chuyên khoa cơ bản, bác sĩ răng hàm mặt, bác sĩ y học dự phòng, y sĩ đa khoa được kê đơn thuốc hóa dược kết hợp thuốc cổ truyền dạng bào chế truyền thống và dạng bào chế hiện đại, thuốc dược liệu. 3. Người hành nghề được kê đơn riêng thuốc hóa dược a) Người hành nghề quy định tại điểm a khoản 1 và khoản 2 Điều này; b) Y sĩ y học cổ truyền được kê đơn và sử dụng thuốc hóa dược trong trường hợp cấp cứu người bệnh tại cơ sở y tế.'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 7
      khoan: 1
      noi_dung: 'Điều 7. Hình thức kê đơn kết hợp thuốc thang, thuốc cổ truyền, thuốc dược liệu với thuốc hoá dược 1. Kê đơn thuốc hóa dược kết hợp với một hoặc nhiều hình thức kê đơn quy định tại Điều 5 Thông tư này.'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 7
      khoan: 2
      noi_dung: '2. Kê đơn kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống và dạng bào chế hiện đại, thuốc dược liệu với thuốc hoá dược đối với người bệnh điều trị ngoại trú'
      trang_pdf: 4
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 7
      khoan: 2
      noi_dung: 'a) Kê đơn thuốc thang thực hiện theo mẫu Đơn thuốc thang quy định tại Phụ lục I ban hành kèm theo Thông tư này; b) Kê đơn thuốc cổ truyền có dạng bào chế truyền thống và dạng bào chế hiện đại, thuốc dược liệu thực hiện theo mẫu Đơn thuốc cổ truyền, thuốc dược liệu quy định tại Phụ lục II ban hành kèm theo Thông tư này; c) Kê đơn thuốc hóa dược thực hiện theo quy định tại Thông tư số 26/2025/TT-BYT.'
      trang_pdf: 5
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 1
      noi_dung: 'Điều 8. Yêu cầu chung với nội dung kê đơn thuốc, hồ sơ bệnh án 1. Chữ viết tên thuốc theo ngôn ngữ tiếng Việt, chính xác, rõ ràng, đầy đủ các mục trong đơn thuốc hoặc trong hồ sơ bệnh án của người bệnh; trường hợp người hành nghề là người nước ngoài thì việc kê đơn thuốc phải thực hiện theo quy định tại khoản 3 Điều 35 Nghị định số 96/2023/NĐ-CP ngày 30 tháng 12 năm 2023 của Chính phủ quy định chi tiết một số điều của Luật Khám bệnh, chữa bệnh.'
      trang_pdf: 5
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 2
      noi_dung: '2. Ghi thông tin về số định danh cá nhân hoặc số căn cước công dân hoặc số căn cước hoặc số hộ chiếu của người bệnh (nếu có).'
      trang_pdf: 5
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
