      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 4
      noi_dung: '4. Đối với trẻ dưới 72 tháng tuổi thì phải ghi số tháng tuổi, cân nặng của trẻ; họ và tên người đưa trẻ đến khám bệnh, chữa bệnh.'
      trang_pdf: 5
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 5
      noi_dung: '5. Cách ghi đơn thuốc đối với thuốc thang, thuốc cổ truyền, thuốc dược liệu a) Khi kê đơn thuốc thang ghi tên theo Dược điển hoặc tên thường dùng, không bao gồm tên khoa học của dược liệu, vị thuốc cổ truyền, tên loài, cây con, khoáng vật làm thuốc; ghi rõ khối lượng, đơn vị tính, số lượng thuốc thang, không viết tắt tên thuốc; hướng dẫn cụ thể cách sắc thuốc, cách uống thuốc và thời gian uống thuốc; đối với vị thuốc cổ truyền có khối lượng dưới 10 (mười) gam thì phải ghi số 0 (không) ở phía trước; Ví dụ: Bài Lục vị Thục địa 16 g Trạch tả 06 g Hoài sơn 08 g Phục linh 06 g Sơn thù 08 g Đan bì 06 g Ngày 01 thang x 07 ngày. Sắc uống ngày 01 thang, chia 02 lần sáng và chiều, uống sau ăn. b) Người hành nghề kê đơn thuốc thang riêng lẻ hoặc kê đơn kết hợp thuốc thang, thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu có sự trùng lặp vị thuốc cổ truyền, dược liệu quy định tại khoản 3 Điều 3 Thông tư này mà khối lượng các thành phần trùng lặp lớn hơn quy định tại'
      trang_pdf: 5
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 5
      noi_dung: 'điểm a, b và điểm c khoản 1 Điều 3 Thông tư này, người hành nghề phải ghi khối lượng vị thuốc cổ truyền bằng số, bằng chữ bên cạnh khối lượng và ghi rõ “tôi kê liều này” trong đơn thuốc hoặc trong hồ sơ bệnh án của người bệnh, bao gồm việc kê đơn thuốc điện tử; c) Đối với thuốc cổ truyền do cơ sở khám bệnh, chữa bệnh chế biến, bào chế thì ghi tên thuốc theo cơ sở đã công bố, phê duyệt lưu hành nội bộ trong trường hợp quy định tại khoản 1 Điều 70 Luật Dược hoặc lưu hành trong tỉnh đối với trường hợp quy định tại khoản 2 Điều 70 Luật Dược. Thuốc được lưu hành toàn quốc thì ghi tên thuốc theo tên đã được Bộ Y tế cấp giấy phép đăng ký lưu hành; d) Đối với thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu ghi liều dùng, cách dùng và đường dùng; Ví dụ: - Đối với thuốc cổ truyền do cơ sở khám bệnh, chữa bệnh tự sản xuất: Viên thận âm hư, mỗi lần uống 8g, uống ngày 02 lần, chia sáng, chiều, uống sau ăn. - Đối với thuốc được Bộ Y tế cấp giấy phép đăng ký lưu hành: Lục vị, mỗi lần 03 viên, uống ngày 02 lần, chia sáng, chiều, uống sau ăn. đ) Trường hợp đơn thuốc thang có chứa vị thuốc cổ truyền được chế biến, bào chế từ dược liệu độc thuộc Danh mục dược liệu độc làm thuốc ban hành kèm theo Thông tư số 13/2024/TT-BYT ngày 26 tháng 8 năm 2024 của Bộ trưởng Bộ Y tế ban hành Danh mục dược liệu độc làm thuốc (sau đây gọi tắt là Thông tư số 13/2024/TT-BYT) thì phải ghi rõ khối lượng của vị thuốc cổ truyền đó bằng số và bằng chữ.'
      trang_pdf: 6
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 6
      noi_dung: '6. Thứ tự kê đơn thuốc a) Đối với hồ sơ bệnh án: kê đơn thuốc hoá dược; thuốc thang, thuốc cổ truyền dạng bào chế truyền thống, dạng bào chế hiện đại; thuốc dược liệu; b) Đối với đơn thuốc theo mẫu Đơn thuốc quy định tại điểm b khoản 2 Điều 7 Thông tư này: thuốc cổ truyền (dạng bào chế truyền thống, dạng bào chế hiện đại), thuốc dược liệu.'
      trang_pdf: 6
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 7
      noi_dung: '7. Số ngày sử dụng của mỗi thuốc trong đơn thuốc a) Kê đơn thuốc trong điều trị ngoại trú - Đối với thuốc thang: + Tùy tình trạng bệnh lý của người bệnh, người hành nghề kê đơn thuốc mỗi lần tối đa không quá 30 (ba mươi) ngày hoặc theo hướng dẫn chẩn đoán và điều trị của cấp có thẩm quyền ban hành; + Đối với thuốc có chứa vị thuốc cổ truyền được chế biến, bào chế từ dược liệu độc, mỗi lần kê đơn không quá 05 (năm) ngày; + Đối với bệnh cấp tính, số lượng thuốc mỗi lần kê đơn đủ sử dụng không quá 05 (năm) ngày.'
      trang_pdf: 6
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 8
      khoan: 7
      noi_dung: '- Đối với thuốc dược liệu; thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại: người hành nghề quyết định số ngày sử dụng của mỗi thuốc trong đơn thuốc căn cứ vào tình trạng lâm sàng, mức độ ổn định của người bệnh để kê đơn thuốc với số ngày sử dụng của mỗi thuốc tối đa không quá 90 (chín mươi) ngày. b) Kê đơn thuốc thang trong điều trị nội trú, điều trị ban ngày - Thực hiện kê đơn thuốc tối thiểu hai lần trong 10 (mười) ngày; - Trong những lần khám bệnh tiếp theo nếu không thay đổi chỉ định điều trị và giữ nguyên bài thuốc đã được chỉ định ngay trước đó thì được phép kê lại bằng cách ghi “Bài thuốc hoặc đơn thuốc của ngày, tháng, năm” và chỉ được một lần, trường hợp tiếp tục sử dụng bài thuốc đó trong lần kế tiếp phải ghi lại bài thuốc. c) Kê đơn thuốc đối với người bệnh ngay sau khi kết thúc việc điều trị nội trú, điều trị ban ngày, bao gồm thuốc thang, thuốc cổ truyền dạng bào chế truyền thống, dạng bào chế hiện đại, thuốc dược liệu, thuốc hóa dược: - Trường hợp tiên lượng người bệnh cần tiếp tục sử dụng thuốc từ 01 (một) đến đủ 07 (bảy) ngày sau khi ra viện thì người hành nghề khám bệnh, chữa bệnh chỉ định điều trị tiếp và ghi vào hồ sơ bệnh án nội trú đồng thời kê đơn thuốc cho người bệnh bảo đảm phù hợp với nội dung chỉ định thuốc trong hồ sơ bệnh án nội trú; - Trường hợp tiên lượng người bệnh cần tiếp tục điều trị trên 07 (bảy) ngày sau khi ra viện thì căn cứ tình trạng của người bệnh, người hành nghề khám bệnh, chữa bệnh quyết định kê đơn thuốc ngoại trú hoặc lập hồ sơ bệnh án điều trị ngoại trú hoặc chuyển người bệnh đến cơ sở khám bệnh, chữa bệnh phù hợp để tiếp tục điều trị. Số ngày sử dụng của mỗi thuốc được kê trong đơn thuốc hoặc chỉ định trong hồ sơ bệnh án ngoại trú theo quy định tại điểm a khoản này.'
      trang_pdf: 7
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 9
      khoan: 1
      noi_dung: 'Điều 9. Quy định về thay đổi trong đơn thuốc, sử dụng thuốc và hủy thuốc 1. Trường hợp thay đổi nội dung trong đơn thuốc a) Cơ sở khám bệnh, chữa bệnh với hình thức bệnh viện thực hiện kê đơn thuốc tại bệnh án điện tử, đơn thuốc điện tử hoặc phiếu lĩnh thuốc: Người hành nghề thông báo và gửi đơn thuốc hoặc phiếu lĩnh thuốc đã được điều chỉnh đến khoa dược hoặc bộ phận dược; b) Cơ sở khám bệnh, chữa bệnh tư nhân với hình thức phòng khám và các hình thức phòng khám khác thực hiện kê đơn thuốc tại bệnh án bản giấy, đơn thuốc bản giấy: Người hành nghề phải ký tên, ghi ngày bên cạnh nội dung sửa trong đơn thuốc. Trường hợp thay thế đơn thuốc đã duyệt, người hành nghề lưu đơn thuốc trước và sau khi điều chỉnh, gửi bộ phận cấp thuốc hoặc sắc thuốc.'
      trang_pdf: 7
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 9
      khoan: 2
      noi_dung: '2. Trường hợp thuốc cổ truyền có dạng bào chế truyền thống hoặc dạng bào chế hiện đại, thuốc dược liệu chưa sử dụng do thay đổi y lệnh, do người bệnh chuyển khoa, ra viện, chuyển viện hoặc tử vong phải có xác nhận của trưởng khoa lâm sàng hoặc người được trưởng khoa lâm sàng ủy quyền bằng văn bản gửi khoa dược hoặc bộ phận dược trong vòng 24 giờ.'
      trang_pdf: 7
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 9
      khoan: 3
      noi_dung: '3. Trường hợp hủy đối với thuốc gây nghiện, thuốc hướng thần a) Thuốc gây nghiện, thuốc hướng thần và thuốc tiền chất người bệnh không sử dụng hết hoặc do người bệnh chuyển cơ sở hoặc bị tử vong, khoa điều trị, phòng khám phải làm giấy trả lại bộ phận dược. Trưởng bộ phận dược phải căn cứ điều kiện cụ thể để quyết định tái sử dụng hoặc hủy theo quy định và lập biên bản lưu tại cơ sở; b) Trường hợp cơ sở khám bệnh, chữa bệnh có nhu cầu hủy thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất thực hiện theo quy định tại Điều 36 Nghị định số 163/2025/NĐ-CP ngày 29 tháng 6 năm 2025 của Chính phủ quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Dược.'
      trang_pdf: 8
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 9
      khoan: 4
      noi_dung: '4. Trường hợp hủy đối với thuốc thang đã sắc Thuốc thang đã sắc mà bệnh nhân chuyển viện hoặc tử vong, trưởng khoa lâm sàng lập biên bản, chuyển khoa Dược và hủy theo quy định sau: Căn cứ đơn thuốc, số thang thuốc đã sử dụng, số thang thuốc chưa sử dụng, người đứng đầu cơ sở khám bệnh, chữa bệnh ra quyết định thành lập Hội đồng hủy thuốc để tổ chức việc hủy thuốc, quyết định phương pháp hủy, giám sát việc hủy thuốc. Hội đồng có ít nhất 03 người, trong đó phải có 01 đại diện là người phụ trách chuyên môn của cơ sở. Biên bản hủy thuốc theo quy định tại mẫu số 06 Phụ lục III ban hành kèm theo Thông tư số 30/2025/TT-BYT ngày 01 tháng 07 năm 2025 của Bộ trưởng Bộ Y tế hướng dẫn áp dụng tiêu chuẩn chất lượng, kiểm nghiệm thuốc, nguyên liệu làm thuốc và thu hồi, xử lý thuốc vi phạm.'
      trang_pdf: 8
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 10
      noi_dung: 'Điều 10. Kê đơn thuốc ngoại trú bằng hình thức điện tử tại cơ sở khám bệnh, chữa bệnh 1. Đơn thuốc kê bằng hình thức điện tử được lập, hiển thị, ký số, chia sẻ, lưu trữ bằng phương thức điện tử phải có đủ các thông tin theo quy định của Thông tư này và có giá trị pháp lý như đơn thuốc giấy. 2. Đơn thuốc điện tử được lưu trong cơ sở dữ liệu của cơ sở khám bệnh, chữa bệnh, bảo đảm liên thông với cơ sở dữ liệu quốc gia về y tế và sổ sức khoẻ điện tử. Đối với cơ sở khám bệnh, chữa bệnh tư nhân với hình thức phòng khám có ứng dụng công nghệ thông tin thì đơn thuốc được ghi trong máy tính 01 (một) lần, sau đó in ra và người hành nghề ký tên, trả cho người bệnh 01 (một) bản để lưu trong sổ khám bệnh hoặc trong sổ điều trị bệnh cần điều trị mạn tính của người bệnh. 3. Cơ sở khám bệnh, chữa bệnh có ứng dụng công nghệ thông tin phải bảo đảm việc lưu đơn thuốc để truy xuất hoặc in ra làm dữ liệu khi cần thiết.'
      trang_pdf: 8
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 11
      noi_dung: 'Điều 11. Thời hạn đơn thuốc có giá trị mua, lĩnh thuốc, lưu đơn thuốc 1. Đơn thuốc có giá trị mua, lĩnh thuốc trong thời hạn tối đa là 05 (năm) ngày, kể từ ngày kê đơn thuốc. 2. Thời hạn lưu đơn thuốc thực hiện theo quy định tại điểm a khoản 2 Điều 1 Thông tư số 33/2025/TT-BYT ngày 01 tháng 7 năm 2025 của Bộ trưởng Bộ Y tế quy định thời hạn lưu trữ hồ sơ, tài liệu ngành y tế.'
      trang_pdf: 8
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 12
      noi_dung: 'Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 3 năm 2026. 2. Thông tư số 44/2018/TT-BYT ngày 28 tháng 12 năm 2018 của Bộ trưởng Bộ Y tế quy định về kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược hết hiệu lực kể từ ngày Thông tư này có hiệu lực. 3. Lộ trình thực hiện việc kê đơn thuốc bằng hình thức điện tử: Cơ sở khám bệnh, chữa bệnh phải thực hiện việc kê đơn thuốc bằng hình thức điện tử theo lộ trình của Chính phủ và Bộ Y tế.'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 13
      noi_dung: 'Điều 13. Điều khoản tham chiếu Trường hợp các văn bản quy phạm pháp luật và các quy định được dẫn chiếu trong Thông tư này được thay thế, sửa đổi, bổ sung thì áp dụng theo các văn bản đã được thay thế, sửa đổi, bổ sung.'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 14
      noi_dung: 'Điều 14. Điều khoản chuyển tiếp Đối với những cơ sở khám bệnh, chữa bệnh đã in mẫu đơn thuốc thang điều trị ngoại trú quy định tại Phụ lục ban hành kèm theo Thông tư số 44/2018/TT-BYT ngày 28 tháng 12 năm 2018 của Bộ trưởng Bộ Y tế quy định về kê đơn thuốc cổ truyền, thuốc dược liệu và kê đơn kết hợp thuốc cổ truyền, thuốc dược liệu với thuốc hóa dược thì được tiếp tục sử dụng đến ngày 30 tháng 6 năm 2026.'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 1
      noi_dung: 'Điều 15. Tổ chức thực hiện 1. Cục Quản lý Y, Dược cổ truyền chủ trì phối hợp với Cục Quản lý Khám, chữa bệnh, Cục Quản lý Dược và các đơn vị có liên quan có trách nhiệm tổ chức triển khai, kiểm tra, đánh giá việc thực hiện Thông tư này.'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 2
      noi_dung: '2. Sở Y tế, Y tế Bộ, ngành có trách nhiệm: a) Chỉ đạo, tổ chức triển khai thực hiện Thông tư trên địa bàn, đơn vị quản lý; b) Kiểm tra, đánh giá kết quả việc thực hiện Thông tư trong phạm vi địa bàn, đơn vị quản lý.'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 3
      noi_dung: '3. Cơ sở khám bệnh, chữa bệnh có trách nhiệm: a) Thực hiện các quy định tại Thông tư này; b) Nhận lại thuốc, bao gồm thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất đã cấp cho người bệnh nhưng không sử dụng hết hoặc tử vong và lập biên bản đối với thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất theo mẫu quy định tại Phụ lục VI ban hành kèm theo Thông tư số 26/2025/TT-BYT. Thuốc nhận lại được biệt trữ tại khu vực bảo đảm an ninh chống thất thoát và tiêu hủy theo đúng quy định của pháp luật; c) Bảo đảm hạ tầng công nghệ thông tin đáp ứng tiêu chí kỹ thuật theo quy định của Bộ Y tế để thực hiện triển khai hồ sơ bệnh án điện tử;'
      trang_pdf: 9
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 3
      noi_dung: 'd) Gửi đơn thuốc điện tử lên Hệ thống đơn thuốc quốc gia theo quy định của Bộ Y tế ngay sau khi kết thúc quy trình khám bệnh, chữa bệnh đối với điều trị ngoại trú; đ) Gửi đơn thuốc điện tử hoặc mã đơn thuốc điện tử cho người bệnh hoặc người đại diện người bệnh thông qua các phương tiện điện tử theo quy định của Bộ Y tế; e) Thực hiện lưu trữ đơn thuốc theo quy định tại Thông tư này và bảo đảm việc trích xuất dữ liệu khi cần thiết; g) Người chịu trách nhiệm chuyên môn tại cơ sở khám bệnh, chữa bệnh căn cứ phạm vi chuyên môn, giấy chứng nhận, chứng chỉ đào tạo chuyên môn do cơ sở đào tạo hợp pháp cấp và năng lực của người hành nghề quy định tại điểm b và điểm d khoản 1 Điều 4 Thông tư này cho phép kê đơn kết hợp thuốc thang, thuốc cổ truyền dạng bào chế truyền thống, dạng bào chế hiện đại, thuốc dược liệu với thuốc hóa dược để điều trị, theo dõi, đánh giá hiệu quả trong quá trình điều trị của người bệnh tại đơn vị bằng văn bản.'
      trang_pdf: 10
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 4
      noi_dung: '4. Người hành nghề kê đơn thuốc có trách nhiệm: a) Thực hiện các quy định về kê đơn thuốc tại Thông tư này và chịu trách nhiệm về đơn thuốc khi kê cho người bệnh; b) Hướng dẫn việc sử dụng thuốc, tư vấn chế độ dinh dưỡng, chế độ sinh hoạt cho người bệnh hoặc người đại diện người bệnh trong quá trình sử dụng thuốc; hướng dẫn người bệnh hoặc người đại diện người bệnh phải thông báo ngay cho người hành nghề hoặc đến cơ sở y tế gần nhất khi có dấu hiệu bất thường sau khi sử dụng thuốc; c) Khuyến cáo người bệnh về thời hạn tốt nhất của việc mua thuốc trong đơn; d) Thông báo cho người bệnh về việc thay đổi đơn thuốc.'
      trang_pdf: 10
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 5
      noi_dung: '5. Người bệnh và người đại diện của người bệnh có trách nhiệm a) Thực hiện các quy định tại Thông tư này; b) Thời hạn lĩnh thuốc - Đối với trường hợp điều trị ngoại trú, thực hiện lĩnh thuốc trong thời hạn tối đa 05 ngày, kể từ ngày kê đơn thuốc; - Đối với trường hợp người bệnh cần tiếp tục sử dụng thuốc từ 01 (một) đến đủ 07 (bảy) ngày sau khi ra viện thì lĩnh thuốc trong thời hạn tối đa 02 ngày, kể từ ngày kê đơn thuốc; c) Trường hợp không sử dụng hoặc sử dụng không hết thuốc hoặc có thay đổi đơn thuốc, bao gồm thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất phải hủy hoặc trả lại thuốc cho cơ sở đã cấp hoặc bán thuốc để hủy theo quy định; không được bán, cho, tặng hoặc sử dụng vào mục đích khác.'
      trang_pdf: 10
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 6
      noi_dung: '6. Cơ sở bán lẻ thuốc có trách nhiệm: a) Thực hiện các quy định tại Thông tư này;'
      trang_pdf: 10
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 15
      khoan: 6
      noi_dung: 'b) Nhận lại thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất đã bán cho người bệnh nhưng không sử dụng hết hoặc tử vong, lập biên bản và xử lý theo quy định của Bộ Y tế; c) Đối với thuốc chứa dược liệu độc thuộc Danh mục dược liệu độc làm thuốc ban hành kèm theo Thông tư số 13/2024/TT-BYT hoặc có các chỉ định theo quy định tại điểm b khoản 2 Điều 8 Thông tư số 29/2025/TT-BYT ngày 01 tháng 7 năm 2025 của Bộ trưởng Bộ Y tế quy định về việc đăng ký lưu hành thuốc cổ truyền, vị thuốc cổ truyền, dược liệu, cơ sở bán lẻ thuốc chỉ được bán thuốc khi người mua có đơn thuốc theo quy định tại Thông tư này; d) Cơ sở bán lẻ thuốc gây nghiện phải bán thuốc gây nghiện cho người bệnh khi có đơn thuốc “N” được kê đơn theo quy định tại Điều 7 và Điều 8 Thông tư số 26/2025/TT-BYT.'
      trang_pdf: 11
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
    - dieu: 16
      noi_dung: 'Điều 16. Trách nhiệm thi hành Các Ông, Bà: Chánh Văn phòng Bộ; Cục trưởng Cục Quản lý Y, Dược cổ truyền; Cục trưởng Cục Quản lý Khám, chữa bệnh; Cục trưởng Cục Quản lý Dược; Cục trưởng, Vụ trưởng các Vụ, Cục thuộc Bộ Y tế; Giám đốc bệnh viện, Viện có giường bệnh trực thuộc Bộ Y tế, cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh, Thủ trưởng y tế ngành, các tổ chức, cá nhân có liên quan chịu trách nhiệm thực hiện Thông tư này. Trong quá trình thực hiện nếu có khó khăn, vướng mắc, đề nghị các cơ quan, tổ chức, cá nhân phản ánh kịp thời về Bộ Y tế (Cục Quản lý Y, Dược cổ truyền) để xem xét, giải quyết./.'
      trang_pdf: 11
      sha256_pdf: a2f302f8ca9c8bc356dace5b2d8c1d571844bd012e917b4cd94c4468a3c82db7
ghi_chu: VB hướng dẫn Điều 73.3 Luật 105/2016 + 163/2025/NĐ-CP về thuốc cổ truyền dạng bào chế hiện đại.
