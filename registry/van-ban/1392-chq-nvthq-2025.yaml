xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/DONG_NAI/2025/4/9/1392_CHQ_NVTHQ_09_04_2025.pdf, id=99783, SHA-256 85beb9739383859efcde6f8f5ec4f93ca3ea3a91cc981f422fc3b12386e17ed8): Công văn số 1392/CHQ-NVTHQ ngày 09-04-2025 của Cục Hải quan hướng dẫn phân loại mặt hàng "xy lanh điện" (Electric Actuator — sản phẩm hoàn chỉnh dùng cho các bộ phận vận hành máy móc công nghiệp, cấu tạo gồm phần động cơ điện không thể tháo rời tạo chuyển động quay và phần xy lanh bên trong có trục vít screw shaft, thanh cần rod, hộp số gear biến chuyển động quay của động cơ điện thành chuyển động tuyến tính tịnh tiến của cần xy lanh để nâng hạ hoặc đóng mở máy móc, thiết bị công nghiệp): căn cứ Thông tư 14/2015/TT-BTC (sửa đổi, bổ sung tại Thông tư 17/2021/TT-BTC), Thông tư 31/2022/TT-BTC, tham khảo Chú giải Chi tiết nhóm 85.01 và Thông báo số 3609/TB-TCHQ ngày 25-07-2024 về xác định trước mã số cho mặt hàng "Xylanh điện" (Electric Actuator), mặt hàng phù hợp phân loại vào nhóm 85.01, mã số chi tiết tùy thuộc vào đặc điểm (một pha hay ba pha, xoay chiều hay một chiều) và công suất của động cơ; đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn phân loại xy lanh điện (Electric Actuator có động cơ điện gắn liền không thể tháo rời kết hợp trục vít, thanh cần, hộp số tạo chuyển động tịnh tiến): thuộc nhóm 85.01 theo Chú giải Chi tiết nhóm 85.01 và tương tự Thông báo 3609/TB-TCHQ ngày 25/07/2024; phân nhóm và mã số 8 chữ số xác định theo dòng điện (AC/DC, 1 pha/3 pha) và công suất động cơ.'
