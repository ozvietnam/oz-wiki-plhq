ghi_chu: 'Xác định trước mã số mặt hàng Bộ phụ kiện dùng để điều khiển và vận hành kính hiển vi quang học kỹ thuật số VHX-7000/7000N (ký, mã hiệu VHX-A70E, nhà sản xuất Keyence Corporation; đóng gói ở dạng bộ bán lẻ gồm 01 Tay cầm điều khiển có dây Model VHX-A70E hãng KEYENCE lắp bảng mạch in PCB với các công tắc, nút bấm và núm điều khiển dùng cho điện áp không quá 1.000V mang lại đặc tính cơ bản cho bộ sản phẩm, 01 Bàn phím máy tính có dây Model KB216 hãng Dell, 01 Chuột máy tính có dây Model MS116 hãng Dell và 01 Bộ tài liệu hướng dẫn sử dụng) thuộc nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.19.'
