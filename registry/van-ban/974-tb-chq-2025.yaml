xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/4/VB_974.pdf, id=99761, SHA-256 d5d31984a0b93704e2d12ae85f042347dc94fd15ab76b70f8c3ffbaca4100340): Thông báo số 974/TB-CHQ ngày 02-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ phụ kiện dùng để điều khiển và vận hành kính hiển vi quang học kỹ thuật số VHX-7000/7000N (ký, mã hiệu VHX-A70E, nhà sản xuất Keyence Corporation; đóng gói ở dạng bộ bán lẻ gồm 01 Tay cầm điều khiển có dây Model VHX-A70E hãng KEYENCE lắp bảng mạch in PCB với các công tắc, nút bấm và núm điều khiển dùng cho điện áp không quá 1.000V mang lại đặc tính cơ bản cho bộ sản phẩm, 01 Bàn phím máy tính có dây Model KB216 hãng Dell, 01 Chuột máy tính có dây Model MS116 hãng Dell và 01 Bộ tài liệu hướng dẫn sử dụng), phân loại vào nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.19; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
