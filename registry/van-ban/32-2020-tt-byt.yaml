  muc: NGUON_B
  pham_vi: 'Số hiệu 32/2020/TT-BYT, ban hành 31/12/2020 bởi Bộ trưởng Nguyễn Trường Sơn, hiệu lực 17/02/2021. Còn hiệu lực. Quy định tiêu chuẩn chế biến, bào chế thuốc cổ truyền trong cơ sở KCB bằng YHCT. Định nghĩa: (a) Dạng bào chế truyền thống: cao, hoàn cứng, hoàn mềm, bột thuốc, trà thuốc, rượu thuốc, cồn thuốc. (b) Dạng bào chế hiện đại: viên nén, bột hòa tan, cốm hòa tan, hoàn nhỏ giọt, siro, viên nang cứng/mềm, thuốc phun mù và CÁC DẠNG KHÁC (kể cả cao dán). Phụ lục I-II kèm theo.'
