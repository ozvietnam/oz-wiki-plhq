ghi_chu: 'Xác định trước mã số mặt hàng Hương bắp rang caramel (tên thương mại CARAMEL POPCORN FLAVOR S2503913, ký mã hiệu S2503913, dạng chất lỏng màu vàng lục nhạt đến vàng lục, thành phần Medium chain triglycerides 80-100%, hương liệu 10-20% gồm Aromatic aldehyde ~ Vanillin và Thioethers ~ methyl sulfide, Triacetin <2%, tỷ trọng riêng 0,9447-0,9647 tại 20 độ C, dùng làm hương liệu trong sản xuất bánh ngọt nhân kem, kẹo) thuộc nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30.'
