  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/26/VB_23490.pdf, id=106533, SHA-256 be533ef0c200209dea7df726b3d8a8255a07a43350ec82138aa6cdd517da0583): Thông báo số 23490/TB-CHQ ngày 26-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Hương bắp rang caramel (CARAMEL POPCORN FLAVOR S2503913, ký mã hiệu S2503913, thành phần Medium chain triglycerides 80-100%, hương liệu 10-20%, Triacetin <2%, dạng chất lỏng, không chứa cồn, dùng làm hương liệu trong sản xuất bánh ngọt nhân kem, kẹo), phân loại vào nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30; có hiệu lực kể từ ngày ban hành'
