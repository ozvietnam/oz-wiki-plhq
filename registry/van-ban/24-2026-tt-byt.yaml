  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về: 1. Xác định mức độ rủi ro và biện pháp quản lý đối với sản phẩm, hàng hóa là thiết bị y tế.'
      trang_pdf: 1
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 1
      khoan: 2
      noi_dung: '2. Sửa đổi, bổ sung một số điều của Thông tư số 05/2022/TT-BYT quy định chi tiết thi hành một số điều của Nghị định số 98/2021/NĐ-CP về quản lý thiết bị y tế.'
      trang_pdf: 1
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 2
      khoan: 1
      noi_dung: 'Điều 2. Quy định về xác định mức độ rủi ro và biện pháp quản lý đối với sản phẩm, hàng hóa là thiết bị y tế 1. Việc xác định mức độ rủi ro và biện pháp quản lý tương ứng với mức độ rủi ro của sản phẩm, hàng hóa là thiết bị y tế được thực hiện theo các quy định tại Nghị định số 98/2021/NĐ-CP và các văn bản hướng dẫn thi hành.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 2
      khoan: 2
      noi_dung: '2. Mã số HS đối với thiết bị y tế được quy định tại Thông tư số 19/2024/TT-BYT ban hành Danh mục thiết bị y tế xuất khẩu, nhập khẩu đã được xác định mã số hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 3
      noi_dung: 'Điều 3. Sửa đổi, bổ sung một số điều của Thông tư số 05/2022/TT-BYT quy định chi tiết thi hành một số điều của Nghị định số 98/2021/NĐ-CP về quản lý thiết bị y tế Sửa đổi, bổ sung Điều 8 như sau: “Điều 8. Lộ trình thực hiện Đối với các thiết bị y tế quy định tại các khoản 1, 2, 3, 4, 5 và 6 Điều 5 Thông tư này: 1. Thực hiện mua sắm sau ngày 30 tháng 6 năm 2027 phải kiểm định an toàn và tính năng kỹ thuật của thiết bị y tế theo đúng quy trình kiểm định do Bộ trưởng Bộ Y tế ban hành. 2. Thực hiện mua sắm trước ngày 01 tháng 7 năm 2027 phải hoàn thành việc kiểm định an toàn và tính năng kỹ thuật của thiết bị y tế trước ngày 01 tháng 01 năm 2028 theo đúng quy trình kiểm định do Bộ trưởng Bộ Y tế ban hành.”.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 4
      khoan: 1
      noi_dung: 'Điều 4. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 4
      khoan: 2
      noi_dung: '2. Thông tư số 59/2025/TT-BYT sửa đổi, bổ sung một số điều của Thông tư số 05/2022/TT-BYT quy định chi tiết thi hành một số điều của Nghị định số 98/2021/NĐ-CP về quản lý thiết bị y tế hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 5
      noi_dung: 'Điều 5. Điều khoản tham chiếu Trường hợp các văn bản dẫn chiếu trong Thông tư này được thay thế hoặc sửa đổi, bổ sung thì thực hiện theo văn bản thay thế hoặc sửa đổi, bổ sung đó.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 6
      noi_dung: 'Điều 6. Tổ chức thực hiện Cục Hạ tầng và Thiết bị y tế, Chánh Văn phòng Bộ, Thủ trưởng các cơ quan, đơn vị thuộc Bộ Y tế và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
    - dieu: 6
      noi_dung: 'Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, các tổ chức, cá nhân phản ánh về Bộ Y tế (Cục Hạ tầng và Thiết bị y tế) để được xem xét, giải quyết./.'
      trang_pdf: 3
      sha256_pdf: 279f776ea2f988963a0750b31d9d4e9b00b6e4ed4718ea2fc740d79624d30452
