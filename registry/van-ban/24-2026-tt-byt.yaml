  pham_vi: |
    TT 24/2026/TT-BYT ban hành 30/06/2026, ký Bộ trưởng Bộ Y tế (theo OCR PDF bản quét 3 trang, đã đọc toàn văn).
    Điều 1: Phạm vi điều chỉnh (xác định mức rủi ro + sửa 05/2022/TT-BYT).
    Điều 2.1: Mức rủi ro theo NĐ 98/2021.
    Điều 2.2: Mã số HS theo TT 19/2024/TT-BYT.
    Điều 3: Sửa đổi Điều 8 (lộ trình kiểm định) của 05/2022/TT-BYT — mua sắm sau 30/06/2027 phải kiểm định; trước 01/07/2027 hoàn thành kiểm định trước 01/01/2028.
    Điều 4.1: Hiệu lực 01/07/2026.
    Điều 4.2: Bãi bỏ TT 59/2025/TT-BYT kể từ ngày TT này có hiệu lực.
    Điều 5: Điều khoản tham chiếu (forward).
    Căn cứ: Luật Điều ước quốc tế 108/2016/QH13, Luật Chất lượng SPHH 05/2007/QH12 (sửa bởi 78/2025/QH15), NĐ 42/2025/NĐ-CP (chức năng BYT), NĐ 98/2021/NĐ-CP (sửa bởi 07/2023 + 96/2023 + 04/2025), NĐ 37/2026/NĐ-CP.
