  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: 'PHỤ LỤC DANH MỤC DƯỢC LIỆU, THUỐC CỔ TRUYỀN CÓ MỨC ĐỘ RỦI RO TRUNG BÌNH THUỘC TRÁCH NHIỆM QUẢN LÝ CỦA BỘ Y TẾ (Ban hành kèm theo Thông tư số 26 /2026/TT-BYT ngày 01 tháng 7 năm 2026 của Bộ trưởng Bộ Y tế) STT 1 Tên nhóm hàng hóa Dược liệu Mã số HS Danh mục 11 ban hành kèm theo Thông tư số 09/2024/TT-BYT của Bộ trưởng Bộ Y tế ban hành các danh mục thuốc, nguyên liệu làm thuốc dùng cho người và mỹ phẩm xuất khẩu, nhập khẩu đã được xác định mã số hàng hóa theo danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam. Yêu cầu quản lý chất lượng tương ứng Cấp Giấy đăng ký lưu hành hoặc cấp Giấy phép nhập khẩu hoặc Công bố Tiêu chuẩn chất lượng và các biện pháp quản lý chất lượng khác theo quy định của Luật Dược số 105/2016/QH13 được sửa đổi, bổ sung bởi Luật số 44/2024/QH15, Nghị định số 163/2025/NĐ-CP của Chính phủ quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Dược, Thông tư số 32/2025/TT-BYT của Bộ trưởng Bộ Y tế quy định quản lý về chất lượng thuốc cổ truyền, vị thuốc cổ truyền, dược liệu, Thông tư số 29/2025/TT-BYT của Bộ trưởng Bộ Y tế quy định về việc đăng ký lưu hành thuốc cổ truyền, vị thuốc cổ truyền, dược liệu và các văn bản quy phạm pháp luật về dược khác có liên quan.'
      trang_pdf: 1
