    - dieu: 1
      khoan: 2
      noi_dung: '2 Thuốc cổ truyền Danh mục 13 ban hành Cấp Giấy đăng ký lưu hành kèm theo Thông tư số hoặc cấp Giấy phép nhập khẩu đối với thuốc cổ truyền 09/2024/TT-BYT. chưa có số đăng ký lưu hành tại Việt Nam hoặc công bố đáp ứng tiêu chuẩn chế biến, bào chế thuốc cổ truyền trong cơ sở khám bệnh, chữa bệnh bằng y học cổ truyền và các biện pháp quản lý chất lượng khác theo quy định của Luật Dược số 105/2016/QH13 được sửa đổi, bổ sung bởi Luật số 44/2024/QH15, Nghị định số 163/2025/NĐ-CP, Thông tư số 32/2025/TTBYT, Thông tư số 29/2025/TT-BYT, Thông tư số 32/2020/TT-BYT của Bộ trưởng Bộ Y tế quy định tiêu chuẩn chế biến, bào chế thuốc cổ truyền trong các cơ sở khám bệnh, chữa bệnh bằng y học cổ truyền và các văn bản quy phạm pháp luật về dược khác có liên quan.'
