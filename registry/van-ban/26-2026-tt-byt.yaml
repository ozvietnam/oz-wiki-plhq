  pham_vi: |
    TT 26/2026/TT-BYT ban hành 01/07/2026, ký Bộ trưởng Bộ Y tế (theo OCR PDF bản quét 2 trang, đã đọc toàn văn).
    Là phụ lục kèm theo TT — nội dung là Danh mục dược liệu, thuốc cổ truyền rủi ro trung bình thuộc trách nhiệm quản lý BYT.
    Dẫn chiếu: Luật Dược 105/2016/QH13 (sửa bởi 44/2024/QH15), NĐ 163/2025/NĐ-CP, TT 32/2025/TT-BYT, TT 29/2025/TT-BYT, TT 32/2020/TT-BYT, TT 09/2024/TT-BYT (Danh mục II + Danh mục 13).
    Không có điều khoản "Hiệu lực thi hành" riêng (là phụ lục ban hành kèm TT khác).
