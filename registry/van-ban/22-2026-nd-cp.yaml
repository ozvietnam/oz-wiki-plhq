xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=216688), toàn văn PDF ký số 87 trang trên datafiles.chinhphu.vn (raw/download/datafiles.chinhphu.vn/22-2026-nd-cp.pdf, Phó Thủ tướng Nguyễn Chí Dũng ký, SHA-256 717ba0ba5e6027daaf1b4893685ce71fb50952bcdaf2993edd2e271b6919c622) và trang wiki/sources/22-2026-nd-cp.md: gồm 7 chương, 71 điều và Phụ lục 17 biểu mẫu; ban hành ngày 16-01-2026, có hiệu lực thi hành kể từ ngày ký ban hành 16-01-2026 theo khoản 1 Điều 69; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định chi tiết Điều 5, Điều 7b, Điều 8a, khoản 4 Điều 8b, Điều 8c, Điều 11a, Điều 14, Điều 17, Điều 19, điểm c khoản 2 Điều 21, khoản 3 Điều 25, điểm c khoản 1 Điều 27, Điều 29, Điều 32, Điều 35, khoản 2 Điều 39, Điều 44, Điều 51, Điều 57, Điều 71 của Luật Tiêu chuẩn và quy chuẩn kỹ thuật số 68/2006/QH11 được sửa đổi, bổ sung bởi Luật số 35-2018-QH14 và Luật số 70/2025/QH15 (sau đây gọi là Luật) và biện pháp để tổ chức, hướng dẫn thi hành Luật về tham vấn trong quá trình xây dựng tiêu chuẩn quốc gia, quy chuẩn kỹ thuật; hợp tác quốc tế về tiêu chuẩn và quy chuẩn kỹ thuật; ban kỹ thuật tiêu chuẩn quốc gia; đính chính tiêu chuẩn quốc gia, quy chuẩn kỹ thuật; phổ biến tiêu chuẩn quốc gia; công bố tiêu chuẩn áp dụng; đăng ký quy chuẩn kỹ thuật, công bố hợp chuẩn, công bố hợp quy, dấu hợp chuẩn, dấu hợp quy; trách nhiệm của các cơ quan, tổ chức, cá nhân hoạt động trong lĩnh vực tiêu chuẩn và lĩnh vực quy chuẩn kỹ thuật.'
    - dieu: 2
      noi_dung: 'Nghị định này áp dụng đối với tổ chức, cá nhân Việt Nam, tổ chức, cá nhân nước ngoài, người Việt Nam định cư ở nước ngoài có hoạt động liên quan đến tiêu chuẩn, quy chuẩn kỹ thuật và đánh giá sự phù hợp tại Việt Nam.'
    - dieu: 4
      noi_dung: '1. Sản phẩm, hàng hoá được sản xuất để sử dụng trong nước; sản phẩm, hàng hoá được sản xuất để xuất khẩu; sản phẩm, hàng hoá nhập khẩu. 2. Dịch vụ, quá trình được phân loại tại Hệ thống ngành kinh tế của Việt Nam theo quy định của Thủ tướng Chính phủ. 3. Môi trường, các yếu tố tác động đến môi trường và biện pháp quản lý, bao gồm: môi trường đất, nước, không khí; tiếng ồn, độ rung, bức xạ, phóng xạ; chất thải rắn, nước thải, khí thải; đa dạng sinh học; phương tiện, công cụ và hoạt động quản lý, bảo vệ và gìn giữ môi trường, biến đổi khí hậu. 4. Các đối tượng khác trong hoạt động kinh tế - xã hội đáp ứng yêu cầu xây dựng tiêu chuẩn, quy chuẩn kỹ thuật.'
    - dieu: 9
      khoan: 7
      noi_dung: '7. Khi xây dựng quy chuẩn kỹ thuật, cơ quan ban hành quy chuẩn kỹ thuật có trách nhiệm rà soát các quy định liên quan tới quy chuẩn kỹ thuật bảo đảm tuân thủ các cam kết TBT trong các điều ước quốc tế mà Việt Nam là thành viên. Trường hợp viện dẫn đến tiêu chuẩn quốc tế, tiêu chuẩn khu vực, tiêu chuẩn nước ngoài đối với các yêu cầu kỹ thuật, cơ quan ban hành phải bảo đảm sẵn có bản tiếng Việt của tài liệu viện dẫn để tổ chức, cá nhân liên quan tham khảo khi được yêu cầu.'
    - dieu: 10
      khoan: 1
      noi_dung: '1. Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng là nền tảng số thống nhất, hiện đại, tích hợp dữ liệu liên quan, phục vụ công tác quản lý nhà nước và cung cấp thông tin hỗ trợ tổ chức, cá nhân theo quy định của pháp luật. Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng là một cấu phần thuộc nền tảng số quản lý hạ tầng chất lượng quốc gia được xây dựng, vận hành, duy trì để phục vụ quản lý nhà nước, doanh nghiệp, người tiêu dùng và quản lý hạ tầng chất lượng quốc gia theo quy định pháp luật.'
    - dieu: 25
      noi_dung: '1. Công bố tiêu chuẩn áp dụng là việc tổ chức, cá nhân sản xuất, kinh doanh thông báo tiêu chuẩn áp dụng với các đặc tính cơ bản của sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường. Tiêu chuẩn công bố áp dụng có thể bao gồm: tiêu chuẩn quốc tế, tiêu chuẩn khu vực, tiêu chuẩn nước ngoài, tiêu chuẩn quốc gia, tiêu chuẩn cơ sở. 2. Việc công bố tiêu chuẩn áp dụng được thực hiện thông qua hình thức ghi số hiệu tiêu chuẩn được áp dụng hoặc các đặc tính cơ bản trên nhãn hoặc bao gói sản phẩm, hàng hoá, hoặc trong các tài liệu hướng dẫn, giới thiệu kèm theo sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường và các hình thức thích hợp khác. 3. Tổ chức, cá nhân chịu trách nhiệm trước pháp luật về nội dung của tiêu chuẩn áp dụng do mình công bố, có trách nhiệm cung cấp các tài liệu kỹ thuật có liên quan chứng minh sản phẩm, hàng hoá, dịch vụ, quá trình, môi trường và các đối tượng khác trong hoạt động kinh tế - xã hội phù hợp với tiêu chuẩn đã công bố khi được cơ quan có thẩm quyền yêu cầu.'
    - dieu: 31
      noi_dung: '1. Cơ quan ban hành quy chuẩn kỹ thuật tổ chức rà soát, đánh giá hiệu quả việc áp dụng quy chuẩn kỹ thuật định kỳ 05 năm hoặc sớm hơn khi cần thiết, kể từ ngày ban hành. 2. Đánh giá hiệu quả việc áp dụng quy chuẩn kỹ thuật được thực hiện trên cơ sở các yếu tố: sự phù hợp của quy chuẩn kỹ thuật với yêu cầu thực tế, yêu cầu hội nhập quốc tế; bảo đảm an toàn, an ninh; tác động đến hiệu quả kinh tế, môi trường, xã hội; các chi phí và lợi ích liên quan.'
    - dieu: 35
      noi_dung: '1. Bộ, cơ quan ngang bộ, Ủy ban nhân dân tỉnh, thành phố gửi quy chuẩn kỹ thuật đã được ban hành đến Bộ Khoa học và Công nghệ chậm nhất sau 15 ngày, kể từ ngày ban hành quy chuẩn kỹ thuật. 2. Bộ Khoa học và Công nghệ tiếp nhận quy chuẩn kỹ thuật và cập nhật lên Cơ sở dữ liệu Quốc gia về tiêu chuẩn, đo lường, chất lượng.'
    - dieu: 37
      khoan: 1
      noi_dung: '1. Công bố hợp chuẩn được thực hiện theo các nguyên tắc sau: a) Công bố hợp chuẩn là hoạt động tự nguyện; b) Tổ chức, cá nhân có quyền lựa chọn, liệt kê các tiêu chuẩn áp dụng cho sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội của mình trong bản thông báo công bố hợp chuẩn; c) Người chịu trách nhiệm về sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội phải ký xác nhận vào bản thông báo công bố hợp chuẩn; d) Tổ chức, cá nhân thông báo bản công bố hợp chuẩn qua Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng. Trường hợp Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng bị lỗi hoặc chưa hoàn thiện hạ tầng, tổ chức, cá nhân thông báo bản công bố hợp chuẩn theo hình thức nộp trực tiếp hoặc qua dịch vụ bưu chính; đ) Tổ chức, cá nhân phải hoàn toàn chịu trách nhiệm về nội dung của bản thông báo công bố hợp chuẩn; e) Tổ chức, cá nhân có trách nhiệm lưu giữ đầy đủ các tài liệu kỹ thuật liên quan đến sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội đã công bố hợp chuẩn và phải cung cấp đầy đủ khi được yêu cầu.'
    - dieu: 37
      khoan: 2
      noi_dung: '2. Công bố hợp quy được thực hiện theo các nguyên tắc sau: a) Công bố hợp quy là hoạt động bắt buộc, trừ trường hợp được miễn công bố hợp quy theo quy định tại khoản 2 Điều 48 của Luật; b) Tổ chức, cá nhân có trách nhiệm xác định, liệt kê đầy đủ các quy chuẩn kỹ thuật tương ứng bắt buộc phải áp dụng cho sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội của mình trong bản đăng ký công bố hợp quy; c) Cơ quan chuyên môn có trách nhiệm hướng dẫn tổ chức, cá nhân trong việc xác định, liệt kê đầy đủ các quy chuẩn kỹ thuật tương ứng bắt buộc áp dụng khi thực hiện công bố hợp quy; d) Người chịu trách nhiệm về sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội phải ký xác nhận vào bản đăng ký công bố hợp quy; đ) Tổ chức, cá nhân đăng ký bản công bố hợp quy qua Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng. Trường hợp Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng bị lỗi hoặc chưa hoàn thiện hạ tầng, tổ chức, cá nhân đăng ký bản công bố hợp quy theo hình thức nộp trực tiếp hoặc qua dịch vụ bưu chính; e) Tổ chức, cá nhân phải hoàn toàn chịu trách nhiệm về nội dung của bản đăng ký công bố hợp quy; g) Tổ chức, cá nhân có trách nhiệm lưu giữ đầy đủ các tài liệu kỹ thuật liên quan đến sản phẩm, hàng hóa, dịch vụ, quá trình, môi trường hoặc các đối tượng khác trong hoạt động kinh tế - xã hội đã công bố hợp quy và phải cung cấp đầy đủ khi được yêu cầu.'
    - dieu: 38
      noi_dung: '1. Dấu hợp chuẩn do tổ chức chứng nhận sự phù hợp cấp cho đối tượng được chứng nhận hợp chuẩn. Hình dạng, kết cấu và cách thể hiện dấu hợp chuẩn do tổ chức chứng nhận sự phù hợp quy định theo hướng dẫn của Bộ Khoa học và Công nghệ. 2. Dấu hợp quy do tổ chức chứng nhận hợp quy cấp cho sản phẩm, hàng hoá được chứng nhận hợp quy hoặc do tổ chức, cá nhân công bố hợp quy gắn cho sản phẩm, hàng hoá được công bố hợp quy sau khi đã đăng ký công bố hợp quy. Hình dạng, kết cấu và cách thể hiện dấu hợp quy do Bộ Khoa học và Công nghệ quy định. 3. Tổ chức, cá nhân sản xuất, kinh doanh sau khi được chứng nhận hợp chuẩn tự thể hiện dấu hợp chuẩn hoặc sau khi được chứng nhận hợp quy tự thể hiện dấu hợp quy trên sản phẩm, hàng hoá, bao gói sản phẩm, hàng hoá, tài liệu về sản phẩm, hàng hoá, dịch vụ, quá trình, môi trường đã được chứng nhận hợp chuẩn hoặc chứng nhận hợp quy. 4. Bộ trưởng Bộ Khoa học và Công nghệ quy định chi tiết Điều này.'
    - dieu: 40
      noi_dung: '1. Việc thừa nhận lẫn nhau các kết quả đánh giá sự phù hợp giữa các nước, vùng lãnh thổ bao gồm: kết quả chứng nhận sự phù hợp; kết quả thử nghiệm; kết quả giám định. 2. Bộ quản lý ngành, lĩnh vực chủ trì, phối hợp với Bộ Khoa học và Công nghệ, các bộ, cơ quan ngang bộ liên quan tổ chức thực hiện các hiệp định thừa nhận lẫn nhau giữa Việt Nam và các quốc gia, vùng lãnh thổ về kết quả đánh giá sự phù hợp, thực hiện theo pháp luật về ký kết và thực hiện Điều ước quốc tế mà Cộng hoà xã hội chủ nghĩa Việt Nam là thành viên. 3. Bộ Khoa học và Công nghệ phối hợp với Bộ Ngoại giao hướng dẫn việc ký kết và thực hiện các thoả thuận thừa nhận lẫn nhau về kết quả đánh giá sự phù hợp giữa tổ chức đánh giá sự phù hợp của Việt Nam với tổ chức đánh giá sự phù hợp của các quốc gia, vùng lãnh thổ, tổ chức quốc tế và khu vực. 4. Bộ trưởng Bộ Khoa học và Công nghệ quy định chi tiết Điều này.'
    - dieu: 41
      noi_dung: '1. Việc thừa nhận đơn phương kết quả đánh giá sự phù hợp của tổ chức đánh giá sự phù hợp nước ngoài được thực hiện trên nguyên tắc bảo đảm tính khách quan, minh bạch, không phân biệt đối xử, không tạo rào cản kỹ thuật không cần thiết đối với thương mại quốc tế, phù hợp với điều ước quốc tế mà Việt Nam là thành viên. 2. Trong các lĩnh vực mà năng lực thử nghiệm, chứng nhận, kiểm định trong nước còn hạn chế, chưa đáp ứng yêu cầu và chuẩn mực quốc tế, ưu tiên thừa nhận đơn phương kết quả đánh giá sự phù hợp của tổ chức đã được công nhận bởi tổ chức công nhận là thành viên ký thỏa thuận/thỏa ước thừa nhận lẫn nhau (MRA/MLA) của các tổ chức hợp tác công nhận quốc tế hoặc khu vực (Tổ chức Công nhận các phòng thử nghiệm quốc tế - ILAC, Diễn đàn Công nhận Quốc tế - IAF, Tổ chức hợp tác Công nhận khu vực Châu Á Thái Bình Dương - APAC) hoặc tổ chức công nhận được thừa nhận theo các Thỏa thuận Thừa nhận lẫn nhau (MRA/MLA) mà Việt Nam tham gia. 3. Bộ quản lý ngành, lĩnh vực xem xét, quyết định về việc thừa nhận đơn phương kết quả đánh giá sự phù hợp trên cơ sở các quy định của ngành, lĩnh vực về hồ sơ năng lực, tính độc lập, khách quan của tổ chức đánh giá sự phù hợp nước ngoài và mức độ phù hợp với tiêu chuẩn quốc gia, tiêu chuẩn quốc tế, quy chuẩn kỹ thuật quốc gia liên quan. 4. Bộ quản lý ngành, lĩnh vực có trách nhiệm giám sát việc thực hiện thừa nhận đơn phương kết quả đánh giá sự phù hợp định kỳ hoặc đột xuất để bảo đảm duy trì yêu cầu về năng lực kỹ thuật, tính phù hợp của kết quả đánh giá sự phù hợp đã được thừa nhận đơn phương. 5. Bộ trưởng Bộ Khoa học và Công nghệ quy định chi tiết Điều này.'
    - dieu: 62
      noi_dung: '1. Tổ chức công nhận thành lập tại nước ngoài được thực hiện hoạt động công nhận ở Việt Nam trong trường hợp là thành viên đã ký kết tham gia thỏa thuận thừa nhận lẫn nhau kết quả đánh giá sự phù hợp của các tổ chức công nhận khu vực hoặc quốc tế. 2. Trước khi thực hiện công nhận tổ chức đánh giá sự phù hợp tại Việt Nam, tổ chức công nhận phải thông báo ít nhất trước 20 ngày về Bộ Khoa học và Công nghệ (Việt Nam). 3. Sau khi thực hiện đánh giá công nhận tại Việt Nam, tổ chức công nhận phải báo cáo kết quả thực hiện về Bộ Khoa học và Công nghệ (Việt Nam). 4. Tổ chức công nhận nước ngoài có hoạt động công nhận ở Việt Nam không tuân thủ các quy định tại Điều này thì chứng chỉ công nhận không được thừa nhận tại Việt Nam.'
    - dieu: 65
      khoan: 2
      noi_dung: '2. Ủy ban Tiêu chuẩn Đo lường Chất lượng quốc gia trực thuộc Bộ Khoa học và Công nghệ thực hiện vai trò, chức năng, nhiệm vụ, quyền hạn của Cơ quan tiêu chuẩn quốc gia, có trách nhiệm giúp Bộ trưởng Bộ Khoa học và Công nghệ thực hiện quản lý nhà nước về hoạt động trong lĩnh vực tiêu chuẩn và lĩnh vực quy chuẩn kỹ thuật.'
    - dieu: 69
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành.'
    - dieu: 70
      noi_dung: '1. Các tổ chức đánh giá sự phù hợp đã được các bộ quản lý ngành, lĩnh vực, Ủy ban nhân dân tỉnh, thành phố tổ chức thực hiện việc cấp Giấy chứng nhận đăng ký hoạt động đánh giá sự phù hợp trước ngày Nghị định này có hiệu lực thi hành, tiếp tục được thực hiện hoạt động đánh giá sự phù hợp cho đến hết thời hạn hiệu lực của Giấy chứng nhận. 2. Các tổ chức công nhận đã được Bộ Khoa học và Công nghệ cấp Giấy chứng nhận đăng ký lĩnh vực hoạt động trước ngày Nghị định này có hiệu lực thi hành, tiếp tục được thực hiện hoạt động công nhận cho đến hết thời hạn hiệu lực của Giấy chứng nhận. 3. Các cơ sở đào tạo chuyên gia đánh giá chứng nhận sản phẩm, chuyên gia đánh giá hệ thống quản lý đã được cơ quan, người có thẩm quyền cấp Thông báo tiếp nhận hồ sơ công bố năng lực thực hiện hoạt động đào tạo trước ngày Nghị định này có hiệu lực thi hành, tiếp tục được thực hiện hoạt động đào tạo cho đến hết thời hạn hiệu lực của Thông báo. 4. Đối với đơn, hồ sơ đăng ký hoạt động đánh giá sự phù hợp, cơ sở đào tạo chuyên gia đánh giá chứng nhận sản phẩm, chuyên gia đánh giá hệ thống quản lý đã được cơ quan, người có thẩm quyền tiếp nhận trước thời điểm Nghị định này có hiệu lực nhưng chưa được giải quyết xong, thì cơ quan, người có thẩm quyền tiếp tục xử lý theo quy định của pháp luật tại thời điểm tiếp nhận đơn, hồ sơ.'
    - dieu: 71
      noi_dung: '1. Bộ trưởng Bộ Khoa học và Công nghệ có trách nhiệm hướng dẫn thực hiện Nghị định này. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố và tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./.'
