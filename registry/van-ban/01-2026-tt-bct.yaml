xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (9 trang, ký Thứ trưởng Trương Thanh Hoài ngày 17-01-2026) + vanban.chinhphu.vn docid=216719 + moit.gov.vn (trạng thái Đã có hiệu lực): 4 Chương, 12 Điều + Phụ lục biểu mẫu. Hướng dẫn Luật Hóa chất 69/2025/QH15 và Nghị định 26/2026/NĐ-CP. Điều 11 quy định điều khoản chuyển tiếp. Điều 12 (Hiệu lực thi hành): khoản 1 hiệu lực từ ngày ký (17-01-2026); khoản 2 thay thế Thông tư 32/2017/TT-BCT (ngày 28-12-2017) và Thông tư 17/2022/TT-BCT (ngày 27-10-2022); khoản 3 bãi bỏ Điều 7 Thông tư 38/2025/TT-BCT (ngày 19-06-2025). Đối chiếu đến 12-11-2026 chưa có văn bản sửa đổi, bổ sung hay thay thế.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-05-ai-live@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh Thông tư này quy định chỉ tiết và hướng dẫn thi hành về: a) Phân cấp thủ tục cấp, cấp lại, cấp điều chỉnh Giấy phép sản xuất, Giấy phép kinh doanh, Giấy phép sản xuất và kinh doanh hóa chat cân kiểm soát đặc biệt nhóm | và nhóm 2; cập, cấp lại, cấp điều chỉnh, gia hạn giấy phép x xuất khâu, nhập khẩu hóa chất cần kiểm soát đặc biệt nhóm 1 và nhóm 2;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Giải thích từ ngữ 1. Hóa chất cần kiểm soát đặc biệt nhóm 1 gồm các hóa chất nhóm 1 được quy định tại Phụ lục II Nghị định sô 24/2026/NĐ-CP. 2. Hóa chất cần kiểm soát đặc biệt nhóm 2 gồm các hóa chất nhóm 2 được được quy định tại Phụ luc III Nghị định sô 24/2026/NĐ-CP.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Phân cấp thực hiện thủ tục hành chính về hóa chất trong lĩnh vực quần lý của Bộ Công Thương 1. Ủy ban nhân dân cấp tỉnh nơi tổ chức, cá nhân đặt trụ sở chính a) Tiép nhận hồ sơ, tổ chức thâm định, cấp, cấp lại, cấp điều chỉnh Giấy phép sản xuất, Giấy phép kinh doanh, Giấy phép sản xuất và kinh doanh hóa chất cần kiểm soát đặc biệt cho tô chức sản xuất, kinh doanh hóa chất cần kiểm
      trang_pdf: 2
    - dieu: 4
      noi_dung: 'Điều 4. Tổ chức thâm định cấp Giấy phép sản xuất, Giấy phép kinh doanh, Giấy phép sản xuất và kinh đoanh hóa chất cần kiểm soát đặc biệt nhóm 2 1. Ủy ban nhân dân cấp tỉnh nơi tổ chức đặt trụ sở chính khi tiếp nhận hồ sơ, thực hiện các quy trình sau: a) Trường hợp tổ chức chỉ có hoạt động sản xuất, kinh doanh, lưu trữ tại địa phương nơi tô chức đặt trụ sở chính và không có sản xuất, kinh doanh, lưu trữ tại địa phương khác'
      trang_pdf: 3
    - dieu: 5
      noi_dung: 'Điều 5. Nội dung, mẫu phiếu an toàn hóa chất 1. Phiếu an toàn hóa chất bao gồm các nội dung co bari sau: a) Nhận dạng hóa chất và thông tin về nhà cung cấp; b) Nhận dang đặc tính nguy hiểm của hóa chất; c) Thông tin về thành phần các chất; d) Biện pháp sơ cứu về y tế; d) Biện pháp xử lý khi có hỏa hoạn; e) Biện pháp phòng ngừa, ứng phó khi có sự cố; ø) Yêu cầu về sử dung, bảo quản; h) Kiểm soát phơi nhiễm/yêu cầu về thiết bị bảo vệ cá nhân;'
      trang_pdf: 4
    - dieu: 6
      noi_dung: 'Điều 6. Các biếu mẫu sử dụng trong quản lý hóa chất . 1. Các biểu mẫu sử dụng trong thủ tục cấp, cấp lại, cấp điều chỉnh Giấy phép nhập khẩu hóa chất cắm được quy định tại Phụ lục II ban hành kèm theo Thông tư này, bao gồm: a) Mẫu 02a: Văn bản đề nghị cấp Giấy phép nhập khẩu hóa chất cắm; b) Mẫu 02b: Văn bản đề nghị cấp lại, cấp điều chỉnh Giấy phép nhập khẩu hóa chất cấm; c) Mẫu 02c: Mẫu Giấy phép nhập khẩu hóa chất cắm.'
      trang_pdf: 5
    - dieu: 8
      noi_dung: Điều 8. Phiếu kiếm soát mua, bán hóa chất cần kiểm soát đặc biệt 1. Ké từ ngày 01 tháng 01 năm 2026, trong thời hạn 10 ngày kể từ ngày giao hàng, tổ chức kinh doanh hóa chất thuộc Danh mục hóa chất cần kiếm soát đặc biệt phải lập phiếu kiểm soát mua, bán hóa chất cần kiểm soát đặc biệt theo mẫu tại Phụ lục IX được ban hành kèm theo Thông tư này thông qua hệ thống định danh, truy xuất nguồn gốc hóa chất cần kiểm soát đặc biệt trên nền tảng
      trang_pdf: 7
    - dieu: 9
      noi_dung: Điều 9. Hóa chất không được sử dụng trong lĩnh vực công thương Hóa chất không được sử dụng trong lĩnh vực công thương bao gồm các hóa chất cấm được quy định tại Luật Đầu tư trừ trường hợp cơ quan có thấm quyền cho phép.
      trang_pdf: 7
    - dieu: 10
      noi_dung: 'Điều 10. Chuyén đổi số trong quản lý nhà nước về hóa chất 1. Cơ sở dit liệu chuyên ngành hóa chất bao gồm các dir liệu sau: a) Các đữ liệu về hóa chất, về hoạt động hóa chất, ngành công nghiệp hóa chất, hóa chất nguy hiểm trong sản phẩm, hàng hóa;'
      trang_pdf: 7
    - dieu: 11
      noi_dung: Điều 11. Hóa chất nguy hiểm trong sản phẩm, hàng hóa chưa có quy chuẩn kỹ thuật 1. Danh mục hóa chất nguy hiểm trong sản phẩm hàng hóa phải công bố thông tin trong lĩnh vực công nghiệp ban hành tại Phụ lục XIX ban hành kèm theo Thông tư này.
      trang_pdf: 8
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày {† tháng O{ năm 2026. 2. Thông tư số 32/2017/TT-BCT ngày 28 tháng 12 nam 2017 của Bộ trưởng Bộ Công Thương quy định cụ thể và hướng dẫn thi hành một số điều của Luật Hóa chất và Nghị định số 113/2017/NĐ-CP ngày 09 tháng 10 năm 2017 của Chính phủ quy định chỉ tiết và hướng dẫn thi hành một số điều của Luật Hóa chất và Thông tư số 17/2022/TT-BCT ngày 27 tháng 10 năm 2022
      trang_pdf: 9
ghi_chu: Trinh sát đêm 11/11, bổ sung nguồn bậc A và nạp toàn văn ngày 12/11. Hóa chất nguy hiểm trong sản phẩm hàng hóa — cổng khai báo hóa chất nhập. Đủ gói với NĐ 26/2026/NĐ-CP và Luật 69/2025/QH15 đã có. Điều 12 khoản 2 (thay thế TT 32/2017/TT-BCT, TT 17/2022/TT-BCT) và khoản 3 (bãi bỏ Điều 7 TT 38/2025/TT-BCT) chưa ghi vào quan_he vì các văn bản đó chưa có trong sổ.
