xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (9 trang, ký Thứ trưởng Trương Thanh Hoài ngày 17-01-2026) + vanban.chinhphu.vn docid=216719 + moit.gov.vn (trạng thái Đã có hiệu lực): 4 Chương, 12 Điều + Phụ lục biểu mẫu. Hướng dẫn Luật Hóa chất 69/2025/QH15 và Nghị định 26/2026/NĐ-CP. Điều 11 quy định điều khoản chuyển tiếp. Điều 12 (Hiệu lực thi hành): khoản 1 hiệu lực từ ngày ký (17-01-2026); khoản 2 thay thế Thông tư 32/2017/TT-BCT (ngày 28-12-2017) và Thông tư 17/2022/TT-BCT (ngày 27-10-2022); khoản 3 bãi bỏ Điều 7 Thông tư 38/2025/TT-BCT (ngày 19-06-2025). Đối chiếu đến 12-11-2026 chưa có văn bản sửa đổi, bổ sung hay thay thế.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-05-ai-live@ozvietnam
ghi_chu: 'Trinh sát đêm 11/11, bổ sung nguồn bậc A và nạp toàn văn ngày 12/11. Hóa chất nguy hiểm trong sản phẩm hàng hóa — cổng khai báo hóa chất nhập. Đủ gói với NĐ 26/2026/NĐ-CP và Luật 69/2025/QH15 đã có. Điều 12 khoản 2 (thay thế TT 32/2017/TT-BCT, TT 17/2022/TT-BCT) và khoản 3 (bãi bỏ Điều 7 TT 38/2025/TT-BCT) chưa ghi vào quan_he vì các văn bản đó chưa có trong sổ.'
