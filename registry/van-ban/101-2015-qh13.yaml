  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Bộ luật tố tụng hình sự quy định trình tự, thủ tục tiếp nhận, giải quyết nguồn tin về tội phạm, khởi tố, điều tra, truy 16, xét xử và một số thủ tục thi hành án hình sự; nhiệm vụ, quyền hạn và mối quan hệ giữa các cơ quan có thâm quyền tiến hành tố tụng; nhiệm vụ, quyền hạn và trách nhiệm của người có thẩm quyền tiến hành tổ tung; quyền và nghĩa vụ của người tham gia tố tung, cơ quan, tô chức, cá nhân;
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Nhiệm vụ của Bộ luật tố tụng hình sự Bộ luật tố tụng hình sự có nhiệm vụ bảo đảm phát hiện chính xác và xử lý công minh, kịp thời mọi hành vi phạm tội, phòng ngừa, ngăn chặn tội phạm, không dé lọt tội phạm, không làm oan người vô tội;
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Hiệu lực của Bộ luật tố tụng hình sự 1. Bộ luật tố tụng hình sự có hiệu lực đối với mọi hoạt động tố tụng hình sự trên lãnh thé nước Cộng hòa xã hội chủ nghĩa Việt Nam. 2. Hoạt động tố tụng hình sự đối với người nước ngoài phạm tội trên lãnh thô nước Cộng hòa xã hội chủ nghĩa Việt Nam được tiến hành theo quy định của điều ước quốc - tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên hoặc theo nguyên tắc có đi có lại.
      trang_pdf: 1
    - dieu: 35
      noi_dung: 'Điều 35. Cơ quan và người được giao nhiệm vụ tiến hành một số hoạt động điều tra 1. Cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra gồm: a) Các cơ quan của Bộ đội biên phòng; b) Các cơ quan của Hải quan; c) Các cơ quan của Kiểm lâm; d) Các cơ quan của lực lượng Cảnh sát biển; đ) Các cơ quan của Kiểm ngư; ,©) Các cơ quan của Công an nhân dân được giao nhiệm vụ tiến hành một số hoạt động điều tra;'
      trang_pdf: 11
    - dieu: 67
      noi_dung: 'Điều 67. Người chứng kiến 1. Người chứng kiến là người được cơ quan có thấm quyền tiến hành tố tụng yêu câu chứng kiến việc tiến hành hoạt động tố tụng theo quy định của Bộ luật này. 2. Những người sau đây không được làm người chứng kiến: a) Người thân thích của người bị buộc tội, người có thẩm quyền tiến hành tố tung; b) Người do nhược điểm về tâm thần hoặc thể chất mà không có khả năng nhận thức đúng sự việc; c) Người dưới 18 tuổi;'
      trang_pdf: 35
    - dieu: 99
      noi_dung: Điều 99. Dữ liệu điện tử 1. Dữ liệu điện tử là ký hiệu, chữ viết, chữ số, hình ảnh, âm thanh hoặc dang tương tự được tạo ra, lưu trữ, truyền đi hoặc nhận được bởi phương tiện điện tử. 2. Dữ liệu điện tử được thu thập từ phương tiện điện tử, mạng máy tính, mạng viễn thông, trên đường truyền và các nguồn điện tử khác.
      trang_pdf: 51
    - dieu: 130
      noi_dung: 'Điều 130. Hủy bé biện pháp kê biên tài sản, phong tỏa tài khoản 1. Biện pháp kê biên tài sản, phong tỏa tài khoản đang áp dụng phải được hủy bỏ khi thuộc một trong các trường hợp: a) Đình chỉ điều tra, đình chỉ vụ án; b) Đình chỉ điều tra đối với bị can, đình chỉ vụ án đối với bị can; c) Bị cáo được Tòa án tuyên không có tội; d) Bị cáo không bị phạt tiền, tịch thu tài sản và bồi thường thiệt hại.'
      trang_pdf: 68
    - dieu: 164
      noi_dung: 'Điều 164. Nhiệm vu, quyén han của các cơ quan của Bộ đội biên phòng, Hải quan, Kiểm lâm, lực lượng Cảnh sát biển, Kiém ngư và cơ quan khác của Công an nhân dân, Quân đội nhân dân được giao nhiệm vụ tiến hành một số hoạt động điều tra 1. Khi phát hiện hành vi có dấu hiệu tội phạm trong lĩnh vực và địa bàn quản lý của mình thì các cơ quan của Bộ đội biên phòng, Hải quan, Kiểm lâm, lực lượng Cảnh sát biển, Kiểm ngư được giao nhiệm vụ tiến hành một số hoạt động điều tra có nhiệm vụ, quyền hạn:'
      trang_pdf: 83
    - dieu: 198
      noi_dung: Điều 198. Tạm giữ tài liệu, đồ vật khi khám xét 1. Khi khám xét, Điều tra viên được tạm giữ. đồ vật là vật chứng và tài liệu có liên quan trực tiếp đến vụ án. Đối với đô vật thuộc loại cắm tàng trữ, lưu hành thì phải thu giữ và chuyển ngay cho cơ quan quản lý có thẩm quyền.
      trang_pdf: 103
    - dieu: 230
      noi_dung: 'Điều 230. Đình chỉ điều tra 1. Cơ quan điều tra ra quyết định đình chỉ điều tra khi thuộc một trong các trường hợp: a) Có một trong các căn cứ quy định tại khoản 2 Điều 155 và Điều 157 của Bộ luật này hoặc có căn cứ quy định tại Điêu 16 hoặc Điêu 29 hoặc khoản 2 Điều 91 của Bộ luật hình sự; b) Đã hết thời hạn điều tra vụ án mà không chứng minh được bị can đã thực hiện tội phạm.'
      trang_pdf: 114
ghi_chu: Bộ luật Tố tụng hình sự năm 2015 — quy định thẩm quyền tiến hành một số hoạt động điều tra của cơ quan Hải quan (được sửa đổi thuật ngữ đơn vị tại Luật 11/2026/QH16).
