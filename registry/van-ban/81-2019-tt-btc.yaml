ghi_chu: 'Văn bản nền tảng về phân luồng tờ khai: Điều 22 quy định Luồng 1 (Xanh) / Luồng 2 (Vàng) / Luồng 3 (Đỏ) theo mức độ rủi ro thấp - trung bình - cao. Điều 14 phân loại người khai hải quan thành 9 hạng rủi ro (Hạng 1 doanh nghiệp ưu tiên; Hạng 2 rất thấp; Hạng 3 thấp; Hạng 4 trung bình; Hạng 5 cao; Hạng 6 rất cao; Hạng 7-9 theo lịch sử vi phạm). Điều 10 phân loại mức độ tuân thủ pháp luật thành 5 Mức (1 doanh nghiệp ưu tiên; 2 tuân thủ cao; 3 tuân thủ trung bình; 4 tuân thủ thấp; 5 không tuân thủ). Điều 20 khoản 2 cho phép thủ trưởng cơ quan hải quan quyết định thay đổi hình thức, mức độ kiểm tra khi có thông tin nghi ngờ vi phạm. Đã bị sửa đổi, bổ sung bởi TT 06/2024/TT-BTC từ 15-03-2024. Người ký: Vũ Thị Mai.'
