  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/10/29/VB_32168.pdf, id=101701, SHA-256 37266a015d13d2418f42f43a2fd6fa2c48932415b5e518bf64e8198df2892695): Thông báo số 32168/TB-CHQ ngày 28-10-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ nguồn chuyển mạch dùng cho màn hình tivi 70-75 inch (ký, mã hiệu Model L75S6_FWD, Product S5T75R261B1/WVD; bản mạch điện tử gắn biến áp xung, đi-ốt cầu, cuộn lọc, cuộn cảm, IC nâng áp, IC dao động, IC LED Driver, Mosfet; chuyển đổi điện áp xoay chiều đầu vào 100-240VAC 50-60Hz sang điện áp một chiều đầu ra 108VDC cấp cho đèn LED tivi và 13VDC cấp cho mạch điều khiển màn hình tivi, công suất 264W), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.90; có hiệu lực từ ngày ký'
