xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=207164), toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/121-2022-nd-cp.pdf, 4 trang lời văn Nghị định, SHA-256 6996e9788fad1251716d436bf7b522bad0eccf67145a0f81be086bdd3bcb42c0) và trang wiki/sources/121-2022-nd-cp.md: ban hành 30-12-2022, có hiệu lực từ ngày ký 30-12-2022 đến hết 31-12-2027, gồm 7 Điều ban hành Biểu thuế nhập khẩu ưu đãi đặc biệt và Danh mục hàng hóa áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt ngoài hạn ngạch thực hiện Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân (AANZFTA) giai đoạn 2022 - 2027, thay thế toàn bộ Nghị định 158/2017/NĐ-CP theo khoản 2 Điều 6'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  ghi_chu: 'Crawl từ vanban.chinhphu.vn + datafiles.chinhphu.vn'
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định thuế suất thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân giai đoạn 2022 - 2027 và điều kiện được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định này.'
    - dieu: 2
      noi_dung: '1. Người nộp thuế theo quy định của Luật Thuế xuất khẩu, thuế nhập khẩu. 2. Cơ quan hải quan, công chức hải quan. 3. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hàng hoá xuất khẩu, nhập khẩu.'
    - dieu: 3
      khoan: 1
      noi_dung: '1. Ban hành kèm theo Nghị định này Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam (thuế suất thuế nhập khẩu ưu đãi đặc biệt áp dụng sau đây gọi là thuế suất AANZFTA) và Danh mục hàng hóa áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt ngoài hạn ngạch của Việt Nam để thực hiện Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân giai đoạn 2022 - 2027.'
    - dieu: 3
      khoan: 2
      noi_dung: '2. Cột “Mã hàng” và cột “Mô tả hàng hóa” tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này được xây dựng trên cơ sở Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam và chi tiết theo cấp mã 8 số hoặc 10 số. Trường hợp Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam được sửa đổi, bổ sung, người khai hải quan kê khai mô tả, mã hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu sửa đổi, bổ sung và áp dụng thuế suất của mã hàng hoá được sửa đổi, bổ sung quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này.'
    - dieu: 3
      khoan: 3
      noi_dung: '3. Cột “Thuế suất AANZFTA (%)”: Thuế suất áp dụng từ ngày 30 tháng 12 năm 2022 đến ngày 31 tháng 12 năm 2027.'
    - dieu: 3
      khoan: 4
      noi_dung: '4. Ký hiệu “*”: Hàng hóa nhập khẩu không được hưởng thuế suất AANZFTA tại thời điểm tương ứng.'
    - dieu: 3
      khoan: 5
      noi_dung: '5. Đối với hàng hóa nhập khẩu áp dụng hạn ngạch thuế quan gồm một số mặt hàng thuộc các nhóm hàng 04.07, 17.01, 24.01, 25.01, thuế suất AANZFTA trong hạn ngạch là mức thuế suất quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này; thuế suất AANZFTA ngoài hạn ngạch là mức thuế suất quy định tại Danh mục hàng hóa áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt ngoài hạn ngạch ban hành kèm theo Nghị định này. Thuế suất thuế nhập khẩu ngoài hạn ngạch đối với hàng hóa không thuộc Danh mục nêu trên thì áp dụng theo quy định tại Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khẩu ngoài hạn ngạch thuế quan của Chính phủ tại thời điểm nhập khẩu. Danh mục và lượng hạn ngạch thuế quan nhập khẩu hàng năm theo quy định của Bộ Công Thương.'
    - dieu: 4
      noi_dung: 'Hàng hóa nhập khẩu được áp dụng thuế suất AANZFTA phải đáp ứng đủ các điều kiện sau: 1. Thuộc Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định này. 2. Được nhập khẩu từ các nước là thành viên của Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân, bao gồm các nước sau: a) Bru-nây Đa-rút-xa-lam; b) Vương quốc Cam-pu-chia; c) Cộng hoà In-đô-nê-xi-a; d) Cộng hoà Dân chủ Nhân dân Lào; đ) Ma-lay-xi-a; e) Cộng hòa Liên bang Mi-an-ma; g) Cộng hoà Phi-líp-pin; h) Cộng hoà Xinh-ga-po; i) Vương quốc Thái Lan; k) Ôt-xtrây-lia; l) Niu Di-lân. 3. Đáp ứng các quy định về xuất xứ hàng hóa (bao gồm cả quy định về vận chuyển trực tiếp) và có Giấy chứng nhận xuất xứ hàng hóa (C/O) Mẫu AANZ hoặc có chứng từ chứng nhận xuất xứ hàng hóa theo quy định của Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân và quy định hiện hành của pháp luật.'
    - dieu: 5
      noi_dung: 'Hàng hóa từ khu phi thuế quan của Việt Nam nhập khẩu vào thị trường trong nước được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân phải đáp ứng đủ các điều kiện quy định tại khoản 1 và khoản 3 Điều 4 Nghị định này.'
    - dieu: 6
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực từ ngày ký ban hành.'
    - dieu: 6
      khoan: 2
      noi_dung: '2. Nghị định số 158/2017/NĐ-CP ngày 27 tháng 12 năm 2017 của Chính phủ ban hành Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định thành lập Khu vực Thương mại tự do ASEAN - Ôt-xtrây-lia - Niu Di-lân giai đoạn 2018 - 2022 hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành.'
    - dieu: 7
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
