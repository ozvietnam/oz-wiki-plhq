  pham_vi: "Đối chiếu thẻ vanban.chinhphu.vn (docid=70797, ghi ngày công bố 12-06-2008) và toàn văn đính kèm (72836_l13qh.doc, Chủ tịch Quốc hội Nguyễn Phú Trọng ký): Quốc hội khóa XII thông qua ngày 03-06-2008, có hiệu lực từ 01-01-2009 (khoản 1 Điều 16); được sửa đổi, bổ sung bởi Luật 31/2013/QH13, Luật 71/2014/QH13 và Luật 106/2016/QH13; hết hiệu lực toàn bộ từ ngày 01-07-2025 khi Luật Thuế giá trị gia tăng số 48/2024/QH15 ngày 26-11-2024 (vbpl.vn ItemID=174917, chưa nạp vào sổ) có hiệu lực thi hành (khoản 1 và khoản 2 Điều 18 Luật 48/2024/QH15)."
