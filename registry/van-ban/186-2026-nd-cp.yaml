ghi_chu: 'Sửa đổi, bổ sung Nghị định 99/2013/NĐ-CP lần thứ ba (sau NĐ 126/2021/NĐ-CP và NĐ 46/2024/NĐ-CP); cập nhật thẩm quyền xử phạt của Hải quan, Quản lý thị trường, Thanh tra, Công an, UBND và cơ chế thu hồi/ngăn chặn truy cập tên miền xâm phạm SHCN.'
