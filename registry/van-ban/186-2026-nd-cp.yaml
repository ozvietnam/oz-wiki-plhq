  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=218288, Phó Thủ tướng Hồ Quốc Dũng ký) và toàn văn PDF ký số đính kèm (186-ndcp.signed.pdf, 15 trang): số hiệu 186/2026/NĐ-CP, ban hành ngày 26-05-2026, có hiệu lực thi hành từ ngày 15-07-2026 (Điều 18); đang còn hiệu lực, sửa đổi, bổ sung một số điều của Nghị định 99/2013/NĐ-CP ngày 29-08-2013 quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (đã được sửa đổi, bổ sung theo Nghị định 126/2021/NĐ-CP và Nghị định 46/2024/NĐ-CP), bao gồm biện pháp ngăn chặn truy cập tên miền xâm phạm quyền sở hữu công nghiệp và phân định thẩm quyền xử phạt (trong đó có thẩm quyền của Hải quan tại Điều 7 sửa đổi Điều 18).'
