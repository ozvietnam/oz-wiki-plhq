  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=218288, Phó Thủ tướng Hồ Quốc Dũng ký), Công báo số 323 ngày 11-06-2026 (id=469660), toàn văn PDF ký số đính kèm (raw/download/datafiles.chinhphu.vn/186-2026-nd-cp.pdf, 15 trang, SHA-256 779d7bc35b5c07b16904722eea978dbd17797027a1a4d0bd82e58950db9f8b26) và bản lớp chữ nguyên văn 15 trang (raw/download/datafiles.chinhphu.vn/186-2026-nd-cp.txt, SHA-256 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626): số hiệu 186/2026/NĐ-CP, ban hành ngày 26-05-2026, có hiệu lực thi hành từ ngày 15-07-2026 (Điều 18); đang còn hiệu lực, sửa đổi, bổ sung một số điều của Nghị định 99/2013/NĐ-CP ngày 29-08-2013 quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (đã được sửa đổi, bổ sung theo Nghị định 126/2021/NĐ-CP và Nghị định 46/2024/NĐ-CP), bao gồm biện pháp ngăn chặn truy cập tên miền xâm phạm quyền sở hữu công nghiệp và phân định thẩm quyền xử phạt (trong đó có thẩm quyền của Hải quan tại Điều 3 khoản 3 sửa đổi Điều 15 và Điều 7 sửa đổi Điều 19).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bổ sung điểm a khoản 3 Điều 3 “a) Buộc loại bỏ yếu tố vi phạm trên hàng hóa, phương tiện kinh doanh; buộc hoàn trả tên miền; buộc thu hồi tên miền; ngăn chặn truy cập tên miền xâm phạm quyền sở hữu công nghiệp; buộc thay đổi tên doanh nghiệp, tên hộ kinh doanh; loại bỏ yếu tố vi phạm trong tên doanh nghiệp, tên hộ kinh doanh;”.'
      trang_pdf: 1
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đổi, bổ sung điểm c khoản 18 Điều 14 “c) Buộc thay đổi tên doanh nghiệp, tên hộ kinh doanh, loại bỏ yếu tố vi phạm trong tên doanh nghiệp, tên hộ kinh doanh đối với hành vi vi phạm quy định tại điểm a khoản 13, khoản 15 Điều này; buộc hoàn trả tên miền; ngăn chặn truy cập tên miền xâm phạm quyền sở hữu công nghiệp đối với hành vi vi phạm quy định tại điểm a khoản 16 Điều này;”.'
      trang_pdf: 2
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 3
      noi_dung: 'Điều 3. Sửa đổi, bổ sung Điều 15 “Điều 15. Phân định thẩm quyền xử phạt 1. Cục trưởng Cục Sở hữu trí tuệ, Trưởng đoàn kiểm tra chuyên ngành sở hữu công nghiệp do Cục trưởng Cục Sở hữu trí tuệ thành lập, Trưởng đoàn kiểm tra chuyên ngành sở hữu công nghiệp do Bộ trưởng Bộ Khoa học và Công nghệ thành lập trong thời hạn kiểm tra và phạm vi nhiệm vụ được giao có thẩm quyền xử phạt các hành vi vi phạm quy định tại Chương II Nghị định này. 2. Quản lý thị trường, Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Công Thương thành lập trong thời hạn kiểm tra và phạm vi nhiệm vụ được giao có thẩm quyền xử phạt các hành vi vi phạm sau đây: a) Hành vi vi phạm quy định tại Điều 12 và Điều 13 Nghị định này trong hoạt động sản xuất, buôn bán, chào hàng, vận chuyển, tàng trữ, trưng bày hàng hóa, kinh doanh dịch vụ thương mại tại thị trường trong nước; b) Hành vi vi phạm quy định tại các Điều 6, 9, 11 và 14 Nghị định này trong hoạt động buôn bán, chào hàng, vận chuyển, tàng trữ, trưng bày hàng hóa, kinh doanh dịch vụ thương mại tại thị trường trong nước. Trong trường hợp xử lý hành vi vi phạm quy định tại điểm b khoản 2 Điều này mà xác định được cơ sở sản xuất loại hàng hóa đó thì Quản lý thị trường, Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Công Thương thành lập có thẩm quyền tiếp tục xử lý hành vi vi phạm tại cơ sở sản xuất. 3. Hải quan, Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Tài chính thành lập trong thời hạn kiểm tra và phạm vi nhiệm vụ được giao có thẩm quyền xử phạt hành vi vi phạm quy định tại các Điều 6, 9, 10, 11, 12, 13 và 14 Nghị định này trong hoạt động nhập khẩu hàng hoá, quá cảnh, hoạt động vận chuyển hàng hoá trong địa bàn hoạt động hải quan. 4. Công an, Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Công an thành lập trong thời hạn kiểm tra và phạm vi nhiệm vụ được giao có thẩm quyền xử phạt hành vi vi phạm quy định tại khoản 1 Điều 5, điểm e khoản 1 và khoản 4 Điều 7, khoản 4 Điều 8, các Điều 9, 12 và 13 Nghị định này.'
      trang_pdf: 2
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 4
      noi_dung: 'Điều 4. Bổ sung Điều 15a vào sau Điều 15 “Điều 15a. Thẩm quyền xử phạt của các chức danh thuộc Bộ Khoa học và Công nghệ 1. Trưởng đoàn kiểm tra chuyên ngành sở hữu công nghiệp do Cục trưởng Cục Sở hữu trí tuệ thành lập có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 200.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 2. Cục trưởng Cục Sở hữu trí tuệ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 3. Trưởng đoàn kiểm tra chuyên ngành sở hữu công nghiệp do Bộ trưởng Bộ Khoa học và Công nghệ thành lập có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.”.'
      trang_pdf: 3
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 5
      noi_dung: 'Điều 5. Bãi bỏ Điều 16 và Điều 17'
