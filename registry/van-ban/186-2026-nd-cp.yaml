    - dieu: 16
      noi_dung: 'Điều 16. Thay thế một số cụm từ của Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp đã được sửa đổi, bổ sung bởi Nghị định số 126/2021/NĐ-CP ngày 30 tháng 12 năm 2021 và Nghị định số 46/2024/NĐ-CP ngày 04 tháng 5 năm 2024 của Chính phủ 1. Thay thế cụm từ “được quy định tại các Điều từ 16 đến 21 của Nghị định này” bằng cụm từ “được quy định từ Điều 15a đến Điều 21 Nghị định này” tại khoản 2 Điều 2. 2. Thay thế cụm từ “Bộ Thông tin và Truyền thông” bằng cụm từ “Bộ Khoa học và Công nghệ” tại khoản 3, khoản 4 Điều 3a. 3. Thay thế cụm từ “giữ nguyên hiện trạng tên miền” bằng cụm từ “giữ nguyên hiện trạng đăng ký, sử dụng tên miền” tại khoản 3, khoản 4 Điều 3a. 4. Thay thế cụm từ “nhà đăng ký tên miền” bằng cụm từ “nhà đăng ký tên miền, Tổ chức quản lý tên miền dùng chung cấp cao nhất mới (New gTLD Registry) tại Việt Nam” tại khoản 3, khoản 4 Điều 3a. 5. Thay thế cụm từ “tên doanh nghiệp” bằng cụm từ “tên doanh nghiệp, tên hộ kinh doanh” tại điểm d khoản 17 Điều 11.'
      trang_pdf: 14
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
