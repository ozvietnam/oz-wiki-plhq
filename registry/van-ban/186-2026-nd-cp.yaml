    - dieu: 6
      noi_dung: 'Điều 6. Sửa đổi, bổ sung Điều 18 “Điều 18. Thẩm quyền xử phạt của Quản lý thị trường 1. Kiểm soát viên thị trường đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 25.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 2. Đội trưởng Đội Quản lý thị trường thuộc Chi cục Quản lý thị trường thuộc Sở Công Thương có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 75.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này; d) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 3. Chi cục trưởng Chi cục Quản lý thị trường, Trưởng phòng Nghiệp vụ Quản lý thị trường thuộc Cục Quản lý và Phát triển thị trường trong nước có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 125.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 4. Cục trưởng Cục Quản lý và Phát triển thị trường trong nước có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 5. Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Công Thương thành lập có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này.”.'
      trang_pdf: 4
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 7
      noi_dung: 'Điều 7. Sửa đổi, bổ sung Điều 19 “Điều 19. Thẩm quyền xử phạt của Hải quan 1. Công chức Hải quan đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 12.500.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 2. Đội trưởng Hải quan cửa khẩu/ngoài cửa khẩu, Đội trưởng Đội Phúc tập và Kiểm tra sau thông quan, Đội trưởng Đội Thông quan, Đội trưởng Đội Kiểm soát hải quan thuộc Chi cục Hải quan khu vực, Đội trưởng Đội kiểm soát chống buôn lậu thuộc Chi cục Điều tra chống buôn lậu; Đội trưởng Đội Kiểm tra sau thông quan khu vực thuộc Chi cục Kiểm tra sau thông quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 75.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này; d) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 3. Chi cục trưởng Chi cục Điều tra chống buôn lậu, Chi cục trưởng Chi cục Kiểm tra sau thông quan, Chi cục trưởng Chi cục Hải quan khu vực có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 125.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 4. Cục trưởng Cục Hải quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này. 5. Trưởng đoàn kiểm tra chuyên ngành do Bộ trưởng Bộ Tài chính thành lập có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này.”.'
