    - dieu: 8
      noi_dung: 'Điều 8. Sửa đổi, bổ sung Điều 20 “Điều 20. Thẩm quyền xử phạt của Công an nhân dân 1. Chiến sĩ Công an nhân dân đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 25.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 2. Trưởng đồn Công an, Trưởng trạm, Đội trưởng có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 75.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm d khoản 3 Điều 3 Nghị định này. 3. Trưởng Công an cấp xã có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 125.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm b, d, g, h và i khoản 3 Điều 3 Nghị định này.'
      trang_pdf: 7
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 9
      noi_dung: 'Điều 9. Sửa đổi, bổ sung Điều 21 “Điều 21. Thẩm quyền xử phạt của Chủ tịch Ủy ban nhân dân các cấp và Giám đốc Sở Khoa học và Công nghệ 1. Chủ tịch Ủy ban nhân dân cấp xã có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 125.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, d, đ, g và h khoản 3 Điều 3 Nghị định này. 2. Giám đốc Sở Khoa học và Công nghệ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 200.000.000 đồng; c) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, d, đ, g, h và i khoản 3 Điều 3 Nghị định này. 3. Chủ tịch Ủy ban nhân dân cấp tỉnh có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 250.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính; d) Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn hoặc đình chỉ hoạt động kinh doanh hàng hóa, dịch vụ vi phạm có thời hạn; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này.”.'
      trang_pdf: 9
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 10
      noi_dung: 'Điều 10. Sửa đổi, bổ sung Điều 21a “Điều 21a. Thẩm quyền lập biên bản vi phạm hành chính Người có thẩm quyền lập biên bản vi phạm hành chính về sở hữu công nghiệp gồm: 1. Người có thẩm quyền xử phạt vi phạm hành chính về sở hữu công nghiệp được quy định từ Điều 15a đến Điều 21 Nghị định này đang thi hành công vụ, nhiệm vụ đối với hành vi vi phạm hành chính theo thẩm quyền quy định tại Điều 15 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao; 2. Người thuộc lực lượng Công an nhân dân đang thi hành công vụ, nhiệm vụ; công chức, viên chức trong các cơ quan quy định từ Điều 15a đến Điều 21 Nghị định này đang thi hành công vụ, nhiệm vụ đối với hành vi vi phạm hành chính theo thẩm quyền quy định tại Điều 15 Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao; thanh tra viên, thành viên đoàn thanh tra, công chức thuộc cơ quan thanh tra khi thực hiện thanh tra trong lĩnh vực sở hữu công nghiệp.”.'
      trang_pdf: 10
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 11
      noi_dung: 'Điều 11. Sửa đổi, bổ sung khoản 3 Điều 23 “3. Văn bản ủy quyền nộp kèm theo đơn yêu cầu xử lý xâm phạm phải là bản chính hoặc bản sao có chứng thực từ bản chính. Văn bản ủy quyền làm bằng tiếng nước ngoài thì phải nộp kèm theo bản dịch sang tiếng Việt có chứng thực của chính quyền địa phương hoặc có cam kết và xác nhận của đại diện sở hữu công nghiệp là bên nhận ủy quyền. Trường hợp văn bản ủy quyền là bản sao của bản chính văn bản ủy quyền đã nộp trong hồ sơ trước đó cho cùng cơ quan xử lý xâm phạm thì cũng được coi là hợp lệ, với điều kiện người nộp đơn phải chỉ rõ số hồ sơ đã nộp và bản gốc văn bản ủy quyền được chỉ dẫn vẫn đang có hiệu lực và đúng nội dung ủy quyền.”.'
      trang_pdf: 10
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 12
      noi_dung: 'Điều 12. Sửa đổi, bổ sung Điều 30 “Điều 30. Nguyên tắc xử phạt và thủ tục xử phạt 1. Khi phát hiện vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, người có thẩm quyền xử phạt quy định từ Điều 15a đến Điều 21 Nghị định này và công chức, viên chức đang thi hành công vụ có thẩm quyền lập biên bản vi phạm hành chính. 2. Mỗi hành vi vi phạm hành chính chỉ bị xử phạt một lần. Trường hợp nhiều tổ chức, cá nhân cùng thực hiện một hành vi vi phạm hành chính thì mỗi tổ chức, cá nhân vi phạm đều bị xử phạt đối với hành vi đó. Trường hợp một tổ chức, cá nhân thực hiện nhiều hành vi vi phạm hành chính hoặc thực hiện hành vi vi phạm hành chính nhiều lần theo quy định của Nghị định này thì bị xử phạt đối với từng hành vi vi phạm. 3. Việc xác định hành vi vi phạm hành chính đã kết thúc, hành vi vi phạm hành chính đang thực hiện để tính thời hiệu xử phạt vi phạm hành chính thực hiện theo quy định tại khoản 1 Điều 8 Nghị định số 118/2021/NĐ-CP ngày 23 tháng 12 năm 2021 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Xử lý vi phạm hành chính đã được sửa đổi, bổ sung bởi Nghị định số 68/2025/NĐ-CP và Nghị định số 190/2025/NĐ-CP. 4. Việc xử lý vi phạm hành chính về sở hữu công nghiệp trên môi trường điện tử được thực hiện khi bảo đảm điều kiện về cơ sở hạ tầng, kỹ thuật, thông tin và các yêu cầu theo quy định tại Điều 18a Luật Xử lý vi phạm hành chính. 5. Trình tự, thủ tục xử phạt vi phạm hành chính thực hiện theo quy định tại Mục 1 Chương III của Luật Xử lý vi phạm hành chính.”.'
      trang_pdf: 11
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 13
      noi_dung: '3a. Biện pháp khắc phục hậu quả ngăn chặn truy cập tên miền xâm phạm quyền sở hữu công nghiệp Trong trường hợp cơ quan nhà nước có thẩm quyền xử phạt vi phạm hành chính theo Nghị định này ban hành quyết định áp dụng biện pháp ngăn chặn truy cập đối với tên miền xâm phạm quyền sở hữu công nghiệp, trong vòng 05 ngày kể từ ngày nhận được quyết định, doanh nghiệp viễn thông có trách nhiệm áp dụng biện pháp kỹ thuật cần thiết để ngăn chặn truy cập đến tên miền trên mạng Internet tại Việt Nam và gửi văn bản báo cáo kết quả cho cơ quan ban hành quyết định xử phạt trong vòng 10 ngày sau khi hoàn tất việc ngăn chặn truy cập tên miền. Trong trường hợp cơ quan có thẩm quyền ban hành quyết định khôi phục truy cập đối với tên miền, doanh nghiệp viễn thông có trách nhiệm khôi phục truy cập đến tên miền trên mạng Internet tại Việt Nam trong vòng 3 ngày kể từ khi nhận được quyết định khôi phục truy cập tên miền và gửi văn bản báo cáo cho người ban hành quyết định trong vòng 10 ngày kể từ ngày hoàn tất việc khôi phục truy cập.”.'
      trang_pdf: 13
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
    - dieu: 14
      noi_dung: 'Điều 14. Sửa đổi, bổ sung Điều 32 “Điều 32. Sửa đổi, bổ sung, đính chính, hủy bỏ, ban hành quyết định mới về xử lý vi phạm hành chính 1. Việc sửa đổi, bổ sung, đính chính, hủy bỏ, ban hành quyết định mới về xử lý vi phạm hành chính thực hiện theo quy định của pháp luật về xử lý vi phạm hành chính. 2. Trường hợp ban hành quyết định sửa đổi, bổ sung, đính chính, hủy bỏ hoặc ban hành quyết định mới về xử lý vi phạm hành chính theo quy định tại khoản 1 Điều này, người có thẩm quyền xử phạt trong phạm vi thẩm quyền của mình, căn cứ tính chất, tình trạng thi hành quyết định và quy định pháp luật có liên quan, quyết định áp dụng một hoặc một số biện pháp sau đây: a) Trường hợp quyết định xử phạt vi phạm hành chính đã được tổ chức, cá nhân thi hành, người có thẩm quyền xử phạt đề nghị Kho bạc Nhà nước nơi đã thu tiền phạt hoàn trả một phần hoặc toàn bộ tiền phạt đã nộp theo quyết định sửa đổi, hủy bỏ hoặc quyết định mới trong thời hạn 15 ngày kể từ ngày ban hành quyết định sửa đổi, hủy bỏ, ban hành mới; b) Đối với tang vật, phương tiện vi phạm hành chính: Trường hợp hàng hóa, vật phẩm, phương tiện kinh doanh đang bị tạm giữ và chưa bị xử lý thì trả lại cho tổ chức, cá nhân theo quyết định sửa đổi, hủy bỏ hoặc quyết định mới. Trường hợp hàng hóa, vật phẩm, phương tiện kinh doanh đã bị xử lý thì tổ chức, cá nhân yêu cầu xử lý vi phạm có trách nhiệm bồi thường cho tổ chức, cá nhân bị xử lý theo cam kết đã thực hiện khi yêu cầu xử lý vi phạm, nếu có.”.'
      trang_pdf: 13
      sha256_pdf: 742ec9a604720191eb3f0eb4083cb231c7b51e3696230c863028b97538d56626
