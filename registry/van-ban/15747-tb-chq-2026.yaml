  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/29/2.VB_15747.pdf, id=103434, SHA-256 acd00393a49feac20803e8f463b50d1e5d27e76d6868530843ab5be6e41a8740): Thông báo số 15747/TB-CHQ ngày 28-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chế phẩm dầu cắt gọt tổng hợp đa năng hiệu suất cao TEXMO MEX 201 (ký, mã hiệu TEXMO MEX 201; thành phần theo trọng lượng gồm Caprylic acid CAS 67762-36-1 18%, Polyether CAS 9003-11-6 19%, Inhibitors CAS 2492-26-4 1%, nước CAS 7732-18-5 61%; dạng chất lỏng trong suốt không màu đến màu vàng nhạt, tỷ trọng 0,95-1,08, độ pH dung dịch pha loãng 5% từ 7,3-8,5, đóng gói 18 lít/thùng; pha loãng với nước để bôi trơn, làm mát, làm sạch và chống ăn mòn, chống gỉ trong quá trình gia công cắt gọt kim loại đồng, nhôm, inox trên máy CNC, tiện, phay, khoan, mài), phân loại vào nhóm 34.03, phân nhóm 3403.99, mã số 3403.99.19; có hiệu lực kể từ ngày ban hành'
