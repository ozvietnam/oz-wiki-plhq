ghi_chu: 'Xác định trước mã số mặt hàng Chế phẩm dầu cắt gọt tổng hợp đa năng hiệu suất cao TEXMO MEX 201 (thành phần gồm Caprylic acid CAS 67762-36-1 18%, Polyether CAS 9003-11-6 19%, Inhibitors CAS 2492-26-4 1%, nước CAS 7732-18-5 61%; dạng lỏng trong suốt không màu đến vàng nhạt, đóng gói 18 lít/thùng, pha loãng với nước dùng bôi trơn, làm mát và chống gỉ trong gia công cắt gọt kim loại) thuộc nhóm 34.03, phân nhóm 3403.99, mã số 3403.99.19.'
