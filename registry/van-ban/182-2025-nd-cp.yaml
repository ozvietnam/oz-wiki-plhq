      diem: d
      noi_dung: 'd) Sửa đổi, eS sa sung điểm] Shon 3 như sau: “i) Ban thuyét TiNHS dự án sản xuất. sản phẩm công nghệ số quy định tại điểm d khoản 21 Điều 16 Luật Thuế xuất khẩu, thuế nhập khẩu đã được sửa đổi, bd sung tại khoản 3 Điều 5 Luật số 90/2025/QH15: 01 bản chụp”.'
