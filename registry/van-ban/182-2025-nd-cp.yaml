      noi_dung: '2. Sửa đổi, bỗ sung, thay thế một số nội dung của Điều 30 như sau: a) Sửa đổi, bd sung khoản 1 như sau: _ “1. Các trường hợp thông báo danh mục hàng hóa miễn thuế dự kiến nhập khâu gôm các hàng hóa thuộc đôi tượng miễn thuê quy định tại các điểm b,c va d khoản 21 Điêu 16 Luật Thuê xuat khâu, thuê nhập khâu đã được sửa đôi, bổ sung tại Luật số 90/2025/QH15 và Điều 14, Điều 15, Điều 16, Điều 17, Điều 18, Điều 23 Nghị định này”.'
      trang_pdf: 2
    - dieu: 1
