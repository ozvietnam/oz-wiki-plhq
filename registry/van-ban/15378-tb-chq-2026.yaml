  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/20/2.VB_15378.pdf, id=103276, SHA-256 514f813455bf37fcc2867b1e5773f5a87cda1687715c554223f70e2b0750be6d): Thông báo số 15378/TB-CHQ ngày 17-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Máy tiêm gà tự động / Máy tiêm gia cầm tự động 3 chức năng Yiyishenghui Integrated Immunization Machine HS-MY3 (ký, mã hiệu HS-MY3; phiên bản 3 trong 1 gồm cụm tiêm dưới da vùng cổ 0,1-1 ml, cụm chích màng cánh 0,001-0,09 ml và cụm nhỏ mắt/mũi 0,01-0,09 ml; kết cấu hình hộp đứng gồm khoang máy phía trên có màn hình cảm ứng, bộ điều khiển, tủ điện, hệ thống truyền động và khung đỡ thép không gỉ phía dưới; công suất 65 W, nguồn điện 220 V, kích thước thân máy 25x35x28,5 cm, trọng lượng 9 kg; dùng tiêm chủng cho gia cầm từ 3 ngày tuổi trở lên), phân loại vào nhóm 90.18, phân nhóm 9018.90, mã số 9018.90.39; có hiệu lực từ ngày ký'
