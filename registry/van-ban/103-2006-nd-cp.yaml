xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn tệp gốc (16475_nd103cp.doc, Thủ tướng Nguyễn Tấn Dũng ký) trên vanban.chinhphu.vn (docid=16056) và CSDLQG vbpl.vn (ID 15221): số hiệu 103/2006/NĐ-CP, tiêu đề, ngày ban hành 22/09/2006, gồm 7 Chương 38 Điều; Điều 37 quy định có hiệu lực sau 15 ngày kể từ ngày đăng Công báo (CSDLQG vbpl.vn ghi nhận ngày có hiệu lực 21/10/2006, effFrom 2006-10-21); được sửa đổi, bổ sung một số điều bởi Nghị định 122/2010/NĐ-CP và Điều 1 Nghị định 154/2018/NĐ-CP; hết hiệu lực toàn bộ từ 23/08/2023 do bị thay thế bởi khoản 2 Điều 124 Nghị định 65/2023/NĐ-CP (vbpl.vn effTo 2023-08-23, effStatus HHL)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác minh nguồn bậc A (OZV-561) — hướng dẫn Luật Sở hữu trí tuệ về xác lập, chủ thể, nội dung, giới hạn, chuyển giao quyền sở hữu công nghiệp và đại diện sở hữu công nghiệp. CSDLQG vbpl.vn (ID 15221) ghi nhận ngày có hiệu lực 21/10/2006 (15 ngày sau ngày đăng Công báo theo Điều 37; nguồn thứ cấp TVPL từng ghi 08/10/2006). Được sửa đổi bởi NĐ 122/2010/NĐ-CP (31/12/2010) và Điều 1 NĐ 154/2018/NĐ-CP (09/11/2018) trước khi bị thay thế toàn bộ bởi khoản 2 Điều 124 NĐ 65/2023/NĐ-CP từ 23/08/2023.'
