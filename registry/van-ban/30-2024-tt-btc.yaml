      noi_dung: Điều 2. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2024. 2. Thông tư số 158/2014/TT-BTC ngày 27/10/2014 của Bộ trưởng Bộ Tài chính ban hành Tiêu chuẩn thẩm định giá Việt Nam số 01, 02, 03 và 04 và Thông tư số 28/2015/TT-BTC ngày 06/3/2015 của Bộ trưởng Bộ Tài chính ban hành
      trang_pdf: 1
