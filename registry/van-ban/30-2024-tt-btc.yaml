      noi_dung: Điều 3. Tổ chức thực hiện 1. Các tổ chức, cá nhân có liên quan chịu trách nhiệm thực hiện Chuẩn mực thẩm định giá Việt Nam ban hành kèm theo Thông tư này. 2. Trong quá trình thực hiện nếu có vướng mắc đề nghị các tổ chức cá nhân phản ánh kịp thời về Bộ Tài chính để nghiên cứu, giải quyết./.
