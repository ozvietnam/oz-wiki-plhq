  pham_vi: 'Đã tải và đối chiếu toàn văn bản PDF ký gốc có dấu đỏ (46 trang, 7.660.049 byte, sha256 6335beedd6aeb9d586d21304780d3a53953916e908a19dd716c729c1acbad1b5, gồm Quyết định 3 điều, Quy trình và hệ thống biểu mẫu kèm theo) từ Cổng Thông tin điện tử tỉnh Quảng Trị (quangtri.gov.vn) và Thời báo Tài chính Việt Nam — chuyên trang Thuế & Hải quan: số hiệu 2123/QĐ-CHQ, ngày ban hành 30-12-2025, người ký Cục trưởng Cục Hải quan Nguyễn Văn Thọ, trích yếu nguyên văn "Ban hành Quy trình Kiểm tra sau thông quan và quản lý chế độ ưu tiên". Theo Điều 2 Quyết định (trang 2): Quyết định này có hiệu lực kể từ ngày 01/02/2026, thay thế Quyết định số 575/QĐ-TCHQ ngày 21/03/2019 của Tổng cục trưởng Tổng cục Hải quan về việc ban hành Quy trình Kiểm tra sau thông quan và Quyết định số 2659/QĐ-TCHQ ngày 14/09/2015 của Tổng cục trưởng Tổng cục Hải quan về việc ban hành Quy trình thẩm định điều kiện công nhận doanh nghiệp ưu tiên, áp dụng chế độ ưu tiên, quản lý doanh nghiệp ưu tiên theo quy định tại Thông tư 72/2015/TT-BTC (hai Quyết định 575/QĐ-TCHQ và 2659/QĐ-TCHQ hiện chưa nạp trong sổ nên ghi nhận tại phạm vi đối chiếu và ghi chú để tránh sinh điểm mù THIEU_VAN_BAN). Đang còn hiệu lực.'
