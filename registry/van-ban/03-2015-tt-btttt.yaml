  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết và hướng dẫn thi hành một số điều, khoản của Nghị định số 60/2014/NĐ-CP ngày 19 tháng 6 năm 2014 của Chính phủ về hoạt động in (sau đây được viết tắt là Nghị định số 60/2014/NĐ-CP).
      trang_pdf: 1
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 2
      noi_dung: Điều 2. Tiếp nhận hồ sơ và giải quyết thủ tục hành chính trong hoạt động in 1. Đối với các thủ tục hành chính thuộc thẩm quyền giải quyết của Bộ Thông tin và Truyền thông quy định tại Nghị định số 60/2014/NĐ-CP và Thông tư này, Cục Xuất bản, In và Phát hành có trách nhiệm tiếp nhận hồ sơ và giải quyết theo chức năng, nhiệm vụ, quyền hạn được giao.
      trang_pdf: 1
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 3
      noi_dung: Điều 3. Trách nhiệm tổ chức tập huấn và bồi dưỡng kiến thức pháp luật, nghiệp vụ trong hoạt động in 1. Cục Xuất bản, In và Phát hành chủ trì, phối hợp với cơ quan, đơn vị liên quan tổ chức tập huấn, bồi dưỡng kiến thức pháp luật, nghiệp vụ trong hoạt động in trên phạm vi cả nước.
      trang_pdf: 2
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 4
      noi_dung: 'Điều 4. Chế độ báo cáo định kỳ hoạt động in, dịch vụ photocopy quy định tại Điều 8 Nghị định số 60/2014/NĐ-CP 1. Chủ thể thực hiện chế độ báo cáo và nơi gửi báo cáo: a) Cơ sở chế bản, in, gia công sau in ở Trung ương phải báo cáo bằng văn bản (theo mẫu) với Bộ Thông tin và Truyền thông (qua Cục Xuất bản, In và Phát hành); b) Cơ sở chế bản, in, gia công sau in ở địa phương phải báo cáo bằng văn bản (theo mẫu) với Sở Thông tin và Truyền thông;'
      trang_pdf: 2
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 5
      noi_dung: Điều 5. Tổ chức liên ngành phòng, chống các hành vi vi phạm pháp luật trong hoạt động in quy định tại Khoản 7 Điều 5 và Điểm d Khoản 1 Điều 7 Nghị định số 60/2014/NĐ-CP 1. Tổ chức liên ngành là tổ chức phối hợp hoạt động của các cơ quan liên quan để phòng, chống các hành vi vi phạm pháp luật trong hoạt động in.
      trang_pdf: 3
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 6
      noi_dung: 'Điều 6. Quy định chi tiết Điểm b Khoản 1 Điều 11 Nghị định số 60/2014/ NĐ-CP về thiết bị in phải có để thực hiện một hoặc các công đoạn chế bản, in, gia công sau in Cơ sở in thực hiện một hoặc các công đoạn chế bản, in, gia công sau in phải có thiết bị tương ứng với từng công đoạn:'
      trang_pdf: 3
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 7
      noi_dung: Điều 7. Trình tự, thủ tục thu hồi giấy phép hoạt động in quy định tại Khoản 2 Điều 13 Nghị định số 60/2014/NĐ-CP 1. Việc xác định cơ sở in bị thu hồi giấy phép hoạt động in phải được thực hiện qua công tác kiểm tra, thanh tra thuộc chuyên ngành thông tin và truyền thông. 2. Cơ quan, người có thẩm quyền tiến hành kiểm tra, thanh tra tại cơ sở in và lập biên bản.
      trang_pdf: 4
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 8
      noi_dung: Điều 8. Lưu giữ, quản lý hồ sơ liên quan đến sản phẩm nhận chế bản, in và gia công sau in quy định tại Khoản 5 Điều 15 Nghị định số 60/2014/NĐ-CP Người đứng đầu cơ sở in phải tổ chức thực hiện lưu giữ và quản lý hồ sơ nhận chế bản, in, gia công sau in trong 24 tháng, kể từ ngày ký hợp đồng in.
      trang_pdf: 5
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 9
      noi_dung: Điều 9. Quy định chi tiết về chủng loại thiết bị in phải có giấy phép nhập khẩu tại Khoản 1 Điều 27 Nghị định số 60/2014/NĐ-CP 1. Máy chế bản ghi phim, ghi kẽm, tạo khuôn in là máy chuyên dùng phục vụ khâu chế bản (trước in) trong hoạt động in. 2. Máy in sử dụng công nghệ kỹ thuật số có tốc độ trên 50 tờ/phút A4 hoặc có khổ in trên A3. 3. Máy in sử dụng công nghệ in ốp - xét (offset), flexo, ống đồng; máy in lưới (lụa).
      trang_pdf: 5
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 10
      noi_dung: 'Điều 10. Sử dụng, đăng ký, chuyển nhượng máy photocopy màu, máy in có chức năng photocopy màu quy định tại Khoản 2, 3 và Khoản 4 Điều 30 Nghị định số 60/2014/NĐ-CP 1. Sử dụng máy in có chức năng photocopy màu quy định tại Điểm b Khoản 1 Điều 30 Nghị định số 60/2014/NĐ-CP như sau:'
      trang_pdf: 5
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 11
      noi_dung: Điều 11. Ban hành biểu mẫu Ban hành kèm theo Thông tư này 01 phụ lục gồm 24 mẫu, biểu mẫu sử dụng trong hoạt động in.
      trang_pdf: 7
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
    - dieu: 12
      noi_dung: 'Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 5 năm 2015. 2. Các văn bản quy phạm pháp luật sau đây hết hiệu lực, kể từ ngày Thông tư này có hiệu lực thi hành: a) Thông tư số 04/2008/TT-BTTTT ngày 09 tháng 7 năm 2008 của Bộ trưởng Bộ Thông tin và Truyền thông hướng dẫn thực hiện một số nội dung của Nghị định số 105/2007/NĐ-CP ngày 21 tháng 6 năm 2007 của Chính phủ về hoạt động in các sản phẩm không phải là'
      trang_pdf: 7
      sha256_pdf: 475ccee7e6bc39503729d031af81380fc3f033bcf789aae8df508f8fc9d0b720
