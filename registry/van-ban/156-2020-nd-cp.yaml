  muc: NGUON_A
  pham_vi: 'Đối chiếu PDF ký số Chính phủ 69 trang đã OCR (SHA-256 3043375732346e2b53b8a7cef0bf8f9b8d96d5c10b057f90897742bb4b75eceb): ban hành 31-12-2020, hiệu lực từ 01-01-2021 (khoản 1 Điều 52), thay thế NĐ 108/2013/NĐ-CP và NĐ 145/2016/NĐ-CP; được sửa đổi, bổ sung một số điều bởi các nghị định năm 2021 và 2025.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định các hành vi vi phạm hành chính, hình thức xử phạt, mức xử phạt, biện pháp khắc phục hậu quả đối với hành vi vi phạm hành chính, thâm quyền xử phạt và thẩm quyền lập biên bản vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán. 2. Vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán quy định tại Nghị định này bao gồm:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng bị xử phạt vi phạm hành chính 1. Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài (sau đây gọi chung là tô chức, cá nhân) thực hiện hành vi vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán quy định tại Nghị định này. 2. Tổ chức quy định tại khoản 1 Điều này bao gồm: a) Công ty đại chúng;'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Theo Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. “Sử dụng thông tin nội bộ để mua, bán chứng khoán” là việc thực hiện hành vi bị nghiêm câm trong hoạt động về chứng khoán và thị trường chứng khoán quy định tại khoản 2 Điều 12 Luật Chứng khoán, gồm một, một số hoặc tất cả các hành vi dưới đây: a) Sử dụng thông tin nội bộ để mua, bán chứng khoán cho chính mình hoặc cho người khác;'
      trang_pdf: 3
    - dieu: 11
      noi_dung: Điều 11. Vi phạm quy định về phát hành trái phiếu ra thị trường quốc tế, chào bán chứng khoản tại nước ngoài và phát hành chứng khoán mới làm cơ sở chào bán chứng chỉ lưu ký chứng khoán tại nước ngoài hoặc hỗ trợ phát hành chứng chỉ lưu ký chứng khoán tại nước ngoài trên cơ sở cỗ phiếu đã phát hành tại Việt Nam
      trang_pdf: 17
    - dieu: 18
      noi_dung: Điều 18. Vi phạm quy định về niêm yết chứng khoán, đăng ký giao dịch chứng khoán 1. Phat tiền từ 70. 000.000 déng dén 100.000.000 déng déi véi hanh vi không làm thủ tục thay đôi đăng ký niêm vết chứng khoán, đăng ký giao dịch chứng khoán hoặc thực hiện niêm yết chứng khoán, đăng ký giao dịch chứng khoán bé sung không đúng thời hạn theo quy định pháp luật.
      trang_pdf: 25
    - dieu: 25
      noi_dung: Điều 25. Vi phạm quy định về những thay đổi phải được chấp thuận 1. Phạt tiền từ 50.000.000 đồng đến 100.000.000 đồng đối với công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán, chỉ nhánh công ty chứng khoán hoặc công ty quản lý quỹ nước ngoài tại Việt Nam thay đổi tên của công ty, chỉ nhánh, văn phòng đại diện, phòng giao dịch khi chưa được Uy | ban Chứng khoán Nhà nước chấp thuận bằng văn bản.
      trang_pdf: 31
    - dieu: 33
      noi_dung: Điều 33. Vi phạm quy định về giao dịch của cỗ đồng Sang lap; cỗ đông lớn, nhóm người có liên quan sở hữu từ 5% trở lên số cỗ phiếu có quyên biéu quyết của công ty đại chúng; nhà đầu tư, nhóm người có liên quan sở hữu từ 5% trở lên chứng chỉ quỹ của quỹ đóng; nhóm nhà đầu tư nước ngoài có liên quan sở hữu từ 5% trở lên sô cô phiếu có quyền biểu quyết của 01 tổ chức phát hành hoặc từ 5% trở lên chứng chỉ quỹ của quỹ đóng;
      trang_pdf: 45
    - dieu: 39
      noi_dung: 'Điều 39. Vi phạm quy định về đăng ký, lưu ký, bù trừ và thanh toán chứng khoán 1. Phạt tiền từ 50.000.000 đồng đến 70.000.000 đồng đối với Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, thành viên lưu ký, thành viên bù trừ, ngân hàng thanh toán thực hiện một trong các hành vi vi phạm sau:'
      trang_pdf: 52
    - dieu: 46
      noi_dung: 'Điều 46. Hanh vi can trở việc thanh tra, kiểm tra, yêu cầu cung cấp thông tin 1. Phạt tiền từ 50.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Từ chối cung cấp thông tin, tài liệu, đữ liệu điện tử hoặc cung cấp thông tin, tài liệu, dữ liệu điện tử không đúng thời hạn, không đây đủ, chính. xác theo yêu câu của đoàn thanh tra, kiêm tra hoặc người có thâm quyên;'
      trang_pdf: 63
    - dieu: 53
      noi_dung: Điều 53. Điều khoản chuyền tiếp 1. Đối với hành vi vi phạm xảy ra trước thời điểm Nghị định này có hiệu lực mà bị phát hiện hoặc xem xét ra quyết định xử phạt khi Nghị định này đã có hiệu lực thì áp dụng quy định của Nghị định này nêu Nghị định này không quy định trách nhiệm pháp lý hoặc quy định trách nhiệm pháp lý nhẹ hơn.
      trang_pdf: 68
ghi_chu: Nghị định quy định xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán.
