ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #397). Liên quan biểu thuế XNK lịch sử (năm 2015): bãi bỏ Thông tư 06/2015/TT-BTC ngày 20-01-2015 về thuế suất nhập khẩu ưu đãi mặt hàng xăng, dầu nhóm 27.10 và khôi phục mức thuế tại Thông tư 03/2015/TT-BTC. Đã hết hiệu lực từ 01-01-2016.'
