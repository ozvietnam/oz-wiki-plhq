xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF Công báo số 263+264 ngày 24-02-2015 (congbaocdn.chinhphu.vn, 2 trang, người ký Thứ trưởng Vũ Thị Mai) và CSDLQG vbpl.vn (ID 48802): Điều 1 bãi bỏ Thông tư 06/2015/TT-BTC ngày 20-01-2015; Điều 2 khoản 1 quy định có hiệu lực thi hành kể từ ngày 21-01-2015, khoản 2 khôi phục mức thuế suất thuế nhập khẩu ưu đãi mặt hàng xăng, dầu nhóm 27.10 theo Thông tư 03/2015/TT-BTC ngày 06-01-2015 (sửa đổi Biểu thuế MFN kèm Thông tư 164/2013/TT-BTC). Hết hiệu lực từ ngày 01-01-2016 khi Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi mới theo Thông tư 182/2015/TT-BTC ngày 16-11-2015 có hiệu lực thi hành (và tiếp theo là Nghị định 122/2016/NĐ-CP từ 01-09-2016).'
