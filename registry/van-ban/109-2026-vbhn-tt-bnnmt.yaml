  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=220180; sửa URL cũ docid=220188 vốn trỏ nhầm sang 55/2026/TT-BKHCN) và toàn văn PDF ký số (109-vbhn-bnnmt.signed.pdf, 8 trang, 6 điều, Thứ trưởng Nguyễn Hoàng Hiệp ký): xác thực ngày 02-11-2026, đang còn hiệu lực; hợp nhất Thông tư 14/2024/TT-BNNPTNT ngày 31-10-2024 (hiệu lực 15-12-2024, thay thế Thông tư 30/2014/TT-BNNPTNT) và Thông tư 12/2025/TT-BNNMT ngày 19-06-2025 (hiệu lực 01-07-2025)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Danh mục vật thể thuộc diện kiểm dịch thực vật 1. Thực vật: Cây và các bộ phận của cây. 2. Sản phẩm thực vật: a) Các loại củ, quả, hạt, hoa, lá, thân, cành, gốc, rễ, vỏ cây; b) Các loại tấm, cám, khô dầu, sắn lát, sợi tự nhiên dạng thô, xơ thực vật; c) Bột có nguồn gốc thực vật, tinh bột sắn; d) Cọng thuốc lá, bông thô, phế liệu bông, rơm, rạ và thực vật thủy sinh (trừ các loại rong, tảo, thực vật thủy sinh sống ở biển);'
      trang_pdf: 2
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
    - dieu: 2
      noi_dung: 'Điều 2. Danh mục vật thể thuộc diện kiểm dịch thực vật phải phân tích nguy cơ dịch hại trước khi nhập khẩu vào Việt Nam 1. Vật liệu làm giống: Cây giống, hạt giống, củ giống và các bộ phận có thể làm giống của cây (trừ cây ở dạng nuôi cấy mô, hạt giống các loại cây họ thập tự, hạt giống lúa, ngô, kê, hạt giống hành, tỏi).'
      trang_pdf: 2
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
    - dieu: 3
      noi_dung: 'Điều 3. Các vật thể thuộc diện kiểm dịch thực vật được miễn phân tích nguy cơ dịch hại Các vật thể thuộc diện kiểm dịch thực vật quy định tại Điều 2 Thông tư này được miễn phân tích nguy cơ dịch hại trong các trường hợp: 1. Vật liệu làm giống nhập khẩu phục vụ nghiên cứu khoa học hoặc thử nghiệm, đánh giá trong phòng thí nghiệm.'
      trang_pdf: 3
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
    - dieu: 4
      noi_dung: Điều 4. Điều khoản chuyển tiếp6 Cụm từ “Cục Bảo vệ thực vật” được thay thế bởi cụm từ “Cục Trồng trọt và Bảo vệ thực vật” theo quy định tại Điều 29 Thông tư số 12/2025/TT-BNNMT, có hiệu lực kể từ ngày 01 tháng 07 năm 2025. 3 Cụm từ “Bộ Nông nghiệp và Phát triển nông thôn” được thay thế bởi cụm từ “Bộ Nông nghiệp và Môi trường” theo quy định tại Điều 29 Thông tư số 12/2025/TT-BNNMT, có hiệu lực kể từ ngày 01 tháng 07 năm 2025.
      trang_pdf: 3
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
    - dieu: 5
      noi_dung: Điều 5. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 15 tháng 12 năm 2024. 2. Thông tư số 30/2014/TT-BNNPTNT ngày 05 tháng 9 năm 2014 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn về việc Ban hành danh mục vật thể thuộc diện kiểm dịch thực vật; Danh mục vật thể thuộc diện kiểm dịch thực vật phải phân tích nguy cơ dịch hại trước khi nhập khẩu vào Việt Nam hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 4
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
    - dieu: 6
      noi_dung: Điều 6. Trách nhiệm thi hành 1. Chánh Văn phòng Bộ, Cục trưởng Cục Trồng trọt và Bảo vệ thực vật 8, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.
      trang_pdf: 4
      sha256_pdf: a5642c0110dc47ef4375a9e50046bdc103033e18962d80399b38fe44636975fb
