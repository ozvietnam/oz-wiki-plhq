    - dieu: 1
      noi_dung: 'Điều 1. Sửa đỗi, bd sung một số điều của Thông tư số 20/2014/TT- : BCT 1. Điều 2 được sửa đổi, bd sung như sau: “Thủ tục cấp và kiểm tra C/O mẫu AK của Việt Nam thực hiện theo quy định tại: 1. Nghị định số 31/2018/NĐ-CP ngày 08 tháng 03 năm 2018 của Chính phủ quy định chi tiệt Luật Quản lý ngoại thương về xuat xứ hàng hóa và Thông'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kế từ ngày42 tháng 4 năm 2019. 2. Từ ngày 01 tháng 9 năm 2019 đến hết ngày 31 tháng 12 năm 2019, mã HS tại ô số 7 trên C/O mẫu AK được thể hiện theo các cach sau; a) Theo phiên bản HS năm 2017, đồng thời thể hiện rong ngoặc mã HS tương ứng theo phiên bản HS năm 2012; hoặc b) Theo phiên bản mã HS năm 2012.
      trang_pdf: 2
