      noi_dung: 'Điều 1. Ban hành kèm theo Thông tư này Danh mục đối tượng kiểm dịch thực vật của nước Cộng hòa xã hội chủ nghĩa Việt Nam.'
      trang_pdf: 1
      sha256_pdf: 87679115dbb7db2bf6c2bd98f424db695f9654d5441420c40b3febf7bc0dc4c4
    - dieu: 2
      noi_dung: 'Điều 2. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 29 tháng 9 năm 2023. 2. Thông tư số 35/2014/TT-BNNPTNT ngày 31 tháng 10 năm 2014 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn về việc ban hành Danh mục đối tượng kiểm dịch thực vật của nước Cộng hòa xã hội chủ nghĩa Việt Nam hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.'
      trang_pdf: 1
      sha256_pdf: 87679115dbb7db2bf6c2bd98f424db695f9654d5441420c40b3febf7bc0dc4c4
    - dieu: 3
      noi_dung: 'Điều 3. Trách nhiệm thi hành Chánh Văn phòng Bộ, Cục trưởng Cục Bảo vệ thực vật và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.'
      trang_pdf: 1
