ghi_chu: 'Ban hành Danh mục 117 đối tượng kiểm dịch thực vật của Việt Nam (Nhóm I: 112 loài; Nhóm II: 05 loài); thay thế Thông tư 35/2014/TT-BNNPTNT; được hợp nhất tại 100/2026/VBHN-TT-BNNMT.'
