  pham_vi: 'đối chiếu PDF toàn văn có lớp chữ trên Cổng Hải quan (id=87424, 7 trang, Thứ trưởng Bộ Nông nghiệp và Phát triển nông thôn Hoàng Trung ký ngày 15-08-2023, SHA-256 87679115dbb7db2bf6c2bd98f424db695f9654d5441420c40b3febf7bc0dc4c4) và thẻ vanban.chinhphu.vn (docid=208538): ban hành Danh mục 117 đối tượng kiểm dịch thực vật của Việt Nam (Nhóm I: 112 sinh vật gây hại chưa có trên lãnh thổ VN; Nhóm II: 05 sinh vật gây hại phân bố hẹp trên lãnh thổ VN); có hiệu lực từ 29-09-2023 và thay thế Thông tư 35/2014/TT-BNNPTNT ngày 31-10-2014; đã được hợp nhất với Thông tư 12/2025/TT-BNNMT tại Văn bản hợp nhất 100/2026/VBHN-TT-BNNMT ngày 20-10-2026'
