  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/24/VB_358.pdf, id=99683, SHA-256 4966bfed3711399be3546812089a04bc5ed043d5782d8e233c3b588bb0752d4c): Thông báo số 358/TB-CHQ ngày 21-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thẻ cảm biến nhiệt độ và độ ẩm (ký, mã hiệu ELF26F6BXH/LID; cấu tạo vỏ nhựa, pin CR2450, bản mạch PCB gắn IC cảm biến nhiệt độ và độ ẩm, IC NFC, IC bộ nhớ, thạch anh Crystal và IC RF Microcontrollers - MCU; điện áp đầu vào 3V, đọc giá trị cảm biến qua giao tiếp I2C và truyền bằng sóng vô tuyến tần số 2.4GHz đến cổng kết nối Gateway để hiển thị thông tin nhiệt độ, độ ẩm trên chương trình người dùng), phân loại vào nhóm 90.25, mã số 9025.80.00; có hiệu lực từ ngày ký'
