  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Ban hành kèm theo Quyết định này Danh sách chỉ định các cơ quan đầu mối để triển khai thực hiện Hiệp định thương mại tự do giữa Cộng hòa xã hội chủ nghĩa Việt Nam và Liên minh châu Âu (EVFTA) (Phụ lục kèm theo).
      trang_pdf: 1
      sha256_pdf: 9edc3f3bad65382e85733aab1d11a60867e45bf0b77f52bfd3af6c973eed2bc3
    - dieu: 2
      noi_dung: Điều 2. Trong quá trình triển khai Hiệp định, các cơ quan đầu mối được nêu tại Phụ lục có trách nhiệm chủ động theo dõi, tham dự đầy đủ các buổi họp liên quan, tổng hợp kết quả trao đổi của từng nội dung phụ trách và kiến nghị (nếu có), gửi Bộ Công Thương muộn nhất 15 ngày làm việc kể từ ngày kết thúc buổi họp. Đối với những nội dung vượt thẩm quyền, Bộ Công Thương chủ trì, phối hợp với các cơ quan liên quan tổng hợp, báo cáo Thủ tướng Chính phủ xem xét, quyết định.
      trang_pdf: 1
      sha256_pdf: 9edc3f3bad65382e85733aab1d11a60867e45bf0b77f52bfd3af6c973eed2bc3
    - dieu: 3
      noi_dung: Điều 3. Trong quá trình triển khai thực hiện Hiệp định, trường hợp cần điều chỉnh để phù hợp với tình hình thực tế, Bộ Công Thương chủ trì, phối hợp với các cơ quan liên quan tổng hợp, báo cáo Thủ tướng Chính phủ xem xét, quyết định.
      trang_pdf: 1
      sha256_pdf: 9edc3f3bad65382e85733aab1d11a60867e45bf0b77f52bfd3af6c973eed2bc3
    - dieu: 4
      noi_dung: Điều 4. Quyết định này có hiệu lực thi hành kể từ ngày ký ban hành.
      trang_pdf: 2
      sha256_pdf: 9edc3f3bad65382e85733aab1d11a60867e45bf0b77f52bfd3af6c973eed2bc3
    - dieu: 5
      noi_dung: Điều 5. Quyết định này thay thế Quyết định số 1175/QĐ-TTg ngày 04 tháng 8 năm 2020 của Thủ tướng Chính phủ về việc chỉ định các cơ quan đầu mối để triển khai thực hiện Hiệp định thương mại tự do giữa Cộng hòa xã hội chủ nghĩa Việt Nam và Liên minh châu Âu (EVFTA).
      trang_pdf: 2
      sha256_pdf: 9edc3f3bad65382e85733aab1d11a60867e45bf0b77f52bfd3af6c973eed2bc3
    - dieu: 6
      noi_dung: Điều 6. Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ và Thủ trưởng các cơ quan có liên quan chịu trách nhiệm thi hành Quyết định này./.
      trang_pdf: 2
