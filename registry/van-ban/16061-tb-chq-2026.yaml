  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/15/VB_16061.pdf, id=103727, SHA-256 fcd4f3c9f5af17c3928a84944379a069da22b96cdaf103b9196d0514de5033db): Thông báo số 16061/TB-CHQ ngày 11-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Mặt nạ xông hơi mắt MegRhythm loại có hương (ký, mã hiệu MSEM-LA / MSEM-CH / MSEM-OS / MSEM-CI / MSEM-FO; cấu tạo gồm dây đeo tai, màng tiếp xúc da, màng đáy, màng thẩm thấu khí kiểm soát oxy, màng kín và thành phần sinh nhiệt Fe, H2O theo phản ứng oxy hóa sắt tỏa nhiệt; thành phần theo trọng lượng gồm bao gói vải không dệt 32,2%, màng đáy 9,4%, keo dính 1,6%, phần lõi hạt sinh nhiệt 56,1%, chất thơm 0,7%; đóng gói 5 miếng/hộp, tỏa hơi nước ấm khoảng 40 °C trong 20 phút giúp thư giãn mắt), phân loại vào nhóm 38.24, phân nhóm 3824.99, mã số 3824.99.99; có hiệu lực kể từ ngày ban hành'
