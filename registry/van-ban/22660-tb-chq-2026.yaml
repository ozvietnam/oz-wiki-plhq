ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành ấn chỉ bán thu tiền từ ngày 07-10-2026: (1) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại nhỏ) mẫu MT-01, giá bán 441 đồng/chiếc, gồm 2 dải AC/2026 (999.999 chiếc, từ 000001 đến 999999) và AD/2026 (500.003 chiếc, từ 000001 đến 500003); (2) Tem điện tử rượu nhập khẩu độ cồn >=30 độ mẫu TRNK, ký hiệu tem BA/2026, số lượng 2.000.000 chiếc (từ 0000001 đến 2000000), giá bán 909 đồng/chiếc. Chưa gắn quan_he tới 1887/QĐ-CHQ/2025 vì chưa có trong sổ (tránh điểm mù Cao).'
