  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/8/VB_22660.pdf, id=106313, SHA-256 80170121e3849ed755a09499f4d57d3db315d926a218e8b94f2c889bff5dd04a): Thông báo số 22660/TB-CHQ ngày 07-10-2026 (ký số 08-10-2026 10:13:34 +07:00) của Cục Hải quan về việc phát hành ấn chỉ bán thu tiền từ ngày 07-10-2026 (căn cứ Quyết định 1887/QĐ-CHQ ngày 25-11-2025 của Cục trưởng Cục Hải quan về việc ban hành Quy chế quản lý ấn chỉ Hải quan): (1) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại nhỏ): ký hiệu mẫu MT-01, giá bán 441 đồng/chiếc, ngày bắt đầu sử dụng 07/10/2026, gồm 2 dải: AC/2026 (999.999 chiếc, từ 000001 đến 999999) và AD/2026 (500.003 chiếc, từ 000001 đến 500003); (2) Tem điện tử rượu nhập khẩu độ cồn >=30 độ: ký hiệu mẫu TRNK, ký hiệu tem BA/2026, số lượng 2.000.000 chiếc (từ số 0000001 đến số 2000000), giá bán 909 đồng/chiếc, ngày bắt đầu sử dụng 07/10/2026; người ký Trịnh Văn Nhuận (TL. Cục trưởng, Trưởng ban Tài vụ - Quản trị)'
