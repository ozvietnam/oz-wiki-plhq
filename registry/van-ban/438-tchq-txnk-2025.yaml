xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/1/24/438.TCHQ.pdf, id=98768, SHA-256 ac0f9a743a79c24af87a024247458fdcf9c5a00242459126152a6d375be0ee75): Công văn hỏa tốc số 438/TCHQ-TXNK ngày 23-01-2025 của Tổng cục Hải quan (Phó Tổng cục trưởng Âu Anh Tuấn ký, đính kèm toàn văn Quyết định số 143/QĐ-BCT) hướng dẫn các Cục Hải quan tỉnh, thành phố thực hiện Quyết định số 143/QĐ-BCT ngày 14-01-2025 của Bộ trưởng Bộ Công Thương về việc áp dụng biện pháp chống bán phá giá chính thức đối với sản phẩm cáp thép dự ứng lực (HS 7312.10.91 và 7312.10.99, mã vụ việc AD17) có xuất xứ từ Malaysia, Thái Lan và Trung Quốc (hướng dẫn khai báo mã G160 mức 12,06% đối với hàng xuất xứ Malaysia, G163 mức 11% đối với hàng xuất xứ Thái Lan, G170 mức 28% đối với hàng xuất xứ Trung Quốc khi không có/không khớp Giấy chứng nhận nhà sản xuất, và mã G171 mức 28% khi không nộp C/O); đang còn hiệu lực theo thời hạn 05 năm của Quyết định 143/QĐ-BCT (từ 29-01-2025 đến hết 28-01-2030)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn kê khai mã thuế chống bán phá giá chính thức trên hệ thống VNACCS (mã GK tại chỉ tiêu 1.95, các mã G160, G163, G170, G171 và mã theo từng nhà sản xuất/xuất khẩu) đối với cáp thép dự ứng lực (HS 7312.10.91, 7312.10.99; mã vụ việc AD17) theo Quyết định số 143/QĐ-BCT ngày 14/01/2025.'
