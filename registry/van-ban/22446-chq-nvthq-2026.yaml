ghi_chu: 'Hướng dẫn khai báo trên VNACCS/VCIS theo Nghị quyết 43/2026/NQ-CP: mục 2 quy định tiếp tục sử dụng mã VK240 tại chỉ tiêu "Mã áp dụng thuế suất/mức thuế và thu khác" từ ngày 01/10/2026 đến hết ngày 31/12/2026 cho mặt hàng xăng, dầu, nguyên liệu sản xuất xăng, dầu và nhiên liệu bay thuộc đối tượng không phải kê khai, tính nộp thuế GTGT.'
