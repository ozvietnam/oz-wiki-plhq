  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/1/739VB_22446.pdf, id=106225, SHA-256 2450960b212c6e375473bcaac78d78d53ff9e86f49678f05624752a5db48c77c): Công văn hỏa tốc số 22446/CHQ-NVTHQ ngày 01-10-2026 của Cục Hải quan (Phó Trưởng ban Nghiệp vụ thuế HQ Đào Thu Hương ký) hướng dẫn thực hiện Nghị quyết số 43/2026/NQ-CP ngày 30-09-2026 của Chính phủ (kéo dài thời hạn áp dụng Nghị quyết 25/2026/NQ-CP và Nghị định 72/2026/NĐ-CP về thuế nhập khẩu ưu đãi đối với xăng, dầu, nguyên liệu sản xuất xăng, dầu; kéo dài thời hạn áp dụng Điều 1 và Điều 2 Nghị quyết 19/2026/QH16 về thuế bảo vệ môi trường và thuế giá trị gia tăng đối với xăng, dầu, nguyên liệu sản xuất xăng, dầu và nhiên liệu bay đến hết ngày 31-12-2026; thuế tiêu thụ đặc biệt đối với xăng thực hiện theo Luật Thuế tiêu thụ đặc biệt số 66/2025/QH15) và hướng dẫn tiếp tục sử dụng mã VK240 tại ô chỉ tiêu "Mã áp dụng thuế suất/mức thuế và thu khác" trên tờ khai hải quan điện tử nhập khẩu hệ thống VNACCS/VCIS kể từ ngày 01-10-2026 đến hết ngày 31-12-2026 để khai báo thuế GTGT đối với hàng hóa thuộc đối tượng không phải kê khai, tính nộp thuế GTGT; đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
