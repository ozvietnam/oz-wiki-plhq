  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/LANG_SON/2026/9/12/VB_21582.pdf, id=105827, SHA-256 b782947774814c3e8471ae946f310a30644f922cef78ff954e62e8f5ffeefa6a): Thông báo số 21582/TB-CHQ (HỎA TỐC) ngày 11-09-2026 của Cục Hải quan (ký số 11/09/2026 13:53:11 +07:00) về việc triển khai thực hiện Nghị định số 286/2026/NĐ-CP ngày 17-07-2026 của Chính phủ quy định cơ chế phối hợp giữa các bộ, cơ quan ngang bộ, UBND tỉnh, thành phố trong công tác quản lý nhập cảnh, xuất cảnh, quá cảnh, cư trú của người nước ngoài tại Việt Nam (thực hiện công văn số 4486/BCA-QLXNC ngày 24-08-2026 của Bộ Công an); phân công nhiệm vụ cho Ban Giám sát quản lý (chủ trì, đầu mối phối hợp theo khoản 1 Điều 14 NĐ 286/2026/NĐ-CP trước ngày 15-09-2026), Ban Pháp chế (khoản 2 Điều 5 NĐ 286/2026/NĐ-CP), Chi cục Điều tra chống buôn lậu, Ban CNTT và thống kê Hải quan (Cổng thông tin một cửa quốc gia), Ban Nghiệp vụ thuế hải quan (tạm hoãn xuất cảnh người nước ngoài nợ thuế quá hạn), Văn phòng Cục và các đơn vị thuộc Cục; người ký Trương Thị Thúy Vinh (TL. Cục trưởng, KT. Chánh Văn phòng, Phó Chánh Văn phòng)'
  hieu_luc_da_doi_chieu: true
