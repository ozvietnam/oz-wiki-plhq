ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: triển khai Nghị định 286/2026/NĐ-CP ngày 17-07-2026 của Chính phủ (cơ chế phối hợp quản lý nhập cảnh, xuất cảnh, quá cảnh, cư trú của người nước ngoài tại Việt Nam) theo công văn 4486/BCA-QLXNC ngày 24-08-2026 của Bộ Công an; gồm phân công Ban Giám sát quản lý làm đầu mối, Ban Nghiệp vụ thuế hải quan hướng dẫn tạm hoãn xuất cảnh đối với người nước ngoài nợ thuế quá hạn, Ban CNTT & thống kê HQ vận hành Cổng thông tin một cửa quốc gia, Chi cục Điều tra chống buôn lậu kiểm soát hải quan và bảo vệ quyền SHTT. Chưa gắn quan_he tới 286/2026/NĐ-CP và 4486/BCA-QLXNC vì chưa có trong sổ (tránh điểm mù Cao).'
