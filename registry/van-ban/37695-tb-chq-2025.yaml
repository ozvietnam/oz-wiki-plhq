  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/11/25/4.VB_37695.pdf, id=101919, SHA-256 3fd49c384597805c08ff74f5c37a025a425e38df8788c2b173ea39b1069eb7cc): Thông báo số 37695/TB-CHQ ngày 21-11-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị đeo tay thông minh Huawei Watch Fit 4 phiên bản dây cao su (ký, mã hiệu SYA-B09; màn hình cảm ứng AMOLED 1.82 inch, độ phân giải 480 x 408 pixels; tích hợp loa và mic đàm thoại nhận/từ chối/thực hiện cuộc gọi, truyền nhận dữ liệu và đồng bộ với thiết bị chủ qua Bluetooth, hỗ trợ GPS, sạc không dây, không hỗ trợ NFC; lần khởi động đầu tiên phải ghép nối với thiết bị chủ mới sử dụng được tính năng), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
