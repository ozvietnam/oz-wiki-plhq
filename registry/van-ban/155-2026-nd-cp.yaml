  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đỗi, bỗ sung Điều 1 “Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định chỉ tiết các điều khoản sau đây của Luật Khiếu nại: a) Khoản 2 Điều 3 về khiếu nại và giải quyết khiếu nại trong đơn vị sự nghiệp công lập; b) Khoản 4 Điều 8 về nhiều người cùng khiếu nại về một nội dung; c) Điều 11a về tạm đình chỉ, đình chỉ giải quyết khiếu nại;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Bỗ sung Điều 3a vào sau Điều 3 “Điều 3a. Vụ việc phức tạp trong giải quyết khiếu nại 1. Vụ việc phức tạp trong giải quyết khiếu nại là vụ việc thuộc một trong; các trường hợp sau đây: a) Khiếu nại về một nội dung nhưng phải xác minh từ 02 địa điểm trở lên; b) Khiếu nại có từ 02 nội dung phải xác minh trở lên; c) Nhiều người khiếu nại về cùng một nội dung hoặc nội dung khiếu nại liên quan đến quyền và lợi ích của nhiều người; 1'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Sửa đỗi khoản 3 Điều 5 “3, Việc ủy quyền quy định tại khoản 1, khoản 2 Điều này phải được lập thành văn bản. Văn bản ủy quyền khiếu nại của cá nhân phải được công chứng hoặc chứng thực. Văn bản ủy quyền của tô chức phải do người có thẳm quyên của té chức ký và đóng dấu của tổ chức đó (nếu có). Nội dung văn bản ủy quyền thực hiện theo Mẫu số 02 ban hành kèm theo Nghị định này.
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Sửa đỗi, bỗ sung Điều 8 “Điều 8. Trach nhiệm của cơ quan, tô chức, cá nhân trong việc phối hợp xử lý trường hợp nhiều người cùng khiếu nại về một nội dung ở cấp xã 1. Khi phát sinh việc nhiều người cùng khiếu nại về một nội dưng ở xã, phường, đặc khu (gọi chung là cấp xã), Chủ tịch Ủy ban nhân dân cấp xã có trách nhiệm:'
      trang_pdf: 3
    - dieu: 10
      noi_dung: Điều 10. Sửa đổi khoản 1 Điều 16 “1. Trong thời hạn 07 ngày làm việc, kể từ ngày nhận được khiếu nại quyết định hành chính, hành vi hành chính, quyết định kỷ luật cán bộ, công chức thuộc thẩm quyền giải quyết mà không thuộc một trong các trường hợp được quy định tại Điều 11 của Luật Khiếu nại thì người có thâm quyền giải quyết khiếu nại lần đầu hoặc lần hai phải thụ lý giải quyết.
      trang_pdf: 5
    - dieu: 12
      noi_dung: Điều 12. Bỗ sung Mục 2a vào sau Mục 2 Chương IV “Mục 2a TẠM ĐÌNH CHÍ, ĐÌNH CHỈ GIẢI QUYẾT KHIEU NAI | Điều 28a. Sự kiện bất khả kháng và trở ngại khách quan trong giả quyết khiếu nại 1. Sự kiện bất khả kháng quy định tại điểm a khoản 1 Điều lla Luật Khiếu nại là sự kiện xảy ra một cách khách quan không thé lường trước được và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năn cho phép.
      trang_pdf: 6
    - dieu: 14
      noi_dung: Điều 14. Sửa đôi, bỗ sung Điều 38 “Điều 38. Xem xét việc giải quyết khiếu nại có vi phạm pháp luật | |
      trang_pdf: 8
    - dieu: 16
      noi_dung: 'Điều 16. Sửa đối, bd sung Điều 40 “Điều 40. Xử lý kỷ luật đối với người được giao nhiệm vụ xác minh nội dung khiếu nại 1. Hình thức kỷ luật khiển trách áp dụng đối với người được giao nhiệm vụ xác minh nội dung khiêu nại khi có một trong những hành vi sau: a) Sách nhiễu, cản trở, gay khó khăn, phiền ha cho người khiếu nai, người được ủy quyền khiếu nại, người bị khiếu nại; b) Bao che cho người bị khiếu nại;'
      trang_pdf: 9
    - dieu: 19
      noi_dung: Điều 19. Sửa đôi, bd sung khoản 1 Điều 43 “1. Việc giải quyết khiếu nại của người lao động trong doanh nghiệp nhà nước, đơn vị sự nghiệp công lập về các lĩnh vực lao động, giáo dục nghề nghiệp, hoạt động đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp
      trang_pdf: 11
    - dieu: 22
      noi_dung: Điều 22. Quy định chuyền tiếp | | 1. Việc rút khiếu nai, tạm đình chỉ, đình chi giải quyết khiếu nại, đối thòa đối với vụ việc khiếu nại đã có thông báo thụ lý trước ngày Nghị định này có hiệu lực thi hành và chưa ban hành quyết định giải quyết khiếu nại được thực hiện theo quy định tại Nghị định này. |
      trang_pdf: 12
ghi_chu: Quy định công chứng văn bản ủy quyền khiếu nại (khoản 3 Điều 5 NĐ 124, sửa tại Điều 3 NĐ này) hết hiệu lực từ 01-01-2027. Đã có VBHN 03/VBHN-NĐ-TTCP (10/2026) hợp nhất 124+155 — ưu tiên trích VBHN khi cần bản hợp nhất.
