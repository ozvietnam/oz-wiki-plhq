  pham_vi: số hiệu, trích yếu, ngày ban hành 26-01-2026 trên thẻ vanban.chinhphu.vn (docid=216827), kèm toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/46-2026-nd-cp.pdf, wiki/sources/46-2026-nd-cp.md); đối chiếu tình trạng tạm ngưng hiệu lực theo 09/2026/NQ-CP và 15/2026/NQ-CP
