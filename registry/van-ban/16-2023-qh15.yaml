  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quyền và nghĩa vụ của cơ quan, tổ chức, cá nhân, người tiêu dùng trong lĩnh vực giá, thẩm định giá; hoạt động quản lý, điều tiết giá của Nhà nước; tổng hợp, phân tích, dự báo giá thị trường; cơ sở dữ liệu về giá; thẩm định giá; thanh tra chuyên ngành về giá, kiểm tra việc chấp hành pháp luật về giá, thẩm định giá.
      trang_pdf: 1
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ; người tiêu dùng; cơ quan nhà nước; tổ chức, cá nhân khác có liên quan đến hoạt động trong lĩnh vực giá, thẩm định giá trên lãnh thổ Việt Nam.
      trang_pdf: 1
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 3
      noi_dung: Điều 3. Áp dụng Luật Giá và pháp luật có liên quan 1. Trường hợp có quy định khác nhau về giá giữa Luật Giá và luật khác được ban hành trước ngày Luật Giá có hiệu lực thi hành thì thực hiện theo quy định của Luật Giá, trừ trường hợp quy định tại khoản 4 Điều này.
      trang_pdf: 1
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 14
      noi_dung: Điều 14. Nhiệm vụ, quyền hạn của Bộ Tài chính 1. Là cơ quan đầu mối giúp Chính phủ thống nhất quản lý nhà nước về giá, thẩm định giá.
      trang_pdf: 12
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 24
      noi_dung: 'Điều 24. Ban hành văn bản định giá hoặc điều chỉnh mức giá; văn bản quy định cơ chế, chính sách về giá 1. Văn bản định giá hoặc điều chỉnh mức giá do cơ quan nhà nước có thẩm quyền định giá ban hành là văn bản hành chính. Việc ban hành văn bản được thực hiện như sau: a) Lập phương án giá; b) Thẩm định phương án giá; c) Trình và ban hành văn bản định giá, điều chỉnh mức giá.'
      trang_pdf: 23
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 34
      noi_dung: Điều 34. Hoạt động tổng hợp, phân tích, dự báo giá thị trường 1. Tổng hợp, phân tích, dự báo giá thị trường là việc thu thập, tổng hợp thông tin, dữ liệu về giá tài sản, hàng hóa, dịch vụ trong một giai đoạn, thời kỳ để phân tích, đánh giá, dự báo về xu hướng biến động của mặt bằng giá thị trường và đề ra phương hướng, giải pháp, biện pháp quản lý, điều tiết giá.
      trang_pdf: 29
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 44
      noi_dung: Điều 44. Thẻ thẩm định viên về giá 1. Thẻ thẩm định viên về giá là chứng nhận chuyên môn trong lĩnh vực thẩm định giá tài sản hoặc thẩm định giá doanh nghiệp, được cấp cho người đạt yêu cầu tại kỳ thi cấp thẻ thẩm định viên về giá.
      trang_pdf: 33
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 54
      noi_dung: 'Điều 54. Đình chỉ kinh doanh dịch vụ thẩm định giá và thu hồi giấy chứng nhận đủ điều kiện kinh doanh dịch vụ thẩm định giá 1. Doanh nghiệp thẩm định giá bị đình chỉ kinh doanh dịch vụ thẩm định giá khi thuộc một trong các trường hợp sau đây: a) Không đáp ứng một trong các điều kiện quy định tại khoản 1 Điều 49 của Luật này trong 03 tháng liên tục;'
      trang_pdf: 42
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 64
      noi_dung: Điều 64. Thông báo kết quả thẩm định giá và báo cáo thẩm định giá 1. Thông báo kết quả thẩm định giá và báo cáo thẩm định giá của hội đồng thẩm định giá được sử dụng làm cơ sở để tham mưu cho cơ quan, tổ chức, người có thẩm quyền xem xét quyết định, phê duyệt giá theo quy định của pháp luật có liên quan. 2. Thời gian có hiệu lực của thông báo kết quả thẩm định giá và báo cáo thẩm định giá được quy định tại Chuẩn mực thẩm định giá Việt Nam.
      trang_pdf: 49
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
    - dieu: 75
      noi_dung: Điều 75. Quy định chuyển tiếp 1. Trong thời hạn 12 tháng kể từ ngày Luật này có hiệu lực thi hành, các doanh nghiệp thẩm định giá đã được cấp giấy chứng nhận đủ điều kiện kinh doanh dịch vụ thẩm định giá theo quy định tại Luật Giá số 11/2012/QH13 phải bảo đảm điều kiện kinh doanh dịch vụ thẩm định giá theo quy định tại Luật này.
      trang_pdf: 59
      sha256_pdf: 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae
