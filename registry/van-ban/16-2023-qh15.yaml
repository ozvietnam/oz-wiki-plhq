  pham_vi: 'Đối chiếu PDF Công báo số 859+860 ngày 28-07-2023 (69 trang lớp chữ, SHA-256 9f9e5cc03f944c9f609e750c034e5f71c7c6256093adebe5aba91331732347ae): Quốc hội khóa XV kỳ họp thứ 5 thông qua ngày 19-06-2023, hiệu lực thi hành từ ngày 01-07-2024 (Điều 74; riêng khoản 2 Điều 60 từ 01-01-2026), thay thế Luật Giá 11/2012/QH13.'
