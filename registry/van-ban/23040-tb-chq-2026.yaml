ghi_chu: 'Xác định trước mã số mặt hàng Cáp mạng Lan UTP Cat6 4X2X24 AWG (bên ngoài là lớp vỏ nhựa; bên trong gồm 04 cặp cáp điện ngăn cách bởi vách ngăn chữ thập, mỗi sợi cáp có lõi là một sợi đồng tiết diện 24AWG, đường kính lõi dẫn tín hiệu nhỏ hơn 19,5mm, bọc cách điện bằng nhựa PE; cáp dạng cuộn, chưa gắn đầu nối, điện áp tối đa 12V, không dùng cho viễn thông, sử dụng trong mạng máy tính để truyền nhận tín hiệu) thuộc nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24.'
