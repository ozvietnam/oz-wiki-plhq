  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/16/VB_23040.pdf, id=106373, SHA-256 964ff6d337c9e42348063593c2311fcf7a300de4b44b380c4431d5422147183e): Thông báo số 23040/TB-CHQ ngày 15-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp mạng Lan UTP Cat6 4X2X24 AWG (bên ngoài lớp vỏ bằng chất liệu nhựa; bên trong là 04 cáp điện ngăn cách bởi vách ngăn chữ thập, mỗi cáp gồm 02 sợi cáp lõi một sợi đồng tiết diện 24AWG, đường kính lõi nhỏ hơn 19,5mm, bọc cách điện bằng plastic nhựa PE; cáp dạng cuộn chưa gắn đầu nối, điện áp tối đa 12V, không dùng cho viễn thông, sử dụng trong mạng máy tính để truyền nhận tín hiệu giữa máy tính với mạng internet và các máy tính khác trong cùng hệ thống), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
