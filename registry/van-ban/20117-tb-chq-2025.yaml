xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/19/10.VB_20117.pdf, id=101052, SHA-256 0dbbebe5085e3e9b8d261808b48fea1523a239b6bad0a02c9d71793eed01e230): Thông báo số 20117/TB-CHQ ngày 19-08-2025 của Cục Hải quan về việc phát hành Tem điện tử rượu nhập khẩu từ ngày 19-08-2025 (căn cứ Thông tư 23/2021/TT-BTC ngày 30-03-2021 và Thông tư 31/2025/TT-BTC ngày 31-05-2025 của Bộ trưởng Bộ Tài chính): (1) Tem điện tử rượu nhập khẩu độ cồn >=30 độ: ký hiệu mẫu RT30, ký hiệu tem BA/2024, số lượng 2.300.000 chiếc (từ số 5500001 đến số 7800000), giá bán 851 đồng/chiếc, ngày bắt đầu sử dụng 19/8/2025; (2) Tem điện tử rượu nhập khẩu độ cồn <30 độ: ký hiệu mẫu RD30, giá bán 851 đồng/chiếc, ngày bắt đầu sử dụng 19/8/2025, gồm 4 dải: AC/2024 (3.999.999 chiếc, từ 6000001 đến 9999999), AD/2024 (9.999.999 chiếc, từ 0000001 đến 9999999), AE/2024 (9.999.999 chiếc, từ 0000001 đến 9999999), AG/2024 (3.000.005 chiếc, từ 0000001 đến 3000005); người ký Trịnh Văn Nhuận (TL. Cục trưởng, Trưởng ban Tài vụ - Quản trị)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành Tem điện tử rượu nhập khẩu từ ngày 19-08-2025 (mẫu RT30 ký hiệu BA/2024 cho rượu NK độ cồn >=30 độ: 2.300.000 chiếc từ 5500001 đến 7800000; mẫu RD30 cho rượu NK độ cồn <30 độ gồm 4 dải AC/2024, AD/2024, AE/2024, AG/2024; đồng giá bán 851 đồng/chiếc). Chưa gắn quan_he tới 23/2021/TT-BTC và 31/2025/TT-BTC vì chưa có trong sổ (tránh điểm mù Cao).'
