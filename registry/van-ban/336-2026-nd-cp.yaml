xac_minh:
  muc: NGUON_A
  pham_vi: 'số hiệu, trích yếu, ngày ban hành 22-08-2026 và ngày có hiệu lực 15-10-2026 trên vanban.chinhphu.vn (docid=219265); đối chiếu toàn văn PDF ký số 54 trang (raw/download/datafiles.chinhphu.vn/336-2026-nd-cp.pdf, SHA-256 605ea4293073663f3757e5d9e7388ce41ea50f0a232d0b43443bd3c09d0035ce) và trang wiki/sources/336-2026-nd-cp.md: gồm 6 chương, 50 điều và 04 Phụ lục; Điều 48 khoản 1, khoản 2 có hiệu lực từ 15-10-2026 và thay thế toàn bộ 85/2019/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định về việc thực hiện thủ tục hành chính đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh theo cơ chế một cửa quốc gia, cơ chế một cửa ASEAN; quản lý, vận hành, trao đổi, chia sẻ dữ liệu thông qua Cổng thông tin một cửa quốc gia.'
    - dieu: 2
      noi_dung: '1. Cơ quan, tổ chức, cá nhân thực hiện thủ tục hành chính đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh. 2. Cơ quan, tổ chức, cá nhân liên quan đến hoạt động xuất khẩu, nhập khẩu, quá cảnh hàng hóa; xuất cảnh, nhập cảnh, quá cảnh của người, phương tiện vận tải. 3. Tổ chức cung cấp dịch vụ chứng thực chữ ký số, tổ chức cung cấp phần mềm.'
    - dieu: 3
      khoan: 1
      noi_dung: '1. Thực hiện thủ tục hành chính theo cơ chế một cửa quốc gia là việc người khai gửi thông tin, chứng từ điện tử để thực hiện thủ tục hành chính đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh trên Cổng thông tin một cửa quốc gia. Cơ quan giải quyết thủ tục hành chính quyết định cho phép hàng hóa được xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải được xuất cảnh, nhập cảnh, quá cảnh trên Cổng thông tin một cửa quốc gia; cơ quan hải quan quyết định thông quan hàng hóa, xác nhận phương tiện vận tải đã hoàn thành thủ tục hải quan và trả kết quả xử lý đến Cổng thông tin một cửa quốc gia.'
    - dieu: 3
      khoan: 10
      noi_dung: '10. Số định danh hàng hóa là mã số điện tử do hệ thống xử lý dữ liệu điện tử hải quan cấp để định danh, theo dõi và quản lý thống nhất đối với hàng hóa nhập khẩu trong quá trình thực hiện thủ tục hải quan và thủ tục quản lý nhà nước liên quan.'
    - dieu: 4
      noi_dung: '1. Tiếp nhận thông tin về số định danh hàng hóa từ hệ thống xử lý dữ liệu điện tử hải quan; tiếp nhận chứng từ điện tử và các thông tin khác có liên quan, xác thực chữ ký số của người khai và các cơ quan xử lý. 2. Chuyển chứng từ điện tử và các thông tin khác có liên quan của người khai đến hệ thống xử lý chuyên ngành, đồng thời lưu trữ thông tin tiếp nhận từ người khai trên Cổng thông tin một cửa quốc gia nhằm mục đích tra cứu, thống kê. 3. Tiếp nhận kết quả xử lý và thông báo từ hệ thống xử lý chuyên ngành hoặc kết quả xử lý thủ tục hành chính từ Cổng dịch vụ công quốc gia. 4. Phản hồi kết quả xử lý cho người khai, hệ thống xử lý dữ liệu điện tử hải quan, Cổng dịch vụ công quốc gia. Phản hồi kết quả xử lý thông quan đến hệ thống xử lý chuyên ngành. 5. Lưu trữ trạng thái của các giao dịch điện tử, chứng từ điện tử được thực hiện trên Cổng thông tin một cửa quốc gia. Thời hạn lưu trữ trạng thái các giao dịch điện tử và chứng từ điện tử thực hiện theo quy định của pháp luật về giao dịch điện tử và quy định lưu trữ hồ sơ của pháp luật chuyên ngành. 6. Chia sẻ thông tin giải quyết thủ tục hành chính, dữ liệu theo yêu cầu từ các cơ quan xử lý và người khai phù hợp chức năng, thẩm quyền của cơ quan xử lý và quyền, trách nhiệm của người khai. 7. Chia sẻ thông tin giải quyết thủ tục hành chính với các cơ quan quản lý nhà nước tại cửa khẩu phù hợp với chức năng, thẩm quyền theo quy định. 8. Đăng tải quy định của pháp luật chuyên ngành về chính sách quản lý, thủ tục hành chính và người thực hiện theo quy định của Nghị định này. 9. Kết nối với hệ thống thông tin của các quốc gia và vùng lãnh thổ theo thỏa thuận quốc tế đã ký kết, điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.'
    - dieu: 6
      noi_dung: 'Thủ tục hành chính đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh theo cơ chế một cửa quốc gia, cơ chế một cửa ASEAN được quản lý, vận hành, trao đổi, chia sẻ dữ liệu thông qua Cổng thông tin một cửa quốc gia. Các giao dịch điện tử trên Cổng thông tin một cửa quốc gia bao gồm: 1. Khai, nhận, phản hồi thông tin về việc xử lý hồ sơ để thực hiện thủ tục hành chính trên Cổng thông tin một cửa quốc gia. 2. Tiếp nhận, chuyển chứng từ điện tử và các thông tin khác có liên quan từ Cổng thông tin một cửa quốc gia đến các hệ thống xử lý chuyên ngành. 3. Nhận kết quả xử lý được gửi từ các hệ thống xử lý chuyên ngành tới Cổng thông tin một cửa quốc gia. 4. Trao đổi thông tin giữa các hệ thống xử lý chuyên ngành và hệ thống xử lý dữ liệu điện tử hải quan thông qua Cổng thông tin một cửa quốc gia. 5. Trao đổi thông tin giữa Cổng thông tin một cửa quốc gia với hệ thống thông tin của các quốc gia và vùng lãnh thổ theo thỏa thuận quốc tế đã ký kết, các điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. 6. Thông báo kết quả xử lý thủ tục hành chính từ Cổng thông tin một cửa quốc gia đến hệ thống xử lý dữ liệu điện tử hải quan để phục vụ việc quyết định thông quan hàng hóa, xác nhận phương tiện vận tải đã hoàn thành thủ tục hải quan của cơ quan hải quan. 7. Trao đổi thông tin kết quả xử lý thủ tục hành chính giữa Cổng thông tin một cửa quốc gia và Cổng dịch vụ công quốc gia.'
    - dieu: 7
      khoan: 1
      noi_dung: '1. Đơn vị quản lý Cổng thông tin một cửa quốc gia là Cục Hải quan thuộc Bộ Tài chính.'
    - dieu: 11
      khoan: 1
      noi_dung: '1. Đăng ký tài khoản người sử dụng là người khai Người sử dụng đăng ký tài khoản và chữ ký số trên Cổng thông tin một cửa quốc gia hoặc sử dụng tài khoản định danh điện tử được cấp qua ứng dụng định danh quốc gia VNeID để đăng ký, truy cập hệ thống. Các chỉ tiêu đăng ký thông tin quy định tại Phụ lục I ban hành kèm theo Nghị định này. Đơn vị quản lý Cổng thông tin một cửa quốc gia thực hiện kiểm tra, đối chiếu thông tin của người khai trong thời hạn 01 ngày làm việc kể từ khi tiếp nhận thông tin. Trường hợp thông tin khai không đầy đủ hoặc không chính xác, đơn vị quản lý Cổng thông tin một cửa quốc gia thông báo qua thư điện tử yêu cầu sửa đổi, bổ sung hoặc thông báo không chấp nhận, đồng thời nêu rõ lý do tới người khai. Trường hợp thông tin khai đầy đủ, chính xác, đơn vị quản lý Cổng thông tin một cửa quốc gia thông báo chấp thuận qua thư điện tử cho người khai.'
    - dieu: 13
      khoan: 3
      noi_dung: '3. Trách nhiệm của cơ quan xử lý a) Thực hiện thủ tục hành chính theo quy định của pháp luật liên quan; b) Cơ quan xử lý gửi kết quả xử lý thủ tục hành chính đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh; phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh thông qua Cổng thông tin một cửa quốc gia; c) Cơ quan hải quan quyết định thông quan hàng hóa xuất khẩu, nhập khẩu, quá cảnh; xác nhận phương tiện vận tải đã hoàn thành thủ tục hải quan trên cơ sở kết quả xử lý thủ tục hành chính của cơ quan xử lý được chuyển đến hệ thống xử lý dữ liệu điện tử hải quan thông qua Cổng thông tin một cửa quốc gia.'
    - dieu: 15
      noi_dung: '1. Việc tạo lập, chuyển đổi chứng từ điện tử từ chứng từ giấy và ngược lại được thực hiện theo pháp luật về giao dịch điện tử, pháp luật chuyên ngành và quy định tại khoản 2, khoản 3 Điều này. 2. Chứng từ điện tử chuyển đổi từ chứng từ giấy được khai báo hoặc xuất trình với cơ quan xử lý nếu bảo đảm các điều kiện sau: a) Phản ánh toàn vẹn nội dung của chứng từ giấy; b) Có chữ ký số đã được đăng ký tham gia Cổng thông tin một cửa quốc gia của người khai trên chứng từ điện tử được chuyển đổi từ chứng từ giấy. 3. Chứng từ giấy chuyển đổi từ chứng từ điện tử được cấp thông qua Cổng thông tin một cửa quốc gia nếu bảo đảm các điều kiện sau: a) Phản ánh toàn vẹn nội dung của chứng từ điện tử; b) Có dấu hiệu nhận biết trên chứng từ giấy được chuyển đổi từ chứng từ điện tử được in ra từ Cổng thông tin một cửa quốc gia. Dấu hiệu nhận biết gồm: các thông tin thể hiện chứng từ đã được ký số bởi cơ quan cấp phép hoặc đơn vị quản lý Cổng thông tin một cửa quốc gia, tên và địa chỉ thư điện tử, điện thoại liên hệ của cơ quan ký, thời gian ký số. Dấu hiệu nhận biết do đơn vị quản lý Cổng thông tin một cửa quốc gia công bố tại địa chỉ: https://vnsw.gov.vn; c) Có chữ ký, họ tên và con dấu hợp pháp của người thực hiện chuyển đổi (người khai) trên chứng từ giấy được chuyển đổi từ chứng từ điện tử.'
    - dieu: 18
      noi_dung: '1. Việc khai, sửa đổi, bổ sung thông tin khai có thể được thực hiện theo một trong các hình thức tạo lập thông tin khai điện tử sau: a) Tạo lập thông tin Bản khai chung theo chuẩn dữ liệu với các chỉ tiêu thông tin tại Phụ lục III ban hành kèm theo Nghị định này và gửi đến Cổng thông tin một cửa quốc gia; b) Tạo lập thông tin khai theo các tiêu chí, định dạng do các bộ quản lý ngành, lĩnh vực xây dựng theo chuẩn dữ liệu và gửi đến Cổng thông tin một cửa quốc gia; c) Khai trực tiếp trên Cổng thông tin một cửa quốc gia. 2. Việc sửa đổi, bổ sung thông tin khai được thực hiện theo quy định của pháp luật có liên quan. 3. Việc nộp các chứng từ trong hồ sơ hành chính thực hiện theo quy định tại Điều 14 Nghị định này. 4. Trường hợp số lượng hàng hóa thực tế nhập khẩu nhiều hơn so với số lượng đã khai báo trên tờ khai hải quan nhưng là hàng hóa đồng nhất, cùng nhà nhập khẩu, cùng xuất xứ, cùng nhà sản xuất, được vận chuyển trên cùng phương tiện vận tải, cùng vận tải đơn trừ hàng hóa là máy móc, thiết bị, phương tiện vận tải thì người khai hải quan được sử dụng kết quả kiểm tra của cơ quan xử lý của tờ khai đó để thông quan sau khi đã hoàn thành các nghĩa vụ về thuế và quyết định xử lý (nếu có) theo quy định của pháp luật.'
    - dieu: 21
      noi_dung: '1. Thực hiện các biện pháp quản lý đối với hàng hóa xuất khẩu, nhập khẩu trên cơ sở áp dụng quản lý rủi ro, đánh giá mức độ tuân thủ pháp luật chuyên ngành của tổ chức, cá nhân nhằm bảo đảm hiệu quả, hiệu lực quản lý nhà nước và tạo thuận lợi cho hoạt động xuất khẩu, nhập khẩu, quá cảnh hàng hóa. 2. Ban hành và công bố trên Cổng thông tin một cửa quốc gia Danh mục hàng hóa xuất khẩu, nhập khẩu chịu sự quản lý của các bộ quản lý ngành, lĩnh vực a) Hàng hóa đưa vào Danh mục hàng hóa xuất khẩu, nhập khẩu chịu sự quản lý của các bộ quản lý ngành, lĩnh vực phải có tên gọi chi tiết kèm mã số HS phù hợp Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam; b) Hàng hóa đưa vào Danh mục hàng hóa nhập khẩu chịu sự quản lý của các bộ quản lý ngành, lĩnh vực trước thông quan phải đáp ứng yêu cầu quản lý hàng hóa trong từng thời kỳ và thuộc một trong các khả năng: gây mất an toàn cao; gây lây lan dịch bệnh; gây nguy hại cho sức khỏe, tính mạng con người; gây ô nhiễm môi trường; ảnh hưởng đến đạo đức xã hội, thuần phong mỹ tục; nguy hại cho kinh tế, cho an ninh quốc gia. 3. Tiếp nhận kết quả kiểm tra, đánh giá làm cơ sở thông quan của các tổ chức đánh giá sự phù hợp và các tổ chức khác theo quy định của pháp luật chuyên ngành để gửi đến Cổng thông tin một cửa quốc gia.'
    - dieu: 46
      noi_dung: '1. Việc trao đổi, sử dụng, chia sẻ các thông tin và chứng từ điện tử thông qua Cổng thông tin một cửa quốc gia để thực hiện cơ chế một cửa ASEAN phải phù hợp với thỏa thuận quốc tế, điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam đã ký kết hoặc tham gia với tư cách thành viên trong việc thực hiện cơ chế một cửa ASEAN. 2. Thông tin, dữ liệu được trao đổi và chia sẻ bởi Cổng thông tin một cửa quốc gia của một quốc gia thành viên đến Cổng thông tin một cửa quốc gia của một quốc gia thành viên khác thông qua môi trường cơ chế một cửa ASEAN sẽ được sử dụng và lưu trữ theo các quy định của thỏa thuận quốc tế, điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam đã ký kết hoặc tham gia với tư cách thành viên trong việc thực hiện cơ chế một cửa ASEAN. 3. Thông tin và chứng từ điện tử được truyền và trao đổi thông qua cơ chế một cửa ASEAN được cơ quan hải quan sử dụng để thông quan đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh và trao đổi, chia sẻ thông tin với các bộ quản lý ngành, lĩnh vực đối với lĩnh vực liên quan.'
    - dieu: 48
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 15 tháng 10 năm 2026.'
    - dieu: 48
      khoan: 2
      noi_dung: '2. Nghị định này thay thế Nghị định số 85/2019/NĐ-CP ngày 14 tháng 11 năm 2019 của Chính phủ quy định thực hiện thủ tục hành chính theo cơ chế một cửa quốc gia, cơ chế một cửa ASEAN và kiểm tra chuyên ngành đối với hàng hóa xuất khẩu, nhập khẩu.'
    - dieu: 48
      khoan: 3
      noi_dung: '3. Thời điểm chia sẻ, tiếp nhận, sử dụng thông tin, dữ liệu số định danh hàng hóa nhập khẩu quy định tại Điều 3, Điều 4, Điều 10, Điều 20 Nghị định này thực hiện theo quy định của Chính phủ quy định chi tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan.'
    - dieu: 49
      noi_dung: '1. Trường hợp hệ thống xử lý chuyên ngành của các bộ quản lý ngành, lĩnh vực chưa đáp ứng yêu cầu kỹ thuật để phản hồi kết quả theo quy định tại điểm d khoản 2 Điều 20 Nghị định này thì tiếp tục thực hiện phản hồi kết quả đến Cổng thông tin một cửa quốc gia theo các tiêu chí, định dạng do các bộ quản lý ngành, lĩnh vực xây dựng theo chuẩn dữ liệu do Bộ Tài chính quy định, hướng dẫn trong thời gian tối đa 01 năm kể từ ngày Nghị định này có hiệu lực thi hành. 2. Bộ Tài chính có trách nhiệm nâng cấp Cổng thông tin một cửa quốc gia; các bộ quản lý ngành, lĩnh vực có trách nhiệm tổ chức nâng cấp hệ thống xử lý chuyên ngành để thực hiện thủ tục hành chính theo cơ chế một cửa quốc gia. Việc áp dụng các thủ tục hành chính và thời điểm thực hiện thủ tục hành chính theo cơ chế một cửa quốc gia được thực hiện theo công bố của Bộ trưởng Bộ Tài chính quy định tại Điều 10 Nghị định này.'
    - dieu: 50
      noi_dung: '1. Bộ Tài chính, các bộ quản lý ngành, lĩnh vực hướng dẫn, tổ chức thi hành Nghị định này. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
ghi_chu: Thẻ cổng Chính phủ khớp ngày ban hành 22-08-2026 và người ký Nguyễn Văn Thắng. Đã đọc toàn văn PDF ký số 54 trang và trích điều khoản bậc A; có hiệu lực từ 15-10-2026 và thay thế toàn bộ 85/2019/NĐ-CP theo khoản 1, khoản 2 Điều 48.
