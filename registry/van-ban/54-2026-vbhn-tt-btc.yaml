  pham_vi: 'đối chiếu toàn văn PDF 74 trang ký số ngày 12-10-2026 bởi Thứ trưởng Bộ Tài chính Nguyễn Đức Chi trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=219957 / datafiles.chinhphu.vn): hợp nhất Thông tư 49/2015/TT-BTC ngày 14-04-2015 (HL 29-05-2015) với Thông tư 56/2019/TT-BTC ngày 23-08-2019 (HL 15-10-2019) và Thông tư 142/2026/TT-BTC ngày 29-09-2026 (HL 16-11-2026); gồm 6 Chương, 19 Điều và Phụ lục I, II, III kèm các mẫu CN22, CN23, CN37, CN38, E1QT'
