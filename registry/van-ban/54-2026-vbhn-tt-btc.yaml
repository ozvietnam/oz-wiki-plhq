      noi_dung: Điều 18. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành ngày 29 tháng 5 năm 2015. Bãi bỏ Thông tư số 99/2010/TT-BTC ngày 09 tháng 07 năm 2010 của Bộ trưởng Bộ Tài chính quy định thủ tục hải quan đối với bưu phẩm, bưu kiện, hàng hóa xuất khẩn, nhập khẩu gửi qua dịch vụ bưu chính.
