      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định thủ tục hải quan đối với thư, gói, kiện hàng hóa xuất khẩu, nhập khẩu gửi qua mạng bưu chính được cung ứng bởi doanh nghiệp được chỉ định (sau đây gọi chung là bưu gửi).
      trang_pdf: 4
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Doanh nghiệp được chỉ định theo quy định của Luật Bưu chính (sau đây gọi tắt là doanh nghiệp); 2. Cơ quan, tổ chức, cá nhân có bưu gửi xuất khâu, nhập khẩu gửi qua dịch vụ bưu chính; 3. Cơ quan hải quan; công chức hải quan. 4. ?Doanh nghiệp kinh doanh địa điểm tập kết, kiểm tra, giám sát tập trung đôi với hàng bưu chính, chuyển phát nhanh.
      trang_pdf: 4
    - dieu: 3
      noi_dung: Điều 3. Địa điểm làm thủ tục hải quan° Thực hiện theo quy định tại khoản 1 Điều 1 Nghị định sé 167/2025/NĐ-CP!.
      trang_pdf: 4
    - dieu: 4
      noi_dung: Điều 4. Một số quy định đặc thù 1. Đối với thư xuất khâu, nhập khâu Thư xuất khẩu, nhập khẩu gửi qua dich vụ bưu chính chịu sự giám sát hải quan theo hình thức niêm phong hải quan đối với bao bì chuyên dụng hoặc xe chuyên dung của doanh nghiệp dé dóng chuyến thư quốc tế. 2. Bưu gửi trong túi ngoại giao, túi lãnh sự xuất khẩu, nhập khẩu
      trang_pdf: 4
    - dieu: 5
      noi_dung: Điều 5. Hồ sơ hai quan?” 1. Hồ sơ hải quan đối với gói, kiện hàng hóa nhóm 1 a) Tờ khai hàng hóa nhập khẩu trị giá thấp đối với gói, kiện hàng hóa nhập khẩu hoặc Tờ khai hàng hóa xuất khẩu trị giá thấp đối với gói, kiện hàng hóa xuất ? Điểm này được bd sung theo quy định tại khoản 3 Điều 1 của Thông tư số 56/2019/TT-BTC, có hiệu lực kề từ ngây 15 tháng 10 năm 2019.
      trang_pdf: 11
    - dieu: 6
      noi_dung: 'Điều 6. Thủ tục hải quan giấy đối với gói, kiện hàng hóa xuất khẩu, nhập khẩu?° 1. Thủ tục hài quan đối với gói, kiện hàng hóa nhóm 1 quy định tại Thông tư này: a) Trách nhiệm của doanh nghiệp a.1) Thực hiện khai tờ khai hải quan giấy theo quy định tại điểm a khoản 1 Điều 5 Thông tư này; a.2) Xuất trình hồ sơ hải quan và gói, kiện hang hóa để kiểm tra theo quyết định của cơ quan hải quan;'
