ghi_chu: Trinh sát trạm BYT đêm 5/11. Sửa đổi, bổ sung khoản 3 Điều 14 và Điều 17 Thông tư 07/2022/TT-BYT về lộ trình thử tương đương sinh học đối với thuốc generic sản xuất, nhập khẩu và đăng ký lưu hành tại Việt Nam (liên kết thủ tục tại Điều 47, 55 Thông tư 32/2026/TT-BYT).
