  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=220147) và toàn văn PDF có chữ ký số của Văn phòng Chính phủ trên datafiles.chinhphu.vn (44-byt.signed.pdf, 864.170 byte, 3 trang, 3 điều): số ký hiệu 44/2026/TT-BYT, ngày ban hành 01-11-2026, người ký Thứ trưởng Đỗ Xuân Tuyên, trích yếu nguyên văn "Sửa đổi, bổ sung một số điều của Thông tư số 07/2022/TT-BYT của Bộ trưởng Bộ Y tế quy định thuốc phải thử tương đương sinh học và các yêu cầu đối với hồ sơ báo cáo số liệu nghiên cứu tương đương sinh học trong đăng ký lưu hành thuốc tại Việt Nam". Theo Điều 1 và Điều 2, Thông tư sửa đổi khoản 3 Điều 14 (lộ trình từ ngày 01-11-2028 đối với thuốc generic phải thử tương đương sinh học trong sản xuất, nhập khẩu, lưu hành và gia hạn giấy đăng ký lưu hành theo Điều 47, Điều 55 Thông tư 32/2026/TT-BYT) và sửa đổi, bổ sung Điều 17 (công bố Danh mục từ ngày 01-07-2027) của Thông tư 07/2022/TT-BYT (Thông tư 07/2022/TT-BYT hiện chưa nạp trong sổ nên ghi nhận tại phạm vi đối chiếu để tránh sinh điểm mù THIEU_VAN_BAN). Theo Điều 3 (Hiệu lực thi hành), Thông tư có hiệu lực thi hành kể từ ngày 01-11-2026; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi khoản 3 Điều 14 “3. Kể từ ngày 01 tháng 11 năm 2028, thuốc generic có chứa dược chất hoặc dạng bào chế phải thử tương đương sinh học theo quy định tại Thông tư này đã được cấp giấy đăng ký lưu hành: a) Chỉ được tiếp tục sản xuất, nhập khẩu và đưa ra lưu hành khi đã được công bố thuốc có tài liệu chứng minh tương đương sinh học;'
      trang_pdf: 1
      sha256_pdf: 6f4b6e2b02ef7e2b13fbaa1922503935e71202cc831f91e417dc8b3d0ca03a3e
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đổi, bổ sung Điều 17 1. Bổ sung điểm d vào sau điểm c khoản 1 như sau: “d) Tổ chức thực hiện việc công bố, cập nhật Danh mục thuốc chưa được công bố thuốc có tài liệu chứng minh tương đương sinh học trên Trang thông tin điện tử của Cục Quản lý Dược từ ngày 01 tháng 07 năm 2027.”. 2. Bổ sung khoản 1a vào sau khoản 1 như sau: “1a.'
      trang_pdf: 2
      sha256_pdf: 6f4b6e2b02ef7e2b13fbaa1922503935e71202cc831f91e417dc8b3d0ca03a3e
    - dieu: 3
      noi_dung: Điều 3. Hiệu lực thi hành Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 11 năm 2026. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các cơ quan, tổ chức, cá nhân phản ánh về Bộ Y tế (Cục Quản lý Dược) xem xét, giải quyết./.
      trang_pdf: 2
