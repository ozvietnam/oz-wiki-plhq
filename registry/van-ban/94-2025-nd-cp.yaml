xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu Công báo nước CHXHCN Việt Nam (ID 44816) và toàn văn PDF Công báo (56196-1-2025691-69294-2025-nd-cp.pdf): ban hành ngày 29-04-2025, có hiệu lực thi hành từ ngày 01-07-2025; đang còn hiệu lực.'
