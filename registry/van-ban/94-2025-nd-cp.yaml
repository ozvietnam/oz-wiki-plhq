  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về Cơ chế thử nghiệm có kiểm soát trong lĩnh vực ngân hàng (sau đây gọi là Cơ chế thử nghiệm) đối với việc triển khai sản phẩm, dịch vụ, mô hình kinh doanh mới thông qua ứng dụng giải pháp công nghệ (sau đây gọi là giải pháp công nghệ tài chính). 2. Các giải pháp công nghệ tài chính (viết tắt là giải pháp Fintech) được tham gia thử nghiệm tại Cơ chế thử nghiệm bao gồm: a) Chấm điểm tín dụng; b) Chia sẻ dữ liệu qua giao diện lập trình ứng dụng mở (Open API); c) Cho vay ngang hàng.'
      trang_pdf: 1
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng 1. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài theo quy định tại Luật Các tổ chức tín dụng (không áp dụng đối với điểm c khoản 2 Điều 1 Nghị định này). 2. Các công ty công nghệ tài chính. 3. Các cơ quan nhà nước có thẩm quyền. 4. Khách hàng và các tổ chức, cá nhân khác có liên quan đến Cơ chế thử nghiệm.'
      trang_pdf: 2
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 5
      noi_dung: 'Điều 5. Nguyên tắc xét duyệt tổ chức tham gia Cơ chế thử nghiệm Để đảm bảo tính công bằng, khách quan, công khai và minh bạch, việc xét duyệt các tổ chức tham gia Cơ chế thử nghiệm được thực hiện theo các nguyên tắc cơ bản như sau: 1. Quá trình xét duyệt tổ chức tham gia Cơ chế thử nghiệm đảm bảo tính minh bạch về tiêu chí và điều kiện, quy trình đánh giá, lựa chọn. 2. Việc được tham gia Cơ chế thử nghiệm không đồng nghĩa với việc tổ chức tham gia Cơ chế thử nghiệm sẽ đáp ứng các điều kiện kinh doanh và đầu tư khi pháp luật có quy định. 3. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, công ty Fintech không có nhu cầu tham gia Cơ chế thử nghiệm hoặc chưa được xét duyệt tham gia Cơ chế thử nghiệm hoạt động và tuân thủ theo các quy định của pháp luật hiện hành về doanh nghiệp, đầu tư và pháp luật khác có liên quan.'
      trang_pdf: 3
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 6
      noi_dung: 'Điều 6. Thời gian, không gian và phạm vi thử nghiệm 1. Thời gian thử nghiệm các giải pháp Fintech tối đa 02 năm tùy từng giải pháp và lĩnh vực cụ thể tính từ thời điểm được Ngân hàng Nhà nước cấp Giấy chứng nhận tham gia Cơ chế thử nghiệm. Thời gian thử nghiệm có thể được gia hạn theo quy định tại Điều 20 Nghị định này. Thời hạn của Giấy chứng nhận tham gia Cơ chế thử nghiệm không vượt quá thời hạn (nếu có) của Giấy phép thành lập, Giấy chứng nhận đăng ký kinh doanh của tổ chức tham gia Cơ chế thử nghiệm. 2. Không gian thử nghiệm: Việc triển khai thử nghiệm các giải pháp Fintech được giới hạn trên lãnh thổ Việt Nam, không được thực hiện thử nghiệm xuyên biên giới. 3. Phạm vi thử nghiệm: a) Tổ chức tham gia Cơ chế thử nghiệm chỉ được cung cấp các giải pháp Fintech trong phạm vi được quy định tại Giấy chứng nhận tham gia Cơ chế thử nghiệm; b) Tùy thuộc vào giải pháp Fintech và đề xuất cụ thể của tổ chức đăng ký tham gia Cơ chế thử nghiệm tại Hồ sơ đăng ký tham gia Cơ chế thử nghiệm, ý kiến của các bộ, Ngân hàng Nhà nước sẽ quyết định phạm vi thử nghiệm của giải pháp Fintech thử nghiệm tại Giấy chứng nhận tham gia Cơ chế thử nghiệm; c) Công ty cho vay ngang hàng chỉ được thực hiện cung ứng giải pháp cho vay ngang hàng trong phạm vi thử nghiệm tại Giấy chứng nhận tham gia Cơ chế thử nghiệm được Ngân hàng Nhà nước cấp cho Công ty cho vay ngang hàng theo quy định tại Nghị định này. Công ty cho vay ngang hàng tham gia Cơ chế thử nghiệm không được thực hiện các hoạt động kinh doanh khác không được nêu tại Giấy chứng nhận tham gia Cơ chế thử nghiệm, không được tự cung cấp biện pháp bảo đảm cho khoản vay của khách hàng, hoạt động với tư cách là khách hàng và cung ứng giải pháp cho vay ngang hàng cho công ty cầm đồ.'
      trang_pdf: 4
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 8
      khoan: 1
      noi_dung: '1. Tổ chức tín dụng không thuộc nhóm tổ chức tín dụng đang được kiểm soát đặc biệt theo Luật Các tổ chức tín dụng, chi nhánh ngân hàng nước ngoài được xem xét cấp Giấy chứng nhận tham gia Cơ chế thử nghiệm khi giải pháp Fintech đáp ứng các tiêu chí như sau: a) Là giải pháp có nội dung kỹ thuật và nghiệp vụ mà quy định pháp lý hiện hành chưa hướng dẫn cụ thể, rõ ràng cho việc triển khai, áp dụng; b) Là giải pháp có tính đổi mới sáng tạo, đem lại lợi ích, giá trị gia tăng cho người sử dụng dịch vụ tại Việt Nam, đặc biệt là các giải pháp hỗ trợ và thúc đẩy mục tiêu phổ cập tài chính; c) Là giải pháp đã thiết kế, xây dựng được khung quản lý rủi ro, hạn chế tác động tiêu cực tới hệ thống ngân hàng và hoạt động ngân hàng - tiền tệ - ngoại hối; đã xây dựng phương án về xử lý, khắc phục các rủi ro xảy ra trong quá trình thử nghiệm; đã xây dựng phương án bảo vệ quyền lợi người tiêu dùng; d) Là giải pháp đã được tổ chức tham gia Cơ chế thử nghiệm thực hiện các biện pháp rà soát, đánh giá đầy đủ trên các khía cạnh hoạt động và chức năng, công dụng, tính hữu ích; đ) Là giải pháp có tính khả thi để có thể cung ứng ra thị trường sau khi hoàn thành quá trình thử nghiệm.'
      trang_pdf: 5
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 8
      khoan: 2
      noi_dung: '2. Công ty Fintech được xem xét cấp Giấy chứng nhận tham gia Cơ chế thử nghiệm khi giải pháp Fintech đáp ứng các tiêu chí quy định tại khoản 1 Điều này và đáp ứng các điều kiện như sau: a) Là pháp nhân được thành lập và hoạt động hợp pháp trên lãnh thổ Việt Nam; không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quy định pháp luật; b) Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 02 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật.'
      trang_pdf: 6
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 21
      khoan: 1
      noi_dung: '1. Giấy chứng nhận hoàn thành thử nghiệm của tổ chức tham gia Cơ chế thử nghiệm được Ngân hàng Nhà nước cấp trong các trường hợp như sau: a) Khi quy định pháp lý chính thức đối với giải pháp Fintech đã được hoàn thiện và có hiệu lực, tổ chức tham gia Cơ chế thử nghiệm được Ngân hàng Nhà nước cấp Giấy chứng nhận hoàn thành thử nghiệm và thực hiện theo quy định pháp luật tại thời điểm hoàn thành thử nghiệm; b) Khi việc triển khai giải pháp Fintech thử nghiệm của tổ chức tham gia Cơ chế thử nghiệm được đánh giá là không vi phạm các quy định pháp luật hiện hành và giải pháp Fintech không được xem xét là hoạt động kinh doanh có điều kiện, tổ chức tham gia Cơ chế thử nghiệm được Ngân hàng Nhà nước cấp Giấy chứng nhận hoàn thành thử nghiệm và triển khai ra thị trường phù hợp với quy định pháp luật tại thời điểm hoàn thành thử nghiệm.'
      trang_pdf: 23
      sha256_pdf: c5a694ddbb999cff06608d7ece9d49f00a82c7f5e955bd4f4fede58a37cad535
    - dieu: 25
      noi_dung: 'Điều 25. Hiệu lực thi hành Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.'
      trang_pdf: 29
