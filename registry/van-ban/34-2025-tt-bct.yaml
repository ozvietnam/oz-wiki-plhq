    - dieu: 1
      khoan: 2
      noi_dung: 'Sửa đổi, bổ sung Điều 3 như sau: “Điều 3. Hàng hóa mua bán, trao đổi qua biên giới của cư dân biên giới 1. Hàng hóa xuất khẩu dưới hình thức mua bán, trao đổi của cư dân biên giới thực hiện theo quy định của pháp luật hiện hành.'
      trang_pdf: 1
      sha256_pdf: 519db348308624b6ca28c2053291cdf94f3c41162f62378449bb01485281a7f6
    - dieu: 1
      khoan: 2
      noi_dung: '2. Hàng hóa được nhập khẩu dưới hình thức mua bán, trao đổi của cư dân biên giới quy định tại Phụ lục I kèm theo Thông tư này. 3. Các mặt hàng ngoài danh mục quy định tại khoản 2 Điều này không được nhập khẩu dưới hình thức mua bán, trao đổi hàng hóa của cư dân biên giới. 4. Trường hợp cần đảm bảo an toàn thực phẩm, phòng ngừa dịch bệnh qua biên giới, Bộ Công Thương sau khi trao đổi với các Bộ, ngành liên quan quyết định tạm ngừng nhập khẩu một số mặt hàng trong danh mục hàng hóa mua bán, trao đổi của cư dân biên giới ban hành theo quy định tại khoản 2 Điều này trên từng địa bàn với thời gian cụ thể”.'
      trang_pdf: 2
