      noi_dung: 'Thay thế Phụ lục I Danh mục hàng hóa nhập khẩu dưới hình thức mua bán, trao đổi của cư dân biên giới tại Thông tư số 02/2018/TT-BCT bằng Phụ lục ban hành theo Thông tư này.'
      trang_pdf: 2
