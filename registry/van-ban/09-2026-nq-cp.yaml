      noi_dung: 'Điều 1. Tạm ngưng hiệu lực và điều chỉnh thời hạn áp dụng văn bản 1. Tạm ngưng hiệu lực áp dụng Nghị định số 46/2026/NĐ- CP ngày 26 tháng 01 năm 2026 của Chính phủ quy định chỉ tiết thi hành một số điều và biện pháp đề tổ chức, hướng dẫn thi hành Luat An toàn thực phẩm và Nghị quyết SỐ: 66. 13/2026/NQ-CP ngày 27 tháng 01 năm 2026 của Chính phủ về công bố, đăng ký sản phẩm thực phẩm cho đến hết ngày 15 tháng 4 năm 2026.'
