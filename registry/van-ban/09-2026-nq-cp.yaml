      noi_dung: Điều 2. Áp dụng văn bản quy phạm pháp luật trong thời gian tạm ngưng hiệu lực - Trong thời gian tạm ngưng hiệu lực theo quy định tại Điều 1 Nghị quyết này, _ Nghị định 15/2018/NĐ-CP ngày 02 tháng 02 năm 2018 của Chính phủ quy định chỉ tiết thi hành một số điều của Luật An toàn thực phẩm và các văn bản quy định, hướng dẫn thi hành Nghị định này tiếp tục có hiệu lực.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Hiệu lực thi hành và trách nhiệm tổ chức thực hiện 1. Nghị quyết này có hiệu lực thi hành kể từ ngày 04 tháng 02 năm 2026.
      trang_pdf: 2
ghi_chu: Trích yếu cổng Chính phủ cũng tạm ngưng Nghị quyết 66.13/2026/NQ-CP. Nghị quyết này chưa có trong sổ, nên chưa ghi quan hệ. Chưa đọc điều khoản để chốt còn hiệu lực tới đâu.
