xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu PDF ký số Chính phủ (lớp chữ, SHA-256 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254): ban hành 19-06-2025, hiệu lực từ 01-07-2025 (Điều 30). Điều chỉnh phân cấp, phân định thẩm quyền và chuyển giao tên cơ quan sang Bộ Nông nghiệp và Môi trường trong nhiều thông tư trồng trọt, bảo vệ thực vật và kiểm dịch thực vật (hợp nhất tại 109/2026, 111/2026, 114/2026, 115/2026/VBHN-TT-BNNMT).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định phân cấp, phân định thẩm quyền quản lý nhà nước trong lĩnh vực trồng trọt và bảo vệ thực vật, bao gồm: 1. Quy định về hồ sơ, trình tự, biểu mẫu giải quyết thủ tục hành chính tại khoản 1 Điều 64 Nghị định số 136/2025/NĐ-CP ngày 12 tháng 6 năm 2025 của Chính phủ quy định phân quyền, phân cấp trong lĩnh vực nông nghiệp và môi trường (sau đây gọi là Nghị định số 136/2025/NĐ-CP).'
      trang_pdf: 1
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với các cơ quan hành chính nhà nước ở trung ương, chính quyền địa phương, tổ chức, cá nhân có liên quan đến phân cấp, phân định thẩm quyền quản lý nhà nước trong lĩnh vực trồng trọt và bảo vệ thực vật.
      trang_pdf: 2
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 3
      noi_dung: Điều 3. Quy định chung về hồ sơ, thủ tục 1. Hồ sơ nộp qua môi trường mạng thực hiện theo quy định tại Nghị định số 45/2020/NĐ-CP ngày 08 tháng 4 năm 2020 của Chính phủ về thực hiện thủ tục hành chính trên môi trường điện tử. 2. Hồ sơ nộp trực tiếp hoặc qua dịch vụ bưu chính là bản chính hoặc bản sao chứng thực hoặc bản chụp kèm bản chính để đối chiếu, trừ các trường hợp khác quy định cụ thể tại Thông tư này.
      trang_pdf: 2
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 8
      noi_dung: 'Điều 8. Cấp lại Giấy chứng nhận đủ điều kiện sản xuất phân bón 1. Hồ sơ gồm: a) Trường hợp Giấy chứng nhận đủ điều kiện sản xuất phân bón hết hạn: Trước thời hạn 03 tháng kể từ ngày Giấy chứng nhận đủ điều kiện sản xuất phân bón hết hạn, tổ chức, cá nhân sản xuất phân bón có nhu cầu tiếp tục sản xuất phân bón phải nộp hồ sơ gồm: Đơn đề nghị cấp lại Giấy chứng nhận đủ điều kiện sản xuất phân bón theo Mẫu số 10 Phụ lục I ban hành kèm theo Thông tư'
      trang_pdf: 5
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 11
      noi_dung: 'Điều 11. Sửa đổi, đình chỉ, hủy bỏ hiệu lực của quyết định chuyển giao bắt buộc quyền sử dụng giống cây trồng 1. Hồ sơ gồm: a) Đơn đề nghị sửa đổi, đình chỉ hiệu lực, hủy bỏ hiệu lực của quyết định chuyển giao bắt buộc quyền sử dụng giống cây trồng theo Mẫu số 19 Phụ lục I ban hành kèm theo Thông tư này;'
      trang_pdf: 7
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 15
      noi_dung: 'Điều 15. Công nhận các tiêu chuẩn Thực hành nông nghiệp tốt khác (GAP khác) cho áp dụng để được hưởng chính sách hỗ trợ trong nông nghiệp, lâm nghiệp và thủy sản 1. Hồ sơ gồm: a) Giấy đăng ký công nhận GAP khác theo Mẫu số 24 Phụ lục I ban hành kèm theo Thông tư này;'
      trang_pdf: 8
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 19
      noi_dung: 'Điều 19. Ghi nhận tổ chức dịch vụ đại diện quyền đối với giống cây trồng 1. Hồ sơ gồm: a) Đơn yêu cầu ghi nhận tổ chức dịch vụ đại diện quyền đối với giống cây trồng theo Mẫu số 33 Phụ lục I ban hành kèm theo Thông tư này;'
      trang_pdf: 10
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 23
      noi_dung: 'Điều 23. Cấp lại Thẻ hành nghề xử lý vật thể thuộc diện kiểm dịch thực vật quy định tại Điều 9 Thông tư số 05/2015/TT-BNNPTNT ngày 12 tháng 02 năm 2015 quy định về trình tự, thủ tục cấp Giấy chứng nhận hành nghề xử lý vật thể thuộc diện kiểm dịch thực vật 1. Hồ sơ gồm: a) Đơn đề nghị cấp lại thẻ hành nghề xử lý vật thể thuộc diện kiểm dịch thực vật theo Mẫu số 35 Phụ lục I ban hành kèm theo Thông tư này;'
      trang_pdf: 12
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 26
      noi_dung: 'Điều 26. Sửa đổi, bổ sung một số điều của Thông tư số 21/2015/TTBNNPTNT ngày 08 tháng 6 năm 2015 về quản lý thuốc bảo vệ thực vật 1. Thay thế từ “huyện” bằng từ “xã” tại Điều 19. 2. Sửa đổi, bổ sung tiêu đề khoản 2 Điều 61 như sau: “2.'
      trang_pdf: 15
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
    - dieu: 31
      noi_dung: Điều 31. Quy định chuyển tiếp 1. Văn bản, giấy phép, giấy chứng nhận là kết quả giải quyết thủ tục hành chính đã được cơ quan, người có thẩm quyền phân quyền, phân cấp ban hành trước ngày Thông tư này có hiệu lực thi hành và chưa hết hiệu lực hoặc chưa hết thời hạn thì tiếp tục được áp dụng, sử dụng theo thời hạn ghi trên văn bản, giấy phép, giấy chứng nhận đó cho đến khi hết thời hạn.
      trang_pdf: 17
      sha256_pdf: 1348e4fb006bc8a2edd1c2b6c6b6330ad0ccebd2d67ccff0157a3c5843b82254
ghi_chu: Văn bản phân cấp, phân định thẩm quyền lĩnh vực trồng trọt và bảo vệ thực vật từ 01-07-2025.
