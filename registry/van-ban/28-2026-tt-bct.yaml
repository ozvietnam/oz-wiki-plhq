  muc: NGUON_A
  pham_vi: 'PDF Công báo số 328 ngày 14-06-2026 (lớp chữ): Điều 4 khoản 1 hiệu lực 17-07-2026; khoản 2 hết hiệu lực Khoản 1 Điều 2 và Phụ lục 2 QĐ 1182/QĐ-BCT; tình trạng hiện tại: sổ không có văn bản sau ghi thay/bãi TT 28/2026 (kiểm đến 04-10-2026); toàn văn Công báo không nhắc TT 11/2022/TT-BCT'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-04'
  boi: cursor-agent@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Ban hành kèm theo Thông tư này Danh mục các mặt hàng nhập khẩu (kèm theo mã số HS) thực hiện kiểm tra nhà nước về an toàn thực phẩm thuộc trách nhiệm quản lý nhà nước của Bộ Công Thương (Danh mục) được quy định tại khoản 2 Điều 64 Luật An toàn thực phẩm số 55/2010/QH12 và khoản 3 Điều 39 Nghị định số 15/2018/NĐ-CP (không bao gồm dụng cụ, vật liệu bao gói, chứa đựng thực phẩm). Danh mục chi tiết tại Phụ lục kèm theo.'
      trang_pdf: 1
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 2
      noi_dung: 'Danh mục quy định tại Điều 1 Thông tư này được xác định mã số hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam ban hành kèm theo Thông tư số 31/2022/TT-BTC ngày 08 tháng 6 năm 2022 của Bộ trưởng Bộ Tài chính ban hành danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 3
      khoan: 1
      noi_dung: 'Trường hợp có sự khác biệt, không thống nhất trong việc xác định mã số hàng hóa đối với các hàng hoá thuộc Danh mục ban hành kèm theo Thông tư này, việc phân loại và xác định mã số hàng hoá thực hiện theo quy định của pháp luật về hải quan. Đối với hàng hóa chưa được liệt kê và xác định mã số hàng hóa trong Danh mục ban hành kèm theo Thông tư này, việc xác định mã số hàng hoá thực hiện theo quy định của pháp luật về hải quan. Sau khi thông quan, các tổ chức, cá nhân xuất khẩu, nhập khẩu có văn bản gửi về Bộ Công Thương để làm cơ sở phối hợp với Bộ Tài chính xem xét thống nhất, cập nhật và ban hành Danh mục bổ sung.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 3
      khoan: 2
      noi_dung: 'Việc kiểm tra nhà nước về an toàn thực phẩm nhập khẩu đối với thực phẩm nhập khẩu thuộc trách nhiệm quản lý nhà nước của Bộ Công Thương theo quy định tại khoản 3 Điều 39 Nghị định số 15/2018/NĐ-CP được thực hiện theo quy định tại Điều 40 Luật An toàn thực phẩm và Điều 16 Nghị định số 15/2018/NĐ-CP.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 3
      khoan: 3
      noi_dung: 'Thực phẩm nhập khẩu thuộc trách nhiệm quản lý nhà nước của Bộ Công Thương theo quy định tại khoản 3 Điều 39 Nghị định số 15/2018/NĐ-CP nhưng thuộc một trong các trường hợp được quy định tại Điều 13 Nghị định số 15/2018/NĐ-CP (trừ các trường hợp quy định tại khoản 3 Điều 17 Nghị định số 15/2018/NĐ-CP) được miễn kiểm tra nhà nước về an toàn thực phẩm nhập khẩu.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 4
      khoan: 1
      noi_dung: 'Thông tư này có hiệu lực thi hành kể từ ngày 17 tháng 7 năm 2026.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 4
      khoan: 2
      noi_dung: 'Khoản 1 Điều 2 và Phụ lục 2 ban hành kèm theo Quyết định số 1182/QĐBCT ngày 06 tháng 4 năm 2021 của Bộ trưởng Bộ Công Thương về việc ban hành Danh mục các mặt hàng nhập khẩu (kèm theo mã HS) thực hiện kiểm tra chuyên ngành thuộc trách nhiệm quản lý của Bộ Công Thương hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
    - dieu: 4
      khoan: 3
      noi_dung: 'Trong trường hợp các văn bản quy phạm pháp luật được viện dẫn trong Thông tư này được sửa đổi, bổ sung hoặc thay thế thì áp dụng theo các văn bản quy phạm pháp luật mới còn hiệu lực.'
      trang_pdf: 2
      sha256_pdf: f1dcc9989aec7ecca774092be695cab1b176f25f65f30a8151081258a1afe21b
ghi_chu: '5 nhóm ATTP. Đã bỏ quan_he.thay_the 11/2022 vì PDF Công báo số 328 không nhắc số hiệu đó (bài tổng hợp KTCN 2026 ghi sai). Bản datafiles ký số là ảnh; dùng Công báo CDN có lớp chữ. 5 nhóm (rượu, bia, nước giải khát, sữa chế biến, dầu thực vật, bột/tinh bột, bánh mứt kẹo). Công báo số 328 ngày 14/6/2026. Điều 4: QĐ 1182/QĐ-BCT hết hiệu lực từ 17/7/2026 (Hermes-211 đối chiếu). Điều 3.2: kiểm tra ATTP theo Điều 40 Luật ATTP và Điều 16 NĐ 15/2018/NĐ-CP; Điều 3.3: miễn kiểm tra khi thuộc Điều 13 NĐ 15/2018/NĐ-CP. Bài tổng hợp KTCN 2026 (nguồn thứ cấp, có trích nguyên văn điều luật) — xem hs-code-api data/ktcn-regime-2026.json. PDF ký số datafiles: 28 trang ảnh, không lớp chữ; bản Công báo số 328 (congbaocdn) có lớp chữ và đủ phụ lục — dùng bản này.'
