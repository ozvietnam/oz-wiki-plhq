  pham_vi: 'Đã kiểm chứng tên nguyên văn, cơ quan (Bộ Công Thương), ngày ban hành 28/12/2018, hiệu lực 15/02/2019, nội dung (mô hình 1/2 kiểm tra; mức phí 0,1-0,2% giá tính thuế XNK; trích 70% chi ngành; thu cùng cơ quan hải quan; KKT 18) theo Thư viện Pháp luật. Được sửa đổi bởi QĐ 499/2019/QĐ-BCT (17/6/2019, đã xác minh trang riêng) và QĐ 12/2025/QĐ-BCT ngày 01/02/2025 (theo bài TVPL trên trang tag). Chưa đối chiếu nhãn tình trạng chính thức trên trang chi tiết TVPL/vbpl.vn; chưa thấy văn bản thay thế toàn bộ.'
