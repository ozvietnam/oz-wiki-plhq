ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Khung thu phí kiểm tra chuyên ngành hàng XNK thuộc BCT (xăng dầu, hóa chất, vật liệu nổ công nghiệp...): áp với lô hàng XK/NK, thu 0,1-0,2% giá tính thuế, hải quan thu cùng tờ khai — chi phí trực tiếp khi thông quan.'
