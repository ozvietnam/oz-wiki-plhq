xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu trên Cổng Thông tin điện tử Bộ Công Thương (moit.gov.vn) và Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn): Theo Điều 4 Luật Ban hành VBQPPL 2015 (có hiệu lực từ 01-07-2016), Bộ trưởng Bộ Công Thương không ban hành văn bản QPPL dưới hình thức Quyết định có năm trong số hiệu (/2018/QĐ-BCT), và theo Điều 4, Điều 20 Luật Phí và lệ phí 2015, thẩm quyền quy định mức thu, nộp, quản lý và sử dụng phí kiểm tra chuyên ngành thuộc Bộ trưởng Bộ Tài chính (bằng Thông tư). Không tồn tại Quyết định số 326/2018/QĐ-BCT trên Công báo hay CSDL Quốc gia vbpl.vn; quyết định của Bộ Công Thương ban hành đúng ngày 28-12-2018 trên moit.gov.vn là Quyết định số 5113/QĐ-BCT phê duyệt danh mục thủ tục hành chính thuộc chức năng quản lý của Bộ Công Thương năm 2018 (và Quyết định số 3263/QĐ-BCT ngày 07-09-2018 phê duyệt lộ trình tiêu chuẩn, quy chuẩn kỹ thuật ngành Công Thương). Giữ bản ghi với so_hieu_khac để bắt truy vấn khách tra nhầm số hiệu 326/2018/QĐ-BCT và điều hướng đúng sang danh mục TTHC/kiểm tra chuyên ngành của Bộ Công Thương.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Bản ghi giữ để bắt truy vấn khách tra nhầm số hiệu 326/2018/QĐ-BCT (issue miss đợt 6/11): theo Luật Ban hành VBQPPL 2015 và Luật Phí và lệ phí 2015, Bộ Công Thương không ban hành Quyết định QPPL quy định biểu phí kiểm tra chuyên ngành; văn bản thực tế của BCT ký ngày 28-12-2018 trên moit.gov.vn là Quyết định 5113/QĐ-BCT phê duyệt danh mục TTHC thuộc chức năng quản lý của BCT.'
toan_van: chua_co
