  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh Thông tư này hướng dẫn khoản 3 Điều 37 của Luật thú y, cụ thể như sau:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Nơi cách ly kiểm dịch động vat là khu vực riêng biệt dé nuôi giữ động vật trong thời gian nhất định dé thực hiện việc kiểm dich. 2. Nơi cách ly hiểm dịch sản phẩm động vật là kho chứa hàng, phương tiện chứa đựng để bảo quản hàng hoá trong thời gian nhất định đề thực hiện việc kiểm dịch.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện miễn kiểm dịch; Danh mục đối tượng kiểm dịch động vật, sản phẩm động vật trên cạn; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam
      trang_pdf: 2
    - dieu: 7
      noi_dung: 'Điều 7. Kiểm soát động vật, sản phẩm động vật trên cạn xuất khẩu tại cửa khẩu xuất 1. Cơ quan kiểm dịch động vật cửa khẩu thực hiện: a) Kiểm tra Giấy chứng nhận kiểm dịch xuất khẩu; b) Kiểm tra triệu chứng lâm sàng đối với động vat; thực trạng hàng hóa, điều kiện bao gói, bảo quản đôi với sản phẩm động vật; ©) Xác nhận hoặc thực hiện cấp déi Giấy chứng nhận kiểm dịch xuất khẩu theo yêu câu của chủ hàng.'
      trang_pdf: 5
    - dieu: 10
      noi_dung: 'Điều 10. Kiểm dịch động vật, sản phẩm động vật nhập khẩu mang theo người 1. Chủ hàng đăng ký kiểm địch nhập khẩu trực tiếp tại cơ quan kiểm dịch động vật cửa khâu khi mang theo người động vật, sản phẩm động vật với số lượng, khôi lượng như sau: a) Động vật: Không quá 02 con với mục đích để nuôi làm cảnh, sinh hoạt trong gia đình hoặc mang theo đi du lịch, công tác, quá cảnh và không thuộc Danh mục động vật câm xuất khâu, nhập khẩu theo quy định;'
      trang_pdf: 7
    - dieu: 13
      noi_dung: Điều 13. Thông báo vi phạm Khi phát hiện lô hàng nhập khẩu vi phạm chỉ tiêu được kiểm tra, Cục Thú y thông báo bằng văn bản cho Cơ quan Thú y có thâm quyền nước xuất khẩu, yêu cầu điều tra nguyên nhân, có hành động khắc phục và gửi báo cáo cho Cục Thú y. Mục 4 KIEM DICH DONG VAT, SAN PHAM DONG VAT TREN CAN TAM NHAP TAI XUAT, TAM XUAT TAI NHẬP, CHUYỂN CUA KHẨU, KHO NGOẠI QUAN, QUÁ CANH LANH THO VIET NAM
      trang_pdf: 8
    - dieu: 15
      noi_dung: 'Điều 15. Kiểm dịch động vật, sản phẩm động vật nhập, xuất kho ngoại quan 1. Chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dich theo quy định tại khoản 1 Điều 48 Luật thú y tới Cục Thú y (Văn bản dé nghị hướng dẫn kiêm dịch theo Mẫu 18 Phụ lục V ban hành kèm theo Thông tư này). Hình thức gửi hd SƠ: Gửi qua đường bưu điện hoặc thư điện tử, fax sau đó gửi bản chính hoặc trực tiếp. 2. Cục Thú y thực hiện theo quy định tại khoản 2 Điều 14 Thông tư này.'
      trang_pdf: 9
    - dieu: 18
      noi_dung: Điều 18. Mẫu hd sơ kiểm dịch động vật, sản phẩm động vật 1. Mẫu hồ sơ đăng ký kiểm dich động vật, sản phẩm động vat theo quy định tại Phụ lục V ban hành kèm theo Thông tư này. 2. Mẫu hỗ sơ kiểm dịch động vật, sản phẩm động vật được sử dụng thống nhất trên phạm vi toàn quốc. 3. Các cơ quan kiểm địch động vật chịu trách nhiệm in ấn, sử dụng mẫu hỗ sơ kiểm dịch theo đúng quy định hiện hành.
      trang_pdf: 10
    - dieu: 21
      noi_dung: 'Điều 21. Đánh dấu gia súc vận chuyển ra khối địa bàn cấp tỉnh 1. Trâu, bò, đê, cừu, hươu, nai, ngựa, lừa, la khi vận chuyén ra khỏi địa bàn cấp tỉnh phải được đánh đấu bằng cách bam thẻ tai bằng nhựa cao su, thẻ tai được bấm ở mặt trong tai bên phải của gia súc. Thẻ tai được quy định như sau:'
      trang_pdf: 12
    - dieu: 25
      noi_dung: 'Điều 25. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày ⁄ 5 tháng 8 nam 2016. 2. Thông tư này thay thế các văn bản sau: a) Quyết định số 45/2005/QĐ-BNN BNN ngày 25/7/2005 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn Ban hành Danh mục đôi tượng kiểm dịch động vật, sản phẩm động vật, Danh mục động vật, sản phầm động vật thuộc điện phải kiêm dich;'
      trang_pdf: 16
ghi_chu: Quy định kiểm dịch động vật, sản phẩm động vật trên cạn.
