  pham_vi: số hiệu, trích yếu, ngày ban hành 30-06-2016, hiệu lực 15-08-2016 và tệp 25-bnnptnt.signed.pdf trên vanban.chinhphu.vn (docid=185870); hết hiệu lực một phần do được sửa đổi, bổ sung bởi TT 35/2018/TT-BNNPTNT, TT 09/2022/TT-BNNPTNT, TT 04/2024/TT-BNNPTNT
  hieu_luc_da_doi_chieu: true
