xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=218964) và toàn văn PDF có chữ ký số của Văn phòng Chính phủ trên datafiles.chinhphu.vn (293_2026_nd-cp_23072026_1-signed.signed.pdf, 386.678 byte, 24 trang, 5 chương, 37 điều): số ký hiệu 293/2026/NĐ-CP, ngày ban hành 23-07-2026, người ký Phó Thủ tướng Phạm Gia Túc, trích yếu nguyên văn "Hướng dẫn thực thi Công ước La Hay ngày 05 tháng 10 năm 1961 về miễn hợp pháp hóa đối với giấy tờ công của nước ngoài (Công ước Apostille)". Theo Chương V — Điều khoản thi hành (Điều 34–37): Nghị định có hiệu lực thi hành từ ngày 11-09-2026 (Điều 34); quy định áp dụng chứng nhận Apostille đối với giấy tờ công lưu thông giữa Việt Nam và Quốc gia thành viên Công ước có quan hệ áp dụng với Việt Nam, đồng thời tiếp tục áp dụng pháp luật về chứng nhận lãnh sự, hợp pháp hóa lãnh sự đối với quốc gia không phải thành viên Công ước hoặc giấy tờ ngoài phạm vi như giấy tờ hành chính liên quan trực tiếp đến hoạt động thương mại hoặc hải quan tại điểm b khoản 1 Điều 11 (Điều 35); quy định chuyển tiếp đối với hồ sơ và giấy tờ đã chứng nhận trước ngày 11-09-2026 và lộ trình vận hành Hệ thống thông tin Apostille (Điều 36). Không thay thế, sửa đổi hay bãi bỏ văn bản quy phạm pháp luật nào trong sổ; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Nghị định này quy định về: 1. Thẩm quyền, trình tự, thủ tục cấp chứng nhận Apostille đối với giấy tờ công của Việt Nam. 2. Việc tiếp nhận, sử dụng tại Việt Nam giấy tờ công đã được cấp chứng nhận Apostille của Quốc gia thành viên Công ước La Hay ngày 05 tháng 10 năm 1961 về miễn hợp pháp hóa đối với giấy tờ công của nước ngoài (sau đây gọi là Công ước Apostille).'
      trang_pdf: 1
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với: 1. Cơ quan, tổ chức, cá nhân đề nghị cấp chứng nhận Apostille.'
      trang_pdf: 1
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, những từ ngữ dưới đây được hiểu như sau: 1. “Quốc gia thành viên Công ước” là các bên đã tham gia Công ước Apostille thông qua ký, phê chuẩn hoặc gia nhập theo quy định của Công ước.'
      trang_pdf: 2
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 9
      noi_dung: Điều 9. Phí đối với việc cấp chứng nhận Apostille 1. Người đề nghị cấp chứng nhận Apostille phải nộp phí chứng nhận lãnh sự và hợp pháp hóa lãnh sự tại thời điểm nộp hồ sơ theo quy định của pháp luật về phí và lệ phí. 2. Trường hợp nộp hồ sơ và nhận kết quả qua dịch vụ bưu chính, người đề nghị cấp chứng nhận Apostille phải trả cước phí bưu chính.
      trang_pdf: 5
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 13
      noi_dung: 'Điều 13. Tiếp nhận hồ sơ đề nghị cấp chứng nhận Apostille Việc tiếp nhận hồ sơ đề nghị cấp chứng nhận Apostille được thực hiện theo quy định của pháp luật về thực hiện thủ tục hành chính theo cơ chế một cửa, một cửa liên thông và pháp luật về thực hiện thủ tục hành chính trên môi trường điện tử, theo trình tự sau đây: 1. Cơ quan tiếp nhận xác thực danh tính của người đề nghị thông qua tài khoản định danh điện tử.'
      trang_pdf: 7
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 18
      noi_dung: 'Điều 18. Giải quyết các trường hợp từ chối và lưu giữ giấy tờ 1. Cơ quan cấp Apostille từ chối cấp chứng nhận Apostille trong các trường hợp sau đây: a) Giấy tờ không thuộc phạm vi cấp chứng nhận Apostille theo quy định tại khoản 1 Điều 11 Nghị định này; b) Giấy tờ công không đủ điều kiện cấp chứng nhận Apostille theo quy định tại khoản 2 Điều 11 Nghị định này;'
      trang_pdf: 12
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 22
      noi_dung: Điều 22. Hồ sơ lưu trữ việc cấp chứng nhận Apostille 1. Thành phần hồ sơ giấy phát sinh trong quá trình cấp chứng nhận Apostille được thực hiện theo quy định của pháp luật về chứng nhận lãnh sự, hợp pháp hóa lãnh sự; chế độ bảo quản và thời hạn lưu trữ hồ sơ thực hiện theo quy định của pháp luật về lưu trữ. 2. Việc lưu trữ, bảo quản thông tin về chứng nhận Apostille điện tử được thực hiện theo quy định tại Điều 21 Nghị định này.
      trang_pdf: 16
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 27
      noi_dung: Điều 27. Sử dụng giấy tờ công của Quốc gia thành viên Công ước tại Việt Nam 1. Giấy tờ công đã được cấp chứng nhận Apostille không được lập bằng tiếng Việt phải được dịch ra tiếng Việt; bản dịch phải được công chứng hoặc chứng thực theo quy định của pháp luật Việt Nam, trừ trường hợp pháp luật chuyên ngành có quy định khác.
      trang_pdf: 18
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 31
      noi_dung: 'Điều 31. Trách nhiệm của các bộ, ngành, Ủy ban nhân dân cấp tỉnh Các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm: 1. Phối hợp với Bộ Ngoại giao trong việc tổ chức thực hiện Nghị định này; 2. Chỉ đạo cơ quan, tổ chức trực thuộc tiếp nhận giấy tờ công của Quốc gia thành viên Công ước đã được cấp chứng nhận Apostille theo đúng quy định tại Nghị định này;'
      trang_pdf: 21
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
    - dieu: 37
      noi_dung: Điều 37. Tổ chức thực hiện 1. Kể từ ngày Công ước Apostille có hiệu lực đối với nước Cộng hòa xã hội chủ nghĩa Việt Nam, cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự của Việt Nam ở nước ngoài không thực hiện hợp pháp hóa lãnh sự đối với giấy tờ công của Quốc gia thành viên Công ước có quan hệ áp dụng với Việt Nam thuộc trường hợp được miễn hợp pháp hóa lãnh sự theo quy định của Công ước Apostille.
      trang_pdf: 23
      sha256_pdf: e6019264c46492587b0f1b3481f9547196421d49e2e3a87473fbf50f4fb65616
