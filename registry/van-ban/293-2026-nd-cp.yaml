ghi_chu: 'Trinh sát WebSearch trạm BYT đêm 1/11. Tác động XNK: hồ sơ nước ngoài cho TBYT/mỹ phẩm không cần hợp thức hóa lãnh sự nữa — giảm bước thủ tục. Ưu tiên đối chiếu lên NGUON_A.'
