xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=218964) và toàn văn PDF có chữ ký số của Văn phòng Chính phủ trên datafiles.chinhphu.vn (293_2026_nd-cp_23072026_1-signed.signed.pdf, 386.678 byte, 24 trang, 5 chương, 37 điều): số ký hiệu 293/2026/NĐ-CP, ngày ban hành 23-07-2026, người ký Phó Thủ tướng Phạm Gia Túc, trích yếu nguyên văn "Hướng dẫn thực thi Công ước La Hay ngày 05 tháng 10 năm 1961 về miễn hợp pháp hóa đối với giấy tờ công của nước ngoài (Công ước Apostille)". Theo Chương V — Điều khoản thi hành (Điều 34–37): Nghị định có hiệu lực thi hành từ ngày 11-09-2026 (Điều 34); quy định áp dụng chứng nhận Apostille đối với giấy tờ công lưu thông giữa Việt Nam và Quốc gia thành viên Công ước có quan hệ áp dụng với Việt Nam, đồng thời tiếp tục áp dụng pháp luật về chứng nhận lãnh sự, hợp pháp hóa lãnh sự đối với quốc gia không phải thành viên Công ước hoặc giấy tờ ngoài phạm vi như giấy tờ hành chính liên quan trực tiếp đến hoạt động thương mại hoặc hải quan tại điểm b khoản 1 Điều 11 (Điều 35); quy định chuyển tiếp đối với hồ sơ và giấy tờ đã chứng nhận trước ngày 11-09-2026 và lộ trình vận hành Hệ thống thông tin Apostille (Điều 36). Không thay thế, sửa đổi hay bãi bỏ văn bản quy phạm pháp luật nào trong sổ; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
