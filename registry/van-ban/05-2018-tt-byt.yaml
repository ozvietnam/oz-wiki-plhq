ghi_chu: |
  Hết hiệu lực từ ngày 02/02/2022 theo khoản 2 Điều 4 Thông tư 28/2021/TT-BYT ngày 20/12/2021 của Bộ trưởng Bộ Y tế ban hành Danh mục thực phẩm, phụ gia thực phẩm và dụng cụ, vật liệu bao gói, chứa đựng thực phẩm đã được xác định mã số hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam phục vụ cho kiểm tra nhà nước về an toàn thực phẩm đối với thực phẩm nhập khẩu (nguồn A: https://vanban.chinhphu.vn/default.aspx?docid=204776&pageid=27160, https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/28-byt.signed.pdf). Khi có hiệu lực từ ngày 21/05/2018, Thông tư 05/2018/TT-BYT thay thế Thông tư 40/2016/TT-BYT ngày 04/11/2016 (chưa nạp vào sổ).
