xac_minh:
  muc: NGUON_A
  pham_vi: 'toàn văn vbpl.vn ItemID=169844 (bậc A) + VCCI (bậc B đối chiếu): Điều 1 (Phạm vi điều chỉnh): ban hành 14 DM + nguyên tắc áp dụng; loại trừ tá dược, vỏ nang, hàng không phải nguyên liệu làm thuốc dùng cho người. Điều 2 (Ban hành DM): 14 DM (DM1-5 thuốc KSĐB/thuốc độc/nguyên liệu gây nghiện/hướng thần/tiền chất/chất cấm; DM6 chất phóng xạ; DM7-9 thuốc TP/dược chất/thuốc phối hợp; DM10 vắc xin; DM11 dược liệu; DM12 chất chiết xuất + tinh dầu; DM13 thuốc cổ truyền + thuốc dược liệu; DM14 mỹ phẩm). Điều 3 (Nguyên tắc áp dụng): k1 khác biệt phân loại theo PL HQVN; k2 hàng chưa có trong DM theo PL HQVN + DN gửi VB BYT (Cục QLD hoặc Cục QLYDCT) sau thông quan để cập nhật DM; k3 cùng mặt hàng nhiều mục đích theo PL tương ứng. Điều 4 (Hiệu lực): 26/07/2024; bãi bỏ TT 06/2018, 48/2018, 03/2021. Điều 5 (Trách nhiệm): Cục QLD (DM1-10,14) / Cục QLYDCT (DM11-13) tiếp nhận hồ sơ + giải quyết vướng mắc. Phụ lục: 14 DM, 3.335 dòng. Cấu trúc cột từng DM: DM1-4 (STT|Mô tả|Mã HS|Tên nguyên liệu|Dạng dùng), DM5 (STT|Mô tả|Mã HS|Tên dược chất|Dạng dùng), DM6 (STT|Tên thuốc phóng xạ|Mã HS), DM7 (STT|Tên nguyên liệu/Dạng dùng|Mã HS), DM8 (STT|Mô tả|Mã HS|Tên dược chất|Dạng dùng), DM9 (STT|Mô tả|Mã HS|Tên thành phần hoạt chất|Dạng dùng), DM10 (STT|Tên vắc xin|Công dụng|Mã HS), DM11 (STT|Tên VN|Bộ phận dùng|Tên KH|Mô tả|Mã HS), DM12 (STT|Tên|Tên KH|Mã HS), DM13 (STT|Tên thuốc|Thành phần|Dạng bào chế|Mã HS), DM14 (STT|Mô tả|Mã HS). Phát hiện: (a) Ngải cứu thường gọi = Thanh cao theo Dược điển VN, mã 12119017/12119018 trong DM11; (b) DM9 có 1 dòng Menthol + Methyl salicylate + Camphor + Thymol ở mã 3005.10.10 (chỉ dược chất tổng hợp, KHÔNG có dược liệu tự nhiên); (c) DM13 chỉ có dạng viên/siro, KHÔNG có cao dán.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-09'
  boi: cursor-agent@ozvietnam
ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (376 mã HS). Toàn văn HTML vbpl.vn ItemID=169844 + bản chữ từ VCCI (bậc B) dùng để đối chiếu điều khoản. CSV trích chỉ 2 cột (ma_hs + mo_ta) từ 14 DM — MẤT thông tin: cột Tên VN/Bộ phận dùng/Tên KH (DM11), Tên thành phần hoạt chất/Dạng dùng (DM9), Tên dược chất/Dạng dùng (DM1-5,8), Công dụng (DM10), Dạng bào chế (DM13), Tên thuốc phóng xạ (DM6), Tên nguyên liệu/Dạng dùng (DM7). Cần trích lại CSV với đầy đủ cột để tra cứu chính xác tên Dược điển VN (Ngải cứu = Thanh cao) và bộ phận dùng. Cấu trúc cột từng DM đã ghi trong xac_minh.pham_vi. Phân công: Cục QLD (DM1-10, 14) / Cục QLYDCT (DM11-13). 14 danh mục: DM1=219 dòng thuốc độc, DM2=43 gây nghiện, DM3=70 hướng thần, DM4=8 tiền chất, DM5=124 chất cấm, DM6=1 phóng xạ, DM7=620 dược chất+bán TP, DM8=1280 thuốc 1 TP, DM9=412 thuốc phối hợp, DM10=56 vắc xin, DM11=365 dược liệu, DM12=25 chất chiết+tinh dầu, DM13=90 thuốc cổ truyền, DM14=21 mỹ phẩm.'
