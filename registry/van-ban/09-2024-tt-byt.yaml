ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 376 mã HS). Tiêu đề đã đối chiếu (chinhphu.vn + thoibaotaichinhvietnam.vn). GHI CHÚ NGHIỆP VỤ (hs-code-api): [DM7] Danh mục 7 — nguyên liệu làm thuốc là dược chất và bán thành phẩm · [DM8] Danh mục 8 — thuốc chỉ chứa 01 thành phần dược chất · [DM1] Danh mục 1 — thuốc độc, nguyên liệu độc làm thuốc XK/NK đã xác định mã HS · [DM11] Danh mục 11 — dược liệu làm thuốc · [DM14] Danh mục 14 — mỹ phẩm XK/NK đã xác định mã HS · [DM6] Danh mục 6 — nguyên liệu làm thuốc là chất phóng xạ sử dụng trong ngành y tế · [DM3] Danh mục 3 — nguyên liệu làm thuốc là dược chất hướng thần · [DM5] Danh mục 5 — thuốc, dược chất thuộc Danh mục chất cấm sử dụng trong một số ngành, lĩnh vực · [DM2] Danh mục 2 — nguyên liệu làm thuốc là dược chất gây nghiện · [DM9] Danh mục 9 — thuốc dạng phối hợp · [DM12] Danh mục 12 — các chất chiết xuất từ dược liệu, tinh dầu làm thuốc · [DM4] Danh mục 4 — nguyên liệu làm thuốc là tiền chất dùng làm thuốc · [DM10] Danh mục 10 — vắc xin'
