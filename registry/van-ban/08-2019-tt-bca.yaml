ghi_chu: |
  Hết hiệu lực từ ngày 01/02/2024; bị bãi bỏ toàn bộ theo khoản 17 Điều 1 Thông tư 60/2023/TT-BCA ngày 10/11/2023 của Bộ trưởng Bộ Công an bãi bỏ một số văn bản quy phạm pháp luật do Bộ trưởng Bộ Công an ban hành hoặc liên tịch ban hành (nguồn A: https://vbpl.vn/tw/Pages/vbpq-toanvan.aspx?ItemID=174944). Danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý của Bộ Công an được ban hành thay thế tại Quyết định 6266/QĐ-BCA ngày 13/09/2023 (đã có trong sổ). Khi có hiệu lực từ ngày 10/05/2019, Thông tư 08/2019/TT-BCA thay thế Thông tư 14/2012/TT-BCA ngày 20/03/2012 (chưa nạp vào sổ).
