xac_minh:
  muc: NGUON_B
  pham_vi: 'Xác minh trực tiếp trên trang trạng thái chính thức của UNCITRAL: Việt Nam gia nhập (accession) ngày 18/12/2015, Công ước có hiệu lực với Việt Nam từ 01/01/2017, VN là quốc gia thành viên thứ 84; VN có tuyên bố theo Điều 12 và Điều 96 (yêu cầu hình thức văn bản cho hợp đồng); tổng 97 quốc gia thành viên tính đến ngày truy cập. Thông cáo báo chí Liên hợp quốc (UNIS/L/226, 29/12/2015) xác nhận cùng thông tin. Công ước được thông qua tại Viên ngày 11/04/1980 (hiển thị trên nguồn UNCITRAL); ngày Công ước có hiệu lực chung 01/01/1988 là kiến thức chung — chưa trích trực tiếp từ trang đã tải, cần đối chiếu lại nếu dùng làm căn cứ.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: khung pháp lý chung cho hợp đồng mua bán hàng hoá quốc tế giữa doanh nghiệp VN và đối tác tại quốc gia thành viên khác (Trung Quốc, Singapore, EU...) — áp dụng tự động trừ khi các bên thỏa thuận loại trừ; lưu ý VN tuyên bố giữ yêu cầu hợp đồng bằng văn bản theo Điều 12, 96. Ghi chú nhu cầu có nhắc "nghị định 83/2019/NĐ-CP" như nghị định thi hành — đã kiểm tra và KHÔNG xác nhận được mối liên quan: NĐ 83/2019/NĐ-CP (12/11/2019) là văn bản sửa đổi NĐ 94/2014/NĐ-CP về Quỹ phòng, chống thiên tai (nguồn thứ cấp), nên không ghi quan hệ vào entry này.'
