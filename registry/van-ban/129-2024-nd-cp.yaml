    - dieu: 1
      noi_dung: 'Điều 1. Sửa đỗi, bố sung một số Điều của Nghị định số 91/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ quy định về quán lý hóa chất, chế phẩm diệt côn trùng, diệt khuẩn dùng trong lĩnh vực gia dụng và y tế 1. Sửa đối, bd sung Điều 8 như sau: “Điều 8. Công bố đủ điều kiện sản xuất chế phẩm 1. Trước khi thực hiện sản xuất chế phẩm, người đại diện theo pháp luật của cơ sở sản xuất gửi hồ sơ công bố bao gồm các giấy tờ theo quy định tại Điều 7'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đối, bé sung một số Điều của Nghị định số 155/2018/NĐ-CP ngày 12 tháng 11 năm 2018 của Chính phủ sửa đi, bé sung một số quy định ˆ liên quan đến điều kiện đầu tư kinh doanh thuộc phạm vi quản lý nhà nước - của Bộ Y tế 1. Sửa đổi khoản 5 Điều 9 như sau: “2. Được công nhận phù hợp ISO/IEC 17025.” 2. Sửa đổi khoản 6 Điều 9 như sau: “6. Điều 12 Nghị định số 91/2016/NĐ-CP được sửa đổi như sau:'
      trang_pdf: 8
    - dieu: 3
      noi_dung: 'Điều 3. Bãi bỏ, thay thế một số quy định của Nghị định số 91/2016/NĐ- CP và Nghị định số 155/2018/NĐ-CP 1. Bãi bỏ, thay thế một số quy định của Nghị định số 91/2016/NĐ-CP như sau: a) Bãi bỏ: Khoản 1 Điều 14; Khoản 8 Điều 38; Mẫu số 01, Mẫu số 02, Mẫu . số 03 và Mẫu số 08 Phụ lục II. b) Thay thế: Phụ lục VII bằng Phụ lục VIII Nghị định này. 2. Bãi bỏ, thay thế một số quy định của Nghị định số 155/2018/NĐ-CP như sau:'
      trang_pdf: 10
    - dieu: 4
      noi_dung: Điều 4. Điều khoản chuyển tiếp 1. Các cơ sở sản xuất, mua bán, xuất khẩu, nhập khẩu, kiểm nghiệm, khảo nghiệm chế phẩm diệt côn trùng, diét khuẩn dùng trong lĩnh vực gia dụng và y tế đã gửi hồ sơ tại Bộ Y tế trước ngày Nghị định này có hiệu lực thi hành được tiếp tục thực hiện theo quy định tại Nghị định số 91/2016/NĐ-CP và Nghị định số 155/2018/NĐ-CP, trừ trường hợp cơ sở tự nguyện hoàn thiện hé sơ theo quy định tại Nghị định này.
      trang_pdf: 10
    - dieu: 5
      noi_dung: Điều 5. Điều khoản thi hành Nghị định nay có hiệu lực thi hành từ ngày 30 tháng 11 năm 2024.
      trang_pdf: 11
    - dieu: 6
      noi_dung: Điều 6. Trách nhiệm thi hành | 1. Bộ trưởng Bộ Y tế có trách nhiệm tổ chức triển khai thực hiện Nghị định này. 2. Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương và các cơ quan, tô chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này./.
      trang_pdf: 11
