xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF Công báo số 133+134 ngày 11-02-2017 (congbaocdn.chinhphu.vn, 2 trang, người ký Thứ trưởng Đỗ Hoàng Anh Tuấn): Điều 1 sửa đổi, bổ sung khoản 1 Điều 34a Thông tư 156/2013/TT-BTC về không tính tiền chậm nộp đối với người nộp thuế cung ứng hàng hóa, dịch vụ được thanh toán bằng nguồn vốn NSNN chưa được thanh toán kèm Mẫu số 01/TCN; Điều 2 quy định hiệu lực thi hành sau 45 ngày kể từ ngày ký (06-03-2017). Đối chiếu CSDLQG vbpl.vn (ID 118868): hết hiệu lực toàn bộ từ ngày 01-01-2022 khi Thông tư 80/2021/TT-BTC ngày 29-09-2021 hướng dẫn Luật Quản lý thuế số 38/2019/QH14 có hiệu lực thay thế Thông tư 156/2013/TT-BTC và các văn bản sửa đổi, bổ sung.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #394). Sửa đổi quy định không tính tiền chậm nộp thuế tại khoản 1 Điều 34a Thông tư 156/2013/TT-BTC (đã bổ sung tại Thông tư 26/2015/TT-BTC). Hết hiệu lực từ 01-01-2022 theo Thông tư 80/2021/TT-BTC.'
