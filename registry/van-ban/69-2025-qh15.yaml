  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hóa chất, quản lý hoạt động hóa chất; phát triển ngành công nghiệp hóa chất; thông tin hóa chất, hóa chất nguy hiểm trong sản phẩm, hàng hóa; an toàn, an ninh trong hoạt động hóa chất.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Hóa chất là chất, hỗn hợp chất tự nhiên hoặc được con người khai thác, tạo ra. _ 2. Chất là đơn chất, hợp chất bao gồm cả tạp chất sinh ra trong quá trình chế biến; những phụ gia cần thiết để bảo đảm đặc tính lý, hóa én định; không bao gồm dung môi mà khi tách ra thì tính chất của chất đó không thay đổi.'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Các hành vi bị nghiêm cấm 1. Chiếm đoạt hóa chất; sản xuất, kinh doanh, vận chuyển, tồn trữ, sử dụng, mua, bán, trao đôi, tặng cho, gửi, mượn, cho mượn, thuê, cho thuê, câm cỗ hóa chất trái pháp luật. 2. Chiém doat, mua, ban, trao đôi, tặng cho, mượn, cho mượn, thuê, cho thuê, cam có, làm giả, sửa chữa, tây xóa giấy phép, giấy chứng nhận, chứng chỉ về hóa chất.
      trang_pdf: 3
    - dieu: 10
      noi_dung: 'Điều 10. Sản xuất hóa chất 1. Tổ chức sản xuất hóa chất phải đáp ứng các điều kiện sau đây: a) Được thành lập theo quy định của pháp luật; b) Có day đủ tài liệu pháp lý, tài liệu an toàn, cơ sở vật chất - kỹ thuật, năng lực chuyên môn đáp ứng yêu câu dé thực hiện hoạt động sản xuât hóa chat; c) Đáp ứng quy định tại Điều 33 và Điều 35 của Luật này;'
      trang_pdf: 8
    - dieu: 16
      noi_dung: Điều 16. Xử lý chất thải từ hoạt động hóa chất 1. Tổ chức, cá nhân thực hiện hoạt động hóa chất phải xử lý chất thai, bao bì, thiết bị chứa hóa chất thải bỏ từ hoạt động hóa chất và các vật dụng khác có liên quan đến quá trình sử đụng có chứa yêu tô độc hại, dễ cháy, dễ nỗ, gây ăn mon, gây nhiễm độc hoặc có đặc tính nguy hại dé gây 6 nhiễm môi trường và các đặc tính nguy hại khác theo quy định của Luật này, quy định của pháp luật về bảo vệ môi
      trang_pdf: 14
    - dieu: 22
      noi_dung: Điều 22. Quản lý hóa chất mới 1. Hóa chất mới sau khi được đăng ký tại cơ quan nhà nước có thâm quyền được phân loại và quản lý như hóa chất cần kiểm soát đặc biệt. 2. Trong thời hạn 05 năm kể từ ngày hóa chất mới được đăng ký, hằng năm, tô chức, cá nhân có hoạt động hóa chất liên quan đến hóa chất mới phải cập nhật thông tin, dir liệu vào Cơ sở dữ liệu chuyên ngành hóa chất về quá trình hoạt động với hóa chất mới.
      trang_pdf: 17
    - dieu: 28
      noi_dung: 'Điều 28. Nghĩa vụ cung cấp thông tin 1. Tổ chức, cá nhân hoạt động hóa chất có nghĩa vụ cung cấp đầy đủ, kịp thời, chính xác thông tin theo yêu câu của cơ quan có thầm quyền trong các trường hợp sau đây: a) Sự có hóa chất xảy ra trong hoạt động hóa chat; b) Phục vụ yêu cầu phòng ngừa thảm họa tự nhiên có khả năng gây ra sự cố hóa chất trong hoạt động hóa chất;'
      trang_pdf: 19
    - dieu: 35
      noi_dung: Điều 35. Khoảng cách an toàn 1. Khoảng cách an toàn là khoảng cách cần bảo đảm từ một công trình hóa chất đến khu dân cư, công trình công cộng, công trình quốc phòng, khu quân Sự, công trình an ninh, di tích lịch SỬ - văn hóa, danh lam thắng cảnh, khu bảo tồn thiên nhiên, khu vực khai thác nguồn nước sinh hoạt nhằm hạn chế tối đa tác động tiêu cực đến con người, cơ sở vật chất, tài sản, môi trường trong điều kiện hoạt động bình thường.
      trang_pdf: 23
    - dieu: 41
      noi_dung: 'Điều 41. Phối hợp phòng ngừa, ứng phó sự cỗ hóa chất 1. Sự cố hóa chất được phân cấp như sau: a) Sự cố hóa chất cấp cơ sở là sự có hóa chất xảy ra trong phạm vi địa giới của cơ sở hóa chất và khi diễn biến, mức độ thiệt hại của sự cố năm trong khả năng, điều kiện ứng phó, khắc phục hậu quả của lực lượng ứng phó tại cơ sở hóa chất;'
      trang_pdf: 25
    - dieu: 48
      noi_dung: Điều 48. Quy định chuyển tiếp 1. Báo cáo nghiên cứu khả thi đầu tư xây dựng, báo cáo kinh tế - kỹ thuật đầu tư xây dựng dự án hóa chất đã được trình cơ quan có thẩm quyền thấm định nhưng đến ngày Luật này có hiệu lực thi hành chưa có văn bản thâm định thì việc thẩm định tiếp tục thực hiện theo quy định của pháp luật về xây dựng.
      trang_pdf: 28
ghi_chu: Thay thế Luật Hóa chất 06/2007/QH12; nghị định hướng dẫn thi hành (thay NĐ 26/2026/NĐ-CP) đang soạn thảo — theo dõi khi ban hành.
