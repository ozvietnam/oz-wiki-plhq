  pham_vi: 'thẻ vanban.chinhphu.vn (docid=214610) và quan hệ trong sổ: Luật Hóa chất 69/2025/QH15 ban hành 14-06-2025, có hiệu lực từ 01-01-2026, thay thế Luật Hóa chất 06/2007/QH12; đối chiếu đang còn hiệu lực, được hướng dẫn bởi NĐ 26/2026/NĐ-CP và TT 01/2026/TT-BCT'
