xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu trên Công báo nước CHXHCN Việt Nam (congbao.chinhphu.vn, Công báo số 293+294 năm 2021, mã văn bản 32849) và CSDL Quốc gia về VBPL (vbpl.vn ID 153308): Thông tư số 15/2020/TT-BNNPTNT do Thứ trưởng Lê Quốc Doanh ký ban hành ngày 25-12-2020, có hiệu lực thi hành sau 06 tháng kể từ ngày ký (từ ngày 25-06-2021 theo Điều 2), ban hành kèm theo Quy chuẩn kỹ thuật quốc gia QCVN 01-192:2020/BNNPTNT về yêu cầu đối với vật thể thuộc diện kiểm dịch thực vật nhập khẩu (đính chính bản ghi cũ ghi nhầm mã quy chuẩn là QCVN 01-01:2020/BNNPTNT). Văn bản hiện đang còn hiệu lực thi hành.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: >-
  Ban hành kèm theo QCVN 01-192:2020/BNNPTNT về yêu cầu đối với vật thể thuộc diện kiểm dịch thực vật nhập khẩu (hiệu lực từ 25-06-2021).
  Issue #237 mô tả TT 15/2020 là "trình tự thủ tục + danh mục" — KHÔNG ĐÚNG: TT 15/2020 là thông tư
  QCVN kỹ thuật nhập khẩu. Trình tự thủ tục nằm ở chuỗi TT 33/2014 (sửa 34/2018, 15/2021; 03/2024 bãi một phần 34/2018) — VBHN 19/2024;
  danh mục vật thể + PRA ở TT 30/2014 → TT 14/2024. Nạp để khách tra tên này không trượt, kèm điều chỉnh hiểu nhầm.
toan_van: chua_co
