ghi_chu: >-
  Issue #237 mô tả TT 15/2020 là "trình tự thủ tục + danh mục" — KHÔNG ĐÚNG: TT 15/2020 là thông tư
  QCVN kỹ thuật nhập khẩu. Trình tự thủ tục nằm ở chuỗi TT 33/2014 (sửa 20/2021, 11/2022) — VBHN 19/2024;
