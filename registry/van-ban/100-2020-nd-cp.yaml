  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về chính sách quản lý đối với hoạt động kinh doanh hàng miễn thuế; thủ tục hải quan, giám sát hải quan đối với hoạt động kinh doanh hàng miễn thuế.
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Người xuất cảnh, quá cảnh, nhập cảnh. 2. Đối tượng được hưởng quyền ưu đãi, miễn trừ tại Việt Nam. 3. Thuyền viên làm việc trên tàu biển chạy tuyến quốc tế. 4. Hành khách trên các chuyến bay quốc tế đi và đến Việt Nam. 5. Doanh nghiệp đủ điều kiện kinh doanh hàng miễn thuế theo quy định của pháp luật. 6. Cơ quan hải quan, công chức hải quan.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Đối tượng và điều kiện mua hàng miễn thuế 1. Người xuất cảnh, quá cảnh sau khi hoàn thành thủ tục xuất cảnh, quá cảnh, hành khách trên các chuyến bay quốc tế xuất cảnh. từ Việt Nam hoặc người chờ xuất cảnh được mua hàng miễn thuế.
      trang_pdf: 2
    - dieu: 7
      noi_dung: Điều 7. Đồng tiền dùng trong giao dịch bán hàng miễn thuế 1. Đồng Việt Nam. | 2. Đồng ngoại tệ đô la Mỹ (USD), euro (EUR). 3. Dong tiên của nước có chung biên giới dat liên với dia diém đặt cửa hàng miền thuê tại khu vực biên giới. 4. Đông tiên của quôc gia nơi các chuyên bay quốc tê của các hãng hàng không được thành lập và hoạt động theo pháp luật Việt Nam thực hiện nhập cảnh, quá cảnh tại quốc gia đó.
      trang_pdf: 6
    - dieu: 11
      noi_dung: Điều 11. Thủ tục hải quan, giám sát hải quan đối với hàng hóa vận A om L2 chuyền giữa kho chứa hàng miễn thuế với tàu bay dé bán hàng miễn thuế trên các chuyến bay quốc tế đi và đến Việt Nam 1. Trách nhiệm của doanh nghiệp kinh doanh hàng miễn thuế
      trang_pdf: 10
    - dieu: 14
      noi_dung: Điều 14. Thủ tục bán hàng miễn thuế cho đối tượng mua là người nhập cảnh tại cửa khẩu sân bay quốc tế 1. Trách nhiệm của nhân viên bán hàng a) Thực hiện đầy đủ các công việc quy định tại khoản 1 Điều 13 Nghị định này;
      trang_pdf: 16
    - dieu: 17
      noi_dung: Điều 17. Thu tuc ban hàng miễn thuế cho tổ chức, cá nhân được hưởng quyền ưu đãi miễn trừ mua hàng tại cửa hàng miễn thuế trong nội địa 1. Trách nhiệm của nhân viên bán hàng a) Yêu cầu khách hàng xuất trình Số định mức miễn thuế, trừ trường hợp Số định mức miễn thuế đã được cơ quan có thâm quyền cấp cập nhật thông tin vào công thông tin một cửa quốc gia;
      trang_pdf: 20
    - dieu: 20
      noi_dung: 'Điều 20. Tha tục hải quan đối với hàng hóa đã bán cho khách xuất cảnh nhưng giao ở nước ngoài theo yêu cầu của khách 1. Địa điểm làm thủ tục hải quan: Chi cục Hải quan quản lý cửa hàng miễn thuế, kho hàng miễn thuế sau khi khách mua hàng đã thực xuất cảnh.'
      trang_pdf: 23
    - dieu: 24
      noi_dung: Điều 24. Báo cáo quyết toán đối với hàng hóa đưa vào để bán tại cửa hàng miễn thuế 1. Thời hạn nộp báo cáo quyết toán đôi với hàng hóa đưa vào dé bán tại cửa hàng miền thuê a) Định kỳ hàng năm, chậm nhất là ngày. thứ 90 kể từ ngày kết thúc năm. tài chính, doanh nghiệp kinh doanh hàng miễn thuế nộp báo cáo quyết toán tình hình bán hàng miễn thuế trong năm tài chính cho cơ quan hải quan;
      trang_pdf: 26
    - dieu: 28
      noi_dung: Điều 28. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 15 tháng 10 năm 2020. 2. Nghị định này bãi bỏ Nghị định số 167/2016/NĐ-CP ngày 27 tháng 12 năm 2016 của Chính phủ về kinh doanh hàng miễn thuế.
      trang_pdf: 31
