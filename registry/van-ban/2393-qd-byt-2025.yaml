  pham_vi: 'đối chiếu toàn văn PDF chính thức 26 trang có lớp chữ của Bộ Y tế (tải từ Cổng VBQPPL tỉnh Điện Biên hscv.dienbien.gov.vn, văn bản đóng dấu số 2393/QĐ-BYT ngày 22-07-2025 của Thứ trưởng Đỗ Xuân Tuyên, khớp mã quyết định 109006 trên CSDLQG về TTHC vpcp.dichvucong.gov.vn) cùng Thông tư 34/2025/TT-BYT (docid=214428) và Thông tư 06/2011/TT-BYT (docid=99376): Điều 1 công bố 03 thủ tục hành chính được sửa đổi, bổ sung quy định tại TT 34/2025/TT-BYT; Điều 2 hiệu lực từ 18-08-2025, bãi bỏ phần TTHC tương ứng tại QĐ 7866/QĐ-BYT (28-12-2018), QĐ 1907/QĐ-BYT (19-04-2021) và bãi bỏ QĐ 3629/QĐ-BYT (30-07-2021); đang còn hiệu lực (lưu ý bản PDF gốc có lỗi đánh máy ghi nhầm ngày của TT 06/2011 thành "25 tháng 01 năm 2025" ở trích yếu trang 1 nhưng Điều 1 ghi đúng 25-01-2011).'
