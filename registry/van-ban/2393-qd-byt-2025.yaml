  pham_vi: 'đối chiếu thông tin ký ban hành của Thứ trưởng Bộ Y tế Đỗ Xuân Tuyên ngày 22-07-2025 (có hiệu lực từ 18-08-2025 cùng thời điểm hiệu lực của Thông tư 34/2025/TT-BYT) và toàn văn Thông tư 34/2025/TT-BYT ngày 03-07-2025 trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=214428, 34-byt.pdf) cùng CSDL Quốc gia về VBPL (vbpl.vn ItemID=181191): công bố thủ tục hành chính được sửa đổi, bổ sung trong lĩnh vực quản lý mỹ phẩm quy định tại Thông tư 34/2025/TT-BYT (sửa đổi Thông tư 06/2011/TT-BYT docid=99376) và sửa đổi, bãi bỏ phần nội dung TTHC tương ứng tại Quyết định 7866/QĐ-BYT ngày 28-12-2018; đính chính trích yếu nguyên văn (không phải văn bản danh mục hàng hóa kèm mã HS); đang còn hiệu lực'
