quan_he:
  sua_doi:
    - so_hieu: 1578/QĐ-BCT
      tu_ngay: '2022-12-30'
      pham_vi: 'Sửa đổi, bổ sung một số nội dung của Quyết định 1578/QĐ-BCT ngày 15-06-2021 về áp dụng thuế CBPG và thuế CTC chính thức đối với sản phẩm đường mía từ Thái Lan'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn PDF Quyết định số 1309/QĐ-BCT ngày 02-06-2026 trên Cổng Bộ Công Thương (moit.gov.vn: QD_ket_qua_ra_soat_ER01_AD13-AS01_d2370.pdf): tại phần Căn cứ và khoản 2 Điều 3 Quyết định 1309/QĐ-BCT dẫn nguyên văn Quyết định số 2961/QĐ-BCT ngày 30-12-2022 của Bộ trưởng Bộ Công Thương về việc sửa đổi, bổ sung Quyết định số 1578/QĐ-BCT ngày 15-06-2021 về việc áp dụng thuế chống bán phá giá và thuế chống trợ cấp chính thức đối với một số sản phẩm đường mía có xuất xứ từ Vương quốc Thái Lan. Theo Điều 2 và khoản 2 Điều 3 Quyết định 1309/QĐ-BCT, Quyết định 2961/QĐ-BCT hết hiệu lực thi hành kể từ ngày 16-06-2026.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Sửa đổi, bổ sung Quyết định 1578/QĐ-BCT trong chuỗi vụ việc AD13-AS01 (đường mía Thái Lan); đã hết hiệu lực từ ngày 16-06-2026 theo khoản 2 Điều 3 Quyết định 1309/QĐ-BCT ngày 02-06-2026 về kết quả rà soát cuối kỳ (ER01.AD13-AS01).'
toan_van: chua_co
