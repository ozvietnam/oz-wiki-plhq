  pham_vi: "Đối chiếu thẻ vanban.chinhphu.vn (docid=172101), toàn văn PDF đính kèm (tt-221.pdf, Thứ trưởng Trần Văn Hiếu ký) và CSDL quốc gia vbpl.vn (ItemID=37724): ban hành 31-12-2013, có hiệu lực từ 14-02-2014 theo khoản 1 Điều 8; hướng dẫn việc trích lập, quản lý quỹ tiền lương, thù lao, tiền thưởng đối với Kiểm soát viên và người đại diện vốn Nhà nước theo Nghị định 51/2013/NĐ-CP (đính chính trích yếu bị ghi nhầm từ nguồn thứ cấp). Hết hiệu lực toàn bộ từ 20-10-2017 khi bị Thông tư 97/2017/TT-BTC ngày 05-09-2017 (ItemID=125399, chưa nạp vào sổ) thay thế."
