ghi_chu: "Trên nguồn A (vanban.chinhphu.vn docid=172101, vbpl.vn ItemID=37724), số hiệu 221/2013/TT-BTC ngày 31-12-2013 là Thông tư hướng dẫn quỹ tiền lương, thù lao, tiền thưởng đối với Kiểm soát viên và người đại diện vốn Nhà nước theo NĐ 51/2013/NĐ-CP (hết hiệu lực từ 20-10-2017 bởi TT 97/2017/TT-BTC). Ca #227 dẫn chiếu nhầm số hiệu này cho hướng dẫn thuế TNDN."
