xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Cổng TTĐT Hải quan (customs.gov.vn, văn bản MA=106803, chuyên trang TONG_CUC) và toàn văn PDF đính kèm trên files.customs.gov.vn (823VB_1813.pdf.PDF, 23.758.299 byte, 197 trang, gồm Quyết định 3 điều, Quy định 4 điều và Phụ lục I, II): số ký hiệu 1813/QĐ-CHQ (sổ ghi 1813/2026/QĐ-CHQ, đã thêm 1813/QĐ-CHQ vào so_hieu_khac), ngày ban hành 12-11-2026, người ký KT. Cục trưởng Phó Cục trưởng Lưu Mạnh Tưởng, trích yếu nguyên văn "Về việc ban hành Quy định về định dạng thông điệp dữ liệu tờ khai hàng hóa xuất khẩu, nhập khẩu gửi qua dịch vụ bưu chính của doanh nghiệp được chỉ định, dịch vụ chuyển phát nhanh quốc tế". Theo Điều 2 Quyết định (trang 2): Quyết định có hiệu lực thi hành kể từ ngày 16-11-2026 và thay thế Quyết định số 813/QĐ-CHQ ngày 30-06-2025 của Cục trưởng Cục Hải quan về việc ban hành Quy định tạm thời về định dạng thông điệp dữ liệu tờ khai hàng hóa xuất khẩu, nhập khẩu trị giá thấp gửi qua dịch vụ chuyển phát nhanh quốc tế (Quyết định 813/QĐ-CHQ hiện chưa nạp trong sổ nên ghi nhận tại phạm vi đối chiếu để tránh sinh điểm mù THIEU_VAN_BAN). Đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Quy định định dạng thông điệp dữ liệu EDI (Phụ lục I, II) đối với tờ khai hàng hóa xuất khẩu, nhập khẩu trị giá thấp gửi qua dịch vụ bưu chính của doanh nghiệp được chỉ định, dịch vụ chuyển phát nhanh quốc tế; tờ khai tài liệu, chứng từ không có giá trị thương mại; tờ khai bổ sung sau thông quan và thông tin hàng hóa vào, ra kho, địa điểm (căn cứ Thông tư 142/2026/TT-BTC). Có hiệu lực từ ngày 16-11-2026, thay thế Quyết định 813/QĐ-CHQ ngày 30-06-2025.'
