  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/24/VB_19276.pdf, id=105235, SHA-256 8863d973b7cc245cfb3ea43b9496f17a20a51acc2b1fe78cacf2cd2782aea90c): Thông báo số 19276/TB-CHQ ngày 22-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Tượng nghệ thuật trang trí bằng kim loại hình hoa súng cách điệu (tên thương mại Tượng Water Lily bởi nghệ sĩ Ana Tzarev, năm sáng tác 2016, tác phẩm điêu khắc nguyên bản độc bản có giấy chứng nhận xác thực và chữ ký nghệ sĩ; chế tác thủ công đúc khuôn bằng hợp kim gồm 60% đồng và 40% kẽm bao gồm thân chính, các cánh hoa tạo hình và bệ đỡ; kích thước tổng thể cao 350 x rộng 400 x sâu 300 cm, tổng khối lượng 439,9 kg, đóng trong 28 kiện gỗ; dùng để trưng bày nghệ thuật phi thương mại), phân loại vào nhóm 97.03, mã số 9703.90.00; có hiệu lực từ ngày ký'
