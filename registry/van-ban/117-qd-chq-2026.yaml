  pham_vi: 'Đã tải và đối chiếu toàn văn bản PDF ký số kèm dấu đỏ của Cục Hải quan (28 trang, 12.957.512 byte, sha256 cea33785fda4a8d8c439d44acdc48fabff65a5a70870681c85ffef5637f876fe, ký số Cục Hải quan ngày 21/01/2026 09:37:51 +07:00, gồm Quyết định 3 điều và Quy trình 3 phần 20 điều) và đối chiếu trên LuatVietnam (bậc B), Thời báo Tài chính Việt Nam — chuyên trang Thuế & Hải quan: số hiệu 117/QĐ-CHQ, ngày ban hành 20-01-2026, người ký KT. Cục trưởng Phó Cục trưởng Nguyễn Thành Hưng, trích yếu nguyên văn "Ban hành Quy trình Xác định trước mã số; Kiểm tra tên hàng, mô tả hàng hóa, mã số, mức thuế, đơn vị tính của hàng hóa xuất khẩu, nhập khẩu trong thông quan; Thống nhất công tác phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu". Theo Điều 2 khoản 1 Quyết định (trang 2): Quyết định có hiệu lực thi hành kể từ ngày 01 tháng 02 năm 2026; theo Điều 2 khoản 2: Bãi bỏ Quyết định số 1921/QĐ-TCHQ ngày 28 tháng 6 năm 2018 của Tổng cục Hải quan về việc ban hành quy trình phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu nhập khẩu. Đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: false
  chan:
    ma: THIEU_PDF_A
    ngay: '2026-11-26'
    viec_tiep: 'Đã có PDF bản ký số gốc 28 trang (nguồn thứ cấp); đã truy cập trực tiếp customs.gov.vn (/customs/api/lay_van_ban), vbpl.vn và congbao.chinhphu.vn ngày 26-11-2026 nhưng quy trình nội bộ này chưa được đăng công khai trên Cổng Hải quan hoặc nguồn bậc A khác.'
  ngay: '2026-11-26'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Ban hành kèm theo Quyết định này Quy trình Xác định trước mã số; Kiểm tra tên hàng, mô tả hàng hóa, mã số, mức thuế, đơn vị tính của hàng hóa xuất khâu, nhập khẩu trong thông quan; Thống nhất công tác phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khâu.
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Hiệu lực thi hành 1. Quyết định này có hiệu lực thi hành kể từ ngày 01 thang 02 năm 2026. 2. Bai bỏ Quyết định số 1921/QD-TCHQ ngày 28 tháng 6 năm 2018 của Tổng cục Hải quan về việc ban hành quy trình phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu nhập khẩu.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Chỉ cục trưởng Chi cục Hải quan khu vực, Thủ trưởng các đơn vị thuộc cơ quan Cục Hải quan chịu trách nhiệm thi hành Quyết định này. Trong quá trình thực hiện, nếu có vướng mắc phát sinh thì kịp thời báo cáo đề xuất để Cục Hải quan xem xét, điều chỉnh cho phù hợp./.
      trang_pdf: 2
ghi_chu: Ban hành Quy trình 3 phần 20 điều quy định trình tự, thủ tục ban hành, sửa đổi, thay thế, hủy bỏ Thông báo kết quả xác định trước mã số; kiểm tra tên hàng, mô tả hàng hóa, mã số, mức thuế, đơn vị tính trong thông quan; thống nhất công tác phân loại hàng hóa, áp dụng mức thuế trong toàn ngành và xử lý vướng mắc vượt thẩm quyền (phối hợp giữa Chi cục Hải quan khu vực, Chi cục Kiểm định hải quan và Ban Nghiệp vụ thuế hải quan; cập nhật hệ thống MHS và Cces). Có hiệu lực từ ngày 01/02/2026, bãi bỏ Quyết định 1921/QĐ-TCHQ ngày 28/06/2018 theo Điều 2 khoản 2.
