  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/7/15/tchqdi_Th_ng_b_o_thay_i_a_ch_tr_s_l_m_vi_c_C_c_H_i_quan_3455428.pdf, id=100681, SHA-256 f30570efae09156ac4f45325ccb813cb47ca08d80db624a8ef070bf198693ab9): Thông báo số 13961/TB-CHQ ngày 14-07-2025 của Cục Hải quan về việc thay đổi địa chỉ Trụ sở làm việc của Cục Hải quan do điều chỉnh địa giới hành chính của thành phố Hà Nội từ ngày 01-07-2025 (thực hiện Nghị quyết số 1656/NQ-UBTVQH15 ngày 16-06-2025 của Ủy ban Thường vụ Quốc hội về việc sắp xếp các đơn vị hành chính cấp xã của thành phố Hà Nội năm 2025; bản in viết 1656/NQ-BBTVQH15); địa chỉ cũ: số 9 Dương Đình Nghệ, phường Yên Hòa, quận Cầu Giấy, thành phố Hà Nội; địa chỉ mới: số 9 Dương Đình Nghệ, phường Yên Hòa, thành phố Hà Nội; người ký Nguyễn Thành Sơn (KT. Chánh Văn phòng, Phó Chánh Văn phòng)'
