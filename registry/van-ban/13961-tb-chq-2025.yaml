ghi_chu: 'TB hành chính/tổ chức bộ máy — không phải XDTMS: thông báo thay đổi địa chỉ trụ sở làm việc của Cục Hải quan từ ngày 01-07-2025 (bỏ cấp quận Cầu Giấy: từ "số 9 Dương Đình Nghệ, phường Yên Hòa, quận Cầu Giấy, thành phố Hà Nội" sang "số 9 Dương Đình Nghệ, phường Yên Hòa, thành phố Hà Nội") theo Nghị quyết 1656/NQ-UBTVQH15 ngày 16-06-2025 (bản in ghi 1656/NQ-BBTVQH15). Chưa gắn quan_he tới 1656/NQ-UBTVQH15 vì văn bản này chưa có trong sổ (tránh điểm mù Cao).'
