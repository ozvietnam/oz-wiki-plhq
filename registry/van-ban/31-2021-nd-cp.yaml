  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Nghị định này quy định chỉ tiết và hướng dẫn thi hành một số điều của Luật Đầu tư về điều kiện đầu tư kinh doanh; ngành, nghề và điều kiện tiếp cận thị trường đối với nhà đầu tư nước ngoài; bảo đảm đầu tư kinh doanh; ưu đãi, hỗ trợ đầu tư; thủ tục đầu tư; hoạt động đầu tư ra nước ngoài; xúc tiễn đầu tư; quản lý nhà nước đối với hoạt động đầu tư kinh doanh tại Việt Nam và đầu tư ra nước ngoài.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Bản sao hợp lệ là bản sao được cấp từ số gốc hoặc bản sao được chứng thực từ bản chính bởi cơ quan, tô chức có thâm quyền hoặc từ cơ sở đữ liệu quốc gia đối với trường hợp thông tin gốc được lưu trữ trên cơ sở dữ liệu quốc gia về dân cư, đăng ký doanh nghiệp và đầu tư.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Bao đảm của Nhà nước dé thực hiện dự án đầu tư 1. Căn cứ điều kiện phát triển kinh tế - xã hội và nhu cầu thu hút đầu tư trong từng thời kỳ, mục tiêu, quy mô, tính chất của dự án đầu tư, Thủ tướng Chính phủ xem xét, quyết định hình thức, nội dung bảo đảm của Nhà nước dé thực hiện dự án đầu tư thuộc thâm quyền chấp thuận chủ trương đầu tư của Quốc hội, Thủ tướng Chính phủ và dự án đầu tư phát triển kết cấu hạ tầng quan trọng khác theo đề
      trang_pdf: 4
    - dieu: 22
      noi_dung: Điều 22. Điều chỉnh ưu đãi đầu tư 1. Dự án đầu tư đang được hưởng ưu đãi đầu tư và đáp ứng thêm điều kiện hưởng ưu đãi ở mức cao hơn hoặc được hưởng thêm ưu đãi theo hình thức ưu đãi mới thì được hưởng ưu đãi ở mức cao hơn hoặc hưởng thêm ưu đãi theo hình thức ưu đãi mới cho thời gian ưu đãi còn lại.
      trang_pdf: 22
    - dieu: 39
      noi_dung: 'Điều 39. Hồ sơ cấp, điều chỉnh Giấy chứng nhận đăng ký đầu tư trực tuyến 1. Đối với các dự án đầu tư không thuộc diện chấp thuận chủ trương đầu tư, nhà đầu tư được lựa chọn nộp hồ sơ cấp, điều chỉnh Giấy chứng nhận đăng ký đầu tư bang bản giấy theo quy định tại các Điều 36 và 47 của Nghị định này hoặc nộp hé sơ trực tuyến trên Hệ thông thông tin quốc gia về đầu tư theo một trong hai hình thức: sử dụng chữ ký sô hoặc không sử dụng chữ ký số.'
      trang_pdf: 48
    - dieu: 57
      noi_dung: 'Điều 57. Điều kiện, thủ tục chấm đứt hoạt động của dự án đầu tư 1. Dự án đầu tư chấm dứt hoạt động trong các trường hợp quy định tại các khoản 1 và 2 Điều 48 của Luật Đâu tư. 2. Việc chấm đứt hoạt động của dự án đầu tư thực hiện theo thủ tục sau:'
      trang_pdf: 68
    - dieu: 74
      noi_dung: Điều 74. Tài liệu xác định hình thức đầu tư ra nước ngoài 1. Đối với hoạt dong dau tu ra nước ngoài theo hình thức hop đồng ở nước ngoài quy định tại điểm b khoản 1 Điều 52 của Luật Đầu tư, nhà đầu tư nộp thỏa thuận, hợp đồng với đối tác nước ngoài về việc đầu tư hoặc tài liệu khác có giá trị tương đương kèm theo tài liệu về tư cách pháp lý của đối tác nước ngoài.
      trang_pdf: 81
    - dieu: 93
      noi_dung: 'Điều 93. Chương trình xúc tiến đầu tư của các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh 1. Hướng dẫn xây dựng chương trình xúc tiến đầu tư: a) Bộ Kế hoạch và Đầu tư Xây dựng kế hoạch xúc tiến đầu tư trong từng thời kỳ phát triển kinh tế - xã hội để định hướng công tác xúc tiến đầu tư trên phạm vi cả nước;'
      trang_pdf: 97
    - dieu: 110
      noi_dung: Điều 110. Sửa đổi, bd sung một số điều của Nghị định số 82/2018/NĐ-CP ngày 22 tháng 5 năm 2018 của Chính phủ quy định về quản lý khu công nghiệp và khu kinh tế Bãi bỏ các khoản 2 và 3 Điều 66 Nghị định số 82/2018/NĐ-CP ngày 22 tháng 5 năm 2018 của Chính phủ quy định về quan lý khu công nghiệp và khu kinh tê.
      trang_pdf: 118
    - dieu: 131
      noi_dung: Điều 131. Hiệu lực thi hành 1. Nghị định này có hiệu lực từ ngày ký.
      trang_pdf: 138
ghi_chu: Nghị định hướng dẫn Luật Đầu tư — quy định danh mục ngành, nghề tiếp cận thị trường và ưu đãi đầu tư (liên quan miễn thuế nhập khẩu tạo tài sản cố định).
