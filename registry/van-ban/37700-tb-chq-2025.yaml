  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/11/25/9.VB_37700.pdf, id=101924, SHA-256 65e7ce6ee07d0c9c6b4cf391cd1a35f04fbaf545601ff6a10fc2e83b863214b0): Thông báo số 37700/TB-CHQ ngày 21-11-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp tín hiệu có lưới, cách điện bằng silicon, 1PR x 1.5mm2 hiệu Benka (ký, mã hiệu BENKA SHIELDED FIRE RESISTANT DATA & SIGNAL CABLE 1PR x 1.5MM2; dạng cuộn chưa gắn đầu nối, vỏ ngoài LSZH, lớp vỏ nhôm, dây thoát nhiễu đồng mạ thiếc 20 AWG và băng mica bọc 02 sợi cáp lõi đồng bện xoắn 1.5mm2 cách điện bằng nhựa silicon; tiết diện nhỏ hơn 19,5mm, điện áp 30V, dùng truyền tín hiệu chuẩn RS-232, RS-485, Modbus/Bacnet cho hệ thống âm thanh, báo cháy, camera, BMS, không dùng cho viễn thông, không dùng cấp điện), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24; có hiệu lực từ ngày ký'
