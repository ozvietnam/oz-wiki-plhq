  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Điều chỉnh Chương trình xây dựng luật, pháp lệnh năm 2019 1. Bổ sung vào Chương trình xây dựng luật, pháp lệnh năm 2019 các dự án sau đây: a) Luật sửa đổi, bổ sung một số điều của Luật Giám định tư pháp (cho ý kiến tại kỳ họp thứ 8); b) Luật sửa đổi, bổ sung một số điều của Luật Phòng, chống thiên tai và Luật Đê điều (cho ý kiến tại kỳ họp thứ 8); c) Luật sửa đổi, bổ sung một số điều của Luật Xây dựng (cho ý kiến tại kỳ họp thứ 8);'
      trang_pdf: 1
      sha256_pdf: 74d8eebc8101ea4c67c9fb65b1354faef5094e87432c4a86ab40283a3a8c3431
    - dieu: 2
      noi_dung: 'Điều 2. Chương trình xây dựng luật, pháp lệnh năm 2020 1. Kỳ họp thứ 9: a) Trình Quốc hội thông qua: 1. Luật sửa đổi, bổ sung một số điều của Luật Ban hành văn bản quy phạm pháp luật; 2. Luật Thanh niên (sửa đổi); 3. Luật Đầu tư theo hình thức đối tác công tư; 4. Luật Hòa giải, đối thoại tại Tòa án; 5. Luật sửa đổi, bổ sung một số điều của Luật Giám định tư pháp;'
      trang_pdf: 2
      sha256_pdf: 74d8eebc8101ea4c67c9fb65b1354faef5094e87432c4a86ab40283a3a8c3431
    - dieu: 3
      noi_dung: Điều 3. Tổ chức thực hiện 1. Các cơ quan, tổ chức, cá nhân có thẩm quyền đề cao trách nhiệm, thực hiện nghiêm quy định của Luật Ban hành văn bản quy phạm pháp luật; bảo đảm tính pháp lý, chính xác, đầy đủ của các tài liệu trong hồ sơ dự án, dự thảo, kỹ thuật lập pháp rõ ràng, từ ngữ trong sáng; không trình dự án, dự thảo không bảo đảm chất lượng; khắc phục tình trạng chậm gửi hồ sơ;
      trang_pdf: 3
      sha256_pdf: 74d8eebc8101ea4c67c9fb65b1354faef5094e87432c4a86ab40283a3a8c3431
ghi_chu: Nghị quyết của Quốc hội khóa XIV về Chương trình xây dựng luật, pháp lệnh năm 2020 và điều chỉnh Chương trình năm 2019.
