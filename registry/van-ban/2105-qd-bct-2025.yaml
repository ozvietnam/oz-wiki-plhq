ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 6 mã HS). Tiêu đề đã đối chiếu (vbpl.ts24.com.vn + thuvienxuatnhapkhau.com). GHI CHÚ NGHIỆP VỤ (hs-code-api): Mã vụ việc AD13-AS01 (đường mía, chương 17). Sửa đổi QĐ 1989/QĐ-BCT ngày 03/08/2023. Biện pháp CBPG+CTC đường mía Thái Lan đã được gia hạn 5 năm bởi QĐ 1309/QĐ-BCT ngày 02/06/2026 (đến 15/06/2031). Chưa xác nhận ngày hiệu lực riêng — cần CEO xem bản gốc. Số hiệu hay viết 2105/QĐ-BCT-2025.'
