xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn PDF Quyết định số 1309/QĐ-BCT ngày 02-06-2026 trên Cổng Bộ Công Thương (moit.gov.vn: QD_ket_qua_ra_soat_ER01_AD13-AS01_d2370.pdf): tại phần Căn cứ và khoản 4 Điều 3 Quyết định 1309/QĐ-BCT dẫn nguyên văn Quyết định số 2105/QĐ-BCT ngày 21-07-2025 của Bộ trưởng Bộ Công Thương về việc sửa đổi, bổ sung Quyết định số 1989/QĐ-BCT ngày 03-08-2023 về kết quả rà soát lần thứ nhất việc áp dụng biện pháp chống bán phá giá và chống trợ cấp đối với một số sản phẩm đường mía có xuất xứ từ Vương quốc Thái Lan. Theo Điều 2 và khoản 4 Điều 3 Quyết định 1309/QĐ-BCT, Quyết định 2105/QĐ-BCT hết hiệu lực thi hành kể từ ngày 16-06-2026.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Sửa đổi, bổ sung Quyết định 1989/QĐ-BCT trong chuỗi vụ việc AD13-AS01 (đường mía Thái Lan, dẫn trong cột chính sách biểu thuế ở 6 mã HS chương 17); đã hết hiệu lực từ ngày 16-06-2026 theo khoản 4 Điều 3 Quyết định 1309/QĐ-BCT ngày 02-06-2026 về kết quả rà soát cuối kỳ (ER01.AD13-AS01).'
toan_van: chua_co
