ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (6 mã HS). Mã vụ việc AD13-AS01 (đường mía, chương 17). Sửa đổi QĐ 1989/QĐ-BCT. Biện pháp CBPG+CTC đường mía Thái Lan được gia hạn bởi QĐ 1309/QĐ-BCT (đến 15-06-2031) và đồng thời hết hiệu lực chuỗi 1578/2961/1989/2105 từ 16-06-2026.'
