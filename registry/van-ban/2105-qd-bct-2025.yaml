# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 2105/QĐ-BCT
loai: QUYET_DINH
ten: 'Về việc sửa đổi, bổ sung Quyết định số 1989/QĐ-BCT ngày 03 tháng 8 năm 2023 của Bộ trưởng Bộ Công Thương về kết quả rà soát lần thứ nhất việc áp dụng biện pháp chống bán phá giá và chống trợ cấp đối với một số sản phẩm đường mía có xuất xứ từ Vương quốc Thái Lan'
