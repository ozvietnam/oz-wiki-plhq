xac_minh:
  muc: NGUON_A
  pham_vi: 'Luật 05/2007/QH12 (Quốc hội KH 12, ban hành 21/11/2007) — Luật Chất lượng sản phẩm, hàng hoá. Hiệu lực từ 01/07/2008. Người ký: Nguyễn Phú Trọng. Đã nạp toàn văn DOC datafiles.chinhphu.vn.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-12'
  boi: legal-customs@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định quyền và nghĩa vụ của tổ chức, cá nhân sản xuất, kinh doanh sản phẩm, hàng hoá và tổ chức, cá nhân có hoạt động liên quan đến chất lượng sản phẩm, hàng hoá; quản lý chất lượng sản phẩm, hàng hóa.
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân sản xuất, kinh doanh sản phẩm, hàng hoá và tổ chức, cá nhân có hoạt động liên quan đến chất lượng sản phẩm, hàng hoá tại Việt Nam .
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Sản phẩm là kết quả của quá trình sản xuất hoặc cung ứng dịch vụ nhằm mục đích kinh doanh hoặc tiêu dùng. 2. Hàng hoá là sản phẩm được đưa vào thị trường, tiêu dùng thông qua trao đổi, mua bán, tiếp thị.'
    - dieu: 13
      noi_dung: Điều 13. Quyền của người xuất khẩu 1. Quyết định lựa chọn mức chất lượng của hàng hoá xuất khẩu. 2. Lựa chọn tổ chức đánh giá sự phù hợp để thử nghiệm, giám định, chứng nhận chất lượng hàng hóa xuất khẩu. 3. Quyết định các biện pháp kiểm soát nội bộ để duy trì chất lượng hàng hoá cho đến thời điểm chuyển giao quyền sở hữu hàng hoá đó cho người nhập khẩu.
    - dieu: 23
      noi_dung: 'Điều 23. Công bố tiêu chuẩn áp dụng 1. Người sản xuất, người nhập khẩu tự công bố các đặc tính cơ bản, thông tin cảnh báo, số hiệu tiêu chuẩn trên hàng hoá hoặc một trong các phương tiện sau đây: a) Bao bì hàng hoá; b) Nhãn hàng hoá; c) Tài liệu kèm theo sản phẩm, hàng hoá. 2. Nội dung của tiêu chuẩn công bố áp dụng không được trái với yêu cầu của quy chuẩn kỹ thuật do cơ quan quản lý nhà nước có thẩm quyền ban hành.'
    - dieu: 32
      noi_dung: Điều 32. Điều kiện bảo đảm chất lượng hàng hoá xuất khẩu 1. Người xuất khẩu hàng hoá phải bảo đảm hàng hóa xuất khẩu phù hợp với quy định của nước nhập khẩu, hợp đồng hoặc điều ước quốc tế, thỏa thuận quốc tế thừa nhận lẫn nhau về kết quả đánh giá sự phù hợp với nước, vùng lãnh thổ có liên quan.
    - dieu: 42
      noi_dung: Điều 42. Điều kiện bảo đảm chất lượng hàng hoá trong quá trình sử dụng 1. Hàng hoá phải được sử dụng, vận chuyển, lưu giữ, bảo quản, bảo trì, bảo dưỡng theo hướng dẫn của người sản xuất. 2. Hàng hoá phải được kiểm định theo quy định trong quy chuẩn kỹ thuật tương ứng do cơ quan quản lý nhà nước có thẩm quyền ban hành.
    - dieu: 51
      noi_dung: 'Điều 51. Nhiệm vụ, quyền hạn của kiểm soát viên chất lượng Trong quá trình kiểm tra chất lượng sản phẩm, hàng hoá, kiểm soát viên chất lượng có những nhiệm vụ, quyền hạn sau đây: 1. Yêu cầu tổ chức, cá nhân sản xuất, kinh doanh xuất trình các tài liệu liên quan đến sản phẩm, hàng hoá theo nội dung kiểm tra quy định tại khoản 2 Điều 27 và xử lý vi phạm trong quá trình kiểm tra theo quy định tại Điều 40 của Luật này;'
    - dieu: 61
      noi_dung: Điều 61. Trách nhiệm bồi thường thiệt hại 1. Người sản xuất, người nhập khẩu phải bồi thường thiệt hại cho người bán hàng hoặc người tiêu dùng khi hàng hóa gây thiệt hại do lỗi của người sản xuất, người nhập khẩu không bảo đảm chất lượng hàng hóa, trừ trường hợp quy định tại khoản 1 Điều 62 của Luật này. Việc bồi thường thiệt hại được thực hiện theo thoả thuận giữa các bên có liên quan hoặc theo quyết định của toà án hoặc trọng tài.
    - dieu: 71
      noi_dung: Điều 71. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2008. Pháp lệnh chất lượng hàng hóa ngày 24 tháng 12 năm 1999 hết hiệu lực kể từ ngày Luật này có hiệu lực.
