# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 05/2007/QH12
loai: LUAT
ten: Luật Chất lượng sản phẩm, hàng hoá
co_quan: QH
ngay_ban_hanh: '2007-11-21'
