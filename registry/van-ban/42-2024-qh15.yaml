xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=211200, người ký Chủ tịch Quốc hội Trần Thanh Mẫn, tệp đính kèm 42-2024-qh15.pdf): Luật Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ số 42/2024/QH15 của Quốc hội, thông qua ngày 29-06-2024, có hiệu lực thi hành từ ngày 01-01-2025; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quản lý, sử dụng vũ khí, vật liệu nổ, tiền chất thuốc nổ, công cụ hỗ trợ; nguyên tắc, trách nhiệm của cơ quan, tổ chức, cá nhân trong quản lý, sử dụng vũ khí, vật liệu nổ, tiền chất thuốc nổ, công cụ hỗ trợ nhằm bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội, bảo vệ quyền con người, quyền công dân và phục vụ phát triển kinh tế - xã hội.
      trang_pdf: 1
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Vũ khí là thiết bị, phương tiện hoặc tổ hợp những thiết bị, phương tiện được chế tạo, sản xuất có khả năng gây sát thương, nguy hại cho tính mạng, sức khỏe con người, phá hủy kết cấu vật chất, bao gồm: vũ khí quân dụng, vũ khí thô sơ, vũ khí thể thao, súng săn.'
      trang_pdf: 1
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc quản lý, sử dụng vũ khí, vật liệu nổ, tiền chất thuốc nổ, công cụ hỗ trợ 1. Tuân thủ Hiến pháp, pháp luật, phù hợp với điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên và thỏa thuận quốc tế có liên quan. 2. Trang bị vũ khí, vật liệu nổ, công cụ hỗ trợ phải đúng thẩm quyền, đối tượng và bảo đảm tiêu chuẩn, quy chuẩn kỹ thuật.
      trang_pdf: 4
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 14
      noi_dung: Điều 14. Quản lý, sử dụng vũ khí, vật liệu nổ, công cụ hỗ trợ để chào hàng, giới thiệu, triển lãm, trưng bày sản phẩm hoặc làm đạo cụ trong hoạt động văn hóa, nghệ thuật 1. Vũ khí, công cụ hỗ trợ mang vào lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam để chào hàng, giới thiệu sản phẩm, sau khi hết thời hạn chào hàng, giới thiệu sản phẩm phải mang ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam đầy đủ số lượng, chủng loại vũ khí, công
      trang_pdf: 12
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 24
      noi_dung: 'Điều 24. Đối tượng được trang bị vũ khí thể thao 1. Đối tượng được trang bị vũ khí thể thao bao gồm: a) Quân đội nhân dân; b) Dân quân tự vệ; c) Cảnh sát biển; d) Công an nhân dân; đ) Câu lạc bộ, cơ sở đào tạo, huấn luyện thể thao có giấy phép hoạt động; e) Trung tâm giáo dục quốc phòng và an ninh; g) Cơ quan, tổ chức, doanh nghiệp khác được thành lập, cấp phép hoạt động trong luyện tập, thi đấu thể thao.'
      trang_pdf: 20
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 34
      noi_dung: 'Điều 34. Nghiên cứu, sản xuất, kinh doanh, xuất khẩu, nhập khẩu vật liệu nổ công nghiệp 1. Việc nghiên cứu vật liệu nổ công nghiệp thực hiện theo quy định sau đây: a) Việc nghiên cứu, phát triển, thử nghiệm vật liệu nổ công nghiệp do các tổ chức khoa học và công nghệ hoặc tổ chức sản xuất vật liệu nổ công nghiệp thực hiện trên cơ sở nhiệm vụ khoa học và công nghệ được tổ chức dưới hình thức chương trình, đề tài, dự án, nhiệm vụ nghiên cứu theo'
      trang_pdf: 27
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 44
      noi_dung: 'Điều 44. Thủ tục cấp giấy chứng nhận đủ điều kiện sản xuất tiền chất thuốc nổ 1. Hồ sơ đề nghị cấp giấy chứng nhận đủ điều kiện sản xuất tiền chất thuốc nổ bao gồm: a) Văn bản đề nghị, trong đó ghi rõ tên, địa chỉ tổ chức, doanh nghiệp; lý do; họ tên, địa chỉ, số định danh cá nhân hoặc số hộ chiếu của người đại diện theo pháp luật; số quyết định thành lập tổ chức, doanh nghiệp hoặc số giấy chứng nhận đăng ký doanh nghiệp;'
      trang_pdf: 43
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 54
      noi_dung: Điều 54. Thủ tục cấp giấy phép mua công cụ hỗ trợ 1. Tổ chức, doanh nghiệp không thuộc phạm vi quản lý của Bộ Quốc phòng
      trang_pdf: 53
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 64
      noi_dung: 'Điều 64. Trình tự, thủ tục tiếp nhận, thu gom vũ khí, vật liệu nổ, công cụ hỗ trợ 1. Trình tự, thủ tục tiếp nhận vũ khí, vật liệu nổ, công cụ hỗ trợ thực hiện như sau: a) Tổ chức tiếp nhận vũ khí, vật liệu nổ, công cụ hỗ trợ; b) Lập biên bản tiếp nhận vũ khí, vật liệu nổ, công cụ hỗ trợ; biên bản tiếp nhận được lập thành 02 bản, 01 bản giao cho cơ quan, tổ chức, cá nhân giao nộp, 01 bản lưu tại cơ quan, đơn vị tiếp nhận;'
      trang_pdf: 59
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
    - dieu: 75
      noi_dung: Điều 75. Quy định chuyển tiếp 1. Các loại giấy phép, giấy chứng nhận, chứng chỉ về vũ khí, vật liệu nổ, tiền chất thuốc nổ, công cụ hỗ trợ đã được cấp trước ngày Luật này có hiệu lực thi hành mà còn thời hạn thì được tiếp tục sử dụng cho đến hết thời hạn hiệu lực ghi trong giấy phép, giấy chứng nhận, chứng chỉ.
      trang_pdf: 65
      sha256_pdf: 307926dc0b1a42af86fcda9dc0f09e93bf21470ea6528954e96f4dcfcaa5baca
