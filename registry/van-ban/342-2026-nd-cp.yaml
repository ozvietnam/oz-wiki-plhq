ghi_chu: 'Trinh sát đêm 9/11, nạp toàn văn và đối chiếu hiệu lực ngày 12/11. Quy định quyền xuất khẩu, quyền nhập khẩu, quyền phân phối của nhà đầu tư nước ngoài và tổ chức kinh tế có vốn đầu tư nước ngoài (hướng dẫn Điều 22 Luật Thương mại 36/2005/QH11 và Điều 5 Luật Quản lý ngoại thương 05/2017/QH14). Điều 45 khoản 2 còn bãi bỏ Điều 36 Nghị định 146/2025/NĐ-CP — chưa ghi vào quan_he vì NĐ 146/2025/NĐ-CP chưa có trong sổ.'
