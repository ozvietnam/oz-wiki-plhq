    - dieu: 20
      noi_dung: 'Cơ quan cấp Giấy phép từ chối cấp Giấy phép kinh doanh trong các trường hợp sau: 1. Nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài không đáp ứng điều kiện cấp Giấy phép kinh doanh theo quy định tại Nghị định này. 2. Thời hạn hoạt động của dự án hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa đã hết. 3. Tổ chức kinh tế có vốn đầu tư nước ngoài đề nghị cấp Giấy phép kinh doanh trong thời hạn 02 năm kể từ ngày bị thu hồi Giấy phép kinh doanh theo quy định tại khoản 1 Điều 42 Nghị định này.'
