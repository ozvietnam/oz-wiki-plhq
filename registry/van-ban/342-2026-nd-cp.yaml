  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định chi tiết Điều 22 Luật Thương mại và Điều 5 Luật Quản lý ngoại thương về hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài tại Việt Nam.'
      trang_pdf: 1
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 2
      noi_dung: 'Nghị định này áp dụng đối với nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài, cơ quan, tổ chức, cá nhân có liên quan đến hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài tại Việt Nam.'
      trang_pdf: 1
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 3
      khoan: 1
      noi_dung: 'Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Hàng hóa là các loại động sản thuộc phạm vi cam kết của Việt Nam về quyền xuất khẩu, quyền nhập khẩu, quyền phân phối bán buôn và quyền phân phối bán lẻ trong các Điều ước quốc tế mà Việt Nam là thành viên. 2. Hoạt động mua bán hàng hóa bao gồm: a) Thực hiện quyền xuất khẩu; b) Thực hiện quyền nhập khẩu; c) Thực hiện quyền phân phối. 3. Các hoạt động liên quan trực tiếp đến mua bán hàng hóa bao gồm: a) Cung cấp dịch vụ giám định thương mại; b) Cung cấp dịch vụ logistics; c) Cho thuê hàng hóa, không bao gồm: cho thuê tài chính, cho thuê trang thiết bị xây dựng có người vận hành; d) Cung cấp dịch vụ xúc tiến thương mại, không bao gồm dịch vụ quảng cáo; đ) Cung cấp dịch vụ trung gian thương mại, không bao gồm hoạt động đại lý bán buôn, đại lý bán lẻ hàng hóa; e) Quản lý và vận hành nền tảng thương mại điện tử trung gian, mạng xã hội hoạt động thương mại điện tử, nền tảng thương mại tích hợp. g) Cung cấp dịch vụ tổ chức đấu thầu hàng hóa, dịch vụ. 4. Quyền xuất khẩu là quyền mua hàng hóa tại Việt Nam để xuất khẩu, bao gồm quyền đứng tên trên tờ khai hàng hóa xuất khẩu để thực hiện và chịu trách nhiệm về các thủ tục liên quan đến xuất khẩu. Quyền xuất khẩu không bao gồm quyền mua hàng hóa từ các đối tượng không phải là thương nhân để xuất khẩu, trừ trường hợp pháp luật Việt Nam hoặc Điều ước quốc tế mà Việt Nam là thành viên có quy định khác. 5. Quyền nhập khẩu là quyền được nhập khẩu hàng hóa từ nước ngoài vào Việt Nam để bán cho thương nhân có quyền phân phối hàng hóa đó tại Việt Nam, bao gồm quyền đứng tên trên tờ khai hàng hóa nhập khẩu để thực hiện và chịu trách nhiệm về các thủ tục liên quan đến nhập khẩu. Quyền nhập khẩu không bao gồm quyền tổ chức hoặc tham gia hệ thống phân phối hàng hóa tại Việt Nam, trừ trường hợp pháp luật Việt Nam hoặc Điều ước quốc tế mà Việt Nam là thành viên có quy định khác. 6. Phân phối là các hoạt động bán buôn, bán lẻ, đại lý bán hàng hóa và nhượng quyền thương mại trong lĩnh vực phân phối. 7. Quyền phân phối là quyền thực hiện trực tiếp các hoạt động phân phối. 8. Bán buôn là hoạt động bán hàng hóa cho thương nhân bán buôn, thương nhân bán lẻ và thương nhân, tổ chức khác, có bao gồm đại lý bán buôn nhưng không bao gồm hoạt động bán lẻ. 9. Bán lẻ là hoạt động bán hàng hóa cho cá nhân, hộ gia đình, tổ chức khác để sử dụng vào mục đích tiêu dùng, có bao gồm đại lý bán lẻ.'
      trang_pdf: 2
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 4
      noi_dung: '1. Nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài thực hiện hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa tại Việt Nam phải tuân thủ các quy định tại Nghị định này; trường hợp Điều ước quốc tế mà Việt Nam là thành viên có quy định khác với quy định tại Nghị định này thì áp dụng quy định của Điều ước quốc tế đó. 2. Tổ chức kinh tế có vốn đầu tư nước ngoài thực hiện hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa tại Việt Nam, ngoài việc tuân thủ các quy định tại Nghị định này còn phải tuân thủ các quy định của pháp luật khác có liên quan.'
      trang_pdf: 4
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 5
      noi_dung: '1. Giấy phép kinh doanh được cấp cho tổ chức kinh tế có vốn đầu tư nước ngoài để thực hiện các hoạt động sau: a) Thực hiện quyền phân phối bán lẻ hàng hóa, không bao gồm hàng hóa quy định tại điểm d khoản 4 Điều 9 Nghị định này; b) Thực hiện quyền nhập khẩu, quyền phân phối bán buôn hàng hóa quy định tại điểm c khoản 4 Điều 9 Nghị định này; c) Thực hiện quyền phân phối bán lẻ hàng hóa quy định tại điểm d khoản 4 Điều 9 Nghị định này; d) Cung cấp dịch vụ logistics; trừ các phân ngành dịch vụ logistics mà Việt Nam có cam kết mở cửa thị trường trong các Điều ước quốc tế mà Việt Nam là thành viên; đ) Cho thuê hàng hóa, không bao gồm cho thuê tài chính; trừ cho thuê trang thiết bị xây dựng có người vận hành; e) Cung cấp dịch vụ xúc tiến thương mại, không bao gồm dịch vụ quảng cáo; g) Cung cấp dịch vụ trung gian thương mại; h) Quản lý và vận hành nền tảng thương mại điện tử trung gian, mạng xã hội hoạt động thương mại điện tử, nền tảng thương mại tích hợp; i) Cung cấp dịch vụ tổ chức đấu thầu hàng hóa, dịch vụ. 2. Giấy phép lập cơ sở bán lẻ được cấp cho tổ chức kinh tế có vốn đầu tư nước ngoài để lập cơ sở bán lẻ. 3. Tổ chức kinh tế có vốn đầu tư nước ngoài có quyền đề nghị cấp Giấy phép lập cơ sở bán lẻ sau khi có Giấy phép kinh doanh và tài liệu về địa điểm lập cơ sở bán lẻ. 4. Trường hợp địa điểm lập cơ sở bán lẻ thứ nhất cùng tỉnh/thành phố trực thuộc trung ương với trụ sở chính, tổ chức kinh tế có vốn đầu tư nước ngoài có quyền đề nghị cấp Giấy phép kinh doanh đồng thời với cấp Giấy phép lập cơ sở bán lẻ thứ nhất. Hồ sơ, trình tự thực hiện theo quy định tại Điều 19 Nghị định này. 5. Tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư phải đáp ứng điều kiện và thực hiện: thủ tục cấp Giấy phép kinh doanh khi thực hiện các hoạt động phải cấp Giấy phép kinh doanh; thủ tục cấp Giấy phép lập cơ sở bán lẻ khi lập cơ sở bán lẻ, theo quy định tại Nghị định này. 6. Tổ chức kinh tế có cơ sở bán lẻ tại Việt Nam, sau khi nhận vốn góp trở thành tổ chức kinh tế có vốn đầu tư nước ngoài, tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư phải làm thủ tục cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ. a) Hồ sơ, trình tự cấp Giấy phép kinh doanh đối với trường hợp này thực hiện theo quy định tại Điều 11 và 12 Nghị định này. b) Hồ sơ, trình tự cấp Giấy phép lập cơ sở bán lẻ cho phép cơ sở bán lẻ được tiếp tục hoạt động thực hiện theo quy định tại Điều 36 Nghị định này. c) Trong quá trình thực hiện trình tự, thủ tục cấp Giấy phép lập cơ sở bán lẻ cho phép cơ sở bán lẻ được tiếp tục hoạt động, tổ chức kinh tế đã nhận phần vốn góp, cổ phần của nhà đầu tư nước ngoài được tiếp tục thực hiện hoạt động bán lẻ tại các cơ sở bán lẻ đang hoạt động cho đến khi được cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ theo quy định tại Nghị định này, nhưng tối đa không quá 12 tháng kể từ ngày trên giấy tờ pháp lý, văn bản xác nhận của cơ quan có thẩm quyền về việc nhà đầu tư nước ngoài đáp ứng điều kiện góp vốn, mua cổ phần, mua lại phần vốn góp, theo quy định pháp luật về đăng ký đầu tư, đăng ký doanh nghiệp.'
      trang_pdf: 5
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 6
      noi_dung: '1. Ngoài các hoạt động thuộc trường hợp phải cấp Giấy phép kinh doanh quy định tại khoản 1 Điều 5 Nghị định này, tổ chức kinh tế có vốn đầu tư nước ngoài, tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư được quyền thực hiện hoạt động mua bán hàng hóa quy định tại khoản 2 Điều 3 Nghị định này sau khi đăng ký thực hiện các hoạt động đó tại các văn bản được cấp bởi cơ quan có thẩm quyền theo quy định của Luật Đầu tư, Luật Doanh nghiệp. 2. Trường hợp nhà đầu tư nước ngoài không thuộc nước, vùng lãnh thổ tham gia Điều ước quốc tế mà Việt Nam là thành viên có cam kết mở cửa thị trường, đăng ký thực hiện hoạt động mua bán hàng hóa quy định tại khoản 1 Điều này, cơ quan nhà nước có thẩm quyền lấy ý kiến Ủy ban nhân dân cấp tỉnh trước khi cấp, thay đổi đăng ký thực hiện các hoạt động đó tại các giấy tờ do cơ quan có thẩm quyền cấp theo quy định của Luật Đầu tư, Luật Doanh nghiệp.'
      trang_pdf: 6
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 7
      noi_dung: '1. Tổ chức kinh tế có vốn đầu tư nước ngoài đã có quyền xuất khẩu, được xuất khẩu ra nước ngoài và khu vực hải quan riêng các hàng hóa: Hàng hóa mua tại Việt Nam; hàng hóa do tổ chức kinh tế đó đặt gia công tại Việt Nam và hàng hóa nhập khẩu hợp pháp vào Việt Nam, theo các điều kiện sau: a) Hàng hóa xuất khẩu không thuộc danh mục hàng hóa cấm xuất khẩu, danh mục hàng hóa tạm ngừng xuất khẩu, danh mục hàng hóa không được quyền xuất khẩu trong các Điều ước quốc tế mà Việt Nam là thành viên; b) Đối với hàng hóa xuất khẩu thuộc danh mục hàng hóa xuất khẩu theo giấy phép, theo điều kiện, tổ chức kinh tế có vốn đầu tư nước ngoài phải có giấy phép hoặc đáp ứng đủ các điều kiện theo quy định của pháp luật. 2. Tổ chức kinh tế có vốn đầu tư nước ngoài đã có quyền nhập khẩu, được nhập khẩu hàng hóa từ nước ngoài và khu vực hải quan riêng vào Việt Nam, theo các điều kiện sau: a) Hàng hóa nhập khẩu không thuộc danh mục hàng hóa cấm nhập khẩu, danh mục hàng hóa tạm ngừng nhập khẩu, danh mục hàng hóa không được quyền nhập khẩu trong các Điều ước quốc tế mà Việt Nam là thành viên; b) Đối với hàng hóa nhập khẩu thuộc danh mục hàng hóa nhập khẩu theo giấy phép, theo điều kiện, tổ chức kinh tế có vốn đầu tư nước ngoài phải có giấy phép hoặc đáp ứng đủ các điều kiện theo quy định của pháp luật. 3. Thủ tục xuất khẩu, nhập khẩu hàng hóa để thực hiện quyền xuất khẩu, quyền nhập khẩu thực hiện theo quy định pháp luật về quản lý xuất nhập khẩu. 4. Tổ chức kinh tế có vốn đầu tư nước ngoài đã có quyền phân phối bán buôn, quyền phân phối bán lẻ, được bán buôn, bán lẻ hàng hóa sản xuất, gia công tại Việt Nam và hàng hóa nhập khẩu hợp pháp vào Việt Nam. 5. Đối với ngành, nghề đầu tư kinh doanh có điều kiện, tổ chức kinh tế có vốn đầu tư nước ngoài được thực hiện hoạt động kinh doanh khi đáp ứng đủ các điều kiện theo quy định của pháp luật.'
      trang_pdf: 6
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 8
      noi_dung: '1. Ủy ban nhân dân cấp tỉnh nơi tổ chức kinh tế có vốn đầu tư nước ngoài đặt trụ sở chính thực hiện việc: cấp, cấp lại, điều chỉnh, thu hồi Giấy phép kinh doanh. 2. Ủy ban nhân dân cấp tỉnh nơi tổ chức kinh tế có vốn đầu tư nước ngoài đặt cơ sở bán lẻ thực hiện việc: cấp, cấp lại, điều chỉnh, gia hạn, thu hồi Giấy phép lập cơ sở bán lẻ. 3. Cơ quan cấp Giấy phép lấy ý kiến của Bộ Công an và Bộ Quốc phòng về vấn đề an ninh quốc gia trong các trường hợp sau: a) Trường hợp quy định tại khoản 2, điểm b khoản 3, điểm b khoản 4 Điều 9; b) Nhà đầu tư nước ngoài chi phối tổ chức kinh tế là chủ quản nền tảng thương mại điện tử trung gian, mạng xã hội hoạt động thương mại điện tử, nền tảng thương mại điện tử tích hợp là nền tảng số lớn theo quy định pháp luật về bảo vệ người tiêu dùng và thương mại điện tử. c) Nhà đầu tư nước ngoài đề nghị: Cấp Giấy phép lập cơ sở bán lẻ cho phép cơ sở bán lẻ được tiếp tục hoạt động cho: 100 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở dưới 500 m2 và/hoặc 50 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở từ 500 m2 đến dưới 3.000 m2 và/hoặc 30 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở từ 3.000 m2 trở lên, tại Việt Nam; Cấp Giấy phép lập cơ sở bán lẻ mới khi đang sở hữu hoặc tham gia sở hữu từ 100 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở dưới 500 m2 và/hoặc 50 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở từ 500 m2 đến dưới 3.000 m2 và/hoặc 30 cơ sở bán lẻ có diện tích bán hàng của mỗi cơ sở từ 3.000 m2 trở lên, tại Việt Nam.'
