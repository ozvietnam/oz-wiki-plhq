    - dieu: 9
      noi_dung: '1. Nhà đầu tư nước ngoài thuộc nước, vùng lãnh thổ tham gia Điều ước quốc tế mà Việt Nam là thành viên có cam kết mở cửa thị trường cho hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa phải đáp ứng các điều kiện sau: a) Điều kiện về tiếp cận thị trường tại Điều ước quốc tế mà Việt Nam và nước, vùng lãnh thổ đó là thành viên và được nhà đầu tư nước ngoài lựa chọn áp dụng theo quy định pháp luật về đầu tư. Nhà đầu tư nước ngoài phải đáp ứng điều kiện này trong suốt quá trình hoạt động kinh doanh theo quy định tại Nghị định này tại Việt Nam; b) Không còn nợ thuế quá hạn trong trường hợp đã thành lập tổ chức kinh tế tại Việt Nam từ 01 năm trở lên tính đến ngày nộp hồ sơ. 2. Nhà đầu tư nước ngoài không thuộc nước, vùng lãnh thổ tham gia Điều ước quốc tế mà Việt Nam là thành viên phải đáp ứng các điều kiện và tiêu chí sau: a) Các điều kiện quy định tại điểm b khoản 1 Điều này; b) Các tiêu chí sau: Phù hợp với quy định của pháp luật chuyên ngành liên quan; Phù hợp với mức độ cạnh tranh của doanh nghiệp trong nước trong cùng lĩnh vực hoạt động trong thời gian 01 năm tính đến ngày nộp hồ sơ. 3. Trường hợp dịch vụ kinh doanh chưa được cam kết mở cửa thị trường trong các Điều ước quốc tế mà Việt Nam là thành viên: a) Nhà đầu tư nước ngoài thuộc trường hợp quy định tại khoản 1 Điều này phải đáp ứng các điều kiện và tiêu chí quy định tại khoản 1 và điểm b khoản 2 Điều này; b) Nhà đầu tư nước ngoài thuộc trường hợp quy định tại khoản 2 Điều này phải đáp ứng các điều kiện và tiêu chí quy định tại khoản 2 Điều này. 4. Trường hợp hàng hóa kinh doanh chưa được cam kết mở cửa thị trường trong các Điều ước quốc tế mà Việt Nam là thành viên (dầu bôi trơn, mỡ bôi trơn có nguồn gốc từ dầu mỏ; gạo; đường; vật phẩm đã ghi hình; sách, báo và tạp chí): a) Nhà đầu tư nước ngoài thuộc trường hợp quy định tại khoản 1 Điều này phải đáp ứng các điều kiện và tiêu chí quy định tại khoản 1, điểm b khoản 2 Điều này và điểm c, d khoản này, theo các hàng hóa tương ứng; b) Nhà đầu tư nước ngoài thuộc trường hợp quy định tại khoản 2 Điều này phải đáp ứng các điều kiện, tiêu chí quy định tại khoản 2 Điều này và điểm c, d khoản này, theo các hàng hóa tương ứng; c) Đối với hàng hóa là dầu bôi trơn, mỡ bôi trơn có nguồn gốc từ dầu mỏ, Cơ quan cấp Giấy phép xem xét cấp phép thực hiện quyền nhập khẩu, quyền phân phối bán buôn cho tổ chức kinh tế có vốn đầu tư nước ngoài đáp ứng một trong điều kiện sau: Đã được cấp Giấy chứng nhận đăng ký đầu tư cho dự án sản xuất dầu bôi trơn, mỡ bôi trơn có nguồn gốc từ dầu mỏ tại Việt Nam; Đã được cấp Giấy chứng nhận đăng ký đầu tư cho dự án sản xuất hoặc đã được phép phân phối tại Việt Nam máy móc, thiết bị, hàng hóa có sử dụng dầu bôi trơn, mỡ bôi trơn có nguồn gốc từ dầu mỏ. d) Đối với hàng hóa là gạo; đường; vật phẩm đã ghi hình; sách, báo và tạp chí, Cơ quan cấp Giấy phép xem xét cấp phép thực hiện quyền phân phối bán lẻ cho tổ chức kinh tế có vốn đầu tư nước ngoài đã được cấp Giấy phép lập cơ sở bán lẻ dưới hình thức cửa hàng tiện lợi, siêu thị mini, siêu thị để bán lẻ tại các cơ sở bán lẻ đó. 5. Cơ quan cấp Giấy phép xem xét việc đáp ứng các điều kiện, tiêu chí và căn cứ các nội dung sau để quyết định cấp Giấy phép kinh doanh đối với trường hợp quy định tại khoản 2, 3 và 4 Điều này: a) Đối với trường hợp quy định tại khoản 3 và 4 Điều này: Sự phù hợp với chiến lược phát triển ngành, lĩnh vực của địa phương, vùng, quốc gia; Tiến trình đàm phán và mở cửa thị trường của Việt Nam. b) Đối với trường hợp quy định tại khoản 2 Điều này: Nội dung quy định tại điểm a khoản này; Quan hệ ngoại giao, vấn đề an ninh quốc gia, trật tự, an toàn xã hội.'
