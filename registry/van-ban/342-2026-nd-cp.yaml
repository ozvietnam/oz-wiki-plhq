  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn + PDF Công báo số 512 ngày 17-09-2026 (có lớp chữ, ký Phó Thủ tướng Phạm Gia Túc ngày 03-09-2026) + vanban.chinhphu.vn docid=219372: 6 Chương, 45 Điều + Phụ lục (19 mẫu đơn/giấy phép/báo cáo + Bảng 1 hướng dẫn cách ghi giấy phép). Điều 1 quy định chi tiết Điều 22 Luật Thương mại (36/2005/QH11) và Điều 5 Luật Quản lý ngoại thương (05/2017/QH14). Điều 44 quy định điều khoản chuyển tiếp. Điều 45 (Điều khoản thi hành): khoản 1 hiệu lực thi hành từ ngày 18-10-2026; khoản 2 thay thế Nghị định 09/2018/NĐ-CP ngày 15-01-2018 và bãi bỏ Điều 36 Nghị định 146/2025/NĐ-CP ngày 12-06-2025. Đối chiếu đến 12-11-2026 còn hiệu lực.'
