  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 512 ngày 17-09-2026 (raw/download/congbaocdn.chinhphu.vn/342-2026-nd-cp.pdf, 84 trang, trang 2–85 của số Công báo, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 17-09-2026, SHA-256 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b), PDF chữ ký số datafiles.chinhphu.vn, thẻ vanban.chinhphu.vn (docid=219372) và trang wiki/sources/342-2026-nd-cp.md: Phó Thủ tướng Phạm Gia Túc ký ban hành ngày 03-09-2026; cấu trúc 6 Chương / 45 Điều / Phụ lục (19 mẫu đơn, giấy phép, báo cáo + Bảng 1 hướng dẫn cách ghi giấy phép); Điều 1 quy định chi tiết Điều 22 Luật Thương mại (36/2005/QH11) và Điều 5 Luật Quản lý ngoại thương (05/2017/QH14); Điều 45 khoản 1-2 có hiệu lực thi hành từ ngày 18-10-2026, thay thế Nghị định 09/2018/NĐ-CP và bãi bỏ Điều 36 Nghị định 146/2025/NĐ-CP.'
