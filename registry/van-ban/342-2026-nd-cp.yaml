      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 10
      noi_dung: '1. Nội dung Giấy phép kinh doanh (Mẫu số 12 tại Phụ lục ban hành kèm theo Nghị định này): a) Tên, mã số doanh nghiệp, địa chỉ trụ sở chính và người đại diện theo pháp luật; b) Chủ sở hữu, thành viên góp vốn, cổ đông sáng lập và nơi đăng ký thành lập, quốc tịch; c) Hoạt động mua bán hàng hóa; d) Hàng hóa kinh doanh; đ) Các hoạt động liên quan trực tiếp đến mua bán hàng hóa; e) Các nội dung khác do Cơ quan cấp Giấy phép quy định tại Giấy phép kinh doanh (nếu có). 2. Thời hạn kinh doanh a) Thời hạn kinh doanh đối với trường hợp quy định tại khoản 1 Điều 9 Nghị định này tương ứng với thời hạn của Giấy chứng nhận đăng ký doanh nghiệp (nếu có), theo quy định pháp luật về doanh nghiệp; b) Thời hạn kinh doanh đối với trường hợp quy định tại khoản 2, 3 và 4 Điều 9 Nghị định này là 05 năm; c) Thời hạn kinh doanh cấp lại bằng thời hạn còn lại của thời hạn kinh doanh đã được cấp.'
      trang_pdf: 10
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 12
      noi_dung: '1. Tổ chức kinh tế có vốn đầu tư nước ngoài nộp 01 bộ hồ sơ theo một trong các cách thức sau: trực tiếp tại Bộ phận Một cửa; qua dịch vụ bưu chính công ích theo quy định của Thủ tướng Chính phủ; qua thuê dịch vụ của doanh nghiệp, cá nhân hoặc qua ủy quyền theo quy định của pháp luật; trực tuyến tại Cổng Dịch vụ công quốc gia (nếu đủ điều kiện áp dụng). 2. Trong thời hạn 03 ngày làm việc kể từ ngày nhận được hồ sơ, Cơ quan cấp Giấy phép kiểm tra và có văn bản yêu cầu sửa đổi, bổ sung nếu hồ sơ chưa đủ và hợp lệ. 3. Trong thời hạn 10 ngày làm việc kể từ ngày nhận được hồ sơ đủ và hợp lệ, Cơ quan cấp Giấy phép kiểm tra việc đáp ứng điều kiện, tiêu chí, căn cứ tương ứng quy định tại Điều 9 Nghị định này. a) Trường hợp không đáp ứng điều kiện, Cơ quan cấp Giấy phép có văn bản trả lời và nêu rõ lý do; b) Trường hợp đáp ứng điều kiện: Cơ quan cấp Giấy phép cấp Giấy phép kinh doanh cho các trường hợp quy định tại khoản 1, điểm a khoản 3 và điểm a khoản 4 Điều 9 Nghị định này; trường hợp từ chối cấp phép, phải có văn bản trả lời và nêu rõ lý do; Cơ quan cấp Giấy phép gửi hồ sơ kèm văn bản lấy ý kiến Bộ Công an và Bộ Quốc phòng đối với các trường hợp quy định tại điểm a và b khoản 3 Điều 8 Nghị định này (Mẫu số 10 tại Phụ lục ban hành kèm theo Nghị định này). 4. Trong thời hạn 14 ngày làm việc kể từ ngày nhận được hồ sơ, Bộ Công an và Bộ Quốc phòng có văn bản chấp thuận cấp Giấy phép kinh doanh; trường hợp từ chối, phải có văn bản trả lời và nêu rõ lý do (Mẫu số 11 tại Phụ lục ban hành kèm theo Nghị định này). 5. Trong thời hạn 03 ngày làm việc kể từ ngày nhận đủ văn bản trả lời của Bộ Công an và Bộ Quốc phòng: a) Trường hợp hai Bộ trên có văn bản chấp thuận cấp phép, Cơ quan cấp Giấy phép thực hiện cấp Giấy phép kinh doanh; b) Trường hợp một trong hai Bộ trên không chấp thuận cấp phép, Cơ quan cấp Giấy phép có văn bản từ chối cấp phép và nêu rõ lý do. 6. Tổ chức kinh tế có vốn đầu tư nước ngoài nhận kết quả giải quyết thủ tục cấp Giấy phép kinh doanh và Cơ quan cấp Giấy phép trả kết quả giải quyết thủ tục cấp Giấy phép kinh doanh theo quy định pháp luật hiện hành về thực hiện thủ tục hành chính. Trường hợp tổ chức kinh tế có vốn đầu tư nước ngoài lựa chọn nhận kết quả giải quyết thủ tục hành chính qua dịch vụ bưu chính, tổ chức kinh tế có vốn đầu tư nước ngoài thực hiện theo hướng dẫn của đơn vị cung ứng dịch vụ bưu chính.'
