      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 21
      noi_dung: '1. Trường hợp nhà đầu tư nước ngoài lập cơ sở bán lẻ thứ nhất: a) Không còn nợ thuế quá hạn trong trường hợp tổ chức kinh tế có vốn đầu tư nước ngoài đã được thành lập tại Việt Nam từ 01 năm trở lên tính đến ngày nộp hồ sơ; b) Địa điểm lập cơ sở bán lẻ phải đáp ứng đủ điều kiện theo quy định pháp luật về quản lý đất đai, quy hoạch, đầu tư, xây dựng, phòng cháy chữa cháy, an toàn giao thông, vệ sinh môi trường để lập cơ sở bán lẻ tại khu vực thị trường địa lý liên quan. 2. Trường hợp nhà đầu tư nước ngoài lập cơ sở bán lẻ ngoài cơ sở bán lẻ thứ nhất: a) Trường hợp không phải thực hiện kiểm tra nhu cầu kinh tế: Đáp ứng các điều kiện quy định tại khoản 1 Điều này. b) Trường hợp phải thực hiện kiểm tra nhu cầu kinh tế: Đáp ứng các điều kiện quy định tại khoản 1 Điều này; Đáp ứng tiêu chí Kiểm tra nhu cầu kinh tế quy định tại khoản 2 Điều 22 Nghị định này. 3. Cơ quan cấp Giấy phép xem xét việc đáp ứng các điều kiện, tiêu chí quy định tại khoản 1 và 2 Điều này và căn cứ vào nội dung sau để quyết định cấp Giấy phép lập cơ sở bán lẻ: a) Trường hợp nhà đầu tư nước ngoài thuộc nước, vùng lãnh thổ tham gia Điều ước quốc tế mà Việt Nam là thành viên có cam kết mở cửa thị trường cho hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa: Sự phù hợp với kế hoạch, chiến lược phát triển ngành, lĩnh vực của địa phương, vùng, quốc gia; b) Trường hợp nhà đầu tư nước ngoài không thuộc nước, vùng lãnh thổ tham gia Điều ước quốc tế mà Việt Nam là thành viên: Sự phù hợp với kế hoạch, chiến lược phát triển ngành, lĩnh vực của địa phương, vùng, quốc gia; Tiến trình đàm phán mở cửa thị trường của Việt Nam; Nhu cầu mở cửa thị trường của Việt Nam; Quan hệ ngoại giao, vấn đề an ninh quốc gia, trật tự, an toàn xã hội.'
      trang_pdf: 17
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 22
      noi_dung: '1. Trường hợp phải thực hiện ENT: Nhà đầu tư nước ngoài thuộc nước, vùng lãnh thổ không tham gia Điều ước quốc tế mà Việt Nam là thành viên trong đó có cam kết về việc bãi bỏ ENT, lập cơ sở bán lẻ ngoài cơ sở bán lẻ thứ nhất, trừ trường hợp cơ sở bán lẻ đó có diện tích dưới 500 m2, được lập trong trung tâm thương mại và không thuộc loại hình cửa hàng tiện lợi, siêu thị mini, siêu thị. 2. Tiêu chí ENT: a) Đối với cơ sở bán lẻ có diện tích dưới 5.000 m2: khu vực thị trường địa lý chịu ảnh hưởng được xem xét ở cấp xã/phường hoặc tương đương. Đối với cơ sở bán lẻ có diện tích từ 5.000 m2 trở lên: khu vực thị trường địa lý chịu ảnh hưởng được xem xét ở cấp tỉnh/thành phố trực thuộc trung ương. b) Tác động của cơ sở bán lẻ tới sự ổn định của thị trường, hoạt động kinh doanh của các cơ sở bán lẻ, chợ truyền thống đang hoạt động trong khu vực thị trường địa lý; nhu cầu của khu vực thị trường địa lý và khả năng đáp ứng của cơ sở bán lẻ dự kiến lập mới để khẳng định sự cần thiết mở cơ sở bán lẻ đó. c) Khả năng đóng góp của cơ sở bán lẻ đối với sự phát triển kinh tế - xã hội của khu vực thị trường địa lý chịu ảnh hưởng, cụ thể: Đóng góp cho sự phát triển và hiện đại hóa ngành bán lẻ trong khu vực thị trường địa lý; Cải thiện điều kiện sống của dân cư trong khu vực thị trường địa lý. d) Sự phù hợp của cơ sở bán lẻ đối với yêu cầu đảm bảo: an ninh, trật tự, an toàn xã hội của khu vực thị trường địa lý; an ninh biên giới, hải đảo, khu quân sự.'
      trang_pdf: 18
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 38
      noi_dung: '1. Báo cáo của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài a) Định kỳ hàng năm, trước ngày 15 tháng 01 và ngày 15 tháng 7, tổ chức kinh tế có vốn đầu tư nước ngoài có trách nhiệm báo cáo tình hình thực hiện hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa của kỳ báo cáo năm và kỳ báo cáo 06 tháng đầu năm (Mẫu số 14 tại Phụ lục ban hành kèm theo Nghị định này); b) Trường hợp cần thiết, nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài báo cáo, cung cấp tài liệu hoặc giải trình những vấn đề có liên quan đến hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa, hoạt động của cơ sở bán lẻ theo yêu cầu của cơ quan quản lý nhà nước có thẩm quyền; c) Tổ chức kinh tế có vốn đầu tư nước ngoài nộp báo cáo theo một trong các cách thức sau: trực tiếp tại Bộ phận Một cửa; qua dịch vụ bưu chính công ích theo quy định của Thủ tướng Chính phủ; qua thuê dịch vụ của doanh nghiệp, cá nhân hoặc qua ủy quyền theo quy định của pháp luật hoặc trên môi trường điện tử của Cơ sở dữ liệu (nếu đủ điều kiện áp dụng). 2. Báo cáo của Cơ quan cấp Giấy phép a) Định kỳ hàng năm, trước ngày 30 tháng 01 và ngày 31 tháng 7, Cơ quan cấp Giấy phép báo cáo Bộ Công Thương, Bộ Công an, Bộ Quốc phòng về tình hình thực hiện công tác quản lý nhà nước theo quy định của Nghị định này cho kỳ báo cáo năm và kỳ báo cáo 06 tháng đầu năm (Mẫu số 15 tại Phụ lục ban hành kèm theo Nghị định này); b) Trường hợp cần thiết, Cơ quan cấp Giấy phép báo cáo, cung cấp thông tin về tình hình thực hiện công tác quản lý nhà nước và những vấn đề có liên quan đến hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa, hoạt động của cơ sở bán lẻ theo yêu cầu của cơ quan quản lý nhà nước có thẩm quyền. 3. Thời gian chốt số liệu báo cáo trong chế độ báo cáo định kỳ a) Thời gian chốt số liệu báo cáo định kỳ hàng năm tính từ ngày 01 tháng 01 đến hết ngày 31 tháng 12 của năm báo cáo; b) Thời gian chốt số liệu báo cáo định kỳ 6 tháng đầu năm được tính từ ngày 01 tháng 01 đến hết ngày 30 tháng 6 của kỳ báo cáo.'
      trang_pdf: 29
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 44
      noi_dung: '1. Tổ chức kinh tế có vốn đầu tư nước ngoài, tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư đã được cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ trước ngày Nghị định này có hiệu lực được tiếp tục thực hiện các hoạt động kinh doanh đã được cấp phép. 2. Tổ chức kinh tế có vốn đầu tư nước ngoài, tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư, đã được cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ trước ngày Nghị định này có hiệu lực khi có đề nghị điều chỉnh nội dung quy định tại khoản 1 Điều 10 Nghị định này tại các giấy tờ trên thì phải làm thủ tục theo quy định tại Điều 14 và 15 Nghị định này hoặc khi có đề nghị điều chỉnh nội dung quy định tại các điểm a, b, c, d, đ, g và h khoản 1 Điều 24 Nghị định này tại các giấy tờ trên thì phải làm thủ tục theo quy định tại Điều 29 và 30 Nghị định này. Cơ quan cấp Giấy phép cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ ghi nhận lại nội dung đã được cấp phép và ghi nội dung mới được chấp thuận điều chỉnh. 3. Trường hợp có sự thay đổi về địa chỉ trụ sở chính, địa chỉ cơ sở bán lẻ của tổ chức kinh tế có vốn đầu tư nước ngoài theo quy định về sắp xếp đơn vị hành chính cấp tỉnh, tổ chức kinh tế có vốn đầu tư nước ngoài được tiếp tục hoạt động theo Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ đã được cấp mà không phải thực hiện thủ tục điều chỉnh Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ. 4. Tổ chức kinh tế có vốn đầu tư nước ngoài, tổ chức kinh tế thuộc trường hợp quy định tại khoản 1 Điều 20 Luật Đầu tư chưa được cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ nhưng đã có Giấy chứng nhận đăng ký doanh nghiệp, Giấy chứng nhận đăng ký đầu tư hoặc giấy tờ có giá trị pháp lý tương đương có nội dung hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa, nội dung lập cơ sở bán lẻ, được cấp trước ngày Nghị định số 09/2018/NĐ-CP ngày 15 tháng 01 năm 2018 có hiệu lực, và thuộc diện phải cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ theo quy định tại Nghị định này, khi có đề nghị điều chỉnh nội dung quy định tại khoản 1 Điều 10 Nghị định này tại các giấy tờ trên thì phải làm thủ tục theo quy định tại Điều 14 và 15 Nghị định này hoặc khi có đề nghị điều chỉnh nội dung quy định tại các điểm a, b, c, d, đ, g và h khoản 1 Điều 24 Nghị định này tại các giấy tờ trên thì phải làm thủ tục theo quy định tại Điều 29 và 30 Nghị định này. Cơ quan cấp Giấy phép cấp Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ ghi nhận lại nội dung đã được cấp phép và ghi nội dung mới được chấp thuận điều chỉnh (Mẫu số 12, 13 tại Phụ lục ban hành kèm theo Nghị định này). 5. Đối với các hồ sơ cấp, cấp lại, điều chỉnh, thu hồi Giấy phép kinh doanh; cấp, cấp lại, điều chỉnh, gia hạn, thu hồi Giấy phép lập cơ sở bán lẻ đã được các Cơ quan cấp Giấy phép tiếp nhận trước ngày Nghị định này có hiệu lực, việc cấp, cấp lại, điều chỉnh, gia hạn, thu hồi Giấy phép kinh doanh, Giấy phép lập cơ sở bán lẻ thực hiện theo quy định của Nghị định số 09/2018/NĐ-CP ngày 15 tháng 01 năm 2018 và Điều 36 Nghị định số 146/2025/NĐ-CP ngày 12 tháng 6 năm 2025. Trong trường hợp hồ sơ chưa đầy đủ, hợp lệ nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài thực hiện giải trình bổ sung theo yêu cầu của Cơ quan cấp Giấy phép trong thời hạn không quá 06 tháng kể từ ngày Cơ quan cấp Giấy phép ban hành văn bản yêu cầu giải trình bổ sung. Quá thời hạn trên, việc cấp, cấp lại, điều chỉnh, thu hồi Giấy phép kinh doanh, cấp, cấp lại, điều chỉnh, gia hạn, thu hồi Giấy phép lập cơ sở bán lẻ thực hiện theo quy định tại Nghị định này.'
      trang_pdf: 39
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
    - dieu: 45
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 10 năm 2026. 2. Nghị định này thay thế Nghị định số 09/2018/NĐ-CP ngày 15 tháng 01 năm 2018 của Chính phủ quy định chi tiết Luật Thương mại và Luật Quản lý ngoại thương về hoạt động mua bán hàng hóa và các hoạt động liên quan trực tiếp đến mua bán hàng hóa của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài tại Việt Nam; bãi bỏ Điều 36 Nghị định 146/2025/NĐ-CP ngày 12 tháng 6 năm 2025 của Chính phủ quy định về phân quyền, phân cấp trong lĩnh vực công nghiệp và thương mại. 3. Trường hợp các văn bản quy phạm pháp luật được viện dẫn tại Nghị định này được sửa đổi, bổ sung, thay thế thì áp dụng theo quy định của văn bản quy phạm pháp luật được sửa đổi, bổ sung, thay thế đó. 4. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm hướng dẫn và thi hành Nghị định này.'
      trang_pdf: 40
      sha256_pdf: 22f16f75c82b06e47a8f9d1af0b42e04b38a19e307e4aec7ff7d0fb6347fe30b
ghi_chu: 'Trinh sát đêm 9/11, nạp toàn văn và đối chiếu hiệu lực ngày 12/11. Quy định quyền xuất khẩu, quyền nhập khẩu, quyền phân phối của nhà đầu tư nước ngoài và tổ chức kinh tế có vốn đầu tư nước ngoài (hướng dẫn Điều 22 Luật Thương mại 36/2005/QH11 và Điều 5 Luật Quản lý ngoại thương 05/2017/QH14). Điều 45 khoản 2 còn bãi bỏ Điều 36 Nghị định 146/2025/NĐ-CP — chưa ghi vào quan_he vì NĐ 146/2025/NĐ-CP chưa có trong sổ.'
