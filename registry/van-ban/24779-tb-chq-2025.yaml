  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/19/3.VBDI_24779.pdf, id=101367, SHA-256 a98a7aad75f60a90abcc18851c5639ccb227508a3dfbdecd39e7e37727896ae0): Thông báo số 24779/TB-CHQ ngày 17-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Loa chưa lắp vào vỏ loa (Unit speaker, ký, mã hiệu HUNFW00029A; cấu tạo gồm nắp che bụi, màng loa, cuộn dây đồng, màng nhện, đầu kết nối dây dẫn, khung, đế nam châm, 2 nam châm chính, tấm đỡ, dây dẫn tín hiệu, vòng ổn định từ trường và đệm chống rung; tần số 46Hz~3.5kHz, công suất 80W, điện áp hoạt động 0~17,88V/AC, kích thước đường kính x chiều cao 169.6 x 120.7 mm, trọng lượng 2930 g, sử dụng để sản xuất sản phẩm loa siêu trầm sub woofer), phân loại vào nhóm 85.18, phân nhóm 8518.29, mã số 8518.29.90; có hiệu lực từ ngày ký'
