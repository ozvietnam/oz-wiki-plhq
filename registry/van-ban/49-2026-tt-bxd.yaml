  dieu_khoan:
    - dieu: 1
      noi_dung: 'Thông tư này ban hành Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao lĩnh vực giao thông vận tải thuộc phạm vi quản lý của Bộ Xây dựng kèm theo mã số HS phù hợp với Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam và yêu cầu quản lý chất lượng tương ứng.'
      trang_pdf: 1
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 3
      khoan: 1
      noi_dung: 'Danh mục sản phẩm, hàng hóa có mức độ rủi ro cao được quy định tại Phụ lục I ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 3
      khoan: 2
      noi_dung: 'Sản phẩm, hàng hóa có mức độ rủi ro cao quy định tại mục I, mục II, mục III, mục IV Phụ lục I ban hành kèm theo Thông tư này phải được chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định của pháp luật về trật tự, an toàn giao thông đường bộ.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 3
      khoan: 3
      noi_dung: 'Sản phẩm, hàng hóa có mức độ rủi ro cao được quy định tại mục V Phụ lục I ban hành kèm theo Thông tư này phải được chứng nhận chất lượng an toàn kỹ thuật theo quy định của pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 4
      khoan: 1
      noi_dung: 'Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình được quy định tại Phụ lục II ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 4
      khoan: 2
      noi_dung: 'Sản phẩm, hàng hóa có mức độ rủi ro trung bình quy định tại mục I Phụ lục II ban hành kèm theo Thông tư này phải được công bố hợp quy theo quy định tại khoản 1 Điều 48 Luật Tiêu chuẩn và quy chuẩn kỹ thuật năm 2006 được sửa đổi, bổ sung năm 2018, năm 2025.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 4
      khoan: 3
      noi_dung: 'Sản phẩm, hàng hóa có mức độ rủi ro trung bình được quy định tại mục II Phụ lục II ban hành kèm theo Thông tư này phải được chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định của pháp luật về trật tự, an toàn giao thông đường bộ.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 4
      khoan: 4
      noi_dung: 'Sản phẩm, hàng hóa có mức độ rủi ro trung bình được quy định tại mục III Phụ lục II ban hành kèm theo Thông tư này phải được chứng nhận theo quy định của pháp luật về đường sắt.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 5
      khoan: 1
      noi_dung: 'Việc truy xuất nguồn gốc sản phẩm, hàng hóa được thực hiện theo quy định tại Điều 22 Nghị định số 37/2026/NĐ-CP của Chính phủ quy định chi tiết thi hành một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Chất lượng sản phẩm, hàng hóa.'
      trang_pdf: 2
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 1
      noi_dung: 'Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026, trừ trường hợp quy định tại khoản 2 Điều này.'
      trang_pdf: 3
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 2
      noi_dung: 'Khoản 1, khoản 2 và khoản 3 Điều 5 Thông tư này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2029.'
      trang_pdf: 3
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 3
      noi_dung: 'Bãi bỏ các Thông tư và một số điều tại các Thông tư đã ban hành kể từ khi Thông tư này có hiệu lực thi hành, cụ thể như sau:'
      trang_pdf: 3
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 3
      diem: a
      noi_dung: 'Thông tư số 12/2022/TT-BGTVT của Bộ trưởng Bộ Giao thông vận tải quy định danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Giao thông vận tải.'
      trang_pdf: 3
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 3
      diem: b
      noi_dung: 'Thông tư số 62/2024/TT-BGTVT của Bộ trưởng Bộ Giao thông vận tải sửa đổi, bổ sung một số điều của Thông tư số 12/2022/TT-BGTVT của Bộ trưởng Bộ Giao thông vận tải quy định danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Giao thông vận tải.'
      trang_pdf: 3
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 3
      diem: c
      noi_dung: 'Chương X, Phụ lục II và Phụ lục III của Thông tư số 71/2025/TT-BXD của Bộ trưởng Bộ Xây dựng sửa đổi, bổ sung một số điều của các Thông tư để cắt giảm, đơn giản hóa thủ tục hành chính trong lĩnh vực đăng kiểm, hàng không dân dụng và thanh tra thuộc trách nhiệm quản lý của Bộ Xây dựng.'
      trang_pdf: 4
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 6
      khoan: 4
      noi_dung: 'Trường hợp các văn bản quy phạm pháp luật, tài liệu được viện dẫn trong Thông tư này sửa đổi, bổ sung hoặc thay thế thì thực hiện theo các văn bản quy phạm pháp luật, tài liệu được sửa đổi, bổ sung hoặc thay thế đó.'
      trang_pdf: 4
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 7
      khoan: 1
      noi_dung: 'Sản phẩm, hàng hóa nhập khẩu không thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư này nhưng thuộc danh mục sản phẩm, hàng hóa quy định tại Thông tư số 12/2022/TTBGTVT được sửa đổi, bổ sung bởi Thông tư số 71/2025/TT-BXD, đã được cấp bản đăng ký kiểm tra chất lượng an toàn kỹ thuật và bảo vệ môi trường xe nhập khẩu hoặc bản đăng ký kiểm tra chất lượng an toàn kỹ thuật và bảo vệ môi trường phụ tùng xe cơ giới nhập khẩu trước ngày Thông tư này có hiệu lực thì tiếp tục hoàn thành thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định tại thời điểm được cấp bản đăng ký kiểm tra nêu trên.'
      trang_pdf: 4
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
    - dieu: 7
      khoan: 2
      noi_dung: 'Sản phẩm, hàng hóa nhập khẩu thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư này nhưng không thuộc danh mục sản phẩm, hàng hóa quy định tại Thông tư số 12/2022/TT-BGTVT, được sửa đổi, bổ sung bởi Thông tư số 71/2025/TT-BXD, đã đăng ký tờ khai hải quan trước ngày Thông tư này có hiệu lực thì tiếp tục hoàn thành thủ tục nhập khẩu theo quy định tại thời điểm đăng ký tờ khai hải quan.'
      trang_pdf: 4
      sha256_pdf: 5aa4a08ae151bf337b047ac96817bf7998ec23e2da3ad999b3e2098c50fd3f6d
ghi_chu: 'PL I rủi ro cao: ô tô, mô tô, xe gắn máy, xe bốn bánh có động cơ; PL II rủi ro trung bình: phương tiện, phụ tùng, thiết bị GTVT, đường sắt. Bài tổng hợp KTCN 2026 (nguồn thứ cấp) — xem hs-code-api data/ktcn-regime-2026.json. PL I rủi ro cao / PL II rủi ro trung bình (GTVT). Người ký Nguyễn Xuân Sang (Thứ trưởng). PL I rủi ro cao: ô tô, mô tô, xe gắn máy, xe bốn bánh có động cơ; PL II rủi ro trung bình: phương tiện, phụ tùng, thiết bị GTVT, đường sắt. Tên theo mẫu chung. Bài tổng hợp KTCN 2026 (nguồn thứ cấp, có trích nguyên văn điều luật) — xem hs-code-api data/ktcn-regime-2026.json. Bản datafiles 49-bxd.signed.pdf chỉ có phần chính (4 trang), không kèm phụ lục. Dùng Công báo CDN (20 trang) có Phụ lục I–II.'
