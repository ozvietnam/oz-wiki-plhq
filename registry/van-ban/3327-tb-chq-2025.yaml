  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/29/VB_3327.pdf, id=99940, SHA-256 3635fe852d5be56d52163356f918732257ec50d14f0221b6256cef9225eb8b6e): Thông báo số 3327/TB-CHQ ngày 25-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị thông báo thanh toán chuyển khoản thành công (tên gọi theo cấu tạo, công dụng: Thiết bị thông báo thanh toán chuyển khoản thành công, là loa có chức năng thông báo số tiền chuyển khoản đến tài khoản nhận tiền thành công bằng âm thanh, không tích hợp màn hình hiển thị; ký, mã hiệu Tingee 3S, nhà sản xuất Shenzhen Hemi Zhilian Technology Co., Ltd; kết nối 4G LTE CAT1/Wi-Fi 2.4GHz, loa 3W, pin Li-Polymer 2200mAh 3.8V, cổng sạc Type-C 5V/1A, kích thước 100x66x44mm, trọng lượng 157g), phân loại vào nhóm 85.18, phân nhóm 8518.21, mã số 8518.21.10; có hiệu lực từ ngày ký'
