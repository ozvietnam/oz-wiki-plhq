ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị thông báo thanh toán chuyển khoản thành công (ký, mã hiệu Tingee 3S, nhà sản xuất Shenzhen Hemi Zhilian Technology Co., Ltd; sản phẩm là loa có chức năng thông báo số tiền chuyển khoản đến tài khoản nhận tiền thành công bằng âm thanh qua kết nối 4G LTE/Wi-Fi, không tích hợp màn hình hiển thị, loa 3W, pin Li-Polymer 2200mAh, kích thước 100x66x44mm, trọng lượng 157g) thuộc nhóm 85.18, phân nhóm 8518.21, mã số 8518.21.10.'
