  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/4/VB_8881.pdf.PDF, id=102550, 4 trang gồm cả công văn 358/TY-KD ngày 08-03-2019 đính kèm, Phó Cục trưởng Âu Anh Tuấn ký ngày 04-02-2026, SHA-256 97e6e0c20223be02fc26763d238211c6923aa116addf391fca3f51e97a4775d8): Công văn hỏa tốc số 8881/CHQ-GSQL ngày 04-02-2026 của Cục Hải quan gửi Cục Chăn nuôi và Thú y (Bộ Nông nghiệp và Môi trường) phản ánh vướng mắc khi Nghị định số 46/2026/NĐ-CP ngày 26-01-2026 thay thế Nghị định 15/2018/NĐ-CP nhưng chưa có quy định chuyển tiếp về trình tự, thủ tục kiểm tra ATTP đối với sản phẩm động vật trên cạn, sản phẩm thủy sản nhập khẩu làm thực phẩm (vừa phải kiểm dịch vừa phải kiểm tra ATTP), đề nghị Cục Chăn nuôi và Thú y xem xét hướng dẫn thực hiện thông quan trên cơ sở Giấy chứng nhận kiểm dịch nhập khẩu (mẫu 15b, mẫu 10TS) như đã hướng dẫn tại công văn 358/TY-KD ngày 08-03-2019 để kịp thời giải tỏa ùn tắc tại cửa khẩu'
