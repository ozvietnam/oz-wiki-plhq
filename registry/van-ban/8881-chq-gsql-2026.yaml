ghi_chu: 'Phản ánh vướng mắc chuyển tiếp của Nghị định 46/2026/NĐ-CP và đề xuất tháo gỡ thủ tục kiểm dịch kết hợp kiểm tra nhà nước về ATTP đối với sản phẩm động vật trên cạn, thủy sản nhập khẩu làm thực phẩm.'
