ghi_chu: 'Sửa TT 38/2015 (có Điều 86 XNK tại chỗ) và TT 39/2018; Điều 2 bãi bỏ một phần TT 39/2015, 06/2021, 47/2025 và một số mẫu TT 14/2015 — chưa ghi thành quan hệ (văn bản chưa có đủ trong sổ). PR #120 mục 4: TT 121/2025 có sửa mục 1.78 PL II TT 39/2018 — đã xác minh từ Công báo số 60/2026. Đầu mối: trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) — mọi thông tin dưới đây lấy từ nguồn bậc A, không lấy từ trang đó.'
