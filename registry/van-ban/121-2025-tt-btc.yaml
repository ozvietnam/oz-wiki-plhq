    - dieu: 1
      khoan: 4
      noi_dung: 'Điều 16. Hồ sơ hải quan khi làm thủ tục hải quan 1. Hồ sơ hải quan đối với hàng hóa xuất khẩu a) Tờ khai hải quan; b) Hóa đơn thương mại hoặc chứng từ có giá trị tương đương trong trường hợp người mua phải thanh toán cho người bán. Trường hợp hóa đơn thương mại được cấp dưới dạng điện tử theo quy định tại điểm 2a Điều 8 Nghị định 123/2020/NĐ-CP ngày 19/10/2020 được sửa đổi, bổ sung bởi khoản 5 Điều 1 Nghị định 70/2025/NĐ-CP ngày 20/3/2025 của Chính phủ trước thời điểm khai báo hải quan thì người khai hải quan không phải nộp cho cơ quan hải quan khi làm thủ tục hải quan; c) Giấy phép xuất khẩu hoặc văn bản cho phép xuất khẩu của cơ quan có thẩm quyền theo quy định pháp luật (sau đây gọi tắt là giấy phép xuất khẩu); d) Giấy thông báo miễn kiểm tra hoặc giấy thông báo kết quả kiểm tra chuyên ngành hoặc chứng từ khác theo quy định của pháp luật (sau đây gọi tắt là Giấy chứng nhận kiểm tra chuyên ngành); đ) Chứng từ chứng minh tổ chức, cá nhân đủ điều kiện xuất khẩu hàng hóa theo quy định của pháp luật về đầu tư; e) Hợp đồng ủy thác đối với trường hợp ủy thác xuất khẩu hàng hóa thuộc diện phải có các chứng từ quy định tại điểm c, điểm d, điểm đ khoản này; g) Đối với hàng hóa xuất khẩu của thương nhân nước ngoài không có hiện diện tại Việt Nam thực hiện quyền xuất khẩu: Giấy chứng nhận đăng ký quyền xuất khẩu của thương nhân nước ngoài không có hiện diện tại Việt Nam do Bộ Công Thương cấp; h) Đối với doanh nghiệp có vốn đầu tư nước ngoài thực hiện quyền xuất khẩu: Giấy chứng nhận đầu tư về hoạt động mua bán hàng hóa và các hoạt động liên quan đến mua bán hàng hóa của thương nhân có vốn đầu tư nước ngoài có đăng ký quyền xuất khẩu; Trường hợp không phải thực hiện cấp Giấy chứng nhận đầu tư thì nộp chứng từ tương đương. Trường hợp thực hiện thủ tục hải quan tại cùng một cơ quan hải quan thì người khai hải quan chỉ phải nộp các chứng từ quy định tại điểm g và điểm h khoản này lần đầu khi làm thủ tục hải quan.'
      trang_pdf: 5
      sha256_pdf: a210244bdded36cc9d5ca7b7b7f00c0d53f3623c2dda75b3ee5fbf4462a92ead
    - dieu: 1
      khoan: 6
      diem: a
      noi_dung: Người khai hải quan phải khai đầy đủ các thông tin trên tờ khai hải quan theo các chỉ tiêu thông tin quy định tại mẫu số 01 hoặc mẫu số 02 Phụ lục II ban hành kèm Thông tư này và các chứng từ thuộc hồ sơ hải quan quy định tại Điều 16 Thông tư này theo các chỉ tiêu thông tin quy định tại mẫu số 03 Phụ lục II ban hành kèm Thông tư này cho cơ quan hải quan thông qua Hệ thống xử lý dữ liệu điện tử hải quan. Trường hợp Hệ thống xử lý dữ liệu điện tử hải quan chưa có chức năng tiếp nhận chỉ tiêu thông tin quy định tại mẫu số 03 Phụ lục II ban hành kèm Thông tư này, người khai hải quan nộp bản scan có xác nhận bằng chữ ký số các chứng từ thuộc hồ sơ hải quan cho cơ quan hải quan thông qua hệ thống. Cơ quan hải quan có trách nhiệm thông báo trên trang thông tin điện tử hải quan thời điểm Hệ thống xử lý dữ liệu điện tử hải quan có chức năng tiếp nhận chỉ tiêu thông tin quy định tại mẫu số 03 Phụ lục II ban hành kèm theo Thông tư này. Trường hợp khai trên tờ khai hải quan giấy thì người khai hải quan nộp 02 bản chính tờ khai hải quan theo hướng dẫn tại Phụ lục IV ban hành kèm Thông tư này và nộp, xuất trình bộ hồ sơ hải quan theo quy định tại Điều 3, Điều 16 Thông tư này cho cơ quan hải quan khi đăng ký tờ khai hải quan. Trường hợp nhập khẩu nguyên liệu, vật tư để gia công, sản xuất xuất khẩu, và xuất khẩu sản phẩm gia công, sản xuất xuất khẩu, người khai hải quan phải khai mã sản phẩm xuất khẩu, mã nguyên liệu, vật tư nhập khẩu phù hợp với thực tế quản trị, sản xuất của người khai hải quan tại chỉ tiêu mô tả hàng hóa theo hướng dẫn của Phụ lục II ban hành kèm Thông tư này trên tờ khai hải quan khi làm thủ tục nhập khẩu, xuất khẩu;
      trang_pdf: 18
      sha256_pdf: a210244bdded36cc9d5ca7b7b7f00c0d53f3623c2dda75b3ee5fbf4462a92ead
    - dieu: 1
      khoan: 8
      noi_dung: 'Điều 20. Khai bổ sung hồ sơ hải quan hàng hóa xuất khẩu, nhập khẩu Khai bổ sung hồ sơ hải quan đối với hàng hóa xuất khẩu, nhập khẩu là việc khai sửa đổi, bổ sung thông tin tờ khai hải quan và nộp các chứng từ liên quan đến khai sửa đổi, bổ sung. 1. Các trường hợp khai bổ sung Trừ các chỉ tiêu thông tin trên tờ khai hải quan không được khai bổ sung quy định tại mục 3 Phụ lục II ban hành kèm Thông tư này, người khai hải quan được khai bổ sung các chỉ tiêu thông tin trên tờ khai hải quan và nộp bổ sung hồ sơ trong các trường hợp sau: a) Khai bổ sung trong thông quan: a.1) Người khai hải quan, người nộp thuế được khai bổ sung hồ sơ hải quan trước thời điểm cơ quan hải quan thông báo kết quả phân luồng tờ khai hải quan cho người khai hải quan; a.2) Người khai hải quan, người nộp thuế phát hiện sai sót trong việc khai hải quan sau thời điểm cơ quan hải quan thông báo kết quả phân luồng nhưng trước khi thông quan thì được khai bổ sung hồ sơ hải quan và bị xử lý theo quy định của pháp luật; b) Khai bổ sung sau khi hàng hóa đã được thông quan: Trừ nội dung khai bổ sung liên quan đến giấy phép xuất khẩu, nhập khẩu; kiểm tra chuyên ngành về chất lượng hàng hóa, y tế, văn hóa, kiểm dịch động vật, thực vật, an toàn thực phẩm, người khai hải quan thực hiện khai bổ sung sau thông quan trong các trường hợp sau: b.1) Người khai hải quan, người nộp thuế xác định có sai sót trong việc khai hải quan thì được khai bổ sung hồ sơ hải quan trong thời hạn 60 ngày kể từ ngày thông quan nhưng trước thời điểm cơ quan hải quan quyết định kiểm tra sau thông quan; b.2) Quá thời hạn 60 ngày kể từ ngày thông quan hoặc sau khi cơ quan hải quan quyết định kiểm tra sau thông quan, người khai hải quan, người nộp thuế mới phát hiện sai sót trong việc khai hải quan thì thực hiện khai bổ sung và bị xử lý theo quy định của pháp luật (nếu có).'
      trang_pdf: 22
      sha256_pdf: a210244bdded36cc9d5ca7b7b7f00c0d53f3623c2dda75b3ee5fbf4462a92ead
    - dieu: 1
      khoan: 14
      diem: b
      noi_dung: 'Việc kiểm tra thực tế để xác định tên hàng, mã số hàng hóa, trị giá hải quan, xuất xứ, hàng hóa đã qua sử dụng hoặc chưa qua sử dụng: thực hiện theo quy định tại các Điều 24, Điều 25 và Điều 27 Thông tư này. Trường hợp Hệ thống chỉ định kiểm tra, đánh giá tiêu chí kỹ thuật bằng máy móc, trang thiết bị hoặc công chức hải quan thực hiện kiểm tra trực tiếp hoặc kiểm tra thực tế hàng hóa bằng các máy móc, thiết bị kỹ thuật hiện có tại cơ quan Hải quan nơi kiểm tra thực tế hàng hóa không xác định được đầy đủ các tiêu chí kỹ thuật đảm bảo xác định chính xác đối với nội dung khai của người khai hải quan thì Đội trưởng Hải quan quyết định việc yêu cầu kiểm tra, đánh giá tiêu chí kỹ thuật bằng máy móc, trang thiết bị tại cơ quan kiểm định hải quan hoặc giám định, thử nghiệm cụ thể như sau: a) Đối với mặt hàng thuộc Danh mục tiêu chí kỹ thuật tiếp nhận thực hiện tại cơ quan kiểm định hải quan thì lấy mẫu và lập hồ sơ gửi cơ quan kiểm định hải quan để kiểm tra, đánh giá tiêu chí kỹ thuật bằng máy móc, trang thiết bị. a.1) Hồ sơ gồm: a.1.1) Phiếu yêu cầu kiểm tra, đánh giá tiêu chí kỹ thuật hàng hoá xuất khẩu, nhập khẩu bằng máy móc, trang thiết bị tại cơ quan kiểm định hải quan, kiêm Biên bản lấy mẫu hàng hóa (theo mẫu số 44-PYCKT/KĐHQ Phụ lục V ban hành kèm Thông tư này); a.1.2) Phiếu ghi số, ngày văn bản, chứng từ thuộc hồ sơ hải quan liên quan đến mẫu hàng hóa (trong trường hợp khai tờ khai hải quan giấy); a.1.3) Phiếu ghi kết quả kiểm tra thực tế hàng hóa theo mẫu số 06/PGKQKT/GSQL Phụ lục V ban hành kèm Thông tư này; a.1.4) Mẫu hàng hóa yêu cầu kiểm tra, đánh giá; a.1.5) Tài liệu kỹ thuật của hàng hóa hoặc bản phân tích thành phần sản phẩm. Cơ quan hải quan nơi gửi mẫu có chỉ thị qua Hệ thống hoặc bằng văn bản yêu cầu người khai hải quan cung cấp tài liệu kỹ thuật hoặc bản phân tích thành phần sản phẩm. Trường hợp không có tài liệu kỹ thuật hoặc bản phân tích thành phần sản phẩm thì cơ quan hải quan nơi gửi hồ sơ phải nêu rõ lý do và chỉ thị hoặc có văn bản yêu cầu người khai hải quan theo mẫu số 44-PYCKT/KĐHQ Phụ lục V ban hành kèm Thông tư này. a.2) Kết quả kiểm tra, đánh giá tiêu chí kỹ thuật bằng máy móc, trang thiết bị tại cơ quan kiểm định hải quan được ghi lại theo mẫu số 43-KQKTĐG/KĐHQ Phụ lục V ban hành kèm Thông tư này. Thông báo này là cơ sở để phân loại hàng hóa, xác định mức thuế, thực hiện chính sách quản lý hàng hóa.'
      trang_pdf: 43
      sha256_pdf: a210244bdded36cc9d5ca7b7b7f00c0d53f3623c2dda75b3ee5fbf4462a92ead
    - dieu: 1
      khoan: 53
      noi_dung: 'Điều 86. Thủ tục hải quan đối với hàng hóa xuất khẩu, nhập khẩu tại chỗ 1. Hàng hoá xuất nhập khẩu tại chỗ thực hiện theo quy định tại khoản 3 Điều 3 Luật sửa đổi, bổ sung một số điều của Luật Đấu thầu, Luật Đầu tư theo phương thức đối tác công tư, Luật Hải quan, Luật Thuế giá trị gia tăng, Luật Thuế xuất khẩu, thuế nhập khẩu, Luật Đầu tư, Luật Đầu tư công, Luật Quản lý, sử dụng tài sản công; Điều 35 Nghị định số 08/2015/NĐ-CP ngày 21/01/2015 được sửa đổi, bổ sung bởi khoản 19 Điều 1 Nghị định số 167/2025/NĐ-CP ngày 30/6/2025 của Chính phủ. 2. Địa điểm làm thủ tục hải quan: thực hiện tại cơ quan hải quan thuận tiện do người khai hải quan lựa chọn và theo quy định của từng loại hình. 3. Hồ sơ hải quan Hồ sơ hải quan hàng hóa xuất khẩu, nhập khẩu tại chỗ thực hiện theo quy định tại Điều 16 Thông tư này. 4. Thời hạn làm thủ tục hải quan: Trong thời hạn 15 ngày kể từ ngày hàng hóa xuất khẩu thông quan hoặc giải phóng hàng, người nhập khẩu tại chỗ phải làm thủ tục hải quan.'
      trang_pdf: 105
      sha256_pdf: a210244bdded36cc9d5ca7b7b7f00c0d53f3623c2dda75b3ee5fbf4462a92ead
    - dieu: 1
      khoan: 63
      noi_dung: 'Điều 142. Kiểm tra sau thông quan tại trụ sở cơ quan hải quan 1. Các trường hợp kiểm tra, thẩm quyền quyết định kiểm tra a) Đội trưởng Hải quan có thẩm quyền quyết định kiểm tra đối với các hồ sơ hải quan phát sinh tại đơn vị trong thời hạn 60 ngày kể từ ngày hàng hóa được thông quan đến ngày ký ban hành quyết định kiểm tra, cụ thể như sau: a.1) Các trường hợp kiểm tra theo quy định tại khoản 1 Điều 78 Luật số 54/2014/QH13; a.2) Các trường hợp qua phân tích đánh giá rủi ro theo quy định tại khoản 2 Điều 78 Luật Hải quan; a.3) Không thực hiện kiểm tra đối với các trường hợp sau: a.3.1) Hồ sơ hải quan của các lô hàng giống hệt, tương tự với hồ sơ của lô hàng đã kiểm tra sau thông quan và chấp nhận nội dung khai báo của cùng người khai hải quan, nếu không có thông tin mới hoặc dấu hiệu vi phạm khác. Trường hợp hồ sơ các lô hàng giống hệt, tương tự vẫn còn dấu hiệu nghi vấn thì Đội trưởng Hải quan báo cáo Chi cục trưởng Chi cục Hải quan khu vực xem xét xử lý theo thẩm quyền; a.3.2) Trường hợp khối lượng hàng hóa lớn, chủng loại hàng hóa phức tạp, có rủi ro về thuế cần thiết phải kiểm tra sau thông quan tại trụ sở người khai hải quan.'
