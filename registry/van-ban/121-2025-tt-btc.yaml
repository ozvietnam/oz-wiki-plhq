    - dieu: 1
      khoan: 3
      diem: a
      noi_dung: 'Hồ sơ, mẫu hàng hóa xác định trước mã số a) Đơn đề nghị xác định trước mã số theo mẫu số 01/XĐTMS/NVTHQ Phụ lục VI ban hành kèm Thông tư này; b) Tài liệu kỹ thuật do tổ chức, cá nhân đề nghị xác định trước mã số hàng hóa cung cấp (bản phân tích thành phần, catalogue, hình ảnh hàng hóa): 01 bản; c) Mẫu hàng hóa dự kiến xuất khẩu, nhập khẩu (nếu có). Cơ quan hải quan tiếp nhận và xử lý mẫu hàng hóa dự kiến xuất khẩu, nhập khẩu thực hiện theo quy định tại Điều 10 Thông tư số 14/2015/TT-BTC ngày 30/01/2025 của Bộ trưởng Bộ Tài chính và các văn bản sửa đổi, bổ sung (nếu có) hướng dẫn về phân loại hàng hóa, phân tích để phân loại hàng hóa, phân tích để kiểm tra chất lượng, kiểm tra an toàn thực phẩm đối với hàng hóa xuất khẩu, nhập khẩu. Trường hợp thông tin về hàng hoá tại hồ sơ xác định trước mã số chưa đủ cơ sở để xác định tên gọi, mã số theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam thì cơ quan hải quan có văn bản đề nghị bổ sung chứng thư phân tích, giám định của tổ chức có chức năng giám định theo quy định của pháp luật.'
      trang_pdf: 4
