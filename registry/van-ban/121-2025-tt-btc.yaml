  pham_vi: |
    Công báo số 60 ngày 27-01-2026: ban hành 18-12-2025; Điều 3 khoản 1 hiệu lực 01-02-2026.
    Sửa đổi, bổ sung Phụ lục I (chỉ tiêu thông tin) của TT 38/2015 (đã được sửa bởi TT 39/2018) theo Mục 2 Phụ lục I ban hành kèm theo Thông tư này (điểm a khoản 67 Điều 1).
    Sửa mục 1.78 "Mô tả hàng hóa" Phụ lục II: thêm các trường "hàm lượng, tính chất lý hóa, quy cách đóng gói, nhà sản xuất"; bổ sung "Trường hợp khai gộp mã HS theo quy định tại khoản 2 Điều 18 Thông tư này thì mô tả khái quát hàng hóa"; bổ sung "Trường hợp hàng hóa nhập khẩu là máy móc, thiết bị được phân loại theo bộ phận chính hoặc máy thực hiện chức năng chính hoặc nhóm phù hợp với chức năng xác định của máy hoặc hàng hóa ở dạng chưa lắp ráp hoặc tháo rời được phân loại theo nguyên chiếc thì ... ghi rõ tên chi tiết từng máy móc/thiết bị… đã đăng ký trong Danh mục máy móc, thiết bị là tổ hợp, dây chuyền hoặc tên từng chi tiết, linh kiện rời" (Công báo số 60, trang 144-145).
    Toàn văn đã tải về /tmp/cb60.pdf (4.7MB, 375 trang, sha256 đang cập nhật; chưa nạp vào raw/download/).
