xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=211912) và toàn văn PDF ký số đính kèm (04-vbhn-bkhcn.pdf, 31 trang, Thứ trưởng Lê Xuân Định ký xác thực ngày 15-11-2024): hợp nhất Thông tư 11/2015/TT-BKHCN ngày 26-06-2015 (có hiệu lực từ 11-08-2015) và Thông tư 06/2024/TT-BKHCN ngày 30-09-2024 (có hiệu lực từ 15-11-2024) quy định chi tiết và hướng dẫn thi hành một số điều của Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp; gồm 4 Chương, 32 Điều.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng? ! Thông tư số 06/2024/TT-BKHCN sửa đổi, bỗ sung một số điều của Thông tư số 11/2015/TT-BKHCN ngày 26 tháng 6 năm 2015 của Bộ trưởng Bộ Khoa học và Công nghệ quy định chi tiết và hướng dẫn thi hành Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, có căn cứ ban hành như sau:'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Hình thức xứ phạt bỗ sung! Khi áp dụng hình thức xử phạt bé sung quy định tại Điểm c Khoản 2 Điều 3 Nghị định số 99/2013/NĐ-CP, người có thấm quyền xử phạt vi phạm hành chính áp dụng biện pháp đình chỉ một phần hoặc toàn bộ hoạt động sản xuất, kinh doanh, dịch vụ của tổ chức, cá nhân vi phạm theo nguyên tắc đình chỉ hoạt động sản xuất, kinh doanh, dịch vụ liên quan trực tiếp đến hành vi vi phạm bị xử phạt vi phạm hành chính.
      trang_pdf: 3
    - dieu: 8
      noi_dung: 'Điều 8. Hành vi vi phạm quy định về đại diện sở hữu công nghiệp quy định tại Điều 7 Nghị định 99/2013/NĐ-CP 1. Hành vi đồng thời là đại diện cho các bên tranh chấp với nhau về quyền sở hữu công nghiệp quy định tại Điểm a Khoản 2 Điều 7 Nghị định 99/2013/NĐ-CP được hiểu là một trong các hành vi sau đây:'
      trang_pdf: 8
    - dieu: 10
      noi_dung: Điều 10. Hành vi vi phạm trong lĩnh vực sở hữu công nghiệp trên mang Internet '° 1. Hành vi bị xem xét xảy ra trên mạng Internet khi có đủ các yếu tố quy định tại Khoản 4 Điều 72 Nghị định số 65/2023/NĐ-CP ngày 23 tháng § năm 2023 của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật Sở hữu trí tuệ về sở hữu công nghiệp, bảo vệ quyền sở hữu công nghiệp, quyền đối với giống cây trồng và quản lý nhà nước về sở hữu trí tuệ (sau đây
      trang_pdf: 10
    - dieu: 13
      noi_dung: Điều 13. Hành vi xâm phạm quyền đối với nhãn hiệu !9 Cụm từ “sản phẩm/phần sản phẩm” được thay thế bởi cụm từ “Sản phẩm/bộ phận dé lắp ráp thành sản phẩm phức hợp” theo quy định tại điểm đ khoản | Điều 2 của Thông tư số 06/2024/TT-BKHCN sửa đổi, bỗ sung một số điều của Thông tư số 11/2015/TT-BKHCN ngày 26 tháng 6 năm 2015 của Bộ trưởng Bộ Khoa học và Công nghệ quy định chỉ tiết và hướng dẫn thi hành Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm
      trang_pdf: 12
    - dieu: 16
      noi_dung: 'Điều 16. Hành vi vi phạm về tem, nhãn, vật phẩm 1. Hành vi vi phạm quy định tại Điều 13 Nghị định 99/2013/NĐ-CP được áp dụng trong trường hợp 6 chức, cá nhân phát hiện tem, nhãn hoặc vật phẩm mang nhãn hiệu hoặc chỉ dẫn địa lý giả mạo chưa được gắn lên sản phẩm nhưng có đủ căn cứ để xác định rằng tem, nhãn, vật phẩm đó sẽ được gắn lên sản phẩm dé đưa ra thị trường (vi dụ: thông qua hợp đồng mua bán, hợp đồng in ấn, tài liệu khai báo với cơ quan'
      trang_pdf: 17
    - dieu: 19
      noi_dung: 'Điều 19. Hành vi cạnh tranh không lành mạnh trong lĩnh vực sở hữu công nghiệp 1. Hành vi sử dụng chỉ dẫn thương mại gây nhằm lẫn:'
      trang_pdf: 18
    - dieu: 22
      noi_dung: 'Điều 22. Ủy quyền yêu cầu xử lý hành vi xâm phạm quyền sở hữu công nghiệp ''Š Văn bản ủy quyền khi được nộp kèm theo đơn yêu cầu xử lý xâm phạm phải đáp ứng các điều kiện theo quy định tại Điều 23 Nghị định 99/2013/NĐ-CP và hướng dẫn sau:'
      trang_pdf: 23
    - dieu: 24
      noi_dung: Điều 24. Xem xét, xử lý Don yêu cầu xử lý xâm phạm trong xử phạt vi phạm hành chính”? Trường hợp tài liệu, chứng cứ do người nộp đơn cung cấp chưa đầy đủ thì cơ quan giải quyết đơn có thể yêu cầu các bên cung cấp thông tin, chứng cứ, giải trình theo quy định tại Điểm b và Điểm c Khoản 3 Điều 25 Nghị định 99/2013/NĐ-CP.
      trang_pdf: 26
    - dieu: 32
      noi_dung: Điều 32. Trách nhiệm thực hiện 57 Điều này được bãi bỏ theo quy định tại khoản 2 Điều 2 của Thông tư số 06/2024/TT-BKHCN sửa đổi, bé sung một số điều của Thông tư số 11/2015/TT-BKHCN ngày 26 thang 6 năm 2015 của Bộ trường Bộ Khoa học và Công nghệ quy định chỉ tiết và hướng dẫn thi hành Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp, có hiệu lực kể từ ngày 15
      trang_pdf: 29
ghi_chu: Văn bản hợp nhất Thông tư 11/2015/TT-BKHCN và Thông tư 06/2024/TT-BKHCN hướng dẫn Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp.
