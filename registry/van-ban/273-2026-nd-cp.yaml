xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF ký số 66 trang của Chính phủ trên Cổng thông tin điện tử Hải quan (raw/download/files.customs.gov.vn/273-2026-nd-cp.pdf, Phó Thủ tướng Nguyễn Văn Thắng ký ngày 07-07-2026, SHA-256 9c72fcf8b95f57f889439ded604be6a732793b05d9c8ce016539970498dbe825) và trang wiki/sources/273-2026-nd-cp.md: gồm 3 chương, 22 điều và 3 Phụ lục quy định về quản lý hải quan, thủ tục hải quan, kiểm tra, giám sát hải quan đối với hoạt động kinh doanh hàng miễn thuế; khoản 1 và khoản 2 Điều 22 quy định có hiệu lực thi hành từ ngày 21-08-2026 và thay thế Nghị định số 100/2020/NĐ-CP ngày 28-08-2020 (khoản 3 Điều 22 thay thế biểu mẫu tại Phụ lục III Nghị định 181/2025/NĐ-CP); đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định về quản lý hải quan, thủ tục hải quan, kiểm tra, giám sát hải quan đối với hoạt động kinh doanh hàng miễn thuế.'
    - dieu: 2
      noi_dung: '1. Người xuất cảnh, quá cảnh, nhập cảnh. 2. Đối tượng được hưởng quyền ưu đãi, miễn trừ tại Việt Nam. 3. Thuyền viên làm việc trên tàu biển chạy tuyến quốc tế. 4. Hành khách trên các chuyến bay quốc tế đi và đến Việt Nam. 5. Doanh nghiệp đủ điều kiện kinh doanh hàng miễn thuế theo quy định của pháp luật. 6. Cơ quan hải quan, công chức hải quan. 7. Đơn vị kinh doanh cảng biển, cảng hàng không dân dụng quốc tế, ga đường sắt liên vận quốc tế. 8. Ban quản lý khu kinh tế cửa khẩu đường bộ quốc tế, đơn vị được giao quản lý cửa khẩu đường bộ quốc tế. 9. Tổ chức có quyền và nghĩa vụ liên quan đến hoạt động kinh doanh bán hàng miễn thuế. 10. Các cơ quan khác của Nhà nước trong việc phối hợp quản lý nhà nước đối với hoạt động kinh doanh hàng miễn thuế.'
    - dieu: 3
      noi_dung: '1. Chính sách thuế đối với hàng hóa đưa vào bán tại cửa hàng miễn thuế, kho chứa hàng miễn thuế thực hiện theo quy định của pháp luật về thuế, quản lý thuế có liên quan. 2. Chính sách quản lý chuyên ngành đối với hàng hóa đưa vào bán tại cửa hàng miễn thuế, kho chứa hàng miễn thuế thực hiện theo quy định của pháp luật về quản lý chuyên ngành có liên quan. 3. Hàng hóa đưa vào bán tại cửa hàng miễn thuế bao gồm: Hàng hóa tạm nhập khẩu từ nước ngoài, khu phi thuế quan, kho ngoại quan; hàng hóa từ nội địa được phép lưu thông theo quy định của pháp luật Việt Nam. Hàng hóa tạm nhập khẩu từ nước ngoài, khu phi thuế quan, kho ngoại quan đưa vào bán tại cửa hàng miễn thuế là mặt hàng không thuộc danh mục hàng cấm nhập khẩu, tạm ngừng nhập khẩu theo quy định của pháp luật về quản lý ngoại thương và quản lý hải quan theo loại hình tạm nhập, tái xuất. Hàng hóa từ nội địa được phép lưu thông theo quy định của pháp luật đưa vào bán tại cửa hàng miễn thuế là mặt hàng không thuộc danh mục hàng cấm xuất khẩu, tạm ngừng xuất khẩu. Trường hợp hàng hóa thuộc mặt hàng xuất khẩu có điều kiện thì phải đáp ứng các điều kiện theo quy định của pháp luật. 4. Hàng hóa từ nội địa được phép lưu thông theo quy định của pháp luật Việt Nam đưa vào bán tại cửa hàng miễn thuế được cơ quan hải quan quản lý, giám sát trên cơ sở thông báo danh sách hàng hóa đưa vào cửa hàng miễn thuế, kho chứa hàng miễn thuế của doanh nghiệp kinh doanh hàng miễn thuế. 5. Hàng hóa bán tại cửa hàng miễn thuế phải được lưu giữ tại cửa hàng miễn thuế, kho chứa hàng miễn thuế của doanh nghiệp kinh doanh hàng miễn thuế. 6. Thời gian lưu giữ hàng hóa tại cửa hàng miễn thuế theo quy định tại điểm a khoản 2 Điều 47 Luật Hải quan số 54/2014/QH13 ngày 23 tháng 6 năm 2014. 7. Các mặt hàng thuốc lá, xì gà, rượu, bia bán tại cửa hàng miễn thuế phải dán tem “VIET NAM DUTY NOT PAID” do Bộ Tài chính phát hành. Vị trí dán tem “VIET NAM DUTY NOT PAID” thực hiện theo Phụ lục I ban hành kèm theo Nghị định này. Tem phải được dán trước khi bày bán tại cửa hàng miễn thuế hoặc trước khi giao cho đối tượng mua hàng trong trường hợp hàng được xuất thẳng từ kho chứa hàng miễn thuế đến đối tượng mua hàng. 8. Hàng hóa bị đổ vỡ, hư hỏng, mất phẩm chất, kém chất lượng, hết hạn sử dụng, không được bán phục vụ tiêu dùng: Doanh nghiệp lập biên bản về tình trạng hàng hóa để tiêu hủy (có xác nhận của Hải quan quản lý cửa hàng miễn thuế, kho chứa hàng miễn thuế) và tổ chức tiêu hủy theo quy định. Trước khi thực hiện tiêu hủy, doanh nghiệp phải có văn bản thông báo cụ thể về kế hoạch tiêu hủy cho Hải quan quản lý cửa hàng miễn thuế, kho chứa hàng miễn thuế để tổ chức giám sát việc tiêu hủy theo quy định. 9. Hàng hóa là hàng mẫu, hàng dùng thử đưa vào cửa hàng miễn thuế cho khách mua hàng dùng thử (giấy thử mùi nước hoa, rượu, mỹ phẩm, nước hoa,...), túi, bao bì nhập khẩu để đựng hàng miễn thuế cho khách mua hàng, doanh nghiệp thực hiện quản lý riêng hàng hóa này, đảm bảo sử dụng đúng mục đích và phải báo cáo quyết toán với cơ quan hải quan theo quy định tại Điều 19 Nghị định này.'
    - dieu: 4
      noi_dung: '1. Đồng Việt Nam. 2. Đồng ngoại tệ đô la Mỹ (USD), euro (EUR). 3. Đồng tiền của nước có chung biên giới đất liền với địa điểm đặt cửa hàng miễn thuế tại khu vực biên giới. 4. Đồng tiền của quốc gia nơi các chuyến bay quốc tế của các hãng hàng không được thành lập và hoạt động theo pháp luật Việt Nam thực hiện nhập cảnh, quá cảnh tại quốc gia đó.'
    - dieu: 5
      noi_dung: '1. Người xuất cảnh, quá cảnh sau khi hoàn thành thủ tục xuất cảnh, quá cảnh hoặc người chờ xuất cảnh được mua hàng miễn thuế. a) Người xuất cảnh, quá cảnh qua các cửa khẩu đường bộ quốc tế, ga đường sắt liên vận quốc tế, cảng biển, cảng hàng không dân dụng quốc tế được mua hàng miễn thuế tại cửa hàng miễn thuế nằm trong khu vực cách ly; b) Người chờ xuất cảnh được mua hàng miễn thuế tại cửa hàng miễn thuế trong nội địa và nhận tại quầy nhận hàng trong khu cách ly tại cửa khẩu quốc tế nơi hành khách xuất cảnh; c) Ngoài địa điểm nhận hàng quy định tại khoản này, khách mua hàng quy định tại điểm a, điểm b khoản này được nhận hàng ở nước ngoài. 2. Hành khách trên các chuyến bay quốc tế xuất cảnh từ Việt Nam được mua hàng miễn thuế trên tàu bay xuất cảnh. Hành khách trên các chuyến bay quốc tế đến Việt Nam được mua hàng miễn thuế trên tàu bay đang thực hiện chuyến bay quốc tế đến Việt Nam. 3. Người nhập cảnh được mua hàng miễn thuế tại cửa hàng miễn thuế đặt tại khu vực hạn chế của cảng hàng không dân dụng quốc tế ngay sau khi hoàn thành thủ tục nhập cảnh, không được mua hàng miễn thuế sau khi đã ra khỏi khu vực hạn chế tại cảng hàng không dân dụng quốc tế. 4. Đối tượng được hưởng quyền ưu đãi, miễn trừ tại Việt Nam được mua hàng miễn thuế tại cửa hàng miễn thuế trong nội địa. Khi mua hàng miễn thuế cho tổ chức phải xuất trình sổ định mức hàng miễn thuế. Khi mua hàng miễn thuế cho cá nhân phải xuất trình sổ định mức hàng miễn thuế kèm chứng minh thư do Bộ Ngoại giao cấp. 5. Đối tượng mua hàng là thuyền viên làm việc trên tàu biển chạy tuyến quốc tế (bao gồm tàu biển có quốc tịch nước ngoài và tàu biển có quốc tịch Việt Nam chạy tuyến quốc tế) được mua hàng miễn thuế tại cảng biển, cửa hàng miễn thuế trong nội địa phục vụ cho nhu cầu cá nhân, nhu cầu sinh hoạt chung của thuyền viên để sử dụng trên tàu trong thời gian tàu neo đậu tại cảng biển Việt Nam và để sử dụng trên tàu ngoài lãnh hải Việt Nam sau khi tàu xuất cảnh. a) Trường hợp mua hàng miễn thuế phục vụ nhu cầu cá nhân thuyền viên phải xuất trình hộ chiếu hoặc thẻ đi bờ của thuyền viên; b) Trường hợp mua hàng miễn thuế phục vụ nhu cầu sinh hoạt chung của thuyền viên trong thời gian tàu neo đậu tại cảng biển Việt Nam, người mua hàng phải cung cấp thông tin số hiệu tàu, ngày tàu nhập cảnh, số hộ chiếu của từng thuyền viên; c) Trường hợp hàng miễn thuế phục vụ nhu cầu của thuyền viên cho hành trình tiếp theo ngoài lãnh hải Việt Nam, người mua hàng phải cung cấp thông tin về số hiệu tàu, ngày tàu nhập cảnh, số hộ chiếu của từng thuyền viên. Hàng hóa phải được đưa vào kho chứa của tàu để cơ quan hải quan nơi tàu xuất cảnh niêm phong, xác nhận, giám sát cho đến khi tàu xuất cảnh. 6. Trong quá trình thực hiện, trường hợp thông tin cá nhân của người mua hàng miễn thuế có thể khai thác được từ Cơ sở dữ liệu quốc gia về dân cư, Cơ sở dữ liệu quốc gia khác hoặc Cơ sở dữ liệu chuyên ngành thì không yêu cầu người mua hàng miễn thuế xuất trình bản giấy các loại giấy tờ cung cấp thông tin này.'
    - dieu: 6
      noi_dung: '1. Người xuất cảnh, quá cảnh, người chờ xuất cảnh quy định tại khoản 1 Điều 5 Nghị định này hoặc hành khách trên các chuyến bay quốc tế xuất cảnh từ Việt Nam quy định tại khoản 2 Điều 5 Nghị định này được mua hàng miễn thuế không hạn chế số lượng và trị giá nhưng phải tự chịu trách nhiệm về thủ tục và định lượng để nhập khẩu vào nước nhập cảnh. 2. Hành khách trên các chuyến bay quốc tế đến Việt Nam, người nhập cảnh quy định tại khoản 2, khoản 3 Điều 5 Nghị định này được mua hàng miễn thuế theo định mức quy định tại khoản 1, khoản 2 Điều 6 Nghị định số 134/2016/NĐ-CP ngày 01 tháng 9 năm 2016 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Thuế xuất khẩu, thuế nhập khẩu. 3. Đối tượng quy định tại khoản 4 Điều 5 Nghị định này được mua hàng miễn thuế theo định lượng quy định tại Điều 5 Nghị định số 134/2016/NĐ-CP ngày 01 tháng 9 năm 2016 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Thuế xuất khẩu, thuế nhập khẩu. Trường hợp mua hàng tại cửa hàng miễn thuế trong cửa khẩu đường bộ quốc tế, ga đường sắt liên vận quốc tế, cảng biển, cảng hàng không dân dụng quốc tế thì áp dụng định mức như đối với người xuất cảnh, nhập cảnh. 4. Đối tượng quy định tại điểm a, điểm b khoản 5 Điều 5 Nghị định này được mua hàng miễn thuế phục vụ cho nhu cầu cá nhân, nhu cầu sinh hoạt chung của thuyền viên trên tàu biển chạy tuyến quốc tế trong thời gian tàu biển neo đậu tại cảng biển Việt Nam, định mức mỗi thuyền viên trong một lần tàu neo đậu tại cảng biển Việt Nam như sau: a) Rượu từ 20 độ trở lên: 1,5 lít hoặc rượu dưới 20 độ: 2,0 lít hoặc đồ uống có cồn, bia: 3,0 lít. Đối với rượu nguyên chai, bình, lọ, can (sau đây viết tắt là chai) có dung tích lớn hơn dung tích quy định định mức tại điểm a khoản 4 Điều này nhưng không vượt quá 01 lít thì được miễn thuế cả chai. Trường hợp vượt quá 01 lít thì phần vượt định mức phải nộp thuế theo quy định của pháp luật; b) Thuốc lá điếu: 200 điếu hoặc thuốc lá sợi: 250 gam hoặc xì gà: 20 điếu. 5. Đối tượng quy định tại điểm c khoản 5 Điều 5 Nghị định này được mua hàng miễn thuế không hạn chế về số lượng và trị giá để sử dụng trên tàu ngoài lãnh hải Việt Nam sau khi tàu xuất cảnh.'
    - dieu: 7
      khoan: 1
      noi_dung: '1. Đối với hàng hóa tạm nhập khẩu từ nước ngoài, khu phi thuế quan và kho ngoại quan: Doanh nghiệp thực hiện thủ tục tạm nhập khẩu theo quy định tại Nghị định số 08/2015/NĐ-CP ngày 21 tháng 01 năm 2015 của Chính phủ quy định chi tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan và Nghị định số 167/2025/NĐ-CP ngày 30 tháng 6 năm 2025 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 08/2015/NĐ-CP.'
    - dieu: 15
      noi_dung: '1. Địa điểm làm thủ tục hải quan: Hải quan quản lý cửa hàng miễn thuế, kho hàng miễn thuế sau khi khách mua hàng đã thực xuất cảnh. 2. Thủ tục hải quan: Thực hiện thủ tục xuất khẩu (tái xuất đối với hàng hóa do doanh nghiệp kinh doanh hàng miễn thuế tạm nhập từ nước ngoài, xuất khẩu đối với hàng hóa do doanh nghiệp kinh doanh hàng miễn thuế mua từ nội địa để đưa vào bán tại cửa hàng miễn thuế) theo quy định tại Nghị định số 08/2015/NĐ-CP ngày 21 tháng 01 năm 2015 của Chính phủ quy định chi tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan và Nghị định số 167/2025/NĐ-CP ngày 30 tháng 6 năm 2025 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 08/2015/NĐ-CP. Khi làm thủ tục xuất khẩu, ngoài hồ sơ hải quan theo quy định, doanh nghiệp phải gửi bảng kê hàng hóa đã bán cho khách xuất cảnh theo Mẫu số 09 Phụ lục II ban hành kèm theo Nghị định này đến hệ thống xử lý dữ liệu điện tử hải quan hoặc Mẫu số 09/BKHH Phụ lục III ban hành kèm theo Nghị định này trong trường hợp hệ thống gặp sự cố và 01 bản chụp hộ chiếu hoặc giấy thông hành (trang đầu và trang có đóng dấu xuất cảnh của cơ quan xuất nhập cảnh). 3. Trường hợp cơ quan hải quan có đủ cơ sở xác định khách mua hàng miễn thuế không thực xuất cảnh, doanh nghiệp bị xử lý vi phạm theo quy định của pháp luật.'
    - dieu: 16
      khoan: 1
      noi_dung: '1. Thủ tục thay đổi mục đích sử dụng, chuyển tiêu thụ nội địa, tái xuất: thực hiện thủ tục theo quy định tại Nghị định số 08/2015/NĐ-CP ngày 21 tháng 01 năm 2015 của Chính phủ quy định chi tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan, Nghị định số 167/2025/NĐ-CP ngày 30 tháng 6 năm 2025 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 08/2015/NĐ-CP và hướng dẫn của Bộ Tài chính. Chính sách quản lý hàng hóa, chính sách thuế đối với hàng hóa thay đổi mục đích sử dụng, chuyển tiêu thụ nội địa thực hiện tại thời điểm đăng ký tờ khai hải quan thay đổi mục đích sử dụng, chuyển tiêu thụ nội địa. Riêng mặt hàng thuốc lá không được phép thay đổi mục đích sử dụng, chuyển tiêu thụ nội địa, chỉ được tái xuất qua cửa khẩu đường biển, cửa khẩu cảng hàng không dân dụng quốc tế. Trước khi đưa hàng hóa ra khỏi cửa hàng miễn thuế, doanh nghiệp thực hiện hủy tem “VIET NAM DUTY NOT PAID” đã dán lên từng mặt hàng dưới sự giám sát của cơ quan hải quan quản lý cửa hàng miễn thuế, kho chứa hàng miễn thuế và lập biên bản về số tem “VIET NAM DUTY NOT PAID” đã hủy.'
    - dieu: 19
      khoan: 1
      noi_dung: '1. Thời hạn nộp báo cáo quyết toán đối với hàng hóa đưa vào để bán tại cửa hàng miễn thuế: a) Định kỳ hàng năm, chậm nhất là ngày thứ 90 kể từ ngày kết thúc năm tài chính, doanh nghiệp kinh doanh hàng miễn thuế nộp báo cáo quyết toán tình hình bán hàng miễn thuế trong năm tài chính cho cơ quan hải quan; b) Doanh nghiệp kinh doanh hàng miễn thuế sau khi nộp báo cáo quyết toán được phép sửa đổi, bổ sung nội dung báo cáo trong thời gian trước khi hết thời hạn nộp báo cáo quyết toán và trước thời điểm cơ quan hải quan có thông báo về việc thực hiện kiểm tra hay không kiểm tra đối với báo cáo quyết toán.'
    - dieu: 20
      noi_dung: '1. Người mua hàng miễn thuế khi mua hàng miễn thuế phải xuất trình, cung cấp những thông tin cần thiết khi mua hàng miễn thuế được quy định tại Nghị định này, không được cho người khác sử dụng hộ chiếu, giấy thông hành, tiêu chuẩn miễn thuế của mình. 2. Thực hiện các nghĩa vụ về thuế, chính sách mặt hàng nhập khẩu trong trường hợp mua hàng vượt tiêu chuẩn định lượng miễn thuế: kê khai, nộp thuế và các khoản thu khác thuộc ngân sách nhà nước (nếu có) theo quy định và thực hiện các quy định pháp luật liên quan đến hàng hóa nhập khẩu.'
    - dieu: 22
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày 21 tháng 8 năm 2026. 2. Nghị định số 100/2020/NĐ-CP ngày 28 tháng 8 năm 2020 của Chính phủ về kinh doanh hàng miễn thuế hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực thi hành. 3. Thay thế biểu mẫu tại Phụ lục III Nghị định số 181/2025/NĐ-CP ngày 01 tháng 7 năm 2025 của Chính phủ quy định chi tiết thi hành một số điều của Luật Thuế giá trị gia tăng bằng biểu Mẫu số 09/BKHH Phụ lục III Nghị định này.'
ghi_chu: 'Nghị định về kinh doanh hàng miễn thuế (ban hành 07-07-2026, có hiệu lực từ 21-08-2026 theo khoản 1 Điều 22, thay thế Nghị định 100/2020/NĐ-CP ngày 28-08-2020 theo khoản 2 Điều 22).'
