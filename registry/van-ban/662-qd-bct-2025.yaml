xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A của Bộ Công Thương đính kèm trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/17/662.QD-BCT.pdf, id=99827, SHA-256 fe48ffee1c70db43412f8958deb852460b11000d3a09137805992913eaba7d8e): Quyết định số 662/QĐ-BCT ngày 12-03-2025 của Bộ trưởng Bộ Công Thương (Thứ trưởng Nguyễn Sinh Nhật Tân ký) về kết quả rà soát vụ việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường mía (mã vụ việc AR01.AC02-AD13.AS01, thuộc các mã HS 1701.13.00, 1701.14.00, 1701.91.00, 1701.99.10, 1701.99.90 và 1702.90.91 nhập khẩu vào Việt Nam do Công ty PT. Kebun Tebu Mas - Indonesia sản xuất, áp mức thuế chống bán phá giá 42,99% và thuế chống trợ cấp 4,65% theo Quyết định 1578/QĐ-BCT); Điều 3 quy định có hiệu lực sau 15 ngày kể từ ngày ban hành (27-03-2025) và Mục 4 Thông báo kèm theo quy định thời hạn áp dụng đến hết ngày 15-06-2026'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
  dieu_khoan:
    - dieu: 1
      tieu_de: Áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại đối với sản phẩm đường mía
      noi_dung: 'Điều 1. Áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường mía, thuộc các mã HS 1701.13.00; 1701.14.00; 1701.91.00; 1701.99.10; 1701.99.90; và 1702.90.91 được nhập khẩu vào Việt Nam do công ty PT. Kebun Tebu Mas (Cộng hòa In-đô-nê-xi-a) sản xuất với nội dung chi tiết nêu trong Thông báo ban hành kèm theo Quyết định này.'
      trang_pdf: 2
    - dieu: 2
      tieu_de: Thực hiện các nội dung khác theo Quyết định số 1514/QĐ-BCT và Quyết định số 2960/QĐ-BCT
      noi_dung: 'Điều 2. Các nội dung khác thực hiện theo Quyết định số 1514/QĐ-BCT ngày 01 tháng 8 năm 2022 về việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường mía và Quyết định số 2960/QĐ-BCT ngày 30 tháng 12 năm 2022 của Bộ trưởng Bộ Công Thương về việc sửa đổi, bổ sung Quyết định số 1514/QĐ-BCT ngày 01 tháng 8 năm 2022 của Bộ trưởng Bộ Công Thương về việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường mía.'
      trang_pdf: 2
    - dieu: 3
      tieu_de: Hiệu lực thi hành
      noi_dung: 'Điều 3. Quyết định này có hiệu lực thi hành sau 15 ngày kể từ ngày ban hành.'
      trang_pdf: 3
    - dieu: 4
      tieu_de: Trách nhiệm thi hành
      noi_dung: 'Điều 4. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại và Thủ trưởng các đơn vị, các bên liên quan chịu trách nhiệm thi hành Quyết định này.'
      trang_pdf: 3
ghi_chu: 'Loại Công ty PT. Kebun Tebu Mas (Indonesia) khỏi danh sách không áp dụng biện pháp chống lẩn tránh PVTM tại Mục 3.2 Thông báo kèm theo Quyết định 1514/QĐ-BCT và áp dụng mức thuế CBPG 42,99% + thuế CTC 4,65% đối với 6 mã HS đường mía (1701.13.00, 1701.14.00, 1701.91.00, 1701.99.10, 1701.99.90, 1702.90.91) từ ngày 27/03/2025 đến hết ngày 15/06/2026.'
