xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=214813, người ký Phó Thủ tướng Thường trực Nguyễn Hòa Bình, tệp đính kèm 217-cp.signed.pdf): Nghị định 217/2025/NĐ-CP của Chính phủ quy định về hoạt động kiểm tra chuyên ngành, ban hành ngày 05-08-2025, có hiệu lực thi hành kể từ ngày ký ban hành 05-08-2025; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về hoạt động kiểm tra chuyên ngành.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Cơ quan quản lý nhà nước, Thủ trưởng cơ quan quản lý nhà nước; cơ quan, đơn vị được phân cap, ủy quyền thực hiện kiểm tra chuyên ngành; Trưởng đoàn, thành viên Đoàn kiểm tra chuyên ngành; cơ quan, tổ chức, đơn vi, cá nhân là đối tượng kiểm tra chuyên ngành; cơ quan, tổ chức, cá nhân khác có liên quan.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Mục đích hoạt động kiểm tra chuyên ngành 1. Kiểm tra chuyên ngành là việc xem xét, đánh giá, xử lý của cơ quan, ngudi có thâm quyền đối với việc chấp hành pháp luật chuyên ngành của cơ quan, tô chức, cá nhân (sau đây gọi là tổ chức, cá nhân) thuộc phạm vi quản lý nhà nước theo ngành, lĩnh vực.
      trang_pdf: 1
    - dieu: 6
      noi_dung: Điều 6. Tham quyền kiểm tra chuyên ngành 1. Bộ trưởng, Thủ trưởng cơ quan ngang bộ có thẩm quyền kiểm tra chuyên ngành thuộc phạm vi quản lý nhà nước. Người đứng đầu đơn vị thuộc bộ, cơ quan ngang bộ có thẩm quyền kiểm tra chuyên ngành đối với tô chức, cá nhân thuộc phạm vi được phân cấp, ủy quyền.
      trang_pdf: 3
    - dieu: 8
      noi_dung: Điều 8. Nhiệm vụ, quyền hạn của Trưởng đoàn, thành viên Đoàn kiểm tra chuyên ngành 1. Yêu cầu đối tượng kiểm tra cung cấp thông tin, hồ sơ, tài liệu, sản phẩm, hàng hóa, dịch vụ phục vụ công tác kiểm tra; yêu cầu giải trình, làm rõ về các nội dung có liên quan.
      trang_pdf: 5
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm của các cơ quan, tô chức, cá nhân có liên quan 1. Phối hợp, thực hiện các yêu cầu, đề nghị, quyết định xử lý của Đoàn kiểm tra chuyên ngành và người có thâm quyền theo quy định của pháp luật. ` 2. Thực hiện giám sat hoat động của Doan kiểm tra chuyên ngành; thực hiện quyên khiêu nại, tô cáo, kiên nghị, phan ánh theo quy định của pháp luật.. Chương II TRÌNH TỰ, THỦ TỤC KIEM TRA CHUYEN NGANH
      trang_pdf: 6
    - dieu: 11
      noi_dung: 'Điều 11. Quyết định kiểm tra chuyên ngành 1. Người có thấm quyền quy định tại Điều 6 của Nghị định này ban hành quyết định kiểm tra chuyên ngành. 2. Căn cứ ban hành quyết định kiêm tra chuyên ngành: __ 8) Khi phát hiện có dấu hiệu vi phạm pháp luật hoặc sự cố, sự kiện, dau hiệu bat thường theo quy định của pháp luật chuyên ngành; b) Theo chỉ đạo của Thủ trưởng cơ quan quản lý nhà nước; theo yêu cầu, đề nghị của cơ quan, người có thâm quyền;'
      trang_pdf: 6
    - dieu: 13
      noi_dung: Điều 13. Địa điểm, thời hạn kiểm tra chuyên ngành 1. Đoàn kiêm tra làm việc tại trụ sở, nơi làm việc của cơ quan, tô chức, đơn vị, cá nhân là đôi tượng kiêm tra, trụ sở cơ quan, don vị tiên hành kiêm tra hoặc tại nơi tiên hành kiêm tra, xác minh theo kê hoạch tiên hành kiêm tra. 2. Thời hạn kiểm tra chuyên ngành
      trang_pdf: 7
    - dieu: 15
      noi_dung: Điều 15. Tiến hành kiểm tra và xử lý vi phạm 1. Công bố quyết định kiểm tra chuyên ngành Trưởng đoàn kiểm tra công bố quyết định kiểm tra chuyên ngành với đôi tượng kiêm tra và thông báo chương trình làm việc. Trường hợp phát hiện vi phạm pháp luật quả tang thì tiễn hành kiểm tra, lập biên bản vi phạm hành chính và xử lý theo quy định của pháp luật.
      trang_pdf: 8
    - dieu: 19
      noi_dung: Điều 19. Quy định chuyển tiếp Các cuộc kiểm tra chuyên ngành có quyết định kiểm tra được ban hành trước ngày Nghị định này có hiệu lực thi hành thì tiếp tục thực hiện theo duy định của pháp luật.
      trang_pdf: 10
