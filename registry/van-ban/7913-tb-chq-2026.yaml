  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/3/VB_7913.pdf, id=102537, SHA-256 b861f3b07d94b8072eed47ab55f7ab2ec0d7fc29bc574ec3c83ba66b0a559a7e): Thông báo số 7913/TB-CHQ ngày 30-01-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Màn hình hiển thị CTS-IX5000 70 Display cho hệ thống hội nghị truyền hình TelePresence IX5000 Series (ký, mã hiệu CTS-SK-70-G1=; màn hình khung mở LCD 70 inch, đèn LED viền, độ phân giải 1920 x 1080 60fps, không tích hợp cảm ứng, hệ điều hành, ổ cứng, bộ điều khiển trung tâm, loa, camera hay bộ thu sóng truyền hình; có 01 cổng đầu vào DVI kết nối bộ điều khiển trung tâm Codec hoặc máy xử lý dữ liệu tự động ADP thuộc nhóm 84.71, 01 đầu nối quạt, 01 cổng nguồn AC), phân loại vào nhóm 85.28, mã số 8528.52.00; có hiệu lực từ ngày ký'
