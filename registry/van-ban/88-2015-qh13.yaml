  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh | Luat nay quy dinh về nội dung công tác kế toán, tổ chức bộ máy kế toán, người làm kế toán, hoạt động kinh doanh dịch vụ kế toán, quản lý nhà nước về kế toán và tổ chức nghề nghiệp về kế toán.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Cơ quan có nhiệm vụ thu, chỉ ngân sách nhà nước các cấp. 2. Cơ quan nhà nước, tổ chức, đơn vi sự nghiệp sử dụng ngân sách nhà nước. 3. Tổ chức, đơn vị sự nghiệp không sử dụng ngân sách nhà nước. 4. Doanh nghiệp được thành lập và hoạt động theo pháp luật Việt Nam; chỉ nhánh, văn phòng đại diện của doanh nghiệp nước ngoài hoạt động tại Việt Nam. 5. Hợp tác xã, liên hiệp hợp tác xã. 6. Hộ kinh doanh, tổ hợp tác.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Báo cáo tài chính là hệ thống thông tin kinh tế, tài chính của đơn vị kế toán được trình bày theo biểu mẫu quy định tại chuẩn mực kế toán và chế độ kế toán.'
      trang_pdf: 1
    - dieu: 14
      noi_dung: Điều 14. Giá trị của tài liệu, số liệu kế toán 1. Tài liệu, số liệu kế toán có giá trị pháp lý của đơn vị kế toán và được sử dụng dé công bố, công khai theo quy định của pháp luật. 2. Tài liệu, số liệu kế toán là cơ sở để xây dựng và xét duyệt kế hoạch, dự toán, quyết toán, xem xét, xử lý hành vi vi phạm pháp luật.
      trang_pdf: 8
    - dieu: 23
      noi_dung: Điều 23. Lựa chọn áp dụng hệ thống tài khoản kế toán 1. Đơn vị kế toán phải căn cứ vào hệ thống tài khoản kế toán do Bộ Tài chính quy định để chọn hệ thống tài khoản kế toán áp dụng ở đơn vị mình. Ae
      trang_pdf: 11
    - dieu: 33
      noi_dung: Điều 33. Kiếm toán báo cáo tài chính 1. Báo cáo tài chính năm của đơn vị kế toán mà pháp luật quy định phải kiểm toán thì phải được kiểm toán trước khi nộp cho cơ quan nha nước có thâm quyền và trước khi công khai. AY
      trang_pdf: 16
    - dieu: 43
      noi_dung: 'Điều 43. Công việc kế toán trong trường hợp chia đơn vị kế toán 1. Đơn vị kế toán bị chia thành các đơn vị kế toán mới phải thực hiện các công việc sau đây: a) Khóa số kế toán, kiểm kê tài sản, xác định nợ chưa thanh toán, lập báo cáo tài chính; b) Phân chia tài sản, nợ chưa thanh toán, lập biên bản ban giao và ghi số kế toán theo biên bản bàn giao; c) Ban giao tài liệu kế toán liên quan đến tài sản, nợ chưa thanh toán cho các đơn vị kê toán mới.'
      trang_pdf: 21
    - dieu: 53
      noi_dung: Điều 53. Kế toán trưởng _1. Kế toán trưởng là người đứng đầu bộ máy kế toán của đơn vị có nhiệm vụ tô chức thực hiện công tác kê toán trong don vị kê toán.
      trang_pdf: 24
    - dieu: 62
      noi_dung: Điều 62. Thời hạn cấp Giấy chứng nhận đủ điều kiện kinh doanh dịch vụ kế toán 1. Trong thời hạn 15 ngày, kể từ ngày nhận đủ hồ sơ hợp lệ, Bộ Tài chính cấp Giấy chứng nhận đủ điều kiện kinh doanh dịch vụ kê toán cho doanh nghiệp; trường hợp từ chối cấp thì phải trả lời bằng văn bản và nêu rõ lý do.
      trang_pdf: 29
    - dieu: 73
      noi_dung: Điều 73. Điều khoản chuyên tiếp 1. Chính phủ chuẩn bị các điều kiện cần thiết để bắt đầu việc lập báo cáo tài chính nhà nước theo quy định tại Điều 30 của Luật này chậm nhất là 24 tháng, ké từ ngày Luật này có hiệu lực.
      trang_pdf: 35
ghi_chu: Quy định về chứng từ kế toán, sổ kế toán, báo cáo tài chính phục vụ kiểm tra sau thông quan và quản lý thuế.
