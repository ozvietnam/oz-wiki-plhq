xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/26/VB_23491.pdf, id=106534, SHA-256 61a1b7c3adedaf987282e5d008d835d62c8a35c79e334a246da2d7770b2a95d1): Thông báo số 23491/TB-CHQ ngày 26-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Mô đun đi-ốt phát quang (Led module, mã sản phẩm TROOPER 5B, cụm đi-ốt phát quang gồm 512 chip LED bố trí thành mạch cấu hình 16S2P trên tấm mạch in nền nhôm PCB, 8 điện trở cân bằng dòng điện, hệ thống cầu chì gồm 1 cầu chì tổng và 8 cầu chì nhánh, 1 đầu nối nhận nguồn DC, keo phủ, thiếc hàn; kích thước 1200mm x 150mm x 1.76mm, dòng điện 150-200mA, điện áp 92.8-105.6 V, công suất 13.92-15.84 W, chưa có bộ nguồn/driver và vỏ đèn đi kèm, dùng để sản xuất đèn chiếu sáng công nghiệp, thương mại), phân loại vào nhóm 85.41, mã số 8541.41.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Mô đun đi-ốt phát quang (tên tiếng Anh Led module, mã sản phẩm TROOPER 5B, cụm đi-ốt phát quang LED cấu tạo gồm 512 chip LED bố trí thành mạch cấu hình 16S2P trên tấm mạch in nền nhôm PCB, 8 điện trở tự động cân bằng dòng điện giữa các nhánh mạch, hệ thống cầu chì gồm 1 cầu chì tổng và 8 cầu chì nhánh giám sát dòng điện và tự động ngắt mạch khi quá dòng, 1 đầu nối nhận nguồn DC, keo phủ, thiếc hàn; kích thước dài x rộng x cao 1200mm x 150mm x 1.76mm, cường độ dòng điện 150-200mA, điện áp 92.8-105.6 V, công suất 13.92-15.84 W, cần lắp cùng bộ nguồn/driver và vỏ đèn phù hợp, dùng để sản xuất đèn chiếu sáng công nghiệp, thương mại) thuộc nhóm 85.41, mã số 8541.41.00.'
