ten: 'Thông báo về kết quả xác định trước mã số (Mô đun đi-ốt phát quang Led module TROOPER 5B, cụm 512 chip LED cấu hình 16S2P trên tấm mạch in nền nhôm PCB kèm 8 điện trở cân bằng dòng, hệ thống cầu chì và đầu nối nhận nguồn DC, kích thước 1200mm x 150mm x 1.76mm, công suất 13.92-15.84 W, dùng để sản xuất đèn chiếu sáng công nghiệp, thương mại, mã số 8541.41.00)'
