  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Đối tượng áp dung 1. Cá nhân, tổ chức có hành vi vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán. 2. Cá nhân, tổ chức có liên quan đến VIỆC Xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Thời hiệu xử phạt 1. Thời hiệu xử phạt vi phạm hành chính đếi với hành Vi Vi pham trong lĩnh vực chứng khoán và thị trường chứng khoán là 02 năm kế từ ngày chấm đứt hành vi vi pham đối VỚI VÌ phạm hành chính đã kết thúc hoặc kế từ ngày phát hiện hành vi vi phạm đối với vi phạm hành chính đang được thực hiện. Ngày
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Hình thức phạt tiền và biện pháp khắc phục hậu quả 1. Việc xác định mức tiền phạt đối với cá nhân, tổ chức có hành vi vi phạm pháp luật trong lĩnh vực chứng khoán và thị trường chứng khoán được hướng dẫn cụ thé như sau:'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Vi phạm quy định về nộp hồ sơ đăng ký công ty đại chúng Quy định tại Điểm b Khoản 3 Điều 9 Nghị định số 108/2013/NĐ-CP được áp dụng trong trường hợp tổ chức vi phạm đã được hướng dẫn sửa đổi thông tin không chính xác trong hỗ so dang ky cong ty dai chúng nhưng không thực hiện - hoặc thực hiện không đúng theo yêu câu của Uy ban Chứng khoán Nhà nước.
      trang_pdf: 6
    - dieu: 8
      noi_dung: Điều 8. Vi phạm quy định về tố chức thị trường giao dich chứng khoán 1. Quy định tại Khoản 1 và Khoản 2 Điều 16 Nghị định SỐ 108/2013/NĐ- CP được áp dụng đối với trường hợp tổ chức bất kỳ một địa điểm hoặc một hình thức trao đổi thông tin nào để thực hiện khớp lệnh mua, bán và giao dịch chứng. khoán ngoài Sở giao dịch chứng khoán.
      trang_pdf: 6
    - dieu: 10
      noi_dung: Điều 10. Vi pham quy dinh vé giao dich nội bộ và giao dich thao ting thị trường chứng khoán 1. Số lợi bất hợp pháp có được do thực hiện hành vi vi phạm quy định tại Khoản 1 và Khoản 3 Điều 29 Nghị định số 108/2013/NĐ-CP là số lợi phát sinh từ việc thực hiện hành vi giao dịch nội bộ hoặc giao dịch thao túng thị trường chứng khoán, sau khi trừ đi các khoản thuê, phí phải nộp.
      trang_pdf: 7
    - dieu: 11
      noi_dung: Điều 11. Phân định tham quyền xử phat Trường hợp phát hiện hành vi vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán, Chánh Thanh tra Ủy ban Chứng khoán Nhà nước xử phạt theo thâm quyên quy định tại Khoản 1 Điều 37 Nghị định số 108/2013/NĐ-CP, trừ trường hợp hành vi vi phạm hành chính được phát hiện qua hoạt động thanh tra chuyên ngành thì thâm quyền xử phạt thuộc Trưởng đoàn Thanh tra chuyên ngành của Ủy ban Chứng khoán
      trang_pdf: 7
    - dieu: 14
      noi_dung: Điều 14. Chuyến giao vụ việc cho người có thấm quyền xử phat vi phạm hành chính 1. Cơ quan quản lý nhà nước trong quá trình thanh tra, kiểm tra đối với các cá nhân, tổ chức nếu phát hiện có hành vi vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán nhưng. không | thuộc thấm quyên xử phạt. của mình thì phải chuyển toàn bộ hồ SƠ vụ việc và đề xuất xử lý bằng văn bản tới Uỷ ban Chứng khoán Nhà nước để giải quyết
      trang_pdf: 8
    - dieu: 16
      noi_dung: Điều 16. Công bố thông tin về quyết định xử phạt vi phạm hành chính 1. Trong thời hạn 03 ngày làm việc, kế từ ngày ban hành quyết định xử phạt vi phạm hành chỉnh trong lĩnh vực chứng khoán và thị trường chứng khoán, Quyết định xử phạt phải được công bố trên trang thông tin điện tử của Uỷ ban Chứng khoán Nhà nước.
      trang_pdf: 10
    - dieu: 19
      noi_dung: Điều 19. Trách nhiệm thực hiện 1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 3-nam 2014 và thay thé Thong tu số 37/201 1/TT-BTC. ngay 16 tháng 03 năm 2011 của Bộ Tai chính hướng dan thi hành Tnột số điều của Nghị định số 85/2010/NĐ-CP ngày 02. tháng 8 năm 2010 của Chính phủ về xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán.
      trang_pdf: 11
