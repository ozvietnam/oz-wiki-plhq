  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/7/1/VB_11801.pdf, 31 trang, ký số Cục Hải quan 30/06/2025 17:13:43 +07:00, SHA-256 b89057bb7e6924060bf346e2ef8d90b7c64b6d8d99a7c09599debf13e6168f0e): Thông báo số 11801/TB-CHQ ngày 30-06-2025 của Cục Hải quan về thông tin tài khoản thu NSNN (HỎA TỐC); căn cứ QĐ 382/QĐ-BTC (26-02-2025) sửa đổi, bổ sung bởi QĐ 2019/QĐ-BTC (11-06-2025); thông báo mã cơ quan hải quan, tài khoản chuyên thu, tài khoản tạm thu, tài khoản tạm giữ, Kho bạc Nhà nước nơi cơ quan hải quan mở tài khoản của các đơn vị Hải quan cửa khẩu/ngoài cửa khẩu thuộc Chi cục Hải quan khu vực (phụ lục kèm theo — danh sách đơn vị, mã KBNN, so sánh thông tin KBNN 15/3/2025 và 01/7/2025); TL. Cục trưởng, KT. Trưởng Ban Nghiệp vụ thuế HQ ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Văn bản gốc của họ thông báo tài khoản thu sau sắp xếp Chi cục HQKV; được cập nhật sửa đổi, bổ sung từng phần bởi 12377/TB-CHQ/2025 (HQKV II, XII, XIX), 17501/TB-CHQ/2025 (HQKV X, XIII, XIV, XIX) và 27091/TB-CHQ/2025 (Hải quan Buôn Ma Thuột). Văn bản không ghi điều khoản hiệu lực riêng; hieu_luc_tu lấy theo ngày ban hành, phụ lục ghi cột «THÔNG TIN KBNN 01/7/2025» cho thông tin áp dụng từ 01-07-2025. Bản PDF là bản quét có chữ ký số, chữ trích qua OCR.'
