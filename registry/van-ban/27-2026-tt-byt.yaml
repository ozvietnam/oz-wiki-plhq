  pham_vi: |
    TT 27/2026/TT-BYT ban hành 01/07/2026, ký Bộ trưởng Bộ Y tế Đỗ Xuân Tuyên (theo text layer PDF datafiles, đã đọc toàn văn 5 trang).
    Điều 1: Danh mục thực phẩm + dụng cụ chứa + vật liệu bao gói rủi ro trung bình.
    Điều 2: Điều khoản tham chiếu (forward).
    Điều 3.1: Cục trưởng Cục An toàn thực phẩm tổ chức triển khai + rà soát Danh mục.
    Điều 3.2: UBND các tỉnh tổ chức thực hiện tại địa phương.
    Điều 4: Hiệu lực 01/07/2026.
    Căn cứ: Luật ATTP 55/2010/QH12, Luật Chất lượng SPHH 05/2007/QH12 (sửa bởi 78/2025/QH15), NĐ 37/2026/NĐ-CP, NĐ 15/2018/NĐ-CP (hướng dẫn Luật ATTP), NĐ 42/2025/NĐ-CP (chức năng BYT).
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-10'
  boi: legal-customs@ozvietnam
  nguon_da_mo:
    - 'vanban.chinhphu.vn/?docid=218706 (thẻ metadata)'
