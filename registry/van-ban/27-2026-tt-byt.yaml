  dieu_khoan:
    - dieu: 1
      noi_dung: 'Ban hành Danh mục thực phẩm; dụng cụ chứa đựng thực phẩm, vật liệu bao gói tiếp xúc trực tiếp với thực phẩm có mức độ rủi ro trung bình thuộc trách nhiệm quản lý của Bộ Y tế tại Phụ lục kèm theo Thông tư này.'
      trang_pdf: 1
      sha256_pdf: 399982d57d89353f9d78cf8f21d8d8596d0cfdf2a3e263741158580d26a92e8b
    - dieu: 2
      noi_dung: 'Điều 2. Điều khoản tham chiếu Trường hợp các văn bản quy phạm pháp luật dẫn chiếu để áp dụng tại Thông tư này được sửa đổi, bổ sung, thay thế hoặc ban hành mới thì áp dụng theo văn bản sửa đổi, bổ sung, thay thế hoặc ban hành mới.'
      trang_pdf: 1
      sha256_pdf: 399982d57d89353f9d78cf8f21d8d8596d0cfdf2a3e263741158580d26a92e8b
    - dieu: 3
      khoan: 1
      noi_dung: 'Điều 3. Tổ chức thực hiện 1. Cục trưởng Cục An toàn thực phẩm có trách nhiệm a) Tổ chức triển khai, hướng dẫn, kiểm tra việc thực hiện Thông tư này. b) Tiếp tục rà soát, đề xuất cập nhật, bổ sung Danh mục thực phẩm; dụng cụ chứa đựng thực phẩm, vật liệu bao gói tiếp xúc trực tiếp với thực phẩm có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý của Bộ Y tế.'
      trang_pdf: 2
      sha256_pdf: 399982d57d89353f9d78cf8f21d8d8596d0cfdf2a3e263741158580d26a92e8b
    - dieu: 3
      khoan: 2
      noi_dung: '2. Ủy ban nhân dân các tỉnh, thành phố có trách nhiệm a) Tổ chức triển khai thực hiện Thông tư này tại địa phương theo chức năng, nhiệm vụ, thẩm quyền được giao. b) Chỉ đạo cơ quan chuyên môn thực hiện quản lý, kiểm tra các sản phẩm thuộc Danh mục ban hành kèm theo Thông tư này theo quy định của pháp luật.'
      trang_pdf: 2
      sha256_pdf: 399982d57d89353f9d78cf8f21d8d8596d0cfdf2a3e263741158580d26a92e8b
    - dieu: 4
      noi_dung: 'Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026. Trong quá trình thực hiện nếu có vướng mắc, cơ quan, tổ chức cá nhân kịp thời phản ánh về Bộ Y tế (thông qua Cục An toàn thực phẩm) để nghiên cứu, giải quyết./.'
      trang_pdf: 2
      sha256_pdf: 399982d57d89353f9d78cf8f21d8d8596d0cfdf2a3e263741158580d26a92e8b
ghi_chu: 'ĐỌC NGUYÊN VĂN Phụ lục 30/10: đúng 8 nhóm, QCVN gắn từng nhóm — nhựa QCVN 12-1:2011/BYT, cao su QCVN 12-2:2011/BYT, nước đóng chai QCVN 6-1:2010/BYT, dinh dưỡng trẻ em QCVN 11-1/112/113/114:2012. LƯU Ý: THỦY TINH/gốm sứ tráng men (QCVN 12-4:2015/BYT) KHÔNG thuộc danh mục rủi ro trung bình này — từ 01/7/2026 không bị kiểm tra chuyên ngành tại cửa khẩu theo khung NĐ 37/2026; chỉ còn giám sát lưu thông nội địa.'
