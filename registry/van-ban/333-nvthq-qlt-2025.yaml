  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/5/5/VB_333.pdf, id=99969, SHA-256 dd2734d1882bcedebef205a8785dfa3bf65ec07bd961cfc24a18a2404fb63a7f): Công văn số 333/NVTHQ-QLT ngày 29-04-2025 của Ban Nghiệp vụ thuế hải quan - Cục Hải quan (Phó Trưởng ban Mai Thị Vân Anh ký) đề nghị Ban Công nghệ thông tin và Thống kê hải quan cập nhật bổ sung bảng mã thuế chống bán phá giá dùng trong hệ thống VNACCS (từ mã G172 đến G189, mức thuế tạm thời 19,38%–27,83%) để thực hiện Quyết định số 1204/QĐ-BCT ngày 28-04-2025 sửa đổi, bổ sung Quyết định số 460/QĐ-BCT ngày 21-02-2025 của Bộ Công Thương về thuế chống bán phá giá tạm thời đối với sản phẩm thép cán nóng xuất xứ từ Ấn Độ và Trung Quốc; hết hiệu lực từ ngày 06-07-2025 khi Quyết định số 1959/QĐ-BCT áp dụng thuế chống bán phá giá chính thức có hiệu lực'
  hieu_luc_da_doi_chieu: true
