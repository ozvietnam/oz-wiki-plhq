ghi_chu: 'Cập nhật danh sách công ty thương mại liên quan tại Bảng mã thuế chống bán phá giá tạm thời trên hệ thống VNACCS (mã G172 đến G189) theo Quyết định số 1204/QĐ-BCT ngày 28/04/2025 sửa đổi Quyết định số 460/QĐ-BCT ngày 21/02/2025 (mã vụ việc AD20).'
