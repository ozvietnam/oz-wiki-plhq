  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/17/VB_139.pdf, id=99595, SHA-256 ae9d819f9e387baaa1236c245ebc62c3767456f5ca19bd432c8c9ec8f010634b): Thông báo số 139/TB-CHQ ngày 13-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Đồng lá mỏng bằng đồng tinh luyện ký hiệu NFGF-100 (dạng cuộn, bề mặt làm phẳng, rộng 150mm, dài 10m-100m, cấu tạo 4 lớp: lớp bồi nhựa polyester Resin Film 69.6% dày 64μm, lớp mạ niken 2.1% và vàng 0.3% dày 1μm, lớp đồng lá mỏng tinh luyện Cu 25.7% dày 6μm, lớp keo không dẫn điện 2.3% dày 9μm; dùng gắn vào module mặt trước bản mạch in điện tử; nhà sản xuất Tatsuta Electric Wire & Cable Co., Ltd), phân loại vào nhóm 74.10, mã số 7410.21.00; có hiệu lực từ ngày ký'
