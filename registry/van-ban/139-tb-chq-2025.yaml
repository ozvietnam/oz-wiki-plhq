ghi_chu: 'Xác định trước mã số mặt hàng Đồng lá mỏng bằng đồng tinh luyện ký hiệu NFGF-100 (dạng cuộn, chiều dày lớp đồng 6μm, rộng 150mm, dài 10m-100m, mạ niken-vàng dày 1μm, bồi hai mặt bằng lớp nhựa polyester Resin Film dày 64μm và lớp keo không dẫn điện dày 9μm, dùng cho bản mạch in điện tử; nhà sản xuất Tatsuta Electric Wire & Cable Co., Ltd) thuộc nhóm 74.10, mã số 7410.21.00.'
