  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A của Bộ Công Thương trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/3/460.QD-BCT.pdf, id=99313, SHA-256 76c2d4933f2e2c9453d3ac6c830cec1c65810182e24e4172a0878b2fb60e76ba): Quyết định số 460/QĐ-BCT ngày 21-02-2025 của Bộ trưởng Bộ Công Thương (Thứ trưởng Nguyễn Sinh Nhật Tân ký) áp dụng thuế chống bán phá giá tạm thời (19,38%–27,83%) đối với 27 mã HS sản phẩm thép cán nóng có xuất xứ từ Cộng hòa nhân dân Trung Hoa và không áp dụng thuế chống bán phá giá tạm thời đối với sản phẩm thép cán nóng xuất xứ từ Cộng hòa Ấn Độ (mã vụ việc AD20); Điều 3 quy định có hiệu lực sau 15 ngày kể từ ngày ban hành (08-03-2025) với thời hạn 120 ngày đến hết ngày 05-07-2025, sau đó được thay thế bởi biện pháp chống bán phá giá chính thức tại Quyết định số 1959/QĐ-BCT từ ngày 06-07-2025'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
