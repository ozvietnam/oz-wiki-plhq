ghi_chu: 'Mã vụ việc AD20 (27 mã HS thép cán nóng nhóm 7208, 7211, 7225, 7226). Áp dụng thuế chống bán phá giá tạm thời 19,38%–27,83% trong 120 ngày (08/03/2025 – 05/07/2025), sau đó chuyển sang thuế CBPG chính thức tại Quyết định số 1959/QĐ-BCT ngày 04/07/2025 (hiệu lực từ 06/07/2025).'
