      noi_dung: Điều 4. Các Quyết định Sau hết hiệu lực thi hành 1. Quyết định số 3198/QD-BCT ngày 24 tháng 10 năm 2019 của Bộ trưởng Bộ Công Thương về việc áp dụng thuế chống bán phá giá đối với một số sản phâm thép hợp kim hoặc không hợp kim, được cán phẳng, được sơn có xuất xứ từ nước Cộng hòa nhân dân Trung Hoa và nước Đại Hàn Dân quốc;
