xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=220228, Bộ trưởng Vũ Hải Quân ký) và toàn văn PDF ký số đính kèm (66-bkhcn.signed.pdf, 10 trang): số hiệu 66/2026/TT-BKHCN, ban hành ngày 31-10-2026, có hiệu lực thi hành từ ngày 01-01-2027 (khoản 1 Điều 9); sửa đổi, bổ sung một số điều (Điều 1, 4, 7, 13, 18, 19, 20, bổ sung Điều 20a, bãi bỏ Điều 22) của Thông tư 11/2015/TT-BKHCN ngày 26-06-2015 quy định chi tiết và hướng dẫn thi hành một số điều của Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (đã được sửa đổi, bổ sung bởi Nghị định 126/2021/NĐ-CP, 46/2024/NĐ-CP, 186/2026/NĐ-CP và Thông tư 06/2024/TT-BKHCN), đồng thời bãi bỏ toàn bộ Thông tư liên tịch 14/2016/TTLT-BTTTT-BKHCN (khoản 2 Điều 9).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Sửa đổi, bổ sung Thông tư 11/2015/TT-BKHCN hướng dẫn Nghị định 99/2013/NĐ-CP về xử phạt VPHC sở hữu công nghiệp (tạm giữ, buộc hoàn trả, thu hồi, ngăn chặn truy cập tên miền xâm phạm quyền SHCN); có hiệu lực thi hành từ 01-01-2027.'
