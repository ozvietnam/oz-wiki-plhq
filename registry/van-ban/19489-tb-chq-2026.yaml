ghi_chu: 'Xác định trước mã số mặt hàng Vỏ hộp bộ điều khiển điện tử trong hệ thống phanh ABS của xe máy (Housing, ECU, ký mã hiệu 009V79187-00000, cấu tạo từ nhựa PBT và các cực nối tín hiệu bằng đồng, kích thước 83,6x52x33,9 mm, khối lượng 0,04215 kg/chiếc, dòng điện tối đa 10A) thuộc nhóm 85.36, phân nhóm 8536.90, mã số 8536.90.94. Tệp PDF VB_19489.pdf trên cổng gồm 2 trang đầu; trang kết luận của mã hiệu 009V79187-00000 nằm ở trang 2 của tệp VB_19488.pdf (19488/TB-CHQ/2026) ban hành cùng ngày.'
