xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/30/VB_19489.pdf, id=105266, SHA-256 d1136baea8e3025cd1dc28fef9bfee79fd85ea6121d9a0bd7bf3757641db4565, kết hợp trang kết luận của ký mã hiệu 009V79187-00000 bị quét ghép vào trang 2 tệp VB_19488.pdf cùng ngày): Thông báo số 19489/TB-CHQ ngày 27-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Vỏ hộp bộ điều khiển điện tử trong hệ thống phanh ABS của xe máy (tên thương mại Housing, ECU; ký mã hiệu 009V79187-00000; cấu tạo từ nhựa PBT, màng dán nhựa và các cực nối tín hiệu/nguồn bằng đồng; kích thước 83,6 x 52 x 33,9 mm, khối lượng tịnh 0,04215 kg/chiếc, dòng điện đi qua các đầu điện cực kết nối với bộ phận điều khiển phanh tối đa 10A), phân loại vào nhóm 85.36, phân nhóm 8536.90, mã số 8536.90.94; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
