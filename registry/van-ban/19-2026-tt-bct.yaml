xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=220090), toàn văn PDF ký số Thông tư 67/2026/TT-BCT (67-bct.signed.pdf) và hồ sơ hợp nhất 135/2026/VBHN-TT-BCT trong sổ: Thông tư 19/2026/TT-BCT ban hành ngày 03-04-2026 đang còn hiệu lực, được sửa đổi, bổ sung một số điều (Điều 5, 7, 8, khoản 3 Điều 9, Điều 11, khoản 6 Điều 12, khoản 2 Điều 14, Phụ lục I, II) bởi Thông tư 67/2026/TT-BCT từ 20-10-2026 và hợp nhất tại 135/2026/VBHN-TT-BCT ngày 30-10-2026'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đỗi, bỗ sung một số điều của Thông tư số 19/2026/TT-BCT 1. Sửa đối, bd sung Điều 5 như sau: “Điều 5. Tạm ứng cho Quỹ bình én giá xăng dầu từ nguồn ngần sách nhà nước 1. Căn cứ thông báo điều hành giá bán xăng dầu của Bộ Công Thương có nội dung điều hành chỉ sử dụng Quỹ bình dn giá xăng dầu, Cục Quản lý và Phát triển thị trường trong nước gửi văn bản đề nghị thương nhân tạm ứng chơ Quỹ bình én giá xăng dầu tại thương nhân.'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Điều khoản chuyên tiếp Đối với các hồ sơ đề nghị tạm ứng của thương nhân gửi về Cục Quản lý và Phát triển thị trường trong nước trước ngày Thông tư này có hiệu lực thi hành nhưng chưa được giải quyết, Cục Quản lý và Phát triển thị trường trong nước có văn bản thông báo hướng dẫn thương nhân thực hiện tạm ứng theo quy định tại Thông tư này.
      trang_pdf: 5
    - dieu: 3
      noi_dung: Điều 3. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kê từ ngày,20tháng Z42năm 2026. 2. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, các cơ quan, tô chức, doanh nghiệp kịp thời phản ánh bằng văn bản về Bộ Công Thương (Cục Quản lý và Phát triên thị trường trong nước) để xem xét, hướng dẫn hoặc sửa đổi, bé sung cho phù hợp./. Mã KT. BỘ TRƯỞNG
      trang_pdf: 5
ghi_chu: 'Nền của TT 67/2026 (#278) — gia đình xăng dầu #240. Hợp nhất tại VBHN 135/2026/VBHN-TT-BCT (đã có).'
