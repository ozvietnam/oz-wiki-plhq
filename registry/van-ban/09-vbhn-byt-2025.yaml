xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu lời nói đầu, thông tin ký xác thực của Thứ trưởng Bộ Y tế Đỗ Xuân Tuyên ngày 25-07-2025 trên bản PDF chính thức từ Trang TTĐT Cục Quản lý Dược - Bộ Y tế (dav.gov.vn, raw/download/dav.gov.vn/09-vbhn-byt-2025.pdf, 62 trang) và 5 văn bản thành phần trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn) / CSDL Quốc gia về VBPL (vbpl.vn): hợp nhất Thông tư 06/2011/TT-BYT ngày 25-01-2011 (HL 01-04-2011) với 4 văn bản sửa đổi, bổ sung gồm Thông tư 09/2015/TT-BYT ngày 25-05-2015 (HL 10-08-2015), Nghị định 155/2018/NĐ-CP ngày 12-11-2018 (HL 12-11-2018), Thông tư 29/2020/TT-BYT ngày 31-12-2020 (HL 15-02-2021) và Thông tư 34/2025/TT-BYT ngày 03-07-2025 (HL 18-08-2025); đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: ong-w17-raw-ready@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Thông tư này quy định việc quản lý các sản phẩm mỹ phẩm sản xuất trong nước, mỹ phẩm nhập khẩu để lưu thông trong phạm vi lãnh thổ Việt Nam, bao gồm: công bố sản phẩm mỹ phẩm; hồ sơ thông tin sản phẩm; yêu cầu về an toàn sản phẩm; ghi nhãn mỹ phẩm; quảng cáo mỹ phẩm; xuất khẩu, nhập khẩu mỹ phẩm; lấy mẫu mỹ phẩm để kiểm tra chất lượng; kiểm tra, thanh tra và xử lý vi phạm;'
      trang_pdf: 3
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích thuật ngữ Trong Thông tư này các từ ngữ dưới đây được hiểu như sau: 1. Sản phẩm mỹ phẩm là một chất hay chế phẩm được sử dụng để tiếp xúc với những bộ phận bên ngoài cơ thể con người (da, hệ thống lông tóc, móng tay, móng chân, môi và cơ quan sinh dục ngoài) hoặc răng và niêm mạc miệng với mục đích chính là để làm sạch, làm thơm, thay đổi diện mạo, hình thức, điều chỉnh mùi cơ thể, bảo vệ cơ thể hoặc giữ cơ thể trong điều kiện'
      trang_pdf: 3
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 3
      noi_dung: Điều 3. Quy định về việc công bố sản phẩm mỹ phẩm 1. Các tổ chức, cá nhân chịu trách nhiệm đưa sản phẩm mỹ phẩm ra thị trường chỉ được phép đưa mỹ phẩm ra lưu thông khi đã được cơ quan quản lý nhà nước có thẩm quyền cấp số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm và phải hoàn toàn chịu trách nhiệm về tính an toàn, hiệu quả và chất lượng sản phẩm. Cơ quan nhà nước có thẩm quyền sẽ tiến hành kiểm tra hậu mại khi sản
      trang_pdf: 5
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 9
      noi_dung: Điều 9. Thay đổi các nội dung đã công bố Đối với các sản phẩm mỹ phẩm đã công bố và được cấp số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm, khi có thay đổi các nội dung quy đ ịnh tại Phụ lục số 05-MP, tổ chức, cá nhân chịu trách nhiệm đưa sản phẩm ra thị trường phải có văn bản đề nghị bổ sung (đối với các nội dung không phải công bố mới) kèm theo tài liệu có liên quan đến nội dung bổ sung và phải được sự chấp thuận bằng văn bản của cơ quan nhà
      trang_pdf: 12
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 15
      noi_dung: Điều 15. Những sản phẩm mỹ phẩm chứa các thành phần sau đây thì vẫn được phép lưu thông trên thị trường 1. Các thành phần hoặc nguyên liệu được liệt kê trong Phụ lục III (Annex III), phần 2, trong giới hạn và theo những điều kiện đã nêu, cho đến ngày được quy định trong cột (g) của Phụ lục này.
      trang_pdf: 14
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 20
      noi_dung: Điều 20. Các nội dung khác thể hiện trên nhãn mỹ phẩm Tổ chức, cá nhân được phép ghi trên nhãn mỹ phẩm những nội dung khác. Những nội dung ghi thêm không được trái với quy định của pháp luật và phải đảm bảo trung thực, chính xác, phản ánh đúng bản chất của hàng hóa, không che khuất, không làm sai lệch những nội dung bắt buộc ghi trên nhãn mỹ phẩm. Chương VI10 (được bãi bỏ) Chương VII XUẤT KHẨU, NHẬP KHẨU MỸ PHẨM
      trang_pdf: 16
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 36
      noi_dung: Điều 36. Nguyên tắc lấy mẫu 1. Lấy mẫu mỹ phẩm để kiểm tra hoặc giám sát chất lượng theo nguyên tắc lấy mẫu ngẫu nhiên và phải lấy mẫu ở những vị trí khác nhau của lô hàng. 2. Lượng mẫu cần lấy để phân tích và để lưu căn cứ vào yêu cầu kiểm tra, tiêu chuẩn chất lượng, phương pháp thử nhưng ít nhất phải đủ cho ba lần ph ân tích hoặc phải đủ để thực hiện phép thử đảm bảo thu được kết quả chính xác và tin cậy.
      trang_pdf: 19
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 41
      noi_dung: 'Điều 41. Kiểm tra nhà nước về chất lượng mỹ phẩm 1. Cơ quan kiểm tra chất lượng mỹ phẩm: a) Cơ quan kiểm tra chất lượng mỹ phẩm ở Trung ương là Cục Quản lý dược - Bộ Y tế. Cục Quản lý dược chỉ đạo hệ thống kiểm nghiệm trên phạm vi toàn quốc.'
      trang_pdf: 21
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 47
      noi_dung: Điều 47. Các trường hợp tạm ngừng tiếp nhận hồ sơ công bố sản phẩm mỹ phẩm, hồ sơ đăng ký quảng cáo mỹ phẩm, tổ chức hội thảo, sự kiện giới thiệu mỹ phẩm 1. Cơ quan quản lý nhà nước có thẩm quyền sẽ tạm ngừng xem xét và tiếp nhận hồ sơ công bố sản phẩm mỹ phẩm 06 tháng đối với các tổ chức, cá nhân có 23 Cụm từ “Sở Y tế các tỉnh, thành phố trực thuộc Trung ương” được thay thế bởi cụm từ “cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh”
      trang_pdf: 24
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
    - dieu: 53
      noi_dung: 'Điều 53. Hiệu lực thi hành29 Các hồ sơ đề nghị cấp chứng chỉ hành nghề hoặc cấp giấy phép hoạt động trước thời điểm Nghị định này có hiệu lực thì áp dụng theo quy định của Nghị định số 109/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ.” Điều 26 Thông tư số 09/2015/TT-BYT, có hiệu lực kể từ ngày 16 tháng 7 năm 2015 quy định như sau: “Điều 26. Quy định chuyển tiếp 1. Tổ chức, cá nhân đã đăng ký hồ sơ quảng cáo sản phẩm, hàng hóa, dịch vụ đặc'
      trang_pdf: 30
      sha256_pdf: 788f22e986685042e8898c6647afa6a7acc4c2506fb3ad0f05a8bab270c0a797
