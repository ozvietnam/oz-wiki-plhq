      noi_dung: Điều 2. Tổ chức thực hiện 1. Trên cơ sở mục tiêu, nhiệm vụ được phê duyệt tại Kế hoạch thực hiện này và căn cứ chức năng, nhiệm vụ đã được phân công, các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương chỉ đạo xây dựng Kế hoạch thực hiện của bộ, ngành, địa phương gửi Bộ Công Thương trước ngày 15 tháng 02 năm 2022 dé tổng hợp và báo cáo Thủ tướng Chính
      trang_pdf: 4
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kế từ ngày ký ban hành.
