      noi_dung: Điều 1. Công bố danh mục các mặt hàng (kèm theo mã HS) đã được cắt giám kiềm tra chuyên ngành thuộc trách nhiệm quản lý của Bộ Công Thương tại Phụ lục kèm theo Quyết định này. Các tổ chức, cá nhân không phải nộp cho cơ quan Hải quan chứng từ liên quan đến kết quả kiểm tra chuyên ngành đối với các sản phẩm, hàng hóa tại Phụ lục kèm theo Quyết định này để thông quan hàng hóa.
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Giao Vụ Khoa học và Công nghệ chủ trì, phối hợp với các cơ quan, đơn vị có liên quan tổ chức thực hiện Quyết định này, kịp thời hướng dẫn và giải đáp những vướng mắc, phát sinh (nếu có).
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kể từ ngày ký ban hành.
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Chánh Văn phòng Bộ; Vụ trưởng Vụ Khoa học và Công nghệ, Thủ trưởng các đơn vị thuộc Bộ Công Thương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Quyết định này./.
      trang_pdf: 2
