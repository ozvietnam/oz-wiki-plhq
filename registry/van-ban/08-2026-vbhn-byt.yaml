  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=217131) và toàn văn PDF (08-vbhn-byt.pdf, 119 trang, 77 điều, Thứ trưởng Đỗ Xuân Tuyên ký): xác thực ngày 06-03-2026, đang còn hiệu lực; hợp nhất Nghị định 98/2021/NĐ-CP ngày 08-11-2021 với 5 Nghị định sửa đổi, bổ sung: 07/2023/NĐ-CP (hiệu lực 03-03-2023), 96/2023/NĐ-CP (hiệu lực 01-01-2024), 85/2024/NĐ-CP (hiệu lực 10-07-2024), 04/2025/NĐ-CP (hiệu lực 01-01-2025) và 342/2025/NĐ-CP (hiệu lực 15-02-2026)'
