  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về việc quản lý thiết bị y tế5 bao gồm: phân loại thiết bị y tế6; sản xuất, nghiên cứu lâm sàng, lưu hành, mua bán, xuất khẩu, nhập khẩu, cung cấp dịch vụ thiết bị y tế7; thông tin, quảng cáo thiết bị y tế8; quản lý giá thiết bị y tế9 và quản lý, sử dụng thiết bị y tế10 tại các cơ sở y tế.'
      trang_pdf: 2
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ 1. Thiết bị y tế14 là các loại thiết bị, vật tư cấy ghép, dụng cụ, vật liệu, thuốc thử và chất hiệu chuẩn in vitro, phần mềm (software) đáp ứng đồng thời các yêu cầu sau đây: a) Được sử dụng riêng lẻ hay phối hợp với nhau theo chỉ định của chủ sở hữu thiết bị y tế15 để phục vụ cho con người nhằm một hoặc nhiều mục đích sau đây: - Chẩn đoán, ngăn ngừa, theo dõi, điều trị và làm giảm nhẹ bệnh tật hoặc bù đắp tổn thương,'
      trang_pdf: 3
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc quản lý thiết bị y tế26 1. Bảo đảm chất lượng, an toàn và sử dụng hiệu quả thiết bị y tế27. 2. Thông tin đầy đủ, chính xác, kịp thời về đặc tính kỹ thuật, công dụng của thiết bị y tế28 và các yếu tố nguy cơ có thể xảy ra đối với người sử dụng. 3. Bảo đảm truy xuất nguồn gốc của thiết bị y tế29.
      trang_pdf: 4
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 14
      noi_dung: Điều 14. Yêu cầu đối với thiết bị y tế phải thử nghiệm lâm sàng111 1. Đáp ứng các yêu cầu về pháp lý và kỹ thuật của hồ sơ đăng ký lưu hành thiết bị y tế theo quy định. 2. Nhãn thiết bị y tế dùng cho thử nghiệm lâm sàng phải ghi dòng chữ “Thiết bị y tế dùng cho thử nghiệm lâm sàng. Cấm dùng cho mục đích khác”. Việc ghi nhãn thực hiện theo quy định của pháp luật về ghi nhãn hàng hóa.
      trang_pdf: 14
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 25
      noi_dung: 'Điều 25. Điều kiện của tổ chức được đứng tên công bố tiêu chuẩn áp dụng hoặc đăng ký lưu hành thiết bị y tế153 1. Tổ chức được đứng tên công bố tiêu chuẩn áp dụng hoặc đăng ký lưu hành thiết bị y tế154 bao gồm: a) Doanh nghiệp, hợp tác xã, hộ kinh doanh của Việt Nam là chủ sở hữu thiết bị y tế155; b) Doanh nghiệp, hợp tác xã, hộ kinh doanh của Việt Nam được ủy quyền của chủ sở hữu thiết bị y tế156;'
      trang_pdf: 23
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 35
      noi_dung: 'Điều 35. Xử lý đối với trường hợp thiết bị y tế323 đã xảy ra sự cố có ảnh hưởng đến sức khỏe người sử dụng 1. Trường hợp thiết bị y tế324 đã xảy ra sự cố đe dọa nghiêm trọng đến sức khỏe cộng đồng hoặc gây tử vong cho người sử dụng, chủ sở hữu số lưu hành có trách nhiệm: a) Thông báo trên trang thông tin điện tử của chủ sở hữu số lưu hành (nếu có) đồng thời có văn bản thông báo về sự cố cho các cơ sở mua bán, sử dụng lô thiết bị y tế325 và Bộ Y'
      trang_pdf: 47
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 45
      noi_dung: Điều 45. Kê khai giá thiết bị y tế431 Danh mục chi tiết của thiết bị y tế kê khai giá, đối tượng thực hiện kê khai giá; cách thức thực hiện và tiếp nhận kê khai giá thiết bị y tế thực hiện theo quy định của pháp luật về giá. Mục 3 XUẤT KHẨU, NHẬP KHẨU THIẾT BỊ Y TẾ432
      trang_pdf: 58
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 55
      noi_dung: Điều 55. Nguyên tắc kiểm định, hiệu chuẩn thiết bị y tế514 1. Thiết bị y tế515 thuộc danh mục do Bộ trưởng Bộ Y tế công bố phải kiểm định về an toàn và tính năng kỹ thuật trước khi đưa vào sử dụng (trừ trường hợp quy định tại Điều 57 Nghị định này), định kỳ, sau sửa chữa lớn. Việc kiểm định thiết bị y tế516 là phương tiện đo, thiết bị bức xạ thực hiện theo quy định tại khoản 2 Điều này.
      trang_pdf: 69
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 66
      noi_dung: Điều 66. Các thủ tục thực hiện trực tuyến 1. Công bố đủ điều kiện sản xuất thiết bị y tế588. 2. Công bố tiêu chuẩn áp dụng thiết bị y tế589. 3. Đăng ký lưu hành thiết bị y tế590. 4. Công bố đủ điều kiện mua bán thiết bị y tế591. 5. Công bố đủ điều kiện tư vấn về kỹ thuật thiết bị y tế592. 6. Đề nghị cấp giấy chứng nhận đăng ký hoạt động kiểm định thiết bị y tế593. 7. Đề nghị cấp giấy phép nhập khẩu thiết bị y tế594.
      trang_pdf: 77
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
    - dieu: 148
      noi_dung: Điều 148. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương và các cơ quan, tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này. " - Điều 30 Nghị định số 85/2024/NĐ-CP ngày 10/7/2024 của Chính phủ quy định một số điều của Luật Giá “Điều 30. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành”.
      trang_pdf: 87
      sha256_pdf: ede593a3a2ad7a99f424b83646efc1c277deff1e4d819517cfc12da77d926188
ghi_chu: 'Trinh sát đêm 7/11 phát hiện thiếu hụt: VBHN hợp nhất NĐ quản lý TB-YT (98/2021 sửa 36/2016) tồn từ 06-03 mà sổ chưa nạp — nền cho phân loại thiết bị y tế nhóm 9018-9022.'
