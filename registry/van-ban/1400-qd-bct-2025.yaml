xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF bản gốc ký số trên cổng Cục Phòng vệ thương mại — Bộ Công Thương (pvtm.gov.vn / trav.gov.vn, 7 trang gồm Quyết định 2 trang và Thông báo kèm theo 5 trang): số hiệu 1400/QĐ-BCT, ban hành ngày 12-06-2026, trích yếu "Áp dụng thuế chống bán phá giá chính thức đối với một số sản phẩm kính nổi không màu có xuất xứ từ Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a", người ký Thứ trưởng Nguyễn Sinh Nhật Tân (căn cứ Luật Quản lý ngoại thương ngày 12-6-2017; Nghị định 40/2025/NĐ-CP ngày 26-02-2025; Nghị định 86/2025/NĐ-CP ngày 11-4-2025; Thông tư 26/2025/TT-BCT ngày 15-5-2025; Quyết định 536/QĐ-BCT ngày 28-02-2025; Quyết định 2093/QĐ-BCT ngày 18-7-2025 về việc điều tra áp dụng biện pháp CBPG; Quyết định 228/QĐ-BCT ngày 30-01-2026 về việc áp dụng thuế CBPG tạm thời). Trích nguyên văn các điều của Quyết định: "Điều 1. Áp dụng thuế chống bán phá giá chính thức đối với một số sản phẩm kính nổi không màu có xuất xứ từ Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a được phân loại theo các mã HS 7005.29.20, 7005.29.90 (mã vụ việc: AD22) với nội dung chi tiết nêu tại Thông báo kèm theo Quyết định này. Điều 2. Quyết định này có hiệu lực kể từ ngày 14 tháng 6 năm 2026. Điều 3. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại và Thủ trưởng các đơn vị, các bên liên quan chịu trách nhiệm thi hành Quyết định này./." Trích nguyên văn Mục 4 Thông báo kèm theo Quyết định số 1400/QĐ-BCT ngày 12-06-2026: "4. Hiệu lực và thời hạn áp dụng thuế chống bán phá giá chính thức: a) Hiệu lực: Thuế chống bán phá giá chính thức có hiệu lực kể từ ngày 14 tháng 6 năm 2026. b) Thời hạn áp dụng: Thuế chống bán phá giá chính thức có thời hạn áp dụng là 05 (năm) năm kể từ ngày có hiệu lực (trừ trường hợp được gia hạn, thay đổi, hủy bỏ theo Quyết định khác của Bộ trưởng Bộ Công Thương)." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên pvtm.gov.vn và trav.gov.vn: QĐ 1400/QĐ-BCT đang CON_HIEU_LUC (thời hạn 05 năm kể từ ngày 14-06-2026 đến ngày 14-06-2031), thay thế biện pháp thuế CBPG tạm thời tại QĐ 228/QĐ-BCT ngày 30-01-2026; chưa có văn bản nào sửa đổi, thay thế hay bãi bỏ QĐ 1400/QĐ-BCT.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Mã vụ việc AD22 (2 mã HS tại Điều 1 và Mục 1.b Thông báo kèm theo: 7005.29.20, 7005.29.90; đều có trong nhu-cau/bieu-thue.json; bản chụp nhu-cau/hs-code-api.json và nhu-cau/bieu-thue-van-ban.json hiện vẫn đang dẫn QĐ 228/QĐ-BCT ở 2 mã HS này, chưa cập nhật sang số hiệu 1400/QĐ-BCT nên chưa gắn trường trich_dan_trong_bieu_thue). Mức thuế CBPG chính thức tại Mục 3 Thông báo kèm theo: Indonesia từ 32,78% đến 43,78% (PT Muliaglass 32,78%; PT Asahimas Flat Glass TBK 43,78%; PT Xinyi Glass Indonesia 43,78%; tổ chức, cá nhân khác 43,78%); Malaysia từ 41,07% đến 63,39% (Jinjing Technology Malaysia SDN. BHD. 41,07%; Kibing Group (M) SDN. BHD. / SBH Kibing Solar New Materials (M) SDN. BHD. 54,83%; Xinyi Energy Smart (Malaysia) SDN. BHD. 53,32%; tổ chức, cá nhân khác 63,39%). Đã gỡ 2093/QĐ-BCT khỏi quan_he.thay_the (khởi tạo cũ ghi nhầm) và chuyển sang thay_the 228/QĐ-BCT từ ngày 14-06-2026 vì QĐ 2093/QĐ-BCT ngày 18-07-2025 (https://pvtm.gov.vn/data/00195410-a87c-4a80-989d-83a83a4e020d/userfiles/files/QD%202093%20QD%20BCT%2018_7_2025%20khoi%20xuong%20dieu%20tra%20kinh%20noi.pdf, mục registry/van-ban/2093-qd-bct.yaml) là quyết định khởi xướng điều tra vụ việc AD22 được dẫn làm căn cứ ban hành QĐ 1400/QĐ-BCT, không phải quyết định áp thuế bị thay thế.'
