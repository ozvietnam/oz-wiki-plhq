  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=214604) và toàn văn PDF ký số trên datafiles.chinhphu.vn (95qh.signed.pdf): Quốc hội thông qua ngày 27-06-2025, có hiệu lực thi hành từ ngày 01-01-2026; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
