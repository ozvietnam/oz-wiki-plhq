  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh : _ Luật này quy định về hoạt động đường sắt; quyền, nghĩa vụ và trách nhiệm của tổ chức, cá nhân liên quan đên hoạt động đường sắt. :'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tô chức, cá nhân trong nước; tô chức, cá nhân nước ngoài có liên quan đến hoạt động đường sắt trên lãnh thô nước Cộng hòa xã hội chủ nghĩa Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Hoạt động đường sat là hoạt động của tổ chức, cá nhân trong lĩnh vực: quy hoạch, dau tư xây dựng, quản lý, bảo trì, bảo vệ kết câu hạ tâng đường sắt; vận tải đường sat, công nghiệp đường sắt; an toàn giao thông đường sat; kinh doanh đường sắt và các hoạt động khác có liên quan. - 2. Chạy tàu là hoạt động để di chuyển phương tiện giao thông đường sắt.'
      trang_pdf: 1
    - dieu: 12
      noi_dung: 'Điều 12. Hệ thống báo hiệu cố định trên đường sắt 1. Hệ thống báo hiệu cố định trên đường sắt bao gồm: biển hiệu, mốc hiệu; biển báo; rào, chắn; cọc mốc chỉ giới; các báo hiệu khác. 2. Hệ thống báo hiệu cố định trên đường sắt phải được xây dựng, lắp đặt đầy đủ phù hợp với cấp kỹ thuật đường sắt và loại đường sắt, bảo dam thường xuyên hoạt động tôi.'
      trang_pdf: 6
    - dieu: 19
      noi_dung: 'Điều 19. Quy hoạch đường sắt 1. Quy hoạch mạng lưới đường sat: a) Quy hoach mang lưới đường sắt là quy hoạch ngành quốc gia; làm cơ sở định hướng đầu tư, phát triên, khai thác mạng lưới đường sắt quôc gia; b) Bộ trưởng Bộ Xây dựng tô chức lập, thâm định, phê duyệt quy hoạch mạng lưới đường sat.'
      trang_pdf: 9
    - dieu: 27
      noi_dung: Điều 27. Thiết kế kỹ thuật tông thé 1. Dự án đường sắt được lập thiết kế kỹ thuật tổng thé (Front-End Engineering Design, gọi tắt là thiết kê FEED) thay thê cho thiệt kê cơ sở trong Báo cáo nghiên cứu khả thi; việc lựa chọn nhà thâu theo hình thức hợp đông EPC, EC, EP được thực hiện trên cơ sở dự án đầu tư được phê duyệt; chủ dau tu được quyết định việc phê duyệt đôi với các bước thiết kế sau thiệt kê FEED.
      trang_pdf: 13
    - dieu: 35
      noi_dung: Điều 35. Bảo đảm phòng, chống tham nhũng, lãng phí, tiêu cực 1. Đối với việc lựa chọn nhà đầu tư, nhà thầu thực hiện các gói thâu EPC, EC, EP, gói thầu tư van sử dụng nhà thầu nước ngoài, Bộ Quốc phòng, Bộ Công an, Bộ Xây dựng, Bộ Tài chính, Bộ Khoa học và Công nghệ, Thanh tra Chính phủ, Kiêm toán nhà nước có trách nhiệm cử đại diện tham gia tô thâm định hô sơ mời thầu, hồ sơ yêu câu, kết quả lựa chọn nhà thâu;
      trang_pdf: 16
    - dieu: 43
      noi_dung: Điều 43. Kinh phí quan lý, bảo trì và bảo vệ tài sản kết cấu hạ tầng đường sắt 1. Kinh phí quản lý, bảo trì và bảo vệ tài sản kết cầu hạ tầng đường sắt,
      trang_pdf: 19
    - dieu: 50
      noi_dung: 'Điều 50. Vận tải phục vụ nhiệm vụ đặc biệt, an sinh xã hội và vận tải hàng hoá nguy hiểm J: Vận tải phục vụ nhiệm vụ đặc biệt là vận tải người, hàng hoá và trang thiệt bị đê phòng, chông, khắc phục hậu quả thiên tai, tai nạn, dịch bệnh, thực hiện nhiệm vụ khan cấp về quốc phòng, an ninh.'
      trang_pdf: 24
    - dieu: 59
      noi_dung: Điều 59. Quy định chuyên tiếp 1. Dự án đường sắt đã được quyết định chủ trương đầu tư trước ngày Luật này có hiệu lực thi hành thì người quyết định dâu tư quyết định việc áp dụng các quy định theo quyết định chủ trương dau tư đã được phê duyệt hoặc theo quy định của Luật này đối với các bước tiép theo.
      trang_pdf: 30
