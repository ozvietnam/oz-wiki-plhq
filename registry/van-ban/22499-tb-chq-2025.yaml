xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/6/8.VB_22499.pdf, id=101251, SHA-256 d591be231da1fc95defdbb3c42b2d4d5444357d525781558f3c4e2c5ab651662): Thông báo số 22499/TB-CHQ ngày 05-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Xe vận chuyển phục vụ giải khát trong sân gôn loại chạy điện hiệu LEROAD (ký, mã hiệu VENDING CART - Product model: LRGD/2; cấu tạo xe 4 bánh, khung sắt mạ kẽm nhúng nóng, hệ thống treo nhíp lá kèm xi lanh thủy lực giảm chấn, động cơ điện 2 chiều AC 48V công suất 5kW, pin Lithium 48V-105Ah, vận tốc lớn nhất 25 km/h, trọng lượng toàn bộ xe 640 kg, trọng lượng hàng hóa chuyên chở tối đa ở thùng hàng 320 kg, kích thước xe 3390 x 1210 x 1780 mm, bán kính quay vòng tối thiểu 3300 mm, 2 chỗ ngồi kể cả lái xe, kính chắn gió bằng mica, mui xe khung sắt bọc vải canvas cố định, hệ thống đèn LED trước/sau và gương chiếu hậu 2 bên; phía sau gắn cố định thùng kín chứa đồ giữ nhiệt bằng inox kích thước 1350 x 1140 x 1040 mm gồm 3 ngăn 45L ở trên có cánh đóng mở, 4 ngăn cách nhiệt 37L ở dưới dạng ray trượt và bình nước giữ nhiệt 2.5L; dùng phục vụ nước giải khát nội bộ trong khu vực sân gôn, không đăng ký lưu hành, không tham gia giao thông), phân loại vào nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
