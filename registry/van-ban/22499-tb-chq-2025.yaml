ghi_chu: 'Xác định trước mã số mặt hàng Xe vận chuyển phục vụ giải khát nội bộ trong sân gôn loại chạy điện hiệu LEROAD, không đăng ký lưu hành, không tham gia giao thông (ký, mã hiệu VENDING CART - Product model: LRGD/2; xe 4 bánh, động cơ điện AC 48V 5kW, pin Lithium 48V-105Ah, vận tốc tối đa 25 km/h, tự trọng 640 kg, tải trọng thùng hàng tối đa 320 kg, kích thước 3390 x 1210 x 1780 mm, 2 chỗ ngồi, thùng giữ nhiệt inox cố định phía sau kích thước 1350 x 1140 x 1040 mm gồm 3 ngăn 45L, 4 ngăn cách nhiệt 37L và bình giữ nhiệt 2.5L) thuộc nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29.'
