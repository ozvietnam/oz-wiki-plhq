  pham_vi: 'Đối chiếu PDF ký số Chính phủ 16 trang đã OCR (SHA-256 80700ffc6e0e47971ca09388a0a59a4abd5a73270234b006680e9a3d00137f38): ban hành 31-12-2022, hiệu lực từ 01-01-2023 (khoản 1 Điều 21); thay thế NĐ 54/2010/NĐ-CP, bãi bỏ NĐ 22/2022/NĐ-CP (khoản 5 Điều 21) và một phần NĐ 32/2012/NĐ-CP (khoản 4 Điều 21).'
