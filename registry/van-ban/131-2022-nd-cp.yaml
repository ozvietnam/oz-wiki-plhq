  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Nghị định này quy định chỉ tiết điểm d và điểm e khoản 2 Điều 5; khoản 1 và điểm a khoản 3 Điều 14; điểm a và điểm c khoản 3 Điều 19; khoản 2 Điều 20; điểm b, điểm c, điểm d, điểm đ khoản 2, điểm a khoản 3 và khoản 4 Điều 21; khoản 2 Điều 22; khoản 2 Điều 38; khoản 2 Điều 42 Luật Điện ảnh, gồm các nội dung sau: 7'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với cơ quan, tổ chức, cá nhân Việt Nam tham gia hoạt động điện ảnh tại Việt Nam và ở nước ngoài; tổ chức, cá nhân nước ngoài tham gia hoạt động điện ảnh tại Việt Nam và cơ quan quản lý nhà nước vệ điện ảnh, cơ quan, tổ chức, cá nhân có liên quan đến hoạt động điện ảnh.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Giải thích từ ngữ 1. Chủ đầu tư dự án sản xuất phim sử dụng ngân sách nhà nước (sau đây gọi là Chú đầu tư) là cơ quan, don vị được quy định tại khoản 2 Điều 14 Luật Điện ảnh.
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Đầu tư, hỗ trợ nghiên cứu, ứng dụng thành tựu khoa học và ˆ aA on ok A 2A - công nghệ tiên tiên trong hoạt động điện ảnh 1. Đầu tư công nghệ tiên tiến phục vụ các hoạt động điện ảnh và công tác quản lý nhà nước. 2. Số hóa phim, kịch bản, đữ liệu, tài liệu khác và xây dựng hệ thống hạ tầng lưu trữ của các cơ sở lưu trữ phim và các cơ quan quản lý nhà nước về điện ảnh.
      trang_pdf: 5
    - dieu: 9
      noi_dung: Điều 9. Tỷ lệ suất chiếu phim, Việt Nam, khung giờ chiếu phim Việt Nam, thời lượng và khung giờ chiếu phim cho trẻ em trong hệ thống rap chiéu phim | 1. Phim Việt Nam phải được chiêu trong hệ thông rap chiêu phim, đặc biệt vào các đợt phim kỷ niệm các ngày lễ lớn của đất nước, phục vụ nhiệm vụ chính trị, xã hội, đối ngoại theo yêu cầu của co quan nhà nước có thâm quyền. | 2. Phim Việt Nam được ưu tiên chiếu vào khung thời gian từ 18 đến 22 giờ.
      trang_pdf: 8
    - dieu: 11
      noi_dung: 'Điều 11. Tỷ lệ thời lượng phát sóng phim Việt Nam so với phim nước ngoài, khung giờ phát sóng phim Việt Nam, thời lượng và khung giờ phát sóng phim cho trẻ em trên các kênh có phát phim trên kênh truyền h hình trong nước - 1. Phim Việt Nam được phát sóng trên các kênh truyền hình trong nước phải được: a) Tăng thời lượng chiếu vào các ngày lễ lớn của đất nước, phục vụ nhiệm vụ chính trị, xã hội, đối ngoại;'
      trang_pdf: 9
    - dieu: 13
      noi_dung: Điều 13. Thông báo danh sách phim sẽ phố biến và kết quả phân loại phim cho Bộ Văn hóa, Thể thao và Du lịch trước khi thực hiện phố biến phim trên không gian mạng
      trang_pdf: 11
    - dieu: 15
      noi_dung: 'Điều 15. Cung cấp đầu mối, thông tin liên hệ dé tiếp nhận, xử lý yêu cầu của cơ quan quản lý nhà nước | 1. Doanh nghiép, don vi su nghiép, tổ chức thực hiện hoạt động phổ biến phim trên không gian mạng phải cung cấp các thông tin sau cho cơ quan rihà nước có thâm quyền về điện ảnh của Bộ Văn hoá, Thể thao và Du lịch: | a) Tén doanh nghiép, don vi su nghiép, tô chức;'
      trang_pdf: 12
    - dieu: 18
      noi_dung: Điều 18. Cơ quan nhà nước có thẩm quyền tại địa phương tiếp nhận thông báo về việc chiếu phim công cộng 1. Ủy ban nhân dân cấp tỉnh tiếp nhận thông báo của các nhà hát, nhà văn hóa, nha triên lãm, trung tâm văn hóa, câu lạc bộ, sân vận động, nhà thi dau thê _ thao, quảng trường.
      trang_pdf: 14
    - dieu: 21
      noi_dung: Điều 21. Điều khoản thi hành 1. Nghị định nay có hiệu lực thi hành từ ngày 01 tháng 01 năm 2023. 2. Nghị định này thay thế Nghị định số 54/2010/NĐ-CP ngày 21 tháng 5 năm 2010 của Chính phủ quy định chỉ tiết thi hành một số điều của Luật Điện ảnh số 62/2006/QH1 1 và Luật sửa đổi, bổ sung một số điều của Luật Điện ảnh số 31/2009/QH12.
      trang_pdf: 15
ghi_chu: Nghị định hướng dẫn Luật Điện ảnh 2022; liên quan quy định nhập khẩu phim không nhằm mục đích kinh doanh (Công văn 295/ĐA-PBP).
