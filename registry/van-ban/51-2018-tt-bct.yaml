  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Nguyên tắc quản lý nhập khẩu các chất làm suy giảm tầng ô-dôn Khoản 3 Điều 2 Thông tư số 47 được sửa đổi, bổ sung như sau: "3. Việc quản lý nhập khẩu các chất HCFC thuộc Phụ lục I Thông tư số 47 được thực hiện theo các nguyên tắc sau:'
      trang_pdf: 1
      sha256_pdf: c23b8f68f4aadc3e9c0deef159df5047ce376cb0f1b78ff66c43397ade533d3b
    - dieu: 2
      noi_dung: 'Điều 2. Thủ tục cấp giấy phép nhập khẩu các chất HCFC Điểm a khoản 2 Điều 4 Thông tư số 47 được bổ sung như sau: “- Đơn đăng ký nhập khẩu các chất HCFC theo mẫu quy định tại Phụ lục IIb của Thông tư này. Phụ lục IIb của Thông tư này thay thế Phụ lục II của Thông tư 47”'
      trang_pdf: 2
      sha256_pdf: c23b8f68f4aadc3e9c0deef159df5047ce376cb0f1b78ff66c43397ade533d3b
    - dieu: 3
      noi_dung: 'Điều 3. Thủ tục tạm nhập tái xuất các chất HCFC Khoản 1 Điều 7 của Thông tư số 47 được sửa đổi, bổ sung như sau: "Thủ tục tạm nhập, tái xuất các chất HCFC thực hiện theo quy định tại Nghị định 69/2018/NĐ-CP ngày 15 tháng 5 năm 2018 của Chính phủ quy định chi tiết một số điều của Luật Quản lý ngoại thương."'
      trang_pdf: 2
      sha256_pdf: c23b8f68f4aadc3e9c0deef159df5047ce376cb0f1b78ff66c43397ade533d3b
    - dieu: 4
      noi_dung: 'Điều 4. Chế độ cáo cáo Điều 8 Thông tư số 47 được sửa đổi, bổ sung như sau: "Thương nhân thực hiện chế độ báo cáo tình hình nhập khẩu các chất HCFC theo mẫu quy định tại Phụ lục VIIb của Thông tư này về Bộ Công Thương như sau: 1. Báo cáo theo từng quý về nhập khẩu các chất HCFC theo giấy phép nhập khẩu đã được cấp và báo cáo gửi về Bộ Công Thương trước ngày 5 của quý tiếp theo.'
      trang_pdf: 2
      sha256_pdf: c23b8f68f4aadc3e9c0deef159df5047ce376cb0f1b78ff66c43397ade533d3b
