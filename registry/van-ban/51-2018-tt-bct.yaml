  pham_vi: 'cổng Bộ Công Thương (moit.gov.vn, người ký Bộ trưởng Trần Tuấn Anh, tệp đính kèm _VB_1545635055105_VB_tt 51.pdf) và cạnh ngược trong sổ: Thông tư 51/2018/TT-BCT sửa đổi, bổ sung một số điều của Thông tư liên tịch 47/2011/TTLT-BCT-BTNMT ngày 30-12-2011, ban hành ngày 19-12-2018, có hiệu lực thi hành từ ngày 04-02-2019; hết hiệu lực một phần từ ngày 05-02-2020 khi Điều 4 bị bãi bỏ bởi điểm b khoản 2 Điều 37 Thông tư 42/2019/TT-BCT'
