  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/15/4.VB_17479.pdf, id=104775, SHA-256 13b2430f67e24f80604677608635a70bb59e0f560cea3593678997925d6b02b4): Thông báo số 17479/TB-CHQ ngày 15-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Đầu nối điện làm điểm đo thử nghiệm điện dạng gắn bề mặt (SMT Test Terminal, ký mã hiệu S2761-46R; cấu tạo nguyên khối từ đồng thau dày 0,20 mm mạ lót Ni-ken và mạ bề mặt Thiếc, kích thước 1,60 x 0,80 x 1,15 mm, hàn cố định lên bảng mạch in PCB bằng công nghệ SMT để truyền dẫn tín hiệu điện sang đầu dò test probe hoặc kẹp đo test clip của thiết bị kiểm tra, điện áp sử dụng dưới 1.000V, dòng điện định mức tối đa 3,5A), phân loại vào nhóm 85.36, phân nhóm 8536.90, mã số 8536.90.94; có hiệu lực từ ngày ký'
