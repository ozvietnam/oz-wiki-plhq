  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hoạt động xây dựng, công bố và áp dụng tiêu chuẩn; xây dựng, ban hành và áp dụng quy chuẩn kỹ thuật; đánh giá sự phù hợp với tiêu chuẩn, quy chuẩn kỹ thuật.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân Việt Nam, tổ chức, cá nhân nước ngoài, người Việt Nam định cư ở nước ngoài có hoạt động liên quan đến tiêu chuẩn và quy chuẩn kỹ thuật tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Tiêu chuẩn là quy định về đặc tính kỹ thuật và yêu cầu quản lý dùng làm chuẩn để phân loại, đánh giá sản phẩm, hàng hoá, dịch vụ, quá trình, môi trường và các đối tượng khác trong hoạt động kinh tế - xã hội nhằm nâng cao chất lượng và hiệu quả của các đối tượng này. Tiêu chuẩn do một tổ chức công bố dưới dạng văn bản để tự nguyện áp dụng.'
      trang_pdf: 1
    - dieu: 13
      noi_dung: 'Điều 13. Căn cứ xây dựng tiêu chuẩn Tiêu chuẩn được xây dựng dựa trên một hoặc những căn cứ sau đây: 1. Tiêu chuẩn quốc tế, tiêu chuẩn khu vực, tiêu chuẩn nước ngoài; 2. Kết quả nghiên cứu khoa học và công nghệ, tiến bộ kỹ thuật; 3. Kinh nghiệm thực tiễn; 4. Kết quả đánh giá, khảo nghiệm, thử nghiệm, kiểm tra, giám định.'
      trang_pdf: 1
    - dieu: 23
      noi_dung: Điều 23. Nguyên tắc áp dụng tiêu chuẩn 1. Tiêu chuẩn được áp dụng trên nguyên tắc tự nguyện. Toàn bộ hoặc một phần tiêu chuẩn cụ thể trở thành bắt buộc áp dụng khi được viện dẫn trong văn bản quy phạm pháp luật, quy chuẩn kỹ thuật. 2. Tiêu chuẩn cơ sở được áp dụng trong phạm vi quản lý của tổ chức công bố tiêu chuẩn.
      trang_pdf: 1
    - dieu: 32
      noi_dung: 'Điều 32. Trình tự, thủ tục xây dựng, thẩm định, ban hành quy chuẩn kỹ thuật 1. Trình tự, thủ tục xây dựng, thẩm định, ban hành quy chuẩn kỹ thuật quốc gia được quy định như sau: a) Căn cứ kế hoạch xây dựng quy chuẩn kỹ thuật đã được phê duyệt, cơ quan ban hành quy chuẩn kỹ thuật quốc gia quy định tại Điều 27 của Luật này tổ chức việc xây dựng quy chuẩn kỹ thuật quốc gia với sự tham gia của đại diện cơ quan nhà nước, tổ chức khoa học và công'
      trang_pdf: 1
    - dieu: 41
      noi_dung: Điều 41. Hình thức đánh giá sự phù hợp 1. Việc đánh giá sự phù hợp với tiêu chuẩn và quy chuẩn kỹ thuật do tổ chức đánh giá sự phù hợp thực hiện hoặc tổ chức, cá nhân công bố sự phù hợp tự thực hiện. 2. Đánh giá sự phù hợp với tiêu chuẩn được thực hiện tự nguyện theo yêu cầu của tổ chức, cá nhân dưới hình thức thử nghiệm, giám định, chứng nhận hợp chuẩn và công bố hợp chuẩn.
      trang_pdf: 1
    - dieu: 50
      noi_dung: Điều 50. Các tổ chức chứng nhận sự phù hợp 1. Đơn vị sự nghiệp hoạt động dịch vụ kỹ thuật. 2. Doanh nghiệp. 3. Chi nhánh của tổ chức chứng nhận nước ngoài tại Việt Nam.
      trang_pdf: 1
    - dieu: 60
      noi_dung: 'Điều 60. Trách nhiệm của bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ 1. Bộ, cơ quan ngang bộ trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm sau đây: a) Xây dựng, ban hành hoặc trình cơ quan nhà nước, người có thẩm quyền ban hành văn bản quy phạm pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật có liên quan; b) Tổ chức lập và phê duyệt quy hoạch, kế hoạch xây dựng quy chuẩn kỹ thuật quốc gia;'
      trang_pdf: 1
    - dieu: 70
      noi_dung: Điều 70. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2007.
      trang_pdf: 1
ghi_chu: Luật khung về hệ thống tiêu chuẩn quốc gia (TCVN), quy chuẩn kỹ thuật quốc gia (QCVN) và công bố hợp chuẩn, hợp quy đối với hàng hóa xuất nhập khẩu.
