xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=30035), tệp toàn văn (31074_l68qh.doc) và cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/9205.htm): thông qua ngày 29-06-2006, có hiệu lực từ 01-01-2007; đang còn hiệu lực (đã được sửa đổi, bổ sung một số điều bởi Luật 35/2018/QH14 và Luật 70/2025/QH15).'
