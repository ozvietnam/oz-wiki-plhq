  sua_doi:
    - so_hieu: 26/2023/NĐ-CP
      pham_vi: Phụ lục I - Biểu thuế xuất khẩu theo Danh mục mặt hàng chịu thuế (mặt hàng clanhke xi măng nhóm 25.23)
      tu_ngay: '2025-05-19'
      can_cu: Điều 1 và khoản 1 Điều 2 Nghị định 108/2025/NĐ-CP
xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=213700) và toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/108-2025-nd-cp.pdf, SHA-256 177d1e1aa17a069f4b71b87d78abeadc90860295c54171e9c9b0fff544bdb3d6): Nghị định 108/2025/NĐ-CP ban hành 19-05-2025, có hiệu lực từ ngày ký ban hành 19-05-2025 theo khoản 1 Điều 2; đối chiếu đang còn hiệu lực, sửa đổi mức thuế suất thuế xuất khẩu đối với mặt hàng clanhke xi măng (nhóm 25.23: mã 2523.10.10 và 2523.10.90 áp dụng 5%, từ 01-01-2027 áp dụng 10%) tại Phụ lục I Nghị định 26/2023/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Sửa đổi mức thuế suất thuế xuất khẩu đối với mặt hàng clanhke xi măng quy định tại Phụ lục I - Biểu thuế xuất khẩu theo Danh mục mặt hàng chịu thuế ban hành kèm theo Nghị định số 26/2023/NĐ-CP thành các mức thuế suất thuế xuất khẩu mới quy định tại Phụ lục ban hành kèm theo Nghị định này.'
    - dieu: 2
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành'
    - dieu: 2
      khoan: 2
      noi_dung: '2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
