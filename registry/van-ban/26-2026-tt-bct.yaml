    - dieu: 1
      noi_dung: 'Điều 1. Sửa déi, bố sung một số điều của | Thong tư số 23/2024/T T-BCT của Bộ trưởng Bộ Công Thương quy định về quản lý, sử dụng vật liệu nỗ công nghiệp, tiền chất thuốc nỗ thuộc thấm quyền quản lý của Bộ Công Thương 1. Sửa đổi, bô sung Điều 4 như sau:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Bãi bỏ khoản 1, khoản 2 và khoản 3 Điều 1 Thông tư số 38/2025/TT-BCT của Bộ trưởng Bộ Công Thương sửa déi, bỗ sung một số quy định về phân cấp thực hiện thủ tục hành chính trong các lĩnh vực tthuộc phạm vi quản lý của Bộ Công Thương.
      trang_pdf: 4
    - dieu: 3
      noi_dung: 'Điều 3. Bãi bỏ khoản 1 Điều 1 Thông tư số 15/2026/TT-BCT của Bộ trưởng Bộ Công Thương sửa đổi, bỗ sung một số điều của Thông tư số 38/2025/TT-BCT của Bộ trưởng Bộ Công Thương sửa đổi, bố sung một số quy định về phân cấp thực hiện thủ tục hành chính trong các lĩnh vực thuộc phạm vi quản lý của Bộ Công Thương. #ˆ'
      trang_pdf: 4
    - dieu: 7
      noi_dung: 'Điều 7. Sửa đổi, bổ sung, bãi bỏ một số điều khoản của Thông tư số 43/2023/TT-BCT của Bộ trưởng Bộ Công Thương sửa đổi, bố sung một số điều của Thông tư số 57/2018/TT-BCT ngày 26 tháng 12 năm 2018 của Bộ trưởng Bộ Công Thương quy định chỉ tiết một số điều của các Nghị định liên quan đến kinh doanh thuốc lá 1. Sửa đôi, bố sung Điều 3 như sau:'
      trang_pdf: 9
    - dieu: 11
      noi_dung: Điều 11. Bãi bỏ khoản 2 Điều 2 Thông tư số 18/2025/TT-BCT của Bộ trưởng Bộ Công Thương sửa đối, bo sung, bãi bỏ một số quy định tại các Thông tư quy định về kinh doanh xăng dau.
      trang_pdf: 11
    - dieu: 14
      noi_dung: 'Điều 14. Sửa đối, bỗ sung một số điều của Thông tư số 11/2015/TT- BCT của Bộ trưởng Bộ Công Thương quy định về qua cảnh hàng hóa của nước Cộng hòa nhân dân Trung Hoa qua lãnh thé nước Cộng hòa xã hội chủ nghĩa Việt Nam 1. Sửa đối, bé sung khoản 2 Điều 3 như sau: “2, Đối với hàng hóa không thuộc trường hợp quy định tại Khoản | Điều này, việc quá cảnh lãnh thô "Việt Nam chỉ được thực hiện sau khi có giấy phép của cơ quan có thầm quyên.”'
      trang_pdf: 12
    - dieu: 18
      noi_dung: Điều 18. Sửa đổi, bổ sung, bãi bỏ một số quy định của Thông tư số 12/2018/TT-BCT của Bộ trưởng Bộ Công Thương quy định chỉ tiết một số điều của Luật Quản lý ngoại thương và Nghị định số 69/2018/NĐ-CP 1. Bãi bỏ khoản 3 Điều 9. 2. Thay thế Phụ lục X, XI ban hành kèm theo Thông tư số 12/2018/TT- BCT tương ứng bằng các Mẫu số 15, 16 Phần II Phụ lục ban hành kèm theo Thông tư này.
      trang_pdf: 16
    - dieu: 21
      noi_dung: Điều 21. Bãi bỏ khoản 2, khoản 3, khoản 4, khoản 5 Điều 19, khoản 2 Điều 20, Điều 21, khoản 1, khoản 3, khoản 4 Điều 22 Thông tư số 38/2025/TT-BCT.
      trang_pdf: 17
    - dieu: 24
      noi_dung: 'Điều 24. Sửa đỗi, bé sung, bai bo mot số điều khoản của Thông tư số 01/2026/TT-BCT của Bộ trưởng Bộ Công Thương quy định chỉ tiết và hướng dẫn thi hành một số điều của Luật Hóa chất và Nghị định số 26/2026/NĐ- CP của Chính phủ quy định chỉ tiết và hướng dẫn thi hành một số điều của Luật Hóa chat về quản lý hoạt động hóa chất và hóa chất nguy hiểm trong sản phẩm, hàng hóa 1. Sửa đổi, bố sung điểm a khoản 1 Điều | như sau:'
      trang_pdf: 18
    - dieu: 28
      noi_dung: Điều 28. Điều khoản chuyền tiếp 1. Đối với hồ sơ đề nghị giải quyết thủ tục hành chính thuộc các lĩnh vực được quy định tại Thông tu này đã được cơ quan có thầm quyền tiếp nhận hoặc đã được đóng dấu bưu chính trước ngày Thông tư này có hiệu lực thì thực hiện theo quy định của pháp luật đang có hiệu lực điều chỉnh trong lĩnh vực đó tại thời điểm hồ sơ được tiếp nhận.
      trang_pdf: 21
