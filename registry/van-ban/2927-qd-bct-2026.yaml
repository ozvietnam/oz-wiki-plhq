xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu trực tiếp PDF bản gốc ký số Thứ trưởng Lương Hoàng Thái trên Cổng Cục Phòng vệ thương mại (pvtm.gov.vn, 4 trang ảnh quét gồm Quyết định 2 trang và Thông báo kèm theo 2 trang, SHA-256: 50a7a57c4d9df72e7b57604498a061791e660bada62ac7379c992dbde20a975c): QĐ 2927/QĐ-BCT ban hành ngày 04-11-2026 (căn cứ Luật Quản lý ngoại thương 05/2017/QH14; NĐ 351/2026/NĐ-CP; NĐ 86/2025/NĐ-CP; TT 26/2025/TT-BCT; QĐ 2230/QĐ-BCT; QĐ 143/QĐ-BCT ngày 14-01-2025; QĐ 150/QĐ-BCT ngày 21-01-2026; QĐ 1197/QĐ-BCT ngày 22-05-2026). Điều 1 điều chỉnh mức thuế CBPG đối với Nhóm công ty Boxing trên cơ sở kết quả rà soát lần thứ nhất vụ việc cáp thép dự ứng lực từ Malaysia, Thái Lan, Trung Quốc (mã vụ việc AR01.AD17): nhà sản xuất/xuất khẩu Boxing Victory Metal Materials Co., Ltd và 03 công ty thương mại liên quan (Guangdong Longtime International Trade Co., Ltd.; Shandong Shengyili Metal Material Co., Ltd.; Newmeda Materials Co., Limited — thuộc nhóm STT 12 Mục 3 Thông báo kèm theo QĐ 143/QĐ-BCT) được điều chỉnh mức thuế CBPG từ 10,48% xuống 4,47%; Điều 3 giữ nguyên hiệu lực các Quyết định miễn trừ đã ban hành trước ngày QĐ có hiệu lực; Điều 4 có hiệu lực sau 15 ngày kể từ ngày ban hành (từ 19-11-2026) và áp dụng đến hết thời hạn của QĐ 143/QĐ-BCT (29-01-2030); Mục 4 Thông báo giữ nguyên mô tả hàng hóa, mã HS (7312.10.91, 7312.10.99) và mức thuế của các nhóm công ty khác theo QĐ 143/QĐ-BCT.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-26'
  boi: bee3-w37@ozvietnam
ghi_chu: 'Kết quả rà soát lần thứ nhất vụ việc AD17 (mã vụ việc rà soát: AR01.AD17). Văn bản chỉ điều chỉnh mức thuế CBPG của Nhóm công ty Boxing (4,47%) và dẫn chiếu mô tả hàng hóa, mã HS về Quyết định 143/QĐ-BCT (danh-muc/143-qd-bct-2025.csv) nên không tạo bảng CSV mã HS riêng.'
