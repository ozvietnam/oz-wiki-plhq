      noi_dung: 'Điều 12. Trình tự, thủ tục, nội dung kiểm dịch sản phẩm động vật nhập khẩu 1. Đăng ký kiểm dịch a) Trước khi nhập khẩu sản phẩm động vật, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo khoản 2 Điều 10 Thông tư này đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ khai báo qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Cục Chăn nuôi và Thú y thực hiện theo quy định tại điểm b khoản 1 Điều 11 Thông tư này;'
