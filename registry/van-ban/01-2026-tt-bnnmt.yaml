    - dieu: 28
      noi_dung: 25 a) Tổ chức thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật xuất khẩu, nhập khẩu, tạm nhập tái xuất, tạm xuất tái nhập, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam; động vật trên cạn tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật trên cạn tham gia hội chợ, triển lãm và động vật, sản phẩm động vật trên cạn mang theo người theo quy định tại Thông tư này; b) Đối với cơ sở giết mổ động vật; cơ sở sơ chế, chế biến sản phẩm động vật với mục đích để xuất khẩu được Cơ quan kiểm dịch động vật cửa khẩu kiểm tra, giám sát, nếu cơ sở có nhu cầu tiêu thụ nội địa hoặc xuất khẩu sang những nước không có yêu cầu về kiểm dịch xuất khẩu thì Cơ quan kiểm dịch động vật cửa khẩu quản lý cơ sở đó cấp Giấy chứng nhận kiểm dịch theo quy định về kiểm dịch sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh. 3. Trách nhiệm của Cơ quan quản lý chuyên ngành thú y cấp tỉnh a) Tổ chức thực hiện kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo quy định tại Thông tư này và hướng dẫn của Cục Chăn nuôi và Thú y; b) Phối hợp với Cơ quan kiểm dịch động vật cửa khẩu thuộc Cục Chăn nuôi và Thú y hướng dẫn, giám sát vệ sinh thú y nơi cách ly kiểm dịch động vật giống nhập khẩu; c) Tổ chức thực hiện kiểm dịch động vật, sản phẩm động vật theo ủy quyền của Cục Chăn nuôi và Thú y; d) Ủy quyền cho kiểm dịch viên động vật thực hiện việc kiểm dịch và cấp Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi tỉnh theo đúng quy định của pháp luật; đ) Chịu trách nhiệm về việc ủy quyền và thường xuyên hướng dẫn, kiểm tra, giám sát việc kiểm dịch và cấp Giấy chứng nhận kiểm dịch đối với người được ủy quyền; e) Thông báo cho các cơ quan, ban ngành liên quan danh sách người được ủy quyền thực hiện việc kiểm dịch và cấp Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật; g) Công bố và báo cáo Cục Chăn nuôi và Thú y danh sách các cơ sở trên địa bàn tỉnh đã thực hiện giám sát dịch bệnh, phòng bệnh bằng vắc-xin còn thời gian miễn dịch bảo hộ; các cơ sở an toàn dịch bệnh động vật; các cơ sở sơ chế, chế biến được giám sát vệ sinh thú y. 4. Trách nhiệm của chủ hàng a) Chấp hành các quy định của pháp luật về thú y và pháp luật khác có liên quan trong việc kiểm dịch động vật, sản phẩm động vật; b) Thanh toán các chi phí kiểm dịch, xét nghiệm; các khoản chi phí thực tế cho việc xử lý, tiêu hủy lô hàng không đạt yêu cầu (nếu có) theo quy định hiện hành; c) Đối với trường hợp gửi hồ sơ giấy thành phần hồ sơ có yêu cầu bản chụp,
