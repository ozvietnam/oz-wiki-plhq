ghi_chu: TT mới nhất 2026 về kiểm dịch động vật trên cạn. Thay thế các TT cũ. Áp dụng cho mọi lô hàng XK NK có mã HS thuộc Phụ lục I (bò, lợn, gia cầm, sữa, trứng, mật ong, da, lông).
