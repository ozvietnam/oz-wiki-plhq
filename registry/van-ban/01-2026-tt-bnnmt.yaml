    - dieu: 10
      noi_dung: 'Điều 10. Hồ sơ kiểm dịch động vật, sản phẩm động vật nhập khẩu 1. Hồ sơ đăng ký kiểm dịch động vật nhập khẩu gồm: a) Đơn đăng ký kiểm dịch động vật, sản phẩm động vật nhập khẩu theo mẫu 19 quy định tại Phụ lục V ban hành kèm theo Thông tư này; b) Văn bản hoặc giấy phép theo quy định đối với động vật thuộc đối tượng quản lý của Cơ quan nhà nước có thẩm quyền liên quan khác. 2. Hồ sơ đăng ký kiểm dịch sản phẩm động vật nhập khẩu gồm: a) Đơn đăng ký kiểm dịch động vật, sản phẩm động vật nhập khẩu theo mẫu 19 quy định tại Phụ lục V ban hành kèm theo Thông tư này (đối với hồ sơ đăng ký kiểm dịch nhập khẩu bột thịt xương, đơn đăng ký theo mẫu 20 quy định tại Phụ lục V ban hành kèm theo Thông tư này); b) Văn bản hoặc giấy phép theo quy định đối với sản phẩm động vật thuộc đối tượng quản lý của Cơ quan nhà nước có thẩm quyền liên quan khác. 3. Hồ sơ khai báo kiểm dịch động vật, sản phẩm động vật nhập khẩu gồm: a) Đơn khai báo kiểm dịch theo mẫu 3 quy định tại Phụ lục V ban hành kèm theo Thông tư này; b) Bản chụp Giấy chứng nhận kiểm dịch của nước xuất khẩu (có xác nhận của doanh nghiệp, sau đó chủ hàng phải gửi bản gốc khi kiểm tra hàng hóa hoặc khi kiểm tra hồ sơ đối với trường hợp lô hàng chỉ kiểm tra hồ sơ) hoặc bản gốc Giấy chứng nhận kiểm dịch của nước xuất khẩu; Trường hợp Cục Chăn nuôi và Thú y và Cơ quan thẩm quyền của nước 9 xuất khẩu có thống nhất về chứng nhận điện tử thì sử dụng Giấy chứng nhận kiểm dịch điện tử.'
