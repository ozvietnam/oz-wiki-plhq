      noi_dung: 'Điều 20. Trình tự, thủ tục, nội dung kiểm dịch động vật, sản phẩm động vật nhập, xuất kho ngoại quan 1. Đăng ký kiểm dịch a) Trước khi thực hiện nhập, xuất kho ngoại quan động vật, sản phẩm động vật, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 2 Điều 17 Thông tư này đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính;'
