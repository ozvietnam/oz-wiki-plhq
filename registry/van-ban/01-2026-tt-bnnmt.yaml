      noi_dung: Điều 21. Kiểm dịch động vật trên cạn tham gia hội chợ, triển lãm, biểu diễn nghệ thuật, thi đấu thể thao; sản phẩm động vật trên cạn tham gia hội chợ, triển lãm 1. Kiểm dịch đối với động vật trên cạn vận chuyển trong nước để tham gia hội chợ, triển lãm, biểu diễn nghệ thuật, thi đấu thể thao thực hiện theo quy định tại Điều 5 Thông tư này. 2. Kiểm dịch đối với sản phẩm động vật trên cạn vận chuyển trong nước tham gia hội chợ, triển lãm thực hiện theo quy định tại Điều 6 Thông tư này. 3. Kiểm dịch đối động vật trên cạn nhập khẩu để tham gia hội chợ, triển lãm, biểu diễn nghệ thuật, thi đấu thể thao thực hiện theo quy định tại Điều 11 Thông tư này. 4. Kiểm dịch đối với sản phẩm động vật trên cạn nhập khẩu tham gia hội chợ, triển lãm thực hiện theo quy định tại Điều 12 Thông tư này. 5. Khi kết thúc hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật trường hợp chủ hàng có nhu cầu xuất khẩu động vật, sản phẩm động vật trên cạn, việc kiểm dịch thực hiện theo quy định tại Điều 8 Thông tư này. 6. Trong thời gian tham gia và khi kết thúc hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật, chủ hàng phải thực hiện vệ sinh, khử trùng, tiêu độc khu vực tập trung động vật, sản phẩm động vật theo hướng dẫn của Cơ quan quản lý chuyên ngành thú y địa phương.
