  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=216592) và toàn văn PDF bậc A có lớp chữ (raw/download/datafiles.chinhphu.vn/01-2026-tt-bnnmt.pdf, 125 trang, SHA-256 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818): Thông tư số 01/2026/TT-BNNMT ngày 01-01-2026 của Bộ Nông nghiệp và Môi trường quy định về kiểm dịch động vật, sản phẩm động vật trên cạn, cấu trúc 4 Chương, 30 Điều (trang 1–27) và 14 Phụ lục (trang 28–125); có hiệu lực thi hành từ ngày 01-01-2026 theo khoản 1 Điều 30 và thay thế 07 Thông tư cũ của Bộ NN&PTNT (25/2016/TT-BNNPTNT, 35/2018/TT-BNNPTNT, 09/2022/TT-BNNPTNT, 04/2024/TT-BNNPTNT, 24/2019/TT-BNNPTNT, 11/2021/TT-BNNPTNT phần liên quan động vật trên cạn, 01/2024/TT-BNNPTNT phần liên quan); đang còn hiệu lực.'
