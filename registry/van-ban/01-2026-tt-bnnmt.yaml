      noi_dung: Điều 7. Hồ sơ đăng ký kiểm dịch động vật, sản phẩm động vật trên cạn xuất khẩu 1. Đơn đăng ký kiểm dịch động vật xuất khẩu theo mẫu 2a quy định tại Phụ lục V ban hành kèm theo Thông tư này. 2. Đơn đăng ký kiểm dịch sản phẩm động vật xuất khẩu theo mẫu 2b quy định tại Phụ lục V ban hành kèm theo Thông tư này. 3. Văn bản thể hiện yêu cầu nội dung vệ sinh thú y của nước nhập khẩu hoặc chủ hàng (nếu có). 4. Mẫu Giấy chứng nhận kiểm dịch của Cơ quan có thẩm quyền của nước 7 nhập khẩu (nếu có).
