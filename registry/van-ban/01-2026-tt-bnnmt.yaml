      noi_dung: 26 thì bản chụp chỉ cần có ký, đóng dấu, xác nhận của chủ hàng; d) Hoàn toàn chịu trách nhiệm trước pháp luật về tính hợp pháp, chính xác của hồ sơ đăng ký, khai báo kiểm dịch; đ) Bố trí địa điểm cách ly kiểm dịch động vật, sản phẩm động vật nhập khẩu đảm bảo các yêu cầu theo quy định; e) Bố trí kho đảm bảo yêu cầu bảo quản hàng hóa.
