    - dieu: 6
      noi_dung: 'Điều 6. Trình tự, thủ tục, nội dung kiểm dịch sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh 1. Đăng ký kiểm dịch Trước khi vận chuyển sản phẩm động vật ra khỏi địa bàn cấp tỉnh, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 2 Điều 4 Thông tư này đến Cơ quan kiểm dịch động vật nội địa, theo một trong các hình thức: qua Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính. 2. Tiếp nhận và kiểm tra hồ sơ Trong thời hạn 01 ngày làm việc kể từ ngày nhận được hồ sơ đăng ký kiểm dịch, Cơ quan kiểm dịch động vật nội địa tiến hành xem xét tính đầy đủ, hợp lệ của hồ sơ. Trường hợp hồ sơ đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật nội địa thông báo cho chủ hàng thời gian, địa điểm tiến hành kiểm dịch. Trường hợp hồ sơ chưa đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật nội địa trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 3. Nội dung kiểm dịch đối với sản phẩm động vật xuất phát từ cơ sở theo quy định tại khoản 1 Điều 37 Luật Thú y, Cơ quan kiểm dịch động vật nội địa thực hiện như sau: a) Kiểm tra thực trạng hàng hóa; đối chiếu thông tin lô hàng với hồ sơ kiểm dịch; b) Lấy mẫu hoặc hướng dẫn, giám sát việc lấy mẫu kiểm tra các chỉ tiêu theo quy định tại Phụ lục XI ban hành kèm theo Thông tư này; c) Niêm phong hoặc kẹp chì phương tiện chứa đựng, vận chuyển sản phẩm động vật; d) Hướng dẫn, giám sát chủ hàng thực hiện tiêu độc khử trùng phương tiện chứa đựng, vận chuyển sản phẩm động vật; đ) Trong thời hạn 05 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật nội địa cấp Giấy chứng nhận kiểm dịch sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 12c hoặc mẫu 12d quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: sản phẩm động vật không có biểu hiện bất thường về đặc tính đặc trưng của sản phẩm; kết quả xét nghiệm đạt yêu cầu; phương tiện vận chuyển và việc tiêu độc khử trùng đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả 6 lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; e) Hình thức cấp Giấy chứng nhận kiểm dịch theo quy định tại điểm e khoản 3 Điều 5 Thông tư này. 4. Nội dung kiểm dịch đối với sản phẩm động vật đã được lấy mẫu xét nghiệm các chỉ tiêu theo quy định tại Phụ lục XI ban hành kèm theo Thông tư này xuất phát từ cơ sở sơ chế, chế biến, kinh doanh đã được định kỳ kiểm tra vệ sinh thú y hoặc cơ sở không phải thực hiện kiểm tra vệ sinh thú y định kỳ theo quy định của pháp luật về thú y, Cơ quan kiểm dịch động vật nội địa thực hiện như sau: a) Thực hiện theo quy định tại các điểm a, c, d và e khoản 3 Điều này; b) Trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật nội địa cấp Giấy chứng nhận kiểm dịch sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 12c hoặc mẫu 12d quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: sản phẩm động vật không có biểu hiện bất thường về đặc tính của sản phẩm; phương tiện vận chuyển và việc tiêu độc khử trùng đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 5. Cơ quan kiểm dịch động vật nội địa nơi cấp Giấy chứng nhận kiểm dịch tổng hợp thông báo theo tuần cho Cơ quan kiểm dịch động vật nội địa nơi đến qua thư điện tử hoặc fax các thông tin sau đây: Số Giấy chứng nhận kiểm dịch, ngày cấp, loại hàng, số lượng hàng, mục đích sử dụng, biển kiểm soát phương tiện vận chuyển. 6. Kiểm soát vận chuyển ra khỏi địa bàn cấp tỉnh sản phẩm động vật đông lạnh, ướp lạnh làm thực phẩm sau nhập khẩu: Thực hiện theo quy định tại Phụ lục XIII ban hành kèm theo Thông tư này. Mục 2 KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT TRÊN CẠN XUẤT KHẨU'
      trang_pdf: 5
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
