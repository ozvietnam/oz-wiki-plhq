    - dieu: 28
      noi_dung: Điều 28. Trách nhiệm của tổ chức, cá nhân 1. Trách nhiệm của Cục Chăn nuôi và Thú y a) Hướng dẫn các Cơ quan kiểm dịch động vật tổ chức thực hiện việc kiểm dịch động vật, sản phẩm động vật theo quy định tại Thông tư này; b) Hướng dẫn các tổ chức, cá nhân thực hiện việc kiểm dịch động vật, sản phẩm động vật nhập khẩu; c) Hướng dẫn in, sử dụng mẫu hồ sơ kiểm dịch động vật, sản phẩm động vật; d) Hướng dẫn về tiêu chuẩn, tổ chức đào tạo, tập huấn chuyên môn nghiệp vụ về kiểm dịch, cấp thẻ kiểm dịch viên động vật; đ) Chủ trì tổ chức thực hiện theo quy định tại điểm a khoản 1 và điểm a khoản 2 Điều 59 của Luật Thú y; e) Định kỳ, đột xuất kiểm tra đối với Cơ quan kiểm dịch động vật nội địa, kiểm dịch viên được ủy quyền trong việc kiểm dịch và cấp giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh; g) Thực hiện các nhiệm vụ khác theo quy định của pháp luật. 2. Trách nhiệm của các Cơ quan kiểm dịch động vật cửa khẩu thuộc Cục Chăn nuôi và Thú y
