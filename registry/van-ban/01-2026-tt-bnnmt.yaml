    - dieu: 13
      noi_dung: Điều 13. Kiểm dịch động vật, sản phẩm động vật xuất khẩu, nhập khẩu tại chỗ và xuất bán cho doanh nghiệp chế xuất 1. Sản phẩm động vật đã hoàn thành thủ tục kiểm dịch nhập khẩu, chưa được chế biến hoặc đóng gói lại khi thực hiện xuất khẩu, nhập khẩu tại chỗ không phải thực hiện kiểm dịch. 2. Động vật, sản phẩm động vật có nguồn gốc trong nước, được xuất bán cho doanh nghiệp chế xuất chỉ phải thực hiện việc kiểm dịch vận chuyển ra khỏi địa bàn cấp tỉnh theo quy định.
