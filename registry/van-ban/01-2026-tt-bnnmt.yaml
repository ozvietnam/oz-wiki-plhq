    - dieu: 5
      noi_dung: '5 tử hoặc fax các thông tin: số Giấy chứng nhận kiểm dịch, ngày cấp, số lượng hàng hóa, mục đích sử dụng, biển kiểm soát phương tiện vận chuyển; b) Thông báo ngay sau khi cấp Giấy chứng nhận kiểm dịch đối với động vật vận chuyển để làm giống; c) Tổng hợp thông báo theo tuần đối với động vật vận chuyển để giết mổ.'
