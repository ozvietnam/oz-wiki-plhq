      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 15
      noi_dung: 'Điều 15. Kiểm dịch sản phẩm động vật nhập khẩu làm nguyên liệu để gia công, chế biến hàng xuất khẩu 1. Thực hiện theo quy định tại điểm a và điểm b khoản 1; khoản 2 Điều 12 Thông tư này. 2. Sản phẩm động vật làm nguyên liệu để gia công, chế biến hàng xuất khẩu: Thịt, tai, đuôi, chân của gia súc; thịt, cánh, chân của gia cầm nhập khẩu vào Việt Nam để gia công, chế biến hàng xuất khẩu phải được Cơ quan có thẩm quyền của nước xuất khẩu thực hiện việc kiểm dịch và cấp Giấy chứng nhận kiểm dịch xuất khẩu với nội dung: Tên và địa chỉ công ty xuất khẩu; tên và địa chỉ nhà máy sản xuất; tên và địa chỉ công ty nhập khẩu sản phẩm gia công; sản phẩm có nguồn gốc từ động vật thuộc vùng, cơ sở chăn nuôi không có dịch bệnh động vật liên quan đối với loại động vật đó theo quy định của Tổ chức Thú y thế giới; sản phẩm có nguồn gốc từ động vật được kiểm tra trước và sau khi giết mổ; sản phẩm được bao gói, bảo quản bảo đảm vệ sinh thú y; mục đích sử dụng để làm thực phẩm cho người. 3. Nội dung kiểm dịch sản phẩm động vật nhập khẩu làm nguyên liệu để gia công, chế biến hàng xuất khẩu như sau: a) Kiểm thực trạng hàng hóa, đối chiếu thông tin lô hàng với hồ sơ kiểm dịch, nếu đạt yêu cầu thì thực hiện theo quy định tại Phụ lục XII ban hành kèm theo Thông tư này; b) Hướng dẫn chủ hàng thực hiện các biện pháp vệ sinh, khử trùng, tiêu độc; 14 c) Trường hợp phải lấy mẫu xét nghiệm: Thực hiện theo quy định tại điểm d khoản 3 Điều 12 Thông tư này; d) Trường hợp không phải lấy mẫu xét nghiệm, chỉ kiểm tra hồ sơ kiểm dịch, thực trạng hàng hóa: trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch sản phẩm động vật nhập khẩu theo mẫu 15b quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: tình trạng bao gói, bảo quản sản phẩm đạt yêu cầu; sản phẩm động vật không có biểu hiện bất thường về đặc tính đặc trưng của sản phẩm; Trường hợp phát hiện hàng hóa không bảo đảm yêu cầu vệ sinh thú y thì lấy mẫu để kiểm tra các chỉ tiêu vệ sinh thú y; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; đ) Hình thức cấp Giấy chứng nhận kiểm dịch nhập khẩu theo quy định tại điểm đ khoản 3 Điều 8 Thông tư này. 4. Chỉ được gia công, chế biến hàng xuất khẩu làm thực phẩm tại các cơ sở sơ chế, chế biến sản phẩm động vật để kinh doanh bảo đảm vệ sinh thú y và đáp ứng các yêu cầu của nước nhập khẩu. Chủ hàng chịu trách nhiệm trong việc vận chuyển, bảo quản, gia công, chế biến đúng mục đích sử dụng theo đăng ký, khai báo kiểm dịch. 5. Sản phẩm động vật nhập khẩu để làm nguyên liệu để gia công, chế biến, sau khi gia công, chế biến phải thực hiện theo quy định về kiểm dịch sản phẩm động vật xuất khẩu khi xuất khẩu.'
      trang_pdf: 13
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 16
      noi_dung: Điều 16. Thông báo vi phạm Trường hợp phát hiện lô hàng nhập khẩu có chỉ tiêu được kiểm tra, xét nghiệm không đạt yêu cầu, Cục Chăn nuôi và Thú y thông báo bằng văn bản cho Cơ quan có thẩm quyền nước xuất khẩu, yêu cầu điều tra nguyên nhân, có hành động khắc phục và gửi báo cáo cho Cục Chăn nuôi và Thú y. Mục 4 KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT TRÊN CẠN TẠM NHẬP TÁI XUẤT, TẠM XUẤT TÁI NHẬP, CHUYỂN CỬA KHẨU, KHO NGOẠI QUAN, QUÁ CẢNH LÃNH THỔ VIỆT NAM
      trang_pdf: 14
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 17
      noi_dung: 'Điều 17. Hồ sơ kiểm dịch động vật, sản phẩm động vật trên cạn tạm nhập tái xuất, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam 1. Hồ sơ đăng ký kiểm dịch động vật, sản phẩm động vật trên cạn tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam gồm: a) Đơn đăng ký kiểm dịch theo mẫu 17 quy định tại Phụ lục V ban hành kèm theo Thông tư này; 15 b) Bản chụp Hợp đồng thương mại có xác nhận của doanh nghiệp; c) Văn bản hoặc giấy phép theo quy định đối với động vật, sản phẩm động vật thuộc đối tượng quản lý của Cơ quan nhà nước có thẩm quyền có liên quan khác. 2. Hồ sơ đăng ký kiểm dịch động vật, sản phẩm động vật nhập, xuất kho ngoại quan gồm: a) Đơn đăng ký kiểm dịch xuất/nhập kho ngoại quan động vật, sản phẩm động vật theo mẫu 18 quy định tại Phụ lục V ban hành kèm theo Thông tư này; b) Bản chụp Hợp đồng thương mại có xác nhận của doanh nghiệp; c) Văn bản hoặc giấy phép theo quy định đối với động vật, sản phẩm động vật thuộc đối tượng quản lý của Cơ quan nhà nước có thẩm quyền có liên quan khác. 3. Hồ sơ khai báo kiểm dịch động vật, sản phẩm động vật trên cạn tạm nhập tái xuất, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam gồm: a) Đơn khai báo kiểm dịch theo mẫu 3 quy định tại Phụ lục V ban hành kèm theo Thông tư này; b) Bản chụp Giấy chứng nhận kiểm dịch của nước xuất khẩu có xác nhận của doanh nghiệp. Chủ hàng phải xuất trình bản gốc để đối chiếu khi kiểm tra hàng hóa.'
      trang_pdf: 14
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 18
      noi_dung: Điều 18. Kiểm dịch động vật, sản phẩm động vật tạm xuất tái nhập 1. Kiểm dịch động vật, sản phẩm động vật tạm xuất tái nhập khi tạm xuất khẩu thực hiện theo quy định tại Điều 8 Thông tư này. 2. Kiểm dịch động vật tạm xuất tái nhập khi tái nhập khẩu thực hiện theo quy định tại điểm a và điểm b khoản 1, các khoản 2, 3 và 4 Điều 11 Thông tư này. 3. Kiểm dịch sản phẩm động vật tạm xuất tái nhập khi tái nhập khẩu thực hiện theo quy định tại điểm a và điểm b khoản 1, các khoản 2, 3 và 4 Điều 12 Thông tư này.
      trang_pdf: 15
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 19
      noi_dung: 'Điều 19. Trình tự, thủ tục, nội dung kiểm dịch động vật, sản phẩm động vật trên cạn tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam 1. Đăng ký kiểm dịch a) Trước khi tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam động vật, sản phẩm động vật, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 1 Điều 17 Thông tư này đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Cục Chăn nuôi và Thú y thực hiện theo quy định tại điểm b khoản 1 Điều 11 Thông tư này. 2. Khai báo kiểm dịch'
      trang_pdf: 15
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 19
      noi_dung: '16 a) Sau khi có văn bản đồng ý và hướng dẫn kiểm dịch của Cục Chăn nuôi và Thú y, trước khi hàng đến cửa khẩu nhập, chủ hàng gửi 01 bộ hồ sơ khai báo kiểm dịch theo quy định tại khoản 3 Điều 17 Thông tư này đến Cơ quan kiểm dịch động vật cửa khẩu theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ khai báo qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Cơ quan kiểm dịch cửa khẩu thực hiện theo quy định tại điểm b khoản 2 Điều 11 Thông tư này. 3. Tại cửa khẩu nhập, Cơ quan kiểm dịch động vật cửa khẩu thực hiện: a) Kiểm tra hồ sơ kiểm dịch, thực trạng lô hàng; b) Trong thời hạn 05 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam theo mẫu 16a hoặc Giấy chứng nhận kiểm dịch sản phẩm động vật tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam theo mẫu 16b quy định tại Phụ lục V ban hành kèm theo Thông tư này, trừ các trường hợp quy định tại khoản 6 Điều này; Cơ quan kiểm dịch động vật cửa khẩu thông báo cho Cơ quan kiểm dịch động vật cửa khẩu nơi xuất hàng ngay sau khi cấp Giấy chứng nhận kiểm dịch; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; c) Niêm phong hoặc kẹp chì phương tiện vận chuyển động vật, sản phẩm động vật; d) Hướng dẫn chủ hàng và thực hiện các quy định vệ sinh thú y trong quá trình lưu giữ, vận chuyển động vật, sản phẩm động vật trên lãnh thổ Việt Nam; vệ sinh, khử trùng, tiêu độc phương tiện vận chuyển và nơi bốc dỡ hàng hóa; đ) Trong trường hợp động vật, sản phẩm động vật được vận chuyển bằng công-ten-nơ hoặc phương tiện đóng kín khác, nếu phát hiện phương tiện vận chuyển, dấu niêm phong, kẹp chì có biểu hiện bất thường, Cơ quan kiểm dịch động vật cửa khẩu yêu cầu chủ hàng mở công-ten-nơ, phương tiện vận chuyển để kiểm tra vệ sinh thú y với sự chứng kiến của Cơ quan hải quan và chủ hàng; e) Cơ quan kiểm dịch động vật cửa khẩu lưu bản chụp Giấy chứng nhận kiểm dịch của nước xuất khẩu vào hồ sơ kiểm dịch; Giấy chứng nhận kiểm dịch gốc của nước xuất khẩu giao lại cho chủ hàng. 4. Chủ hàng khi vận chuyển động vật, sản phẩm động vật tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam phải tuân thủ các quy định sau đây: a) Thực hiện hướng dẫn của Cơ quan kiểm dịch động vật cửa khẩu trong quá trình lưu giữ, vận chuyển động vật, sản phẩm động vật trên lãnh thổ Việt Nam; trường hợp cần thay đổi lộ trình vận chuyển hoặc thay đổi cửa khẩu thì phải được'
      trang_pdf: 16
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 19
      noi_dung: '17 sự chấp thuận bằng văn bản của Cơ quan kiểm dịch động vật cửa khẩu; b) Không tự ý bốc dỡ hàng, tháo dỡ niêm phong, kẹp chì, trừ trường hợp cần thiết thì phải có sự chứng kiến của Cơ quan quản lý chuyên ngành thú y; trong trường hợp cần thay đổi phương tiện vận chuyển thì phải được sự chấp thuận bằng văn bản của Cơ quan kiểm dịch động vật cửa khẩu; c) Không để động vật tiếp xúc với động vật trong nước; chỉ được phép thả động vật để cho ăn, uống hoặc trường hợp đặc biệt khác khi Cơ quan quản lý chuyên ngành thú y cho phép và giám sát; d) Phương tiện vận chuyển động vật, sản phẩm động vật phải bảo đảm không làm rơi vãi chất thải trên đường đi. Xác động vật, chất thải, chất độn, thức ăn thừa của động vật, dụng cụ chứa đựng phát sinh trong quá trình vận chuyển phải được thu gom, xử lý tại địa điểm theo hướng dẫn của Cơ quan kiểm dịch động vật cửa khẩu. 5. Tại cửa khẩu xuất, Cơ quan kiểm dịch động vật cửa khẩu thực hiện: a) Kiểm tra Giấy chứng nhận kiểm dịch; b) Kiểm tra dấu niêm phong hoặc kẹp chì phương tiện vận chuyển động vật, sản phẩm động vật; c) Nếu hàng hóa đúng với Giấy chứng nhận kiểm dịch được cấp tại cửa khẩu nhập thì xác nhận để chủ hàng làm thủ tục xuất hàng ra khỏi lãnh thổ Việt Nam. 6. Không cấp Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam trong các trường hợp sau: a) Động vật, sản phẩm động vật đã đi qua quốc gia, vùng lãnh thổ đang có dịch bệnh động vật mẫn cảm với loài động vật đó; b) Giấy chứng nhận kiểm dịch của nước xuất khẩu không hợp lệ; c) Động vật mắc bệnh, có dấu hiệu mắc bệnh, sản phẩm động vật mang mầm bệnh nguy hiểm theo quy định của pháp luật Việt Nam. 7. Trường hợp thay đổi cửa khẩu xuất khi lô hàng đã đến cửa khẩu xuất, Cơ quan kiểm dịch động vật cửa khẩu dự kiến tái xuất ban đầu xác nhận về việc đồng ý chuyển sang cửa khẩu khác nếu cửa khẩu tái xuất đã được Cục Chăn nuôi và Thú y chấp thuận trong văn bản đồng ý và hướng dẫn kiểm dịch.'
      trang_pdf: 17
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
