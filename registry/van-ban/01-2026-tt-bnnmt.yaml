      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 11
      noi_dung: 'Điều 11. Trình tự, thủ tục, nội dung kiểm dịch động vật nhập khẩu 1. Đăng ký kiểm dịch a) Trước khi nhập khẩu động vật, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 1 Điều 10 Thông tư này đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Trong thời hạn 04 ngày làm việc kể từ ngày nhận được hồ sơ đầy đủ, hợp lệ căn cứ tình hình dịch bệnh, hệ thống quản lý giám sát dịch bệnh, giám sát vệ sinh thú y của nước xuất khẩu và các thông tin khác (nếu có), Cục Chăn nuôi và Thú y gửi văn bản đồng ý và hướng dẫn kiểm dịch cho chủ hàng qua thư điện tử (trường hợp chủ hàng đăng ký kiểm dịch qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp) hoặc gửi trên Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công (trường hợp chủ hàng đăng ký kiểm dịch trên Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công), đồng thời gửi Cơ quan kiểm dịch động vật cửa khẩu; Trường hợp không đồng ý kiểm dịch, Cục Chăn nuôi và Thú y phải trả lời cho chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; c) Trường hợp động vật thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam, quy định tại Phụ lục IV ban hành kèm theo thông tư này phải được Cục Chăn nuôi và Thú y tiến hành phân tích nguy cơ theo quy định tại Điều 43 Luật Thú y, khuyến nghị của Tổ chức Thú y thế giới (WOAH). 2. Khai báo kiểm dịch a) Sau khi có văn bản đồng ý và hướng dẫn kiểm dịch của Cục Chăn nuôi và Thú y, trước khi hàng đến cửa khẩu nhập, chủ hàng gửi 01 bộ hồ sơ khai báo kiểm dịch theo quy định tại khoản 3 Điều 10 Thông tư này đến Cơ quan kiểm dịch động vật cửa khẩu theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Trong thời hạn 01 ngày làm việc kể từ ngày nhận được hồ sơ khai báo kiểm dịch động vật đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật cửa khẩu xác nhận vào Đơn khai báo kiểm dịch theo mẫu 3 quy định tại Phụ lục V ban hành kèm theo Thông tư này và thông báo cho chủ hàng về địa điểm, thời gian để tiến hành kiểm dịch; c) Chủ hàng có trách nhiệm bố trí địa điểm cách ly kiểm dịch động vật nhập khẩu. Cơ quan kiểm dịch động vật cửa khẩu hướng dẫn và giám sát chủ hàng thực hiện cách ly kiểm dịch động vật nhập khẩu. 10 3. Nội dung kiểm dịch động vật nhập khẩu Cơ quan kiểm dịch động vật cửa khẩu thực hiện: a) Kiểm tra lâm sàng động vật, đối chiếu thông tin với hồ sơ kiểm dịch; nếu hồ sơ kiểm dịch đầy đủ, hợp lệ, động vật không có dấu hiệu mắc bệnh nguy hiểm; Cơ quan kiểm dịch tiến hành niêm phong hoặc kẹp chì phương tiện vận chuyển, vật dụng chứa đựng động vật và cấp Giấy chứng nhận vận chuyển động vật nhập khẩu về nơi cách ly kiểm dịch theo mẫu 14a quy định tại Phụ lục V ban hành kèm theo Thông tư này để chủ hàng vận chuyển động vật đến nơi cách ly kiểm dịch; b) Theo dõi, giám sát động vật tại nơi cách ly kiểm dịch; thời gian theo dõi cách ly kiểm dịch phù hợp với từng loài động vật, từng bệnh được kiểm tra nhưng không quá 45 ngày kể từ ngày bắt đầu cách ly kiểm dịch; c) Lấy mẫu hoặc hướng dẫn, giám sát việc lấy mẫu xét nghiệm tác nhân gây bệnh theo quy định tại Phụ lục XII ban hành kèm theo Thông tư này; hướng dẫn chủ hàng phòng bệnh bắt buộc đối với động vật chưa được phòng bệnh theo quy định; d) Hướng dẫn chủ hàng thực hiện các biện pháp vệ sinh, khử trùng, tiêu độc; đ) Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật nhập khẩu theo mẫu 15a quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: động vật khỏe mạnh; kết quả xét nghiệm âm tính với tác nhân gây bệnh; phương tiện vận chuyển và việc tiêu độc khử trùng đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; e) Hình thức cấp Giấy chứng nhận kiểm dịch theo quy định tại điểm đ khoản 3 Điều 8 Thông tư này. 4. Cơ quan kiểm dịch động vật cửa khẩu thông báo qua môi trường điện tử cho Cơ quan kiểm dịch động vật nội địa nơi đến về thông tin lô hàng ngay sau khi cấp Giấy chứng nhận kiểm dịch động vật nhập khẩu.'
      trang_pdf: 9
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
