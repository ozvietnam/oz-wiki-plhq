    - dieu: 5
      noi_dung: '4 a) Kiểm tra lâm sàng; đối chiếu thông tin lô hàng với hồ sơ kiểm dịch; b) Lấy mẫu hoặc hướng dẫn, giám sát việc lấy mẫu xét nghiệm tác nhân gây bệnh theo quy định tại Phụ lục XI ban hành kèm theo Thông tư này; c) Niêm phong hoặc kẹp chì phương tiện chứa đựng, vận chuyển động vật; d) Hướng dẫn, giám sát chủ hàng thực hiện tiêu độc khử trùng phương tiện chứa đựng, vận chuyển động vật; đ) Trong thời hạn 05 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật nội địa cấp Giấy chứng nhận kiểm dịch động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 12a hoặc mẫu 12b quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: động vật khỏe mạnh; kết quả xét nghiệm âm tính với tác nhân gây bệnh; phương tiện vận chuyển và việc tiêu độc khử trùng đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; e) Hình thức cấp Giấy chứng nhận kiểm dịch: bản điện tử trong trường hợp hồ sơ được gửi qua Cổng dịch vụ công; bản giấy trong trường hợp hồ sơ được gửi qua dịch vụ bưu chính công ích hoặc thư điện tử hoặc fax hoặc gửi trực tiếp hoặc theo yêu cầu của chủ hàng. 4. Nội dung kiểm dịch đối với động vật xuất phát từ cơ sở được công nhận an toàn dịch bệnh hoặc đã được giám sát không có mầm bệnh hoặc đã được phòng bệnh bằng vắc-xin và còn miễn dịch bảo hộ với các bệnh theo quy định tại Phụ lục XI ban hành kèm theo Thông tư này, Cơ quan kiểm dịch động vật nội địa thực hiện như sau: a) Thực hiện theo quy định tại các điểm a, c và d khoản 3 Điều này; b) Trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật nội địa cấp Giấy chứng nhận kiểm dịch động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 12a hoặc mẫu 12b quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: động vật khỏe mạnh; phương tiện vận chuyển và việc tiêu độc khử trùng đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; c) Hình thức cấp Giấy chứng nhận kiểm dịch theo quy định tại điểm e khoản 3 Điều này. 5. Cơ quan kiểm dịch động vật nội địa nơi cấp Giấy chứng nhận kiểm dịch thực hiện: a) Thông báo cho Cơ quan kiểm dịch động vật nội địa nơi đến qua thư điện'
