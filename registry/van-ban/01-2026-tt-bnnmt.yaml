      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 9
      noi_dung: 'Điều 9. Kiểm soát động vật, sản phẩm động vật trên cạn xuất khẩu tại cửa khẩu xuất Cơ quan kiểm dịch động vật cửa khẩu thực hiện: 1. Kiểm tra Giấy chứng nhận kiểm dịch. 2. Xác nhận đã kiểm tra vào Giấy chứng nhận kiểm dịch hoặc thực hiện cấp đổi Giấy chứng nhận kiểm dịch xuất khẩu theo yêu cầu của chủ hàng. Mục 3 KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT TRÊN CẠN NHẬP KHẨU'
