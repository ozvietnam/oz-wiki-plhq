    - dieu: 12
      noi_dung: '11 c) Trường hợp sản phẩm động vật thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam, quy định tại Phụ lục IV ban hành kèm theo thông tư này phải được Cục Chăn nuôi và Thú y tiến hành phân tích nguy cơ theo quy định tại Điều 43 Luật Thú y, khuyến nghị của Tổ chức Thú y thế giới (WOAH). 2. Khai báo kiểm dịch: Thực hiện theo quy định tại điểm a và điểm b khoản 2 Điều 11 Thông tư này. 3. Nội dung kiểm dịch sản phẩm động vật nhập khẩu Cơ quan kiểm dịch động vật cửa khẩu thực hiện như sau: a) Kiểm thực trạng hàng hóa, đối chiếu thông tin lô hàng với hồ sơ kiểm dịch, nếu đạt yêu cầu thì thực hiện lấy mẫu xét nghiệm theo quy định tại Phụ lục XII ban hành kèm theo Thông tư này; b) Hướng dẫn chủ hàng thực hiện các biện pháp vệ sinh, khử trùng, tiêu độc; c) Lô hàng sản phẩm động vật nhập khẩu với mục đích làm hàng mẫu, có trọng lượng dưới 50 kg được miễn Giấy chứng nhận kiểm dịch của nước xuất khẩu và miễn lấy mẫu kiểm tra, xét nghiệm; d) Trong thời hạn 05 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch sản phẩm động vật nhập khẩu theo Mẫu 15b quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: tình trạng bao gói, bảo quản sản phẩm đạt yêu cầu; sản phẩm động vật không có biểu hiện bất thường về đặc tính đặc trưng của sản phẩm; kết quả xét nghiệm đạt yêu cầu; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; đ) Hình thức cấp Giấy chứng nhận kiểm dịch nhập khẩu theo quy định tại điểm đ khoản 3 Điều 8 Thông tư này. 4. Cơ quan kiểm dịch động vật cửa khẩu thông báo qua môi trường điện tử cho Cơ quan kiểm dịch động vật nội địa nơi đến về thông tin lô hàng ngay sau khi cấp Giấy chứng nhận kiểm dịch sản phẩm động vật nhập khẩu. 5. Đối với sản phẩm động vật xuất khẩu bị triệu hồi hoặc bị trả về a) Thực hiện kiểm dịch theo quy định tại điểm a và điểm b khoản 1, các khoản 2, 3 và 4 Điều này; b) Chủ hàng phải xuất trình các giấy tờ liên quan đến lô hàng khi xuất khẩu: Giấy chứng nhận kiểm dịch xuất khẩu (nếu có); bản chụp có xác nhận của chủ hàng các giấy tờ sau: tờ khai hải quan và bảng kê danh mục hàng hóa, thông báo lô hàng bị triệu hồi của chủ hàng (đối với hàng hóa bị triệu hồi), văn bản của bên nước ngoài thông báo hàng bị trả lại hoặc văn bản của đơn vị vận tải thông báo không có người nhận hàng; c) Không yêu cầu chủ hàng phải có Giấy chứng nhận kiểm dịch của Cơ'
