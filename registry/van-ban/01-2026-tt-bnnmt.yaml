  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết khoản 3 Điều 37, khoản 2 Điều 39, khoản 4 Điều 41, khoản 4 Điều 46, khoản 4 Điều 49 Luật Thú y (được sửa đổi, bổ sung tại Điều 12 Luật sửa đổi, bổ sung một số Điều của 15 Luật trong lĩnh vực nông nghiệp và môi trường) về: a) Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện miễn kiểm dịch; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam; Danh mục đối tượng kiểm dịch động vật, sản phẩm động vật trên cạn; b) Nội dung, trình tự, thủ tục kiểm dịch động vật, sản phẩm động vật trên cạn vận chuyển ra khỏi địa bàn cấp tỉnh; xuất khẩu, nhập khẩu, tạm nhập tái xuất, tạm xuất tái nhập, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam; động vật trên cạn tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật trên cạn tham gia hội chợ, triển lãm và động vật, sản phẩm động vật trên cạn mang theo người; đánh dấu, cấp mã số động vật trên cạn, niêm phong phương tiện vận chuyển, vật dụng chứa đựng động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch; vận chuyển mẫu bệnh phẩm. 2 2. Đối tượng áp dụng Thông tư này áp dụng đối với cơ quan, tổ chức, cá nhân có liên quan đến hoạt động quy định khoản 1 Điều này.'
      trang_pdf: 1
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Nơi cách ly kiểm dịch động vật là khu vực riêng biệt để nuôi giữ động vật trong thời gian nhất định để thực hiện việc kiểm dịch. 2. Nơi cách ly kiểm dịch sản phẩm động vật là kho chứa hàng, phương tiện chứa đựng để bảo quản sản phẩm động vật trong thời gian nhất định để thực hiện việc kiểm dịch. 3. Mặt hàng xuất khẩu, nhập khẩu là các sản phẩm động vật cùng loại, cùng tên, nhãn hàng hóa, cơ sở sản xuất hàng hóa, chất liệu bao bì. 4. Lô hàng sản phẩm động vật xuất khẩu, nhập khẩu là toàn bộ sản phẩm động vật của một chuyến hàng nhập khẩu hoặc xuất khẩu (có cùng số vận đơn hoặc hợp đồng vận chuyển nếu có). Lô hàng có thể bao gồm một mặt hàng hoặc nhiều mặt hàng. 5. Sản phẩm động vật có nguy cơ cao là sản phẩm động vật ở dạng tươi sống, ướp lạnh, đông lạnh, sơ chế; nguyên liệu thức ăn chăn nuôi, thủy sản phải kiểm tra tạp nhiễm sản phẩm của loài nhai lại (ADN). 6. Sản phẩm động vật có nguy cơ thấp là sản phẩm động vật không thuộc quy định tại khoản 5 Điều này. 7. Kiểm tra lâm sàng là việc kiểm tra tình trạng sức khỏe động vật dựa vào các hoạt động đánh giá triệu chứng bên ngoài của động vật để phát hiện các dấu hiệu bất thường, dấu hiệu các bệnh động vật. 8. Kiểm tra thực trạng hàng hóa là việc kiểm tra điều kiện bảo quản, quy cách bao gói, ngoại quan của sản phẩm, chủng loại, nhãn sản phẩm, thông tin chi tiết của lô hàng. 9. Người lấy mẫu kiểm dịch động vật, sản phẩm động vật là công chức được bổ nhiệm ngạch công chức chuyên ngành kiểm dịch động vật hoặc người có trình độ chuyên môn từ trung cấp trở lên chuyên ngành chăn nuôi, thú y, nuôi trồng thủy sản, bệnh học thủy sản hoặc chăn nuôi và thú y được cấp Chứng chỉ hoặc Giấy chứng nhận đã hoàn thành khóa tập huấn chuyên môn, nghiệp vụ về kiểm dịch động vật, sản phẩm động vật do Cục Chăn nuôi và Thú y hoặc các đơn vị được Cục Chăn nuôi và Thú y ủy quyền tổ chức tập huấn.'
      trang_pdf: 2
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 3
      noi_dung: Điều 3. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện miễn kiểm dịch; Danh mục đối tượng kiểm dịch động vật, sản phẩm động vật trên cạn; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam 1. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm 3 dịch quy định tại Phụ lục I ban hành kèm theo Thông tư này. 2. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện miễn kiểm dịch quy định tại Phụ lục II ban hành kèm theo Thông tư này. 3. Danh mục đối tượng kiểm dịch động vật, sản phẩm động vật trên cạn quy định tại Phụ lục III ban hành kèm theo Thông tư này. 4. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải phân tích nguy cơ trước khi nhập khẩu vào Việt Nam quy định tại Phụ lục IV ban hành kèm theo Thông tư này. Chương II KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT TRÊN CẠN Mục 1 KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT TRÊN CẠN VẬN CHUYỂN RA KHỎI ĐỊA BÀN CẤP TỈNH
      trang_pdf: 2
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 4
      noi_dung: Điều 4. Hồ sơ đăng ký kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh 1. Đơn đăng ký kiểm dịch động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 1a quy định tại Phụ lục V ban hành kèm theo Thông tư này. 2. Đơn đăng ký kiểm dịch sản phẩm động vật trên cạn vận chuyển ra khỏi địa bàn cấp tỉnh theo mẫu 1b quy định tại Phụ lục V ban hành kèm theo Thông tư này.
      trang_pdf: 3
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 5
      noi_dung: 'Điều 5. Trình tự, thủ tục, nội dung kiểm dịch đối với động vật vận chuyển ra khỏi địa bàn cấp tỉnh 1. Đăng ký kiểm dịch Trước khi vận chuyển động vật ra khỏi địa bàn cấp tỉnh chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 1 Điều 4 Thông tư này đến Cơ quan quản lý chuyên ngành thú y cấp tỉnh (sau đây gọi là Cơ quan kiểm dịch động vật nội địa), theo một trong các hình thức sau: qua Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính. 2. Tiếp nhận và kiểm tra hồ sơ Trong thời hạn 01 ngày làm việc kể từ ngày nhận được hồ sơ đăng ký, Cơ quan kiểm dịch động vật nội địa tiến hành xem xét tính đầy đủ, hợp lệ của hồ sơ. Trường hợp hồ sơ đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật nội địa thông báo cho chủ hàng thời gian, địa điểm tiến hành kiểm dịch. Trường hợp hồ sơ chưa đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật nội địa trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 3. Nội dung kiểm dịch đối với động vật xuất phát từ cơ sở theo quy định tại khoản 1 Điều 37 Luật Thú y, Cơ quan kiểm dịch động vật nội địa thực hiện như sau:'
