      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 20
      noi_dung: '18 b) Cục Chăn nuôi và Thú y thực hiện theo quy định tại điểm b khoản 1 Điều 11 Thông tư này. 2. Khai báo kiểm dịch a) Sau khi có văn bản đồng ý và hướng dẫn kiểm dịch của Cục Chăn nuôi và Thú y, trước khi hàng đến cửa khẩu nhập, chủ hàng gửi 01 bộ hồ sơ khai báo kiểm dịch theo quy định tại khoản 3 Điều 17 Thông tư này tới Cơ quan kiểm dịch động vật cửa khẩu theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ khai báo qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính; b) Cơ quan kiểm dịch cửa khẩu thực hiện theo quy định tại điểm b khoản 2 Điều 11 Thông tư này. 3. Nội dung kiểm dịch hàng hóa nhập vào kho ngoại quan Cơ quan kiểm dịch động vật cửa khẩu thực hiện kiểm dịch hàng hóa nhập vào kho ngoại quan như sau: a) Theo quy định tại các điểm a, c, d và đ khoản 3 Điều 19 Thông tư này; b) Trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận vận chuyển sản phẩm động vật nhập khẩu về nơi cách ly kiểm dịch theo mẫu 14b quy định tại Phụ lục V ban hành kèm theo Thông tư này để chủ hàng vận chuyển hàng hóa từ cửa khẩu nhập về kho ngoại quan; Trường hợp không cấp Giấy chứng nhận, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; c) Tại kho ngoại quan, Cơ quan kiểm dịch động vật cửa khẩu phối hợp với cơ quan hải quan giám sát việc chủ hàng nhập hàng vào kho ngoại quan. 4. Trước khi xuất hàng ra khỏi kho ngoại quan, chủ hàng phải gửi hồ sơ khai báo kiểm dịch tới Cơ quan kiểm dịch động vật cửa khẩu theo quy định tại khoản 3 Điều 17 Thông tư này. 5. Nội dung kiểm dịch hàng hóa xuất ra khỏi kho ngoại quan Cơ quan kiểm dịch động vật cửa khẩu thực hiện kiểm dịch hàng hóa xuất ra khỏi kho ngoại quan như sau: a) Thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch theo quy định tại khoản 3 và khoản 4 Điều 11, khoản 3 và khoản 4 Điều 12 Thông tư này đối với động vật, sản phẩm động vật tiêu thụ trong nước; b) Thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch theo quy định tại khoản 3 Điều 15 Thông tư này đối với sản phẩm động vật làm nguyên liệu để gia công, chế biến hàng xuất khẩu; c) Thực hiện theo quy định tại các khoản 3, 4, 5, 6, và 7 Điều 19 Thông tư'
