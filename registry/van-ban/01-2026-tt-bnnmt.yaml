    - dieu: 29
      noi_dung: Điều 29. Điều khoản chuyển tiếp 1. Hồ sơ thực hiện thủ tục hành chính về kiểm dịch động vật, sản phẩm động vật đã nộp cho Cơ quan giải quyết thủ tục hành chính trước ngày Thông tư này có hiệu lực thi hành thì thực hiện theo quy định của pháp luật tại thời điểm nộp hồ sơ; trừ trường hợp tổ chức, cá nhân đề nghị thực hiện theo quy định của Thông tư này. 2. Giấy chứng nhận kiểm dịch đã được cấp trước ngày Thông tư này có hiệu lực thi hành được sử dụng đến hết ngày có giá trị sử dụng ghi trên Giấy chứng nhận kiểm dịch. 3. Các mẫu Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh, thẻ tai và dây niêm phong theo quy định tại Thông tư số 25/2016/TT-BNNPTNT ngày 30/6/2016 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định về kiểm dịch động vật, sản phẩm động vật trên cạn đã được in thì được phép sử dụng đến hết ngày 30 tháng 6 năm 2026.
      trang_pdf: 26
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 30
      noi_dung: 'Điều 30. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2026. 2. Thông tư này thay thế các Thông tư sau: a) Thông tư số 25/2016/TT-BNNPTNT ngày 30/6/2016 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định về kiểm dịch động vật, sản phẩm động vật trên cạn; b) Thông tư số 35/2018/TT-BNNPTNT ngày 25/12/2018 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số điều của Thông tư số 25/2016/TT-BNNPTNT ngày 30/6/2016 và Thông tư số 20/2017/TT-BNNPTNT ngày 10/11/2017 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn; c) Thông tư số 09/2022/TT-BNNPTNT ngày 19/8/2022 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số điều của các Thông tư quy định về kiểm dịch động vật, sản phẩm động vật trên cạn; d) Thông tư số 04/2024/TT-BNNPTNT ngày 01/4/2024 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số điều của các Thông tư quy định về kiểm dịch động vật, sản phẩm động vật trên cạn; đ) Thông tư số 28/2025/TT-BNNMT ngày 24/6/2025 của Bộ trưởng Bộ Nông nghiệp và Môi trường sửa đổi, bổ sung một số điều của Thông tư số 25/2016/TTBNNPTNT ngày 30 tháng 6 năm 2016 của Bộ trưởng Bộ Nông nghiệp và Phát triển 27 nông thôn quy định về kiểm dịch động vật, sản phẩm động vật trên cạn. 3. Bãi bỏ Điều 22 Thông tư số 09/2025/TT-BNNMT ngày 19/6/2025 của Bộ trưởng Bộ Nông nghiệp và Môi trường quy định phân quyền, phân cấp và phân định thẩm quyền trong lĩnh vực quản lý nhà nước về chăn nuôi thú y. Trong quá trình thực hiện, nếu có vướng mắc, đề nghị các tổ chức, cá nhân báo cáo về Bộ Nông nghiệp và Môi trường (qua Cục Chăn nuôi và Thú y) để xem xét, sửa đổi bổ sung./.'
