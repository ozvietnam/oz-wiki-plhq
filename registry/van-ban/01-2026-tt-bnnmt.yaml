      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 22
      noi_dung: 'Điều 22. Vận chuyển mẫu bệnh phẩm 1. Khi có yêu cầu nhận mẫu bệnh phẩm từ nước ngoài gửi về Việt Nam hoặc gửi mẫu bệnh phẩm từ Việt Nam ra nước ngoài, chủ hàng phải gửi 01 bộ hồ sơ đăng ký vận chuyển mẫu bệnh phẩm đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc 20 gửi trực tiếp. Trường hợp gửi hồ sơ khai báo qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính. Hồ sơ gồm: đơn đăng ký gửi/nhận mẫu bệnh phẩm theo mẫu 5 quy định tại Phụ lục V ban hành kèm theo Thông tư này. 2. Trong thời hạn 04 ngày làm việc kể từ ngày nhận được đơn đăng ký gửi/nhận mẫu bệnh phẩm hợp lệ, Cục Chăn nuôi và Thú y có trách nhiệm trả lời chủ hàng qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp) hoặc gửi trên Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công (trường hợp chủ hàng đăng ký kiểm dịch trên Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công). Trường hợp không đồng ý phải trả lời cho chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 3. Mẫu bệnh phẩm gửi tới cơ sở xét nghiệm phải được bao gói, bảo quản, vận chuyển theo quy định, bảo đảm yêu cầu vệ sinh thú y, không làm phát tán mầm bệnh, không gây ô nhiễm môi trường. 4. Mẫu bệnh phẩm không được phép đưa vào Việt Nam hoặc mẫu bệnh phẩm không được bao gói, bảo quản, vận chuyển theo quy định, không bảo đảm yêu cầu vệ sinh thú y, có nguy cơ phát tán và gây ô nhiễm môi trường phải được tiêu hủy theo quy định của pháp luật về thú y, phòng chống bệnh truyền nhiễm và bảo vệ môi trường. Mục 6 MẪU HỒ SƠ KIỂM DỊCH ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT'
      trang_pdf: 19
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 23
      noi_dung: Điều 23. Mẫu hồ sơ kiểm dịch động vật, sản phẩm động vật 1. Mẫu hồ sơ kiểm dịch động vật, sản phẩm động vật theo quy định tại Phụ lục V ban hành kèm theo Thông tư này. 2. Mẫu hồ sơ kiểm dịch động vật, sản phẩm động vật được sử dụng thống nhất trên phạm vi toàn quốc. 3. Cơ quan kiểm dịch động vật chịu trách nhiệm in, sử dụng mẫu hồ sơ kiểm dịch theo đúng quy định hiện hành.
      trang_pdf: 20
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 24
      noi_dung: 'Điều 24. Quản lý, sử dụng mẫu Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật 1. Các mẫu Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật được in bằng mực đen trên giấy in khổ A4, ở giữa có Logo kiểm dịch động vật in chìm, màu đen nhạt, đường kính 12 cm. 2. Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh được đóng dấu “BẢN GỐC” hoặc “BẢN SAO” bằng mực dấu màu đỏ ở góc bên phải phía dưới “Mẫu: ...” (Mẫu dấu theo quy định tại Phụ lục VI ban hành kèm theo Thông tư này). Số lượng giấy chứng nhận kiểm dịch được phát hành như sau:'
      trang_pdf: 20
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 24
      noi_dung: '21 a) Bản gốc: 01 bản lưu tại Cơ quan kiểm dịch động vật, 01 bản giao cho chủ hàng; b) Bản sao: Căn cứ vào nơi giao hàng trong quá trình vận chuyển (nếu có) để cấp tối đa 03 bản sao cho chủ hàng, mỗi nơi giao hàng chỉ cấp 01 bản sao; các bản sao đều sử dụng dấu đỏ của Cơ quan quản lý chuyên ngành thú y có thẩm quyền đã cấp bản gốc; Trường hợp ủy quyền thì sử dụng mẫu Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh theo Mẫu 12b và Mẫu 12d quy định tại Phụ lục V ban hành kèm theo Thông tư này; c) Giấy chứng nhận kiểm dịch bản điện tử được cấp qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công có giá trị tương đương bản gốc. 3. Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật xuất khẩu, nhập khẩu, tạm nhập tái xuất, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam được đóng dấu “ORIGINAL” hoặc “COPY” bằng mực dấu màu đỏ ở góc bên phải phía dưới “Mẫu...” (Mẫu dấu theo quy định tại Phụ lục VI ban hành kèm theo Thông tư này). Số lượng giấy chứng nhận kiểm dịch được phát hành như sau: a) Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật xuất khẩu, nhập khẩu: 03 bản Original (01 bản lưu tại cơ quan kiểm dịch động vật, 02 bản giao cho chủ hàng); 02 bản Copy giao cho chủ hàng; b) Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật tạm nhập tái xuất, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam: 03 bản Original (01 bản lưu tại Cơ quan kiểm dịch động vật cửa khẩu nhập, 02 bản giao cho chủ hàng); 02 bản Copy giao cho chủ hàng trong đó 01 bản được nộp lại cho Cơ quan kiểm dịch động vật cửa khẩu nhập sau khi lô hàng đã được tái xuất hết ra khỏi lãnh thổ Việt Nam và có xác nhận của Cơ quan kiểm dịch cửa khẩu xuất); các bản sao đều sử dụng dấu đỏ của Cơ quan thú y có thẩm quyền đã cấp bản gốc; c) Trường hợp có thống nhất giữa Cục Chăn nuôi và Thú y và Cơ quan có thẩm quyền nước nhập khẩu về Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật điện tử thì sử dụng Giấy chứng nhận kiểm dịch điện tử. 4. Giấy chứng nhận vận chuyển động vật, sản phẩm động vật nhập khẩu được phát hành 03 bản (01 bản lưu tại Cơ quan kiểm dịch động vật cửa khẩu nhập, 02 bản giao cho chủ hàng). 5. Thời hạn giá trị sử dụng của giấy chứng nhận kiểm dịch động vật, sản phẩm động vật: a) Thời hạn giá trị sử dụng của Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật vận chuyển ra khỏi địa bàn cấp tỉnh được tính theo thời gian vận chuyển động vật, sản phẩm động vật từ nơi xuất phát đến nơi đến cuối cùng; b) Thời hạn giá trị sử dụng của Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật nhập khẩu là 60 ngày; thời hạn giá trị sử dụng của Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật xuất khẩu là 180 ngày;'
      trang_pdf: 21
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 24
      noi_dung: 22 c) Thời hạn giá trị sử dụng của Giấy chứng nhận kiểm dịch động vật, sản phẩm động vật tạm nhập tái xuất, chuyển cửa khẩu, quá cảnh lãnh thổ Việt Nam được tính theo thời gian tối đa cho phép hàng hóa lưu trú tại lãnh thổ Việt Nam. Chương III ĐÁNH DẤU, CẤP MÃ SỐ ĐỘNG VẬT, NIÊM PHONG PHƯƠNG TIỆN VẬN CHUYỂN, VẬT DỤNG CHỨA ĐỰNG ĐỘNG VẬT, SẢN PHẨM ĐỘNG VẬT THUỘC DIỆN PHẢI KIỂM DỊCH
      trang_pdf: 22
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 25
      noi_dung: 'Điều 25. Quy định chung về đánh dấu, cấp mã số đối với động vật; niêm phong phương tiện vận chuyển, vật dụng chứa đựng động vật, sản phẩm động vật 1. Các loại động vật phải được đánh dấu, cấp mã số: a) Động vật giống (trâu, bò, dê, cừu, hươu, nai, ngựa, lừa, la và lợn) khi vận chuyển ra khỏi địa bàn cấp tỉnh; b) Động vật (trâu, bò, dê, cừu, hươu, nai, ngựa, lừa, la và lợn) khi xuất khẩu, nhập khẩu. 2. Mã số của Cơ quan quản lý chuyên ngành thú y cấp tỉnh theo quy định tại Phụ lục VIIa ban hành kèm theo Thông tư này. 3. Mã số của cơ quan kiểm dịch động vật cửa khẩu thuộc Cục Chăn nuôi và Thú y theo quy định tại Phụ lục VIIb ban hành kèm theo Thông tư này. 4. Cơ quan quản lý chuyên ngành thú y cấp tỉnh quy định cụ thể mã số cho từng xã, phường và đặc khu (sau đây gọi là xã) trực thuộc tỉnh, thành phố và thông báo mã số cho Cục Chăn nuôi và Thú y và các Cơ quan quản lý chuyên ngành thú y cấp tỉnh trong cả nước. 5. Cục Chăn nuôi và Thú y có trách nhiệm bổ sung mã số cho các Cơ quan kiểm dịch động vật cửa khẩu thuộc Cục Chăn nuôi và Thú y và Cơ quan quản lý chuyên ngành thú y cấp tỉnh mới được thành lập. 6. Niêm phong phương tiện vận chuyển, vật dụng chứa đựng động vật, sản phẩm động vật: Theo quy định tại Phụ lục VIIc ban hành kèm theo Thông tư này.'
      trang_pdf: 22
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 26
      noi_dung: 'Điều 26. Đánh dấu gia súc vận chuyển ra khỏi địa bàn cấp tỉnh 1. Động vật giống (trâu, bò, dê, cừu, hươu, nai, ngựa, lừa, la) khi vận chuyển ra khỏi địa bàn cấp tỉnh phải được đánh dấu bằng cách bấm thẻ tai. Thẻ tai được quy định như sau: a) Thẻ tai màu xanh theo hình 1 quy định tại Phụ lục VIII ban hành kèm theo Thông tư này, kích thước 4 cm (rộng) x 5 cm (cao); trên thẻ phải ghi rõ mã số, số hiệu của gia súc; b) Mã số của gia súc gồm: Mã số của Cơ quan quản lý chuyên ngành thú y cấp tỉnh; mã số xã (ba chữ số); năm bấm thẻ tai (hai chữ số cuối của năm) và số thứ tự của gia súc (được tính từ 000001 đến 999999); 23 Cách viết mã số của gia súc trên thẻ tai theo hình 2 quy định tại Phụ lục VIII ban hành kèm theo Thông tư này; c) Mực viết mã số của gia súc trên thẻ tai có màu đen; loại mực không nhòe, khó tẩy xóa. 2. Lợn giống khi vận chuyển được thực hiện theo một trong các biện pháp sau: a) Bấm thẻ tai theo quy định tại khoản 1 của Điều này; b) Xăm mã số tỉnh, mã số xã và mã số năm ở mặt ngoài, phía dưới tai bên phải của lợn. Việc xăm mã số trên da ở mặt ngoài, phía dưới của tai lợn được quy định như sau: Hình dáng, kích thước chữ số: Các chữ số dùng để xăm trên tai lợn có thể sử dụng các chữ số theo hình 1a hoặc hình 1b quy định tại Phụ lục VIII ban hành kèm theo Thông tư này; các kim xăm của chữ số có chiều cao là 6 mm (tính từ bề mặt của bàn xăm) và nhọn ở phía đầu; chữ số có bề rộng từ 4 - 8 mm và có chiều cao tương ứng từ 8 - 12 mm; Mã số xăm trên tai lợn (theo hình 2a hoặc hình 2b quy định tại Phụ lục VIII ban hành kèm theo Thông tư này) được quy định như sau: 02 (hai) chữ số đầu là mã số của Cơ quan quản lý chuyên ngành thú y cấp tỉnh; 03 (ba) chữ số tiếp theo là mã số của xã (nơi lợn xuất phát hoặc nơi cách ly để kiểm dịch) và 02 (hai) chữ số cuối cùng là 02 (hai) chữ số cuối của năm thực hiện việc xăm mã số; c) Mực sử dụng để xăm mã số trên da lợn phải bảo đảm an toàn thực phẩm, không được mất màu. 3. Lợn vận chuyển đến các cơ sở giết mổ phải thực hiện biện pháp niêm phong phương tiện vận chuyển bằng kẹp chì hoặc dây niêm phong có mã số, số hiệu. 4. Gia súc đã được đánh dấu theo quy định tại khoản 1, khoản 2 Điều này thì không phải đánh dấu lại khi kiểm dịch vận chuyển đi tiêu thụ nếu mã số, số hiệu của gia súc không bị mất màu mực. 5. Gia súc sau khi kiểm dịch đáp ứng yêu cầu kiểm dịch, Cơ quan kiểm dịch động vật lập bảng kê mã số, số hiệu của gia súc (theo mẫu quy định tại Phụ lục IX ban hành kèm theo Thông tư này) và gửi kèm theo giấy chứng nhận kiểm dịch động vật.'
      trang_pdf: 22
      sha256_pdf: 832a983a825a26ef5414b1b320a65753c7877719f0c2d51d8ea0de0d7ec81818
    - dieu: 27
      noi_dung: 'Điều 27. Đánh dấu gia súc xuất khẩu, nhập khẩu 1. Gia súc xuất khẩu, nhập khẩu phải được đánh dấu bằng cách bấm thẻ tai bằng nhựa cao su, thẻ tai được bấm ở mặt trong tai bên phải của gia súc. 2. Thẻ tai màu vàng có hình dáng theo hình 3 quy định tại Phụ lục VIII ban hành kèm theo Thông tư này; trên thẻ tai phải ghi rõ mã số, số hiệu của gia súc. 3. Mã số, số hiệu của gia súc gồm: Mã số của Cơ quan kiểm dịch động vật cửa khẩu thuộc Cục Chăn nuôi và Thú y; mã số của tỉnh (nơi cách ly gia súc để kiểm dịch xuất khẩu, nhập khẩu hoặc nơi xuất phát đối với gia súc xuất khẩu); năm cấp thẻ tai và số hiệu của gia súc. 24 4. Mực viết mã số, số hiệu của gia súc trên thẻ tai theo quy định tại điểm c, khoản 1 Điều 26 Thông tư này. 5. Cách viết mã số, số hiệu của gia súc trên thẻ tai (hình 4 quy định tại Phụ lục VIII, ban hành kèm theo Thông tư này) được quy định cụ thể như sau: a) Hàng trên gồm: Mã số của Cơ quan kiểm dịch động vật xuất nhập khẩu; 02 (hai) chữ số tiếp theo là mã số của tỉnh (nơi cách ly gia súc để kiểm dịch xuất khẩu, nhập khẩu hoặc nơi xuất phát đối với gia súc xuất khẩu); 02 (hai) chữ số cuối cùng là 02 (hai) chữ số cuối của năm cấp thẻ tai; Trường hợp gia súc nhập khẩu không phải nuôi cách ly kiểm dịch thì sử dụng mã số của tỉnh nơi có cửa khẩu làm thủ tục kiểm dịch nhập khẩu gia súc; b) Hàng dưới là số hiệu của gia súc (được tính từ 000001 đến 999999). 6. Gia súc sau khi kiểm dịch bảo đảm yêu cầu, Cơ quan kiểm dịch động vật lập bảng kê mã số, số hiệu của gia súc (theo mẫu quy định tại Phụ lục IX ban hành kèm theo Thông tư này) kèm theo Giấy chứng nhận kiểm dịch động vật. 7. Trường hợp gia súc nhập khẩu đã được đánh dấu hoặc đã có thẻ tai thì không phải thực hiện theo quy định tại các khoản 1, 2, 3, 4 và 5 Điều này. Cơ quan kiểm dịch động vật cửa khẩu lập bảng kê mã số, số hiệu của gia súc nhập khẩu theo quy định tại khoản 6 Điều này (trừ trường hợp đã có bảng kê mã số, số hiệu của gia súc kèm theo giấy chứng nhận kiểm dịch của nước xuất khẩu). Chương IV ĐIỀU KHOẢN THI HÀNH'
