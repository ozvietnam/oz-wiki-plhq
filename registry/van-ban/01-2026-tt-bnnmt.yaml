      noi_dung: 19 này đối với động vật, sản phẩm động vật gửi kho ngoại quan để tái xuất khẩu; d) Trường hợp lô hàng được xuất ra khỏi kho ngoại quan từng phần, Cơ quan kiểm dịch động vật cửa khẩu trừ lùi số lượng hàng trên Giấy chứng nhận kiểm dịch gốc của nước xuất khẩu, lưu bản chụp Giấy chứng nhận kiểm dịch của nước xuất khẩu vào hồ sơ kiểm dịch. Giấy chứng nhận kiểm dịch gốc của nước xuất khẩu sẽ được Cơ quan kiểm dịch động vật cửa khẩu thu lại và lưu vào hồ sơ của lần xuất hàng cuối cùng của lô hàng (trường hợp nhập để tiêu dùng trong nước, làm nguyên liệu gia công, chế biến hàng xuất khẩu) hoặc giao lại cho chủ hàng trong trường hợp hàng tái xuất khẩu. Mục 5 KIỂM DỊCH ĐỘNG VẬT TRÊN CẠN THAM GIA HỘI CHỢ, TRIỂN LÃM, BIỂU DIỄN NGHỆ THUẬT, THI ĐẤU THỂ THAO; SẢN PHẨM ĐỘNG VẬT TRÊN CẠN THAM GIA HỘI CHỢ, TRIỂN LÃM; VẬN CHUYỂN MẪU BỆNH PHẨM
