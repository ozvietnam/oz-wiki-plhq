    - dieu: 8
      noi_dung: 'Điều 8. Trình tự, thủ tục, nội dung kiểm dịch động vật, sản phẩm động vật trên cạn xuất khẩu 1. Đăng ký kiểm dịch Trước khi xuất khẩu động vật, sản phẩm động vật có yêu cầu kiểm dịch, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại Điều 7 Thông tư này đến Chi cục Chăn nuôi và Thú y vùng hoặc Cơ quan quản lý chuyên ngành Thú y cấp tỉnh được Cục Chăn nuôi và Thú y ủy quyền (sau đây gọi là Cơ quan kiểm dịch động vật cửa khẩu) theo một trong các hình thức sau: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp. Trường hợp gửi hồ sơ đăng ký qua thư điện tử, fax, sau đó chủ hàng phải gửi bản chính. 2. Tiếp nhận và kiểm tra hồ sơ Trong thời hạn 01 ngày làm việc kể từ ngày nhận được hồ sơ đăng ký, Cơ quan kiểm dịch động vật cửa khẩu xem xét tính đầy đủ, hợp lệ của hồ sơ. Trường hợp hồ sơ đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật cửa khẩu thông báo cho chủ hàng thời gian, địa điểm tiến hành kiểm dịch. Trường hợp hồ sơ chưa đầy đủ, hợp lệ, Cơ quan kiểm dịch động vật cửa khẩu trả lời cho chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 3. Cơ quan kiểm dịch động vật cửa khẩu thực hiện như sau: a) Kiểm tra lâm sàng đối với động vật; kiểm tra thực trạng hàng hóa đối với sản phẩm động vật; đối chiếu thông tin lô hàng với hồ sơ kiểm dịch; b) Thực hiện kiểm tra các nội dung vệ sinh thú y theo yêu cầu của nước nhập khẩu hoặc chủ hàng; c) Đối với lô hàng phải lấy mẫu xét nghiệm: Trong thời hạn 05 ngày làm việc kể từ ngày bắt đầu thực hiện kiểm dịch, nếu đáp ứng yêu cầu kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật xuất khẩu theo mẫu 13a hoặc Giấy chứng nhận kiểm dịch sản phẩm động vật xuất khẩu theo mẫu 13b quy định tại Phụ lục V ban hành kèm theo Thông tư này; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; d) Đối với lô hàng không phải lấy mẫu xét nghiệm: Trong thời hạn 01 ngày làm việc kể từ ngày bắt đầu thực hiện kiểm dịch, nếu đáp ứng yêu cầu kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật xuất khẩu theo mẫu 13a hoặc Giấy chứng nhận kiểm dịch sản phẩm động vật xuất khẩu theo mẫu 13b quy định tại Phụ lục V ban hành kèm theo Thông tư này; Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia 8 hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do; đ) Hình thức cấp Giấy chứng nhận kiểm dịch: bản điện tử trong trường hợp hồ sơ được gửi qua Cổng thông tin một cửa quốc gia hoặc qua Cổng dịch vụ công; bản giấy trong trường hợp hồ sơ được gửi qua dịch vụ bưu chính công ích hoặc thư điện tử hoặc fax hoặc gửi trực tiếp hoặc theo yêu cầu của chủ hàng. 4. Trường hợp nước nhập khẩu hoặc chủ hàng không có yêu cầu kiểm dịch: Chủ hàng phải thực hiện việc kiểm dịch vận chuyển ra khỏi địa bàn cấp tỉnh theo quy định tại Điều 5 và Điều 6 Thông tư này.'
