    - dieu: 14
      noi_dung: 'Điều 14. Kiểm dịch động vật, sản phẩm động vật nhập khẩu mang theo người 1. Kiểm dịch đối với trường hợp mang theo người không quá 02 con động vật với mục đích để nuôi làm cảnh, sinh hoạt trong gia đình hoặc mang theo đi du lịch, công tác, quá cảnh và không thuộc Danh mục động vật cấm xuất khẩu, nhập khẩu theo quy định a) Chủ hàng khai báo kiểm dịch nhập khẩu trực tiếp tại Cơ quan kiểm dịch động vật cửa khẩu; b) Cơ quan kiểm dịch động vật cửa khẩu thực hiện: Kiểm tra Giấy chứng nhận kiểm dịch của nước xuất khẩu; kiểm tra lâm sàng động vật; phòng bệnh bằng vắc-xin đối với động vật chưa được phòng bệnh truyền nhiễm nguy hiểm; lấy mẫu xét nghiệm đối với động vật nghi mắc bệnh truyền nhiễm; c) Đối với động vật không phải lấy mẫu xét nghiệm: Trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật nhập khẩu theo mẫu 15a quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: động vật khỏe mạnh, được phòng bệnh theo quy định; d) Đối với động vật phải lấy mẫu xét nghiệm: Trong thời hạn 05 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch động vật nhập khẩu theo mẫu 15a quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: động vật khỏe mạnh, được phòng bệnh theo quy định; kết quả xét nghiệm âm tính với tác nhân gây bệnh. 2. Kiểm dịch đối với động vật mang theo người không thuộc quy định tại khoản 1 Điều này: Thực hiện theo quy định tại điểm a và điểm b khoản 1, khoản 2 Điều 11 Thông tư này; các điểm b, c và d khoản 1 Điều này. 3. Kiểm dịch đối với sản phẩm động vật mang theo người không thuộc quy định tại khoản 3 mục II Phụ lục II ban hành kèm theo Thông tư này a) Thực hiện theo quy định tại điểm a và điểm b khoản 1, khoản 2, điểm a khoản 3 Điều 12 Thông tư này; 13 b) Đối với sản phẩm động vật mang theo người phải lấy mẫu xét nghiệm thực hiện theo quy định tại điểm d khoản 3 Điều 12 Thông tư này; c) Đối với sản phẩm động vật mang theo người không phải lấy mẫu xét nghiệm: Trong thời hạn 01 ngày làm việc kể từ ngày thực hiện kiểm dịch, Cơ quan kiểm dịch động vật cửa khẩu cấp Giấy chứng nhận kiểm dịch sản phẩm động vật nhập khẩu theo mẫu 15b quy định tại Phụ lục V ban hành kèm theo Thông tư này trong trường hợp hồ sơ đầy đủ, hợp lệ và bảo đảm các yêu cầu vệ sinh thú y gồm: tình trạng bao gói, bảo quản sản phẩm đạt yêu cầu; sản phẩm động vật không có biểu hiện bất thường về đặc tính đặc trưng của sản phẩm. Trường hợp không cấp Giấy chứng nhận kiểm dịch, Cơ quan kiểm dịch trả lời chủ hàng bằng văn bản hoặc phản hồi qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc thư điện tử và nêu rõ lý do. 4. Hình thức cấp Giấy chứng nhận kiểm dịch nhập khẩu theo quy định tại điểm đ khoản 3 Điều 8 Thông tư này. 5. Cơ quan kiểm dịch động vật cửa khẩu lập biên bản và tiêu hủy ngay tại khu vực gần cửa khẩu đối với động vật mắc bệnh truyền nhiễm nguy hiểm, sản phẩm động vật không đáp ứng yêu cầu kiểm dịch; lập biên bản tạm giữ hàng và xử lý theo quy định đối với trường hợp Giấy chứng nhận kiểm dịch của nước xuất khẩu không hợp lệ. 6. Không mang theo người sản phẩm có nguồn gốc động vật ở dạng tươi sống, sơ chế.'
