    8883/CHQ-GSQL ngày 04-02-2026 của Cục Hải quan triển khai Công điện số 08/CĐ-TTg ngày 03-02-2026 của Thủ tướng Chính
    phủ về tháo gỡ ngay các vướng mắc, khó khăn trong kiểm tra thực phẩm, hàng hóa xuất nhập khẩu: (1) Chi cục trưởng
    các Chi cục Hải quan khu vực bố trí lãnh đạo, công chức trực 24/7 để giải quyết thông quan nhanh hàng hóa XNK, ưu
    tiên thông quan ngay thực phẩm nhập khẩu đã đảm bảo hồ sơ theo quy định và hướng dẫn của các Bộ chuyên ngành; báo
    cáo số liệu thực phẩm tồn đọng tại cảng chưa thông quan vào 8h00 và 13h30 hàng ngày theo 3 nhóm hàng hóa tại Phụ lục
    II, III, IV Nghị định 46/2026/NĐ-CP; (2) Ban CNTT và Thống kê hải quan bố trí cán bộ trực đảm bảo hệ thống xử lý dữ
    liệu điện tử hải quan hoạt động thông suốt
