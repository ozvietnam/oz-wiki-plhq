    đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/4/VBDI_8883.pdf.PDF, id=102552, 1 trang, Phó Cục trưởng Âu Anh Tuấn
