xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/15/27.VBDI_24028.pdf, id=101317, SHA-256 2f316378ff1171c7ec548de4bc76616ceec0b1a64bc7d977eed278390757d528): Thông báo số 24028/TB-CHQ ngày 12-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Gối đỡ công nghiệp dùng ổ bi (Ball Bearing Unit, còn gọi là thân ổ đã gắn ổ bi, ký mã hiệu SRBF UCP-205; cấu tạo gồm thân ổ/gối đỡ bằng gang đúc bảo vệ các bộ phận bên trong và ổ bi bằng thép được lắp sẵn bên trong thân ổ để giảm ma sát và chịu tải; thông số kỹ thuật: đường kính trong 25 mm, chiều dài tổng 140 mm, chiều rộng gối 38 mm, chiều cao đến tâm trục 36.3 mm, khoảng cách hai lỗ bắt ốc 105 mm, đường kính lỗ bắt ốc 13 mm, khối lượng 0.79 kg; dùng để hỗ trợ và giữ cố định trục quay ở vị trí chính xác trong các máy móc thiết bị công nghiệp như băng tải, quạt công nghiệp, bơm công nghiệp, không phù hợp sử dụng cho động cơ xe thuộc Chương 87 và các máy thuộc nhóm 84.29 hoặc 84.30), phân loại vào nhóm 84.83, phân nhóm 8483.20, mã số 8483.20.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Gối đỡ công nghiệp dùng ổ bi (Ball Bearing Unit, thân ổ bằng gang đúc đã gắn ổ bi bên trong, ký mã hiệu SRBF UCP-205; đường kính trong 25 mm, chiều dài tổng 140 mm, chiều rộng gối 38 mm, chiều cao tâm trục 36.3 mm, khối lượng 0.79 kg; dùng giữ cố định trục quay trong máy móc thiết bị công nghiệp, không dùng cho xe Chương 87 hay máy nhóm 84.29, 84.30) thuộc nhóm 84.83, phân nhóm 8483.20, mã số 8483.20.90.'
