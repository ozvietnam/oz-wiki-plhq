  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/30/VB_19488.pdf, id=105265, SHA-256 3b8a1af29ad684f1ab1e168ba604719446e6273b2554db361375a992cb66d677): Thông báo số 19488/TB-CHQ ngày 27-07-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Vỏ hộp bộ điều khiển điện tử trong hệ thống phanh ABS của xe máy (tên thương mại Housing, ECU; ký mã hiệu 009V79185-00000; cấu tạo từ nhựa PBT, ống lót chèn bằng kim loại, màng dán nhựa và các cực nối tín hiệu/nguồn bằng đồng; kích thước 83,6 x 52 x 33,9 mm, khối lượng tịnh 0,045336 kg/chiếc, dòng điện đi qua các đầu điện cực kết nối với bộ phận điều khiển phanh tối đa 10A), phân loại vào nhóm 85.36, phân nhóm 8536.90, mã số 8536.90.94; có hiệu lực từ ngày ký'
