ghi_chu: 'Xác định trước mã số mặt hàng Vỏ hộp bộ điều khiển điện tử trong hệ thống phanh ABS của xe máy (Housing, ECU, ký mã hiệu 009V79185-00000, cấu tạo từ nhựa PBT và các cực nối tín hiệu bằng đồng, kích thước 83,6x52x33,9 mm, khối lượng 0,045336 kg/chiếc, dòng điện tối đa 10A) thuộc nhóm 85.36, phân nhóm 8536.90, mã số 8536.90.94. Tệp PDF VB_19488.pdf gồm 4 trang scan, trong đó trang 1, 3, 4 là toàn văn Thông báo 19488/TB-CHQ và trang 2 là trang kết luận được quét ghép từ Thông báo 19489/TB-CHQ cùng ngày.'
