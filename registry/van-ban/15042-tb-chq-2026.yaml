  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/10/VB_15042.pdf, id=103128, SHA-256 f0f528fa443294a40868faf765cda86b5b238c724f63cd8af80da36717569531): Thông báo số 15042/TB-CHQ ngày 09-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bảng mẫu vải Swatch card (ký, mã hiệu 778CARD; gồm 2 miếng mẫu vải sơnin từ xơ nhân tạo đã tráng phủ, 100% polyester, định lượng 285 g/m², kích thước 2,5 x 2,5 inch mỗi miếng, bốn mép cắt răng cưa chống sổ tuột, chiếm 21% trọng lượng, dán cố định trên 1 bảng giấy bìa hình chữ nhật định lượng 350 g/m², kích thước 4,25 x 9 inch có in thông tin mẫu vải, chiếm 79% trọng lượng; đóng gói 100 cái/hộp; dùng trưng bày tại showroom, cửa hàng để giới thiệu chất liệu, màu sắc vải và hỗ trợ thiết kế, sản xuất), phân loại vào nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90; có hiệu lực kể từ ngày ban hành'
