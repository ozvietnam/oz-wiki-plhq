ghi_chu: 'Xác định trước mã số mặt hàng Bảng mẫu vải Swatch card (ký, mã hiệu 778CARD; gồm 2 mẫu vải sơnin từ xơ nhân tạo đã tráng phủ 100% polyester định lượng 285 g/m² kích thước 2,5 x 2,5 inch dán cố định trên bảng giấy bìa định lượng 350 g/m² kích thước 4,25 x 9 inch; tỷ lệ trọng lượng mẫu vải 21%, bảng giấy bìa 79%; đóng gói 100 cái/hộp, dùng giới thiệu mẫu chất liệu và màu sắc vải) thuộc nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90.'
