nhanh:
  - kiem-tra-chuyen-nganh/kiem-dich
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn Luật Bảo vệ và kiểm dịch thực vật số 41/2013/QH13 trên Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn docid=171413, datafiles.chinhphu.vn 41_kiemdich_thucvat.pdf) và Luật số 146/2025/QH15 (ban hành 11/12/2025, hiệu lực 01/01/2026): ban hành ngày 25/11/2013, có hiệu lực từ 01/01/2015 (Điều 77); đã được sửa đổi, bổ sung một số điều bởi Luật 35/2018/QH14 và Luật 146/2025/QH15 (không bị thay thế năm 2024; số hiệu 43/2024/QH15 là Luật sửa đổi Luật Đất đai, Nhà ở, Kinh doanh BĐS, Các tổ chức tín dụng).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: paperclip-agent@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Pham vi điều chỉnh Luật này quy định về hoạt động phòng, chống sinh vật gây hại thực vật; kiểm dịch thực vật; quản lý thuôc bảo vệ thực vật.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luat này áp dụng đôi với tô chức, cá nhân trong nước và tô chức, cá nhân nước ngoài có liên quan đên hoạt động bảo vệ và kiêm dịch thực vật tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Thực vật là cây và sản phẩm của cây. 2. Bảo vệ thực vật là hoạt động phòng, chéng sinh vật gây hại thực vật. 3. Kiểm dịch thực vật là hoạt động ngăn chặn, phát hiện, kiểm soát đối tượng kiểm dịch thực vật, đối tượng phải kiểm soát và sinh vật gây hại lạ. 4. Chủ thực vật là tổ chức, cá nhân có quyền sở hữu hoặc quyền sử dụng hoặc trực tiép quan lý thực vật.'
      trang_pdf: 1
    - dieu: 14
      noi_dung: Điều 14. Yêu cầu phòng, chống sinh vật gây hại thực vật 1. Chủ động thực hiện các biện pháp quản lý tổng hợp sinh vật gây hại bao gồm sử dụng giống cây trồng chống chịu sinh vật gây hại, vệ sinh đồng ruộng, bố trí thời vụ, sử dụng phân bón, mật độ hợp lý và các biện pháp khác thân thiện với môi trường nhằm tạo điều kiện thuận lợi cho cây trồng sinh trưởng, phát triển, tăng sức đề kháng, hạn chế sự phát sinh, phát triển của sinh vật gây bại, bảo
      trang_pdf: 8
    - dieu: 24
      noi_dung: 'Điều 24. Quyền và nghĩa vụ cia tổ chức, cá nhân hoạt động dịch vu bảo vệ thực vật 1. Tổ chức, cá nhân hoạt động dịch vụ bảo vệ thực vật có quyền sau đây: a) Được trả chi phí thực biện dich vụ bảo vệ thực vật theo hợp đồng ký kết với chủ thực vật; b) Tham dự chương trình tập huấn, nâng cao kiến thức về phòng, chống sinh vật gây hại thực vật phù hợp với điêu kiện cụ thê của địa phương;'
      trang_pdf: 13
    - dieu: 35
      noi_dung: Điều 35. Tạm ngừng xuất khẩu, nhập khẩu; cấm xuất khẩu, nhập khẩu vật thé thuộc diện kiểm dịch thực vật 1. Vật thé thuộc diện kiểm dịch thực vật bị tạm ngừng xuất khẩu, nhập khẩu
      trang_pdf: 17
    - dieu: 45
      noi_dung: Điều 45. Nhiệm vụ và quyền hạn của công chức kiểm dịch thực vật 1. Thực hiện kiểm dịch thực vật theo quy định tại Luật này; nghiêm chỉnh chấp hành quy trình nghiệp vụ kiểm dịch thực vật và chịu trách nhiệm về việc thực hiện nhiệm vụ, quyền hạn của mình. 2. Yêu cầu chủ vật thể thuộc diện kiểm dịch thực vật cung cấp hé sơ, tài liệu liên quan, phương tiện, nhân lực cân thiết cho việc kiêm dịch.
      trang_pdf: 22
    - dieu: 55
      noi_dung: Điều 55. Kháo nghiệm thuốc bảo vệ thực vật 1. Việc khảo nghiệm thuốc bảo vệ thực vật phải thực hiện đối với tất cả thuốc bảo vệ thực vật trước khi đăng ký vào Danh mục thuốc bảo vệ thực vật được phép sử dụng tại Việt Nam; đối với thuốc bảo vệ thực vật sinh học được xét giảm yêu cầu khảo nghiệm.
      trang_pdf: 27
    - dieu: 65
      noi_dung: 'Điều 65. Hồ sơ, trình tự, thủ tục, thấm quyền cấp, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thuốc bảo vệ thực vật, Giấy chứng nhận đủ điều kiện buôn bán thuốc bảo vệ thực vật 1. Hồ sơ đề nghị cấp Giấy chứng nhận đủ điều kiện sản xuất thuốc bảo vệ thực vật, Giây chứng nhận đủ điêu kiện buôn bán thuôc bảo vệ thực vật bao gôm:'
      trang_pdf: 32
    - dieu: 76
      noi_dung: Điều 76. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành kế từ ngày 01 tháng 01 năm 2015. Pháp lệnh bảo vệ và kiểm dịch thực vật số 36/2001/PL-UBTVQHI0 ngày 08 tháng 8 năm 2001 hết hiệu lực ké từ ngày Luật này có hiệu lực. 2. Các loại giấy phép, giấy chứng nhận về bảo vệ và kiểm dịch thực vật đã
      trang_pdf: 38
ghi_chu: Luật khung về bảo vệ và kiểm dịch thực vật, đang có hiệu lực (được sửa đổi, bổ sung một phần bởi Luật 35/2018/QH14 và Luật 146/2025/QH15). Khôi phục từ trạng thái HET_HIEU_LUC do nhầm lẫn số hiệu với Luật 43/2024/QH15 ở đợt trước.
