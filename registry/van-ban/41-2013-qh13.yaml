# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 41/2013/QH13
loai: LUAT
ten: Luật Bảo vệ và kiểm dịch thực vật
co_quan: QH
ngay_ban_hanh: '2013-11-25'
hieu_luc_tu: '2014-01-01'
