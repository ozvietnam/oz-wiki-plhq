ghi_chu: 'Xác định trước mã số mặt hàng Cáp điện ALVSH035F (cấu tạo 01 lõi nhôm dẫn điện đường kính 0,75~0,79 mm gồm 19 sợi nhôm nhỏ xoắn vào nhau, bọc cách điện bằng nhựa plastic dày từ 0,25 mm trở lên, không có vỏ bọc chống nhiễu, điện áp 60VDC hoặc 25VAC, chưa gắn đầu nối điện, dùng sản xuất bộ dây dẫn điện cho xe ô tô) thuộc nhóm 85.44, mã số 8544.49.22.'
