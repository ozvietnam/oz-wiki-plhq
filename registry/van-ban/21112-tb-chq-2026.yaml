xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21112.pdf, id=106010, SHA-256 15e0685c0ad9bb445db8310ac930ad59f9552fe15ff91830c9abc123bfabbbd5): Thông báo số 21112/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp điện ALVSH035F (ký mã hiệu ALVSH035F; cấu tạo gồm 01 lõi nhôm dẫn điện đường kính 0,75~0,79 mm gồm 19 sợi nhôm nhỏ đường kính ~0,155 mm xoắn vào nhau, đã bọc cách điện bằng nhựa plastic độ dày từ 0,25 mm trở lên, không có vỏ bọc chống nhiễu, điện áp định mức 60VDC hoặc 25VAC, không dùng cho viễn thông, chưa gắn với đầu nối điện, dạng cuộn dùng làm nguyên liệu đầu vào để sản xuất các bộ dây dẫn điện hoàn chỉnh cho xe ô tô), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.22; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
