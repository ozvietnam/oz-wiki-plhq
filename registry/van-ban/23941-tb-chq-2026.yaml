ghi_chu: 'Xác định trước mã số mặt hàng Hương caramel (tên thương mại CARAMEL FLAVOR S2503915, ký mã hiệu S2503915, dạng chất lỏng, thành phần Medium chain triglycerides 80-100%, hương liệu 5-10% gồm Aromatic aldehydes ~ Ethyl Vanillin và Ketones ~ Methylcyclopentenolone, Triacetin <2%, tỷ trọng riêng 0,9528-0,9728 ở 20 độ C, dùng làm hương liệu trong sản xuất bánh ngọt, kẹo) thuộc nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30.'
