  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/11/6/VB_23941.pdf, id=106720, SHA-256 1206297e1b1fa3e9b74057807209c4188925b88bfbe087c798c775d59d4e0f06): Thông báo số 23941/TB-CHQ ngày 06-11-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Hương caramel (CARAMEL FLAVOR S2503915, thành phần Medium chain triglycerides 80-100%, hương liệu 5-10%, Triacetin <2%, dạng lỏng, không chứa cồn, dùng làm hương liệu trong sản xuất bánh ngọt, kẹo), phân loại vào nhóm 33.02, phân nhóm 3302.10, mã số 3302.10.30; có hiệu lực kể từ ngày ban hành'
