xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo Số 107 + 108 ngày 29-01-2019 (có lớp chữ, lưu tại raw/download/congbaocdn.chinhphu.vn/22-2018-tt-btttt.pdf) và tệp ký số 22-btttt.signed.pdf trên vanban.chinhphu.vn (docid=195976, lưu tại raw/download/datafiles.chinhphu.vn/22-2018-tt-btttt.pdf): số hiệu 22/2018/TT-BTTTT, trích yếu "Ban hành Danh mục hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực in, phát hành xuất bản phẩm", ngày ký 28-12-2018, người ký Bộ trưởng Nguyễn Mạnh Hùng (căn cứ Luật Xuất bản ngày 20-11-2012; Luật Quản lý ngoại thương ngày 12-6-2017; Nghị định 195/2013/NĐ-CP ngày 21-11-2013; Nghị định 60/2014/NĐ-CP ngày 19-6-2014 và Nghị định 25/2018/NĐ-CP ngày 28-02-2018; Nghị định 69/2018/NĐ-CP ngày 15-5-2018; Nghị định 17/2017/NĐ-CP ngày 17-02-2017). Cấu trúc gồm 2 Điều và 2 Phụ lục (31 mã HS thuộc các nhóm 4901, 4902, 4903, 4904, 4905, 4909, 4910, 4911, 8442, 8443): Điều 1 ban hành kèm theo Thông tư 02 danh mục (khoản 1: Danh mục hàng hóa theo mã số HS và hình thức quản lý đối với hàng hóa nhập khẩu trong lĩnh vực in tại Phụ lục I; khoản 2: Danh mục hàng hóa theo mã số HS và hình thức quản lý đối với hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực phát hành xuất bản phẩm tại Phụ lục II). Trích nguyên văn Điều 2 — Điều khoản thi hành: "1. Thông tư này có hiệu lực thi hành kể từ ngày 12 tháng 02 năm 2019 và thay thế các Thông tư sau đây: a) Thông tư số 16/2015/TT-BTTTT ngày 17 tháng 6 năm 2015 của Bộ trưởng Bộ Thông tin và Truyền thông quy định chi tiết thi hành Nghị định số 187/2013/NĐ-CP ngày 20 tháng 11 năm 2013 của Chính phủ về xuất khẩu, nhập khẩu hàng hóa trong lĩnh vực in, phát hành xuất bản phẩm; b) Thông tư số 41/2016/TT-BTTTT ngày 26 tháng 12 năm 2016 của Bộ trưởng Bộ Thông tin và Truyền thông sửa đổi, bổ sung một số điều của Thông tư số 16/2015/TT-BTTTT ngày 17 tháng 6 năm 2015 của Bộ trưởng Bộ Thông tin và Truyền thông quy định chi tiết thi hành Nghị định số 187/2013/NĐ-CP ngày 20 tháng 11 năm 2013 của Chính phủ về xuất khẩu, nhập khẩu hàng hóa trong lĩnh vực in, phát hành xuất bản phẩm. 2. Chánh Văn phòng, Cục trưởng Cục Xuất bản, In và Phát hành, Thủ trưởng các cơ quan, đơn vị thuộc Bộ Thông tin và Truyền thông; cơ quan, tổ chức, cá nhân tham gia hoặc có liên quan đến nhập khẩu, xuất khẩu hàng hóa trong lĩnh vực in, phát hành xuất bản phẩm có trách nhiệm thi hành Thông tư này. 3. Trong quá trình thực hiện Thông tư, nếu có vướng mắc, đề nghị phản ánh kịp thời về Bộ Thông tin và Truyền thông (qua Cục Xuất bản, In và Phát hành) để hướng dẫn và xem xét, giải quyết./." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn (id=28195) và vanban.chinhphu.vn (docid=195976): TT 22/2018/TT-BTTTT đang CON_HIEU_LUC, đã được sửa đổi, bổ sung một phần tại Điều 2 và khoản 1 Điều 3 Thông tư số 11/2024/TT-BTTTT ngày 23-09-2024 (hiệu lực từ 07-11-2024, docid=211270) và đã được hợp nhất tại Văn bản hợp nhất số 09/VBHN-BTTTT ngày 21-10-2024 của Bộ Thông tin và Truyền thông (docid=211488, Công báo Số 1179 + 1180 ngày 04-11-2024).'
