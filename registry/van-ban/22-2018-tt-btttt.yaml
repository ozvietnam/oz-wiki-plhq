ghi_chu: 'Đã hiệu đính ten, ngay_ban_hanh (từ 2018-11-16 sai ở bản ghi NGUON_B cũ về đúng ngày ký 2018-12-28) và bổ sung hieu_luc_tu: 2019-02-12 theo đúng nguyên bản ký số trên Công báo. Điểm b khoản 1 Điều 2 thay thế thêm Thông tư số 41/2016/TT-BTTTT ngày 26-12-2016 nhưng văn bản này chưa có mục riêng trong registry/van-ban/ nên ghi nhận tại pham_vi và ghi_chu. Phần căn cứ còn nêu Luật Xuất bản số 19/2012/QH13 (chưa mở mục trong sổ) và Nghị định 69/2018/NĐ-CP (đã hết hiệu lực, thay bởi NĐ 95/2026/NĐ-CP). Toàn văn hợp nhất hiện hành của TT 22/2018/TT-BTTTT sau khi sửa đổi bởi TT 11/2024/TT-BTTTT là Văn bản hợp nhất số 09/VBHN-BTTTT ngày 21-10-2024 (https://vanban.chinhphu.vn/?pageid=27160&docid=211488, chưa mở mục riêng trong sổ).'
