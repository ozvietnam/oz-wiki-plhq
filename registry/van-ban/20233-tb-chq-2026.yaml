xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/17/VB_20233.pdf, id=105429, SHA-256 1b6080dd58dca0d809cff94490065f36e2aa62b6c7dbca7e6d134748bb6e14ad): Thông báo số 20233/TB-CHQ ngày 12-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cụm IP (MODULE ASSY-COCKPIT, ký, mã hiệu 84700-I7AA0TC2, kích thước tổng thể 1430mm x 600mm x 720mm; cấu thành từ xương IP bằng kim loại, cốp đựng đồ IP, thân IP, trục lái, dây điện IP, ốp trang trí, đèn trang trí, cửa gió và ống chia gió, cục nóng và cụm điều khiển điều hòa, cảm biến ánh sáng, túi khí hành khách, hộp điều khiển AVN, cáp kết nối USB, loa, hộp điều khiển điện thân xe body, công tắc nút ấn Start/Stop và cụm đồng hồ táp-lô được lắp ráp thành một cụm thống nhất để lắp trên xe ô tô chở người dưới 9 chỗ ngồi), phân loại vào nhóm 87.08, phân nhóm 8708.29, mã số 8708.29.95; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Cụm IP (MODULE ASSY-COCKPIT, ký mã hiệu 84700-I7AA0TC2, cụm trung tâm điều khiển táp-lô lắp ráp từ xương IP kim loại, trục lái, hệ thống điều hòa/cửa gió, túi khí hành khách, hộp điều khiển AVN/body, nút ấn Start/Stop và cụm đồng hồ táp-lô dùng cho xe ô tô chở người dưới 9 chỗ ngồi nhóm 87.03) thuộc nhóm 87.08, phân nhóm 8708.29, mã số 8708.29.95.'
