  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Băng keo hai mặt DS10G (Double-sided Adhesive Tape DS10G; dạng cuộn jumbo bán thành phẩm rộng 1240 mm x dài 1000 m x dày 80 ± 5 µm; cấu tạo gồm 2 lớp keo Acrylic ~18,9% x 2, lớp nền Tissue vải không dệt 8%, lớp release Silicone 0,6% và giấy chống dính Blank Paper 53,6%) thuộc nhóm 35.06, phân nhóm 3506.91, mã số 3506.91.90.'
