  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/11/VB_17345.pdf, id=104620, 5 trang, SHA-256 e40dac1818126c3ca84efbab9041ecb41a833c8875819326d7f04e71436015c3): Thông báo số 17345/TB-CHQ ngày 10-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Băng keo hai mặt DS10G (Double-sided Adhesive Tape DS10G, ký mã hiệu DS10G; băng keo hai mặt nền vải không dệt tissue phủ keo acrylic, dạng cuộn jumbo bán thành phẩm dùng để chia cuộn nhỏ slitting hoặc gia công die-cut, kích thước dày 80 ± 5 µm, rộng 1240 mm, dài 1000 m, khối lượng tịnh 267 kg; thành phần theo trọng lượng gồm 2 lớp dính Acrylic polymer ~18,9% x 2, chất nền Tissue vải không dệt 8%, lớp release Silicone 0,6%, lớp giấy chống dính Blank Paper 53,6%; dùng dán liên kết vật liệu trong công nghiệp điện tử, gia công linh kiện), phân loại vào nhóm 35.06, phân nhóm 3506.91, mã số 3506.91.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
