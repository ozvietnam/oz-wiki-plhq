xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/17/VB_20274.pdf, id=105430, SHA-256 b7c48cb6c548999882bae0e6190942401ba19dbc4afcc507199f5c94a40faaa8): Thông báo số 20274/TB-CHQ ngày 12-08-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 20274/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Tấm nhôm hợp kim hình tam giác dùng để sản xuất thiết bị tản nhiệt, ký mã hiệu 401028050-GP2 (hàm lượng Al 98,3935%, Mg 0,5467%, Si 0,4438%, Fe 0,3187%, bề mặt phẳng hình tam giác vuông kích thước hai cạnh góc vuông 92,43 mm x 48,63 mm, cạnh huyền 102,95 mm, độ dày 4,99 mm, khối lượng 0,0325 kg, mặt cắt đặc hình chữ nhật, sản xuất bằng phương pháp đột dập trực tiếp từ tấm nhôm phẳng, mài ba via làm nhẵn và mạ niken bề mặt bằng phản ứng hóa học; dùng kem hàn gắn cố định vào lá tản nhiệt trên thiết bị tản nhiệt để cố định khoảng cách, chống biến dạng ống đồng và tối ưu hóa truyền nhiệt), phân loại vào nhóm 76.16 ("Các sản phẩm khác bằng nhôm"), mã số 7616.99.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Tấm nhôm hợp kim hình tam giác vuông mạ niken bề mặt, ký mã hiệu 401028050-GP2 (kích thước 2 cạnh góc vuông 92,43 mm x 48,63 mm, dày 4,99 mm, sản xuất bằng đột dập, mài ba via và mạ niken hóa học, dùng gắn cố định vào lá tản nhiệt trên thiết bị tản nhiệt) thuộc nhóm 76.16, mã số 7616.99.90.'
