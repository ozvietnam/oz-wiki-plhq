  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/19/7.VBDI_25123.pdf, id=101374, SHA-256 1c945cea538bb9a5fad7eea2eeaa925cbd378bd7c3ec8bbf7782a7747e9127fb): Thông báo số 25123/TB-CHQ ngày 18-09-2025 của Cục Hải quan (ký số 19-09-2025, trên mục lục cổng ghi ký hiệu 25123/CHQ-NVTHQ) về kết quả xác định trước mã số theo đơn đề nghị số 02-2025/TGC-XDTMS ngày 19-04-2025 đối với mặt hàng Xe vận chuyển phục vụ dùng để chở hành lý, đồ dùng dọn phòng của khu vực sân gôn, khu nghỉ dưỡng, khách sạn, loại chạy điện hiệu LEROAD, tên thương mại SHUTTLE 2 WITH VAN BOX (ELECTRIC VEHICLE), model LRGD/2 (4 bánh, động cơ điện 2 chiều AC 48V công suất 5kW, pin Lithium 48V-105Ah, vận tốc lớn nhất 25km/h, trọng lượng toàn bộ xe 685kg, tải trọng hàng hóa tối đa ở thùng hàng 390kg, 2 chỗ ngồi kể cả lái xe, kích thước xe 3215 x 1210 x 1760mm, thùng kín chở hành lý bằng hợp kim nhôm cố định trên xe có 3 ngăn có cánh đóng mở, không đăng ký lưu hành, không tham gia giao thông, nhà sản xuất Jiaxing Leroad Special Vehicle Co., Ltd), phân loại vào nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Xe vận chuyển chở hành lý, đồ dùng dọn phòng nội khu sân gôn, khu nghỉ dưỡng, khách sạn chạy điện hiệu LEROAD SHUTTLE 2 WITH VAN BOX model LRGD/2 (4 bánh, AC 48V 5kW, trọng lượng xe 685kg, tải trọng thùng kín 390kg, không tham gia giao thông) thuộc nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29.'
