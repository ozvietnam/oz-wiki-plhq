xac_minh:
  muc: NGUON_A
  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/24/VB_8997.pdf, id=102639, SHA-256
    c421ab794e4156f5120260e9826689a06bb9af7d46a8951eb07a0beba426f3de): Công văn số 8997/CHQ-NVTHQ ngày 04-02-2026 của
    Cục Hải quan thông báo bổ sung Tuyển tập ý kiến phân loại của Tổ chức Hải quan Thế giới (WCO) theo kết quả phiên họp
    lần thứ 76 của Nhóm công tác và Ủy ban HS tại Brussels (Bỉ) tháng 09/2025 (WP76 và HSC76) làm tài liệu tham khảo
    phục vụ phân loại hàng hóa xuất khẩu, nhập khẩu theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam (gồm 18 ý kiến
    phân loại thuộc các phân nhóm: 2005.99 mục 5 đồ ăn nhẹ giòn từ bột đậu gà, bột gạo, đậu Hà Lan; 2106.90 mục 46 và 47
    chế phẩm sản xuất đồ uống; 2309.90 mục 11, 12 và 13 chế phẩm premix dùng trong chăn nuôi động vật; 2607.00 mục 1
    tinh quặng chì chứa galena; 2853.90 mục 1 Lithium bis(fluorosulfonyl)imide; 3004.90 mục 9 thuốc phòng ngừa triệu
    chứng lâm sàng ở động vật; 4407.91 mục 1 ván gỗ sồi chưa cắt cạnh cưa dọc; 5208.59 mục 1 vải cotton đã in 180 g/m2;
    7116.20 mục 2 vòng tay dây da gắn đá; 7314.41 mục 1 lưới thép mạ kẽm cứng; 7326.20 mục 3 lồng chim bằng dây sắt;
    8412.90 mục 1 cánh tua bin gió chưa sơn; 8422.30 mục 1 máy đóng viên nang cứng; 8543.40 mục 2 đầu pod tích hợp sẵn
    lõi đốt; 8543.90 mục 1 buồng chứa cartridge không kèm lõi đốt; 8705.40 mục 2 xe trộn bê tông tự nạp liệu; 8716.40
    mục 1 sơ mi rơ-moóc chuyên dụng; 9304.00 mục 1 súng hơi hạng nhẹ Airsoft); trường hợp có sự không thống nhất giữa mô
    tả tiếng Việt và tiếng Anh thì áp dụng mô tả tiếng Anh; đang còn hiệu lực
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
