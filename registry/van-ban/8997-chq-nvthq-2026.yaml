ghi_chu: >-
  Bản dịch song ngữ Anh - Việt Phụ lục bổ sung Tuyển tập ý kiến phân loại của WCO tại phiên họp lần thứ 76 (WP76 và
  HSC76 tháng 09/2025, 16 trang): ưu tiên áp dụng mô tả hàng hóa bằng tiếng Anh nếu có sự không thống nhất giữa bản
  tiếng Việt và tiếng Anh.
