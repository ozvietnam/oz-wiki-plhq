xac_minh:
  muc: NGUON_A
  pham_vi: >-
    PDF Công báo số 147 ngày 12-03-2026 (lớp chữ). TT 07/2026/TT-BCT gồm 9 Điều,
    toàn bộ nội dung từng Điều xác minh khớp với body 252 dòng trích từ PDF Công
    báo: (1) Điều 1 sửa đổi, bổ sung Điều 6 TT 37/2013 — Bộ Công Thương chỉ định
    thương nhân có Giấy phép sản xuất sản phẩm thuốc lá và do Nhà nước nắm giữ
    100% vốn điều lệ là thương nhân NK thuốc lá điếu, xì gà theo cơ chế thương mại
    nhà nước; thương nhân phải trực tiếp NK, không được ủy quyền/ủy thác. (2)
    Điều 2 sửa đổi khoản 3 Điều 7 (công bố hợp quy đối với thuốc lá điếu theo
    QCVN; công bố tiêu chuẩn áp dụng đối với xì gà) và bãi bỏ khoản 4 Điều 7.
    (3) Điều 3 sửa đổi, bổ sung khoản 1 Điều 8 — khi làm thủ tục NK phải xuất
    trình cho Hải quan 01 bản chính Đơn đăng ký NK tự động đã được Cơ quan cấp
    phép xác nhận hoặc nộp qua Hệ thống xử lý dữ liệu điện tử hải quan. (4)
    Điều 4 sửa đổi, bổ sung khoản 1, 2, 3 Điều 9 — hồ sơ NK nộp trực tiếp tại
    UBND tỉnh/thành phố nơi trụ sở chính hoặc qua bưu chính công ích/trực tuyến
    Cơ quan cấp phép (Đơn đăng ký 02 bản theo mẫu Phụ lục II; hợp đồng NK, hóa
    đơn thương mại, vận đơn, Giấy phép sản xuất sản phẩm thuốc lá — mỗi loại 01
    bản sao đóng dấu sao y); thay cụm từ "Cục Xuất nhập khẩu - Bộ Công Thương"
    tại khoản 2 và khoản 3 bằng "Cơ quan cấp phép". (5) Điều 5 sửa đổi khoản 1
    và khoản 2 Điều 10 — thay "Cục Xuất nhập khẩu - Bộ Công Thương" bằng "Cơ
    quan cấp phép". (6) Điều 6 bãi bỏ toàn bộ Điều 11 TT 37/2013. (7) Điều 7
    thay thế Phụ lục I (DM thuốc lá điếu, xì gà NK, mã HS 24.02) và Phụ lục II
    (mẫu Đơn đăng ký NK tự động). (8) Điều 8 trách nhiệm tổ chức thực hiện — Cơ
    quan cấp phép tổ chức/phối hợp kiểm tra; vi phạm ở mức xử lý hành chính thì
    không xác nhận Đơn đăng ký NK tự động cho đến khi khắc phục; vi phạm ở mức
    xem xét xử lý hình sự thì thương nhân không được làm đầu mối NK theo cơ chế
    thương mại nhà nước cho đến khi được miễn hình phạt hoặc xóa án tích. (9)
    Điều 9 điều khoản thi hành — khoản 1 hiệu lực 10-04-2026; Cục trưởng Cục
    Xuất nhập khẩu, Thủ trưởng đơn vị thuộc Bộ, cơ quan/tổ chức/cá nhân liên
    quan chịu trách nhiệm thi hành. Trang moit.gov.vn ghi trạng thái "Đã có hiệu
    lực". TT 48/2026/TT-BCT (Công báo số 521) không bãi TT 07/2026. Sổ không có
    văn bản sau thay/bãi (kiểm đến 04-10-2026)
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bổ sung Điều 6 “1. Bộ Công Thương chỉ định các thương nhân có Giấy phép sản xuất sản phẩm thuốc lá và do Nhà nước nắm giữ 100% vốn điều lệ là thương nhân nhập khẩu thuốc lá điếu, xì gà theo cơ chế thương mại nhà nước. 2. Thương nhân có Giấy phép sản xuất sản phẩm thuốc lá phải trực tiếp thực hiện nhập khẩu thuốc lá điếu, xì gà, không được ủy quyền, ủy thác cho thương nhân khác thực hiện”.'
      trang_pdf: 1
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 2
      khoan: 1
      noi_dung: '1. “3.Thương nhân nhập khẩu thuốc lá điếu phải thực hiện việc công bố hợp quy theo quy chuẩn quốc gia; Thương nhân nhập khẩu xì gà phải công bố tiêu chuẩn áp dụng phù hợp với quy định hiện hành”.'
      trang_pdf: 1
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 2
      khoan: 2
      noi_dung: '2. Bãi bỏ khoản 4 Điều 7'
      trang_pdf: 1
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 3
      khoan: 1
      noi_dung: '1. Khi làm thủ tục nhập khẩu, ngoài hồ sơ nhập khẩu theo quy định của cơ quan Hải quan, thương nhân phải xuất trình cho cơ quan Hải quan 01 (một) bản chính Đơn đăng ký nhập khẩu tự động thuốc lá điếu, xì gà đã được Cơ quan cấp phép xác nhận hoặc nộp Đơn đăng ký nhập khẩu tự động thuốc lá điếu, xì gà đã được Cơ quan cấp phép xác nhận cho cơ quan Hải quan thông qua Hệ thống xử lý dữ liệu điện tử hải quan; thương nhân chịu trách nhiệm về tính hợp pháp, đầy đủ của chứng từ nộp cho cơ quan Hải quan.'
      trang_pdf: 1
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 4
      khoan: 1
      noi_dung: '1.“1.Trước khi làm thủ tục nhập khẩu, thương nhân nộp 01(một) bộ hồ sơ trực tiếp tại UBND tỉnh/thành phố nơi thương nhân có trụ sở chính hoặc nộp hồ sơ thông qua dịch vụ bưu chính công ích, trực tuyến của Cơ quan cấp phép bao gồm: a) Đơn đăng ký nhập khẩu tự động thuốc lá điếu, xì gà: 02 (hai) bản theo mẫu quy định tại Phụ lục II ban hành kèm theo Thông tư này; b) Hợp đồng nhập khẩu: 01 (một) bản sao (có đóng dấu sao y bản chính của thương nhân); c) Hóa đơn thương mại: 01 (một) bản sao (có đóng dấu sao y bản chính của thương nhân); d) Vận đơn hoặc chứng từ vận tải của lô hàng: 01 (một) bản sao (có đóng dấu sao y bản chính của thương nhân) (nếu có); đ) Giấy phép sản xuất sản phẩm thuốc lá: 01 (một) bản sao (có đóng dấu sao y bản chính của thương nhân)”.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 4
      khoan: 2
      noi_dung: '2. Thay thế cụm từ “Cục Xuất nhập khẩu - Bộ Công Thương” tại khoản 2 Điều 9 Thông tư số 37/2013/TT-BCT bằng cụm từ “Cơ quan cấp phép”.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 4
      khoan: 3
      noi_dung: '3. Thay thế cụm từ “Cục Xuất nhập khẩu - Bộ Công Thương” tại khoản 3 Điều 9 Thông tư số 37/2013/TT-BCT bằng cụm từ “Cơ quan cấp phép”.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 5
      khoan: 1
      noi_dung: '1. Thay thế cụm từ “Cục Xuất nhập khẩu - Bộ Công Thương” tại khoản 1 Điều 10 Thông tư số 37/2013/TT-BCT bằng cụm từ “Cơ quan cấp phép”.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 5
      khoan: 2
      noi_dung: '2. Thay thế cụm từ “Cục Xuất nhập khẩu - Bộ Công Thương” tại khoản 2 Điều 10 Thông tư số 37/2013/TT-BCT bằng cụm từ “Cơ quan cấp phép”.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 6
      noi_dung: 'Điều 6. Bãi bỏ Điều 11 Bãi bỏ Điều 11.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 7
      noi_dung: 'Điều 7. Thay thế phụ lục I, Phụ lục II Thay thế Phụ lục I, Phụ lục II ban hành kèm theo Thông tư số 37/2013/TTBCT bằng phụ lục I, Phụ lục II ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 8
      noi_dung: 'Điều 8. Trách nhiệm tổ chức thực hiện Cơ quan cấp phép tổ chức kiểm tra hoặc phối hợp với các cơ quan liên quan tổ chức kiểm tra việc thực hiện hoạt động nhập khẩu thuốc lá điếu, xì gà theo quy định tại Thông tư số 37/2013/TT-BCT và Thông tư này. Trường hợp các cơ quan có thẩm quyền kết luận thương nhân không chấp hành các quy định liên quan đến việc nhập khẩu thuốc lá điếu, xì gà theo quy định hiện hành và mức độ vi phạm ở mức xử lý hành chính, Cơ quan cấp phép xem xét không xác nhận Đơn đăng ký nhập khẩu tự động thuốc lá điếu, xì gà của thương nhân cho đến khi thương nhân khắc phục xong vi phạm. Trong trường hợp các cơ quan có thẩm quyền kết luận thương nhân không chấp hành các quy định liên quan đến việc nhập khẩu thuốc lá điếu, xì gà theo quy định hiện hành và mức độ vi phạm ở mức xem xét xử lý hình sự, thương nhân không được làm đầu mối nhập khẩu thuốc lá điếu, xì gà theo cơ chế thương mại nhà nước nêu tại khoản 1 Điều 1 Thông tư này cho đến khi thương nhân được cơ quan nhà nước có thẩm quyền miễn hình phạt hoặc xóa án tích theo quy định của pháp luật.'
      trang_pdf: 2
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 9
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực từ ngày 10 tháng 4 năm 2026.'
      trang_pdf: 3
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 9
      khoan: 2
      noi_dung: '2. Trong quá trình thực hiện, nếu phát sinh vướng mắc, tổ chức, cá nhân có trách nhiệm phản ánh về Bộ Công Thương để bổ sung, sửa đổi cho phù hợp.'
      trang_pdf: 3
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
    - dieu: 9
      khoan: 3
      noi_dung: '3. Cục trưởng Cục Xuất nhập khẩu, Thủ trưởng các đơn vị thuộc Bộ Công Thương và cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này./.'
      trang_pdf: 3
      sha256_pdf: ec635a191c2be791cb34ab87e7edc12d8d3fd5698789d1d9da324ec54dd282cb
