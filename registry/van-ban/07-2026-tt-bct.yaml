xac_minh:
  muc: NGUON_A
  pham_vi: >-
    PDF Công báo số 147 ngày 12-03-2026 (lớp chữ). TT 07/2026/TT-BCT gồm 9 Điều,
    toàn bộ nội dung từng Điều xác minh khớp với body 252 dòng trích từ PDF Công
    báo: (1) Điều 1 sửa đổi, bổ sung Điều 6 TT 37/2013 — Bộ Công Thương chỉ định
    thương nhân có Giấy phép sản xuất sản phẩm thuốc lá và do Nhà nước nắm giữ
    100% vốn điều lệ là thương nhân NK thuốc lá điếu, xì gà theo cơ chế thương mại
    nhà nước; thương nhân phải trực tiếp NK, không được ủy quyền/ủy thác. (2)
    Điều 2 sửa đổi khoản 3 Điều 7 (công bố hợp quy đối với thuốc lá điếu theo
    QCVN; công bố tiêu chuẩn áp dụng đối với xì gà) và bãi bỏ khoản 4 Điều 7.
    (3) Điều 3 sửa đổi, bổ sung khoản 1 Điều 8 — khi làm thủ tục NK phải xuất
    trình cho Hải quan 01 bản chính Đơn đăng ký NK tự động đã được Cơ quan cấp
    phép xác nhận hoặc nộp qua Hệ thống xử lý dữ liệu điện tử hải quan. (4)
    Điều 4 sửa đổi, bổ sung khoản 1, 2, 3 Điều 9 — hồ sơ NK nộp trực tiếp tại
    UBND tỉnh/thành phố nơi trụ sở chính hoặc qua bưu chính công ích/trực tuyến
    Cơ quan cấp phép (Đơn đăng ký 02 bản theo mẫu Phụ lục II; hợp đồng NK, hóa
    đơn thương mại, vận đơn, Giấy phép sản xuất sản phẩm thuốc lá — mỗi loại 01
    bản sao đóng dấu sao y); thay cụm từ "Cục Xuất nhập khẩu - Bộ Công Thương"
    tại khoản 2 và khoản 3 bằng "Cơ quan cấp phép". (5) Điều 5 sửa đổi khoản 1
    và khoản 2 Điều 10 — thay "Cục Xuất nhập khẩu - Bộ Công Thương" bằng "Cơ
    quan cấp phép". (6) Điều 6 bãi bỏ toàn bộ Điều 11 TT 37/2013. (7) Điều 7
    thay thế Phụ lục I (DM thuốc lá điếu, xì gà NK, mã HS 24.02) và Phụ lục II
    (mẫu Đơn đăng ký NK tự động). (8) Điều 8 trách nhiệm tổ chức thực hiện — Cơ
    quan cấp phép tổ chức/phối hợp kiểm tra; vi phạm ở mức xử lý hành chính thì
    không xác nhận Đơn đăng ký NK tự động cho đến khi khắc phục; vi phạm ở mức
    xem xét xử lý hình sự thì thương nhân không được làm đầu mối NK theo cơ chế
    thương mại nhà nước cho đến khi được miễn hình phạt hoặc xóa án tích. (9)
    Điều 9 điều khoản thi hành — khoản 1 hiệu lực 10-04-2026; Cục trưởng Cục
    Xuất nhập khẩu, Thủ trưởng đơn vị thuộc Bộ, cơ quan/tổ chức/cá nhân liên
    quan chịu trách nhiệm thi hành. Trang moit.gov.vn ghi trạng thái "Đã có hiệu
    lực". TT 48/2026/TT-BCT (Công báo số 521) không bãi TT 07/2026. Sổ không có
    văn bản sau thay/bãi (kiểm đến 04-10-2026)
