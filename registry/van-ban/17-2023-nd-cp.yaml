xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=207842) và Điều 115: số hiệu, tiêu đề, ngày ban hành và có hiệu lực từ 26-04-2023; đối chiếu còn hiệu lực, thay thế NĐ 22/2018/NĐ-CP, NĐ 119/2010/NĐ-CP và bãi bỏ phần bảo vệ quyền tác giả, quyền liên quan của NĐ 105/2006/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định chỉ tiết một số điều và biện pháp thi hành Luật Sở hữu trí tuệ năm 2005; Luật sửa đôi, bỗ sung một số điều của Luật Sở hữu tri tuệ năm 2009; Luật sửa đổi, bd sung một số điều của Luật Kinh doanh bảo hiểm, Luật Sở hữu trí tuệ năm 2019 và Luật sửa đổi, bổ sung một số điều của Luật Sở hữu trí tuệ năm 2022 (sau đây gọi chung là Luật Sở hữu trí tuệ) về quyền tác giả, quyền liên quan.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với: 1. Tác giả, chủ sở hữu quyền tác giả, người biểu diễn, chủ sở hữu quyền liên quan theo quy định của Luật Sở hữu trí tuệ. 2. Tô chức, cá nhân khác có hoạt động liên quan đên quyên tác giả, quyên liên quan. 3. Co quan có thâm quyên quản ly nhà nước vệ quyền tác giả, quyên liên quan.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Tác phẩm di cao là tác phẩm được công bồ lần đầu sau khi tác giả chết. 2. Tác phâm khuyết danh là tác phẩm không có hoặc chưa có tên tác giả (tên khai sinh hoặc bút danh) trên tác phâm khi công bô.'
      trang_pdf: 2
    - dieu: 23
      noi_dung: 'Điều 23. Sử dung tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng mà Nhà nước là đại diện quản lý quyền tác gia, quyền liên quan 1. Tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng mà Nhà nước là đại diện quản lý quyền tác gia, quyén lién quan quy định tại khoản 2 Điều 42 của Luật Sở hữu trí tuệ bao gồm:'
      trang_pdf: 18
    - dieu: 43
      noi_dung: Điều 43. Yêu cầu về tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng trong hồ sơ đăng ký quyền tác giả, đăng ký quyền liên quan 1. Tên tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng phải phù hợp với nội dung và loại hình tác phâm, nội dung cuộc biêu điện, bản ghi âm, ghi hình, chương trình phát sóng.
      trang_pdf: 42
    - dieu: 64
      noi_dung: 'Điều 64. Căn cứ xác định hành vi xâm phạm quyền tác giả, quyền liên quan Căn cứ xác định hành vi xâm phạm quyền tác giả, quyền liên quan quy định tại các điều 28 và 35 của Luật Sở hữu trí tuệ bao gồm:'
      trang_pdf: 60
    - dieu: 86
      noi_dung: Điều 86. Quyền yêu cầu kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến quyền (ác giá, quyền liên quan Chủ thê quyền tác giả, quyền liên quan có quyền trực tiếp hoặc thông qua đại diện theo pháp luật hoặc đại diện theo ủy quyên nộp đơn đề nghị kiêm tra, giám sát để phát hiện hàng hóa xuất khẩu, nhập khẩu có dấu hiệu xâm phạm quyền tác giả, quyền liên quan hoặc đơn đề nghị tạm dừng làm thủ tục hải quan đối với hàng hóa xuất khâu, nhập khẩu bị nghỉ ngờ xâm phạm quyền tác giả, quyền liên quan.
      trang_pdf: 78
    - dieu: 88
      noi_dung: Điều 88. Thủ tục xử lý đơn 1. Trong thời hạn 20 ngày, kế từ ngày nhận được đơn đề nghị kiểm tra, giám sát hàng hóa xuất khâu, nhập khâu và đủ các tài liệu quy định tại khoản 2 Điều 74 của Luật Hải quan hoặc trong thời hạn 02 giờ làm việc, ké từ thời điểm nhận được đơn đề nghị tạm dừng làm thủ tục hải quan và đủ các tài liệu quy định tại khoản 3 Điều 74 của Luật Hải quan, cơ quan hải quan có trách nhiệm xem xét, ra thông báo chấp nhận đơn, nếu người nộp đơn đã thực hiện nghĩa vụ quy định tại các điểm a, b, c khoản 1 và khoản 2 Điều 217 của Luật Sở hữu trí tuệ.
      trang_pdf: 78
    - dieu: 89
      noi_dung: Điều 89. Thẫm quyền, trình tự, thủ tục chủ động tạm dừng làm thủ tục hải quan 1. Trong quá trình thực hiện kiểm tra, giám sat và kiểm soát, nếu phát hiện căn cứ rõ rang để nghi ngờ hàng hóa xuất khẩu, nhập khẩu là hàng hóa sao chép lậu, Chi cục Hải quan chủ động tạm dừng làm thủ tục hải quan đối với hàng hóa đó.
      trang_pdf: 79
    - dieu: 115
      noi_dung: Điều 115. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày 26 tháng 4 năm 2023.
      trang_pdf: 100
ghi_chu: KHÔNG thay thế NĐ 131/2013 (xử phạt QTC vẫn theo NĐ 131/2013 sđ 28/2017). TVPL ghi nhận bị sửa bởi NĐ 116/2026/NĐ-CP (02-04-2026, TTHC — đã có công báo) và NĐ 134/2026/NĐ-CP (06-04-2026, nguồn tỉnh, chưa thấy trên cổng A) — chưa ghi quan hệ, chờ săn bậc A.
