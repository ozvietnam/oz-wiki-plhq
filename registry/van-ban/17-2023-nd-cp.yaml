xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=207842) và Điều 115: số hiệu, tiêu đề, ngày ban hành và có hiệu lực từ 26-04-2023; đối chiếu còn hiệu lực, thay thế NĐ 22/2018/NĐ-CP, NĐ 119/2010/NĐ-CP và bãi bỏ phần bảo vệ quyền tác giả, quyền liên quan của NĐ 105/2006/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định chỉ tiết một số điều và biện pháp thi hành Luật Sở hữu trí tuệ năm 2005; Luật sửa đôi, bỗ sung một số điều của Luật Sở hữu tri tuệ năm 2009; Luật sửa đổi, bd sung một số điều của Luật Kinh doanh bảo hiểm, Luật Sở hữu trí tuệ năm 2019 và Luật sửa đổi, bổ sung một số điều của Luật Sở hữu trí tuệ năm 2022 (sau đây gọi chung là Luật Sở hữu trí tuệ) về quyền tác giả, quyền liên quan.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với: 1. Tác giả, chủ sở hữu quyền tác giả, người biểu diễn, chủ sở hữu quyền liên quan theo quy định của Luật Sở hữu trí tuệ. 2. Tô chức, cá nhân khác có hoạt động liên quan đên quyên tác giả, quyên liên quan. 3. Co quan có thâm quyên quản ly nhà nước vệ quyền tác giả, quyên liên quan.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Tác phẩm di cao là tác phẩm được công bồ lần đầu sau khi tác giả chết. 2. Tác phâm khuyết danh là tác phẩm không có hoặc chưa có tên tác giả (tên khai sinh hoặc bút danh) trên tác phâm khi công bô.'
      trang_pdf: 2
    - dieu: 5
      noi_dung: 'Điều 5. Trách nhiệm và nội dung quản lý nhà nước về quyền tác gia, quyền liên quan 1. Chính phủ thống nhất quản lý nhà nước về quyền tác giả, quyền liên quan. 2. Bộ Văn hóa, Thể thao và Du lịch chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước về quyên tác giả, quyên liên quan, có nhiệm vụ và quyên hạn sau:'
      trang_pdf: 4
    - dieu: 23
      noi_dung: 'Điều 23. Sử dung tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng mà Nhà nước là đại diện quản lý quyền tác gia, quyền liên quan 1. Tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng mà Nhà nước là đại diện quản lý quyền tác gia, quyén lién quan quy định tại khoản 2 Điều 42 của Luật Sở hữu trí tuệ bao gồm:'
      trang_pdf: 18
    - dieu: 38
      noi_dung: 'Điều 38. Nộp hồ so đăng ký quyền tác giả, đăng ký quyền liên quan 1. Tác giả, chủ sở hữu quyền tác giả, chủ sở hữu quyền liên quan là cá nhân, tổ chức Việt Nam, cá nhân nước ngoài thường trú tại Việt Nam, tổ chức nước ngoài có trụ sở, văn phòng đại diện hoặc chi nhánh tại Việt Nam nộp hề sơ đăng ký quyên tác giả, đăng ký quyền liên quan trực tiếp hoặc thông qua đại diện hợp pháp tại Việt Nam.'
      trang_pdf: 35
    - dieu: 43
      noi_dung: Điều 43. Yêu cầu về tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng trong hồ sơ đăng ký quyền tác giả, đăng ký quyền liên quan 1. Tên tác phẩm, cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng phải phù hợp với nội dung và loại hình tác phâm, nội dung cuộc biêu điện, bản ghi âm, ghi hình, chương trình phát sóng.
      trang_pdf: 42
    - dieu: 64
      noi_dung: 'Điều 64. Căn cứ xác định hành vi xâm phạm quyền tác giả, quyền liên quan Căn cứ xác định hành vi xâm phạm quyền tác giả, quyền liên quan quy định tại các điều 28 và 35 của Luật Sở hữu trí tuệ bao gồm:'
      trang_pdf: 60
    - dieu: 66
      noi_dung: 'h) Xâm phạm quyền phân phối, nhập khâu dé phân phối đến công chúng: Phân phối, nhập khẩu để phân phối đến công chúng bản gốc, bản sao hữu hình tác phẩm mà không được sự đồng ý của chủ sở hữu quyên tác giả, đồng chủ sở hữu quyền tác giả theo quy định của pháp luật, trừ trường hợp quy định tại điểm b khoản 3 Điều 20 và Điều 25a của Luật Sở hữu trí tuệ;'
      trang_pdf: 62
    - dieu: 75
      noi_dung: 'Điều 75. Don yêu cầu xử ly hành vi xâm phạm quyền tác giả, quyền liên quan 1. Đơn yêu cầu xử lý hành vi xâm phạm quyền tác giả, quyển liên quan phải có các nội dung chủ yếu sau đây: a) Ngày, tháng, năm làm đơn yêu cầu; b) Tên, địa chỉ của tổ chức, cá nhân yêu cầu xử lý hành vi xâm phạm; họ tên người đại diện, nếu yêu cầu được thực hiện thông qua người đại diện; c) Tên cơ quan nhận đơn yêu cầu; đ) Tên, địa chỉ của tổ chức, cá nhân thực hiện hành vi xâm phạm; tên, địa chỉ của tổ chức, cá nhân bị nghi ngờ là tổ chức, cá nhân thực hiện hành vi xâm phạm trong trường hợp yêu câu tạm dừng làm thủ tục hải quan đối với hàng hóa xuất khẩu, nhập khẩu bị nghỉ ngờ xâm phạm;'
      trang_pdf: 72
    - dieu: 76
      noi_dung: 'Điều 76. Tài liệu, chứng cứ kèm theo đơn yêu cầu xử lý hành vi xâm phạm quyền tác gia, quyền liên quan 1. Người yêu cầu xử lý hành vi xâm phạm phải gửi kèm theo đơn yêu cầu xử lý hành vi xâm phạm quyền tác giả, quyên liên quan các tài liệu, chứng cứ sau đây để chứng minh yêu cầu của mình:'
      trang_pdf: 72
    - dieu: 81
      noi_dung: 'Điều 81. Xác định giá trị hàng hóa xâm phạm quyền tác giả, quyền liên quan 1. Hàng hóa xâm phạm quyền tác giả, quyền liên quan được quy định như sau: a) Hàng hóa xâm phạm là bộ phận, chi tiết (sau đây gọi là phần) của sản phâm có chứa yêu tô xâm phạm và có thê lưu hành như một sản phâm độc lập; b) Trường hợp không thể tách rời yếu tố xâm phạm thành một phần của sản phâm có thê lưu hành độc lập theo quy định tại điểm a khoản này thì hàng hóa xâm phạm là toàn bộ sản phâm chứa yêu tô xâm phạm.'
      trang_pdf: 75
    - dieu: 82
      noi_dung: 'Điều 82. Xứ lý hàng hóa xâm phạm quyền tác giả, quyền liên quan 1. Đối với hàng hóa sao chép lậu, nguyên liệu, vật liệu, phương tiện được sử dụng chủ yếu dé sản xuất, kinh doanh hàng hóa đó thì co quan có thâm quyền xử lý xâm phạm áp dụng một trong các biện pháp sau đây: a) Phân phối hoặc đưa vào sử dụng không nhằm mục đích thương mại theo quy định tại Điều 83 của Nghị định này; b) Tiêu hủy theo quy định tại Điều 84 của Nghị định này; c) Tùy từng trường hợp cụ thể, cơ quan xử lý hành vi xâm phạm áp dụng biện pháp buộc loại bỏ yêu tố xâm phạm và biện pháp thích hợp quy định tại khoản 4 Điều này.'
      trang_pdf: 76
    - dieu: 86
      noi_dung: Điều 86. Quyền yêu cầu kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến quyền (ác giá, quyền liên quan Chủ thê quyền tác giả, quyền liên quan có quyền trực tiếp hoặc thông qua đại diện theo pháp luật hoặc đại diện theo ủy quyên nộp đơn đề nghị kiêm tra, giám sát để phát hiện hàng hóa xuất khẩu, nhập khẩu có dấu hiệu xâm phạm quyền tác giả, quyền liên quan hoặc đơn đề nghị tạm dừng làm thủ tục hải quan đối với hàng hóa xuất khâu, nhập khẩu bị nghỉ ngờ xâm phạm quyền tác giả, quyền liên quan.
      trang_pdf: 78
    - dieu: 87
      noi_dung: 'Điều 87. Cơ quan hai quan có thâm quyền tiếp nhận đơn Cơ quan hải quan có thâm quyền tiếp nhận đơn dé nghị kiểm tra, giám sát hoặc tạm dừng làm thủ tục hải quan theo quy định tại khoản 1 Điêu 75 của Luật Hải quan.'
      trang_pdf: 78
    - dieu: 88
      noi_dung: Điều 88. Thủ tục xử lý đơn 1. Trong thời hạn 20 ngày, kế từ ngày nhận được đơn đề nghị kiểm tra, giám sát hàng hóa xuất khâu, nhập khâu và đủ các tài liệu quy định tại khoản 2 Điều 74 của Luật Hải quan hoặc trong thời hạn 02 giờ làm việc, ké từ thời điểm nhận được đơn đề nghị tạm dừng làm thủ tục hải quan và đủ các tài liệu quy định tại khoản 3 Điều 74 của Luật Hải quan, cơ quan hải quan có trách nhiệm xem xét, ra thông báo chấp nhận đơn, nếu người nộp đơn đã thực hiện nghĩa vụ quy định tại các điểm a, b, c khoản 1 và khoản 2 Điều 217 của Luật Sở hữu trí tuệ.
      trang_pdf: 78
    - dieu: 89
      noi_dung: Điều 89. Thẫm quyền, trình tự, thủ tục chủ động tạm dừng làm thủ tục hải quan 1. Trong quá trình thực hiện kiểm tra, giám sat và kiểm soát, nếu phát hiện căn cứ rõ rang để nghi ngờ hàng hóa xuất khẩu, nhập khẩu là hàng hóa sao chép lậu, Chi cục Hải quan chủ động tạm dừng làm thủ tục hải quan đối với hàng hóa đó.
      trang_pdf: 79
    - dieu: 90
      noi_dung: 'Điều 90. Xứ lý hàng hóa có dấu hiệu xâm phạm quyền tác giả, quyền liền quan 1. Trong trường hợp phát hiện hàng hóa có dấu hiệu xâm phạm hoặc theo đề nghị của chủ thê quyền tác giả, quyền liên quan hoặc để thực hiện thâm quyền xử phạt hành chính, cơ quan hải quan ra quyết ‹ định tạm dừng làm thủ tục hải quan, thông báo cho chủ thê quyền tác gia, quyén lién quan va chu lô hàng về việc tạm dừng làm thủ tục hải quan đối với lô hang; trong đó nêu rõ tên, địa chỉ, số fax, điện thoại liên lạc của các bên; lý do và thời hạn tạm dừng làm thủ tục hải quan.'
      trang_pdf: 80
    - dieu: 91
      noi_dung: 'Điều 91. Thủ tục kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến quyền tác gia, quyền liên quan Thủ tục kiêm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến quyền tác giả, quyên liên quan thực hiện theo quy định tại Nghị định này và các quy định có liên quan của pháp luật về hải quan.'
      trang_pdf: 80
    - dieu: 92
      noi_dung: '2. Giám định về quyên tác giả và quyên liên quan bao gôm các nội dung sau đây: a) Xác định căn cứ phát sinh quyền tác giả, quyền liên quan theo quy định tại Điều 65 của Nghị định nay; b) Xác định đối tượng được xem xét có đáp ứng các điều kiện để bị coi là yếu tố xâm phạm quyên tác giả, quyền liên quan hay không theo quy định tại khoản 2 Điều 64, các điều 66 và 67 của Nghị định này;'
      trang_pdf: 81
    - dieu: 115
      khoan: 1
      noi_dung: Điều 115. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày 26 tháng 4 năm 2023.
      trang_pdf: 100
    - dieu: 115
      khoan: 2
      noi_dung: '2. Nghị định số 22/2018/NĐ-CP ngày 23 tháng 02 năm 2018 của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật Sở hữu trí tuệ năm 2005 và Luật sửa đôi, bé sung một số điều của Luật So hữu trí tuệ năm 2009 về quyền tác giả, quyền liên quan và phần Bảo vệ quyền trong lĩnh vực quyền tác giả, quyền liên quan tại Nghị định sô 105/2006/NĐ-CP ngày 22 tháng, 9 năm 2006 của Chính phủ quy định chỉ tiết và hướng dẫn thi hành một số điều của Luật Sở hữu trí tuệ về bảo vệ quyền sở hữu trí tuệ và quản lý nhà nước:về sở hữu trí tuệ, Nghị định số 119/2010/NĐ-CP ngày 30 tháng 12 năm 2010 của Chính phủ sửa đổi, bd sung một số điều của Nghị định sô 105/2006/NĐ-CP ngày 22 thang 9 năm 2006 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số điều của Luật Sở hữu trí tuệ về bảo vệ quyền sở hữu trí tuệ và quản lý nhà nước về sở hữu trí tuệ hết hiệu lực thi hành ké từ ngày Nghị định này có hiệu lực thi hành.'
      trang_pdf: 100
    - dieu: 116
      noi_dung: 'Điều 116. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Uy ban nhân dân cấp tinh, cơ quan, tô chức, cá nhân có quyền và nghĩa vụ liên quan chịu trách nhiệm thi hành Nghị định này.'
      trang_pdf: 101
ghi_chu: KHÔNG thay thế NĐ 131/2013 (xử phạt QTC vẫn theo NĐ 131/2013 sđ 28/2017). TVPL ghi nhận bị sửa bởi NĐ 116/2026/NĐ-CP (02-04-2026, TTHC — đã có công báo) và NĐ 134/2026/NĐ-CP (06-04-2026, nguồn tỉnh, chưa thấy trên cổng A) — chưa ghi quan hệ, chờ săn bậc A.
