  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=179820), PDF ký số (49-btc.signed.pdf) và Thông tư 142/2026/TT-BTC: ban hành 14-04-2015, có hiệu lực từ 29-05-2015; đang còn hiệu lực (được sửa đổi, bổ sung bởi TT 56/2019/TT-BTC, TT 29/2025/TT-BTC và TT 142/2026/TT-BTC).'
