  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh . Théng tư này quy định thủ tục hai quan đối với thư, gói, kiện hàng hóa _xuât khẩu, nhập khâu gửi qua mạng bưu chính được cung ứng bởi doanh nghiệp được chỉ định (sau đây gọi chung là bưư gửi).
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng . 1. Doanh nghiệp được chỉ định theo quy định của Luật Bưu chính (sau đây gọi tắt là doanh nghiệp); 2. Cơ quan, tổ chức, cá nhân có bưu gửi xuất khẩu, nhập khẩu gửi qua dịch vụ bưu chính; 3. Cơ quan Hải quan; công chức hải quan.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Địa điểm làm thủ tục hải quan. Bưu gửi được làm thủ tục hải quan tại trụ sở Chi cục Hải quan Bưu điện, trụ sở Chỉ 'cục Hải quan chuyên phát nhanh, trụ sở Chỉ cục Hải quan cửa khẩu sân bay quôc tế (sau đây gọi tắt là Chi cục Hải quan).
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Thủ tục hải quan giấy đối với bưu gửi xuất khẩu, nhập khâu 1. Thủ tục đối với bưu gửi xuất khâu, nhập khẩu không có thuế, hoặc được miễn thuê (dưới đây gọi là bưu gửi xuât khâu, nhập khâu không thuê) a) Trách nhiệm của người khai hải quan:'
      trang_pdf: 6
    - dieu: 8
      noi_dung: Điều 8. Khai hải quan đối với hàng bưu chính thu gom ngoài lãnh thô đưa vào Việt Nam thực hiện phân loại, chia chọn chuyển tiếp đi quốc tế
      trang_pdf: 9
    - dieu: 10
      noi_dung: Điều 10. Quy định đối với bưu gửi xuất khẩu, nhập khẩu chuyển cửa khẩu 1. Bưu gửi xuất khẩu chuyên cửa khẩu là bưu gửi xuất khẩu đã hoàn thành thủ tục hải quan được vận chuyển từ Chỉ cục Hải quan (Chỉ cục Hải quan chuyên phát nhanh, Chỉ cục Hải quan Bưu điện hoặc Chi cục Hải quan cửa khẩu sân bay quốc tế) nơi làm thủ tục xuất khẩu đến Chi cục Hải quan cửa khẩu xuất dé xuất khâu bưu gửi. -
      trang_pdf: 11
    - dieu: 11
      noi_dung: 'Điều 11. „hủ tục hải quan đối với bưu gửi xuất khẩu, nhập khẩu . chuyển cửa khẩu 1. Địa điểm làm thủ tục hải quan: Chỉ cục Hải quan nơi quản lý bưu gửi bắt đầu được vận chuyển đi (đối với bưu gửi xuất khẩu), Chi cục Hải quan nơi cuối cùng bưu gửi được vận chuyển đến (đối với bưu gửi nhập khẩu). 2. Hồ sơ hải quan: a) Tờ khai vận chuyển độc lập theo các chỉ tiêu thông tin quy định tại'
      trang_pdf: 12
    - dieu: 13
      noi_dung: 'Điều 13. Hồ sơ thành lập địa điểm kiểm tra, giảm sát hải quan do doanh nghiệp kinh doanh làm chủ đầu tư Hồ sơ thành lập địa điểm gồm 02 bộ, mỗi bộ có giấy tờ sau đây: 1. Văn bản đề nghị thành lập địa điểm của doanh nghiệp trong đó xác định rõ những nội dung gồm: sự cần thiết phải thành lập, vị trí địa điểm dự kiến thành lập, diện tích, các điều kiện về co sở vật chất, kỹ thuật, hạ tầng: 01 bản chính.'
      trang_pdf: 13
    - dieu: 15
      noi_dung: Điều 15. Chấm đứt, tạm dừng hoạt động của địa điểm 1. Chấm dứt hoạt động của địa điểm a) Các trường hợp chấm dứt hoạt động a.1) Doanh nghiệp có văn bản đề nghị cham đứt hoạt động; a.2) Quá thời hạn 06 tháng ké từ khi có quyết định thành lập nhưng . doanh nghiệp không đưa vào hoạt động mà không có ly do chính đáng; a.3) Trường hợp địa điểm không đáp ứng các điều kiện về kiểm tra, giám sát hải quan theo quy định tại Điều 12 Thông tư này;
      trang_pdf: 14
    - dieu: 19
      noi_dung: '-_1, Tổng cục trưởng Tổng cục Hải quan chỉ đạo Cục trưởng Cục Hải quan các tỉnh, thành phố liên quan chịu trách nhiệm tổ chức quan lý, theo đõi và thực hiện nội dung quy định tại Thông tư này. 2. Đối với tờ khai hải quan đã đăng ký trước ngày Thông tư này có hiệu lực thì thực hiện theo quy định tại Thông tư số 99/2010/TT-BTC ngày 09” tháng 07 năm 2010 của Bộ trưởng Bộ Tài chính quy định thủ tục hải quan đối'
      trang_pdf: 18
ghi_chu: Thông tư quy định thủ tục hải quan đối với hàng hóa xuất nhập khẩu gửi qua dịch vụ bưu chính của doanh nghiệp được chỉ định; được sửa đổi, bổ sung tại Điều 1 và Điều 3 TT 142/2026/TT-BTC.
