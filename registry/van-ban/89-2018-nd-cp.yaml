# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 89/2018/NĐ-CP
loai: NGHI_DINH
ten: Quy định chi tiết thi hành một số điều của Luật Phòng, chống bệnh truyền nhiễm về kiểm dịch y tế biên giới
co_quan: CP
ngay_ban_hanh: '2018-06-25'
hieu_luc_tu: '2018-08-10'
tinh_trang: CON_HIEU_LUC
nhanh:
  - kiem-tra-chuyen-nganh/kiem-dich
xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=194022, người ký Thủ tướng Nguyễn Xuân Phúc, tệp đính kèm 89.signed.pdf): Nghị định 89/2018/NĐ-CP của Chính phủ quy định chi tiết thi hành một số điều của Luật Phòng, chống bệnh truyền nhiễm về kiểm dịch y tế biên giới, ban hành ngày 25-06-2018, có hiệu lực thi hành từ ngày 10-08-2018; đối chiếu đang còn hiệu lực (chưa có văn bản thay thế hoặc bãi bỏ toàn bộ trong sổ; riêng kiểm dịch y tế đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh theo Luật Phòng bệnh 114/2025/QH15 được quy định chi tiết tại Nghị định 165/2026/NĐ-CP từ 01-07-2026)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về thu thập thông tin, khai báo y tế, kiểm tra y tế, xử lý y tế đối với người, phương tiện vận tải nhập cảnh, xuất cảnh, quá cảnh, hàng hóa nhập khẩu, xuất khẩu, quá cảnh Việt Nam và thi thể, hài cốt (bao gồm cả tro cốt), mẫu vi sinh y học, sản phẩm sinh học, mô, bộ phận cơ thể người vận chuyển qua biên giới Việt Nam; giám sát, kiểm soát bệnh truyền nhiễm tại cửa khẩu;
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Hàng hóa thuộc diện kiểm dich y tế là các sản phẩm hữu hình có khả năng mang tác nhân gây bệnh, mang trung gian truyền bệnh truyền nhiễm được nhập khẩu, xuất khẩu, quá cảnh qua cửa khẩu kể cả bưu phẩm, bưu kiện, hàng tiêu dùng trên phương tiện vận tải.'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Đối tượng phải khai báo y tế Người nhập cảnh, xuất cảnh, quá cảnh Việt Nam phải khai báo y tế theo quy định tại khoản 1, 2 Điều 4 Nghị định này.
      trang_pdf: 2
    - dieu: 10
      noi_dung: 'Điều 10. Kiểm tra thực tế đối với người 1. Đối tượng kiểm tra: Người bị nghi ngờ mắc bệnh hoặc mang tác nhân gây bệnh truyền nhiễm theo quy định tại khoản 2, 3 Điều 8 và điểm a khoản 3 Điều 9 Nghị định này.'
      trang_pdf: 5
    - dieu: 16
      noi_dung: 'Điều 16. Kiểm tra giấy tờ đối với phương tiện vận tải 1. Đối tượng kiểm tra: a) Phương tiện vận tải có yếu tố nguy cơ theo quy định tại khoản | Điều 15 Nghị định này; b) Phương tiện vận tải có trung gian truyền bệnh truyền nhiễm, tác nhân gây bệnh truyền nhiễm hoặc không bảo đảm điều kiện vệ sinh chung theo quy định tại khoản 3 Điều 15 Nghị định này. 2. Loại giấy tờ kiểm tra:'
      trang_pdf: 10
    - dieu: 22
      noi_dung: 'Điều 22. Thu thập thông tin trước khi hàng hóa vận chuyển qua biên giới 1. Kiểm dịch viên y tế thu thập thông tin từ các nguồn được quy định tại khoản 1 Điều 7 Nghị định này. 2. Các thông tin cần thu thập: a) Thông tin về nơi hàng hóa xuất phát hoặc quá cảnh; b) Thông tin về chủng loại, số lượng, bảo quản, đóng gói hàng hóa và phương tiện vận chuyên.'
      trang_pdf: 14
    - dieu: 29
      noi_dung: Điều 29. Thu thập thông tin Kiểm dịch viên y tế thu thập thông tin từ giấy khai báo y tế, thi thể, hài cốt theo Mẫu sé 11 Phụ lục kèm theo Nghị định này, bản chụp giấy xác nhận đã qua xử lý y tế của nơi xuất phát (không áp dụng đối với tro cốt), giấy phép nhập cảnh thi thé, hài cốt về Việt Nam theo quy định của Bộ Ngoại giao và giấy tờ chứng minh tử vong (không áp dụng đôi với tro cốt). aw
      trang_pdf: 18
    - dieu: 35
      noi_dung: Điều 35. Khai báo y tế đối với mẫu vi sinh y học, sản phẩm sinh học, mô, bộ phận cơ thể người 1. Người khai báo y tế thực hiện khai, nộp giấy khai báo y tế đối với mẫu vi sinh y học, sản phẩm sinh học, mô, bộ phận cơ thể người theo Mẫu số 13 Phụ lục kèm theo Nghị định này cho tổ chức kiểm dịch y tế biên giới hoặc qua Cổng thông tin một cửa quốc gia trước khi hoàn thành thủ tục vận chuyển qua biên giới.
      trang_pdf: 21
    - dieu: 41
      noi_dung: 'Điều 41. Tổ chức kiểm dich y tế biên giới 1. Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương có cửa khẩu quy định về chức năng, nhiệm vụ, quyền hạn của tổ chức kiểm dịch y tế biên giới trên cơ sở hướng dẫn của Bộ Y tế. 2. Điều kiện về cơ sở vật chất, trang thiết bị, phương tiện, hóa chất, thuốc phục vụ hoạt động kiểm dịch y tế tại cửa khẩu gồm:'
      trang_pdf: 23
    - dieu: 48
      noi_dung: Điều 48. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 10 tháng 8 năm 2018. 2. Nghị định số 103/2010/NĐ-CP ngày 01 tháng 10 năm 2010 của Chính phủ quy định chỉ tiết thi hành một số điều của Luật phòng, chống bệnh truyền nhiễm về kiểm dịch y tê biên giới hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành.
      trang_pdf: 28
ghi_chu: Luật gốc đã đổi thành Luật Phòng bệnh 114/2025/QH15 (hl 01/7/2026); chưa xác minh có nghị định mới thay thế. Bài tổng hợp KTCN 2026 (nguồn thứ cấp, có trích nguyên văn điều luật) — xem hs-code-api data/ktcn-regime-2026.json.
