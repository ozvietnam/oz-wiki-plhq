  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/22/VB_16496 (1).pdf, id=103971, SHA-256 0cbc38bb9f24fe0c48e0bacd94a2de2f46382247c31eb25a41c8d713250382a4): Thông báo số 16496/TB-CHQ đóng dấu ngày 20-05-2026 (ký số 21-05-2026 10:31:09 +07:00) của Cục Hải quan về thông tin tài khoản thu NSNN; căn cứ QĐ 832/QĐ-CHQ (30-06-2025) sửa đổi, bổ sung tại QĐ 681/QĐ-CHQ, 682/QĐ-CHQ, 683/QĐ-CHQ (04-05-2026) về tổ chức, triển khai hoạt động của Đội Thông quan thuộc Chi cục HQKV III; thông báo mã đơn vị 03YY, mã cơ quan thu 2995544, mã KBNN 0061, mã NH 31701001, Kho bạc Nhà nước khu vực III - Phòng Kế toán Nhà nước, các TK 7111/3511/3591; người ký Bùi Tuấn Hải; có hiệu lực kể từ ngày ban hành'
