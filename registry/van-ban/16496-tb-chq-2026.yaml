ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Thông báo thông tin mã cơ quan hải quan, tài khoản chuyên thu, tạm thu, KBNN của Đội Thông quan thuộc Chi cục Hải quan khu vực III (mã đơn vị 03YY, mã cơ quan thu 2995544, mã KBNN 0061, mã NH 31701001, Kho bạc Nhà nước khu vực III - Phòng Kế toán Nhà nước; TK 7111 thu nộp NSNN, 3511 thu phí hải quan, 3591 tạm thu khác). Văn bản đóng dấu ngày 20-05-2026, chữ ký số và trang cổng ghi ngày 21-05-2026. Các QĐ 832/QĐ-CHQ/2025, 681/QĐ-CHQ/2026, 682/QĐ-CHQ/2026, 683/QĐ-CHQ/2026 chưa có trong sổ nên chưa gắn quan_he.can_cu (tránh điểm mù Cao).'
