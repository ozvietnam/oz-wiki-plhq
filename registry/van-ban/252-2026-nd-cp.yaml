    truy_cap: '2026-11-15'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã tải và đối chiếu toàn văn Nghị định 252/2026/NĐ-CP ngày 30/06/2026 (76 điều, Phó Thủ tướng Nguyễn Văn Thắng ký) từ Cổng Thông tin điện tử Hải quan (customs.gov.vn id=105036, files.customs.gov.vn, dòng 427 all-1990-2026.csv): hướng dẫn Luật Quản lý thuế số 108/2025/QH15; Điều 74 khoản 1 quy định có hiệu lực từ 01/07/2026; khoản 3 thay thế NĐ 126/2020/NĐ-CP, NĐ 91/2022/NĐ-CP, NĐ 49/2025/NĐ-CP, NĐ 117/2025/NĐ-CP và NĐ 373/2025/NĐ-CP; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: paperclip-agent@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Nghị định này quy định chi tiết một số điều, khoản, điểm, nội dung được giao tại Luật Quản lý thuế và biện pháp thi hành một số điều của Luật Quản lý thuế gồm: 1. Quy định chi tiết một số điều, khoản, điểm của Luật Quản lý thuế gồm: a) Khoản 1 Điều 2 về người nộp thuế; khoản 2 Điều 2 về cơ quan quản lý thuế;'
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng 1. Người nộp thuế bao gồm: a) Người nộp thuế thực hiện theo quy định tại khoản 1 Điều 2 Luật Quản lý thuế;'
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ 1. Người nộp thuế bị thiệt hại về vật chất do nguyên nhân bất khả kháng khác quy định tại khoản 21 Điều 4 Luật Quản lý thuế gồm: chiến tranh, bạo loạn, đình công phải ngừng, nghỉ sản xuất, kinh doanh hoặc rủi ro không thuộc nguyên nhân, trách nhiệm chủ quan của người nộp thuế.'
    - dieu: 14
      noi_dung: 'Điều 14. Đồng tiền khai thuế, khoản thu khác, nộp thuế, khoản thu khác; tỷ giá khai thuế, khoản thu khác quy đổi; tỷ giá tính thuế 1. Đồng tiền khai thuế, khoản thu khác là Đồng Việt Nam, trừ các trường hợp sau: a) Người nộp thuế thuộc trường hợp khai thuế thu nhập doanh nghiệp bổ sung bằng ngoại tệ theo quy định tại Nghị định số 236/2025/NĐ-CP của Chính phủ; b) Người nộp thuế khai thuế, khoản thu khác đối với hoạt động dầu khí và bán dầu khí: b.'
    - dieu: 24
      noi_dung: 'Điều 24. Tạm nộp thuế, khoản thu khác theo quý 1. Người nộp thuế thực hiện tạm nộp theo quý đối với khoản thuế, khoản thu khác sau: a) Thuế thu nhập doanh nghiệp; b) Lợi nhuận sau thuế còn lại nộp vào ngân sách nhà nước theo quy định của pháp luật về quản lý và đầu tư vốn nhà nước tại doanh nghiệp. 2. Thời hạn tạm nộp quý chậm nhất là ngày cuối cùng của tháng đầu của quý tiếp theo quý phát sinh nghĩa vụ thuế, khoản thu khác.'
    - dieu: 34
      noi_dung: Điều 34. Khoanh tiền thuế nợ 1. Các trường hợp khoanh tiền thuế nợ thực hiện theo quy định tại khoản 1 Điều 20 Luật Quản lý thuế. Cơ quan quản lý thuế không thực hiện khoanh tiền thuế nợ theo quy định tại điểm b, d và đ khoản 1 Điều 20 Luật Quản lý thuế đối với chi nhánh, văn phòng đại diện, địa điểm kinh doanh mà doanh nghiệp, tổ chức đang hoạt động.
    - dieu: 44
      noi_dung: 'Điều 44. Thời điểm khấu trừ và căn cứ xác định số thuế phải khấu trừ 1. Thời điểm thực hiện khấu trừ: a) Đối với tổ chức kinh doanh tại Việt Nam quy định tại khoản 3 Điều 43 Nghị định này là thời điểm thanh toán cho nhà cung cấp nước ngoài, cá nhân không cư trú; b) Đối với chủ quản nền tảng thương mại điện tử là thời điểm xác nhận giao dịch thành công và chấp nhận thanh toán theo quy định của nền tảng.'
    - dieu: 54
      noi_dung: Điều 54. Bảo đảm an toàn thông tin và quản lý rủi ro công nghệ 1. Các bộ, cơ quan ngang bộ, Ủy ban nhân dân các cấp và các cơ quan có liên quan có trách nhiệm thực hiện quản lý rủi ro công nghệ thông tin theo nguyên tắc chủ động, toàn diện và thường xuyên; đảm bảo nhận diện, đánh giá, kiểm soát và xử lý kịp thời các rủi ro phát sinh trong quá trình xây dựng, vận hành và sử dụng hệ thống công nghệ thông tin.
    - dieu: 64
      noi_dung: 'Điều 64. Tiêu chuẩn kinh doanh dịch vụ làm thủ tục về thuế 1. Tiêu chuẩn kinh doanh dịch vụ làm thủ tục về thuế đối với tổ chức, cá nhân cung cấp dịch vụ: a) Đối với đại lý thuế: a.1) Là doanh nghiệp được thành lập và hoạt động theo quy định của pháp luật; a.2) Có ít nhất 02 người đáp ứng tiêu chuẩn quy định tại khoản 2 Điều này làm việc toàn thời gian tại doanh nghiệp;'
    - dieu: 75
      noi_dung: Điều 75. Điều khoản chuyển tiếp Đối với các trường hợp đã được xóa tiền thuế nợ theo quyết định của Chủ tịch Ủy ban nhân dân cấp tỉnh trước ngày Nghị định này có hiệu lực thi hành nhưng người nộp thuế phải hoàn trả tiền thuế nợ đã được xóa theo quy định tại khoản 2 Điều 21 Luật Quản lý thuế và hướng dẫn của Bộ trưởng Bộ Tài chính thì Trưởng Thuế tỉnh, thành phố, Chi cục trưởng Chi cục thuế Doanh nghiệp lớn, Chi cục trưởng Chi cục thuế Thương mại
ghi_chu: Nghị định quy định chi tiết Luật Quản lý thuế số 108/2025/QH15, có hiệu lực từ 01/07/2026 (thay thế các NĐ 126/2020/NĐ-CP, 91/2022/NĐ-CP, 49/2025/NĐ-CP, 117/2025/NĐ-CP, 373/2025/NĐ-CP theo khoản 3 Điều 74).
