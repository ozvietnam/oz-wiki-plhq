ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 2 mã HS). Tiêu đề đã đối chiếu (luatvietnam.vn + moit.gov.vn). GHI CHÚ NGHIỆP VỤ (hs-code-api): Mã vụ việc AD22 (HS 7005.29.20; 7005.29.90). QĐ khởi xướng điều tra; thuế tạm thời QĐ 228/QĐ-BCT (hiệu lực 14/02/2026); thuế CBPG chính thức QĐ 1400/QĐ-BCT ngày 12/06/2026, hiệu lực 14/06/2026, 5 năm (Indonesia 32,78%–43,78%, Malaysia 41,07%–63,39%). Số hiệu hay viết 2093/QĐ-BCT-2025. Chưa gắn được nguồn bậc A (vanban/congbao/moit van-ban-phap-luat) sau truy vết 2026-10-04; đang dựa nguồn B/thứ cấp hoặc chưa có URL. Nhập từ hs-code-api data/legal-docs.json (2 mã HS). Mã vụ việc AD22. PDF Cục PVTM là ảnh — OCR. Đối chiếu 18-11-2026 (OZV-1418): vụ việc AD22 đã kết luận bằng QĐ 1400/QĐ-BCT (thuế CBPG chính thức từ 14-06-2026) → HET_HIEU_LUC từ 14-06-2026, khớp hs-code-api (REPLACED). Văn bản đang áp dụng cho 2 mã HS: 1400/QĐ-BCT. Dòng 1400 chưa ghi quan_he.thay_the 2093 — cần bổ sung ở PR riêng.'
