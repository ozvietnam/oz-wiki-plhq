ghi_chu: 'Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 10 mã HS). Tiêu đề đã đối chiếu (luatvietnam.vn + moit.gov.vn). GHI CHÚ NGHIỆP VỤ (hs-code-api): Mã vụ việc AD16. Thuế CBPG 21,4% (ghế) / 35,2% (bàn) với hàng Trung Quốc, 5 năm từ 13/02/2023; HS 9401.31.00; 9401.39.00; 9401.41.00; 9401.49.00; 9401.61.00; 9401.69.90; 9401.71.00; 9401.79.90; 9401.80.00; 9403.30.00. Malaysia: chấm dứt điều tra (NK <3%). Chưa gắn được nguồn bậc A (vanban/congbao/moit van-ban-phap-luat) sau truy vết 2026-10-04; đang dựa nguồn B/thứ cấp hoặc chưa có URL. Nhập từ hs-code-api data/legal-docs.json (10 mã HS). Mã vụ việc AD16. PDF Cục PVTM (case AD16) là ảnh — điều khoản đọc bằng OCR.'
