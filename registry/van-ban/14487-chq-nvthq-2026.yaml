  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/27/a17a9f4b-3bed-4d58-80c6-ce3ccc601fe0.pdf, id=102945, SHA-256 03b862a50e603852523ab4d68944b26fe351090f6952745f7594e2fa19fb2160): Công văn thượng khẩn số 14487/CHQ-NVTHQ ngày 27-03-2026 của Cục Hải quan (Phó Cục trưởng Lưu Mạnh Tưởng ký) hướng dẫn thực hiện Quyết định số 482/QĐ-TTg ngày 26-03-2026 của Thủ tướng Chính phủ kể từ 24 giờ 00 phút ngày 26-03-2026 đến hết ngày 15-04-2026 (thuế BVMT 0 đồng/lít đối với xăng trừ etanol, dầu diezel và nhiên liệu bay; không phải kê khai, tính nộp thuế GTGT nhưng được khấu trừ thuế GTGT đầu vào; thuế suất thuế TTĐB 0% đối với xăng các loại) và hướng dẫn chọn mã VK240 tại ô chỉ tiêu thông tin "Mã áp dụng thuế suất/mức thuế và thu khác" trên tờ khai hải quan điện tử nhập khẩu hệ thống VNACCS/VCIS đăng ký từ 24h00 ngày 26-03-2026 đến hết ngày 15-04-2026; đã hết hiệu lực từ ngày 16-04-2026 (tiếp nối bởi Công văn 15289/CHQ-NVTHQ ngày 15-04-2026 theo Nghị quyết 19/2026/QH16)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn khai báo mã VK240 trên VNACCS/VCIS giai đoạn khẩn cấp từ 24h00 ngày 26/03/2026 đến hết ngày 15/04/2026 theo Quyết định 482/QĐ-TTg; từ ngày 16/04/2026 tiếp nối bởi Công văn số 15289/CHQ-NVTHQ và từ ngày 01/10/2026 tiếp nối bởi Công văn số 22446/CHQ-NVTHQ.'
