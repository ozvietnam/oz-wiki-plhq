  pham_vi: 'Đối chiếu toàn văn PDF Chính phủ (76-vbhn-vpqh.pdf) và bản trích xuất trong kho (raw/download/datafiles.chinhphu.vn/2026/3/76-vbhn-vpqh-2026.md, 14 chương 116 điều, Chủ nhiệm Văn phòng Quốc hội Lê Quang Mạnh ký xác thực ngày 25-03-2026): hợp nhất Luật Dược số 105/2016/QH13 ngày 06-04-2016 (hiệu lực 01-01-2017), được sửa đổi, bổ sung bởi Luật số 28/2018/QH14, Luật số 44/2024/QH15 (hiệu lực 01-07-2025), Luật Quy hoạch số 112/2025/QH15 (hiệu lực 01-03-2026), Luật Phòng bệnh số 114/2025/QH15 (hiệu lực 01-07-2026) và Luật Đầu tư số 143/2025/QH15 (hiệu lực 01-03-2026); đang còn hiệu lực'
