  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Luật này quy định về chính sách của Nhà nước về dược và phát triển công nghiệp dược; hành nghề dược; kinh doanh dược; đăng ký, lưu hành, thu hồi thuốc và nguyên liệu làm thuốc; dược liệu và thuốc cổ truyền; đơn thuốc và sử dụng thuốc; thông tin thuốc, cảnh giác dược và quảng cáo thuốc; dược lâm sàng; quản lý thuốc trong cơ sở khám bệnh, chữa bệnh; thử thuốc trên lâm sàng và thử tương đương sinh học của thuốc; quản lý chất lượng thuốc, nguyên liệu làm thuốc và quản lý giá thuốc.
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Dược là thuốc và nguyên liệu làm thuốc. 2. Thuốc là chế phẩm có chứa dược chất hoặc dược liệu dùng cho người nhằm mục đích phòng bệnh, chẩn đoán bệnh, chữa bệnh, điều trị bệnh, giảm nhẹ bệnh, điều chỉnh chức năng sinh lý cơ thể người bao gồm thuốc hóa dược, thuốc dược liệu, thuốc cổ truyền, vắc xin và sinh phẩm.'
    - dieu: 6
      noi_dung: Điều 6. Những hành vi bị nghiêm cấm 1. Kinh doanh dược mà không có Giấy chứng nhận đủ điều kiện kinh doanh dược hoặc trong thời gian bị đình chỉ hoạt động hoặc trong thời gian bị tước quyền sử dụng Giấy chứng nhận đủ điều kiện kinh doanh dược.
    - dieu: 54
      noi_dung: 'Điều 54. Đối tượng và yêu cầu đăng ký thuốc, nguyên liệu làm thuốc 1. Thuốc phải đăng ký trước khi lưu hành tại Việt Nam, trừ trường hợp sau đây: a) Thuốc pha chế theo đơn tại nhà thuốc quy định tại điểm b khoản 1 Điều 47; thuốc sản xuất, pha chế tại cơ sở khám bệnh, chữa bệnh quy định tại Điều 85 của Luật này; b)91 Thuốc được nhập khẩu quy định tại khoản 2 và khoản 5a Điều 60 của Luật này;'
    - dieu: 59
      noi_dung: 'Điều 59. Quy định về lưu hành thuốc, nguyên liệu làm thuốc 1. Các loại thuốc, nguyên liệu làm thuốc lưu hành trên thị trường bao gồm: a) Thuốc, nguyên liệu làm thuốc đã được cấp giấy đăng ký lưu hành; b)99 Thuốc, nguyên liệu làm thuốc nhập khẩu quy định tại các khoản 1, 2, 3, 4 và 5a Điều 60 của Luật này;'
    - dieu: 60
      noi_dung: Điều 60. Thuốc, nguyên liệu làm thuốc được nhập khẩu, xuất khẩu 1. Thuốc, nguyên liệu làm thuốc là dược chất đã có giấy đăng ký lưu hành tại Việt Nam, nguyên liệu làm thuốc là dược chất để sản xuất thuốc theo hồ sơ đăng ký thuốc đã có giấy đăng ký lưu hành thuốc tại Việt Nam được nhập khẩu mà không phải thực hiện việc cấp phép nhập khẩu, trừ thuốc, nguyên liệu làm thuốc quy định tại khoản 4 Điều này.
    - dieu: 61
      noi_dung: 'Điều 61. Nhãn thuốc, nguyên liệu làm thuốc lưu hành trên thị trường 1. Nhãn thuốc, nguyên liệu làm thuốc lưu hành trên thị trường phải thể hiện các nội dung sau đây: a) Tên thuốc, nguyên liệu làm thuốc; b) Dạng bào chế, trừ nguyên liệu làm thuốc; c) Thành phần, hàm lượng, nồng độ hoặc khối lượng dược chất, dược liệu của thuốc, nguyên liệu làm thuốc; nhãn của thuốc cổ truyền thuộc Danh mục bí mật của Nhà nước và của thuốc gia truyền được phép không thể hiện một số thành phần dược liệu, hàm lượng, khối lượng dược liệu và phải có dòng chữ “Công thức sản xuất thuốc là bí mật nhà nước” hoặc “Công thức sản xuất thuốc là bí mật gia truyền”;'
    - dieu: 68
      noi_dung: Điều 68. Chất lượng của dược liệu 1. Dược liệu phải đạt tiêu chuẩn chất lượng, có nguồn gốc, xuất xứ rõ ràng. Khi đưa vào sản xuất, chế biến, bào chế thuốc, mức tồn dư hóa chất bảo vệ thực vật, hóa chất bảo quản, giới hạn kim loại nặng, giới hạn vi sinh vật, giới hạn độc tính của dược liệu không được vượt mức quy định.
    - dieu: 73
      noi_dung: Điều 73. Chất lượng thuốc cổ truyền 1. Thuốc cổ truyền được cân (bốc) theo bài thuốc, đơn thuốc, được bào chế, chế biến trong cơ sở khám bệnh, chữa bệnh quy định tại khoản 1 và khoản 2 Điều 70 của Luật này phải bảo đảm chất lượng do Bộ Y tế quy định. 2. Thuốc cổ truyền lưu hành toàn quốc phải bảo đảm chất lượng theo quy định tại Điều 102 và Điều 103 của Luật này. 3. Bộ trưởng Bộ Y tế quy định việc công nhận bài thuốc cổ truyền, bài thuốc cổ truyền quý hiếm; các bài thuốc, đơn thuốc được sử dụng để cân (bốc); hướng dẫn về phương pháp chế biến, bào chế hoặc phối ngũ theo lý luận và phương pháp của y học cổ truyền; hướng dẫn đối với các thuốc cổ truyền có dạng bào chế hiện đại.
    - dieu: 115
      noi_dung: Điều 115. Ðiều khoản chuyển tiếp 1. Cơ sở kinh doanh dược đã được cấp Giấy chứng nhận đủ điều kiện kinh doanh dược theo quy định của Luật Dược số 34/2005/QH11 được tiếp tục kinh doanh thuốc cho đến hết thời hạn hiệu lực của Giấy chứng nhận đủ điều kiện kinh doanh dược. Trường hợp Giấy chứng nhận đủ điều kiện kinh doanh dược không ghi thời hạn hiệu lực, cơ sở được phép kinh doanh đến hết thời hạn ghi trên giấy chứng nhận thực hành tốt đã được cấp.
