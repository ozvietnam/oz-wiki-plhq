xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF ký số bậc A trên datafiles.chinhphu.vn (143-ndcp.signed.pdf, 144 trang, ký Phó Thủ tướng Nguyễn Văn Thắng ngày 05-05-2026) và đối chiếu chinhphu.vn (docid=218021): gồm 7 Điều và Phụ lục Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định CEPA Việt Nam – UAE giai đoạn 2026–2027 (chi tiết cấp mã 8 số; Điều 3 khoản 3 quy định cột thuế suất 2026 áp dụng từ 03-02-2026 đến hết 31-12-2026, cột 2027 áp dụng từ 01-01-2027 đến hết 31-12-2027). Điều 6 (Hiệu lực thi hành): khoản 1 quy định Nghị định có hiệu lực thi hành kể từ ngày ký ban hành (05-05-2026) đến hết ngày 31-12-2027; khoản 2 quy định điều khoản chuyển tiếp xử lý tiền thuế nộp thừa đối với tờ khai hải quan hàng hóa nhập khẩu từ UAE đăng ký từ ngày 03-02-2026 (ngày Hiệp định CEPA có hiệu lực) đến trước ngày 05-05-2026 nếu đáp ứng đủ điều kiện hưởng thuế suất CEPA. Điều 7 quy định trách nhiệm thi hành. Đối chiếu tình trạng hiện tại đến 2026-11-21 trên chinhphu.vn: chưa có văn bản sửa đổi, bổ sung, thay thế hay bãi bỏ, đang CON_HIEU_LUC.'
