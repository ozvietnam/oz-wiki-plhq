xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/25/VB_10235.pdf, id=100459, SHA-256 507339fffd6b8a7f70f468cd607a4524e47efb5d7bcaa461b6c029eb3d84ef8b): Thông báo số 10235/TB-CHQ ngày 23-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bảng mạch in điện tử chưa được gắn linh kiện, loại 2 lớp dẫn điện (tên gọi theo cấu tạo, công dụng: Mạch in hai mặt, chưa được gắn linh kiện; ký, mã hiệu model PSS_STD V0.1; cấu tạo bởi 2 lớp lá đồng Copper foil 20% nằm xen kẽ lớp cách điện PREPREG sợi thủy tinh ép nhựa và lớp mặt nạ hàn Solder Mask, mực in Silkscreen 5%, nhựa & sợi thủy tinh 75% tính theo trọng lượng; kích thước 7.4x49.7mm, độ dày 1.6mm +/-10%, in mạch trên cả 2 mặt trước và sau, chưa gắn linh kiện chủ động hay bị động, ứng dụng sản xuất bản mạch điều khiển cho hệ thống điện tử tự động ô tô), phân loại vào nhóm 85.34, mã số 8534.00.20; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Bảng mạch in điện tử chưa được gắn linh kiện, loại 2 lớp dẫn điện (Mạch in hai mặt, chưa được gắn linh kiện; ký, mã hiệu model PSS_STD V0.1; cấu tạo 2 lớp lá đồng nằm xen kẽ lớp cách điện sợi thủy tinh ép nhựa PREPREG, phủ lớp mặt nạ hàn Solder Mask và lớp mực in Silkscreen; hàm lượng đồng 20%, nhựa và sợi thủy tinh 75%, mực in 5%; kích thước 7.4x49.7mm, độ dày 1.6mm +/-10%, dùng sản xuất bản mạch điều khiển cho hệ thống điện tử tự động ô tô) thuộc nhóm 85.34, mã số 8534.00.20.'
