  pham_vi: 'đối chiếu Công báo (470854) và thẻ vanban.chinhphu.vn (docid=220090): số hiệu, tiêu đề đầy đủ, ngày ban hành 20-10-2026, có hiệu lực từ 20-10-2026; đang còn hiệu lực, sửa đổi, bổ sung một số điều của Thông tư 19/2026/TT-BCT về tạm ứng Quỹ bình ổn giá xăng dầu'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
