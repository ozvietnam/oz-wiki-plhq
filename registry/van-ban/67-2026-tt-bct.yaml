  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bổ sung một số điều của Thông tư số 19/2026/TT-BCT 1. Sửa đổi, bổ sung Điều 5 như sau: “Điều 5. Tạm ứng cho Quỹ bình ổn giá xăng dầu từ nguồn ngân sách nhà nước 1. Căn cứ thông báo điều hành giá bán xăng dầu của Bộ Công Thương có nội dung điều hành chi sử dụng Quỹ bình ổn giá xăng dầu, Cục Quản lý và Phát triển thị trường trong nước gửi văn bản đề nghị thương nhân tạm ứng cho Quỹ bình ổn giá xăng dầu tại thương nhân.'
      trang_pdf: 2
      sha256_pdf: 367cad2698fe4714626740340cd72c20b7b38c542a61fa5ab0bba3a5ad09d62c
    - dieu: 2
      noi_dung: Điều 2. Điều khoản chuyển tiếp Đối với các hồ sơ đề nghị tạm ứng của thương nhân gửi về Cục Quản lý và Phát triển thị trường trong nước trước ngày Thông tư này có hiệu lực thi hành nhưng chưa được giải quyết, Cục Quản lý và Phát triển thị trường trong nước có văn bản thông báo hướng dẫn thương nhân thực hiện tạm ứng theo quy định tại Thông tư này.
      trang_pdf: 5
      sha256_pdf: 367cad2698fe4714626740340cd72c20b7b38c542a61fa5ab0bba3a5ad09d62c
    - dieu: 3
      noi_dung: Điều 3. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 20 tháng 10 năm 2026. 2. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, các cơ quan, tổ chức, doanh nghiệp kịp thời phản ánh bằng văn bản về Bộ Công Thương (Cục Quản lý và Phát triển thị trường trong nước) để xem xét, hướng dẫn hoặc sửa đổi, bổ sung cho phù hợp./.
      trang_pdf: 5
      sha256_pdf: 367cad2698fe4714626740340cd72c20b7b38c542a61fa5ab0bba3a5ad09d62c
