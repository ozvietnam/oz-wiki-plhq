ghi_chu: 'Xác định trước mã số mặt hàng Dụng cụ kiểm tra độ thẳng hàng chân pin tiếp xúc mạch điện bằng thép không gỉ, không hoạt động bằng điện (ký, mã hiệu 7386-8850A00 49YC002837; cấu tạo 100% thép gồm khung thép dày 2mm, miếng thép dày 1mm, 3 bulong M2 dài 8mm và 3 vòng đệm thép phi 3 dài 5mm; kích thước 42x39.2x28.4 mm; dùng kiểm tra thủ công độ thẳng hàng chân pin tiếp xúc trong thiết bị đóng ngắt mạch điện của bộ dây điện ô tô) thuộc nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90.'
