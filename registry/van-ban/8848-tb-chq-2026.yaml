  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/6/VB_8848.pdf, id=102573, SHA-256 68b2e1fcfd716a64adc8c61a0ade9c71cd3c7cb89a4ab4be7eddf5bcf17a4738): Thông báo số 8848/TB-CHQ ngày 04-02-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Dụng cụ kiểm tra độ thẳng hàng chân pin tiếp xúc mạch điện bằng thép không gỉ, không hoạt động bằng điện (ký, mã hiệu 7386-8850A00 49YC002837; cấu tạo 100% thép gồm 1 khung thép dày 2mm, 1 miếng thép dày 1mm, 3 bulong M2 dài 8mm và 3 vòng đệm bằng thép phi 3 dài 5mm; kích thước 42x39.2x28.4 mm; thao tác hoàn toàn thủ công bằng tay, dùng để kiểm tra độ thẳng hàng chân pin tiếp xúc mạch điện bên trong thiết bị đóng ngắt mạch điện của bộ dây điện ô tô), phân loại vào nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90; có hiệu lực từ ngày ký'
