  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/15/VB_16108.pdf, id=103719, SHA-256 106df02b265ac85dd0250aa826ca63a38859cc2f055699dcbed357d6c6d7d7e0): Thông báo số 16108/TB-CHQ ngày 12-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chất ghép nối Silane cho sản phẩm đá nhân tạo GENIOSIL® CS 2 (ký, mã hiệu GENIOSIL® CS 2; thành phần theo trọng lượng gồm Ethyl silicate / tetraethyl orthosilicate CAS 78-10-4 từ 25% đến dưới 50%, Triethoxyphenylsilane CAS 780-69-8 từ 1% đến dưới 3%; dạng lỏng trong suốt không màu, mùi đặc trưng, nhiệt độ sôi 163 °C, tỷ trọng 0.985 g/cm³ ở 20 °C; dùng làm chất liên kết tạo cầu nối hóa học giữa nhựa hữu cơ và chất độn vô cơ trong sản xuất vật liệu composite), phân loại vào nhóm 38.24, phân nhóm 3824.99, mã số 3824.99.99; có hiệu lực kể từ ngày ký'
