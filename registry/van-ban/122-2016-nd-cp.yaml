  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này ban hành Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp và thuế nhập khẩu ngoài hạn ngạch thuế quan.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Người nộp thuế theo quy định của Luật thuế xuất khẩu, thuế nhập khâu. 2. Cơ quan hải quan, công chức hải quan. 3. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hàng hoá xuất khâu, nhập khâu.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Ban hành Biểu thuế xuất khẩu, Biểu thuế nhập khẩu theo danh mục chịu thuế, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khấu ngoài hạn ngạch thuế quan Ban hành kèm theo Nghị định này: _ 1. Phụ lục I - Biểu thuế xuất khẩu theo danh mục mặt hàng chịu thuế.'
      trang_pdf: 1
    - dieu: 4
      noi_dung: Điều 4. Biểu thuế xuất khẩu theo danh mục mặt hàng chịu thuế 1. Biểu thuế xuất khẩu theo danh mục mặt hàng chịu thuế quy định tại Phụ lục I ban hành kèm theo Nghị định này gồm mã hàng, mô tả hàng hoá, mức thuế suất thuế xuất khâu quy định cho từng nhóm mat hàng, mặt hàng chịu thuế xuất khẩu.
      trang_pdf: 2
    - dieu: 5
      noi_dung: 'Điều 5. Biểu thuế nhập khẩu ưu đãi theo danh mục mặt hàng chịu thuế Biểu thuế nhập khẩu ưu đãi theo danh mục mặt hàng chịu thuế quy định tại Phụ lục II bao gôm:'
      trang_pdf: 3
    - dieu: 6
      noi_dung: 'Điều 6. Thuế suất thuế nhập khẫu ưu đãi đối với các mặt hàng máy gia công cơ khí và hóa dầu 1. Các mặt hàng máy gia công cơ khí thuộc các nhóm hàng từ 84.54 đến 84.63 áp dụng mức thuê suat thuê nhập khâu ưu đãi như sau:'
      trang_pdf: 4
    - dieu: 7
      noi_dung: Điều 7. Thuế nhập khẩu đối với mặt hàng xe ôtô đã qua sử dụng 1. Xe ôtô chở người từ 09 chỗ ngồi trở xuống (kê cả lái xe) có dung tích xi lanh đưới 1.500cc thuộc nhóm hàng 87.03 và xe 6 tô chở người từ 10 den 15 chỗ ngồi (kể cả lái xe) thuộc nhóm hàng 87.02 áp dụng mức thuê tuyệt đối quy định tại Phụ lục II ban hành kèm theo Nghị định này.
      trang_pdf: 5
    - dieu: 8
      noi_dung: Điều 8. Danh mục hàng hóa và mức thuế suất thuế nhập khẩu ngoài hạn ngạch thuế quan đối với các mặt hàng thuộc diện áp dụng hạn ngạch thuê quan __ 1, Danh mục hàng hoa thuộc diện áp dung hạn ngạch thuế quan gồm một số mặt hàng thuộc các nhóm 04.07; 17.01; 24.01; 25.01 được quy định tại Phụ lục IV ban hành kèm theo Nghị định này. 2. Mức thuế suất thuế nhập khẩu ngoài hạn ngạch thuế quan quy định tại Phụ lục IV ban hành kèm theo Nghị định này.
      trang_pdf: 5
    - dieu: 9
      noi_dung: 'Điều 9. Tổ chức thực hiện 1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 9 năm 2016. 2. Nghị định này bãi bỏ: a) Quyết định số 36/2011/QĐ-TTg ngày 29 tháng 6 năm 2011 của Thủ tướng Chính phủ về việc ban hành mức thuế nhập khẩu đối với mặt hang xe 6 tô chở người từ 15 chỗ ngồi trở xuống (kê cả lái xe) đã qua sử dụng;'
      trang_pdf: 6
ghi_chu: Nghị định Biểu thuế XK/NK ưu đãi 2016 — đã hết hiệu lực từ 15-07-2023 (thay thế bởi NĐ 26/2023/NĐ-CP).
