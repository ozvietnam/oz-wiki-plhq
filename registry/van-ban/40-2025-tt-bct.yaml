  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định việc cấp Giấy chứng nhận xuất xứ hàng hóa (sau đây gọi là C/O) và chấp thuận bằng văn bản cho thương nhân tự chứng nhận xuất xứ hàng hóa xuất khâu (sau đây gọi là Văn bản chấp thuận) theo khoản 6 Điều 28 Nghị định số 146/2025/NĐ-CP ngày 12 tháng 6 năm 2025 của Chính phủ quy định về phân quyền, phân cấp trong lĩnh vực công nghiệp và thương mại.
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Là ÚC Xuất nhập khâu (Bộ Công Thương). 2. Ủy ban nhân dân tỉnh, thành phó trực thuộc trung ương (sau đây gọi là Ủy ban nhân dân cấp tỉnh). 3. Thương nhân, tô chức, cá nhân có liên quan đến nhiệm vụ quản lý nhà nước về xuât xứ hàng hóa. | Chương II TỎ CHỨC, THỰC HIỆN CÁP C/O VÀ CÁP VĂN BẢN CHÁP THUẬN
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc tô chức thực hiện cấp C/O và Văn bản chấp thuận 1. Bảo đảm sự thống nhất, toàn diện trong công tác quản lý nhà nước về xuât xứ hàng hóa đôi với hàng hóa xuât khâu. 2. Bảo đảm phù hợp với chủ trương theo quy định của Luật Tô chức Chính phủ và Luật Tô chức chính quyền địa phương.
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Nội dung, phạm vi cấp C/O và Văn bản chấp thuận 1. Cục Xuất nhập khẩu (Bộ Công Thương) cấp và tô chức triển khai việc cấp các loại C/O và Văn bản chap thuận tại Phụ lục I kèm theo Thông tư này khi đáp ứng điều kiện quy định tại Điều 5 Thông tư này và quy định pháp luật có liên quan.
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Điều kiện cấp C/O và Văn bản chấp thuận 1. Bảo dam đội ngũ nhân lực dé thực hiện việc cấp và tô chức triển khai việc cấp các loại C/O và Văn bản chấp thuận. 2. Được đào tạo, tập huấn kiến thức về xuất xứ hàng hóa đối với người có thầm quyền ky C/O và Văn bản chấp thuận. 3. Có tài khoản thu phí chứng nhận xuất xứ hàng hóa.
      trang_pdf: 3
    - dieu: 6
      noi_dung: Điều 6. Trách nhiệm của Uy ban nhân dân cấp tỉnh 1. Trong vòng 90 ngày kề từ ngày Thông tư này có hiệu lực, Ủy ban nhân dân cấp tỉnh phải bảo đảm việc tô chức được giao nhiệm vụ theo thâm quyền triển khai cấp các loại C/O và Văn bản chấp thuận.
      trang_pdf: 3
    - dieu: 7
      noi_dung: Điều 7. Trách nhiệm của tổ chức được Ủy ban nhân dân cấp tỉnh giao nhiệm vụ cấp C/O và Văn bản chấp thuận 1. Duy trì điều kiện cấp C/O và Văn bản chấp thuận theo quy định tai Điều 5 Thông tư này.
      trang_pdf: 4
    - dieu: 8
      noi_dung: 'Điều 8. Trách nhiệm của đơn vị thuộc Bộ Công Thương 1. Cục Xuất nhập khẩu chịu trách nhiệm: a) Tông hợp tình hình thực hiện cấp C/O và Văn bản chấp thuận. b) Xây dựng nội dung chương trình đào tạo, tập huấn về xuất xứ hàng hóa. c) Chủ trì, phối hợp với cơ quan có thâm quyền. đơn vị liên quan kiểm tra định kỳ hoặc đột xuất cơ quan, tổ chức cấp C/O và Văn bản chấp thuận.'
      trang_pdf: 4
    - dieu: 9
      noi_dung: Điều 9. Hiệu lực thi hành 1. Thông tư này có hiệu lực kể từ ngày 01 tháng 7 năm 2025. 2. Trong trường hợp các văn bản quy phạm pháp luật được viện dẫn trong Thông tư này được sửa đổi, bô sung hoặc thay thế thì thực hiện theo các văn bản quy phạm pháp luật đã được sửa đôi, bổ sung hoặc thay thế...
      trang_pdf: 5
ghi_chu: Quy trình cấp C/O MỌI form (kể cả form E ACFTA). Đã có VBHN 48/VBHN-BCT (2026) hợp nhất theo khoản 6 Điều 28 NĐ 146/2025/NĐ-CP (phân cấp công thương). Danh sách văn bản bị thay thế chưa đối chiếu nguyên văn — xem VBHN 48 trước khi trích quan hệ thay thế.
