xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/11/VB_16016.pdf, id=103610, SHA-256 d3294a06046d59684fc28fc56a9634821492a73f5670c1b2a54dcf561effc5bc): Thông báo hỏa tốc số 16016/TB-CHQ ngày 08-05-2026 (ký số 08-05-2026 11:07:10 +07:00) của Cục Hải quan về thông tin mã đơn vị quan hệ ngân sách của Đội Thông quan, Chi cục Hải quan khu vực III; căn cứ QĐ 832/QĐ-CHQ (30-06-2025) sửa đổi, bổ sung tại QĐ 681/QĐ-CHQ, 682/QĐ-CHQ, 683/QĐ-CHQ (04-05-2026) về tổ chức, triển khai hoạt động của Đội Thông quan thuộc Chi cục HQKV III; thông báo mã cơ quan thu 2995544, tên cơ quan thu Đội Thông quan, đơn vị cấp trên Chi cục Hải quan khu vực III (đính kèm CV 1047/CNTT-TK ngày 07-05-2026 của Cục CNTT và chuyển đổi số - Bộ Tài chính theo đề nghị tại CV 15903/CHQ-NVTHQ ngày 05-05-2026); người ký Mai Thị Vân Anh; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'TB mã đơn vị quan hệ ngân sách (ĐVQHNS) — không phải XDTMS; là tiền đề cấp mã cơ quan thu 2995544 cho Đội Thông quan thuộc Chi cục Hải quan khu vực III trước khi thông báo tài khoản thu NSNN tại 16496/TB-CHQ/2026. Đính kèm Công văn số 1047/CNTT-TK ngày 07-05-2026 của Cục Công nghệ thông tin và chuyển đổi số (Bộ Tài chính) về việc cấp mã ĐVQHNS đối với cơ quan thu (người ký Nguyễn Thị Thuận) theo đề nghị tại Công văn 15903/CHQ-NVTHQ ngày 05-05-2026. Các QĐ 832/QĐ-CHQ/2025, 681/QĐ-CHQ/2026, 682/QĐ-CHQ/2026, 683/QĐ-CHQ/2026 chưa có trong sổ nên chưa gắn quan_he.can_cu (tránh điểm mù Cao).'
