  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/26/14.VB_16555.pdf, id=104032, SHA-256 e9e707a507ba2b2946e1a1c5b63853130eb6d6fa45ca98dd606e3940d23e6078): Thông báo số 16555/TB-CHQ ngày 22-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Trục đầu ra từ puly thứ cấp (Driven Pulley shaft, ký mã hiệu 1A005707; thân trục hình trụ bằng thép hợp kim dài 179,7 mm, một đầu có trục then hoa đường kính ngoài 15 mm gồm 19 răng để kết nối nhận truyền động từ puly thứ cấp, một đầu có bánh răng trụ nghiêng đường kính ngoài 27,9 mm gồm 14 răng ăn khớp với bánh răng truyền động trung gian; thuộc hệ truyền động bánh sau xe máy tay ga, không thuộc hệ thống động lực động cơ, dùng để nhận lực từ dây đai và truyền mô-men xoắn tới trục bánh sau), phân loại vào nhóm 87.14, phân nhóm 8714.10, mã số 8714.10.40; có hiệu lực kể từ ngày ban hành'
