    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quyền tác giả, quyền liên quan đến quyền tác giả, quyền sở hữu công nghiệp, quyền đối với giống cây trồng và việc bảo hộ các quyền đó.
      trang_pdf: 2
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân Việt Nam; tổ chức, cá nhân nước ngoài đáp ứng các điều kiện quy định tại Luật này và điều ước quốc tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.
      trang_pdf: 2
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 3
      noi_dung: Điều 3. Đối tượng quyền sở hữu trí tuệ2 1. Đối tượng quyền tác giả bao gồm tác phẩm văn học, nghệ thuật, khoa học; đối tượng quyền liên quan đến quyền tác giả bao gồm cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng, tín hiệu vệ tinh mang chương trình được mã hóa.
      trang_pdf: 2
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 35
      noi_dung: Điều 35. Hành vi xâm phạm quyền liên quan49 1. Xâm phạm quyền của người biểu diễn quy định tại Điều 29 của Luật này. 2. Xâm phạm quyền của nhà sản xuất bản ghi âm, ghi hình quy định tại Điều 30 của Luật này. 3. Xâm phạm quyền của tổ chức phát sóng quy định tại Điều 31 của Luật này. 4. Không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ quy định tại Điều 32 và Điều 33 của Luật này.
      trang_pdf: 27
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 66
      noi_dung: Điều 66. Tính sáng tạo của kiểu dáng công nghiệp Kiểu dáng công nghiệp được coi là có tính sáng tạo nếu căn cứ vào các kiểu dáng công nghiệp đã được bộc lộ công khai dưới hình thức sử dụng, mô tả bằng văn bản hoặc bất kỳ hình thức nào khác ở trong nước hoặc ở nước ngoài trước ngày nộp đơn hoặc trước ngày ưu tiên của đơn đăng ký kiểu dáng công nghiệp trong trường hợp đơn được hưởng quyền ưu tiên, kiểu dáng công nghiệp đó không thể được tạo ra một
      trang_pdf: 44
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 96
      noi_dung: 'Điều 96. Hủy bỏ hiệu lực văn bằng bảo hộ108 1. Văn bằng bảo hộ bị hủy bỏ toàn bộ hiệu lực trong các trường hợp sau đây: a) Người nộp đơn đăng ký nhãn hiệu với dụng ý xấu; Điều này được sửa đổi, bổ sung theo quy định tại khoản 30 Điều 1 của Luật số 07/2022/QH15 sửa đổi, bổ sung một số điều của Luật Sở hữu trí tuệ, có hiệu lực kể từ ngày 01 tháng 01 năm 2023. 108'
      trang_pdf: 59
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 127
      noi_dung: 'Điều 127. Hành vi xâm phạm quyền đối với bí mật kinh doanh 1. Các hành vi sau đây bị coi là xâm phạm quyền đối với bí mật kinh doanh: a) Tiếp cận, thu thập thông tin thuộc bí mật kinh doanh bằng cách chống lại các biện pháp bảo mật của người kiểm soát hợp pháp bí mật kinh doanh đó; b) Bộc lộ, sử dụng thông tin thuộc bí mật kinh doanh mà không được phép của chủ sở hữu bí mật kinh doanh đó;'
      trang_pdf: 80
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 157
      noi_dung: Điều 157. Tổ chức, cá nhân được bảo hộ quyền đối với giống cây trồng167 1. Tổ chức, cá nhân được bảo hộ quyền đối với giống cây trồng là tổ chức, cá nhân chọn tạo hoặc phát hiện và phát triển giống cây trồng hoặc đầu tư cho công tác chọn tạo hoặc phát hiện và phát triển giống cây trồng hoặc được chuyển giao quyền đối với giống cây trồng.
      trang_pdf: 97
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 188
      noi_dung: 'Điều 188. Hành vi xâm phạm quyền đối với giống cây trồng Các hành vi sau đây bị coi là xâm phạm quyền của chủ bằng bảo hộ: 1. Khai thác, sử dụng các quyền của chủ bằng bảo hộ mà không được phép của chủ bằng bảo hộ;'
      trang_pdf: 111
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
    - dieu: 220
      noi_dung: Điều 220. Điều khoản chuyển tiếp239 1. Quyền tác giả, quyền liên quan được bảo hộ theo quy định của các văn bản pháp luật có hiệu lực trước ngày Luật này có hiệu lực, nếu còn thời hạn bảo hộ vào ngày Luật này có hiệu lực thì được tiếp tục bảo hộ theo quy định của Luật này.
      trang_pdf: 133
      sha256_pdf: 313f5aec815cc110e90bc8a461f8ea05e3bed818a24b8278f48065b1483a0dbb
