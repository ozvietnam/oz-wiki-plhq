      noi_dung: Điều 5. Lập dự toán, phân bổ, sử dụng và quyết toán kinh phí ngân sách nhà nước thực hiện chính sách tinh giản biên chế Việc lập dự toán, phân bổ, sử dụng và quyết toán kinh phí ngân sách nhà nước thực hiện chính sách tinh giản biên chế thực hiện theo quy định của Luật Ngân sách nhà nước và các văn bản hướng dẫn Luật.
