      noi_dung: Điều 2. Nguồn kinh phí thực hiện chính sách tinh giản biên chế đối với cán bộ, công chức, người làm việc theo chế độ hợp đồng lao động không xác định thời hạn trong cơ quan hành chính được áp dụng chế độ, chính sách như công chức, người hoạt động không chuyên trách cấp xã tại khoản 1 và khoản 3 Điều 2 Nghị định số 29/2023/NĐ-CP trong các cơ quan, tổ chức của Đảng, Nhà nước, tổ chức chính trị - xã hội từ Trung ương đến cấp xã Kinh phí giải quyết
      trang_pdf: 2
      sha256_pdf: a38d61a36527748f753432b1d26fd4a7c23e85919aaf6318a1b8519eb0aa1429
    - dieu: 3
      noi_dung: Điều 3. Nguồn kinh phí giải quyết chính sách tinh giản biên chế trong các đơn vị sự nghiệp công lập Kinh phí thực hiện chính sách tinh giản biên chế đối với viên chức (bao gồm cả viên chức theo quy định tại điểm b khoản 1 Điều 9 Nghị định số 29/2023/NĐ-CP), người làm việc theo chế độ hợp đồng lao động không xác định thời hạn thực hiện các công việc chuyên môn nghiệp vụ thuộc danh mục vị trí việc làm chức danh nghề nghiệp chuyên ngành và vị trí
      trang_pdf: 3
      sha256_pdf: a38d61a36527748f753432b1d26fd4a7c23e85919aaf6318a1b8519eb0aa1429
