xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/17/VB_20320.pdf, id=105433, SHA-256 b54bafc5292e3db2e3199fec1ca5be76466315373f2b91637e59fa5e2157d6fd): Thông báo số 20320/TB-CHQ ngày 13-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ cấp nguồn điện có khả năng chống nước (Waterproof Power Supply) phù hợp sử dụng cho đèn LED (ký, mã hiệu RSE-1K0N-375Z; cấu tạo gồm vỏ nhôm, bảng mạch điện tử PCB, mạch điều khiển IC, tụ điện, điện trở, cuộn cảm, diode, linh kiện bán dẫn công suất; có chức năng chuyển đổi nguồn điện xoay chiều AC 180-260VAC thành nguồn điện một chiều DC 230-375VDC, tự động điều chỉnh điện áp đầu ra phù hợp với tải LED và duy trì chế độ dòng điện không đổi Constant Current, chống nước IP65, công suất tối đa 1000W), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.30; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Bộ cấp nguồn điện có khả năng chống nước (Waterproof Power Supply, ký mã hiệu RSE-1K0N-375Z, chuyển đổi nguồn điện xoay chiều AC 180-260VAC thành nguồn một chiều DC 230-375VDC và duy trì chế độ dòng điện không đổi để cấp nguồn cho đèn LED công suất tối đa 1000W, IP65) thuộc nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.30.'
