xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=99634): ban hành ngày 29-03-2011, có hiệu lực từ 15-05-2011; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về thống kê về sử dụng năng lượng; cơ sở sử dụng năng lượng trọng điểm; sử dụng năng lượng tiết kiệm và hiệu quả trong cơ quan, đơn vị sử dụng ngân sách nhà nước; dán nhãn năng lượng cho phương tiện, thiết bị sử dụng năng lượng; biện pháp thúc đẩy sử dụng năng lượng tiết kiệm và hiệu quả; kiểm tra, thanh tra về sử dụng năng lượng tiết kiệm và hiệu quả.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với tổ chức, cá nhân sử dụng năng lượng tại Việt Nam. Chương II THỐNG KÊ VỀ SỬ DỤNG NĂNG LƯỢNG
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Chỉ tiêu thống kê về sử dụng năng lượng Chỉ tiêu thống kê về sử dụng năng lượng trong hệ thống chỉ tiêu thống kê quốc gia được áp dụng thống nhất trong cả nước và cập nhật hàng năm, bao gồm các chỉ tiêu chính như sau: 1. Nhóm chỉ tiêu về số lượng, khối lượng năng lượng sử dụng chia theo: a) Ngành kinh tế. b) Cơ sở sử dụng năng lượng trọng điểm. c) Mục đích sử dụng. d) Loại năng lượng.'
      trang_pdf: 1
    - dieu: 8
      noi_dung: 'Điều 8. Mô hình quản lý năng lượng Cơ sở sử dụng năng lượng trọng điểm phải áp dụng mô hình quản lý năng lượng. Mô hình quản lý năng lượng được thực hiện theo các nội dung chính sau đây: 1. Công bố mục tiêu, chính sách về sử dụng năng lượng tiết kiệm và hiệu quả tại cơ sở.'
      trang_pdf: 1
    - dieu: 13
      noi_dung: 'Điều 13. Báo cáo sử dụng năng lượng của cơ quan, đơn vị sử dụng ngân sách nhà nước 1. Hàng năm, các cơ quan, đơn vị sử dụng ngân sách nhà nước lập báo cáo sử dụng năng lượng của cơ quan, đơn vị gửi cơ quan quản lý nhà nước có thẩm quyền. Nội dung báo cáo gồm: a) Tên, địa chỉ. b) Kế hoạch sử dụng năng lượng hàng năm; kế hoạch thay thế hoặc mua sắm mới, sửa chữa phương tiện, thiết bị; mục tiêu và giải pháp để tiết kiệm năng lượng hàng năm.'
      trang_pdf: 1
    - dieu: 17
      noi_dung: 'Điều 17. Hồ sơ đăng ký dán nhãn năng lượng và thẩm quyền cấp Giấy chứng nhận dán nhãn năng lượng đối với phương tiện, thiết bị 1. Hồ sơ đăng ký dán nhãn năng lượng cho phương tiện, thiết bị bao gồm: a) Các thông số kỹ thuật của phương tiện, thiết bị. b) Kết quả thử nghiệm hiệu suất năng lượng của phương tiện, thiết bị do các phòng thử nghiệm quy định tại Điều 16 Nghị định này cấp. c) Giấy đề nghị dán nhãn năng lượng.'
      trang_pdf: 1
    - dieu: 21
      noi_dung: 'Điều 21. Báo cáo của các doanh nghiệp nhập khẩu phương tiện, thiết bị sử dụng năng lượng thuộc Danh mục phương tiện, thiết bị phải dán nhãn năng lượng 1. Doanh nghiệp nhập khẩu phương tiện, thiết bị sử dụng năng lượng thuộc Danh mục phương tiện, thiết bị phải dán nhãn năng lượng có trách nhiệm hàng năm gửi báo cáo tới Sở Công Thương tại địa phương các nội dung sau: a) Tên cơ sở, địa chỉ.'
      trang_pdf: 1
    - dieu: 25
      noi_dung: Điều 25. Kiểm toán năng lượng và báo cáo tình hình sử dụng năng lượng tại các cơ sở không thuộc Danh mục cơ sở sử dụng năng lượng trọng điểm 1. Khuyến khích các cơ sở không thuộc Danh mục cơ sở sử dụng năng lượng trọng điểm định kỳ tổ chức kiểm toán năng lượng và báo cáo tình hình sử dụng năng lượng.
      trang_pdf: 1
    - dieu: 30
      noi_dung: Điều 30. Nội dung kiểm tra, thanh tra về sử dụng năng lượng tiết kiệm và hiệu quả 1. Chế độ, nội dung báo cáo, kế hoạch sử dụng năng lượng tiết kiệm và hiệu quả, kiểm toán năng lượng tại các cơ sở sử dụng năng lượng trọng điểm. 2. Hoạt động của các tổ chức tư vấn kiểm toán năng lượng. 3. Chế độ báo cáo, thống kê sản xuất, nhập khẩu phương tiện, thiết bị thuộc Danh mục phương tiện, thiết bị phải dán nhãn năng lượng.
      trang_pdf: 1
    - dieu: 35
      noi_dung: Điều 35. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 15 tháng 5 năm 2011. 2. Nghị định này thay thế Nghị định số 102/2003/NĐ-CP ngày 03 tháng 9 năm 2003 của Chính phủ về sử dụng năng lượng tiết kiệm và hiệu quả.
      trang_pdf: 1
ghi_chu: Nghị định quy định chi tiết Luật Sử dụng năng lượng tiết kiệm và hiệu quả, làm căn cứ cho các quy định dán nhãn năng lượng và mức hiệu suất năng lượng tối thiểu đối với thiết bị nhập khẩu.
