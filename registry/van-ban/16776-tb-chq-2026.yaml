  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/28/VB_16776.pdf.PDF, id=104067, SHA-256 15990019497eb37392bdcaa7c9ab751ea4369d200fd339dcfb94505c4dfd6e32): Thông báo số 16776/TB-CHQ ngày 27-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Hương phô mai Cheddar Flavor (ký, mã hiệu DC6410X; thành phần theo trọng lượng gồm chế phẩm hương liệu 29-34%, Maltodextrin 28-33%, chất khô từ sữa 8-13%, dầu cọ 5-10%, chế phẩm hương tự nhiên 1-5%, chế phẩm hương giống tự nhiên 1-5%, Lactose 1-5%, Acacia gum 414 1-5%, Natri citrat <2%; dạng bột mịn màu be nhạt, không đóng vón, độ ẩm tối đa 5%, NaCl 2-6%; dùng để tạo hương phô mai cho các sản phẩm thực phẩm), phân loại vào nhóm 21.06, phân nhóm 2106.90, mã số 2106.90.98; có hiệu lực kể từ ngày ban hành'
