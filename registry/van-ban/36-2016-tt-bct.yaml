  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định trình tự, thủ tục đăng ky, thực hiện dán nhãn năng lượng và thu hôi nhãn năng lượng đối với các phương tiện, thiết bị trong Danh mục phương tiện, thiết bị phải đán nhãn năng lượng do Thủ tướng Chính phủ ban hành thuộc phạm vi quản lý của Bộ Công Thương hoặc các phương tiện, thiết bị dán nhãn năng lượng theo hình thức tự nguyện (sau đây gọi chung là phương tiện, thiết bi).
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này 4p dung đối với: 1. Các nhà sản xuất, nhập khẩu (sau đây gọi là doanh nghiệp) phương tiện, thiết bị dân nhấn năng lượng. 2. Các tổ chức thử nghiệm tham gia thử nghiệm phương tiện, thiết bị đán nhãn năng lượng. 3. Các cơ quan quản lý hoạt động dán nhãn năng lượng và các cơ quan, tổ chức, cá nhân có liên quan.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Thông tư này, các cụm từ đưới đây được hiểu như sau: 1, Dan nhãn năng lượng là việc dán, gắn, in, khắc nhãn nang, lượng lên sản phẩm, bao bì, hoặc hiển thị nhãn năng lượng điện tử trên sản phẩm.'
      trang_pdf: 2
    - dieu: 5
      noi_dung: 'Điều 5. Đăng ký dan nhãn năng lượng 1. Trước khi đưa phương tiện, thiết bị ra thị trường, doanh nghiệp sản xuất, nhập khẩu phương tiện, thiết bị đó phải lập 01 bộ hồ sơ đăng ký dan nhãn năng lượng và gửi về Bộ Công Thương. 2. Hồ sơ đăng ký đán nhãn năng lượng bao gồm:'
      trang_pdf: 3
    - dieu: 6
      noi_dung: Điều 6. Dán nhãn năng lượng 1. Sau khi nộp hồ sơ đăng ký dán nhãn năng lượng đến Bộ Công Thương, doanh nghiệp được tự thực hiện việc đán nhãn nang lượng phù hợp với thông tin trong Giấy công bố dán nhãn năng lượng cho sản phẩm đã đăng ký. Doanh nghiệp phải chịu trách nhiệm về tính chính xác, trung thực đối với các thông tin đã công bố trong Giấy công bố đán nhãn năng lượng và thông tin biển thị trên nhãn năng lượng.
      trang_pdf: 4
    - dieu: 7
      noi_dung: 'Điều 7. Đăng ký dán nhãn năng lượng lại 1. Doanh nghiệp phải đăng ký dán nhãn năng lượng lại khi thuộc một trong các trường hợp sau đây: a) Tiêu chuẩn đánh giá thay đổi; b) Phương tiện, thiết bị đã được đăng ký dán nhãn năng lượng có những thay đổi về mức tiêu thụ năng lượng. 2. Nội dung và thủ tục đăng ký dán nhãn năng lượng lại được thực hiện theo quy định tại Điều 5 Thông tư này. Chương HI KIEM TRA, GIÁM SAT, THU HOI NHAN NANG LUQNG'
      trang_pdf: 5
    - dieu: 9
      noi_dung: Điều 9. Khiếu nại và giải quyết khiếu nại 1. Tổ chức, cá nhân có thể gửi khiếu nại về việc dán nhãn năng lượng đến Bộ Công Thương để giải quyết theo pháp luật về khiếu nại. 2. Phương tiện, thiết bị dán nhãn năng lượng có khiếu nại được lưu mẫu và kiểm tra bởi tổ chức thử nghiệm độc lập.
      trang_pdf: 5
    - dieu: 10
      noi_dung: 'Điều 10. Thu hồi nhãn năng lượng 1. Bộ Công Thương quyết định thu hồi nhãn năng lượng trong các trường hợp sau: a) Mẫu nhãn năng lượng có thông tin sai lệch so với mẫu dự kiến tại hỗ sơ đăng ký dán nhãn năng lượng; b) Mức tiêu thụ năng lượng của phương tiện thiết bị cao hơn so với mức tiêu thụ năng lượng tại Giấy công bố đán nhãn năng lượng.'
      trang_pdf: 6
    - dieu: 12
      noi_dung: Điều 12. Trách nhiệm của Sở Công Thương 1. Thanh tra, kiểm tra, giám sát trên địa bàn, việc thực hiện đán nhãn năng lượng đối với các doanh nghiệp sản xuất, nhập khẩu, phân phối phương tiện, thiết bị thuộc Danh mục phương tiện, thiết bị phải dán nhãn năng lượng.
      trang_pdf: 7
    - dieu: 14
      noi_dung: 'Điều 14. Hiệu lực thi hành 1. Thông tư này có hiệu lực từ ngày tháng ##năm 2017 và thay thé Thông tư sô 07/2012/TT-BCT ngày 04 tháng 4 năm 2012 của Bộ Công Thương quy định dan nhãn năng lượng cho các phương tiện và thiết bị sử dụng năng lượng (sau đây gọi tắt là Thông tư số 07).'
      trang_pdf: 7
ghi_chu: Thông tư quy định trình tự, thủ tục đăng ký và dán nhãn năng lượng đối với phương tiện, thiết bị sử dụng năng lượng thuộc phạm vi quản lý của Bộ Công Thương.
