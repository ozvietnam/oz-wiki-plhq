  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=188835) và toàn văn PDF ký số (36-bct.signed.pdf): ban hành 28-12-2016, có hiệu lực từ 10-02-2017; đang còn hiệu lực.'
