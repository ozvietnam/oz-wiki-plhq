xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF hợp nhất 27 trang trên Cổng Cục Bảo vệ thực vật (ppd.gov.vn, có lớp chữ đầy đủ, lưu tại raw/download/ppd.gov.vn/19-vbhn-bnnptnt.pdf), thẻ Văn phòng SPS Việt Nam (spsvietnam.gov.vn/19vbhn-bnnptnt) và các Thông tư thành phần bậc A trên vanban.chinhphu.vn (33/2014/TT-BNNPTNT docid=177307; 03/2024/TT-BNNPTNT docid=210131): số hiệu 19/VBHN-BNNPTNT năm 2024, trích yếu "Thông tư quy định trình tự, thủ tục kiểm dịch thực vật nhập khẩu, xuất khẩu, quá cảnh và sau nhập khẩu vật thể thuộc diện kiểm dịch thực vật", Thứ trưởng Hoàng Trung ký xác thực ngày 27-05-2024; hợp nhất Thông tư 33/2014/TT-BNNPTNT ngày 30-10-2014 (có hiệu lực từ 01-01-2015), Thông tư 34/2018/TT-BNNPTNT ngày 16-11-2018 (có hiệu lực từ 01-01-2019), Thông tư 15/2021/TT-BNNPTNT ngày 06-12-2021 (có hiệu lực từ 21-01-2022) và Thông tư 03/2024/TT-BNNPTNT ngày 01-04-2024 (có hiệu lực từ 16-05-2024, bãi bỏ khoản 3 Điều 1, Điều 7b, Điều 18a, Điều 18b và Phụ lục Ib). Cấu trúc gồm 6 Chương, 21 Điều và các Phụ lục I, Ia, II, IIa, III, IV, V, VI (Phụ lục Ib đã được bãi bỏ). Hết hiệu lực một phần do các quy định thuộc Thông tư 33/2014/TT-BNNPTNT và 15/2021/TT-BNNPTNT tiếp tục được sửa đổi, bổ sung bởi Thông tư 12/2025/TT-BNNMT ngày 19-06-2025 và Điều 22 Thông tư 07/2026/TT-BNNMT ngày 23-01-2026.'
