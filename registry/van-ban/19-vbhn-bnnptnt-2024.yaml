ghi_chu: 'Ghi rõ năm ban hành 2024 tại so_hieu (19/VBHN-BNNPTNT/2024) và so_hieu_khac để phân biệt với tệp 19-vbhn-bnnptnt.yaml đã có sẵn trong sổ (vốn đang gắn với docid=207302 trên vanban.chinhphu.vn là Văn bản hợp nhất 19/VBHN-BNNPTNT ngày 30-12-2022 về quản lý giống thủy sản, thức ăn thủy sản). Toàn văn bản hợp nhất ngày 27-05-2024 được nạp tại raw/download/ppd.gov.vn/19-vbhn-bnnptnt.pdf.'
