ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành Tem điện tử rượu nhập khẩu từ ngày 10-03-2026 (mẫu RT30 ký hiệu BA/2025 cho rượu NK độ cồn >=30 độ: 4.300.000 chiếc từ 0000001 đến 4300000; mẫu RD30 ký hiệu AB/2025 cho rượu NK độ cồn <30 độ: 5.000.000 chiếc từ 0000001 đến 5000000; đồng giá bán 868 đồng/chiếc). Chưa gắn quan_he tới 23/2021/TT-BTC, 31/2025/TT-BTC và 1887/QĐ-CHQ/2025 vì chưa có trong sổ (tránh điểm mù Cao).'
