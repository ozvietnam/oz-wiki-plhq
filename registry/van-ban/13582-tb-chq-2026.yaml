  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/12/VB_13582.pdf, id=102804, SHA-256 360f836f3f83eb1452f48519d0afac56b4bd174eed5fad420bd25a62e6eaa5b6): Thông báo số 13582/TB-CHQ ngày 10-03-2026 của Cục Hải quan (ký số 10/03/2026 16:39:57 +07:00) về việc phát hành Tem điện tử rượu nhập khẩu từ ngày 10-03-2026 (căn cứ Thông tư 23/2021/TT-BTC ngày 30-03-2021, Thông tư 31/2025/TT-BTC ngày 31-05-2025 của Bộ trưởng Bộ Tài chính và Quyết định 1887/QĐ-CHQ ngày 25-11-2025 của Cục trưởng Cục Hải quan): (1) Tem điện tử rượu nhập khẩu độ cồn >=30 độ: ký hiệu mẫu RT30, ký hiệu tem BA/2025, số lượng 4.300.000 chiếc (từ số 0000001 đến số 4300000), giá bán 868 đồng/chiếc, ngày bắt đầu sử dụng 10/3/2026; (2) Tem điện tử rượu nhập khẩu độ cồn <30 độ: ký hiệu mẫu RD30, ký hiệu tem AB/2025, số lượng 5.000.000 chiếc (từ số 0000001 đến số 5000000), giá bán 868 đồng/chiếc, ngày bắt đầu sử dụng 10/3/2026; người ký Trịnh Văn Nhuận (TL. Cục trưởng, Trưởng ban Tài vụ - Quản trị)'
  hieu_luc_da_doi_chieu: true
