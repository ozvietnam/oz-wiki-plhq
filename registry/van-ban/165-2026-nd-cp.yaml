xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=218169) và toàn văn PDF ký số 140 trang ngày 15-05-2026 bởi Phó Thủ tướng Phạm Thị Thanh Trà (165-ndcp.signed.pdf): quy định chi tiết và hướng dẫn thi hành một số điều của Luật Phòng bệnh (bao gồm quy định về kiểm dịch y tế biên giới đối với người, phương tiện vận tải, hàng hóa xuất khẩu, nhập khẩu, quá cảnh); Điều 94 quy định có hiệu lực thi hành từ ngày 01-07-2026 (riêng Điều 49 và khoản 3 Điều 60 có hiệu lực từ 01-07-2027; các điều 66, 67, 68 có hiệu lực từ 01-01-2028); đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định chỉ tiết Điều 14, điểm b khoản 5 Điều 15, điểm d khoản 1 Điều 16, Điều 19, Điều 20, khoản 5 Điều 22, khoản 4 Điều 23, Điều 24, Điều 25, khoản 3 Điều 27, khoản 5 Điều 30, khoán 6 Điều 31, khoản 4 Điều 32, khoản 4 Điều 34, khoản 3 Điều 35, Điều 40, khoán 2 Điều 41, khoản 7 Điều 43 của Luật Phòng bệnh và biện pháp dé t6 chức, hướng dẫn thi hành Luật Phong bệnh về tổ chức kiểm dịch y tễ, yêu cầu kỹ
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Giải thích từ ngữ 1. Kiểm dịch viên y tế là người thực hiện các hoạt động kiểm dịch y tế thuộc to chức kiêm dịch y tê. 2. Mẫu bệnh phẩm là các mẫu từ người có chứa hoặc có khả năng chứa tác nhân gây bệnh truyền nhiễm cho người; các chủng vi sinh vật, vật liệu di truyền của vi sinh vật và mẫu khác có chứa hoặc có khả năng chứa tác nhân gây bệnh truyền nhiễm cho người.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Tư vấn, truyền thông, giáo duc sức khỏe 1. Nội dung tư vấn, truyền thông, giáo dục sức khỏe: a) Các biện pháp dự phòng thương tích; b) Tăng cường hoạt động thể lực, dinh dưỡng hợp lý, lối sống lành mạnh, nâng cao sức khỏe; c) Phòng, chống bệnh, tật học đường; d) Phòng, chống dịch bệnh truyền nhiễm, vệ sinh cá nhân, vệ sinh môi trường, ứng phó với các tình huống khẩn cấp về dịch bệnh và các bệnh lây truyền qua đường tình dục;'
      trang_pdf: 2
    - dieu: 14
      noi_dung: 'Điều 14. Đối tượng, thời gian, hình thức, thẩm quyền quyết định áp dụng biện pháp cách ly y tế 1. Đối tượng cách ly y tế: Người mắc bệnh truyền nhiễm, người bị nghi ngờ mắc bệnh truyền nhiễm, người mang mầm bệnh truyền nhiễm, người tiếp xúc với tác nhân gây bệnh truyền nhiễm thuộc nhóm A và một số bệnh truyền nhiễm thuộc nhóm B theo danh mục quy định tại Phụ lục II ban hành kèm theo Nghị định này phải được cách ly y tế.'
      trang_pdf: 11
    - dieu: 23
      noi_dung: Điều 23. Quan sát y tế đối với người nhập cảnh, xuất cảnh, quá cảnh 1. Kiểm dịch viên y tế thực hiện việc quan sát trực tiếp, gián tiếp và theo dõi tình trạng sức khỏe, thân nhiệt bằng thiết bị giám sát y tế đối với người nhập cảnh, xuất cảnh, quá cảnh để phát hiện các trường hợp nghi ngờ mac bệnh truyền nhiễm. 2. Trường hợp phát hiện các trường hợp nghi ngờ mắc bệnh truyền nhiễm, kiểm dịch viên y tế thực hiện kiểm tra thực tế.
      trang_pdf: 17
    - dieu: 32
      noi_dung: 'Điều 32. Thu thập thông tin và khai báo y tế đối với hàng hóa 1. Đối tượng phải thu thập thông tin và khai báo y tế:'
      trang_pdf: 23
    - dieu: 41
      noi_dung: Điều 41. Thu thập thông tin và khai báo y tế đối với mẫu bệnh phẩm, mô, bộ phận cơ thé người Khai báo, nộp thông tin khai báo y tế đối với mẫu bệnh phẩm, mô, bộ phận co thé người theo Mau sô 13 Phu lục V ban hành kèm theo Nghị định này cho tổ chức kiểm dịch y tế.
      trang_pdf: 27
    - dieu: 50
      noi_dung: 'Điều 50. Các trường hợp được bồi thường khi sử dụng vắc xin, sinh phẩm trong Chương trình tiêm chủng mở rộng, tiêm chủng chong dich 1. Các đối tượng thuộc diện tiêm chúng bắt buộc theo quy định tại khoản 1 Diéu 48 Nghi dinh này phải tham- gia tiêm chủng, néu xảy ra tai biến ảnh hưởng nghiêm trọng đến sức khỏe hoặc tính mang thì được Nhà nước bồi thường. | 2. Các trường hợp được Nhà nước bồi thường theo quy định tại khoản 1 Điều này bao gồm: |'
      trang_pdf: 36
    - dieu: 59
      noi_dung: 'Điều 59. Phân loại vi sinh vật gây bệnh truyền nhiễm theo nhóm nguy cơ 1. Vi sinh vật có nguy cơ gây bệnh truyền nhiễm cho người được chia thành 04 nhóm: a) Nhóm 1 là nhóm chưa hoặc ít có nguy cơ lây nhiễm cho cá nhân và cộng đồng bao gồm các loại vi sinh vật chưa phát hiện thấy khả năng gây bệnh cho người;'
      trang_pdf: 42
    - dieu: 69
      noi_dung: 'Điều 69. Phạm vi và đối tượng khám sức khỏe định kỳ, khám sàng lọc miễn phí 1. Pham vi nội dung chuyên môn (danh mục dịch vụ) khám sức khỏe định kỳ, khám sàng lọc miễn phí theo hướng dan chuyên môn của Bộ trưởng Bộ Y tê. 2. . Đối tượng được hưởng chính sách khám sức khỏe định kỳ, khám sàng lọc miễn phí ít nhất mỗi năm một lần gồm:'
      trang_pdf: 47
ghi_chu: Quy định chi tiết và hướng dẫn thi hành Luật Phòng bệnh (bao gồm kiểm dịch y tế đối với hàng hóa XNK, quá cảnh) — ban hành 15-05-2026, có hiệu lực từ 01-07-2026.
