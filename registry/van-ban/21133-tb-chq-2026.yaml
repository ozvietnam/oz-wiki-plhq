ghi_chu: 'Xác định trước mã số mặt hàng Module nguồn (Power Module) sử dụng trong hệ thống cung cấp nguồn chuyên dụng chỉ dùng riêng cho máy chủ (bản mạch PCB FR-4 10 lớp, kích thước 22 x 24 x 11,8 mm, trọng lượng 19 g, chuyển đổi điện áp một chiều DC 40-60 VDC sang điện áp một chiều DC 3,85 VDC, dòng tối đa 140 A, công suất tối đa 532 W) thuộc nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.19.'
