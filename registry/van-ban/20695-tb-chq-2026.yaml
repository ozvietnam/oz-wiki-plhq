  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_20695.pdf, id=105996, SHA-256 6e007c8f3a4a0ef250102062f09072f8ead166d7789e9c900747399ef25ab541): Thông báo số 20695/TB-CHQ ngày 20-08-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 20695/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Hạt nhựa tái sinh Polycarbonate MJ-314, dạng nguyên sinh, dạng hạt (Pellet, thành phần 100% Polycarbonate, CAS 25971-63-5, nhiệt độ nóng chảy > 240 độ C, tỷ trọng ~ 1.2 g/m3, không tan trong nước, đóng bao 25 kg/bao, sản xuất bằng quá trình tái chế từ phế liệu nhựa qua thu gom, nghiền nát, rửa phân tách trọng lượng riêng, sấy khô, ép đùn và cắt thành hạt đồng nhất, nhà sản xuất MJ Material Technology Sdn. Bhd, dùng để trộn với hạt nhựa nguyên sinh màu tự nhiên, bột màu và chất phụ gia tạo hạt nhựa màu dạng nguyên sinh phục vụ sản xuất linh kiện máy in), phân loại vào nhóm 39.07, mã số 3907.40.00 ("- Các polycarbonat"); có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Hạt nhựa tái sinh Polycarbonate ký mã hiệu MJ-314, dạng nguyên sinh, dạng hạt (100% Polycarbonate, CAS 25971-63-5, đóng bao 25 kg/bao, tái chế từ phế liệu nhựa qua nghiền, rửa, sấy, ép đùn và cắt hạt đồng nhất, dùng phối trộn sản xuất linh kiện máy in) thuộc nhóm 39.07, mã số 3907.40.00.'
