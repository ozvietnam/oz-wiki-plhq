  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về hành vi vi phạm hành chính, hình thức xử phạt, mức xử phạt, biện pháp khắc phục hậu quả, thẩm quyền lập biên bản vi phạm hành chính, thấm quyền xử phạt vi phạm hành chính trong hoạt động thương mại, sản xuất, buôn bán hang gia, hàng cắm và bảo vệ quyền lợi người tiêu dùng.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng bị xử phạt hành chính 1. Cá nhân, tổ chức Việt Nam hoặc cá nhân, tổ chức nước ngoài thực hiện hành vi vi phạm hành chính quy định tại Nghị định này trên lãnh thé Việt Nam.
      trang_pdf: 3
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Theo Nghị định này, các từ ngữ đưới đây được hiểu như sau: 1. “Sản xuất” là việc thực hiện một, một số hoặc tất cả các hoạt động chế tạo, chế bản, in, gia công, đặt hàng, sơ chế, chế biến, chiết xuất, tái chế, lắp ráp, pha trộn, san chia, sang chiết, nạp, đóng gói và hoạt động khác làm ra hàng hóa.'
      trang_pdf: 3
    - dieu: 16
      noi_dung: 'Điều 16. Hành vi vi phạm về kinh doanh hàng hóa bị áp dụng biện pháp khan cấp 1. Phạt cảnh cáo hoặc phạt tiền từ 200.000 đồng đến 400.000 đồng đối với một trong các hành vi vi phạm sau đây trong trường hợp hàng hóa vi phạm có giá trị dudi 1.000.000 dong:'
      trang_pdf: 24
    - dieu: 28
      noi_dung: 'Điều 28. Hành vi vi phạm về dán tem rượu sản xuất để tiêu thụ trong nước 1. Đối với hành vi kinh doanh rượu sản xuất trong nước có độ cén từ 5,5 độ trở lên không dán tem rượu sản xuât đê tiêu thụ trong nước hoặc đán tem rượu sản xuất dé tiêu thụ trong nước không đúng quy định, mức phạt tiền như sau: a) Phạt cảnh cáo hoặc phạt tiền từ 200.000 đồng đến 300.000 đồng trong trường hợp hàng hóa vi phạm có giá trị dưới 1.000.000 đồng:'
      trang_pdf: 36
    - dieu: 40
      noi_dung: Điều 40. Hành vi vi phạm về tam nhập tái xuất, tam xuất tái nhập hàng hóa 1. Phạt tiền từ 5.000.000 đồng đến 10, 000.000 đồng. đối với hành vi tự ý tay xóa, sửa chữa, sửa đôi, bé sung, thay đổi nội dung giấy phép tạm nhập tái xuất, giấy phép tạm xuất tái nhập hàng hóa thuộc danh mục hàng hóa cấm xuất khẩu, cấm nhập khẩu, tạm ngừng xuất khâu, tạm ngừng nhập khẩu.
      trang_pdf: 51
    - dieu: 53
      noi_dung: 'Điều 53. Hành vi vi phạm về hợp đồng giao kết từ xa 1. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi giao kết hợp đồng từ xa với người tiêu dùng đối với một trong các trường hợp sau đây: a) Không cung cấp đầy đủ, rõ ràng các thông tin theo quy định;'
      trang_pdf: 61
    - dieu: 65
      noi_dung: 'Điều 65. Hành vi vi phạm về bảo vệ thông tin cá nhân trong hoạt động thương mại điện tử 1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi vi phạm sau đây: , 3) Xây dựng chính sách bảo vệ thông tin cá nhân không đúng quy định; b) Không hiển thị công khai cho người tiêu dùng chính sách bảo vệ thông tin cá nhân tại vị tri dé thay trên website thương mại điện tử.'
      trang_pdf: 76
    - dieu: 77
      noi_dung: Điều 77. Hành vi vi phạm về mua bán hàng hóa qua sở giao dịch hàng hóa 1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với hành vi của nhân viên của sở giao dịch hàng hóa thực hiện việc môi giới mua bán hàng hóa qua sở giao dịch hàng hóa.
      trang_pdf: 96
    - dieu: 90
      noi_dung: Điều 90. Điều khoản chuyển tiếp Đối với hành vị vi phạm hành chính trong hoạt động thương mại, sản xuất, buôn bán hàng gia, hàng cấm và bảo vệ quyền lợi người tiêu dùng xây ra trước ngày Nghị định này có hiệu lực, sau đó mới bị phát hiện hoặc đang xem xét, giải quyết mà Nghị định này không quy định trách nhiệm pháp lý hoặc quy định trách nhiệm pháp lý nhẹ hơn thì áp dụng các quy định của Nghị định này.
      trang_pdf: 113
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK trực tiếp: chế tài xử phạt buôn bán hàng cấm (gồm hàng cấm xuất nhập khẩu), hàng giả, hàng nhập lậu lưu thông nội địa — văn bản xử phạt lõi của mảng chống buôn lậu thương mại.'
