  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=200841): số hiệu, tên văn bản, cơ quan Chính phủ (ký Nguyễn Xuân Phúc), ngày ban hành 26-08-2020, có hiệu lực từ 15-10-2020; đối chiếu còn hiệu lực (đã được sửa đổi, bổ sung bởi NĐ 17/2022/NĐ-CP, NĐ 96/2023/NĐ-CP, NĐ 24/2025/NĐ-CP và hợp nhất tại 03/VBHN-BCT năm 2025)'
  hieu_luc_da_doi_chieu: true
