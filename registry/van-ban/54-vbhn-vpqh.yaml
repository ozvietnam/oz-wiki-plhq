  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định quản lý nhà nước về hải quan đối với hàng hóa được xuất khẩu, nhập khẩu, quá cảnh, phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh của tổ chức, cá nhân trong nước và nước ngoài trong lãnh thổ hải quan; về tổ chức và hoạt động của Hải quan.
      trang_pdf: 3
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Tổ chức, cá nhân thực hiện xuất khẩu, nhập khẩu, quá cảnh hàng hóa, xuất cảnh, nhập cảnh, quá cảnh phương tiện vận tải. 2. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hoạt động xuất khẩu, nhập khẩu, quá cảnh hàng hóa, xuất cảnh, nhập cảnh, quá cảnh phương tiện vận tải. 3. Cơ quan hải quan, công chức hải quan. 4. Cơ quan khác của Nhà nước trong việc phối hợp quản lý nhà nước về hải quan.
      trang_pdf: 3
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 3
      noi_dung: Điều 3. Chính sách về hải quan 1. Nhà nước Việt Nam tạo điều kiện thuận lợi về hải quan đối với hoạt động xuất khẩu, nhập khẩu, xuất cảnh, nhập cảnh, quá cảnh lãnh thổ Việt Nam. 2. Xây dựng Hải quan Việt Nam trong sạch, vững mạnh, chuyên nghiệp, hiện đại, hoạt động minh bạch, hiệu lực, hiệu quả.
      trang_pdf: 3
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 15
      noi_dung: Điều 15. Công chức hải quan 1. Công chức hải quan là người có đủ điều kiện được tuyển dụng, bổ nhiệm
      trang_pdf: 8
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 26
      noi_dung: Điều 26. Phân loại hàng hóa 1. Phân loại hàng hóa để xác định mã số hàng hóa làm cơ sở tính thuế và thực hiện chính sách quản lý hàng hóa. Khi phân loại hàng hóa phải căn cứ hồ sơ hải quan, tài liệu kỹ thuật và các thông tin khác có liên quan đến hàng hóa xuất khẩu, nhập khẩu để xác định tên gọi, mã số của hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.
      trang_pdf: 15
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 37
      noi_dung: Điều 37. Thông quan hàng hóa 1. Hàng hóa được thông quan sau khi đã hoàn thành thủ tục hải quan. 2. Trường hợp người khai hải quan đã hoàn thành thủ tục hải quan nhưng chưa nộp, nộp chưa đủ số thuế phải nộp trong thời hạn quy định thì hàng hóa được thông quan khi được tổ chức tín dụng bảo lãnh về số tiền thuế phải nộp hoặc được áp dụng thời hạn nộp thuế theo quy định của pháp luật về thuế.
      trang_pdf: 21
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 48
      noi_dung: 'Điều 48. Kiểm tra, giám sát hải quan đối với hàng hóa tạm nhập khẩu, tạm xuất khẩu 1. Các loại hàng hóa tạm nhập khẩu, tạm xuất khẩu bao gồm: a) Phương tiện quay vòng để chứa hàng hóa; b) Máy móc, thiết bị, dụng cụ nghề nghiệp để phục vụ công việc trong thời hạn nhất định; c) Máy móc, thiết bị, phương tiện thi công, khuôn, mẫu theo các hợp đồng thuê, mượn để sản xuất, thi công;'
      trang_pdf: 26
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 58
      noi_dung: 'Điều 58. Kiểm tra, giám sát hải quan, xử lý hàng hóa tồn đọng 1. Hàng hóa tồn đọng được lưu giữ tại khu vực cảng, kho, bãi thuộc địa bàn hoạt động hải quan bao gồm: a) Hàng hóa mà chủ hàng hóa tuyên bố từ bỏ hoặc thực hiện hành vi chứng tỏ việc từ bỏ.'
      trang_pdf: 30
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 69
      noi_dung: Điều 69. Thủ tục hải quan đối với phương tiện vận tải 1. Khi làm thủ tục hải quan đối với phương tiện vận tải, chủ phương tiện vận
      trang_pdf: 35
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 80
      noi_dung: 'Điều 80. Kiểm tra sau thông quan tại trụ sở người khai hải quan 1. Thẩm quyền quyết định kiểm tra sau thông quan: a) Tổng cục trưởng Tổng cục Hải quan, Cục trưởng Cục Kiểm tra sau thông quan quyết định kiểm tra sau thông quan trong phạm vi toàn quốc; b) Cục trưởng Cục Hải quan quyết định kiểm tra sau thông quan trong địa bàn quản lý của Cục.'
      trang_pdf: 41
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 91
      noi_dung: 'Điều 91. Quyền và nghĩa vụ của tổ chức và cá nhân liên quan trong phòng, chống buôn lậu, vận chuyển trái phép hàng hóa qua biên giới 1. Trong việc phòng, chống buôn lậu, vận chuyển trái phép hàng hóa qua biên giới, tổ chức và cá nhân liên quan có quyền: a) Cung cấp các thông tin, hồ sơ tài liệu và chứng cứ liên quan đến vụ việc vi phạm cho cơ quan hải quan; đề nghị cơ quan hải quan trưng cầu giám định để bảo vệ quyền, lợi ích hợp pháp của mình;'
      trang_pdf: 48
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
    - dieu: 103
      noi_dung: Điều 103. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2015. Luật Hải quan số 29/2001/QH10 và Luật số 42/2005/QH11 sửa đổi, bổ sung một số điều của Luật Hải quan hết hiệu lực kể từ ngày Luật này có hiệu lực.
      trang_pdf: 55
      sha256_pdf: b6229859bd35a7dc04446a7f184fed92ce447e0d72aa306fc509d5d455f58783
