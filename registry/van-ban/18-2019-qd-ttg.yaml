xac_minh:
  muc: NGUON_B
  pham_vi: 'Số hiệu, tên, cơ quan (Thủ tướng Chính phủ), ngày ban hành 19/04/2019, ngày hiệu lực 15/06/2019 (Điều 17) xác minh trên Vietnam Trade Portal (cổng chính thức Bộ Công Thương) và toàn văn bản tiếng Anh tại Luật Việt Nam (ký bởi Phó Thủ tướng Trịnh Đình Dũng thay Thủ tướng). Thay thế Thông tư 23/2015/TT-BKHCN (có quy định chuyển tiếp tại Điều 16). Tình trạng còn hiệu lực đến 2026 cùng các văn bản sửa đổi (QĐ 28/2022/QĐ-TTg ngày 21/12/2022; QĐ 02/2026/QĐ-TTg sửa Điều 9; Tổng cục Hải quan vẫn viện dẫn qua Công văn 37951/CHQ-GSQL 2025) theo nguồn thứ cấp — chưa đối chiếu trực tiếp trên vbpl.vn.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK trực tiếp: máy móc, thiết bị, dây chuyền công nghệ đã qua sử dụng nhập khẩu theo mã HS Chương 84, 85 phải đáp ứng tiêu chuẩn, hồ sơ, trình tự kiểm tra và lấy mẫu theo QĐ này trước khi thông quan — khách XNK tra nhiều khi nhập dây chuyền sản xuất second-hand.'
