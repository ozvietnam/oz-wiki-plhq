ghi_chu: 'Hướng dẫn kê khai mã thuế chống bán phá giá tạm thời trên hệ thống VNACCS (từ mã G200 đến G207 và mã GK chỉ tiêu 1.95) theo Quyết định số 2491/QĐ-BCT ngày 05/09/2025 của Bộ Công Thương đối với sản phẩm ván sợi gỗ (HS 4411.12.00, 4411.13.00, 4411.14.00, 4411.92.00, 4411.93.00, 4411.94.00) xuất xứ Thái Lan và Trung Quốc.'
