  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/12/VBDI_23606.pdf, id=101280, SHA-256 f1cb7f547da812b7e4bdeca604c47e579b1f67fc347451191ec965404436d750): Công văn hỏa tốc số 23606/CHQ-NVTHQ ngày 11-09-2025 của Cục Hải quan hướng dẫn các Chi cục Hải quan khu vực thực hiện Quyết định số 2491/QĐ-BCT ngày 05-09-2025 của Bộ trưởng Bộ Công Thương về việc áp dụng thuế chống bán phá giá tạm thời đối với một số sản phẩm ván sợi gỗ có xuất xứ từ Vương quốc Thái Lan và Cộng hòa nhân dân Trung Hoa (mã vụ việc AD21; mã khai báo thuế chống bán phá giá trên hệ thống VNACCS từ G200 đến G207, trong đó G201 áp mức 39,88% đối với hàng xuất xứ Trung Quốc không có/không khớp Giấy chứng nhận nhà sản xuất, G206 áp mức 20,20% đối với hàng xuất xứ Thái Lan không có/không khớp Giấy chứng nhận nhà sản xuất); hết hiệu lực từ ngày 18-01-2026 cùng thời hạn 120 ngày của Quyết định 2491/QĐ-BCT'
