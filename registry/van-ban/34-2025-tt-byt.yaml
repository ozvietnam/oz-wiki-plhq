      noi_dung: Điều 6. Trách nhiệm thi hành 1. Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương có trách nhiệm chỉ đạo cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh triển khai thực hiện việc giải quyết thủ tục hành chính cấp số tiếp nhận Phiếu công bố sản phẩm mỹ phẩm đối với mỹ phẩm sản xuất trong nước và phê duyệt Đơn hàng nhập khẩu mỹ phẩm dùng cho nghiên cứu, kiểm nghiệm quy định tại Thông tư này theo hình thức trực tuyến.
