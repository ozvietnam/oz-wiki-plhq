  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=214428), toàn văn PDF đính kèm (34-byt.pdf, Thứ trưởng Đỗ Xuân Tuyên ký) và CSDL quốc gia vbpl.vn (ItemID=181191): ban hành 03-07-2025, có hiệu lực từ 18-08-2025 theo Điều 3; sửa đổi, bổ sung một số điều và biểu mẫu của Thông tư 06/2011/TT-BYT về quản lý mỹ phẩm (đã được hợp nhất tại 09/VBHN-BYT ngày 25-07-2025); đang còn hiệu lực.'
