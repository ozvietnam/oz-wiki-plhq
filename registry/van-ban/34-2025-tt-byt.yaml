ghi_chu: 'Sửa mới nhất TT 06/2011 (hiệu lực 18/8/2025 — đối chiếu nguyên văn VBHN 09/VBHN-BYT + medgate.vn): hồ sơ công bố trực tuyến + chữ ký điện tử, không bắt buộc dấu hộ kinh doanh, chuẩn hoá ghi thành phần/công thức, rút ngắn quy trình phản hồi. Kèm QĐ 2393/QĐ-BYT công bố TTHC sửa đổi.'
