      noi_dung: Điều 2. Thay thế một số cụm từ của Thông tư số 06/2011/TT-BYT 1. Thay thế cụm từ “Sở Y tế” bằng cụm từ “cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh” tại điểm b khoản 1 Điều 7. 2. Thay thế cụm từ “Sở Y tế Hà Nội” bằng cụm từ “cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân thành phố Hà Nội” tại Điều 8 và Phụ lục số 11MP ban hành kèm theo Thông tư số 06/2011/TT-BYT.
