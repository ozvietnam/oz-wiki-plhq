ghi_chu: 'Theo LuatVietnam (bậc B), CV 17552/CHQ-GSQL ngày 16-06-2026 của Cục Hải quan, Phần III điểm 1, "thay thế các nội dung hướng dẫn về việc kiểm tra, giám sát về xuất xứ hàng hóa, ghi nhãn hàng hóa ..." tại CV 5189/TCHQ-GSQL, Chỉ thị 7988/CT-TCHQ, CV 755/TCHQ-GSQL và CV 571/CHQ-GSQL. Chưa rõ mục 1 (khai ô mô tả hàng hóa) của CV 755 có nằm trong phạm vi bị thay không, nên để CHUA_XAC_MINH; không ghi quan_he cho tới khi đọc được nguồn A. Toàn văn trong kho chỉ là trích đoạn (không phải PDF gốc).'
