ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị theo dõi đa chức năng (Tive Solo 5G, ký mã hiệu TT-7000, tích hợp định vị GPS/Cell Tower/WiFi Sniffing, cảm biến môi trường nhiệt độ/độ ẩm/ánh sáng/va chạm và truyền dữ liệu thời gian thực qua 5G/LTE eSIM dùng giám sát vận chuyển hàng hóa) thuộc nhóm 85.26, phân nhóm 8526.91, mã số 8526.91.90.'
