  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/22/VB_20639.pdf, id=105541, SHA-256 48bf5763c57dc237710efbdbafc886d5bf7c52e2e3f655ba02fbedb9e6144cee): Thông báo số 20639/TB-CHQ ngày 20-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị theo dõi đa chức năng (tên thương mại Tive Solo 5G, ký mã hiệu TT-7000; kích thước 118,15 x 57,15 x 20 mm, điện áp 3,6V, khối lượng 0,1635 kg; cấu tạo gồm vỏ bảo vệ nhựa ABS/PC, bộ vi xử lý và bo mạch chính PCBA, mô-đun định vị đa chế độ GPS / trạm phát sóng di động Cell Tower / WiFi Sniffing, mô-đun truyền tin 5G/LTE hỗ trợ eSIM, mô-đun WiFi, hệ thống cảm biến môi trường nhiệt độ/độ ẩm/ánh sáng/gia tốc 3 trục, ăng-ten tích hợp và pin sạc Lithium-ion; dùng theo dõi vị trí và giám sát điều kiện bảo quản hàng hóa theo thời gian thực qua nền tảng đám mây trong vận chuyển và bảo quản hàng hóa), phân loại vào nhóm 85.26, phân nhóm 8526.91, mã số 8526.91.90; có hiệu lực từ ngày ký'
