ghi_chu: 'Nạp từ điểm mù CAO (OZV-560) — sửa đổi, bổ sung Nghị định 98/2021/NĐ-CP về thử nghiệm lâm sàng thiết bị y tế (Điều 12–20), thành phần hồ sơ đề nghị cấp mới số lưu hành thiết bị y tế (Điều 30, áp dụng từ 01/01/2026) và cơ chế ưu tiên xử lý hồ sơ đăng ký lưu hành thiết bị y tế bao gồm thiết bị y tế nhập khẩu (Điều 32a); đồng thời chuyển quan hệ sua_doi từ 98-2021-nd-cp.yaml về đúng chiều đi tại phiếu 96-2023-nd-cp.yaml. Khoản 3 và khoản 22 Điều 147 còn thay thế Nghị định 109/2016/NĐ-CP và Nghị định 102/2011/NĐ-CP (hành nghề và bảo hiểm trách nhiệm khám chữa bệnh nội địa, chưa đưa vào quan_he.thay_the vì nằm ngoài phạm vi sổ XNK).'
