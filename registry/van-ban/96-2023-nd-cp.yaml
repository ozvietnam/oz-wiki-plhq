xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn (9 Chương, 148 Điều + Phụ lục) trên vanban.chinhphu.vn (docid=209491, bản ký số 96-nd.signed.pdf do Phó Thủ tướng Trần Hồng Hà ký) và CSDLQG vbpl.vn (ID 168128): số hiệu 96/2023/NĐ-CP, ngày ban hành 30/12/2023, khoản 1 Điều 147 hiệu lực từ 01/01/2024; các khoản 8–17 và 19–21 Điều 147 sửa đổi, bổ sung một số điều của Nghị định 98/2021/NĐ-CP về thử nghiệm lâm sàng và ưu tiên xử lý hồ sơ đăng ký lưu hành thiết bị y tế (khoản 19 sửa đổi Điều 30 bắt đầu áp dụng từ 01/01/2026); khoản 3 và khoản 22 Điều 147 bãi bỏ Điều 11 Nghị định 155/2018/NĐ-CP và thay thế Nghị định 109/2016/NĐ-CP, Nghị định 102/2011/NĐ-CP'
  hieu_luc_da_doi_chieu: true
