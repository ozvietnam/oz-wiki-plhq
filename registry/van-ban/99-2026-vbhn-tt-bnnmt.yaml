xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=220052) và toàn văn PDF ký số ngày 20-10-2026 bởi Thứ trưởng Bộ Nông nghiệp và Môi trường Nguyễn Hoàng Hiệp (99-vbhn-bnnmt.signed.pdf): hợp nhất Thông tư 20/2021/TT-BNNPTNT ngày 28-12-2021 (HL 11-02-2022, thay thế Thông tư 14/2012/TT-BNNPTNT; docid=204999) quy định về hồ sơ nghiệp vụ kiểm dịch thực vật với Thông tư 12/2025/TT-BNNMT ngày 19-06-2025 (HL 01-07-2025; docid=214087) quy định phân cấp, phân định thẩm quyền quản lý nhà nước trong lĩnh vực trồng trọt và bảo vệ thực vật; đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định quy cách, cách ghi, sử dụng mẫu giấy, mẫu dấu nghiệp vụ, mẫu tem niêm phong kiểm dịch thực vật; ký giấy, đóng dấu nghiệp vụ kiểm dịch thực vật.
      trang_pdf: 2
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với tổ chức, cá nhân có liên quan đến nội dung quy định tại Điều 1 Thông tư này.
      trang_pdf: 2
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 3
      noi_dung: Điều 3. Mẫu giấy, mẫu dấu nghiệp vụ và mẫu tem niêm phong kiểm dịch thực vật Ban hành kèm theo Thông tư này 06 mẫu giấy nghiệp vụ kiểm dịch thực vật tại Phụ lục I; mẫu dấu nghiệp vụ kiểm dịch thực vật tại Phụ lục II; mẫu tem niêm phong kiểm dịch thực vật tại Phụ lục III.
      trang_pdf: 2
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 4
      noi_dung: 'Điều 4. Quy cách mẫu giấy nghiệp vụ, dấu nghiệp vụ kiểm dịch thực vật 1. Quy cách mẫu giấy nghiệp vụ kiểm dịch thực vật tại Phụ lục I ban hành kèm theo Thông tư này như sau: a) Các mẫu giấy 1, 2, 3, 4, 5 và 6 thống nhất sử dụng khổ giấy A4 (210mm x 297mm); b) Các mẫu giấy nghiệp vụ số 2 và 4 được thiết kế song ngữ Việt - Anh;'
      trang_pdf: 2
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 5
      noi_dung: 'Điều 5. Cách ghi và sử dụng mẫu giấy nghiệp vụ kiểm dịch thực vật 1. Cách ghi mẫu giấy nghiệp vụ tại Phụ lục I ban hành kèm theo Thông tư này như sau: a) Tên cơ quan chủ quản: tên cơ quan chủ quản cấp trên trực tiếp; b) Tên cơ quan kiểm dịch thực vật: tên cơ quan kiểm dịch thực vật cấp giấy;'
      trang_pdf: 3
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 6
      noi_dung: Điều 6. Sử dụng dấu nghiệp vụ kiểm dịch thực vật 1. Dấu nghiệp vụ kiểm dịch thực vật được sử dụng đóng vào mục “Dấu của cơ quan” tại mẫu giấy quy định tại Phụ lục V và Phụ lục VI ban hành kèm theo Thông tư số 33/2014/TT-BNNPTNT. 2. Việc quản lý dấu nghiệp vụ kiểm dịch thực vật được thực hiện theo quy định pháp luật về công tác văn thư.
      trang_pdf: 4
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 7
      noi_dung: Điều 7. Ký giấy, đóng dấu nghiệp vụ kiểm dịch thực vật 1. Giấy chứng nhận kiểm dịch thực vật, Giấy chứng nhận kiểm dịch thực vật tái xuất khẩu quy định Phụ lục V và Phụ lục VI ban hành kèm theo Thông tư số 33/2014/TT-BNNPTNT do Lãnh đạo Chi cục Kiểm dịch thực vật vùng hoặc lãnh đạo Trạm kiểm dịch thực vật hoặc lãnh đạo Phòng thuộc Chi cục Kiểm dịch thực vật vùng ký, đóng dấu nghiệp vụ kiểm dịch thực vật.
      trang_pdf: 4
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 8
      noi_dung: Điều 8. Trách nhiệm của tổ chức, cá nhân 1. Cục Trồng trọt và Bảo vệ thực vật 3 a) Hướng dẫn, kiểm tra, đôn đốc thực hiện Thông tư này; b) Thực hiện, chỉ đạo, hướng dẫn, kiểm tra việc lập hồ sơ về kiểm dịch thực vật theo đúng các quy định của pháp luật;
      trang_pdf: 5
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
    - dieu: 9
      noi_dung: 'Điều 9. Hiệu lực thi hành6 Cụm từ “Cục Bảo vệ thực vật” được thay thế bởi cụm từ “Cục Trồng trọt và Bảo vệ thực vật” theo quy định tại Điều 29 Thông tư số 12/2025/TT-BNNMT, có hiệu lực kể từ ngày 01 tháng 07 năm 2025. 6 Điều 30, 31 và 32 Thông tư số 12/2025/TT-BNNMT, có hiệu lực kể từ ngày 01 tháng 7 năm 2025 quy định như sau: “Điều 30. Hiệu lực thi hành Thông tư này có hiệu lực kể từ ngày 01 tháng 7 năm 2025.'
      trang_pdf: 6
      sha256_pdf: 7fdd882f607a4235daa1ca53bd4d917ec2c6b734fad12c211fae0509e277fcec
ghi_chu: Hợp nhất Thông tư 20/2021/TT-BNNPTNT (quy định về hồ sơ nghiệp vụ kiểm dịch thực vật) và Thông tư 12/2025/TT-BNNMT.
