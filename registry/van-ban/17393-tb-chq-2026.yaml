  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/12/7.VB_17393.pdf, id=104673, SHA-256 c7ac25b85284325b46b5a07182fc95b9bc260dff7128b86bc0477aa36c15f9d8): Thông báo số 17393/TB-CHQ ngày 11-06-2026 của Cục Hải quan (ký số 11-06-2026, trên mục lục cổng ghi ký hiệu 17393/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Máy phủ hóa chất bảo vệ thực vật hoặc polymer dạng lỏng lên bề mặt hạt giống (SEED COATING MACHINE), ký mã hiệu RAS 1060WM (nhà sản xuất RELIANCE AUTOMATION SOLUTIONS; máy cơ khí dạng quay hoạt động bằng điện 3 pha 415V 50Hz ~5 HP, dung tích mẻ tối đa 10 kg, chu kỳ 30-40 giây, điều khiển tự động bằng PLC + HMI, bơm định lượng nhu động dẫn dung dịch xuống tâm đĩa phun xoay inox SS304 rải đều bằng lực ly tâm kết hợp quạt ly tâm tách hạt, không sấy, không gia nhiệt), phân loại vào nhóm 84.36, phân nhóm 8436.80, mã số 8436.80.11; có hiệu lực từ ngày ban hành'
