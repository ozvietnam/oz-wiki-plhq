ghi_chu: 'Xác định trước mã số mặt hàng Máy phủ hóa chất bảo vệ thực vật hoặc polymer dạng lỏng lên bề mặt hạt giống (SEED COATING MACHINE) model RAS 1060WM (máy cơ khí dạng quay hoạt động bằng điện, điều khiển tự động bằng PLC, không sấy, không gia nhiệt) thuộc nhóm 84.36, phân nhóm 8436.80, mã số 8436.80.11.'
