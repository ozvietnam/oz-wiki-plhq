xac_minh:
  muc: NGUON_A
  pham_vi: 'Đọc toàn văn 3 trang bản scan ký số trên datafiles.chinhphu.vn (OCR): số 11/2021/QĐ-TTg, Hà Nội 17/3/2021; Điều 1 kéo dài 08 QĐ + 01 văn bản của TTg (kể cả QĐ 03/2015/QĐ-TTg...) đến khi thực hiện cải cách tiền lương theo NQ 27-NQ/TW; Điều 2 hiệu lực từ ngày ký, áp dụng từ năm ngân sách 2021. Hệ thống văn bản quốc gia khớp (docid 202818). Còn thiếu: chưa thấy bằng chứng bãi bỏ, nhưng cũng chưa đối chiếu việc đã bước vào cải cách tiền lương (điều kiện đáo hạn) giai đoạn 2025-2026.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp đợt "làm tất" 6/11 (#87 P1/P2 + #209). CẢNH BÁO NHẪM: issue #87 gán "11/2021/QĐ-TTg — Kiểm tra, giám sát chuyên ngành hàng XNK" — SAI hoàn toàn; bản scan gốc xác nhận đây là QĐ tài chính (kéo dài cơ chế tài chính đặc thù). Kiểm tra chuyên ngành XNK hiện chưa từng thuộc QĐ này: khung KTCN là NĐ 85/2019/NĐ-CP (kiểm tra chuyên ngành, HL 01/01/2020) → bị NĐ 336/2026/NĐ-CP thay thế từ 15/10/2026 (Điều 48 khoản 2, đọc trực tiếp bản scan) — đây chính là "NĐ mới" thay QĐ/NĐ KTCN mà issue nghi ngờ, KHÔNG có QĐ 2026 nào tên "KTCN" mang số 11/2021. Ghi chú thêm: "38/2018/QĐ-TTg về KTCN" cũng KHÔNG thấy trên hệ thống quốc gia (0 kết quả) — chuỗi giả định 08/2016→38/2018→11/2021 không xác minh được, không ghi. Liên quan XNK: không liên quan trực tiếp; chỉ liên quan gián tiếp qua đơn vị hải quan hưởng cơ chế tài chính đặc thù được kéo dài.'
