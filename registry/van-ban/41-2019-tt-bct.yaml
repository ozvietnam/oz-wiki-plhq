  da_doi_chieu: false
  ghi_chu: 'Trích bằng máy từ bảng HTML toàn văn vbpl.vn (bản lưu raw/download/vbpl.vn/41-2019-tt-bct.html), Phụ lục I, II, IV–VIII. Theo Điều 8 chỉ giữ dòng lá của cây biểu thuế (dòng cha 4/6 số có dòng con chi tiết hơn bị bỏ để không khớp tràn); mo_ta dòng lá ghép nguyên văn các dòng cha cho đủ nghĩa. Mã 10 số ở Phụ lục V cắt về 8 số, mã đầy đủ ghi ở dieu_kien. Phụ lục VII: các mục máy liền sau ô mã gộp được gán mã của ô đó. Không trích Phụ lục III (kim cương thô, 3 mã) vì đã bị Điều 20 khoản 3 điểm a TT 48/2026/TT-BCT bãi bỏ từ 05-09-2026. loai_tac_dong=KHAC: văn bản chỉ chi tiết mã HS cho hàng thuộc các TT gốc (30/2018, 10/2011, 38/2014, 12/2016, 57/2018, 15/2013), nghĩa vụ và hiệu lực theo TT gốc — chưa đối chiếu hiệu lực từng TT gốc. Bốn mã in theo biểu thuế cũ không còn trong biểu thuế đối chiếu (48132000, 48139010, 48139090, 84789010) giữ nguyên văn, đã ghi ở dieu_kien, chưa chuyển đổi.'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn nguồn A trên vbpl.vn (itemID=139689, Điều 1–9): ban hành 16-12-2019, có hiệu lực từ 29-01-2020 (Điều 9 khoản 1); Điều 20 khoản 3 điểm a TT 48/2026/TT-BCT (PDF Công báo số 521 ngày 23-09-2026) bãi bỏ Điều 3 và Phụ lục III từ 05-09-2026, nên tình trạng là HET_HIEU_LUC_MOT_PHAN.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Thông tư số 30/2018/TT-BCT ngày 01 tháng 10 năm 2018 của Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của Nghị định số 107/2018/NĐ-CP ngày 15 tháng 8 năm 2018 của Chính phủ về kinh doanh xuất khẩu gạo (Thông tư số 30/2018/TT-BCT) Ban hành kèm theo Thông tư này Phụ lục I - Danh mục chi tiết theo mã HS đối với thóc, gạo xuất khẩu quy định tại Thông tư số 30/2018/TT-BCT.
    - dieu: 2
      noi_dung: Điều 2. Thông tư số 10/2011/TT-BCT ngày 30 tháng 3 năm 2011 của Bộ trưởng Bộ Công Thương sửa đổi, bổ sung, bãi bỏ một số quy định về thủ tục hành chính trong lĩnh vực xuất, nhập khẩu theo Nghị quyết số 59/NQ-CP ngày 17 tháng 12 năm 2010 của Chính phủ về việc đơn giản hóa thủ tục hành chính thuộc phạm vi chức năng quản lý của Bộ Công Thương (Thông tư số 10/2011/TT-BCT) Ban hành kèm theo Thông tư này Phụ lục II - Danh mục chi tiết theo mã HS đối
    - dieu: 3
      noi_dung: Điều 3. Thông tư liên tịch số 14/2009/TTLT-BCT-BTC ngày 23 tháng 6 năm 2009 của Bộ trưởng Bộ Công Thương và Bộ trưởng Bộ Tài chính hướng dẫn việc cấp chứng nhận và thủ tục nhập khẩu, xuất khẩu kim cương thô nhằm thực thi các quy định của quy chế chứng nhận quy trình Kimberley (Thông tư liên tịch số 14/2009/TTLT-BCT-BTC) Ban hành kèm theo Thông tư này Phụ lục III - Danh mục chi tiết theo mã HS đối với kim cương thô quy định tại Thông tư liên tịch
    - dieu: 4
      noi_dung: Điều 4. Thông tư số 38/2014/TT-BCT ngày 24 tháng 10 năm 2014 của Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của Nghị định số 83/2014/NĐ-CP ngày 03 tháng 9 năm 2014 của Chính phủ về kinh doanh xăng dầu (Thông tư số 38/2014/TT-BCT) Ban hành kèm theo thông tư này Phụ lục IV - Danh mục chi tiết theo mã HS đối với xăng, dầu quy định tại Thông tư số 38/2014/TT-BCT.
    - dieu: 5
      noi_dung: Điều 5. Thông tư số 12/2016/TT-BCT ngày 05 tháng 7 năm 2016 của Bộ trưởng Bộ Công Thương sửa đổi, bổ sung một số điều của Thông tư số 41/2012/TT-BCT ngày 21 tháng 12 năm 2012 của Bộ trưởng Bộ Công Thương quy định về xuất khẩu khoáng sản (Thông tư số 12/2016/TT-BCT) Bổ sung mã HS chi tiết đối với khoáng sản xuất khẩu quy định tại Phụ lục 1 Thông tư số 12/2016/TT-BCT như tại Phụ lục V - Danh mục chi tiết theo mã HS đối với khoáng sản xuất khẩu ban
    - dieu: 6
      noi_dung: Điều 6. Thông tư số 57/2018/TT-BCT ngày 26 tháng 12 năm 2018 của Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của các Nghị định liên quan đến kinh doanh thuốc lá (Thông tư số 57/2018/TT-BCT) 1. Ban hành kèm theo Thông tư này Phụ lục VI - Danh mục chi tiết theo mã HS đối với nguyên liệu thuốc lá, giấy cuốn điếu thuốc lá quy định tại Thông tư số 57/2018/TT-BCT.
    - dieu: 7
      noi_dung: Điều 7. Thông tư số 15/2013/TT-BCT ngày 15 tháng 7 năm 2013 của Bộ trưởng Bộ Công Thương quy định về xuất khẩu than (Thông tư số 15/2013/TT-BCT) Bổ sung mã HS chi tiết đối với than xuất khẩu quy định tại Phụ lục I Thông tư số 15/2013/TT-BCT như tại Phụ lục VIII - Danh mục chi tiết theo mã HS đối với than xuất khẩu ban hành kèm theo Thông tư này.
    - dieu: 8
      noi_dung: Điều 8. Nguyên tắc áp dụng danh mục 1. Trường hợp chỉ liệt kê mã HS 4 số thì toàn bộ các mã HS 8 số thuộc nhóm HS 4 số này đều được áp dụng. 2. Trường hợp chỉ liệt kê mã HS 6 số thì toàn bộ các mã HS 8 số thuộc phân nhóm HS 6 số này đều được áp dụng. 3. Trường hợp liệt kê chi tiết đến mã HS 8 số thì chỉ mã HS 8 số đó mới được áp dụng.
    - dieu: 9
      noi_dung: Điều 9. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 29 tháng 01 năm 2020. 2. Trong quá trình thực hiện Thông tư này, nếu có phát sinh vướng mắc, thương nhân, các cơ quan, tổ chức, cá nhân có liên quan phản ánh về Bộ Công Thương để xử lý./.
ghi_chu: Nhập từ hs-code-api data/legal-docs.json (văn bản được dẫn trong cột chính sách của biểu thuế, 32 mã HS). Đã nạp toàn văn bậc A từ CSDL quốc gia về pháp luật (vbpl.vn).
