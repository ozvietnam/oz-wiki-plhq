  ghi_chu: 'Trích bằng máy từ bảng HTML toàn văn vbpl.vn (bản lưu raw/download/vbpl.vn/41-2019-tt-bct.html), Phụ lục I, II, IV–VIII. Theo Điều 8 chỉ giữ dòng lá của cây biểu thuế (dòng cha 4/6 số có dòng con chi tiết hơn bị bỏ để không khớp tràn); mo_ta dòng lá ghép nguyên văn các dòng cha cho đủ nghĩa. Mã 10 số ở Phụ lục V cắt về 8 số, mã đầy đủ ghi ở dieu_kien. Phụ lục VII: các mục máy liền sau ô mã gộp được gán mã của ô đó. Không trích Phụ lục III (kim cương thô, 3 mã) vì đã bị Điều 20 khoản 3 điểm a TT 48/2026/TT-BCT bãi bỏ từ 05-09-2026. loai_tac_dong=KHAC: văn bản chỉ chi tiết mã HS cho hàng thuộc các TT gốc (30/2018, 10/2011, 38/2014, 12/2016, 57/2018, 15/2013), nghĩa vụ và hiệu lực theo TT gốc — chưa đối chiếu hiệu lực từng TT gốc. Bốn mã in theo biểu thuế cũ không còn trong biểu thuế đối chiếu (48132000, 48139010, 48139090, 84789010) giữ nguyên văn, đã ghi ở dieu_kien, chưa chuyển đổi.'
