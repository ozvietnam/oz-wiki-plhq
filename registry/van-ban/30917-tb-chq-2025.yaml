ghi_chu: 'Xác định trước mã số mặt hàng Nắp rửa điện tử (nắp đậy và bệ ngồi điện tử) bằng nhựa lắp với bệ xí bệt bằng sứ, tích hợp đun nóng nước tức thời, sưởi ấm bệ ngồi, phun sương điện phân, sấy khô và khử mùi (ký, mã hiệu TCF33320GAA#NW1; công suất định mức 828-839W, nguồn điện 220-240V 50/60Hz) thuộc nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90.'
