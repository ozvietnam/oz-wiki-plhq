  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/10/28/VB_30917.pdf.PDF, id=101696, SHA-256 daa5927f8c7159626b21ca4e7b5e0b17b1ff88c66ab26139910d14605da4e533): Thông báo số 30917/TB-CHQ ngày 23-10-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Nắp rửa điện tử (nắp đậy và bệ ngồi điện tử) của bồn cầu bằng nhựa màu trắng để lắp với bệ xí bệt bằng sứ (ký, mã hiệu TCF33320GAA#NW1; có chức năng phun sương tráng lòng bệ xí bệt bằng nước điện phân Ewater+ diệt khuẩn, sưởi ấm phần bệ ngồi bằng thanh gia nhiệt, tích hợp thiết bị đun nóng nước tức thời dùng để rửa, khử mùi bằng quạt và bộ lọc than hoạt tính, sấy khô bằng quạt và bộ phận gia nhiệt, tự động làm sạch vòi phun; kích thước 540 x 462 x 130 mm, cân nặng 4.9 kg, công suất định mức 828-839W, nguồn điện 220-240V 50/60Hz, chống thấm IPX4), phân loại vào nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
