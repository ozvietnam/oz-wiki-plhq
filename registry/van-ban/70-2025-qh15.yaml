    - dieu: 3
      noi_dung: Điều 3. Điều khoản chuyển tiếp Trường hợp tiêu chuẩn, quy chuẩn kỹ thuật đã được tổ chức xây dựng, thâm định nhưng đên ngày Luật này có hiệu lực thi hành chưa được công bo, ban hành thì việc xây dựng tiêu chuẩn, quy chuẩn kỹ thuật được tiếp tục thực hiện theo quy định của Luật Tiêu chuẩn và quy chuân kỹ thuật số 68/2006/QH11 đã được sửa đổi, bổ sung một số điều theo Luật số 35/2018/QH14.
