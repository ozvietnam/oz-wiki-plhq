      noi_dung: 'Điều 1. Sửa đổi, bd sung một số điều của Luật Tiêu chuẩn và quy chuẩn kỹ thuật 1. Sửa đối, bỗ sung Điều 3 như sau: “Điều 3. Giải thích từ ngữ 1. Tiêu chuẩn là quy định về đặc tính kỹ thuật và yêu cầu quản lý dùng làm chuẩn dé phân loại, đánh giá san phẩm, hàng hoá, dịch vụ, quá trình, môi trường và các đối tượng khác trong hoạt động kinh tế - xã hội. Tiêu chuẩn do cơ quan, tô chức, đơn vị công bố dưới dạng văn bản để tự nguyện áp dụng.'
