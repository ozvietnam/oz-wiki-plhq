  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hoạt động đường bộ và quản lý nhà nước về hoạt động đường bộ.
      trang_pdf: 1
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Hoạt động đường bộ bao gồm: hoạt động về quy hoạch, đầu tư, xây dựng, quản lý, sử dụng, vận hành, khai thác, bảo trì, bảo vệ kết cấu hạ tầng đường bộ; vận tải đường bộ. 2. Đường bộ bao gồm: đường, cầu đường bộ, cống đường bộ, hầm đường bộ, bến phà đường bộ, cầu phao đường bộ, đường cứu nạn và các công trình phụ trợ gắn liền với đường bộ.'
      trang_pdf: 1
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc hoạt động đường bộ 1. Bảo đảm giao thông thông suốt, an toàn, kết nối đồng bộ, hiệu quả, thân thiện với môi trường, phục vụ nhu cầu vận tải hàng hóa và đi lại thuận tiện của người dân, góp phần phát triển kinh tế - xã hội, bảo đảm quốc phòng, an ninh và bảo vệ môi trường, phòng, chống thiên tai, hội nhập quốc tế.
      trang_pdf: 2
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 16
      noi_dung: Điều 16. Quản lý, sử dụng đất hành lang an toàn đường bộ 1. Đất hành lang an toàn đường bộ đã được Nhà nước thu hồi phải được quản lý, sử dụng theo quy định của Luật này, quy định của pháp luật về đất đai, pháp luật về quản lý, sử dụng tài sản công và quy định khác của pháp luật có liên quan.
      trang_pdf: 13
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 27
      noi_dung: Điều 27. Tải trọng và khổ giới hạn của đường bộ 1. Tải trọng của đường bộ là khả năng chịu tải khai thác của đường bộ để bảo đảm khai thác an toàn và tuổi thọ công trình đường bộ. 2. Khổ giới hạn của đường bộ là khoảng trống có kích thước giới hạn về chiều rộng, chiều cao của đường bộ để các xe, bao gồm cả hàng hoá xếp trên xe đi qua được an toàn và được xác định theo quy chuẩn, tiêu chuẩn kỹ thuật của đường bộ.
      trang_pdf: 26
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 39
      noi_dung: 'Điều 39. Bến xe, bãi đỗ xe, trạm dừng nghỉ, điểm dừng xe, trạm thu phí đường bộ, công trình kiểm soát tải trọng xe trên đường bộ 1. Bến xe, bãi đỗ xe, trạm dừng nghỉ được quy định như sau: a) Bến xe phải được xây dựng tại các đô thị là trung tâm hành chính cấp huyện trở lên và các khu vực cần thiết khác để phục vụ vận tải hành khách công cộng;'
      trang_pdf: 38
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 50
      noi_dung: 'Điều 50. Phí sử dụng đường cao tốc 1. Nhà nước thu phí sử dụng đường cao tốc đối với phương tiện lưu thông trên đường cao tốc thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và trực tiếp quản lý, khai thác, bao gồm: a) Đường cao tốc do Nhà nước đầu tư theo hình thức đầu tư công; b) Đường cao tốc được đầu tư theo các hình thức khác khi kết thúc hợp đồng, chuyển giao cho Nhà nước.'
      trang_pdf: 45
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 62
      noi_dung: 'Điều 62. Quyền và nghĩa vụ của đơn vị kinh doanh vận tải hàng hóa bằng xe ô tô 1. Đơn vị kinh doanh vận tải hàng hóa bằng xe ô tô có quyền sau đây: a) Yêu cầu người thuê vận tải cung cấp thông tin cần thiết về hàng hóa để ghi vào giấy vận tải và có quyền kiểm tra tính xác thực của thông tin đó; b) Yêu cầu người thuê vận tải thanh toán đủ tiền cước và chi phí phát sinh;'
      trang_pdf: 56
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 73
      noi_dung: 'Điều 73. Dịch vụ bãi đỗ xe 1. Đơn vị kinh doanh dịch vụ bãi đỗ xe được thành lập theo quy định của pháp luật về doanh nghiệp, pháp luật về hợp tác xã. 2. Đơn vị kinh doanh dịch vụ bãi đỗ xe được thực hiện các dịch vụ sau đây: a) Trông giữ phương tiện giao thông đường bộ; b) Bảo dưỡng, sửa chữa phương tiện giao thông đường bộ; c) Cung cấp nhiên liệu, năng lượng cho phương tiện giao thông đường bộ; d) Dịch vụ khác theo quy định của pháp luật.'
      trang_pdf: 62
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
    - dieu: 86
      noi_dung: Điều 86. Quy định chuyển tiếp 1. Đối với dự án đường cao tốc đã được quyết định chủ trương đầu tư trước ngày Luật này có hiệu lực thi hành mà chưa đáp ứng đầy đủ các yêu cầu tại Luật này thì được tiếp tục đầu tư theo quyết định chủ trương đầu tư được cấp có thẩm quyền phê duyệt.
      trang_pdf: 69
      sha256_pdf: debf33ad3b4781c04c143b3b684aaace3e4ecc24110d87ca551ab1cd0221c9fc
