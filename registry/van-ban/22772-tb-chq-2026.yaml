ghi_chu: 'Xác định trước mã số mặt hàng Máy trị liệu nhiệt cứu Model LJ-001 (thiết bị cơ điện hoạt động bằng pin gồm 02 viên pin 18650 mắc nối tiếp, dung lượng 2500mAh, công suất định mức 30W, tích hợp buồng phát nhiệt và vi mạch kiểm soát 03 mức nhiệt độ để làm nóng miếng thảo mộc kinh lạc, giải phóng tinh dầu thảo dược và tạo tác động cứu ấm trên các vùng cơ thể, không có chức năng massage) thuộc nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90.'
