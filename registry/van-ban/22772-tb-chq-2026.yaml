  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/9/VB_22772.pdf, id=106321, SHA-256 6c0857d58caf70b18d1326f82065e2b4fe5f24c5b6fd29a49985a77ec8846213): Thông báo số 22772/TB-CHQ ngày 09-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Máy trị liệu nhiệt cứu Model LJ-001 (thiết bị cơ điện hoạt động bằng khối pin gồm 02 viên pin 18650 mắc nối tiếp, dung lượng 2500mAh, năng lượng 18,5Wh, công suất định mức 30W, tích hợp buồng gia nhiệt, cảm biến nhiệt và mạch điện tử kiểm soát 03 cấp độ nhiệt Thấp/Trung bình/Cao; có chức năng làm nóng miếng thảo mộc kinh lạc đặt trong khoang gia nhiệt để giải phóng tinh dầu dược liệu và truyền nhiệt cứu ấm lên các vùng cơ thể, không có chức năng massage cơ học; quy cách 01 máy/hộp), phân loại vào nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90; có hiệu lực từ ngày ký'
