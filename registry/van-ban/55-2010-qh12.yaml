  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quyền và nghĩa vụ của tổ chức, cá nhân trong bảo đảm an toàn thực phẩm; điều kiện bảo đảm an toàn đối với thực phẩm, sản xuất, kinh doanh thực phẩm và nhập khẩu, xuất khẩu thực phẩm; quảng cáo, ghi nhãn thực phẩm; kiểm nghiệm thực phẩm; phân tích nguy cơ đối với an toàn thực phẩm; phòng ngừa, ngăn chặn và khắc phục sự cố về an toàn thực phẩm; thông tin, giáo dục, truyền thông về an toàn thực phẩm;
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong luật này, các từ ngữ dưới đây được hiểu như sau: 1. An toàn thực phẩm là việc bảo đảm để thực phẩm không gây hại đến sức khỏe, tính mạng con người. 2. Bệnh truyền qua thực phẩm là bệnh do ăn, uống thực phẩm bị nhiễm tác nhân gây bệnh.'
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc quản lý an toàn thực phẩm 1. Bảo đảm an toàn thực phẩm là trách nhiệm của mọi tổ chức, cá nhân sản xuất, kinh doanh thực phẩm. 2. Sản xuất, kinh doanh thực phẩm là hoạt động có điều kiện; tổ chức, cá nhân sản xuất, kinh doanh thực phẩm phải chịu trách nhiệm về an toàn đối với thực phẩm do mình sản xuất, kinh doanh.
    - dieu: 13
      noi_dung: Điều 13. Điều kiện bảo đảm an toàn đối với thực phẩm tăng cường vi chất dinh dưỡng 1. Tuân thủ các điều kiện quy định tại Điều 10 của Luật này. 2. Nguyên liệu ban đầu tạo nên thực phẩm phải bảo đảm an toàn và giữ nguyên các thuộc tính vốn có của nó; các nguyên liệu tạo thành thực phẩm không được tương tác với nhau để tạo ra các sản phẩm gây hại đến sức khoẻ, tính mạng con người.
    - dieu: 23
      noi_dung: 'Điều 23. Điều kiện bảo đảm an toàn thực phẩm đối với cơ sở sản xuất thực phẩm tươi sống 1. Cơ sở sản xuất thực phẩm tươi sống phải bảo đảm các điều kiện sau đây: a) Bảo đảm các điều kiện về đất canh tác, nguồn nước, địa điểm sản xuất để sản xuất thực phẩm an toàn; b) Tuân thủ các quy định của pháp luật về sử dụng giống cây trồng, giống vật nuôi;'
    - dieu: 32
      noi_dung: Điều 32. Điều kiện bảo đảm an toàn thực phẩm đối với nguyên liệu, dụng cụ ăn uống, chứa đựng thực phẩm và người kinh doanh thức ăn đường phố 1. Nguyên liệu để chế biến thức ăn đường phố phải bảo đảm an toàn thực phẩm, có nguồn gốc, xuất xứ rõ ràng. 2. Dụng cụ ăn uống, chứa đựng thực phẩm phải bảo đảm an toàn vệ sinh. 3. Bao gói và các vật liệu tiếp xúc trực tiếp với thực phẩm không được gây ô nhiễm và thôi nhiễm vào thực phẩm.
    - dieu: 42
      noi_dung: Điều 42. Chứng nhận đối với thực phẩm xuất khẩu 1. Cơ quan nhà nước có thẩm quyền của Việt Nam cấp giấy chứng nhận lưu hành tự do, chứng nhận y tế, chứng nhận nguồn gốc, xuất xứ hoặc giấy chứng nhận khác có liên quan đối với thực phẩm xuất khẩu trong trường hợp có yêu cầu của nước nhập khẩu.
    - dieu: 51
      noi_dung: Điều 51. Trách nhiệm thực hiện phân tích nguy cơ đối với an toàn thực phẩm Bộ Y tế, Bộ Nông nghiệp và Phát triển Nông thôn, Bộ Công Thương tổ chức việc phân tích nguy cơ đối với an toàn thực phẩm thuộc lĩnh vực được phân công quản lý theo quy định tại Điều 49 và Điều 50 của Luật này. Mục 3 PHÒNG NGỪA, NGĂN CHẶN VÀ KHẮC PHỤC SỰ CỐ VỀ AN TOÀN THỰC PHẨM
    - dieu: 61
      noi_dung: Điều 61. Trách nhiệm quản lý nhà nước về an toàn thực phẩm 1. Chính phủ thống nhất quản lý nhà nước về an toàn thực phẩm. 2. Bộ Y tế chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước về an toàn thực phẩm. 3. Các bộ, cơ quan ngang bộ trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm phối hợp với Bộ Y tế thực hiện quản lý nhà nước về an toàn thực phẩm.
    - dieu: 71
      noi_dung: Điều 71. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2011. Pháp lệnh vệ sinh an toàn thực phẩm số 12/2003/PL-UBTVQH11 hết hiệu lực kể từ ngày Luật này có hiệu lực.
ghi_chu: 'Toàn văn cổng Chính phủ: thông qua 17-06-2010, Điều 71 hiệu lực 01-07-2011. Thẻ trang ghi ngày ban hành 28-06-2010 (khác ngày thông qua). Tệp datafiles là Word .doc (OLE), đọc được chữ; Điều 71 ghi hiệu lực từ 01-07-2011. Chưa đối chiếu lược đồ sửa đổi sau 2011. Đã sửa từng phần (Luật 28/2018/QH14, Luật Thanh tra 84/2025/QH15); bản hợp nhất VBHN 61/VBHN-VPQH (2025) — phần sửa đổi vẫn theo nguồn thứ cấp.'
