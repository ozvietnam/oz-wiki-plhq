  pham_vi: 'toàn văn trên vanban.chinhphu.vn (docid=96032) và tệp .doc gốc (raw/download/datafiles.chinhphu.vn/55-2010-qh12.doc, wiki/sources/55-2010-qh12.md): Quốc hội thông qua 17-06-2010, Điều 71 có hiệu lực 01-07-2011; đối chiếu còn hiệu lực, hợp nhất tại VBHN 61/VBHN-VPQH'
