xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo Số 1107 + 1108 ngày 11-10-2024 (có lớp chữ, lưu tại raw/download/congbaocdn.chinhphu.vn/11-2024-tt-btttt.pdf) và tệp ký số 11-btttt.signed.pdf trên vanban.chinhphu.vn (docid=211270, lưu tại raw/download/datafiles.chinhphu.vn/11-2024-tt-btttt.pdf): số hiệu 11/2024/TT-BTTTT, trích yếu nguyên văn "Sửa đổi, bổ sung một số điều của Thông tư số 03/2015/TT-BTTTT ngày 06 tháng 3 năm 2015 của Bộ trưởng Bộ Thông tin và Truyền thông quy định chi tiết và hướng dẫn thi hành một số điều, khoản của Nghị định số 60/2014/NĐ-CP ngày 19 tháng 6 năm 2014 của Chính phủ quy định về hoạt động in, Thông tư số 05/2016/TT-BTTTT ngày 01 tháng 3 năm 2016 của Bộ trưởng Bộ Thông tin và Truyền thông quy định về quản lý và sử dụng mã số sách tiêu chuẩn quốc tế, Thông tư số 22/2018/TT-BTTTT ngày 28 tháng 12 năm 2018 của Bộ trưởng Bộ Thông tin và Truyền thông ban hành Danh mục hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực in, phát hành xuất bản phẩm và Thông tư số 09/2013/TT-BTTTT ngày 08 tháng 4 năm 2013 của Bộ trưởng Bộ Thông tin và Truyền thông ban hành Danh mục sản phẩm phần mềm và phần cứng, điện tử (được sửa đổi, bổ sung bởi Thông tư số 20/2021/TT-BTTTT ngày 03 tháng 12 năm 2021 của Bộ trưởng Bộ Thông tin và Truyền thông)", ngày ký 23-09-2024, người ký Bộ trưởng Nguyễn Mạnh Hùng (căn cứ Luật Xuất bản ngày 20-11-2012; Luật Quản lý ngoại thương ngày 12-6-2017; Nghị định 195/2013/NĐ-CP và Nghị định 150/2018/NĐ-CP; Nghị định 60/2014/NĐ-CP và Nghị định 25/2018/NĐ-CP; Nghị định 71/2007/NĐ-CP; Nghị định 69/2018/NĐ-CP; Nghị định 48/2022/NĐ-CP). Cấu trúc 5 Điều và Phụ lục (Phụ lục 01, Phụ lục 02, Phụ lục 03 — cập nhật 23 mã HS thuộc các nhóm 4901, 4902, 4903, 4904, 4905, 4909, 4910, 4911, 8442, 8443): Điều 1 sửa đổi, bổ sung một số điều của TT 05/2016/TT-BTTTT; Điều 2 sửa đổi, bổ sung một số nội dung tại các Phụ lục của TT 22/2018/TT-BTTTT (thay thế Phụ lục II của Phụ lục I bằng Phụ lục 03 kèm theo TT 11/2024/TT-BTTTT); Điều 3 bãi bỏ một số nội dung của TT 22/2018/TT-BTTTT (khoản 1: bãi bỏ STT 10 tại Mục II Phụ lục II), TT 03/2015/TT-BTTTT (khoản 2: bãi bỏ Điều 2 và Điều 6) và TT 05/2016/TT-BTTTT (khoản 3: bãi bỏ Điều 3; các điểm h, i, k và m khoản 1 Điều 6; cụm từ "góc dưới bên phải" tại điểm a khoản 1 Điều 7; điểm c khoản 1 Điều 7); Điều 4 sửa đổi, bổ sung (khoản 1) và bãi bỏ (khoản 2: bãi bỏ STT 01, 02, 03, 04, 05, 12, 13 thuộc nhóm 2.1.2 tại Phụ lục số 02) một số nội dung tại Phụ lục số 02 của TT 09/2013/TT-BTTTT (được sửa đổi, bổ sung bởi TT 20/2021/TT-BTTTT). Trích nguyên văn Điều 5 — Điều khoản thi hành: "1. Thông tư này có hiệu lực thi hành kể từ ngày 07 tháng 11 năm 2024. 2. Đối với hồ sơ thực hiện thủ tục khai báo nhập khẩu thiết bị in, nhập khẩu xuất bản phẩm không kinh doanh, đăng ký nhập khẩu xuất bản phẩm để kinh doanh được gửi đến cơ quan có thẩm quyền giải quyết trước ngày Thông tư này có hiệu lực, nhưng thời hạn giải quyết thủ tục đó chậm nhất cùng ngày hoặc sau ngày Thông tư này có hiệu lực thì không áp dụng các quy định có liên quan tại Thông tư này. Trong quá trình thực hiện Thông tư này, trường hợp có vướng mắc, đề nghị cơ quan, tổ chức, cá nhân phản ánh bằng văn bản về Bộ Thông tin và Truyền thông (qua Cục Xuất bản, In và Phát hành) để xem xét, giải quyết./." Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn (id=42827) và vanban.chinhphu.vn (docid=211270): không có văn bản nào sửa đổi, bổ sung, thay thế hay bãi bỏ TT 11/2024/TT-BTTTT sau ngày 23-09-2024; toàn bộ Thông tư đang CON_HIEU_LUC.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Đã hiệu đính ten (cập nhật đầy đủ trích yếu nguyên văn 4 Thông tư được sửa đổi, bổ sung), ngay_ban_hanh (từ 2024-10-25 sai ở bản ghi NGUON_B cũ về đúng ngày ký 2024-09-23) và bổ sung hieu_luc_tu: 2024-11-07 theo đúng nguyên bản ký số trên Công báo. Tại Điều 4, Phụ lục số 02 của TT 09/2013/TT-BTTTT đã được sửa đổi trước đó bởi Thông tư số 20/2021/TT-BTTTT ngày 03-12-2021 (chưa mở mục riêng trong registry/van-ban/). Trên cơ sở TT 11/2024/TT-BTTTT, Bộ Thông tin và Truyền thông đã ban hành các Văn bản hợp nhất ngày 21-10-2024 (07/VBHN-BTTTT hợp nhất TT 03/2015/TT-BTTTT, 08/VBHN-BTTTT hợp nhất TT 05/2016/TT-BTTTT, 09/VBHN-BTTTT hợp nhất TT 22/2018/TT-BTTTT — docid=211488).'
