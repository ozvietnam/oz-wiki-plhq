      noi_dung: '2. Bãi bỏ một số sản phẩm thuộc nhóm sản phẩm 2.1.2 ra khỏi Danh mục sản phẩm phần cứng, điện tử: a) “Máy in offset, in cuộn”, tại số thứ tự 01; b) “Máy in offset, in theo tờ, loại sử dụng trong văn phòng”, tại số thứ tự 02; c) “Máy in offset khác”, tại số thứ tự 03; d) “Máy in nổi, in cuộn, trừ máy loại máy in nổi bằng khuôn mềm”, tại số thứ tự 04; đ) “Máy in nổi bằng khuôn mềm”, tại số thứ tự 05; e) “Máy phơi bản tự động”, tại số thứ tự 12; g) “Máy ghi bản in CTP”, tại số thứ tự 13.'
