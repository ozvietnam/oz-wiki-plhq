    - dieu: 5
      khoan: 2
      noi_dung: '2. Đối với hồ sơ thực hiện thủ tục khai báo nhập khẩu thiết bị in, nhập khẩu xuất bản phẩm không kinh doanh, đăng ký nhập khẩu xuất bản phẩm để kinh doanh được gửi đến cơ quan có thẩm quyền giải quyết trước ngày Thông tư này có hiệu lực, nhưng thời hạn giải quyết thủ tục đó chậm nhất cùng ngày hoặc sau ngày Thông tư này có hiệu lực thì không áp dụng các quy định có liên quan tại Thông tư này. Trong quá trình thực hiện Thông tư này, trường hợp có vướng mắc, đề nghị cơ quan, tổ chức, cá nhân phản ánh bằng văn bản về Bộ Thông tin và Truyền thông (qua Cục Xuất bản, In và Phát hành) để xem xét, giải quyết./.'
      trang_pdf: 10
