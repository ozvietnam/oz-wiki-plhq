xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ bộ PDF Công báo ngày 08-09-2023 gồm Công báo số 995 + 996 (raw/download/congbaocdn.chinhphu.vn/65-2023-nd-cp.pdf, 95 trang, trang 2–95 của số Công báo, chứa Điều 1–65, có lớp chữ ký số bởi Cổng Thông tin điện tử Chính phủ / Văn phòng Chính phủ ngày 14-09-2023, SHA-256 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5), Công báo số 997 + 998 (95 trang, chứa Điều 66–125 và đầu Phụ lục I, trong đó Chương IV Phần thứ tư từ Điều 99 đến Điều 104 quy định kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến quyền sở hữu công nghiệp, quyền đối với giống cây trồng) và Công báo số 999 + 1000 (chứa phần còn lại của 7 Phụ lục), toàn văn PDF ký số (65-nd-cp.signed.pdf, Phó Thủ tướng Trần Lưu Quang ký) trên vanban.chinhphu.vn (docid=208550), bản HTML toàn văn 125 Điều trên CSDLQG vbpl.vn (ID 164372) và trang wiki/sources/65-2023-nd-cp.md: số hiệu 65/2023/NĐ-CP, ngày ban hành 23/08/2023, gồm 5 Phần / 12 Chương / 125 Điều và 7 Phụ lục; khoản 1 Điều 124 quy định có hiệu lực thi hành từ ngày 23/08/2023; khoản 2 Điều 124 thay thế toàn bộ Nghị định 103/2006/NĐ-CP ngày 22/09/2006 (cùng các quy định về sở hữu công nghiệp, quyền đối với giống cây trồng và quản lý nhà nước về SHTT tại NĐ 105/2006/NĐ-CP, NĐ 119/2010/NĐ-CP, NĐ 122/2010/NĐ-CP và Điều 1 NĐ 154/2018/NĐ-CP); đang còn hiệu lực (đã được sửa đổi, bổ sung một số điều bởi NĐ 151/2025/NĐ-CP, NĐ 15/2026/NĐ-CP, NĐ 33/2026/NĐ-CP và NĐ 100/2026/NĐ-CP theo VBHN 04/VBHN-BKHCN ngày 26/04/2026).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định chi tiết và biện pháp thi hành các quy định của Luật Sở hữu trí tuệ về: 1. Việc xác lập, chủ thể, nội dung, giới hạn quyền sở hữu công nghiệp, chuyển giao quyền sở hữu công nghiệp, đại diện sở hữu công nghiệp và các biện pháp thúc đẩy hoạt động sở hữu công nghiệp. 2. Việc xác định hành vi xâm phạm, tính chất và mức độ xâm phạm quyền sở hữu công nghiệp, quyền đối với giống cây trồng, xác định thiệt hại, yêu cầu và giải quyết yêu cầu xử lý xâm phạm, xử lý xâm phạm quyền sở hữu công nghiệp, quyền đối với giống cây trồng, kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến sở hữu công nghiệp, quyền đối với giống cây trồng, giám định sở hữu công nghiệp, quyền đối với giống cây trồng và quản lý nhà nước về sở hữu trí tuệ.'
      trang_pdf: 1
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 2
      noi_dung: '1. Tổ chức, cá nhân Việt Nam, tổ chức, cá nhân nước ngoài đáp ứng các điều kiện hưởng sự bảo hộ quyền sở hữu công nghiệp tại Việt Nam theo các điều ước quốc tế mà Việt Nam là thành viên. 2. Tổ chức, cá nhân có quyền sở hữu công nghiệp, quyền đối với giống cây trồng được bảo hộ hoặc có hành vi xâm phạm quyền sở hữu công nghiệp, quyền đối với giống cây trồng theo quy định của Luật Sở hữu trí tuệ. 3. Các tổ chức, cá nhân khác có liên quan.'
      trang_pdf: 2
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 3
      khoan: 26
      noi_dung: '26. “Luật Sở hữu trí tuệ” là Luật Sở hữu trí tuệ ngày 29 tháng 11 năm 2005, được sửa đổi, bổ sung bởi Luật sửa đổi, bổ sung một số điều của Luật Sở hữu trí tuệ ngày 19 tháng 6 năm 2009, Luật sửa đổi, bổ sung một số điều của Luật Kinh doanh bảo hiểm, Luật Sở hữu trí tuệ ngày 14 tháng 6 năm 2019 và Luật sửa đổi, bổ sung một số điều của Luật Sở hữu trí tuệ ngày 16 tháng 6 năm 2022.'
      trang_pdf: 4
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 4
      noi_dung: 'Việc tổ chức thực hiện hoạt động quản lý nhà nước về sở hữu trí tuệ quy định tại Điều 10, Điều 11 của Luật Sở hữu trí tuệ dựa trên nguyên tắc thống nhất về mục tiêu, nội dung và biện pháp dưới sự chỉ đạo chung của Chính phủ, có sự phân công trách nhiệm rõ ràng và sự phối hợp chặt chẽ giữa các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân các cấp.'
      trang_pdf: 5
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 5
      khoan: 1
      noi_dung: '1. Bộ Khoa học và Công nghệ có trách nhiệm chủ trì, phối hợp với Bộ Văn hóa, Thể thao và Du lịch, Bộ Nông nghiệp và Phát triển nông thôn và các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân các cấp và các cơ quan liên quan thực hiện các hoạt động chung sau đây để bảo đảm thống nhất quản lý nhà nước về sở hữu trí tuệ: a) Xây dựng, ban hành hoặc trình cấp có thẩm quyền ban hành và tổ chức thực hiện chiến lược, chính sách, văn bản pháp luật chung về bảo hộ quyền sở hữu trí tuệ; b) Theo dõi, đôn đốc và kiểm tra việc thực hiện các nhiệm vụ chung về sở hữu trí tuệ do Quốc hội, Chính phủ giao cho các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân các cấp theo quy định tại Điều 10, Điều 11 của Luật Sở hữu trí tuệ và Nghị định này; c) Tổng hợp, đánh giá, báo cáo Chính phủ tình hình hoạt động bảo hộ quyền sở hữu trí tuệ, đề xuất các chính sách, biện pháp cụ thể nhằm nâng cao hiệu quả của hệ thống sở hữu trí tuệ và bảo đảm thống nhất quản lý nhà nước về sở hữu trí tuệ; d) Xây dựng và chỉ đạo tổ chức thực hiện các chương trình, đề án chung về bảo hộ quyền sở hữu trí tuệ, các biện pháp phối hợp giữa các cơ quan nhà nước có thẩm quyền trong lĩnh vực bảo hộ quyền sở hữu trí tuệ; đ) Đàm phán, ký kết gia nhập và tổ chức thực hiện các điều ước quốc tế chung về sở hữu trí tuệ; đề xuất xử lý các vấn đề tranh chấp quốc gia liên quan đến sở hữu trí tuệ trong quan hệ quốc tế; e) Xây dựng hệ thống cơ sở dữ liệu, thiết lập mạng thông tin quốc gia về quản lý nhà nước về sở hữu trí tuệ và bảo vệ quyền sở hữu trí tuệ.'
      trang_pdf: 5
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 7
      noi_dung: '1. Bộ Khoa học và Công nghệ chịu trách nhiệm chủ trì, phối hợp với Bộ Văn hóa, Thể thao và Du lịch, Bộ Nông nghiệp và Phát triển nông thôn và các cơ quan liên quan trong bảo vệ, kiểm tra, thanh tra, xử lý xâm phạm quyền sở hữu trí tuệ. 2. Cơ quan quản lý nhà nước về sở hữu trí tuệ có trách nhiệm trả lời đầy đủ và kịp thời các yêu cầu của cơ quan có thẩm quyền xử lý xâm phạm quyền sở hữu trí tuệ. 3. Cơ quan quản lý nhà nước về sở hữu trí tuệ có trách nhiệm tham gia đoàn thanh tra hoặc đoàn kiểm tra khi được yêu cầu để phục vụ công tác thanh tra và kiểm tra.'
      trang_pdf: 7
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 8
      noi_dung: 'Các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương trong phạm vi chức năng, nhiệm vụ của mình có trách nhiệm phối hợp với Bộ Khoa học và Công nghệ, Bộ Văn hóa, Thể thao và Du lịch và Bộ Nông nghiệp và Phát triển nông thôn thực hiện các nhiệm vụ cụ thể sau đây: 1. Thực hiện các nhiệm vụ quy định tại khoản 1 Điều 5 của Nghị định này và trực tiếp thực hiện các nhiệm vụ cụ thể do Chính phủ giao. 2. Bảo đảm thực hiện chính sách, pháp luật về sở hữu trí tuệ tại địa phương phù hợp và tuân thủ quy định của Luật Sở hữu trí tuệ và các văn bản pháp luật hướng dẫn thi hành Luật Sở hữu trí tuệ. 3. Định kỳ hoặc đột xuất cung cấp thông tin cho Bộ Khoa học và Công nghệ về hoạt động quản lý nhà nước và bảo vệ quyền sở hữu trí tuệ để phối hợp xử lý các vấn đề phát sinh, tổng hợp báo cáo Thủ tướng Chính phủ.'
      trang_pdf: 8
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 10
      khoan: 1
      noi_dung: '1. Quyền sở hữu công nghiệp đối với sáng chế, thiết kế bố trí, kiểu dáng công nghiệp, nhãn hiệu và chỉ dẫn địa lý được xác lập trên cơ sở quyết định của cơ quan quản lý nhà nước về quyền sở hữu công nghiệp cấp văn bằng bảo hộ cho người nộp đơn đăng ký các đối tượng đó theo quy định tại Chương VII, Chương VIII và Chương IX của Luật Sở hữu trí tuệ và Phụ lục I của Nghị định này. Quyền sở hữu công nghiệp đối với nhãn hiệu đăng ký quốc tế theo Thỏa ước Madrid và Nghị định thư Madrid được xác lập trên cơ sở chấp nhận bảo hộ của cơ quan quản lý nhà nước về quyền sở hữu công nghiệp đối với đăng ký quốc tế đó. Quyền sở hữu công nghiệp đối với kiểu dáng công nghiệp đăng ký quốc tế theo Thỏa ước La Hay được xác lập trên cơ sở chấp nhận bảo hộ của cơ quan quản lý nhà nước về quyền sở hữu công nghiệp đối với đăng ký quốc tế đó.'
      trang_pdf: 10
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 11
      noi_dung: '1. Trong trường hợp điều ước quốc tế liên quan đến sở hữu công nghiệp mà Việt Nam là thành viên có quy định về thừa nhận, bảo hộ quyền sở hữu công nghiệp của tổ chức, cá nhân của các thành viên theo quy định tại Điều 6 của Luật Sở hữu trí tuệ thì quyền sở hữu công nghiệp của tổ chức, cá nhân của các thành viên khác được thừa nhận, bảo hộ tại Việt Nam. Quyền sở hữu công nghiệp được bảo hộ trong phạm vi, thời hạn phù hợp với quy định của điều ước quốc tế và không phải thực hiện thủ tục đăng ký theo quy định của Luật Sở hữu trí tuệ. 2. Bộ Khoa học và Công nghệ công bố mọi thông tin cần thiết liên quan đến quyền sở hữu công nghiệp được thừa nhận, bảo hộ tại Việt Nam theo điều ước quốc tế.'
      trang_pdf: 11
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 13
      khoan: 1
      noi_dung: '1. Tổ chức, cá nhân nước ngoài đáp ứng các điều kiện để được bảo hộ quyền sở hữu công nghiệp tại Việt Nam quy định tại Điều 2 của Nghị định này có thể nộp đơn đăng ký sở hữu công nghiệp tại Việt Nam theo các điều ước quốc tế về hoặc liên quan đến thủ tục nộp đơn quốc tế.'
      trang_pdf: 12
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 13
      khoan: 2
      noi_dung: '2. Tổ chức, cá nhân Việt Nam có thể nộp đơn đăng ký quốc tế sở hữu công nghiệp để yêu cầu bảo hộ quyền của mình tại Việt Nam nếu điều ước quốc tế có quy định.'
      trang_pdf: 13
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 19
      khoan: 1
      noi_dung: '1. Đơn PCT bao gồm Đơn PCT có nguồn gốc Việt Nam và Đơn PCT vào giai đoạn quốc gia.'
      trang_pdf: 23
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 22
      khoan: 1
      noi_dung: '1. Đơn La Hay bao gồm Đơn La Hay có chỉ định Việt Nam và Đơn La Hay có nguồn gốc Việt Nam.'
      trang_pdf: 26
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 25
      khoan: 1
      noi_dung: '1. Đơn Madrid bao gồm Đơn Madrid có nguồn gốc Việt Nam và Đơn Madrid có chỉ định Việt Nam.'
      trang_pdf: 31
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 33
      noi_dung: '1. Chủ thể quyền sở hữu công nghiệp bao gồm tổ chức, cá nhân sở hữu các đối tượng sở hữu công nghiệp quy định tại Điều 121 của Luật Sở hữu trí tuệ hoặc tổ chức, cá nhân được chủ sở hữu chuyển giao quyền sở hữu công nghiệp. 2. Trong trường hợp văn bằng bảo hộ đối với sáng chế, kiểu dáng công nghiệp, thiết kế bố trí, nhãn hiệu được cấp chung cho nhiều tổ chức, cá nhân theo quy định tại khoản 2 Điều 86, khoản 5 Điều 87 và khoản 3 Điều 90 của Luật Sở hữu trí tuệ thì quyền sở hữu công nghiệp thuộc sở hữu chung của các tổ chức, cá nhân đó. Các chủ sở hữu chung thực hiện quyền sở hữu theo quy định của pháp luật dân sự.'
      trang_pdf: 52
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 34
      noi_dung: '1. Phạm vi quyền sở hữu công nghiệp đối với sáng chế, kiểu dáng công nghiệp, thiết kế bố trí, nhãn hiệu, chỉ dẫn địa lý được xác định theo phạm vi bảo hộ được ghi nhận trong Sổ đăng ký quốc gia về sở hữu công nghiệp, Đăng bạ quốc tế về nhãn hiệu và Đăng bạ quốc tế về kiểu dáng công nghiệp hoặc trong văn bằng bảo hộ, giấy xác nhận đăng ký quốc tế nhãn hiệu, quyết định chấp nhận bảo hộ kiểu dáng công nghiệp đăng ký quốc tế. 2. Phạm vi quyền đối với tên thương mại được xác định theo phạm vi bảo hộ tên thương mại, gồm tên thương mại, lĩnh vực kinh doanh và lãnh thổ kinh doanh trong đó tên thương mại được chủ thể mang tên thương mại sử dụng một cách hợp pháp. Việc đăng ký tên gọi của tổ chức, cá nhân kinh doanh trong thủ tục kinh doanh không được coi là sử dụng tên gọi đó mà chỉ là một điều kiện để việc sử dụng tên gọi đó được coi là hợp pháp. 3. Phạm vi quyền đối với bí mật kinh doanh được xác định theo phạm vi bảo hộ bí mật kinh doanh, gồm tập hợp các thông tin tạo thành bí mật kinh doanh, được sắp xếp theo một trật tự chính xác và đầy đủ đến mức có thể khai thác được. 4. Các chủ thể quyền sở hữu công nghiệp được hưởng các quyền và thực hiện các nghĩa vụ theo phạm vi bảo hộ với các điều kiện quy định tại các Điều 132, 133, 133a, 134, 135, 136, 136a, 137 của Luật Sở hữu trí tuệ.'
      trang_pdf: 52
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 40
      noi_dung: '1. Hành vi lưu thông sản phẩm quy định tại điểm d khoản 1, điểm b khoản 2 và điểm b khoản 7 Điều 124 của Luật Sở hữu trí tuệ bao gồm cả hành vi bán, trưng bày để bán, vận chuyển sản phẩm. 2. Việc sử dụng mẫu nhãn hiệu trên thực tế khác biệt với mẫu nhãn hiệu được bảo hộ do chủ sở hữu nhãn hiệu hoặc người được chủ sở hữu nhãn hiệu cho phép thực hiện cũng được coi là sử dụng nhãn hiệu theo quy định tại khoản 5 Điều 124 của Luật Sở hữu trí tuệ nếu sự khác biệt này là không đáng kể, không làm thay đổi khả năng phân biệt của nhãn hiệu.'
      trang_pdf: 57
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 41
      noi_dung: '1. Việc sử dụng sáng chế nhân danh Nhà nước nhằm phục vụ lợi ích công cộng, phi thương mại, phục vụ quốc phòng, an ninh, phòng bệnh, chữa bệnh, dinh dưỡng cho nhân dân hoặc đáp ứng các nhu cầu cấp thiết khác của xã hội theo quy định tại khoản 1 Điều 133 của Luật Sở hữu trí tuệ do các bộ, cơ quan ngang bộ thực hiện hoặc chỉ định tổ chức, cá nhân khác thực hiện trên cơ sở ban hành quyết định bắt buộc chuyển giao quyền sử dụng sáng chế quy định tại điểm a khoản 1 Điều 145 và đoạn 2 khoản 1 Điều 147 của Luật Sở hữu trí tuệ. Trong trường hợp sản phẩm nhập khẩu, sản phẩm do bên nhận chuyển quyền sử dụng sáng chế theo hợp đồng sản xuất đã đáp ứng các nhu cầu quốc phòng, an ninh, phòng bệnh, chữa bệnh, dinh dưỡng cho nhân dân hoặc các nhu cầu cấp thiết khác của xã hội thì người nắm độc quyền sử dụng sáng chế được xem là đã thực hiện nghĩa vụ sử dụng theo quy định tại Điều 136 của Luật Sở hữu trí tuệ. 2. Thủ tục ban hành quyết định bắt buộc chuyển giao quyền sử dụng sáng chế trong trường hợp sử dụng sáng chế nhân danh Nhà nước thực hiện theo quy định tại các Điều 55 và 56 của Nghị định này.'
      trang_pdf: 57
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
    - dieu: 55
      khoan: 7
      noi_dung: '7. Trường hợp yêu cầu ra quyết định bắt buộc chuyển giao quyền sử dụng sáng chế trên cơ sở quy định tại điểm đ khoản 1 Điều 145 của Luật Sở hữu trí tuệ, hồ sơ phải có tài liệu chứng minh rằng việc sử dụng sáng chế nhằm đáp ứng nhu cầu về dược phẩm để phòng, chữa bệnh của quốc gia khác có đủ điều kiện nhập khẩu theo quy định của Điều 31bis Hiệp định về các khía cạnh liên quan tới thương mại của quyền sở hữu trí tuệ.'
      trang_pdf: 72
      sha256_pdf: 4d0d6e7083feeac0936e385b5de64b1c4089ae5c9147fb7e2f7c8a103fd7a2e5
ghi_chu: 'Xác minh nguồn bậc A (OZV-561, OZV-1779) — hướng dẫn Luật Sở hữu trí tuệ về sở hữu công nghiệp, bảo vệ quyền SHTT (bao gồm biện pháp kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến sở hữu công nghiệp, quyền đối với giống cây trồng tại Chương IV Phần thứ tư, từ Điều 99 đến Điều 104) và quản lý nhà nước về SHTT. Khoản 2 Điều 124 thay thế toàn bộ NĐ 103/2006/NĐ-CP từ 23/08/2023; văn bản đã được hợp nhất tại VBHN 04/VBHN-BKHCN ngày 26/04/2026 của Bộ Khoa học và Công nghệ.'
