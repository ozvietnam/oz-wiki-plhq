xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn PDF ký số (65-nd-cp.signed.pdf, Phó Thủ tướng Trần Lưu Quang ký) trên vanban.chinhphu.vn (docid=208550), Công báo (40056) và bản HTML toàn văn 125 Điều trên CSDLQG vbpl.vn (ID 164372): số hiệu 65/2023/NĐ-CP, tiêu đề, ngày ban hành 23/08/2023, gồm 9 Chương 125 Điều và 7 Phụ lục; khoản 1 Điều 124 quy định có hiệu lực thi hành từ ngày 23/08/2023; khoản 2 Điều 124 thay thế toàn bộ Nghị định 103/2006/NĐ-CP ngày 22/09/2006 (cùng các quy định về sở hữu công nghiệp, quyền đối với giống cây trồng và quản lý nhà nước về SHTT tại NĐ 105/2006/NĐ-CP, NĐ 119/2010/NĐ-CP, NĐ 122/2010/NĐ-CP và Điều 1 NĐ 154/2018/NĐ-CP); đang còn hiệu lực (vbpl.vn effStatus CHL, đã được sửa đổi, bổ sung một số điều bởi NĐ 151/2025/NĐ-CP, NĐ 15/2026/NĐ-CP, NĐ 33/2026/NĐ-CP và NĐ 100/2026/NĐ-CP theo VBHN 04/VBHN-BKHCN ngày 26/04/2026)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác minh nguồn bậc A (OZV-561) — hướng dẫn Luật Sở hữu trí tuệ về sở hữu công nghiệp, bảo vệ quyền SHTT (bao gồm biện pháp kiểm soát hàng hóa xuất khẩu, nhập khẩu liên quan đến sở hữu trí tuệ tại Mục 2 Chương VI, từ Điều 98 đến Điều 102) và quản lý nhà nước về SHTT. Khoản 2 Điều 124 thay thế toàn bộ NĐ 103/2006/NĐ-CP từ 23/08/2023; văn bản đã được hợp nhất tại VBHN 04/VBHN-BKHCN ngày 26/04/2026 của Bộ Khoa học và Công nghệ.'
