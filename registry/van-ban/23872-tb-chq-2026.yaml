  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/11/6/VB_23872.pdf, id=106707, SHA-256 4bb708833a71be208e9acb31708b86599466e784b67ad034ac24b3543815021b): Thông báo số 23872/TB-CHQ ngày 04-11-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module giao tiếp kỹ thuật số (Digital Communication Module - DCM, ký mã hiệu SC8080, lắp trong máy lọc máu liên tục CRRT PrisMax để nhận, lưu đệm và truyền dữ liệu điều trị qua WiFi tới hệ thống bệnh án điện tử EMR), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực kể từ ngày ký'
