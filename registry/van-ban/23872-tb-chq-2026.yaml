ghi_chu: 'Xác định trước mã số mặt hàng Module giao tiếp kỹ thuật số (Digital Communication Module - DCM, ký mã hiệu SC8080, tích hợp vi xử lý Digi ConnectCore 6UL NXP i.MX6UL ARM Cortex-A7, WiFi IEEE 802.11 a/b/g/n/ac, cổng Ethernet RJ45 và đầu nối Hirose 50 chân, lắp cố định trong máy lọc máu liên tục PrisMax để nhận dữ liệu điều trị một chiều qua UART và chuyển tiếp qua WiFi đến hệ thống bệnh án điện tử EMR) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
