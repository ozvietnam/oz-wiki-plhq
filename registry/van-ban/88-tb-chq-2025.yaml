  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/17/VB_88.pdf, id=99607, SHA-256 62e872ae457dfa2a66e039df60d228e2e277ff813026d33054fa738799fe7039): Thông báo số 88/TB-CHQ ngày 12-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Miếng điều hướng dây giày bằng vải dạng cuộn chưa cắt BaseTX2 (tên thương mại Lace Guide, BaseTX2, 15mm, ký, mã hiệu 2024852, nhãn hiệu BOA; theo Thông báo kết quả giám định số 342-24/GĐ-VTRI ngày 19-12-2024 của Viện nghiên cứu dệt may VTRI là vải dệt thoi khổ hẹp từ 67,5% filament Polyeste và 32,5% filament Polypropylene, khổ rộng 15mm, dày 0,9mm, chưa ngâm tẩm hay tráng phủ, ở dạng cuộn chưa cắt, dùng để điều chỉnh hướng đi của dây giày), phân loại vào nhóm 58.06, phân nhóm 5806.32, mã số 5806.32.90; có hiệu lực kể từ ngày ban hành'
