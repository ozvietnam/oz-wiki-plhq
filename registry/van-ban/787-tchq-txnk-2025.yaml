  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/2/18/787.TCHQ-TXNK.pdf, id=99017, SHA-256 4068214721783d7ca49e6bf8f20a2826e5bc60292df39ad6276747d02ed4fdc5): Công văn hỏa tốc số 787/TCHQ-TXNK ngày 18-02-2025 của Tổng cục Hải quan (Phó Tổng cục trưởng Âu Anh Tuấn ký) hướng dẫn các Cục Hải quan tỉnh, thành phố cập nhật nghĩa vụ thuế GTGT phát sinh đối với hàng hóa nhập khẩu trị giá thấp nhóm 2 gửi qua dịch vụ chuyển phát nhanh trên hệ thống Kế toán thuế tập trung (KTTTT) theo Quyết định số 01/2025/QĐ-TTg và Công văn số 1813/BTC-TCHQ (quy tắc cấp số tờ khai 11YYAAAAxxxx loại hình A45 cho bảng kê 02-BKTKTGT đối với đường không, đường biển; nhập số tờ khai giấy đối với đường bộ, đường sắt; hạch toán thu NSNN, trừ lùi số tiền ký quỹ/bảo lãnh chung trên TK 138, TK 131, TK 132 theo Quyết định 1647/QĐ-TCHQ và Thông tư 191/2015/TT-BTC)'
