ghi_chu: 'Hướng dẫn nghiệp vụ tạo số tờ khai (quy tắc 11YYAAAAxxxx, loại hình A45), cập nhật thông báo thuế, hạch toán NSNN và trừ lùi ký quỹ trên hệ thống Kế toán thuế tập trung (KTTTT) đối với thuế GTGT hàng nhập khẩu trị giá thấp gửi qua chuyển phát nhanh theo Quyết định số 01/2025/QĐ-TTg.'
