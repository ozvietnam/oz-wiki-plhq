ghi_chu: 'Xác định trước mã số mặt hàng Yến chưng đường phèn (thực phẩm chế biến sẵn dạng nước uống dùng trực tiếp không có ga, thành phần gồm nước 77.2%, tổ yến tươi 14.3%, đường phèn 8%, phụ gia INS 327, INS 415, INS 202 và hương yến tổng hợp 0.5%, tiệt trùng ở 119 độ C) thuộc nhóm 22.02, phân nhóm 2202.99, mã số 2202.99.50.'
