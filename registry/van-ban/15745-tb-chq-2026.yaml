  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/29/3.VB_15745.pdf, id=103435, SHA-256 649b1ce1ddf7908467c51297b0bda76dd32a11f701a15900ba05903a6172875d): Thông báo số 15745/TB-CHQ ngày 28-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chế phẩm dầu cắt gọt tổng hợp đa năng hiệu suất cao TEXMO MEX 209 (ký, mã hiệu TEXMO MEX 209; thành phần theo trọng lượng gồm Caprylic acid CAS 67762-36-1 17%, Polyether CAS 9003-11-6 19%, Inhibitors CAS 2492-26-4 1%, nước CAS 7732-18-5 63%; dạng chất lỏng không màu trong suốt, tỷ trọng 0,95-1,08, độ pH dung dịch pha loãng 5% từ 7,3-8,5, đóng gói 18 lít/thùng; pha loãng với nước để bôi trơn, làm mát, làm sạch bề mặt và chống ăn mòn, chống gỉ trong gia công cắt gọt kim loại, vỏ điện thoại và chi tiết chính xác), phân loại vào nhóm 34.03, phân nhóm 3403.99, mã số 3403.99.19; có hiệu lực kể từ ngày ban hành'
