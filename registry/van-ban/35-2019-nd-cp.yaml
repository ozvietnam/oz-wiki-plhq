# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 35/2019/NĐ-CP
loai: NGHI_DINH
ten: Quy định xử phạt vi phạm hành chính trong lĩnh vực Lâm nghiệp
co_quan: CP
ngay_ban_hanh: '2019-04-25'
hieu_luc_tu: '2019-06-10'
tinh_trang: CON_HIEU_LUC
nhanh:
  - xu-phat
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 419 + 420 ngày 05-05-2019 (raw/download/congbaocdn.chinhphu.vn/35-2019-nd-cp.pdf, 76 trang, trang 3–78 của số Công báo, có lớp chữ ký số bởi Cổng Thông tin điện tử Chính phủ / Văn phòng Chính phủ ngày 09-05-2019, SHA-256 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610), bản HTML Công báo (raw/download/congbao.chinhphu.vn/35-2019-nd-cp.html) và trang wiki/sources/35-2019-nd-cp.md: Thủ tướng Nguyễn Xuân Phúc ký ban hành ngày 25-04-2019; cấu trúc 4 Chương / 38 Điều; Điều 36 khoản 1-2 có hiệu lực thi hành từ ngày 10-06-2019 và thay thế NĐ 157/2013/NĐ-CP cùng Điều 3 NĐ 41/2017/NĐ-CP; hiện còn hiệu lực, đã được sửa đổi, bổ sung một số điều bởi Nghị định 07/2022/NĐ-CP.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Nghị định này quy định về hành vi vi phạm, hình thức xử phạt, mức xử phạt, biện pháp khắc phục hậu quả đối với hành vi vi phạm hành chính; thẩm quyền xử phạt và thẩm quyền lập biên bản vi phạm hành chính trong lĩnh vực Lâm nghiệp. 2. Các hành vi vi phạm hành chính khác trong lĩnh vực Lâm nghiệp không được quy định tại Nghị định này thì áp dụng quy định tại các nghị định của Chính phủ về xử phạt vi phạm hành chính trong lĩnh vực quản lý nhà nước khác có liên quan để xử phạt.'
      trang_pdf: 1
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 2
      noi_dung: '1. Nghị định này áp dụng đối với tổ chức, cá nhân trong nước và tổ chức, cá nhân nước ngoài có hành vi vi phạm hành chính trong lĩnh vực Lâm nghiệp trên lãnh thổ Việt Nam; người có thẩm quyền lập biên bản và thẩm quyền xử phạt vi phạm hành chính theo quy định tại Nghị định này. 2. Tổ chức quy định tại khoản 1 Điều này gồm: a) Cơ quan nhà nước có hành vi vi phạm mà hành vi đó không thuộc nhiệm vụ quản lý nhà nước được giao; b) Doanh nghiệp được thành lập và hoạt động theo pháp luật Việt Nam; chi nhánh, văn phòng đại diện của doanh nghiệp nước ngoài hoạt động tại Việt Nam; c) Hợp tác xã, liên hiệp hợp tác xã; d) Tổ chức, đơn vị sự nghiệp công lập; đ) Tổ chức nghề nghiệp hoạt động trong lĩnh vực Lâm nghiệp. 3. Cá nhân quy định tại khoản 1 Điều này là những đối tượng không thuộc quy định tại khoản 2 Điều này.'
      trang_pdf: 2
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 3
      noi_dung: 'Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Kiểm lâm viên là công chức thuộc các ngạch kiểm lâm, biên chế trong cơ quan kiểm lâm. 2. Bộ phận cơ thể không thể tách rời sự sống là những bộ phận thực hiện các chức năng chuyên biệt của cơ thể động vật, ngay khi tách rời những bộ phận này khỏi cơ thể sống của động vật thì động vật đó chết (ví dụ: đầu, tim, bộ da, bộ xương, buồng gan...). 3. Sản phẩm của động vật rừng là các loại sản phẩm có nguồn gốc từ động vật rừng như: thịt, trứng, sữa, tinh dịch, phôi động vật, huyết, dịch mật, nội tạng, da, lông, xương, sừng, ngà, chân, móng...; vật phẩm có thành phần từ các bộ phận của động vật rừng đã qua chế biến như: cao nấu từ xương động vật, túi xách, ví, dây thắt lưng làm từ da động vật rừng. 4. Rừng khoanh nuôi tái sinh thuộc rừng chưa có trữ lượng bao gồm: rừng tái sinh tự nhiên hoặc rừng khoanh nuôi xúc tiến tái sinh tự nhiên có trữ lượng cây đứng dưới 10 m3/ha. 5. Tang vật, phương tiện vi phạm hành chính gồm: a) Lâm sản khai thác, mua bán, vận chuyển, tàng trữ, chế biến trái quy định của pháp luật; b) Dụng cụ, công cụ, các loại cưa xăng để sử dụng thực hiện hành vi vi phạm hành chính; c) Phương tiện gồm: các loại xe đạp, xe thô sơ, xe mô tô; các loại xe cơ giới đường bộ, tàu thủy, thuyền, ca-nô, sà lan và các phương tiện khác được sử dụng để thực hiện hành vi vi phạm hành chính. 6. Phương tiện bị người vi phạm hành chính chiếm đoạt trái phép là trường hợp phương tiện của chủ sở hữu hợp pháp bị người có hành vi vi phạm hành chính trộm cắp, cướp, cưỡng đoạt, lạm dụng tín nhiệm để chiếm đoạt, lợi dụng chủ tài sản không có điều kiện ngăn cản để chiếm đoạt hoặc các hành vi trái pháp luật khác tước đoạt quyền chiếm hữu, quản lý, sử dụng. 7. Phương tiện bị người vi phạm sử dụng trái phép là trường hợp chủ sở hữu hợp pháp, người quản lý hợp pháp hoặc người sử dụng hợp pháp phương tiện cho người khác thuê, mượn hoặc thuê người khác điều khiển phương tiện hoặc giao phương tiện cho người lao động của mình điều khiển để sử dụng vào mục đích hợp pháp, nhưng người được thuê, được mượn phương tiện hoặc người được giao điều khiển phương tiện đó đã tự ý sử dụng phương tiện để vi phạm hành chính.'
      trang_pdf: 2
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 4
      khoan: 1
      noi_dung: '1. Đối với mỗi hành vi vi phạm hành chính trong lĩnh vực Lâm nghiệp, tổ chức, cá nhân phải chịu một trong các hình thức xử phạt chính là cảnh cáo hoặc phạt tiền. 2. Tùy theo tính chất, mức độ vi phạm tổ chức, cá nhân có hành vi vi phạm còn có thể bị áp dụng một hoặc nhiều hình thức xử phạt bổ sung sau đây: a) Tịch thu tang vật, phương tiện được sử dụng để vi phạm hành chính; b) Đình chỉ hoạt động khai thác rừng có thời hạn từ 06 tháng đến 12 tháng; c) Đình chỉ hoạt động của cơ sở chế biến lâm sản có thời hạn từ 06 tháng đến 12 tháng.'
      trang_pdf: 3
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 5
      noi_dung: '1. Diện tích rừng hoặc diện tích có cây trồng chưa thành rừng tính bằng mét vuông (m2). 2. Khối lượng gỗ tính bằng mét khối (m3). 3. Đơn vị tính và phương pháp xác định số lượng, khối lượng lâm sản theo quy định của Bộ Nông nghiệp và Phát triển nông thôn. Đối với tang vật vi phạm là gỗ, khi xử phạt vi phạm hành chính phải quy thành gỗ tròn. Quy đổi khối lượng các loại gỗ xẻ, gỗ đẽo thành gỗ tròn bằng cách nhân với hệ số 1,6. 4. Động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thuộc loài thông thường; động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIB; sản phẩm của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IB; thực vật rừng ngoài gỗ và sản phẩm gỗ xác định trị giá bằng tiền Việt Nam, đơn vị tính là đồng.'
      trang_pdf: 5
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 6
      khoan: 1
      noi_dung: '1. Mức phạt tiền đối với hành vi vi phạm hành chính quy định tại Nghị định này là mức phạt tiền được áp dụng đối với cá nhân, mức phạt tiền tối đa trong lĩnh vực Lâm nghiệp đối với cá nhân là 500.000.000 đồng; tổ chức vi phạm áp dụng phạt tiền bằng 2 lần mức phạt tiền với cá nhân có cùng hành vi và mức độ vi phạm, mức phạt tiền tối đa trong lĩnh vực Lâm nghiệp đối với tổ chức là 1.000.000.000 đồng. 2. Hành vi vi phạm hành chính đối với gỗ, thực vật rừng ngoài gỗ thuộc Danh mục loài nguy cấp, quý, hiếm được ưu tiên bảo vệ, thì áp dụng xử phạt hành vi vi phạm như đối với gỗ, thực vật rừng ngoài gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IA. 3. Hành vi vi phạm hành chính đối với các loài thuộc Phụ lục I Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp, thì áp dụng xử phạt hành vi vi phạm như đối với thực vật rừng, động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm I. Hành vi vi phạm hành chính đối với các loài thuộc Phụ lục II Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp, thì áp dụng xử phạt hành vi vi phạm như đối với thực vật rừng, động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm II.'
      trang_pdf: 5
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 22
      khoan: 1
      noi_dung: 'Hành vi vận chuyển lâm sản (từ thời điểm lâm sản đã xếp lên phương tiện vận chuyển) không có hồ sơ hợp pháp hoặc có hồ sơ hợp pháp nhưng lâm sản thực tế vận chuyển không phù hợp với hồ sơ đó, bị xử phạt như sau: 1. Phạt tiền từ 5.000.000 đồng đến 15.000.000 đồng đối với một trong các trường hợp sau: a) Động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thông thường trị giá dưới 15.000.000 đồng; b) Động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIB trị giá dưới 7.000.000 đồng; c) Gỗ thuộc loài thông thường dưới 02 m3; d) Gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIA dưới 01 m3; đ) Gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IA dưới 0,2 m3; e) Thực vật rừng ngoài gỗ trị giá dưới 15.000.000 đồng; g) Sản phẩm chế biến từ gỗ không có hồ sơ lâm sản hợp pháp trị giá dưới 15.000.000 đồng.'
      trang_pdf: 44
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 22
      khoan: 20
      noi_dung: '20. Hình thức xử phạt bổ sung: a) Tịch thu tang vật vi phạm đối với hành vi quy định tại khoản 1, khoản 2, khoản 3, khoản 4, khoản 5, khoản 6, khoản 7, khoản 8, khoản 9, khoản 10, khoản 11, khoản 12, khoản 13, khoản 14, khoản 15, khoản 16, khoản 17, khoản 18 và khoản 19 Điều này (trừ trường hợp gỗ có hồ sơ và nguồn gốc hợp pháp nhưng khối lượng gỗ thực tế vượt quá sai số cho phép theo quy định của Bộ Nông nghiệp và Phát triển nông thôn). b) Tịch thu phương tiện đối với hành vi quy định tại khoản 1, khoản 2, khoản 3, khoản 4, khoản 5, khoản 6, khoản 7, khoản 8, khoản 9, khoản 10, khoản 11, khoản 12, khoản 13, khoản 14, khoản 15, khoản 16, khoản 17, khoản 18 và khoản 19 Điều này thuộc một trong các trường hợp sau: Vi phạm có tổ chức hoặc vi phạm nhiều lần hoặc tái phạm. Sử dụng xe tự ý cải tạo thành hai ngăn, hai đáy, hai mui trở lên; xe không có đăng ký do cơ quan nhà nước có thẩm quyền cấp đối với loại xe theo quy định của pháp luật phải đăng ký quyền sở hữu phương tiện; xe đeo biển số giả. Vận chuyển gỗ thuộc loài thông thường từ 05 m3 trở lên; gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIA từ 2,5 m3 trở lên; gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IA từ 0,4 m3 trở lên; thực vật rừng ngoài gỗ trị giá 25.000.000 đồng trở lên; sản phẩm chế biến từ gỗ không có hồ sơ lâm sản hợp pháp trị giá từ 25.000.000 đồng trở lên. Vận chuyển động vật rừng, bộ phận cơ thể hoặc sản phẩm của chúng thuộc loài thông thường trị giá 25.000.000 trở lên; động vật rừng, bộ phận cơ thể hoặc sản phẩm của chúng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIB trị giá 15.000.000 đồng trở lên; sản phẩm của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IB trị giá từ 1.000.000 đồng trở lên. Vận chuyển động vật rừng hoặc bộ phận không thể tách rời sự sống của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IB; ngà voi, sừng tê giác. Vận chuyển lâm sản trái pháp luật có 02 loại gỗ trở lên (gỗ không thuộc loài nguy cấp, quý, hiếm và gỗ thuộc loài nguy cấp quý, hiếm) hoặc nhiều loại lâm sản khác nhau ngoài gỗ thuộc loài nguy cấp, quý, hiếm, tuy khối lượng của một loại gỗ hoặc trị giá của mỗi loại lâm sản chưa đến mức bị tịch thu phương tiện nhưng tổng khối lượng các loại gỗ vận chuyển trái pháp luật từ 05 m3 trở lên hoặc tổng trị giá các loại lâm sản khác ngoài gỗ vận chuyển trái pháp luật trị giá 25.000.000 đồng trở lên.'
      trang_pdf: 52
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 23
      khoan: 1
      noi_dung: 'Hành vi tàng trữ, mua, bán, chế biến lâm sản không có hồ sơ hợp pháp hoặc có hồ sơ hợp pháp nhưng lâm sản không đúng với nội dung hồ sơ đó, bị xử phạt như sau: 1. Phạt tiền từ 5.000.000 đồng đến 15.000.000 đồng đối với một trong các trường hợp sau: a) Động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thông thường trị giá dưới 15.000.000 đồng; b) Động vật rừng, bộ phận cơ thể hoặc sản phẩm của động vật rừng thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIB trị giá đến dưới 7.000.000 đồng; c) Gỗ thuộc loài thông thường dưới 02 m3; d) Gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IIA dưới 01 m3; đ) Gỗ thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm Nhóm IA dưới 0,2 m3; e) Thực vật rừng ngoài gỗ trị giá dưới 15.000.000 đồng; g) Sản phẩm chế biến từ gỗ không có hồ sơ lâm sản hợp pháp trị giá dưới 15.000.000 đồng.'
      trang_pdf: 54
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 24
      khoan: 1
      noi_dung: '1. Phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Chủ lâm sản vận chuyển, mua bán, cất giữ, chế biến thực vật rừng ngoài gỗ; động vật rừng hoặc bộ phận, sản phẩm của chúng có nguồn gốc hợp pháp nhưng không chấp hành đầy đủ các quy định của pháp luật về hồ sơ lâm sản hợp pháp; b) Chủ lâm sản vận chuyển, mua bán, cất giữ, chế biến gỗ rừng trồng, gỗ vườn nhà, cây trồng phân tán có nguồn gốc hợp pháp nhưng không chấp hành đầy đủ các quy định của pháp luật về hồ sơ lâm sản hợp pháp; c) Người điều khiển phương tiện, chủ lâm sản không xuất trình hồ sơ lâm sản trong thời hạn 24 giờ kể từ thời điểm kiểm tra cho người có thẩm quyền khi kiểm tra phương tiện vận chuyển lâm sản.'
      trang_pdf: 63
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 24
      khoan: 3
      noi_dung: '3. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Chủ lâm sản vận chuyển, mua bán, cất giữ, chế biến lâm sản có nguồn gốc nhập khẩu, nguồn gốc sau xử lý tịch thu hợp pháp nhưng không chấp hành đầy đủ các quy định của pháp luật về hồ sơ lâm sản hợp pháp; b) Chủ cơ sở nuôi, trồng vì mục đích thương mại loài thuộc Danh mục thực vật rừng, động vật rừng nguy cấp, quý, hiếm hoặc các loài thuộc Phụ lục Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp có nguồn gốc hợp pháp nhưng không đăng ký mã số cơ sở nuôi, trồng theo quy định của pháp luật. 4. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với chủ lâm sản vận chuyển, mua bán, cất giữ, chế biến lâm sản có nguồn gốc từ rừng tự nhiên hợp pháp nhưng không chấp hành đầy đủ các quy định pháp luật về hồ sơ lâm sản hợp pháp.'
      trang_pdf: 64
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 25
      noi_dung: '1. Người có thẩm quyền xử phạt quy định tại Nghị định này. 2. Công chức, viên chức và người thuộc lực lượng Quân đội nhân dân, Công an nhân dân trong các cơ quan quy định tại các Điều 26, Điều 27, Điều 28, Điều 29, Điều 30, Điều 31, Điều 32 và Điều 33 của Nghị định này đang thi hành công vụ, nhiệm vụ theo chức năng, nhiệm vụ được giao thanh tra, kiểm tra về quản lý rừng, phát triển rừng, sử dụng rừng, bảo vệ rừng và quản lý lâm sản.'
      trang_pdf: 64
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 33
      noi_dung: '1. Công chức Hải quan đang thi hành công vụ có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 500.000 đồng. 2. Đội trưởng thuộc Chi cục Hải quan, Đội trưởng thuộc Chi cục Kiểm tra sau thông quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 5.000.000 đồng. 3. Chi cục trưởng Chi cục Hải quan, Chi cục trưởng Chi cục Kiểm tra sau thông quan, Đội trưởng Đội kiểm soát thuộc Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc trung ương, Đội trưởng Đội kiểm soát chống buôn lậu, Hải đội trưởng Hải đội kiểm soát trên biển và Đội trưởng Đội kiểm soát bảo vệ quyền sở hữu trí tuệ thuộc Cục điều tra chống buôn lậu Tổng cục Hải quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 25.000.000 đồng; c) Tịch thu tang vật, phương tiện được sử dụng để vi phạm hành chính có trị giá không vượt quá 25.000.000 đồng; d) Áp dụng các biện pháp khắc phục hậu quả được quy định tại điểm d và điểm đ khoản 3 Điều 4 của Nghị định này. 4. Cục trưởng Cục Điều tra chống buôn lậu, Cục trưởng Cục Kiểm tra sau thông quan thuộc Tổng cục Hải quan, Cục trưởng Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc Trung ương có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 50.000.000 đồng; c) Đình chỉ hoạt động của cơ sở chế biến lâm sản có thời hạn từ 06 tháng đến 12 tháng; d) Tịch thu tang vật, phương tiện được sử dụng để vi phạm hành chính có trị giá không vượt quá 50.000.000 đồng; đ) Áp dụng các biện pháp khắc phục hậu quả được quy định tại điểm d và điểm đ khoản 3 Điều 4 của Nghị định này. 5. Tổng cục trưởng Tổng cục Hải quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 500.000.000 đồng; c) Tịch thu tang vật, phương tiện được sử dụng để vi phạm hành chính; d) Áp dụng các biện pháp khắc phục hậu quả được quy định tại điểm d và điểm đ khoản 3 Điều 4 của Nghị định này.'
      trang_pdf: 72
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 34
      khoan: 5
      noi_dung: '3. Những người có thẩm quyền của lực lượng Cảnh sát biển có thẩm quyền xử phạt vi phạm hành chính, có quyền áp dụng các hình thức xử phạt bổ sung và biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Điều 22, Điều 23 và Điều 24 theo thẩm quyền quy định tại Điều 31 của Nghị định này thuộc phạm vi quản lý và chức năng, nhiệm vụ, quyền hạn được giao. 4. Những người có thẩm quyền của lực lượng Quản lý thị trường có thẩm quyền xử phạt vi phạm hành chính, có quyền áp dụng các hình thức xử phạt bổ sung và biện pháp khắc phục hậu quả đối với các hành vi vi phạm quy định tại Điều 23, Điều 24 theo thẩm quyền quy định tại Điều 32 của Nghị định này thuộc phạm vi quản lý và chức năng, nhiệm vụ, quyền hạn được giao. 5. Những người có thẩm quyền của lực lượng Hải quan có thẩm quyền xử phạt vi phạm hành chính, có quyền áp dụng các hình thức xử phạt bổ sung và biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Điều 22 và Điều 23 theo thẩm quyền quy định tại Điều 33 của Nghị định này thuộc phạm vi quản lý và chức năng, nhiệm vụ, quyền hạn được giao.'
      trang_pdf: 74
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 35
      noi_dung: '1. Xác định và phân định thẩm quyền xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả thực hiện theo quy định tại Điều 52 Luật xử lý vi phạm hành chính. 2. Xác định trị giá tang vật vi phạm hành chính (kể cả lâm sản thuộc loài nguy cấp, quý, hiếm) để làm căn cứ xác định khung tiền phạt, thẩm quyền xử phạt thực hiện theo quy định tại Điều 60 Luật xử lý vi phạm hành chính và quy định của pháp luật hiện hành.'
      trang_pdf: 74
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 36
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 10 tháng 6 năm 2019. 2. Nghị định này thay thế Nghị định số 157/2013/NĐ-CP ngày 11 tháng 11 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính về quản lý rừng, phát triển rừng, bảo vệ rừng và quản lý lâm sản và Điều 3 Nghị định số 41/2017/NĐ-CP ngày 05 tháng 4 năm 2017 của Chính phủ về sửa đổi, bổ sung một số điều của nghị định về xử phạt vi phạm hành chính trong hoạt động thủy sản; lĩnh vực thú y, giống vật nuôi, thức ăn chăn nuôi; quản lý rừng, phát triển rừng, bảo vệ rừng và quản lý lâm sản. 3. Đối với các hành vi vi phạm quy định về kinh doanh giống cây lâm nghiệp chính đồng thời được quy định tại Nghị định số 31/2016/NĐ-CP ngày 06 tháng 5 năm 2016 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực giống cây trồng, bảo vệ và kiểm dịch thực vật thì xử phạt vi phạm hành chính theo quy định tại Nghị định này.'
      trang_pdf: 74
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 37
      noi_dung: '1. Các hành vi vi phạm hành chính xảy ra trước ngày Nghị định này có hiệu lực thi hành thì áp dụng Nghị định số 157/2013/NĐ-CP ngày 11 tháng 11 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính về quản lý rừng, phát triển rừng, bảo vệ rừng và quản lý lâm sản; Nghị định số 41/2017/NĐ-CP ngày 05 tháng 4 năm 2017 của Chính phủ về sửa đổi, bổ sung một số điều của nghị định về xử phạt vi phạm hành chính trong hoạt động thủy sản; lĩnh vực thú y, giống vật nuôi, thức ăn chăn nuôi; quản lý rừng, phát triển rừng, bảo vệ rừng và quản lý lâm sản; Nghị định số 31/2016/NĐ-CP ngày 06 tháng 5 năm 2016 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực giống cây trồng, bảo vệ và kiểm dịch thực vật để xử phạt. 2. Đối với hành vi vi phạm hành chính về kinh doanh giống cây lâm nghiệp, trong quản lý rừng, phát triển rừng, bảo vệ rừng và quản lý lâm sản xảy ra trước khi Nghị định này có hiệu lực mà sau đó mới bị phát hiện thì áp dụng các quy định có lợi cho tổ chức, cá nhân vi phạm.'
      trang_pdf: 75
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 38
      khoan: 1
      noi_dung: '1. Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn có trách nhiệm hướng dẫn và tổ chức thực hiện Nghị định này.'
      trang_pdf: 75
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
    - dieu: 38
      khoan: 2
      noi_dung: '2. Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm thi hành Nghị định này.'
      trang_pdf: 76
      sha256_pdf: 7f42a0bac6edc738e59e70a790e6604228553cca846d8ce8b8ec40f8a6588610
ghi_chu: 'Nghị định xử phạt vi phạm hành chính trong lĩnh vực Lâm nghiệp (gồm vận chuyển, xuất nhập khẩu lâm sản trái phép).'
