ghi_chu: 'Nạp đợt "làm tất" 6/11 (#87 P1/P2 + #209). CẢNH BÁO NHẪM: issue #87 gán "47/2017/NĐ-CP — Kho bãi hải quan (có sửa đổi/QĐ 2023?)" — SAI; đây là NĐ mức lương cơ sở 1.300.000 đ (01/07/2017). Chuỗi lương cơ sở: 47/2016 → 47/2017 → 72/2018/NĐ-CP (thay thế từ 01/07/2018) → 38/2019/NĐ-CP (HL 01/07/2019, bãi bỏ 72/2018 — đọc scan). Không thấy sửa đổi nào cho 47/2017 ngoài việc bị thay thế. Về "kho bãi hải quan" mà issue ý chỉ: lượt này không xác định được NĐ riêng về kho ngoại quan/địa điểm thu gom hàng lẻ; thủ tục và giám sát kho, địa điểm làm thủ tục hải quan hiện theo NĐ 08/2015/NĐ-CP (đã sửa bởi NĐ 167/2025/NĐ-CP, dẫn trong NĐ 336/2026) — cần săn thêm. Liên quan XNK: không liên quan; gắn nhãn quan-ly-ngoai-thương tạm để theo mẫu sổ, nên bỏ khi hợp nhất.'
