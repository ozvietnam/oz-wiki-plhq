  pham_vi: 'Đọc toàn văn 4 trang bản scan ký số (OCR): số 47/2017/NĐ-CP ngày 24/4/2017, Điều 5 hiệu lực 01/07/2017 và bãi bỏ NĐ 47/2016/NĐ-CP; đọc điều cuối NĐ 72/2018/NĐ-CP (bản scan): Điều 5 khoản 2 NĐ 72/2018 (HL 01/07/2018) thay thế NĐ 47/2017/NĐ-CP — đủ cơ sở đặt het_hieu_luc_tu 2018-07-01.'
