  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/16/VB_8323.PDF, id=100364, SHA-256 fa92f9dfd689a1df2b080b6297b674526fc666a24a64baa7aa2baad7d06e8d57): Thông báo số 8323/TB-CHQ ngày 09-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Phốt làm kín dầu NOK (tên gọi theo cấu tạo, công dụng: Bộ phận làm kín dầu kiểu cơ khí; ký, mã hiệu BES1807-A0 TC 27 42 7, nhà sản xuất Tập đoàn NOK Corporation; kích thước đường kính trong 27mm, đường kính ngoài 42mm, độ dày 7mm, trọng lượng 11,6g; cấu tạo gồm lớp cao su NBR nitrile-butadiene rubber bao bọc bên ngoài 38.8%, khung kim loại thép bên trong 56.4% và lò xo thép gắn ở viền trong 4.8%; dùng lắp vào cốt, trục máy công nghiệp để chặn dầu và ngăn bụi), phân loại vào nhóm 84.84, mã số 8484.20.00; có hiệu lực từ ngày ký'
