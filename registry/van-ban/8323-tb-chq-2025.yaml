ghi_chu: 'Xác định trước mã số mặt hàng Phốt làm kín dầu NOK (Bộ phận làm kín dầu kiểu cơ khí; ký, mã hiệu BES1807-A0 TC 27 42 7, nhà sản xuất Tập đoàn NOK Corporation; kích thước đường kính trong 27mm, đường kính ngoài 42mm, độ dày 7mm, trọng lượng 11,6g; làm bằng cao su NBR bọc ngoài kết hợp khung thép bên trong và lò xo thép ở viền trong, dùng làm kín trục chặn dầu, bụi cho máy móc công nghiệp) thuộc nhóm 84.84, mã số 8484.20.00.'
