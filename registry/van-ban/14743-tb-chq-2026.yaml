ghi_chu: 'Xác định trước mã số mặt hàng Mảnh vải vụn từ sợi PA 66 không tráng phủ model PA66-NON-COAT (vải vụn mới 100% từ sản xuất túi khí ô tô, dệt trơn không tráng phủ, Polyamide 66 99%, dầu hoàn thiện <1%, dùng tái chế thành hạt nhựa polyamide 66) thuộc nhóm 63.10, phân nhóm 6310.10, mã số 6310.10.10.'
