  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/3/VB_14743.pdf, id=102999, SHA-256 290b045d36be80c4d96296b89a154a9a3babb654ddfd89a69f049244bde01541): Thông báo số 14743/TB-CHQ ngày 01-04-2026 của Cục Hải quan (ký số 02-04-2026, trên mục lục cổng ghi ký hiệu 14743/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Mảnh vải vụn từ sợi PA 66, không tráng phủ, chưa qua sử dụng, sạch, không lẫn tạp chất, thành phần chính là nhựa polyamide 66, ký mã hiệu PA66-NON-COAT (mảnh vải vụn của quá trình sản xuất túi khí ô tô, vải dệt kiểu vân điểm/dệt trơn Plain weave không tráng phủ, Polyamide 66 99%, dầu hoàn thiện <1%, vải mới 100% màu trắng, dùng làm nguyên liệu tái chế thành hạt nhựa polyamide 66, nhà sản xuất Toray Textiles (Thailand) Public Company Limited), phân loại vào nhóm 63.10, phân nhóm 6310.10, mã số 6310.10.10; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
