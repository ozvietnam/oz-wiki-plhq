      noi_dung: 'Điều 2. Sửa đổi, bổ sung một số điều của Luật Công chứng 1. Sửa đổi, bổ sung khoản 1 Điều 18 như sau: “1. Việc thành lập tổ chức hành nghề công chứng phải tuân theo quy định của Luật này.”. 2. Sửa đổi, bổ sung khoản 1 Điều 24 như sau: “1. Khi thay đổi một trong các nội dung quy định tại khoản 3 Điều 23 của Luật này, Văn phòng công chứng phải đăng ký nội dung thay đổi tại Sở Tư pháp nơi Văn phòng công chứng đã đăng ký hoạt động.”.'
