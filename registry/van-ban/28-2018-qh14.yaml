    - dieu: 11
      noi_dung: 'Điều 11. Sửa đổi, bổ sung một số điều của Luật Trẻ em 1. Sửa đổi, bổ sung khoản 5 Điều 5 như sau: “5. Khi xây dựng chính sách, pháp luật tác động đến trẻ em, phải xem xét ý kiến của trẻ em và của các cơ quan, tổ chức có liên quan; bảo đảm lồng ghép các mục tiêu, chỉ tiêu về trẻ em trong quy hoạch có liên quan theo quy định của pháp luật về quy hoạch, kế hoạch phát triển kinh tế - xã hội quốc gia, ngành và địa phương.”.'
