  pham_vi: 'PDF Công báo số 777 + 778 ngày 15-07-2018 (congbaocdn.chinhphu.vn, 10 trang có lớp chữ): Luật sửa đổi, bổ sung một số điều của 11 luật có liên quan đến quy hoạch, thông qua 15-06-2018, hiệu lực từ 01-01-2019 (Điều 12); Điều 3 sửa đổi Luật Dược 105/2016/QH13 (đã hợp nhất vào 76-VBHN/VPQH ngày 25-03-2026). Ngoài ra Điều 1 sửa Luật ATTP 55/2010/QH12, Điều 7 sửa Luật Hóa chất 06/2007/QH12, Điều 10 sửa Luật Sử dụng năng lượng tiết kiệm và hiệu quả 50/2010/QH12.'
