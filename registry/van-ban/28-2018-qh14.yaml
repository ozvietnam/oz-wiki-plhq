      noi_dung: 'Điều 1. Sửa đổi, bổ sung một số điều của Luật An toàn thực phẩm 1. Sửa đổi, bổ sung khoản 1 Điều 4 như sau: “1. Xây dựng chiến lược quốc gia về an toàn thực phẩm.”. 2. Sửa đổi, bổ sung điểm a khoản 1 Điều 62 như sau: “a) Chủ trì xây dựng, trình cơ quan nhà nước có thẩm quyền ban hành và tổ chức thực hiện chiến lược quốc gia về an toàn thực phẩm;”.'
