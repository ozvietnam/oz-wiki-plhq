  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/30/VB_22371.pdf, id=106211, SHA-256 069d55207202689ff731827460c2b6aef59521080894f3db09058afa03363988): Thông báo số 22371/TB-CHQ ngày 29-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Mô-đun đèn nền (Backlight Module) của bàn phím máy tính, ký mã hiệu D90/D100 Backlight Module (cấu tạo gồm thanh chip LED vật liệu FR4 gắn mạch in PCB, đầu nối và chip LED, tấm phản xạ ánh sáng, tấm dẫn sáng nhựa PC, tấm chắn sáng nhựa PET, miếng bảo vệ đầu kết nối và tấm bảo vệ nhựa PET; kích thước 297,57 x 130,98 x 0,86 mm, điện áp định mức 28 VDC, dòng điện 20 mA, công suất xấp xỉ 0,56 W, độ sáng trung bình 22 nits; lắp ráp trực tiếp trong bàn phím máy tính để chiếu sáng tạo bàn phím phát sáng), phân loại vào nhóm 84.73, phân nhóm 8473.30, mã số 8473.30.90; có hiệu lực từ ngày ký'
