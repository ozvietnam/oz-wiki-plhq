  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/6/VB_22555.pdf, id=106272, SHA-256 662d2f92994eb7f112173b0a02790c68311f67e6e50d0f412120e14681752083): Thông báo số 22555/TB-CHQ ngày 05-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị đeo tay thông minh Watch GT 6 phiên bản đường kính 46mm (ký mã hiệu ATM-B19, hoạt động bằng pin, màn hình cảm ứng AMOLED 1.47 inch độ phân giải 466 x 466 pixels, thân máy bằng thép không gỉ kích thước 46 mm x 10.95 mm, trọng lượng 51g không gồm dây đeo, tích hợp loa, micro, cảm biến IMU 9 trục, cảm biến nhịp tim quang học, hỗ trợ Bluetooth 6.0, GPS, NFC, sạc không dây, không hỗ trợ Wi-Fi và không hỗ trợ eSIM, kết nối với thiết bị chủ qua Bluetooth để đàm thoại, truyền nhận dữ liệu và theo dõi sức khỏe), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
