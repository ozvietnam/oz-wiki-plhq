  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/3/VB_14742.pdf, id=103002, SHA-256 cb3393cf8f1d488f1c13253f83513cd3adc821b638b77409d534ecdfff6809ff): Thông báo số 14742/TB-CHQ ngày 01-04-2026 của Cục Hải quan (ký số 02-04-2026, trên mục lục cổng ghi ký hiệu 14742/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Mảnh vải vụn từ sợi PA 66, có phủ silicone, chưa qua sử dụng, sạch, không lẫn tạp chất, thành phần chính là nhựa polyamide 66, ký mã hiệu PA66-COATED (mảnh vải vụn của quá trình sản xuất túi khí ô tô, vải dệt kiểu vân điểm/dệt trơn Plain weave có phủ silicone, Polyamide 66 78-96%, silicone resin 4-20%, dầu hoàn thiện <1%, chất tạo màu <0,4%, vải mới 100% màu hồng, dùng làm nguyên liệu tái chế thành hạt nhựa polyamide 66, nhà sản xuất Toray Textiles (Thailand) Public Company Limited), phân loại vào nhóm 63.10, phân nhóm 6310.10, mã số 6310.10.10; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Mảnh vải vụn từ sợi PA 66 có phủ silicone model PA66-COATED (vải vụn mới 100% từ sản xuất túi khí ô tô, dệt trơn phủ silicone, Polyamide 66 78-96%, silicone resin 4-20%, dùng tái chế thành hạt nhựa polyamide 66) thuộc nhóm 63.10, phân nhóm 6310.10, mã số 6310.10.10.'
