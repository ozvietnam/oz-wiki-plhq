xac_minh:
  muc: NGUON_A
  pham_vi: "PDF datafiles ký số (lớp chữ, 113 trang, 7657 dòng body.txt): 8 Điều + 2 Phụ lục. Đ1 Phạm vi điều chỉnh (Danh mục rủi ro TB + rủi ro cao BKHCN + mã HS). Đ2 Đối tượng áp dụng (SX/NK/KD + cơ quan liên quan). Đ3 Danh mục rủi ro CAO = Phụ lục I: I. Tiêu chuẩn/Đo lường/Chất lượng — 1.1 Xăng/nhiên liệu điêzen/nhiên liệu sinh học (HS 2710.12.21/.22/.23/.24/.25/.26; 2710.19.71/.72; 2710.20.00 — xăng E5/E10 RON92/95, diesel, B5, RON95-II), 1.2 Khí dầu mỏ hóa lỏng LPG (HS 2711.11/.12/.13/.19; 2711.21.10/.90 — propane/butane/Propylene/Butylene); II. CNTT & Viễn thông — 2.1–2.10 Thiết bị phát/thu-phát vô tuyến điện (HS 8517.11/.13/.14/.18 base stations, 8517.61/.62/.69, 8525.50/.60, 8526.10/.91/.92, 8528.71/.72 set-top box TV, 8543.10/.70 RFID, 8531.10/.90 báo động/chuông, 8517.62.43/.51/.53/.59/.69/.99), 3.1–3.14 Thiết bị vô tuyến điện cự ly ngắn SRD (HS 8539.52.10/.90 đèn LED vô tuyến, 8514.40 thiết bị gia nhiệt/rêu cảm ứng, các thiết bị 60mW+ 2.4/5/6GHz, thiết bị Bluetooth/Zigbee ≥60mW), 4.1–4.6 Pin Lithium (HS 8507.60.10/.31/.90 cho laptop/ĐTDĐ); 5.1–5.2 thiết bị hàn; 6.1–6.2 thiết bị điện gia dụng (HS 8536 CB/RCCB/RCBO); III. An toàn bức xạ & Hạt nhân (quặng urani/thori, chất phóng xạ, nguồn phóng xạ, chất đánh dấu, thiết bị X-quang y tế/công nghiệp). Yêu cầu: KIỂM TRA NHÀ NƯỚC VỀ CHẤT LƯỢNG HÀNG NHẬP KHẨU + CHỨNG NHẬN HỢP QUY. Đ4 Danh mục rủi ro TRUNG BÌNH = Phụ lục II: I. Tiêu chuẩn/Đo lường/Chất lượng — 1 Etanol nhiên liệu (HS 2207.10.00; 2207.20.11/.19), 2 Hàng hóa nhóm thép (HS 7213.91.20/.99.20, 7214.20.31/.41/.51/.61, 7215.50.91, 7215.90.10, 7217.10.22/.33, 7219–7223 thép không gỉ cán phẳng/dài, 7225–7229 thép hợp kim khác, 7306.40/.61/.69 ống thép, 7310.29 bình chứa, 7312.10.91), 3 Máy móc thiết bị công nghiệp (HS 8401.10/.20/.30/.40 lò phản ứng hạt nhân, 8467.21 khoan, 8414.51/.59 quạt, 8421.21/.29 lọc), 4 Hàng tiêu dùng & điện gia dụng (HS 7321 bếp gas, 8418.10/.21/.29/.30/.40/.50/.69 tủ lạnh/tủ đông/máy làm đá, 8450.11/.12/.19 máy giặt, 8516.10/.31/.32/.33/.40/.50/.60/.71/.72/.79 điện/đun nước/lò/ủi/bàn là, 8508.11/.19 máy hút bụi, 8509.40 máy xay/ép, 8544.42 cáp, 8518.10/.21/.22/.29/.30 loa/micro/tai nghe, 9405.11 đèn LED, 8523.52 thẻ thông minh, 8523.59 thẻ gần NFC), 5–9 VTT hi-tech (HS 8517.13/.14/.18/8471.30/.41/.60 máy tính/Laptop, 8528.71 TV, đồ chơi 9503, 9504 game console, …). Yêu cầu: TỰ ĐÁNH GIÁ hoặc CHỨNG NHẬN HỢP QUY + CÔNG BỐ HỢP QUY (CCBQ) cho hàng NK. Đ5 Nguyên tắc quản lý (khoản 1–5: theo QCVN + pháp luật chất lượng; trường hợp nhiều QCVN — đáp ứng đầy đủ & không trùng lặp; QCVN ban hành sau — theo QCVN mới; ngoại lệ năng lượng nguyên tử). Đ6 (khoản 1) Hiệu lực 01-07-2026; (khoản 2) Hết hiệu lực kể từ 01-07-2026: a) 29/2025/TT-BKHCN 13-11-2025 (CNTT-TT mất ATSH); b) 30/2011/TT-BTTTT 31-10-2011 (chứng nhận hợp quy CNTT-TT); c) 15/2018/TT-BTTTT 15-11-2018 (sửa đổi 30); d) 10/2020/TT-BTTTT 07-5-2020 (sửa đổi 30); đ) 58/2015/TTLT-BCT-BKHCN 31-12-2015 (chất lượng thép); e) 01/2009/TT-BKHCN 20-3-2009 (DM ATSH); (khoản 3) chiếu dẫn VBPL mới/thay thế. Đ7 Chuyển tiếp (khoản 1 GCNHQ + TBN hợp quy cũ còn HSD; khoản 2 hồ sơ tiếp nhận trước 01-07-2026 chưa xử lý — theo PL tại thời điểm tiếp nhận; khoản 3 tổ chức đánh giá sự phù hợp đã chỉ định tiếp tục HĐ đến hết HĐ chỉ định; khoản 4 giai đoạn chuyển tiếp Cổng 1 cửa quốc gia — nộp trên Cổng DVCQG; khoản 5 hồ sơ chỉ định cũ). Đ8 Tổ chức thực hiện (khoản 1–3: Bộ KH&CN + Tổng cục TC ĐLCL chủ trì; khoản 4 UBND tỉnh: Sở KH&CN kiểm tra NK trừ xăng/diesel/LPG; khoản 5 phản ánh khó khăn). Trích xuất 396 dòng → 253 mã HS duy nhất."
