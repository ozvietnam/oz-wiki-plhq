ghi_chu: 'Xác định trước mã số mặt hàng Bộ dụng cụ dẫn hướng và đẩy dây hàn Drive Roll Kit (ký, mã hiệu P/N 079607, nhà sản xuất Miller; bộ phận chuyên dụng lắp trong bộ cấp dây của máy hàn hồ quang điện một chiều Miller DeltaWeld 602 dùng cho dây hàn đường kính 0.045 inch / 1,2mm, gồm 02 con lăn đệm drive roll bằng thép phủ sơn đường kính ngoài 42,5mm x trong 22,5mm và 01 dụng cụ dẫn hướng dây hàn hình trụ tròn bằng đồng vát nhọn chữ V dài 54mm x đường kính ngoài 9,5mm có lỗ xuyên tâm) thuộc nhóm 85.15, phân nhóm 8515.90, mã số 8515.90.90.'
