  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/29/VB_3264.pdf, id=99942, SHA-256 057be318c411807e4045897a9f49a6620ccd6e883b4db6963203ec2e03f3a10d): Thông báo số 3264/TB-CHQ ngày 25-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ dụng cụ dẫn hướng và đẩy dây hàn Drive Roll Kit (tên gọi theo cấu tạo, công dụng: Bộ dụng cụ gồm 02 con lăn đệm drive roll bằng thép phủ sơn đường kính ngoài 42,5mm x đường kính trong 22,5mm và 01 dụng cụ dẫn hướng dây hàn dạng thanh hình trụ tròn bằng đồng vát nhọn chữ V ở một đầu dài 54mm x đường kính ngoài 9,5mm có lỗ xuyên tâm luồn dây hàn; ký, mã hiệu P/N 079607, nhà sản xuất Miller; bộ phận chuyên dụng lắp trong bộ cấp dây của máy hàn hồ quang điện một chiều Miller DeltaWeld 602 dùng cho dây hàn đường kính 0.045 inch / 1,2mm), phân loại vào nhóm 85.15, phân nhóm 8515.90, mã số 8515.90.90; có hiệu lực từ ngày ký'
