  pham_vi: 'Đối chiếu bản PDF ký số 02 trang của Bộ Tài chính trên Cổng TTĐT Bộ Tài chính (mof.gov.vn, ký ngày 16-05-2024 08:23:21 +07:00 cho Quyết định số 1092/QĐ-BTC ngày 13-05-2024) và CSDLQG về VBPL (vbpl.vn ItemID=168063): Điều 1 công bố 04 Danh mục kết quả hệ thống hóa VBQPPL lĩnh vực Bộ Tài chính kỳ 2019–2023; Điều 3 hiệu lực từ ngày ký 13-05-2024; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: ong-w15-nap-gap@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Công bố kèm theo Quyết định này kết quả hệ thống hóa văn bản quy phạm pháp luật thuộc lĩnh vực quản lý nhà nước của Bộ Tài chính kỳ 2019 - 2023, bao gôm: 1. Danh mục văn bản quy phạm pháp luật còn hiệu lực thuộc lĩnh vực quản lý nhà nước của Bộ Tài chính trong kỳ hệ thông hóa 2019 - 2023;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Trách nhiệm của các đơn VỊ: 1. Vụ Pháp chế phối hợp với Cục Tin học và Thống kê tài chính, Văn phòng Bộ và các đơn vị có liên quan thực hiện việc đăng tải Kết quả hệ thong hóa văn bản quy phạm pháp luật trên Công thông tin điện tử của Bộ Tài chính;'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kể từ ngày ký. Chánh Văn phòng Bộ, Vụ trưởng Vụ Pháp chê và Thủ trưởng các đơn vị thuộc Bộ chịu trách nhiệm thi hành Quyét định này. W/
      trang_pdf: 2
ghi_chu: Quyết định công bố kết quả hệ thống hóa VBQPPL của Bộ Tài chính kỳ 2019–2023 (kèm Danh mục I văn bản còn hiệu lực và Danh mục II văn bản hết hiệu lực toàn bộ — dùng làm căn cứ đối chiếu hiệu lực Thông tư 19/2019/TT-BTC và Thông tư 304/2016/TT-BTC).
