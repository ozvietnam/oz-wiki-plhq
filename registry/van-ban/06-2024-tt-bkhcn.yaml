      noi_dung: 'Điều 1. Sửa đổi, bd sung một số điều của Thông tư số 11/2015/TT- BKHCN ngày 26 tháng 6 năm 2015 của Bộ trưởng Bộ Khoa học và Công nghệ quy định chỉ tiết và hướng dẫn thi hành một số điều của Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp 1. Sửa đổi, bổ sung Điều | như sau: “Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh:'
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Thay thế, bãi bỏ cụm từ, điểm, khoản, điều quy định tại Thông tư số 11/2015/TT-BKHCN ngày 26 thang 6 năm 2015 của Bộ trướng Bộ Khoa học và Công nghệ quy định chỉ tiết và hướng dẫn thi hành một số điều của Nghị định số 99/2013/NĐ-CP ngày 29 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp 1. Thay thế một số cụm từ như sau:'
      trang_pdf: 13
    - dieu: 3
      noi_dung: Điều 3. Trách nhiệm tô chức thực hiện 1. Thủ trưởng các đơn vị trực thuộc Bộ, thủ trưởng các cơ quan, tổ chức và các cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. 2. Trong quá trình thực hiện, nếu có vướng mắc đề nghị các cơ quan, đơn vị phản ánh kịp thời về Bộ Khoa học và Công nghệ để nghiên cứu, giải quyết.
      trang_pdf: 14
    - dieu: 4
      noi_dung: Điều 4. Điều khoản thi hành 1. Thông tư này có hiệu lực kể từ ngày 15 tháng 11 năm 2024.
      trang_pdf: 14
ghi_chu: Sửa đổi, bổ sung Thông tư 11/2015/TT-BKHCN để đồng bộ với Luật SHTT sửa đổi 2022, Nghị định 65/2023/NĐ-CP, Nghị định 126/2021/NĐ-CP và Nghị định 46/2024/NĐ-CP; đã được hợp nhất tại Văn bản hợp nhất 04/VBHN-BKHCN ngày 15-11-2024.
