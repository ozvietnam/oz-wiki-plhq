  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=211484) và toàn văn PDF ký số đính kèm (06-bkhcn.pdf, 15 trang, Thứ trưởng Lê Xuân Định ký ngày 30-09-2024): số hiệu 06/2024/TT-BKHCN, có hiệu lực thi hành từ ngày 15-11-2024 (khoản 1 Điều 4); đang còn hiệu lực, sửa đổi, bổ sung một số điều (Điều 1) và thay thế, bãi bỏ một số cụm từ, điểm, khoản, điều (Điều 2, trong đó khoản 2 Điều 2 bãi bỏ Điều 2, 5, khoản 2 Điều 8, khoản 3 và 4 Điều 14, điểm c khoản 2 Điều 15, Điều 17, khoản 1 Điều 23, Điều 25, 26, 27, 29 và 30) của Thông tư 11/2015/TT-BKHCN hướng dẫn Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp.'
