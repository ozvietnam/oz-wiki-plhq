xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo (id=26084/21710) và cạnh ngược trong sổ: Thông tư 01/2018/TT-BCT ban hành 27-02-2018, có hiệu lực từ 27-02-2018; đã được sửa đổi, bổ sung một phần bởi Thông tư 33/2025/TT-BCT từ ngày 21-07-2025 (Điều 1 TT 33/2025/TT-BCT bãi bỏ điểm c khoản 2 Điều 3 và thay thế toàn bộ Phụ lục I)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết hàng hóa mua bán, trao đổi qua cửa khẩu phụ, lối mở biên giới của thương nhân theo quy định tại Chương II Nghị định số 14/2018/ NĐ-CP ngày 23 tháng 01 năm 2018 của Chính phủ quy định chi tiết về hoạt động thương mại biên giới.
      trang_pdf: 1
      sha256_pdf: 3d60b655624560f069ff6575f4487bbd51b5bf9a93707c9f2603cdbc6ef37771
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Thương nhân, các tổ chức, cá nhân tham gia hoạt động mua bán, trao đổi hàng hóa qua biên giới. 2. Các cơ quan, tổ chức quản lý và điều hành hoạt động mua bán, trao đổi hàng hóa qua biên giới của thương nhân 3. Các cơ quan, tổ chức, cá nhân khác có liên quan đến hoạt động mua bán, trao đổi hàng hóa qua biên giới của thương nhân.
      trang_pdf: 1
      sha256_pdf: 3d60b655624560f069ff6575f4487bbd51b5bf9a93707c9f2603cdbc6ef37771
    - dieu: 3
      noi_dung: Điều 3. Hàng hóa mua bán, trao đổi qua cửa khẩu phụ, lối mở biên giới của thương nhân 1. Hàng hóa xuất khẩu dưới hình thức mua bán, trao đổi qua cửa khẩu phụ, lối mở biên giới của thương nhân thực hiện theo quy định của pháp luật.
      trang_pdf: 2
      sha256_pdf: 3d60b655624560f069ff6575f4487bbd51b5bf9a93707c9f2603cdbc6ef37771
    - dieu: 4
      noi_dung: 'Điều 4. Tổ chức thực hiện và trách nhiệm thi hành 1. Bộ Công Thương có trách nhiệm: Hướng dẫn, kiểm tra các cơ quan, tổ chức, cá nhân có liên quan và thương nhân hoạt động mua bán, trao đổi hàng hóa qua cửa khẩu phụ, lối mở biên giới trong việc thực hiện quy định tại Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 3d60b655624560f069ff6575f4487bbd51b5bf9a93707c9f2603cdbc6ef37771
    - dieu: 5
      noi_dung: Điều 5. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày ký. 2. Bãi bỏ Thông tư số 34/2016/TT-BCT ngày 28 tháng 12 năm 2016 của Bộ Công Thương quy định chi tiết hoạt động mua bán hàng hóa qua biên giới của thương nhân tại Quyết định số 52/2015/QĐ-TTg ngày 20 tháng 10 năm 2015 của Thủ tướng Chính phủ về việc quản lý hoạt động thương mại biên giới với các nước có chung biên giới.
      trang_pdf: 3
      sha256_pdf: 3d60b655624560f069ff6575f4487bbd51b5bf9a93707c9f2603cdbc6ef37771
