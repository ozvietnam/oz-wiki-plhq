xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF Công báo số 53+54 ngày 14-01-2022 có lớp chữ (raw/download/congbaocdn.chinhphu.vn/126-2021-nd-cp.pdf, 74 trang, SHA-256 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f), thẻ vanban.chinhphu.vn (docid=204924) và PDF ký số (126.signed.pdf): số hiệu 126/2021/NĐ-CP, ngày ban hành 30-12-2021, khoản 1 Điều 7 toàn văn quy định có hiệu lực từ 01-01-2022 (thẻ thuộc tính vanban.chinhphu.vn ghi 01-03-2022); sửa đổi, bổ sung Nghị định 99/2013/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực sở hữu công nghiệp (xác định giá trị tang vật theo tờ khai nhập khẩu, xử lý hàng quá cảnh và buộc tái xuất hàng nhập khẩu giả mạo nhãn hiệu/chỉ dẫn địa lý, thẩm quyền xử phạt của Hải quan) và Nghị định 119/2017/NĐ-CP về tiêu chuẩn, đo lường, chất lượng, hợp quy và nhãn hàng hóa nhập khẩu; đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Sửa đổi, bổ sung Điều 1 như sau: “Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về các hành vi vi phạm hành chính; hình thức xử phạt, mức xử phạt, biện pháp khắc phục hậu quả; thủ tục nộp đơn yêu cầu xử lý vi phạm; đối tượng bị xử phạt; thẩm quyền, thủ tục giải quyết đơn yêu cầu xử lý vi phạm; thẩm quyền lập biên bản đối với vi phạm hành chính, thẩm quyền xử phạt, mức phạt tiền cụ thể theo từng chức danh; việc thi hành các hình thức xử phạt vi phạm hành chính, các biện pháp khắc phục hậu quả trong lĩnh vực sở hữu công nghiệp. 2. Hành vi vi phạm hành chính trong lĩnh vực khác trực tiếp liên quan đến lĩnh vực sở hữu công nghiệp không quy định tại Nghị định này thì áp dụng quy định tại Nghị định của Chính phủ về xử phạt vi phạm hành chính trong lĩnh vực quản lý nhà nước có liên quan để xử phạt.”.'
      trang_pdf: 2
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 1
      khoan: 2
      noi_dung: '2. Bổ sung Điều 1a vào sau Điều 1 như sau: “Điều 1a. Đối tượng bị xử phạt vi phạm hành chính 1. Cá nhân, tổ chức Việt Nam hoặc cá nhân, tổ chức nước ngoài thực hiện hành vi vi phạm hành chính quy định tại Nghị định này trên lãnh thổ Việt Nam. 2. Hộ kinh doanh; hộ gia đình thực hiện hành vi vi phạm hành chính quy định tại Nghị định này bị xử phạt như đối với cá nhân vi phạm. 3. Tổ chức là đối tượng bị xử phạt theo quy định tại Nghị định này, bao gồm: a) Tổ chức kinh tế được thành lập theo quy định tại Luật Doanh nghiệp gồm: doanh nghiệp tư nhân, công ty cổ phần, công ty trách nhiệm hữu hạn, công ty hợp danh; b) Tổ chức kinh tế được thành lập theo quy định tại Luật Hợp tác xã gồm: hợp tác xã, liên hiệp hợp tác xã; c) Tổ chức đại diện sở hữu công nghiệp; d) Tổ chức giám định sở hữu công nghiệp; đ) Các tổ chức khác được thành lập theo quy định pháp luật. 4. Đối tượng bị xử phạt vi phạm hành chính là chi nhánh, văn phòng đại diện, địa điểm kinh doanh của doanh nghiệp được xác định theo quy định của pháp luật về xử lý vi phạm hành chính.”.'
      trang_pdf: 3
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 1
      khoan: 4
      noi_dung: '4. Sửa đổi, bổ sung Điều 4 như sau: “Điều 4. Xác định giá trị tang vật, phương tiện vi phạm 1. Việc xác định giá trị tang vật vi phạm là hàng hóa xâm phạm quyền sở hữu công nghiệp và hàng hóa giả mạo về sở hữu trí tuệ theo quy định tại khoản 2 Điều 213 Luật Sở hữu trí tuệ để làm căn cứ xác định khung tiền phạt, thẩm quyền xử phạt tuân thủ một trong các căn cứ theo thứ tự ưu tiên quy định tại khoản 2 Điều 60 Luật Xử lý vi phạm hành chính như sau: a) Giá niêm yết hoặc giá ghi trên hợp đồng hoặc hóa đơn mua bán hoặc tờ khai nhập khẩu; b) Giá theo thông báo của cơ quan tài chính địa phương; trường hợp không có thông báo giá thì giá theo giá thị trường tại thời điểm xảy ra vi phạm hành chính; c) Giá thành của hàng hóa vi phạm nếu là hàng hóa chưa xuất bán. 2. Trường hợp không thể áp dụng các căn cứ quy định tại khoản 1 Điều này để xác định giá trị tang vật vi phạm làm căn cứ xác định khung tiền phạt, thẩm quyền xử phạt thì người có thẩm quyền đang giải quyết vụ việc có thể ra quyết định tạm giữ tang vật vi phạm và thành lập Hội đồng định giá theo quy định tại khoản 3 Điều 60 Luật Xử lý vi phạm hành chính. 3. Việc xác định giá trị phương tiện vi phạm hành chính để làm căn cứ xác định khung tiền phạt, thẩm quyền xử phạt được áp dụng theo quy định tại Điều 60 Luật Xử lý vi phạm hành chính.”.'
      trang_pdf: 4
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 1
      khoan: 9
      noi_dung: '9. Sửa đổi, bổ sung một số điểm, khoản Điều 10 như sau: a) Sửa đổi, bổ sung điểm a khoản 1 như sau: “a) Buôn bán; chào hàng; vận chuyển, kể cả quá cảnh; tàng trữ; trưng bày để bán sản phẩm xâm phạm quyền đối với sáng chế, giải pháp hữu ích, thiết kế bố trí hoặc sản phẩm được sản xuất từ quy trình xâm phạm quyền đối với sáng chế, giải pháp hữu ích;”; b) Sửa đổi, bổ sung khoản 14 như sau: “14. Hình thức xử phạt bổ sung: Đình chỉ một phần hoặc toàn bộ hoạt động sản xuất, kinh doanh hàng hóa vi phạm từ 01 tháng đến 03 tháng đối với hành vi vi phạm quy định từ khoản 8 đến khoản 13 Điều này.”; c) Sửa đổi, bổ sung điểm d khoản 15 như sau: “d) Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vi phạm quy định từ khoản 1 đến khoản 13 Điều này.”.'
      trang_pdf: 7
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 1
      khoan: 11
      noi_dung: '11. Sửa đổi, bổ sung một số điểm, khoản Điều 12 như sau: a) Sửa đổi, bổ sung điểm a khoản 1 như sau: “a) Buôn bán; chào hàng; vận chuyển, kể cả quá cảnh; tàng trữ; trưng bày để bán hàng hóa giả mạo nhãn hiệu, chỉ dẫn địa lý;”; b) Sửa đổi, bổ sung điểm a khoản 10 như sau: “a) Sản xuất bao gồm: Thiết kế, chế tạo, gia công, lắp ráp, chế biến, đóng gói hàng hóa mang nhãn hiệu, chỉ dẫn địa lý giả mạo;”; c) Sửa đổi, bổ sung khoản 12 như sau: “12. Hình thức xử phạt bổ sung: a) Tịch thu tang vật, phương tiện vi phạm đối với hành vi vi phạm quy định từ khoản 1 đến khoản 11 Điều này, trừ trường hợp áp dụng biện pháp khắc phục hậu quả quy định tại điểm a, điểm b hoặc điểm c khoản 13 Điều này; b) Đình chỉ một phần hoặc toàn bộ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ vi phạm từ 01 tháng đến 03 tháng đối với hành vi vi phạm quy định từ khoản 7 đến khoản 10 Điều này.”; d) Sửa đổi, bổ sung khoản 13 như sau: “13. Biện pháp khắc phục hậu quả: a) Buộc tiêu hủy đối với hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý; nguyên liệu, vật liệu và phương tiện được sử dụng chủ yếu để sản xuất, kinh doanh hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý gây hại cho sức khỏe con người, vật nuôi, cây trồng, môi trường đối với hành vi vi phạm quy định từ khoản 1 đến khoản 11 Điều này, trừ trường hợp áp dụng biện pháp khắc phục hậu quả quy định tại điểm c khoản này; b) Buộc phân phối hoặc đưa vào sử dụng không nhằm mục đích thương mại đối với hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý; nguyên liệu, vật liệu và phương tiện được sử dụng chủ yếu để sản xuất, kinh doanh hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý sau khi đã loại bỏ yếu tố vi phạm trên hàng hóa với điều kiện không làm ảnh hưởng đến khả năng khai thác quyền của chủ thể quyền sở hữu công nghiệp và không gây hại cho sức khỏe con người, vật nuôi, cây trồng, môi trường đối với hành vi vi phạm quy định từ khoản 1 đến khoản 11 Điều này, trừ trường hợp áp dụng biện pháp khắc phục hậu quả quy định tại điểm a hoặc điểm c khoản này; c) Buộc đưa ra khỏi lãnh thổ Việt Nam đối với hàng hóa quá cảnh hoặc buộc tái xuất đối với hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý, phương tiện, nguyên liệu, vật liệu nhập khẩu được sử dụng chủ yếu để sản xuất, kinh doanh hàng hóa giả mạo nhãn hiệu hoặc chỉ dẫn địa lý sau khi đã loại bỏ yếu tố vi phạm trên hàng hóa đối với hành vi vi phạm quy định từ khoản 1 đến khoản 10 Điều này; d) Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vi phạm quy định từ khoản 1 đến khoản 10 Điều này.”.'
      trang_pdf: 9
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 1
      khoan: 17
      noi_dung: '17. Sửa đổi, bổ sung một số điểm, khoản Điều 19 như sau: a) Sửa đổi, bổ sung đoạn mở đầu khoản 1 như sau: “1. Đội trưởng, Tổ trưởng thuộc Chi cục Hải quan; Tổ trưởng thuộc Đội Kiểm soát thuộc Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc Trung ương; Đội trưởng thuộc Chi cục Kiểm tra sau thông quan có quyền:”; b) Sửa đổi, bổ sung khoản 2 như sau: “2. Chi cục trưởng Chi cục Hải quan, Chi cục trưởng Chi cục Kiểm tra sau thông quan, Đội trưởng Đội Kiểm soát thuộc Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc Trung ương; Đội trưởng Đội điều tra hình sự, Đội trưởng Đội kiểm soát chống buôn lậu, Hải đội trưởng Hải đội kiểm soát trên biển và Đội trưởng Đội kiểm soát chống buôn lậu hàng giả và bảo vệ quyền sở hữu trí tuệ thuộc Cục Điều tra chống buôn lậu; Chi cục trưởng Chi cục Kiểm tra thông quan thuộc Cục Kiểm tra sau thông quan có quyền: a) Phạt cảnh cáo; b) Phạt tiền đến 25.000.000 đồng; c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 50.000.000 đồng; d) Áp dụng biện pháp khắc phục hậu quả quy định tại các điểm a, b, c, d, đ, g và h khoản 3 Điều 3 Nghị định này.”; c) Sửa đổi điểm d khoản 3 như sau: “d) Tịch thu tang vật, phương tiện vi phạm hành chính;”.'
      trang_pdf: 13
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 3
      noi_dung: '3. Sửa đổi, bổ sung các điểm b, đ và bổ sung điểm d1 khoản 3 Điều 2 như sau: a) Sửa đổi, bổ sung điểm b như sau: “b) Buộc đưa ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam hoặc buộc tái xuất hàng hóa, phương tiện nhập khẩu vi phạm.”; b) Bổ sung điểm d1 vào sau điểm d như sau: “d1) Buộc kiểm định lại phương tiện đo; buộc thể hiện đơn vị đo lường của phương tiện đo; buộc khôi phục lại tình trạng ban đầu của phương tiện đo; buộc đóng gói lại hàng đóng gói sẵn; buộc ghi lượng của hàng đóng gói sẵn, buộc thể hiện đơn vị đo lường của hàng đóng gói sẵn;”; c) Sửa đổi, bổ sung điểm đ như sau: “đ) Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vi phạm hành chính trong trường hợp có căn cứ xác định số lợi bất hợp pháp hoặc nộp lại số tiền bằng trị giá tang vật, phương tiện vi phạm hành chính đã bị tiêu thụ, tẩu tán, tiêu hủy trái quy định pháp luật.”.'
      trang_pdf: 18
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 32
      noi_dung: '32. Sửa đổi, bổ sung khoản 2, khoản 5; bổ sung điểm e khoản 2 Điều 18 như sau: a) Sửa đổi, bổ sung đoạn mở đầu khoản 2 Điều 18 như sau: “2. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi sau đây trong sản xuất hoặc nhập khẩu sản phẩm, hàng hóa vi phạm về công bố hợp chuẩn:”; b) Bổ sung điểm e khoản 2 Điều 18 như sau: “e) Không nộp cho cơ quan kiểm tra bản sao y bản chính chứng chỉ chất lượng hoặc chứng thư giám định trong thời hạn quy định đối với hàng hóa nhập khẩu mà tại văn bản quy phạm pháp luật quy định biện pháp quản lý theo kết quả chứng nhận, giám định của tổ chức chứng nhận, tổ chức giám định đã đăng ký hoặc được thừa nhận theo quy định pháp luật.”; c) Sửa đổi khoản 5 Điều 18 như sau: “5. Biện pháp khắc phục hậu quả: Đối với hành vi vi phạm quy định tại khoản 1, điểm đ khoản 2, điểm c khoản 3, khoản 4 Điều này được thực hiện theo thứ tự ưu tiên sau đây: a) Buộc đưa ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam hoặc buộc tái xuất đối với hàng hóa nhập khẩu; b) Buộc thu hồi và tái chế hoặc thay đổi mục đích sử dụng; c) Buộc thu hồi và tiêu hủy sản phẩm, hàng hóa vi phạm gây hại cho sức khỏe con người, vật nuôi, thủy sản nuôi, cây trồng và môi trường.”.'
      trang_pdf: 28
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 35
      noi_dung: '35. Sửa đổi, bổ sung khoản 6 Điều 20 như sau: “6. Phạt tiền từ 02 lần đến 03 lần giá trị sản phẩm, hàng hóa vi phạm đã tiêu thụ đối với một trong các hành vi sau đây: a) Thay thế, đánh tráo, thêm, bớt thành phần hoặc chất phụ gia, pha trộn tạp chất làm chất lượng sản phẩm, hàng hóa không phù hợp với tiêu chuẩn công bố áp dụng; b) Bán hàng hóa có chất lượng không phù hợp quy chuẩn kỹ thuật tương ứng hoặc quy định của cơ quan có thẩm quyền; c) Bán hàng hóa khi hàng hóa chưa được thực hiện các biện pháp quản lý theo quy định tại các quy chuẩn kỹ thuật quốc gia tương ứng hoặc chưa được thực hiện chứng nhận hợp quy hoặc giám định phù hợp quy chuẩn kỹ thuật trong thời hạn quy định đối với hàng hóa nhóm 2.”.'
      trang_pdf: 30
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 46
      noi_dung: '46. Sửa đổi, bổ sung đoạn đầu khoản 1 Điều 30 như sau: “1. Phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với một trong các hành vi sau đây trong trường hợp hàng hóa vi phạm có giá trị đến 5.000.000 đồng, trừ trường hợp hàng hóa nhập khẩu vào Việt Nam đã có nhãn gốc nhưng không đọc được các nội dung trên nhãn theo quy định pháp luật mà các tổ chức, cá nhân nhập khẩu hàng hóa không khắc phục được, hàng hóa nhập khẩu vào Việt Nam đã có nhãn gốc nhưng chưa có nhãn phụ khi làm thủ tục thông quan.”.'
      trang_pdf: 39
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 48
      noi_dung: '48. Sửa đổi, bổ sung khoản 1 Điều 31 như sau: “1. Phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với một trong các hành vi sau đây trong trường hợp hàng hóa vi phạm có giá trị dưới 5.000.000 đồng, trừ trường hợp hàng hóa nhập khẩu vào Việt Nam đã có nhãn gốc nhưng không đọc được các nội dung trên nhãn theo quy định pháp luật mà các tổ chức, cá nhân nhập khẩu hàng hóa không khắc phục được, hàng hóa nhập khẩu vào Việt Nam đã có nhãn gốc nhưng chưa có nhãn phụ khi làm thủ tục thông quan: a) Sản xuất, nhập khẩu, vận chuyển, lưu giữ, buôn bán hàng hóa có nhãn (kể cả nhãn phụ) hoặc tài liệu kèm theo không ghi đủ hoặc ghi không đúng các nội dung bắt buộc trên nhãn hàng hóa hoặc nội dung bắt buộc phải thể hiện theo tính chất hàng hóa theo quy định pháp luật về nhãn hàng hóa; b) Nhập khẩu, vận chuyển, lưu giữ, buôn bán hàng hóa hàng nhập khẩu có nhãn gốc bằng tiếng nước ngoài nhưng không có nhãn phụ bằng tiếng Việt Nam.”.'
      trang_pdf: 39
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 54
      noi_dung: '54. Sửa đổi khoản 8 Điều 31 như sau: “8. Biện pháp khắc phục hậu quả: a) Đối với hành vi vi phạm quy định tại các khoản 1, 2 và 4 Điều này được thực hiện theo thứ tự ưu tiên sau: buộc đưa ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam hoặc buộc tái xuất đối với hàng hóa nhập khẩu; buộc thu hồi hàng hóa và buộc ghi nhãn hàng hóa đúng quy định trước khi tiếp tục lưu thông; buộc thu hồi và tiêu hủy nhãn hàng hóa vi phạm, buộc tiêu hủy hoặc chuyển đổi mục đích sử dụng hàng hóa có nhãn vi phạm trong trường hợp không thể tách rời nhãn hàng hóa vi phạm ra khỏi hàng hóa; b) Buộc thu hồi hàng hóa và buộc loại bỏ hình ảnh, chữ viết, dấu hiệu, biểu tượng, huy chương, giải thưởng và các thông tin không đúng bản chất, không đúng sự thật về hàng hóa đó; buộc thu hồi và tiêu hủy hàng hóa quá hạn sử dụng, hàng hóa gian lận về thời hạn sử dụng đối với hành vi vi phạm quy định tại khoản 3 Điều này; c) Buộc nộp lại số tiền bằng trị giá tang vật, phương tiện vi phạm hành chính đã bị tiêu thụ, tẩu tán, tiêu hủy trái quy định pháp luật đối với hành vi vi phạm quy định tại Điều này.”.'
      trang_pdf: 43
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
    - dieu: 2
      khoan: 78
      noi_dung: '78. Sửa đổi, bổ sung đoạn mở đầu khoản 3, điểm c khoản 3 Điều 37 như sau: “3. Chi cục trưởng Chi cục Hải quan; Chi cục trưởng Chi cục Kiểm tra sau thông quan, Đội trưởng Đội kiểm soát thuộc Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc Trung ương; Đội trưởng Đội Điều tra hình sự, Đội trưởng Đội kiểm soát chống buôn lậu, Hải đội trưởng Hải đội kiểm soát trên biển và Đội trưởng Đội kiểm soát chống buôn lậu hàng giả và bảo vệ quyền sở hữu trí tuệ thuộc Cục Điều tra chống buôn lậu; Chi cục trưởng Chi cục Kiểm tra sau thông quan thuộc Cục Kiểm tra sau thông qua có quyền:”; “c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 50.000.000 đồng đối với cá nhân, 100.000.000 đồng đối với tổ chức;”.'
      trang_pdf: 47
      sha256_pdf: 49567653e1f673745a1c93809d429eb404f73ae225629a6165db3d1e02bff17f
