      noi_dung: '1. Bãi bỏ khoản 3 Điều 5; điểm b khoản 1 Điều 7; điểm c khoản 2 Điều 32 Nghị định số 99/2013/NĐ-CP. 2. Bãi bỏ điểm c khoản 3 Điều 3; điểm g, điểm h khoản 3, khoản 5 Điều 19; khoản 3 Điều 20; điểm a, điểm b khoản 1 Điều 21; điểm b khoản 3 Điều 24; Điều 28; khoản 5, khoản 6 Điều 31; điểm đ, điểm g khoản 1 Điều 32 Nghị định số 119/2017/NĐ-CP. 3. Bãi bỏ khoản 3 Điều 2 và điểm d khoản 4 Điều 6 Nghị định số 107/2013/NĐ-CP.'
