xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF ký số Chính phủ (102.signed.pdf, 52 trang, 6 chương 30 điều và Phụ lục I–III, Thủ tướng Nguyễn Xuân Phúc ký) và cổng Cục Hải quan KV10 (kv10.customs.gov.vn): ban hành 01-09-2020, có hiệu lực từ 30-10-2020 (khoản 1 Điều 28; Chương III phân loại doanh nghiệp có hiệu lực sau 18 tháng theo khoản 3 Điều 28; Mục 2 Chương II và Mục 1 Chương IV về xuất khẩu/cấp giấy phép FLEGT theo quyết định của Thủ tướng tại khoản 2 Điều 28); khoản 4 Điều 28 bãi bỏ Điều 17 Thông tư 27/2018/TT-BNNPTNT về hồ sơ gỗ nhập khẩu từ 30-10-2020; đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 120/2024/NĐ-CP)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định Hệ thống bảo đảm gỗ hợp pháp Việt Nam đối với nhập khẩu, xuất khâu; tiêu chí, thâm quyền, trình tự, thủ tục phân loại doanh nghiệp chế biến và xuất khâu gỗ; cấp giấy phép FLEGT.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với tổ chức, hộ kinh doanh, hộ gia đình, cộng đồng dân cư, cá nhân trong nước; tổ chức, cá nhân nước ngoài có hoạt động liên quan đến các nội dung quy định tại Điều 1 Nghị định này.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Gỗ hợp pháp là gỗ, sản phẩm gỗ (sau đây viết tắt là gỗ) được khai thác, nhập khẩu, xử lý tịch thu, vận chuyển, mua bán, chế biến, xuất khẩu phù hợp với quy định của pháp luật Việt Nam, các quy định liên quan của Điều ước Cơ quan: Văn phòng Chính phủ . it Thời gian ky: 04.09.2020 11:06:43 +07:00 Tới (2)'
      trang_pdf: 1
    - dieu: 7
      noi_dung: 'Điều 7. Hồ sơ gỗ nhập khẩu Khi làm thủ tục Hải quan đối với lô hàng gỗ nhập khâu, ngoài bộ hồ sơ Hải quan theo quy định của pháp luật về Hải quan, chủ gỗ nhập khẩu phải nộp cho cơ quan Hải quan nơi đăng ký tờ khai các tài liệu sau: 1. Bản chính bảng kê gỗ nhập khẩu do chủ gỗ lập theo Mẫu số 01 hoặc Mẫu số 02 Phụ lục I ban hành kèm theo Nghị định này. 2. Một trong các tài liệu sau:'
      trang_pdf: 5
    - dieu: 11
      noi_dung: Điều 11. Quy định chung về phân loại doanh nghiệp 1. Phân loại doanh nghiệp được thực hiện thông qua Hệ thống thông tin ` . phân loại doanh nghiệp.
      trang_pdf: 8
    - dieu: 14
      noi_dung: Điều 14. Quy định chung về cấp giấy phép FLEGT. 1. Giấy phép FLEGT được cấp cho một lô hàng số hợp pháp thuộc Phụ lục HI ban hành kèm theo Nghị định này của một chủ gỗ xuất khẩu hoặc tạm nhập, tái xuất đến cửa khâu nhập khâu đầu tiên vào thị trường EU. 2. Một lô hàng gỗ xuất khẩu vào thị trường EU chỉ được cấp một giấy phép FLEGT và được cấp trước thời điểm đăng ký tờ khai hải quan.
      trang_pdf: 11
    - dieu: 17
      noi_dung: 'Điều 17. Gia hạn giấy phép FLEGT 1. Đối tượng gia hạn giấy phép FLEGT: Giấy phép FLEGT đã cấp hết hạn mà chủ gỗ chưa xuất khâu lô hàng gỗ đã được cấp giấy phép và có nhu cầu xin gia hạn. 2. Cơ quan gia hạn giấy phép FLEGT: Cơ quan quy định tại khoản 2 Điều. 16 Nghị định này. 3. Hồ sơ đề nghị gia hạn giấy phép FLEGT:'
      trang_pdf: 13
    - dieu: 20
      noi_dung: 'Điều 20. Thu hồi giấy phép FLEGT 1. Trường hợp thu hồi giấy phép: a) Giấy phép FLEGT do chủ gỗ tự nguyện trả lại; b) Giấy phép FLEGT hết hạn nhưng chủ gỗ không xuất khâu hoặc không đề nghị gia hạn giấy phép: Trong thời hạn 10 ngày, ké từ ngày giấy phép hết hạn, chủ gỗ có trách nhiệm trả lại giấy phép cho Cơ quan cấp phép; c) Chủ gỗ có hành vi vi pham pháp luật liên quan đến lô hang gỗ xuất khâu bị phát hiện sau khi được cấp giấy phép FLEGT;'
      trang_pdf: 17
    - dieu: 25
      noi_dung: Điều 25. Trách nhiệm của Bộ Nông nghiệp và Phát triển nông thôn 1. Chủ trì, phối hợp với các bộ, ngành liên quan hướng dẫn và tổ chức thực hiện Nghị định này theo thâm quyên. 2. Phối hợp với bộ, ngành liên quan và Uy ban nhân dan cắp tỉnh dé thanh tra, kiêm tra, đôn doc thực hiện.
      trang_pdf: 19
    - dieu: 29
      noi_dung: Điều 29. Điều khoản chuyền tiếp Lô hàng gỗ nhập khâu đã đăng ký tờ khai hải quan trước ngày Nghị định này có hiệu lực thi hành nhưng chưa được thông quan thì áp dụng chính sách quan lý gỗ nhập khẩu theo các quy định tại thời điểm đăng ký tờ khai hải quan.
      trang_pdf: 22
ghi_chu: 'Nền của mảng truy xuất nguồn gốc gỗ NK (issue #247 — gia đình lâm nghiệp thứ 8, ca dăm gỗ beech 4401.22.00). Song song với NĐ 06/2019 (CITES) — không thay thế nhau.'
