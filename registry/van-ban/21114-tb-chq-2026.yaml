  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21114.pdf, id=106025, SHA-256 802f02e65575dd0751024e1fee6c0352a649c0ecbfa710ea6d7d5b97ed58b4bf): Thông báo số 21114/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cụm FEM hoàn thiện (FRT END MODULE, ký mã hiệu 64100-P6000TC; kích thước tổng thể 1750 x 450 x 770 mm; là 01 cụm thống nhất lắp ráp từ nhiều linh kiện ô tô gồm két làm mát, giá đỡ và đường ống két nước, cụm turbo tăng áp, máng dẫn gió, khung FEM, thanh giằng, lưới tản nhiệt, dây điện FEM, cửa gió, cản gió, đèn pha trái/phải, cảm biến va đập, bộ âm thanh cảnh báo lùi xe, còi, ống ga điều hòa, cụm radar phía trước, cảm biến nhiệt độ, dây và cụm khóa nắp capo, lắp trên xe ô tô chở người dưới 9 chỗ ngồi), phân loại vào nhóm 87.08, phân nhóm 8708.99, mã số 8708.99.80; có hiệu lực kể từ ngày ban hành'
