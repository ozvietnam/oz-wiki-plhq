xac_minh:
  muc: NGUON_A
  pham_vi: 'Công báo Chính phủ số 653+654 (doc 13781, PDF 10 trang có lớp chữ 39.444 ký tự): ban hành 08-12-2011, Điều 13 có hiệu lực từ 22-01-2012; được Công văn 1813/BTC-TCHQ (17-02-2025) tiếp tục dẫn chiếu cùng Nghị định 123/2020/NĐ-CP về biên lai thu thuế chuyển phát nhanh.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này hướng dẫn về việc tạo, phát hành, sử dụng và quản lý Biên lai thu thuế, lệ phí hải quan đối với hàng hóa xuất khẩu, nhập khẩu (sau đây gọi tắt là Biên lai) của các Doanh nghiệp kinh doanh dịch vụ chuyển phát nhanh đường hàng không quốc tế và xử phạt vi phạm hành chính liên quan đến việc tạo, phát hành, sử dụng và quản lý Biên lai.
      trang_pdf: 1
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Doanh nghiệp kinh doanh dịch vụ chuyển phát nhanh đường hàng không quốc tế đối với hàng hóa xuất khẩu, nhập khẩu theo quy định hiện hành của pháp luật Việt Nam (sau đây gọi tắt là Doanh nghiệp).
      trang_pdf: 1
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 3
      noi_dung: Điều 3. Nội dung Biên lai 1. Biên lai thu thuế, phí hải quan là ấn chỉ thuế do cơ quan hải quan ủy nhiệm cho Doanh nghiệp tạo ra trên các thiết bị tin học, để ghi nhận thông tin số thuế, lệ phí hải quan phải thu của Khách hàng theo quy định pháp luật khi cung cấp dịch vụ chuyển phát nhanh đường hàng không quốc tế đối với hàng hóa xuất khẩu, nhập khẩu.
      trang_pdf: 2
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 5
      noi_dung: 'Điều 5. Tạo Biên lai 1. Biên lai được tạo phải đảm bảo: 1.1. Phần mềm ứng dụng để in Biên lai phải đáp ứng yêu cầu bảo mật bằng việc phân quyền cho người sử dụng, người không được phân quyền không được can thiệp làm thay đổi dữ liệu trên ứng dụng. 1.2. Việc đánh số thứ tự được thực hiện tự động, mỗi liên của một số Biên lai chỉ được in ra một lần.'
      trang_pdf: 4
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 6
      noi_dung: Điều 6. Thông báo phát hành Biên lai 1. Các Doanh nghiệp trước khi sử dụng Biên lai tự tạo theo hướng dẫn tại Điều 5 phải lập Thông báo phát hành Biên lai theo mẫu số 1 ban hành kèm theo Thông tư này.
      trang_pdf: 4
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 7
      noi_dung: 'Điều 7. Sử dụng Biên lai 1. Nguyên tắc sử dụng Biên lai: 1.1. Sau khi tạo Biên lai, Doanh nghiệp giao Biên lai cho Khách theo hướng dẫn của Thông tư này khi làm xong thủ tục hải quan. 1.2. Phải sử dụng Biên lai theo đúng thứ tự từ số nhỏ đến số lớn, không được dùng cách số.'
      trang_pdf: 5
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 9
      noi_dung: Điều 9. Xử phạt các hành vi vi phạm quy định về Biên lai 1. Xử phạt vi phạm về Biên lai được thực hiện theo quy định tại Nghị định số 185/2004/NĐ-CP ngày 04/11/2004 về xử phạt vi phạm hành chính trong lĩnh vực kế toán và Nghị định số 39/2011/NĐ-CP ngày 26/5/2011 sửa đổi, bổ sung một số điều của Nghị định số 185/2004/NĐ-CP.
      trang_pdf: 9
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 10
      noi_dung: Điều 10. Thẩm quyền xử phạt vi phạm về Biên lai 1. Thẩm quyền xử phạt vi phạm về Biên lai được thực hiện theo quy định tại các Điều 29, 30, 36 và 38 Pháp lệnh Xử lý vi phạm hành chính và Nghị định số 185/2004/NĐ-CP ngày 04/11/2004 về xử phạt vi phạm hành chính trong lĩnh vực kế toán, Nghị định số 39/2011/NĐ-CP ngày 26/5/2011 sửa đổi, bổ sung một số điều của Nghị định số 185/2004/NĐ-CP.
      trang_pdf: 9
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 11
      noi_dung: Điều 11. Kiểm tra, thanh tra việc in, phát hành, quản lý và sử dụng Biên lai 1. Kiểm tra tại trụ sở cơ quan hải quan. 1.1. Cơ quan hải quan nơi đăng ký tờ khai hải quan thực hiện kiểm tra việc tạo, phát hành, quản lý và sử dụng Biên lai trên báo cáo tình hình sử dụng Biên lai của các Doanh nghiệp. Tối đa là mười (10) ngày làm việc kể từ ngày nhận được báo
      trang_pdf: 9
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
    - dieu: 13
      noi_dung: Điều 13. Hiệu lực thi hành Thông tư này có hiệu lực thi hành kể từ ngày 22/01/2012.
      trang_pdf: 11
      sha256_pdf: af0bbec095146349531dde790fb259d60092a5cd147dc446c32670742c34843f
