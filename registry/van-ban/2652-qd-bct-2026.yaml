xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số Quyết định số 2652/QĐ-BCT ngày 13-10-2026 của Bộ Công Thương (vụ việc ER01.AD10): kết quả rà soát cuối kỳ áp dụng thuế CBPG đối với sản phẩm sợi dài làm từ polyester từ Trung Quốc, Ấn Độ, Indonesia, Malaysia; hiệu lực từ 16-10-2026, thay thế Quyết định 3546/QĐ-BCT'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Gia hạn thêm 05 năm việc áp dụng thuế chống bán phá giá đối với một số sản phẩm sợi dài làm từ polyester, được phân loại theo các mã HS 5402.33.10, 5402.33.90, 5402.46.10, 5402.46.90, 5402.47.10 và 5402.47.90, được nhập khẩu vào Việt Nam, có xuất xứ từ Cộng hòa Ấn Độ, Cộng hòa In-đô-nê-xi-a, Ma-lai-xi-a và Cộng hòa nhân dân Trung Hoa (mã vụ việc: ER01.AD10) với nội dung chỉ tiết nêu tại Thông báo kèm theo Quyết định này.'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Các Quyết định miễn trừ việc áp dụng biện pháp chồng bán phá giá đối với một số sản phẩm sợi dài làm từ polyester nêu tại Điều 1 Quyết định này đã được Bộ trưởng Bộ Công Thương ban hành trước ngày Quyết định này có hiệu lực, tiếp tục được thực hiện đến hết thời hạn hiệu lực của Quyết định miễn trừ đó.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kể từ ngày 16 tháng 10 năm 2026.
      trang_pdf: 2
    - dieu: 4
      noi_dung: 'Điều 4. Các Quyết định sau hết hiệu lực thi hành: 1. Quyết định số 2302/QĐ-BCT ngày 13 tháng 10 năm 2021 của Bộ trưởng Bộ Công Thương về việc áp dụng thuế chống bán phá giá chính thức đối với một số sản phẩm sợi dài làm từ polyester có xuất xứ từ Cộng hòa Nhân dân Trung Hoa, Cộng hòa Án Độ, Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a;'
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Chánh Văn phòng Bộ, fare trưởng Cục Phòng vệ. th nng ø mại, ‘Tha trưởng các don VỊ và các bên a quan chịu trách nhiệm thi hành Quyết định này. /.
      trang_pdf: 3
ghi_chu: Kết quả rà soát cuối kỳ (ER01.AD10) biện pháp chống bán phá giá đối với sợi polyester (PFY, 6 mã HS); thay thế Quyết định 3546/QĐ-BCT từ ngày 16-10-2026.
