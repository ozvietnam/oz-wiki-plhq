xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/6/VB_22584.pdf, id=106276, SHA-256 72cfd21a3f6a0f58126a63ad3374291a82c5d71fcdb2fab7d3a55b648a1d1449): Thông báo số 22584/TB-CHQ ngày 06-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Hóa chất COS-540 dạng lỏng (ký mã hiệu COS-540, thành phần theo trọng lượng gồm Acrylic ester co-polymer CAS 35239-19-1 hàm lượng 32 ± 1,0%, Ethyl acetate CAS 141-78-6 hàm lượng 52-59%, Toluene CAS 108-88-3 hàm lượng 9-12%, đóng gói 180 Kg/Drum, nhà sản xuất COSMOTEC CO.,LTD., dùng làm nguyên liệu polymer trung gian phối trộn với dung môi và chất tạo liên kết ngang để phủ lên màng nền PET, PI trong sản xuất chất bám dính và băng keo PSA), phân loại vào nhóm 32.08, phân nhóm 3208.20, mã số 3208.20.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Hóa chất COS-540 dạng lỏng (tên thương mại và ký mã hiệu COS-540, thành phần gồm Acrylic ester co-polymer CAS 35239-19-1 hàm lượng 32 ± 1,0%, Ethyl acetate CAS 141-78-6 hàm lượng 52-59%, Toluene CAS 108-88-3 hàm lượng 9-12%, đóng gói 180 Kg/Drum, dùng làm nguyên liệu polymer trung gian trong quy trình sản xuất các chất bám dính, băng keo PSA và các loại băng keo chức năng) thuộc nhóm 32.08, phân nhóm 3208.20, mã số 3208.20.90.'
