ten: 'Thông báo về kết quả xác định trước mã số (Hóa chất COS-540 dạng lỏng, thành phần gồm Acrylic ester co-polymer CAS 35239-19-1 hàm lượng 32 ± 1,0%, Ethyl acetate CAS 141-78-6 hàm lượng 52-59%, Toluene CAS 108-88-3 hàm lượng 9-12%, đóng gói 180 Kg/Drum, dùng làm nguyên liệu polymer trung gian trong sản xuất chất bám dính và băng keo PSA, mã số 3208.20.90)'
