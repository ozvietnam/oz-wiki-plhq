  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định chi tiết điểm a khoản 2 Điều 94 của Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026 của Chính phủ quy định chi tiết một số'
      trang_pdf: 1
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 1
      khoan: 1
      noi_dung: 'điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Chất lượng sản phẩm, hàng hóa và điểm c khoản 2 Điều 16 của Nghị định số 209/2026/NĐ-CP ngày 15/6/2026 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Xây dựng về quản lý vật liệu xây dựng, bao gồm: a) Quy định về quản lý chất lượng đối với sản phẩm, hàng hóa vật liệu xây dựng trong hoạt động sản xuất, xuất khẩu, nhập khẩu, lưu thông trên thị trường và sử dụng trong công trình xây dựng. b) Danh mục sản phẩm, hàng hóa vật liệu xây dựng thuộc nhóm rủi ro cao, nhóm rủi ro trung bình kèm theo mã HS phù hợp với Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.'
      trang_pdf: 2
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 1
      khoan: 2
      noi_dung: '2. Thông tư này quy định Danh mục sản phẩm, hàng hóa vật liệu xây dựng.'
      trang_pdf: 2
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng 1. Các cơ quan quản lý nhà nước về vật liệu xây dựng. 2. Các tổ chức, cá nhân sản xuất, kinh doanh, lưu thông, xuất khẩu, nhập khẩu và sử dụng sản phẩm, hàng hóa vật liệu xây dựng. 3. Các tổ chức đánh giá sự phù hợp, bao gồm tổ chức thử nghiệm, tổ chức giám định, tổ chức chứng nhận; tổ chức giám định tư pháp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng. 4. Cơ quan kiểm tra chất lượng sản phẩm, hàng hóa vật liệu xây dựng và các cơ quan, tổ chức, cá nhân khác có liên quan.'
      trang_pdf: 2
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 3
      khoan: 1
      noi_dung: 'Điều 3. Sản phẩm, hàng hóa vật liệu xây dựng và phân loại rủi ro 1. Sản phẩm, hàng hóa vật liệu xây dựng thuộc phạm vi quản lý chất lượng theo Thông tư này là sản phẩm, hàng hóa vật liệu xây dựng thuộc phạm vi quản lý nhà nước của Bộ Xây dựng. Danh mục sản phẩm, hàng hóa vật liệu xây dựng quy định tại Phụ lục I ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 3
      khoan: 2
      noi_dung: '2. Sản phẩm, hàng hóa vật liệu xây dựng được phân loại theo mức độ rủi ro như sau: a) Nhóm rủi ro cao: các sản phẩm, hàng hóa vật liệu xây dựng quy định tại Phụ lục II ban hành kèm theo Thông tư này; b) Nhóm rủi ro trung bình: các sản phẩm, hàng hóa vật liệu xây dựng quy định tại Phụ lục III ban hành kèm theo Thông tư này; c) Nhóm rủi ro thấp: các sản phẩm, hàng hóa vật liệu xây dựng không thuộc danh mục quy định tại Phụ lục II, Phụ lục III ban hành kèm theo Thông tư này, trừ trường hợp pháp luật chuyên ngành có quy định khác.'
      trang_pdf: 2
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 3
      khoan: 3
      noi_dung: '3. Mã HS của sản phẩm, hàng hóa vật liệu xây dựng được xác định theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam do Bộ Tài chính ban hành và quy định của pháp luật về hải quan. Trường hợp có sự khác biệt, không thống nhất trong việc phân loại và xác định mã HS đối với hàng hóa thuộc các Danh mục sản phẩm, hàng hóa vật liệu xây dựng ban hành kèm theo Thông tư này, việc phân loại và xác định mã HS thực hiện theo quy định của pháp luật về hải quan. Đối với sản phẩm, hàng hóa vật liệu xây dựng xuất khẩu, nhập khẩu chưa được xác định mã HS trong các Danh mục ban hành kèm theo Thông tư này, việc xác định mã HS thực hiện theo quy định của pháp luật về hải quan. Sau khi thông quan, tổ chức, cá nhân xuất khẩu, nhập khẩu gửi văn bản về Bộ Xây dựng để làm cơ sở phối hợp với Bộ Tài chính xem xét, thống nhất, cập nhật, bổ sung vào Danh mục theo quy định.'
      trang_pdf: 3
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 4
      noi_dung: 'Điều 4. Ghi nhãn hàng hóa vật liệu xây dựng 1. Việc ghi nhãn hàng hóa, sử dụng nhãn điện tử và cung cấp thông tin về sản phẩm, hàng hóa vật liệu xây dựng thực hiện theo quy định tại Chương IV Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026 và pháp luật có liên quan. 2. Khuyến khích tổ chức, cá nhân áp dụng mã số, mã vạch, mã QR, RFID và các giải pháp công nghệ số khác để phục vụ truy xuất nguồn gốc và quản lý chất lượng sản phẩm, hàng hóa vật liệu xây dựng. Đối với hàng hóa vật liệu xây dựng thuộc nhóm rủi ro trung bình và nhóm rủi ro cao được phân phối trên các sàn thương mại điện tử, tổ chức, cá nhân kinh doanh có trách nhiệm niêm yết công khai hình ảnh nhãn hàng hóa, dấu hợp quy theo quy định. 3. Trường hợp quy chuẩn kỹ thuật quốc gia có quy định riêng về nội dung nhãn, thông tin bắt buộc thì việc ghi nhãn hàng hóa phải tuân thủ theo quy định tại Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026 và quy chuẩn kỹ thuật quốc gia tương ứng.'
      trang_pdf: 3
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 5
      khoan: 1
      noi_dung: 'Điều 5. Yêu cầu chung về quản lý chất lượng sản phẩm, hàng hóa vật liệu xây dựng 1. Sản phẩm, hàng hóa vật liệu xây dựng phải bảo đảm chất lượng theo quy định của pháp luật về xây dựng; công bố tiêu chuẩn áp dụng và truy xuất nguồn gốc theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật về tiêu chuẩn, quy chuẩn kỹ thuật.'
      trang_pdf: 3
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 5
      khoan: 1
      noi_dung: 'Đối với sản phẩm, hàng hóa vật liệu xây dựng được sản xuất từ nguyên liệu có nguồn gốc từ chất thải, phế thải hoặc phụ phẩm công nghiệp, việc quản lý phải tuân thủ quy định của pháp luật về bảo vệ môi trường và pháp luật có liên quan.'
      trang_pdf: 4
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 5
      khoan: 2
      noi_dung: '2. Đối với sản phẩm, hàng hóa vật liệu xây dựng thuộc nhóm rủi ro thấp: a) Áp dụng hệ thống quản lý chất lượng nhằm bảo đảm chất lượng sản phẩm phù hợp với tiêu chuẩn được công bố áp dụng theo quy định của pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật và ghi nhãn theo quy định tại Điều 4 của Thông tư này trước khi đưa sản phẩm ra lưu thông trên thị trường; b) Tự nguyện công bố sản phẩm, hàng hóa phù hợp tiêu chuẩn tương ứng. Việc công bố hợp chuẩn thực hiện theo quy định của pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật, pháp luật về chất lượng sản phẩm, hàng hóa, hướng dẫn của Bộ Khoa học và Công nghệ tại Thông tư số 14/2026/TT-BKHCN ngày 09 tháng 4 năm 2026 và Điều 11 của Thông tư này.'
      trang_pdf: 4
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 5
      khoan: 3
      noi_dung: '3. Đối với sản phẩm, hàng hóa vật liệu xây dựng thuộc nhóm rủi ro trung bình và nhóm rủi ro cao: a) Áp dụng hệ thống quản lý chất lượng nhằm bảo đảm chất lượng sản phẩm phù hợp với quy chuẩn kỹ thuật tương ứng và ghi nhãn theo quy định tại Điều 4 của Thông tư này trước khi đưa sản phẩm ra lưu thông trên thị trường; b) Bắt buộc công bố sản phẩm, hàng hóa phù hợp quy chuẩn kỹ thuật tương ứng. Việc công bố hợp quy, trừ sản phẩm, hàng hóa sản xuất, chế tạo riêng cho công trình, thực hiện theo quy định của pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật, pháp luật về chất lượng sản phẩm, hàng hóa, hướng dẫn của Bộ Khoa học và Công nghệ tại Thông tư số 14/2026/TT-BKHCN ngày 09 tháng 4 năm 2026 và Điều 12 của Thông tư này.'
      trang_pdf: 4
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 6
      khoan: 1
      noi_dung: 'Điều 6. Quản lý chất lượng sản phẩm vật liệu xây dựng trong sản xuất 1. Việc quản lý chất lượng sản phẩm vật liệu xây dựng trong sản xuất thực hiện theo quy định tại Điều 28 của Luật Chất lượng sản phẩm, hàng hóa đã được sửa đổi, bổ sung tại khoản 17 Điều 1 Luật số 78/2025/QH15 và các Điều 66, 67 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 4
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 6
      khoan: 2
      noi_dung: '2. Cơ sở sản xuất vật liệu xây dựng có trách nhiệm sau đây: a) Thực hiện đúng quy định tại khoản 1 Điều này; b) Bảo đảm chất lượng sản phẩm trong sản xuất trước khi đưa ra thị trường trong nước theo quy định tại Điều 66 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026; c) Xây dựng, áp dụng và duy trì hệ thống quản lý chất lượng phù hợp với loại hình sản phẩm, công nghệ, quy mô sản xuất và yêu cầu của tiêu chuẩn, quy chuẩn kỹ thuật áp dụng;'
      trang_pdf: 4
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 6
      khoan: 2
      noi_dung: 'd) Thực hiện kiểm soát chất lượng nguyên liệu đầu vào, bán thành phẩm, thành phẩm; lưu trữ đầy đủ hồ sơ kỹ thuật, hồ sơ kiểm soát chất lượng và hồ sơ truy xuất nguồn gốc theo quy định.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 6
      khoan: 3
      noi_dung: '3. Đối với sản phẩm vật liệu xây dựng được sản xuất, chế tạo riêng cho công trình, việc quản lý chất lượng thực hiện theo quy định của pháp luật về xây dựng.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 6
      khoan: 4
      noi_dung: '4. Hoạt động kiểm tra nhà nước về chất lượng sản phẩm trong sản xuất do cơ quan kiểm tra chất lượng sản phẩm, hàng hóa tiến hành, được thực hiện theo quy định tại Điều 79 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 7
      noi_dung: 'Điều 7. Quản lý chất lượng hàng hóa vật liệu xây dựng xuất khẩu 1. Hàng hóa vật liệu xây dựng xuất khẩu phải đáp ứng yêu cầu về chất lượng quy định tại Điều 32 của Luật Chất lượng sản phẩm, hàng hóa đã được sửa đổi, bổ sung tại khoản 18 Điều 1 Luật số 78/2025/QH15, pháp luật Việt Nam và yêu cầu của thị trường nhập khẩu. 2. Kiểm tra nhà nước về chất lượng hàng hóa xuất khẩu và xử lý vi phạm được thực hiện theo quy định tại Điều 87 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 8
      khoan: 1
      noi_dung: 'Điều 8. Quản lý chất lượng hàng hóa vật liệu xây dựng nhập khẩu 1. Hàng hóa vật liệu xây dựng nhập khẩu trước khi đưa ra thị trường phải bảo đảm chất lượng theo quy định tại Điều 34 của Luật Chất lượng sản phẩm, hàng hóa đã được sửa đổi, bổ sung tại khoản 19 Điều 1 Luật số 78/2025/QH15, Điều 68 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026 và quy định của pháp luật về quản lý vật liệu xây dựng.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 8
      khoan: 2
      noi_dung: '2. Kiểm tra nhà nước về chất lượng hàng hóa nhập khẩu: a) Hoạt động kiểm tra nhà nước về chất lượng hàng hóa vật liệu xây dựng nhập khẩu được thực hiện theo quy định tại Điều 82 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026; b) Cơ quan kiểm tra nhà nước về chất lượng hàng hóa vật liệu xây dựng nhập khẩu thuộc nhóm rủi ro cao là Sở Xây dựng (say đây viết tắt là Cơ quan kiểm tra) một trong các địa phương: Nơi doanh nghiệp đăng ký kinh doanh (hoặc nơi đặt văn phòng đại diện, chi nhánh, nhà máy sản xuất); nơi có cửa khẩu được doanh nghiệp nhập khẩu hàng hóa; nơi doanh nghiệp làm thủ tục hải quan đối với lô hàng hóa. c) Trình tự, thủ tục, hồ sơ kiểm tra nhà nước về chất lượng hàng hóa vật liệu xây dựng nhập khẩu thuộc nhóm rủi ro cao thực hiện theo quy định tại Điều 83 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 8
      khoan: 3
      noi_dung: '3. Việc thừa nhận kết quả đánh giá sự phù hợp của tổ chức nước ngoài được thực hiện theo quy định của pháp luật Việt Nam và điều ước quốc tế mà Việt Nam là thành viên.'
      trang_pdf: 5
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 8
      khoan: 4
      noi_dung: '4. Áp dụng biện pháp miễn, giảm kiểm tra chất lượng hàng hóa vật liệu xây dựng nhập khẩu thuộc nhóm rủi ro cao; không phải thực hiện lại việc công bố hợp quy đối với hàng hóa vật liệu xây dựng nhập khẩu thuộc nhóm rủi ro trung bình được thực hiện theo quy định tại Điều 86 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 6
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 8
      khoan: 5
      noi_dung: '5. Xử lý vi phạm trong quá trình kiểm tra chất lượng hàng hóa vật liệu xây dựng nhập khẩu thuộc nhóm rủi ro cao thực hiện theo quy định tại Điều 85 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 6
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 9
      noi_dung: 'Điều 9. Quản lý chất lượng hàng hóa vật liệu xây dựng lưu thông trên thị trường 1. Quản lý chất lượng hàng hóa vật liệu xây dựng lưu thông trên thị trường được thực hiện theo quy định tại Điều 34a của Luật Chất lượng sản phẩm, hàng hóa đã được sửa đổi, bổ sung tại khoản 19 Điều 1 Luật số 78/2025/QH15 và Điều 69 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026. 2. Hoạt động kiểm tra chất lượng hàng hóa vật liệu xây dựng lưu thông trên thị trường được thực hiện theo quy định tại Điều 88 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026, trên cơ sở: a) Thông tin, dữ liệu quản lý; b) Phản ánh, kiến nghị của tổ chức, cá nhân; c) Kết quả phân tích, đánh giá rủi ro; d) Yêu cầu quản lý nhà nước trong từng thời kỳ. 3. Trình tự, thủ tục kiểm tra và xử lý vi phạm đối với hàng hóa vật liệu xây dựng lưu thông trên thị trường thực hiện theo quy định tại Điều 89, Điều 90 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 6
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 10
      noi_dung: 'Điều 10. Quản lý chất lượng hàng hóa vật liệu xây dựng trong quá trình sử dụng 1. Quản lý chất lượng hàng hóa vật liệu xây dựng trong quá trình sử dụng thực hiện theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa; pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật; pháp luật về xây dựng và quy định tại Điều 14 Nghị định số 209/2026/NĐ-CP ngày 15 tháng 6 năm 2026. 2. Trách nhiệm của chủ đầu tư, nhà thầu thi công xây dựng, tổ chức, cá nhân cung ứng hàng hóa vật liệu xây dựng trong việc bảo đảm chất lượng sản phẩm, hàng hóa vật liệu xây dựng sử dụng trong công trình thực hiện theo quy định của Điều 14 Nghị định số 207/2026/NĐ-CP ngày 15 tháng 6 năm 2026 của Chính phủ quy định chi tiết một số điều của Luật Xây dựng về quản lý chất lượng, thi công xây dựng và bảo trì công trình xây dựng, pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật có liên quan.'
      trang_pdf: 6
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 11
      noi_dung: 'Điều 11. Công bố hợp chuẩn 1. Đối tượng công bố hợp chuẩn là sản phẩm, hàng hóa vật liệu xây dựng. 2. Tổ chức, cá nhân công bố sản phẩm, hàng hóa vật liệu xây dựng phù hợp với tiêu chuẩn tương ứng trên cơ sở kết quả chứng nhận hợp chuẩn của tổ chức chứng nhận đã đăng ký, được công nhận hoặc kết quả tự đánh giá sự phù hợp theo quy định của pháp luật. 3. Trình tự công bố hợp chuẩn và trách nhiệm của tổ chức, cá nhân công bố hợp chuẩn thực hiện theo quy định tại Điều 9, Điều 10 Thông tư số 14/2026/TT-BKHCN ngày 09 tháng 4 năm 2026.'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 1
      noi_dung: 'Điều 12. Công bố hợp quy 1. Đối tượng công bố hợp quy là sản phẩm, hàng hóa vật liệu xây dựng thuộc nhóm rủi ro cao và nhóm rủi ro trung bình được quy định trong quy chuẩn kỹ thuật quốc gia do Bộ Xây dựng ban hành và Phụ lục II, Phụ lục III ban hành kèm theo Thông tư này.'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 2
      noi_dung: '2. Cơ sở để thực hiện việc công bố hợp quy: a) Đối với sản phẩm, hàng hóa thuộc nhóm rủi ro cao: việc công bố hợp quy được thực hiện trên cơ sở kết quả chứng nhận hợp quy của tổ chức chứng nhận được Bộ Xây dựng chỉ định; b) Đối với sản phẩm, hàng hóa thuộc nhóm rủi ro trung bình: việc công bố hợp quy được thực hiện trên cơ sở kết quả chứng nhận hợp quy của tổ chức chứng nhận được công nhận hoặc được chỉ định theo quy định của pháp luật; hoặc kết quả tự đánh giá của tổ chức, cá nhân trên cơ sở kết quả thử nghiệm của tổ chức thử nghiệm được công nhận hoặc được chỉ định theo quy định của pháp luật.'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 3
      noi_dung: '3. Trường hợp sử dụng kết quả đánh giá sự phù hợp của tổ chức chứng nhận, tổ chức thử nghiệm nước ngoài thì các tổ chức này phải được thừa nhận theo quy định của pháp luật Việt Nam hoặc điều ước quốc tế mà Việt Nam là thành viên.'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 4
      noi_dung: '4. Hồ sơ, trình tự, thủ tục công bố hợp quy và trách nhiệm của tổ chức, cá nhân trong hoạt động công bố hợp quy thực hiện theo quy định tại Nghị định số 22/2026/NĐ-CP ngày 16 tháng 01 năm 2026 và hướng dẫn tại Điều 13, Điều 14 Thông tư số 14/2026/TT-BKHCN ngày 09 tháng 4 năm 2026.'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 5
      noi_dung: '5. Trường hợp Cơ sở dữ liệu quốc gia về tiêu chuẩn, đo lường, chất lượng bị lỗi hoặc chưa hoàn thiện hạ tầng thì tổ chức, cá nhân đăng ký công bố hợp quy theo hình thức nộp trực tiếp hoặc qua dịch vụ bưu chính tới Cơ quan kiểm tra:'
      trang_pdf: 7
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 12
      khoan: 5
      noi_dung: 'a) Đối với sản phẩm, hàng hóa sản xuất trong nước, tổ chức, cá nhân thực hiện công bố hợp quy tại Cơ quan kiểm tra nơi tổ chức, cá nhân đăng ký kinh doanh hoặc nơi đặt văn phòng đại diện, chi nhánh, nhà máy sản xuất theo quy định của pháp luật; b) Đối với sản phẩm, hàng hóa nhập khẩu, tổ chức, cá nhân thực hiện công bố hợp quy tại Cơ quan kiểm tra có thẩm quyền thực hiện kiểm tra nhà nước về chất lượng hàng hóa nhập khẩu theo quy định tại Điều 8 của Thông tư này.'
      trang_pdf: 8
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 13
      noi_dung: 'Điều 13. Tổ chức đánh giá sự phù hợp và tổ chức giám định tư pháp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng 1. Tổ chức đánh giá sự phù hợp thực hiện hoạt động thử nghiệm, giám định, chứng nhận đối với sản phẩm, hàng hóa vật liệu xây dựng phải đáp ứng các điều kiện kinh doanh dịch vụ đánh giá sự phù hợp và thực hiện việc đăng ký lĩnh vực hoạt động theo quy định tại Chương V Nghị định số 22/2026/NĐ-CP ngày 16 tháng 01 năm 2026. 2. Tổ chức đánh giá sự phù hợp được Bộ Xây dựng đánh giá, chỉ định tham gia hoạt động đánh giá sự phù hợp phục vụ quản lý nhà nước đối với sản phẩm, hàng hóa vật liệu xây dựng theo phạm vi được chỉ định. Điều kiện, hồ sơ đăng ký, hình thức nộp hồ sơ, trình tự, thủ tục chỉ định được thực hiện theo quy định tại các Điều 73, 74, 75 Mục 2 Chương VI Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026. 3. Tổ chức đánh giá sự phù hợp đã đăng ký lĩnh vực hoạt động hoặc được Bộ Xây dựng chỉ định phải tuân thủ các quy định về hoạt động đánh giá sự phù hợp và chịu sự kiểm tra, giám sát của cơ quan nhà nước có thẩm quyền. Danh sách tổ chức đánh giá sự phù hợp đã đăng ký lĩnh vực hoạt động hoặc được chỉ định được đăng tải theo quy định của pháp luật. 4. Các tổ chức đánh giá sự phù hợp tại nước ngoài thực hiện hoạt động chứng nhận, thử nghiệm sản phẩm, hàng hóa vật liệu xây dựng được xem xét, thừa nhận theo quy định của pháp luật Việt Nam và điều ước quốc tế mà Việt Nam là thành viên. 5. Tổ chức giám định tư pháp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng thực hiện theo quy định của pháp luật về hoạt động giám định tư pháp trong lĩnh vực xây dựng và quy định tại Thông tư này.'
      trang_pdf: 8
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 14
      khoan: 1
      noi_dung: 'Điều 14. Trách nhiệm của các bộ, cơ quan ngang bộ 1. Bộ Xây dựng: a) Hướng dẫn, đôn đốc, kiểm tra việc thực hiện Thông tư này; b) Thực hiện việc cấp mới, điều chỉnh, bổ sung, cấp lại, thu hồi, hủy bỏ quyết định chỉ định tổ chức đánh giá sự phù hợp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng; kiểm tra, xử lý vi phạm trong hoạt động của tổ chức đánh giá sự phù hợp theo quy định của pháp luật.'
      trang_pdf: 8
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 14
      khoan: 2
      noi_dung: '2. Các bộ, cơ quan ngang bộ trong phạm vi chức năng, nhiệm vụ, quyền hạn được giao có trách nhiệm phối hợp với Bộ Xây dựng tổ chức thực hiện Thông tư này.'
      trang_pdf: 9
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 15
      noi_dung: 'Điều 15. Trách nhiệm của Ủy ban nhân dân tỉnh, thành phố 1. Tổ chức thực hiện kiểm tra nhà nước về chất lượng sản phẩm, hàng hóa vật liệu xây dựng tại địa phương theo phân cấp và quy định của pháp luật. 2. Ủy quyền hoặc phân cấp cho cơ quan kiểm tra tại địa phương thực hiện việc cấp mới, điều chỉnh, bổ sung, cấp lại, thu hồi, hủy bỏ giấy chứng nhận đăng ký hoạt động đánh giá sự phù hợp của tổ chức đánh giá sự phù hợp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng; chỉ định, thu hồi quyết định chỉ định tổ chức đánh giá sự phù hợp quy chuẩn kỹ thuật địa phương theo quy định của pháp luật. 3. Ủy quyền hoặc phân cấp cho cơ quan kiểm tra tại địa phương tổ chức tiếp nhận, quản lý hồ sơ công bố hợp quy; thực hiện việc đình chỉ, hủy bỏ hiệu lực công bố hợp quy theo quy định của pháp luật; tiếp nhận, xử lý hồ sơ đăng ký kiểm tra nhà nước đối với hàng hóa vật liệu xây dựng nhập khẩu. 4. Ủy quyền hoặc phân cấp cho cơ quan kiểm tra tại địa phương thực hiện tiếp nhận, xác nhận hoặc từ chối hồ sơ miễn, giảm kiểm tra chất lượng hàng hóa vật liệu xây dựng nhập khẩu; thông báo việc dừng áp dụng chế độ miễn, giảm kiểm tra theo quy định của pháp luật. 5. Thực hiện quản lý, kiểm tra hoạt động chứng nhận hợp quy, công bố hợp quy đối với sản phẩm, hàng hóa vật liệu xây dựng trên địa bàn; phối hợp với cơ quan hải quan và các cơ quan liên quan trong kiểm tra chất lượng hàng hóa vật liệu xây dựng nhập khẩu. 6. Tổng hợp, báo cáo tình hình quản lý chất lượng sản phẩm, hàng hóa vật liệu xây dựng trên địa bàn trước ngày 31 tháng 12 hằng năm hoặc đột xuất theo yêu cầu của Bộ Xây dựng; nội dung, hình thức báo cáo thực hiện theo Phụ lục IV ban hành kèm theo Thông tư này. Báo cáo được gửi theo hình thức điện tử qua hệ thống liên thông văn bản 7. Tổ chức kiểm tra, xử lý vi phạm trong quản lý chất lượng sản phẩm, hàng hóa vật liệu xây dựng trên địa bàn theo thẩm quyền.'
      trang_pdf: 9
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 16
      khoan: 1
      noi_dung: 'Điều 16. Trách nhiệm của tổ chức đánh giá sự phù hợp và tổ chức giám định tư pháp về chất lượng sản phẩm, hàng hóa vật liệu xây dựng 1. Tuân thủ đầy đủ quy định của pháp luật về chất lượng sản phẩm, hàng hóa, pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật, pháp luật có liên quan và quy định tại Thông tư này.'
      trang_pdf: 9
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 16
      khoan: 2
      noi_dung: '2. Thực hiện chế độ báo cáo trước ngày 15 tháng 12 hằng năm hoặc đột xuất theo yêu cầu của Bộ Xây dựng về hoạt động đánh giá sự phù hợp. Cập nhật kết quả hoạt động đánh giá sự phù hợp theo quy định tại khoản 1 Điều 68 Nghị định số'
      trang_pdf: 9
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 16
      khoan: 2
      noi_dung: '22/2026/NĐ-CP ngày 16 tháng 01 năm 2026 và khoản 2 Điều 77 Nghị định số 37/2026/NĐ-CP ngày 23 tháng 01 năm 2026.'
      trang_pdf: 10
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 16
      khoan: 3
      noi_dung: '3. Thông báo kịp thời cho cơ quan quản lý nhà nước có thẩm quyền về mọi thay đổi có ảnh hưởng đến năng lực hoạt động đánh giá sự phù hợp trong thời hạn 15 ngày kể từ ngày có sự thay đổi.'
      trang_pdf: 10
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 17
      noi_dung: 'Điều 17. Điều khoản chuyển tiếp 1. Giấy chứng nhận hợp chuẩn phù hợp tiêu chuẩn kỹ thuật, Giấy chứng nhận hợp quy phù hợp QCVN 16:2023/BXD đối với sản phẩm, hàng hóa vật liệu xây dựng đã được cấp trước ngày Thông tư này có hiệu lực thi hành và còn hiệu lực thì được tiếp tục sử dụng đến hết thời hạn ghi trên giấy chứng nhận, trừ trường hợp pháp luật có quy định khác. 2. Tổ chức đánh giá sự phù hợp đã được chỉ định, cấp giấy chứng nhận đăng ký hoạt động chứng nhận, thử nghiệm đối với sản phẩm, hàng hóa vật liệu xây dựng theo QCVN 16:2023/BXD trước ngày Thông tư này có hiệu lực thi hành được tiếp tục thực hiện hoạt động theo phạm vi, thời hạn của quyết định chỉ định, giấy chứng nhận đăng ký đã được cấp; trường hợp nội dung không còn phù hợp với quy định tại Thông tư này thì phải điều chỉnh, bổ sung theo quy định của pháp luật. 3. Sản phẩm, hàng hóa thuộc phạm vi điều chỉnh của QCVN 16:2023/BXD nhưng không thuộc Phụ lục II, Phụ lục III ban hành kèm theo Thông tư này được quản lý theo quy định đối với sản phẩm, hàng hóa vật liệu xây dựng thuộc nhóm rủi ro thấp và quy định của pháp luật có liên quan. 4. Sản phẩm, hàng hóa thuộc Phụ lục II, Phụ lục III ban hành kèm theo Thông tư này nhưng chưa có quy chuẩn kỹ thuật quốc gia tương ứng thì thực hiện công bố hợp quy, chứng nhận hợp quy sau khi quy chuẩn kỹ thuật quốc gia tương ứng được ban hành và có hiệu lực; trong thời gian chưa có quy chuẩn kỹ thuật quốc gia tương ứng, tổ chức, cá nhân phải công bố tiêu chuẩn áp dụng, bảo đảm chất lượng, ghi nhãn, truy xuất nguồn gốc và thực hiện các trách nhiệm khác theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa và pháp luật có liên quan. 5. Trường hợp văn bản quy phạm pháp luật được viện dẫn trong Thông tư này được sửa đổi, bổ sung hoặc thay thế thì áp dụng theo văn bản quy phạm pháp luật được sửa đổi, bổ sung hoặc thay thế.'
      trang_pdf: 10
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 18
      khoan: 1
      noi_dung: 'Điều 18. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026.'
      trang_pdf: 10
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 18
      khoan: 2
      noi_dung: '2. Bãi bỏ mục 1.4.3 thuộc Phần 1 và Phần 3, Phần 4, Phần 5 của Quy chuẩn kỹ thuật quốc gia về sản phẩm, hàng hóa vật liệu xây dựng QCVN 16:2023/BXD ban hành kèm theo Thông tư số 04/2023/TT-BXD ngày 30 tháng 6 năm 2023 của Bộ trưởng Bộ Xây dựng. Tên sản phẩm, hàng hóa và mã HS tại Phụ lục II, Phụ lục III'
      trang_pdf: 10
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 18
      khoan: 2
      noi_dung: 'ban hành kèm theo Thông tư này thay thế tên sản phẩm, hàng hóa và mã HS tại Bảng 1 - Danh mục sản phẩm, hàng hóa vật liệu xây dựng của QCVN 16:2023/BXD.'
      trang_pdf: 11
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769
    - dieu: 18
      khoan: 3
      noi_dung: '3. Bãi bỏ Thông tư số 10/2024/TT-BXD ngày 01 tháng 11 năm 2024 của Bộ trưởng Bộ Xây dựng về quản lý chất lượng sản phẩm, hàng hóa vật liệu xây dựng kể từ ngày Thông tư này có hiệu lực thi hành. Trong quá trình thực hiện, nếu có vướng mắc, các tổ chức và cá nhân phản ánh kịp thời bằng văn bản về Bộ Xây dựng để được hướng dẫn, giải quyết hoặc nghiên cứu sửa đổi, bổ sung./.'
      trang_pdf: 11
      sha256_pdf: fdf2e52c04df40a2c50ad1d4b3df8e008da38dc2805ea078a3ce700596634769

ghi_chu: 3 mức rủi ro, 09 nhóm rủi ro cao; rủi ro trung bình tại Phụ lục III. Công báo số 404 ngày 17/7/2026. Phụ lục I không có mã HS (danh mục vật liệu xây dựng tổng quát).
