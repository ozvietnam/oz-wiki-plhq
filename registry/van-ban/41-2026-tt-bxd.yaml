ghi_chu: 3 mức rủi ro, 09 nhóm rủi ro cao; rủi ro trung bình tại Phụ lục III. Công báo số 404 ngày 17/7/2026. Phụ lục I không có mã HS (danh mục vật liệu xây dựng tổng quát).
