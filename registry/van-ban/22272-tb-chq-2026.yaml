ghi_chu: 'Xác định trước mã số mặt hàng Mô-đun nguồn cho trạm sạc xe điện (EV POWER MODULE, công suất tối đa 30 kW, chuyển đổi dòng điện xoay chiều AC 3 pha 380 VAC ± 10% qua bộ lọc EMI, mạch PFC và bộ chuyển đổi DC/DC sang dòng điện một chiều DC 150-1000 VDC / 30 A, tối đa 65 A dùng cho trạm sạc xe điện) thuộc nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.90.'
