xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/29/VB_22272.pdf, id=106191, SHA-256 07e2b01f85db0937fa85747de2d1f895c3c6df006bb75edf1092f38062132af7): Thông báo số 22272/TB-CHQ ngày 28-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Mô-đun nguồn cho trạm sạc xe điện (EV POWER MODULE, ký mã hiệu SE03P1KUFA/EPN; cấu tạo gồm bản mạch gắn linh kiện điều khiển, tụ điện, cầu chì, rơ-le, bộ lọc nhiễu điện từ EMI, mạch hiệu chỉnh hệ số công suất PFC, bộ chuyển đổi DC/DC, biến áp, quạt tản nhiệt và vỏ bảo vệ kim loại; công suất tối đa 30 kW, trọng lượng 16,4 kg, kích thước 300 x 84 x 437,5 mm; thực hiện chuyển đổi dòng điện xoay chiều AC đầu vào 3 pha 380 VAC ± 10%, 50 Hz ~ 60 Hz sang dòng điện một chiều DC đầu ra 150 VDC ~ 1000 VDC / 30 A, tối đa 65 A để sạc điện cho xe điện tại trạm sạc), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
