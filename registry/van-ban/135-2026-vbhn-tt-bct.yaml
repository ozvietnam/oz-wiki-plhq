xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=220071) và toàn văn PDF ký số ngày 21-10-2026 bởi Thứ trưởng Bộ Công Thương Nguyễn Việt Sơn (135-vbhn-bct.signed.pdf, số ký hiệu 135/VBHN-TT-BCT): hợp nhất Thông tư 19/2026/TT-BCT ngày 03-04-2026 quy định về tạm ứng cho Quỹ bình ổn giá xăng dầu từ nguồn ngân sách nhà nước, trích lập Quỹ bình ổn giá xăng dầu và hoàn trả tạm ứng ngân sách nhà nước với Thông tư 67/2026/TT-BCT ngày 20-10-2026 (HL 20-10-2026, docid=220090, Công báo mã 470854); đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định việc tiếp nhận, quản lý, kiểm tra, giám sát, kiểm toán, quyết toán: tạm ứng, chỉ sử dụng Quỹ bình ôn giá xăng dầu tạm ứng từ nguồn ngân sách nhà nước, trích lập Quỹ bình ổn giá xăng dầu và hoàn trả tạm ứng ngân sách nhà nước.'
      trang_pdf: 3
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Thương nhân đầu mối kinh doanh xăng dầu (sau đây viết tắt là thương nhân). 2. Ngân hàng thương mại nơi thương nhân mở tài khoản phong tỏa dé tiếp nhận nguồn ngân sách nhà nước tạm ứng cho Quỹ bình én giá xăng dầu, chi sử dụng, trích lập và hoàn trả tạm ứng ngân sách nhà nước. 3. Các cơ quan, tô chức, cá nhân có liên quan.
      trang_pdf: 3
    - dieu: 3
      noi_dung: 'Điều 3. N uyên tắc thực hiện chi sử dụng Quỹ bình ồn giá xăng dầu tạm ứng từ nguồn ngân. sách nhà nước, trích lập Quỹ bình 6n giá xăng dầu và hoàn trả tạm ứng ngân sách nhà nước } Thông | tư số 672026/TT-BCT có căn cứ ban hành như sau: “Căn cứ Luật Ngân sách nhà nước số 89/2025/QH15; Căn cứ Luật Giá số 16/2023/QH15 được sửa đổi, bổ sung bởi Luật số 44/2024/QH15; Luật số 61/2024/QH15; Luật số 95/2025/QH15; Luật số 140/2025/QH15;'
      trang_pdf: 3
    - dieu: 5
      noi_dung: Điều 5. Tạm ứng cho Quỹ bình ổn giá xăng dầu từ nguồn ngân sách nhà nước? 1. Căn cứ thông báo điều hành giá bán xăng dầu của Bộ Công Thương có nội dung điều hành chi sử dụng Quỹ bình ồn giá xăng dầu, Cục Quản ly và Phát triển thị trường trong nước gửi văn bản đề nghị thương nhân tạm ứng cho Quỹ bình 6n giá xăng dầu tại thương nhân.
      trang_pdf: 5
    - dieu: 7
      noi_dung: Điều 7. Chi sử dụng Quỹ bình 6n giá xăng dầu tạm ứng từ nguồn ngân sách nhà nước” 1. Căn cứ Quyết định phê duyệt số tiền tạm ứng/số tiền tạm ứng bổ sung của Bộ Công Thương, thương nhân xác định số tiền chỉ sử dụng thực tế phát sinh theo quy định để thực hiện rút tiền từ tài khoản phong tỏa Quỹ bình ôn giá xăng dầu tạm ứng từ nguồn ngân sách nhà nước mở tại Ngân hàng thương mại.
      trang_pdf: 6
    - dieu: 8
      noi_dung: Điều 8. Trích lập Quỹ bình ổn giá xăng dau‘ 1. Trong thời gian năm (05) ngày làm việc, ké từ ngày tiếp theo của ngày kết thúc một (01) kỳ điều hành giá xăng dầu của Bộ Công Thương, thương nhân xác định số tiền trích lập Quỹ bình ôn giá xăng dầu thực tế phát sinh theo quy định và chuyên nộp toàn bộ sô tiên đó vào tài khoản phong tỏa Quỹ bình ô én giá xăng dầu tạm ứng từ nguồn ngân sách nhà nước của thương nhân mở tại Ngân „hàng thương mại.
      trang_pdf: 6
    - dieu: 9
      noi_dung: Điều 9. Hoan trả tạm ứng ngân sách nhà nước 1. Cục Quản lý và Phát triển thị trường trong nước xây dựng phương án, kế hoạch cụ thể về việc thu hồi ngân sách nhà nước trình Bộ Công Thương báo cáo Chính phủ, bao gồm tính toán thời gian sử dụng và trích lập Quỹ bình 6n giá xăng dau dé thu hồi tạm ứng hoàn trả ngân sách nhà nước kê từ ngày Bộ Công Thương có Quyết định triển khai thực hiện trích lập Quỹ bình 6n giá xăng dầu dé hoàn trả ngân sách nhà
      trang_pdf: 7
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm của Cục Quản lý và Phát triển thị trường trong nước 1. Hướng dẫn các thương nhân thực hiện tạm ứng từ nguồn ngân sách nhà nước cho Quỹ bình ôn giá xăng dâu tại thương nhân.
      trang_pdf: 8
    - dieu: 12
      noi_dung: Điều 12. Trách nhiệm của thương nhân 1. Chấp hành nghiêm việc trích lập, chỉ sử dụng Quỹ bình ô ôn giá xăng dầu tạm ứng từ nguồn ngân sách nhà nước theo Văn bản thông báo điều hành giá bán xăng dâu và các Văn bản thông báo liên quan của Bộ Công Thương, hoàn trả số dư Quỹ bình 6n giá xăng dầu theo đúng thời hạn quy định.
      trang_pdf: 9
    - dieu: 14
      noi_dung: 'Điều 14. Điều khoản thi hành? ? Điều 2, Điều 3 của Thông tư số 67/2026/TT-BCT, có hiệu lực kể từ ngày 20 tháng 10 năm 2026 quy định như sau: “Điều 2. Điều khoản chuyén tiếp Ww'
