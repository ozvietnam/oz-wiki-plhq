  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/2/8.VB_18181.pdf, id=104990, SHA-256 833a001ce80d4c8c39a04f4e6d78adf4a8a79e28eaabf97ece179baebab34a74): Thông báo số 18181/TB-CHQ ngày 29-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cảm biến quang siêu nhỏ hình chữ U (slot type photoelectric sensor, ký mã hiệu PM-U25-C3; cấu tạo gồm LED hồng ngoại IR emitter, phototransistor, vỏ nhựa kỹ thuật, bảng mạch, dây kết nối dài 3 m; khe 6 mm, nguồn 5-24 VDC, dòng ~20 mA, ngõ ra NPN open collector, sử dụng phát hiện vật cản bằng tia hồng ngoại, là thiết bị đóng ngắt mạch điện sử dụng linh kiện bán dẫn transistor), phân loại vào nhóm 85.36, phân nhóm 8536.50, mã số 8536.50.51; có hiệu lực từ ngày ký'
