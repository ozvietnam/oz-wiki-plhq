ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị trộn nhiều loại tần số tín hiệu truyền hình thành một tín hiệu (Combiner, ký mã hiệu CHA-5800C; dùng linh kiện thụ động trên bo mạch in và đầu nối đồng trục RF 8/12 đầu vào - 1 đầu ra, dải tần 5.75~1000 MHz, không có chức năng chuyển mạch hay ghép kênh) thuộc nhóm 85.43, phân nhóm 8543.70, mã số 8543.70.90.'
