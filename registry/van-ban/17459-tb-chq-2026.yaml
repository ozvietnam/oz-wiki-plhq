  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/15/1.VB_17459.pdf, id=104771, 4 trang, SHA-256 ad8077e748e49bc45f0d18e842128ffe7bd6a55d8d32352aa1a64699b22268d6): Thông báo số 17459/TB-CHQ ngày 12-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị trộn tín hiệu (Tên thương mại: Combiner, ký mã hiệu CHA-5800C; cấu tạo gồm khung tấm nhôm, bo mạch chủ lắp ráp các linh kiện thụ động như điện trở, cuộn cảm, tụ điện và các cổng kết nối đồng trục RF 8/12 đầu vào - 1 đầu ra; hoạt động không cần cấp nguồn điện, phạm vi tần số 5.75~1000 MHz; dùng để nhận tín hiệu truyền hình mặt đất ở nhiều tần số/kênh khác nhau và trộn thành 1 tín hiệu duy nhất truyền qua một cáp đồng trục mà không làm thay đổi trở kháng, không có chức năng bảo mật luồng IP, bảo mật kênh, chuyển mạch hay ghép kênh), phân loại vào nhóm 85.43, phân nhóm 8543.70, mã số 8543.70.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
