ghi_chu: 'Xác định trước mã số mặt hàng Cáp điện CIVUS 0.35 BE (cáp cách điện bằng nhựa plastic PVC không có vỏ bọc chống nhiễu, gồm 01 lõi đồng dẫn điện đường kính 0,70 mm bện từ 07 sợi đồng đơn đường kính ~0,27 mm, dạng cuộn 3.000 m, sử dụng cho điện áp 12V-24V, không dùng cho viễn thông, chưa gắn với đầu nối điện, dùng làm nguyên liệu sản xuất bộ dây dẫn điện xe ô tô) thuộc nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.22.'
