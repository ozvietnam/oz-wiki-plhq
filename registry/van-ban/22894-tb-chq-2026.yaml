  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/13/VB_22894.pdf.pdf, id=106341, SHA-256 a8abdf15859e3344e5f52ddb3fd6fc020c38ed85f4dbdece650625032d52ec81): Thông báo số 22894/TB-CHQ ngày 12-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp điện CIVUS 0.35 BE (cáp cách điện plastic PVC không có vỏ bọc chống nhiễu, cấu tạo gồm 01 lõi đồng dẫn điện đường kính 0,70 mm bện từ 07 sợi đồng nhỏ đường kính ~0,27 mm/sợi, chiều dày lớp vỏ cách điện PVC trung bình 0,22 mm, đường kính ngoài hoàn thành 1,13-1,14 mm, dạng cuộn tròn 3.000 m, sử dụng cho điện áp 12V-24V, không dùng cho viễn thông, chưa gắn với đầu nối điện, dùng làm nguyên liệu đầu vào sản xuất bộ dây dẫn điện cho xe ô tô), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.22; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
