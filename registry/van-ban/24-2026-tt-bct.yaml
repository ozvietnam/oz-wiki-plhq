  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định Quy tắc xuất xứ hàng hóa trong Hiệp định Đối tác kinh tế toàn diện giữa Chính phủ nước Cộng hòa Xã hội Chủ nghĩa Việt Nam và Chính phủ Các Tiểu vương quốc Ả-rập thống nhất (sau đây gọi là Hiệp định).
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với: 1. Cơ quan, tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa (C/O). 2. Thương nhân.'
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Theo quy định tại Thông tư này, các thuật ngữ dưới đây được hiểu như sau: 1. “Nuôi trồng thủy sản” là nuôi trồng các sinh vật sống dưới nước, bao gồm cá, động vật thân mêm, động vật giáp xác, động vật không xương sống thủy sinh khác và thực vật thủy sinh, từ các loại giong như trứng, cá bột, ca giông va ấu trùng, bằng cách can thiệp vào quá trình nuôi trồng hoặc tăng trưởng đề tăng cường sản xuất như thả giống thường'
      trang_pdf: 2
    - dieu: 8
      noi_dung: Điều 8. Hàng hóa trung gian Trường hợp hàng hóa có xuất xứ tại lãnh thé của một Nước thành viên theo quy định tại Điều 7 Thông tư này được sử dụng đề sản xuất ra một sản phâm khác, các điều kiện áp dụng cho sản phẩm khác đó không áp dụng đối với hàng hóa dùng làm nguyên liệu và không tính đến các nguyên liệu không có xuất xứ đã được sử dụng trong quá trình sản xuất ra hàng hóa đó.
      trang_pdf: 6
    - dieu: 13
      noi_dung: Điều 13. Phụ kiện, phụ tùng và dụng cụ 1. Phụ kiện, phụ tùng, dụng cụ và tài liệu hướng dẫn hoặc tài liệu mang tính thông tin khác đi kèm với hàng hóa tạo thành một phần phụ kiện tiêu chuẩn, phụ tùng, dụng cụ và tài liệu hướng dẫn hoặc tài liệu mang tính thông tin khác của hàng hóa được coi là một phần của hàng hóa và không được tính đến khi xác định liệu tất cả các nguyên liệu không có xuất xứ được sử dụng dé sản xuất hàng hóa có xuất xứ có đáp
      trang_pdf: 7
    - dieu: 17
      noi_dung: Điều 17. Hàng hóa hoặc nguyên liệu giống nhau và có thể thay thế lẫn nhau 1. Việc xác định xuất xứ của hàng hóa hoặc nguyên liệu giống nhau và có thể thay thế lẫn nhau được thực hiện thông qua phân loại thực tế từng hàng hóa hoặc nguyên liệu hoặc trong trường hợp có bat kỳ khó khăn nào, thông qua việc sử dụng bất kỳ phương pháp quản lý hàng tồn kho như tính trung bình, nhập sau xuât trước hoặc nhập trước xuất trước, được công nhận trong các
      trang_pdf: 8
    - dieu: 22
      noi_dung: 'Điều 22. Quy định chung về cơ chế chứng nhận xuất xứ hàng hóa 1. Hàng hóa có xuất xứ từ lãnh thé của Các tiểu vương quốc Ả-rập Thống nhất khi nhập khâu vào Việt Nam được hưởng ưu đãi thuế quan theo Hiệp định khi nộp cho cơ quan hải quan một trong những chứng từ chứng nhận xuất xứ hàng hóa sau: a) C/O được cấp đáp ứng quy định tại Điều 23 Thông tư này.'
      trang_pdf: 10
    - dieu: 26
      noi_dung: Điều 26. C/O cấp sau 1. C/O mẫu UAE-VN có thê được cấp trước hoặc tại thời điểm giao hàng. 2. Trường hợp ngoại lệ khi C/O không được cấp trước hoặc tại thời điểm giao hang, do sai sót hoặc bỏ quên hoặc có lý do chính đáng khác, C/O có thé được cap sau nhưng không quá 01 năm kê từ ngày giao hàng và đánh dấu vào Ô “ISSUED RETROSPECTIVELY” theo quy định tại Phu lục II ban hành kèm theo Thông tư này.
      trang_pdf: 12
    - dieu: 31
      noi_dung: Điều 31. Hóa đơn của Nước không phải thành viên 1. Cơ quan hải quan của Nước thành viên nhập khẩu không từ chối cho hưởng ưu đãi thuế quan vì hóa đơn được phát hành bởi một Nước không phải thành viên và không bởi nhà xuất khẩu hoặc nhà sản xuất của Nước thành viên xuất khâu với điều kiện hàng hóa đáp ứng quy định tại Thông tư này.
      trang_pdf: 13
    - dieu: 36
      noi_dung: Điều 36. Hiệu lực thi hành 1. Thông tu này có hiệu lực thi hành ké từ ngày OSthang 5 năm 2026. 2. Cơ quan, tô chức cấp C/O xem xét cấp sau C/O m du UAE-VN theo quy định tại Thông tư này đối với hàng hóa của Việt Nam xuất khẩu từ ngày 03 tháng 02 năm 2026.
      trang_pdf: 15
