  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=172126) và toàn văn PDF đính kèm (08-nd.pdf): ban hành 27-01-2014, có hiệu lực từ 15-03-2014; đã hết hiệu lực một phần theo các nghị định hướng dẫn Luật Khoa học, công nghệ và đổi mới sáng tạo 2025 (NĐ 262/2025/NĐ-CP, NĐ 267/2025/NĐ-CP).'
