  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định chỉ tiết và hướng dẫn thi hành các điều 11, 12, 15, 25, 30, 32, 41, 43, 46 và một số vấn đề cần thiết khác của luật khoa học và công nghệ liên quan đến thành lập tổ chức khoa học và công nghệ, văn phòng đại diện, chỉ nhánh của tổ chức khoa học và công nghệ; đánh giá độc lập tổ chức khoa học và công nghệ; trình tự, thủ tục xác định, phê duyệt nhiệm vụ khoa học và công nghệ đặc biệt;
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với tổ chức, cá nhân hoạt động khoa học và công nghệ và tô chức, cá nhân khác có liên quan đến hoạt động khoa học và công nghệ tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 1. Tổ chức khoa học và công nghệ công lập là tổ chức khoa học và công nghệ đo cơ quan có thẩm quyền quy định tại các diém a, b, e, d, đ, e và g Khoản i Điều 12 Luật khoa học và công nghệ và do tô chức chính trị, tô chức chính trị - xã hội, thành lập và đầu tư. 2. Tổ chức khoa học và công nghệ ngoài công lập là tổ chức khoa học và công nghệ do doanh nghiệp, cá nhân và các tổ chức Việt Nam không thuộc quy định tại Khoản 1 Điều nay thành lập.
      trang_pdf: 2
    - dieu: 10
      noi_dung: 'Điều 10. Trình tự, thủ tục thay đổi, bd sung, cấp lại Giấy chứng nhận đăng ký hoạt động khoa học và công nghệ 1. Đối với trường hợp thay đổi, bd sung Giấy chứng nhận đăng ký hoạt động khoa học và công nghệ, hô sơ bao gom:'
      trang_pdf: 9
    - dieu: 16
      noi_dung: 'Điều 16. Giải thể tổ chức khoa học và công nghệ 1. Giải thé tổ chức khoa học va công nghệ là việc chấm dứt hoạt động của tổ chức khoa học và công nghệ. Việc giải thể tổ chức khoa học và công nghệ được thực hiện trong các trường hợp sau đây: a) Kết thúc thời hạn hoạt động đã ghi trong Điều lệ tổ chức và hoạt động của tổ chức khoa học và công nghệ mà không có quyết định gia hạn; b) Theo quyết định của cơ quan, tổ chức, cá nhân có thâm quyển;'
      trang_pdf: 14
    - dieu: 22
      noi_dung: 'Điều 22. Quyền và nghĩa vụ của văn phòng đại diện, chỉ nhánh tại Việt Nam của tô chức khoa học và công nghệ nước ngoài 1. Văn phòng đại diện, chỉ nhánh có các quyền sau đây: a) Được Nhà nước Việt Nam bảo hộ các quyền và lợi ích hợp pháp theo quy định của pháp luật Việt Nam và Điều ước quốc tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên;'
      trang_pdf: 20
    - dieu: 28
      noi_dung: 'Điều 28. Nhiệm vụ khoa học và công nghệ sử dụng ngân sách nhà nước cấp cơ sở Nhiệm vụ khoa học và công nghệ sử dụng ngân sách nhà nước cấp cơ sở là nhiệm vụ khoa học và công nghệ nhằm giải quyết các vấn dé khoa học và công nghệ của cơ sở và do Thủ trưởng cơ sở ký hợp đồng thực hiện bao gồm: 1. Dé tai khoa học và công nghệ cấp cơ sở; 2. Dự án khoa học và công nghệ cấp co sở.'
      trang_pdf: 24
    - dieu: 34
      noi_dung: Điều 34. Tổ chức, chuyên gia tư vấn độc lập 1. Tổ chức tư vấn độc lập là tổ chức khoa học và công nghệ có năng lực và kinh nghiệm trong lĩnh vực chuyên môn cân tư vân.
      trang_pdf: 27
    - dieu: 40
      noi_dung: Điều 40. Trình tự, thủ tục giao quyền sở hữu, quyền sử dụng kết quả nghiên cứu khoa học và phát triển công nghệ sử dụng ngân sách nhà nước 1. Tổ chức chủ trì thực hiện nhiệm vụ khoa học và công nghệ, doanh nghiệp khoa học và công nghệ có nhu cầu được giao quyển sở hữu, quyền sử dụng kết quả nghiên cứu khoa học và phát triển công nghệ phải làm hd sơ đề nghị giao quyền sở hữu, quyền sử dụng gửi đại diện chủ sở hữu nhà nước.
      trang_pdf: 31
    - dieu: 49
      noi_dung: Điều 49. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày 15 tháng 3 năm 2014. 2. Nghị định số 81/2002/NĐ-CP ngày 17 tháng 10 năm 2002 của Chính phủ quy định chỉ tiết thi hành một số điều của Luật khoa học và công nghệ; Nghị định số 201/2004/NĐ-CP ngày 10 tháng 12 năm 2004 của Chính phủ ban hành Quy chế hoạt động khoa học xã hội và nhân văn;
      trang_pdf: 37
