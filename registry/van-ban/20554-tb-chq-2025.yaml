xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/21/1.VB_20554.pdf, id=101074, SHA-256 53595970ca4b9565906d7b952898a66f52c2fe934d7b7ed5b8dd25388f2437cd): Thông báo số 20554/TB-CHQ ngày 21-08-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Đèn báo hiệu tín hiệu hành lang không dây dùng trong hệ thống báo gọi y tá, có tích hợp phát âm thanh (ký, mã hiệu SOLT SL6-10RGB; cấu tạo gồm bảng mạch điện tử tích hợp ăng ten thu sóng vô tuyến không dây tần số 433 ~ 434.6500 MHz kênh 12.5 KHz, đèn LED 3 màu RGB phát sáng được 7 loại màu, bộ phát âm thanh tạo tiếng "beep" có thể tắt trực tiếp trên thân thiết bị, nắp trên bằng nhựa PC màu trắng và vỏ dưới bằng nhựa ABS màu trắng; nguồn điện 110-220VAC qua adapter 12VDC/1A, kích thước 115 x 130 x 48 mm, trọng lượng 110g; không có khả năng đàm thoại, lắp bắt vít cố định trên tường hành lang, trước cửa phòng bệnh hoặc phòng trực để nhận lệnh điều khiển qua sóng vô tuyến từ thiết bị xử lý trung tâm và nháy đèn kèm tiếng "beep" báo hiệu cho y tá, bác sĩ), phân loại vào nhóm 85.31, phân nhóm 8531.80, mã số 8531.80.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Đèn báo hiệu tín hiệu hành lang không dây dùng trong hệ thống báo gọi y tá, có tích hợp phát âm thanh (ký, mã hiệu SOLT SL6-10RGB; bảng mạch điện tử tích hợp ăng ten thu sóng vô tuyến 433 ~ 434.6500 MHz, đèn LED RGB 7 màu, bộ phát tiếng "beep", vỏ nhựa PC/ABS màu trắng, nguồn 110-220VAC / 12VDC 1A, kích thước 115 x 130 x 48 mm, trọng lượng 110g, không có chức năng đàm thoại, lắp trên tường hành lang bệnh viện) thuộc nhóm 85.31, phân nhóm 8531.80, mã số 8531.80.90.'
