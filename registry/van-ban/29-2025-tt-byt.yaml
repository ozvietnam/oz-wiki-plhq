  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=214390) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (29-byt.pdf): ban hành ngày 01-07-2025, có hiệu lực thi hành từ ngày 01-07-2025; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Quy định về dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả trong hồ sơ đăng ký thuốc cổ truyền và tiêu chí để xác định trường hợp miễn thử, miễn một số giai đoạn thử thuốc cổ truyền trên lâm sàng tại Việt Nam và thuốc cổ truyền phải yêu cầu thử lâm sàng giai đoạn 4 tại khoản 2, khoản 3 Điều 72 và khoản 4 Điều 89 Luật Dược.'
      trang_pdf: 1
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 1
      khoan: 2
      noi_dung: '2. Quy định về hồ sơ, thủ tục cấp, gia hạn, thay đổi, bổ sung, thu hồi giấy đăng ký lưu hành thuốc cổ truyền, vị thuốc cổ truyền, dược liệu dùng cho người tại Việt Nam tại khoản 9 Điều 56 và khoản 2 Điều 58 Luật Dược.'
      trang_pdf: 2
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 3
      khoan: 1
      noi_dung: '1. Ngôn ngữ sử dụng trong hồ sơ: a) Hồ sơ đăng ký thuốc cổ truyền, vị thuốc cổ truyền, dược liệu sản xuất trong nước phải viết bằng tiếng Việt; b) Hồ sơ đăng ký thuốc cổ truyền, vị thuốc cổ truyền, dược liệu nhập khẩu phải được viết bằng tiếng Việt hoặc tiếng Anh, riêng tờ hướng dẫn sử dụng sản phẩm phải được viết bằng tiếng Việt.'
      trang_pdf: 3
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 7
      khoan: 1
      noi_dung: '1. Hiệu lực của giấy đăng ký lưu hành thuốc cổ truyền, vị thuốc cổ truyền, dược liệu là 05 năm kể từ ngày cấp hoặc gia hạn, trừ trường hợp quy định tại khoản 2 và khoản 3 Điều này.'
      trang_pdf: 11
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 17
      khoan: 2
      noi_dung: '2. Các tài liệu pháp lý trong trường hợp cơ sở đứng tên đăng ký thuốc cổ truyền là cơ sở sản xuất: a) Bản sao Giấy chứng nhận đủ điều kiện kinh doanh dược có phạm vi sản xuất thuốc cổ truyền hoặc thuốc dược liệu đối với cơ sở sản xuất trong nước, trừ trường hợp đã có cơ sở dữ liệu trên Trang Thông tin điện tử hoặc dịch vụ công của Bộ Y tế (Cục Quản lý Y, Dược cổ truyền hoặc Cục Quản lý Dược); b) Bản sao Giấy phép sản xuất thuốc do cơ quan nhà nước có thẩm quyền nước ngoài cấp; Giấy phép thành lập văn phòng đại diện tại Việt Nam và CPP đối với cơ sở sản xuất nước ngoài.'
      trang_pdf: 17
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 26
      khoan: 3
      noi_dung: '3. Các tài liệu pháp lý trong trường hợp cơ sở đứng tên đăng ký lưu hành dược liệu không phải là cơ sở sản xuất vị thuốc cổ truyền, dược liệu: a) Các tài liệu pháp lý của cơ sở sản xuất vị thuốc cổ truyền, dược liệu đề nghị đăng ký quy định tại khoản 2 Điều này. Không yêu cầu Giấy phép thành lập Văn phòng đại diện tại Việt Nam của cơ sở sản xuất trong trường hợp ủy quyền tại điểm b Khoản này; b) Các tài liệu pháp lý của cơ sở đứng tên đăng ký lưu hành vị thuốc cổ truyền, dược liệu: - Bản sao Giấy chứng nhận đủ điều kiện kinh doanh dược đối với cơ sở trong nước có một trong các phạm vi kinh doanh: bán buôn, xuất khẩu, nhập khẩu vị thuốc cổ truyền hoặc dược liệu, trừ trường hợp đã có cơ sở dữ liệu trên Trang Thông tin điện tử hoặc dịch vụ công của Bộ Y tế (Cục Quản lý Y, Dược cổ truyền hoặc Cục Quản lý Dược); - Bản sao Giấy phép sản xuất, kinh doanh dược do cơ quan quản lý nhà nước có thẩm quyền nước ngoài cấp và Giấy phép thành lập Văn phòng đại diện tại Việt Nam đối với cơ sở sản xuất nước ngoài.'
      trang_pdf: 29
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 38
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2025.'
      trang_pdf: 41
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
    - dieu: 38
      khoan: 2
      noi_dung: '2. Các nội dung và Thông tư sau hết hiệu lực kể từ ngày Thông tư này có hiệu lực: a) Nội dung quy định liên quan đến thuốc cổ truyền quy định tại Thông tư số 07/2017/TT-BYT ngày 03 tháng 5 năm 2017 của Bộ trưởng Bộ Y tế ban hành danh mục thuốc không kê đơn; b) Thông tư số 21/2018/TT-BYT ngày 12 tháng 9 năm 2018 của Bộ trưởng Bộ Y tế quy định việc đăng ký lưu hành thuốc cổ truyền, dược liệu; c) Thông tư số 39/2021/TT-BYT ngày 31 tháng 12 năm 2021 của Bộ trưởng Bộ Y tế sửa đổi, bổ sung một số điều của Thông tư số 21/2018/TT-BYT ngày 12 tháng 9 năm 2018 của Bộ trưởng Bộ Y tế quy định việc đăng ký lưu hành thuốc cổ truyền, dược liệu; d) Thông tư số 54/2024/TT-BYT ngày 31 tháng 12 năm 2024 của Bộ trưởng Bộ Y tế sửa đổi, bổ sung một số điều về gia hạn giấy đăng ký lưu hành thuốc cổ truyền, vị thuốc cổ truyền, dược liệu tại Thông tư số 21/2018/TT-BYT ngày 12 tháng 9 năm 2018 của Bộ trưởng Bộ Y tế quy định việc đăng ký lưu hành thuốc cổ truyền, dược liệu.'
      trang_pdf: 41
      sha256_pdf: 135c43373d984082acf63a70cbe2126cf63d43d64c555943ab4c0b1294632b9e
