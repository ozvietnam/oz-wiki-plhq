xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (11 trang, ký Thứ trưởng Nguyễn Sinh Nhật Tân ngày 14-09-2026) + congbao.chinhphu.vn (Công báo số 512-VBHN) + vanban.chinhphu.vn docid=219509 + PDF moit.gov.vn: 3 Điều + Phụ lục xác thực văn bản hợp nhất. Hợp nhất Thông tư 08/2023/TT-BCT ngày 31-03-2023 sửa đổi, bổ sung một số điều quy định Danh mục chi tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu (hiệu lực 16-05-2023), được sửa đổi, bổ sung bởi: (1) Thông tư 43/2023/TT-BCT ngày 28-12-2023 (hiệu lực 16-02-2024), (2) Thông tư 41/2026/TT-BCT ngày 20-08-2026 (hiệu lực 07-10-2026), (3) Thông tư 48/2026/TT-BCT ngày 05-09-2026 (hiệu lực 05-09-2026). Đối chiếu đến 12-11-2026 là bản hợp nhất đang áp dụng.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-05-ai-live@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Sửa đổi, bổ sung một số điều của Thông tư số 12/2018/TT-BCT ngày 15 tháng 6 năm 2018 của Bộ trưởng Bộ Công Thương, quy định chỉ tiết một số điều của Luật Quản lý ngoại thương và Nghị định số 62/2018/NĐ- CP ngày 15 tháng 5 năm 2018 của Chính phủ quy định chỉ tiết một số điều của Luật Quản lý ngoại thương (sau đây gọi là Thông tư số 12/2018/TT-BCT) 12 (được bãi bỏ) 23 (được bãi bỏ)
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đỗi, bd sung một số điều của Thông tư số 41/2019/T T-BCT ngay 16 thang 12 năm, 2019 của Bộ trưởng Bộ Công Thương bo sung Danh mục chỉ tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu quy định tại một số Thông tư của Bộ Công Thương (Thông tư số 41/2019/TT- BCT) ! Thông tư số 43/2023/TT-BCT có căn cứ ban hành như sau: “Căn cứ Luật Phòng, chống tác hại của thuốc lá;'
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Hiệu lực thi hanh‘ * Điều 7, Điều 8 Thông tư số 43/2023/TT- BCT, có hiệu lực kể từ ngày 12 tháng 02 năm 2024 quy định như sau: “Điều 7. Quy định chuyển tiếp L Trường hợp đã tiếp nhận hồ sơ đối với các thủ tục hành chính quy định tại Điều 2 của Thông tư này trước ngày Thông tư này có hiệu lực thì tiếp tục thực hiện theo quy định của pháp luật tại thời điểm tiếp nhận hồ sơ.'
      trang_pdf: 3
ghi_chu: Trinh sát đêm 11/11, nạp toàn văn và đối chiếu hiệu lực ngày 12/11. LÕI tra cứu mã HS khai báo — cặp với 74/2026/VBHN-TT-BCT (TT bổ sung). Đã nối quan_he.hop_nhat với 08/2023/TT-BCT và 48/2026/TT-BCT đã có trong sổ; hai thông tư thành phần còn lại (43/2023/TT-BCT, 41/2026/TT-BCT) chưa ghi vào quan_he vì chưa có trong sổ.
