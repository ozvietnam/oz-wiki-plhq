  boi: tho-05-ai-live@ozvietnam
ghi_chu: 'Trinh sát đêm 11/11, nạp toàn văn và đối chiếu hiệu lực ngày 12/11. LÕI tra cứu mã HS khai báo — cặp với 74/2026/VBHN-TT-BCT (TT bổ sung). Đã nối quan_he.hop_nhat với 08/2023/TT-BCT và 48/2026/TT-BCT đã có trong sổ; hai thông tư thành phần còn lại (43/2023/TT-BCT, 41/2026/TT-BCT) chưa ghi vào quan_he vì chưa có trong sổ.'
