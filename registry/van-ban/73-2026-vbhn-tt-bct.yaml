  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (11 trang, ký Thứ trưởng Nguyễn Sinh Nhật Tân ngày 14-09-2026) + congbao.chinhphu.vn (Công báo số 512-VBHN) + vanban.chinhphu.vn docid=219509 + PDF moit.gov.vn: 3 Điều + Phụ lục xác thực văn bản hợp nhất. Hợp nhất Thông tư 08/2023/TT-BCT ngày 31-03-2023 sửa đổi, bổ sung một số điều quy định Danh mục chi tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu (hiệu lực 16-05-2023), được sửa đổi, bổ sung bởi: (1) Thông tư 43/2023/TT-BCT ngày 28-12-2023 (hiệu lực 16-02-2024), (2) Thông tư 41/2026/TT-BCT ngày 20-08-2026 (hiệu lực 07-10-2026), (3) Thông tư 48/2026/TT-BCT ngày 05-09-2026 (hiệu lực 05-09-2026). Đối chiếu đến 12-11-2026 là bản hợp nhất đang áp dụng.'
  hieu_luc_da_doi_chieu: true
