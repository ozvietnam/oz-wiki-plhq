ghi_chu: 'Sheet "Hệ thống văn bản" của Biểu thuế XNK Tổng cục (nhu-cau/bieu-thue-van-ban.json) ghi lỗi chính tả ký hiệu cơ quan là "01/2022/TT-BNNPTNN" (vai trò HIEN_HANH, 0 mã HS) và ghép nhầm mô tả danh mục kiểm dịch động vật trên cạn / giống vật nuôi cấm xuất khẩu của Phụ lục TT 11/2021/TT-BNNPTNT. Trên hệ thống Công báo và Cổng TTĐT Chính phủ không tồn tại cơ quan "BNNPTNN", số hiệu đúng của Thông tư số 01 năm 2022 của Bộ NN&PTNT là 01/2022/TT-BNNPTNT; do đó gắn so_hieu_khac: [01/2022/TT-BNNPTNN] vào mục này để đóng điểm mù BIEU_THUE_CHUA_CO mà không tạo bản ghi trùng. Các Thông tư 19/2018/TT-BNNPTNT đến 26/2018/TT-BNNPTNT (bị sửa đổi tại Điều 1–8), TT 13/2020/TT-BNNPTNT ngày 09-11-2020 (hết hiệu lực theo khoản 2 Điều 10, https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=201680) và TT 30/2025/TT-BNNMT (https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-30-2025-tt-bnnmt-sua-doi-bo-sung-mot-so-thong-tu-trong-li-nh-vu-c-kiem-ngu-bao-ve-va-phat-trien-nguon-loi-thuy-san--179713) chưa có trong sổ nên ghi nhận đầy đủ tại pham_vi và ghi_chu, chỉ khai quan_he.sua_doi đối với 11/2021/TT-BNNPTNT đã có trong sổ. Điều 9 và Phụ lục XXIII (bảng mã HS thủy sản sửa đổi TT 11/2021/TT-BNNPTNT) đã bị bãi bỏ từ 20-03-2024 bởi Điều 3 khoản 2 điểm c, d TT 01/2024/TT-BNNPTNT.'
