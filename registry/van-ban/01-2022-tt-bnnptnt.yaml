xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF Công báo số 209+210, 211+212, 213+214 ngày 06-02-2022 (có lớp chữ) và tệp 01-bnnptnt.pdf trên vanban.chinhphu.vn (docid=205232): số hiệu 01/2022/TT-BNNPTNT, trích yếu, ngày ký 18-01-2022, người ký Thứ trưởng Phùng Đức Tiến; cấu trúc 10 Điều và 23 Phụ lục (Phụ lục I–XXIII). Các Điều 1–9 sửa đổi, bổ sung 09 Thông tư: Điều 1 sửa TT 19/2018/TT-BNNPTNT ngày 15-11-2018; Điều 2 sửa TT 20/2018/TT-BNNPTNT ngày 15-11-2018; Điều 3 sửa TT 21/2018/TT-BNNPTNT ngày 15-11-2018 (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=196287); Điều 4 sửa TT 22/2018/TT-BNNPTNT ngày 15-11-2018 (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=196593); Điều 5 sửa TT 23/2018/TT-BNNPTNT ngày 15-11-2018; Điều 6 sửa TT 24/2018/TT-BNNPTNT ngày 15-11-2018 (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=195978); Điều 7 sửa TT 25/2018/TT-BNNPTNT ngày 15-11-2018 (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=196070); Điều 8 sửa TT 26/2018/TT-BNNPTNT ngày 15-11-2018 (https://congbao.chinhphu.vn/van-ban/thong-tu-so-26-2018-tt-bnnptnt-28128/25285.htm); Điều 9 thay thế Phần A Mục 16 Phụ lục I TT 11/2021/TT-BNNPTNT ngày 20-09-2021 (https://vanban.chinhphu.vn/default.aspx?docid=204147&pageid=27160) bằng Phụ lục XXIII. Điều 10 (Hiệu lực thi hành, tr. 29–30 Công báo 209+210): "1. Thông tư này có hiệu lực thi hành từ ngày 04 tháng 3 năm 2022. 2. Thông tư số 13/2020/TT-BNNPTNT ngày 09/11/2020 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn về việc sửa đổi, bổ sung một số điều của Thông tư số 21/2018/TT-BNNPTNT ngày 15/11/2018 quy định ghi, nộp báo cáo, nhật ký khai thác thủy sản; công bố cảng cá chỉ định xác nhận nguồn gốc thủy sản từ khai thác; danh sách tàu cá khai thác thủy sản bất hợp pháp; xác nhận nguyên liệu, chứng nhận nguồn gốc thủy sản khai thác hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực thi hành (https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=201680)." Đối chiếu tình trạng hiện tại ngày 2026-11-12: điểm c, điểm d khoản 2 Điều 3 Thông tư 01/2024/TT-BNNPTNT ngày 02-02-2024 (https://chinhphu.vn/?docid=209723&pageid=27160, đã có trong sổ) đã bãi bỏ Điều 9 và Phụ lục XXIII của TT 01/2022/TT-BNNPTNT từ ngày 20-03-2024; ngoài ra một số điều khoản về kiểm ngư, bảo vệ nguồn lợi thủy sản tiếp tục được sửa đổi, bổ sung bởi Thông tư 30/2025/TT-BNNMT (https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-30-2025-tt-bnnmt-sua-doi-bo-sung-mot-so-thong-tu-trong-li-nh-vu-c-kiem-ngu-bao-ve-va-phat-trien-nguon-loi-thuy-san--179713). Do đó văn bản ở trạng thái HET_HIEU_LUC_MOT_PHAN.'
  hieu_luc_da_doi_chieu: true
