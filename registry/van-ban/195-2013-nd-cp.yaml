xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu Công báo Chính phủ (id=4253, Công báo số 225+226 năm 2014) và cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/10106.htm, Thủ tướng Nguyễn Tấn Dũng ký): số hiệu, tiêu đề, ngày ban hành 21-11-2013 (hiệu đính từ 14-11-2013 ở bản ghi cũ), có hiệu lực từ 01-03-2014; đang còn hiệu lực (được sửa đổi, bổ sung một phần bởi Nghị định 60/2014/NĐ-CP, Nghị định 25/2018/NĐ-CP và Nghị định 150/2018/NĐ-CP)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Nghị định này quy định chi tiết một số điều và biện pháp thi hành Luật xuất bản về trách nhiệm quản lý nhà nước và thực hiện chính sách của Nhà nước đối với hoạt động xuất bản; tổ chức và hoạt động trong các lĩnh vực xuất bản, in, phát hành xuất bản phẩm và xuất bản, phát hành xuất bản phẩm điện tử.
      trang_pdf: 1
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 2
      noi_dung: Điều 2. Nhiệm vụ, quyền hạn của Bộ Thông tin và Truyền thông trong việc thực hiện quản lý nhà nước về hoạt động xuất bản 1. Chủ trì, phối hợp xây dựng, ban hành theo thẩm quyền hoặc trình cơ quan có thẩm quyền ban hành các văn bản quy phạm pháp luật, chiến lược, quy hoạch, kế hoạch, chính sách của Nhà nước đối với hoạt động xuất bản, quyền tác giả và quyền liên quan trong hoạt động xuất bản và các biện pháp phòng, chống in lậu, in giả, in nối
      trang_pdf: 1
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 3
      noi_dung: Điều 3. Trách nhiệm của các Bộ, cơ quan ngang Bộ trong việc quản lý nhà nước về hoạt động xuất bản 1. Bộ Công an chủ trì, phối hợp với Bộ Thông tin và Truyền thông quy định theo thẩm quyền hoặc trình cơ quan có thẩm quyền quy định và hướng dẫn thực hiện các biện pháp bảo đảm an ninh - trật tự và phòng, chống tội phạm trong hoạt động xuất bản.
      trang_pdf: 2
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 7
      noi_dung: 'Điều 7. Cấp, cấp lại, gia hạn giấy phép thành lập văn phòng đại diện tại Việt Nam của nhà xuất bản nước ngoài, của tổ chức phát hành xuất bản phẩm nước ngoài 1. Việc cấp giấy phép thành lập văn phòng đại diện thực hiện theo quy định sau đây: a) Hồ sơ đề nghị cấp giấy phép thành lập văn phòng đại diện (bằng tiếng Việt và tiếng Anh có công chứng) gửi Bộ Thông tin và Truyền thông gồm có: Đơn đề nghị cấp giấy phép;'
      trang_pdf: 4
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 10
      noi_dung: Điều 10. Đăng ký xuất bản và xác nhận đăng ký xuất bản 1. Việc đăng ký xuất bản của nhà xuất bản thực hiện theo quy định Khoản 1 Điều 22 Luật xuất bản, không giới hạn số lượng tác phẩm, tài liệu, xuất bản phẩm trong mỗi lần đăng ký và nhà xuất bản chịu trách nhiệm trước pháp luật về nội dung đăng ký xuất bản.
      trang_pdf: 6
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 13
      noi_dung: 'Điều 13. Điều kiện, hồ sơ cấp giấy phép hoạt động in xuất bản phẩm và các trường hợp thu hồi giấy phép hoạt động in xuất bản phẩm 1. Cơ sở in được cấp giấy phép hoạt động in xuất bản phẩm (bao gồm các công đoạn chế bản, in, gia công sau in) khi có đủ các điều kiện sau đây: a) Theo quy định tại Khoản 1 Điều 32 Luật xuất bản; b) Chủ sở hữu là tổ chức, cá nhân Việt Nam.'
      trang_pdf: 9
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 15
      noi_dung: 'Điều 15. Từ chối xác nhận đăng ký nhập khẩu xuất bản phẩm để kinh doanh Bộ Thông tin và Truyền thông từ chối xác nhận đăng ký nhập khẩu xuất bản phẩm để kinh doanh đối với cơ sở nhập khẩu xuất bản phẩm trong các trường hợp sau đây: 1. Xuất bản phẩm có dấu hiệu vi phạm pháp luật. 2. Xuất bản phẩm nhập khẩu đã được yêu cầu thẩm định nội dung nhưng cơ sở nhập khẩu không báo cáo kết quả thẩm định nội dung.'
      trang_pdf: 11
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 18
      noi_dung: 'Điều 18. Thẩm định đề án và đăng ký hoạt động xuất bản, phát hành xuất bản phẩm điện tử 1. Việc thẩm định đề án hoạt động xuất bản và phát hành xuất bản phẩm điện tử thực hiện như sau: a) Nhà xuất bản phải có đề án hoạt động xuất bản điện tử và tổ chức, cá nhân phải có đề án hoạt động phát hành xuất bản phẩm điện tử gửi Bộ Thông tin và Truyền thông;'
      trang_pdf: 13
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 21
      noi_dung: Điều 21. Nộp lưu chiểu xuất bản phẩm điện tử 1. Khi nộp lưu chiểu xuất bản phẩm điện tử cho cơ quan quản lý nhà nước về hoạt động xuất bản theo quy định tại Điều 48 Luật xuất bản, nhà xuất bản, cơ quan, tổ chức được cấp giấy phép xuất bản phải nộp xuất bản phẩm điện tử dưới dạng 01 (một) bản ghi trong thiết bị lưu trữ dữ liệu hoặc nộp qua mạng Internet bằng định dạng số theo quy định của Bộ trưởng Bộ Thông tin và Truyền thông về định dạng tệp
      trang_pdf: 15
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
    - dieu: 25
      noi_dung: Điều 25. Cấp đổi giấy phép trong hoạt động xuất bản và đăng ký hoạt động phát hành xuất bản phẩm 1. Trong thời hạn 18 tháng, kể từ ngày Nghị định này có hiệu lực thi hành, cơ quan chủ quản nhà xuất bản phải làm thủ tục đề nghị cấp đổi giấy phép thành lập nhà xuất bản.
      trang_pdf: 17
      sha256_pdf: a0b5d8399f2323f21c3189ee0a46a09672a84c90715d221520be1a948e2852af
