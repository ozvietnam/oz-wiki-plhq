  pham_vi: 'Công báo số 409 ngày 18-07-2026: ban hành 30-06-2026, ký Nguyễn Đức Chi; Điều 15 khoản 1 hiệu lực 15-09-2026 và thay thế TT 14/2015/TT-BTC + TT 17/2021/TT-BTC; Điều 4 (5 nguyên tắc tuân thủ gồm 6 GRI WCO); Điều 6.1 thứ tự ưu tiên 4 nguồn tra cứu khi chưa xác định được mã duy nhất (Chú giải chi tiết HS WCO → Tuyển tập ý kiến WCO → Chú giải bổ sung AHTN → CSDL VN); Điều 6.2 khi mô tả VN khác HS WCO thì áp dụng HS WCO; Điều 7 phân loại máy liên hợp/tổ hợp máy Ch.84/85/90 theo Chú giải pháp lý 3,4,5 Phần XVI. Toàn văn đã tải về raw/download/congbaocdn.chinhphu.vn/2026/7/18/85-2026-tt-btc.pdf (sha256 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe, 23 trang, 711KB).'
