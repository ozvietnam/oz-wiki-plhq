  # Nguồn tài liệu tham chiếu theo Điều 6.1 mà hs-code-api giữ riêng tư (không nạp vào repo công khai).
  # Trường này để tools/diem-mu.mjs bỏ qua 2 điểm mù THIEU_NGUON_WCO_COMPENDIUM và THIEU_NGUON_AHTN.
  nguon_rieng_tu:
    wco_compendium: hs-code-api (mua bản quyền WCO Bookshop, xử lý nội bộ; không nạp vào kho công khai)
    ahtn_sen: hs-code-api đã có SEN AHTN 2022 (395 mục / 683 mã); không cần nạp vào kho công khai
  # Điều khoản có cấu trúc cho hs-code-api (mục 1 yêu cầu PR #120). Mỗi entry: dieu, khoan, diem, noi_dung (nguyên văn), trang_pdf, sha256_pdf.
  dieu_khoan:
    - dieu: 4
      khoan: 1
      noi_dung: 'Một mặt hàng có một mã số duy nhất theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 4
      khoan: 2
      diem: a
      noi_dung: 'Điều 26 Luật Hải quan số 54/2014/QH13; Điều 16 Nghị định số 08/2015/NĐ-CP'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 4
      khoan: 2
      diem: d
      noi_dung: '6 (sáu) quy tắc tổng quát giải thích việc phân loại hàng hóa theo Hệ thống hài hoà mô tả và mã hoá hàng hóa'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 5
      khoan: 1
      noi_dung: 'Kết quả phân loại hàng hóa được sử dụng để áp dụng chính sách quản lý hàng hóa trên cơ sở thực hiện quy định về điều kiện, thủ tục, hồ sơ áp dụng tại Danh mục hàng hóa cấm xuất khẩu, tạm ngừng xuất khẩu; Danh mục hàng hóa cấm nhập khẩu, tạm ngừng nhập khẩu; Danh mục hàng hóa xuất khẩu, nhập khẩu theo giấy phép của cơ quan nhà nước có thẩm quyền; Danh mục hàng hóa thuộc đối tượng kiểm tra chuyên ngành có hiệu lực tại thời điểm đăng ký tờ khai.'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 5
      khoan: 2
      noi_dung: 'Kết quả phân loại hàng hóa được sử dụng để áp dụng mức thuế đối với một mặt hàng trên cơ sở thực hiện quy định tại các Biểu thuế áp dụng đối với hàng hóa xuất khẩu, nhập khẩu có hiệu lực tại thời điểm đăng ký tờ khai và điều kiện, thủ tục, hồ sơ để được áp dụng mức thuế quy định tại các văn bản quy phạm pháp luật về thuế đối với hàng hóa xuất khẩu, nhập khẩu.'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 1
      diem: a
      noi_dung: 'Chú giải chi tiết Danh mục HS'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 1
      diem: b
      noi_dung: 'Tuyển tập ý kiến phân loại của WCO'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 1
      diem: c
      noi_dung: 'Chú giải bổ sung Danh mục AHTN'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 1
      diem: d
      noi_dung: 'Cơ sở dữ liệu về Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 2
      noi_dung: 'Trường hợp có sự khác biệt về mô tả hàng hóa tại Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam và mô tả hàng hóa theo Danh mục HS, Danh mục AHTN thì áp dụng trực tiếp mô tả hàng hóa theo Danh mục HS, Danh mục AHTN để phân loại và hướng dẫn phân loại theo nguyên tắc áp dụng quy định của Điều ước quốc tế mà Việt Nam là thành viên.'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 3
      noi_dung: 'Trường hợp thực hiện quy định tại Điều 4 và khoản 1 Điều 6 Thông tư này chưa đủ cơ sở để xác định tên gọi, mô tả hàng hóa theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam thì được sử dụng các tiêu chí, tiêu chuẩn, quy chuẩn do cơ quan, tổ chức, đơn vị có thẩm quyền ban hành theo quy định để làm cơ sở xác định tên gọi, mô tả hàng hóa, mã số theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam.'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 4
      noi_dung: 'Trường hợp hàng hoá có mã số tại Danh mục hàng hoá quản lý chuyên ngành khác biệt với mã số xác định theo Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam thì thực hiện theo Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam và pháp luật về hải quan.'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 6
      khoan: 5
      noi_dung: 'Trường hợp mặt hàng phức tạp, khó phân loại, Cục trưởng Cục Hải quan trên cơ sở ý kiến của Bộ, cơ quan ngang Bộ quản lý chuyên ngành hoặc Ủy ban HS thuộc Tổ chức Hải quan thế giới hoặc Nhóm kỹ thuật về phân loại hàng hoá của ASEAN ban hành văn bản sửa đổi, hướng dẫn phân loại, làm ảnh hưởng tới quá trình khai báo hải quan về mã số, mức thuế và hiệu quả của hoạt động sản xuất kinh doanh của người khai hải quan, người nộp thuế thì thực hiện phân loại hàng hóa kể từ ngày văn bản sửa đổi, hướng dẫn phân loại được ban hành.'
      trang_pdf: 26
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 7
      noi_dung: 'Hàng hóa là máy liên hợp (gồm hai hay nhiều máy) hoặc tổ hợp máy thuộc các Chương 84, Chương 85 và Chương 90 của Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam được nhập khẩu từ một nguồn hay nhiều nguồn cung cấp, về nhiều chuyến, làm thủ tục tại một hay nhiều đơn vị hải quan khác nhau thì người khai hải quan được lựa chọn phân loại theo từng máy móc, thiết bị hoặc theo quy định tại Chú giải pháp lý 3, 4, 5 Phần XVI của Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam. Trường hợp lựa chọn phân loại theo quy định tại Chú giải pháp lý 3, 4, 5 Phần XVI thì thực hiện theo hướng dẫn tại Điều 9 dưới đây.'
      trang_pdf: 27
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 8
      noi_dung: 'Hàng hóa là máy móc, thiết bị ở dạng chưa lắp ráp hoặc tháo rời thường do yêu cầu đóng gói, bảo quản hoặc vận chuyển thực hiện phân loại theo quy tắc 2a của 6 (sáu) quy tắc tổng quát giải thích Hệ thống HS. Trường hợp hàng hóa được nhập khẩu từ một nguồn hay nhiều nguồn cung cấp, về nhiều chuyến, làm thủ tục tại một hay nhiều đơn vị hải quan khác nhau thì người khai hải quan, cơ quan hải quan thực hiện theo hướng dẫn tại Điều 9 dưới đây.'
      trang_pdf: 27
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 3
      khoan: 3
      noi_dung: 'Để phân loại hàng hóa, người khai hải quan có thể sử dụng các dịch vụ giám định hàng hóa của các tổ chức giám định theo quy định của pháp luật hoặc cơ sở dữ liệu về Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam để xác định các thông tin về thành phần, tính chất lý, hóa, tính năng, công dụng của hàng hóa xuất khẩu, nhập khẩu và chịu trách nhiệm về tính chính xác, hợp pháp của tài liệu cung cấp.'
      trang_pdf: 25
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 12
      khoan: 6
      noi_dung: 'Thông báo kết quả phân tích, phân loại; Thông báo kết quả kiểm tra, đánh giá tiêu chí kỹ thuật là cơ sở để xác định mức thuế, thực hiện chính sách quản lý hàng hóa; được cập nhật vào cơ sở dữ liệu của cơ quan hải quan. Thông báo kết quả phân tích, phân loại được công khai trên trang thông tin điện tử của Cục Hải quan (trừ phần phụ lục của Thông báo kết quả phân tích, phân loại).'
      trang_pdf: 32
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 12
      khoan: 7
      noi_dung: 'Trường hợp người khai hải quan không đồng ý với Thông báo kết quả phân tích, phân loại thì thực hiện khiếu nại theo Luật Khiếu nại số 02/2011/QH13 hoặc trưng cầu giám định theo quy định tại Điều 30 Nghị định số 08/2015/NĐ-CP.'
      trang_pdf: 33
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 13
      khoan: 1
      noi_dung: 'Cơ sở dữ liệu về Danh mục hàng hóa xuất khẩu, nhập khẩu được xây dựng từ: 1) Công ước HS và các phụ lục kèm theo; 2) Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam; 3) Danh mục hàng hóa cấm/giấy phép/điều kiện/quản lý chuyên ngành theo NĐ 69/2018; 4) Văn bản hướng dẫn của Bộ Tài chính, Cục Hải quan; 5) Thông báo kết quả xác định trước mã số, phân tích phân loại, kiểm tra đánh giá tiêu chí kỹ thuật; 6) Văn bản giải quyết khiếu nại về phân loại, áp dụng mức thuế.'
      trang_pdf: 32
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 15
      khoan: 1
      noi_dung: 'Thông tư này có hiệu lực thi hành kể từ ngày 15 tháng 09 năm 2026. Thông tư này thay thế Thông tư số 14/2015/TT-BTC ngày 30 tháng 01 năm 2015 của Bộ Tài chính hướng dẫn về phân loại hàng hoá, phân tích để phân loại hàng hoá; phân tích để kiểm tra chất lượng, kiểm tra an toàn thực phẩm đối với hàng hóa xuất khẩu, nhập khẩu và Thông tư số 17/2021/TT-BTC ngày 26 tháng 02 năm 2021 của Bộ Tài chính sửa đổi, bổ sung một số Điều tại Thông tư số 14/2015/TT-BTC.'
      trang_pdf: 34
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
    - dieu: 16
      khoan: 2
      noi_dung: 'Trường hợp nhập khẩu máy liên hợp hoặc tổ hợp máy thuộc các Chương 84, Chương 85 và Chương 90 và chi tiết, linh kiện rời theo Danh mục đã đăng ký trước thời điểm có hiệu lực của Thông tư này thì vẫn tiếp tục thực hiện theo quy định tại Thông tư số 14/2015/TT-BTC cho đến khi nhập hết hàng hóa theo Danh mục.'
      trang_pdf: 34
      sha256_pdf: 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe
ghi_chu: 'Điều 17 khoản 1: giao Cục trưởng Cục Hải quan ban hành Quy trình phân loại, Quy trình phân tích phân loại và kiểm tra đánh giá tiêu chí kỹ thuật, Quy chế xây dựng CSDL. Quy trình hiện hành: QĐ 2169/QĐ-CHQ ngày 31-12-2025 (hiệu lực 01-02-2026, có hiệu lực trước TT 85/2026). Căn cứ QĐ 2169: NĐ 08/2015 + NĐ 167/2025 + TT 14/2015 + TT 17/2021 + TT 121/2025 (khoản 11, 14, 16 Điều 1) + QĐ 1892/QĐ-BTC + QĐ 382/QĐ-BTC + QĐ 2019/QĐ-BTC. Khi TT 85/2026 có hiệu lực 15-9-2026, QĐ 2169 tiếp tục áp dụng theo Điều 2.3 (forward) + Điều 15.2 TT 85/2026. Căn cứ pháp lý khác: Luật HQ 54/2014 (Điều 26), Luật Thuế XNK 107/2016, NĐ 08/2015 (Điều 16, sửa bởi NĐ 167/2025 khoản 15 Điều 1), NĐ 134/2016 (sửa bởi NĐ 18/2021, NĐ 182/2025), Công ước HS WCO 14/06/1983. Trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) ghi sai ngày ban hành (20-07) và bịa ý "30 ngày" — văn bản không có mốc đó, mọi thông tin lấy từ nguồn bậc A.'
