  pham_vi: |
    Công báo số 409 ngày 18-07-2026: ban hành 30-06-2026, ký Nguyễn Đức Chi.
    Điều 4 (5 nguyên tắc tuân thủ gồm 6 GRI WCO); Điều 5 (kết quả phân loại dùng cho chính sách + thuế có hiệu lực tại thời điểm đăng ký tờ khai);
    Điều 6.1 (chưa xác định được mã số duy nhất thì sử dụng 4 tài liệu: (a) Chú giải chi tiết HS WCO, (b) Tuyển tập ý kiến phân loại WCO, (c) Chú giải bổ sung Danh mục AHTN, (d) Cơ sở dữ liệu VN — nguyên văn KHÔNG quy định "thứ tự ưu tiên" giữa 4 tài liệu);
    Điều 6.2 (mô tả VN khác HS WCO thì áp dụng HS WCO); Điều 7 (máy liên hợp/tổ hợp máy Ch.84/85/90 theo Chú giải pháp lý 3,4,5 Phần XVI);
    Điều 15 khoản 1 (hiệu lực 15-09-2026, thay thế TT 14/2015/TT-BTC + TT 17/2021/TT-BTC);
    Điều 16 khoản 2 (chuyển tiếp: máy liên hợp/tổ hợp máy đã đăng ký Danh mục trước 15-09-2026 tiếp tục theo TT 14/2015);
    Điều 17 khoản 1 (giao Cục trưởng Cục Hải quan ban hành Quy trình phân loại, Quy trình phân tích phân loại, Quy chế CSDL).
    Toàn văn đã tải về raw/download/congbaocdn.chinhphu.vn/2026/7/18/85-2026-tt-btc.pdf (sha256 652932cd3e3dda1dd498a46cdddb9fe2be61daada3def3452c045eb400d4fdfe, 23 trang, 711KB).
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-10'
  boi: hermes@ozvietnam
  nguon_da_mo:
