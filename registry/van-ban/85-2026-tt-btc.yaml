ghi_chu: 'Điều 15 khoản 1: thay thế TT 14/2015/TT-BTC + TT 17/2021/TT-BTC từ 15-09-2026. Điều 7: máy liên hợp/tổ hợp máy Ch.84/85/90 nhập nhiều chuyến/đơn vị HQ được chọn phân loại theo từng máy hoặc theo Chú giải pháp lý 3,4,5 Phần XVI. Căn cứ pháp lý: Luật HQ 54/2014 (Điều 26), Luật Thuế XNK 107/2016, NĐ 08/2015 (Điều 16, sửa bởi NĐ 167/2025 khoản 15 Điều 1), NĐ 134/2016 (sửa bởi NĐ 18/2021, NĐ 182/2025), Công ước HS WCO 14/06/1983. Trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) ghi sai ngày ban hành (20-07) và bịa ý "30 ngày" — văn bản không có mốc đó, mọi thông tin lấy từ nguồn bậc A.'
