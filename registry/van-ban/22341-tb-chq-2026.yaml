  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/29/VB_22341.pdf, id=106192, SHA-256 b2aee22e0750fc231a539b110e1bac2244eb2f64a5c07fa43138a407a5d9617d): Thông báo số 22341/TB-CHQ ngày 29-09-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 22341/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Super Absorbent Polymer (ký mã hiệu Super Absorbent Polymer CV30W, thành phần chính là Copolymer of acrylic acid and sodium acrylate >= 94%, nước <= 6%, dạng hạt màu trắng, độ pH 6-7, tan nhẹ trong nước, đóng gói 800 kg/bao, sản xuất bằng quy trình trùng hợp liên tục trên băng tải tạo tấm hydrogel rồi nghiền, sấy khô, sàng phân loại và liên kết ngang bề mặt, nhà sản xuất CHINVISION HYGIENE PRODUCT (JIAXING) CO., LTD, dùng thấm hút và giữ nước cho các sản phẩm vệ sinh dùng một lần như tã giấy, băng vệ sinh, tấm lót chống thấm), phân loại vào nhóm 39.06, phân nhóm 3906.90, mã số 3906.90.99; có hiệu lực kể từ ngày ban hành'
