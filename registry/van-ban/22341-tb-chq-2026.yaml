ghi_chu: 'Xác định trước mã số mặt hàng Super Absorbent Polymer (SAP, ký mã hiệu Super Absorbent Polymer CV30W, thành phần Copolymer of acrylic acid and sodium acrylate >= 94%, nước <= 6%, dạng hạt màu trắng, đóng gói 800 kg/bao, dùng thấm hút và giữ nước cho sản phẩm vệ sinh dùng một lần như tã giấy, băng vệ sinh, tấm lót chống thấm) thuộc nhóm 39.06, phân nhóm 3906.90, mã số 3906.90.99.'
