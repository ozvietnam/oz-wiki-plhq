xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=216530) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (luatso133.2025.qh15.pdf): Quốc hội thông qua ngày 10-12-2025, có hiệu lực thi hành từ ngày 01-07-2026; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-15'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về hoạt động công nghệ cao, chính sách, biện pháp khuyến khích, thúc đây hoạt động công nghệ cao và các hoạt động liên quan đến phát triển công nghệ chiến lược.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân Việt Nam, người Việt Nam định cư ở nước ngoài, tô chức nước ngoài, cá nhân nước ngoài tham gia hoặc có liên quan đến hoạt động công nghệ cao, công nghệ chiến lược tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Công nghệ cao là công nghệ có hàm lượng cao về nghiên cứu khoa học va phát trién công nghệ, tích hợp các thành tựu khoa học tiên tiên, có tính đột phá, tạo ra sản phẩm, dịch vụ có chất lượng vượt trội, giá trị gia tăng cao, thân thiện với môi trường.'
      trang_pdf: 1
    - dieu: 7
      noi_dung: Điều 7. Hợp tác quốc tế về công nghệ cao, công nghệ chiến lược 1. Nhà nước tạo điều kiện và hỗ trợ tổ chức, cá nhân trong nước hợp tác quốc tế trong nghiên cứu và phát triển, chuyển giao, ứng dụng và thương mại hóa công nghệ cao, công nghệ chiến lược; tham gia mạng lưới đổi mới sáng tạo, chuỗi giá trị và dự án hợp tác khu vực, toàn cầu phù hợp pháp luật Việt Nam và điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên;
      trang_pdf: 4
    - dieu: 10
      noi_dung: Điều 10. Các hành vi bị nghiêm cấm 1. Lợi dụng hoạt động công nghệ cao, công nghệ chiến lược dé xâm phạm lợi ích quốc gia, quyền và lợi ích hợp pháp của tổ chức, cá nhân; gây hậu quả xấu đến quôc phòng, an ninh, đạo đức xã hội, sức khỏe cộng đồng và môi trường. 2. Sử dụng công nghệ cao, công nghệ chiến lược hoặc sản phẩm, dịch vụ hình thành từ công nghệ đó dé thực hiện hành vi vi phạm pháp luật.
      trang_pdf: 6
    - dieu: 13
      noi_dung: 'Điều 13. Thu hút và phát triển nguồn nhân lực công nghệ cao 1. Nhân lực công nghệ cao bao gồm: a) Người Việt Nam, người Việt Nam định cư ở nước ngoài, người nước ngoài có trình độ chuyên môn, kỹ năng cao, có năng lực nghiên cứu và phát triển, làm chủ, chuyển giao hoặc thương mại hóa công nghệ cao, công nghệ chiến lược;'
      trang_pdf: 9
    - dieu: 17
      noi_dung: Điều 17. Ứng dụng công nghệ cao, công nghệ chiến lược trong phát triển kinh tế - xã hội 1. Nhà nước có chính sách khuyến khích, tạo điều kiện để tổ chức, doanh nghiệp, cá nhân ứng dụng công nghệ cao, công nghệ chiến lược trong ngành kinh tế, quôc phòng và an ninh, đặc biệt tại các vùng kinh tế trọng điểm, nông thôn, vùng đồng bào dân tộc thiểu số, biên giới và hải đảo, vùng có điều kiện kinh tế - xã hội khó khăn, đặc biệt khó khăn.
      trang_pdf: 13
    - dieu: 20
      noi_dung: Điều 20. Thúc day phát triển hệ sinh thái công nghệ cao va cơ sở hạ tang kỹ thuật 1. Hệ sinh thái công nghệ cao là tập hợp các chủ thể có tương tác lẫn nhau phục vụ phát triển công nghệ cao, trong đó doanh nghiệp công nghệ cao giữ vai trò trung tâm, các thành phần chính là cơ quan quản lý, tô chức khoa học và công nghệ, cơ sở giáo dục đại học, tô chức hỗ trợ khởi nghiệp và đổi mới sáng tạo, tô chức hỗ trợ, người sử dụng và một số thành phần
      trang_pdf: 15
    - dieu: 23
      noi_dung: 'Điều 23. Đô thị công nghệ cao 1. Đô thị công nghệ cao là đô thị được hình thành và phát triển trên cơ sở hệ sinh thái công nghệ cao, trong đó khu công nghệ cao, các tô chức khoa học và công nghệ giữ vai trò trung tâm. 2. Đô thị công nghệ cao ngoài việc đáp ứng các tiêu chí của đô thị theo quy định của pháp luật còn phải đáp ứng các điêu kiện sau đây: a) Có khu công nghệ cao và tô chức khoa học và công nghệ giữ vai trò trung'
      trang_pdf: 20
    - dieu: 27
      noi_dung: Điều 27. Quy định chuyền tiếp 1. Các loại giấy chứng nhận được cấp theo quy định tại Luật Công nghệ cao số 21/2008/QH12 còn thời hạn sau ngày Luật này có hiệu lực thi hành thì tiếp tục có hiệu lực đến hết thời hạn theo giấy chứng nhận.
      trang_pdf: 27
