xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21130.pdf, id=106014, SHA-256 98cbaed20891f163cbaff4b300338a7641aa3f62ca87f64beb6037ae0f61acb7): Thông báo số 21130/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị trung tâm của hệ thống đo lường và kiểm tra hình ảnh (tên thương mại Vision System Controller, ký mã hiệu XG-X2900; cấu tạo gồm các bảng mạch in PCB gắn bộ vi xử lý song song 14 lõi, cổng kết nối tối đa 4 camera, cổng I/O kỹ thuật số, cổng Ethernet, RS-232C, USB, VGA, khe thẻ nhớ SD trong khung vỏ kim loại; kích thước 141,6 x 145,7 x 168 mm, khối lượng ~1.750 g, điện áp đầu vào 24V DC ± 10% / 5,3 A; cài sẵn phần mềm cố định Firmware để xử lý dữ liệu hình ảnh tốc độ cao, thực hiện kiểm tra 3D trực tiếp, kiểm tra khuyết tật bề mặt, hướng dẫn căn chỉnh robot/máy gia công và đo kiểm kích thước sản phẩm), phân loại vào nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị trung tâm của hệ thống đo lường và kiểm tra hình ảnh công nghiệp (Vision System Controller, ký mã hiệu XG-X2900, vi xử lý 14 lõi cài sẵn Firmware xử lý ảnh thực hiện kiểm tra 3D, phát hiện khuyết tật bề mặt, nhận dạng OCR và đo kích thước sản phẩm) thuộc nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90.'
