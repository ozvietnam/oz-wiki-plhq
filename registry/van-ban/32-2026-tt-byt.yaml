xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn trên CSDL quốc gia vbpl.vn (56 điều và Phụ lục I–V, Thứ trưởng Nguyễn Tri Thức ký): ban hành 29-07-2026, có hiệu lực từ 01-10-2026 (khoản 1 Điều 52); khoản 2 Điều 52 bãi bỏ toàn bộ Thông tư 12/2025/TT-BYT (điểm a), tiết 1 điểm a khoản 1 Điều 16 và tiết 2 điểm c khoản 3 Điều 29 Thông tư 01/2018/TT-BYT (điểm b), khoản 8 và khoản 10 Điều 1 Thông tư 23/2023/TT-BYT (điểm c)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Dược số 105/2016/QH13 được sửa đổi, bổ sung bởi Luật số 44/2024/QH15 (sau đây gọi tắt là Luật Dược), bao gồm: a) Quy định về dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả trong hồ sơ đăng ký thuốc và tiêu chí để xác định trường hợp miễn thử, miễn một số giai đoạn thử thuốc trên lâm sàng tại Việt Nam và thuốc phải yêu cầu thử lâm sàng giai đoạn'
      trang_pdf: 1
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Hồ sơ kỹ thuật chung ASEAN (ACTD) là mẫu hồ sơ kỹ thuật chung về đăng ký thuốc của Hiệp hội các nước Đông Nam Á (ASEAN). 2. Hồ sơ kỹ thuật chung ICH-CTD là mẫu hồ sơ chung của Hội nghị quốc tế về hài hòa các thủ tục đăng ký dược phẩm sử dụng cho người.'
      trang_pdf: 2
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 3
      noi_dung: Điều 3. Trách nhiệm của cơ sở đăng ký thuốc 1. Chịu trách nhiệm toàn diện trước pháp luật về tính chính xác, hợp pháp, trung thực của tất cả các tài liệu trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc, trừ trường hợp quy định tại khoản 1 Điều 4 Thông tư này.
      trang_pdf: 4
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 11
      noi_dung: 'Điều 11. Ngôn ngữ, hình thức trình bày trong hồ sơ, số lượng và hình thức nộp hồ sơ, các trường hợp được nộp chung trong một hồ sơ đăng ký thuốc, nguyên liệu làm thuốc, hình thức thẩm định hồ sơ 1. Ngôn ngữ sử dụng trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc: Hồ sơ đăng ký thuốc, nguyên liệu làm thuốc phải được viết bằng tiếng Việt hoặc tiếng Anh. Riêng tờ hướng dẫn sử dụng thuốc dự kiến lưu hành tại Việt Nam phải được viết bằng tiếng Việt.'
      trang_pdf: 9
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 18
      noi_dung: Điều 18. Yêu cầu về dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả 1. Thuốc đăng ký lưu hành phải có dữ liệu lâm sàng đầy đủ để chứng minh thuốc bảo đảm an toàn, hiệu quả.
      trang_pdf: 15
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 25
      noi_dung: 'Điều 25. Cấu trúc của bộ hồ sơ đăng ký thuốc, nguyên liệu làm thuốc 1. Hồ sơ đăng ký thuốc thực hiện theo hồ sơ kỹ thuật chung ASEAN (ACTD) hoặc hồ sơ kỹ thuật chung ICH-CTD và tuân thủ các quy định tại Thông tư này. 2. Cấu trúc hồ sơ đăng ký thuốc hóa dược, vắc xin, sinh phẩm: a) Hồ sơ đăng ký thuốc hóa dược, vắc xin, sinh phẩm theo hồ sơ kỹ thuật chung ASEAN (ACTD) được bố cục như sau: - Phần I: Hồ sơ hành chính.'
      trang_pdf: 25
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 31
      noi_dung: 'Điều 31. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại khoản 1, 2 và 6 Điều 24 Thông tư này 1. Hồ sơ hành chính: Các tài liệu theo quy định tại Điều 26 Thông tư này. 2. Hồ sơ chất lượng: Các tài liệu theo quy định tại Điều 27 Thông tư này. 3. Hồ sơ tiền lâm sàng: Các tài liệu theo quy định tại khoản 1, 2, 6 và 7 Điều 24 Thông tư này và tuân thủ quy định tại Điều 28 Thông tư này.'
      trang_pdf: 30
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 38
      noi_dung: 'Điều 38. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, thuốc chuyển giao công nghệ là thuốc hóa dược, vắc xin, sinh phẩm 1. Hồ sơ hành chính: a) Các tài liệu hành chính của thuốc gia công, thuốc chuyển giao công nghệ theo quy định tại Điều 26 Thông tư này.'
      trang_pdf: 32
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 45
      noi_dung: 'Điều 45. Thủ tục cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc 1. Hình thức nộp hồ sơ: Cơ sở đăng ký thực hiện nộp hồ sơ theo quy định tại Điều 15 Nghị định số 118/2025/NĐ-CP. 2. Tiếp nhận và thời gian giải quyết hồ sơ: a) Tiếp nhận hồ sơ: Khi nhận đủ hồ sơ, Cục Quản lý Dược cấp cho cơ sở đăng ký thuốc giấy tiếp nhận hồ sơ theo quy định.'
      trang_pdf: 39
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
    - dieu: 53
      noi_dung: Điều 53. Điều khoản chuyển tiếp 1. Hồ sơ đăng ký thuốc, nguyên liệu làm thuốc đã nộp trước ngày Thông tư này có hiệu lực thi hành được tiếp tục thực hiện theo quy định tại thời điểm nộp hồ sơ hoặc áp dụng quy định tại Thông tư này kể từ ngày Thông tư này có hiệu lực thi hành theo hướng thuận tiện, đơn giản hóa thủ tục hành chính cho doanh nghiệp, tổ chức, cá nhân.
      trang_pdf: 51
      sha256_pdf: 3cc49b74f85b61614af1cff2b966467a3636e5e6b159718470f409aeae8e26fa
