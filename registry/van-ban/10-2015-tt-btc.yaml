ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #399). Hướng dẫn Quyết định 54/2014/QĐ-TTg về miễn thuế nhập khẩu linh kiện sản xuất, lắp ráp trang thiết bị y tế ưu tiên; hết hiệu lực từ 15-01-2019 khi Quyết định 54/2014/QĐ-TTg bị bãi bỏ bởi Quyết định 48/2018/QĐ-TTg (chế độ miễn thuế hiện hành thực hiện theo Luật 107/2016/QH13 và Nghị định 134/2016/NĐ-CP).'
