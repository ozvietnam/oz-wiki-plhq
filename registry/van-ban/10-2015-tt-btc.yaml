xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF Công báo số 273+274 ngày 25-02-2015 (congbaocdn.chinhphu.vn, 5 trang, người ký Thứ trưởng Vũ Thị Mai) và CSDLQG vbpl.vn (ID 56478): Điều 1 đến Điều 4 và Phụ lục hướng dẫn miễn thuế nhập khẩu 05 năm đối với linh kiện nhập khẩu để sản xuất, lắp ráp 09 nhóm trang thiết bị y tế ưu tiên theo Quyết định 54/2014/QĐ-TTg; Điều 5 khoản 1 quy định có hiệu lực thi hành kể từ ngày 15-03-2015. Đã đối chiếu tình trạng hiện hành: Quyết định gốc 54/2014/QĐ-TTg bị bãi bỏ toàn bộ từ ngày 15-01-2019 theo Quyết định 48/2018/QĐ-TTg ngày 03-12-2018 của Thủ tướng Chính phủ (chuyển sang áp dụng Luật Thuế XNK 107/2016/QH13 và Nghị định 134/2016/NĐ-CP), nên Thông tư 10/2015/TT-BTC hết hiệu lực toàn bộ từ 15-01-2019.'
