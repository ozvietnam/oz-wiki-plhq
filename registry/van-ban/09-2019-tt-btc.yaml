  pham_vi: 'Đã đọc toàn văn PDF ký số trên datafiles.chinhphu.vn (09-btc.signed.pdf, 7 trang, người ký Thứ trưởng Vũ Thị Mai) và thẻ vanban.chinhphu.vn (docid=196480): Điều 1 và Điều 2 sửa đổi, bổ sung một số nội dung tại Phụ lục I và Phụ lục II của Thông tư 65/2017/TT-BTC ngày 27-06-2017 ban hành Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam; Điều 3 quy định có hiệu lực thi hành kể từ ngày 01-04-2019. Đã đối chiếu Điều 4 khoản 2 Thông tư 31/2022/TT-BTC ngày 08-06-2022 (đã có trong sổ 31-2022-tt-btc.yaml): Thông tư 09/2019/TT-BTC hết hiệu lực toàn bộ kể từ ngày 01-12-2022 do bị Thông tư 31/2022/TT-BTC thay thế.'
