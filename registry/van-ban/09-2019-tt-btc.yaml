ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #398) đồng thời xoá điểm mù THIEU_VAN_BAN mức Cao và WIKI_NHAC_CHUA_DANG_KY mức Vừa (cạnh thay_the đi từ 31-2022-tt-btc.yaml). Sửa đổi Phụ lục I và Phụ lục II Danh mục hàng hóa XNK Việt Nam (AHTN 2017) kèm Thông tư 65/2017/TT-BTC; hết hiệu lực từ 01-12-2022 khi bị Thông tư 31/2022/TT-BTC thay thế.'
