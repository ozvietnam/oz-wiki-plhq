ghi_chu: 'Xác định trước mã số mặt hàng Cuộn cảm đa chức năng dùng cho điện thoại thông minh (ANTENNA COIL-NFC/MST/WPC S938U, ký mã hiệu GH42-07118A; gồm cuộn coil đồng mạ niken trên mạch in mềm FPCB, tấm graphite, tấm nano bọc PET, điện trở nhiệt THM và đầu nối; thực hiện chức năng sạc không dây WPC, truyền dữ liệu từ tính MST và giao tiếp NFC) thuộc nhóm 85.04, phân nhóm 8504.50, mã số 8504.50.10.'
