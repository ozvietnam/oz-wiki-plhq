  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/24/2.VB_17787.pdf, id=104869, SHA-256 d13751f1b7df9cf098a44e37a1368a55eb83b03914bdbab89859a212a68ff598): Thông báo số 17787/TB-CHQ ngày 22-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cuộn cảm đa chức năng (ANTENNA COIL-NFC/MST/WPC S938U, ký mã hiệu GH42-07118A; cấu tạo gồm lớp film bảo vệ Carrier film, tấm graphite tản nhiệt, tấm nano bọc PET Shielding sheet, cuộn coil dạng mạch in mềm core FPCB bằng đồng mạ niken, cuộn coil dạng mạch in mềm NFC FPCB chứa điện trở nhiệt THM và đầu nối connector, cuộn coil SPEN shielding sheet, lớp đệm bảo vệ Sponge; kích thước 137,593 x 58,725 mm, trọng lượng tịnh 3,6 gram; lắp giữa pin và nắp lưng điện thoại thông minh để thực hiện chức năng sạc không dây WPC, truyền dữ liệu bảo mật từ tính MST và kết nối không dây tầm ngắn NFC), phân loại vào nhóm 85.04, phân nhóm 8504.50, mã số 8504.50.10; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
