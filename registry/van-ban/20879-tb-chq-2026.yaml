ghi_chu: 'Xác định trước mã số mặt hàng thuốc viên nang mềm Sinupan Forte 200mg (hoạt chất chính Cineol 200mg từ tinh dầu khuynh diệp, đóng gói hộp 1 vỉ x 21 viên hoặc hộp 2 vỉ x 25 viên nang mềm, dùng đường uống điều trị triệu chứng cảm lạnh thông thường, viêm phế quản, viêm xoang và các bệnh viêm đường hô hấp mạn tính khác) thuộc nhóm 30.04, phân nhóm 3004.90, mã số 3004.90.59.'
