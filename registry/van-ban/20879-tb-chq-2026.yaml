  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_20879.pdf, id=106005, SHA-256 027d465d00c42d5dca0291a837cf7777c91104b3ec66340b31976cac71c26dbb): Thông báo số 20879/TB-CHQ ngày 24-08-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 20879/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng thuốc viên nang mềm Sinupan Forte 200mg (thành phần chính Cineol 200mg phân lập từ tinh dầu khuynh diệp; tá dược gồm các triglycerid chuỗi trung bình, gelatin, glycerol 85%, dung dịch sorbitol 70% không kết tinh E420, acid methacrylic - ethylacrylat copolymer 1:1 dispersion 30%, propylen glycol, Polysorbat 80, glycerol monostearat 40-55, phospholipid E322; đóng gói hộp 1 vỉ x 21 viên hoặc hộp 2 vỉ x 25 viên nang mềm; nhà sản xuất bán thành phẩm Catalent Germany Eberbach GmbH - Đức, cơ sở đóng gói Klocke Verpackungs-Service GmbH; công dụng điều trị các triệu chứng của cảm lạnh thông thường, viêm phế quản, viêm xoang và các bệnh viêm đường hô hấp mạn tính khác), phân loại vào nhóm 30.04, phân nhóm 3004.90, mã số 3004.90.59; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
