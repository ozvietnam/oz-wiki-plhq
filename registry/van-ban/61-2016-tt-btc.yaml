      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định chỉ tiết việc thu, nộp lợi nhuận sau thuế còn lại sau khi trích lập các quỹ đôi với công ty mẹ của các Tập đoàn kinh tế nhà nước, công ty mẹ của các Tông công ty nhà nước, công ty mẹ trong nhóm công ty mẹ - công ty con, công ty trách nhiệm hữu hạn một thành viên độc lập do Nhà nước nắm giữ 100% von điều lệ;
      trang_pdf: 2
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dung 1. Doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ, bao gồm: a) Công ty trách nhiệm hữu hạn một thành viên là công ty mẹ của các tập đoàn kinh tê nhà nước; b) Công ty trách nhiệm hữu hạn một thành viên là công ty mẹ của téng công ty nha nước (gom cả Tong công ty dau tư và kinh doanh vốn nhà nước - gọi tắt là SCIC); , c) Công ty trách nhiệm hữu hạn một thành viên là công ty me trong nhóm công ty mẹ - công ty con;'
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Xác định lợi nhuận sau thuế còn lại sau khi trích lập các quỹ nộp ngân sách nhà nước 1. Lợi nhuận sau thuế còn lại sau khi trích lập các quỹ nộp ngân sách nhà nước của doanh nghiệp quy định tại Khoản 1 Điều 2 Chương I Thông tư này là lợi nhuận được xác định theo quy định của pháp luật ve kế toán (đã được trừ đi các khoản chỉ không được trừ khi xác định thuế thu nhập doanh nghiệp nhưng phù hợp với quy định của pháp luật về kế toán) sau
      trang_pdf: 3
    - dieu: 5
      noi_dung: 'Điều 5. Khai, nộp ngân sách nhà nước đối với lợi nhuận sau thuế còn lại sau khi trích lập các quỹ 1. Khai, nộp lợi nhuận sau thuế còn lại sau khi trích lập các quỹ:'
      trang_pdf: 5
    - dieu: 6
      noi_dung: Điều 6. Phân chia ngân sách nhà nước a) Lợi nhuận sau thuế còn lại sau khi trích lập các quỹ nộp ngân sách nhà nước quy định tại Điều này của doanh nghiệp. Trung ương được phân chia 100% cho ngân sách Trung ương. Doanh nghiệp thực hiện nộp vào tài khoản thu ngân sách nhà nước mở tại Sở giao dịch kho bạc nhà nước Trung ương.
      trang_pdf: 6
    - dieu: 7
      noi_dung: Điều 7. Xứ lý vi phạm đối với hành vi chậm nộp hồ sơ khai lợi nhuận sau thuế còn lại sau khi trích lập các quỹ và chậm nộp lợi nhuận sau thuế còn lại sau khi trích lập các quỹ vào ngân sách nhà nước 1. Doanh nghiệp chậm nộp hồ sơ khai lợi nhuận sau thuế còn lại sau khi trích lập các quỹ so với thời hạn quy định tại Điều 5 Chương II Thông tư này thì bị xử phạt về hành vi chậm nộp hé sơ khai thuế theo quy định tại Luật Quản lý thuế.
      trang_pdf: 6
    - dieu: 9
      noi_dung: 'Điều 9. Khai, nộp ngân sách nhà nước đối với cỗ tức, lợi nhuận được chia 1. Khai, nộp cỗ tức, lợi nhuận được chia: Doanh nghiệp quy định tại Điều 8 Thông tư này thực hiện khai số cỗ tức, lợi nhuận được chia cho phần vốn nhà nước theo mẫu Tờ khai số 01/CTLNDC ban hành kèm theo Thông tư này và thực hiện nộp ngân sách nhà nước trong thời hạn 45 ngày kể từ ngày có thông báo chia cổ tức, lợi nhuận của công ty cé phần, công ty trách nhiệm hữu hạn hai'
      trang_pdf: 9
    - dieu: 10
      noi_dung: Điều 10. Phân chia ngân sách nhà nước a) Cổ tức, lợi nhuận được chia cho phần vốn nhà nước của công ty cô phan, công ty trách nhiệm hữu han hai thành viên trở lên có vốn góp của Nha nước do bộ, ngành đại diện chủ sở hữu được phân chia 100% cho ngân sách Trung ương. Doanh nghiệp thực hiện nộp vào tai khoản thu ngân sách nhà nước mở tại Sở giao địch kho bạc nhà nước Trung ương.
      trang_pdf: 9
    - dieu: 12
      noi_dung: 'Điều 12. Hiệu lực thi hành Thông tư này có hiệu lực thi hành kê từ ngày #6 / 5 /2016 và áp dụng cho niên độ từ năm 2016.'
      trang_pdf: 10
    - dieu: 13
      noi_dung: Điều 13. Trách nhiệm thi hành 1. Các bộ, ngành, ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương trong phạm vi thâm quyền theo quy định của pháp luật có trách nhiệm chỉ đạo người đại điện phần vốn nhà nước đầu tư tại các doanh nghiệp theo ủy quyền thực hiện kiểm tra, đôn đốc doanh nghiệp khai, nộp các khoản thu ngân sách nha nước theo quy định tại Thông tư này.
      trang_pdf: 10
