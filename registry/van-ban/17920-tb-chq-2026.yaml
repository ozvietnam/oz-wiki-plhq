ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Thông báo thông tin tên gọi cơ quan hải quan, mã cơ quan hải quan (mã cũ, mã mới), mã cơ quan thu, tài khoản chuyên thu/tạm thu/tạm giữ và KBNN nơi mở tài khoản: Phụ lục I gồm 32 đơn vị thống nhất 1 mã Hải quan từ 01-07-2026 (HQ Hòa Lạc 01M1, HQ CK sân bay quốc tế Nội Bài 01B1, HQ KCX Linh Trung 02F1, HQ KCX Tân Thuận 02PJ, HQ CK cảng Sài Gòn KV 3 02H1, HQ CK cảng Phú Mỹ 51C1, HQ KCN Mỹ Phước 43K1, HQ KCN Việt Hương 43NG, HQ KCX và KCN Hải Phòng 03PA, HQ Thái Nguyên 18B1, HQ CK ga đường sắt quốc tế Lào Cai 13G1, HQ CK quốc tế Tây Trang 12B1, HQ CK quốc tế Ma Lù Thàng 12H1, HQ CK cảng Chân Mây 33CF, HQ Sơn La 27BI, HQ CK quốc tế Na Mèo 27B1, HQ CK quốc tế Cầu Treo 30BB, HQ CK cảng Vũng Áng 30F1, HQ KCN Đà Nẵng 34NG, HQ KCN Quảng Nam 60C1, HQ CK quốc tế Lệ Thanh 38B1, HQ CK Tà Lùng 11B1, Đội nghiệp vụ HQ CK Lý Vạn 11G2, HQ CK Săm Pun 10BF, HQ CK quốc tế Mộc Bài 45B1, HQ CK quốc tế Xa Mát 45C1, HQ KCN Trảng Bàng 45F1, HQ CK cảng Đồng Nai 47D3, HQ CK quốc tế Thường Phước 49BB, HQ CK quốc tế Dinh Bà 49BG, HQ CK Cảng Đồng Tháp 49C2, HQ CK quốc tế Hà Tiên 53BC); Phụ lục II gồm 12 đơn vị thay đổi mã Hải quan nhưng giữ nguyên mã KBNN (HQ Thái Bình 03CD→28CD, HQ Hưng Yên 03PL→28PL, HQ Bắc Kạn 11PK→18PK, HQ Yên Bái 01BT→13BT, HQ Sơn La 12F1→27BI, HQ CK quốc tế Lóng Sập 12BE→27BE, HQ CK quốc tế Bờ Y 38BC/38PD→34PD, HQ CK Buprăng 40B1→41B1, HQ Đà Lạt 40D1→41D1, HQ CK cảng Bình Thuận 47NM→41NM, HQ Bến Tre 48BG→54BG, HQ CK cảng Mỹ Tho 48CG→49CG). Các QĐ 382/QĐ-BTC/2025, 681/QĐ-CHQ/2026, 838/QĐ-CHQ/2026 chưa có trong sổ nên chưa gắn quan_he.can_cu (tránh điểm mù Cao).'
