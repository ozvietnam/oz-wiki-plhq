  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/DONG_NAI/2026/6/25/17920_TB_CHQ_25_04_2026.pdf, id=104878, SHA-256 9d9e74f904b8134f80e9e602717b81a5333ebf57455e70cf70846c9648b0219c): Thông báo số 17920/TB-CHQ ngày 25-06-2026 (ký số 25-06-2026 10:55:00 +07:00) của Cục Hải quan về thông tin tài khoản thu NSNN; căn cứ QĐ 382/QĐ-BTC (26-02-2025), QĐ 681/QĐ-CHQ (04-05-2026), QĐ 838/QĐ-CHQ (22-05-2026); thông báo tên gọi, mã cơ quan hải quan, tài khoản chuyên thu/tạm thu/tạm giữ, KBNN nơi mở tài khoản kèm 02 Phụ lục: Phụ lục I (32 đơn vị Hải quan thuộc các Chi cục HQKV I, II, III, V, VII, IX, X, XI, XII, XIV, XVI, XVII, XVIII, XX thống nhất 1 mã Hải quan từ 01-07-2026, không thay đổi mã Hải quan và mã KBNN), Phụ lục II (12 đơn vị Hải quan thuộc các Chi cục HQKV IV, V, VII, X, XII, XIII, XIX, XX thay đổi mã Hải quan, mã KBNN không thay đổi); người ký Bùi Tuấn Hải; áp dụng từ ngày 01-07-2026'
