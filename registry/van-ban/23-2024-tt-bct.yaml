xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu PDF ký số Chính phủ 87 trang đã OCR (SHA-256 6f3d588713d225036c8df673ba0ad97f7f8a29e889768c1e90ec6186a3dfdde4): ban hành 07-11-2024, hiệu lực từ 01-01-2025; khoản 4 Điều 37 Thông tư 38/2025/TT-BCT đã bãi bỏ điểm đ khoản 2 Điều 4 và khoản 3 Điều 18 từ ngày 01-07-2025.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-25'
  boi: antigravity@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết một số điều của Luật Quản lý, sử dụng vũ khí, vật liệu nỗ và công cụ hỗ trợ về quản lý, sử dụng vật liệu nô công nghiệp, tiền chất thuốc nỗ thuộc thẩm quyền quản lý của Bộ Công Thương, bao gồm: Danh mục vật liệu nỗ công nghiệp, Danh mục tiền chất thuốc no được phép sản xuất, kinh doanh và sử dụng ở Việt Nam;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với co quan, tổ chức, doanh nghiệp, cá nhân liên quan đến quản lý, sử dụng vật liệu nỗ công nghiệp, tiền chất thuốc nỗ ở Việt Nam.
      trang_pdf: 2
    - dieu: 3
      noi_dung: 'Điều 3. Danh mục vật liệu nỗ công nghiệp và Danh mục tiền chất thuốc nỗ được phép sản xuất, kinh doanh, sử dụng ở Việt Nam 1. Danh mục vật liệu nỗ công nghiệp được phép sản xuất, kinh doanh, sử dụng ở Việt Nam (sau đây viết tắt là Danh mục vật liệu nỗ công nghiệp), bao gồm: -a) Thuốc nỗ công nghiệp, phụ kiện nổ công nghiệp, thuốc nỗ mạnh quy định tại Phụ lục J ban hành kèm theo Thông tư này;'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Hồ sơ, thủ tục đăng ký mới, đăng ký bo sung để nghiên cứu, phát triển, thử nghiệm sản phẩm vật liệu nỗ - 1. Hồ sơ, thủ tục đăng ký mới, đăng ký bé sung dé nghiên cứu, phát triển, thử nghiệm sản phẩm vật liệu nô sử dụng ngân sách nhà nước thực hiện theo pO oy
      trang_pdf: 3
    - dieu: 8
      noi_dung: Điều 8. Nguyên tắc xây dựng, cập nhật, quan lý và khai thác Cơ sở dữ liệu về vật liệu nỗ công nghiệp, tiền chất thuốc nỗ 1. Cơ sở dữ liệu về vật liệu nỗ công nghiệp, tiền chất thuốc nỗ (sau day viết tat là Cơ sở dit liệu) do Bộ Công Thương xây dựng, quan lý. 2. Việc cập nhật Cơ sở dữ liệu phải được thực hiện thường xuyên, liên tục, kịp thời và hiệu quả.
      trang_pdf: 6
    - dieu: 10
      noi_dung: Điều 10. Nội dung quản lý Cơ sở dữ liệu 1. Xây dựng quy trình nghiệp vụ thực hiện việc quản lý, cập nhật, khai thác Cơ sở dữ liệu. 2. Quản lý, lưu trữ Cơ sở dữ liệu bảo đảm an toàn về thông tin, dữ liệu trên đường truyền. 3. Phân quyền và quản lý tài khoản đăng nhập vào Cơ sở dữ liệu thuộc phạm vi quan lý. 4. Tổ chức tập huấn nghiệp vụ cho cán bộ, công chức, viên chức thực hiện việc quản lý, cập nhật, khai thác Cơ sở đữ liệu.
      trang_pdf: 7
    - dieu: 13
      noi_dung: 'Điều 13. Kinh phí xây dựng, duy trì và phát triển Cơ sở dữ liệu 1. Kinh phí xây dựng, duy trì và phát triển Cơ sở dữ liệu được bảo đảm bang ngân sách nhà nước hoặc huy động từ các nguôn kinh phí khác. 2. Kinh phí xây dựng, duy trì và phát triển Cơ sở dữ liệu bao gồm: a) Kinh phí để thực hiện các nội dung quy định tại khoản 2 Điều 9, Điều 10, Điều 11 và Điều 12 của Thông tư này; b) Thu thập, xử lý, cập nhật, tích hợp thông tin vào Cơ sở dữ liệu;'
      trang_pdf: 8
    - dieu: 15
      noi_dung: 'Điều 15. Phương án, hộ chiếu nỗ min 1. Tổ: chức, doanh nghiệp sử dụng vật liệu nỗ công nghiệp phải lập Phương án nỗ mìn theo nội dung quy định tại Phụ luc VII ban hành kèm theo Thông tư này và được người quản lý của tô chức, doanh nghiệp phê duyệt.'
      trang_pdf: 9
    - dieu: 17
      noi_dung: Điều 17. Báo cáo định kỳ, đột xuất 1. Báo cáo định kỳ trong hoạt động sản xuất, kinh doanh, sử dụng vật liệu nỗ công nghiệp a) Tổ chức, doanh nghiệp sản xuất, kinh doanh vật liệu nỗ công nghiệp báo cáo Cục Kỹ thuật an toàn và Môi trường công nghiệp theo quy định tại Mẫu số 01 Phụ lục X ban hành kèm theo Thông tư này trước ngày 20 tháng 6 đối với báo cáo sáu tháng, trước ngày 20 tháng 12 đối với báo cáo năm;
      trang_pdf: 10
    - dieu: 20
      noi_dung: Điều 20. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2025. 2. Bãi bỏ Thông tư số 13/2018/TT-BCT ngày 15 tháng 6 năm 2018 của Bộ trưởng Bộ Công Thương quy định về quản lý, sử dụng vật liệu nỗ công nghiệp, tiền chất thuốc nỗ sử dụng để sản xuất vật liệu nỗ công nghiệp;
      trang_pdf: 13
ghi_chu: Quy định quản lý vật liệu nổ công nghiệp, tiền chất thuốc nổ (đã bị bãi bỏ một phần tại TT 38/2025/TT-BCT từ 01-07-2025).
