  pham_vi: 'PDF ký số datafiles.chinhphu.vn (ảnh quét, 7 trang): Điều 6 hiệu lực từ 02-09-2026 (viết tay); Điều 5 khoản 2 chuyển tiếp 24 tháng cho sản phẩm đã được cấp phép lưu thông; chưa đăng Công báo (dò ID 469850–470720 ngày 05-10-2026)'
