  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/7/9/VB_12394.pdf, id=100635, SHA-256 c5e2af449e8b3cb57d014558a031ca82d179ced15182bb746ddb756bcdecf408): Thông báo số 12394/TB-CHQ ngày 04-07-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Vỏ khuôn dùng cho máy ép nhựa (tên thương mại Mold base, ký, mã hiệu MDC DA 2530 40 40 70 SVMNOH210; cấu tạo bằng thép hợp kim gồm 9 tấm có gắn linh kiện, chia thành phần khuôn tĩnh cố định và phần khuôn di động được gia công phay, mài, khoan CNC tạo lỗ và hốc pocket từ tấm thép thô; kích thước 300 x 250 x 270 mm, trọng lượng 153 kg; dùng để kết hợp với lõi khuôn tạo hình sản phẩm trên máy ép nhựa phục vụ sản xuất chi tiết đồ gia dụng, linh kiện nhựa ngành ô tô, y tế, điện tử), phân loại vào nhóm 84.80, mã số 8480.20.00; có hiệu lực từ ngày ký'
