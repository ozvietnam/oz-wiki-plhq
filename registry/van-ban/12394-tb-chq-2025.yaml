ghi_chu: 'Xác định trước mã số mặt hàng Vỏ khuôn (đế khuôn - Mold base) bằng thép hợp kim dùng cho máy ép nhựa (ký, mã hiệu MDC DA 2530 40 40 70 SVMNOH210; cấu tạo gồm 9 tấm chia thành phần khuôn tĩnh và phần khuôn di động, kích thước 300 x 250 x 270 mm, trọng lượng 153 kg; dùng kết hợp với lõi khuôn trên máy ép nhựa để sản xuất chi tiết nhựa đồ gia dụng, ô tô, y tế, điện tử) thuộc nhóm 84.80, mã số 8480.20.00.'
