  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định quản lý nhà nước về hải quan đối với hàng hoá được -xuat khâu, nhập khâu, quá cảnh, phương tiện vận tải xuât cảnh, nhập cảnh, quá cảnh của tô chức, cá nhân trong nước và nước ngoài trong lãnh thô hải quan; về tô chức và hoạt động của Hải quan.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Tổ chức, cá nhân thực hiện xuất khâu, nhập khâu, quá cảnh hàng hoá, xuât cảnh, nhập cảnh, quá cảnh phương tiện vận tải. 2. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hoạt động xuất khâu, nhập khâu, quá cảnh hàng hóa, xuât cảnh, nhập cảnh, quá cảnh phương tiện vận tải. 3. Cơ quan hải quan, công chức hải quan. 4. Cơ quan khác của Nhà nước trong việc phối hợp quản lý nhà nước về hải quan.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Chính sách về hải quan 1.Nhà nước Việt Nam tạo điều kiện thuận lợi về hải quan đối với hoạt động xuât khâu, nhập khâu, xuất cảnh, nhập cảnh, quá cảnh lãnh thô Việt Nam. 2.Xây dựng Hải quan Việt Nam trong sạch, vững mạnh, chuyên nghiệp, hiện đại, hoạt động minh bạch, hiệu lực, hiệu quả.
      trang_pdf: 1
    - dieu: 19
      noi_dung: Điều 19. Nhiệm vụ và quyền hạn của công chức hải quan 1. Nghiêm chỉnh chấp hành pháp luật, quy trình nghiệp vụ hải quan và chịu trách nhiệm về việc thực hiện nhiệm vụ, quyền hạn của mình. 2. Hướng dẫn người khai hải quan, tổ chức, cá nhân có liên quan khi có yêu câu.
      trang_pdf: 10
    - dieu: 32
      noi_dung: Điều 32. Kiểm tra hồ sơ hải quan Khi kiểm tra hồ sơ hải quan, cơ quan hải quan kiểm tra tính chính xác, đầy đủ, sự phù hợp của nội dung khai hải quan với chứng từ thuộc hồ sơ hải quan, kiểm tra việc tuân thủ chính sách quản lý hàng hóa, chính sách thuế đối với hàng hóa xuất khâu, nhập khẩu và quy định khác của pháp luật có liên quan.
      trang_pdf: 18
    - dieu: 46
      noi_dung: 'Điều 46. Kiểm tra, giám sát hai quan đối với hàng hóa kinh doanh tạm nhập, tái xuất 1. Thủ tục hải quan tạm nhập và thủ tục hải quan tái xuất được thực hiện tại Chi cục Hải quan cửa khâu. 2. Kiểm tra, giám sát hải quan đối với hàng hóa kinh doanh tạm nhập, tái xuất được quy định như sau: a) Hang hóa kinh doanh tạm nhập, tái xuất phải được lưu giữ tại khu vực cửa khẩu hoặc các địa điểm chịu sự kiểm tra, giám sát hai quan; ~“ cD boa o pany'
      trang_pdf: 24
    - dieu: 60
      noi_dung: Điều 60. Trách nhiệm của tổ chức, cá nhân gia công; sản xuất hàng hóa xuất khẩu 1. Thông báo cơ sở gia công, sản xuất hàng hóa xuất khẩu với cơ quan hải quan. 2. Sử dụng nguyên liệu, vật tư nhập khẩu vào mục đích gia công, sản xuất hàng hóa xuat khâu. Trường hợp thay đổi mục đích sử dụng thì phải làm thủ tục hải quan theo quy định của Luật này.
      trang_pdf: 31
    - dieu: 74
      noi_dung: Điều 74. Thủ tục đề nghị kiểm tra, giám sát, tạm dừng làm thủ tục hải quan 1. Chủ thể quyền sở hữu trí tuệ trực tiếp hoặc thông qua người được uy quyền hợp pháp nộp đơn đề nghị cơ quan hải quan kiểm tra, giám sát, tạm dừng 174
      trang_pdf: 37
    - dieu: 88
      noi_dung: Điều 88. Phạm vi trách nhiệm phòng, chống buôn lậu, vận chuyển trái phép hàng hoá qua biên giới 1. Trong phạm vi địa bàn hoạt động hải quan, cơ quan hải quan chịu trách nhiệm kiểm tra, giám sát, kiểm soát hải quan đối với hàng hoá, phương 018“
      trang_pdf: 45
    - dieu: 103
      noi_dung: Điều 103. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2015. Luật hải quan số 29/2001/QH10 và Luật số 42/2005/QH11 sửa đổi,- bỗ sung một số điều của Luật hải quan hết hiệu lực ké từ ngày Luật này có hiệu lực.
      trang_pdf: 54
ghi_chu: Thẻ cổng Chính phủ khớp Luật Hải quan, người ký Nguyễn Sinh Hùng. Đã lưu PDF ký số datafiles (54 trang, mỗi trang một ảnh, không có lớp chữ) — chưa đọc được điều khoản từ tệp; cần OCR. Chưa đối chiếu luật sửa đổi sau 2014.
