      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định về việc in, phát hành, quản lý, sử dụng tem điện tử rượu và tem điện tử thuốc lá.
      trang_pdf: 2
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Tổ chức, doanh nghiệp, cá nhân sản xuất, nhập khẩu những sản phẩm chịu thuế tiêu thụ đặc biệt (rượu, sản phẩm thuốc lá) thuộc đối tượng sử dụng tem theo quy định của pháp luật. 2. Cơ quan thuế, cơ quan hải quan. Chương II QUY ĐỊNH CỤ THỂ
      trang_pdf: 2
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 3
      noi_dung: Điều 3. Mẫu tem và quy định về dán tem điện tử 1. Tem điện tử là tem có dấu hiệu nhận biết bằng mắt thường và có chứa các thông tin, dữ liệu điện tử được tra cứu trên Cổng thông tin điện tử của Tổng cục Thuế, Tổng cục Hải quan để phục vụ công tác quản lý của doanh nghiệp, người tiêu dùng và cơ quan quản lý nhà nước.
      trang_pdf: 2
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 4
      noi_dung: Điều 4. Nguyên tắc quản lý, sử dụng tem điện tử 1. Nguyên tắc quản lý a) Tổng cục Hải quan thực hiện in, phát hành tem điện tử thuốc lá nhập khẩu, tem điện tử rượu nhập khẩu và thực hiện bán tem điện tử thuốc lá nhập khẩu, tem điện tử rượu nhập khẩu cho các doanh nghiệp, tổ chức được phép nhập khẩu sản phẩm thuốc lá, sản phẩm rượu hoặc được mua hàng tịch thu, bán đấu giá của cơ quan có thẩm quyền theo quy định.
      trang_pdf: 4
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 5
      noi_dung: Điều 5. Quản lý, mua bán tem điện tử thuốc lá nhập khẩu, tem điện tử rượu nhập khẩu 1. Lập kế hoạch a) Doanh nghiệp, tổ chức nhập khẩu sản phẩm rượu, sản phẩm thuốc lá chịu trách nhiệm lập, đăng ký kế hoạch sử dụng tem điện tử trên Hệ thống xử lý dữ liệu điện tử hải quan trước ngày 30 tháng 4 của năm liền trước năm kế hoạch phù hợp với nhu cầu sử dụng tem điện tử của doanh nghiệp, tổ chức.
      trang_pdf: 5
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 6
      noi_dung: Điều 6. Quản lý tem điện tử thuốc lá, tem điện tử rượu sản xuất để tiêu thụ trong nước 1. Trách nhiệm của cơ quan thuế các cấp trong quản lý Thông báo phát hành và cấp, bán tem điện tử thuốc lá, tem điện tử rượu sản xuất để tiêu thụ trong nước
      trang_pdf: 10
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 7
      noi_dung: Điều 7. Kinh phí in tem Cơ quan hải quan thực hiện bán tem thuốc lá, rượu nhập khẩu cho các doanh nghiệp nhập khẩu sản phẩm thuốc lá, rượu. Cơ quan thuế thực hiện bán tem thuốc lá, rượu sản xuất để tiêu thụ trong nước cho các tổ chức, cá nhân có Giấy phép sản xuất sản phẩm thuốc lá, rượu (bao gồm Giấy phép sản xuất rượu thủ công nhằm mục đích kinh doanh, Giấy phép sản xuất rượu công nghiệp).
      trang_pdf: 20
      sha256_pdf: 967fd653b972b3f30e5679d2efe0aff53418ad2960bfc66fd13525b3ea66ab1d
    - dieu: 8
      noi_dung: Điều 8. Xử lý vi phạm Doanh nghiệp nhập khẩu rượu, tổ chức, cá nhân sản xuất rượu trong nước, doanh nghiệp nhập khẩu sản phẩm thuốc lá, tổ chức sản xuất sản phẩm thuốc lá trong nước làm mất, cháy, hỏng tem và không thực hiện đúng các quy định về báo cáo, hủy tem, quyết toán tem với cơ quan thuế, cơ quan hải quan bị xử phạt theo mức quy định tại Nghị định số 109/2013/NĐ-CP ngày 24/9/2013 của Chính phủ quy định về xử phạt vi phạm hành chính trong
