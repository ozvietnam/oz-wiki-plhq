      noi_dung: 'Điều 9. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 15 tháng 5 năm 2021. 2. Từ ngày Thông tư này có hiệu lực thi hành đến ngày 30 tháng 6 năm 2022, các văn bản của Bộ Tài chính ban hành sau đây vẫn có hiệu lực thi hành: a) Thông tư số 15/2020/TT-BTC ngày 23/3/2020 của Bộ Tài chính hướng dẫn việc in, phát hành, quản lý và sử dụng tem đối với rượu sản xuất để tiêu thụ trong nước và rượu nhập khẩu;'
