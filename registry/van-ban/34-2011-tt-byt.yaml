xac_minh:
  muc: NGUON_B
  pham_vi: 'Đã kiểm chứng trực tiếp toàn văn trên Thư viện Pháp luật: tên, cơ quan (Bộ Y tế, Bộ trưởng Nguyễn Thị Kim Tiến ký), ngày ban hành 30/8/2011, hiệu lực 01/03/2012; ban hành 3 QCVN: 12-1:2011/BYT (bao bì, dụng cụ bằng nhựa tổng hợp), 12-2:2011/BYT (cao su), 12-3:2011/BYT (kim loại). QCVN 12-1:2011/BYT đã bị thay thế bởi QCVN 12-1:2018/BYT ban hành kèm TT 34/2018/TT-BYT (theo kết quả tìm kiếm có dẫn nguồn); keyword trang TVPL cho thấy tồn tại QCVN 12-3:2024/BYT (kim loại). NHƯNG: chưa đọc trực tiếp được nhãn tình trạng chính thức của TT 34/2011 trên vbpl.vn/TVPL — ghi CON_HIEU_LUC theo tổng hợp kết quả tìm kiếm (rất có thể thực tế là hết hiệu lực một phần do các QCVN bị thay thế), người sửa PR cần đối chiếu lại nhãn "Hết hiệu lực một phần?" trước khi nhập.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. LƯU Ý TRÙNG SỐ: đây KHÔNG phải định mức thiết bị y tế hay mỹ phẩm — là QCVN an toàn vệ sinh bao bì, dụng cụ tiếp xúc trực tiếp thực phẩm (nhựa/cao su/kim loại); hàng bao bì thực phẩm nhập khẩu phải công bố hợp quy theo QCVN này khi thông quan và lưu thông.'
