xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu CSDL quốc gia vbpl.vn (ItemID=50295) và toàn văn 34.2011.TT-BYT.doc (Thứ trưởng Trịnh Quân Huấn ký thay Bộ trưởng): ban hành 30-08-2011, có hiệu lực từ 01-03-2012 theo Điều 2; ban hành kèm theo 03 quy chuẩn kỹ thuật quốc gia về an toàn vệ sinh đối với bao bì, dụng cụ tiếp xúc trực tiếp với thực phẩm gồm QCVN 12-1:2011/BYT (bằng nhựa tổng hợp), QCVN 12-2:2011/BYT (bằng cao su) và QCVN 12-3:2011/BYT (bằng kim loại) theo Điều 1. Trên vbpl.vn ghi nhận trạng thái Còn hiệu lực (không có văn bản bãi bỏ hay thay thế; lưu ý TT 34/2018/TT-BYT là thông tư về hoạt động tiêm chủng, không phải thay thế QCVN 12-1:2011/BYT).'
