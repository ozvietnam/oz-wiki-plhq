xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu Công báo Chính phủ (id=30090, Công báo số 943+944 năm 2019, Thứ trưởng Bộ Tài chính Vũ Thị Mai ký) và CSDL quốc gia vbpl.vn (ItemID=139953, Điều 12): số hiệu 80/2019/TT-BTC, tiêu đề chính thức ''Hướng dẫn thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xuất khẩu, nhập khẩu theo Nghị định số 14/2018/NĐ-CP ngày 23 tháng 01 năm 2018 của Chính phủ quy định chi tiết về hoạt động thương mại biên giới'', ban hành ngày 15-11-2019, có hiệu lực thi hành từ ngày 01-01-2020 (khoản 1 Điều 12, bãi bỏ Thông tư 217/2015/TT-BTC); đang còn hiệu lực (sắp được sửa đổi, bổ sung một số điều bởi Thông tư 154/2026/TT-BTC ngày 15-10-2026 có hiệu lực từ 01-01-2027)'
