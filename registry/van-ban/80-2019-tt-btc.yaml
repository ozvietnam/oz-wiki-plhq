  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này hướng dẫn về thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xuất khẩu, nhập khẩu của thương nhân; thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xuất khẩu, nhập khẩu của cư dân biên giới; trách nhiệm quản lý nhà nước của cơ quan Hải quan trong hoạt động thương mại biên giới.
      trang_pdf: 2
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Thương nhân, tổ chức, cá nhân tham gia hoạt động thương mại biên giới;
      trang_pdf: 2
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 3
      noi_dung: Điều 3. Thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xuất khẩu, nhập khẩu của thương nhân 1. Thủ tục hải quan đối với hàng hóa xuất khẩu, nhập khẩu của thương nhân qua cửa khẩu biên giới thực hiện theo quy định tại Nghị định số 08/2015/NĐ-CP ngày 21/01/2015 được sửa đổi, bổ sung tại Nghị định số 59/2018/NĐ-CP ngày 20/4/2018 của Chính phủ và hướng dẫn tại Thông tư số 38/2015/TT-BTC ngày 25/3/2015 được sửa đổi, bổ sung tại Thông
      trang_pdf: 3
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 4
      noi_dung: Điều 4. Thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa nhập khẩu thương nhân mua gom của cư dân biên giới 1. Thương nhân khi thực hiện mua gom hàng hóa của cư dân biên giới tại khu vực chợ biên giới theo quy định tại khoản 1 và khoản 2 Điều 14 Nghị định
      trang_pdf: 3
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 5
      noi_dung: Điều 5. Kiểm tra, giám sát hải quan đối với hàng hóa xuất khẩu, nhập khẩu của thương nhân, hàng hóa nhập khẩu thương nhân mua gom của cư dân biên giới Việc kiểm tra, giám sát hải quan đối với hàng hóa xuất khẩu, nhập khẩu của thương nhân, hàng hóa nhập khẩu thương nhân mua gom của cư dân biên giới thực
      trang_pdf: 4
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 6
      noi_dung: Điều 6. Thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xuất khẩu, nhập khẩu của cư dân biên giới 1. Hoạt động mua bán, trao đổi hàng hóa của cư dân biên giới qua các cửa khẩu, lối mở biên giới là hoạt động xuất khẩu, nhập khẩu theo quy định của pháp luật.
      trang_pdf: 5
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 7
      noi_dung: Điều 7. Kiểm tra, giám sát hải quan đối với hàng hóa xuất khẩu, nhập khẩu của cư dân biên giới 1. Hàng hóa nhập khẩu của cư dân biên giới vượt định mức miễn thuế theo quy định tại Điều 13 Nghị định số 14/2018/NĐ-CP ngày 23/01/2018 của Chính phủ khi làm thủ tục hải quan phải kiểm tra thực tế hàng hóa.
      trang_pdf: 6
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 8
      noi_dung: Điều 8. Quản lý nhà nước của cơ quan Hải quan trong hoạt động thương mại biên giới Tổng cục Hải quan phối hợp với các đơn vị thuộc Bộ Công Thương, Bộ Quốc phòng, Bộ Nông nghiệp và Phát triển nông thôn và các đơn vị liên quan tổ chức triển khai hướng dẫn, quản lý hoạt động thương mại biên giới đảm bảo đúng quy định của pháp luật.
      trang_pdf: 7
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 9
      noi_dung: Điều 9. Trách nhiệm của cơ quan Hải quan trong quản lý hoạt động mua bán, trao đổi hàng hóa của cư dân biên giới 1. Tổng cục Hải quan có trách nhiệm xây dựng phần mềm quản lý, in, tiếp nhận đăng ký tờ khai hàng xuất khẩu, nhập khẩu của cư dân biên giới và phần mềm quản lý, tính thuế đối với tờ khai hàng nhập khẩu, hàng xuất khẩu cư dân biên giới đáp ứng quản lý hàng hóa nhập khẩu miễn thuế quy định tại Điều 13 Nghị định số 14/2018/NĐ-CP ngày
      trang_pdf: 7
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm quản lý phương tiện vận tải của cá nhân, tổ chức qua lại khu vực biên giới 1. Chi cục Hải quan cửa khẩu thực hiện quản lý, kiểm tra, giám sát hải quan đối với phương tiện vận tải của cá nhân, tổ chức qua lại khu vực biên giới theo quy định tại Điều 81 Nghị định số 08/2015/NĐ-CP ngày 21/01/2015 được sửa đổi, bổ sung tại khoản 49 Điều 1 Nghị định số 59/2018/NĐ-CP ngày 20/4/2018 của Chính phủ và Thông tư số 50/2018/TT-BTC ngày
      trang_pdf: 8
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 11
      noi_dung: Điều 11. Tổ chức thực hiện 1. Tổng cục trưởng Tổng cục Hải quan căn cứ vào hướng dẫn tại Thông tư này hướng dẫn các đơn vị hải quan thực hiện thống nhất, bảo đảm vừa tạo điều kiện thông thoáng cho hoạt động thương mại biên giới, vừa thực hiện tốt công tác quản lý hải quan. 2. Cơ quan hải quan nơi có thẩm quyền thực hiện thủ tục hải quan; kiểm tra, giám sát hải quan; thuế xuất khẩu, thuế nhập khẩu và quản lý thuế trong hoạt động
      trang_pdf: 8
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực kể từ ngày 01 tháng 01 năm 2020. 2. Bãi bỏ Thông tư số 217/2015/TT-BTC ngày 31/12/2015 của Bộ trưởng Bộ Tài chính hướng dẫn thủ tục hải quan, quản lý thuế đối với hoạt động thương mại biên giới của thương nhân và cư dân biên giới theo Quyết định số 52/2015/QĐ-TTg ngày 20/10/2015 của Thủ tướng Chính phủ./.
      trang_pdf: 9
      sha256_pdf: 6df11d9c1357f5a9b5a75dca5e53354f738b1cbd3f21e3bc77294e99c20fdd46
