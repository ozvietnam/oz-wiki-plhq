xac_minh:
  muc: NGUON_A
  pham_vi: 'số hiệu, tiêu đề, ngày ban hành/hiệu lực; hết hiệu lực từ 2026-07-01 do bị thay thế bởi 36/2026/TT-BKHCN (Điều 6 khoản 2 điểm d TT 36/2026/TT-BKHCN)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Sửa đổi khoản 4, bổ sung khoản 9 Điều 2 như sau: “4. Tổ chức chứng nhận hợp quy là tổ chức được Bộ Thông tin và Truyền thông chỉ định thực hiện chứng nhận sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý của Bộ Thông tin và Truyền thông. 9. Lô sản phẩm là tập hợp một chủng loại hàng hóa được xác định về số lượng, có cùng tên gọi, công dụng, nhãn hiệu, kiểu loại, đặc tính kỹ thuật, của cùng một cơ sở sản xuất, xuất xứ và thuộc cùng một bộ hồ sơ nhập khẩu.”'
      trang_pdf: 2
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 1
      khoan: 5
      noi_dung: '5. Sửa đổi khoản 3 Điều 18 như sau: “3. Tổ chức, cá nhân chỉ được phép sử dụng dấu hợp quy sau khi đã đăng ký mẫu dấu hợp quy tại Cục Viễn thông. Trường hợp có sự không phù hợp về dấu hợp quy, trong thời hạn ba (03) ngày làm việc, Cục Viễn thông có văn bản đề nghị tổ chức, cá nhân hiệu chỉnh dấu hợp quy cho phù hợp.”'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 1
      khoan: 6
      noi_dung: '6. Sửa đổi, bổ sung khoản 1 Điều 24 như sau: “1. Tổ chức, cá nhân phải thực hiện lại việc công bố hợp quy trong các trường hợp sau: a) Thiết kế kỹ thuật của sản phẩm, hàng hóa đã công bố hợp quy thay đổi làm thay đổi chỉ tiêu kỹ thuật của sản phẩm. b) Nội dung của hồ sơ công bố hợp quy đã đăng ký có sự thay đổi. c) Giấy chứng nhận hợp quy hết hiệu lực.”'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 1
      khoan: 7
      noi_dung: '7. Thay “Mẫu Giấy chứng nhận hợp quy” tại Phụ lục I bằng Mẫu số 01 tại Phụ lục ban hành kèm theo Thông tư này.'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 1
      khoan: 8
      noi_dung: '8. Thay “Báo cáo tình hình hoạt động chứng nhận hợp quy” tại Phụ lục VI bằng Mẫu số 02 tại Phụ lục ban hành kèm theo Thông tư này.'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 1
      khoan: 9
      noi_dung: '9. Bãi bỏ Điều 3, Điều 9, Điều 13, Điều 14, Điều 22, Điều 26, các điểm c, e khoản 1 Điều 27 và “Mẫu Đề nghị chứng nhận hợp quy” tại Phụ lục II.'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 2
      noi_dung: 'Ðiều 2. Tổ chức thực hiện Cục trưởng Cục Viễn thông, Thủ trưởng cơ quan, đơn vị thuộc Bộ Thông tin và Truyền thông, Giám đốc cơ quan quản lý nhà nước về Thông tin và Truyền thông tại các tỉnh, thành phố trực thuộc Trung ương các tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 3
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2020.'
      trang_pdf: 8
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 3
      khoan: 3
      noi_dung: '3. Giấy chứng nhận hợp quy, Thông báo tiếp nhận Bản công bố hợp quy đã được cấp trước ngày Thông tư này có hiệu lực thi hành và đang còn thời hạn được tiếp tục áp dụng cho đến hết hiệu lực.'
      trang_pdf: 9
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
    - dieu: 3
      khoan: 4
      noi_dung: '4. Trách nhiệm thi hành Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các cơ quan, tổ chức, cá nhân phản ánh kịp thời về Bộ Thông tin và Truyền thông (Cục Viễn thông) để xem xét, giải quyết./.'
      trang_pdf: 9
      sha256_pdf: 8df122fbc36a1aac1c059f6e3effc8a5bfad6c8ceed832fbd7a68e86e03ba7e9
