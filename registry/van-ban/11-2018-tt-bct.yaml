  pham_vi: 'Đã đối chiếu tệp gốc ký số (11-bct.zip: TT 11 2018 TT BCT signed.pdf + PL TT 11 PSR.pdf) trên Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn docid=193969) và CSDL Quốc gia về VBPL (vbpl.vn ID 129235): Thông tư số 11/2018/TT-BCT do Bộ trưởng Trần Tuấn Anh ký ban hành ngày 29-05-2018 (bản ghi cũ để ngày giả định 2018-01-01 và gắn nhầm ngày ban hành 2018-05-29 vào hieu_luc_tu), có hiệu lực thi hành từ ngày 01-07-2018 theo khoản 1 Điều 2. Điều 1 thay thế Phụ lục II (Quy tắc cụ thể mặt hàng - PSR chuyển đổi sang HS 2017) ban hành kèm theo Thông tư số 21/2016/TT-BCT ngày 20-09-2016. Văn bản hiện đang còn hiệu lực thi hành.'
