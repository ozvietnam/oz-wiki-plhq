  pham_vi: 'Đối chiếu phần căn cứ pháp lý của Thông tư ban hành QCVN 16:2025/BQP trên CSDLQG về pháp luật (vbpl.vn ItemID=179975) và Thông tư 126/2026/TT-BQP ngày 02-09-2026 trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=219388, 126-bqp.signed.pdf): Nghị định số 09/2014/NĐ-CP ngày 27-01-2014 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Ban Cơ yếu Chính phủ vẫn đang được viện dẫn làm căn cứ pháp lý hiện hành năm 2025–2026 (văn bản quy định cơ cấu tổ chức Ban Cơ yếu Chính phủ không phát hành tệp toàn văn công khai trên CSDLQG).'
