xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (25 trang, ký Thứ trưởng Vũ Hải Quân ngày 30-09-2026) + vanban.chinhphu.vn docid=219749: 6 Chương, 28 Điều + Phụ lục xác thực văn bản hợp nhất. Hợp nhất Thông tư 23/2013/TT-BKHCN ngày 26-09-2013 quy định về đo lường đối với phương tiện đo nhóm 2 (hiệu lực 15-11-2013), được sửa đổi, bổ sung bởi 3 Thông tư: (1) Thông tư 07/2019/TT-BKHCN ngày 26-07-2019 (hiệu lực 01-01-2020), (2) Thông tư 03/2024/TT-BKHCN ngày 15-04-2024 (hiệu lực 15-10-2024), (3) Thông tư 12/2025/TT-BKHCN ngày 30-06-2025 (hiệu lực 01-07-2025). Đối chiếu đến 12-11-2026 là bản hợp nhất mới nhất đang áp dụng.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-05-ai-live@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định về đo lường đối với phương tiện đo nhóm 2 (sau đây gọi tắt là phương tiện đo) bao gồm: Danh mục phương tiện đo, biện pháp kiểm soát về đo lường và chu kỳ kiểm định phương tiện đo; phê duyệt mẫu; kiểm định phương tiện đo.'
      trang_pdf: 4
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Tổ chức, cá nhân (sau đây gọi tắt là cơ sở) sản xuất, nhập khẩu, kinh doanh, sử dụng phương tiện đo. 2. Tổ chức kiểm định, thử nghiệm phương tiện đo được chỉ định. 3. Cơ quan nhà nước về đo lường, tổ chức, cá nhân khác có liên quan.
      trang_pdf: 5
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ2 Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Yêu cầu kỹ thuật đo lường là tập hợp đặc tính kỹ thuật đo lường của phương tiện đo quy định tại văn bản kỹ thuật đo lường Việt Nam (ký hiệu là ĐLVN); 2. Phương tiện đo là phương tiện kỹ thuật, bao gồm: thiết bị, dụng cụ đo; thiết bị, dụng cụ có chức năng đo; hệ thống đo để thực hiện phép đo;'
      trang_pdf: 5
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 7
      noi_dung: 'Điều 7. Hồ sơ đăng ký phê duyệt mẫu10 Cơ sở nộp 01 bộ hồ sơ đăng ký phê duyệt mẫu gửi đến Ủy ban thông qua một trong các cách thức sau: trực tiếp tại Bộ phận Một cửa hoặc thông qua dịch vụ bưu chính hoặc trực tuyến tại Cổng Dịch vụ công quốc gia.'
      trang_pdf: 12
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 11
      noi_dung: Điều 11. Đánh giá mẫu 1. Việc đánh giá mẫu đã thử nghiệm do tổ chức thử nghiệm mẫu đó thực hiện. Trường hợp mẫu được miễn thử nghiệm, Ủy ban17 chỉ định một tổ chức thực hiện việc đánh giá mẫu.
      trang_pdf: 15
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 14
      noi_dung: 'Điều 14. Lưu giữ hồ sơ của mẫu đã được phê duyệt 1. Bộ hồ sơ của mẫu đã được phê duyệt gồm: Quyết định phê duyệt mẫu, hồ sơ đăng ký phê duyệt mẫu quy định tại Điều 7 và hồ sơ kết quả thử nghiệm, đánh giá mẫu quy định tại Điều 12 của Thông tư này. 2. Một (01) bộ hồ sơ được lưu giữ tại Ủy ban24. Cơ sở chịu trách nhiệm lập một (01) bộ hồ sơ của mẫu đã được phê duyệt và lưu giữ tại cơ sở.'
      trang_pdf: 17
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 20
      noi_dung: Điều 20. Yêu cầu đối với thực hiện kiểm định 1. Việc kiểm định do cơ sở có phương tiện đo cần kiểm định lựa chọn, thực hiện theo thỏa thuận với tổ chức kiểm định được chỉ định có phạm vi kiểm định 35
      trang_pdf: 19
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 23
      noi_dung: Điều 23. Trách nhiệm của cơ sở sản xuất, nhập khẩu phương tiện đo 1. Thực hiện quy định về phê duyệt mẫu phương tiện đo tại Chương II và Chương III của Thông tư này khi sản xuất, nhập khẩu phương tiện đo. 41
      trang_pdf: 21
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 27
      noi_dung: Điều 27. Trách nhiệm của Ủy ban Tiêu chuẩn Đo lường Chất lượng Quốc gia47 1. Ban hành văn bản kỹ thuật đo lường Việt Nam về yêu cầu kỹ thuật đo lường, quy trình kiểm định, quy trình thử nghiệm phương tiện đo. 2. Phê duyệt mẫu phương tiện đo. 3. Chỉ định tổ chức kiểm định phương tiện đo, tổ chức thử nghiệm phương tiện đo theo quy định.
      trang_pdf: 23
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
    - dieu: 31
      noi_dung: Điều 31. Điều khoản chuyển tiếp 1. Phương tiện đo đã được sử dụng trước thời điểm có hiệu lực của Thông tư này nhưng chưa được phê duyệt mẫu theo quy định, cơ sở sử dụng phương tiện đo lập hồ sơ đăng ký phê duyệt mẫu theo quy định tại các điểm a, b, c khoản 1 Điều 752 của Thông tư này và gửi về Ủy ban53.
      trang_pdf: 28
      sha256_pdf: 0470626a579ce9edd36089bf3f5ada1b491ce4ee52c41b34027600330effd7d6
ghi_chu: Trinh sát đêm 9/11, bổ sung nguồn bậc A và nạp toàn văn ngày 12/11. Phương tiện đo nhóm 2 = nhóm phải kiểm định — đụng trực tiếp hàng đo lường nhập khẩu (cân, đồng hồ...). Bốn thông tư thành phần (23/2013/TT-BKHCN, 07/2019/TT-BKHCN, 03/2024/TT-BKHCN, 12/2025/TT-BKHCN) chưa ghi vào quan_he.hop_nhat vì các văn bản đó chưa có trong sổ.
