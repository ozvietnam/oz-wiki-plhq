ghi_chu: 'Trinh sát đêm 9/11, bổ sung nguồn bậc A và nạp toàn văn ngày 12/11. Phương tiện đo nhóm 2 = nhóm phải kiểm định — đụng trực tiếp hàng đo lường nhập khẩu (cân, đồng hồ...). Bốn thông tư thành phần (23/2013/TT-BKHCN, 07/2019/TT-BKHCN, 03/2024/TT-BKHCN, 12/2025/TT-BKHCN) chưa ghi vào quan_he.hop_nhat vì các văn bản đó chưa có trong sổ.'
