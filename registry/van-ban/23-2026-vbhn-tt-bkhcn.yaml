  pham_vi: 'PDF chữ ký số datafiles.chinhphu.vn (25 trang, ký Thứ trưởng Vũ Hải Quân ngày 30-09-2026) + vanban.chinhphu.vn docid=219749: 6 Chương, 28 Điều + Phụ lục xác thực văn bản hợp nhất. Hợp nhất Thông tư 23/2013/TT-BKHCN ngày 26-09-2013 quy định về đo lường đối với phương tiện đo nhóm 2 (hiệu lực 15-11-2013), được sửa đổi, bổ sung bởi 3 Thông tư: (1) Thông tư 07/2019/TT-BKHCN ngày 26-07-2019 (hiệu lực 01-01-2020), (2) Thông tư 03/2024/TT-BKHCN ngày 15-04-2024 (hiệu lực 15-10-2024), (3) Thông tư 12/2025/TT-BKHCN ngày 30-06-2025 (hiệu lực 01-07-2025). Đối chiếu đến 12-11-2026 là bản hợp nhất mới nhất đang áp dụng.'
