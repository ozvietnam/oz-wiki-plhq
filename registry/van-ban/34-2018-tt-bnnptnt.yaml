xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=196257), toàn văn PDF đính kèm (34-bnnptnt.pdf, Thứ trưởng Lê Quốc Doanh ký) và CSDL quốc gia vbpl.vn (ItemID=134291): ban hành 16-11-2018, có hiệu lực từ 01-01-2019 theo khoản 1 Điều 4; sửa đổi, bổ sung một số điều của Thông tư 33/2014/TT-BNNPTNT (Điều 1) và Thông tư 20/2017/TT-BNNPTNT (Điều 2). Hết hiệu lực một phần từ 16-05-2024 khi bị Thông tư 03/2024/TT-BNNPTNT ngày 01-04-2024 (docid=210131, Điều 1 và Điều 3) bãi bỏ một số quy định; đã được hợp nhất tại 19/VBHN-BNNPTNT ngày 27-05-2024.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bd sung một số điều của Thông tư số 33/2014/TT- BNNPTNT ngày 30 ngày 10 tháng 2014 của Bộ trưởng Bộ Nông nghiệp và _ Phát triển nông thôn quy định trình tự, thủ tục kiểm dịch thực vật nhập khẩu, xuất khẩu, quá cảnh và sau nhập khẩu vật thể thuộc diện kiểm dịch thực vật 1. Điều | được sửa đổi, bd sung như sau: “Điều 1. Phạm vi điều chỉnh Thông tư này quy định về:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đỗi, bd sung Thông tư số 20/2017/TT-BNNPTNT ngày 10 tháng 11 năm 2017 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn hướng dẫn thực hiện Nghị định số 39/2017/NĐ-CP ngày 04 tháng 4 năm 2017 của Chính phủ về quan lý thức ăn chăn nuôi, thủy sẵn 1. Bố sung khoản 2a, khoản 3a Điều 9 như sau:'
      trang_pdf: 4
    - dieu: 3
      noi_dung: Điều 3. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2019. 2. Bãi bỏ Điều 1 Thông tư số 30/2017/TT-BNNPTNT ngày 29 tháng 12 năm 2017 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số điều của Thông tư số 33/2014/TT-BNNPINT ngày 30 tháng 10 năm 2014 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định trình tự, thủ tục kiểm dịch thực vật nhập khẩu, xuất khâu, quá cảnh và sau
      trang_pdf: 5
    - dieu: 4
      noi_dung: Điều 4. Điều khoản chuyển tiếp 1. Trong thời gian chưa hoàn thiện xong phần mềm để thực hiện đồng -thời thủ tục kiểm dịch thực vật và kiểm tra chất lượng thức ăn chăn nuôi, thức ăn thủy sản có nguồn gốc thực vật nhập khẩu trên Cơ chế một cửa Quốc gia, Tổng cục Thủy sản, Cục Chăn nuôi tiếp tục thực hiện thủ tục hành chính có liên quan đến kiểm tra nhà nước về chất lượng thức ăn chăn nuôi, thức ăn thủy sản qua Cơ chế một cửa Quốc gia trong thời
      trang_pdf: 6
    - dieu: 5
      noi_dung: Điều 5. Té chức thực hiện 1. Cục trưởng Cục Bảo vệ thực vật, Tổng cục trưởng Tổng cục Thủy sản, Cục trưởng Cục Chăn nuôi và Thủ trưởng các đơn vi, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. 2. Trong quá trình thực hiện Thông tư này, nếu có khó khăn, vướng mắc, đề nghị cơ quan, tổ chức, cá nhân phản ánh về Bộ Nông nghiệp và Phát triển nông thôn dé xem xét, sửa đôi, bé sung./.
      trang_pdf: 7
