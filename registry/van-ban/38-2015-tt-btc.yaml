# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 38/2015/TT-BTC
loai: THONG_TU
ten: Quy định về thủ tục hải quan; kiểm tra, giám sát hải quan; thuế xuất khẩu, thuế nhập khẩu và quản lý thuế đối với hàng hoá xuất khẩu, nhập khẩu
co_quan: BTC
ngay_ban_hanh: '2015-03-25'
hieu_luc_tu: '2015-04-01'
tinh_trang: CON_HIEU_LUC
nhanh:
  - hai-quan/kiem-tra-giam-sat
  - hai-quan/thu-tuc
quan_he:
  huong_dan:
