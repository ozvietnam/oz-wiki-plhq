  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/15/VB_16062.pdf, id=103726, SHA-256 9f7e713d91acd7fd972e34ee02487ac7ccb18a8e06c00cfef0131d03773a75f1): Thông báo số 16062/TB-CHQ ngày 11-05-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Mặt nạ xông hơi mắt MegRhythm loại không hương (ký, mã hiệu MSEM-US; cấu tạo gồm dây đeo tai, màng tiếp xúc da, màng đáy, màng thẩm thấu khí kiểm soát oxy, màng kín và thành phần sinh nhiệt Fe, H2O theo phản ứng oxy hóa sắt tỏa nhiệt; thành phần theo trọng lượng gồm bao gói vải không dệt 33,5%, màng đáy 9,8%, keo dính 1,7%, phần lõi hạt sinh nhiệt 55,1%, chất thơm 0%; đóng gói 5 miếng/hộp, tỏa hơi nước ấm khoảng 40 °C trong 20 phút giúp thư giãn mắt), phân loại vào nhóm 38.24, phân nhóm 3824.99, mã số 3824.99.99; có hiệu lực kể từ ngày ban hành'
