      noi_dung: 'Điều 1. Gia hạn thêm 05 năm việc áp dụng thuế chống bán phá giá đối với một số sản phẩm thép cán nguội (ép nguội) nhập khâu vào Việt Nam được phân loại theo mã HS: 7209.16.10; 7209.16.90; 7209.17.10; 7209.17.90; 7209.18.91; 7209.18.99; 7209.26.10; 7209.26.90; 7209.27.10; 7209.27.90; 7209.28.10; 7209.28.90; 7209.90.90; 7211.23.20; 7211.23.30; 7211.23.90; 7211.29.20; 7211.29.30; 7211.29.90;'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Các Quyết định miễn trừ việc áp dụng biện pháp chống bán phá giá đối với một số sản phẩm thép nêu tại Điều 1 Quyết định này đã được Bộ trưởng Bộ Công Thương ban hành trước ngày Quyết định này có hiệu lực, tiếp tục được thực hiện đến hết thời hạn hiệu lực của Quyết định miễn trừ đó.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kể từ ngày 28 tháng 12 năm 2025.
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Quyết định số 3390/QD-BCT ngày 21 tháng 12 năm 2020 của Bộ trưởng Bộ Công Thương hết hiệu lực kể từ ngày Quyết định này có hiệu lực.
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại, Thủ trưởng các đơn vị và các bên liên quan chịu trách nhiệm thi hành Quyết định này./. uZ
      trang_pdf: 2
