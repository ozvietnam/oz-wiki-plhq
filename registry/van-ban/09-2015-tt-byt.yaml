xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn 19 trang PDF ký số (09-byt.signed.pdf, Thứ trưởng Phạm Lê Tuấn ký) trên vanban.chinhphu.vn (docid=180328), Công báo (số 609+610 năm 2015) và CSDLQG vbpl.vn (ID 67130): số hiệu 09/2015/TT-BYT, tiêu đề, ngày ban hành 25/05/2015, gồm 3 Chương 27 Điều; khoản 1 Điều 24 có hiệu lực từ 16/07/2015; điểm d khoản 2 Điều 24 bãi bỏ các quy định về quảng cáo mỹ phẩm trong Thông tư 06/2011/TT-BYT (được hợp nhất tại VBHN 09/VBHN-BYT ngày 25/07/2025); trên vbpl.vn (ID 67130) ghi nhận trạng thái hết hiệu lực một phần (effStatus HHL1P) do các quy định xác nhận quảng cáo theo từng nhóm hàng chuyên ngành được sửa đổi, bãi bỏ một phần bởi các văn bản sau năm 2015'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác minh nguồn bậc A (OZV-561) — quy định điều kiện, thẩm quyền, hồ sơ, thủ tục xác nhận nội dung quảng cáo đối với thuốc, mỹ phẩm, thực phẩm/phụ gia thực phẩm thuộc quản lý Bộ Y tế, hóa chất/chế phẩm diệt côn trùng diệt khuẩn dùng trong gia dụng và y tế, trang thiết bị y tế, sữa và sản phẩm dinh dưỡng dùng cho trẻ, dịch vụ khám bệnh chữa bệnh. Điểm d khoản 2 Điều 24 bãi bỏ quy định về quảng cáo mỹ phẩm tại TT 06/2011/TT-BYT; một số thủ tục xác nhận quảng cáo chuyên ngành đã hết hiệu lực một phần theo các nghị định, thông tư mới của Chính phủ và Bộ Y tế.'
