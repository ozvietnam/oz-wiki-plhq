      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại và Thủ trưởng các đơn vị, các bên liên quan chịu trách nhiệm thi hành Quyết định này./ AZ
      trang_pdf: 2
ghi_chu: 'Mã vụ việc AD19 (38 mã HS thép mạ/tôn mạ nhóm 7210, 7212, 7225, 7226; lưu ý tại điểm b khoản 1 Thông báo trang 5 in nhầm 7212.50.19 thành 7215.50.19). Mức thuế chống bán phá giá tạm thời: Trung Quốc 0%–37,13%, Hàn Quốc 0%–15,67%, không nộp C/O áp mức 37,13%; thời hạn áp dụng 120 ngày kể từ ngày 16/04/2025 đến hết ngày 13/08/2025.'
