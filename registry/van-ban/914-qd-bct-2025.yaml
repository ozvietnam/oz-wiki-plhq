  pham_vi: 'đối chiếu toàn văn PDF sao y ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/16/914.QD-BCT.pdf, id=99812, SHA-256 aee3078ea7703a6d03f07189d8132da94ada76947dbc049228577f2ff2a40269): Quyết định số 914/QĐ-BCT ngày 01-04-2025 của Bộ trưởng Bộ Công Thương (Thứ trưởng Nguyễn Sinh Nhật Tân ký) áp dụng thuế chống bán phá giá tạm thời đối với 41 mã HS sản phẩm thép mạ (tôn mạ) có xuất xứ từ Cộng hòa nhân dân Trung Hoa (mức thuế 0%–37,13%) và Đại Hàn Dân Quốc (mức thuế 0%–15,67%) thuộc mã vụ việc AD19; Điều 2 và Mục 3 Thông báo quy định có hiệu lực sau 15 ngày kể từ ngày ban hành (16-04-2025) với thời hạn áp dụng 120 ngày đến hết ngày 13-08-2025'
