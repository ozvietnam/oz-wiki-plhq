xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=218821, Thứ trưởng Nguyễn Đức Chi ký), tệp đính kèm 86-btc.signed.pdf và kết quả đối chiếu Điều 43 tại hồ sơ 06/2021/TT-BTC, 39/2018/TT-BTC trong sổ: ban hành 30-06-2026, có hiệu lực từ 01-07-2026 (khoản 1 Điều 43); khoản 2 Điều 43 bãi bỏ toàn bộ Thông tư 06/2021/TT-BTC; khoản 3 Điều 43 bãi bỏ các quy định về miễn thuế tại Điều 104, 105, 131, 132, 134, 135, 140 Thông tư 38/2015/TT-BTC (đã được sửa đổi, bổ sung tại Thông tư 39/2018/TT-BTC và Thông tư 121/2025/TT-BTC)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư quy định về quản lý thuế đối với hàng hóa xuất khâu, nhập khẩu theo quy định tại khoản 9 Điều 12, điểm c khoản 1 và khoản 9 Điều 14, khoản 5 Điều 15, khoản 7 Điều 16, khoản 7 Điều 18, khoản 6 Điều 19, khoản 6 Điều 20, khoản 5 Điều 21, khoản 7 Điều 22, khoản 3 Điều 35, khoản 3 Điều 37, điểm b khoản 2 Điều 38 của Luật Quan lý thuế số 108/2025/QH15 và khoản 5 Điều 25, điểm b khoản 3 Điều 27, khoản 4 Điều 30,
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Đối tượng áp dụng quy định tại Thông tư này bao gồm: 1. Người nộp thuế theo quy định tại khoản 1 Điều 2 Luật số 108/2025/QH15, Điều 3 Luật Thuế xuất khâu, thuế nhập khâu số 107/2016/QH13;'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Khai thuế, hồ sơ khai thuế, hình thức nộp hồ sơ khai thuế, tiếp nhận, xử lý hồ sơ khai thuế 1. Khai thuế đối với hàng hóa xuất khâu, nhập khẩu theo từng lần phát sinh bao gồm khai thuế xuất khẩu, thuế nhập khâu, thuế tự vệ, thuế chống bán phá giá, thuế chống trợ cấp, thuế tiêu thụ đặc biệt, thuế bảo vệ môi trường, thuế giá trị gia tăng.
      trang_pdf: 2
    - dieu: 10
      noi_dung: Điều 10. Miễn tiền chậm nộp 1. Đối với trường hợp gặp thiên tai, thảm họa, dịch bệnh, hỏa hoạn, tai nạn bat ngờ quy định tại khoản 21 Điều 4 Luật số 108/2025/QH15, số tiền chậm nộp được miễn là số tiền chậm nộp còn nợ tại thời điểm xảy ra thiên tai, thảm họa, dịch bệnh, hỏa hoạn, tai nạn bất ngờ và không vượt quá giá trị vật chất bị thiệt hại sau khi trừ các khoản được bồi thường, bảo hiểm theo quy định (nếu có).
      trang_pdf: 14
    - dieu: 15
      noi_dung: Điều 15. Hồ sơ, thủ tục miễn thuế xuất khẩu, thuế nhập khẩu đối với tài sản di chuyển 1. Hồ sơ miễn thuế a) Hồ sơ hải quan theo quy định của pháp luật hải quan;
      trang_pdf: 28
    - dieu: 21
      noi_dung: Điều 21. Hồ sơ, thủ tục miễn thuế nhập khẩu hàng hóa nhập khẩu để phát triển khoa học, công nghệ, đổi mới sáng tạo, công nghiệp công nghệ số Hồ so, thủ tục miễn thuế thực hiện theo quy định tại Điều 28 Thông tư này.
      trang_pdf: 32
    - dieu: 26
      noi_dung: Điều 26. Hồ sơ, thủ tục miễn thuế nhập khẩu đối với sản phẩm nông sản chưa qua chế biến do phía Việt Nam hỗ trợ đầu tư, trồng tại Campuchia nhập khẩu về nước
      trang_pdf: 35
    - dieu: 32
      noi_dung: Điều 32. Hồ sơ không chịu thuế đói với hàng hóa xuất khẩu, nhập khẩu 1. Các trường hợp hàng hóa xuất khâu, nhập khẩu thuộc đối tượng không chịu thuế thực hiện theo quy định của pháp luật về thuế. 2. Hồ sơ không chịu thuế xuất khâu, thuế nhập khẩu
      trang_pdf: 52
    - dieu: 37
      noi_dung: Điều 37. Các trường hợp kiểm tra thuế, thẩm quyền kiểm tra thuế 1. Cơ quan hải quan thực hiện kiểm tra thuế trong các trường hợp quy định tại khoản 2, điểm a, điểm b khoản 3 Điều 22 Luật số 108/2025/QH15. Trường hợp kiểm tra sau thông quan thực hiện theo quy định của pháp luật về hải quan. 2. Thâm quyền quyết định kiểm tra thuế
      trang_pdf: 65
    - dieu: 44
      noi_dung: Điều 44. Điều khoản chuyền tiếp 1. Trường hợp hồ sơ miễn thué, giảm thuế, hoàn thuế, không thu thuế, không chịu thuế, xử lý tiền thuế, khoản thu khác, tiền chậm nộp, tiền phạt nộp thừa, gia hạn nộp thuế, miễn tiền chậm nộp, nộp dân tiên thuê nợ, xác nhận hoàn thành nghĩa vụ nộp thué, khoanh tiền thuế nợ, xoá tiền thuế nợ, người nộp thuế đã nộp trước ngày Thông tu này có hiệu lực thì tiêp tục thực hiện theo quy định tại văn bản quy phạm pháp luật
      trang_pdf: 72
ghi_chu: Trinh sát WebSearch trạm BTC đêm 29/10. CHƯA có điều khoản thay thế được đối chiếu — chưa thấy nguồn nào nói thay TT 39/2015 (trị giá hải quan là lĩnh vực khác). Cần nạp toàn văn (PDF 313 trang trên TVPL) để bóc quan hệ với TT 39/2015, TT 65/2024 và mốc hoàn thuế Điều 11/31.
