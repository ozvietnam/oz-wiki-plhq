xac_minh:
  muc: NGUON_B
  pham_vi: |
    QĐ 2169/QĐ-CHQ ngày 31-12-2025 của Cục trưởng Cục Hải quan (ký Phó Cục trưởng theo ủy quyền):
    Điều 1: Ban hành Quy trình phân tích phân loại hàng hoá XNK và kiểm tra, đánh giá tiêu chí kỹ thuật + 3 Phụ lục (1: Kỹ thuật lấy mẫu + bao bì; 2: Danh mục biểu mẫu; 3: Danh mục TCVN hướng dẫn lấy mẫu khoáng sản).
    Điều 2.1: Hiệu lực 01-02-2026.
    Điều 2.2: Thay thế QĐ 2999/QĐ-TCHQ 06-9-2017 (Quy chế Kiểm định, phân tích hàng hoá XNK) + QĐ 2166/QĐ-TCHQ 04-8-2021 (Quy trình Phân tích để phân loại hàng hoá XNK).
    Điều 2.3: Khi văn bản được viện dẫn sửa đổi, bổ sung hoặc thay thế thì áp dụng văn bản mới (forward).
    Căn cứ: NĐ 08/2015 (sửa bởi NĐ 167/2025), TT 14/2015, TT 17/2021, TT 121/2025 (khoản 11, 14, 16 Điều 1), QĐ 1892/QĐ-BTC, QĐ 382/QĐ-BTC, QĐ 2019/QĐ-BTC. CHƯA tham chiếu TT 85/2026 (ban hành sau, hiệu lực 15-9-2026).
    Toàn văn đã OCR (PDF scan, 77 trang, sha256 2a6e9da08f7a60d1965e4bc5f0ee79d6b4d50db95ce8c1fc3a76fc8e3e519849, 22MB).
  hieu_luc_da_doi_chieu: false
  chan:
    ma: THIEU_PDF_A
    ngay: '2026-11-26'
    viec_tiep: 'Đã truy cập trực tiếp customs.gov.vn (/customs/api/lay_van_ban), vbpl.vn và congbao.chinhphu.vn ngày 26-11-2026 nhưng QĐ 2169/QĐ-CHQ chưa được công bố công khai trên cổng bậc A (hiện chỉ có bản Google Drive do ISEC Hải quan chia sẻ).'
  ngay: '2026-11-26'
  boi: antigravity@ozvietnam
  nguon_da_mo:
    - drive.google.com/.../1aYmalFpHrMnQ2gn5mZ8JIk-v6krhXJds/view (Cục Hải quan chia sẻ qua ISEC Hải quan)
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Ban hành kèm theo Quyết định này Quy trình phân tích phân loại hàng hóa xuât khâu, nhập khâu và kiêm tra, đánh giá tiêu chí kỹ thuật của hàng hóa băng máy móc, trang thiệt bị tại cơ quan Kiêm định hải quan và các Phụ lục gôm: 1. Phụ lục 1: Kỹ thuật lấy mẫu và bao bì đựng mẫu yêu cầu phân tích; 2. Phụ lục 2: Danh mục biéu mẫu;'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Hiệu lực thi hành 1. Quyết định này có hiệu lực thi hành ké từ ngày 01 tháng 02 năm 2026. 2. Quyết định này thay thé Quyết định s6 2999/QD-TCHQ ngay 06/9/2017 của Tong cục trưởng Tông, cục Hải quan về việc ban hành Quy chế Kiểm định, phân tích hàng hóa xuất khâu, nhập khẩu và Quyết định số 2166/QĐ-TCHQ ngày 04/8/2021 của Tông cục trưởng Tông cục Hải quan về việc ban hành Quy trình Phân tích dé phân loại hàng hóa xuất khẩu, nhập khẩu.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Thủ trưởng các đơn vị thuộc Cục Hải quan chịu trách nhiệm thi hành Quyêt định này. Công chức hải quan có trách nhiệm thực hiện theo quy định tại Quy trình phân tích phân loại hàng hóa xuất khâu, nhập khâu và kiểm tra, đánh gid tiêu chí kỹ thuật của hàng hóa bằng máy móc, trang thiết bị tại cơ quan Kiém định hải quan và các Phụ lục ban hành kèm theo Quyết định này.
      trang_pdf: 3
ghi_chu: 'Đây là Quy trình theo Điều 17.1 TT 85/2026/TT-BTC (về mặt nội dung: quy trình phân tích phân loại do Cục trưởng Cục Hải quan ban hành) nhưng về mặt pháp lý được ban hành theo TT 14/2015/TT-BTC + TT 17/2021 + TT 121/2025 (căn cứ đã liệt kê). Khi TT 85/2026 có hiệu lực 15-9-2026, QĐ 2169 tiếp tục áp dụng theo Điều 2.3 (forward) + Điều 15.2 TT 85/2026. Nguồn bậc B (Google Drive chia sẻ bởi ISEC Hải quan trên Facebook) — cần xác minh thêm từ customs.gov.vn khi có thể.'
