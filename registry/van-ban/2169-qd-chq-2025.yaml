ghi_chu: 'Đây là Quy trình theo Điều 17.1 TT 85/2026/TT-BTC (về mặt nội dung: quy trình phân tích phân loại do Cục trưởng Cục Hải quan ban hành) nhưng về mặt pháp lý được ban hành theo TT 14/2015/TT-BTC + TT 17/2021 + TT 121/2025 (căn cứ đã liệt kê). Khi TT 85/2026 có hiệu lực 15-9-2026, QĐ 2169 tiếp tục áp dụng theo Điều 2.3 (forward) + Điều 15.2 TT 85/2026. Nguồn bậc B (Google Drive chia sẻ bởi ISEC Hải quan trên Facebook) — cần xác minh thêm từ customs.gov.vn khi có thể.'
