    ma: THIEU_PDF_A
    ngay: '2026-10-10'
    viec_tiep: 'Cần tải PDF gốc từ customs.gov.vn (đã bị Cloudflare chặn); bài ISEC Hải quan Facebook + Google Drive link đã verify. Khi customs.gov.vn truy cập được thì nạp raw/download/ và nâng NGUON_A.'
