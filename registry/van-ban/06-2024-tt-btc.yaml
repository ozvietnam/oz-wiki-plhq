ghi_chu: 'Điều 1 khoản 1: hiệu lực 15/03/2024; riêng khoản 4, 5, 6 Điều 1 hiệu lực từ 15/07/2025. Điều 1 khoản 6 sửa lại Điều 14 (phân loại mức độ rủi ro) — Hạng 7/8/9 đổi thành "không có hoạt động xuất khẩu, nhập khẩu hàng hóa trong 365 ngày trở về trước" thay cho "có hoạt động". Điều 1 khoản 12 sửa điểm c.3 khoản 1 Điều 22 (kiểm tra bằng phân tích, kiểm định tại đơn vị kiểm định hải quan, trạm kiểm định di động hải quan hoặc giám định theo quy định). Điều 1 khoản 13 sửa Điều 26 về hồ sơ hoàn thuế theo 3 mức rủi ro. Điều 3 khoản 2 bãi bỏ Điều 24 TT 39/2015/TT-BTC và khoản 13 Điều 1 TT 138/2019/TT-BTC.'
