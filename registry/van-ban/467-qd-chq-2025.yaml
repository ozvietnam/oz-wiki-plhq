xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu PDF ký số bậc A trên Cổng Hải quan (VB_467.pdf, id=99988, 36 trang, Phó Cục trưởng Âu Anh Tuấn ký ngày 29-04-2025, SHA-256 b4daa7e13c814477d6bce30b62844391fe19dbdba567daa84eb3572f3248c09e): ban hành Quy trình kiểm tra, xác định xuất xứ hàng hóa XNK và 2 phụ lục; hiệu lực từ ngày ký, thay thế QĐ 4286/QĐ-TCHQ (2015) và QĐ 136/QĐ-TCHQ (2016)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Ban hành kèm theo Quyết định này: 1. Quy trình kiểm tra, xác định xuất xứ hàng hóa xuất khẩu, nhập khẩu; 2. Các Phụ lục kèm Quy trình: a) Phụ lục I. Trang thông tin điện tử của co quan có thâm quyền của nước xuất khẩu/Tra cứu mã nhà xuất khẩu đủ điều kiện cấp chứng từ tự chứng nhận xuât xứ. b) Phụ lục II. Các biéu mẫu Thông báo của Cục trưởng Cục Hải quan.'
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Quyết định này có hiệu lực thi hành ké từ ngày ký và thay thế Quyết định số 4286/QD-TCHQ ngày 31/12/2015 của Tông cục trưởng Tổng cục Hải quan về việc ban hành Quy trình kiểm tra, xác định xuất xứ hàng hóa xuất khâu, nhập khẩu; Quyết định số 136/QD-TCHQ ngày 25/01/2016 bổ sung Quyết định sô 4286/QD-TCHQ ngày 31/12/2015 của Tổng cục trưởng Cục Hải quan về việc ban hành Quy trình kiếm tra, xác định xuất xứ hàng hóa xuất khâu, nhập khẩu.
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Thủ trưởng các đơn vị thuộc và trực thuộc Cục Hải quan chịu trách nhiệm tô chức thi hành Quyết định này. Trong quá trình thực hiện, nêu phát sinh vướng mắc, các đơn vị báo cáo, đề xuất dé Cục Hải quan xem xét, điều chỉnh cho phù hợp..ƒ|z
      trang_pdf: 2
ghi_chu: Quy trình nghiệp vụ kiểm tra, xác định xuất xứ hàng hóa XNK của Cục Hải quan từ 29-04-2025.
