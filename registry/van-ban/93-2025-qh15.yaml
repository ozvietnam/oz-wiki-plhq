xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn 52 trang PDF ký số của Luật 93/2025/QH15 (93qh.signed.pdf, Chủ tịch Quốc hội Trần Thanh Mẫn ký) trên vanban.chinhphu.vn (docid=214603) và Văn bản hợp nhất Luật SHTT số 155/VBHN-VPQH ngày 09/09/2025 (155-vbhn-vpqh.pdf): số hiệu 93/2025/QH15, tiêu đề Luật Khoa học, công nghệ và đổi mới sáng tạo, gồm 7 Chương 73 Điều, Quốc hội khóa XV kỳ họp thứ 9 thông qua ngày 27/06/2025; khoản 7 Điều 71 sửa đổi, bổ sung, bãi bỏ một số điều của Luật Sở hữu trí tuệ số 50/2005/QH11 (đã sửa đổi theo Luật 36/2009/QH12, 42/2019/QH14, 07/2022/QH15); khoản 1 và khoản 2 Điều 72 quy định có hiệu lực từ 01/10/2025 (riêng các Điều 15, 61, 62, 63, 64, 65 và 66 có hiệu lực từ 01/07/2025); khoản 3 Điều 72 làm hết hiệu lực Luật Khoa học và công nghệ số 29/2013/QH13'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác minh nguồn bậc A (OZV-561) — đã bổ sung trang văn bản riêng trên vanban.chinhphu.vn (docid=214603) và toàn văn bản ký số 93qh.signed.pdf. Khoản 7 Điều 71 là lần sửa đổi, bổ sung thứ tư đối với Luật Sở hữu trí tuệ số 50/2005/QH11 (về quyền đăng ký sáng chế, kiểu dáng công nghiệp, thiết kế bố trí và giống cây trồng từ nhiệm vụ KH&CN sử dụng ngân sách nhà nước, hợp nhất tại 155/VBHN-VPQH). Ngoài ra các khoản 1–6, 8, 9 Điều 71 còn sửa đổi một số điều của các luật ngoài phạm vi sổ hải quan (Luật Công nghệ cao, Luật Chuyển giao công nghệ, Luật Thuế TNCN, Luật Đất đai, Luật Báo chí, Luật Xây dựng, Luật Nhà ở) và bãi bỏ các Điều 3–9 Nghị quyết 193/2025/QH15.'
