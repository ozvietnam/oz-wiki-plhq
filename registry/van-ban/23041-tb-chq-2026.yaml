  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/16/VB_23041.pdf, id=106374, SHA-256 03ab037e09e021ce6a31f3b73505b110b8c8b3671fd94efcc4d2acccf7638e77): Thông báo số 23041/TB-CHQ ngày 15-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp tín hiệu, cách điện bằng PE, 1PR x 18AWG (bên ngoài lớp vỏ nhựa; bên trong chia 02 vùng gồm vùng 1 là 01 bó dây thoát nhiễu 07 sợi đồng mạ thiếc đường kính 0,32mm/sợi không vỏ bọc cách điện và vùng 2 là vỏ lá nhôm chứa 02 cáp truyền tín hiệu có vỏ cách điện nhựa PE, mỗi lõi gồm 16 sợi đồng mạ thiếc bện xoắn đường kính 0,25mm/sợi; cáp dạng cuộn chưa gắn đầu nối, đường kính lõi dẫn tín hiệu nhỏ hơn 19,5mm, điện áp 30V, không dùng cho viễn thông, dùng truyền tín hiệu chuẩn RS-232, RS-485, Modbus/Bacnet, hệ thống âm thanh, báo cháy, camera, BMS), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Cáp tín hiệu 1PR x 18AWG, cách điện bằng nhựa PE (bên ngoài là lớp vỏ nhựa; bên trong gồm 01 bó dây thoát nhiễu Drain wire 07 sợi đồng mạ thiếc đường kính 0,32mm/sợi và một vỏ lá nhôm chứa 02 cáp truyền tín hiệu cách điện bằng nhựa PE, mỗi lõi gồm 16 sợi đồng mạ thiếc bện xoắn đường kính 0,25mm/sợi; cáp dạng cuộn, chưa gắn đầu nối, đường kính lõi dẫn tín hiệu nhỏ hơn 19,5mm, điện áp 30V, không dùng cho viễn thông, dùng truyền tín hiệu cho chuẩn kết nối RS-232, RS-485, Modbus/Bacnet, hệ thống âm thanh, báo cháy, camera, BMS) thuộc nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24.'
