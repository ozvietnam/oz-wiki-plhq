xac_minh:
  muc: NGUON_A
  pham_vi: |
    Thông tư 125/2026/TT-BCA gồm 7 Điều + 1 Phụ lục (Công báo số 475, 20-08-2026):
    Điều 1 (Phạm vi điều chỉnh): Danh mục + nguyên tắc quản lý SP/HH rủi ro trung bình & rủi ro cao do BCA quản lý.
    Điều 2 (Đối tượng áp dụng): (1) Đơn vị thuộc BCA, CA tỉnh/TP; (2) Tổ chức/cá nhân NK, SX, KD SP/HH trong Danh mục; (3) Tổ chức đánh giá sự phù hợp.
    Điều 3 (Danh mục): Phụ lục ban hành kèm; Cục KH-CLS Công an chủ trì rà soát sửa đổi/bổ sung theo từng thời kỳ.
    Điều 4 (Nguyên tắc quản lý chất lượng): Theo Luật CL SPHH, Luật TCCS-QCKT, yêu cầu tại Phụ lục + pháp luật liên quan.
    Điều 5 (Hiệu lực): (1) Hiệu lực 01-07-2026; (2) VBQPPL/QCTKQG dẫn chiếu trong Danh mục bị sửa đổi/thay thế → áp dụng văn bản mới.
    Điều 6 (Chuyển tiếp): (1) Giấy CN hợp quy, TB tiếp nhận CBHQ cấp trước ngày hiệu lực còn giá trị đến hết hạn; (2) Rủi ro CAO: truy xuất nguồn gốc sau 06 tháng từ ngày hiệu lực.
    Điều 7 (Trách nhiệm thi hành): (1) Cục KH-CLS Công an hướng dẫn, kiểm tra, đôn đốc; (2) Thủ trưởng đơn vị thuộc BCA, GĐ CA tỉnh/TP, tổ chức/cá nhân liên quan chịu trách nhiệm; vướng mắc báo BCA (qua Cục KH-CLS).
    Phụ lục (Danh mục SP/HH):
      (I) PHẦN A — RỦI RO CAO (4 mã HS):
        1. Pháo hoa các loại → 3604.10.00 — QCVN 04:2021/BCA.
        2. Bình chữa cháy (có bộ phận kích hoạt tay/điện/cơ khí) → 8424.10.90 — QCVN 03:2023/BCA.
        3. Chất chữa cháy (gốc nước, bột, khí, bọt) → 3813.00.00 — QCVN 03:2023/BCA.
        4. Chai/thiết bị chứa khí chữa cháy (vỏ thép sơn đỏ, van xả/kích hoạt tự động) → 8424.10.90 — QCVN 03:2023/BCA.
      (II) PHẦN B — RỦI RO TRUNG BÌNH (55 mã HS):
        Mục I. Phương tiện PCCC & cứu nạn, cứu hộ (11 mã, QCVN 03:2023/BCA):
          1. Tủ trung tâm báo cháy → 8537.10.99.
          2. Đầu báo cháy các loại → 8531.10.20 / 8531.10.30 / 8531.90.90.
          3. Đầu phun chất chữa cháy → 8424.90.99.
          4. Đèn chiếu sáng sự cố, đèn chỉ dẫn thoát nạn → 9405.11.99 / 9405.19.92 / 9405.19.99 / 9405.61.90 / 9405.69.90.
          5. Máy bơm chữa cháy → 8413.19.10 / 8413.19.20 / 8413.70.
          6. Van báo động; van tràn ngập → 8481.40.90.
          7. Vòi đẩy chữa cháy → 5909.00.10.
        Mục II. Phương tiện giám sát TT-ATGT, an toàn xã hội (44 mã, QCVN 05/06/11:2024–2026/BCA):
          1. Thiết bị giám sát hành trình & ghi nhận hình ảnh người lái → 8525.81.10/20/90 — QCVN 06:2024 + 11:2026.
          2. Thiết bị đo tốc độ tự động (radar) → 8525.82.10/20/90 — QCVN 05:2024 + 11:2026.
          3. Camera quan sát giao thông → 8525.83.10/20/90 — QCVN 05:2024 + 11:2026.
          4. Camera giám sát giao thông → 8525.89.10/20/30/90 + 8481.80 — QCVN 11:2026 + 05:2024.
          5. Camera nhận dạng biển số → QCVN 05:2024 + 11:2026.
          6. Camera đo đếm lưu lượng phương tiện → QCVN 05:2024 + 11:2026.
          7. Camera giám sát dùng giao thức Internet → QCVN 11:2026.
    Tổng: 59 mã HS (A: 4 rủi ro CAO, B: 55 rủi ro TB). Quản lý chất lượng: rủi ro CAO phải chứng nhận hợp quy + kiểm tra NN chất lượng; rủi ro TB công bố phù hợp QCKT; PCCC-CNCH thử nghiệm tại VN tổ chức được chỉ định/công nhận; Điều 44 Luật 55/2024/QH15 áp dụng đồng thời.
    (2) Tình trạng hiện tại: rà registry 13-10-2026 — không có văn bản nào sau ghi thay/bãi/tạm ngưng TT 125
    (chỉ được nhắc trong ghi_chu nghiệp vụ của QĐ 9981/QĐ-BCA và QĐ 6266/QĐ-BCA về chuỗi danh mục cũ).
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về Danh mục, nguyên tắc quản lý sản phẩm, hàng hoá có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý của Bộ Công an.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 2
      khoan: 1
      noi_dung: '1. Các đơn vị thuộc cơ quan Bộ Công an, Công an các tỉnh, thành phố.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 2
      khoan: 2
      noi_dung: '2. Tổ chức, cá nhân nhập khẩu, sản xuất, kinh doanh sản phẩm, hàng hoá thuộc Danh mục sản phẩm, hàng hoá có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý của Bộ Công an (sau đây gọi chung là Danh mục sản phẩm, hàng hoá) ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 2
      khoan: 3
      noi_dung: '3. Tổ chức đánh giá sự phù hợp thực hiện các hoạt động phục vụ yêu cầu quản lý nhà nước về chất lượng sản phẩm, hàng hoá thuộc Danh mục sản phẩm, hàng hoá ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 3
      khoan: 1
      noi_dung: '1. Danh mục sản phẩm, hàng hoá có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý của Bộ Công an được quy định tại Phụ lục ban hành kèm theo Thông tư này.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 3
      khoan: 2
      noi_dung: '2. Cục Khoa học, Chiến lược và Lịch sử Công an chủ trì, phối hợp với các đơn vị liên quan đề xuất sửa đổi, bổ sung Danh mục sản phẩm, hàng hoá phù hợp yêu cầu quản lý nhà nước của Bộ Công an theo từng thời kỳ.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 4
      noi_dung: 'Điều 4. Nguyên tắc quản lý chất lượng Việc quản lý chất lượng sản phẩm, hàng hoá có mức độ rủi ro trung bình, mức độ rủi ro cao quy định trong Thông tư này được thực hiện theo quy định của pháp luật về chất lượng sản phẩm, hàng hoá, tiêu chuẩn, quy chuẩn kỹ thuật, yêu cầu quản lý quy định tại Phụ lục ban hành kèm theo Thông tư này và quy định của pháp luật có liên quan.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 5
      khoan: 1
      noi_dung: '1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 5
      khoan: 2
      noi_dung: '2. Trường hợp các văn bản quy phạm pháp luật, quy chuẩn kỹ thuật quốc gia dẫn chiếu áp dụng trong Danh mục sản phẩm, hàng hoá ban hành kèm theo Thông tư này được sửa đổi, bổ sung, thay thế thì thực hiện theo văn bản sửa đổi, bổ sung, thay thế.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 6
      khoan: 1
      noi_dung: '1. Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy đã được cấp cho sản phẩm, hàng hoá thuộc phạm vi điều chỉnh của Thông tư này đến trước ngày Thông tư có hiệu lực thi hành vẫn còn giá trị sử dụng được tiếp tục sử dụng cho đến hết thời hạn ghi trong Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy. Việc giám sát duy trì hiệu lực đối với Giấy chứng nhận hợp quy đã cấp trước ngày Thông tư này có hiệu lực thi hành tiếp tục thực hiện theo quy định tại thời điểm cấp Giấy chứng nhận hợp quy.'
      trang_pdf: 2
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 6
      khoan: 2
      noi_dung: '2. Đối với sản phẩm, hàng hoá có mức độ rủi ro cao, tổ chức, cá nhân sản xuất, kinh doanh, dịch vụ phải thực hiện quy định về truy xuất nguồn gốc sản phẩm, hàng hoá sau 06 tháng kể từ ngày Thông tư này có hiệu lực.'
      trang_pdf: 3
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 7
      khoan: 1
      noi_dung: '1. Cục Khoa học, Chiến lược và Lịch sử Công an có trách nhiệm hướng dẫn, kiểm tra, đôn đốc thực hiện Thông tư này.'
      trang_pdf: 3
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
    - dieu: 7
      khoan: 2
      noi_dung: '2. Thủ trưởng các đơn vị thuộc cơ quan Bộ Công an, Giám đốc Công an tỉnh, thành phố và tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Thông tư này. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, Công an các đơn vị, địa phương, tổ chức, cá nhân có liên quan báo cáo về Bộ Công an (qua Cục Khoa học, Chiến lược và Lịch sử Công an) để có hướng dẫn kịp thời./.'
      trang_pdf: 3
      sha256_pdf: c86f4bc0427b8b4b75dfbf2a9738db22e9b09eebad6b6e5f447b648fe9bb9a21
ghi_chu: 'PCCC và cứu nạn cứu hộ (8 sản phẩm), thiết bị an toàn giao thông, giám sát an ninh công cộng. Nền: Luật 55/2024/QH15. Tem kiểm định cũ hết 30/6/2026. TT 125 KHÔNG bãi tường minh QĐ 8378/6266/9981/QĐ-BCA — Điều 5 khoản 2 chỉ quy định dẫn chiếu chuyển tiếp (VB/danh mục được dẫn bị thay thì áp dụng văn bản mới); việc săn PDF bậc A cho các QĐ đó theo chan trên tệp riêng của từng QĐ.'
