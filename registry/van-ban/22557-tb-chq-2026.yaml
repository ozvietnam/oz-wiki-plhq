  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/6/VB_22557.pdf, id=106268, SHA-256 e3d69c592b9af023ce8308f6595991d3a3e0f628452859630dda8558ff6858c3): Thông báo số 22557/TB-CHQ ngày 05-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị đeo tay thông minh Watch GT 6 Pro phiên bản đường kính 46mm (ký mã hiệu ATM-B29, hoạt động bằng pin, màn hình cảm ứng AMOLED 1.47 inch độ phân giải 466 x 466 pixels, thân máy bằng hợp kim titanium kích thước 45.6 mm x 11.25 mm, trọng lượng 54g không gồm dây đeo, tích hợp loa, micro, cảm biến IMU 9 trục, cảm biến nhịp tim quang học, hỗ trợ Bluetooth 6.0, GPS, NFC, sạc không dây, không hỗ trợ Wi-Fi và không hỗ trợ eSIM, kết nối với thiết bị chủ qua Bluetooth để đàm thoại, truyền nhận dữ liệu và theo dõi sức khỏe), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
