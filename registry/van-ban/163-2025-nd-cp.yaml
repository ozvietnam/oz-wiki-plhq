  pham_vi: "Số hiệu 163/2025/NĐ-CP, ngày ban hành 29-06-2025, người ký Lê Thành Long, ngày hiệu lực 01-07-2025; thay thế 54/2017/NĐ-CP. Điều chỉnh Điều 13, khoản 4 Điều 29, khoản 3 Điều 34, khoản 5 Điều 38, khoản 2 Điều 41, khoản 6 Điều 54, khoản 4+5 Điều 60, khoản 3 Điều 69 của Luật Dược 2016; khoản 4, 5, 9, điểm a+c khoản 18, điểm d+đ khoản 32, khoản 33, 39, 43 Điều 1 Luật sửa đổi 2024. Căn cứ ban hành: Luật Tổ chức Chính phủ 18/02/2025 + Luật Tổ chức chính quyền địa phương 16/6/2025. OCR toàn văn 288 trang đã đọc: 129 Điều + 5 Phụ lục. Điều quan trọng: (1) Điều 19 - Điều kiện kinh doanh thuốc cổ truyền (5 mục - SX/XK/NK/bảo quản/bán buôn/bán lẻ dược liệu + thuốc dược liệu + thuốc cổ truyền); (2) Điều 87 - Quy định thông báo NK thuốc (5 ngày làm việc trước khi khai HQ, gửi UBND cấp tỉnh - chi tiết 7 trường thông tin); (3) Điều 88 - Kiểm nghiệm chất lượng thuốc trước khi lưu hành; (4) Điều 89-90 - Đăng ký lưu hành dược liệu, tá dược, vỏ nang; (5) Điều 125 - Lộ trình triển khai kiểm soát NK thuốc; (6) Điều 127 - Điều khoản chuyển tiếp; (7) Điều 128 - Sửa đổi NĐ 31/2021; (8) Điều 129 - Hiệu lực thi hành. Phụ lục: I (mẫu đơn đề nghị cấp GĐKLH), II (báo cáo XNK thuốc kiểm soát đặc biệt), III (các mẫu khác), IV-V (chưa rõ). CHÚ Ý: DM11/12/13 trong 09/2024/TT-BYT không phải do 163/2025/NĐ-CP quy định - 163/2025 chỉ là NĐ hướng dẫn Luật Dược, không thay đổi DM 09/2024/TT-BYT."
  hieu_luc_da_doi_chieu: true
  ngay: 2026-10-09
  boi: hermes
  canh_bao: "OCR bằng tesseract 5.5.3 + vie language model - chất lượng 90-95% (một số ký tự sai VD: cỗ/cổ, đuọc/dược, dạng/dạng). PDF gốc có digital signature nên đã strip bằng pikepdf trước khi OCR."
ghi_chu: "Căn cứ pháp lý hiện hành cho giấy phép NK thuốc, nguyên liệu làm thuốc. Phụ lục I-V quy định biểu mẫu cụ thể. Cần rà chi tiết các điều khoản về giấy phép nhập khẩu thuốc dùng ngoài da (Điều 87) và thuốc cổ truyền. Lộ trình 01-01-2028 cho báo cáo NK (Điều 87, 125) — cần theo dõi. Đã tải PDF bản ký số gốc 288 trang nhưng không có text layer."
