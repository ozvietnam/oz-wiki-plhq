xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn PDF Công báo số 821 + 822 ngày 11-11-2017 có lớp chữ (raw/download/congbaocdn.chinhphu.vn/119-2017-nd-cp.pdf, 57 trang, SHA-256 e33af890d97a79583ffbd5412da14ff2f78a7ebce0e4ac5554565c34ff7c2463), thẻ vanban.chinhphu.vn (docid=191735, Thủ tướng Nguyễn Xuân Phúc ký) và toàn văn PDF ký số (119.signed.pdf): số hiệu 119/2017/NĐ-CP, ban hành ngày 01-11-2017, có hiệu lực thi hành từ ngày 15-12-2017 (Điều 44, thay thế Nghị định 80/2013/NĐ-CP); gồm 4 Chương, 46 Điều quy định về hành vi vi phạm hành chính, hình thức và mức phạt, biện pháp khắc phục hậu quả, thẩm quyền lập biên bản và xử phạt trong lĩnh vực tiêu chuẩn, quy chuẩn kỹ thuật, đo lường, chất lượng sản phẩm, hàng hóa và nhãn hàng hóa (trong đó Điều 37 và khoản 4 Điều 42 quy định thẩm quyền xử phạt của cơ quan Hải quan); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Điều 2 và khoản 2 Điều 5 Nghị định 126/2021/NĐ-CP).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về hành vi vi phạm hành chính, hình thức xử phạt và mức phạt, biện pháp khắc phục hậu quả, thẩm quyền xử phạt và thẩm quyền lập biên bản vi phạm hành chính trong lĩnh vực tiêu chuẩn và quy chuẩn kỹ thuật; đo lường; chất lượng sản phẩm, hàng hóa (sau đây gọi tắt là lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa). 2. Các hành vi vi phạm hành chính khác trong lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa không được quy định tại Nghị định này thì áp dụng quy định tại các nghị định khác của Chính phủ về xử phạt vi phạm hành chính trong lĩnh vực quản lý nhà nước có liên quan để xử phạt. Đối với hàng hóa nhập khẩu chưa được thông quan thì áp dụng nghị định của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực hải quan để xử phạt đối với các vi phạm về tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa.'
      trang_pdf: 1
      sha256_pdf: e33af890d97a79583ffbd5412da14ff2f78a7ebce0e4ac5554565c34ff7c2463
    - dieu: 42
      khoan: 4
      noi_dung: '4. Người có thẩm quyền xử phạt của cơ quan Hải quan quy định tại Điều 37 Nghị định này có thẩm quyền lập biên bản vi phạm hành chính, xử phạt vi phạm hành chính đối với các hành vi vi phạm hành chính trong lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa quy định tại Nghị định này phát hiện được tại địa bàn thuộc thẩm quyền quản lý của Hải quan mà Nghị định của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực hải quan chưa quy định.'
      trang_pdf: 55
      sha256_pdf: e33af890d97a79583ffbd5412da14ff2f78a7ebce0e4ac5554565c34ff7c2463
    - dieu: 44
      noi_dung: 'Điều 44. Hiệu lực thi hành Nghị định này có hiệu lực thi hành từ ngày 15 tháng 12 năm 2017. Nghị định này thay thế Nghị định số 80/2013/NĐ-CP ngày 19 tháng 7 năm 2013 của Chính phủ quy định về xử phạt vi phạm hành chính trong lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa.'
      trang_pdf: 56
      sha256_pdf: e33af890d97a79583ffbd5412da14ff2f78a7ebce0e4ac5554565c34ff7c2463
    - dieu: 45
      noi_dung: 'Điều 45. Quy định chuyển tiếp Đối với hành vi vi phạm hành chính trong lĩnh vực tiêu chuẩn, đo lường và chất lượng sản phẩm, hàng hóa xảy ra trước khi Nghị định này có hiệu lực mà sau đó mới bị phát hiện hoặc đang xem xét giải quyết thì áp dụng các quy định có lợi cho tổ chức, cá nhân vi phạm.'
      trang_pdf: 56
      sha256_pdf: e33af890d97a79583ffbd5412da14ff2f78a7ebce0e4ac5554565c34ff7c2463
ghi_chu: 'Văn bản gốc quy định xử phạt vi phạm hành chính trong lĩnh vực tiêu chuẩn, đo lường, chất lượng sản phẩm, hàng hóa, công bố hợp chuẩn/hợp quy và nhãn hàng hóa; được sửa đổi, bổ sung một số điều bởi Điều 2 và khoản 2 Điều 5 Nghị định 126/2021/NĐ-CP.'
