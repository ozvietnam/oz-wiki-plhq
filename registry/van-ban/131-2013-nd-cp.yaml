xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=170270) và toàn văn PDF đính kèm (131-nd.pdf, Thủ tướng Nguyễn Tấn Dũng ký): ban hành 16-10-2013, có hiệu lực từ 15-12-2013 (Điều 41), thay thế Nghị định 47/2009/NĐ-CP và Nghị định 109/2011/NĐ-CP; đang còn hiệu lực, được sửa đổi, bổ sung một số điều bởi Nghị định 28/2017/NĐ-CP, Nghị định 46/2017/NĐ-CP và Nghị định 129/2021/NĐ-CP (NĐ 129/2021/NĐ-CP chưa nạp vào sổ).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 2
      noi_dung: Điều 2. Quy định khung phạt tiền, thẩm quyền phạt tiền đối với cá nhân, tổ chức 1. Mức phạt tiền tối đa trong lĩnh vực quyền tác giả, quyền liên quan đối với cá nhân là 250.000.000 đồng, đối với tổ chức là 500.000.000 đẳng.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Biện pháp khắc phục hậu quả Ngoài các biện pháp khắc phục hậu quả quy định tại các điểm đ, đ, e và g Khoản 1 Điều 28 của Luật xử lý vi phạm hành chính, hành vi vi phạm hành chính về quyền tác giả, quyền liên quan còn có thé bị áp dụng một hoặc các biện pháp khắc phục hậu quả sau đây: 1. Buộc sửa lại đúng tên tác giả, tên tac phẩm, tên người biểu diễn;'
      trang_pdf: 2
    - dieu: 8
      noi_dung: 'Điều 8. Hành vi vận chuyển, tàng trữ hàng hoá sao chép lậu 1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi vận chuyển hàng bóa được sản xuất mà không được phép của chủ thể quyén tác giả, quyên liên quan. 2. Phạt tiền từ 5.000. 000 đồng đến 10.000.000 đồng đối với hành vi tang trữ hàng hóa được sản xuất mà không được phép của chủ thể quyền tác giả, quyền liên quan. 3. Hình thức xử phạt bé sung:'
      trang_pdf: 4
    - dieu: 13
      noi_dung: Điều 13. Hành vi xâm phạm quyền cho phép biểu diễn tác phẩm trước công chúng __1. Phat tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi biểu diễn trực tiếp tác phẩm trước công chúng mà không được phép của chủ sở hữu quyên tác giả theo quy định.
      trang_pdf: 5
    - dieu: 17
      noi_dung: 'Điều 17. Hành vi xâm phạm quyền truyền đạt tác phẩm đến công chúng .1, Phat tiền từ 15.000.000 đồng đến 30.000.000 đồng đối với hành vi truyền đạt tác phẩm đến công chúng bang phương tiện hữu tuyến, vô tuyên, mạng thông tin điện tử hoặc bat kỳ phương tiện kỹ thuật nào mà không được phép của chủ sở hữu quyên tác gia theo quy định. 2. Biện pháp khắc phục hậu quả: Buộc dỡ bỏ bản sao tác phẩm vi phạm đối với hành vi quy định tại Khoản | Điêu này.'
      trang_pdf: 6
    - dieu: 22
      noi_dung: 'Điều 22. Hành vi xâm phạm quyền báo vệ sự toàn vẹn hình tượng biểu điễn 1. Phat tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hanh vi tự ý sửa chữa, cắt xén hình tượng biểu diễn gây phương hại đến danh dự và uy tín của người biểu điễn. 2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi xuyên tac hình tượng biểu diễn gây phương hại đến danh dự và uy tín của người biểu diễn. 3. Biện pháp khắc phục hậu quả:'
      trang_pdf: 8
    - dieu: 26
      noi_dung: 'Điều 26. Hành vi xâm phạm quyền phân phối đến công chúng bản gốc hoặc ban sao cuộc biểu diễn 1. Phạt tiền từ 10.000.000 đồng đến 30.000.000 đồng đối với hành vi phân phối đến công chúng bản gốc hoặc bản sao cuộc biểu diễn mà không được phép của chủ sở hữu quyền của người biểu diễn. 2. Biện pháp khắc phục hậu quả:'
      trang_pdf: 9
    - dieu: 31
      noi_dung: 'Điều 31. Hành vi xâm phạm quyền phân phối đến công chúng chương trình phát sóng 1. Phạt tiền từ 10.000.000 đồng đến 30.000.000 đồng đối với hành vi phân phôi đên công chúng bản sao chương trình phát sóng mà không được phép của chủ sở hữu quyền của tổ chức phát sóng. 2. Biện pháp khắc phục hậu quả:'
      trang_pdf: 11
    - dieu: 35
      noi_dung: Điều 35. Hành vi xâm phạm quyền áp dụng biện pháp công nghệ để tự bao vệ quyền liên quan 1. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi đỡ bỏ hoặc thay đổi thông tin quản lý quyền dưới hình thức điện tử mà không được phép của chủ sở hữu quyền liên quan.
      trang_pdf: 12
    - dieu: 41
      noi_dung: Điều 41. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành tử ngày 15 thang 12 năm 2013. 2. Nghị định số 47/2009/NĐ-CP ngày 13 tháng 5 năm 2009 của Chính phủ quy định xử phạt vi phạm hành chính về quyền tác giả, quyền liên „quan và Nghị định số 109/2011/NĐ-CP ngày 02 tháng 12 năm 2011 sửa đổi, bổ sung.một số điều của Nghị định số 47/2009/NĐ-CP ngày 13 tháng 5 năm 2009 của Chính phủ quy định xử phạt vi phạm hành chính về quyền tác giả,
      trang_pdf: 17
ghi_chu: VẪN CÒN HIỆU LỰC — NĐ 17/2023 Điều 115 khoản 2 KHÔNG bãi bỏ (dù nhiều tóm tắt ghi nhầm); sửa đổi bởi NĐ 46/2017 và NĐ 28/2017. Chế tài chính với phần mềm lậu/key gray.
