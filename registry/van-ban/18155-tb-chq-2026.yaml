xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/29/2.VB_18155.pdf, id=104917, SHA-256 e8d02ddba1f3ce34b4bf05329117bbe835daf184b4aef413cd14b61373c92c53): Thông báo số 18155/TB-CHQ ngày 26-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ linh kiện đồng bộ dùng để sản xuất bình chữa cháy bột khô ABC-8kg (bình chữa cháy bột khô ABC 8kg bán thành phẩm ở dạng chưa lắp ráp, tháo rời / Semi-finished ABC-8kg Dry Powder Fire Extinguisher Assembly Kit, ký mã hiệu CKD-ABC8; gồm 08 linh kiện: vỏ bình chữa cháy bằng thép chuyên dụng dày 1,35 mm chưa nạp khí đẩy, có nắp đậy nhựa và đã chứa sẵn 8 kg bột chữa cháy khô ABC gồm Monoammonium Phosphate và Ammonium Sulfate; cụm van bằng hợp kim đồng kèm gioăng cao su; chốt cài an toàn bằng thép mạ kẽm; đồng hồ áp suất cơ; ống hút bột bằng nhựa kỹ thuật; khóa niêm phong bằng nhựa; vòi phun bằng nhựa tổng hợp; đai cố định), phân loại vào nhóm 84.24, phân nhóm 8424.10, mã số 8424.10.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Bình chữa cháy bột khô ABC 8kg bán thành phẩm ở dạng chưa lắp ráp, tháo rời (ký mã hiệu CKD-ABC8, gồm 08 linh kiện: vỏ bình thép đã chứa sẵn 8 kg bột chữa cháy ABC nhưng chưa nạp khí đẩy, cụm van hợp kim đồng, chốt cài an toàn, đồng hồ áp suất, ống hút bột, khóa niêm phong, vòi phun, đai cố định) thuộc nhóm 84.24, phân nhóm 8424.10, mã số 8424.10.90.'
