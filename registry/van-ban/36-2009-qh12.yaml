  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1 Sửa đổi, bổ sung một số điều của Luật sở hữu trí tuệ: 1. Điều 3 được sửa đổi, bổ sung như sau: “Điều 3. Đối tượng quyền sở hữu trí tuệ 1. Đối tượng quyền tác giả bao gồm tác phẩm văn học, nghệ thuật, khoa học; đối tượng quyền liên quan đến quyền tác giả bao gồm cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng, tín hiệu vệ tinh mang chương trình được mã hoá.'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2 Thay cụm từ “Bộ Văn hóa - Thông tin” bằng cụm từ “Bộ Văn hóa, Thể thao và Du lịch” tại các khoản 2, 3 và 5 Điều 11, điểm a khoản 2 Điều 50, khoản 4 Điều 51 của Luật sở hữu trí tuệ số 50/2005/QH11.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3 1.Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2010. 2. Chính phủ quy định chi tiết và hướng dẫn thi hành các điều, khoản được giao trong Luật; hướng dẫn những nội dung cần thiết khác của Luật này để đáp ứng yêu cầu quản lý nhà nước.
      trang_pdf: 1
ghi_chu: Lần sửa đổi thứ nhất của Luật Sở hữu trí tuệ.
