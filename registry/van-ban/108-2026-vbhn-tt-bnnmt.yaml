xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=220179) và toàn văn PDF ký số (108-vbhn-bnnmt.signed.pdf, 16 trang, 3 chương 19 điều và Phụ lục I–V, Thứ trưởng Nguyễn Hoàng Hiệp ký): xác thực ngày 02-11-2026, đang còn hiệu lực; hợp nhất Thông tư 35/2015/TT-BNNPTNT ngày 14-10-2015 quy định về kiểm dịch thực vật nội địa (hiệu lực 30-11-2015) và Thông tư 12/2025/TT-BNNMT ngày 19-06-2025 (hiệu lực 01-07-2025)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định các nội dung về kiểm dịch thực vật nội địa trên phạm vi toàn quốc.
      trang_pdf: 2
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với tổ chức, cá nhân trong nước và tổ chức cá nhân nước ngoài có hoạt động liên quan đến kiểm dịch thực vật nội địa tại Việt Nam.
      trang_pdf: 2
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 3
      noi_dung: Điều 3. Phí và lệ phí Chủ vật thể phải nộp phí, lệ phí kiểm dịch thực vật theo quy định của pháp luật về phí và lệ phí. Chương II NỘI DUNG CÔNG TÁC KIỂM DỊCH THỰC VẬT NỘI ĐỊA
      trang_pdf: 2
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 6
      noi_dung: 3 1. Xây dựng vùng không nhiễm sinh vật gây hại trên các cây trồng chủ lực có tiềm năng xuất khẩu tại địa phương, đáp ứng quy định kiểm dịch thực vật của nước nhập khẩu. 2. Áp dụng các biện pháp để duy trì các vùng không nhiễm dịch hại đã được thiết lập.
      trang_pdf: 3
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 8
      noi_dung: Điều 8. Hồ sơ và trình tự, thủ tục kiểm dịch thực vật đối với các lô vật thể vận chuyển từ vùng nhiễm đối tượng kiểm dịch thực vật 1. Hồ sơ đăng ký kiểm dịch thực vật Giấy đăng ký kiểm dịch thực vật theo mẫu quy định tại Phụ lục II ban hành kèm theo Thông tư này. 2. Đăng ký kiểm dịch thực vật Chủ vật thể nộp trực tiếp 01 bộ hồ sơ đăng ký cho cơ quan kiểm dịch thực vật nơi gần nhất.
      trang_pdf: 3
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 10
      noi_dung: Điều 10. Quản lý vật thể nhiễm đối tượng kiểm dịch thực vật đã xử lý tại cửa khẩu được đưa về sử dụng tại địa phương 1. Theo dõi, giám sát chặt chẽ tình trạng nhiễm sinh vật gây hại trên các lô vật thể đã được xử lý tại cửa khẩu vận chuyển về địa phương theo thông báo của cơ quan kiểm dịch thực vật cửa khẩu.
      trang_pdf: 5
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 12
      noi_dung: Điều 12. Giám sát xử lý vật thể thuộc diện kiểm dịch thực vật bảo quản tại địa phương Chi cục Trồng trọt và Bảo vệ thực vật giám sát hoạt động xử lý vật thể thuộc diện kiểm dịch thực vật tại địa phương theo thông báo của tổ chức hành nghề xử lý vật thể thuộc diện kiểm dịch thực vật.
      trang_pdf: 5
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 14
      noi_dung: Điều 14. Trách nhiệm của Cục Trồng trọt và Bảo vệ thực vật 3 Cục trưởng Cục Trồng trọt và Bảo vệ thực vật 4 có trách nhiệm giúp Bộ trưởng Bộ Nông nghiệp và Môi trường 5 chỉ đạo, hướng dẫn, kiểm tra các Cơ quan chuyên ngành bảo vệ và kiểm dịch thực vật cấp tỉnh, các đơn vị trực thuộc Cục, các tổ chức, cá nhân có liên quan trong việc tổ chức, thực hiện công tác kiểm dịch thực vật nội địa theo đúng các quy định của Thông tư này.
      trang_pdf: 6
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 16
      noi_dung: Điều 16. Trách nhiệm của các Chi cục Kiểm dịch thực vật vùng và Chi cục Trồng trọt và Bảo vệ thực vật 1. Trách nhiệm của Chi cục Kiểm dịch thực vật vùng a) Hướng dẫn, đôn đốc các Cơ quan chuyên ngành bảo vệ và kiểm dịch thực vật cấp tỉnh trong vùng phụ trách thực hiện công tác kiểm dịch thực vật nội địa; b) Tập huấn về chuyên môn, nghiệp vụ kiểm dịch thực vật nội địa cho các cơ quan bảo vệ và kiểm dịch thực vật ở địa phương;
      trang_pdf: 6
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
    - dieu: 19
      noi_dung: Điều 19. Tổ chức thực hiện Cục trưởng Cục Trồng trọt và Bảo vệ thực vật 9 chịu trách nhiệm tổ chức thực hiện Thông tư này. Cụm từ “Sở Nông nghiệp và Phát triển nông thôn” được thay thế bởi cụm từ “Sở Nông nghiệp và Môi trường” theo quy định tại Điều 29 Thông tư số 12/2025/TT-BNNMT, có hiệu lực kể từ ngày 01 tháng 07 năm 2025. 8
      trang_pdf: 7
      sha256_pdf: 21fd5b7e5b57067d4403ce32168d35f37a2806e9e47c4068b8528e66089b6ddb
