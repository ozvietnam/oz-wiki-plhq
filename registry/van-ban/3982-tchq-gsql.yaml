ghi_chu: 'Hướng dẫn nghiệp vụ hải quan thực hiện Thông tư 23/2021/TT-BTC về quản lý, thông quan, bàn giao, điều chuyển và thủ tục tạm xuất - tái nhập tem điện tử rượu, thuốc lá nhập khẩu.'
