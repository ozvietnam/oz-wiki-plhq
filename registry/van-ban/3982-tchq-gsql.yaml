xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu PDF ký số trên Cổng Hải quan (id=80999, 2 trang, Phó Tổng cục trưởng Mai Xuân Thành ký ngày 26-09-2022, SHA-256 f12032b3ac0390bd1df8bc119c51950fcbda240e915242f714d6e5871e2779bb): hướng dẫn Cục Hải quan các tỉnh, thành phố xử lý 4 nhóm vướng mắc khi thực hiện Thông tư 23/2021/TT-BTC ngày 30-03-2021 về in, phát hành, quản lý và sử dụng tem điện tử rượu và tem điện tử thuốc lá nhập khẩu: (1) phạm vi điều chỉnh: chỉ áp dụng cho rượu, thuốc lá nhập khẩu để kinh doanh tiêu dùng trong nước, hàng bán tại cửa hàng miễn thuế thực hiện theo Nghị định 100/2020/NĐ-CP; (2) thủ tục thông quan: sau khi hoàn thành thủ tục hải quan, Chi cục hải quan thông quan lô hàng và lập biên bản bàn giao tem điện tử tương ứng lượng hàng thực tế nhập khẩu để doanh nghiệp dán tem trước khi đưa ra thị trường (khoản 4 Điều 3 TT 23/2021/TT-BTC); (3) lập, điều chỉnh kế hoạch sử dụng tem điện tử trên Hệ thống trước 30/4 và 31/8, đăng ký bổ sung khi phát sinh nhu cầu nhập khẩu hoặc mua hàng tịch thu/đấu giá, và điều chuyển tem giữa các Chi cục/Cục Hải quan; (4) thủ tục mở tờ khai tạm xuất - tái nhập tem điện tử khi đưa tem ra cơ sở sản xuất ở nước ngoài để dán trên sản phẩm và xử lý báo cáo tem hư hỏng, nhàu nát'
  hieu_luc_da_doi_chieu: true
