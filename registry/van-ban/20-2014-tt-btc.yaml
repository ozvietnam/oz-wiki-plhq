ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #404). Quy định điều kiện, thủ tục cấp giấy phép, thủ tục hải quan và chính sách thuế đối với xe ô tô, xe mô tô nhập khẩu theo chế độ tài sản di chuyển của Việt kiều hồi hương; đã bị bãi bỏ toàn bộ từ 01-01-2023 theo khoản 1 Điều 2 Thông tư 79/2022/TT-BTC ngày 30-12-2022.'
