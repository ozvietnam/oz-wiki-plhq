  pham_vi: 'Đã đọc toàn văn PDF ký số trên datafiles.chinhphu.vn (tt-20.signed.pdf, 13 trang, người ký Thứ trưởng Vũ Thị Mai) và đối chiếu thẻ vanban.chinhphu.vn (docid=172616), congbao.chinhphu.vn (ID 6642): gồm 3 chương, 11 điều và mẫu giấy phép GP/2014/NK OTO/MOTO-VKHH; Điều 11 khoản 1 quy định có hiệu lực thi hành kể từ ngày 01-04-2014, khoản 2 bãi bỏ Thông tư 118/2009/TT-BTC ngày 09-06-2009, điểm 2.2.c mục I Thông tư 16/2008/TT-BTC, Thông tư 215/2010/TT-BTC và điểm 1.1 mục I Thông tư 02/2001/TT-TCHQ. Đã đối chiếu tình trạng hiện hành từ nguồn bậc A trên vanban.chinhphu.vn (docid=207192) và toàn văn PDF ký số Thông tư 79/2022/TT-BTC (datafiles.chinhphu.vn/cpp/files/vbpq/2023/01/79-btc.pdf, trang 4–5, người ký Thứ trưởng Nguyễn Đức Chi): hết hiệu lực toàn bộ từ ngày 01-01-2023 do bị bãi bỏ theo khoản 1 Điều 2 và khoản 1 Điều 4 Thông tư 79/2022/TT-BTC ngày 30-12-2022 của Bộ trưởng Bộ Tài chính (việc nhập khẩu xe ô tô, xe mô tô theo chế độ tài sản di chuyển chuyển sang thực hiện theo Thông tư 143/2015/TT-BTC và Thông tư 45/2022/TT-BTC).'
