  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/20/5.VB_15384.pdf, id=103279, SHA-256 8eba060403afda3319f521d49f57ddba698665c72828da3bf51cc255e6bc96d1): Thông báo số 15384/TB-CHQ ngày 17-04-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bo mạch chủ dành cho máy tính xách tay có chứa CPU (ký, mã hiệu MTM40, dùng cho máy tính xách tay model ThinkPad P14s Gen 6; đã tích hợp bộ xử lý trung tâm CPU Intel Core Ultra 7 265H 2,2-5,3 GHz, bộ xử lý đồ họa GPU NVIDIA GeForce RTX 5060 Laptop GPU, bộ nhớ đồ họa VRAM GDDR7 SDRAM 16 Gb, chip chuyển mạch USB PI3USB102ZMEX, chip phân phối xung nhịp NB669GQ, chip nhớ BIOS NOR Flash SPI 8 Mb GD25LQ80EEIGR, IC điều khiển nhúng EC, các cổng giao tiếp I/O và mạch bảo vệ trên mạch in PCB đa lớp; khối lượng 0,16 kg/chiếc), phân loại vào nhóm 84.71, phân nhóm 8471.50, mã số 8471.50.10; có hiệu lực từ ngày ký'
