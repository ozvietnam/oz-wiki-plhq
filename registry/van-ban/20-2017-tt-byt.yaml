# Sổ đăng ký văn bản — sửa qua PR. Lược đồ: docs/luoc-do-so-dang-ky.md
so_hieu: 20/2017/TT-BYT
loai: THONG_TU
ten: Quy định chi tiết một số điều của Luật Dược và Nghị định số 54/2017/NĐ-CP ngày 08 tháng 5 năm 2017 của Chính phủ về thuốc và nguyên liệu làm thuốc phải kiểm soát đặc biệt
co_quan: BYT
ngay_ban_hanh: '2017-05-10'
