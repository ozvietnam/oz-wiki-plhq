  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về: 1. Các danh mục liên quan đến thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt bao gồm: a) Danh mục dược chất gây nghiện theo quy định tại Phụ lục I kèm theo Thông tư này và Bảng giới hạn nồng độ, hàm lượng dược chất gây nghiện trong thuốc dạng phối hợp theo quy định tại Phụ lục IV kèm theo Thông tư này;'
      trang_pdf: 1
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Các quy định về danh mục liên quan đến thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt và hồ sơ, sổ sách và lưu giữ chứng từ, tài liệu có liên quan về thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt quy định tại Thông tư này áp dụng đối với tất cả các cơ sở kinh doanh dược và các cơ sở được quy định tại khoản 2 Điều này.
      trang_pdf: 2
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 3
      noi_dung: a) Chứa một hoặc nhiều dược chất gây nghiện hoặc thuốc chứa dược chất gây nghiện phối hợp với dược chất hướng thần và có hoặc không có tiền chất dùng làm thuốc quy định tại Phụ lục I, II và III kèm theo Thông tư này;
      trang_pdf: 3
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 6
      noi_dung: 'Điều 6. Cấp phát, sử dụng, hủy thuốc 1. Đối với cơ sở khám bệnh, chữa bệnh, trừ cơ sở điều trị nghiện chất dạng thuốc phiện bằng thuốc thay thế: việc cấp phát, sử dụng thực hiện theo quy định tại Thông tư số 23/2011/TT-BYT ngày 10 tháng 6 năm 2011 của Bộ trưởng Bộ Y tế hướng dẫn sử dụng thuốc trong các cơ sở y tế có giường bệnh (sau đây gọi tắt là Thông tư số 23/2011/TT-BYT).'
      trang_pdf: 6
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 8
      noi_dung: 'Điều 8. Báo cáo 1. Báo cáo định kỳ: a) Trước ngày 15 tháng 01 hàng năm, cơ sở khám bệnh, chữa bệnh, cơ sở cai nghiện bắt buộc, cơ sở nghiên cứu, đào tạo chuyên ngành y dược, cơ sở có hoạt động dược không vì mục đích thương mại khác lập báo cáo xuất, nhập, tồn kho, sử dụng thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, thuốc phóng xạ, thuốc dạng phối hợp có chứa tiền chất gửi Sở Y tế nơi cơ sở đặt trụ sở theo mẫu báo cáo quy định tại Phụ'
      trang_pdf: 9
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 10
      noi_dung: Điều 10. Hồ sơ đề nghị cung cấp thuốc phóng xạ 1. Đơn đề nghị cung cấp thuốc phóng xạ của cơ sở khám bệnh, chữa bệnh theo mẫu đơn quy định tại Phụ lục XIII kèm theo Thông tư này.
      trang_pdf: 10
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 12
      noi_dung: 'Điều 12. Hồ sơ, sổ sách đối với cơ sở sản xuất 1. Cơ sở sản xuất thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phải lập và ghi chép đầy đủ các loại sổ theo dõi sau đây: a) Sổ theo dõi pha chế, sản xuất thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất theo mẫu sổ quy định tại Phụ lục XVI kèm theo Thông tư này;'
      trang_pdf: 11
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 14
      noi_dung: 'Điều 14. Hồ sơ sổ sách đối với cơ sở bán buôn 1. Cơ sở bán buôn thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất phải lập và ghi chép đầy đủ các hồ sơ sau đây: a) Sổ theo dõi xuất, nhập, tồn kho thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất theo mẫu sổ quy định tại Phụ lục VIII kèm theo Thông tư này;'
      trang_pdf: 13
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 16
      noi_dung: 'Điều 16. Hồ sơ sổ sách đối với cơ sở kinh doanh dịch vụ bảo quản thuốc, kinh doanh dịch vụ thử thuốc trên lâm sàng, kinh doanh dịch vụ thử tương đương sinh học của thuốc, kinh doanh dịch vụ kiểm nghiệm 1. Thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc: phải lập và ghi chép đầy đủ các loại hồ sơ, sổ sách theo dõi sau đây: a) Sổ theo dõi xuất, nhập,'
      trang_pdf: 15
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
    - dieu: 19
      noi_dung: Điều 19. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2017. 2. Thông tư số 19/2014/TT-BYT ngày 02 tháng 6 năm 2014 của Bộ trưởng Bộ Y tế quy định quản lý thuốc gây nghiện, thuốc hướng thần và tiền chất dùng làm thuốc hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 17
      sha256_pdf: 1dcd17de0a4081f795a701558e7d2f47291fe2ed3527ce3dac4c726362fdac16
ghi_chu: Quy định chi tiết về thuốc và nguyên liệu làm thuốc phải kiểm soát đặc biệt.
