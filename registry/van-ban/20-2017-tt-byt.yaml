  pham_vi: số hiệu, trích yếu, ngày ban hành 10-05-2017, hiệu lực 01-07-2017 trên Công báo số 645+646/2017 (congbao.chinhphu.vn); còn hiệu lực
  hieu_luc_da_doi_chieu: true
