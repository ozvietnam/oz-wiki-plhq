xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 439+440 ngày 16-03-2018 (raw/download/congbaocdn.chinhphu.vn/25-2018-nd-cp.pdf, 41 trang, trang 2–42 của số Công báo, phần lời 6 Điều ở trang 1–11 PDF, Phụ lục 18 mẫu/biểu mẫu ở trang 12–41 PDF, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 26-03-2018, SHA-256 d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa), toàn văn PDF ký số (25.signed.pdf, Thủ tướng Nguyễn Xuân Phúc ký), CSDL quốc gia vbpl.vn (ItemID=128674), cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/14106.htm) và trang wiki/sources/25-2018-nd-cp.md: ban hành 28-02-2018, có hiệu lực từ 01-05-2018 theo Điều 4; sửa đổi, bổ sung một số điều của Nghị định 60/2014/NĐ-CP về hoạt động in. Đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 72/2022/NĐ-CP từ 01-01-2023 và Nghị định 116/2026/NĐ-CP từ 08-04-2026).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Sửa đổi, bổ sung khoản 1 Điều 1 như sau: “1. Nghị định này quy định về hoạt động in bao gồm: Điều kiện hoạt động cơ sở in; chế bản, in, gia công sau in; sao chụp (sau đây gọi là photocopy); nhập khẩu, quản lý thiết bị ngành in. Hoạt động chế bản, in, gia công sau in đối với xuất bản phẩm thực hiện theo quy định của pháp luật về xuất bản.”'
      trang_pdf: 1
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 2
      noi_dung: '2. Sửa đổi, bổ sung Điều 3 như sau: “Điều 3. Chính sách của Nhà nước đối với hoạt động in 1. Khuyến khích, ưu đãi đầu tư ứng dụng công nghệ, kỹ thuật, thiết bị in tiết kiệm năng lượng, nguyên liệu, sức lao động và thân thiện với môi trường; hạn chế sử dụng, không sản xuất và nhập khẩu thiết bị in có công nghệ lạc hậu, gây ô nhiễm môi trường. 2. Áp dụng chính sách ưu đãi về đầu tư, thuế, tiền thuê đất đối với hoạt động in phục vụ nhiệm vụ chính trị, quốc phòng, an ninh và các nhiệm vụ trọng yếu khác của đất nước theo quy định của pháp luật”.'
      trang_pdf: 1
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 4
      noi_dung: '4. Sửa đổi, bổ sung các điểm b, c và đ khoản 1 Điều 11 như sau: a) Sửa đổi, bổ sung điểm b, điểm c như sau: “b) Có thiết bị phù hợp để thực hiện một hoặc nhiều công đoạn chế bản, in, gia công sau in theo nhu cầu, khả năng hoạt động của cơ sở in và đúng với nội dung đơn đề nghị cấp giấy phép hoạt động in hoặc tờ khai đăng ký hoạt động cơ sở in quy định tại Điều 12 và Điều 14 Nghị định này; c) Có mặt bằng hợp pháp để thực hiện chế bản, in, gia công sau in.” b) Sửa đổi, bổ sung Điểm đ như sau: “đ) Có chủ sở hữu là tổ chức, cá nhân Việt Nam và có người đứng đầu là công dân Việt Nam, thường trú hợp pháp tại Việt Nam, có năng lực hành vi dân sự đầy đủ.”'
      trang_pdf: 3
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 8
      noi_dung: '8. Sửa đổi, bổ sung khoản 5 Điều 15 như sau: “5. Lưu giữ đầy đủ hồ sơ liên quan đến sản phẩm nhận chế bản, in, gia công sau in trong 24 tháng, kể từ ngày ký hợp đồng in. Hồ sơ phải lưu giữ gồm có: a) Bản chính hợp đồng chế bản, in, gia công sau in hoặc phiếu đặt in quy định tại khoản 1 Điều 16 Nghị định này; b) Bản thảo (bản mẫu) của sản phẩm đặt in đã được đóng dấu hoặc có chữ ký của tổ chức, cá nhân có sản phẩm đặt in được lưu giữ theo một trong các dạng: Bản thảo trên giấy thông thường; bản thảo in trên giấy can; bản thảo in trên phim; bản thảo điện tử là tệp tin được chứa trong đĩa CD, đĩa CD-ROM, USB, ổ cứng hoặc các thiết bị lưu trữ dữ liệu khác; c) Giấy tờ liên quan đến sản phẩm đặt in quy định tại các Điều 17, 19, 20 và 22 Nghị định này; d) Sổ ghi chép, quản lý ấn phẩm nhận chế bản, in, gia công sau in được ghi đầy đủ thông tin.”'
      trang_pdf: 6
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 10
      noi_dung: '10. Sửa đổi, bổ sung Điều 19 như sau: “Điều 19. Nhận chế bản, in, gia công sau in hóa đơn tài chính, các loại thẻ, giấy tờ có sẵn mệnh giá hoặc dùng để ghi mệnh giá 1. Cơ sở in chỉ được nhận chế bản, in, gia công sau in hóa đơn tài chính, các loại thẻ, giấy tờ có sẵn mệnh giá hoặc dùng để ghi mệnh giá khi tổ chức, cá nhân đặt in cung cấp các loại giấy tờ theo quy định của pháp luật chuyên ngành về các yêu cầu thủ tục khi in sản phẩm đó. 2. Tổ chức, cá nhân có sản phẩm đặt in phải chịu trách nhiệm về sản phẩm đặt in với cơ sở in.”'
      trang_pdf: 7
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 13
      noi_dung: '13. Sửa đổi, bổ sung Điều 23 như sau: “Điều 23. Chế bản, in, gia công sau in cho tổ chức, cá nhân nước ngoài 1. Khi trực tiếp nhận chế bản, in, gia công sau in cho tổ chức, cá nhân ở nước ngoài (không hiện diện tại Việt Nam), cơ sở in thực hiện theo quy định sau đây: a) Người đứng đầu cơ sở in phải chịu trách nhiệm trước pháp luật về nội dung của sản phẩm in; b) Chỉ nhận chế bản, in, gia công sau in loại sản phẩm in ghi trong giấy phép hoạt động in hoặc nội dung đã được xác nhận đăng ký hoạt động in; c) Có hợp đồng với tổ chức, cá nhân đặt chế bản, in, gia công sau in. Trong hợp đồng phải thể hiện thông tin về tên, địa chỉ của tổ chức, cá nhân nước ngoài có sản phẩm đặt chế bản, in, gia công sau in; thông tin về tên, loại sản phẩm in, số lượng in, địa điểm sản xuất, thời gian xuất khẩu, tên cửa khẩu xuất khẩu, quốc gia nhập khẩu sản phẩm in và các thông tin khác có liên quan; d) Cập nhật thông tin của sản phẩm nhận chế bản, in, gia công sau in vào “Sổ quản lý ấn phẩm nhận chế bản, in, gia công sau in”; đ) Trường hợp nhận chế bản, in, gia công sau in sản phẩm là báo, tạp chí, tờ rời, tờ gấp và các sản phẩm in khác có nội dung về chính trị, lịch sử, địa lý, tôn giáo, địa giới hành chính Việt Nam, chủ quyền quốc gia, cơ sở in phải có văn bản khai báo đầy đủ, chính xác thông tin về tên, địa chỉ của tổ chức, cá nhân nước ngoài đặt chế bản, in, gia công sau in; thông tin về tên, loại sản phẩm in, số lượng in, địa điểm sản xuất, cửa khẩu xuất khẩu sản phẩm in. Văn bản khai báo gửi qua dịch vụ công trực tuyến hoặc dịch vụ bưu chính, chuyển phát hoặc nộp trực tiếp đến cơ quan quản lý nhà nước về hoạt động in cấp tỉnh nơi cơ sở in thực hiện chế bản, in, gia công sau in chậm nhất 01 ngày sau khi có hợp đồng quy định tại điểm c khoản này; e) Xuất khẩu 100% sản phẩm in ra nước ngoài. 2. Khi nhận chế bản, in, gia công sau in cho tổ chức, cá nhân ở nước ngoài (không hiện diện tại Việt Nam) thông qua tổ chức, cá nhân trung gian tại Việt Nam, cơ sở in thực hiện theo quy định sau đây: a) Tuân thủ quy định tại khoản 1 Điều này; b) Yêu cầu tổ chức, cá nhân trung gian đặt chế bản, in, gia công sau in cung cấp hồ sơ hải quan thể hiện việc xuất khẩu 100% số lượng sản phẩm in để lưu giữ tại cơ sở in trong thời hạn 24 tháng, kể từ ngày xuất khẩu. 3. Việc nhận chế bản, in, gia công cho tổ chức, cá nhân nước ngoài đang hoạt động tại Việt Nam phải tuân thủ quy định tại Nghị định này như đối với tổ chức, cá nhân Việt Nam. 4. Tổ chức, cá nhân có hợp đồng in với cơ sở in chịu trách nhiệm về bản quyền của sản phẩm đặt in. 5. Trường hợp có nhu cầu phát hành hoặc sử dụng sản phẩm in tại Việt Nam, cơ sở in hoặc tổ chức, cá nhân đặt chế bản, in, gia công sau in phải làm thủ tục nhập khẩu theo quy định của pháp luật.”'
      trang_pdf: 7
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 15
      noi_dung: '15. Sửa đổi, bổ sung điểm b khoản 1 và khoản 3 Điều 27 như sau: a) Sửa đổi, bổ sung điểm b khoản 1 như sau: “b) Máy in sử dụng công nghệ kỹ thuật số, ốp-xét (offset), flexo, ống đồng, letterpress;” b) Sửa đổi, bổ sung khoản 3 như sau: “3. Bộ trưởng Bộ Thông tin và Truyền thông quy định chi tiết chủng loại thiết bị in nhập khẩu phù hợp với sự phát triển của công nghệ, thiết bị in trong từng thời kỳ. Thông tin của thiết bị in nhập khẩu phải được cập nhật vào cơ sở dữ liệu quốc gia về hoạt động in.”'
      trang_pdf: 9
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 16
      noi_dung: '16. Sửa đổi, bổ sung khoản 1 và khoản 3 Điều 28 như sau: a) Sửa đổi, bổ sung khoản 1 như sau: “1. Trước khi nhập khẩu, tổ chức, cá nhân phải có hồ sơ đề nghị cấp giấy phép nhập khẩu thiết bị in gửi qua hệ thống dịch vụ công trực tuyến hoặc dịch vụ bưu chính, chuyển phát hoặc nộp hồ sơ trực tiếp tại Bộ Thông tin và Truyền thông.” b) Sửa đổi, bổ sung khoản 3 như sau: “3. Trong thời gian 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ, Bộ Thông tin và Truyền thông phải cấp giấy phép nhập khẩu thiết bị in; trường hợp không cấp giấy phép phải có văn bản trả lời nêu rõ lý do. Hồ sơ đề nghị cấp giấy phép không thể hiện đầy đủ thông tin theo mẫu quy định bị từ chối cấp giấy phép.”'
      trang_pdf: 9
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 1
      khoan: 17
      noi_dung: '17. Sửa đổi khoản 2, khoản 3 và bổ sung khoản 5, khoản 6 vào sau khoản 4 Điều 30 như sau: a) Sửa đổi, bổ sung khoản 2, khoản 3 như sau: “2. Đối với máy photocopy màu, máy in có chức năng photocopy màu phải đăng ký trước khi sử dụng, như sau: a) Tổ chức, cá nhân phải gửi hồ sơ đăng ký máy qua hệ thống dịch vụ công trực tuyến hoặc dịch vụ bưu chính, chuyển phát hoặc nộp hồ sơ trực tiếp tại Ủy ban nhân dân cấp tỉnh; b) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ, Ủy ban nhân dân cấp tỉnh phải xác nhận đăng ký bằng văn bản; trường hợp không xác nhận phải có văn bản trả lời nêu rõ lý do. 3. Hồ sơ đăng ký sử dụng máy photocopy màu, máy in có chức năng photocopy màu bao gồm: a) Đơn đăng ký sử dụng máy theo mẫu quy định; b) Bản sao có bản chính để đối chiếu hoặc bản sao có chứng thực nếu gửi bằng đường bưu chính, chuyển phát giấy phép nhập khẩu máy; hợp đồng và hóa đơn mua máy hoặc chứng từ thuê mua máy; c) Đơn đề nghị chuyển nhượng (đối với máy đã đăng ký sử dụng) có xác nhận của Ủy ban nhân dân cấp tỉnh nơi đã xác nhận đăng ký máy.” b) Bổ sung khoản 5, khoản 6 vào sau khoản 4 như sau: “5. Chuyển nhượng máy photocopy màu, máy in có chức năng photocopy màu: Tổ chức, cá nhân sử dụng máy đã đăng ký khi chuyển nhượng máy phải có hồ sơ gửi đến Ủy ban nhân dân cấp tỉnh nơi đã xác nhận đăng ký máy đó. Hồ sơ gồm: a) Đơn đề nghị chuyển nhượng máy theo mẫu quy định 02 bản; b) Bản sao có bản chính để đối chiếu hoặc bản sao có chứng thực nếu gửi bằng đường bưu chính, chuyển phát giấy tờ đảm bảo tư cách pháp nhân của cơ quan, tổ chức được chuyển nhượng máy; c) Bản chính giấy xác nhận đã đăng ký máy; d) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận được đơn đề nghị chuyển nhượng máy, Ủy ban nhân dân cấp tỉnh nơi đã xác nhận đăng ký máy xác nhận vào đơn chuyển nhượng, trả lại 01 bản cho cơ quan, tổ chức đề nghị chuyển nhượng máy, 01 bản lưu hồ sơ và cập nhật thay đổi đăng ký máy trong dữ liệu quản lý, trường hợp không xác nhận phải có văn bản trả lời nêu rõ lý do. 6. Thanh lý máy: Tổ chức, cá nhân sử dụng máy đã đăng ký, khi thanh lý phải có văn bản thông báo đến cơ quan quản lý nhà nước về hoạt động in nơi đã đăng ký máy, đồng thời giấy xác nhận đăng ký máy hết hiệu lực.”'
      trang_pdf: 9
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 2
      noi_dung: 'Ban hành kèm theo Nghị định này 18 mẫu, biểu mẫu gồm: Đơn, tờ khai, danh mục, giấy phép, giấy xác nhận, sổ, báo cáo để thực hiện các thủ tục hành chính và chế độ thông tin báo cáo trong hoạt động in.'
      trang_pdf: 10
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 4
      noi_dung: 'Nghị định này có hiệu lực thi hành từ ngày 01 tháng 5 năm 2018.'
      trang_pdf: 11
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 5
      noi_dung: '1. Cơ sở in đã được cấp giấy phép hoạt động in xuất bản phẩm theo quy định của Luật xuất bản được chế bản, in, gia công sau in các loại sản phẩm quy định tại Nghị định số 60/2014/NĐ-CP ngày 19 tháng 6 năm 2014 của Chính phủ quy định về hoạt động in và không phải làm thủ tục đề nghị cấp giấy phép hoạt động in, đăng ký hoạt động in. 2. Cơ sở in đã nhận chế bản, in, gia công sau in các sản phẩm in (đã có hợp đồng hoặc phiếu đặt in) trước ngày Nghị định này có hiệu lực thi hành phải tiếp tục thực hiện theo quy định tại Nghị định số 60/2014/NĐ-CP ngày 19 tháng 6 năm 2014 của Chính phủ quy định về hoạt động in. 3. Tổ chức, cá nhân đã được cấp giấy phép nhập khẩu thiết bị in trước ngày Nghị định này có hiệu lực thi hành mà chưa hoàn thành thủ tục nhập khẩu phải tiếp tục thực hiện theo quy định tại Nghị định số 60/2014/NĐ-CP ngày 19 tháng 6 năm 2014 của Chính phủ quy định về hoạt động in.'
      trang_pdf: 11
      sha256_pdf: d0e52146a23f4cee41f34433282f689f8c656a44ba52702a5b74773164236aaa
    - dieu: 6
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./.'
      trang_pdf: 11
