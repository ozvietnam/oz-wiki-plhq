  pham_vi: "Đối chiếu Công báo Chính phủ (id=26051, Công báo số 439+440 năm 2018), toàn văn PDF ký số (25.signed.pdf, Thủ tướng Nguyễn Xuân Phúc ký), CSDL quốc gia vbpl.vn (ItemID=128674) và cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/14106.htm): ban hành 28-02-2018, có hiệu lực từ 01-05-2018 theo Điều 4; sửa đổi, bổ sung một số điều của Nghị định 60/2014/NĐ-CP về hoạt động in (đính chính trích yếu và quan hệ sửa đổi từ bản ghi cũ). Đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 72/2022/NĐ-CP từ 01-01-2023 và Nghị định 116/2026/NĐ-CP từ 08-04-2026)."
