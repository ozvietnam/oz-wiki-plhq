  pham_vi: 'Đối chiếu PDF Công báo số 349+350 ngày 26-04-2012 (7 trang lớp chữ, SHA-256 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be): ban hành 12-04-2012, hiệu lực từ 01-06-2012 (Điều 17, thay thế NĐ 88/2002/NĐ-CP); khoản 4 Điều 21 Nghị định 131/2022/NĐ-CP bãi bỏ điểm b khoản 1 Điều 8 và cụm từ tại điểm b khoản 2 Điều 9 từ 01-01-2023.'
