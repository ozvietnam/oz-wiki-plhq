  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về quản lý các hoạt động xuất khẩu, nhập khẩu văn hóa phẩm không nhằm mục đích kinh doanh. 2. Nghị định này không điều chỉnh việc quản lý xuất khẩu, nhập khẩu xuất bản phẩm, báo, tạp chí không nhằm mục đích kinh doanh. Hoạt động xuất khẩu, nhập khẩu xuất bản phẩm, báo, tạp chí thực hiện theo quy định của pháp luật về báo chí và xuất bản.
      trang_pdf: 1
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Cá nhân, tổ chức Việt Nam, cá nhân, tổ chức nước ngoài (sau đây gọi là cá nhân, tổ chức) có văn hóa phẩm xuất khẩu, nhập khẩu không nhằm mục đích kinh doanh.
      trang_pdf: 1
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. Hoạt động xuất khẩu, nhập khẩu văn hóa phẩm không nhằm mục đích kinh doanh (sau đây gọi là xuất khẩu, nhập khẩu văn hóa phẩm): Là hoạt động đưa từ'
      trang_pdf: 1
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 6
      noi_dung: 'Điều 6. Văn hóa phẩm cấm xuất khẩu, cấm nhập khẩu 1. Nghiêm cấm xuất khẩu, nhập khẩu các loại văn hóa phẩm sau đây: a) Có nội dung chống lại Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, phá hoại khối đoàn kết toàn dân; b) Có nội dung kích động bạo lực, tuyên truyền chiến tranh xâm lược, gây hận thù giữa các dân tộc và nhân dân các nước; kích động dâm ô, đồi trụy, tội ác; c) Có nội dung thuộc về bí mật nhà nước;'
      trang_pdf: 2
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 7
      noi_dung: Điều 7. Xuất khẩu văn hóa phẩm 1. Cá nhân, tổ chức có văn hóa phẩm xuất khẩu đã được sản xuất, công bố, phổ biến và lưu hành hợp pháp trên lãnh thổ Việt Nam khi xuất khẩu không cần giấy phép của cơ quan quản lý nhà nước về văn hóa, thể thao và du lịch, chỉ làm thủ tục hải quan theo quy định của pháp luật về hải quan, trừ trường hợp pháp luật có quy định khác.
      trang_pdf: 3
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 9
      noi_dung: Điều 9. Thủ tục cấp phép nhập khẩu văn hóa phẩm 1. Cá nhân, tổ chức nhập khẩu văn hóa phẩm trong các trường hợp quy định tại Điều 8 Nghị định này nộp hồ sơ đề nghị cấp giấy phép qua đường bưu điện hoặc trực tiếp tại trụ sở cơ quan quản lý nhà nước về văn hóa, thể thao và du lịch có thẩm quyền theo quy định.
      trang_pdf: 4
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 11
      noi_dung: Điều 11. Thủ tục Hải quan nhập khẩu văn hóa phẩm 1. Giấy phép nhập khẩu văn hóa phẩm của cơ quan quản lý nhà nước về văn hóa, thể thao và du lịch có thẩm quyền là căn cứ để cơ quan Hải quan làm thủ tục nhập khẩu.
      trang_pdf: 5
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 13
      noi_dung: 'Điều 13. Nhiệm vụ và quyền hạn của Bộ Văn hóa, Thể thao và Du lịch Bộ Văn hóa, Thể thao và Du lịch là cơ quan giúp Chính phủ thống nhất quản lý nhà nước về xuất khẩu, nhập khẩu văn hóa phẩm không nhằm mục đích kinh doanh có nhiệm vụ và quyền hạn sau:'
      trang_pdf: 5
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 14
      noi_dung: Điều 14. Nhiệm vụ và quyền hạn của Bộ Tài chính Bộ Tài chính có trách nhiệm chỉ đạo, hướng dẫn các cơ quan Hải quan thực hiện thủ tục xuất khẩu, nhập khẩu văn hóa phẩm; phối hợp kiểm tra, thanh tra, xử lý vi phạm, giải quyết khiếu nại, tố cáo đối với các hoạt động xuất khẩu, nhập khẩu văn hóa phẩm.
      trang_pdf: 6
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
    - dieu: 17
      noi_dung: Điều 17. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành kể từ ngày 01 tháng 6 năm 2012. 2. Nghị định này thay thế Nghị định số 88/2002/NĐ-CP ngày 07 tháng 11 năm 2002 của Chính phủ về quản lý xuất khẩu, nhập khẩu văn hóa phẩm không nhằm mục đích kinh doanh.
      trang_pdf: 6
      sha256_pdf: 846ef510cec8a24ef83ae5540cf3dd2b1f953326bcfcf7eeed80c53fbd8778be
