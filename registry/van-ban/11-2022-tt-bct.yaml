ghi_chu: 'Hết hiệu lực 17/7/2026 — nguồn tổng hợp ghi "đã xác minh nguyên văn". Bài tổng hợp KTCN 2026 (nguồn thứ cấp, có trích nguyên văn điều luật) — xem hs-code-api data/ktcn-regime-2026.json. MÂU THUẪN NGUỒN (04/10/2026): bài tổng hợp nói hết hiệu lực 17/7/2026 "đã xác minh nguyên văn"; Hermes-211 (hs-code-api nhánh hermes/ktcn-2026-kiem-chung, reports/ktcn-2026/KIEM-CHUNG.md, 04/10/2026) đọc TT 28/2026/TT-BCT không thấy nhắc TT 11/2022. Giữ ngày 17/7/2026 làm ngày dự kiến, chuyển tình trạng sang CHUA_XAC_MINH cho tới khi mở TT 11/2022 và điều khoản thi hành TT 28/2026. MÂU THUẪN SỐ HIỆU: trên congbao/vanban.chinhphu.vn, 11/2022/TT-BCT (27-06-2022) là phân giao hạn ngạch đường; bài tổng hợp/hs-code-api gán số này cho danh mục ATTP ban hành 06-04-2022. Chưa nạp toàn văn — cần xác định số hiệu đúng của danh mục ATTP trước khi nạp.'
