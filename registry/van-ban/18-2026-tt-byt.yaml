  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết một số điều của Luật Dược số 105/2016/QH13 được sửa đổi, bổ sung bởi Luật số 44/2024/QH15 (sau đây gọi tắt là Luật Dược) và Nghị định số 163/2025/NĐ-CP về: 1. Các danh mục liên quan đến thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt bao gồm: a) Danh mục dược chất gây nghiện theo quy định tại khoản 17 Điều 2 Luật Dược;'
      trang_pdf: 1
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 2
      noi_dung: Điều 2. Ban hành danh mục thuốc phải kiểm soát đặc biệt và bảng giới hạn nồng độ, hàm lượng dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc trong thuốc dạng phối hợp 1. Danh mục dược chất gây nghiện quy định tại Phụ lục I kèm theo Thông tư này và Bảng giới hạn nồng độ, hàm lượng dược chất gây nghiện trong thuốc dạng phối hợp theo quy định tại Phụ lục IV kèm theo Thông tư này.
      trang_pdf: 2
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 3
      noi_dung: 'Điều 3. Bảo quản 1. Cơ sở có hoạt động dược không vì mục đích thương mại phải tuân thủ yêu cầu về Thực hành tốt bảo quản thuốc, nguyên liệu làm thuốc trong đó: a) Thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phải được bảo quản tại kho, tủ riêng có khóa chắc chắn và không được để cùng các thuốc, nguyên liệu làm thuốc khác.'
      trang_pdf: 3
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 6
      noi_dung: Điều 6. Giao nhận, vận chuyển 1. Việc giao nhận, vận chuyển thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt giữa các cơ sở phải thực hiện theo quy định chung về giao nhận, vận chuyển thuốc, nguyên liệu làm thuốc và các quy định tại Điều 33 Nghị định số 163/2025/NĐ-CP, trong đó, người giao, người nhận thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt phải có bằng tốt nghiệp trung cấp ngành dược trở lên hoặc người được người đứng đầu cơ sở
      trang_pdf: 6
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 7
      noi_dung: 'Điều 7. Báo cáo 1. Trước ngày 15 tháng 01 hàng năm, cơ sở có hoạt động dược không vì mục đích thương mại lập báo cáo xuất, nhập, tồn kho, sử dụng thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, thuốc phóng xạ, thuốc dạng phối hợp có chứa tiền chất theo mẫu báo cáo quy định tại Phụ lục IX kèm theo Thông tư này và gửi các cơ quan sau: a) Cục Quân y - Bộ Quốc phòng đối với trường hợp cơ sở thuộc phạm vi quản lý của Bộ Quốc phòng;'
      trang_pdf: 6
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 9
      noi_dung: 'Điều 9. Hồ sơ, sổ sách đối với cơ sở sản xuất 1. Cơ sở sản xuất thuốc gây nghiện; thuốc hướng thần; thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phải lập, quản lý và lưu trữ đầy đủ các loại hồ sơ, sổ theo dõi sau đây: a) Sổ theo dõi pha chế, sản xuất thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất theo mẫu sổ quy định tại Phụ lục XIV kèm theo Thông tư này;'
      trang_pdf: 8
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 11
      noi_dung: 'Điều 11. Hồ sơ, sổ sách đối với cơ sở bán buôn, cơ sở tổ chức chuỗi nhà thuốc 1. Cơ sở bán buôn, cơ sở tổ chức chuỗi nhà thuốc có kinh doanh thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất phải lập, quản lý và lưu trữ đầy đủ các loại hồ sơ, sổ theo dõi sau đây: a) Sổ theo dõi xuất, nhập, tồn kho thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất theo mẫu sổ quy định tại Phụ lục VIII kèm theo Thông tư này;'
      trang_pdf: 10
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 13
      noi_dung: Điều 13. Hồ sơ, sổ sách đối với cơ sở kinh doanh dịch vụ bảo quản thuốc, kinh doanh dịch vụ thử thuốc trên lâm sàng, kinh doanh dịch vụ thử tương đương sinh học của thuốc, kinh doanh dịch vụ kiểm nghiệm 1. Đối với thuốc gây nghiện; thuốc hướng thần; thuốc tiền chất;
      trang_pdf: 12
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 14
      noi_dung: 'Điều 14. Hồ sơ, sổ sách đối với cơ sở có hoạt động dược không vì mục đích thương mại 1. Các cơ sở có hoạt động dược không vì mục đích thương mại, trừ cơ sở điều trị nghiện chất dạng thuốc phiện bằng thuốc thay thế, cơ sở cai nghiện ma túy, phải lập, quản lý và lưu trữ đầy đủ các loại hồ sơ, sổ theo dõi sau đây: a) Sổ pha chế thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, thuốc phóng xạ theo mẫu sổ quy định tại Phụ lục XIV và Phụ lục XVII'
      trang_pdf: 12
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
    - dieu: 17
      noi_dung: Điều 17. Điều khoản chuyển tiếp 1. Việc quản lý đối với dược chất Etomidate, Carisoprodol và các thuốc có chứa dược chất Etomidate, Carisoprodol từ ngày 01 tháng 6 năm 2026 đến trước ngày Thông tư này có hiệu lực thực hiện theo quy định về thuốc hướng thần, nguyên liệu làm thuốc là dược chất hướng thần tại Thông tư số 20/2017/TT-BYT được sửa đổi, bổ sung bởi Thông tư số 27/2024/TT-BYT và các quy định của pháp luật có liên quan về thuốc hướng
      trang_pdf: 14
      sha256_pdf: 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04
ghi_chu: Trinh thám đêm 24/11. Thuốc kiểm soát đặc biệt = nhập khẩu theo giấy phép HQ riêng (phụ lục ma túy/tiền chất) — đụng trực tiếp lô thuốc đặc biệt của khách.
