  pham_vi: đối chiếu Công báo điện tử số 329 ngày 14-06-2026 PDF ký số (congbaocdn.chinhphu.vn, 45 trang, SHA-256 754c244801353c00007b55e16209fe8655c6a6dc489f3cebd3b5ed9d85ee3f04); ban hành 01-06-2026, hiệu lực từ 16-07-2026 (riêng K2 Đ16 về Etomidate/Carisoprodol và K1 Đ17 từ 01-06-2026; K4 Đ16 bãi bỏ TT 20/2017/TT-BYT và TT 27/2024/TT-BYT từ 16-07-2026)
  hieu_luc_da_doi_chieu: true
