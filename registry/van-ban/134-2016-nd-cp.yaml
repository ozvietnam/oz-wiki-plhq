  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Pham vi điều chỉnh, đối tượng áp dung 1. Nghị định này quy định về đối tượng chịu thuế; áp dụng thuế suất thuế xuất khẩu, thuế nhập khẩu, thời hạn nộp thuế đỗi với hàng hóa xuất khẩu, nhập khẩu; miễn thuế, giảm thuế, hoàn thuế xuất khẩu, thuế nhập khẩu.
      trang_pdf: 1
    - dieu: 10
      khoan: 1
      noi_dung: 'Điều 10. Miễn thuế đối với hàng hóa nhập khẩu để gia công, sản phẩm gia công xuat khâu 1. Hang hóa nhập khẩu. để gia công, san pham gia công xuất khâu theo hợp đông gia công được miễn thuê xuat khâu, thuê nhập khâu theo quy định tại khoản 6 Điều 16 Luật thuế xuất khẩu, thuế nhập khẩu, gồm: a) Nguyên liệu, bán thành phẩm, vật tư (bao gồm cả vật tư làm bao bì hoặc bao bi dé đóng gói san phẩm xuất khẩu), linh kiện nhập khẩu trực tiếp câu thành sản phẩm xuât khâu hoặc tham gia trực tiếp vào quá trình gia công hàng hoá xuất khẩu nhưng không trực tiếp chuyển hoá thành hàng hoá, bao gôm cả trường hợp bên nhận gia công tự nhập khẩu nguyên liệu, vật tư, linh kiện dé thực hiện hop đồng gia công;'
      trang_pdf: 10
    - dieu: 12
      khoan: 1
      noi_dung: 'Điều 12. Miễn thuế đối với hàng hóa nhập khẩu để sản xuất hàng hóa xuất khâu 1. Nguyên. liệu, vật tư, linh kiện, bán thành phẩm, sản phẩm hoàn chỉnh nhập khâu để sản xuat hang hóa xuất khẩu được miễn thuê nhập khâu. theo quy định tại khoản 7 Điều 16 Luật thuế xuất khẩu, thuế nhập khẩu, bao gồm: a) Nguyên liệu, vật tư (bao gồm cả vật tư làm bao bì hoặc bao bì để đóng gói sản phẩm xuất khẩu), linh kiện, bán thành phẩm nhập khẩu trực tiếp câu thành sản phẩm xuất khẩu hoặc tham gia trực tiếp vào quá trình sản xuất hàng hoá xuất khẩu nhưng không trực tiếp chuyên hoá thành hàng hoá; b) Sản phẩm hoàn chỉnh nhập khâu để gắn, lắp ráp vào sản phẩm xuất khẩu hoặc đóng chung thành mặt hàng đồng bộ với sản phẩm xuất khẩu; c) Linh kiện, phụ tùng nhập khẩu để bảo hành cho sản phẩm xuất khâu; đ) Hàng hóa nhập khẩu không sử dụng để mua bán, trao đổi hoặc tiêu dùng mà chỉ dùng làm hàng mẫu.'
      trang_pdf: 14
    - dieu: 14
      noi_dung: Điều 14. Miễn thuế hàng hóa nhập khẩu để tạo tài sản cố định của đối tượng được hướng ưu đãi đầu tư 1. Hàng hóa nhập | khẩu để tạo tài sản cố định của đối tượng được hưởng ưu đãi đầu tư được miễn thuế nhập khẩu theo quy định tại khoản 11 Điều 16 Luật thuế xuất khẩu, thuế nhập khẩu. 2. Hàng hóa nhập khẩu dé tạo tài sản cố định của một dự án đầu tư có phần dự án thuộc đối tượng ưu đãi đầu tư được miễn thuế nhập khẩu đối với hàng héa nhập khẩu được phân bổ, hạch toán riêng để sử dụng trực tiếp cho phần dự án thuộc đối tượng ưu đãi đầu tư. 3. Dự án đầu tư thuộc địa bản ưu đãi đầu tư và không thuộc ngành nghề ưu đãi đầu tư thì được miễn thuế đối với hang hoa nhập khẩu dé tạo tai sản cố định phục vụ sản xuất của dự án ưu đãi đầu tư.
      trang_pdf: 15
    - dieu: 15
      khoan: 1
      noi_dung: Điều 15. Miễn thuế nhập khẩu đối với nguyên liệu, vật tu, linh kiện trong thời hạn 05 năm 1. Nguyên liệu, vật tư, linh kiện trong nước chưa sản xuất được nhập khẩu để sản xuất của dự án đầu tư thuộc danh mục ngành, nghề đặc biệt ưu đãi đầu tư hoặc địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn theo quy định của pháp luật về đầu tư, doanh nghiệp công nghệ cao, doanh nghiệp khoa học và công nghệ, tổ chức khoa học và công nghệ được miễn thuế nhập khẩu trong thời han 05 năm kê từ khi bắt đầu sản xuất theo quy định tại khoản 13 Điều 16 Luật thuế xuất khẩu, thuế nhập khẩu. Thời gian bắt đầu sản xuất là thời gian sản xuất chính thức, không bao gồm thời gian sản xuất thử. Người nộp thuế tự kê khai, tự chịu trách nhiệm về ngày thực tế tiễn hành hoạt động sản xuất và thông báo trước khi làm thủ tục hải quan cho cơ quan hải quan nơi tiếp nhận hồ sơ thông báo danh mục miễn thuế.
      trang_pdf: 16
    - dieu: 19
      khoan: 1
      noi_dung: Điều 19. Miễn thuế hàng hóa nhập khẩu phục vụ nghiên cứu khoa học, phát triển công nghệ 1. Hàng hóa nhập khẩu dé sử dụng trực tiếp cho nghiên cứu khoa học, phát triển công nghệ, phát triển hoạt động ươm tạo công nghệ, ươm tạo doanh nghiệp khoa học và công nghệ, đối mới công nghệ được miễn thuê nhập khâu theo quy định tại khoản 21 Điều 16 Luật thuế xuất khâu, thuê nhập khâu.
      trang_pdf: 18
    - dieu: 24
      khoan: 1
      noi_dung: Điều 24. Miễn thuế nguyên liệu, vật tư, linh kiện nhập khẩu phục vụ trực tiếp cho hoạt động sản xuất sản phẩm công nghệ thông tin, nội dung số, phần mềm 1. Nguyên liệu, vật tư, linh kiện nhập | khẩu trong nước chưa sản xuất được phục » vụ trực tiếp cho hoạt động sản xuất sản phẩm công nghệ thông tin, nội dưng số, phần mềm được miễn thuế nhập khẩu theo quy định tại khoản 18 Điều 16 Luật thuế xuất khẩu, thuế nhập khâu.
      trang_pdf: 21
    - dieu: 30
      khoan: 1
      noi_dung: Điều 30. Thông báo Danh mục hàng hóa miễn _ thuế dự kiến nhập khẩu đối với các trường hợp thông báo Danh mục miễn thuế 1, Các trường hợp thông báo Danh mục hàng hóa nhập khẩu miễn thuế gồm các hàng hóa thuộc đối tượng miễn thuế quy định tại Điều 14, Điều 15, Điều 16, Điều 17, Điều 18, Điều 23, Điều 24 Nghị định này.
      trang_pdf: 25
    - dieu: 30
      khoan: 4
      noi_dung: '4. Thời gian, địa điểm thông báo Danh mục miễn thuế: a) Chủ dir án có trách nhiệm gửi hồ sơ thông báo Danh mục miễn thuế theo quy định tại khoản 2 Điều này trước khi đăng ký tờ khai hàng hóa nhập khẩu miễn thuế đầu tiên;'
      trang_pdf: 27
    - dieu: 30
      khoan: 6
      diem: a
      noi_dung: a) Trong thời hạn tối đa 03 ngày làm việc, kể từ ngày tiếp nhận hồ sơ, cơ quan hải quan thông báo cho chủ du án về việc đã tiếp nhận Danh mục miễn thuế; bd sung hd sơ còn thiếu theo quy định tại khoản 2 Điều này; giải trình, làm rõ những thông tin có trong hồ sơ thông báo Danh mục miễn thuế hoặc thông báo hàng hóa không thuộc đối tượng miễn thuế;
      trang_pdf: 27
    - dieu: 30
      khoan: 7
      diem: đ
      noi_dung: đ) Chậm nhất là ngày thứ 90 kế từ ngày kết thúc năm tài chính, chủ dự án thông báo việc sử dụng hàng hóa miễn thuế trong năm tài chính cho cơ quan hải quan nơi tiếp nhận Danh mục miễn thuế.
      trang_pdf: 28
    - dieu: 31
      khoan: 1
      noi_dung: Điều 31. Hồ sơ, thú tục miễn thuế khi làm thủ tục hãi quan 1. Hồ sơ miễn thuế là hồ sơ hải quan theo quy định tại Luật hải quan và các văn bản hướng dẫn thi hành.
      trang_pdf: 28
    - dieu: 38
      noi_dung: Điều 38. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 9 năm 2016 và thay thế Nghị định số 87/2010/NĐ-CP ngày 13 tháng 8 năm 2010 của Chính phủ quy định chỉ tiết thi hành một số điều Luật thuế xuất khẩu, thuế nhập khẩu.
      trang_pdf: 38
ghi_chu: Thẻ cổng Chính phủ khớp, người ký Nguyễn Xuân Phúc. Đã OCR toàn văn 78 trang và trích 13 điều khoản nguyên văn bậc A (miễn thuế TSCĐ Điều 14, 05 năm nguyên liệu Điều 15, thông báo Danh mục miễn thuế 03 ngày làm việc và báo cáo sử dụng 90 ngày Điều 30, hiệu lực 01/09/2016 Điều 38). Đã được sửa đổi, bổ sung bởi NĐ 18/2021/NĐ-CP và NĐ 182/2025/NĐ-CP.
