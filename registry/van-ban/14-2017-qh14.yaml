  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quản lý, sử dụng vũ khí, vật liệu nỗ, tiền chất thuốc nd, công cụ hỗ trợ; nguyên tắc, trách nhiệm của cơ quan, tổ chức, cá nhân trong quan lý, sử dụng võ khí, vật liệu nỗ, tiền chất thuốc nỗ, công cụ hỗ. trợ nhằm bảo vệ an ninh quôc gia, bảo đảm trật tự, an toàn xã hội, bảo vệ quyền con người, quyền công dân và phục vụ phát triển kinh tế - xã hội.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với cơ quan, tổ chức, cá nhân liên quan đến quản lý, sử dụng vũ khí, vật liệu nõ, tiên chat thuốc nô, công cụ hé trợ.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật nay, các từ ngữ dưới đây được hiểu như sau: 1, Vã khí là thiết bị, phương tiện hoặc tổ hợp những phương tiện được chế tạo, sản xuất có khả năng gây sát thương, nguy hại cho tính mạng, sức khỏe của con người, phá hủy kết cấu vật chất, bao gôm: vũ khí quân dụng, súng săn, vũ khí thô sơ, vũ khí thể thao và vũ khí khác có tính năng, tác dụng tương tự.'
      trang_pdf: 1
    - dieu: 5
      noi_dung: Điều 5. Các hành vi bị nghiêm cam trong quản lý, sử dung vũ khí, vật oA A «A A & Ax aA x liệu no, tiên chat thudc no va công cụ hồ trợ 1. Cá nhân sở hữu vũ khí, vật liệu nd, công cụ hỗ trợ, trừ vũ khí thô sơ là hiện vat dé trưng bày, trién lãm, đô gia bảo.
      trang_pdf: 4
    - dieu: 6
      noi_dung: Điều 6. Trách nhiệm của người đứng đầu cơ quan, t6 chức, doanh nghiệp được trang bị, sử dụng vũ khí, vật liệu nỗ, tiền chất thuốc nỗ, công cụ ho trợ 1. Chỉ đạo, tổ chức thực hiện và chịu trách nhiệm trong việc quản lý, sử dụng vũ khí, vật liệu nô, tiền chat thuôc nô, công cụ hồ trợ. 2. Chỉ được giao vũ khí, vật liệu nỗ, công cụ hỗ trợ cho người có đủ điều kiện quy định tại khoản 1 Điêu 7 của Luật này.
      trang_pdf: 5
    - dieu: 7
      noi_dung: 'Điều 7. Điều kiện, trách nhiệm của người được giao sử dụng vũ khí, vật liệu nô, công cụ hỗ trợ 1. Người được giao sử dụng vũ khí, vật liệu nỗ, công cụ hỗ trợ phải bảo đảm đủ điêu kiện sau đây: a) Có năng lực hành vi dân sự đầy đủ; b) Có phẩm chất đạo đức tốt, đủ sức khỏe phù hợp với công việc được giao;'
      trang_pdf: 5
    - dieu: 9
      noi_dung: Điều 9. Quan lý, bảo quản vũ khí, vật liệu nỗ, tiền chất thuốc nỗ, công cụ hỗ trợ 1. Vũ khí, vật liệu nỗ, tiền chất thuốc nỗ, công cụ hỗ trợ phải được quan lý, bảo quản theo đúng chê độ, đúng quy trình, bảo dam an toàn, không dé mat, hư hỏng.
      trang_pdf: 6
    - dieu: 10
      noi_dung: 'Điều 10. Thu hồi vũ khí, vật liệu nỗ quân dụng, công cụ hỗ trợ và giấy phép, giấy xác nhận, giấy chứng nhận, chứng chỉ về quản lý, sử dung vũ khí, vật liệu nỗ, tiền chất thuốc no, công cu hé trợ 1. Vũ khí, vật liệu nỗ quân dụng, công cụ hỗ trợ trang bị cho cơ quan, tổ chức, doanh nghiệp được thu hồi trong trường hợp sau đây: a) Cơ quan, tổ chức, doanh nghiệp giải thể, chuyến đổi, chia, tách, hợp nhất, sáp nhập;'
      trang_pdf: 7
    - dieu: 11
      noi_dung: 'Điều 11. Thủ tục thu hồi vũ khí, vật liệu nỗ quân dụng, công cụ hỗ trợ và giấy phép, giấy xác nhận, giấy chứng nhận, chứng chỉ về quản lý, sử dụng vũ khí, vật liệu nỗ, tiền chất thuốc nỗ, công cụ hỗ trợ 1. Cơ quan, tổ chức, doanh nghiệp thuộc trường hợp quy định tại Điều 10 của Luật này có trách nhiệm lập hồ sơ, làm thủ tục dé nghị thu hồi. Hồ sơ đề nghị bao gôm: a) Văn bản đề nghị thu hồi;'
      trang_pdf: 8
    - dieu: 15
      noi_dung: Điều 15. Quản lý, sử dụng vũ khí, vật liệu nỗ, công cụ hỗ trợ để triển lãm, trưng bày, chào hàng, giới thiệu san phẩm hoặc làm đạo cụ trong hoạt động văn hóa, nghệ thuật 1. Vũ khí, công cụ hỗ trợ được sử dụng để triển lãm, trưng bày hoặc làm dao cụ trong hoạt động văn hóa, nghệ thuật phải làm mat tinh năng, tác dụng. 2. Vũ khí, công cụ hỗ trợ chỉ được chào hàng, giới thiệu sản phẩm theo thời gian, địa điểm đã đăng ký với cơ quan có thẩm quyền.
      trang_pdf: 10
ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #373). Đã hết hiệu lực từ 01-01-2025, thay bằng Luật 42/2024/QH15 (đã có trong sổ).'
