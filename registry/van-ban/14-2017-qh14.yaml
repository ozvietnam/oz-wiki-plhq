  pham_vi: 'đối chiếu Cổng TTĐT Chính phủ (docid=190300) và toàn văn PDF ký số 55 trang đã OCR (SHA-256 cf0a7304f40c...): Quốc hội khóa XIV thông qua ngày 20-06-2017, hiệu lực từ 01-07-2018; hết hiệu lực từ 01-01-2025 do Luật Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ số 42/2024/QH15 thay thế'
