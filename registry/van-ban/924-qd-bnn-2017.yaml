xac_minh:
  muc: NGUON_A
  pham_vi: Đã đối chiếu số hiệu (biểu thuế dẫn là 924/QĐ-BNN, văn bản đầy đủ là Quyết định số 924/QĐ-BNN-TCLN ngày 24/03/2017 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn ban hành Bảng mã số HS đối với danh mục hàng hóa là động vật, thực vật hoang dã nguy cấp, quý, hiếm) và tình trạng hết hiệu lực từ ngày 30/01/2024 theo khoản 2 Điều 2 Thông tư 17/2023/TT-BNNPTNT ngày 15/12/2023 trên Công báo Chính phủ (congbao.chinhphu.vn, congbaocdn.chinhphu.vn).
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: |
  Biểu thuế xuất nhập khẩu ghi số hiệu là 924/QĐ-BNN (số hiệu đầy đủ trên văn bản bãi bỏ là 924/QĐ-BNN-TCLN ngày 24/03/2017). Hết hiệu lực từ ngày 30/01/2024; bị bãi bỏ toàn bộ bởi khoản 2 Điều 2 Thông tư 17/2023/TT-BNNPTNT ngày 15/12/2023 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn ban hành Bảng mã HS đối với hàng hóa là thực vật rừng, động vật rừng nguy cấp, quý, hiếm và động vật, thực vật thuộc các Phụ lục Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp (nguồn A: https://congbao.chinhphu.vn/van-ban/thong-tu-so-17-2023-tt-bnnptnt-40996/48231.htm, https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2023/12/40996/48199-1-2024101-10217-2023-tt-bnnptnt.pdf).
