# Sổ đăng ký văn bản — xem docs/luoc-do-so-dang-ky.md
so_hieu: 127/2022/NĐ-CP
loai: NGHI_DINH
ten: Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân Lào từ ngày 30 tháng 12 năm 2022 đến ngày 04 tháng 10 năm 2023
co_quan: CP
ngay_ban_hanh: '2022-12-30'
