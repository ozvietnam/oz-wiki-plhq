xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn PDF Công báo số 19+20 ngày 15/01/2023 (raw/download/congbaocdn.chinhphu.vn/127-2022-nd-cp.pdf, 36 trang, Phó Thủ tướng Lê Minh Khái ký, SHA-256 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9), wiki/sources/127-2022-nd-cp.md và điều khoản bãi bỏ toàn bộ (khoản 3 Điều 9 Nghị định 206/2025/NĐ-CP ngày 15/07/2025) trên Công báo Chính phủ (congbao.chinhphu.vn) và Cổng TTĐT Chính phủ (vanban.chinhphu.vn).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định thuế suất thuế nhập khẩu ưu đãi đặc biệt và điều kiện hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa (CHXHCN) Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân (CHDCND) Lào (sau đây viết tắt là Hiệp định thương mại Việt Nam - Lào) từ ngày 30 tháng 12 năm 2022 đến ngày 04 tháng 10 năm 2023.'
      trang_pdf: 2
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 2
      noi_dung: '1. Người nộp thuế theo quy định của Luật Thuế xuất khẩu, thuế nhập khẩu. 2. Cơ quan hải quan, công chức hải quan. 3. Tổ chức, cá nhân có quyền và nghĩa vụ liên quan đến hàng hóa xuất khẩu, nhập khẩu.'
      trang_pdf: 2
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 3
      noi_dung: 'Ban hành kèm theo Nghị định này: 1. Phụ lục I - Danh mục hàng hóa được hưởng ưu đãi giảm 50% thuế suất ATIGA của Việt Nam theo Hiệp định thương mại Việt Nam - Lào. 2. Phụ lục II - Danh mục hàng hóa không được hưởng ưu đãi thuế quan theo Hiệp định thương mại Việt Nam - Lào. 3. Phụ lục III - Danh mục hàng hóa được hưởng chế độ hạn ngạch thuế quan hằng năm theo Hiệp định thương mại Việt Nam - Lào.'
      trang_pdf: 2
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 4
      noi_dung: 'Hàng hóa nhập khẩu có xuất xứ từ CHDCND Lào, trừ hàng hóa nhập khẩu thuộc Danh mục hàng hóa quy định tại Phụ lục I, Phụ lục II và Phụ lục III ban hành kèm theo Nghị định này, được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm) nếu đáp ứng các điều kiện quy định tại Điều 8 Nghị định này.'
      trang_pdf: 2
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 5
      khoan: 1
      noi_dung: '1. Hàng hóa nhập khẩu từ CHDCND Lào, thuộc danh mục hàng hóa quy định tại Phụ lục I ban hành kèm theo Nghị định này được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt bằng 50% thuế suất ATIGA quy định tại Biểu thuế nhập khẩu ưu đãi đặc biệt ban hành kèm theo Nghị định Biểu thuế nhập khẩu ưu đãi đặc biệt'
      trang_pdf: 2
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 5
      khoan: 1
      noi_dung: 'của Việt Nam để thực hiện Hiệp định Thương mại Hàng hóa ASEAN số 126/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ về việc ban hành Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại Hàng hóa ASEAN giai đoạn 2022 - 2027 nếu đáp ứng các điều kiện quy định tại Điều 8 Nghị định này.'
      trang_pdf: 3
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 5
      khoan: 2
      noi_dung: '2. Trong trường hợp thuế suất ATIGA cao hơn thuế suất thuế nhập khẩu ưu đãi quy định tại Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khẩu ngoài hạn ngạch thuế quan của Chính phủ tại thời điểm nhập khẩu và các văn bản sửa đổi, bổ sung (nếu có) (sau đây gọi là Biểu thuế MFN) thì áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt bằng 50% thuế suất quy định tại Biểu thuế MFN.'
      trang_pdf: 3
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 6
      noi_dung: 'Hàng hóa thuộc Phụ lục II ban hành kèm theo Nghị định này sẽ không được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định thương mại Việt Nam - Lào khi nhập khẩu vào Việt Nam.'
      trang_pdf: 3
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 7
      khoan: 1
      noi_dung: '1. Đối với mặt hàng lúa gạo - mã HS10.06 (03 dòng hàng HS 8 số chi tiết tại Phụ lục III ban hành kèm theo Nghị định này): a) Mặt hàng lúa gạo có xuất xứ từ CHDCND Lào nhập khẩu trong hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng điều kiện quy định tại Điều 8 Nghị định này và quy định của Bộ Công Thương về việc nhập khẩu theo hạn ngạch thuế quan thì được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm). b) Mặt hàng lúa gạo có xuất xứ từ CHDCND Lào nhập khẩu vượt số lượng hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng các điều kiện quy định tại Điều 8 Nghị định này thì số lượng nhập khẩu vượt hạn ngạch thuế quan áp dụng mức thuế suất quy định tại Điều 5 của Nghị định này.'
      trang_pdf: 3
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 7
      khoan: 2
      noi_dung: '2. Đối với mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá - mã HS24.01 (13 dòng hàng 8 số chi tiết tại Phụ lục III ban hành kèm theo Nghị định này): a) Mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá có xuất xứ từ CHDCND Lào thuộc danh mục hàng hóa nhập khẩu áp dụng chế độ hạn ngạch thuế quan quy định tại Phụ lục III ban hành kèm theo Nghị định này khi nhập khẩu vào Việt Nam nếu đáp ứng điều kiện quy định tại Điều 8 của Nghị định này và quy định của Bộ Công Thương về việc nhập khẩu theo hạn ngạch thuế quan thì được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt 0% (không phần trăm). b) Mặt hàng lá thuốc lá chưa chế biến và phế liệu lá thuốc lá có xuất xứ từ CHDCND Lào nhập khẩu vào Việt Nam vượt số lượng hạn ngạch quy định tại Phụ lục III ban hành kèm theo Nghị định này thì không được hưởng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định thương mại Việt Nam - Lào.'
      trang_pdf: 3
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 8
      noi_dung: 'Hàng hóa nhập khẩu quy định tại Điều 4, Điều 5 và Điều 7 của Nghị định này được áp dụng thuế suất thuế nhập khẩu ưu đãi đặc biệt theo Hiệp định thương mại Việt Nam - Lào phải đáp ứng đủ các điều kiện sau: 1. Được nhập khẩu từ CHDCND Lào vào Việt Nam. 2. Đáp ứng các quy định về xuất xứ hàng hóa (bao gồm cả quy định về vận chuyển trực tiếp) và có Giấy chứng nhận xuất xứ hàng hóa mẫu S (C/O form S) do cơ quan có thẩm quyền của CHDCND Lào cấp, theo quy định của Hiệp định thương mại Việt Nam - Lào và quy định hiện hành của pháp luật.'
      trang_pdf: 4
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 9
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực từ ngày ký ban hành.'
      trang_pdf: 4
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 9
      khoan: 2
      noi_dung: '2. Nghị định số 90/2021/NĐ-CP ngày 19 tháng 10 năm 2021 của Chính phủ ban hành Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa dân chủ nhân dân Lào từ ngày 04 tháng 10 năm 2020 đến ngày 04 tháng 10 năm 2023 hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành.'
      trang_pdf: 4
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
    - dieu: 9
      khoan: 3
      noi_dung: '3. Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này./.'
      trang_pdf: 4
      sha256_pdf: 90d83c25d92715ff624193aa252ff17933ecb392ab115913fe481c05c2f24bd9
ghi_chu: |
  Có hiệu lực từ ngày 30/12/2022 đến ngày 04/10/2023 theo Điều 9 Nghị định 127/2022/NĐ-CP (thay thế Nghị định 90/2021/NĐ-CP ngày 19/10/2021); bị bãi bỏ toàn bộ theo khoản 3 Điều 9 Nghị định 206/2025/NĐ-CP ngày 15/07/2025 của Chính phủ quy định Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Thương mại giữa Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam và Chính phủ nước Cộng hòa Dân chủ Nhân dân Lào từ ngày 15/07/2025 đến ngày 24/02/2030 (nguồn A: https://vanban.chinhphu.vn/default.aspx?docid=214630&pageid=27160, https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/206-cp.signed.pdf).
