  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Vị trí và chức năng Bộ Nội vụ là cơ quan của Chính phủ, thực hiện chức năng quản lý nhà nước về các ngành, lĩnh vực: Tổ chức hành chính, đơn vị sự nghiệp công lập; tổ chức chính quyền địa phương; cán bộ, công chức, viên chức và công vụ; lao động, tiền lương, bảo hiểm xã hội; việc làm; an toàn, vệ sinh lao động; hội, quỹ xã hội, quỹ từ thiện, tổ chức phi chính phủ; người có công; thanh niên; bình đăng giới; văn thư, lưu trữ nhà nước;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Nhiệm vụ và quyền hạn Bộ Nội vụ thực hiện nhiệm vụ, quyền hạn theo quy định tại Luật Tả chức Chính phủ, quy định của Chính phủ về chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của bộ, cơ quan ngang bộ và thực hiện những nhiệm vụ, quyền hạn cụ thé sau đây: ,'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Cơ cấu tô chức 1. Vụ Tổ chức - Biên chế. 2. Vụ Chính quyền địa phương. 3. Vụ Công chức - Viên chức.
      trang_pdf: 11
    - dieu: 4
      noi_dung: Điều 4. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 08 tháng 7 năm 2026. 2. Nghị định này thay thế Nghị định số 25/2025/NĐ-CP ngày 21 tháng 02 năm, 2025 của Chính phủ quy định chức năng, nhiệm vụ, quyên hạn và cơ cấu tổ chức của Bộ Nội vụ.
      trang_pdf: 12
    - dieu: 5
      noi_dung: Điều 5. Trách nhiệm thi hành Bộ trưởng Bộ Nội vụ, các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm thi hành Nghị định này.
      trang_pdf: 13
ghi_chu: Bộ Nội vụ nay quản lý an toàn, vệ sinh lao động sau khi Bộ LĐ-TB&XH giải thể. Bài tổng hợp KTCN 2026 (nguồn thứ cấp, có trích nguyên văn điều luật) — xem hs-code-api data/ktcn-regime-2026.json.
