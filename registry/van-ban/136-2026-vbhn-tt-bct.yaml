  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Ban hành kèm theo Thông tư này Quy chuẩn kỹ thuật quốc gia đối với sản phẩm khăn giấy và giấy vệ sinh. Ký hiệu: QCVN 09:2015/BCT. 1 Thông tư số 33/2016/TT-BCT có căn cứ ban hành như sau:'
      trang_pdf: 2
      sha256_pdf: 7b77dd1219358e52d1a3277a3d77c107bfdf0f0eab0395c6f60a21b5d10a340f
    - dieu: 3
      noi_dung: Điều 3. Tổ chức thực hiện 1. Cục trưởng Cục Công nghiệp có trách nhiệm tổ chức hướng dẫn, phổ biến và triển khai thực hiện Thông tư này. 2. Thủ trưởng các cơ quan, đơn vị thuộc và trực thuộc Bộ Công Thương; Giám đốc các Sở, ngành có chức năng, nhiệm vụ do UBND cấp tỉnh quy định và các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.
