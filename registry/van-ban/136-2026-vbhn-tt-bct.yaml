  pham_vi: 'đối chiếu Công báo điện tử Chính phủ (id=470888) và chuỗi văn bản trong sổ: Văn bản hợp nhất 136/2026/VBHN-TT-BCT xác thực ngày 26-10-2026, hợp nhất Thông tư ban hành Quy chuẩn kỹ thuật quốc gia đối với sản phẩm khăn giấy và giấy vệ sinh (TT 36/2015/TT-BCT đã được sửa đổi, bổ sung bởi TT 33/2016/TT-BCT và các thông tư sửa đổi sau đó); đối chiếu đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
