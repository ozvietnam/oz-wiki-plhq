xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=208020), wiki/sources/26-2023-nd-cp.md và cạnh ngược trong sổ: ban hành 31-05-2023, có hiệu lực từ 15-07-2023, bãi bỏ NĐ 57/2020/NĐ-CP theo khoản 2 Điều 8; đối chiếu còn hiệu lực, đã được sửa đổi, bổ sung bởi NĐ 72/2026/NĐ-CP và NĐ 201/2026/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này ban hành Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp và thuế nhập khẩu ngoài hạn ngạch thuế quan.
      trang_pdf: 1
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Người nộp thuế theo quy định của Luật Thuế xuất khẩu, thuế nhập khẩu. 2. Cơ quan hải quan, công chức hải quan.
      trang_pdf: 1
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 3
      noi_dung: 'Điều 3. Ban hành Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế, Danh mục hàng hóa và mức thuế tuyệt đối, thuế hỗn hợp, thuế nhập khẩu ngoài hạn ngạch thuế quan Ban hành kèm theo Nghị định này: 1. Phụ lục I - Biểu thuế xuất khẩu theo Danh mục mặt hàng chịu thuế. 2. Phụ lục II - Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế.'
      trang_pdf: 2
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 4
      noi_dung: Điều 4. Biểu thuế xuất khẩu theo Danh mục mặt hàng chịu thuế 1. Biểu thuế xuất khẩu theo Danh mục mặt hàng chịu thuế quy định tại Phụ lục I ban hành kèm theo Nghị định này gồm mã số hàng hóa (mã hàng), mô tả hàng hóa, mức thuế suất thuế xuất khẩu quy định cho từng nhóm mặt hàng, mặt hàng chịu thuế xuất khẩu.
      trang_pdf: 2
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 5
      noi_dung: 'Điều 5. Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế (Biểu thuế nhập khẩu ưu đãi) quy định tại Phụ lục II ban hành kèm theo Nghị định này bao gồm: 1. Mục I: Quy định mức thuế suất thuế nhập khẩu ưu đãi đối với 97 chương theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam. Nội dung gồm: Tên các'
      trang_pdf: 3
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 6
      noi_dung: 'Điều 6. Thuế suất thuế nhập khẩu ưu đãi đối với các mặt hàng máy gia công cơ khí Các mặt hàng máy gia công cơ khí thuộc các nhóm hàng từ 84.54 đến 84.63 áp dụng mức thuế suất thuế nhập khẩu ưu đãi như sau: 1. Các mặt hàng máy gia công cơ khí trong nước chưa sản xuất được áp dụng mức thuế suất thuế nhập khẩu ưu đãi bằng 0%.'
      trang_pdf: 5
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 7
      noi_dung: Điều 7. Thuế nhập khẩu đối với mặt hàng xe ô tô đã qua sử dụng 1. Xe ô tô chở người đã qua sử dụng từ 09 chỗ ngồi trở xuống có dung tích xi lanh không quá 1.000cc thuộc nhóm hàng 87.03 áp dụng mức thuế tuyệt đối quy định tại Phụ lục III ban hành kèm theo Nghị định này. 2. Xe ô tô chở người đã qua sử dụng từ 09 chỗ ngồi trở xuống có dung tích xi lanh trên 1.000cc thuộc nhóm hàng 87.03 và từ 10 đến 15 chỗ ngồi thuộc nhóm
      trang_pdf: 5
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 8
      noi_dung: 'Điều 8. Thuế suất thuế nhập khẩu ưu đãi đối với linh kiện ô tô nhập khẩu theo Chương trình ưu đãi thuế để sản xuất, lắp ráp xe ô tô (Chương trình ưu đãi thuế) 1. Quy định thuế suất thuế nhập khẩu ưu đãi 0% đối với linh kiện ô tô nhập khẩu thuộc nhóm 98.49 tại khoản 3 Mục II Phụ lục II ban hành kèm theo Nghị định này như sau: a) Tại thời điểm đăng ký tờ khai hải quan, người khai hải quan thực hiện kê khai, tính thuế đối với hàng hóa nhập khẩu'
      trang_pdf: 6
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 9
      noi_dung: Điều 9. Thuế suất thuế nhập khẩu ưu đãi đối với nguyên liệu, vật tư, linh kiện để sản xuất, gia công (lắp ráp) các sản phẩm công nghiệp hỗ trợ ưu tiên phát triển cho ngành sản xuất, lắp ráp ô tô đến ngày 31 tháng 12 năm 2024 (gọi tắt là Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô) 1. Quy định thuế suất thuế nhập khẩu ưu đãi 0% đối với nguyên liệu, vật tư, linh kiện trong nước chưa sản xuất được để sản xuất, gia công (lắp ráp) các sản phẩm
      trang_pdf: 15
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 10
      noi_dung: Điều 10. Danh mục hàng hóa và mức thuế suất thuế nhập khẩu đối với các mặt hàng áp dụng hạn ngạch thuế quan 1. Danh mục hàng hoá áp dụng hạn ngạch thuế quan gồm mặt hàng thuộc các nhóm hàng được quy định tại Phụ lục IV ban hành kèm theo Nghị định này và các mặt hàng áp dụng hạn ngạch thuế quan quy định tại các Điều ước quốc tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên (Điều ước quốc tế).
      trang_pdf: 22
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 11
      noi_dung: Điều 11. Trách nhiệm tổ chức thực hiện 1. Bộ Tài chính thực hiện kiểm tra, giám sát, tham vấn giá, chống gian lận thương mại theo quy định đối với những mặt hàng có mức thuế suất thuế nhập khẩu cao và các mặt hàng có rủi ro cao về trị giá tính thuế. 2. Bộ Kế hoạch và Đầu tư ban hành Danh mục hàng hóa trong nước đã sản xuất được; rà soát, cập nhật sửa đổi Danh mục đảm bảo phù hợp với thực tế.
      trang_pdf: 23
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
    - dieu: 12
      noi_dung: 'Điều 12. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 15 tháng 7 năm 2023. 2. Nghị định này thay thế các Nghị định sau của Chính phủ: Nghị định số 122/2016/NĐ-CP ngày 01 tháng 9 năm 2016, Nghị định số 125/2017/NĐ-CP ngày 16 tháng 11 năm 2017, Nghị định số 57/2020/NĐ-CP ngày 25 tháng 5 năm 2020, Nghị định số 101/2021/NĐ-CP ngày 15 tháng 11 năm 2021, Nghị định số 51/2022/NĐ-CP ngày 08 tháng 8 năm 2022.'
      trang_pdf: 23
      sha256_pdf: 4b96e98b4d8c606f36657484de6b7002384a1027fa648bb55f3608429dd50119
ghi_chu: Khởi tạo 2026-10-04 từ hiểu biết nền; cần đối chiếu nguồn A. Kiểm tra các nghị định sửa đổi biểu thuế sau 2023.
