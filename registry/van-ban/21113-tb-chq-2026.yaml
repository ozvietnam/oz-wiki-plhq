  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21113.pdf, id=106009, SHA-256 45a49b8dafcf2a8889e37cba852eecb35b4c1624b9c50ca9d924f26dbf798129): Thông báo số 21113/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị thổi khí nóng (Hot air blower) cầm tay loại gia dụng (tên thương mại iTera-Pro Plus, ký mã hiệu DS-19; điện áp định mức 220V-240V, tần số 50/60Hz, công suất 1200W, độ ồn < 65 dB, khối lượng 0,77 kg; cấu tạo gồm thân vỏ nhựa PC+ABS và PA66 chống cháy, động cơ không chổi than, bộ gia nhiệt điện trở, trục ống thủy tinh thạch anh, bo mạch nguồn/điều khiển/hiển thị, bộ phát ion âm và dây nguồn; dùng tạo luồng khí nóng hỗ trợ chăm sóc sức khỏe cá nhân trong gia đình), phân loại vào nhóm 85.16, phân nhóm 8516.79, mã số 8516.79.90; có hiệu lực từ ngày ký'
