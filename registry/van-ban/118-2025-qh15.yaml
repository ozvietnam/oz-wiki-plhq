      noi_dung: 'Điều 8. Sửa déi, bỗ sung một số điều của Luật Đường bộ 1. Sửa đổi, bỗ sung khoản 6 Điều 2 như sau: “6. Cơ quan quản ly đường bộ là cơ quan thuộc Bộ ) Xây dựng giúp Bộ trưởng Bộ Xây dựng thực hiện chức năng quản lý nhà nước về hoạt động đường bộ; cơ quan chuyên môn thuộc Ủy ban nhân dân cấp tỉnh; Ủy ban nhân dân câp xã.”. 2. Sửa đổi, bổ sung một số điểm, khoản của Điều 5 như sau: a) Sửa đổi, bé sung điểm c khoản 1 như sau:'
