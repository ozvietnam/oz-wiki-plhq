ghi_chu: 'Thông qua ngày 11-12-2025, có hiệu lực từ 01-01-2026 — sửa đổi, bổ sung 15 luật trong lĩnh vực nông nghiệp và môi trường (bao gồm Luật Bảo vệ và kiểm dịch thực vật, Luật Thú y, Luật Bảo vệ môi trường, Luật Thủy sản).'
