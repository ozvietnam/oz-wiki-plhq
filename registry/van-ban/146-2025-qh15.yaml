  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bd sung một số điều của Luật Bảo vệ môi trường 1. Sửa đổi, bổ sung khoản 37 Điều 3 như sau: “37. Khu sản xuất, kinh doanh, dịch vụ tập trung gồm khu công nghiệp,'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Sửa đổi, bỗ sung một số điều của Luật Bảo vệ và kiểm dịch thực vật 1. Sửa đổi, bé sung Điều 9 như sau: “Điều 9. Hệ thống cơ quan chuyên ngành bảo vệ và kiểm dịch thực vật 1. Hệ thống cơ quan chuyên ngành bảo vệ và kiểm dịch thực vật được tổ chức ở trung ương đến cấp tỉnh. 2. Tại cấp xã được bố trí nhân lực thực hiện nhiệm vu bảo vệ và kiểm dich thực vật trên địa ban.”.'
      trang_pdf: 14
    - dieu: 3
      noi_dung: 'Điều 3. Sửa đối, bổ sung một số điều của Luật Chăn nuôi 1. Sửa đổi, b6 sung khoản 4 Điều 11 như sau: “4. Bộ trưởng Bộ Nông nghiệp và Môi trường quy định việc cập nhật, khai thác và quản lý cơ sở dữ liệu quộc gia về chăn nuôi, quy định mã số cơ sở chăn nuôi, truy xuất nguồn gốc sản phẩm chăn nuôi.”.'
      trang_pdf: 16
    - dieu: 6
      noi_dung: 'Điều 6. Sửa đối, bé sung một số điều của Luật Do đạc và bản đồ 1. Sửa đôi, bố sung khoản 1 Điều 25 như sau: “1, Bản đồ địa chính là bản dé thé hiện các thửa đất và đối tượng địa lý liên quan, thành lập theo đơn vị hành chính cấp xã được cơ quan nhà nước có thẩm quyên xác nhận.”.'
      trang_pdf: 32
    - dieu: 8
      noi_dung: 'Điều 8. Sửa đỗi, bỗ sung một số điều của Luật Lâm nghiệp 1. B6 sung Điều 9a vào sau Điều 9 như sau: “Điều 9a. Quy hoạch lâm nghiệp Nội dung, thâm quyền, trình tự lập, thâm định, phê duyệt, công bố và điều chỉnh quy hoạch lâm nghiệp thực hiện theo quy định của pháp luật về quy hoach.”.'
      trang_pdf: 36
    - dieu: 10
      noi_dung: 'Điều 10. Sửa đôi, bỗ sung một số điều của Luật Tài nguyên nước 1. Sửa đổi, bỗ sung khoản 5 Điều 8 như sau: “5, Lan, lap sông, suối, kênh, mương, rạch nhưng không có biện pháp khắc phục, trừ trường hợp pháp luật có quy định khác; đặt vật cản, chướng ngại vật, xây dựng công trình kiến trúc, trồng cây gây cản trở thoát lũ, lưu thông nước ở các sông, suối, hồ chứa, kênh, mương, rạch nhưng không có biện pháp khắc phuc.”.'
      trang_pdf: 48
    - dieu: 12
      noi_dung: 'Điều 12. Sửa doi, bd sung một số điều của Luật Thú y 1. Sửa đôi, bé sung Điều 6 như sau: “Điều 6. Hệ thống cơ quan quản lý chuyên ngành thú y _ò__1L.Hệ thống cơ quan quản lý chuyên ngành thú y được tổ chức từ trung ương đên câp tỉnh. 2. Tại cấp xã được bố trí thú y xã dé thực hiện quản lý hoạt động chăn nuôi và thú y trên địa bàn.”.'
      trang_pdf: 57
    - dieu: 14
      noi_dung: 'Điều 14. Sửa đối, bé sung một số điều của Luật Thủy sản 1. Sửa đổi, bỗ sung khoản 3 Điều 11 như sau: “3, Nội dung, thâm quyên, lập, thâm định, phê duyệt, công bố, thực hiện,'
      trang_pdf: 69
    - dieu: 15
      noi_dung: 'Điều 15. Sửa đối, bỗ sung một số điều của Luật Trồng trọt 1. Sửa đôi, bé sung khoản 3 Điều 9 như sau: “3, Sản xuất, buôn bán giống cây trồng không đáp ứng điều kiện sản xuất, buôn bán; buôn bán phân bón không đáp ứng điều kiện buôn bán; sản xuất phân bón không đáp ứng điều kiện sản xuất hoặc chưa được cấp giấy chứng nhận đủ điều kiện sản xuất phân bón.”'
      trang_pdf: 75
    - dieu: 16
      noi_dung: 'Điều 16. Điều khoản thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026, trừ trường'
      trang_pdf: 76
ghi_chu: Thông qua ngày 11-12-2025, có hiệu lực từ 01-01-2026 — sửa đổi, bổ sung 15 luật trong lĩnh vực nông nghiệp và môi trường (bao gồm Luật Bảo vệ và kiểm dịch thực vật, Luật Thú y, Luật Bảo vệ môi trường, Luật Thủy sản).
