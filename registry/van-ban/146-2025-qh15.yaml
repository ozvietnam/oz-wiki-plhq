xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=216543), toàn văn PDF ký số 80 trang (146-qh15-2025.signed.pdf, Chủ tịch Quốc hội Trần Thanh Mẫn ký thông qua ngày 11-12-2025) và CSDL Quốc gia về VBPL (vbpl.vn ItemID=186269): sửa đổi, bổ sung một số điều của 15 luật trong lĩnh vực nông nghiệp và môi trường (gồm Luật Bảo vệ môi trường, Luật Bảo vệ và kiểm dịch thực vật, Luật Chăn nuôi, Luật Đa dạng sinh học, Luật Đê điều, Luật Đo đạc và bản đồ, Luật Khí tượng thủy văn, Luật Lâm nghiệp, Luật Phòng, chống thiên tai, Luật Tài nguyên nước, Luật Tài nguyên, môi trường biển và hải đảo, Luật Thú y, Luật Thủy lợi, Luật Thủy sản, Luật Trồng trọt); Điều 16 quy định có hiệu lực từ 01-01-2026 (riêng điểm a khoản 3 Điều 10 thực hiện từ 01-01-2027); đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
