  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/6/5/VB_7205.pdf, id=100276, SHA-256 81c216b54ff8674e67ee42bfa9748c8423814c4fc19e4df25c03be2302a47526): Thông báo số 7205/TB-CHQ ngày 02-06-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module màn hình LCD của điện thoại di động (tên gọi theo cấu tạo, công dụng: Module màn hình LCD, kích thước (W)73.20+/-0.05mm x (H)165.10+/-0.05mm x (T)2.22+/-0.15mm, khối lượng 53+/-2g; ký, mã hiệu M9903, nhà sản xuất Truly Opto-Electronics Ltd; cấu tạo gồm tấm hiển thị LCD kính lọc, bộ lọc màu, điện cực và tinh thể lỏng, đèn nền LED, tấm chắn, tấm nền cảm ứng, tấm chắn bằng kim loại phía sau màn hình, 01 IC điều khiển FT8725 tự kiểm tra lỗi, phân bổ điện áp và ghi nhận thông tin từ tấm nền cảm ứng, PCB linh hoạt truyền dẫn tín hiệu, chân kết nối với bo mạch chính, keo liên kết và giấy bảo vệ; là linh kiện của điện thoại di động không có chức năng chuyển đổi tín hiệu video), phân loại vào nhóm 85.24, mã số 8524.91.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
