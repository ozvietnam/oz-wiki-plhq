ghi_chu: 'Xác định trước mã số mặt hàng Module màn hình LCD của điện thoại di động (ký, mã hiệu M9903, nhà sản xuất Truly Opto-Electronics Ltd; kích thước (W)73.20+/-0.05mm x (H)165.10+/-0.05mm x (T)2.22+/-0.15mm, khối lượng 53+/-2g; gồm tấm hiển thị LCD tinh thể lỏng, đèn nền LED, tấm chắn, tấm nền cảm ứng, tấm chắn kim loại, IC điều khiển FT8725, PCB linh hoạt và chân kết nối; linh kiện hiển thị cho điện thoại di động không có chức năng chuyển đổi tín hiệu video) thuộc nhóm 85.24, mã số 8524.91.00.'
