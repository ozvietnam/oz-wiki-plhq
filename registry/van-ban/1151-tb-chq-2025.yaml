ghi_chu: 'Xác định trước mã số mặt hàng Bộ ổ cắm điện sử dụng cho điện áp dưới 1000V, dòng điện dưới 16A (ký, mã hiệu T411, nhà sản xuất DELI GROUP CO.,LTD; gồm dây dẫn điện dài 2 mét gắn phích cắm và bộ ổ cắm gồm 05 cụm công tắc - ổ cắm: 01 cụm gồm 01 công tắc và 03 ổ cắm sạc cổng USB-type A, 04 cụm còn lại mỗi cụm gồm 01 công tắc và 01 ổ cắm thiết bị điện 3 lỗ dùng cho phích cắm 2 hoặc 3 chấu; tối đa 250VAC - 10A, 2500W) thuộc nhóm 85.36, phân nhóm 8536.69, mã số 8536.69.92.'
