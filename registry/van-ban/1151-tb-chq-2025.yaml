  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/9/VB_1151.pdf, id=99777, SHA-256 8ca4f9ff226e06487ab95333f486d30bce7a322aebb91318203b137230d1bdcf): Thông báo số 1151/TB-CHQ ngày 04-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ ổ cắm điện sử dụng cho điện áp dưới 1000V, dòng điện dưới 16A (ký, mã hiệu T411, nhà sản xuất DELI GROUP CO.,LTD; gồm dây dẫn điện 03 lõi đồng cách điện plastic dài 2 mét gắn phích cắm và bộ ổ cắm gồm 05 cụm công tắc - ổ cắm: 01 cụm gồm 01 công tắc và 03 ổ cắm sạc cổng USB-type A, 04 cụm còn lại mỗi cụm gồm 01 công tắc và 01 ổ cắm thiết bị điện 3 lỗ dùng cho phích cắm 2 hoặc 3 chấu; điện áp tối đa 250VAC - 10A, công suất chịu tải tối đa 2500W, cổng USB-type A output 5V-2.4A), phân loại vào nhóm 85.36, phân nhóm 8536.69, mã số 8536.69.92; có hiệu lực từ ngày ký'
