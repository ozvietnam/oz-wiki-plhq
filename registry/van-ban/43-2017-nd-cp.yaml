ghi_chu: 'Quy định về nội dung, cách ghi và quản lý nhà nước về nhãn đối với hàng hóa lưu thông tại Việt Nam và hàng hóa xuất khẩu, nhập khẩu (đã được sửa đổi, bổ sung một số điều bởi Nghị định 111/2021/NĐ-CP). Hết hiệu lực toàn bộ từ ngày 23/01/2026 theo điểm b khoản 4 Điều 97 Nghị định 37/2026/NĐ-CP; quy định chuyển tiếp tại khoản 3 và khoản 4 Điều 98 Nghị định 37/2026/NĐ-CP (hàng hóa có nhãn đúng quy định NĐ 43/2017/NĐ-CP và NĐ 111/2021/NĐ-CP đã sản xuất, nhập khẩu, lưu thông trước ngày 23/01/2026 tiếp tục được lưu thông đến hết hạn sử dụng; nhãn và bao bì thương phẩm đã sản xuất, in ấn trước ngày 23/01/2026 tiếp tục được sử dụng không quá 02 năm kể từ ngày 23/01/2026).'
