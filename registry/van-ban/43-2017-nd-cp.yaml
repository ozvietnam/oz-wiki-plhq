  pham_vi: 'đã đối chiếu toàn văn bản ký số trên vanban.chinhphu.vn (docid=189385, tệp 43.signed.pdf): số hiệu 43/2017/NĐ-CP, trích yếu Về nhãn hàng hóa (4 chương, 25 điều và 5 phụ lục I–V), ban hành ngày 14/04/2017, Thủ tướng Chính phủ Nguyễn Xuân Phúc ký, khoản 1 Điều 24 (Chương IV, Hiệu lực thi hành — bản in PDF đánh trùng số hai điều liên tiếp đều là Điều 24, khuyết số Điều 23) quy định có hiệu lực thi hành từ ngày 01/06/2017 và thay thế Nghị định số 89/2006/NĐ-CP ngày 30/08/2006; đã được sửa đổi, bổ sung một số điều bởi Nghị định số 111/2021/NĐ-CP ngày 09/12/2021 (hiệu lực từ 15/02/2022); hết hiệu lực toàn bộ kể từ ngày 23/01/2026 do bị bãi bỏ theo khoản 1 và điểm b khoản 4 Điều 97 Nghị định số 37/2026/NĐ-CP ngày 23/01/2026 của Chính phủ (vanban.chinhphu.vn docid=216764, tệp 37-1.signed.pdf; quy định chuyển tiếp đối với hàng hóa, nhãn và bao bì thương phẩm sản xuất, nhập khẩu, in ấn trước ngày 23/01/2026 tại khoản 3 và khoản 4 Điều 98 Nghị định 37/2026/NĐ-CP)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
