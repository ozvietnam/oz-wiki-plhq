xac_minh:
  muc: NGUON_A
  pham_vi: 'Tên nguyên văn "Luật số 50/2005/QH11 của Quốc hội: Luật Sở hữu trí tuệ", cơ quan Quốc hội (Chủ tịch Nguyễn Văn An ký) xác minh trực tiếp tại vanban.chinhphu.vn. Ngày 29/11/2005 là ngày Quốc hội thông qua (quy ước ghi ngày ban hành của luật trên vbpl/tvpl); lưu ý trang vanban.chinhphu.vn ghi ngày ban hành 12/12/2005 (ngày Lệnh công bố). Hiệu lực 01/7/2006 và tình trạng còn hiệu lực — đã được sửa đổi, bổ sung bởi Luật 36/2009/QH12, Luật 42/2019/QH14 và Luật 131/2025/QH15 (ban hành 10/12/2025, hiệu lực 01/04/2026; văn bản hợp nhất 155/VBHN-VPQH) — theo nguồn thứ cấp (Thư viện Pháp luật, Luật Việt Nam, Cổng TTĐT Chính phủ); chưa đối chiếu trực tiếp trên vbpl.vn.'
  hieu_luc_da_doi_chieu: false
