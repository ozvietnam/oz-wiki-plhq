ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: kiểm soát xuất nhập khẩu hàng hoá liên quan đến quyền SHTT tại cửa khẩu (tạm dừng thủ tục hải quan khi có dấu hiệu xâm phạm quyền, kiểm tra nhãn hàng hoá nhập khẩu) — khách XNK tra khi lô hàng bị cơ quan hải quan/kiểm tra chuyên ngành giữ về nhãn hiệu, kiểu dáng, chỉ dẫn địa lý.'
