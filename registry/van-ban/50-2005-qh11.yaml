xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=30015): Luật Sở hữu trí tuệ số 50/2005/QH11 thông qua 29-11-2005, hiệu lực 01-07-2006; đã đối chiếu còn hiệu lực theo nguyên văn phần đầu VBHN 155/VBHN-VPQH ngày 09-09-2025 và các Luật sửa đổi, bổ sung (36/2009/QH12, 42/2019/QH14, 07/2022/QH15, 131/2025/QH15)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về quyền tác giả, quyền liên quan đến quyền tác giả, quyền sở hữu công nghiệp, quyền đối với giống cây trồng và việc bảo hộ các quyền đó.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân Việt Nam; tổ chức, cá nhân nước ngoài đáp ứng các điều kiện quy định tại Luật này và điều ước quốc tế mà Cộng hoà xã hội chủ nghĩa Việt Nam là thành viên.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Đối tượng quyền sở hữu trí tuệ 1. Đối tượng quyền tác giả bao gồm tác phẩm văn học, nghệ thuật, khoa học; đối tượng quyền liên quan đến quyền tác giả bao gồm cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng, tín hiệu vệ tinh mang chương trình được mã hoá.
      trang_pdf: 1
    - dieu: 35
      noi_dung: Điều 35. Hành vi xâm phạm các quyền liên quan 1. Chiếm đoạt quyền của người biểu diễn, nhà sản xuất bản ghi âm, ghi hình, tổ chức phát sóng. 2. Mạo danh người biểu diễn, nhà sản xuất bản ghi âm, ghi hình, tổ chức phát sóng. 3. Công bố, sản xuất và phân phối cuộc biểu diễn đã được định hình, bản ghi âm, ghi hình, chương trình phát sóng mà không được phép của người biểu diễn, nhà sản xuất bản ghi âm, ghi hình, tổ chức phát sóng.
      trang_pdf: 1
    - dieu: 66
      noi_dung: Điều 66. Tính sáng tạo của kiểu dáng công nghiệp Kiểu dáng công nghiệp được coi là có tính sáng tạo nếu căn cứ vào các kiểu dáng công nghiệp đã được bộc lộ công khai dưới hình thức sử dụng, mô tả bằng văn bản hoặc bất kỳ hình thức nào khác ở trong nước hoặc ở nước ngoài trước ngày nộp đơn hoặc trước ngày ưu tiên của đơn đăng ký kiểu dáng công nghiệp trong trường hợp đơn được hưởng quyền ưu tiên, kiểu dáng công nghiệp đó không thể được tạo ra một
      trang_pdf: 1
    - dieu: 97
      noi_dung: 'Điều 97. Sửa đổi văn bằng bảo hộ 1. Chủ văn bằng bảo hộ có quyền yêu cầu cơ quan quản lý nhà nước về quyền sở hữu công nghiệp sửa đổi những thông tin sau đây trên văn bằng bảo hộ với điều kiện phải nộp phí, lệ phí: a) Thay đổi, sửa chữa thiếu sót liên quan đến tên và địa chỉ của tác giả, chủ văn bằng bảo hộ; b) Sửa đổi bản mô tả tính chất, chất lượng đặc thù, khu vực địa lý mang chỉ dẫn địa lý;'
      trang_pdf: 1
    - dieu: 127
      noi_dung: 'Điều 127. Hành vi xâm phạm quyền đối với bí mật kinh doanh 1. Các hành vi sau đây bị coi là xâm phạm quyền đối với bí mật kinh doanh: a) Tiếp cận, thu thập thông tin thuộc bí mật kinh doanh bằng cách chống lại các biện pháp bảo mật của người kiểm soát hợp pháp bí mật kinh doanh đó; b) Bộc lộ, sử dụng thông tin thuộc bí mật kinh doanh mà không được phép của chủ sở hữu bí mật kinh doanh đó;'
      trang_pdf: 1
    - dieu: 158
      noi_dung: Điều 158. Điều kiện chung đối với giống cây trồng được bảo hộ Giống cây trồng được bảo hộ là giống cây trồng được chọn tạo hoặc phát hiện và phát triển, thuộc Danh mục loài cây trồng được Nhà nước bảo hộ do Bộ Nông nghiệp và Phát triển nông thôn ban hành, có tính mới, tính khác biệt, tính đồng nhất, tính ổn định và có tên phù hợp.
      trang_pdf: 1
    - dieu: 189
      noi_dung: Điều 189. Quyền tạm thời đối với giống cây trồng 1. Quyền tạm thời đối với giống cây trồng là quyền của người đăng ký bảo hộ giống cây trồng phát sinh từ ngày đơn đăng ký bảo hộ giống cây trồng được công bố đến ngày cấp Bằng bảo hộ giống cây trồng. Trong trường hợp giống cây trồng không được cấp Bằng bảo hộ thì người đăng ký bảo hộ không có quyền này.
      trang_pdf: 1
    - dieu: 221
      noi_dung: Điều 221. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 07 năm 2006.
      trang_pdf: 1
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK: kiểm soát xuất nhập khẩu hàng hoá liên quan đến quyền SHTT tại cửa khẩu (tạm dừng thủ tục hải quan khi có dấu hiệu xâm phạm quyền, kiểm tra nhãn hàng hoá nhập khẩu) — khách XNK tra khi lô hàng bị cơ quan hải quan/kiểm tra chuyên ngành giữ về nhãn hiệu, kiểu dáng, chỉ dẫn địa lý.'
