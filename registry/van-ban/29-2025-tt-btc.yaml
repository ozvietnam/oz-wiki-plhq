  pham_vi: 'Đã đọc toàn văn PDF ký số bậc A trên datafiles.chinhphu.vn (29-btc.signed.pdf, 20 trang, ký Thứ trưởng Nguyễn Đức Chi ngày 26-05-2025) và đối chiếu thẻ chinhphu.vn (docid=213831): gồm 5 Điều và 2 Phụ lục (Phụ lục I gồm các Mẫu số HQ 02-BKTKTGT, HQ 06a-BKCTHH, HQ 06b-BKCTHH; Phụ lục II quy định chỉ tiêu thông tin và hướng dẫn khai). Điều 1 sửa đổi, bổ sung điểm a khoản 2 Điều 8 và điểm a.3 khoản 1 Điều 10 Thông tư 191/2015/TT-BTC (đã được sửa đổi, bổ sung tại Thông tư 56/2019/TT-BTC); Điều 2 sửa đổi, bổ sung, thay thế các Phụ lục của Thông tư 191/2015/TT-BTC; Điều 3 thay thế một số cụm từ về tên cơ quan hải quan sau sắp xếp tổ chức bộ máy; Điều 4 sửa đổi, bổ sung Điều 4 Thông tư 56/2019/TT-BTC. Điều 5 (Điều khoản thi hành) khoản 1 quy định Thông tư có hiệu lực kể từ ngày 09-07-2025. Đối chiếu tình trạng hiện tại đến 2026-11-21 trên chinhphu.vn: chưa có văn bản sửa đổi, bổ sung, thay thế hay bãi bỏ, đang CON_HIEU_LUC.'
