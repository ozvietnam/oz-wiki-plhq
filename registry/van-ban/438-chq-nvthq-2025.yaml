  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/26/438.CHQ.pdf, id=99701, SHA-256 2a761137f27dc7ec25f1ee5ef7f28a2206a943bf8fe4684a1a91218de5530236): Công văn hỏa tốc số 438/CHQ-NVTHQ ngày 25-03-2025 của Cục Hải quan (Phó Cục trưởng Lưu Mạnh Tưởng ký) hướng dẫn thực hiện Quyết định số 662/QĐ-BCT ngày 12-03-2025 của Bộ trưởng Bộ Công Thương về kết quả rà soát vụ việc áp dụng biện pháp chống lẩn tránh phòng vệ thương mại đối với một số sản phẩm đường mía (mã vụ việc AR01.AC02-AD13.AS01): kể từ ngày 27-03-2025, sản phẩm đường mía thuộc các mã HS 1701.13.00, 1701.14.00, 1701.91.00, 1701.99.10, 1701.99.90 và 1702.90.91 nhập khẩu vào Việt Nam do Công ty PT. Kebun Tebu Mas (Indonesia) sản xuất/xuất khẩu phải khai báo mã thuế chống bán phá giá G144 trên VNACCS (mức thuế gộp 42,99% thuế chống bán phá giá và 4,65% thuế chống trợ cấp); được đính chính thời hạn hiệu lực đến hết ngày 15-06-2026 tại Công văn số 2177/CHQ-NVTHQ ngày 16-04-2025'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn khai báo mã thuế G144 trên VNACCS (42,99% thuế CBPG + 4,65% thuế CTC) từ ngày 27/03/2025 đến hết ngày 15/06/2026 (theo đính chính tại Công văn 2177/CHQ-NVTHQ) đối với sản phẩm đường mía (HS 1701.13.00, 1701.14.00, 1701.91.00, 1701.99.10, 1701.99.90, 1702.90.91) do PT. Kebun Tebu Mas (Indonesia) sản xuất.'
