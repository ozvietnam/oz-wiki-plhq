    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Luat này quy định về trách nhiệm tiếp công dân; quyền và nghĩa vụ của người đến khiếu nại, tô cáo, kiến nghị, phản anh; việc tô chức hoạt động tiếp công dân tại Trụ sở tiếp công dân, địa điểm tiếp công dân của cơ quan, tổ chức, đơn vị và điều kiện bảo đảm cho hoạt động tiếp công dân. 2. Việc tiếp đại diện của cơ quan, tổ chức đến khiếu nại, kiến nghị, phản
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Tiếp công đân là việc cơ quan, tổ chức, đơn vị, cá nhân quy định tại Điều nại, tố cáo, kiến nghị, phản ánh theo đúng quy định của pháp luật. và tiếp công dân đột xuất. 2. Kiến nghị, phản ánh là việc công dan cung cấp thông tin, trình bày ý kiến,'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc tiếp công dân 1. Việc tiếp công dân phải được tiễn hành tại nơi tiếp công dân của cơ quan, tô chức, đơn vi. 4 của Luật này đón tiếp để lắng nghe, tiếp nhận khiếu nại, tố cáo, kiến nghị, phản ánh của công dân; giải thích, hướng dẫn cho công dân về việc thực hiện khiếu Tiếp công dân bao gồm tiếp công dân thường xuyên, tiếp công dân định kỳ
      trang_pdf: 1
    - dieu: 8
      noi_dung: Điều 8. Trách nhiệm của người tiếp công dân 1. Khi tiếp công dân, người tiếp công dân phải bảo dam trang phục chỉnh té, có đeo thẻ công chức, viên chức hoặc phù hiệu theo quy định.
      trang_pdf: 4
    - dieu: 13
      noi_dung: Điều 13. Tiếp công tại Trụ sở tiếp công dân cấp huyện 1. Trụ sở tiếp công dân cấp huyện được thành lập ở mỗi huyện, quận, thị xã, thành phố thuộc tỉnh, là nơi tiếp công dân đến khiếu nại, tố cáo, kiến nghị, phản ánh với Huyện ủy, Quận ủy, Thị ủy, Thành ủy (sau đây gọi chung là Huyện ủy), Hội đồng nhân dân, Ủy ban nhân dân cấp huyện.
      trang_pdf: 8
    - dieu: 17
      noi_dung: Điều 17. Việc to chức tiếp công dân tại Tòa án nhân dân, Viện kiểm sát nhân dân, Kiểm toán nhà nước 1, Tòa án nhân dân tối cao, Tòa án nhân dân các cấp, Viện kiêm sát nhân dân tối cao, Viện kiểm sát nhân dân các cấp, Kiểm toán nhà nước, Kiểm toán nhà nước khu vực có trách nhiệm tổ chức việc tiếp công dân và bố trí địa điểm tiếp công dân của cơ quan mình để tiếp nhận khiếu nại, tố cáo, kiến nghị, phản ánh của công dân.
      trang_pdf: 10
    - dieu: 21
      noi_dung: Điều 21. Tiếp công dân của đại biéu Quốc hội 1. Đại biểu Quốc hội thực hiện việc tiếp công dân tại Trụ sở tiếp công dân cấp tỉnh hoặc nơi tiếp công dân do Đoàn đại biểu Quốc hội bố trí theo sự phân công của Trưởng đoàn đại biểu Quốc hội hoặc khi thấy cần thiết.
      trang_pdf: 12
    - dieu: 25
      noi_dung: Điều 25. Tiếp nhận và xử lý bước đầu khiếu nại, tố cáo, kiến nghị, phản ánh 1. Khi công dân đến khiéu nại, tố cáo, kiến nghị, phản ánh thì người tiếp công dân có trách nhiệm đón tiếp, yêu cầu họ nêu rõ họ tên, địa chỉ hoặc xuất trình giấy tờ tùy thân, giấy ủy quyên (nếu có); tiếp nhận đơn khiếu nại, tổ cáo, kiến nghị, phản ánh hoặc hướng dẫn người đến khiếu nại, tố cáo, kiến nghị, phản anh trình bày nội dung vụ việc.
      trang_pdf: 14
    - dieu: 30
      noi_dung: Điều 30. Tiếp và xử lý trường hợp nhiều người cùng khiếu nại, tổ cáo, kiến nghị, phản ánh về một nội dung tại nơi tiếp công dân
      trang_pdf: 17
    - dieu: 35
      noi_dung: Điều 35. Hiệu lực thi hành Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2014 Những quy định về tiếp công dân tại Chương V của Luật khiếu nại, tÔ cáo sô 09/1998/QH10 đã được sửa đối, bô sung một số điêu theo Luật sô 26/2004/QH11 và Luật sô 58/2005/QH11, Chương V của Luật khiêu nại sô 02/2011/QH13 het hiệu lực thi hành kề từ ngày Luật này có hiệu lực
      trang_pdf: 19
