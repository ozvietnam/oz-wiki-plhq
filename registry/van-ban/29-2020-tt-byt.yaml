xac_minh:
  muc: NGUON_A
  pham_vi: 'đã đối chiếu toàn văn PDF bản gốc (VanBanGoc_461468.pdf, Bộ trưởng Nguyễn Thanh Long ký) và bản HTML đầy đủ trên CSDLQG vbpl.vn (ID 147276): số hiệu 29/2020/TT-BYT, tiêu đề, ngày ban hành 31/12/2020, gồm 5 Điều và 6 Phụ lục; khoản 1 Điều 1 (kèm Phụ lục 1) sửa đổi, bổ sung khoản 4 Điều 4, Phụ lục số 01-MP và Điều 33 của Thông tư 06/2011/TT-BYT về quản lý mỹ phẩm (được hợp nhất tại VBHN 09/VBHN-BYT ngày 25/07/2025); Điều 2 (kèm Phụ lục 6) bãi bỏ toàn bộ 28 văn bản và bãi bỏ một phần 02 văn bản QPPL do Bộ trưởng Bộ Y tế ban hành, liên tịch ban hành; Điều 3 quy định có hiệu lực từ 15/02/2021 (riêng các khoản 5, 6, 7, 8 và 11 Điều 1 có hiệu lực từ 01/01/2021); trên vbpl.vn ghi nhận trạng thái hết hiệu lực một phần (effStatus HHL1P) do một số thông tư về dược được sửa tại các khoản khác của Điều 1 sau đó đã được thay thế, trong khi khoản 1 Điều 1 sửa đổi TT 06/2011/TT-BYT vẫn còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác minh nguồn bậc A (OZV-561) — khoản 1 Điều 1 và Phụ lục 1 sửa đổi, bổ sung Thông tư 06/2011/TT-BYT về quản lý mỹ phẩm (miễn Giấy chứng nhận lưu hành tự do CFS đối với mỹ phẩm nhập khẩu từ nước thành viên CPTPP và ASEAN; quy định kiểm tra điện tử hoặc hợp pháp hóa lãnh sự CFS; sửa quy trình cấp CFS mỹ phẩm xuất khẩu tại Điều 33 theo Nghị định 69/2018/NĐ-CP). Phần sửa đổi TT 06/2011/TT-BYT tiếp tục có hiệu lực theo VBHN 09/VBHN-BYT ngày 25/07/2025.'
