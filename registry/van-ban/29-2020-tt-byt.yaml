    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bổ sung một số văn bản quy phạm pháp luật trong lĩnh vực mỹ phẩm, dược, phòng, chống HIV/AIDS, an toàn thực phẩm 1. Sửa đổi, bổ sung một số điều của Thông tư số 06/2011/TT-BYT ngày 25 tháng 01 năm 2011 của Bộ trưởng Bộ Y tế quy định về quản lý mỹ phẩm (sau đây viết tắt là Thông tư số 06/2011/TT-BYT) như sau: a) Sửa đổi, bổ sung khoản 4 Điều 4 như sau:'
      trang_pdf: 1
      sha256_pdf: 58d6b12572b64fd070eabfbbd1c0b1191b33b1959113304ba20a04e19609f4fe
    - dieu: 2
      noi_dung: Điều 2. Bãi bỏ một số văn bản quy phạm pháp luật do Bộ trưởng Bộ Y tế ban hành, liên tịch ban hành Bãi bỏ toàn bộ 28 văn bản quy phạm pháp luật và bãi bỏ một phần 02 văn bản quy phạm pháp luật do Bộ trưởng Bộ Y tế ban hành, liên tịch ban hành tại Phụ lục 6 ban hành kèm theo Thông tư này.
      trang_pdf: 12
      sha256_pdf: 58d6b12572b64fd070eabfbbd1c0b1191b33b1959113304ba20a04e19609f4fe
    - dieu: 3
      noi_dung: Điều 3. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 15 tháng 02 năm 2021. 2. Riêng các quy định tại các khoản 5, 6, 7, 8 và 11 Điều 1 Thông tư này có hiệu lực từ ngày 01 tháng 01 năm 2021. 3. Các quy định liên quan đến nộp hồ sơ, tài liệu và tra cứu trực tuyến được áp dụng trong giai đoạn dịch Covid - 19 cho đến thời điểm Bộ Y tế xem xét, điều chỉnh phù hợp với yêu cầu thực tiễn.
      trang_pdf: 12
      sha256_pdf: 58d6b12572b64fd070eabfbbd1c0b1191b33b1959113304ba20a04e19609f4fe
    - dieu: 4
      noi_dung: Điều 4. Quy định chuyển tiếp 1. Các hồ sơ đã nộp cho cơ quan tiếp nhận hồ sơ trước ngày Thông tư này có hiệu lực nhưng đang trong quá trình giải quyết được áp dụng theo quy định có liên quan tại Thông tư này hoặc các quy định trước ngày Thông tư này có hiệu lực theo hướng thuận tiện cho doanh nghiệp, tổ chức, cá nhân.
      trang_pdf: 12
      sha256_pdf: 58d6b12572b64fd070eabfbbd1c0b1191b33b1959113304ba20a04e19609f4fe
    - dieu: 5
      noi_dung: Điều 5. Trách nhiệm thi hành Vụ trưởng Vụ Pháp chế, Chánh Văn phòng Bộ, Chánh Thanh tra Bộ, Vụ trưởng, Cục trưởng, Tổng Cục trưởng các Vụ, Cục, Tổng cục thuộc Bộ Y tế và các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này./.
      trang_pdf: 13
