loai: QUYET_DINH
ten: Về việc ban hành Quy trình phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu nhập khẩu
co_quan: TCHQ
ngay_ban_hanh: '2018-06-28'
