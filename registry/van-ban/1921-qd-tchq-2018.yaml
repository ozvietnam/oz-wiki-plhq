    truy_cap: '2026-10-28'
xac_minh:
  muc: NGUON_B
  pham_vi: >-
    Toàn văn Quy trình phân loại hàng hóa, áp dụng mức thuế (Quyết định 3 điều + Quy trình 10 điều
    + 03 Phụ lục) đã tải và đọc từ bản đăng lại tại Vietnam Trade Portal (nguồn BẬC C, bản không
    có chữ ký số / con dấu). Số hiệu, ngày ban hành 28-06-2018, cơ quan ban hành và nội dung trích
    yếu được XÁC MINH LẠI trên nguồn bậc A: tài liệu 'Cục Kiểm định hải quan' (2023) do Tổng cục
    Hải quan phát hành, đăng trên files.customs.gov.vn, mục 2.1 (trang in 10) dẫn nguyên văn
    "Quyết định số 1921/QĐ-TCHQ ngày 28/06/ 2018 của Tổng cục Hải quan về việc ban hành quy
    trình phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu." — và
    liệt kê kèm Quyết định 2166/QĐ-TCHQ ngày 04/8/2021. Đây là nguồn bậc A theo tên miền nhưng
    là tài liệu dẫn chiếu — không phải toàn văn quyết định ký gốc.
    CHƯA đối chiếu bản quyết định ký gốc; CHƯA xác minh tình trạng hiệu lực hiện nay; CHƯA
    xác minh danh mục văn bản bị bãi bỏ tại Điều 2.2 (đọc từ bản bậc C).
    Đã loại trừ (28-10-2026): vbpl.vn KHÔNG có 1921/QĐ-TCHQ (không trong sitemap 174.014 URL;
    quét dải ID 128000-132000 bằng Server Action getDocumentDetail — 0 văn bản Tổng cục Hải quan);
    congbao.chinhphu.vn KHÔNG có (quyết định của TCHQ đăng Công báo Bộ Tài chính).
  hieu_luc_da_doi_chieu: false
  chan:
    ma: THIEU_PDF_A
    ngay: '2026-10-28'
    viec_tiep: >-
      Cần bản ký gốc (vbpl.vn / customs.gov.vn / CSDLQG) để xác minh hiệu lực và danh mục bãi bỏ
      Điều 2.2; sau đó mới ghi hieu_luc_tu, quan_he và tinh_trang.
      Đã thử (28-10-2026) và KHÔNG có bản gốc trên các nguồn bậc A đã biết:
      (1) vbpl.vn — không có trong sitemap (174.014 URL, đã quét) và không có trong dải ID
      128000-132000 (tháng 6/2018) quét bằng Server Action 'getDocumentDetail' (0 văn bản
      Tổng cục Hải quan); cũng không có 2166/QĐ-TCHQ (dải 148500-152000) và 4023/QĐ-TCHQ
      (dải 111000-118000) — CSDLQG chưa số hóa các quyết định của TCHQ từ 2013 trở đi;
      (2) congbao.chinhphu.vn (API api-searchcongbao.chinhphu.vn) — không có 1921/QĐ-TCHQ,
      2166/QĐ-TCHQ, 2999/QĐ-TCHQ (quyết định của TCHQ đăng trên Công báo Bộ Tài chính,
      không đăng Công báo Chính phủ);
      (3) vanban.chinhphu.vn — form tìm kiếm ASP.NET trả "Không có thông tin văn bản!";
      (4) customs.gov.vn — chỉ trả 200 với trang SPA rỗng; kv*.customs.gov.vn trả vỏ SPA;
      tongcuc.customs.gov.vn và kh*.customs.gov.vn không phân giải DNS.
      Còn lại: Công báo Bộ Tài chính, hoặc bản PDF ký gốc do Tổng cục Hải quan phát hành.
  ngay: '2026-10-28'
  boi: zcode@ozvietnam    Nguồn A là tài liệu nghiên cứu của cơ quan dẫn văn bản, không phải toàn văn
    quyết định ký gốc. PDF Vietnam Trade Portal mang nhãn THƯ VIỆN PHÁP LUẬT;
    chỉ dùng đối chiếu bổ sung, không tự gán bậc A cho tên miền này.
toan_van: raw/download/vietnamtradeportal.gov.vn/1921-qd-tchq.txt
ghi_chu: >-
  Nhận riêng 1921/QĐ-TCHQ tại issue #2, bình luận 5980982623. Không ghi hieu_luc_tu,
  toan_van hoặc quan_he khi chưa có bản ký gốc để kiểm chứng điều khoản.
  Danh mục nguồn và việc cần nhận tiếp: docs/thu-thap/2026-10-04-1921-qd-tchq.md.
  Cập nhật 28-10-2026 (issue #87, PR #1): nạp toàn văn + trích đoạn, hạ muc xác minh từ NGUON_A
  xuống NGUON_B (mức NGUON_A trước đây MÂU THUẪN với chính pham_vi ghi "chưa đối chiếu bản ký
  gốc" — nguồn duy nhất là tài liệu dẫn chiếu, không phải toàn văn). Vẫn giữ tinh_trang
  CHUA_XAC_MINH và hieu_luc_da_doi_chieu: false vì chưa có bản ký gốc.
  Điều 2.2 (bản bậc C) cho biết QĐ này bãi bỏ 2134/QĐ-TCHQ, 2135/QĐ-TCHQ, Điều 52-54 quy trình
  kèm QĐ 1966/QĐ-TCHQ, và 3 công văn — CHƯA ghi quan_he vì chưa đối chiếu bản gốc.
