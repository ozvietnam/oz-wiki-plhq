loai: QUYET_DINH
ten: Về việc ban hành Quy trình phân loại hàng hóa, áp dụng mức thuế đối với hàng hóa xuất khẩu nhập khẩu
co_quan: TCHQ
ngay_ban_hanh: '2018-06-28'
tinh_trang: CHUA_XAC_MINH
nhanh:
  - phan-loai-hs/quy-trinh-phan-loai
  - hai-quan/so-tay-nghiep-vu
nguon:
  - url: https://files.customs.gov.vn/CustomsCMS/TONG_CUC/2023/11/21/2022-08%20C%E1%BB%A5c%20ki%E1%BB%83m%20%C4%91%E1%BB%8Bnh%20HQ.pdf
    truy_cap: '2026-10-04'
