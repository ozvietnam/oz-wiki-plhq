  pham_vi: 'đối chiếu toàn văn PDF bậc A có chữ ký số trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/19/VB_20245%20(1).pdf, id=105485, SHA-256 730214f48c8bc301023ef884a0fb45d47910802694eef408ef570eed3639e136): Thông báo số 20245/TB-CHQ ngày 12-08-2026 (ký số 12-08-2026 15:40:22 +07:00) của Cục Hải quan về việc phát hành ấn chỉ bán thu tiền từ ngày 12-08-2026 (căn cứ Quyết định 1887/QĐ-CHQ ngày 25-11-2025 của Cục trưởng Cục Hải quan về việc ban hành Quy chế quản lý ấn chỉ Hải quan): (1) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại nhỏ): ký hiệu mẫu MT-01, giá bán 441 đồng/chiếc, ngày bắt đầu sử dụng 12/8/2026, gồm 2 dải: AA/2026 (999.999 chiếc, từ 000001 đến 999999) và AB/2026 (999.999 chiếc, từ 000001 đến 999999); (2) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại lớn): ký hiệu mẫu MT-02, ký hiệu tem AA/2026, số lượng 370.000 chiếc (từ số 000001 đến số 370000), giá bán 606 đồng/chiếc, ngày bắt đầu sử dụng 12/8/2026; người ký Trần Thị Minh Huệ (TL. Cục trưởng, KT. Trưởng ban Tài vụ - Quản trị, Phó Trưởng ban)'
