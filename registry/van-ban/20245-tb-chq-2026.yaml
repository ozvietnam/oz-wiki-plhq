ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành ấn chỉ bán thu tiền từ ngày 12-08-2026: (1) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại nhỏ) mẫu MT-01, giá bán 441 đồng/chiếc, gồm 2 dải AA/2026 (999.999 chiếc, từ 000001 đến 999999) và AB/2026 (999.999 chiếc, từ 000001 đến 999999); (2) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại lớn) mẫu MT-02, ký hiệu tem AA/2026, số lượng 370.000 chiếc (từ 000001 đến 370000), giá bán 606 đồng/chiếc. Chưa gắn quan_he tới 1887/QĐ-CHQ/2025 vì chưa có trong sổ (tránh điểm mù Cao).'
