xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/22/1.VB_17494.pdf, id=104820, SHA-256 cc39b5dba058f30fa597dd5b71c9c6db84fc8123ad90d3a5a7a4ba19e8e74248): Thông báo số 17494/TB-CHQ ngày 15-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Đồng lá mỏng bằng đồng tinh luyện chắn nhiễu điện từ dạng cuộn (ký mã hiệu HSF-USB3-3.0, EMI Shielding Film; chiều dày 10 µm không gồm lớp bồi, chiều rộng 250-500 mm, chiều dài 10-500 m; cấu tạo 3 lớp chính gồm lớp đồng tinh luyện 47,1% mạ điện phân niken 7,5% dày 4 µm ở giữa, bồi 2 mặt bằng lớp cách điện nhựa epoxy 24,7% + carbon 6,1% dày 3 µm và lớp keo kết dính epoxy không dẫn điện 14,6% dày 3 µm, kèm 2 lớp màng nhựa PET bảo vệ bề mặt trên dưới khi vận chuyển; dùng làm lớp dẫn điện và chắn nhiễu điện từ EMI gắn lên bản mạch in điện tử PCB/FPCB), phân loại vào nhóm 74.10, mã số 7410.21.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Đồng lá mỏng bằng đồng tinh luyện đã bồi dùng chắn nhiễu điện từ (ký mã hiệu HSF-USB3-3.0, EMI Shielding Film; dạng cuộn, dày 10 µm không tính lớp bồi PET, gồm lớp đồng tinh luyện mạ niken ở giữa bồi lớp nhựa epoxy + carbon và lớp keo epoxy không dẫn điện dùng gắn lên bản mạch in PCB/FPCB) thuộc nhóm 74.10, mã số 7410.21.00.'
