  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=219510) và toàn văn PDF ký số (74-vbhn-bct.signed.pdf, 17 trang, 9 điều và các Phụ lục II, III, IV, V, VII, VIII, Thứ trưởng Nguyễn Sinh Nhật Tân ký xác thực ngày 14-09-2026): hợp nhất Thông tư 41/2019/TT-BCT ngày 16-12-2019 (hiệu lực 29-01-2020), được sửa đổi, bổ sung bởi Thông tư 23/2021/TT-BCT ngày 15-12-2021 (hiệu lực 01-02-2022), Thông tư 08/2023/TT-BCT ngày 31-03-2023 (hiệu lực 16-05-2023) và Thông tư 48/2026/TT-BCT ngày 05-09-2026 (hiệu lực 05-09-2026); đối chiếu đang là bản hợp nhất hiện hành'
  hieu_luc_da_doi_chieu: true
