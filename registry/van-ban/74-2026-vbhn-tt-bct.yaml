  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Thông tư số 30/2018/TT-BCT ngày 01 thang 10 nam 2018 cua Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của Nghị định số 107/2018/NĐ- CP ngày 15 thang 8 năm 2018 của Chính phủ về kinh doanh xuất khẩu gạo (Thông tư số 30/2018/TT-BCT) Ban hành kèm theo Thông tư này Phụ lục I - Danh mục chỉ tiết theo mã HS đối với thóc, gạo xuất khẩu quy định tại Thông tư số 30/2018/TT-BCT.
      trang_pdf: 2
    - dieu: 2
      noi_dung: Điều 2. Thông tư số 10/201 1/TT-BCT ngày 30 tháng 3 năm 2011 của Bộ trưởng Bộ Công Thương sửa doi, bỗ sung, bãi bỏ một số quy ( định về thủ tục hành chính trong lĩnh vực xuất, nhập khẩu theo Nghị quyêt so 59/NQ-CP ngày 17 tháng 12 năm 2010 của Chính phủ về việc đơn giản hóa thủ tục hành chính thuộc phạm vi chức năng quản lý của Bộ Công Thương (Thông tư số 10/2011/TT-BCT)
      trang_pdf: 2
    - dieu: 4
      noi_dung: 'Điều 4. Thông tư số 38/2014/TT-BCT ngày 24 (háng 10 năm 2014 của Bộ trưởng Bộ Công Thương quy định chỉ tiết một số điều của Nghị định số ! Thông tư số 23/202 1/TT-BCT có căn cứ ban hành như sau: “Căn cứ Nghị định số 98/2017/NĐ-CP ngày 18 tháng 8 năm 2017 của Chính phủ quy định chức năng, nhiệm vụ, quyên hạn và cơ cấu tổ chức của Bộ Công Thương:'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Thông tư số 57/2018/TT-BCT ngày 26 tháng 12 năm 2018 của Bộ trưởng Bộ Công Thương quy định chỉ tiết một số điều của các Nghị định liên quan đến kinh doanh thuốc lá (Thông tư số 57/2018/TT-BCT) _1. Ban hành kèm theo Thông tư này Phụ lục VỊ - Danh mục chỉ tiết theo mã HS đôi với nguyên liệu thuôc lá, giây cuỗn điều thuốc lá quy định tại Thông tư số 57/2018/TT-BCT.
      trang_pdf: 3
    - dieu: 7
      noi_dung: Điều 7. Thông tư số 15/2013/TT-BCT ngày 15 tháng 7 năm 2013 của Bộ trưởng Bộ Công Thương quy định về xuất khẩu than (Thông tư số 15/2013/TT-BCT) ¬ oo.
      trang_pdf: 3
    - dieu: 8
      noi_dung: Điều 8. Nguyên tắc áp dụng danh mục 1. Trường hợp chỉ liệt kê mã HS 4 số thì toàn bộ các mã HS 8 số thuộc nhóm HS 4 sô này đêu được áp dụng. 2. Trường hợp chỉ liệt kê mã HS 6 số thì toàn bộ các mã HS 8 số thuộc phân nhóm HS 6 sô này déu được áp dụng. 3. Trường hợp liệt kê chi tiết đến mã HS 8 số thì chỉ mã HS 8 số đó mới được áp dụng.
      trang_pdf: 3
    - dieu: 9
      noi_dung: 'Điều 9. Hiệu lực thi hành 3 Điều này được bãi bỏ theo quy định tại khoản 2 Điều 7 của Thông tư số 23/2021/TT-BCT, có hiệu lực kể từ ngày 01 tháng 02 năm 2022. * Điều 7 của Thông tư số 23/2021/TT-BCT, có hiệu lực kẻ từ ngày 01 tháng 02 năm 2022 quy định như sau: Điều 7. Hiệu lực thi hành'
      trang_pdf: 3
    - dieu: 21
      noi_dung: Điều 21. Điều khoản chuyển tiếp 1. Các Giấy phép do các cơ quan có thẩm quyên cap cho thương nhân theo quy định tại Thông tư số 12/2018/TT- BCT của Bộ trưởng Bộ Công Thương quy định chỉ tiết một số điều của | Luật Quản lý ngoại thương và Nghị định số 69/2018/ND- CP ngày 15 tháng 5 năm 2018 của Chính phú quy định chỉ tiết một số điều của Luật Quản lý ngoại thương;
      trang_pdf: 4
ghi_chu: Trinh sát đêm 7/11, đối chiếu nguồn A ngày 14/11. Bản hợp nhất danh mục mã HS XNK của BCT (cặp với 73/2026/VBHN-TT-BCT) — đã nối đủ quan_he.hop_nhat với 41/2019/TT-BCT, 23/2021/TT-BCT, 08/2023/TT-BCT và 48/2026/TT-BCT.
