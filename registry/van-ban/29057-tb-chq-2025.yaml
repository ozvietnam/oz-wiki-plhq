  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/10/14/3.VBDI_29057.pdf, id=101581, SHA-256 099553a3a1238531bf88ddc3ada6811c5ba054b12fcb125fcb80301992ee2150): Thông báo số 29057/TB-CHQ ngày 13-10-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ sản phẩm loa ở dạng bộ được đóng gói để bán lẻ (ký, mã hiệu HW-Q990F/XL; hệ thống loa 11.1.4 kênh gồm 4 loa đã lắp vào vỏ loa: 01 loa thanh/soundbar model HW-Q990F công suất 41W, 01 loa trầm/subwoofer model PS-WQ990F công suất 48W, 02 loa phụ/rear speaker model PS-RQ990F công suất 19W, kèm điều khiển từ xa, cáp HDMI, dây nguồn, sách hướng dẫn sử dụng; kết nối HDMI, optical, Bluetooth, Wi-Fi, không có khả năng tái tạo âm thanh từ USB hay thẻ nhớ), phân loại vào nhóm 85.18, phân nhóm 8518.22, mã số 8518.22.10; có hiệu lực từ ngày ký'
