ghi_chu: 'TB hành chính/nghiệp vụ — không phải XDTMS: phát hành ấn chỉ nghiệp vụ hải quan từ ngày 14-11-2025: (1) Tem điện tử rượu nhập khẩu độ cồn <30 độ mẫu RD30, ký hiệu tem AA/2025, số lượng 5.849.832 chiếc (từ 0000001 đến 5849832), giá bán 868 đồng/chiếc; (2) Tem miễn thuế "VIETNAM DUTY NOT PAID" (loại nhỏ) mẫu MT-01, giá bán 516 đồng/chiếc, gồm 4 dải AA/2025, AB/2025, AC/2025 (mỗi dải 999.999 chiếc, từ 000001 đến 999999) và AD/2025 (200.003 chiếc, từ 000001 đến 200003). Chưa gắn quan_he tới 23/2021/TT-BTC, 31/2025/TT-BTC, 4281/QĐ-TCHQ/2016, 4010/QĐ-TCHQ/2017 vì chưa có trong sổ (tránh điểm mù Cao).'
