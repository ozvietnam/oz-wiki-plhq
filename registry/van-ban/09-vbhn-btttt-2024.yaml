ghi_chu: 'Văn bản hợp nhất Thông tư 22/2018/TT-BTTTT và Thông tư 11/2024/TT-BTTTT về Danh mục hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực in, phát hành xuất bản phẩm (kèm nội dung bãi bỏ khoản 1 Điều 1 và Phụ lục 01 bởi Thông tư 18/2023/TT-BTTTT ngày 30-11-2023 — văn bản 18/2023/TT-BTTTT chưa có mục riêng trong sổ nên ghi nhận tại pham_vi và ghi_chu).'
