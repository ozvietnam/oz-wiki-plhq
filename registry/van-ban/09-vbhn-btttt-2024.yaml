  pham_vi: 'Đối chiếu toàn văn PDF Công báo Số 1233 + 1234 ngày 08-11-2024 (trang 53–69, 17 trang, có lớp chữ, lưu tại raw/download/congbaocdn.chinhphu.vn/09-vbhn-btttt.pdf) và thẻ vanban.chinhphu.vn (docid=211488): số hiệu 09/VBHN-BTTTT, trích yếu "Thông tư ban hành danh mục hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực in, phát hành xuất bản phẩm", Bộ trưởng Nguyễn Mạnh Hùng ký xác thực ngày 21-10-2024; hợp nhất Thông tư 22/2018/TT-BTTTT ngày 28-12-2018 (có hiệu lực từ 12-02-2019), phần bãi bỏ khoản 1 Điều 1 và Phụ lục 01 theo khoản 4 Điều 2 Thông tư 18/2023/TT-BTTTT ngày 30-11-2023 (có hiệu lực từ 30-11-2023), và nội dung sửa đổi, bổ sung theo Điều 2, khoản 1 Điều 3 Thông tư 11/2024/TT-BTTTT ngày 23-09-2024 (có hiệu lực từ 07-11-2024). Cấu trúc gồm 2 Điều (Điều 1 bổ sung khoản 1a quy định Danh mục hàng hóa nhập khẩu theo mã số HS trong lĩnh vực in với các nhóm 84.40, 84.41, 84.42, 84.43; khoản 2 dẫn Phụ lục 02) và Phụ lục 02 (Danh mục hàng hóa theo mã số HS và hình thức quản lý đối với hàng hóa nhập khẩu, xuất khẩu trong lĩnh vực phát hành xuất bản phẩm thuộc các nhóm 49.01, 49.03, 49.05, 49.10, 49.11; Phụ lục 01 đã được bãi bỏ). Đang còn hiệu lực.'
