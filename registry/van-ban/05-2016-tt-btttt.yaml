xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo (id=19218), wiki/sources/05-2016-tt-btttt.md và cạnh ngược trong sổ: Thông tư 05/2016/TT-BTTTT ban hành 01-03-2016, có hiệu lực từ 01-08-2016; đã được sửa đổi, bổ sung (Điều 1) và bãi bỏ một phần (khoản 3 Điều 3: bãi bỏ Điều 3; điểm h, i, k, m khoản 1 Điều 6; điểm c khoản 1 Điều 7) từ ngày 07-11-2024 bởi Thông tư 11/2024/TT-BTTTT (hợp nhất tại 08/VBHN-BTTTT ngày 21-10-2024)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Thông tư này quy định chi tiết và hướng dẫn việc cấp, quản lý, yêu cầu kỹ thuật, vị trí, kích thước, màu sắc, cách thức ghi mã số sách tiêu chuẩn quốc tế International Standard Books Number (sau đây gọi tắt là mã số ISBN). 2. Thông tư này áp dụng đối với các đối tượng sau đây: a) Cục Xuất bản, In và Phát hành; b) Các nhà xuất bản.'
      trang_pdf: 1
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 2
      noi_dung: Điều 2. Trách nhiệm của cơ quan quản lý mã số ISBN 1. Cục Xuất bản, In và Phát hành là cơ quan quản lý mã số ISBN tại Việt Nam có trách nhiệm cấp, quản lý và thu hồi mã số ISBN. 2. Hàng năm, Cục Xuất bản, In và Phát hành báo cáo về tình hình sử dụng mã số ISBN ở Việt Nam và đóng phí hoạt động cho tổ chức ISBN quốc tế.
      trang_pdf: 1
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 3
      noi_dung: Điều 3. Chế độ báo cáo Các nhà xuất bản báo cáo Cục Xuất bản, In và Phát hành về việc sử dụng mã số ISBN được cấp, thông báo mã số ISBN chưa sử dụng trước ngày 31 tháng 3 của năm liền sau năm được cấp mã số ISBN.
      trang_pdf: 2
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 4
      noi_dung: Điều 4. Đối tượng phải ghi mã số ISBN Nhà xuất bản phải ghi mã số ISBN trên sách và tài liệu dạng sách, bao gồm cả bản đồ, sách điện tử, sách chữ nổi (sau đây gọi chung là sách). Chương II TẠO LẬP VÀ SỬ DỤNG MÃ SỐ ISBN
      trang_pdf: 2
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 5
      noi_dung: 'Điều 5. Nguyên tắc tạo lập và sử dụng mã số ISBN 1. Mã số ISBN được tạo lập và sử dụng tại Việt Nam là ISBN-13 và phải tích hợp với mã vạch theo chuẩn EAN-13, đảm bảo các yêu cầu sau: a) Đọc được bằng máy hoặc phần mềm đọc mã thông dụng; b) Chứa các thông tin của sách quy định tại Khoản 1 Điều 6 Thông tư này; c) Có liên kết đến thông tin của xuất bản phẩm trong hệ thống cơ sở dữ liệu của Cục Xuất bản, In và Phát hành;'
      trang_pdf: 2
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 6
      noi_dung: 'Điều 6. Cơ sở dữ liệu tích hợp với mã số ISBN 1. Mã số ISBN tích hợp với mã vạch EAN-13 phải chứa các thông tin sau: a) Tên nhà xuất bản; b) Tên sách; c) Tên tác giả, tên dịch giả (đối với sách dịch); d) Năm xuất bản; đ) Khuôn khổ, số trang; e) Thể loại; g) Tóm tắt nội dung, chủ đề, đề tài; h) Số xác nhận đăng ký xuất bản của Cục Xuất bản, In và Phát hành; i) Số quyết định xuất bản của nhà xuất bản;'
      trang_pdf: 2
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 7
      noi_dung: 'Điều 7. Vị trí và trình bày mã số ISBN 1. Đối với sách in: a) Mã số ISBN tích hợp mã vạch phải in tại góc dưới bên phải bìa 4. Nếu là sách có bìa bọc thì in trên bìa bọc; b) Phía trên mã vạch phải có dòng chữ “ISBN” và tiếp sau là các thành phần của mã số, cách nhau bởi dấu gạch nối. Phần dãy số phía dưới trùng với dãy số phía trên, nhưng không có gạch nối (như hình minh họa).'
      trang_pdf: 3
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 8
      noi_dung: 'Điều 8. Yêu cầu kỹ thuật thể hiện đối với mã vạch EAN-13 khi tích hợp với mã số ISBN 1. Kích thước: a) Kích thước tiêu chuẩn của mã vạch có chiều cao 22,85mm, rộng 31,35mm. Nếu rút ngắn chiều cao phải đảm bảo để máy đọc mã vạch nhận biết được;'
      trang_pdf: 3
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 9
      noi_dung: 'Điều 9. Nguyên tắc cấp mã số ISBN 1. Mỗi tên sách thuộc các trường hợp sau đây được cấp một mã số ISBN riêng biệt: a) Sách xuất bản lần đầu; b) Sách tái bản mà nội dung có sửa chữa, bổ sung; c) Sách xuất bản với nhiều ngôn ngữ và được in riêng từng cuốn cho từng ngôn ngữ; d) Sách cùng nội dung mà xuất bản dưới các hình thức khác nhau (sách in bìa cứng, sách in bìa mềm, sách kèm đĩa, sách điện tử, sách chữ nổi);'
      trang_pdf: 4
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 10
      noi_dung: Điều 10. Cách thức cấp mã số ISBN Cục Xuất bản, In và Phát hành cấp mã số ISBN kèm theo xác nhận đăng ký xuất bản cho từng tên sách.
      trang_pdf: 4
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 11
      noi_dung: 'Điều 11. Thu hồi mã số ISBN 1. Cục Xuất bản, In và Phát hành thu hồi mã số ISBN đã cấp đối với trường hợp mã số ISBN không được sử dụng theo quy định. 2. Cách thức thu hồi mã số ISBN: Nhà xuất bản nộp lại mã số ISBN đã được cấp thông qua báo cáo hàng năm theo quy định tại Điều 3 Thông tư này. Chương IV ĐIỀU KHOẢN THI HÀNH'
      trang_pdf: 5
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 8 năm 2016. 2. Chánh Văn phòng, Cục trưởng Cục Xuất bản, In và Phát hành, Thủ trưởng cơ quan, tổ chức có liên quan chịu trách nhiệm thi hành Thông tư này.
      trang_pdf: 5
      sha256_pdf: efcb4e9ec0787f522dbdba3cbd2b71335258c862f3efd96412899de626ba2678
