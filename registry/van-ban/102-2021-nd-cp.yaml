xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF Công báo số 1001 + 1002 ngày 29-11-2021 có lớp chữ (raw/download/congbaocdn.chinhphu.vn/102-2021-nd-cp.pdf, 29 trang, SHA-256 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819), thẻ vanban.chinhphu.vn (docid=204477, Phó Thủ tướng Lê Minh Khái ký) và tệp PDF ký số 102.signed.pdf: số hiệu 102/2021/NĐ-CP, ban hành ngày 16-11-2021, có hiệu lực thi hành từ ngày 01-01-2022 (Điều 9); gồm 02 Chương, 09 Điều sửa đổi, bổ sung 05 nghị định xử phạt VPHC thuộc phạm vi quản lý của Bộ Tài chính (trong đó Điều 2 và khoản 2 Điều 6 sửa đổi, bổ sung Nghị định 128/2020/NĐ-CP về xử phạt VPHC trong lĩnh vực hải quan); tình trạng còn hiệu lực (phần sửa Nghị định 128/2020/NĐ-CP hết hiệu lực theo nghị định gốc từ 01-07-2026 khi Nghị định 169/2026/NĐ-CP có hiệu lực)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 2
      khoan: 1
      noi_dung: 'Điều 2. Sửa đổi, bổ sung một số điều của Nghị định số 128/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực hải quan 1. Bổ sung Điều 2a vào sau Điều 2 như sau: “Điều 2a. Nguyên tắc xử phạt vi phạm hành chính trong lĩnh vực hải quan đối với vi phạm hành chính nhiều lần Tổ chức, cá nhân thực hiện vi phạm hành chính nhiều lần thì bị xử phạt về từng hành vi vi phạm, trừ các trường hợp sau: thực hiện từng hành vi vi phạm quy định tại các điểm a, b, d khoản 1, điểm a khoản 3 Điều 7; các khoản 1, 2, 3, điểm d khoản 4, các điểm a, b c, d khoản 6 Điều 8; điểm a khoản 1, điểm b khoản 2 Điều 11 Nghị định này trên nhiều tờ khai/chứng từ thuộc hồ sơ hải quan ở các thời điểm đăng ký tờ khai hải quan khác nhau, được phát hiện ở cùng một thời điểm nhưng chưa bị xử lý và chưa hết thời hiệu xử lý thì xử phạt vi phạm hành chính một lần về hành vi vi phạm, đồng thời áp dụng tình tiết tăng nặng vi phạm hành chính nhiều lần đối với hành vi vi phạm hành chính đó.”'
      trang_pdf: 5
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 2
      khoan: 2
      noi_dung: '2. Sửa đổi, bổ sung Điều 4 như sau: a) Sửa đổi, bổ sung khoản 2 như sau: “2. Thời hiệu xử phạt đối với các hành vi vi phạm khác trong lĩnh vực hải quan thực hiện theo quy định tại Điều 6 Luật Xử lý vi phạm hành chính năm 2012 và khoản 4 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính, trừ trường hợp quy định tại khoản 1 Điều này. Thời điểm để tính thời hiệu xử phạt vi phạm hành chính đối với các hành vi vi phạm khác trong lĩnh vực hải quan thực hiện theo khoản 5, khoản 6 Điều này.”'
      trang_pdf: 5
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 2
      khoan: 3
      noi_dung: '3. Bổ sung điểm đ, điểm e vào sau điểm d khoản 3 Điều 5 như sau: “đ) Khi phạt tiền, mức phạt tiền cụ thể đối với một hành vi vi phạm hành chính quy định tại các Điều 7, Điều 8, Điều 10, Điều 11, Điều 12, Điều 13, Điều 15, Điều 16, Điều 17, Điều 18, Điều 19, Điều 20, Điều 21, Điều 22, Điều 23, Điều 24 và các khoản 1, 3, 4 Điều 25 Nghị định này là mức trung bình của khung phạt tiền được quy định đối với hành vi đó. Nếu có tình tiết giảm nhẹ, thì mỗi tình tiết được giảm 10% mức tiền phạt trung bình của khung tiền phạt nhưng mức phạt tiền đối với hành vi đó không được giảm quá mức tối thiểu của khung tiền phạt; nếu có tình tiết tăng nặng thì mỗi tình tiết tăng nặng được tính tăng 10% mức tiền phạt trung bình của khung tiền phạt nhưng mức phạt tiền đối với hành vi đó không được vượt quá mức tối đa của khung tiền phạt. e) Khi xác định mức phạt tiền đối với một hành vi vi phạm hành chính vừa có tình tiết tăng nặng, vừa có tình tiết giảm nhẹ thì được giảm trừ tình tiết tăng nặng theo nguyên tắc một tình tiết giảm nhẹ được giảm trừ một tình tiết tăng nặng.”'
      trang_pdf: 6
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 2
      khoan: 4
      noi_dung: '4. Sửa đổi, bổ sung Điều 29 như sau: “Điều 29. Thẩm quyền xử phạt vi phạm hành chính của hải quan Chi cục trưởng Chi cục Hải quan, Cục trưởng Cục Hải quan tỉnh, liên tỉnh, thành phố trực thuộc Trung ương, Cục trưởng Cục Điều tra chống buôn lậu, Cục trưởng Cục Kiểm tra sau thông quan và Tổng cục trưởng Tổng cục Hải quan có thẩm quyền xử phạt đối với các hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn, không thu; trốn thuế; vi phạm của ngân hàng thương mại trong việc không thực hiện trách nhiệm trích chuyển tiền từ tài khoản của người nộp thuế vào tài khoản của ngân sách nhà nước đối với số tiền thuế nợ phải nộp của người nộp thuế theo yêu cầu của cơ quan quản lý thuế theo quy định tại các điểm b, c, d khoản 2 Điều 138 của Luật Quản lý thuế.'
      trang_pdf: 7
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 2
      khoan: 8
      noi_dung: '8. Bổ sung Điều 33a vào sau Điều 33 như sau: “Điều 33a. Thi hành biện pháp khắc phục hậu quả 1. Khi cá nhân, tổ chức thi hành biện pháp buộc đưa ra khỏi lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam hoặc buộc tái xuất đối với tang vật, phương tiện vi phạm hành chính, cơ quan hải quan thực hiện việc giám sát chặt chẽ từ nơi lưu giữ hàng hóa vi phạm đến cửa khẩu tái xuất. Kết quả giám sát phải được Hải quan cửa khẩu xác nhận bằng văn bản hoặc các phương thức điện tử khác và gửi lại cho cơ quan hải quan đã ra quyết định xử phạt vi phạm hành chính trong thời hạn 05 (năm) ngày kể từ ngày tang vật, phương tiện vi phạm đã đưa ra khỏi lãnh thổ Việt Nam hoặc tái xuất để lưu hồ sơ vụ việc.'
      trang_pdf: 13
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 2
      khoan: 10
      noi_dung: '10. Sửa đổi, bổ sung Điều 34 như sau: “Điều 34. Miễn, giảm tiền phạt vi phạm hành chính trong lĩnh vực hải quan Việc miễn, giảm tiền phạt vi phạm hành chính trong lĩnh vực hải quan thực hiện theo quy định tại Điều 77 Luật Xử lý vi phạm hành chính và khoản 38 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính.”'
      trang_pdf: 16
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 6
      khoan: 2
      noi_dung: '2. Bổ sung, bỏ một số cụm từ tại Nghị định số 128/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực hải quan như sau: a) Bổ sung cụm từ “và khoản 31 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính” vào sau cụm từ “Luật Xử lý vi phạm hành chính năm 2012” tại khoản 3 Điều 4. b) Bổ sung cụm từ “và các khoản từ 61 đến 67 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính” vào sau cụm từ “Luật Xử lý vi phạm hành chính năm 2012” tại khoản 1 Điều 26. c) Bổ sung cụm từ “và Luật sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính” vào sau cụm từ “Luật Xử lý vi phạm hành chính năm 2012” tại khoản 2 Điều 36. d) Bỏ cụm từ “có trị giá không vượt quá mức tiền phạt được quy định tại điểm b khoản này” tại điểm c khoản 1 Điều 28.'
      trang_pdf: 27
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 7
      noi_dung: 'Điều 7. Quy định chuyển tiếp 1. Đối với trường hợp quyết định xử phạt vi phạm hành chính đã được ban hành trước thời điểm Nghị định này có hiệu lực thi hành mà sau thời điểm có hiệu lực của Nghị định này, cá nhân, tổ chức bị xử phạt vi phạm hành chính còn khiếu nại thì được giải quyết theo Nghị định xử phạt vi phạm hành chính có hiệu lực tại thời điểm thực hiện hành vi vi phạm hành chính. 2. Đối với các hành vi vi phạm hành chính trong lĩnh vực thuế, hóa đơn; hải quan; kinh doanh bảo hiểm, kinh doanh xổ số; quản lý, sử dụng tài sản công; thực hành tiết kiệm, chống lãng phí; dự trữ quốc gia; kho bạc nhà nước; kế toán, kiểm toán độc lập xảy ra trước ngày Nghị định này có hiệu lực thi hành mà sau đó mới bị phát hiện hoặc đang xem xét, giải quyết để xử phạt vi phạm hành chính thì áp dụng các quy định về xử phạt quy định tại Nghị định này nếu Nghị định này không quy định trách nhiệm pháp lý hoặc quy định trách nhiệm pháp lý nhẹ hơn cho cá nhân, tổ chức vi phạm.'
      trang_pdf: 28
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
    - dieu: 9
      noi_dung: 'Điều 9. Hiệu lực thi hành Nghị định này có hiệu lực từ ngày 01 tháng 01 năm 2022.'
      trang_pdf: 29
      sha256_pdf: 3aeed46a016121c97773a6d8dd70d9af37e62d6ab7fb3b61a4eb7ff70432b819
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Liên quan XNK trực tiếp: sửa đổi quy định xử phạt VPHC lĩnh vực hải quan (NĐ 128/2020 — khai nhiều tờ khai vi phạm nhiều lần, thời điểm chấm dứt hành vi vi phạm để tính thời hiệu, cách tính mức phạt tiền trung bình khung ±10%/tình tiết, thẩm quyền xử phạt và thi hành biện pháp khắc phục hậu quả buộc tái xuất/tiêu hủy/dán tem miễn thuế) và thuế, hóa đơn; hợp nhất hải quan tại 23/VBHN-BTC 2022.'
