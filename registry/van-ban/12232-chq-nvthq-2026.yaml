ghi_chu: 'Hướng dẫn triển khai Nghị định 56/2026/NĐ-CP về Biểu thuế nhập khẩu ưu đãi đặc biệt Việt Nam - Campuchia giai đoạn 2025-2026 và xử lý thuế hồi tố theo khoản 2 Điều 6 cho các tờ khai mặt hàng Phụ lục I đăng ký từ 28/04/2025 đến trước 12/02/2026.'
