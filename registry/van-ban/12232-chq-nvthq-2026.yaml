  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/25/VB_12232.pdf, id=102643, 1 trang, Phó Trưởng ban Nghiệp vụ thuế HQ Đào Thu Hương ký ngày 12-02-2026, SHA-256 4ef32f013e47d103a1e3ddf648bacc21040fb94c815dfcbd6d7867030a9b52ad): Công văn hỏa tốc số 12232/CHQ-NVTHQ ngày 12-02-2026 của Cục Hải quan yêu cầu các Chi cục Hải quan khu vực phổ biến, hướng dẫn cán bộ, công chức hải quan và doanh nghiệp thực hiện khai báo theo Nghị định số 56/2026/NĐ-CP ngày 12-02-2026 về Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Bản Thỏa thuận thúc đẩy thương mại song phương Việt Nam - Campuchia giai đoạn 2025-2026 (có hiệu lực từ ngày 12-02-2026), lưu ý quy định tại khoản 2 Điều 6 áp dụng đối với các tờ khai hải quan của các mặt hàng nêu tại Phụ lục I đăng ký từ ngày 28-04-2025 đến trước ngày Nghị định có hiệu lực thi hành'
