ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị đeo tay thông minh Watch GT 6 phiên bản đường kính 41mm (ký mã hiệu KSU-B19, bộ máy gồm 01 đồng hồ thông minh và 01 đế sạc kèm dây, thân máy bằng thép không gỉ 41.3 mm x 9.99 mm, màn hình AMOLED 1.32 inch 466 x 466 pixels, tích hợp loa, micro, cảm biến IMU 9 trục, cảm biến nhịp tim quang học, kết nối Bluetooth 6.0, GPS, NFC, không hỗ trợ Wi-Fi và eSIM) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
