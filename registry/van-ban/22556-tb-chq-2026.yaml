  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/6/VB_22556.pdf, id=106270, SHA-256 b4089e13c46beec67251866b184066f2389814fb19b965dd243dd82de20394e3): Thông báo số 22556/TB-CHQ ngày 05-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị đeo tay thông minh Watch GT 6 phiên bản đường kính 41mm (ký mã hiệu KSU-B19, hoạt động bằng pin, màn hình cảm ứng AMOLED 1.32 inch độ phân giải 466 x 466 pixels, thân máy bằng thép không gỉ kích thước 41.3 mm x 9.99 mm, trọng lượng 37.5g không gồm dây đeo, tích hợp loa, micro, cảm biến IMU 9 trục, cảm biến nhịp tim quang học, hỗ trợ Bluetooth 6.0, GPS, NFC, sạc không dây, không hỗ trợ Wi-Fi và không hỗ trợ eSIM, kết nối với thiết bị chủ qua Bluetooth để đàm thoại, truyền nhận dữ liệu và theo dõi sức khỏe), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
