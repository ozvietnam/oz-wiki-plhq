xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu nguồn bậc A trên vanban.chinhphu.vn (docid=204442) và congbao.chinhphu.vn (id=34803): Nghị định 98/2021/NĐ-CP quy định về quản lý trang thiết bị y tế (ban hành 08-11-2021, hiệu lực từ 01-01-2022), đã được sửa đổi, bổ sung một số điều từ ngày 15-03-2023 bởi Nghị định 07/2023/NĐ-CP và tiếp tục được dẫn chiếu làm căn cứ tại Thông tư 19/2024/TT-BYT, Thông tư 24/2026/TT-BYT (còn hiệu lực, hết hiệu lực một phần tại các điều khoản đã sửa đổi).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định việc quản lý trang thiết bị y tế bao gồm: phân loại trang thiết bị y tế; sản xuất, nghiên cứu lâm sàng, lưu hành, mua bán, xuất khẩu, nhập khẩu, cung cấp dịch vụ trang thiết bị y tế; thông tin, quảng cáo trang thiết bị y tế; quan lý giá trang thiết bị y tế và quản lý, sử dung trang thiết bị y tế tại các cơ sở y tế. 2. Nghị định này không áp dụng đối với:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ 1. Trang thiết bị y tế là các loại thiết bị, vật tư cấy ghép, dung cụ, vật liệu, thuốc thử và chất hiệu chuẩn in vitro, phần mềm (software) đáp ứng đồng thời các yêu cầu sau đây: a) Được sử dụng riêng lẻ hay phối hợp với nhau theo chỉ định của chủ sở hữu trang thiết bị y tế để phục vụ cho con người nhằm một hoặc nhiều mục đích sau đây:'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc quản lý trang thiết bị y tế 1. Bảo dam chất lượng, an toàn và sử dụng hiệu quả trang thiết bị y tế. 2. Thông tin đầy đủ, chính xác, kịp thời về đặc tính kỹ thuật, công dụng của trang thiết bị y tế và các yếu tố nguy cơ có thé xảy ra đối với người sử dụng. 3. Bảo đảm truy xuất nguồn gốc của trang thiết bị y tế.
      trang_pdf: 3
    - dieu: 14
      noi_dung: 'Điều 14. Yêu cầu đối với cơ sở nhận nghiên cứu lâm sàng trang thiết bị y tế Cơ sở nhận nghiên cứu lâm sàng trang thiết bị y tế phải đáp ứng các yêu câu sau đây: 1. Là cơ sở có chức năng về nghiên cứu khoa học, độc lập đối với tổ chức, cá nhân có trang thiết bị y tê nghiên cứu lâm sàng. 2. Có địa điểm, phòng nghiên cứu lâm sàng, hệ thống quản lý chất'
      trang_pdf: 9
    - dieu: 24
      noi_dung: Điều 24. Các trường hợp được miễn công bố tiêu chuẩn áp dung va miễn đăng ký lưu hành 1. Trang thiết bị y tế chỉ phục vụ cho mục đích nghiên cứu, thử nghiệm, kiểm định, kiểm nghiệm, khảo , nghiệm, đánh giá chất lượng, đào tạo hướng dẫn sử dụng, sửa chữa trang thiết bị y tế.
      trang_pdf: 17
    - dieu: 34
      noi_dung: Điều 34. Xứ lý đối với trường hop trang thiét bi y tế có cảnh báo về nguy cơ tiềm ẫn đe dọa nghiêm trọng đến sức khỏe cộng đồng hoặc có thê dẫn đến tử vong cho người sử dụng
      trang_pdf: 31
    - dieu: 45
      noi_dung: 'Điều 45. Nội dung, trách nhiệm kê khai giá trang thiết bị y tế 1. Nội dung kê khai giá trang thiết bị y tế: a) Tên, chủng loại trang thiết bị y tế; b) Nước sản xuất; c) Đơn vị tính; d) Gia vốn nhập khẩu đối với trang, thiết bị y tế nhập khẩu hoặc chỉ phí sản xuất đối với trang thiết biy tế sản xuất trong nước; đ) Lợi nhuận dự kiến; e) Giá bán tối đa của trang thiết bị y tế tương ứng với từng cấu hình, tính năng kỹ thuật theo đơn vị tính;'
      trang_pdf: 39
    - dieu: 55
      noi_dung: Điều 55. Nguyên tắc kiểm định, hiệu chuẩn trang thiết bị y tẾ 1. Trang thiết bị y tế thuộc danh mục đo Bộ trưởng Bộ Y tế công bố phải kiểm định về an toàn và tính năng kỹ thuật trước khi đưa vào sử dụng (trừ trường hợp quy định tại Điều 57 Nghị định này), định kỳ, sau sửa chữa lớn. Việc kiểm định trang thiết bị y tế là phương tiện đo, thiết bị bức xạ thực hiện theo quy định tại khoản 2 Điều này.
      trang_pdf: 47
    - dieu: 65
      noi_dung: 'Điều 65. Quyền và trách nhiệm của cơ sở y tế trong việc quản lý, sử dụng trang thiết bị y tế 1. Cơ sở y tế có quyền: a) Yêu cầu chủ sở hữu số lưu hành hoặc cơ sở bảo hành được chứng nhận bởi chủ sở hữu trang thiệt bị y tê thực hiện việc bao dưỡng định kỳ trong thời hạn bảo hành; b) Yêu cầu bên bán cung cấp tài liệu kỹ thuật của trang thiết bị y tế;'
      trang_pdf: 52
    - dieu: 76
      noi_dung: Điều 76. Điều khoán chuyển tiếp 1. Các trang thiết bị y tế đã được sản xuất tại Việt Nam hoặc đã được nhập khâu Việt Nam trước ngày Nghị định này có hiệu lực thi hành được tiép tục lưu hành đền khi bị thanh ly theo quy định pháp luật về quan lý, sử dụng tài sản công hoặc đên hệt thời hạn ghi trên giây chứng nhận đăng ký lưu hành hoặc đến hết hạn sử dụng của sản phẩm.
      trang_pdf: 58
ghi_chu: Nghị định nền tảng quản lý trang thiết bị y tế (TT-BYT, BYT). Áp dụng cho mọi TTBYT XNK từ 2022.
