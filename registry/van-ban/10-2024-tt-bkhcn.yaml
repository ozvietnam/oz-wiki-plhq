  pham_vi: 'thẻ vanban.chinhphu.vn (docid=212538), toàn văn PDF/OCR (raw/download/datafiles.chinhphu.vn/10-2024-tt-bkhcn.pdf, wiki/sources/10-2024-tt-bkhcn.md) và đối chiếu khung KTCN 2026: Thông tư 10/2024/TT-BKHCN gốc ban hành 30-12-2024 (hiệu lực 15-02-2025 theo khoản 1 Điều 5) quy định quản lý nhiệm vụ KH&CN do Quỹ NAFOSTED tài trợ; mục danh mục hàng hóa nhóm 2 BKHCN (cũ) ghi theo nguồn thứ cấp đã hết hiệu lực từ 01-07-2026 khi khung KTCN 2026 (TT 36/2026/TT-BKHCN) có hiệu lực'
