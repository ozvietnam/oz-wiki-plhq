xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/DONG_NAI/2026/3/5/13251_CHQ_GSQL_04_03_2026.pdf, id=102674, SHA-256 70df20b7ece39730989d744860d8cf1b35ba78a8de10a300b91e26de58768a23): Công văn số 13251/CHQ-NVTHQ ngày 04-03-2026 của Cục Hải quan (Phó Trưởng ban Nghiệp vụ thuế HQ Mai Thị Vân Anh ký) hướng dẫn chính sách miễn thuế nhập khẩu và thủ tục hải quan đối với hàng hóa đưa đi gia công lại: căn cứ khoản 6 và khoản 7 Điều 16 Luật Thuế xuất khẩu, thuế nhập khẩu số 107/2016/QH13, khoản 1 và khoản 2 Điều 10, khoản 1 và khoản 2 Điều 12 Nghị định 134/2016/NĐ-CP (được sửa đổi, bổ sung tại khoản 4 và khoản 6 Điều 1 Nghị định 18/2021/NĐ-CP) và Điều 62, Điều 70 Thông tư 38/2015/TT-BTC (được sửa đổi, bổ sung tại khoản 48 Điều 1 Thông tư 39/2018/TT-BTC và khoản 34, khoản 42 Điều 1 Thông tư 121/2025/TT-BTC ngày 18-12-2025), người nộp thuế giao một phần hoặc toàn bộ hàng hóa nhập khẩu hoặc bán thành phẩm để thuê tổ chức, cá nhân khác có quyền sở hữu hoặc quyền sử dụng cơ sở sản xuất, gia công và máy móc, thiết bị trên lãnh thổ Việt Nam gia công một số hoặc toàn bộ công đoạn rồi nhận lại bán thành phẩm/thành phẩm để xuất khẩu thì được miễn thuế nhập khẩu nếu thực hiện thông báo cơ sở sản xuất, gia công lại và hợp đồng/phụ lục hợp đồng gia công lại cho cơ quan hải quan trước khi giao nguyên liệu, vật tư; hàng hóa giao, nhận giữa các tổ chức, cá nhân Việt Nam với nhau không phải làm thủ tục hải quan nhưng phải lưu giữ chứng từ theo quy định về chế độ kế toán, kiểm toán; đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Điều kiện miễn thuế nhập khẩu khi thuê gia công lại theo Nghị định 18/2021/NĐ-CP và Thông tư 121/2025/TT-BTC (khoản 34, khoản 42 Điều 1): phải thông báo cơ sở sản xuất gia công lại và hợp đồng/phụ lục hợp đồng gia công lại một lần trước khi giao nguyên liệu, vật tư; giao nhận nội địa không phải làm thủ tục hải quan nhưng phải lưu giữ chứng từ kế toán, kiểm toán.'
