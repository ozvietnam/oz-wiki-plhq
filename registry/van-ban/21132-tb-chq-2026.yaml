  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21132.pdf, id=106015, SHA-256 707bd2c6d59a0b7ee88d3990dbc116370ceb9020e99cce2fc01299ec6d0a44cf): Thông báo số 21132/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ nguồn chuyển mạch dùng cho máy tính (Power Supply Unit, Model Name X3039, Product code SPX2P1SSA1/WAP; cấu tạo bản mạch PCB vật liệu FR-4 4 lớp gắn cổng nguồn AC inlet, đầu nối Busbar, cổng kết nối tín hiệu Signal Connector, đi-ốt cầu, cuộn lọc, cuộn cảm, IC nguồn, IC tham chiếu, IC điều khiển, IC khuếch đại thuật toán, MOSFET, diode chỉnh lưu, biến áp xung, tụ điện, optocoupler; kích thước 115,5 x 115,5 x 15,1 mm, trọng lượng 200 g; chuyển đổi điện áp xoay chiều AC đầu vào 100 ~ 240 VAC, 50/60 Hz, 2,5 A sang điện áp một chiều DC đầu ra 12,6 VDC ± 5%, 12,3 A, công suất 155 W dùng cho máy tính, không phải bộ nguồn cấp điện liên tục UPS), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.19; có hiệu lực từ ngày ký'
