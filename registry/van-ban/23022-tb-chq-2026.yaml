  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/16/VB_23022.pdf, id=106376, SHA-256 eaee4c9df1f9bbdba46965822db2753c657a9aa06df05ab10481fb11a4c31931): Thông báo số 23022/TB-CHQ ngày 15-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thức ăn chăn nuôi bổ sung dạng hỗn hợp axit hữu cơ (FORMI STABLE, công thức hóa học HCOOH.HCOONa, dạng bột, thành phần gồm Axit Formic 30,6-37,4%, Natri Formate 45-55% được bọc khoáng Diatomaceous Earth 12,6-15,4%, bổ sung vào premix hoặc thức ăn hỗn hợp cho gia súc, gia cầm nhằm hỗ trợ chức năng tiêu hóa), phân loại vào nhóm 23.09, phân nhóm 2309.90, mã số 2309.90.20; có hiệu lực từ ngày ban hành'
