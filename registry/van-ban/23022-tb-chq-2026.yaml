ghi_chu: 'Xác định trước mã số mặt hàng Thức ăn chăn nuôi bổ sung dạng hỗn hợp axit hữu cơ (tên thương mại FORMI STABLE, công thức hóa học HCOOH.HCOONa, dạng bột màu hơi trắng đến hơi nâu, thành phần theo trọng lượng gồm Axit Formic 30,6-37,4%, Natri Formate 45-55% và khoáng Diatomaceous Earth 12,6-15,4%, dùng bổ sung vào premix hoặc thức ăn hỗn hợp cho gia súc và gia cầm nhằm hỗ trợ chức năng tiêu hóa và nâng cao hiệu quả sử dụng thức ăn) thuộc nhóm 23.09, phân nhóm 2309.90, mã số 2309.90.20.'
