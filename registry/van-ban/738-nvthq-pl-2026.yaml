ghi_chu: 'Bản gốc PDF ghi ngày ký 30/04/2026 (Cổng Hải quan đăng ngày 04/05/2026); hướng dẫn cập nhật biểu thuế trên hệ thống VNACCS/VCIS đối với thời hạn áp dụng Nghị định 72/2026/NĐ-CP và 3 mã hàng nguyên liệu sản xuất xăng, dầu (2710.19.20, 2710.19.89, 2711.19.00) tại Điều 2 Nghị quyết 25/2026/NQ-CP.'
