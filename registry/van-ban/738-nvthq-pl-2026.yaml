  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/5/4/VB_738.pdf, id=103502, SHA-256 3f7dc1d0f0256f41c86ac0612af5b41fa63d18973f49065b5eedb7b2b0aaa11e): Công văn hỏa tốc số 738/NVTHQ-PL ngày 30-04-2026 (đăng Cổng Hải quan ngày 04-05-2026) của Ban Nghiệp vụ thuế hải quan - Cục Hải quan (Phó Trưởng ban Đào Thu Hương ký) đề nghị Ban Công nghệ thông tin và Thống kê Hải quan cùng Văn phòng cập nhật trên hệ thống VNACCS/VCIS, hệ thống CCES và Website Cục Hải quan nội dung Nghị quyết số 25/2026/NQ-CP ngày 30-04-2026 của Chính phủ (kéo dài thời hạn áp dụng Nghị định số 72/2026/NĐ-CP ngày 09-03-2026 và cập nhật mức thuế suất thuế nhập khẩu ưu đãi 0% thay đổi của 3 mã hàng nguyên liệu sản xuất xăng, dầu tại Điều 2 Nghị quyết số 25/2026/NQ-CP trên hệ thống VNACCS/VCIS); đang còn hiệu lực (thời hạn áp dụng Nghị quyết 25/2026/NQ-CP và Nghị định 72/2026/NĐ-CP được Điều 1 Nghị quyết 43/2026/NQ-CP kéo dài đến hết ngày 31-12-2026)'
  hieu_luc_da_doi_chieu: true
