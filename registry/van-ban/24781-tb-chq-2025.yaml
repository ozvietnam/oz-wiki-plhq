  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/19/1.VBDI_24781.pdf, id=101365, SHA-256 6aeb180dccb80a49d32faf8ab2634b69ceb78e4a4bd0ab8226f7495aeb1fb392): Thông báo số 24781/TB-CHQ ngày 17-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Loa chưa lắp vào vỏ loa (Unit speaker) dùng để sản xuất sản phẩm loa thanh/soundbar (ký, mã hiệu HUNFF00010A; cấu tạo gồm khung Frame, nắp đồng Cu cap, nam châm chính và phụ, đế nam châm T-Yoke, đầu kết nối dây dẫn Terminal, khung đỡ màng nhện, 2 màng nhện Damper, cuộn dây đồng Voice coil, màng loa Cone paper, nắp che bụi Dust cap, đệm chống rung Gasket; tần số 170Hz~20kHz, công suất 8W, điện áp hoạt động 0~8.4V/AC, kích thước 75 x 45 x 41.9 mm, trọng lượng 176g), phân loại vào nhóm 85.18, phân nhóm 8518.29, mã số 8518.29.90; có hiệu lực từ ngày ký'
