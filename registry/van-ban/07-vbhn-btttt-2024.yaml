    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 5 năm 2015. 6 Điều này được bãi bỏ theo quy định tại khoản 2 Điều 2 Thông tư số 18/2023/TT-BTTTT ngày 30 tháng 11 năm 2023 của Bộ trưởng Bộ Thông tin và Truyền thông về bãi bỏ một số văn bản quy phạm pháp luật do Bộ trưởng Bộ Thông tin và Truyền thông ban hành hoặc liên tịch ban hành, có hiệu lực kể từ ngày 30 tháng 11 năm 2023.
