      sha256_pdf: f71582046317555bd170f5f17b1e9a5ce89532b59622cd9e773c742e984a8e95
    - dieu: 5
      noi_dung: Điều 5. Tổ chức liên ngành phòng, chống các hành vi vi phạm pháp luật trong hoạt động in quy định tại Khoản 7 Điều 5 và Điểm d Khoản 1 Điều 7 Nghị định số 60/2014/NĐ-CP 1. Tổ chức liên ngành là tổ chức phối hợp hoạt động của các cơ quan liên quan để phòng, chống các hành vi vi phạm pháp luật trong hoạt động in.
