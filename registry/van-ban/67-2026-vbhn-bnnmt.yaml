xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=218443), Cổng TTĐT Bộ Nông nghiệp và Môi trường (mae.gov.vn, ItemID=847) và toàn văn PDF đính kèm (67-vbhn-bnnmt.pdf, 2.972.338 byte, 135 trang): số ký hiệu 67/VBHN-BNNMT (sổ ghi 67/2026/VBHN-BNNMT, đã thêm 67/VBHN-BNNMT vào so_hieu_khac), xác thực ngày 12-06-2026 bởi Thứ trưởng Bộ Nông nghiệp và Môi trường Nguyễn Quốc Trị, trích yếu nguyên văn "Quy định về kiểm dịch động vật, sản phẩm động vật trên cạn". Theo lời nói đầu (trang 1) và Điều 30 (trang 28), Văn bản hợp nhất này hợp nhất Thông tư 01/2026/TT-BNNMT ngày 01-01-2026 (có hiệu lực từ ngày 01-01-2026; tại khoản 2 và khoản 3 Điều 30 đã thay thế Thông tư 25/2016/TT-BNNPTNT cùng các Thông tư sửa đổi 35/2018/TT-BNNPTNT, 09/2022/TT-BNNPTNT, 04/2024/TT-BNNPTNT, 28/2025/TT-BNNMT và bãi bỏ Điều 22 Thông tư 09/2025/TT-BNNMT) với Thông tư 22/2026/TT-BNNMT ngày 19-05-2026 (có hiệu lực từ ngày 19-05-2026). Đang còn hiệu lực.'
