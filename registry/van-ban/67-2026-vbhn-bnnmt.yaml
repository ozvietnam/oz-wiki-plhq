xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=218443), Cổng TTĐT Bộ Nông nghiệp và Môi trường (mae.gov.vn, ItemID=847) và toàn văn PDF đính kèm (67-vbhn-bnnmt.pdf, 2.972.338 byte, 135 trang): số ký hiệu 67/VBHN-BNNMT (sổ ghi 67/2026/VBHN-BNNMT, đã thêm 67/VBHN-BNNMT vào so_hieu_khac), xác thực ngày 12-06-2026 bởi Thứ trưởng Bộ Nông nghiệp và Môi trường Nguyễn Quốc Trị, trích yếu nguyên văn "Quy định về kiểm dịch động vật, sản phẩm động vật trên cạn". Theo lời nói đầu (trang 1) và Điều 30 (trang 28), Văn bản hợp nhất này hợp nhất Thông tư 01/2026/TT-BNNMT ngày 01-01-2026 (có hiệu lực từ ngày 01-01-2026; tại khoản 2 và khoản 3 Điều 30 đã thay thế Thông tư 25/2016/TT-BNNPTNT cùng các Thông tư sửa đổi 35/2018/TT-BNNPTNT, 09/2022/TT-BNNPTNT, 04/2024/TT-BNNPTNT, 28/2025/TT-BNNMT và bãi bỏ Điều 22 Thông tư 09/2025/TT-BNNMT) với Thông tư 22/2026/TT-BNNMT ngày 19-05-2026 (có hiệu lực từ ngày 19-05-2026). Đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết khoản 3 Điều 37, khoản 2 Điều 39, khoản 4 Điều 41, khoản 4 Điều 46, khoản 4 Điều 49 Luật Thú y (được sửa đổi, bổ sung tại Điều 12 Luật sửa đổi, bổ sung một số Điều của 15 Luật trong lĩnh vực nông nghiệp và môi trường) về: a) Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch;'
      trang_pdf: 2
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Thông tư này, các từ ngữ dưới đây được hiểu như sau: 1. Nơi cách ly kiểm dịch động vật là khu vực riêng biệt để nuôi giữ động vật trong thời gian nhất định để thực hiện việc kiểm dịch. 2. Nơi cách ly kiểm dịch sản phẩm động vật là kho chứa hàng, phương tiện chứa đựng để bảo quản sản phẩm động vật trong thời gian nhất định để thực hiện việc kiểm dịch.'
      trang_pdf: 2
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 3
      noi_dung: Điều 3. Danh mục động vật, sản phẩm động vật trên cạn thuộc diện phải kiểm dịch; Danh mục động vật, sản phẩm động vật trên cạn thuộc diện miễn kiểm dịch; Danh mục đối tượng kiểm dịch động vật, sản phẩm động vật trên cạn;
      trang_pdf: 3
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 8
      noi_dung: Điều 8. Trình tự, thủ tục, nội dung kiểm dịch động vật, sản phẩm động vật trên cạn xuất khẩu 1. Đăng ký kiểm dịch Trước khi xuất khẩu động vật, sản phẩm động vật có yêu cầu kiểm dịch, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại Điều 7 Thông tư này đến Chi cục Chăn nuôi và Thú y vùng hoặc Cơ quan quản lý chuyên ngành Thú y cấp tỉnh được Cục Chăn nuôi và Thú y ủy quyền (sau đây gọi là Cơ quan kiểm dịch động vật cửa khẩu) theo một
      trang_pdf: 7
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 11
      noi_dung: 'Điều 11. Trình tự, thủ tục, nội dung kiểm dịch động vật nhập khẩu 1. Đăng ký kiểm dịch a) Trước khi nhập khẩu động vật, chủ hàng gửi 01 bộ hồ sơ đăng ký kiểm dịch theo quy định tại khoản 1 Điều 10 Thông tư này đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp.'
      trang_pdf: 9
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 15
      noi_dung: Điều 15. Kiểm dịch sản phẩm động vật nhập khẩu làm nguyên liệu để gia công, chế biến hàng xuất khẩu 1. Thực hiện theo quy định tại điểm a và điểm b khoản 1; khoản 2 Điều 12 Thông tư này.
      trang_pdf: 14
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 18
      noi_dung: Điều 18. Kiểm dịch động vật, sản phẩm động vật tạm xuất tái nhập 1. Kiểm dịch động vật, sản phẩm động vật tạm xuất tái nhập khi tạm xuất khẩu thực hiện theo quy định tại Điều 8 Thông tư này. 2. Kiểm dịch động vật tạm xuất tái nhập khi tái nhập khẩu thực hiện theo quy định tại điểm a và điểm b khoản 1, các khoản 2, 3 và 4 Điều 11 Thông tư này.
      trang_pdf: 16
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 22
      noi_dung: 'Điều 22. Vận chuyển mẫu bệnh phẩm 1. Khi có yêu cầu nhận mẫu bệnh phẩm từ nước ngoài gửi về Việt Nam hoặc gửi mẫu bệnh phẩm từ Việt Nam ra nước ngoài, chủ hàng phải gửi 01 bộ hồ sơ đăng ký vận chuyển mẫu bệnh phẩm đến Cục Chăn nuôi và Thú y theo một trong các hình thức: qua Cổng thông tin một cửa quốc gia hoặc Cổng dịch vụ công hoặc qua dịch vụ bưu chính công ích hoặc gửi qua thư điện tử, fax hoặc gửi trực tiếp.'
      trang_pdf: 20
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 25
      noi_dung: 'Điều 25. Quy định chung về đánh dấu, cấp mã số đối với động vật; niêm phong phương tiện vận chuyển, vật dụng chứa đựng động vật, sản phẩm động vật 1. Các loại động vật phải được đánh dấu, cấp mã số: a) Động vật giống (trâu, bò, dê, cừu, hươu, nai, ngựa, lừa, la và lợn) khi vận chuyển ra khỏi địa bàn cấp tỉnh; b) Động vật (trâu, bò, dê, cừu, hươu, nai, ngựa, lừa, la và lợn) khi xuất khẩu, nhập khẩu.'
      trang_pdf: 23
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
    - dieu: 30
      noi_dung: 'Điều 30. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2026. 2. Thông tư này thay thế các Thông tư sau: a) Thông tư số 25/2016/TT-BNNPTNT ngày 30/6/2016 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định về kiểm dịch động vật, sản phẩm động vật trên cạn;'
      trang_pdf: 28
      sha256_pdf: 1cd650e40f7b854634a68fb67b67931cb6e6bec594442414fb830ed1170317a0
ghi_chu: Hợp nhất Thông tư 01/2026/TT-BNNMT (đã thay thế Thông tư 25/2016/TT-BNNPTNT từ ngày 01-01-2026) và Thông tư 22/2026/TT-BNNMT quy định về kiểm dịch động vật, sản phẩm động vật trên cạn.
