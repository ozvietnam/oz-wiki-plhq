  pham_vi: số hiệu, tiêu đề, ngày ban hành 30-10-2014 và hiệu lực gốc 01-01-2015 trên vanban.chinhphu.vn (docid=177307) và wiki/sources/33-2014-tt-bnnptnt.md; đối chiếu còn hiệu lực, đã được hợp nhất trong 19/VBHN-BNNPTNT ngày 27-05-2024
  hieu_luc_da_doi_chieu: true
