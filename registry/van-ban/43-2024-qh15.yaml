ghi_chu: 'Đính chính thông tin văn bản: số hiệu 43/2024/QH15 là Luật sửa đổi Luật Đất đai, Luật Nhà ở, Luật Kinh doanh BĐS và Luật Các tổ chức tín dụng (thông qua ngày 29/06/2024, hiệu lực 01/08/2024), không phải Luật Bảo vệ và kiểm dịch thực vật (Luật BV&KDTV hiện hành vẫn là Luật 41/2013/QH13 được sửa đổi bởi Luật 146/2025/QH15).'
