xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/15/25.VBDI_23591.pdf, id=101315, SHA-256 106c0b8d5f223a4dac6eac67ab95a70e4ad62e05044870a7eafe908a9b6ef06a): Thông báo số 23591/TB-CHQ ngày 11-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị liên lạc trong nhà dùng cho hệ thống liên lạc nội bộ hữu tuyến (ký, mã hiệu Aiphone GT-2C; cấu tạo gồm vỏ nhựa ABS chống cháy và tấm khung acrylic chống cháy, màn hình màu 3.5 inch TFT color LCD, tích hợp loa, micro đàm thoại rảnh tay, nút điều khiển chức năng, đèn LED chỉ thị trạng thái; không tích hợp camera trên thiết bị, không có khe cắm thẻ nhớ, bộ nhớ trong lưu tối đa 10 hình ảnh lịch sử cuộc gọi; nguồn điện 24V DC, kích thước 140 x 190 x 30 mm, kết nối tối đa 8 camera IP; lắp gắn tường bên trong căn hộ chung cư, kết nối hữu tuyến bằng dây dẫn với camera chuông cửa và các trạm gọi/trạm bảo vệ để quan sát hình ảnh, đàm thoại hai chiều và kiểm soát an ninh ra vào căn hộ), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị liên lạc trong nhà dùng cho hệ thống liên lạc nội bộ hữu tuyến (ký, mã hiệu Aiphone GT-2C; vỏ nhựa ABS chống cháy, màn hình 3.5 inch TFT color LCD, nguồn 24V DC, kích thước 140 x 190 x 30 mm, tích hợp loa và micro đàm thoại rảnh tay, không tích hợp camera, không có khe cắm thẻ nhớ, lưu tối đa 10 ảnh lịch sử cuộc gọi, kết nối hữu tuyến với camera chuông cửa và trạm bảo vệ để kiểm soát ra vào căn hộ) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
