xac_minh:
  muc: NGUON_A
  pham_vi: "Đối chiếu thẻ vanban.chinhphu.vn (docid=179270), toàn văn PDF ký số (26tt.signed.pdf, Thứ trưởng Đỗ Hoàng Anh Tuấn ký) và CSDL quốc gia vbpl.vn (ItemID=67438): ban hành 27-02-2015, khoản 1 Điều 4 quy định có hiệu lực áp dụng kể từ ngày Luật 71/2014/QH13 và Nghị định 12/2015/NĐ-CP có hiệu lực thi hành (01-01-2015). Điều 2 (sửa TT 156/2013/TT-BTC) hết hiệu lực từ 01-01-2022 theo TT 80/2021/TT-BTC; Điều 3 (sửa TT 39/2014/TT-BTC về hóa đơn) hết hiệu lực từ 01-07-2022 theo NĐ 123/2020/NĐ-CP và TT 78/2021/TT-BTC; Điều 1 (sửa TT 219/2013/TT-BTC về thuế GTGT) bị bãi bỏ từ 01-07-2025 theo điểm e khoản 3 Điều 10 Thông tư 69/2025/TT-BTC ngày 01-07-2025 (69-btc.signed.pdf, docid=214417) khi Luật Thuế GTGT 48/2024/QH15 và NĐ 181/2025/NĐ-CP có hiệu lực."
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
