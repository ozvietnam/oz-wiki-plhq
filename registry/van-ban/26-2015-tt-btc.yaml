ghi_chu: "Sửa đổi TT 219/2013/TT-BTC (Điều 1), TT 156/2013/TT-BTC (Điều 2) và TT 39/2014/TT-BTC (Điều 3); hết hiệu lực từ 01-07-2025 khi Điều 1 bị bãi bỏ bởi điểm e khoản 3 Điều 10 TT 69/2025/TT-BTC và TT 219/2013/TT-BTC bị thay thế."
