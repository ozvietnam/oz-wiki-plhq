  pham_vi: 'Đã đối chiếu toàn văn bản ký số trên vanban.chinhphu.vn (docid=204940, tệp đính kèm 73luat.pdf, raw/download/datafiles.chinhphu.vn/73-2021-qh14.pdf, 31 trang, SHA-256 da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a), wiki/sources/73-2021-qh14.md và Công báo nước CHXHCN Việt Nam số 567 + 568 ngày 30-4-2021 trang 4–34 (congbao.chinhphu.vn ID 33659, tệp 35651-1-2021567-56873-2021-qh14.pdf): số hiệu 73/2021/QH14, tên Luật Phòng, chống ma túy (8 Chương, 55 Điều), Quốc hội khóa XIV kỳ họp thứ 11 thông qua ngày 30/03/2021, Chủ tịch Quốc hội Nguyễn Thị Kim Ngân ký; có hiệu lực từ ngày 01/01/2022 và thay thế Luật Phòng, chống ma túy số 23/2000/QH10 (đã được sửa đổi, bổ sung theo Luật số 16/2008/QH12) theo Điều 54.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Luật này quy định về phòng, chống ma túy; quản lý người sử dụng trái phép chất ma túy; cai nghiện ma túy; trách nhiệm của cá nhân, gia đình, cơ quan, tổ chức trong phòng, chống ma túy; quản lý nhà nước và hợp tác quốc tế về phòng, chống ma túy.'
      trang_pdf: 1
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 2
      noi_dung: 'Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Chất ma túy là chất gây nghiện, chất hướng thần được quy định trong danh mục chất ma túy do Chính phủ ban hành. 2. Chất gây nghiện là chất kích thích hoặc ức chế thần kinh, dễ gây tình trạng nghiện đối với người sử dụng. 3. Chất hướng thần là chất kích thích hoặc ức chế thần kinh hoặc gây ảo giác, nếu sử dụng nhiều lần có thể dẫn tới tình trạng nghiện đối với người sử dụng. 4. Tiền chất là hóa chất không thể thiếu được trong quá trình điều chế, sản xuất chất ma túy được quy định trong danh mục tiền chất do Chính phủ ban hành. 5. Thuốc thú y có chứa chất ma túy, tiền chất là thuốc thú y có chứa các chất được quy định tại các khoản 2, 3 và 4 của Điều này. 6. Cây có chứa chất ma túy là cây thuốc phiện, cây côca, cây cần sa và các loại cây khác có chứa chất ma túy do Chính phủ quy định.'
      trang_pdf: 1
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 2
      khoan: 9
      noi_dung: '9. Kiểm soát các hoạt động hợp pháp liên quan đến ma túy là việc cho phép, theo dõi, kiểm tra, giám sát các hoạt động hợp pháp liên quan đến ma túy và phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó vào mục đích khác.'
      trang_pdf: 2
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 4
      noi_dung: '1. Ngân sách nhà nước. 2. Nguồn tài trợ, viện trợ, đầu tư, tặng cho của tổ chức, cá nhân trong nước và ngoài nước. 3. Chi trả của gia đình, người nghiện ma túy. 4. Các nguồn tài chính hợp pháp khác.'
      trang_pdf: 3
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 5
      khoan: 2
      noi_dung: '2. Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất, tàng trữ, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, xử lý, trao đổi, xuất khẩu, nhập khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh trái phép chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y có chứa chất ma túy, tiền chất.'
      trang_pdf: 3
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 11
      noi_dung: '1. Cơ quan chuyên trách phòng, chống tội phạm về ma túy bao gồm: a) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân; b) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển Việt Nam và Hải quan. 2. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân, trong phạm vi nhiệm vụ, quyền hạn của mình, chủ trì, phối hợp với cơ quan, tổ chức có liên quan thực hiện các hoạt động phòng ngừa, ngăn chặn và đấu tranh chống tội phạm về ma túy. 3. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển Việt Nam, Hải quan, trong phạm vi nhiệm vụ, quyền hạn của mình, chủ trì, phối hợp với cơ quan công an, cơ quan, tổ chức khác có liên quan thực hiện các hoạt động phòng ngừa, ngăn chặn và đấu tranh chống tội phạm về ma túy tại khu vực hoặc địa bàn quản lý, kiểm soát.'
      trang_pdf: 6
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 12
      noi_dung: '1. Hoạt động hợp pháp liên quan đến ma túy là hoạt động được cơ quan quản lý nhà nước có thẩm quyền cho phép, bao gồm: a) Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất chất ma túy (không bao gồm trồng cây có chứa chất ma túy), tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất; b) Vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất; c) Nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất. 2. Hoạt động hợp pháp liên quan đến ma túy quy định tại khoản 1 Điều này được kiểm soát chặt chẽ theo quy định của Luật này và quy định khác của pháp luật có liên quan.'
      trang_pdf: 7
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 13
      noi_dung: '1. Hoạt động nghiên cứu, giám định, sản xuất chất ma túy (không bao gồm trồng cây có chứa chất ma túy), tiền chất phải được cơ quan nhà nước có thẩm quyền theo dõi, kiểm tra, giám sát. 2. Chính phủ quy định cơ quan có thẩm quyền cho phép, trình tự, thủ tục cho phép, việc theo dõi, kiểm tra, giám sát quy định tại khoản 1 Điều này.'
      trang_pdf: 8
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 14
      noi_dung: '1. Cơ quan, tổ chức, cá nhân đã được cơ quan nhà nước có thẩm quyền cho phép thì được vận chuyển chất ma túy, tiền chất; khi thực hiện việc vận chuyển phải đóng gói, niêm phong theo quy định của cơ quan có thẩm quyền; chịu trách nhiệm về số lượng, chất lượng, có biện pháp bảo vệ an toàn, không để bị thất thoát trong quá trình vận chuyển và chịu sự theo dõi, kiểm tra, giám sát của cơ quan nhà nước có thẩm quyền. 2. Chính phủ quy định chi tiết Điều này.'
      trang_pdf: 8
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 15
      noi_dung: 'Việc kiểm soát hoạt động liên quan đến thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc thực hiện theo quy định của pháp luật về dược, trừ hoạt động quy định tại điểm b khoản 1 và khoản 2 Điều 17 của Luật này.'
      trang_pdf: 8
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 16
      noi_dung: 'Việc kiểm soát hoạt động liên quan đến thuốc thú y có chứa chất ma túy, tiền chất thực hiện theo quy định của Chính phủ.'
      trang_pdf: 8
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 17
      noi_dung: 'a) Nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy, tiền chất; b) Tạm nhập, tái xuất, tạm xuất, tái nhập thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc. 2. Hoạt động quá cảnh lãnh thổ Việt Nam chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phải theo đúng hành trình đã ghi trong giấy phép quá cảnh. Cơ quan, tổ chức thực hiện việc quá cảnh phải làm thủ tục, chịu sự kiểm soát của cơ quan Hải quan và cơ quan có thẩm quyền của Việt Nam. 3. Chính phủ quy định chi tiết Điều này.'
      trang_pdf: 9
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 18
      noi_dung: 'Cơ quan, tổ chức, cá nhân khi tiến hành hoạt động quy định tại khoản 1 Điều 12 của Luật này có trách nhiệm lập hồ sơ và báo cáo theo quy định của Chính phủ.'
      trang_pdf: 9
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 19
      noi_dung: 'Hoạt động nghiên cứu, giám định, sản xuất, vận chuyển, tồn trữ, bảo quản, sử dụng, nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y có chứa chất ma túy, tiền chất vì mục đích quốc phòng, an ninh thực hiện theo quy định của Chính phủ.'
      trang_pdf: 9
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 20
      noi_dung: '1. Việc mang theo thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất dự phòng cho việc sơ cứu, cấp cứu trên tàu thủy, tàu bay, tàu hỏa, ô tô hoặc các phương tiện vận tải khác trong cuộc hành trình, du lịch quốc tế không bị coi là mang hàng xuất khẩu, nhập khẩu, quá cảnh lãnh thổ Việt Nam. Người chỉ huy, người điều khiển phương tiện vận tải có trách nhiệm khai báo với cơ quan Hải quan của Việt Nam, giải trình về số lượng thuốc đã sử dụng, áp dụng các biện pháp an toàn thích hợp để ngăn chặn việc sử dụng không đúng mục đích hoặc vận chuyển trái phép các thuốc đó và chịu sự kiểm soát của cơ quan có thẩm quyền của Việt Nam. 2. Việc mang theo thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất để điều trị bệnh cho bản thân người nhập cảnh, xuất cảnh hoặc quá cảnh lãnh thổ Việt Nam thực hiện theo quy định của Chính phủ và chịu sự kiểm soát của cơ quan có thẩm quyền của Việt Nam.'
      trang_pdf: 10
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 45
      noi_dung: '1. Chính phủ thống nhất quản lý nhà nước về phòng, chống ma túy. 2. Bộ Công an là cơ quan đầu mối giúp Chính phủ thực hiện quản lý nhà nước về phòng, chống ma túy. 3. Các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm thực hiện và phối hợp với cơ quan, tổ chức có liên quan trong phòng, chống ma túy. 4. Ủy ban nhân dân các cấp, trong phạm vi nhiệm vụ, quyền hạn của mình, thực hiện quản lý nhà nước về phòng, chống ma túy tại địa phương.'
      trang_pdf: 27
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 50
      noi_dung: 'Chỉ đạo cơ quan Hải quan thực hiện hoạt động phòng, chống ma túy theo quy định của Luật này và quy định khác của pháp luật có liên quan.'
      trang_pdf: 29
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 53
      noi_dung: 'Nhà nước Việt Nam thực hiện yêu cầu chuyển giao hàng hóa có kiểm soát trên cơ sở điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên để phát hiện và truy cứu trách nhiệm hình sự đối với người phạm tội về ma túy. Việc quyết định áp dụng và tiến hành biện pháp này thực hiện theo thỏa thuận giữa cơ quan có thẩm quyền của Việt Nam và của nước có liên quan.'
      trang_pdf: 30
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 54
      noi_dung: '1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2022. 2. Luật Phòng, chống ma túy số 23/2000/QH10 đã được sửa đổi, bổ sung một số điều theo Luật số 16/2008/QH12 hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành.'
      trang_pdf: 30
      sha256_pdf: da2beda0e8d055277926550d577595b18c8862bcff1d44cb2138fd864a81433a
    - dieu: 55
      khoan: 1
      noi_dung: 'đ) Giấy phép liên quan đến hoạt động hợp pháp liên quan đến ma túy đã được cấp tiếp tục được sử dụng đến hết thời hạn ghi trên giấy phép.'
      trang_pdf: 31
