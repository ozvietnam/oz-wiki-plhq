xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=175893, Thủ tướng Nguyễn Tấn Dũng ký) và toàn văn PDF ký số (83-nd.signed.pdf): số hiệu 83/2014/NĐ-CP, tiêu đề chính thức ''Về kinh doanh xăng dầu'', ban hành ngày 03-09-2014, có hiệu lực thi hành từ ngày 01-11-2014 (Điều 41, thay thế Nghị định 84/2009/NĐ-CP); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 08/2018/NĐ-CP, Nghị định 95/2021/NĐ-CP và Nghị định 80/2023/NĐ-CP)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về kinh doanh xăng dầu và điều kiện kinh doanh xăng dau tại thị trường Việt Nam.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Nghị định này áp dụng đối với thương nhân Việt Nam theo quy định của Luật Thương mại. 2. Nghị định này không áp dụng đổi với thương nhân nhập khẩu, sản xuất và pha chế các loại xăng dau chuyên dùng cho nhu cầu riêng của mình, không lưu thông trên thị trường theo dang ky với Bộ Công Thương.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ : __ Trong Nghị định này, các từ ngữ đưới đây được hiểu như sau: 1, Xăng dầu là tên chung dé chỉ các sản phẩm của quá trình lọc dầu thô, dùng làm nhiên liệu, bao gôm: Xăng động cơ, dầu điêzen, dầu hoả, dầu madút, nhiên liệu bay; nhiên liệu sinh học và các sản phẩm khác dùng làm nhiên liệu động cơ, không bao gom các loại khí hoá lỏng và khí nén thiên nhiên.'
      trang_pdf: 1
    - dieu: 9
      noi_dung: Điều 9. Quyền và nghĩa vụ của thương nhân kinh doanh xuất khẩu, nhận khẩu xăng dau 1. Được Bộ Công Thương phân giao hạn mức nhập khẩu xăng dầu tối thiểu hàng năm. 2. Được quyền nhập khẩu hoặc mua trong ' nước nguyên liệu để pha chế xăng dầu. Việc nhập khẩu nguyên liệu phải theo kế hoạch đã được Bộ Công Thương xác nhận, thông báo cho cơ quan hải quan làm-thủ tục và kiểm soát việc nhập khẩu nguyên liệu của thương nhân.
      trang_pdf: 8
    - dieu: 14
      noi_dung: 'Điều 14. Tham quyền, hồ sơ, trình tự cấp Giấy xác nhận đủ điều kiện làm thương nhân phân phối xăng dau 1. Bộ Công Thương có thẩm quyền cấp mới, cấp bé sung, sửa đổi và cấp lại Giấy xác nhận đủ điều kiện làm thương nhân phân phối xăng dầu cho thương nhân có đủ các điều kiện quy định tại Điều 13 Nghị định này. 2. Hồ sơ đề nghị cấp Giấy xác nhận đủ điều kiện làm thương nhân phân phối xăng dầu a) Đối với trường hợp cấp mới, hd sơ gồm:'
      trang_pdf: 12
    - dieu: 19
      noi_dung: 'Điều 19. Điều kiện đối với đại lý bán l xăng dầu Thương nhân có đủ các điều kiện dưới đây được Sở Công Thương cấp Giấy xác nhận đủ điều kiện làm đại lý bán lẻ xăng dầu (sau đây gọi tắt là đại lý): 1. Doanh nghiệp được thành lập theo quy định của pháp luật, trong Giấy chứng nhận đăng ký doanh nghiệp có đăng ký kinh doanh xăng dâu. 19'
      trang_pdf: 19
    - dieu: 24
      noi_dung: 'Điều 24. Điều kiện đối với cửa hang bán lẻ xăng dau Cửa hàng xăng dầu có đủ các điều kiện đưới đây được Sở Công Thương cấp Giấy chứng nhận cửa hàng đủ điều kiện bán lẻ xăng dầu: 1. Địa điểm phải phù hợp với quy hoạch đã được cấp có thấm quyền phê duyệt.'
      trang_pdf: 25
    - dieu: 30
      noi_dung: Điều 30. Đối twong thực hiện dự trữ xăng dầu 1. Đối tượng thực hiện dự trữ xăng dầu bắt buộc là thương nhân đầu mối. _ 2. Dy trữ quốc gia về xăng dầu theo quy định của pháp luật về dự trữ quốc gia.
      trang_pdf: 29
    - dieu: 35
      noi_dung: 'Điều 35. Xuất khẩu, tam nhập tái xuất, chuyển khẫu, gia công xuất khẩu xăng dau và nguyên liệu 1, Chỉ có thương nhân đầu mối được xuất khẩu xăng dầu và nguyên liệu. 2. Chỉ có thương nhân có Giấy phép kinh doanh xuất khâu, nhập khẩu xăng dầu được tạm nhập tái xuất, chuyên khẩu xăng dầu và nguyên liệu. 3. Chỉ có thương nhân sản xuất được gia công xuất khâu xăng dầu. 4. Kinh doanh tạm nhập tái xuất xăng dầu gồm những loại hình sau:'
      trang_pdf: 31
    - dieu: 42
      noi_dung: Điều 42. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành ké từ ngày 01 tháng 11 năm 2014. 2. Nghị định số 84/2009/NĐ-CP ngày 15 tháng 10 năm 2009 của Chính phủ về kinh doanh xăng đầu và Điều I Nghị định số 118/2011/NĐ-CP ngày 16 tháng 12 năm 2011 của Chính phủ sửa đổi, bổ sung thủ tục hành chính trong lĩnh vực kinh doanh xăng dau và khí dầu mỏ hóa lỏng hết hiệu lực thi hành kế từ ngày Nghị định này có hiệu lực.
      trang_pdf: 40
ghi_chu: 'Bộ luật nền của mảng kinh doanh + nhập khẩu xăng dầu/phụ gia nhiên liệu (issue #240 — gia đình thiếu thứ 7, ca khách 26/10 hỏi GP phụ gia chống oxy hóa 2921.5900 "Sở hay Bộ"). ĐÍNH CHÍNH lore: NĐ 80/2014/NĐ-CP là nghị định THOÁT NƯỚC — không phải xăng dầu; xăng dầu là NĐ 83/2014 này.'
