ghi_chu: 'TT tổng hợp sửa/bãi 11 Thông tư, bãi 8 Thông tư/điều khoản thuộc 8 lĩnh vực quản lý nhà nước BNNMT. Trọng tâm phân cấp: Chủ tịch UBND cấp tỉnh thay Cục Thú y/Cục BVTV kiểm tra ATTP nhập khẩu (Điều 3, hiệu lực 01/9/2026). Ngày có hiệu lực 19/5/2026 (Điều 19.1) trùng ngày ban hành; cập nhật hieu_luc_tu thành 2026-05-19. Sổ trước đó để 2026-09-01 (sai - mốc đổi cq kiểm tra).'
