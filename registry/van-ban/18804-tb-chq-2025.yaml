xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/12/10.VB_18804.pdf, id=100957, SHA-256 3def05b39d2a129a69d731abe03ed442cfa6175129edcfc450a72354aa168dc3): Thông báo số 18804/TB-CHQ ngày 11-08-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị đeo tay thông minh Huawei Band 10 (đồng hồ thông minh Huawei Band 10, khung nhựa; bộ máy hoàn chỉnh gồm 01 thiết bị đeo tay thông minh có pin, dây đeo cao su fluoroelastomer và 01 dây sạc; khung máy bằng nhựa gia cường fiber-reinforced polymer, kích thước thân máy 43.45 x 24.54 x 8.99 mm, trọng lượng 14g không gồm dây đeo; chỉ có mặt hiển thị bằng quang điện tử là màn hình cảm ứng AMOLED 1.47 inch, hoạt động bằng điện, kết nối Bluetooth 5.0 với thiết bị chủ như điện thoại thông minh/máy tính bảng, chống nước 5 ATM, tích hợp cảm biến IMU 9 trục, cảm biến nhịp tim quang học và cảm biến ánh sáng; dùng để xem thời gian ngày giờ, báo thức, bấm giờ, đo và theo dõi chỉ số thể thao/sức khỏe như đếm bước chân, khoảng cách chạy bộ, calo, nhịp tim, giấc ngủ, nhận thông báo và xem/trả lời tin nhắn soạn sẵn, từ chối cuộc gọi đến; không hỗ trợ GPS, NFC, không tích hợp loa và mic, không đàm thoại trực tiếp), phân loại vào nhóm 91.02, mã số 9102.12.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị đeo tay thông minh Huawei Band 10 (đồng hồ thông minh Huawei Band 10, khung nhựa gia cường fiber-reinforced polymer, dây đeo cao su fluoroelastomer kèm dây sạc; kích thước thân máy 43.45 x 24.54 x 8.99 mm, trọng lượng 14g, chỉ có mặt hiển thị quang điện tử màn hình cảm ứng AMOLED 1.47 inch, hoạt động bằng điện, kết nối Bluetooth 5.0, chống nước 5 ATM, cảm biến IMU 9 trục và nhịp tim quang học; có chức năng hiển thị ngày giờ, báo thức, bấm giờ, theo dõi vận động/sức khỏe, đồng bộ thông báo và trả lời tin nhắn soạn sẵn; không hỗ trợ GPS/NFC, không tích hợp loa và mic) thuộc nhóm 91.02, mã số 9102.12.00.'
