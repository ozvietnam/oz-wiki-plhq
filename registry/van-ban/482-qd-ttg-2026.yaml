xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A của Văn phòng Chính phủ đính kèm trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/27/482_QD-TTg_26032026-signed.pdf, id=102945, SHA-256 7774d7b8c4cb61061b6857a4af63dae440af255aacc84baa01085ea4e81a646f): Quyết định số 482/QĐ-TTg ngày 26-03-2026 của Thủ tướng Chính phủ (Thủ tướng Phạm Minh Chính ký) áp dụng mức thuế bảo vệ môi trường (0 đồng/lít đối với xăng trừ etanol, dầu diezel và nhiên liệu bay), thuế giá trị gia tăng (thuộc đối tượng không phải kê khai, tính nộp thuế GTGT nhưng được khấu trừ thuế GTGT đầu vào), thuế tiêu thụ đặc biệt (0% đối với xăng các loại) kể từ 24 giờ 00 phút ngày 26-03-2026 đến hết ngày 15-04-2026; đã hết hiệu lực từ ngày 16-04-2026 (tiếp nối bởi Nghị quyết số 19/2026/QH16 ngày 12-04-2026 của Quốc hội)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Mức thuế bảo vệ môi trường, thuế giá trị gia tăng, thuế tiêu thụ đặc biệt đối với xăng, dầu và nhiên liệu bay: 1. Mức thuế bảo vệ môi trường đối với xăng (trừ etanol), dầu diezel và nhiên liệu bay là 0 đồng/lít. 2. Xăng, dầu diezel và nhiên liệu bay thuộc đối tượng không phải kê khai, tính nộp thuế giá trị gia tăng nhưng được khấu trừ thuế giá trị gia tăng đầu vào. 3. Mức thuế suất thuế tiêu thụ đặc biệt đối với xăng các loại là 0%.'
      trang_pdf: 1
      sha256_pdf: 7774d7b8c4cb61061b6857a4af63dae440af255aacc84baa01085ea4e81a646f
    - dieu: 2
      noi_dung: 'Điều 2. Điều khoản thi hành: 1. Quyết định này có hiệu lực thi hành kể từ 24 giờ 00 phút ngày 26 tháng 3 năm 2026 đến hết ngày 15 tháng 4 năm 2026. 2. Trong thời gian Quyết định này có hiệu lực thi hành: a) Các văn bản quy phạm pháp luật có quy định mức thuế bảo vệ môi trường, thuế giá trị gia tăng, thuế tiêu thụ đặc biệt đối với xăng, dầu và nhiên liệu bay khác quy định tại Quyết định này thì thực hiện theo quy định của Quyết định này. b) Cơ sở kinh doanh, người nhập khẩu xăng, dầu diezel và nhiên liệu bay không phải kê khai, tính nộp thuế giá trị gia tăng khi bán ra và ở khâu nhập khẩu.'
      trang_pdf: 1
      sha256_pdf: 7774d7b8c4cb61061b6857a4af63dae440af255aacc84baa01085ea4e81a646f
ghi_chu: 'Quyết định khẩn cấp áp dụng từ 24h00 ngày 26/03/2026 đến hết ngày 15/04/2026 theo Kết luận 14-KL/TW ngày 20/03/2026 và Nghị quyết 68/NQ-CP ngày 26/03/2026; từ ngày 16/04/2026 được tiếp nối bởi Nghị quyết số 19/2026/QH16 ngày 12/04/2026 của Quốc hội.'
