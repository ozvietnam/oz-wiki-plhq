  da_doi_chieu: true
  ghi_chu: 'Trích từ PDF Công báo số 82 ngày 04-02-2026 (trang 34–39 PDF, tức trang 36–41 số Công báo): 79 tiền chất tại Danh mục IV (IVA: 31 tiền chất do Bộ Công an quản lý; IVB: 30 tiền chất do Bộ Công Thương, Bộ Y tế, Bộ Nông nghiệp và Môi trường quản lý; IVC: 18 tiền chất là hóa chất, dung môi, chất xúc tác do Bộ Công Thương, Bộ Nông nghiệp và Môi trường quản lý), tách ô 2 mã HS của Sulfuric acid (IVC.15: 2807.00.10, 2807.00.90) thành 80 dòng dữ liệu; 9 dòng IVA.12..IVA.20 trong bản gốc Công báo in mã 2932.99.90 (AHTN cũ) đã chuẩn hóa về 2932.99.00 theo Biểu thuế hiện hành (nhu-cau/bieu-thue.json); các Danh mục I, II, III (trang 4–33 PDF) chỉ liệt kê theo tên chất, tên khoa học và mã CAS, không gắn mã HS.'
xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 82 ngày 04-02-2026 (raw/download/congbaocdn.chinhphu.vn/28-2026-nd-cp.pdf, 40 trang, trang 3–42 của số Công báo, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 04-02-2026, SHA-256 a053fce94b36ea3a660962bb4fab41e5296cbf0636872895c07758bd685a6c24), thẻ vanban.chinhphu.vn (docid=216717) và trang wiki/sources/28-2026-nd-cp.md: Thủ tướng Phạm Minh Chính ký ban hành ngày 19-01-2026; cấu trúc 3 Điều và Phụ lục 04 Danh mục chất ma túy, tiền chất (Danh mục I: IA 24 chất, IB 34 chất; Danh mục II: IIA 135 chất, IIB 341 chất; Danh mục III: 81 chất; Danh mục IV: IVA 31 tiền chất, IVB 30 tiền chất, IVC 18 tiền chất); Điều 3 khoản 1-2 có hiệu lực từ ngày 19-01-2026 và thay thế toàn bộ NĐ 57/2022/NĐ-CP, NĐ 90/2024/NĐ-CP.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Ban hành kèm theo Nghị định này Phụ lục các danh mục chất ma túy và tiền chất sau đây: Danh mục I: Các chất ma túy tuyệt đối cấm sử dụng trong y học và đời sống xã hội; việc sử dụng các chất này trong nghiên cứu, kiểm nghiệm, giám định, vì mục đích quốc phòng, an ninh theo quy định đặc biệt của cơ quan có thẩm quyền: IA. Các chất gây nghiện và muối, đồng phân, ester, ether và muối của các đồng phân, ester, ether có thể tồn tại của các chất sau (trừ khi ester, ether của chất đó nằm trong danh mục khác); IB. Các chất hướng thần và muối, đồng phân, muối của đồng phân có thể tồn tại của các chất sau. Danh mục II: Các chất ma túy được sử dụng hạn chế trong nghiên cứu, kiểm nghiệm, giám định, vì mục đích quốc phòng, an ninh hoặc trong lĩnh vực y tế theo quy định của cơ quan có thẩm quyền: IIA. Các chất gây nghiện và muối, đồng phân, ester, ether, muối của các đồng phân, ester, ether có thể tồn tại của các chất sau (trừ khi ester, ether của chất đó nằm trong danh mục khác); IIB. Các chất hướng thần và muối, đồng phân, muối của đồng phân có thể tồn tại của các chất sau. Danh mục III: Các chất ma túy được sử dụng trong nghiên cứu, kiểm nghiệm, giám định, vì mục đích quốc phòng, an ninh hoặc trong lĩnh vực y tế, thú y theo quy định của cơ quan có thẩm quyền. Các chất hướng thần và muối, đồng phân, muối của đồng phân có thể tồn tại của các chất sau. Danh mục IV: Các tiền chất: IVA: Các tiền chất thiết yếu, tham gia vào cấu trúc chất ma túy, không có ứng dụng hợp pháp trong y học và đời sống xã hội, được sử dụng hạn chế trong nghiên cứu, kiểm nghiệm, giám định, vì mục đích quốc phòng, an ninh theo quy định đặc biệt của cơ quan có thẩm quyền; IVB: Các tiền chất thiết yếu, tham gia vào cấu trúc chất ma túy, có ứng dụng hợp pháp trong y học và đời sống xã hội; IVC: Các tiền chất là hóa chất, dung môi, chất xúc tác dùng trong quá trình sản xuất chất ma túy.'
      trang_pdf: 1
      sha256_pdf: a053fce94b36ea3a660962bb4fab41e5296cbf0636872895c07758bd685a6c24
    - dieu: 2
      noi_dung: '1. Bộ Công an có trách nhiệm quản lý nhà nước các chất ma túy, tiền chất phục vụ nghiên cứu, kiểm nghiệm, giám định (trừ các chất ma túy, tiền chất được sử dụng trong lĩnh vực y tế, nông nghiệp và môi trường thuộc phạm vi quản lý của Bộ Y tế, Bộ Nông nghiệp và Môi trường; các tiền chất được sử dụng trong lĩnh vực công nghiệp, quốc phòng thuộc phạm vi quản lý của Bộ Công Thương, Bộ Quốc phòng) và vì mục đích quốc phòng, an ninh. 2. Bộ Công Thương có trách nhiệm quản lý nhà nước về các tiền chất sử dụng trong lĩnh vực công nghiệp. 3. Bộ Y tế có trách nhiệm ban hành danh mục và quản lý nhà nước về các chất ma túy, tiền chất được sử dụng trong lĩnh vực y tế. 4. Bộ Nông nghiệp và Môi trường có trách nhiệm ban hành danh mục và quản lý nhà nước các chất ma túy, tiền chất được sử dụng trong lĩnh vực nông nghiệp và môi trường. 5. Bộ Quốc phòng có trách nhiệm quản lý nhà nước về các tiền chất được sử dụng trong lĩnh vực quốc phòng.'
      trang_pdf: 2
      sha256_pdf: a053fce94b36ea3a660962bb4fab41e5296cbf0636872895c07758bd685a6c24
    - dieu: 3
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 19 tháng 01 năm 2026. 2. Nghị định số 57/2022/NĐ-CP ngày 25 tháng 8 năm 2022 của Chính phủ quy định các danh mục chất ma túy và tiền chất; Nghị định số 90/2024/NĐ-CP ngày 17 tháng 7 năm 2024 sửa đổi, bổ sung danh mục chất ma túy và tiền chất ban hành kèm theo Nghị định số 57/2022/NĐ-CP ngày 25 tháng 8 năm 2022 của Chính phủ quy định các danh mục chất ma túy và tiền chất hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành. 3. Các tổ chức, cá nhân sản xuất, kinh doanh hợp pháp Carisoprodol, Etomidate thực hiện các quy định về quản lý chất ma túy theo Nghị định này và các văn bản có liên quan kể từ ngày 01 tháng 6 năm 2026. 4. Các tổ chức, cá nhân sản xuất, kinh doanh hợp pháp 1,4-Butanediol thực hiện các quy định về quản lý tiền chất theo Nghị định này và các văn bản có liên quan trước ngày 31 tháng 12 năm 2026. 5. Bộ trưởng Bộ Công an, các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này. 6. Khi phát hiện chất mới chưa có trong các danh mục chất ma túy và tiền chất ban hành kèm theo Nghị định này liên quan đến mục đích bất hợp pháp hoặc theo quy định tại ba Công ước của Liên hợp quốc về phòng, chống ma túy thì Bộ Công an có trách nhiệm chủ trì, phối hợp với Bộ Y tế, Bộ Công Thương, Bộ Khoa học và Công nghệ, Bộ Nông nghiệp và Môi trường, Bộ Quốc phòng và các cơ quan có liên quan xem xét, trình Chính phủ sửa đổi, bổ sung và công bố các danh mục đó.'
      trang_pdf: 3
      sha256_pdf: a053fce94b36ea3a660962bb4fab41e5296cbf0636872895c07758bd685a6c24
ghi_chu: Danh mục tiền chất mới chia IV.A/IV.B/IV.C (79 tiền chất). Điều 3 khoản 3-4 có lộ trình riêng cho Carisoprodol, Etomidate (từ 01-06-2026) và 1,4-Butanediol (trước 31-12-2026) — đọc nguyên văn khi trả lời ca cụ thể.
