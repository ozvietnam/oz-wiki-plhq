ghi_chu: >-
  Hướng dẫn giải quyết thủ tục thông quan nhanh trong ngày (kể cả ngoài giờ hành chính, ngày nghỉ, lễ) và ưu tiên thủ
  tục tái nhập cho hàng nông, lâm, thủy sản xuất khẩu (đặc biệt là sầu riêng xuất khẩu qua cửa khẩu biên giới phía Bắc).
