xac_minh:
  muc: NGUON_A
  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/17/VB_18837.pdf, id=105149, 2 trang, ký số ngày 15-07-2026 11:02:29
    +07:00, SHA-256 4bc91d24455034b2888cd34e92d9fe703a3bc23fd104cda22d8a3912450c98ac): Công văn khẩn số 18837/CHQ-GSQL
    ngày 15-07-2026 của Cục Hải quan chỉ đạo các Chi cục Hải quan khu vực triển khai 6 giải pháp tạo thuận lợi thông
    quan đối với hàng hóa nông, lâm, thủy sản xuất khẩu (đặc biệt là sầu riêng, quả vải xuất khẩu sang Trung Quốc theo
    Công văn 5903/VPCP-KTTH ngày 23-06-2026 và Thông báo 361/TB-VPCP ngày 08-07-2026): (1) thông quan nhanh trong ngày
    kể cả ngoài giờ hành chính, ngày nghỉ, ngày lễ; (2) phối hợp doanh nghiệp kho bãi cửa khẩu bố trí địa điểm bảo quản,
    phân loại; (3) cập nhật tình hình xuất khẩu, điều tiết giao thông tránh ùn tắc; (4) trao đổi với Hải quan cửa khẩu
    Trung Quốc và thông báo thay đổi chính sách kiểm tra cho doanh nghiệp; (5) ưu tiên giải quyết nhanh thủ tục tái nhập
    đối với lô hàng đã thực xuất nhưng không đủ điều kiện nhập khẩu vào Trung Quốc; (6) nghiêm cấm gây phiền hà, kéo dài
    thời gian thông quan
  hieu_luc_da_doi_chieu: true
