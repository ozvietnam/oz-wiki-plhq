  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/15/6.VB_19307.pdf, id=101000, SHA-256 a716c6a31acb452e07cb78f5756551cb1caa179553ef60c3c75f2359759dcf65): Thông báo số 19307/TB-CHQ ngày 14-08-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Dầu nhựa nhiệt phân (Plastic Pyrolysis Oil; thành phần tính theo trọng lượng chứa trên 70% hydrocacbon có nguồn gốc từ nhựa đã qua sử dụng được nhiệt phân ở nhiệt độ cao khoảng 800°C trong môi trường không có oxy rồi ngưng tụ thành chất lỏng, gồm 80-90% non-aromatic hydrocarbon và 10-20% aromatic hydrocarbon; thông số kỹ thuật: nước và cặn 0.8%, điểm chảy ở các khoảng cách 3°C là 9°C, tổng hàm lượng lưu huỳnh 0.0083%, chưng cất theo phương pháp ASTM D86 ở 210°C đạt 66% thể tích và ở 230°C đạt 90% thể tích; công dụng làm nguyên liệu để sản xuất dầu diesel và naphtha), phân loại vào nhóm 27.10, phân nhóm 2710.19, mã số 2710.19.89; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Dầu nhựa nhiệt phân (Plastic Pyrolysis Oil; chứa trên 70% hydrocacbon có nguồn gốc từ nhựa đã qua sử dụng được nhiệt phân ở nhiệt độ cao khoảng 800°C trong môi trường không có oxy, gồm 80-90% non-aromatic hydrocarbon và 10-20% aromatic hydrocarbon, nước và cặn 0.8%, điểm chảy 9°C, tổng hàm lượng lưu huỳnh 0.0083%, chưng cất ASTM D86 đạt 66% thể tích ở 210°C và 90% thể tích ở 230°C; dùng làm nguyên liệu sản xuất dầu diesel và naphtha) thuộc nhóm 27.10, phân nhóm 2710.19, mã số 2710.19.89.'
