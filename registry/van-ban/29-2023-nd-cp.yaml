  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định về đối tượng, nguyên tắc, chính sách tinh giản biên chế và trách nhiệm thực hiện tinh giản biên chế › trong các cơ quan, tổ chức, đơn vị sự nghiệp công lập của Đảng, Nhà nước, tổ chức chính trị - xã hội từ Trung ương đến cấp xã.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng thực hiện chính sách tinh giản biên chế 1. Cán bộ, công chức, viên chức; cán bộ, công chức cấp xã và người làm việc theo chế độ hợp đồng lao động không xác định thời hạn trong các cơ quan hành chính được áp dụng chế độ, chính sách như công chức theo quy định của Chính phủ, nếu thuộc một trong các trường hợp sau:'
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc tỉnh giản biên chế 1. Bảo đảm sự lãnh đạo của Đảng, phát huy vai trò giám sát của các tổ chức chính trị - xã hội và nhân dân trong quá trình thực hiện tinh giản biên chê. 2. Gắn tỉnh giản biên chế với sắp xếp tô chức bộ máy theo hướng tỉnh gọn, hoạt động hiệu lực, hiệu quả và cơ cầu lại, nâng cao chất lượng đội ngũ cán bộ, công chức, viên chức theo vị trí việc làm, phù hợp với cơ chế tự chủ của cơ quan, tổ chức, đơn vị.
      trang_pdf: 3
    - dieu: 6
      noi_dung: 'Điều 6. Chính sách chuyền sang làm việc tại các tổ chức không hưởng lương thường xuyên từ ngân sách nhà nước 1. Đối tượng tỉnh giản biên chế chuyền sang làm việc tại các tổ chức không hưởng kinh phí thường xuyên từ ngân sách nhà nước được hưởng các khoản trợ câp sau: a) Được trợ cấp 03 tháng tiền lương hiện hưởng; b) Được trợ cấp 1/2 tháng tiền lương bình quân cho mỗi năm công tác có đóng bảo hiểm xã hội bắt buộc.'
      trang_pdf: 5
    - dieu: 8
      noi_dung: Điều 8. Chính sách nghỉ hưu trước tuôi đối với cán bộ, công chức cấp xã đôi dư do sắp xếp. đơn vị hành chính cấp xã có tuôi thấp hơn tối đa đủ 10 tuổi và thấp hơn tối thiểu trên 05 tudi so với tuôi nghỉ hưu theo quy định của pháp luật về bảo hiểm xã hội
      trang_pdf: 6
    - dieu: 10
      noi_dung: Điều 10. Cách xác định thời gian và tiền lương để tính hướng trợ cấp tỉnh giản biên chế 1. Tiền lương hiện hưởng là tiền lương tháng liền kề trước khi tỉnh giản biên chế.
      trang_pdf: 8
    - dieu: 13
      noi_dung: Điều 13. Trách nhiệm của Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, người đứng đầu các tổ chức do Chính phủ, Thủ tướng Chính phủ thành lập mà không phải là đơn vị sự nghiệp công lập 1. Chỉ đạo triển khai tinh giản biên chế theo quy định tại Nghị định này.
      trang_pdf: 10
    - dieu: 15
      noi_dung: Điều 15. Trách nhiệm của Bộ Nội vụ 1. Kiểm tra việc thực hiện các quy định vẻ tỉnh giản biên chế tại các bộ, ngành, địa phương. 2. Định kỳ trước ngày 31 tháng 3 hàng năm, báo cáo Thủ tướng Chính phủ tình hình thực hiện Nghị định này.
      trang_pdf: 12
    - dieu: 17
      noi_dung: Điều 17. Trách nhiệm của Báo hiếm xã hội Việt Nam Bảo hiểm xã hội Việt Nam có trách nhiệm hướng dẫn nghiệp vụ, chỉ đạo Bảo hiểm xã hội tỉnh, thành phố trực thuộc trung ương giải quyét chính sách, chế độ bảo hiểm xã hội đối với đối tượng tinh giản biên chế theo quy định của Nghị định này. Chương IV DIEU KHOẢN THI HANH
      trang_pdf: 13
    - dieu: 20
      noi_dung: Điều 20. Điều khoản chuyền tiếp 1. Các trường hợp có thời điểm tinh giản biên chế sau khi Nghị định này có hiệu lực thi hành nhưng đã được cấp có thâm quyền quyết định cho tỉnh giản biên chế trước ngày Nghị định này ban hành thì không đặt van dé xem xét lại chế độ, chính sách theo Nghị định này và Bộ trưởng, Thủ trưởng cơ quan thuộc Chính phủ, người đứng dau các tô chức do Chính phủ, Thủ tướng Chính phủ thành lập mà không phải là đơn vị sự
      trang_pdf: 14
