  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phê chuẩn điều ước quốc tế Phê chuẩn Hiệp định Thương mại tự do giữa Cộng hòa xã hội chủ nghĩa Việt Nam và Liên minh Châu Âu (sau đây gọi tắt là Hiệp định) được ký ngày 30 tháng 6 năm 2019 tại Hà Nội, Việt Nam. Toàn văn bản tiếng Anh và tiếng Việt của Hiệp định tại Phụ lục 1 kèm theo Nghị quyết này.
      trang_pdf: 1
      sha256_pdf: 6915a2b7bcb0e97debf38db1a3a66f83a7f2bee436c8d7781950c559af13c823
    - dieu: 2
      noi_dung: 1. Áp dụng trực tiếp các quy định của Hiệp định tại Phụ lục 2 kèm theo Nghị quyết này; 2. Áp dụng các quy định của Hiệp định tại Phụ lục 3 kèm theo Nghị quyết này cho đến ngày Luật Sở hữu trí tuệ số 50/2005/QH11 đã được sửa đổi bổ sung một số điều theo Luật số 36/2009/QH12 và Luật số 42/2019/QH14 được sửa đổi, bổ sung có hiệu lực thi hành;
      trang_pdf: 2
      sha256_pdf: 6915a2b7bcb0e97debf38db1a3a66f83a7f2bee436c8d7781950c559af13c823
    - dieu: 3
      noi_dung: Điều 3. Tổ chức thực hiện điều ước quốc tế 1. Chính phủ, Tòa án nhân dân tối cao, Viện kiểm sát nhân dân tối cao và các cơ quan, tổ chức có liên quan theo thẩm quyền tiến hành rà soát các văn bản quy phạm pháp luật tại Phụ lục 4 kèm theo Nghị quyết này và các văn bản quy phạm pháp luật khác có liên quan để tự mình hoặc kiến nghị cơ quan nhà nước có thẩm quyền kịp thời sửa đổi, bổ sung, bãi bỏ hoặc ban hành mới, bảo đảm tính thống nhất của hệ
      trang_pdf: 2
      sha256_pdf: 6915a2b7bcb0e97debf38db1a3a66f83a7f2bee436c8d7781950c559af13c823
    - dieu: 4
      noi_dung: Điều 4. Giám sát thực hiện Nghị quyết Quốc hội, Ủy ban Thường vụ Quốc hội, Hội đồng Dân tộc, các Ủy ban của Quốc hội, các Đoàn đại biểu Quốc hội và các đại biểu Quốc hội trong phạm vi nhiệm vụ, quyền hạn của mình giám sát việc thực hiện Nghị quyết này. Nghị quyết này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XIV, kỳ họp thứ 9 thông qua ngày 08 tháng 6 năm 2020. CHỦ TỊCH QUỐC HỘI Nguyễn Thị Kim Ngân
      trang_pdf: 3
