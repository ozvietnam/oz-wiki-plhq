ghi_chu: 'Trinh sát đêm 11/11, bổ sung nguồn chinhphu.vn và nạp toàn văn ngày 12/11. Công bố sửa đổi, bổ sung và bãi bỏ 27 TTHC hải quan — ảnh hưởng trực tiếp danh mục thủ tục khai báo. Điều 2 bãi bỏ một phần nội dung tại các QĐ 2770/QĐ-BTC, 350/QĐ-BTC, 2061/QĐ-BTC, 671/QĐ-BTC, 2065/QĐ-BTC, 2902/QĐ-BTC — chưa ghi vào quan_he vì các quyết định đó chưa có trong sổ.'
