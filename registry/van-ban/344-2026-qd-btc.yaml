  pham_vi: 'Toàn văn HTML xaydungchinhsach.chinhphu.vn + TVPL 695437: Quyết định 344/QĐ-BTC ngày 24-02-2026 của Bộ trưởng Bộ Tài chính (ký thừa ủy quyền Cục trưởng Cục Hải quan Nguyễn Văn Thọ). Điều 1 công bố kèm theo Quyết định danh mục thủ tục hành chính mới ban hành, được sửa đổi, bổ sung và bãi bỏ trong lĩnh vực hải quan thuộc phạm vi chức năng quản lý nhà nước của Bộ Tài chính. Điều 2 quy định hiệu lực thi hành kể từ ngày ký (24-02-2026) và bãi bỏ một số nội dung công bố TTHC tại Phần I các Quyết định: 2770/QĐ-BTC (25-12-2015), 350/QĐ-BTC (08-03-2019), 2061/QĐ-BTC (28-10-2019), 671/QĐ-BTC (24-04-2020), 2065/QĐ-BTC (06-10-2022), 2902/QĐ-BTC (25-08-2025). Đối chiếu đến 12-11-2026 còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
