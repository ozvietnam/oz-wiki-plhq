xac_minh:
  muc: NGUON_A
  pham_vi: 'Toàn văn PDF ký số chính thức của Bộ Tài chính trên Cổng TTĐT Hải quan (files.customs.gov.vn, 288 trang, ký bởi Bộ Tài chính ngày 24-02-2026 16:37:22 +07:00, Thứ trưởng Nguyễn Đức Chi ký thay Bộ trưởng) + CSDLQG về TTHC (ma_quyet_dinh=119099) + xaydungchinhsach.chinhphu.vn: Điều 1 công bố kèm theo Quyết định thủ tục hành chính được sửa đổi, bổ sung và bị bãi bỏ trong lĩnh vực hải quan (theo TT 121/2025/TT-BTC); Điều 2 có hiệu lực từ ngày ký 24-02-2026 và bãi bỏ một số nội dung công bố TTHC tại Phần I các Quyết định 2065/QĐ-BTC (06-10-2022), 2770/QĐ-BTC (25-12-2015), 2061/QĐ-BTC (28-10-2019), 350/QĐ-BTC (08-03-2019), 671/QĐ-BTC (24-04-2020), 2902/QĐ-BTC (25-08-2025). Đối chiếu đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: ong-w15-nap-gap@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Công bố kèm theo Quyết định này thủ tục hành chính được sửa đôi, bô sung và bị bãi bỏ trong lĩnh vực hải quan thuộc phạm vi chức năng quản lý của Bộ Tài chính.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Bãi bỏ nội dung công bó thủ tục hành chính tại: số thứ tự 1, 3 điểm A mục 1 Phan I; số thứ tự 1, 2, 3 điểm A mục 2 phần I; số thứ tự 1 điểm B mục 2 phần I; số thứ tự 6, 7, 8, 11, 12, 13, 15, 16, 18, 19, 20, 21 điểm C mục 2 Phan I Quyết định số 2065/QD-BTC ngày 06/10/2022; số thứ tự 1, 2, 4, 6 điểm C mục | phan I, số thứ tự 12, 18 điểm A mục 2 phan I, số thứ tự 2, 18, 19 điểm C mục 2 phan I Quyết định số 2770/QĐ-BTC ngày 25/12/2015;'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Cục trưởng Cục Hai quan, Chánh Văn phòng, Vụ trưởng Vụ Pháp chế, Chi cục trưởng các Chi cục Hải quan khu vực và Thủ trưởng các đơn vị có liên quan chịu trách nhiệm thi hành Quyêt định này./. Yd
      trang_pdf: 2
ghi_chu: Đã nạp PDF ký số bậc A (288 trang) từ files.customs.gov.vn (ma_noi_bo=102747) và bản OCR. Công bố sửa đổi, bổ sung và bãi bỏ TTHC hải quan theo TT 121/2025/TT-BTC. Điều 2 bãi bỏ một phần nội dung tại các QĐ 2770/QĐ-BTC, 350/QĐ-BTC, 2061/QĐ-BTC, 671/QĐ-BTC, 2065/QĐ-BTC, 2902/QĐ-BTC — chưa ghi vào quan_he vì các quyết định đó chưa có trong sổ.
