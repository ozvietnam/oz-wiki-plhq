    - dieu: 3
      noi_dung: 'Điều 3. Điều khoản thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025, trừ trường hợp quy định tại khoản 2 Điều này. 2. Các quy định sau đây có hiệu lực thi hành từ ngày 01 tháng 01 năm 2025: a) Điểm a khoản 19, điểm b khoản 20 và điểm a khoản 21 Điều 1 của Luật này; b) Quy định về gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc tại khoản 30 Điều 1 của Luật này.'
