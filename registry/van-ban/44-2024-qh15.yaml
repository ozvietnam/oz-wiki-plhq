    - dieu: 2
      noi_dung: 'Điều 2. Sửa đổi, bổ sung Luật Giá số 16/2023/QH15 Sửa đổi, bổ sung mục 9 Phụ lục số 01 - Danh mục hàng hóa, dịch vụ bình ổn giá ban hành kèm theo Luật Giá số 16/2023/QH15 như sau: “9. Thuốc thuộc Danh mục thuốc thiết yếu.”.'
