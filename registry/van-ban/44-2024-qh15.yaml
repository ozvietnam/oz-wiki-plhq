      noi_dung: 'Điều 1. Sửa đổi, bổ sung một số điều của Luật Dược 1. Sửa đổi, bổ sung một số khoản của Điều 2 như sau: a) Sửa đổi, bổ sung khoản 5 như sau: “5. Dược liệu (bao gồm cả vị thuốc cổ truyền) là nguyên liệu làm thuốc có nguồn gốc từ thực vật, động vật, khoáng vật, nấm và đạt tiêu chuẩn làm thuốc.”; b) Sửa đổi, bổ sung các khoản 8, 9 và 10 như sau: “8.'
