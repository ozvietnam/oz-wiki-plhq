    viec_tiep: 'CSDLQG về TTHC (vpcp.dichvucong.gov.vn ma_quyet_dinh=25510) có metadata và mã tệp 7866_QD-BYT_409396.pdf nhưng máy chủ tải tệp csdl.dichvucong.gov.vn lỗi HTTP 503; vanban.chinhphu.vn, congbao.chinhphu.vn, vbpl.vn, dav.gov.vn, moh.gov.vn không đăng toàn văn bản gốc (Công báo Cà Mau số 18/2019 chỉ trích 01 TTHC cấp tỉnh kèm QĐ 506/QĐ-UBND). Xóa toan_van cũ bị lưu nhầm TT 06/2011/TT-BYT (docid=99376).'
ghi_chu: Công bố thủ tục hành chính mới ban hành/được sửa đổi, bổ sung trong lĩnh vực Mỹ phẩm (ban hành 28-12-2018); đã được sửa đổi, bổ sung một phần bởi QĐ 2393/QĐ-BYT (22-07-2025) và QĐ 1536/QĐ-BYT (28-05-2026). Chưa tải được toàn văn PDF gốc bậc A do csdl.dichvucong.gov.vn 503; tệp 7866-qd-byt.html trước đây thực chất là TT 06/2011/TT-BYT (docid=99376).
