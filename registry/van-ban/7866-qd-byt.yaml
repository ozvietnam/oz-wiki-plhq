xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu bản ghi Quyết định số 7866/QĐ-BYT ngày 28-12-2018 trên Cổng DVCQG (vpcp.dichvucong.gov.vn ma_quyet_dinh=25510, có tệp đính kèm 7866_QD-BYT_409396.pdf nhưng csdl.dichvucong.gov.vn trả lỗi 503 khi tải tệp) cùng toàn văn các văn bản QPPL gốc về quản lý mỹ phẩm trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=99376 cho TT 06/2011/TT-BYT, docid=195324 và 155.signed.pdf cho NĐ 155/2018/NĐ-CP, docid=214428 cho TT 34/2025/TT-BYT, docid=216427 cho TT 47/2025/TT-BYT, docid=219432 cho VBHN 18/VBHN-QĐ-BYT): công bố TTHC mới ban hành/được sửa đổi, bổ sung trong lĩnh vực Mỹ phẩm; đã được sửa đổi, bổ sung và bãi bỏ một phần nội dung TTHC bởi Quyết định 2393/QĐ-BYT (HL 18-08-2025) và Quyết định 1536/QĐ-BYT (HL 28-05-2026)'
