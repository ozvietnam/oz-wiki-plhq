ghi_chu: 'Công bố thủ tục hành chính mới ban hành/được sửa đổi, bổ sung trong lĩnh vực Mỹ phẩm (ban hành 28-12-2018); đã được sửa đổi, bổ sung một phần bởi QĐ 2393/QĐ-BYT (22-07-2025) và QĐ 1536/QĐ-BYT (28-05-2026).'
