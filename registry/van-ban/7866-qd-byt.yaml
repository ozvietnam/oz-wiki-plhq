  pham_vi: 'đối chiếu thông tin ký ban hành ngày 28-12-2018 (có hiệu lực từ ngày ký 28-12-2018) cùng toàn văn các văn bản QPPL gốc về quản lý mỹ phẩm trên Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=99376 cho Thông tư 06/2011/TT-BYT, docid=195324 và 155.signed.pdf cho Nghị định 155/2018/NĐ-CP ngày 12-11-2018, docid=214428 cho Thông tư 34/2025/TT-BYT, docid=216427 cho Thông tư 47/2025/TT-BYT, docid=219432 cho VBHN 18/VBHN-QĐ-BYT): công bố thủ tục hành chính mới ban hành/được sửa đổi, bổ sung trong lĩnh vực Mỹ phẩm thuộc phạm vi chức năng quản lý của Bộ Y tế (đính chính trích yếu nguyên văn chính thức, không phải văn bản danh mục hàng hóa kèm mã HS); đã được sửa đổi, bổ sung và bãi bỏ một phần nội dung TTHC bởi Quyết định 2393/QĐ-BYT ngày 22-07-2025 (HL 18-08-2025) và Quyết định 1536/QĐ-BYT ngày 28-05-2026 (HL 28-05-2026)'
  hieu_luc_da_doi_chieu: true
