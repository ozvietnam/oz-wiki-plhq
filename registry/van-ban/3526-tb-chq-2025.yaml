  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/29/VB_3526.pdf, id=99938, SHA-256 0a901de8fce40c83e59c5fcc09f776405d32496b012b96ad75fe845dc5b71ba2): Thông báo số 3526/TB-CHQ ngày 26-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ điều khiển phân tán OptiFlexTM Advanced Equipment Controller (tên gọi theo cấu tạo, công dụng: Bộ điều khiển phân tán giám sát và điều khiển từng vùng hoặc thiết bị hệ thống cơ điện tòa nhà giao tiếp mạng LAN Ethernet bằng giao thức BACnet/IP kết nối hệ thống tự động hóa tòa nhà WebCTRL; ký, mã hiệu OFS561T-E2, nhà sản xuất Automated Logic; tích hợp 2 cổng Ethernet 10/100Mbps, 1 cổng EIA-485 tốc độ 9600-115200bps, 1 cổng Rnet, 1 cổng Act Net, 2 cổng USB, 6 ngõ vào đa dụng Universal Input, 1 ngõ ra đa dụng Universal Output, 5 ngõ ra số Rơ le Digital Output, bộ nhớ Flash 4GB, RAM 256MB, đồng hồ thời gian thực, vỏ nhựa ABS, điện áp 24V AC/DC, kích thước 19.7739x12.4308x5.0952cm, trọng lượng 0.82kg), phân loại vào nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.92; có hiệu lực từ ngày ký'
