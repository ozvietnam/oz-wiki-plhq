ghi_chu: 'Xác định trước mã số mặt hàng Bộ điều khiển phân tán OptiFlexTM Advanced Equipment Controller (ký, mã hiệu OFS561T-E2, nhà sản xuất Automated Logic; bộ điều khiển phân tán giám sát và điều khiển thiết bị hệ thống cơ điện tòa nhà giao tiếp mạng LAN Ethernet bằng giao thức BACnet/IP kết nối hệ thống tự động hóa tòa nhà WebCTRL; tích hợp 2 cổng Ethernet 10/100Mbps, 1 cổng EIA-485, 1 cổng Rnet, 1 cổng Act Net, 2 cổng USB, 6 ngõ vào đa dụng Universal Input, 1 ngõ ra đa dụng Universal Output, 5 ngõ ra số Rơ le Digital Output, bộ nhớ Flash 4GB, RAM 256MB, vỏ nhựa ABS, điện áp 24V AC/DC) thuộc nhóm 85.37, phân nhóm 8537.10, mã số 8537.10.92.'
