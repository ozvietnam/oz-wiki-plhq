xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu toàn văn thông báo chính thức của Cục Xuất nhập khẩu — Bộ Công Thương trên Cổng TTĐT Bộ Công Thương (moit.gov.vn, tiếp nhận ngày 02-11-2026): công văn số 910/SPS-BNNMT ngày 30-10-2026 của Văn phòng SPS Việt Nam (Bộ Nông nghiệp và Môi trường) thông tin quy định mới của Trung Quốc (Thông báo số 150 của Tổng cục Hải quan Trung Quốc GACC) đối với đăng ký doanh nghiệp xuất khẩu, nhập khẩu thực phẩm (đơn giản hóa mẫu đăng ký tại Phụ lục 1 từ 20 xuống 10 mục; thời hạn giải quyết 03 ngày làm việc theo Điều 6; nộp qua Cổng một cửa thương mại quốc tế hoặc Cổng dịch vụ công Hải quan Trung Quốc, công bố tại credit.customs.gov.cn; thời hạn thông báo thay đổi thông tin 60 ngày; các trường hợp hủy đăng ký theo Điều 8); đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
