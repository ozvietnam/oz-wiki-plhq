      noi_dung: 'Điều 3. Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định CPTPP giai đoạn 2022 - 2027 1. Ban hành kèm theo Nghị định này: a) Phụ lục I - Biểu thuế xuất khẩu ưu đãi của Việt Nam để thực hiện Hiệp định CPTPP.'
      trang_pdf: 2
