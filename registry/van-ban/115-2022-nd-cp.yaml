      noi_dung: Điều 4. Biểu thuế xuất khẩu ưu đãi của Việt Nam để thực hiện Hiệp định CPTPP 1. Biểu thuế xuất khẩu ưu đãi của Việt Nam để thực hiện Hiệp định CPTPP quy định tại Phụ lục I ban hành kèm theo Nghị định này gồm mã hàng, mô tả hàng hóa, thuế suất thuế xuất khẩu ưu đãi theo các giai đoạn khi xuất khẩu sang từng nước quy định tại điểm a khoản 5 Điều này đối với từng mã hàng.
      trang_pdf: 3
      sha256_pdf: 674ddf8bb88ee02ec8931574dcd64f6f35d70bcac14c303c4c310b6308f13ced
    - dieu: 5
      noi_dung: Điều 5. Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định CPTPP; Danh mục hàng hóa và thuế nhập khẩu ưu đãi đặc biệt đối với xe ô tô đã qua sử dụng áp dụng hạn ngạch thuế quan của Việt Nam để thực hiện Hiệp định CPTPP 1. Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định CPTPP quy định tại Phụ lục II ban hành kèm theo Nghị định này gồm mã hàng, mô tả hàng hóa, thuế suất thuế nhập khẩu ưu đãi đặc biệt
      trang_pdf: 5
      sha256_pdf: 674ddf8bb88ee02ec8931574dcd64f6f35d70bcac14c303c4c310b6308f13ced
    - dieu: 6
      noi_dung: 'Điều 6. Hàng hóa từ khu phi thuế quan của Việt Nam Hàng hóa từ khu phi thuế quan của Việt Nam nhập khẩu vào thị trường trong nước đáp ứng đủ các điều kiện quy định tại điểm a và điểm c khoản 7 Điều 5 Nghị định này được áp dụng thuế suất quy định tại Phụ lục II: 1. Từ ngày 30 tháng 12 năm 2022 đến ngày 31 tháng 12 năm 2022 tại cột có ký hiệu “(II)”. 2. Từ ngày 01 tháng 01 năm 2023 đến ngày 31 tháng 12 năm 2023 tại cột có ký hiệu “(III)”.'
      trang_pdf: 8
      sha256_pdf: 674ddf8bb88ee02ec8931574dcd64f6f35d70bcac14c303c4c310b6308f13ced
    - dieu: 7
      noi_dung: Điều 7. Hiệu lực thi hành 1. Nghị định này có hiệu lực từ ngày ký ban hành. 2. Nghị định số 57/2019/NĐ-CP ngày 26 tháng 6 năm 2019 ban hành Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt để thực hiện Hiệp định CPTPP giai đoạn 2019 - 2022 và Nghị định số 21/2022/NĐ-CP ngày 10 tháng 3 năm 2022 ngày sửa đổi, bổ sung một số điều của Nghị định số 57/2019/NĐ-CP hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành.
      trang_pdf: 8
      sha256_pdf: 674ddf8bb88ee02ec8931574dcd64f6f35d70bcac14c303c4c310b6308f13ced
    - dieu: 8
      noi_dung: Điều 8. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./.
