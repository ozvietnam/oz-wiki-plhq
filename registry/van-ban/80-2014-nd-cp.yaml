xac_minh:
  muc: NGUON_A
  pham_vi: 'Tên nguyên văn, cơ quan (CP, Thủ tướng Nguyễn Tấn Dũng ký), ngày ban hành 06/08/2014, ngày hiệu lực 01/01/2015 xác minh trực tiếp tại vanban.chinhphu.vn. Tình trạng còn hiệu lực và các văn bản sửa đổi bổ sung (NĐ 98/2019/NĐ-CP, NĐ 08/2022/NĐ-CP, NĐ 85/2024/NĐ-CP; văn bản hợp nhất 50/VBHN-BXD ngày 17/6/2026) theo nguồn thứ cấp (Thư viện Pháp luật, Luật Việt Nam) — chưa đối chiếu được trên vbpl.vn (trang tải bằng JS) và vanban.chinhphu.vn không hiển thị tình trạng.'
  hieu_luc_da_doi_chieu: false
  ngay: '2026-11-06'
  boi: zcode@ozvietnam
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. CẢNH BÁO DỮ LIỆU: số hiệu nghị định CP là duy nhất theo năm — bản 80/2014/NĐ-CP duy nhất là về thoát nước và xử lý nước thải, KHÔNG phải văn bản hướng dẫn Luật Thương mại về hàng hoá XNK như ghi chú kèm nhu cầu (ghi chú đó không kiểm chứng được). Nghị định hướng dẫn Luật Thương mại về hàng hoá XNK, đại lý mua, bán, gia công và chuyển giao hàng hoá quốc tế thường được nhắc là NĐ 187/2013/NĐ-CP — chưa kiểm chứng đợt này. Nội dung không điều chỉnh hoạt động XNK nên không gắn nhánh.'
