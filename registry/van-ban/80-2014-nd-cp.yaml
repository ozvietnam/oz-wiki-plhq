xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=175375, người ký Thủ tướng Nguyễn Tấn Dũng, tệp đính kèm 80nd.signed.pdf): Nghị định 80/2014/NĐ-CP của Chính phủ về thoát nước và xử lý nước thải, ban hành ngày 06-08-2014, có hiệu lực thi hành từ ngày 01-01-2015; đối chiếu đang còn hiệu lực (đã được sửa đổi, bổ sung một số điều bởi Nghị định 98/2019/NĐ-CP, Nghị định 08/2022/NĐ-CP, Nghị định 85/2024/NĐ-CP và hợp nhất tại Văn bản hợp nhất 50/VBHN-BXD ngày 17-06-2026; không có văn bản thay thế hoặc bãi bỏ toàn bộ trong sổ)'
