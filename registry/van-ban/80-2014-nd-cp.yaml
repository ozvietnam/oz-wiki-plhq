xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=175375, người ký Thủ tướng Nguyễn Tấn Dũng, tệp đính kèm 80nd.signed.pdf): Nghị định 80/2014/NĐ-CP của Chính phủ về thoát nước và xử lý nước thải, ban hành ngày 06-08-2014, có hiệu lực thi hành từ ngày 01-01-2015; đối chiếu đang còn hiệu lực (đã được sửa đổi, bổ sung một số điều bởi Nghị định 98/2019/NĐ-CP, Nghị định 08/2022/NĐ-CP, Nghị định 85/2024/NĐ-CP và hợp nhất tại Văn bản hợp nhất 50/VBHN-BXD ngày 17-06-2026; không có văn bản thay thế hoặc bãi bỏ toàn bộ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Nghị định này quy định về hoạt động thoát nước và xử lý nước thải tại các đô thị, các khu công nghiệp, khu kinh tê, khu chê xuất, khu công nghệ cao FAY) (sau day goi tat là khu công nghiệp), khu dân cư nông thôn tập trung; quyên. và nghĩa vụ của tổ chức, cá nhân và hộ gia đình có hoạt động liên quan đên thoát nước và xử lý nước thải trên lãnh thô Việt Nam.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Giải thíchtừngữ, ......-..-ằ 1. Hoạt động thoát nước và xử lý nước thải là các hoạt động về quy hoạch, thiết kế, đầu tư xây dựng, quản lý, vận hành hệ thông thoát nước. 2. Dịch vụ thoát nước và xử lý nước thải (gọi tắt là dịch vụ thoát nước) là các hoạt động về quản lý, vận hành hệ thống thoát nước nhằm đáp ứng yêu cầu thoát nước mưa, nước thải và xử lý nước thải theo các quy định của pháp luật.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Nguyên tác chung quản lý thoát nước và xử lý nước thải 1. Dịch vụ thoát nước đô thị, khu dân cư nông thôn tập trung là loại hình hoạt động công ích, được Nhà nước quan tâm, ưu tiên và khuyến khích đầu tư nhằm đáp ứng yêu cầu thoát nước và xử lý nước thải, bảo đảm phát triển bền vững. 3
      trang_pdf: 3
    - dieu: 10
      noi_dung: 'Điều 10. Chủ sở hữu công trình thoát nước 1. Ủy ban nhân dân cap tinh là chủ sở hữu hoặc ủy quyền, phân cấp cho Ủy ban nhân dân cấp huyện, cấp xã là chủ sở hữu đối với hệ thống thoát nước: a) Được đầu tư từ nguồn vốn ngân sách nhà nước; b)Nhận bàn giao lại từ các tổ chức kinh doanh, phát triển khu đô thị mới; c) Nhận bàn giao lại từ các tổ chức, cá nhân bỏ vốn đầu tư để kinh doanh khai thác công trình thoát nước có thời hạn.'
      trang_pdf: 8
    - dieu: 16
      noi_dung: 'Điều 16. Các tiêu chí lựa chọn công nghệ xử lý nước thải 1. Hiệu quả xử lý của công nghệ: Đảm bảo mức độ cần thiết làm sạch nước thải, có tính đến khả năng tự làm sạch của nguồn tiếp nhận. 2. Tiết kiệm đất xây dựng. 3. Quản lý, vận hành và bảo dưỡng phù hợp với năng lực trình độ quản lý, vận hành của địa phương. 4. Chi phi dau tu hợp lý trong đó tính đến cả sự phụ thuộc vào công nghệ nhập khâu.'
      trang_pdf: 10
    - dieu: 22
      noi_dung: 'Điều 22. Quản lý, vận hành hệ thống thoát nước thải 1. Quản lý, vận hành hệ thống thoát nước thải bao sồm, các nhà máy xử lý nước thải, trạm bơm, tuyến công áp lực, công trình đầu mối, điểm đấu nối, tuyến cống thu gom, chuyển tải dén nhà máy xử lý nước thải, các điểm xả.. phải tuân thủ các quy trình quản lý, vận hành đã được phê duyệt. 2. Nội dung quản lý, vận hành thoát nước thải bao gồm:'
      trang_pdf: 15
    - dieu: 29
      noi_dung: 'Điều 29. Quyền và nghĩa vụ của tổ chức, cá nhân và hộ gia đình sử dụng dịch vụ thoát nước 1. Tổ chức, cá nhân và hộ gia đình sử dụng dịch vụ thoát nước có các quyén sau đây:'
      trang_pdf: 19
    - dieu: 35
      noi_dung: Điều 35. Thỏa thuận và miễn trừ đấu nối 1. Thỏa thuận dau nối là văn bản thỏa thuận giữa đơn vị thoát nước và hộ thoát nước về vị trí đấu nối, các yêu cầu kỹ thuật của điểm đầu nối, thời điểm đấu nối, chất lượng, khối lượng nước thải xả vào điểm đấu nối. 22
      trang_pdf: 22
    - dieu: 41
      noi_dung: 'Điều 41. Trách nhiệm lập, thẩm quyền thâm định và phê duyệt giá dịch vụ thoát nước 1. Đối với hệ thống thoát nước được đầu tư từ ngân sách nhà nước: Sở Xây dựng chủ trì, phối hợp với các cơ quan | liên quan xây dựng phương án giá dịch vụ thoát nước, Sở Tài chính tổ chức thâm định trình Ủy ban nhân dân cấp tỉnh quyết định.'
      trang_pdf: 25
    - dieu: 48
      noi_dung: Điều 48. Hiệu lực thi hành Nghị định này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2015 và thay thế Nghị định số 88/2007/NĐ-CP ngày 28 tháng 5 năm 2007 của Chính phủ về thoát nước đố thị và khu công nghiệp Việt Nam. 28
      trang_pdf: 28
ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. CẢNH BÁO DỮ LIỆU: số hiệu nghị định CP là duy nhất theo năm — bản 80/2014/NĐ-CP duy nhất là về thoát nước và xử lý nước thải, KHÔNG phải văn bản hướng dẫn Luật Thương mại về hàng hoá XNK như ghi chú kèm nhu cầu (ghi chú đó không kiểm chứng được). Nghị định hướng dẫn Luật Thương mại về hàng hoá XNK, đại lý mua, bán, gia công và chuyển giao hàng hoá quốc tế thường được nhắc là NĐ 187/2013/NĐ-CP — chưa kiểm chứng đợt này. Nội dung không điều chỉnh hoạt động XNK nên không gắn nhánh.'
