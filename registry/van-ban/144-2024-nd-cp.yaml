  pham_vi: 'Đối chiếu toàn văn PDF Công báo số 1247 + 1248 ngày 14-11-2024 có lớp chữ (raw/download/congbaocdn.chinhphu.vn/144-2024-nd-cp.pdf, 9 trang, SHA-256 d2472a791e2bc2792ffe3a4aa3b2b43c92cf4fa612f73572cf155491b61e9faf), thẻ vanban.chinhphu.vn (docid=211569, Phó Thủ tướng Hồ Đức Phớc ký) và toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/144-2024-nd-cp.pdf, 2 Điều + Phụ lục I, II): Nghị định 144/2024/NĐ-CP ban hành 01-11-2024, có hiệu lực từ ngày 16-12-2024 theo khoản 1 Điều 2; đối chiếu đang còn hiệu lực, sửa đổi mức thuế suất thuế xuất khẩu (Phụ lục I: nhóm 31.02, 79.01, 80.01) và thuế nhập khẩu ưu đãi (Phụ lục II: nhóm 23.04, 24.04, 85.43, 87.01 và Chương 98 nhóm 98.45) quy định tại Điều 3 Nghị định 26/2023/NĐ-CP.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Sửa đổi mức thuế suất thuế xuất khẩu, mức thuế suất thuế nhập khẩu ưu đãi đối với một số mặt hàng quy định tại Phụ lục I - Biểu thuế xuất khẩu, Phụ lục II Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế quy định tại Điều 3 Nghị định số 26/2023/NĐ-CP ngày 31 tháng 5 năm 2023 của Chính phủ thành các mức thuế suất thuế xuất khẩu, mức thuế suất thuế nhập khẩu ưu đãi mới quy định tại Phụ lục I và Phụ lục II ban hành kèm theo Nghị định này.'
      trang_pdf: 2
      sha256_pdf: d2472a791e2bc2792ffe3a4aa3b2b43c92cf4fa612f73572cf155491b61e9faf
    - dieu: 2
      noi_dung: 'Điều 2. Điều khoản thi hành và tổ chức thực hiện 1. Nghị định này có hiệu lực từ ngày 16 tháng 12 năm 2024. 2. Thuế suất thuế nhập khẩu ưu đãi của các mặt hàng thuộc nhóm 24.04, các mặt hàng có mã HS 8543.40.00 thuộc Phụ lục II Biểu thuế nhập khẩu ưu đãi theo Danh mục mặt hàng chịu thuế ban hành kèm theo Nghị định này được áp dụng trong trường hợp các mặt hàng này được phép nhập khẩu vào Việt Nam theo quy định của pháp luật. 3. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
      trang_pdf: 2
      sha256_pdf: d2472a791e2bc2792ffe3a4aa3b2b43c92cf4fa612f73572cf155491b61e9faf
ghi_chu: 'Sửa đổi mức thuế suất thuế xuất khẩu (Phụ lục I: nhóm 31.02, 79.01, 80.01) và thuế nhập khẩu ưu đãi MFN (Phụ lục II: nhóm 23.04, 24.04, 85.43, 87.01 và Chương 98 nhóm 98.45) tại Điều 3 Nghị định 26/2023/NĐ-CP từ ngày 16-12-2024.'
