xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 241 + 242 ngày 02-02-2025 (raw/download/congbaocdn.chinhphu.vn/13-2025-nd-cp.pdf, 4 trang, trang 3–6 của số Công báo, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 10-03-2025, SHA-256 cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279), raw/download/congbao.chinhphu.vn/13-2025-nd-cp.html và trang wiki/sources/13-2025-nd-cp.md: Phó Thủ tướng Hồ Đức Phớc ký ban hành ngày 21-01-2025, có hiệu lực từ ngày ký (21-01-2025) đến hết ngày 31-12-2027, gồm 3 Điều sửa đổi Điều 4 và Điều 5 Nghị định 115/2022/NĐ-CP để bổ sung lộ trình thuế suất xuất khẩu ưu đãi và nhập khẩu ưu đãi đặc biệt CPTPP áp dụng đối với Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) từ ngày 15-12-2024.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      khoan: 1
      noi_dung: '1. Bổ sung khoản 4d vào sau khoản 4 Điều 4 như sau: “4d. Thuế suất áp dụng cho Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) giai đoạn 2024 - 2027 quy định tại Phụ lục I: a) Từ ngày 15 tháng 12 năm 2024 đến hết ngày 31 tháng 12 năm 2024 tại cột có ký hiệu “(IV)”. b) Từ ngày 01 tháng 01 năm 2025 đến hết ngày 31 tháng 12 năm 2025 tại cột có ký hiệu “(V)”. c) Từ ngày 01 tháng 01 năm 2026 đến hết ngày 31 tháng 12 năm 2026 tại cột có ký hiệu “(VI)”. d) Từ ngày 01 tháng 01 năm 2027 đến hết ngày 31 tháng 12 năm 2027 tại cột có ký hiệu “(VII)”.”'
      trang_pdf: 2
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 1
      khoan: 2
      noi_dung: '2. Sửa đổi, bổ sung điểm a khoản 5 Điều 4 như sau: “a) Được nhập khẩu vào lãnh thổ các nước theo quy định tại Hiệp định CPTPP, bao gồm: Ô-xtrây-li-a; Ca-na-đa; Nhật Bản; Liên bang Mê-hi-cô; Niu Di-lân; Cộng hòa Xinh-ga-po; Cộng hòa Pê-ru, Ma-lay-xi-a, Cộng hòa Chi Lê, Bru-nây Đa-rút-xa-lam, Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man).”'
      trang_pdf: 2
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 1
      khoan: 3
      noi_dung: '3. Bổ sung khoản 6d vào sau khoản 6 Điều 5 như sau: “6d. Thuế suất áp dụng cho Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) giai đoạn 2024 - 2027 quy định tại Phụ lục II: a) Từ ngày 15 tháng 12 năm 2024 đến hết ngày 31 tháng 12 năm 2024 tại cột có ký hiệu “(IV)”. b) Từ ngày 01 tháng 01 năm 2025 đến hết ngày 31 tháng 12 năm 2025 tại cột có ký hiệu “(V)”. c) Từ ngày 01 tháng 01 năm 2026 đến hết ngày 31 tháng 12 năm 2026 tại cột có ký hiệu “(VI)”. d) Từ ngày 01 tháng 01 năm 2027 đến hết ngày 31 tháng 12 năm 2027 tại cột có ký hiệu “(VII)”.”'
      trang_pdf: 3
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 1
      khoan: 4
      noi_dung: '4. Sửa đổi, bổ sung điểm b khoản 7 Điều 5 như sau: “b) Được nhập khẩu vào Việt Nam từ các nước thành viên của Hiệp định CPTPP, bao gồm: Ô-xtrây-li-a; Ca-na-đa; Nhật Bản; Liên bang Mê-hi-cô; Niu Di-lân; Cộng hòa Xinh-ga-po; Cộng hòa Pê-ru, Ma-lay-xi-a, Cộng hòa Chi Lê, Bru-nây Đa-rút-xa-lam, Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man).”'
      trang_pdf: 3
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 2
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày ký đến hết ngày 31 tháng 12 năm 2027. 2. Nghị định số 115/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ ban hành Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Toàn diện và Tiến bộ xuyên Thái Bình Dương giai đoạn 2022 - 2027, Nghị định số 68/2023/NĐ-CP ngày 07 tháng 9 năm 2023 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 115/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ ban hành Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Toàn diện và Tiến bộ xuyên Thái Bình Dương giai đoạn 2022 - 2027 có hiệu lực thi hành đến hết ngày 31 tháng 12 năm 2027.'
      trang_pdf: 3
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 2
      khoan: 3
      noi_dung: '3. Đối với các tờ khai hải quan của hàng hóa xuất khẩu từ Việt Nam vào Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) hoặc nhập khẩu vào Việt Nam từ Liên hiệp'
      trang_pdf: 3
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 2
      khoan: 3
      noi_dung: 'Vương quốc Anh và Bắc Ai-len (bao gồm cả 3 vùng lãnh thổ gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) đăng ký từ ngày 15 tháng 12 năm 2024 đến trước ngày Nghị định này có hiệu lực thi hành, nếu đáp ứng đủ các điều kiện để được hưởng thuế xuất khẩu ưu đãi, thuế nhập khẩu ưu đãi đặc biệt quy định tại Nghị định này, Nghị định số 115/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ ban hành Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt của Việt Nam để thực hiện Hiệp định Đối tác Toàn diện và Tiến bộ xuyên Thái Bình Dương giai đoạn 2022 - 2027 đã sửa đổi, bổ sung một số điều theo Nghị định số 68/2023/NĐ-CP ngày 07 tháng 9 năm 2023 của Chính phủ và đã nộp thuế theo mức thuế cao hơn thì được cơ quan hải quan xử lý tiền thuế nộp thừa theo quy định của pháp luật về quản lý thuế.'
      trang_pdf: 4
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
    - dieu: 3
      noi_dung: 'Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này./.'
      trang_pdf: 4
      sha256_pdf: cceccf893f93da3293beeba72cc871e296badfc35a3dedfff6e913fcca495279
ghi_chu: Sửa đổi Biểu thuế xuất khẩu ưu đãi, Biểu thuế nhập khẩu ưu đãi đặc biệt thực hiện Hiệp định CPTPP giai đoạn 2022-2027 để áp dụng cho Liên hiệp Vương quốc Anh và Bắc Ai-len (bao gồm Địa hạt Gu-en-xi, Địa hạt Giơ-xy và Đảo Man) từ ngày 15/12/2024, có quy định xử lý tiền thuế nộp thừa hồi tố cho tờ khai đăng ký từ 15/12/2024 đến trước 21/01/2025.
