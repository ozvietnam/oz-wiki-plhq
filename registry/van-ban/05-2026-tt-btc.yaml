xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=216772) và toàn văn PDF có chữ ký số của Bộ Tài chính (05-btc.pdf trên datafiles.chinhphu.vn, 2.371.158 byte, 7 trang, 3 chương, 17 điều): số ký hiệu 05/2026/TT-BTC, ngày ban hành 22-01-2026, người ký Thứ trưởng Đỗ Thành Trung, trích yếu nguyên văn "Quy định về phân cấp trong hoạt động kiểm tra chuyên ngành trong một số lĩnh vực của Bộ Tài chính". Theo khoản 1 Điều 17, Thông tư có hiệu lực thi hành kể từ ngày 22-01-2026; quy định phân cấp thẩm quyền kiểm tra chuyên ngành theo Nghị định 217/2025/NĐ-CP (Điều 4 phân cấp thẩm quyền trong lĩnh vực hải quan cho Cục trưởng Cục Hải quan và Chi cục trưởng Chi cục Hải quan khu vực); Điều 16 quy định chuyển tiếp đối với kế hoạch/quyết định kiểm tra đã phê duyệt trước đó; không sửa đổi, thay thế hay bãi bỏ văn bản nào trong sổ; đang còn hiệu lực.'
