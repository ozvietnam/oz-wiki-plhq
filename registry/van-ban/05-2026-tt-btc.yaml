xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=216772) và toàn văn PDF có chữ ký số của Bộ Tài chính (05-btc.pdf trên datafiles.chinhphu.vn, 2.371.158 byte, 7 trang, 3 chương, 17 điều): số ký hiệu 05/2026/TT-BTC, ngày ban hành 22-01-2026, người ký Thứ trưởng Đỗ Thành Trung, trích yếu nguyên văn "Quy định về phân cấp trong hoạt động kiểm tra chuyên ngành trong một số lĩnh vực của Bộ Tài chính". Theo khoản 1 Điều 17, Thông tư có hiệu lực thi hành kể từ ngày 22-01-2026; quy định phân cấp thẩm quyền kiểm tra chuyên ngành theo Nghị định 217/2025/NĐ-CP (Điều 4 phân cấp thẩm quyền trong lĩnh vực hải quan cho Cục trưởng Cục Hải quan và Chi cục trưởng Chi cục Hải quan khu vực); Điều 16 quy định chuyển tiếp đối với kế hoạch/quyết định kiểm tra đã phê duyệt trước đó; không sửa đổi, thay thế hay bãi bỏ văn bản nào trong sổ; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định việc phân cấp trong hoạt động kiểm tra chuyên ngành trong một số lĩnh vực của Bộ Tài chính, bao gồm: hải quan; chứng khoán; dự trữ quốc gia; bảo hiểm xã hội, bảo hiểm thất nghiệp, bảo hiểm y tế; quản lý tài sản công; kế toán, kiểm toán; phát triển doanh nghiệp tư nhân và kinh tế tập thể; kinh doanh bảo hiểm;'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng 1. Các đơn vị thuộc Bộ Tài chính, bao gồm: Cục Hải quan; Ủy ban Chứng khoán Nhà nước; Cục Dự trữ Nhà nước; Bảo hiểm xã hội Việt Nam; Cục Quản lý công sản; Cục Quản lý, giám sát kế toán, kiểm toán; Cục Phát triển doanh nghiệp tư nhân và kinh tế tập thể; Cục Quản lý, giám sát bảo hiểm; Cục Đầu tư nước ngoài; Cục Quản lý nợ và Kinh tế đối ngoại; Cục Quản lý đấu thầu.'
      trang_pdf: 2
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc phân cấp 1. Bảo đảm phù hợp với các quy định pháp luật về kiểm tra chuyên ngành, quy định pháp luật chuyên ngành trong từng lĩnh vực; phù hợp với mô hình tổ chức, tính chất hoạt động nghiệp vụ của các đơn vị được phân cấp.
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Phân cấp thấm quyền kiểm tra chuyên ngành trong lĩnh vực dự trữ quốc gia Cục trưởng Cục Dự trữ Nhà nước có thâm quyền: 1. Phê duyệt kế hoạch kiểm tra chuyên dé của Cục Dự trữ Nhà nước theo quy định tại khoản 2 Điều 7 Nghị định số 217/2025/NĐ-CP. 2. Thực hiện kiểm tra chuyên ngành trong lĩnh vực dự trữ quốc gia theo quy định tại khoản 1 Điều 6 Nghị định số 217/2025/NĐ-CP.'
      trang_pdf: 3
    - dieu: 7
      noi_dung: Điều 7. Phân cấp thẩm quyền kiểm tra chuyên ngành trong lĩnh vực bảo hiểm xã hội, bảo hiểm thất nghiệp, bảo hiểm y tế
      trang_pdf: 3
    - dieu: 9
      noi_dung: Điều 9. Phân cấp thầm quyền kiểm tra chuyên ngành trong lĩnh vực kế toán, kiểm toán Cục trưởng Cục Quản lý, giám sát kế toán, kiểm toán có thẩm quyền kiểm tra chuyên ngành trong lĩnh vực kế toán, kiểm toán theo quy định tại khoản 1 Điều 6 Nghị định số 217/2025/NĐ-CP.
      trang_pdf: 3
    - dieu: 11
      noi_dung: Điều 11. Phân cấp thắm quyền kiểm tra chuyên ngành trong lĩnh vực kinh doanh bảo hiểm Cục trưởng Cục Quản lý, giám sát bảo hiểm có thẩm quyền kiểm tra chuyên ngành trong lĩnh vực kinh doanh bảo hiểm theo quy định tại khoản | Điều 6 Nghị định số 217/2025/NĐ-CP đối với doanh nghiệp bảo hiểm, doanh nghiệp tái bảo hiểm, chỉ nhánh nước ngoài tại Việt Nam, tô chức tương hỗ cung cấp bảo hiểm vi mô, doanh nghiệp môi giới bảo hiểm, văn phòng đại diện
      trang_pdf: 4
    - dieu: 13
      noi_dung: Điều 13. Phân cấp thẫm quyền kiểm tra chuyên ngành trong lĩnh vực viện trợ của nước ngoài cho Việt Nam
      trang_pdf: 5
    - dieu: 14
      noi_dung: 'Điều 14. Phân cấp thẫm quyền kiểm tra chuyên ngành trong lĩnh vực đấu thầu, đầu tư theo phương thức đối tác công tư Cục trưởng Cục Quản lý đấu thầu có thẩm quyền kiểm tra chuyên ngành trong lĩnh vực đấu thâu, đầu tư theo phương thức đối tác công tư theo quy định tại khoản 1 Điều 6 Nghị định số 217/2025/NĐ-CP, cụ thể:'
      trang_pdf: 5
    - dieu: 17
      noi_dung: Điều 17. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành từ ngày 22 tháng 04 năm 2026. 2. Khi các văn bản dẫn chiếu dé áp dụng tại Thông tư này được sửa đôi, bd sung hoặc thay thế bằng văn bản mới thì áp dụng theo các văn bản sửa đôi, bổ sung hoặc thay thế. 3. Trong quá trình thực hiện nếu có khó khăn vướng mắc, đề nghị các cơ quan, đơn vị phản ánh về Bộ Tài chính (Vụ Pháp chế) dé nghiên cứu giải quyết.
      trang_pdf: 7
ghi_chu: 'Trinh sát đêm 16/11 phát hiện thiếu: nền phân cấp cho NĐ 217/2025 (đã có) — hải quan đầu mối duy nhất KTCN cửa khẩu.'
