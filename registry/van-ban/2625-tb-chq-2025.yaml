  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/24/VB_2625.pdf, id=99910, SHA-256 e387a264f260a8252bb522546cbd6d80650207aed2351888037eaac821bada71): Thông báo số 2625/TB-CHQ ngày 21-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Kính thư giãn PSiO (tên gọi theo cấu tạo, công dụng: Thiết bị tạo cảm giác dễ chịu cho mắt kết hợp với nghe nhạc thư giãn; ký, mã hiệu PsiO 3.0, nhà sản xuất PSYCHOMED.COM SA; làm bằng nhựa ABS gồm khung kính nhựa, tròng kính nhựa làm dịu ánh sáng, đèn LED RGB OSRAM LrTb G6TG gắn trên khung kính, bo mạch xử lý chơi nhạc MP3 bộ nhớ trong 1GB, bo mạch điều chỉnh đèn LED RGB, 2 tai nghe, pin 3.7V 2.59Wh 700mAh, kết nối cổng Micro USB, không có Bluetooth), phân loại vào nhóm 85.19, phân nhóm 8519.81, mã số 8519.81.99; có hiệu lực kể từ ngày ban hành'
