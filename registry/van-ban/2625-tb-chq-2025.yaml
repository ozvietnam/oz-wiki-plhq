ghi_chu: 'Xác định trước mã số mặt hàng Kính thư giãn PSiO (Thiết bị tạo cảm giác dễ chịu cho mắt kết hợp với nghe nhạc thư giãn; ký, mã hiệu PsiO 3.0, nhà sản xuất PSYCHOMED.COM SA; làm bằng nhựa ABS gồm khung kính nhựa, tròng kính làm dịu ánh sáng, đèn LED RGB OSRAM, bo mạch xử lý nhạc MP3 bộ nhớ trong 1GB, 2 tai nghe, pin 3.7V 700mAh, kết nối USB) thuộc nhóm 85.19, phân nhóm 8519.81, mã số 8519.81.99.'
