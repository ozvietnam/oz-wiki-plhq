xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/22/1.VB_20603.pdf, id=101094, SHA-256 bfde5dcb2c0e7b475f0ba73a262a63a9aa52fe7a7837f4694e644dec54bbfa19): Thông báo số 20603/TB-CHQ ngày 21-08-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module tấm tinh thể lỏng của màn hình LCD, dạng ô mở (Open Cell, ký mã hiệu 12NE007QS24001; kích thước màn hình 14.0 inch theo đường chéo, độ phân giải 1920(RGB) x 1200, độ tương phản 1500:1, dải màu 45%, kích thước tổng thể 306.19 x 218.08 x 1.033 mm, trọng lượng 80 gram/chiếc; cấu tạo gồm tinh thể lỏng liquid crystal, mạch Tcon, lớp kính nền TFT Glass dán ép với lớp kính lọc màu Color Filter Glass bằng keo quang học, phim phân cực Polarizer, vi mạch điều khiển Driver ICs gắn trên mạch in mềm FPCA, kết nối COF ép nhiệt lên viền cell và bảng mạch in PCBA chứa linh kiện điều khiển nhận tín hiệu, cấp nguồn; là module hiển thị sơ cấp không tự phát sáng, chưa có khối đèn nền Backlight, dùng để lắp ráp thêm với Backlight tạo thành module tấm màn hình hiển thị máy tính xách tay Notebook hoàn chỉnh), phân loại vào nhóm 85.24, mã số 8524.91.00; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Module tấm tinh thể lỏng của màn hình LCD 14.0 inch, dạng ô mở (Open Cell, ký mã hiệu 12NE007QS24001; độ phân giải 1920x1200, độ tương phản 1500:1, kích thước 306.19 x 218.08 x 1.033 mm, trọng lượng 80g; cấu tạo gồm tinh thể lỏng, mạch Tcon, TFT Glass, Color Filter Glass, Polarizer, Driver ICs, COF, FPCA, PCBA; chưa có khối đèn nền Backlight, dùng để lắp ráp màn hình hiển thị máy tính xách tay Notebook) thuộc nhóm 85.24, mã số 8524.91.00.'
