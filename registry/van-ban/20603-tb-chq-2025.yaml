ten: 'Thông báo về kết quả xác định trước mã số (Module tấm tinh thể lỏng của màn hình LCD 14 inch, dạng ô mở Open Cell chưa có đèn nền dùng lắp ráp màn hình máy tính xách tay, ký mã hiệu 12NE007QS24001, mã số 8524.91.00)'
