  pham_vi: "Đối chiếu thẻ vanban.chinhphu.vn (docid=174499, Thủ tướng Nguyễn Tấn Dũng ký), toàn văn PDF ký số (60-nd.signed.pdf) và cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/10123.htm): hiệu đính tên chính thức thành 'Quy định về hoạt động in' (bản ghi cũ ghi nhầm là sửa đổi NĐ 195/2013/NĐ-CP), ban hành ngày 19-06-2014, có hiệu lực thi hành từ ngày 01-11-2014 (thay thế Nghị định 105/2007/NĐ-CP và Nghị định 72/2011/NĐ-CP); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 25/2018/NĐ-CP từ 01-05-2018 và Nghị định 72/2022/NĐ-CP từ 01-01-2023)"
