xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=174499, Thủ tướng Nguyễn Tấn Dũng ký), toàn văn PDF ký số (60-nd.signed.pdf) và cổng Bộ KH&CN (mst.gov.vn/van-ban-phap-luat/10123.htm): hiệu đính tên chính thức thành ''Quy định về hoạt động in'' (bản ghi cũ ghi nhầm là sửa đổi NĐ 195/2013/NĐ-CP), ban hành ngày 19-06-2014, có hiệu lực thi hành từ ngày 01-11-2014 (thay thế Nghị định 105/2007/NĐ-CP và Nghị định 72/2011/NĐ-CP); đang còn hiệu lực (được sửa đổi, bổ sung một số điều bởi Nghị định 25/2018/NĐ-CP từ 01-05-2018 và Nghị định 72/2022/NĐ-CP từ 01-01-2023)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Nghị | định này quy định về hoạt động in bao gồm: Điều kiện hoạt động cơ sở in; chế bản, in, gia công sau in; sao chụp (sau đây gọi là photocopy); hợp tác của các cơ sở in dé ché bản, in, gia công sau in các sản phẩm in; nhập khẩu thiết bị ngành in. Hoạt động chế bản, in, gia công sau in đối với xuất bản phẩm thực hiện theo quy định của pháp luật về xuat ban.'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Nghị định này, các từ ngữ sau đây được hiểu như sau: 1. Chế ban là tạo ra bản phim, bản can, khuôn in để in hoặc bản mẫu dé photocopy. 2. In là sử dụng công nghệ, thiết bị dé tao ra sản phẩm in. 3. Gia công sau in là sử dụng công nghệ, thiết bị, công cụ, chuyên môn kỹ thuật để thực "hiện các công việc gia công tờ in thành sản phẩm in hoàn chỉnh theo bản mẫu.'
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Chính sách của Nhà nước đối với hoạt động in Hoạt động in là hoạt động sản xuất, , Kinh doanh có điều kiện. Nha nước có chính sách đối với hoạt động in, bao gồm: 1. Khuyến khích, ưu đãi đầu tư ứng dụng công nghệ, kỹ thuật, thiết bị in tiết kiệm năng lượng, nguyên liệu, sức lao động và thân thiện với môi trường; hạn chế sử dụng, không sản xuất và nhập khẩu thiết bị in có công nghệ lạc hậu, gây ô nhiễm môi trường.'
      trang_pdf: 2
    - dieu: 8
      noi_dung: Điều 8. Trách nhiệm thông tin, báo cáo 1. Cơ sở in, cơ sở dịch vụ photocopy. hoạt động theo loại hình doanh nghiệp hoặc đơn vị sự nghiệp công lập có trách nhiệm báo cáo định kỳ 0ó tháng/lần hoặc đột xuất khi có yêu cầu của cơ quan quản lý nhà nước về hoạt động m. 2, Cơ sở in, cơ sở dịch vụ photocopy hoạt động theo loại hình hộ kinh doanh có trách nhiệm báo cáo đột xuât khi có yêu câu của cơ quan quản lý nhà nước về hoạt động in.
      trang_pdf: 5
    - dieu: 12
      noi_dung: 'Điều 12. Cấp giấy phép hoạt động in 1. Trước khi hoạt động, cơ sở in thực hiện chế bản, in, gia công sau in các sản phẩm quy định tại các Điểm a, b, c và d Khoản 4 Điều 2 Nghị định này phải có hồ sơ đề nghị cấp giấy phép hoạt động in gửi đến cơ quan quản lý nhà nước theo quy định sau đây: a) Cơ sở in thuộc cơ quan, tổ chức ở Trung ương gửi hồ sơ qua dịch vụ bưu chính, chuyên phát hoặc nộp hồ sơ trực tiếp tại Bộ.Thông tin và Truyền thông:'
      trang_pdf: 8
    - dieu: 16
      noi_dung: 'Điều 16. Dieu kiện nhận che bản, in, gia công sau in 1. Có hợp đồng in theo quy định của pháp luật hoặc phiếu đặt in theo mẫu do Bộ trưởng Bộ Thông tin và Truyền thông quy định giữa. CƠ SỞ in VỚI cơ quan, tổ chức, cá nhân đặt chế bản, i in, gia công sau in (bao gồm việc tăng số lượng đối với từng sản phẩm in), cụ thể như sau: a) Đối với sản phẩm in quy định tại các Điều 17, 18, 19, 20 và 21 Nghị định này phải có hợp đồng in;'
      trang_pdf: 12
    - dieu: 19
      noi_dung: 'Điều 19. Nhận chế bán, in, gia công sau in hóa đơn tài chính, các loại thẻ, giấy tờ có sẵn mệnh giá hoặc dùng dé ghi mệnh giá Cơ sở in chỉ được nhận chế bản, in, gia công sau in khi tổ chức, cá nhân đặt in cung cap các loại giây tờ theo quy định sau đây:'
      trang_pdf: 13
    - dieu: 23
      noi_dung: 'Điều 23. Chế bản, in, gia công sau in cho nước ngoài 1. Cơ sở in chi được nhận chế bản, in, gia công sau In cho tổ chức, cá nhân nước ngoài loại sản phâm in phù hợp với nội dung ghi trong giây phép hoạt động in hoặc nội dung đã được xác nhận đăng ký hoạt động. 2. Các sản phẩm i in sau đây khi nhận chế bản, in, gia công sau in cho tổ chức, cá nhân nước ngoài phải được cơ quan quản lý nhà nước về hoạt động in cấp giấy phép:'
      trang_pdf: 14
    - dieu: 27
      noi_dung: 'Điều 27. Nhập khẫu thiết bị in 1. Thiết bị in sau đây khi nhập khẩu phải có giấy phép của Bộ Thông tin và Truyền thông: a) Máy chế bản ghi phim, ghi kẽm, tạo khuôn in; b) May in sử dụng công nghệ kỹ thuật số, ốp-xét (offset), flexo, ống dong; máy in lưới (lụa); c) May dao xén giấy, máy gấp sách, máy đóng sách (đóng thép hoặc khâu chỉ), máy vào bìa, máy ky mã liên hợp, dây chuyên liên hợp hoàn thiện san phẩm in;'
      trang_pdf: 17
    - dieu: 32
      noi_dung: Điều 32. Quy định chuyển tiếp .. 1. Chứng chỉ hoặc giấy chứng nhận về nghiệp vụ quản lý in đã cấp cho người đứng đầu cơ sở in trước ngày Nghị định này có hiệu lực thi bành được sử dụng dé làm thủ tục cấp, cấp lại giấy phép hoạt động in, đăng ký hoạt động cơ Sở in. '
      trang_pdf: 20
ghi_chu: Nghị định gốc quy định về hoạt động in (bao gồm nhập khẩu thiết bị in); được sửa đổi, bổ sung bởi NĐ 25/2018/NĐ-CP và NĐ 72/2022/NĐ-CP.
