  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này ban hành Danh mục và nguyên tắc áp dụng Danh mục chế phẩm diệt côn trùng, diệt khuẩn dùng trong lĩnh vực gia dụng và y té đã được xác định mã số HS theo Danh mục hàng hóa xuất khâu, nhập khâu Việt Nam.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Ban hành Danh mục Ban hành kèm theo Thông tư này Danh mục chế pham diệt côn trùng, diệt khuẩn dùng trong lĩnh vực gia dụng và y tế đã được xác định mã số HS theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam ban hành kèm theo Thông tư số 31/2022/TT-BTC ngày 08 tháng 6 năm 2022 của Bộ trưởng Bộ Tài chính về việc ban hành Danh mục hàng hóa xuất khâu, nhập khẩu Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc áp dụng Danh mục 1. Hàng hóa trong danh mục ban hành kèm theo Thông tư này được quản lý theo quy định tại Nghị định số 91/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ về quản lý hóa chất, chế phẩm diệt côn trùng, diệt khuẩn dùng trong lĩnh vực gia dụng và y tế.
      trang_pdf: 1
    - dieu: 4
      noi_dung: Điều 4. Điều khoản tham chiếu Trong trường hợp các văn bản quy phạm pháp luật và các quy định được viện dẫn trong Thông tư này có sự thay đối, bô sung hoặc được thay thé thì áp dung theo van ban quy phạm pháp luật mới.
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 15 tháng 11 năm 2024. 2. Thông tư sô 09/2018/TT-BYT ngày 27 tháng 4 năm 2018 Bộ trưởng Bộ Y tế ban hành Danh mục hóa chất, chế phẩm diệt côn trùng, diệt khuẩn dùng trong gia dụng và y tế thuộc lĩnh vực quản lý nhà nước của Bộ Y tế được xác định mã sô hàng hóa theo Danh mục hàng hóa xuất khâu, nhập khẩu Việt Nam hết hiệu lực kế từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 2
    - dieu: 6
      noi_dung: 'Điều 6. Trách nhiệm thi hành Cục trưởng Cục Quản lý Môi trường y tế, Thủ trưởng các đơn vị thuộc va trực thuộc Bộ Y tế; Sở Y tế các tỉnh, thành phô trực thuộc Trung ương và các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị cơ quan, tổ chức, cá nhân phan ánh về Bộ Y tế (Cục Quản lý Môi trường y tế) để xem xét, giải quyết./. #'
      trang_pdf: 2
