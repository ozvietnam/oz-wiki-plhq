ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị tạo chế độ rung Linear Vibrator (Động cơ điện xoay chiều tuyến tính có công suất không quá 37,5W; ký, mã hiệu GH31-00798A, nhà sản xuất Jahwa Vina; cấu tạo chính gồm vỏ, nam châm vĩnh cửu, khối nặng, vòng đệm, ống lót, yoke thép, cuộn dây đồng Coil, lò xo, miếng chặn trên/dưới và bản mạch FPCB; kích thước đường kính 6.0mm x dày 4.0mm, trọng lượng 0.668g, điện áp AC 1.8V - 70mA, tần số rung 209.5-210.5Hz, lắp trên thiết bị đeo tay thông minh để tạo chế độ rung theo phương thẳng đứng) thuộc nhóm 85.01, phân nhóm 8501.10, mã số 8501.10.99.'
