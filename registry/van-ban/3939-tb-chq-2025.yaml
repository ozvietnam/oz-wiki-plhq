xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/5/8/VB_3939.pdf, id=100008, SHA-256 88d7ba885293cb63bf22a6dcdeb6bfe85595d82622fe769a236410c5731e98fd): Thông báo số 3939/TB-CHQ ngày 06-05-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị tạo chế độ rung Linear Vibrator (tên gọi theo cấu tạo, công dụng: Động cơ điện xoay chiều có công suất không quá 37,5W; ký, mã hiệu GH31-00798A, nhà sản xuất Jahwa Vina; cấu tạo gồm vỏ bọc, nam châm vĩnh cửu, khối nặng, vòng đệm, ống lót, yoke thép, cuộn dây đồng Coil, lò xo, miếng chặn trên/dưới và bản mạch FPCB; tạo cơ năng chuyển động rung tuyến tính theo phương thẳng đứng dùng lắp trên thiết bị đeo tay thông minh; kích thước đường kính 6.0mm x dày 4.0mm, trọng lượng 0.668g, điện áp AC 1.8V - 70mA, điện trở 24+/-10% Ohm, tần số rung 209.5-210.5Hz), phân loại vào nhóm 85.01, phân nhóm 8501.10, mã số 8501.10.99; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
