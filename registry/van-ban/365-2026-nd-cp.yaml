  muc: NGUON_A
  pham_vi: 'Đã đối chiếu nguồn bậc A trên Hệ thống văn bản Chính phủ (vanban.chinhphu.vn, docid=219623) và toàn văn PDF có chữ ký số trên datafiles.chinhphu.vn (365_2026_nd-cp_23092026-signed.signed.pdf, 15.001.713 byte, gồm 22 trang nội dung 6 chương 28 điều và Phụ lục 11 mẫu biểu): số ký hiệu 365/2026/NĐ-CP, ngày ban hành 23-09-2026, người ký Phó Thủ tướng Phạm Gia Túc, trích yếu "Về kinh doanh xuất, nhập khẩu gạo" (trên trang cổng hai chữ "CP" trong ký hiệu bị gõ bằng chữ Kirin U+0421, U+0420 nhưng bản gốc PDF in đúng chữ Latin 365/2026/NĐ-CP). Theo Điều 27 (Hiệu lực thi hành, trang 21): (1) Nghị định có hiệu lực thi hành từ ngày 01-10-2026 (riêng đánh giá mức độ tín nhiệm thương nhân xuất khẩu gạo tại Điều 14 thực hiện từ ngày 01-01-2028 theo khoản 3 Điều 26); (2) bãi bỏ Nghị định 107/2018/NĐ-CP ngày 15-08-2018 của Chính phủ về kinh doanh xuất khẩu gạo và Nghị định 01/2025/NĐ-CP ngày 01-01-2025 sửa đổi, bổ sung một số điều của Nghị định 107/2018/NĐ-CP; (3) bãi bỏ khoản 2 Điều 27 Nghị định 85/2024/NĐ-CP ngày 10-07-2024 quy định chi tiết một số điều của Luật Giá (cả 3 văn bản bị bãi bỏ hiện chưa nạp trong sổ nên không khai cạnh quan_he để tránh sinh điểm mù THIEU_VAN_BAN). Đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-18'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về kinh doanh xuất, nhập khẩu thóc, gạo các loại (sau đây gọi chung là gạo). 2. Hoạt động tạm nhập tái xuất, tạm xuất tái nhập, chuyền khẩu, quá cảnh, gia công gạo cho nước ngoài; hoạt động xuất khâu không vì mục đích thương mại, viện trợ, biếu, tặng gạo không thuộc phạm vi điều chỉnh của Nghị định này.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với thương nhân theo quy định của Luật Thương mại; các cơ quan, tô chức có trách nhiệm trong quản lý, điều hành xuắt, nhập khâu gạo và các tổ chức, cá nhân khác có liên quan.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Quyền kinh doanh xuất, nhập khẩu gạo 1. Thương nhân Việt Nam thuộc mọi thành phần kinh tế, néu đáp ứng đủ điều kiện quy định tại Điều 4 Nghị định này và được cấp Giấy chứng nhận đủ điều kiện kinh doanh xuất khâu gao (sau đây viết tắt là Giấy chứng nhận), có quyền được kinh doanh xuất khẩu gạo theo quy định tại Nghị định này và các quy định khác của pháp luật có liên quan.
      trang_pdf: 1
    - dieu: 7
      noi_dung: 'Điều 7. Cấp lại, sửa déi, bé sung Giấy chứng nhận 1. Bộ Công Thương xem xét cấp lại Giấy chứng nhận trong các trường hợp Giấy chứng nhận bị thất lạc, bị hư hỏng hoặc bị tiêu huỷ. Thương nhân gửi Đơn đề nghị theo Mẫu só 03 quy định tại Phụ lục kèm theo Nghị định này để được xem xét, cấp lại Giấy chứng nhận: 01 bản chính. 2. Bộ Công Thương xem xét sửa đổi, bổ sung Giấy chứng nhận trong các trường hợp có sự thay đổi nội dung Giấy chứng nhận.'
      trang_pdf: 4
    - dieu: 10
      noi_dung: 'Điều 10. Mục tiêu, nguyên tắc điều hành xuất khẩu gạo Việc điều hành xuất khẩu gạo phải đảm bảo các mục tiêu, nguyên tắc sau: 1. Góp phần tiêu thụ thóc, gạo hàng hoá và bảo đảm lợi ích người trồng lúa theo chính sách hiện hành. 2. Bao đảm cân đối xuất khẩu và tiêu dùng nội địa; góp phần bình 6n giá thóc, gạo trong nước. 3. Thực hiện các cam kết quốc tế; bảo đảm xuất khẩu có hiệu quả.'
      trang_pdf: 7
    - dieu: 13
      noi_dung: Điều 13. Mua thóc, gạo hàng hoá xuất khẩu 1. Thương nhân kinh doanh xuất khẩu gạo có trách nhiệm thông báo với Ủy ban nhân dân cấp tỉnh các điểm mua thóc, gạo và công bố các điểm mua, niêm yết giá mua theo chất lượng, chủng loại thóc, gạo hàng hoá và mùa vụ thu hoạch dé người nông dân biết và trực tiếp giao dịch.
      trang_pdf: 8
    - dieu: 17
      noi_dung: Điều 17. Đảm bảo chất lượng thóc, gạo hàng hóa xuất khẩu 1. Gạo xuất khẩu phải bảo đảm phủ hợp với tiêu chuẩn, quy chuẩn kỹ thuật quốc gia tương ứng và đáp ứng yêu câu về chất lượng, bao bì, ghi nhãn, đóng gói, bao quản, truy xuât nguôn gôc theo quy định của nước nhập. khẩu; trừ trường hợp nhà nhập khẩu có yêu cầu khác thì thực hiện theo yêu câu của nhà nhập khẩu.
      trang_pdf: 10
    - dieu: 20
      noi_dung: Điều 20. Thống kê, khai thác thông tin, dữ liệu và chế độ báo cáo số liệu thống kê hợp đồng xuất khẩu và thực hiện hợp đồng xuất khẩu gạo 1. Bộ Công Thương chủ trì, phối hợp với Bộ Tài chính và cơ quan liên quan thống nhất nội dung thông tin, dữ liệu thông báo hợp đồng xuất khẩu gạo và cơ chế hồi báo thông tin về tình hình thực hiện giao hàng theo hợp đồng đã thông báo dé phục vụ công tác điều hành xuất khẩu gạo.
      trang_pdf: 13
    - dieu: 23
      noi_dung: 'Điều 23. Trách nhiệm của các bộ, ngành, Ủy ban nhân dân cấp tỉnh Ngoài trách nhiệm được quy định tại Nghị định này và các quy định khác của pháp luật hiện hành, các bộ, ngành, Ủy ban nhân dân cấp tỉnh: Công Thương, Nông nghiệp và Môi trường, Tài chính, Ngân hàng Nhà nước Việt Nam và Ủy ban nhân dân cấp tỉnh có liên quan còn có trách nhiệm sau:'
      trang_pdf: 14
    - dieu: 27
      noi_dung: Điều 27. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 10 năm 2026. 2. Bãi bỏ Nghị định số 107/2018/NĐ-CP ngày 15 tháng 8 năm 2018 của Chính phủ về kinh doanh xuất khâu gạo và Nghị định số 01/2025/NĐ-CP ngày 01 tháng 01 năm 2025 của Chính phủ sửa đồi, bổ sung một số điều của Nghị định sô 107/2018/NĐ-CP.
      trang_pdf: 21
ghi_chu: Trinh sát WebSearch trạm CP đêm 1/11. Điều kiện kinh doanh xuất, nhập khẩu gạo — có hiệu lực từ 01-10-2026, bãi bỏ toàn bộ NĐ 107/2018/NĐ-CP, NĐ 01/2025/NĐ-CP và khoản 2 Điều 27 NĐ 85/2024/NĐ-CP (khoản 2, 3 Điều 27).
