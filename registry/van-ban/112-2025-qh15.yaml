  pham_vi: 'Đối chiếu Cổng TTĐT Chính phủ (vanban.chinhphu.vn docid=216547, 112-qh15-2025.signed.pdf 52 trang, Chủ tịch Quốc hội Trần Thanh Mẫn ký thông qua ngày 10-12-2025) và CSDLQG về VBPL (vbpl.vn ItemID=0d02e820-58e7-11f1-97ef-cda804c15594): Điều 57 quy định có hiệu lực từ 01-03-2026 (riêng Điều 48 và Điều 56 có hiệu lực từ ngày thông qua), thay thế Luật Quy hoạch số 21/2017/QH14 (chưa ghi quan_he thay thế vì Luật 21/2017/QH14 chưa có trong sổ); đang còn hiệu lực.'
