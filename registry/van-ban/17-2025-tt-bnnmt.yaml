  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=214091) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (17-bnnmt.pdf): ban hành ngày 19-06-2025, có hiệu lực thi hành từ ngày 01-07-2025; đang còn hiệu lực.'
