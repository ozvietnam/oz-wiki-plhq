  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về phân cấp quản lý nhà nước trong lĩnh vực quản lý chất lượng nông lâm sản và thủy sản bao gồm: 1. Quy định chi tiết, hướng dẫn thi hành Nghị định số 136/2025/NĐ-CP ngày 12 tháng 6 năm 2025 của Chính phủ quy định phân quyền, phân cấp trong lĩnh vực nông nghiệp và môi trường. 2. Sửa đổi, bổ sung một số điều của các văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Bộ trưởng Bộ Nông nghiệp và Môi trường để thực hiện phân cấp quản lý nhà nước trong lĩnh vực quản lý chất lượng nông lâm sản và thủy sản.'
      trang_pdf: 1
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với các cơ quan hành chính nhà nước ở trung ương, chính quyền địa phương và các tổ chức, cá nhân có liên quan hoạt động trong lĩnh vực quản lý chất lượng nông lâm sản và thủy sản.'
      trang_pdf: 1
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 3
      khoan: 1
      noi_dung: '1. Hồ sơ xin cấp Giấy chứng nhận cơ sở đủ điều kiện an toàn thực phẩm đối với cơ sở sản xuất, kinh doanh thực phẩm nông, lâm, thủy sản được quy định tại khoản 1 Điều 36 Luật An toàn thực phẩm, cụ thể như sau: a) Đơn đề nghị cấp Giấy chứng nhận cơ sở đủ điều kiện an toàn thực phẩm theo mẫu tại Phụ lục I ban hành kèm theo Thông tư này; b) Bản sao Giấy chứng nhận đăng ký kinh doanh; c) Bản thuyết minh về cơ sở vật chất, trang thiết bị, dụng cụ bảo đảm điều kiện vệ sinh an toàn thực phẩm theo mẫu tại Phụ lục II ban hành kèm theo Thông tư này; d) Giấy xác nhận đủ sức khỏe của chủ cơ sở và người trực tiếp sản xuất, kinh doanh thực phẩm do cơ sở khám bệnh, chữa bệnh đủ điều kiện cấp; đ) Giấy xác nhận đã được tập huấn kiến thức về an toàn vệ sinh thực phẩm của chủ cơ sở và của người trực tiếp sản xuất, kinh doanh thực phẩm theo quy định.'
      trang_pdf: 2
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 4
      khoan: 2
      noi_dung: '2. Trình tự, thủ tục: Theo quy định tại mục 1 Phụ lục VI Nghị định số 136/2025/NĐ-CP ngày 12/6/2025 của Chính phủ quy định phân quyền, phân cấp trong lĩnh vực nông nghiệp và môi trường.'
      trang_pdf: 4
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 5
      noi_dung: 'Điều 5. Sửa đổi, bổ sung/cấp lại Giấy chứng nhận lưu hành tự do (CFS) đối với hàng hóa xuất khẩu thuộc phạm vi quản lý của Bộ Nông nghiệp và Môi trường 1. Hồ sơ đề nghị sửa đổi, bổ sung/cấp lại Giấy chứng nhận lưu hành tự do (CFS) đối với hàng hóa xuất khẩu thuộc phạm vi quản lý của Bộ Nông nghiệp và Môi trường được quy định tại điểm e khoản 3 Điều 11 Nghị định số 69/2018/NĐCP ngày 15/5/2018 của Chính phủ quy định chi tiết một số Điều của Luật Quản lý ngoại thương, cụ thể như sau: a) Văn bản đề nghị sửa đổi, bổ sung/cấp lại CFS của thương nhân: 01 (một) bản chính; b) Các giấy tờ liên quan đến việc sửa đổi, bổ sung/cấp lại CFS. 2. Trình tự, thủ tục: Theo quy định tại mục 2 Phụ lục VI Nghị định số 136/2025/NĐ-CP ngày 12/6/2025 của Chính phủ quy định phân quyền, phân cấp trong lĩnh vực nông nghiệp và môi trường.'
      trang_pdf: 4
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 12
      khoan: 1
      noi_dung: '1. Sửa đổi, bổ sung khoản 1 Điều 1 Thông tư số 48/2013/TT-BNNPTNT được sửa đổi bởi khoản 2 Điều 2 Thông tư số 17/2024/TT-BNNPTNT như sau: “1. Hồ sơ, thủ tục, thẩm quyền cấp chứng nhận an toàn thực phẩm, chứng nhận kiểm dịch hoặc giấy chứng nhận khác có liên quan đối với lô hàng thực phẩm thuỷ sản, thực phẩm phối chế, hỗn hợp nhiều thành phần đăng ký xuất khẩu vào các quốc gia, vùng lãnh thổ có yêu cầu Cơ quan thẩm quyền Việt Nam lập, đăng ký, bổ sung danh sách cơ sở được phép xuất khẩu (sau đây gọi tắt là Danh sách xuất khẩu).”'
      trang_pdf: 12
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 12
      khoan: 3
      noi_dung: '3. Sửa đổi, bổ sung khoản 1 Điều 5 Thông tư số 48/2013/TT-BNNPTNT được sửa đổi bởi khoản 6 Điều 2 Thông tư số 17/2024/TT-BNNPTNT như sau: “1. Cơ quan lập, đăng ký, bổ sung Danh sách xuất khẩu (sau đây gọi là Cơ quan thẩm quyền) là: Cục Chất lượng, Chế biến và Phát triển thị trường và các Chi cục trực thuộc được phân công thực hiện theo khu vực (Chi cục Chất lượng, Chế biến và Phát triển thị trường khu vực Trung Bộ, Chi cục Chất lượng, Chế biến và Phát triển thị trường khu vực Nam Bộ)”'
      trang_pdf: 13
      sha256_pdf: 3f26d40de8a3cbea34f8f415766c401d7c1166169671d116ab0812b51dafbeb4
    - dieu: 13
      noi_dung: 'Điều 13. Hiệu lực thi hành Thông tư này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.'
      trang_pdf: 13
