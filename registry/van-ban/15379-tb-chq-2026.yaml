ghi_chu: 'Xác định trước mã số mặt hàng Máy tiêm gia cầm tự động 4 chức năng Yiyishenghui Integrated Immunization Machine HS-MY4 (ký, mã hiệu HS-MY4; tích hợp tiêm dưới da, tiêm cơ, chích màng cánh và nhỏ mắt/mũi kèm màn hình cảm ứng, bộ điều khiển điện tử; công suất 70 W, điện áp 220 V, trọng lượng 10 kg, dùng tiêm chủng gia cầm từ 3 ngày tuổi) thuộc nhóm 90.18, phân nhóm 9018.90, mã số 9018.90.39.'
