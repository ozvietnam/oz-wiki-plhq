  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/20/3.VB_15379.pdf, id=103277, SHA-256 908c0c17a2af57628113220d496c37ad06980442131605e5450b5904a1517536): Thông báo số 15379/TB-CHQ ngày 17-04-2026 của Cục Hải quan (trên danh mục Cổng Hải quan ghi số hiệu 15379/15379) về kết quả xác định trước mã số đối với mặt hàng Máy tiêm gà tự động / Máy tiêm gia cầm tự động 4 chức năng Yiyishenghui Integrated Immunization Machine HS-MY4 (ký, mã hiệu HS-MY4; phiên bản 4 trong 1 gồm cụm tiêm dưới da, cụm tiêm cơ nghiêng 70-80°, cụm chích màng cánh 0,001-0,09 ml và cụm nhỏ mắt/mũi 0,01-0,09 ml; kết cấu hình hộp đứng gồm khoang máy phía trên có màn hình cảm ứng, bộ điều khiển, tủ điện, hệ thống truyền động và khung đỡ thép không gỉ phía dưới; công suất 70 W, nguồn điện 220 V, kích thước thân máy 25x35x28,5 cm, trọng lượng 10 kg; dùng tiêm chủng cho gia cầm từ 3 ngày tuổi trở lên), phân loại vào nhóm 90.18, phân nhóm 9018.90, mã số 9018.90.39; có hiệu lực từ ngày ký'
