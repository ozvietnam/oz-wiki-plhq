  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/15/28.VBDI_23956.pdf, id=101318, SHA-256 5a00182d10397beeafb776b51c709c15ff10c04cb75dcd6faf6c2eda2e1c4fb4): Thông báo số 23956/TB-CHQ ngày 12-09-2025 của Cục Hải quan về sửa đổi, thay thế Thông báo kết quả xác định trước mã số số 4967/TB-TCHQ ngày 14-10-2024; mặt hàng CARRY ALL 500 (ELECTRICAL UTILITY VEHICLE) — xe chở hàng 4 bánh hiệu Club Car, có mui, 2 chỗ ngồi (kể cả lái xe), động cơ điện DC 48V, trọng lượng toàn bộ 632 kg, thùng hàng tối đa 363 kg, dùng trong nhà kho sân gôn, không tham gia giao thông (ký mã hiệu CARRYALL 500 ELEC, nhà sản xuất Club Car Jiaxing), phân loại vào nhóm 87.04, phân nhóm 8704.60, mã số 8704.60.29; lý do sửa đổi: xác định lại mã số hàng hóa; có hiệu lực kể từ ngày ban hành'
