  pham_vi: số hiệu, trích yếu, ngày ban hành 09-03-2017, hiệu lực 25-04-2017 trên Công báo số 197+198/2017 (congbao.chinhphu.vn); còn hiệu lực
  hieu_luc_da_doi_chieu: true
