      noi_dung: 'Điều 1. Phê duyệt Kế hoạch hành động thúc đây Cơ chế một cửa quốc gia, Cơ chế một cửa ASEAN, cải cách công tác kiểm tra chuyên ngành đối với hàng hóa xuất khẩu, nhập khẩu và tạo thuận lợi thương mại giai đoạn 2018 - 2020 với những nội dung chủ yếu sau đây:'
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Tô chức thực hiện 1. Ủy ban chỉ đạo quốc gia về Cơ chế một cửa ASEAN, Cơ chế một cửa quốc gia và tạo thuận lợi thương mai (sau day goi tat la Uy ban 1899) chi dao, hướng dẫn, kiểm tra, giám sát việc tổ chức thực hiện Quyết định này; định kỳ 06 tháng và hàng năm, báo cáo Thủ tướng Chính phủ tình hình, kết quả thực hiện Kế hoạch. 2. Các bộ, cơ quan thuộc Ủy ban 1899:'
      trang_pdf: 9
    - dieu: 3
      noi_dung: Điều 3. Quyết định này có hiệu lực thi hành kể từ ngày ký. lãi
      trang_pdf: 11
    - dieu: 4
      noi_dung: Điều 4. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và Thủ, trưởng các đơn vị có liên n quan chịu trách nhiệm thi hành Quyết định này./ - Thủ tướng, các Phó Thủ tướng Chính phủ; - Các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ; - HĐND, UBND các tỉnh, thành phố trực thuộc trung ương; - Văn phòng Trung ương và các Ban của Đảng;
      trang_pdf: 12
ghi_chu: Quyết định cá biệt phê duyệt Kế hoạch hành động NSW/ASW và cải cách kiểm tra chuyên ngành giai đoạn 2018–2020 (đặt lộ trình ban hành NĐ 85/2019/NĐ-CP). Được sửa đổi, bổ sung một số nội dung và phụ lục bởi Quyết định 1258/QĐ-TTg ngày 18-08-2020 (docid=200776).
