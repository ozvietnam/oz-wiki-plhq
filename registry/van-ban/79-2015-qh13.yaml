  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Pham vi điều chỉnh Luật này quy định về phòng bệnh, chữa bệnh, chồng dịch bệnh động vat; kiểm dich động vật, sản phẩm động vật; kiểm soát giết mỗ động vật, sơ chế, chế biến động vật, sản phẩm động vật; kiểm tra vệ sinh thú y; quản lý thuốc thú y; hành nghề thú y.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Luật này áp dụng đối với tổ chức, cá nhân trong nước và tổ chức, cá nhân nước ngoài có liên quan dén hoạt động thú y tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Động vật bao gồm: a) Động vật trên cạn là các loài gia súc, gia cầm, động vật hoang dã, bò sát, ong, tằm và một số loài động vật khác sống trên cạn; b) Động vật thủy sản là các loài cá, giáp xác, động vat thân mềm, lưỡng cư, động vật có vú và một số loài động vật khác sống dưới nước. 2. Sản phẩm động vật là các loại sản phẩm có nguồn gốc từ động vật, bao gồm:'
      trang_pdf: 1
    - dieu: 20
      noi_dung: Điều 20. Chữa bệnh động vật 1. Động vật có dấu hiệu mắc bệnh phải được chân đoán, cách ly, chăm sóc, chữa bệnh kịp thời, trừ trường hợp cấm chữa bệnh hoặc phải giết mé, tiêu hủy bắt buộc theo quy định của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn.
      trang_pdf: 16
    - dieu: 35
      noi_dung: 'Điều 35. Tố chức chống dịch bệnh động vật thủy sản trong vùng có dich 1. Khi công bố dịch, người có thẩm quyền công bố địch bệnh động vật thủy sản chỉ đạo các cơ quan, ban, ngành, tổ chức, cá nhân có liên quan thực hiện các biện pháp sau đây: a) Xác định giới hạn vùng có dịch; đặt biển báo, hướng dẫn việc đi lại, vận chuyên động vật, sản phẩm động vật thủy sản đi qua vùng có dịch;'
      trang_pdf: 29
    - dieu: 51
      noi_dung: 'Điều 51. Yêu cầu đối với động vat trên cạn tham gia hội chợ; triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản pham động vật trên cạn tham gia hội chợ, triển lãm 1. Động vật tham gia hội chợ, triển lãm, thi đấu thé thao, biểu diễn nghệ thuật; sản phầm động vật trên cạn tham gia hội chợ, triển lam phải bảo đảm các quy định sau đây: a) Có nguồn gốc rõ ràng, không mang mam bệnh;'
      trang_pdf: 40
    - dieu: 66
      noi_dung: Điều 66. Yêu cầu vệ sinh thú y đếi với sơ chế, chế biến động vật, sản phẩm động vật 1. Việc kiểm tra vệ sinh thú y phải được cơ quan quản lý chuyên ngành thú y thực hiện trong quá trình sơ chế, chế biến động vật, sản phâm động vật. __2. Cơ sở sơ chế, chế biến động vật, sản phẩm động vật phải bảo dam yêu cầu vệ sinh thú y quy định tại khoản 3 và khoản 4 Điêu 69 của Luật này và pháp luật về an toàn thực phầm.
      trang_pdf: 48
    - dieu: 83
      noi_dung: 'Điều 83. Thu hồi GiẤy chứng nhận lưu hành thuốc thú y 1. Giấy chứng nhận lưu hành thuốc thú y bị thu hồi trong các trường hợp sau đây: a) BỊ tây xóa, sửa chữa nội dung; b) Phát hiện tài liệu, giấy tờ giả, thông tin không trung thực trong hồ sơ đăng ký lưu hành đã được xét duyệt; c) Thuốc thú y bị cắm lưu hành tại Việt Nam; d) Có bằng chứng khoa học về thuốc thú y gây ảnh hưởng xấu đến sức khỏe con người, động vật và môi trường;'
      trang_pdf: 56
    - dieu: 98
      noi_dung: 'Điều 98. Trình tự, thủ tục cấp, cấp lại, thu hồi Giấy chứng nhận đủ điều kiện nhập khẩu thuốc thứ y 1. Hồ sơ đăng ky cấp Giấy chứng nhận đủ điều kiện nhập khẩu thuốc thú y bao gôm: a) Đơn đăng ký; b) Bản thuyết minh chỉ tiết về cơ sở vật chất, kỹ thuật; c) Giấy chứng nhận đăng ký doanh nghiệp hoặc Giấy chứng nhận đăng ký kinh doanh; d) Chứng chỉ hành nghề thú y. 2. Trình tự, thủ tục cấp Giấy chứng nhận đủ điều kiện nhập khẩu thuốc thú y:'
      trang_pdf: 64
    - dieu: 115
      noi_dung: Điều 115. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2016. 2. Pháp lệnh thú y số 18/2004/PL-UBTVQHI0 hết hiệu lực kể từ ngày Tmật này có hiệu lực thi hành. 3. Các loại giấy phép, giấy chứng nhận, chứng chỉ trong lĩnh vực thú y đã được cấp trước ngày Luật này có hiệu lực mà chưa hết thời hạn thì vẫn có giá trị sử dụng cho đến khi hết thời hạn.
      trang_pdf: 72
