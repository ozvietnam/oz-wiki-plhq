xac_minh:
  muc: NGUON_A
  pham_vi: 'tình trạng hiện tại: Điều 1–7 TT 07/2026/TT-BCT (PDF Công báo số 147, lớp chữ) sửa đổi Điều 6–10, bãi bỏ Điều 11 và thay Phụ lục I–II từ 10-04-2026 — còn hiệu lực một phần; ngày bắt đầu trên sổ (20-02-2014) chưa đọc lại điều khoản thi hành của chính TT 37 trên PDF Công báo/datafiles (chưa tìm thấy tệp ổn định)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-10-04'
  boi: cursor-agent@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Thông tư này quy định hoạt động nhập khẩu thuốc lá điếu, xì gà. 2. Thông tư này không áp dụng đối với: a) Nhập khẩu thuốc lá điếu, xì gà để kinh doanh tại cửa hàng miễn thuế; b) Nhập khẩu thuốc lá điếu, xì gà làm hàng mẫu để nghiên cứu, sản xuất thử và tạm nhập, tái xuất để làm hàng mẫu tham dự hội chợ, triển lãm; thuốc lá điếu, xì gà của cá nhân nhập cảnh trong mức tiêu chuẩn theo quy định của Chính phủ;'
      trang_pdf: 1
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với thương nhân nhập khẩu thuốc lá điếu, xì gà, các tổ chức và cá nhân có liên quan đến hoạt động nhập khẩu thuốc lá điếu, xì gà.
      trang_pdf: 1
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 3
      noi_dung: Điều 3. Giải thích từ ngữ “Thuốc lá điếu, xì gà” là sản phẩm thuốc lá được sản xuất từ toàn bộ hoặc một phần nguyên liệu thuốc lá và được dùng để hút.
      trang_pdf: 1
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 4
      noi_dung: Điều 4. Danh mục thuốc lá điếu, xì gà nhập khẩu Danh mục thuốc lá điếu, xì gà nhập khẩu quy định tại Phụ lục I ban hành kèm theo Thông tư này.
      trang_pdf: 2
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 5
      noi_dung: Điều 5. Nguyên tắc quản lý 1. Sản phẩm thuốc lá, trong đó có thuốc lá điếu, xì gà là mặt hàng không khuyến khích tiêu dùng theo Công ước khung về kiểm soát thuốc lá (FCTC) của Tổ chức Y tế Thế giới (WHO) mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. Nhà nước thống nhất quản lý nhập khẩu thuốc lá điếu, xì gà phù hợp với cam kết về việc Việt Nam gia nhập Tổ chức Thương mại Thế giới (WTO).
      trang_pdf: 2
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 6
      noi_dung: Điều 6. Chỉ định thương nhân nhập khẩu Bộ Công Thương chỉ định Tổng công ty Thuốc lá Việt Nam (VINATABA) là thương nhân nhập khẩu thuốc lá điếu, xì gà theo cơ chế thương mại nhà nước.
      trang_pdf: 2
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 7
      noi_dung: Điều 7. Yêu cầu đối với thuốc lá điếu, xì gà nhập khẩu 1. Thuốc lá điếu, xì gà nhập khẩu và lưu thông trên thị trường phải được đăng ký bảo hộ quyền sử dụng nhãn hiệu hàng hóa tại Việt Nam; phải được dán tem thuốc lá nhập khẩu theo quy định của Bộ Tài chính. 2. Thuốc lá điếu, xì gà nhập khẩu để kinh doanh tại thị trường trong nước phải tuân thủ các quy định pháp luật hiện hành về mua bán sản phẩm thuốc lá.
      trang_pdf: 2
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 8
      noi_dung: Điều 8. Thủ tục nhập khẩu 1. Khi làm thủ tục nhập khẩu, ngoài hồ sơ nhập khẩu theo quy định của cơ quan Hải quan, thương nhân phải xuất trình cho cơ quan Hải quan 1 (một) bản chính Đơn đăng ký nhập khẩu tự động thuốc lá điếu, xì gà đã được Cục Xuất nhập
      trang_pdf: 2
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 9
      noi_dung: Điều 9. Đăng ký nhập khẩu theo chế độ cấp phép tự động 1. Trước khi làm thủ tục nhập khẩu, thương nhân gửi qua đường bưu điện 01 (một) bộ hồ sơ đăng ký nhập khẩu thuốc lá điếu, xì gà theo chế độ tự động về Cục Xuất nhập khẩu - Bộ Công Thương (54 Hai Bà Trưng - Hoàn Kiếm - Hà Nội).
      trang_pdf: 3
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 10
      noi_dung: 'Điều 10. Chế độ báo cáo 1. Trong 15 (mười lăm) ngày đầu của quý kế tiếp, thương nhân nhập khẩu thuốc lá điếu, xì gà phải gửi về Cục Xuất nhập khẩu - Bộ Công Thương Báo cáo bằng văn bản tình hình nhập khẩu tự động thuốc lá điếu, xì gà của quý trước đó, trong đó nêu rõ: chủng loại, số lượng, trị giá nhập khẩu, giá bán, và dự kiến kế hoạch nhập khẩu trong thời gian tới (theo mẫu quy định tại Phụ lục III ban hành kèm theo Thông tư này).'
      trang_pdf: 3
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 11
      noi_dung: Điều 11. Tổ chức thực hiện Sau 3 (ba) năm kể từ khi Thông tư này có hiệu lực thi hành, Bộ Công Thương chủ trì đánh giá việc thực hiện Thông tư để xem xét lại việc chỉ định thương nhân nhập khẩu thuốc lá điếu, xì gà theo cơ chế thương mại nhà nước.
      trang_pdf: 4
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
    - dieu: 12
      noi_dung: Điều 12. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 20 tháng 02 năm 2014. 2. Thông tư này thay thế Thông tư liên tịch số 01/2007/TTLT-BTM-BCN ngày 10 tháng 01 năm 2007 của liên Bộ Thương mại - Bộ Công nghiệp (nay là Bộ Công Thương) hướng dẫn việc nhập khẩu thuốc lá điếu, xì gà quy định tại Nghị định số 12/2006/NĐ-CP ngày 23 tháng 01 năm 2006 của Chính phủ quy định chi tiết thi hành Luật Thương mại về hoạt động mua bán hàng
      trang_pdf: 4
      sha256_pdf: 6459c4c7ac71965bd95b4c8558b8f2ac522762cdd3ba73a853d79ff2204fddc0
