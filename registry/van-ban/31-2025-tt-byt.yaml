  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Dược ngày 06 tháng 4 năm 2016 và Luật sửa đổi, bổ sung một số điều của Luật Dược ngày 21 tháng 11 năm 2024 (sau đây viết tắt là Luật Dược) và Nghị định số 163/2025/NĐ-CP ngày 29 tháng 6 năm 2025 của Chính phủ quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Dược (sau đây viết tắt là Nghị định số 163/2025/NĐ-CP), bao
      trang_pdf: 1
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 2
      noi_dung: Điều 2. Thông báo, cập nhật danh sách người có Chứng chỉ hành nghề dược đang hành nghề tại cơ sở đến cơ quan có thẩm quyền 1. Cơ sở kinh doanh dược, trừ nhà thuốc thuộc chuỗi nhà thuốc gửi thông báo trực tiếp hoặc qua dịch vụ bưu chính hoặc trực tuyến đến Ủy ban nhân dân cấp tỉnh (cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh) nơi cơ sở kinh doanh dược hoạt động danh sách người có Chứng chỉ hành nghề dược đang hành nghề dược tại cơ
      trang_pdf: 2
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 3
      noi_dung: 'Điều 3. Thông báo, cập nhật danh sách người hành nghề dược; nhà thuốc trong chuỗi khi có luân chuyển người chịu trách nhiệm chuyên môn về dược hoặc thay đổi nhà thuốc trong chuỗi nhà thuốc 1. Khi có thay đổi nhà thuốc trong chuỗi nhà thuốc: Tối thiểu 07 (bảy) ngày làm việc trước khi bổ sung thêm hoặc loại bỏ nhà thuốc ra khỏi chuỗi nhà thuốc, cơ sở tổ chức chuỗi nhà thuốc phải gửi thông báo trực tiếp hoặc qua dịch vụ bưu chính hoặc trực tuyến'
      trang_pdf: 3
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 7
      noi_dung: Điều 7. Các trường hợp hủy công bố cơ sở kinh doanh có tổ chức kệ thuốc 1. Chấm dứt hoạt động của kệ thuốc hoặc chấm dứt hoạt động của cơ sở kinh doanh có tổ chức kệ thuốc. 2. Cơ sở kinh doanh có tổ chức kệ thuốc không đáp ứng một trong các quy định tại điểm b khoản 2 Điều 35 của Luật Dược. 3. Nội dung công bố cơ sở kinh doanh có tổ chức kệ thuốc không đúng thẩm quyền hoặc có nội dung trái pháp luật.
      trang_pdf: 6
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 10
      noi_dung: Điều 10. Danh mục thuốc hạn chế bán lẻ 1. Thuốc hạn chế bán lẻ là thuốc có yêu cầu giám sát chặt chẽ việc kê đơn, bán thuốc theo đơn và sử dụng để bảo đảm an toàn, hiệu quả, tránh lạm dụng thuốc trong điều trị mà việc lạm dụng thuốc có thể gây ra tình trạng lệ thuộc thuốc hoặc không đáp ứng khi sử dụng thuốc đó hoặc thuốc khác. 2. Danh mục thuốc hạn chế bán lẻ được quy định tại Phụ lục III ban hành kèm theo Thông tư này.
      trang_pdf: 7
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 13
      noi_dung: 'Điều 13. Quy định về thực hiện cách thức thông tin thuốc 1. Thông qua “Người giới thiệu thuốc”: thực hiện theo quy định tại Điều 14, 15 và Điều 16 Thông tư này.'
      trang_pdf: 8
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 15
      noi_dung: Điều 15. Trách nhiệm của người giới thiệu thuốc 1. Phải đeo thẻ "Người giới thiệu thuốc" do cơ sở kinh doanh dược cấp và tuân thủ nội quy do cơ sở khám bệnh, chữa bệnh ban hành theo quy định tại khoản 2 Điều 17 Thông tư này khi hoạt động giới thiệu thuốc. Người giới thiệu thuốc chỉ được thực hiện giới thiệu thuốc khi có sự đồng ý của người hành nghề khám bệnh, chữa bệnh, người hành nghề dược.
      trang_pdf: 10
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 18
      noi_dung: Điều 18. Trách nhiệm của cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh nơi có người giới thiệu thực hiện hoạt động giới thiệu thuốc 1. Công bố hoặc hủy công bố danh sách người được cấp thẻ “Người giới thiệu thuốc” trên Trang Thông tin điện tử của cơ quan chuyên môn về y tế thuộc Ủy ban nhân dân cấp tỉnh trong thời hạn 03 (ba) ngày làm việc kể từ khi nhận được danh sách người được cấp hoặc người bị thu hồi thẻ “Người giới thiệu thuốc”
      trang_pdf: 12
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 21
      noi_dung: Điều 21. Yêu cầu về sử dụng ngôn ngữ trong hành nghề dược của người chịu trách nhiệm chuyên môn về dược của cơ sở bán lẻ thuốc và người phụ trách công tác dược lâm sàng của cơ sở khám bệnh, chữa bệnh 1. Người chịu trách nhiệm chuyên môn về dược của cơ sở bán lẻ thuốc và người phụ trách dược lâm sàng của cơ sở khám bệnh, chữa bệnh là người nước ngoài và người Việt Nam định cư ở nước ngoài phải biết tiếng Việt thành thạo, trường hợp không biết
      trang_pdf: 14
      sha256_pdf: ebf2d059e5454c193988d52838aad6e8026cecfddf80d8e2f3248f6c3c544edd
    - dieu: 25
      noi_dung: Điều 25. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2025.
