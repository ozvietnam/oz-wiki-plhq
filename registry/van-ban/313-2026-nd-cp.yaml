xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=219136, người ký Phó Thủ tướng Phạm Thị Thanh Trà, tệp đính kèm 313_2026_nd-cp_08082026_1-signed-1-.signed.pdf): Nghị định 313/2026/NĐ-CP của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Y tế, ban hành ngày 08-08-2026, có hiệu lực thi hành từ ngày 18-08-2026; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
