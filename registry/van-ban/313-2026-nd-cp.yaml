  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Vị trí và chức năng Bộ Y tế là cơ quan của Chính phủ, thực hiện chức năng quản lý nhà nước về các lĩnh vực: Phòng bệnh; khám bệnh, chữa bệnh, phục hồi chức năng; giám định y khoa, pháp y, pháp y tâm thần; bà mẹ, trẻ em; dân số; phòng, chống tệ nạn xã hội (trừ nhiệm vụ cai nghiện ma túy và quản lý sau cai nghiện ma túy); bảo trợ xã hội; y, dược cổ truyền; dược, mỹ phẩm; an toàn thực phẩm; thiết bị y tế;'
      trang_pdf: 1
      sha256_pdf: d9872a413eabe7aa4e00e994ca7955cfa6c56db698be74c413fbf011b923be02
    - dieu: 2
      noi_dung: 'Điều 2. Nhiệm vụ và quyền hạn Bộ Y tế thực hiện các nhiệm vụ, quyền hạn theo quy định tại Luật Tổ chức Chính phủ, quy định của Chính phủ về chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của bộ, cơ quan ngang bộ và các nhiệm vụ, quyền hạn cụ thể sau đây: 1. Trình Chính phủ dự án luật, dự thảo nghị quyết của Quốc hội, dự án pháp lệnh, dự thảo nghị quyết của Ủy ban Thường vụ Quốc hội, dự thảo nghị định, nghị quyết của Chính phủ;'
      trang_pdf: 1
      sha256_pdf: d9872a413eabe7aa4e00e994ca7955cfa6c56db698be74c413fbf011b923be02
    - dieu: 3
      noi_dung: 13 3. Vụ Kế hoạch - Tài chính. 4. Vụ Pháp chế. 5. Vụ Hợp tác quốc tế. 6. Văn phòng Bộ. 7. Cục Quản lý Khám, chữa bệnh. 8. Cục Quản lý Y, Dược cổ truyền. 9. Cục Quản lý Dược. 10. Cục An toàn thực phẩm. 11. Cục Hạ tầng và Thiết bị y tế. 12. Cục Khoa học công nghệ và Đào tạo. 13. Cục Dân số. 14. Cục Phòng bệnh. 15. Cục Bà mẹ và Trẻ em. 16. Cục Bảo trợ xã hội. 17. Viện Chiến lược và Chính sách y tế. 18. Trung tâm Thông tin y tế Quốc gia.
      trang_pdf: 13
      sha256_pdf: d9872a413eabe7aa4e00e994ca7955cfa6c56db698be74c413fbf011b923be02
    - dieu: 4
      noi_dung: Điều 4. Hiệu lực thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 8 năm 2026. 2. Nghị định số 42/2025/NĐ-CP ngày 27 tháng 02 năm 2025 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Y tế hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành.
      trang_pdf: 13
      sha256_pdf: d9872a413eabe7aa4e00e994ca7955cfa6c56db698be74c413fbf011b923be02
    - dieu: 5
      noi_dung: Điều 5. Trách nhiệm thi hành Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương chịu trách nhiệm thi hành Nghị định này.
      trang_pdf: 14
      sha256_pdf: d9872a413eabe7aa4e00e994ca7955cfa6c56db698be74c413fbf011b923be02
