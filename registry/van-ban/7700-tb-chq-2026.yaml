ghi_chu: 'Xác định trước mã số mặt hàng Nguyên liệu thực phẩm AQUAMIN F (100% tảo biển đỏ Lithothamnion sp. đã hấp thụ canxi và khoáng chất từ nước biển, chế biến dạng bột màu trắng ngà <25 µm, canxi > 32%, magie > 2,2%, độ ẩm < 5%, tro > 90%, đóng bao giấy 20kg lót polyethylene; dùng làm nguyên liệu bổ sung canxi và khoáng chất tự nhiên trong thực phẩm bổ sung, thực phẩm bảo vệ sức khỏe) thuộc nhóm 12.12, phân nhóm 1212.21, mã số 1212.21.90.'
