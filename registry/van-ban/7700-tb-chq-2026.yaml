xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/2/3/VB_7700.pdf, id=102536, SHA-256 a72bf8b7657b46cbfd517ae4cf1e4034784d698e038b575a4b606d5f82cf27c2): Thông báo số 7700/TB-CHQ ngày 30-01-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Nguyên liệu thực phẩm AQUAMIN F (thành phần 100% tảo biển đỏ Lithothamnion sp. đã hấp thụ canxi và các khoáng chất khác từ nước biển, thu hoạch từ đáy biển Bắc Đại Tây Dương, qua rửa, khử trùng, sấy khô và nghiền thành dạng bột màu trắng ngà cỡ hạt <25 µm; canxi > 32%, magie > 2,2%, độ ẩm < 5%, tro > 90%; đóng bao giấy trắng 20kg có lớp lót polyethylene; dùng làm nguyên liệu bổ sung canxi và khoáng chất tự nhiên cho thực phẩm bổ sung, thực phẩm bảo vệ sức khỏe), phân loại vào nhóm 12.12, phân nhóm 1212.21, mã số 1212.21.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
