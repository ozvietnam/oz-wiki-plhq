      pham_vi: 'Sửa đổi, bổ sung nhóm sản phẩm chiếu sáng bằng công nghệ LED tại số thứ tự 10 (mục 10.1 đến 10.4: bóng đèn LED có ba-lát lắp liền, bóng đèn LED hai đầu thay thế bóng đèn huỳnh quang ống thẳng, đèn điện LED thông dụng di động, đèn điện LED thông dụng cố định; các mã HS 8539.52.10, 8539.52.90, 9405.11.91, 9405.11.99, 9405.21.90) Phụ lục sản phẩm, hàng hóa nhóm 2 thuộc trách nhiệm quản lý của Bộ Khoa học và Công nghệ'
