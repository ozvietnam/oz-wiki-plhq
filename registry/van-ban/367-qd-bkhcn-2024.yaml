xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn PDF ký số trên Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn docid=209891, datafiles.chinhphu.vn 367-bkhcn.signed.pdf, 5 trang, Thứ trưởng Lê Xuân Định ký ngày 12/03/2024): Điều 1 và Phụ lục sửa đổi, bổ sung nhóm sản phẩm chiếu sáng bằng công nghệ LED tại số thứ tự 10 (mục 10.1–10.4) Phụ lục Quyết định 2711/QĐ-BKHCN ngày 30/12/2022; Điều 2 quy định có hiệu lực kể từ ngày ký (12/03/2024). Đã bị sửa đổi một phần bởi Quyết định 3830/QĐ-BKHCN ngày 21/11/2025 (hủy bỏ sản phẩm có mã HS 9405.11.99 tại mục 10.4 Phụ lục).'
