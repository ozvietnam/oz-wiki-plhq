xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=213376, tệp đính kèm 86-cp.signed.pdf), Công báo (id=44745, số Công báo 671 + 672 năm 2025, người ký Phó Thủ tướng Bùi Thanh Sơn) và các quyết định phòng vệ thương mại trong sổ: Nghị định 86/2025/NĐ-CP của Chính phủ quy định chi tiết một số điều của Luật Quản lý ngoại thương về các biện pháp phòng vệ thương mại, ban hành ngày 11-04-2025, có hiệu lực thi hành từ ngày 01-07-2025 và thay thế Nghị định 10/2018/NĐ-CP; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Nghị định này quy định chi tiết một số điều của Luật Quản lý ngoại thương về cách xác định thiệt hại của ngành sản xuất trong nước; chống lẩn tránh biện pháp phòng vệ thương mại; căn cứ tiến hành, trình tự, thủ tục, thời hạn, nội dung, căn cứ chấm dứt điều tra vụ việc phòng vệ thương mại (sau đây gọi là điều tra); áp dụng, rà soát biện pháp phòng vệ thương mại; xác định trợ cấp và biện pháp chống trợ cấp;
      trang_pdf: 1
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng 1. Các cơ quan quản lý nhà nước có thẩm quyền điều tra, áp dụng và xử lý biện pháp phòng vệ thương mại.
      trang_pdf: 1
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ 1. Chứng cứ là những gì có thật được Cơ quan điều tra dùng làm căn cứ xác định cho việc giải quyết vụ việc phòng vệ thương mại. 2. Vụ việc phòng vệ thương mại bao gồm: vụ việc chống bán phá giá, vụ việc chống trợ cấp, vụ việc tự vệ và vụ việc chống lẩn tránh biện pháp phòng vệ thương mại đối với hàng hóa nhập khẩu vào Việt Nam.'
      trang_pdf: 2
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 20
      noi_dung: Điều 20. Xem xét tính đầy đủ, hợp lệ của hồ sơ yêu cầu điều tra áp dụng biện pháp phòng vệ thương mại, biện pháp chống lẩn tránh biện pháp phòng vệ thương mại 1. Trong thời hạn 20 ngày kể từ ngày nhận được hồ sơ yêu cầu điều tra áp dụng biện pháp phòng vệ thương mại, biện pháp chống lẩn tránh biện pháp phòng vệ thương mại, Cơ quan điều tra thông báo cho tổ chức, cá nhân về tính đầy đủ, hợp lệ của hồ sơ.
      trang_pdf: 12
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 36
      noi_dung: Điều 36. Thẩm định hồ sơ yêu cầu điều tra áp dụng biện pháp chống bán phá giá, chống trợ cấp 1. Việc xem xét tính đầy đủ, hợp lệ của hồ sơ yêu cầu điều tra áp dụng biện pháp chống bán phá giá, chống trợ cấp được thực hiện theo Điều 20 Nghị định này. 2. Việc thẩm định hồ sơ yêu cầu điều tra áp dụng biện pháp chống bán phá giá, chống trợ cấp và ban hành quyết định điều tra thực hiện theo quy định tại khoản 2 Điều 70 của Luật Quản lý ngoại thương.
      trang_pdf: 24
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 52
      noi_dung: Điều 52. Rà soát cuối kỳ việc áp dụng biện pháp chống bán phá giá, chống trợ cấp 1. Chậm nhất 15 tháng trước khi biện pháp chống bán phá giá, chống trợ cấp hết hiệu lực, Cơ quan điều tra thông báo về việc tiếp nhận hồ sơ yêu cầu rà soát. 2. Trong thời hạn 30 ngày kể từ ngày có thông báo của Cơ quan điều tra, bên yêu cầu rà soát có quyền nộp hồ sơ yêu cầu rà soát cuối kỳ việc áp dụng biện pháp chống bán phá giá, chống trợ cấp.
      trang_pdf: 36
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 68
      noi_dung: 'Điều 68. Xác định thiệt hại nghiêm trọng và đe dọa gây thiệt hại nghiêm trọng cho ngành sản xuất trong nước trong vụ việc điều tra áp dụng biện pháp tự vệ 1. Việc xác định thiệt hại nghiêm trọng của ngành sản xuất trong nước dựa trên cơ sở xem xét các yếu tố sau: a) Sự gia tăng tuyệt đối hoặc tương đối của khối lượng, số lượng của hàng hóa bị điều tra nhập khẩu vào Việt Nam so với khối lượng, số lượng của hàng hóa tương tự hoặc hàng hóa cạnh'
      trang_pdf: 47
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 84
      noi_dung: 'Điều 84. Lẩn tránh biện pháp phòng vệ thương mại thông qua thay đổi không đáng kể hàng hóa bị áp dụng biện pháp phòng vệ thương mại 1. Hàng hóa được quy định tại khoản 3 Điều 81 Nghị định này bị coi là lẩn tránh biện pháp phòng vệ thương mại khi có đủ các điều kiện sau: a) Khối lượng, số lượng nhập khẩu hàng hóa gia tăng đáng kể so với khối lượng, số lượng nhập khẩu hàng hóa bị áp dụng biện pháp phòng vệ thương mại vào Việt Nam sau khi Bộ trưởng'
      trang_pdf: 58
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 100
      noi_dung: Điều 100. Thẩm định hồ sơ yêu cầu rà soát việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại 1. Việc xem xét tính đầy đủ, hợp lệ của hồ sơ yêu cầu rà soát việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại được thực hiện theo quy định tại Điều 21 Nghị định này.
      trang_pdf: 70
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
    - dieu: 117
      noi_dung: Điều 117. Quy định chuyển tiếp Các vụ việc điều tra áp dụng biện pháp phòng vệ thương mại, rà soát việc áp dụng biện pháp phòng vệ thương mại, vụ việc điều tra áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại, rà soát việc áp dụng biện pháp chống lẩn tránh biện pháp phòng vệ thương mại được Cơ quan điều tra thông báo đã tiếp nhận hồ sơ yêu cầu điều tra, rà soát đầy đủ và hợp lệ trước ngày Nghị định này có hiệu lực thì được giải
      trang_pdf: 78
      sha256_pdf: ee09633433416db6f9e026d6613a55e9e8a925b1522f20b2cd2ea486c91c0758
ghi_chu: Khung NĐ phòng vệ thương mại hiện hành (thay 10/2018 từ 01/07/2025). Gắn nhánh chong-ban-pha-gia để đóng NUT_THIEU_LOAI NGHI_DINH.
