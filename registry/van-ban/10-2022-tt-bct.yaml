      noi_dung: Điều 1. Sửa đổi, bố sung một số điều của Thông tư số 22/2016/TT- BCT ngày 3 tháng 10 năm 2016 của Bộ trưởng Bộ Công Thương thực hiện Quy tắc xuất xứ hàng hóa trong Hiệp định Thương mại hàng hóa ASEAN (sau đây gọi tắt là Thông tư số 22/2016/TT-BCT), được sửa doi, bé sung bởi Thông tư sô 19/2020/TT-BCT ngày 14 tháng 8 năm 2020 của Bộ trưởng Bộ Công Thương sửa đối, bố sung các Thông tư quy định thực hiện Quy tắc xuất xứ hàng hóa trong Hiệp định
