      trang_pdf: 3
    - dieu: 3
      noi_dung: Điều 3. Quy định chuyền tiếp C/O mẫu D theo quy định tại Phụ lục II ban hành kèm theo Thông tư số 19/2020/TT-BCT được cấp đến hết ngày 31 tháng 10 năm 2022 và được cơ quan hải quan chấp nhận trong thời hạn quy định tại Điều 15 Phụ lục I ban hành kèm theo Thông tư này.
      trang_pdf: 3
    - dieu: 4
      noi_dung: Điều 4. Điều khoản thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày AG thang t nam 2022. 2. Trường hợp các van bản được dẫn chiếu trong Thông tư này bị thay thế hoặc sửa đôi, bô sung thì thực hiện theo văn bản thay thê hoặc văn bản đã được sửa đôi, bô sung.
      trang_pdf: 3
