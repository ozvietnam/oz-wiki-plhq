  pham_vi: "Đã đọc toàn văn PDF ký số bậc A trên datafiles.chinhphu.vn (25ndcp.signed.pdf, 44 trang, ký Phó Thủ tướng Bùi Thanh Sơn ngày 17-01-2026) và đối chiếu thẻ vanban.chinhphu.vn (docid=216672): gồm 8 Chương, 41 Điều (trang 1–38) và Phụ lục biểu mẫu (trang 39–44), quy định chi tiết khoản 15 Điều 2, khoản 5 Điều 4, khoản 5 Điều 5, khoản 3 Điều 6, khoản 5 Điều 8, khoản 5 Điều 33, khoản 3 Điều 35, khoản 3 Điều 36, khoản 2 Điều 37, khoản 2 Điều 38, khoản 5 Điều 39, khoản 3 Điều 42, khoản 4 Điều 46 của Luật Hóa chất số 69/2025/QH15. Chương VIII (Điều khoản thi hành): Điều 40 quy định điều khoản chuyển tiếp đối với hợp đồng tư vấn chuyên ngành hóa chất đã ký trước ngày Nghị định có hiệu lực (khoản 1), hạn 31-12-2026 phải xây dựng Kế hoạch phòng ngừa, ứng phó sự cố hóa chất trình thẩm định, phê duyệt đối với cơ sở đã ban hành Biện pháp phòng ngừa nhưng thuộc điểm b khoản 2 Điều 33 (khoản 2), và việc tiếp tục thực hiện Kế hoạch cấp tỉnh đã ban hành (khoản 3); Điều 41 (Hiệu lực thi hành) khoản 1 quy định Nghị định có hiệu lực thi hành kể từ ngày ký ban hành (17-01-2026), khoản 2 quy định trách nhiệm thi hành. Đối chiếu tình trạng hiện tại đến 2026-11-21 trên vanban.chinhphu.vn: chưa có văn bản sửa đổi, bổ sung, thay thế hay bãi bỏ, đang CON_HIEU_LUC."
  hieu_luc_da_doi_chieu: true
  ngay: "2026-11-21"
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: "Nghị định trong bộ văn bản hoá chất ban hành cùng ngày 17-01-2026 (NĐ 24/2026/NĐ-CP danh mục, NĐ 26/2026/NĐ-CP quản lý hoạt động, TT 01/2026/TT-BCT hướng dẫn), đều hướng dẫn Luật Hoá chất 69/2025/QH15. Đã đọc toàn văn PDF ký số bậc A (44 trang) và hoàn tất đối chiếu chương-điều, điều khoản chuyển tiếp (Điều 40) và điều khoản hiệu lực (Điều 41 khoản 1) ngày 2026-11-21."
