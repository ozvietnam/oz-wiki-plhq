ghi_chu: 'Xác định trước mã số mặt hàng Sáp thực vật Carnauba wax làm bóng bánh kẹo tráng đường (ký, mã hiệu Shellglaze CTP, nhà sản xuất Masterol Foods Pty. Ltd; thành phần Carnauba wax INS 903, CAS 8015-86-9 hàm lượng 100%, dạng bột mịn vi hạt màu vàng nhạt sản xuất bằng phương pháp sấy phun không sử dụng phụ gia, đóng gói 25kg/gói, công dụng phụ gia thực phẩm làm bóng bánh kẹo tráng đường) thuộc nhóm 15.21, mã số 1521.10.00.'
