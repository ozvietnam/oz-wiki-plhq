  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/9/VB_1174.pdf, id=99776, SHA-256 c3b34c1e598073713151d234907f0ab262bdfeb4ac60bfd2f0c30079d06d875d): Thông báo số 1174/TB-CHQ ngày 04-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Sáp thực vật Carnauba wax làm bóng bánh kẹo tráng đường (ký, mã hiệu Shellglaze CTP, nhà sản xuất Masterol Foods Pty. Ltd; thành phần chất làm bóng Carnauba wax INS 903, CAS 8015-86-9 hàm lượng 100%, dạng bột mịn vi hạt màu vàng nhạt sản xuất bằng phương pháp sấy phun không sử dụng chất phụ gia, điểm nóng chảy 82.0-86.0°C, đóng gói 25kg/gói, công dụng phụ gia thực phẩm làm bóng bánh kẹo tráng đường), phân loại vào nhóm 15.21, mã số 1521.10.00; có hiệu lực kể từ ngày ban hành'
