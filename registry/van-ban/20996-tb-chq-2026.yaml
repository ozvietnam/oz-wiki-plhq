  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_20996.pdf, id=106008, SHA-256 69c42b340ad1337b4983ca78064ad80bca88fbcb8294081b59f162e976dbfaeb): Thông báo số 20996/TB-CHQ ngày 26-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ thực hành AI nâng cao dùng cho cấp THCS (AI Advanced Kit for Secondary School, Model WB1012; bộ sản phẩm STEM nhằm mục đích giáo dục và giải trí cho học sinh cấp THCS, cấu tạo gồm vali hộp nhôm và nhựa kích thước 430 x 230 x 135 mm, trọng lượng 3.050 g có đế giữ và gắn các module linh kiện điện tử cùng bộ phận lắp ráp: bo mạch chủ ELF mini V3.0, bộ pin Lithium 18650 điện áp hoạt động 5 V, 2 động cơ 9 V L-Motor, 1 động cơ Servo 9g, các cảm biến siêu âm RGB, nhận dạng hình ảnh, la bàn, nhiệt độ và độ ẩm, cử chỉ, ánh sáng, âm thanh, chiết áp trượt, màn hình LED 4 chữ số, bàn phím 4 nút bấm có đèn LED, đèn LED RGB, còi báo, cáp RJ11, dây USB, bộ chuyển và mô-đun chia 4 cổng RJ11, bánh xe, khung và thanh dầm nhựa, đinh tán, chốt nối, khớp nối góc, quả bóng nhựa nhiều màu và tài liệu hướng dẫn kèm theo), phân loại vào nhóm 95.03, mã số 9503.00.99; có hiệu lực từ ngày ký'
