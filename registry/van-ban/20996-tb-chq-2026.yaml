ghi_chu: 'Xác định trước mã số mặt hàng Bộ thực hành AI nâng cao dùng cho cấp THCS (AI Advanced Kit for Secondary School, Model WB1012, bộ dụng cụ STEM giáo dục và giải trí gồm vali 430 x 230 x 135 mm nặng 3.050 g chứa bo mạch chủ ELF mini V3.0, pin Lithium 18650, động cơ, các mô-đun cảm biến, màn hình LED và linh kiện lắp ráp robot) thuộc nhóm 95.03, mã số 9503.00.99.'
