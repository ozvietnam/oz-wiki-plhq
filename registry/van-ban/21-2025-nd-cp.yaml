xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=212714), toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/21-2025-nd-cp.pdf, 3 trang, 2 Điều, Phó Thủ tướng Hồ Đức Phớc ký, SHA-256 1097f1a473dbe7d1e461a06b47706762024f0857cdbdbc1a2d7f034d14b43ec4) và trang wiki/sources/21-2025-nd-cp.md: Nghị định 21/2025/NĐ-CP ban hành 10-02-2025, có hiệu lực thi hành kể từ ngày ký ban hành 10-02-2025 theo khoản 1 Điều 2; đối chiếu đang còn hiệu lực, sửa đổi tên Điều 9 và khoản 1 Điều 9 Nghị định 26/2023/NĐ-CP (áp dụng thuế suất thuế nhập khẩu ưu đãi 0% đối với nguyên liệu, vật tư, linh kiện thuộc Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô đến hết ngày 31-12-2027 theo khoản 2 Điều 2)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '“Điều 9. Thuế suất thuế nhập khẩu ưu đãi đối với nguyên liệu, vật tư, linh kiện để sản xuất, gia công (lắp ráp) các sản phẩm công nghiệp hỗ trợ ưu tiên phát triển cho ngành sản xuất, lắp ráp ô tô đến ngày 31 tháng 12 năm 2027 (gọi tắt là Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô) 1. Quy định thuế suất thuế nhập khẩu ưu đãi 0% đối với nguyên liệu, vật tư, linh kiện trong nước chưa sản xuất được để sản xuất, gia công (lắp ráp) các sản phẩm hỗ trợ ưu tiên phát triển cho ngành sản xuất, lắp ráp ô tô (gọi tắt là sản phẩm công nghiệp hỗ trợ ô tô) đến ngày 31 tháng 12 năm 2027 như sau: a) Tại thời điểm đăng ký tờ khai hải quan, người khai hải quan thực hiện kê khai, tính thuế đối với nguyên liệu, vật tư, linh kiện nhập khẩu theo mức thuế suất thuế nhập khẩu thông thường hoặc mức thuế suất thuế nhập khẩu ưu đãi hoặc mức thuế suất thuế nhập khẩu ưu đãi đặc biệt theo quy định, chưa áp dụng mức thuế suất 0%. b) Việc áp dụng mức thuế suất thuế nhập khẩu ưu đãi 0% đối với nguyên liệu, vật tư, linh kiện của Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô thực hiện theo quy định tại khoản 2, khoản 3, khoản 4, khoản 5, khoản 6, khoản 7, khoản 8 Điều này.”.'
    - dieu: 2
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành.'
    - dieu: 2
      khoan: 2
      noi_dung: '2. Thuế suất thuế nhập khẩu ưu đãi đối với nguyên liệu, vật tư, linh kiện để sản xuất, gia công (lắp ráp) các sản phẩm công nghiệp hỗ trợ ưu tiên phát triển cho ngành sản xuất, lắp ráp ô tô quy định tại Nghị định này được áp dụng đến ngày 31 tháng 12 năm 2027. Doanh nghiệp đã đăng ký tham gia Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô quy định trước thời điểm Nghị định này có hiệu lực thi hành không phải đăng ký lại Chương trình ưu đãi thuế công nghiệp hỗ trợ ô tô và được hưởng ưu đãi theo quy định tại Nghị định này.'
    - dieu: 2
      khoan: 3
      noi_dung: '3. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.'
