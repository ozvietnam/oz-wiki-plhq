xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/3/18/VB_95.pdf, id=99615, SHA-256 93da6a5101f6a917c4e85a6a83fe5892425acd3c10e17e0a249242a7be9269c0): Thông báo số 95/TB-CHQ ngày 12-03-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Nhẫn thông minh theo dõi sức khỏe đeo trên ngón tay, không làm từ kim loại quý, đi kèm hộp sạc (tên thương mại GALAXY RING, SM-Q508, ký mã hiệu SM-Q508; cấu tạo gồm vỏ ngoài bằng Titanium, pin uốn cong 18.5 mAh và bản mạch PBA chứa 03 cảm biến gồm cảm biến nhịp tim quang học PPG, cảm biến gia tốc và cảm biến nhiệt độ hồng ngoại, kháng nước 10 ATM/IP68, ROM 8MB, không có màn hình hiển thị; kết nối Bluetooth với điện thoại thông minh để đo và truyền dữ liệu nhịp tim, SpO2, mức độ căng thẳng, bước chân, giấc ngủ, nhiệt độ da về ứng dụng Samsung Health), phân loại vào nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Nhẫn thông minh theo dõi sức khỏe đeo ngón tay, không làm từ kim loại quý, đi kèm hộp sạc (GALAXY RING, ký mã hiệu SM-Q508, vỏ Titanium, tích hợp 3 cảm biến nhịp tim quang học PPG, gia tốc và nhiệt độ hồng ngoại, kết nối Bluetooth truyền dữ liệu sức khỏe và giấc ngủ về điện thoại thông minh, không có màn hình hiển thị) thuộc nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90.'
