  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh Luật này quy định về đối tượng chịu thuế, người nộp thuế, căn cứ tính thuế, thời điểm tính thuế, biểu thuế, thuế chống bán phá giá, thuế chống trợ cấp, thuế tự vệ áp dụng đối với hàng hóa xuất khẩu, nhập khẩu; miễn thuế, giảm thuế, hoàn thuế xuất khẩu, thuế nhập khẩu.
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng chịu thuế 1. Hàng hóa xuất khẩu, nhập khâu qua cửa khẩu, biên giới Việt Nam. 2. Hàng hóa xuất khẩu từ thị trường trong nước vào khu phi thuế quan, hàng hóa nhập khẩu từ khu phi thuế quan vào thị trường trong nước. 3. Hàng hóa xuất khẩu, nhập khẩu tại chỗ và hàng hóa xuất khâu, nhập khẩu của doanh nghiệp thực hiện quyền xuất khẩu, quyền nhập khâu, quyền phân phối.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Người nộp thuế 1. Chủ hàng hóa xuất khâu, nhập khẩu. 2. Tổ chức nhận ủy thác xuất khâu, nhập khẩu. 3. Người xuất cảnh, nhập cảnh có hàng hóa xuất khâu, nhập khẩu, gửi hoặc nhận hàng hóa qua cửa khâu, biên giới Việt Nam. 4. Người được ủy quyển, bảo lãnh và nộp thuế thay cho người nộp thuế, bao gôm: a) Đại lý làm thủ tục hải quan trong trường hợp được người nộp thuế ủy quyên nộp thuế xuất khẩu, thuế nhập khẩu;'
      trang_pdf: 2
    - dieu: 6
      noi_dung: Điều 6. Căn cứ tính thuế xuất khẩu, thuế nhập khẩu đối với hàn hóa áp dụng phương pháp tính thuế tuyệt đối, phương pháp tính thuế hỗn hợp 1. Số tiền thuế áp dụng phương pháp tính thuế tuyệt đối đối với hàng hóa xuất khẩu, nhập khẩu được xác định căn cứ vào lượng hàng hóa thực tế xuất khẩu, nhập khẩu và mức thuế tuyệt đối quy định trên một đơn vị hàng hóa tại thời điểm tính thuế. 2. Số tiền thuế áp dụng phương pháp tính thuế. hỗn hợp đối với hàng
      trang_pdf: 4
    - dieu: 9
      noi_dung: 'Điều 9. Thời hạn nộp thuế __ 1. Hàng hóa xuất khẩu, nhập khẩu thuộc đối tượng chịu thuế phải nộp thuế trước khi thông quan hoặc giải phóng hàng hóa theo quy định của Luật hải quan, trừ trường hợp quy định tại khoản 2 Điêu này. Trường hợp được tổ chức tín dụng bảo lãnh số thuế phải nộp thì được thông quan hoặc giải phóng hàng hóa nhưng phải nộp tiền chậm nộp theo quy định của Luật quản lý: thuế ké từ ngày được thông quan hoặc giải phóng hàng'
      trang_pdf: 5
    - dieu: 11
      noi_dung: Điều 11. Thẫm quyền ban hành biểu thuế, thuế suất 1. Chính phủ căn cứ quy định tại Điều 10 của Luật này, Biểu thuế xuất
      trang_pdf: 5
    - dieu: 13
      noi_dung: 'Điều 13. Thuế chống trợ cấp 1. Điều kiện áp dụng thuế chống trợ cấp: a) Hàng hóa nhập khẩu được xác định có trợ cấp theo quy định pháp luật; b) Hàng hóa nhập khâu là nguyên nhân gây ra hoặc đe dọa gây ra thiệt hại đáng kể cho ngành sản xuất trong nước hoặc ngăn cản sự hình thành của ngành sản xuất trong nước. 2. Nguyên tắc áp dụng thuế chống trợ cấp: a) Thuế chống trợ cấp chỉ được áp dụng ở mức độ cần thiết, "hợp lý'
      trang_pdf: 7
    - dieu: 15
      noi_dung: Điều 15. Áp dụng thuế chống bán phá giá, thuế chống trợ cấp, thuế tự vệ 1. Việc áp dụng, thay đổi, bãi bỏ thuế chống bán phá giá, thuế chống trợ cấp và thuế tự vệ được thực hiện theo quy định của Luật này và pháp luật về chéng bán phá giá, pháp luật về chống trợ cấp, pháp luật về tự vệ.
      trang_pdf: 8
    - dieu: 17
      noi_dung: Điều 17. Thủ tục miễn thuế 1. Trường hợp quy định tại các khoản 11, 12, 13, 14, 15, 16 và 18 Điều 16 của Luật này, người nộp thuế thực hiện thông báo hàng hóa miễn thuế dự kiến nhập khẩu với cơ quan hải quan. __2. Thủ tục miễn thuế thực hiện theo quy định của pháp luật về quản lý thuê.
      trang_pdf: 12
    - dieu: 20
      noi_dung: Điều 20. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 9 năm 2016. 2. Luật thuế xuất khẩu, thuế nhập khâu số 45/2005/QHI1 hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành.
      trang_pdf: 13
