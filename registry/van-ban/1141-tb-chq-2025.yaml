ghi_chu: 'Xác định trước mã số mặt hàng Khung máy chủ phiến Dell PowerEdge MX7000 Modular Chassis (Regulatory Model E44S, Regulatory Type E44S001, nhà sản xuất Dell; chiều cao 7U, kích thước 816.8x482x307.4mm, 08 khe cắm mặt trước cho máy chủ phiến và 06 khe cắm mặt sau cho thiết bị ngoại vi, lắp sẵn quạt, nguồn và module quản lý KVM, chưa lắp đặt sẵn máy chủ và thiết bị giao tiếp ngoại vi) thuộc nhóm 84.73, phân nhóm 8473.30, mã số 8473.30.90.'
