  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/9/VB_1141.pdf, id=99775, SHA-256 2d3ff21f5817dbe792f22cd9fe5e42c6ba0705eec3a462b3e4ba3cfd62b21395): Thông báo số 1141/TB-CHQ ngày 04-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Dell PowerEdge MX7000 Modular Chassis - Khung máy chủ phiến Dell PowerEdge MX7000 (Regulatory Model E44S, Regulatory Type E44S001, nhà sản xuất Dell; chiều cao lắp tủ rack 7U, kích thước 816.8mm x 482mm x 307.4mm, hỗ trợ tối đa 8 module máy tính 2 socket hoặc 4 module máy tính 4 socket, có 08 khe cắm mặt trước cho máy chủ phiến và 06 khe cắm mặt sau cho thiết bị giao tiếp ngoại vi, lắp đặt sẵn quạt, nguồn và module quản lý hỗ trợ KVM, không lắp đặt sẵn bất kỳ máy chủ và thiết bị giao tiếp ngoại vi nào), phân loại vào nhóm 84.73, phân nhóm 8473.30, mã số 8473.30.90; có hiệu lực từ ngày ký'
