xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bản gốc trên Cổng Hải quan (id=103114, 2 trang, Phó Trưởng ban Giám sát quản lý về HQ Nguyễn Bắc Hải ký ngày 09-04-2026, SHA-256 39d11b06f4e00e1e62cba2ba96f738f493b6609794684bae17af6cf0d2ef7162): Công văn số 15029/CHQ-GSQL ngày 09-04-2026 của Cục Hải quan trả lời công văn 1131/HQKV1-NVHQ ngày 20-03-2026 của Chi cục Hải quan khu vực I về thủ tục hải quan đối với người nhập cảnh mang theo vàng trang sức, mỹ nghệ vượt định mức miễn thuế: (1) cá nhân xuất nhập cảnh bằng hộ chiếu mang vàng trang sức, mỹ nghệ từ 300g trở lên phải khai báo hải quan theo khoản 2 Điều 2 Thông tư 11/2014/TT-NHNN; hồ sơ hải quan đối với hành lý vượt định mức miễn thuế thực hiện theo khoản 2 Điều 60 Nghị định 08/2015/NĐ-CP sửa đổi tại khoản 30 Điều 1 Nghị định 167/2025/NĐ-CP, khai tờ khai hải quan theo Thông tư 38/2015/TT-BTC, 39/2018/TT-BTC, 121/2025/TT-BTC và tờ khai nhập cảnh theo Thông tư 52/2017/TT-BTC; (2) về giấy tờ chứng minh nguồn gốc vàng trang sức, mỹ nghệ (Bộ Tài chính đã có CV 279/BTC-CHQ ngày 09-01-2026 trao đổi với NHNN), khi chưa có hướng dẫn mới của NHNN thì căn cứ quy định hiện hành để thực hiện; (3) kiểm tra thực tế hàng hóa thực hiện theo Điều 29 Nghị định 08/2015/NĐ-CP sửa đổi tại khoản 15 Điều 1 Nghị định 167/2025/NĐ-CP'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'Hướng dẫn hồ sơ hải quan và kiểm tra thực tế đối với hành lý người nhập cảnh mang theo vàng trang sức, mỹ nghệ vượt định mức miễn thuế (từ 300g trở lên theo TT 11/2014/TT-NHNN) theo khoản 15 và khoản 30 Điều 1 Nghị định 167/2025/NĐ-CP.'
