ten: 'Thông báo về kết quả xác định trước mã số (Cáp tín hiệu có chống nhiễu 1PR x 1.0mm2, cách điện bằng cao su silicon chống cháy dạng gốm, điện áp 30V, chưa gắn với đầu nối, không dùng cho viễn thông, dùng truyền tín hiệu chuẩn RS-232, RS-485, Modbus/Bacnet, hệ thống âm thanh, báo cháy, camera, BMS, mã số 8544.49.24)'
