xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/10/16/VB_23043.pdf, id=106372, SHA-256 dd49b7295ddc09c5085ad0fec15721ad274ac02efacb7d03100648b61bcb0036): Thông báo số 23043/TB-CHQ ngày 15-10-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Cáp tín hiệu có chống nhiễu, cách điện bằng cao su silicon chống cháy dạng gốm (Ceramic Flame-Retardant Silicone Rubber), 1PR x 1.0mm2 (vỏ ngoài bằng chất liệu LSZH; lớp thứ hai bằng lá nhôm chia 02 vùng gồm vùng 1 là 01 bó dây thoát nhiễu 07 sợi đồng mạ thiếc đường kính 0,32mm/sợi và vùng 2 là vỏ băng mica chứa 02 cáp truyền tín hiệu cách điện bằng cao su silicon chống cháy dạng gốm, mỗi lõi gồm 27 sợi đồng dẫn điện bện xoắn đường kính 0,25mm/sợi; cáp dạng cuộn chưa gắn đầu nối, đường kính lõi dẫn tín hiệu nhỏ hơn 19,5mm, điện áp 30V, không dùng cho viễn thông, dùng truyền tín hiệu chuẩn RS-232, RS-485, Modbus/Bacnet, hệ thống âm thanh, báo cháy, camera, BMS), phân loại vào nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Cáp tín hiệu có chống nhiễu 1PR x 1.0mm2, cách điện bằng cao su silicon chống cháy dạng gốm (vỏ ngoài chất liệu LSZH; bên trong có lớp lá nhôm, 01 bó dây thoát nhiễu 07 sợi đồng mạ thiếc đường kính 0,32mm/sợi và lớp băng mica chứa 02 cáp truyền tín hiệu cách điện bằng cao su silicon chống cháy dạng gốm Ceramic Flame-Retardant Silicone Rubber, mỗi lõi gồm 27 sợi đồng bện xoắn đường kính 0,25mm/sợi; cáp dạng cuộn, chưa gắn đầu nối, đường kính lõi dẫn tín hiệu nhỏ hơn 19,5mm, điện áp 30V, không dùng cho viễn thông, dùng truyền tín hiệu cho chuẩn kết nối RS-232, RS-485, Modbus/Bacnet, hệ thống âm thanh, báo cháy, camera, BMS) thuộc nhóm 85.44, phân nhóm 8544.49, mã số 8544.49.24.'
