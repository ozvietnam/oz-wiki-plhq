      trang_pdf: 2
      sha256_pdf: 6d3b3569e6782ab5052087be946a6ac47eba301fb002c5c7d3ccf0d9489d76e5
    - dieu: 5
      noi_dung: rủi ro trung bình, mức độ rủi ro cao 1. Việc quản lý sản phẩm, hàng hóa thuộc Danh mục sản phẩm hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao được thực hiện theo quy định của pháp luật về Chất lượng sản phẩm, hàng hóa, các quy chuẩn kỹ thuật tương ứng và các văn bản pháp luật chuyên ngành có liên quan.
      trang_pdf: 3
      sha256_pdf: 6d3b3569e6782ab5052087be946a6ac47eba301fb002c5c7d3ccf0d9489d76e5
    - dieu: 6
      noi_dung: Điều 6. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026. 2. Thông tư số 16/2021/TT-BNNPTNT ngày 20 tháng 12 năm 2021 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn ban hành danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý của Bộ Nông nghiệp và Phát triển nông thôn hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực thi hành.
      trang_pdf: 3
      sha256_pdf: 6d3b3569e6782ab5052087be946a6ac47eba301fb002c5c7d3ccf0d9489d76e5
    - dieu: 7
      noi_dung: Điều 7. Điều khoản chuyển tiếp 1. Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy đã được cấp cho sản phẩm, hàng hóa thuộc phạm vi điều chỉnh Thông tư này đến trước ngày Thông tư này có hiệu lực thi hành vẫn còn giá trị sử dụng cho đến hết thời hạn ghi trong Giấy chứng nhận hợp quy, Thông báo tiếp nhận bản công bố hợp quy.
      trang_pdf: 3
      sha256_pdf: 6d3b3569e6782ab5052087be946a6ac47eba301fb002c5c7d3ccf0d9489d76e5
    - dieu: 8
      noi_dung: 'Điều 8. Tổ chức thực hiện 1. Chánh Văn phòng Bộ, Cục trưởng các Cục: Chất lượng, Chế biến và Phát triển thị trường; Chăn nuôi và Thú y; Trồng trọt và Bảo vệ thực vật; Lâm nghiệp và Kiểm lâm; Kinh tế hợp tác và Phát triển nông thôn; Thủy sản và Kiểm ngư; Thủ trưởng các cơ quan, đơn vị thuộc Bộ Nông nghiệp và Môi trường và các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.'
