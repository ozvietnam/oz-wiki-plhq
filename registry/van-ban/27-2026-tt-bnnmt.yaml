  pham_vi: "PDF Công báo số 411 ngày 18-07-2026 (lớp chữ), đối chiếu 8 Điều + 2 Phụ lục: Điều 1 Phạm vi điều chỉnh (ban hành DM rủi ro TB/cao BNNMT); Điều 2 Đối tượng áp dụng (tổ chức/cá nhân sxkd, tổ chức đánh giá phù hợp, cơ quan QLCL); Điều 3 Danh mục rủi ro trung bình (→ tự công bố TC áp dụng, tự đánh giá/CC được công nhận theo QCVN); Điều 4 Danh mục rủi ro cao (→ KTCC trước thông quan, tự công bố + tổ chức CC được chỉ định); Điều 5 Nguyên tắc quản lý chất lượng (HS thực tế theo PL hải quan; QLCL theo tính chất/thành phần/công dụng); Điều 6 Hiệu lực 01-07-2026, bãi TT 16/2021/TT-BNNPTNT và một phần PL II/PL III TT 01/2024/TT-BNNPTNT và Điều 1, khoản 1 điểm a khoản 3 Điều 2, khoản 1 Điều 5, Điều 6, khoản 1 Điều 8 TT 39/2018/TT-BNNPTNT (muối CN); Điều 7 Chuyển tiếp (GCN/TB tiếp nhận cũ còn HLDL, hồ sơ tiếp nhận trước 01-7-2026 giải quyết theo PL thời điểm tiếp nhận, QĐ chỉ định TCC còn HLDL được tiếp tục đến hết HLDL); Điều 8 Tổ chức thực hiện (VPB + 6 Cục QL chuyên ngành + Sở NN&MT địa phương; Cục QL chuyên ngành đề xuất cập nhật DM, hướng dẫn, rà soát QCVN). Phụ lục I - 466 dòng HS / 66 nhóm con thuộc 8 nhóm lớn rủi ro TRUNG BÌNH (loai_tac_dong=CONG_BO_HOP_QUY): 1) Giống cây trồng (1.1 lúa 1006.10.10; 1.2 ngô 1005.10.00); 2) Phân bón (2/2.1.2/2.2/2.2.4-6/2.3/2.5/2.5.5/2.5.9 → 31.01-31.05 gồm phân hữu cơ, N, P, K, hỗn hợp); 3) Thức ăn chăn nuôi (3.1.1-3.1.3, 3.2, 3.3, 3.4 + 3.4.2/3.4.6/3.4.7/3.4.9/3.4.15/3.4.16/3.4.18/3.4.19/3.4.20/3.4.21, 3.5.1, 3.5.2.1, 3.5.2.3, 3.5.2.6, 3.5.7 → chế phẩm/nguyên liệu/vitamin-khoáng/phụ gia TA chăn nuôi); 4) Thuốc Thú y (4.1 + 13 nhóm con: 4.1.1.2, 4.1.1.3, 4.1.2.1, 4.1.3, 4.1.3.4, 4.1.4.2, 4.1.7, 4.1.11, 4.1.13, 4.1.15, 4.2, 4.3, 4.4 → chương 30.02/30.04 gồm kháng sinh, hormone, vắc-xin, enzyme, kháng thể, dược phẩm thú y); 5) Thức ăn thủy sản (5.1.1, 5.1.1.3, 5.1.2.1, 5.1.2.4, 5.1.3.2, 5.1.3.3, 5.1.3.5, 5.1.4 → nguyên liệu/thành phẩm/phụ gia TA thủy sản, rong biển, trứng Artemia); 6) Sản phẩm xử lý môi trường nuôi trồng thủy sản (6.1-6.6, 6.8 → zeolite, dolomite, calcium carbonat, muối khoáng, premix vitamin); 7) Keo dán gỗ (HS 35.06.91.90/35.06.99.00); 8) Máy, thiết bị nông nghiệp (8.1.1 máy phun TBS; 8.2/8.3 máy thu hoạch/cắt cỏ → HS 84.24/84.33). Phụ lục II - 21 dòng HS / 6 nhóm con rủi ro CAO (loai_tac_dong=KIEM_TRA_CHAT_LUONG) về Thuốc bảo vệ thực vật chương 38.08: 1) BVTV (1, 1.1.1 thuốc trừ côn trùng; 1.2.1.1 thuốc trừ nấm; 1.3 thuốc diệt cỏ/trừ mầm; 1.4.1 chất bảo quản/tẩy trắng; 1.5.1 các loại khác → HS 3808.91/3808.92/3808.93/3808.94/3808.99). Đối chiếu: PDF Công báo PDF ngày 18-07-2026 khớp trích yếu + 8 Điều + 2 PL đầy đủ; sổ chưa thấy văn bản sau thay/bãi trên nguồn A (kiểm đến 04-10-2026)"
