    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với: 1. Tổ chức, cá nhân sản xuất, kinh doanh sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao trên lãnh thổ Việt Nam. 2. Tổ chức đánh giá sự phù hợp về chất lượng sản phẩm, hàng hóa thuộc Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao quy định tại Thông tư này.'
      trang_pdf: 2
      sha256_pdf: 6d3b3569e6782ab5052087be946a6ac47eba301fb002c5c7d3ccf0d9489d76e5
    - dieu: 3
      noi_dung: Điều 3. Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình 1. Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình được quy định tại Phụ lục I ban hành kèm theo Thông tư này.
      trang_pdf: 2
