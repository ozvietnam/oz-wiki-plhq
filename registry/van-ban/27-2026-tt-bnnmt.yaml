      noi_dung: Điều 1. Phạm vi điều chỉnh Thông tư này ban hành Danh mục sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao thuộc trách nhiệm quản lý của Bộ Nông nghiệp và Môi trường.
      trang_pdf: 2
