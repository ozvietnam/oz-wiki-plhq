  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/29/VB_22273.pdf, id=106189, SHA-256 f7367c94b83bb6afc68d8513dedee34809dea6a604a9e1d4f9735b6ec17e56e9): Thông báo số 22273/TB-CHQ ngày 28-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Module truyền nhận tín hiệu vô tuyến không dây (LoRa Module, Model TLT01CSI; cấu tạo gồm bản mạch PCB vật liệu FR-4 4 lớp gắn IC vi điều khiển MCU ARM Cortex-M0+ STM32L082KBU6, IC Tuner SX1276 thu phát tín hiệu tần số vô tuyến RF công nghệ LoRa tại băng tần 920 MHz, IC chuyển mạch RF Switch, thạch anh Xtal, cuộn cảm, nắp bảo vệ kim loại Cover Shield, điện trở, tụ điện; kích thước 20 x 22 x 2,7 mm, trọng lượng 2,1 gram, bộ nhớ Flash 128 kB, hỗ trợ giao tiếp UART, I2C, GPIO, SPI; dùng để kết nối các thiết bị với nhau trong hệ thống, truyền và nhận thông tin giám sát điều khiển trạng thái hoạt động của thiết bị qua mạng không dây LPWA), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59; có hiệu lực từ ngày ký'
