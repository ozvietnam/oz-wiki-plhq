ghi_chu: 'Xác định trước mã số mặt hàng Module truyền nhận tín hiệu vô tuyến không dây (LoRa Module, Model TLT01CSI; bản mạch PCB FR-4 4 lớp gắn IC điều khiển MCU STM32L082KBU6, IC Tuner SX1276 băng tần 920 MHz, IC RF Switch, thạch anh Xtal, cuộn cảm, Cover Shield; dùng truyền và nhận thông tin giám sát, điều khiển thiết bị qua mạng không dây LPWA) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.59.'
