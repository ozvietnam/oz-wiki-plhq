    - dieu: 2
      noi_dung: Điều 2. Danh mục, quy cách, chỉ tiêu kỹ thuật, nguồn gốc và hồ sơ khoáng sản làm vật liệu xây dựng xuất khẩu 1. Danh mục, quy cách và chỉ tiêu kỹ thuật các loại khoáng sản làm vật liệu xây dựng được phép xuất khẩu quy định tại Phụ lục I ban hành kèm theo Thông tư này.
      trang_pdf: 2
      sha256_pdf: 48080f0627a2fd1eda6b3735aa9adc8c9470481a1a46b1f99e16eb934300f5bd
    - dieu: 3
      noi_dung: Điều 3. Trách nhiệm thi hành và tổ chức thực hiện 1. Các bộ, ngành và địa phương liên quan phối hợp với Bộ Xây dựng tổ chức kiểm tra định kỳ hoặc đột xuất việc chấp hành pháp luật trong hoạt động xuất khẩu khoáng sản làm vật liệu xây dựng tại các địa phương.
      trang_pdf: 2
      sha256_pdf: 48080f0627a2fd1eda6b3735aa9adc8c9470481a1a46b1f99e16eb934300f5bd
    - dieu: 4
      noi_dung: Điều 4. Điều khoản chuyển tiếp Hồ sơ xuất khẩu khoáng sản làm vật liệu xây dựng đã đăng ký tờ khai hải quan trước ngày Thông tư này có hiệu lực được tiếp tục xử lý theo quy định hiện hành tại thời điểm đăng ký tờ khai; trường hợp đăng ký tờ khai mới sau ngày Thông tư có hiệu lực thì thực hiện theo Thông tư này.
      trang_pdf: 3
      sha256_pdf: 48080f0627a2fd1eda6b3735aa9adc8c9470481a1a46b1f99e16eb934300f5bd
    - dieu: 5
      noi_dung: Điều 5. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 6 năm 2026. 2. Thông tư số 04/2021/TT-BXD ngày 30 tháng 6 năm 2021 của Bộ trưởng Bộ Xây dựng về hướng dẫn xuất khẩu khoáng sản làm vật liệu xây dựng hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực thi hành./.
