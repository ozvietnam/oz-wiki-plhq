      noi_dung: Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng 1. Phạm vi điều chỉnh Thông tư này quy định danh mục, quy cách và chỉ tiêu kỹ thuật khoáng sản làm vật liệu xây dựng được phép xuất khẩu thuộc nhóm II và nhóm III theo quy định tại khoản 38 Điều 1 Nghị định số 21/2026/NĐCP ngày 16 tháng 01 năm 2026 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 193/2025/NĐCP ngày 02 tháng 7 năm 2025 quy định chi tiết một số điều và biện pháp thi hành
