ghi_chu: 'Xác định trước mã số mặt hàng Nguyên liệu chế phẩm thực phẩm từ bột ngũ cốc Instant Multigrain Powder (phối trộn từ 21 loại ngũ cốc và hạt đã làm chín bằng lò hấp hơi nước, nghiền mịn qua sàng 24 mesh, dùng sản xuất thức uống, bánh, kẹo, kem) thuộc nhóm 19.01, phân nhóm 1901.90, mã số 1901.90.99.'
