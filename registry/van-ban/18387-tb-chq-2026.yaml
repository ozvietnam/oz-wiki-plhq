  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/2/7.VB_18387.pdf, id=104989, SHA-256 d5ffcc36466d93bc1b545f3d4a2fd1afe088ab332e12834ccb208ccd00b87921): Thông báo số 18387/TB-CHQ ngày 01-07-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 18387/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Nguyên liệu thực phẩm: Bột ngũ cốc (Instant Multigrain Powder, nhà sản xuất Nexus Wise Sdn Bhd., thành phần gồm 21 loại hạt/ngũ cốc: mầm lúa mì hữu cơ 22%, yến mạch hữu cơ 21%, lúa mì hữu cơ 7%, kiều mạch hữu cơ 5%, kiều mạch đen hữu cơ 5%, gạo nếp đen 5%, gạo lứt hữu cơ 4%, lúa mạch 4%, gạo lứt đỏ hữu cơ 4%, kê đen hữu cơ 3%, gạo tím tự nhiên hữu cơ 3%, gạo đen hữu cơ 2%, gạo Calrose 2%, gạo lứt Ngọc Trai Nhật Bản 2%, mầm yến mạch hữu cơ 2%, cao lương 2%, gạo nếp 2%, hạt Gorgon 2%, kê hữu cơ 1%, kê xanh hữu cơ 1%, gạo 1%; làm sạch, tách vỏ, làm chín bằng lò hấp hơi nước, phân loại, nghiền, sàng 24 mesh, hàm ẩm <= 12%; dùng trong sản xuất thức uống, bánh, kẹo, kem), phân loại vào nhóm 19.01, phân nhóm 1901.90, mã số 1901.90.99; có hiệu lực từ ngày ký'
