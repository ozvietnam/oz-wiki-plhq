  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về việc quản lý, vận hành Hệ thống đăng ký quốc gia về hạn ngạch phát thải khí nhà kính và tín chỉ các-bon (sau đây gọi là Hệ thống đăng ký quốc gia).'
      trang_pdf: 1
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 2
      noi_dung: '1. Đơn vị trực thuộc Bộ Nông nghiệp và Môi trường. 2. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam (VSDC). 3. Sở Giao dịch chứng khoán Việt Nam (VNX). 4. Sở Giao dịch chứng khoán Hà Nội (HNX). 5. Cơ quan, tổ chức có cơ sở được phân bổ hạn ngạch phát thải khí nhà kính quy định tại khoản 2 Điều 12 Nghị định số 06/2022/NĐ-CP ngày 07 tháng 01 năm 2022 của Chính phủ quy định giảm nhẹ phát thải khí nhà kính và bảo vệ tầng ôdôn được sửa đổi, bổ sung bởi Nghị định số 119/2025/NĐ-CP ngày 09 tháng 6 năm 2025 của Chính phủ (sau đây gọi là Nghị định số 06/2022/NĐ-CP được sửa đổi, bổ sung bởi Nghị định số 119/2025/NĐ-CP). 6. Cơ quan, tổ chức trên lãnh thổ Việt Nam có chương trình, dự án đăng ký theo các cơ chế trao đổi, bù trừ tín chỉ các-bon quy định tại khoản 5 Điều 3 Nghị định số 06/2022/NĐ-CP được sửa đổi, bổ sung bởi Nghị định số 119/2025/NĐ-CP. 7. Cơ quan, tổ chức khác có liên quan đến việc quản lý, vận hành, sử dụng Hệ thống đăng ký quốc gia.'
      trang_pdf: 2
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 5
      noi_dung: 'Điều 5. Đối tượng được cấp tài khoản đăng ký Cơ quan, tổ chức quy định tại khoản 5, khoản 6 Điều 2 Thông tư này được cấp tài khoản đăng ký trên Hệ thống đăng ký quốc gia.'
      trang_pdf: 3
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 6
      khoan: 1
      noi_dung: '1. Cơ quan, tổ chức được cấp tài khoản đăng ký chỉ được cấp duy nhất một tài khoản đăng ký trên Hệ thống đăng ký quốc gia. Trường hợp cơ quan, tổ chức có nhiều hơn 01 cơ sở được phân bổ hạn ngạch phát thải khí nhà kính thì cơ quan, tổ chức đó sử dụng tài khoản đăng ký được cấp để thực hiện quản lý, theo dõi các hạn ngạch phát thải khí nhà kính và thực hiện nghĩa vụ tuân thủ theo từng cơ sở.'
      trang_pdf: 3
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 9
      khoan: 1
      noi_dung: '1. Trong thời hạn 05 ngày làm việc kể từ ngày Quyết định về việc phân bổ hạn ngạch phát thải khí nhà kính có hiệu lực, Bộ Nông nghiệp và Môi trường hoàn thành việc đăng ký hạn ngạch phát thải khí nhà kính trên Hệ thống đăng ký quốc gia. Thông tin đăng ký hạn ngạch phát thải khí nhà kính gồm: a) Thông tin về hạn ngạch phát thải khí nhà kính được phân bổ gồm: giai đoạn phân bổ; tổng số lượng hạn ngạch phát thải khí nhà kính kèm theo số sê-ri tương ứng; mã trong nước của hạn ngạch phát thải khí nhà kính; b) Thông tin về cơ quan, tổ chức sở hữu hạn ngạch phát thải khí nhà kính gồm: Danh sách cơ quan, tổ chức sở hữu hạn ngạch phát thải khí nhà kính; Thông tin về từng cơ quan, tổ chức sở hữu hạn ngạch phát thải khí nhà kính gồm: tên cơ quan, tổ chức; mã số thuế của cơ quan, tổ chức; tên cơ sở được phân bổ hạn ngạch phát thải khí nhà kính thuộc cơ quan, tổ chức; số lượng hạn ngạch phát thải khí nhà kính được phân bổ cho từng cơ sở thuộc cơ quan, tổ chức; số sêri tương ứng với số lượng hạn ngạch phát thải khí nhà kính được phân bổ cho từng cơ sở thuộc cơ quan, tổ chức.'
      trang_pdf: 6
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 10
      khoan: 1
      noi_dung: '1. Đối với tín chỉ các-bon theo cơ chế trao đổi, bù trừ tín chỉ các-bon trong nước, trong thời hạn 05 ngày làm việc kể từ ngày Bộ Nông nghiệp và Môi trường nhận được thông báo từ bộ quản lý lĩnh vực về việc cấp tín chỉ các-bon hoặc kể từ ngày Bộ Nông nghiệp và Môi trường ban hành quyết định cấp tín chỉ các-bon, Bộ Nông nghiệp và Môi trường hoàn thành việc đăng ký tín chỉ các-bon trên Hệ thống đăng ký quốc gia.'
      trang_pdf: 7
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 20
      noi_dung: 'Điều 20. Sử dụng tín chỉ các-bon để bù trừ phát thải khí nhà kính 1. Chủ tài khoản đăng ký sử dụng tín chỉ các-bon để bù trừ phát thải khí nhà kính theo quy định tại khoản 8 Điều 19 Nghị định số 06/2022/NĐ-CP được sửa đổi, bổ sung tại Nghị định số 119/2025/NĐ-CP. Hệ thống đăng ký quốc gia chuyển số lượng tín chỉ các-bon từ tiểu khoản Đăng ký chung sang tiểu khoản Bù trừ. Trường hợp số tín chỉ các-bon đề nghị sử dụng bù trừ vượt quá số dư tín chỉ các-bon trên tiểu khoản Đăng ký chung hoặc vượt quá số lượng tín chỉ các-bon được sử dụng để bù trừ, Hệ thống đăng ký quốc gia gửi thông báo từ chối tới chủ tài khoản đăng ký. 2. Bộ Nông nghiệp và Môi trường điều chỉnh giảm số lượng đăng ký tín chỉ trên tiểu khoản Đăng ký chung, tăng số lượng đăng ký hạn ngạch phát thải khí nhà kính trên tiểu khoản Nộp trả tương ứng với số lượng tín chỉ các-bon sử dụng bù trừ, thực hiện hủy đăng ký lượng tín chỉ các-bon sử dụng bù trừ tại tiểu khoản Bù trừ trên Hệ thống đăng ký quốc gia; gửi cho chủ tài khoản đăng ký thông tin về tín chỉ các-bon đã được sử dụng để bù trừ phát thải khí nhà kính qua hình thức điện tử.'
      trang_pdf: 16
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
    - dieu: 28
      noi_dung: 'Điều 28. Hiệu lực thi hành — Thông tư này có hiệu lực thi hành kể từ ngày 30 tháng 3 năm 2026.'
      trang_pdf: 23
      sha256_pdf: 6ed80e9a4711d07a228711605a7c12ede879df1747044d65ae17aa4d64a75a3d
