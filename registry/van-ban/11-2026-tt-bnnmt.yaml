  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=217020) và toàn văn PDF đính kèm trên datafiles.chinhphu.vn (11-bnnmt.pdf): ban hành ngày 13-02-2026, có hiệu lực thi hành từ ngày 30-03-2026; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
