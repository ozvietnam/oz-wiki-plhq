  pham_vi: 'đối chiếu toàn văn PDF ký số ngày 28-08-2026 bởi Thứ trưởng Nguyễn Hoàng Hiệp trên Cổng TTĐT Bộ Nông nghiệp và Môi trường (mae.gov.vn ItemID=3612): căn cứ Thông tư 22/2026/TT-BNNMT ngày 19-05-2026; Điều 1 công bố kèm theo Phụ lục 01 TTHC cấp trung ương được sửa đổi, bổ sung (thủ tục cấp Giấy chứng nhận kiểm dịch thực vật nhập khẩu, quá cảnh và vận chuyển nội địa, mã TTHC 1.004038); khoản 1 Điều 2 có hiệu lực từ 01-09-2026; khoản 2 Điều 2 bãi bỏ nội dung tại số thứ tự 15 phần I Mục A Phần I và nội dung cụ thể tại Phần II kèm theo Quyết định 1000/QĐ-BNNMT ngày 22-04-2025'
