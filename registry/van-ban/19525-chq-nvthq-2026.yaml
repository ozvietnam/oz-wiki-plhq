xac_minh:
  muc: NGUON_A
  pham_vi: >-
    đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan
    (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/7/30/VB_19525.pdf, id=105268, SHA-256
    5abfd1192eb089f1f4a3357e4dbb58f84205c7a4d122c47f736bb31f03281a4c): Công văn số 19525/CHQ-NVTHQ ngày 28-07-2026 của
    Cục Hải quan thông báo bổ sung Tuyển tập ý kiến phân loại của Tổ chức Hải quan Thế giới (WCO) theo kết quả phiên họp
    lần thứ 77 của Nhóm công tác và Ủy ban HS tại Brussels (Bỉ) tháng 03/2026 (WP77 và HSC77) làm tài liệu tham khảo
    phục vụ phân loại hàng hóa xuất khẩu, nhập khẩu theo Danh mục hàng hóa xuất khẩu, nhập khẩu Việt Nam (gồm 14 ý kiến
    phân loại thuộc các phân nhóm: 1806.20 mục 1 chế phẩm thực phẩm bột whey protein trên 80% chứa bột ca cao giảm béo
    đóng gói bán lẻ 2,27 kg; 2103.10 mục 1 nước xốt đậu tương vị nấm dạng lỏng; 2715.00 mục 3 hỗn hợp bitum dầu mỏ biến
    tính bằng polyme; 3920.49 mục 1 màng trang trí PVC không xốp; 6307.90 mục 9 khăn quấn trẻ sơ sinh bằng vải; 7223.00
    mục 1 và 2 sản phẩm thép không gỉ tạo hình nguội theo Chú giải 1(e) và 1(o) Chương 72; 8517.79 mục 6 khối thu phát
    vô tuyến từ xa RRU trạm gốc theo Chú giải 2(b) Phần XVI; 8536.69 mục 1 bộ chia ổ cắm đa năng 4 ổ cắm; 8544.42 mục 1,
    2 và 3 ổ cắm điện kéo dài nhiều ổ cắm và cuộn cáp 4 ổ cắm theo Chú giải 3 Phần XVI; 8704.10 mục 1 xe tự đổ chạy động
    cơ diesel sử dụng ngoài đường trường; 9619.00 mục 1 và 2 tã vải và miếng lót bỉm có thể giặt được); trường hợp có sự
    không thống nhất giữa mô tả tiếng Việt và tiếng Anh thì áp dụng mô tả tiếng Anh; đang còn hiệu lực
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: >-
  Bản dịch song ngữ Anh - Việt Phụ lục bổ sung Tuyển tập ý kiến phân loại của WCO tại phiên họp lần thứ 77 (WP77 và
  HSC77 tháng 03/2026, 13 trang). Lưu ý lỗi gõ tại dòng tiêu đề Phụ lục trang 2 ghi "ngày 28 tháng 7 năm 2025" (trang 1
  công văn và chữ ký số Cục Hải quan ký ngày 28/07/2026 15:51:51 +07:00).
