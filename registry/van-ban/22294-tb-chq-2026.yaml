ghi_chu: 'Xác định trước mã số mặt hàng Chất bảo quản dựa trên benzisothiazolinone và methylisothiazolinone Preventol BM 5 (thành phần: 2-methyl-2H-isothiazol-3-one >=2,5 - <3%, 1,2-benzisothiazol-3(2H)-one >=1,5 - <2,5%, nước >=90 - <100%; dạng chất lỏng, đóng gói 20 kg/thùng, dùng bảo quản các chế phẩm kỹ thuật gốc nước như sơn, polyme nhũ tương, lớp phủ giấy, mực in, chất kết dính, chất tẩy rửa) thuộc nhóm 38.08, mã số 3808.99.90.'
