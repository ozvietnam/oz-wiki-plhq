  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/29/VB_22294.pdf, id=106188, SHA-256 72e069bb44f708ee2f644b209fae179bdc2cad7b17954368f727a50017d6a499): Thông báo số 22294/TB-CHQ ngày 28-09-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chất bảo quản dựa trên benzisothiazolinone và methylisothiazolinone Preventol BM 5 (thành phần gồm 2-methyl-2H-isothiazol-3-one CAS 2682-20-4 hàm lượng >=2,5 - <3%, 1,2-benzisothiazol-3(2H)-one CAS 2634-33-5 hàm lượng >=1,5 - <2,5%, nước CAS 7732-18-5 hàm lượng >=90 - <100%; dạng chất lỏng gần như trong suốt, không màu đến màu cam nhạt, pH 8,00 - 9,0, khối lượng riêng 1,015 - 1,04 g/cm3, đóng gói 20 kg/thùng; dùng để bảo quản các chế phẩm kỹ thuật gốc nước như sơn và chất phủ gốc nước, polyme nhũ tương, thạch cao, chất độn, bột màu, lớp phủ giấy, mực in, chất kết dính tổng hợp và tự nhiên, chất tẩy rửa), phân loại vào nhóm 38.08, phân nhóm 3808.99, mã số 3808.99.90; có hiệu lực kể từ ngày ban hành'
