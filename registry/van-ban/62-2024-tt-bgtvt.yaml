      noi_dung: '2. Hàng hóa nhập khẩu không thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư này nhưng thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư số 12/2022/TT-BGTVT, đã được cấp bản đăng ký kiểm tra chất lượng an toàn kỹ thuật và bảo vệ môi trường xe nhập khẩu hoặc bản đăng ký kiểm tra chất lượng an toàn kỹ thuật và bảo vệ môi trường phụ tùng xe cơ giới nhập khẩu trước ngày Thông tư này có hiệu lực thì tiếp tục hoàn thành thủ tục chứng nhận chất lượng'
      trang_pdf: 2
      sha256_pdf: 3c3a468bb1488985d04a7be38317567a1a372f12b28f292953b066b931a94cc7
