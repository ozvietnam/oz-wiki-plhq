      noi_dung: '3. Hàng hóa nhập khẩu thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư này nhưng không thuộc danh mục sản phẩm, hàng hóa quy định tại Phụ lục I, Phụ lục II ban hành kèm theo Thông tư số 12/2022/TT-BGTVT, đã đăng ký tờ khai hải quan trước ngày Thông tư này có hiệu lực thì tiếp tục hoàn thành thủ tục nhập khẩu theo quy định tại thời điểm đăng ký tờ khai hải quan./.'
