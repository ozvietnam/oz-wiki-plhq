  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Sửa đổi, bổ sung một số điều của Thông tư số 12/2022/TTBGTVT ngày 30 tháng 6 năm 2022 của Bộ trưởng Bộ Giao thông vận tải quy định danh mục sản phẩm, hàng hóa có khả năng gây mất an toàn thuộc trách nhiệm quản lý nhà nước của Bộ Giao thông vận tải (sau đây viết tắt là Thông tư số 12/2022/TT-BGTVT) 1. Sửa đổi, bổ sung khoản 2 Điều 3 Thông tư số 12/2022/TT-BGTVT như sau: “2. Danh mục sản phẩm, hàng hóa quy định tại Phụ lục II ban hành kèm theo Thông tư này áp dụng nguyên tắc sau: a) Sản phẩm, hàng hóa nhập khẩu phải được chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định sau khi thông quan và trước khi đưa ra thị trường; b) Sản phẩm, hàng hóa sản xuất, lắp ráp trong nước phải được chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định trước khi đưa ra thị trường.”. 2. Bãi bỏ khoản 3 Điều 3 Thông tư số 12/2022/TT-BGTVT. 3. Bỏ cụm từ “Tổng cục” tại khoản 1 Điều 6 Thông tư số 12/2022/TTBGTVT. 4. Thay thế cụm từ “Tổng cục trưởng Tổng cục Đường bộ Việt Nam” tại Điều 7 Thông tư số 12/2022/TT-BGTVT bằng cụm từ “Cục trưởng Cục Đường bộ Việt Nam”. 5. Thay thế Phụ lục I, Phụ lục II ban hành kèm theo Thông tư số 12/2022/TTBGTVT bằng các Phụ lục I, Phụ lục II tương ứng ban hành kèm theo Thông tư này.'
