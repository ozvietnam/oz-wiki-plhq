ghi_chu: 'Xác định trước mã số mặt hàng Bộ ổ cắm điện sử dụng cho điện áp dưới 1000V, dòng điện dưới 16A (ký, mã hiệu T414, nhà sản xuất DELI GROUP CO.,LTD; gồm dây dẫn điện dài 2.4 mét gắn phích cắm và bộ ổ cắm gồm 01 nút công tắc tổng và 07 ổ cắm: 04 ổ cắm thiết bị điện 3 lỗ tại bốn mặt bên, mặt trên gồm 02 ổ cắm sạc cổng USB-type A, 01 ổ cắm sạc cổng USB-type C và 01 công tắc tổng; tối đa 250VAC - 10A, 2500W) thuộc nhóm 85.36, phân nhóm 8536.69, mã số 8536.69.92.'
