  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/9/VB_1152.pdf, id=99779, SHA-256 452d2dc79118e43fbe92aba99b76d05cb7d1d4181c01d5dda05d2690f64a8a8c): Thông báo số 1152/TB-CHQ ngày 04-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ ổ cắm điện sử dụng cho điện áp dưới 1000V, dòng điện dưới 16A (ký, mã hiệu T414, nhà sản xuất DELI GROUP CO.,LTD; gồm dây dẫn điện 03 lõi đồng cách điện plastic dài 2.4 mét gắn phích cắm và bộ ổ cắm gồm 01 nút công tắc tổng và 07 ổ cắm: 04 ổ cắm thiết bị điện 3 lỗ tại bốn mặt bên dùng cho phích cắm 2 hoặc 3 chấu, mặt trên gồm 02 ổ cắm sạc cổng USB-type A 18W, 01 ổ cắm sạc cổng USB-type C 20W và 01 công tắc tổng; điện áp tối đa 250VAC - 10A, công suất chịu tải tối đa 2500W), phân loại vào nhóm 85.36, phân nhóm 8536.69, mã số 8536.69.92; có hiệu lực từ ngày ký'
