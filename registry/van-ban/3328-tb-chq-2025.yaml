ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị thông báo thanh toán chuyển khoản thành công (ký, mã hiệu Tingee 6LS, nhà sản xuất Huizhou BoShiJie Technology Co., Ltd; sản phẩm là loa có chức năng thông báo số tiền chuyển khoản đến tài khoản nhận tiền thành công bằng âm thanh qua kết nối 4G/Wi-Fi, tích hợp màn hình LCD hiển thị số tiền tối đa 7 ký tự tại mặt sau thiết bị, loa 3W, pin Li-ion, trọng lượng 260g) thuộc nhóm 85.18, phân nhóm 8518.21, mã số 8518.21.10.'
