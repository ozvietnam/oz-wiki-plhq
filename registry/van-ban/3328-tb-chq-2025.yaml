  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/4/29/VB_3328.pdf, id=99939, SHA-256 e865b743829a3a7de951f4ac4c81215a423e2c0be54cb17353e6482a675cffe5): Thông báo số 3328/TB-CHQ ngày 25-04-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị thông báo thanh toán chuyển khoản thành công (tên gọi theo cấu tạo, công dụng: Thiết bị thông báo thanh toán chuyển khoản thành công, là loa có chức năng thông báo số tiền chuyển khoản đến tài khoản nhận tiền thành công bằng âm thanh, đồng thời tích hợp màn hình LCD hiển thị số tiền chuyển khoản tối đa 7 ký tự tại mặt sau của thiết bị; ký, mã hiệu Tingee 6LS, nhà sản xuất Huizhou BoShiJie Technology Co., Ltd; CPU ARM Cortex-M3, kết nối 4G/Wi-Fi, loa 4 Ohm 3W, pin Li-ion 2000mAh/2500mAh, cổng sạc Type-C DC 5V/1A, trọng lượng 260g), phân loại vào nhóm 85.18, phân nhóm 8518.21, mã số 8518.21.10; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
