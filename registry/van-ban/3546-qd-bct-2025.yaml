xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu trên Cổng Thông tin điện tử Bộ Công Thương (moit.gov.vn) và toàn văn PDF Quyết định số 2652/QĐ-BCT ngày 13-10-2026 (QD_2652_ap_thue_vu_viec_ER01_AD10_fd85a.pdf): tại phần Căn cứ và khoản 5 Điều 4 Quyết định 2652/QĐ-BCT dẫn nguyên văn Quyết định số 3546/QĐ-BCT ngày 03-12-2025 của Bộ trưởng Bộ Công Thương về kết quả rà soát lần thứ hai việc áp dụng biện pháp chống bán phá giá đối với một số sản phẩm sợi dài làm từ polyester có xuất xứ từ Cộng hòa Nhân dân Trung Hoa, Cộng hòa Ấn Độ, Cộng hòa In-đô-nê-xi-a và Ma-lai-xi-a (mã vụ việc AR02.AD10, được sửa đổi, bổ sung bởi Quyết định 3600/QĐ-BCT ngày 10-12-2025). Theo Điều 3 và khoản 5 Điều 4 Quyết định 2652/QĐ-BCT (kết quả rà soát cuối kỳ ER01.AD10), Quyết định 3546/QĐ-BCT hết hiệu lực thi hành kể từ ngày 16-10-2026.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Kết quả rà soát lần thứ hai (AR02.AD10) biện pháp chống bán phá giá đối với sản phẩm sợi dài làm từ polyester (PFY, dẫn tại 6 mã HS trong biểu thuế); được sửa đổi, bổ sung bởi Quyết định 3600/QĐ-BCT ngày 10-12-2025 (chưa có trong sổ) và đã hết hiệu lực từ ngày 16-10-2026 theo khoản 5 Điều 4 Quyết định 2652/QĐ-BCT ngày 13-10-2026 về kết quả rà soát cuối kỳ (ER01.AD10, đã có trong sổ: 2652-qd-bct-2026.yaml).'
toan_van: chua_co
