    - dieu: 1
      khoan: 4
      noi_dung: Điều 16a. Kiểm tra, giám sát hải quan đối với hàng hóa xuất khẩu, nhập khẩu qua nền tảng thương mại điện tử 1. Hàng hóa xuất khẩu, nhập khẩu qua nền tảng thương mại điện tử phải làm thủ tục hải quan, chịu sự kiểm tra, giám sát hải quan. 2. Tổ chức, cá nhân tại Việt Nam khi mua, bán hàng hóa với nước ngoài qua nền tảng thương mại điện tử phải thực hiện định danh, xác thực điện tử. Chủ quản nền tảng thương mại điện tử có trách nhiệm kết nối với hệ thống xử lý dữ liệu về thương mại điện tử của cơ quan hải quan khi thực hiện định danh, xác thực điện tử. 3. Chủ quản nền tảng thương mại điện tử, doanh nghiệp kinh doanh kho ngoại quan, doanh nghiệp vận chuyển hoặc đại lý của doanh nghiệp vận chuyển, tổ chức, cá nhân có liên quan đến hàng hóa xuất khẩu, nhập khẩu qua nền tảng thương mại điện tử có trách nhiệm cung cấp thông tin liên quan đến hàng hóa cho cơ quan hải quan. 4. Chính phủ quy định chi tiết Điều này.
      trang_pdf: 2
      sha256_pdf: 619c90ed814784441acb644f14c87e33b87c3197c8327bec853e8b1a10ee4d6f
    - dieu: 1
      khoan: 6
      noi_dung: 'Điều 17a. Quản lý tuân thủ trong quản lý hải quan 1. Cơ quan hải quan thực hiện quản lý tuân thủ trong quản lý hải quan, bao gồm: thu thập, xử lý thông tin, dữ liệu hải quan; xây dựng, quản lý hồ sơ tuân thủ; giám sát, đánh giá tuân thủ; thực hiện các biện pháp hỗ trợ người khai hải quan tuân thủ tự nguyện và áp dụng các biện pháp quản lý phù hợp theo mức độ tuân thủ pháp luật. Cơ quan hải quan quản lý hệ thống thông tin nghiệp vụ, ứng dụng công nghệ số, dữ liệu lớn, trí tuệ nhân tạo để thực hiện quản lý tuân thủ trong quản lý hải quan. 2. Người khai hải quan tuân thủ pháp luật được xem xét ưu tiên thực hiện thủ tục hải quan, miễn, giảm mức độ kiểm tra, giám sát hải quan, kiểm tra sau thông quan và các hoạt động nghiệp vụ khác đối với hoạt động xuất khẩu, nhập khẩu, xuất cảnh, nhập cảnh, quá cảnh. 3. Chính phủ quy định chi tiết Điều này.'
      trang_pdf: 3
      sha256_pdf: 619c90ed814784441acb644f14c87e33b87c3197c8327bec853e8b1a10ee4d6f
    - dieu: 1
      khoan: 24
      noi_dung: Điều 77. Kiểm tra sau thông quan 1. Kiểm tra sau thông quan là hoạt động kiểm tra của cơ quan hải quan đối với hồ sơ hải quan, sổ kế toán, chứng từ kế toán và các chứng từ khác, tài liệu, dữ liệu có liên quan đến hàng hóa; kiểm tra thực tế hàng hóa trong trường hợp cần thiết và còn điều kiện sau khi hàng hóa đã được thông quan. 2. Việc kiểm tra sau thông quan nhằm đánh giá tính chính xác, trung thực nội dung các chứng từ, hồ sơ mà người khai hải quan đã khai, nộp, xuất trình với cơ quan hải quan; đánh giá và nâng cao việc tuân thủ pháp luật về hải quan và các quy định khác của pháp luật có liên quan đến quản lý xuất khẩu, nhập khẩu của người khai hải quan. 3. Kiểm tra sau thông quan được thực hiện tại trụ sở cơ quan hải quan, trụ sở người khai hải quan. Trụ sở người khai hải quan bao gồm trụ sở chính, chi nhánh, cửa hàng, nơi sản xuất, nơi lưu giữ hàng hóa theo quy định của pháp luật có liên quan. 4. Kiểm tra sau thông quan được thực hiện trong thời gian tối đa là 05 năm kể từ ngày đăng ký tờ khai hải quan đến ngày ban hành quyết định kiểm tra sau thông quan. 5. Kiểm tra sau thông quan được thực hiện trên cơ sở áp dụng quản lý rủi ro, quản lý tuân thủ và ứng dụng công nghệ số. 6. Chính phủ quy định chi tiết Điều này.
