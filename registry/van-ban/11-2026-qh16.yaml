      diem: d
      noi_dung: 'Người khai hải quan bao gồm: chủ hàng hóa; chủ phương tiện vận tải; người điều khiển phương tiện vận tải; doanh nghiệp kinh doanh dịch vụ bưu chính, doanh nghiệp kinh doanh dịch vụ chuyển phát nhanh quốc tế; chủ quản nền tảng thương mại điện tử; người thực hiện dịch vụ quá cảnh, trung chuyển hàng hóa; đại lý làm thủ tục hải quan, người được chủ hàng hóa, chủ phương tiện vận tải ủy quyền thực hiện thủ tục hải quan.'
