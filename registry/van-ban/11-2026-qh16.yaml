ghi_chu: 'Bỏ loại hình kho bảo thuế (Điều 4 chuyển tiếp: NVL tồn kho bảo thuế xử lý trong 06 tháng); bổ sung Điều 16a kiểm tra, giám sát hải quan hàng hóa XNK qua nền tảng thương mại điện tử (Điều 1 khoản 4). Đầu mối: trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) — mọi thông tin dưới đây lấy từ nguồn bậc A, không lấy từ trang đó.'
