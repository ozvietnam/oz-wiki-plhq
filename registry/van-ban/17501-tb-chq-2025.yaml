xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/8/2/VB_17501.pdf, id=100871, SHA-256 122d254b1e6110ee179d1e52519cd5c561be62f085647401b5c4925a49be7f97): Thông báo số 17501/TB-CHQ ngày 01-08-2025 của Cục Hải quan về thông tin tài khoản thu NSNN; căn cứ QĐ 382/QĐ-BTC (26-02-2025) sửa đổi bởi QĐ 2019/QĐ-BTC (11-06-2025); tiếp theo Thông báo 11801/TB-CHQ ngày 30-06-2025, cập nhật sửa đổi, bổ sung thông tin thu của một số đơn vị Hải quan cửa khẩu/ngoài cửa khẩu thuộc Chi cục HQKV X, XIII, XIV, XIX (phụ lục kèm theo — danh sách đơn vị và mã KBNN); người ký Mai Thị Vân Anh; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
  boi: gd-bo-ba@ozvietnam
ghi_chu: 'TB tài khoản thu NSNN — không phải XDTMS. Cập nhật thông tin KBNN/tài khoản thu của đơn vị thuộc HQKV X (Hải quan Sơn La 12F1, Đội Chiềng Khương 12B1), HQKV XIII (Hải quan Đà Lạt 40D1), HQKV XIV (Hải quan Buôn Ma Thuột 40BC), HQKV XIX (Hải quan Cà Mau 59BD). Văn bản gốc nêu tiếp theo 11801/TB-CHQ ngày 30-06-2025 — 11801 chưa có trong sổ nên chưa gắn quan_he.sua_doi (tránh điểm mù Cao); nạp 11801 rồi bổ sung quan hệ.'
