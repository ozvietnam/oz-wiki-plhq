xac_minh:
  muc: NGUON_A
  pham_vi: "Đối chiếu thẻ vanban.chinhphu.vn (docid=189520), toàn văn PDF ký số (46.signed.pdf, Thủ tướng Nguyễn Xuân Phúc ký) và CSDL quốc gia vbpl.vn (ItemID=133934): số hiệu 46/2017/NĐ-CP, ban hành ngày 21-04-2017, có hiệu lực thi hành từ ngày 21-04-2017 theo khoản 1 Điều 114, quy định về điều kiện đầu tư và hoạt động trong lĩnh vực giáo dục (đính chính trích yếu và quan hệ sửa đổi bị ghi nhầm từ nguồn thứ cấp — văn bản sửa đổi 131/2013/NĐ-CP là 28/2017/NĐ-CP và văn bản sửa đổi 99/2013/NĐ-CP là 46/2024/NĐ-CP). Đã hết hiệu lực toàn bộ từ ngày 20-11-2024 khi bị Nghị định 125/2024/NĐ-CP ngày 05-10-2024 (vanban.chinhphu.vn docid=211562, chưa nạp vào sổ) thay thế."
  hieu_luc_da_doi_chieu: true
  ngay: "2026-11-14"
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: "Trên nguồn A (vanban.chinhphu.vn docid=189520, 46.signed.pdf), Nghị định 46/2017/NĐ-CP ngày 21-04-2017 là văn bản quy định về điều kiện đầu tư và hoạt động trong lĩnh vực giáo dục (có hiệu lực từ 21-04-2017, được sửa đổi, bổ sung bởi NĐ 135/2018/NĐ-CP, hết hiệu lực từ 20-11-2024 bởi NĐ 125/2024/NĐ-CP). Bản ghi sơ bộ ngày 29/10 bị nhầm trích yếu từ NĐ 28/2017/NĐ-CP và NĐ 46/2024/NĐ-CP."
