xac_minh:
  muc: NGUON_A
  pham_vi: "Đối chiếu trên vanban.chinhphu.vn đối với ba nghị định bị sửa đổi và tình trạng hiệu lực từng phần: (1) phần sửa đổi Nghị định 105/2006/NĐ-CP đã hết hiệu lực phần bảo vệ quyền tác giả, quyền liên quan từ 26-04-2023 theo khoản 2 Điều 115 Nghị định 17/2023/NĐ-CP (docid=207842) và hết hiệu lực toàn bộ từ 30-12-2025 khi Nghị định 285/2025/NĐ-CP (docid=215767) bãi bỏ toàn bộ Nghị định 105/2006/NĐ-CP; (2) phần sửa đổi Nghị định 99/2013/NĐ-CP tiếp tục được sửa đổi, bổ sung bởi Nghị định 126/2021/NĐ-CP (docid=204924, hiệu lực 01-03-2022) và Nghị định 46/2024/NĐ-CP (docid=210183, hiệu lực 01-07-2024); (3) phần sửa đổi Nghị định 131/2013/NĐ-CP cùng mạch với Nghị định 28/2017/NĐ-CP (docid=188924, hiệu lực 05-05-2017) vẫn còn hiệu lực (lưu ý: trên cổng Chính phủ docid=189520, số ký hiệu 46/2017/NĐ-CP ngày 21-04-2017 là Nghị định quy định về điều kiện đầu tư và hoạt động trong lĩnh vực giáo dục)"
  hieu_luc_da_doi_chieu: true
  ngay: "2026-11-14"
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: "Hết hiệu lực một phần: phần sửa NĐ 105/2006/NĐ-CP hết hiệu lực theo NĐ 17/2023/NĐ-CP (26-04-2023) và NĐ 285/2025/NĐ-CP (30-12-2025); phần sửa NĐ 99/2013/NĐ-CP đã được sửa đổi tiếp bởi NĐ 126/2021/NĐ-CP và NĐ 46/2024/NĐ-CP."
