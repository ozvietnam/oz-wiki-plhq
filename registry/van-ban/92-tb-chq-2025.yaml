ghi_chu: 'Xác định trước mã số mặt hàng Thiết bị truyền nhận dữ liệu gồm 02 thiết bị SFP+ gắn ở hai đầu sợi cáp truyền dữ liệu dài 1m (HPE Aruba Networking 10G SFP+ to SFP+ 1m Direct Attach Copper Cable / DAC Cable, ký mã hiệu J9281D, tốc độ 1.0625-10.52 Gbps, dây AWG30, điện áp dưới 80V, không dùng cho viễn thông) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.49.'
