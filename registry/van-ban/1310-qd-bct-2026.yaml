  pham_vi: 'PDF gốc moit.gov.vn QD_gia_han_AC02-AD13_AS01_5d8d1.pdf (9 trang, ký Thứ trưởng Nguyễn Sinh Nhật Tân ngày 02-06-2026): Điều 1 gia hạn biện pháp chống lẩn tránh biện pháp PVTM đối với đường mía (HS 1701.13.00, 1701.14.00, 1701.91.00, 1701.99.10, 1701.99.90, 1702.90.91) xuất xứ Campuchia, Indonesia, Lào, Malaysia, Myanmar (thuế CBPG 42,99% + CTC 4,65%, trừ 8 công ty được miễn tại Mục 3.2 Thông báo kèm theo); Điều 2 hiệu lực từ 16-06-2026; Điều 3 cho hết hiệu lực 7 QĐ (1514/QĐ-BCT ngày 01-08-2022, 2960/QĐ-BCT ngày 30-12-2022, 783/QĐ-BCT ngày 28-03-2023, 1407/QĐ-BCT ngày 10-06-2024, 662/QĐ-BCT ngày 12-03-2025, 1908/QĐ-BCT ngày 01-07-2025, 2868/QĐ-BCT ngày 13-10-2025); Mục 2 Thông báo kèm theo quy định thời hạn áp dụng theo thời hạn của QĐ 1309/QĐ-BCT ngày 02-06-2026 (đến hết 15-06-2031). Chưa thấy văn bản sau thay/bãi 1310/QĐ-BCT (kiểm đến 12-11-2026).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-12'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Gia hạn việc áp dụng biện pháp chống lân tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường mía nhập khẩu vào Việt Nam được phân loại theo mã HS: 1701.13.00; 1701.14.00; 1701.91.00; 1701.99.10; 1701.99.90; và 1702.90.91 có xuất xứ từ Vương quốc Cam-pu-chia, Cộng hòa In- đô-nê-xi-a, Cộng hòa dân chủ nhân dân Lào, Ma-lai-xi-a và Cộng hòa liên bang Mi-an-ma với nội dung chỉ tiết nêu tại Thông báo kèm theo Quyết định này.'
      trang_pdf: 3
    - dieu: 2
      noi_dung: Điều 2. Quyết định này có hiệu lực thi hành kể từ ngày 16 tháng 6 năm 2026.
      trang_pdf: 3
    - dieu: 3
      noi_dung: 'Điều 3. Ké từ ngày Quyết định này có hiệu lực, các Quyết định sau hết hiệu lực thi hành: 1. Quyết định số 1514/QD-BCT ngày 01 tháng 8 năm 2022 của Bộ trưởng Bộ Công Thương về việc áp dụng biện pháp chống lẫn tránh biện pháp phòng vệ thương mại đối với một số sản phâm đường mía;'
      trang_pdf: 3
    - dieu: 4
      noi_dung: Điều 4. Các Quyết định miễn trừ việc áp dụng biện pháp chống lan tránh biện pháp phòng vệ thương mại đối với một số sản phẩm đường nêu tại Điều | Quyết định này đã được Bộ trưởng Bộ Công Thương ban hành trước ngày Quyết định này có hiệu lực, tiếp tục được thực hiện đến hết thời hạn hiệu lực của Quyết định miễn trừ đó.
      trang_pdf: 4
    - dieu: 5
      noi_dung: 'Điều 5. Chánh Văn phòng Bộ, Cục trưởng Cục Phòng vệ thương mại, Thủ trưởng các đơn vi và các bên liên quan chịu trách nhiệm thi hành Quyết định này./. . KT. BỘ TRƯỞNG Tnhh THỨ TRƯỞN - Như Điều 5; - Văn phòng Chính phủ; - Các Bộ: TC, NN&MT, NG, KHCN; - Bộ trưởng; - Các Thứ trưởng; - Các website: Chính phủ, Bộ Công Thương; - Cục Hải quan — Bộ Tài chính; - Các Cục: CN, XNK, DCK; - Các Vụ: TINN, DB, PC; - Văn phòng BCĐLNHNQT về kinh tế;'
      trang_pdf: 4
