  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/9/22/VB_21205.pdf, id=106020, SHA-256 1df2082f594941ce3dd58f5d89a42a82a630ad0bf50e7395e4bfd89d78be18f5): Thông báo số 21205/TB-CHQ ngày 28-08-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Chất béo bánh kẹo (tên thương mại Wilfil 420; thành phần 100% phân đoạn dầu hạt cọ đã qua xử lý, tinh chế, tẩy trắng, khử mùi và hydro hóa, không chứa chất phụ gia, số CAS 68990-82-9; dạng rắn màu trắng đục, không có mùi hôi, điểm nóng chảy trượt 42 - 44°C, điểm chớp cháy trên 200°C, đóng gói trong thùng IBC 900 kg; dùng trong sản xuất bánh kẹo như nhân kem, lớp phủ, kẹo bơ cứng và thay thế chất béo trong sữa), phân loại vào nhóm 15.17, phân nhóm 1517.90, mã số 1517.90.50; có hiệu lực kể từ ngày ban hành'
