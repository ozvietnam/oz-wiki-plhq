ghi_chu: 'Xác định trước mã số mặt hàng Chất béo bánh kẹo Wilfil 420 (100% phân đoạn dầu hạt cọ đã tinh chế, tẩy trắng, khử mùi và hydro hóa, không chứa phụ gia, số CAS 68990-82-9, dạng rắn màu trắng đục, điểm nóng chảy trượt 42-44°C, đóng gói thùng IBC 900 kg, dùng làm nhân kem, lớp phủ, kẹo bơ cứng và thay thế chất béo trong sữa) thuộc nhóm 15.17, phân nhóm 1517.90, mã số 1517.90.50.'
