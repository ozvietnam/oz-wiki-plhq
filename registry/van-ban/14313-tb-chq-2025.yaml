xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/4/28/VB_14313.pdf, id=103403, SHA-256 18e418f04dfec3601cfe7e5ac5574bad52df47947db69dce6e3aed7ffefb386a): Thông báo số 14313/TB-CHQ ngày 16-07-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Van an toàn dạng van lò xo hai chiều gắn kèm ống dẫn bằng cao su lưu hóa (ký, mã hiệu 1B000694, nhà sản xuất O.M.G. Srl.; cấu tạo gồm thân van bằng nhựa có đường kính trong 23 mm và đường kính ngoài 33 mm, bên trong có 02 lò xo bằng thép gồm 01 lò xo to và 01 lò xo nhỏ, 01 lá van lớn bằng cao su mềm có lỗ thoát khí và 01 lá van nhỏ bằng nhựa; gắn cố định 02 đoạn ống ngắn bằng cao su lưu hóa ở cửa nạp và cửa thoát, gồm ống nối ra ngoài môi trường đường kính ngoài 10 mm, đường kính trong 5.5 mm không gia cố và ống nối vào nắp bình xăng đường kính ngoài 12/7 mm, đường kính trong 6.35 mm có gia cố sợi dệt; dùng kiểm soát và cân bằng áp suất theo hai chiều ra/vào trong bình xăng xe máy so với áp suất không khí bên ngoài), phân loại vào nhóm 84.81, phân nhóm 8481.40, mã số 8481.40.30; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Xác định trước mã số mặt hàng Van an toàn dạng van lò xo hai chiều gắn kèm ống dẫn bằng cao su lưu hóa (ký, mã hiệu 1B000694, nhà sản xuất O.M.G. Srl.; thân van bằng nhựa đường kính trong 23 mm, đường kính ngoài 33 mm, bên trong có 2 lò xo thép, 1 lá van lớn bằng cao su mềm và 1 lá van nhỏ bằng nhựa, kèm 2 đoạn ống dẫn cao su lưu hóa; dùng kiểm soát và cân bằng áp suất trong bình xăng xe máy theo hai chiều ra và vào) thuộc nhóm 84.81, phân nhóm 8481.40, mã số 8481.40.30.'
