ghi_chu: 'Nạp từ nhu cầu khách tra (issue [miss] #402). Hướng dẫn Nghị định 127/2013/NĐ-CP và Nghị định 45/2016/NĐ-CP về xử phạt VPHC và cưỡng chế thi hành quyết định hành chính trong lĩnh vực hải quan (bãi bỏ Thông tư 190/2013/TT-BTC); đã hết hiệu lực khi chuyển sang Nghị định 128/2020/NĐ-CP và Thông tư 90/2020/TT-BTC (sau đó được bãi bỏ bởi Thông tư 77/2022/TT-BTC).'
