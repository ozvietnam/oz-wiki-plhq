xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đọc toàn văn PDF Công báo số 1167+1168 ngày 08-11-2016 (congbaocdn.chinhphu.vn, 91 trang, người ký Thứ trưởng Đỗ Hoàng Anh Tuấn) và đối chiếu thẻ vanban.chinhphu.vn (docid=187090), congbao.chinhphu.vn (ID 21231), CSDLQG vbpl.vn (ID 118969): gồm 3 chương, 43 điều và Phụ lục 60 mẫu biên bản, quyết định, thông báo; Điều 43 khoản 1 quy định có hiệu lực thi hành từ ngày 01-12-2016 và bãi bỏ Thông tư 190/2013/TT-BTC ngày 12-12-2013. Đã đối chiếu tình trạng hiện hành: hết hiệu lực từ ngày 26-12-2020 khi Nghị định 128/2020/NĐ-CP (hiệu lực 10-12-2020 thay thế NĐ 127/2013/NĐ-CP và NĐ 45/2016/NĐ-CP) và Thông tư 90/2020/TT-BTC ngày 11-11-2020 (hiệu lực 26-12-2020) có hiệu lực thi hành.'
