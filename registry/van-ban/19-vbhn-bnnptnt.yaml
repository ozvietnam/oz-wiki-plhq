xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=207302, lưu tại raw/download/vanban.chinhphu.vn/19-vbhn-bnnptnt.html) và toàn văn PDF ký số đính kèm (19bnn.signed.pdf, 41 trang, có lớp chữ, lưu tại raw/download/datafiles.chinhphu.vn/19-vbhn-bnnptnt.pdf): Văn bản hợp nhất số 19/VBHN-BNNPTNT do Thứ trưởng Bộ Nông nghiệp và Phát triển nông thôn Phùng Đức Tiến ký xác thực ngày 30-12-2022, trích yếu "Thông tư quy định về quản lý giống thủy sản, thức ăn thủy sản, sản phẩm xử lý môi trường nuôi trồng thủy sản"; hợp nhất Thông tư 26/2018/TT-BNNPTNT ngày 15-11-2018 (có hiệu lực từ ngày 01-01-2019) và Thông tư 01/2022/TT-BNNPTNT ngày 18-01-2022 (có hiệu lực từ ngày 04-03-2022, Điều 8 sửa đổi, bổ sung Điều 7, Điều 10, Điều 13, Điều 15 và thay thế các Phụ lục II, IV, V của Thông tư 26/2018/TT-BNNPTNT); cấu trúc gồm 4 Chương, 18 Điều và 07 Phụ lục (Phụ lục I–VII). Hết hiệu lực toàn bộ kể từ ngày 09-03-2026 khi cả Thông tư gốc 26/2018/TT-BNNPTNT và Điều 8 cùng các Phụ lục XX, XXI, XXII của Thông tư 01/2022/TT-BNNPTNT hết hiệu lực theo điểm a, điểm b khoản 2 Điều 20 Thông tư 16/2026/TT-BNNMT ngày 09-03-2026 (vanban.chinhphu.vn docid=217170).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Hiệu đính về đúng Văn bản hợp nhất 19/VBHN-BNNPTNT ngày 30-12-2022 về quản lý giống thủy sản, thức ăn thủy sản, sản phẩm xử lý môi trường nuôi trồng thủy sản (vanban.chinhphu.vn docid=207302, 19bnn.signed.pdf). Bản hợp nhất 19/VBHN-BNNPTNT ngày 27-05-2024 về kiểm dịch thực vật (حợp nhất TT 33/2014 + 34/2018 + 15/2021 + 03/2024) đã được tách riêng tại registry/van-ban/19-vbhn-bnnptnt-2024.yaml.'
