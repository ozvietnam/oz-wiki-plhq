xac_minh:
  muc: NGUON_A
  pham_vi: 'PDF ký số 181nd.signed.pdf trên vanban.chinhphu.vn (docid=214336) và PDF Công báo số 899+900, 901+902 ngày 16-07-2025 (có lớp chữ): số hiệu 181/2025/NĐ-CP, trích yếu "Quy định chi tiết thi hành một số điều của Luật Thuế giá trị gia tăng" (hướng dẫn Luật Thuế GTGT số 48/2024/QH15), ngày ký 01-07-2025, người ký Phó Thủ tướng Hồ Đức Phớc. Cấu trúc 4 Chương / 40 Điều / 5 Phụ lục (Phụ lục I: Danh mục tài nguyên, khoáng sản khai thác chưa chế biến thành sản phẩm khác; Phụ lục II: Danh mục tài nguyên, khoáng sản khai thác đã chế biến thành sản phẩm khác; Phụ lục III: Bảng kê hàng hóa bán cho khách xuất cảnh; Phụ lục IV: Hoàn thuế đối với hàng hóa mua tại VN mang theo khi xuất cảnh; Phụ lục V: Xác định tỷ trọng trị giá tài nguyên, khoáng sản và chi phí năng lượng trên giá thành sản phẩm). Chương I (Đ1–5) Quy định chung & Đối tượng không chịu thuế; Chương II (Đ6–22) Căn cứ và phương pháp tính thuế; Chương III (Đ23–37) Khấu trừ, hoàn thuế; Chương IV (Đ38–40) Điều khoản thi hành. Điều 38 (Hiệu lực thi hành): khoản 1 có hiệu lực từ 01-07-2025; khoản 2 thay thế NĐ 209/2013/NĐ-CP (điểm a), NĐ 49/2022/NĐ-CP (điểm b), và thay thế quy định xác định sản phẩm có tổng giá trị tài nguyên, khoáng sản cộng chi phí năng lượng chiếm từ 51% giá thành sản phẩm trở lên tại điểm a khoản 1 Điều 11, khoản 2 Điều 15 NĐ 134/2016/NĐ-CP (đã sửa đổi tại NĐ 18/2021/NĐ-CP) và điểm b khoản 2 Điều 4, Mẫu số 14 Phụ lục II NĐ 26/2023/NĐ-CP bằng Phụ lục V kèm theo NĐ 181/2025/NĐ-CP (điểm c); khoản 3 bãi bỏ Điều 2 NĐ 91/2014/NĐ-CP, Điều 3 NĐ 12/2015/NĐ-CP, Điều 1 NĐ 100/2016/NĐ-CP, Điều 1 NĐ 146/2017/NĐ-CP. Điều 39 quy định chuyển tiếp (khoản 1–3). Đối chiếu tình trạng hiện tại ngày 2026-11-12 trên congbao.chinhphu.vn và vanban.chinhphu.vn: NĐ 181/2025/NĐ-CP đang CON_HIEU_LUC, đã được sửa đổi, bổ sung một phần bởi 2 Nghị định: (1) NĐ 359/2025/NĐ-CP ngày 31-12-2025 (hiệu lực 01-01-2026, docid=216388): bổ sung khoản 1b sau khoản 1 Điều 4, bãi bỏ khoản 3 Điều 37 và khoản 3 Điều 39; (2) NĐ 144/2026/NĐ-CP ngày 05-05-2026 (hiệu lực 20-06-2026, docid=218020): sửa đổi, bổ sung một số khoản tại Điều 4, Điều 9, Điều 23, Điều 26 và tại Điều 5 thay thế Danh mục (Phụ lục I, Phụ lục II) kèm theo NĐ 181/2025/NĐ-CP bằng Danh mục (Phụ lục I, Phụ lục II) kèm theo NĐ 144/2026/NĐ-CP.'
