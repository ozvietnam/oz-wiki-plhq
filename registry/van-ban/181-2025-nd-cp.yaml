ghi_chu: 'Đã sửa tên văn bản và ngày ban hành từ bản ghi crawl sơ bộ ("Biểu thuế VAT", 2025-01-01) về đúng nguyên bản ký số (01-07-2025). Các văn bản bị thay thế/bãi bỏ tại khoản 2, khoản 3 Điều 38 (209/2013/NĐ-CP, 49/2022/NĐ-CP, 91/2014/NĐ-CP, 12/2015/NĐ-CP, 100/2016/NĐ-CP, 146/2017/NĐ-CP) và hai Nghị định sửa đổi, bổ sung sau (359/2025/NĐ-CP ngày 31-12-2025; 144/2026/NĐ-CP ngày 05-05-2026 — trong đó Điều 5 thay thế Phụ lục I và Phụ lục II của NĐ 181/2025/NĐ-CP từ 20-06-2026) được ghi nhận đầy đủ tại pham_vi kèm URL nguồn A, chưa đưa vào quan_he vì các văn bản đó chưa mở mục riêng trong sổ.'
