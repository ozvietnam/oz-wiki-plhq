xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 899+900 ngày 16-07-2025 (raw/download/congbaocdn.chinhphu.vn/181-2025-nd-cp.pdf, 69 trang, trang 31–98 của số Công báo, chứa toàn bộ 40 Điều và phần đầu Phụ lục I, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 17-07-2025, SHA-256 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d), PDF Công báo số 901+902, PDF ký số 181nd.signed.pdf trên vanban.chinhphu.vn (docid=214336) và trang wiki/sources/181-2025-nd-cp.md: số hiệu 181/2025/NĐ-CP, trích yếu "Quy định chi tiết thi hành một số điều của Luật Thuế giá trị gia tăng" (hướng dẫn Luật Thuế GTGT số 48/2024/QH15), ngày ký 01-07-2025, người ký Phó Thủ tướng Hồ Đức Phớc. Cấu trúc 4 Chương / 40 Điều / 5 Phụ lục (Phụ lục I: Danh mục tài nguyên, khoáng sản khai thác chưa chế biến thành sản phẩm khác; Phụ lục II: Danh mục tài nguyên, khoáng sản khai thác đã chế biến thành sản phẩm khác; Phụ lục III: Bảng kê hàng hóa bán cho khách xuất cảnh; Phụ lục IV: Hoàn thuế đối với hàng hóa mua tại VN mang theo khi xuất cảnh; Phụ lục V: Xác định tỷ trọng trị giá tài nguyên, khoáng sản và chi phí năng lượng trên giá thành sản phẩm). Chương I (Đ1–4) Quy định chung & Đối tượng không chịu thuế; Chương II (Đ5–22) Căn cứ và phương pháp tính thuế; Chương III (Đ23–37) Khấu trừ, hoàn thuế; Chương IV (Đ38–40) Điều khoản thi hành. Điều 38 (Hiệu lực thi hành): khoản 1 có hiệu lực từ 01-07-2025; khoản 2 thay thế NĐ 209/2013/NĐ-CP (điểm a), NĐ 49/2022/NĐ-CP (điểm b), và thay thế quy định xác định sản phẩm có tổng giá trị tài nguyên, khoáng sản cộng chi phí năng lượng chiếm từ 51% giá thành sản phẩm trở lên tại điểm a khoản 1 Điều 11, khoản 2 Điều 15 NĐ 134/2016/NĐ-CP (đã sửa đổi tại NĐ 18/2021/NĐ-CP) và điểm b khoản 2 Điều 4, Mẫu số 14 Phụ lục II NĐ 26/2023/NĐ-CP bằng Phụ lục V kèm theo NĐ 181/2025/NĐ-CP (điểm c); khoản 3 bãi bỏ Điều 2 NĐ 91/2014/NĐ-CP, Điều 3 NĐ 12/2015/NĐ-CP, Điều 1 NĐ 100/2016/NĐ-CP, Điều 1 NĐ 146/2017/NĐ-CP. Điều 39 quy định chuyển tiếp (khoản 1–3). Đối chiếu tình trạng hiện tại trên congbao.chinhphu.vn và vanban.chinhphu.vn: NĐ 181/2025/NĐ-CP đang CON_HIEU_LUC, đã được sửa đổi, bổ sung một phần bởi 2 Nghị định: (1) NĐ 359/2025/NĐ-CP ngày 31-12-2025 (hiệu lực 01-01-2026, docid=216388): bổ sung khoản 1b sau khoản 1 Điều 4, bãi bỏ khoản 3 Điều 37 và khoản 3 Điều 39; (2) NĐ 144/2026/NĐ-CP ngày 05-05-2026 (hiệu lực 20-06-2026, docid=218020): sửa đổi, bổ sung một số khoản tại Điều 4, Điều 9, Điều 23, Điều 26 và tại Điều 5 thay thế Danh mục (Phụ lục I, Phụ lục II) kèm theo NĐ 181/2025/NĐ-CP bằng Danh mục (Phụ lục I, Phụ lục II) kèm theo NĐ 144/2026/NĐ-CP.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Nghị định này quy định chi tiết về người nộp thuế tại khoản 1, 4 và khoản 5 Điều 4 và người nộp thuế trong trường hợp nhà cung cấp nước ngoài cung cấp dịch vụ cho người mua là tổ chức kinh doanh tại Việt Nam áp dụng phương pháp khấu trừ thuế quy định tại khoản 4 Điều 4, đối tượng không chịu thuế tại Điều 5, giá tính thuế tại Điều 7, thời điểm xác định thuế giá trị gia tăng tại khoản 2 Điều 8, thuế suất tại khoản 1, 2 Điều 9, phương pháp khấu trừ thuế tại Điều 11, phương pháp tính trực tiếp tại khoản 1 Điều 12, khấu trừ thuế giá trị gia tăng đầu vào tại Điều 14 và hoàn thuế giá trị gia tăng tại Điều 15 của Luật Thuế giá trị gia tăng.'
      trang_pdf: 1
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 2
      khoan: 1
      noi_dung: 'Đối tượng áp dụng của Nghị định này bao gồm: 1. Người nộp thuế quy định tại Điều 3 Nghị định này.'
      trang_pdf: 1
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 4
      khoan: 1
      noi_dung: '1. Sản phẩm cây trồng, rừng trồng, chăn nuôi, thủy sản nuôi trồng, đánh bắt chưa chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường của tổ chức, cá nhân tự sản xuất, đánh bắt bán ra và ở khâu nhập khẩu. Trong đó, các sản phẩm chỉ qua sơ chế thông thường là các sản phẩm mới được làm sạch, phơi, sấy khô, bóc vỏ, xay xát, xay vỡ mảnh, nghiền vỡ mảnh, xay bỏ vỏ, xát bỏ vỏ, tách hạt, tách cọng, cắt, xay, đánh bóng hạt, hồ hạt, chia tách ra từng phần, bỏ xương, băm, lột da, nghiền, cán mỏng, ướp muối, đóng hộp kín khí, bảo quản lạnh (ướp lạnh, đông lạnh), bảo quản bằng khí sunfuro, bảo quản theo phương thức cho hóa chất để tránh thối rữa, ngâm trong dung dịch lưu huỳnh hoặc ngâm trong dung dịch bảo quản khác và các hình thức bảo quản thông thường khác. Trường hợp không xác định được thì Bộ Nông nghiệp và Môi trường có trách nhiệm căn cứ vào quy trình sản xuất sản phẩm cây trồng, rừng trồng, chăn nuôi, thủy sản nuôi trồng, đánh bắt do người nộp thuế cung cấp để xác định là sản phẩm chưa chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường của tổ chức, cá nhân tự sản xuất, đánh bắt bán ra và ở khâu nhập khẩu theo quy định của pháp luật.'
      trang_pdf: 3
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 4
      khoan: 10
      noi_dung: '10. Máy móc, thiết bị, phụ tùng, vật tư thuộc loại trong nước chưa sản xuất được cần nhập khẩu để sử dụng trực tiếp cho hoạt động nghiên cứu khoa học, phát triển công nghệ; máy móc, thiết bị, phụ tùng thay thế, phương tiện vận tải chuyên dùng và vật tư thuộc loại trong nước chưa sản xuất được cần nhập khẩu để tiến hành hoạt động tìm kiếm thăm dò, phát triển mỏ dầu khí; máy bay, trực thăng, tàu lượn, giàn khoan, tàu thuyền thuộc loại trong nước chưa sản xuất được cần nhập khẩu để tạo tài sản cố định của doanh nghiệp hoặc thuê của nước ngoài để sử dụng cho sản xuất, kinh doanh, cho thuê. Trong đó: Danh mục máy móc, thiết bị, phụ tùng, vật tư thuộc loại trong nước đã sản xuất được để làm cơ sở phân biệt với loại trong nước chưa sản xuất được cần nhập khẩu sử dụng trực tiếp cho hoạt động nghiên cứu khoa học và phát triển công nghệ; Danh mục máy móc, thiết bị, phụ tùng thay thế, phương tiện vận tải chuyên dùng và vật tư thuộc loại trong nước đã sản xuất được làm cơ sở phân biệt với loại trong nước chưa sản xuất được cần nhập khẩu để tiến hành hoạt động tìm kiếm thăm dò, phát triển mỏ dầu khí; Danh mục máy bay, trực thăng, tàu lượn, giàn khoan, tàu thuyền thuộc loại trong nước đã sản xuất được làm cơ sở phân biệt với loại trong nước chưa sản xuất được cần nhập khẩu để tạo tài sản cố định của doanh nghiệp hoặc thuê của nước ngoài để sử dụng cho sản xuất, kinh doanh, cho thuê do Bộ Tài chính ban hành.'
      trang_pdf: 6
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 4
      khoan: 12
      noi_dung: '12. Hàng hóa chuyển khẩu, quá cảnh qua lãnh thổ Việt Nam; hàng tạm nhập khẩu, tái xuất khẩu; hàng tạm xuất khẩu, tái nhập khẩu; nguyên liệu nhập khẩu để sản xuất, gia công hàng hóa xuất khẩu theo hợp đồng sản xuất, gia công xuất khẩu ký kết với bên nước ngoài; hàng hóa, dịch vụ được mua bán giữa nước ngoài với các khu phi thuế quan và giữa các khu phi thuế quan với nhau. Hàng hóa nhập khẩu từ nước ngoài của công ty cho thuê tài chính được vận chuyển thẳng vào khu phi thuế quan để cho doanh nghiệp trong khu phi thuế quan thuê tài chính. Khu phi thuế quan thực hiện theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu.'
      trang_pdf: 7
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 4
      khoan: 14
      noi_dung: '14. Sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác chưa chế biến thành sản phẩm khác và sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác đã chế biến thành sản phẩm khác theo định hướng của nhà nước về không khuyến khích xuất khẩu, hạn chế xuất khẩu các tài nguyên, khoáng sản thô được quy định tại Danh mục (Phụ lục I, Phụ lục II) ban hành kèm theo Nghị định này. Trong trường hợp cần thiết phải điều chỉnh sản phẩm xuất khẩu tại Danh mục (Phụ lục I, Phụ lục II) để phù hợp với bối cảnh kinh tế - xã hội trong từng thời kỳ, giao Bộ Tài chính phối hợp với các bộ liên quan báo cáo Chính phủ xem xét, quyết định.'
      trang_pdf: 7
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 4
      khoan: 15
      noi_dung: '15. Hàng hóa nhập khẩu trong trường hợp sau: a) Quà tặng cho cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội, tổ chức chính trị xã hội - nghề nghiệp, tổ chức xã hội, tổ chức xã hội - nghề nghiệp, đơn vị vũ trang nhân dân trong định mức miễn thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu. b) Quà biếu, quà tặng trong định mức miễn thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu của tổ chức, cá nhân nước ngoài cho cá nhân Việt Nam; đồ dùng của tổ chức, cá nhân nước ngoài theo tiêu chuẩn miễn trừ ngoại giao và tài sản di chuyển trong định mức miễn thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu. c) Hàng hoá trong tiêu chuẩn hành lý miễn thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu. d) Hàng hóa nhập khẩu ủng hộ, tài trợ cho phòng, chống, khắc phục hậu quả thảm họa, thiên tai, dịch bệnh, chiến tranh là hàng hóa ủng hộ, tài trợ được các bộ, cơ quan ngang bộ, Ủy ban nhân dân các tỉnh, thành phố, Ủy ban Mặt trận Tổ quốc Việt Nam các tỉnh, thành phố tiếp nhận. Các cơ quan, tổ chức tiếp nhận có trách nhiệm ban hành văn bản tiếp nhận theo đề nghị của tổ chức, cá nhân ủng hộ, tài trợ. đ) Hàng hóa mua bán, trao đổi để phục vụ cho sản xuất, tiêu dùng của cư dân biên giới thuộc Danh mục hàng hóa mua bán, trao đổi của cư dân biên giới theo quy định của pháp luật và trong định mức miễn thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu. e) Di vật, cổ vật, bảo vật quốc gia theo quy định của pháp luật về di sản văn hóa do cơ quan nhà nước có thẩm quyền nhập khẩu bao gồm cả trường hợp ủy quyền và ủy thác nhập khẩu.'
      trang_pdf: 8
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 5
      noi_dung: '1. Đối với hàng hóa, dịch vụ do cơ sở kinh doanh bán ra là giá bán chưa có thuế giá trị gia tăng; đối với hàng hóa, dịch vụ chịu thuế tiêu thụ đặc biệt là giá bán đã có thuế tiêu thụ đặc biệt nhưng chưa có thuế giá trị gia tăng; đối với hàng hóa chịu thuế bảo vệ môi trường là giá bán đã có thuế bảo vệ môi trường nhưng chưa có thuế giá trị gia tăng; đối với hàng hóa chịu thuế tiêu thụ đặc biệt và thuế bảo vệ môi trường là giá bán đã có thuế tiêu thụ đặc biệt và thuế bảo vệ môi trường nhưng chưa có thuế giá trị gia tăng. 2. Đối với hàng hóa nhập khẩu là trị giá tính thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu cộng với thuế nhập khẩu, cộng với các khoản thuế là thuế nhập khẩu bổ sung theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu và pháp luật về quản lý ngoại thương (nếu có), cộng với thuế tiêu thụ đặc biệt (nếu có) và cộng với thuế bảo vệ môi trường (nếu có). a) Trường hợp hàng hóa nhập khẩu được miễn thuế nhập khẩu thì giá tính thuế giá trị gia tăng là trị giá tính thuế nhập khẩu. b) Trường hợp hàng hóa nhập khẩu được giảm thuế nhập khẩu thì giá tính thuế giá trị gia tăng là trị giá tính thuế nhập khẩu cộng (+) với thuế nhập khẩu xác định theo mức thuế phải nộp sau khi đã được giảm. c) Trường hợp hàng hóa nhập khẩu thuộc đối tượng chịu thuế giá trị gia tăng và được miễn thuế nhập khẩu, sau đó thay đổi mục đích sử dụng dẫn đến phát sinh số thuế nhập khẩu phải nộp thì phải nộp thuế giá trị gia tăng bổ sung trên số tiền thuế nhập khẩu phải nộp.'
      trang_pdf: 9
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 15
      noi_dung: '1. Đối với hàng hóa xuất khẩu, thời điểm xác định thuế giá trị gia tăng do người bán tự xác định nhưng chậm nhất không quá ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan. 2. Đối với hàng hóa nhập khẩu, thời điểm xác định thuế giá trị gia tăng là thời điểm xác định thuế nhập khẩu theo quy định của pháp luật về thuế xuất khẩu, thuế nhập khẩu.'
      trang_pdf: 17
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 17
      khoan: 1
      noi_dung: '1. Hàng hóa xuất khẩu bao gồm: a) Hàng hóa từ Việt Nam bán cho tổ chức, cá nhân ở nước ngoài và được tiêu dùng ở ngoài Việt Nam.'
      trang_pdf: 19
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 17
      khoan: 4
      noi_dung: '4. Các trường hợp không áp dụng thuế suất 0% quy định tại điểm b và d khoản 1 Điều 9 Luật Thuế giá trị gia tăng bao gồm: a) Chuyển giao công nghệ, chuyển nhượng quyền sở hữu trí tuệ ra nước ngoài. b) Dịch vụ tái bảo hiểm ra nước ngoài. c) Dịch vụ cấp tín dụng. d) Chuyển nhượng vốn. đ) Sản phẩm phái sinh. e) Dịch vụ bưu chính, viễn thông. g) Sản phẩm xuất khẩu quy định tại khoản 14 Điều 4 của Nghị định này. h) Thuốc lá, rượu, bia nhập khẩu sau đó xuất khẩu. i) Xăng, dầu mua tại nội địa bán cho cơ sở kinh doanh trong khu phi thuế quan; xe ô tô bán cho tổ chức, cá nhân trong khu phi thuế quan. k) Các dịch vụ cung cấp tại Việt Nam cho tổ chức, cá nhân ở nước ngoài như sau: thi đấu thể thao, biểu diễn nghệ thuật, văn hóa, giải trí, hội nghị, khách sạn, đào tạo, quảng cáo, du lịch lữ hành; dịch vụ cung cấp gắn với việc bán, phân phối, tiêu thụ sản phẩm, hàng hóa tại Việt Nam; dịch vụ thanh toán không dùng tiền mặt. l) Các dịch vụ do cơ sở kinh doanh cung cấp cho tổ chức, cá nhân ở trong khu phi thuế quan bao gồm: cho thuê nhà, hội trường, văn phòng, khách sạn, kho bãi; dịch vụ vận chuyển đưa đón người lao động; dịch vụ ăn uống (trừ dịch vụ cung cấp suất ăn công nghiệp, dịch vụ ăn uống trong khu phi thuế quan).'
      trang_pdf: 22
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 25
      noi_dung: 'Cơ sở kinh doanh phải có hóa đơn giá trị gia tăng của hàng hóa, dịch vụ mua vào hoặc chứng từ nộp thuế giá trị gia tăng ở khâu nhập khẩu hoặc chứng từ nộp thuế giá trị gia tăng thay cho phía nước ngoài theo quy định tại điểm a khoản 2 Điều 14 Luật Thuế giá trị gia tăng (bao gồm cả chứng từ nộp thuế giá trị gia tăng theo tỷ lệ % nhân với doanh thu thay cho phía nước ngoài).'
      trang_pdf: 35
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 26
      khoan: 1
      noi_dung: 'Cơ sở kinh doanh phải có chứng từ thanh toán không dùng tiền mặt đối với hàng hóa, dịch vụ mua vào (bao gồm cả hàng hóa nhập khẩu) từ 05 triệu đồng trở lên đã bao gồm thuế giá trị gia tăng. Trong đó: 1. Chứng từ thanh toán không dùng tiền mặt là chứng từ chứng minh việc thanh toán không dùng tiền mặt theo quy định của Nghị định số 52/2024/NĐ-CP ngày 15 tháng 5 năm 2024 của Chính phủ về thanh toán không dùng tiền mặt, trừ các chứng từ bên mua nộp tiền mặt vào tài khoản của bên bán.'
      trang_pdf: 35
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 29
      khoan: 1
      noi_dung: '1. Cơ sở kinh doanh trong tháng, quý có hàng hóa, dịch vụ xuất khẩu nếu có số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết từ 300 triệu đồng trở lên thì được hoàn thuế giá trị gia tăng theo tháng, quý, trừ trường hợp hàng hóa nhập khẩu sau đó xuất khẩu sang nước khác. Trong đó: a) Đối tượng được hoàn thuế trong một số trường hợp xuất khẩu được xác định như sau: đối với trường hợp ủy thác xuất khẩu là cơ sở kinh doanh có hàng hóa ủy thác xuất khẩu; đối với gia công chuyển tiếp là cơ sở kinh doanh ký hợp đồng gia công xuất khẩu với bên nước ngoài; đối với hàng hóa xuất khẩu để thực hiện công trình xây dựng ở nước ngoài là cơ sở kinh doanh có hàng hóa xuất khẩu thực hiện công trình xây dựng ở nước ngoài. b) Hàng hóa nhập khẩu sau đó xuất khẩu sang nước khác là hàng hóa do cơ sở kinh doanh nhập khẩu từ nước ngoài vào Việt Nam sau đó trực tiếp xuất khẩu hoặc ủy thác xuất khẩu, không bao gồm hàng hóa là nguyên liệu nhập khẩu để sản xuất, gia công hàng xuất khẩu.'
      trang_pdf: 46
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 33
      noi_dung: 'Người nước ngoài, người Việt Nam định cư ở nước ngoài (trừ thành viên của Tổ bay theo quy định của pháp luật về hàng không, thành viên của Đoàn thủy thủ theo quy định của pháp luật về hàng hải) mang hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế được hoàn thuế đối với hàng hóa mua tại Việt Nam mang theo khi xuất cảnh. Hồ sơ, thủ tục, số thuế được hoàn, phương thức hoàn thuế đối với trường hợp quy định tại khoản này được quy định tại Phụ lục IV ban hành kèm theo Nghị định này.'
      trang_pdf: 51
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 37
      noi_dung: 'Cơ sở kinh doanh thuộc trường hợp hoàn thuế quy định tại Mục này phải đáp ứng điều kiện sau đây: 1. Cơ sở kinh doanh thuộc trường hợp được hoàn thuế theo quy định tại các Điều 29, Điều 30, Điều 31, Điều 32 Nghị định này phải là cơ sở kinh doanh nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế, lập và lưu giữ sổ kế toán, chứng từ kế toán theo quy định của pháp luật về kế toán; có tài khoản tiền gửi tại ngân hàng theo mã số thuế của cơ sở kinh doanh. 2. Đáp ứng quy định về khấu trừ thuế giá trị gia tăng đầu vào theo quy định tại Mục 2 Chương III và không thuộc trường hợp quy định tại khoản 15 Điều 23 Nghị định này. 3. Người bán đã kê khai, nộp thuế giá trị gia tăng theo quy định đối với hóa đơn đã xuất cho cơ sở kinh doanh đề nghị hoàn thuế được xác định như sau: a) Tại thời điểm cơ sở kinh doanh nộp hồ sơ hoàn thuế, người bán đã nộp hồ sơ khai thuế giá trị gia tăng theo quy định và không còn nợ tiền thuế giá trị gia tăng của kỳ tính thuế tương ứng với kỳ tính thuế thuộc kỳ hoàn thuế của cơ sở kinh doanh đề nghị hoàn thuế. b) Cơ quan quản lý thuế tại thời điểm cơ sở kinh doanh nộp hồ sơ hoàn thuế trên cơ sở kết quả xử lý của hệ thống công nghệ thông tin tự động để xác định người bán đã kê khai, nộp thuế giá trị gia tăng theo quy định. c) Trường hợp xác định người bán chưa nộp đầy đủ hồ sơ khai thuế giá trị gia tăng của kỳ tính thuế tương ứng với kỳ tính thuế thuộc kỳ hoàn thuế của cơ sở kinh doanh (bao gồm cả trường hợp chưa đến thời hạn nộp hồ sơ khai thuế) hoặc còn nợ tiền thuế giá trị gia tăng của kỳ tính thuế tương ứng với kỳ tính thuế thuộc kỳ hoàn thuế thì cơ sở kinh doanh không được hoàn thuế đối với các hóa đơn tương ứng với kỳ tính thuế người bán chưa nộp đầy đủ hồ sơ khai thuế giá trị gia tăng hoặc còn nợ tiền thuế giá trị gia tăng. 4. Tại thời điểm cơ sở kinh doanh nộp hồ sơ hoàn thuế, cơ sở kinh doanh thuộc trường hợp hoàn thuế giá trị gia tăng, có số thuế giá trị gia tăng đầu vào đáp ứng đầy đủ điều kiện hoàn thuế theo quy định tại Mục này và tuân thủ các quy định về khai thuế theo quy định của pháp luật về quản lý thuế, lập hồ sơ hoàn thuế giá trị gia tăng đối với từng trường hợp hoàn thuế giá trị gia tăng và gửi đến cơ quan thuế có thẩm quyền tiếp nhận. Cơ quan thuế phân loại hồ sơ hoàn thuế giá trị gia tăng thuộc diện hoàn thuế trước hoặc kiểm tra trước hoàn thuế và giải quyết hồ sơ hoàn thuế giá trị gia tăng theo quy định của pháp luật về quản lý thuế.'
      trang_pdf: 52
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 38
      khoan: 1
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.'
      trang_pdf: 53
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 39
      noi_dung: '1. Đối với dự án đầu tư đã được đầu tư trước ngày 01 tháng 7 năm 2025 mà vẫn đang trong giai đoạn đầu tư kể từ ngày Nghị định này có hiệu lực thi hành thì được áp dụng quy định hoàn thuế đối với đầu tư tại Điều 30 Nghị định này. 2. Quy định về hoàn thuế giá trị gia tăng đối với hoạt động sản xuất hàng hóa, cung cấp dịch vụ chịu thuế suất thuế giá trị gia tăng 5% quy định tại Điều 31 Nghị định này áp dụng đối với số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết sử dụng cho sản xuất hàng hóa, cung cấp dịch vụ chịu thuế suất thuế giá trị gia tăng 5% phát sinh kể từ ngày Nghị định này có hiệu lực thi hành. 3. Quy định tại khoản 3 Điều 37 Nghị định này áp dụng cho kỳ tính thuế từ tháng 7 năm 2025 hoặc quý 3 năm 2025.'
      trang_pdf: 54
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
    - dieu: 40
      noi_dung: '1. Bộ Tài chính quy định chi tiết các điều, khoản được giao tại Nghị định và hướng dẫn thực hiện Nghị định này theo chức năng, nhiệm vụ đảm bảo yêu cầu quản lý. 2. Bộ Tài chính quy định cụ thể đối với hàng hóa, dịch vụ không thuộc phạm vi điều chỉnh của Nghị định này và Luật Thuế giá trị gia tăng. 3. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương và các cơ quan, tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này./.'
      trang_pdf: 55
      sha256_pdf: 48f1b382c71e84b36d8695cbcf151bd61d3ce7db862261ccee917cc7d9909d1d
ghi_chu: 'Đã sửa tên văn bản và ngày ban hành từ bản ghi crawl sơ bộ ("Biểu thuế VAT", 2025-01-01) về đúng nguyên bản ký số (01-07-2025). Các văn bản bị thay thế/bãi bỏ tại khoản 2, khoản 3 Điều 38 (209/2013/NĐ-CP, 49/2022/NĐ-CP, 91/2014/NĐ-CP, 12/2015/NĐ-CP, 100/2016/NĐ-CP, 146/2017/NĐ-CP) và hai Nghị định sửa đổi, bổ sung sau (359/2025/NĐ-CP ngày 31-12-2025; 144/2026/NĐ-CP ngày 05-05-2026 — trong đó Điều 5 thay thế Phụ lục I và Phụ lục II của NĐ 181/2025/NĐ-CP từ 20-06-2026) được ghi nhận đầy đủ tại pham_vi kèm URL nguồn A, chưa đưa vào quan_he vì các văn bản đó chưa mở mục riêng trong sổ.'
