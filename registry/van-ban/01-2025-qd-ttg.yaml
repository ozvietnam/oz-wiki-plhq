  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF sao y ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/1/14/01_2025_QD-TTg_03012025-signed.pdf, id=98391, SHA-256 2be5a3c09be848df2c4240179f89539faa7e9d828703d9dc28b58197c35f1ecb): Quyết định số 01/2025/QĐ-TTg ngày 03-01-2025 của Thủ tướng Chính phủ (Phó Thủ tướng Hồ Đức Phớc ký, căn cứ Luật Thuế xuất khẩu, thuế nhập khẩu ngày 06-04-2016, Nghị định 134/2016/NĐ-CP, Nghị định 18/2021/NĐ-CP và Nghị quyết 174/2024/QH15 ngày 30-11-2024 của Quốc hội) bãi bỏ toàn bộ Quyết định số 78/2010/QĐ-TTg ngày 30-11-2010 của Thủ tướng Chính phủ về mức giá trị hàng hóa nhập khẩu gửi qua dịch vụ chuyển phát nhanh được miễn thuế; có hiệu lực thi hành từ ngày 18-02-2025'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-24'
