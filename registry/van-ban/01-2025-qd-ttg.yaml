  dieu_khoan:
    - dieu: 1
      tieu_de: Bãi bỏ toàn bộ Quyết định
      noi_dung: 'Điều 1. Bãi bỏ toàn bộ Quyết định. Bãi bỏ toàn bộ Quyết định số 78/2010/QĐ-TTg ngày 30 tháng 11 năm 2010 của Thủ tướng Chính phủ về mức giá trị hàng hóa nhập khẩu gửi qua dịch vụ chuyển phát nhanh được miễn thuế.'
      trang_pdf: 1
    - dieu: 2
      tieu_de: Điều khoản thi hành
      noi_dung: 'Điều 2. Điều khoản thi hành. 1. Quyết định này có hiệu lực thi hành từ ngày 18 tháng 02 năm 2025. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc trung ương và các đơn vị có liên quan chịu trách nhiệm thi hành Quyết định này.'
      trang_pdf: 1
ghi_chu: 'Chấm dứt chính sách miễn thuế giá trị gia tăng (GTGT) đối với hàng hóa nhập khẩu trị giá nhỏ gửi qua dịch vụ chuyển phát nhanh theo Quyết định số 78/2010/QĐ-TTg kể từ ngày 18/02/2025 (việc miễn thuế nhập khẩu tiếp tục thực hiện theo Luật Thuế xuất khẩu, thuế nhập khẩu số 107/2016/QH13 và Nghị định số 134/2016/NĐ-CP sửa đổi tại Nghị định số 18/2021/NĐ-CP).'
