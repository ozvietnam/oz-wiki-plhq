xac_minh:
  muc: NGUON_A
  pham_vi: "Đã đối chiếu toàn văn nguồn bậc A trên Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn docid=211194, Công báo số 977+978 và 979+980 ngày 24-08-2024) gồm 2 tệp PDF có lớp chữ: raw/download/datafiles.chinhphu.vn/36-2024-qh15.pdf (21 trang, Điều 1–23, SHA-256 e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690) và raw/download/datafiles.chinhphu.vn/36-2024-qh15_tiep.pdf (61 trang, Điều 24–89, SHA-256 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c), cùng trang wiki/sources/36-2024-qh15.md: Quốc hội khóa XV kỳ họp thứ 7 thông qua ngày 27-06-2024, Chủ tịch Quốc hội Trần Thanh Mẫn ký, cấu trúc 9 Chương / 89 Điều, có hiệu lực từ 01-01-2025 (riêng khoản 3 Điều 10 từ 01-01-2026)."
  hieu_luc_da_doi_chieu: true
  ngay: "2026-11-21"
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: "Luật này quy định về quy tắc, phương tiện, người tham gia giao thông đường bộ, chỉ huy, điều khiển, tuần tra, kiểm soát, giải quyết tai nạn giao thông đường bộ, trách nhiệm quản lý nhà nước và trách nhiệm của cơ quan, tổ chức, cá nhân có liên quan đến trật tự, an toàn giao thông đường bộ."
      trang_pdf: 1
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 2
      khoan: 2
      noi_dung: "2. Phương tiện giao thông đường bộ là các loại xe, bao gồm: phương tiện giao thông cơ giới đường bộ (sau đây gọi là xe cơ giới), phương tiện giao thông thô sơ đường bộ (sau đây gọi là xe thô sơ), xe máy chuyên dùng và các loại xe tương tự. 3. Phương tiện tham gia giao thông đường bộ là phương tiện giao thông đường bộ tham gia giao thông trên đường bộ."
      trang_pdf: 1
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 2
      khoan: 7
      noi_dung: "7. Cải tạo xe (sau đây gọi là cải tạo) là việc thay đổi đặc điểm của xe đã được cấp đăng ký xe, biển số xe hoặc xe đã qua sử dụng được nhập khẩu dẫn đến thay đổi về kiểu loại xe theo quy định của cơ quan có thẩm quyền."
      trang_pdf: 2
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 4
      khoan: 6
      noi_dung: "6. Phát triển phương tiện giao thông đường bộ đồng bộ với phát triển kết cấu hạ tầng đường bộ, điều kiện kinh tế - xã hội và nhu cầu đi lại của người dân; nhập khẩu, sản xuất, lắp ráp phương tiện giao thông đường bộ bảo đảm chất lượng an toàn kỹ thuật và bảo vệ môi trường, phù hợp với xu hướng phát triển công nghệ đối với phương tiện giao thông trên thế giới; ưu tiên phát triển phương tiện vận tải công cộng, hạn chế sử dụng phương tiện giao thông cá nhân tham gia giao thông tại các đô thị lớn; ưu tiên chuyển đổi phương tiện sử dụng nhiên liệu hóa thạch sang phương tiện sử dụng điện, năng lượng xanh, thân thiện môi trường, hạ tầng cung cấp năng lượng sạch."
      trang_pdf: 4
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 9
      khoan: 9
      noi_dung: "8. Đưa xe cơ giới, xe máy chuyên dùng không bảo đảm quy định của pháp luật về an toàn kỹ thuật và bảo vệ môi trường, phương tiện khác không đủ điều kiện theo quy định của pháp luật để tham gia giao thông đường bộ. 9. Nhập khẩu, sản xuất, lắp ráp xe cơ giới, xe máy chuyên dùng không bảo đảm quy định của pháp luật về chất lượng an toàn kỹ thuật và bảo vệ môi trường. 10. Cải tạo xe ô tô loại khác thành xe ô tô chở người, trừ cải tạo thành xe ô tô chở người phục vụ mục đích quốc phòng, an ninh."
      trang_pdf: 8
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 9
      khoan: 14
      noi_dung: "14. Vận chuyển hàng hóa cấm lưu hành, vận chuyển trái phép hoặc không thực hiện đầy đủ các quy định của pháp luật về vận chuyển hàng hóa nguy hiểm, động vật hoang dã."
      trang_pdf: 8
      sha256_pdf: e83b092fd1e93a63d3082424bd63e7ad99afcf39ba3729f6d82ce19fe8b33690
    - dieu: 34
      khoan: 1
      noi_dung: "1. Xe cơ giới bao gồm: a) Xe ô tô gồm: xe có từ bốn bánh trở lên chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, không chạy trên đường ray, dùng để chở người, hàng hóa, kéo rơ moóc, kéo sơ mi rơ moóc hoặc được kết cấu để thực hiện chức năng, công dụng đặc biệt, có thể được nối với đường dây dẫn điện; xe ba bánh có khối lượng bản thân lớn hơn 400 kg; xe ô tô không bao gồm xe chở người bốn bánh có gắn động cơ và xe chở hàng bốn bánh có gắn động cơ; b) Rơ moóc là xe không có động cơ để di chuyển, được thiết kế, sản xuất để hoạt động trên đường bộ, được kéo bởi xe ô tô; phần chủ yếu của khối lượng toàn bộ rơ moóc không đặt lên xe kéo; c) Sơ mi rơ moóc là xe không có động cơ để di chuyển, được thiết kế, sản xuất để hoạt động trên đường bộ; được kéo bởi xe ô tô đầu kéo và có một phần đáng kể khối lượng toàn bộ đặt lên xe ô tô đầu kéo; d) Xe chở người bốn bánh có gắn động cơ là xe có từ bốn bánh trở lên, chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, có kết cấu để chở người, vận tốc thiết kế không lớn hơn 30 km/h, số người cho phép chở tối đa 15 người (không kể người lái xe); đ) Xe chở hàng bốn bánh có gắn động cơ là xe có từ bốn bánh trở lên, chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, có kết cấu để chở hàng, có phần động cơ và thùng hàng lắp trên cùng một khung xe, có tối đa hai hàng ghế và chở tối đa 05 người (không kể người lái xe), vận tốc thiết kế không lớn hơn 60 km/h và khối lượng bản thân không lớn hơn 550 kg; trường hợp xe sử dụng động cơ điện thì có công suất động cơ không lớn hơn 15 kW; e) Xe mô tô gồm: xe có hai hoặc ba bánh chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, trừ xe gắn máy; đối với xe ba bánh thì khối lượng bản thân không lớn hơn 400 kg; g) Xe gắn máy là xe có hai hoặc ba bánh chạy bằng động cơ, được thiết kế, sản xuất để hoạt động trên đường bộ, có vận tốc thiết kế không lớn hơn 50 km/h; nếu"
      trang_pdf: 8
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 34
      khoan: 2
      noi_dung: "động cơ dẫn động là động cơ nhiệt thì dung tích làm việc hoặc dung tích tương đương không lớn hơn 50 cm3; nếu động cơ dẫn động là động cơ điện thì công suất của động cơ không lớn hơn 04 kW; xe gắn máy không bao gồm xe đạp máy; h) Xe tương tự các loại xe quy định tại khoản này. 2. Xe thô sơ bao gồm: a) Xe đạp là xe có ít nhất hai bánh và vận hành do sức người thông qua bàn đạp hoặc tay quay; b) Xe đạp máy, gồm cả xe đạp điện, là xe đạp có trợ lực từ động cơ, nguồn động lực từ động cơ bị ngắt khi người lái xe dừng đạp hoặc khi xe đạt tới tốc độ 25 km/h; c) Xe xích lô; d) Xe lăn dùng cho người khuyết tật; đ) Xe vật nuôi kéo; e) Xe tương tự các loại xe quy định tại khoản này. 3. Xe máy chuyên dùng bao gồm: a) Xe máy thi công; b) Xe máy nông nghiệp, lâm nghiệp; c) Máy kéo; d) Rơ moóc, sơ mi rơ moóc được kéo bởi máy kéo; đ) Xe máy thực hiện chức năng, công dụng đặc biệt; e) Các loại xe đặc chủng sử dụng vào mục đích quốc phòng, an ninh có tham gia giao thông đường bộ. 4. Phương tiện giao thông thông minh là xe cơ giới cho phép tự động hóa một phần hoặc toàn bộ hoạt động điều khiển phương tiện, xác định lộ trình và xử lý tình huống khi tham gia giao thông đường bộ. 5. Xe tương tự các loại xe cơ giới, xe thô sơ được quản lý, sử dụng theo quy định đối với loại xe cơ giới, xe thô sơ đó. 6. Bộ trưởng Bộ Giao thông vận tải quy định chi tiết Điều này; quy định dấu hiệu nhận biết xe cơ giới sử dụng năng lượng sạch, năng lượng xanh, thân thiện môi trường."
      trang_pdf: 9
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 35
      noi_dung: "1. Xe cơ giới, xe máy chuyên dùng tham gia giao thông đường bộ phải đáp ứng các điều kiện sau đây: a) Được cấp chứng nhận đăng ký xe và gắn biển số xe theo quy định của pháp luật; b) Bảo đảm chất lượng an toàn kỹ thuật và bảo vệ môi trường theo quy định của pháp luật. 2. Xe ô tô kinh doanh vận tải phải lắp thiết bị giám sát hành trình. Xe ô tô chở người từ 08 chỗ trở lên (không kể chỗ của người lái xe) kinh doanh vận tải, xe ô tô đầu kéo, xe cứu thương phải lắp thiết bị giám sát hành trình và thiết bị ghi nhận hình ảnh người lái xe. 3. Phương tiện giao thông thông minh bảo đảm các điều kiện quy định tại khoản 1 Điều này và được cơ quan có thẩm quyền cấp phép hoạt động. 4. Phương tiện gắn biển số xe nước ngoài hoạt động tại Việt Nam thực hiện theo quy định tại Điều 55 của Luật này. 5. Chính phủ quy định chi tiết khoản 2 và khoản 3 Điều này; quy định điều kiện hoạt động của xe thô sơ. 6. Ủy ban nhân dân cấp tỉnh quy định phạm vi hoạt động của xe thô sơ, xe chở hàng bốn bánh có gắn động cơ, xe chở người bốn bánh có gắn động cơ tại địa phương."
      trang_pdf: 10
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 39
      khoan: 5
      noi_dung: "5. Xe cơ giới, xe máy chuyên dùng được cấp biển số xe và đăng ký tạm thời trong các trường hợp sau đây: a) Đã có chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường, phiếu kiểm tra chất lượng xuất xưởng xe cơ giới, xe máy chuyên dùng để di chuyển từ nhà máy đến kho, cảng hoặc từ kho, cảng, nhà máy, đại lý bán xe đến nơi đăng ký xe hoặc về các đại lý, kho lưu trữ khác; b) Xe làm thủ tục thu hồi để tái xuất hoặc chuyển quyền sở hữu; xe phục vụ các sự kiện do Đảng, Nhà nước tổ chức; xe đăng ký ở nước ngoài được cơ quan thẩm quyền cho phép bao gồm cả xe có tay lái bên phải (tay lái nghịch) vào Việt Nam quá cảnh, tạm nhập, tái xuất có thời hạn để tham dự hội nghị, hội chợ, triển lãm, thể dục, thể thao, du lịch; trừ trường hợp xe không phải cấp biển số xe tạm thời theo điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên và trường hợp quy định tại Điều 55 của Luật này;"
      trang_pdf: 14
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 39
      khoan: 6
      noi_dung: "b) Xe nhập khẩu được miễn thuế hoặc xe tạm nhập của cơ quan, tổ chức, cá nhân nước ngoài mà tái xuất, chuyển quyền sở hữu hoặc tiêu hủy; xe hết thời hạn đăng ký tại các khu kinh tế - thương mại đặc biệt, khu kinh tế cửa khẩu quốc tế;"
      trang_pdf: 14
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 40
      noi_dung: "1. Niên hạn sử dụng của xe cơ giới được tính bắt đầu từ năm sản xuất xe đến hết ngày 31 tháng 12 của năm hết niên hạn sử dụng. 2. Niên hạn sử dụng của xe cải tạo được quy định như sau: a) Xe có niên hạn sử dụng cải tạo thành xe không có niên hạn sử dụng thì áp dụng quy định về niên hạn của xe trước khi cải tạo; b) Xe không có niên hạn sử dụng cải tạo thành xe có niên hạn sử dụng thì áp dụng quy định về niên hạn của xe sau khi cải tạo; c) Xe ô tô chở người có số người cho phép chở từ 09 người trở lên (không kể người lái xe), xe ô tô chở người chuyên dùng cải tạo thành xe ô tô chở hàng (kể cả xe ô tô chở hàng chuyên dùng); xe chở người bốn bánh có gắn động cơ cải tạo thành xe chở hàng bốn bánh có gắn động cơ thì được áp dụng quy định về niên hạn của xe sau cải tạo. 3. Các trường hợp xe cơ giới không áp dụng niên hạn sử dụng bao gồm: a) Xe mô tô, xe gắn máy, xe ô tô chở người có số người cho phép chở đến 08 người (không kể người lái xe), xe ô tô chuyên dùng, rơ moóc, sơ mi rơ moóc; b) Xe cơ giới của quân đội, công an phục vụ mục đích quốc phòng, an ninh. 4. Chính phủ quy định chi tiết Điều này."
      trang_pdf: 15
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 41
      noi_dung: "1. Đối tượng phải bảo đảm chất lượng an toàn kỹ thuật và bảo vệ môi trường bao gồm: a) Xe cơ giới, xe máy chuyên dùng nhập khẩu, sản xuất, lắp ráp, trừ xe để nghiên cứu khoa học, nghiên cứu phục vụ sản xuất, trưng bày, giới thiệu tại hội chợ, triển lãm thương mại; b) Loại phụ tùng xe cơ giới nhập khẩu, sản xuất, lắp ráp thuộc danh mục sản phẩm hàng hóa phải kiểm tra chất lượng an toàn kỹ thuật và bảo vệ môi trường, trừ trường hợp để nghiên cứu khoa học, nghiên cứu phục vụ sản xuất, trưng bày, giới thiệu tại hội chợ, triển lãm thương mại. 2. Việc chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường bao gồm: a) Kiểm tra, thử nghiệm, chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng và phụ tùng xe cơ giới, mức tiêu thụ năng lượng của xe cơ giới; b) Công nhận và chỉ định cơ sở thử nghiệm, chứng nhận; c) Kiểm tra, đánh giá, giám sát việc bảo đảm chất lượng an toàn kỹ thuật và bảo vệ môi trường, bảo hành, bảo dưỡng, triệu hồi sản phẩm, hàng hóa của cơ sở nhập khẩu, sản xuất, lắp ráp. 3. Việc chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu, sản xuất, lắp ráp do đăng kiểm viên thực hiện và được cơ quan có thẩm quyền cấp chứng nhận. Đăng kiểm viên là người được cấp chứng chỉ chuyên môn về chứng nhận, kiểm định xe cơ giới, xe máy chuyên dùng. 4. Việc thừa nhận chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của nước ngoài đối với xe cơ giới, phụ tùng xe cơ giới được thực hiện theo quy định của điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. 5. Tổ chức, cá nhân nhập khẩu, sản xuất, lắp ráp có trách nhiệm tuân thủ các quy định của pháp luật về kiểm tra, thử nghiệm, chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới;"
      trang_pdf: 16
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 41
      khoan: 5
      noi_dung: "chịu trách nhiệm về chất lượng sản phẩm, hàng hóa do mình nhập khẩu, sản xuất, lắp ráp, việc bảo hành, bảo dưỡng xe cơ giới nhập khẩu, sản xuất, lắp ráp và triệu hồi sản phẩm, hàng hóa theo quy định của Chính phủ. 6. Thủ tướng Chính phủ quy định lộ trình áp dụng mức tiêu chuẩn khí thải đối với xe cơ giới nhập khẩu, sản xuất, lắp ráp. 7. Bộ trưởng Bộ Giao thông vận tải ban hành quy chuẩn kỹ thuật quốc gia về chất lượng an toàn kỹ thuật và bảo vệ môi trường, tiêu thụ năng lượng xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu, sản xuất, lắp ráp; ban hành quy chuẩn kỹ thuật quốc gia về cơ sở bảo hành, bảo dưỡng xe cơ giới; quy định về trình tự, thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu, sản xuất, lắp ráp, trừ trường hợp quy định tại khoản 8 Điều này; quy định về cấp mới, cấp lại, tạm đình chỉ, thu hồi chứng chỉ đăng kiểm viên. 8. Bộ trưởng Bộ Quốc phòng, Bộ trưởng Bộ Công an quy định về trình tự, thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu, sản xuất, lắp ráp thuộc phạm vi quản lý của Bộ Quốc phòng, Bộ Công an."
      trang_pdf: 17
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 42
      khoan: 3
      noi_dung: "3. Xe cơ giới, xe máy chuyên dùng có chứng nhận về an toàn kỹ thuật và bảo vệ môi trường của cơ sở đăng kiểm phương tiện hoặc chứng nhận về kiểm tra xuất xưởng của nhà sản xuất thì không phải kiểm định trong trường hợp di chuyển từ cửa khẩu, nơi sản xuất, lắp ráp tới kho, cảng, cửa hàng hoặc ngược lại."
      trang_pdf: 17
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 51
      noi_dung: "1. Hàng hóa nguy hiểm là hàng hóa có chứa các chất hoặc vật phẩm nguy hiểm khi chở trên đường bộ có khả năng gây nguy hại tới tính mạng, sức khỏe con người, môi trường, an toàn và an ninh quốc gia. 2. Việc vận chuyển hàng hóa nguy hiểm phải có giấy phép vận chuyển; trong trường hợp cần thiết, đơn vị vận chuyển hàng hóa nguy hiểm phải bố trí người áp tải để bảo đảm trật tự, an toàn giao thông đường bộ. 3. Xe ô tô vận chuyển hàng hóa nguy hiểm phải dán biểu trưng nhận diện hàng hóa nguy hiểm; lắp đèn, tín hiệu cảnh báo. 4. Người lái xe hoặc người áp tải vận chuyển hàng hóa nguy hiểm phải được tập huấn về vận chuyển hàng hóa nguy hiểm. 5. Cơ quan cấp giấy phép vận chuyển hàng hóa nguy hiểm có trách nhiệm gửi thông báo ngay đến cơ quan Cảnh sát giao thông Bộ Công an và cơ quan Cảnh sát giao thông thực hiện nhiệm vụ bảo đảm trật tự, an toàn giao thông trên tuyến đường, đoạn đường mà phương tiện đi qua để chỉ huy, điều khiển giao thông đường bộ, kiểm tra, kiểm soát, xử lý vi phạm pháp luật, bảo đảm trật tự, an toàn giao thông đường bộ. 6. Chính phủ quy định chi tiết Điều này."
      trang_pdf: 24
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 87
      noi_dung: "1. Chính phủ thống nhất quản lý nhà nước về trật tự, an toàn giao thông đường bộ. 2. Bộ Công an là cơ quan đầu mối giúp Chính phủ thực hiện thống nhất quản lý nhà nước về trật tự, an toàn giao thông đường bộ; xây dựng lực lượng Cảnh sát giao thông chính quy, tinh nhuệ, hiện đại đáp ứng yêu cầu nhiệm vụ bảo đảm trật tự, an toàn giao thông đường bộ. 3. Bộ Giao thông vận tải thực hiện quản lý nhà nước về đào tạo, sát hạch, cấp giấy phép lái xe; chất lượng an toàn kỹ thuật và bảo vệ môi trường của xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới và nhiệm vụ quản lý khác theo quy định của Luật này; ban hành quy chuẩn kỹ thuật quốc gia về thiết bị an toàn cho trẻ em quy định tại khoản 3 Điều 10 của Luật này. 4. Bộ Quốc phòng thực hiện quản lý nhà nước về phương tiện giao thông đường bộ và người điều khiển phương tiện tham gia giao thông đường bộ thuộc phạm vi quản lý. 5. Bộ Y tế thực hiện quản lý nhà nước về điều kiện sức khỏe của người lái xe, người điều khiển xe máy chuyên dùng tham gia giao thông đường bộ; quy định về xác định nồng độ cồn và nồng độ cồn nội sinh trong máu. 6. Bộ Khoa học và Công nghệ ban hành quy chuẩn kỹ thuật quốc gia về mũ bảo hiểm cho người đi xe mô tô, xe gắn máy, xe đạp máy."
      trang_pdf: 57
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 88
      noi_dung: "1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2025, trừ trường hợp quy định tại khoản 2 Điều này. 2. Khoản 3 Điều 10 của Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026. 3. Luật Giao thông đường bộ số 23/2008/QH12 đã được sửa đổi, bổ sung một số điều theo Luật số 35/2018/QH14 và Luật số 44/2019/QH14 hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành, trừ trường hợp quy định tại các khoản 1, 2, 5 và 6 Điều 89 của Luật này. 4. Nghị quyết số 73/2022/QH15 của Quốc hội về thí điểm đấu giá biển số xe ô tô hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành, trừ trường hợp quy định tại khoản 7 Điều 89 của Luật này."
      trang_pdf: 58
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
    - dieu: 89
      khoan: 6
      noi_dung: "5. Chứng nhận đăng ký xe, biển số xe máy chuyên dùng cấp trước ngày Luật này có hiệu lực thi hành vẫn có giá trị sử dụng. 6. Chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường được cấp trước ngày Luật này có hiệu lực thi hành thì có giá trị sử dụng đến hết thời hạn ghi trên giấy chứng nhận đó."
      trang_pdf: 61
      sha256_pdf: 55ba152f3abe925d9a75418c3e61bc0122824db41a0d2352053dbff2c6264f8c
ghi_chu: "Nạp theo nhu cầu số hoá ranh giới PN6 họ 8704 (issue hs-code-api #1106): định nghĩa phương tiện ở Điều 34 (xe ô tô/xe 4 bánh có gắn động cơ/xe ba bánh >400kg…), KHÔNG phải Điều 8 như vài tóm tắt web ghi. Toàn văn 2 phần: 36-2024-qh15.pdf (21 tr) + _tiep.pdf (61 tr)."
