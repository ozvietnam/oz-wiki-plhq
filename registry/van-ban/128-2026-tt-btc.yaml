xac_minh:
  muc: NGUON_A
  pham_vi: 'Công báo số 510 ngày 15-09-2026 và PDF toàn văn (raw/download/congbaocdn.chinhphu.vn/128-2026-tt-btc.pdf): ban hành 27-08-2026, Điều 13 khoản 1 hiệu lực từ 15-10-2026; khoản 2 áp dụng cho cặp cửa khẩu thông minh được đưa vào vận hành'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này quy định về kiểm tra, giám sát và quản lý hải quan đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh và phương tiện vận tải hoạt động trong khu vực cửa khẩu thông minh được Thủ tướng Chính phủ phê duyệt.'
      trang_pdf: 2
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng áp dụng 1. Tổ chức, cá nhân xuất khẩu, nhập khẩu hàng hóa. 2. Doanh nghiệp quản lý vận hành cửa khẩu thông minh. 3. Cơ quan hải quan, công chức hải quan. 4. Tổ chức, cá nhân khác có liên quan đến hoạt động quản lý, giám sát đối với phương tiện vận tải không người lái, giao nhận hàng hóa tại cửa khẩu thông minh.'
      trang_pdf: 2
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 4
      khoan: 1
      noi_dung: '1. Khu vực cửa khẩu thông minh phải được lắp đặt các trang thiết bị phục vụ công tác kiểm tra, giám sát hải quan, gồm: hệ thống camera nhận diện phương tiện vận tải thông minh không người lái; barie điện tử tại cổng ra, vào; camera giám sát, cân điện tử; hệ thống quản lý hàng hóa đưa vào, đưa ra khu vực cửa khẩu. Các trang thiết bị này phải được kết nối trực tiếp với hệ thống xử lý dữ liệu điện tử hải quan. Các hoạt động trong khu vực cửa khẩu thông minh chịu sự kiểm tra, giám sát và kiểm soát hải quan theo quy định của Luật Hải quan và Nghị định số 08/2015/NĐ-CP của Chính phủ quy định chi tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan được sửa đổi, bổ sung bởi Nghị định số 167/2025/NĐ-CP.'
      trang_pdf: 3
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 5
      khoan: 3
      noi_dung: '3. Hàng hóa nhập khẩu được lưu giữ tại khu vực cửa khẩu thông minh trong thời hạn 30 ngày kể từ ngày hàng hóa đến cửa khẩu. Quá thời hạn nêu trên, nếu chủ hàng đến làm thủ tục hải quan để nhận hàng thì bị xử lý vi phạm theo quy định của pháp luật. Hàng hóa nhập khẩu đưa vào khu vực cửa khẩu thông minh, nếu chưa làm thủ tục hải quan thì doanh nghiệp được vận chuyển đến địa điểm tập kết, kiểm tra giám sát hải quan do cơ quan hải quan công nhận và phải làm thủ tục hải quan như đối với hàng hóa vận chuyển chịu sự giám sát hải quan.'
      trang_pdf: 5
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 6
      khoan: 1
      diem: d
      noi_dung: 'd) Phương tiện vận tải thông minh không người lái của Việt Nam tạm xuất qua Trung Quốc và phương tiện vận tải thông minh của Trung Quốc tạm nhập vào Việt Nam được lưu giữ trong khu vực cửa khẩu thông minh trong thời gian không quá 48 giờ kể từ thời điểm đi qua cửa khẩu. Quá thời hạn nêu trên, nếu phương tiện vận tải thông minh không người lái chưa tái nhập về Việt Nam hoặc tái xuất đi Trung Quốc thì doanh nghiệp quản lý vận hành cửa khẩu thông minh phải thông báo cho cơ quan hải quan biết thông qua hệ thống. Trường hợp không tái nhập hoặc không tái xuất thì phải làm thủ tục hải quan theo quy định.'
      trang_pdf: 6
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 7
      khoan: 2
      noi_dung: '2. Xác nhận hàng hóa vào khu vực cửa khẩu thông minh: Khi phương tiện vận chuyển hàng hóa đến cổng vào khu vực cửa khẩu thông minh, hệ thống quản lý vận hành cửa khẩu thông minh tự động kiểm tra đối chiếu thông tin về phương tiện với hình ảnh camera của phương tiện tại khu vực cửa khẩu thông minh: a) Nếu phương tiện vận chuyển và hàng hóa đủ điều kiện vào cửa khẩu, hệ thống quản lý vận hành cửa khẩu thông minh sẽ tự động cập nhật, xác nhận hàng hóa vào khu vực giám sát (getin) và gửi thông tin trực tiếp đến hệ thống xử lý dữ liệu điện tử hải quan; người điều khiển phương tiện vận chuyển hàng hóa đến khu vực nâng hạ tự động để dỡ hàng hóa khỏi phương tiện. b) Nếu không đủ điều kiện thì hệ thống quản lý vận hành cửa khẩu thông minh sẽ từ chối cập nhật và phản hồi cho người điều khiển phương tiện biết để cập nhật sửa đổi, bổ sung thông tin hoặc liên hệ với cơ quan hải quan để xác nhận, làm rõ.'
      trang_pdf: 7
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 8
      khoan: 3
      noi_dung: '3. Tại khu vực cửa khẩu thông minh: a) Ngay khi phương tiện vận tải thông minh không người lái vận chuyển hàng hóa đến khu vực nâng hạ tự động, hệ thống cẩu tiếp nhận, chuyển hàng hóa qua khu vực tập kết để chờ làm tiếp thủ tục hải quan nhập khẩu và cập nhật thông tin vào hệ thống quản lý vận hành cửa khẩu thông minh. b) Trường hợp hàng hóa đủ điều kiện qua khu vực giám sát, được chuyển lên phương tiện vận tải để đưa thẳng vào nội địa, không dỡ xuống khu vực tập kết, hệ thống cẩu chuyển hàng lên phương tiện vận tải để vận chuyển hàng qua cổng ra khu vực cửa khẩu thông minh và cập nhật thông tin vào hệ thống quản lý vận hành cửa khẩu thông minh. c) Trường hợp qua phân tích đánh giá rủi ro và các thông tin khác có được tại thời điểm hàng hóa đến cửa khẩu, nếu xác định lô hàng hóa dấu hiệu vi phạm pháp luật, Đội trưởng Hải quan cửa khẩu thông báo cho doanh nghiệp quản lý vận hành cửa khẩu thông minh biết để phối hợp vận chuyển hàng hóa đến khu vực soi chiếu để kiểm tra.'
      trang_pdf: 8
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
    - dieu: 13
      noi_dung: 'Điều 13. Hiệu lực thi hành 1. Thông tư này có hiệu lực thi hành kể từ ngày 15/10/2026. 2. Thông tư này chỉ áp dụng đối với các cặp cửa khẩu thông minh được cơ quan có thẩm quyền quyết định đưa vào vận hành khai thác, sử dụng theo quy định.'
      trang_pdf: 11
      sha256_pdf: 8137cd8a2b5bbf4a5fb3352d12b4b53ccf1818fefe37e59a59ab402460dd3cf7
ghi_chu: 'Trang tổng hợp Meta AI ghi sai ngày ban hành (18-08) và hiệu lực (01-10). Đầu mối: trang tổng hợp do Meta AI sinh (CEO gửi 04/10/2026) — mọi thông tin dưới đây lấy từ nguồn bậc A, không lấy từ trang đó.'
