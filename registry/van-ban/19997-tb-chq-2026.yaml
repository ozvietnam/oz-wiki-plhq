  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/8/7/VB_19997.pdf, id=105357, SHA-256 292fe90afa7c29ea354893bb0676369758dea60c7423116943aab25f6cc80862): Thông báo số 19997/TB-CHQ ngày 07-08-2026 của Cục Hải quan (trên mục lục cổng ghi ký hiệu 19997/CHQ-NVTHQ) về kết quả xác định trước mã số đối với mặt hàng Chất đóng rắn LG-RFE-N (tên thương mại Curing Agent LG-RFE-N, ký mã hiệu LG-RFE-N, thành phần tính theo trọng lượng gồm Poly isocyanate 20%-25% CAS 3779-63-3 và Ethyl acetate CAS 141-78-6; chất lỏng dễ cháy màu vàng, mùi dung môi, pH 6~8, nhiệt độ sôi 56~115 độ C, điểm chớp cháy 4.4 độ C, nhiệt độ tự cháy 250 độ C, mật độ 0.85~0.8, không hòa tan trong nước; đóng gói 15 kg/thùng, nhà sản xuất Ligao Resin (Hk) Limited; công dụng thêm vào chất kết dính để tăng độ khô và cải thiện độ bền, khả năng chịu nhiệt độ cao), phân loại vào nhóm 32.08, phân nhóm 3208.90, mã số 3208.90.90; có hiệu lực kể từ ngày ban hành'
  hieu_luc_da_doi_chieu: true
