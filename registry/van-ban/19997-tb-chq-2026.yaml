ghi_chu: 'Xác định trước mã số mặt hàng Chất đóng rắn Curing Agent LG-RFE-N (thành phần Poly isocyanate 20%-25% CAS 3779-63-3 và dung môi Ethyl acetate CAS 141-78-6, dạng lỏng màu vàng đóng gói 15 kg/thùng, dùng phối trộn với chất kết dính để tăng độ khô, độ bền và khả năng chịu nhiệt) thuộc nhóm 32.08, phân nhóm 3208.90, mã số 3208.90.90.'
