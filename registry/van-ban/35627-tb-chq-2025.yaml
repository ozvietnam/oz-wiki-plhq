  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/11/14/18.VB_35627.pdf, id=101853, SHA-256 211443b4be4f4f8cace584539ed19792f987fefe9f641a5f2eafa347eca905e2): Thông báo số 35627/TB-CHQ ngày 13-11-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Nhẫn thông minh RingConn Gen 2 Air Smart Ring (ký, mã hiệu RCA-02-8; vỏ hợp kim Titanium tích hợp cảm biến nhịp tim quang học PPG, cảm biến gia tốc, cảm biến nhiệt độ hồng ngoại, kết nối Bluetooth 5.0, không có màn hình hiển thị; dùng để đo, theo dõi và truyền dữ liệu nhịp tim, biến thiên nhịp tim HRV, SpO2, nhiệt độ da, giấc ngủ và vận động về ứng dụng trên điện thoại thông minh), phân loại vào nhóm 90.31, phân nhóm 9031.80, mã số 9031.80.90; có hiệu lực từ ngày ký'
