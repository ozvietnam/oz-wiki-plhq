ghi_chu: 'Xác định trước mã số mặt hàng Máy chủ tịch dùng cho hệ thống hội thảo kỹ thuật số (Chairman unit, ký mã hiệu TS-D1000-CU; tích hợp phím Priority, phím Talk, loa 0,4W, 2 cổng RJ45, 1 cổng XLR cắm cần micro, không bao gồm micro; là thiết bị truyền, nhận dữ liệu âm thanh dùng cho hệ thống hữu tuyến kỹ thuật số) thuộc nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.49.'
