  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/6/15/3.VB_17478.pdf, id=104774, SHA-256 8aa39eb2782ab78d25c2f876bad4e55b112d80ae5cf09b9e609476e54e6083de): Thông báo số 17478/TB-CHQ ngày 15-06-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Máy chủ tịch (Chairman unit, ký mã hiệu TS-D1000-CU; sử dụng cho hệ thống hội thảo kỹ thuật số, gồm phím Priority và phím Talk nhấn nhả, 2 đầu nối tai nghe mini 3,5 mm kèm phím chỉnh âm lượng, loa tích hợp 8 ohm 0,4W, 2 cổng RJ45 kết nối với máy đại biểu và bộ trung tâm, 1 cổng cắm cần Micro XLR 3 chân, không bao gồm micro, nguồn điện 24V DC 1,5W, kích thước 208,9 x 71,3 x 160,5 mm, khối lượng 880 g), phân loại vào nhóm 85.17, phân nhóm 8517.62, mã số 8517.62.49; có hiệu lực từ ngày ký'
