ghi_chu: 'Xác định trước mã số mặt hàng Bộ toan áo phẫu thuật khớp gối Arthroscopy Pack (ký, mã hiệu V-ATP-005; vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, tiệt trùng bằng khí EO dùng 1 lần trong phòng mổ; gồm toan trải bàn dụng cụ lớn và nhỏ, toan phẫu thuật khớp gối, toan phủ vải không dệt, bao phủ chi, băng dính, khăn thấm và áo choàng phẫu thuật) thuộc nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90.'
