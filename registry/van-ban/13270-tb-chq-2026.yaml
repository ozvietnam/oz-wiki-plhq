  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/5/VB_13270.pdf, id=102687, SHA-256 86c27144a1c447c133c38a854064cd0ef5d45b1f7a4e2c56738d97f157e57384): Thông báo số 13270/TB-CHQ ngày 04-03-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ toan áo phẫu thuật khớp gối Arthroscopy Pack (ký, mã hiệu V-ATP-005; chất liệu vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, định lượng 43-65 gsm, ép nhiệt và cắt may, khử trùng bằng khí EO dùng 1 lần; bộ gồm 1 toan trải bàn dụng cụ lớn 180 x 200 cm, 1 toan trải bàn dụng cụ nhỏ 120 x 140 cm, 1 toan phẫu thuật khớp gối 200 x 360 cm, 1 toan phủ vải không dệt 150 x 180 cm, 1 bao phủ chi Impervious Stockinette, 2 băng dính 7,5 x 40 cm, 9 khăn thấm 30 x 40 cm và 4 áo choàng phẫu thuật), phân loại vào nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90; có hiệu lực từ ngày ký'
