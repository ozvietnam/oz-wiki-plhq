xac_minh:
  muc: NGUON_A
  pham_vi: 'thẻ vanban.chinhphu.vn (docid=214598) và toàn văn PDF ký số (raw/download/datafiles.chinhphu.vn/66-2025-qh15.pdf, 4 Chương, 11 Điều, người ký Chủ tịch Quốc hội Trần Thanh Mẫn): Luật Thuế tiêu thụ đặc biệt số 66/2025/QH15 được Quốc hội khóa XV thông qua tại kỳ họp thứ 9 ngày 14-06-2025, có hiệu lực thi hành từ ngày 01-01-2026 theo khoản 1 Điều 11; khoản 2 Điều 11 quy định Luật Thuế tiêu thụ đặc biệt số 27/2008/QH12 đã được sửa đổi, bổ sung một số điều theo Luật số 70/2014/QH13, Luật số 71/2014/QH13, Luật số 106/2016/QH13 và Luật số 03/2022/QH15 (Điều 8) hết hiệu lực kể từ ngày 01-01-2026; đối chiếu đang còn hiệu lực'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Pham vi điều chỉnh Luật này quy định về đối tượng chịu thuế, đối tượng không chịu thuế, người nộp thuê, căn cứ tính thuế, hoàn thuế, khấu trừ thuế và giảm thuế tiêu thụ đặc biệt.
      trang_pdf: 1
    - dieu: 2
      noi_dung: 'Điều 2. Đối tượng chịu thuế 1. Hàng hóa bao gồm: a) Thuốc lá theo quy định của Luật Phòng, chống tác hại của thuốc lá; b) Rượu theo quy định của Luật Phòng, chống tác hại của rượu, bia; c) Bia theo quy định của Luật Phong, chống tác hại của rượu, bia;'
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Đối tượng không chịu thuế 1. Hàng hóa quy định tại khoản 1 Điều 2 của Luật này không thuộc đối tượng chịu thuế tiêu thụ đặc biệt trong các trường hợp sau đây: a) Hàng hóa do tổ chức, cá nhân sản xuất, gia công, thuê gia công trực tiếp xuất khẩu ra nước ngoài hoặc bán, ủy thác cho tổ chức, cá nhân kinh doanh khác dé xuất khẩu ra nước ngoài; b) Hàng hóa nhập khâu bao gồm: ˆ'
      trang_pdf: 2
    - dieu: 4
      noi_dung: Điều 4. Người nộp thuế 1. Người nộp thuế tiêu thụ đặc biệt là tổ chức, cá nhân sản xuất, gia công, nhập khẩu hàng hóa và kinh đoanh dịch vụ thuộc đối tượng chịu thuế tiêu thụ đặc biệt.
      trang_pdf: 4
    - dieu: 5
      noi_dung: 'Điều 5. Căn cứ và phương pháp tính thuế 1. Căn cứ tính thuế: a) Căn cứ tính thuế tiêu thụ đặc biệt áp dụng phương pháp tính thuế theo tỷ lệ phần trăm là giá tính thuê của hang hóa, dịch vụ chịu thuế và thuế suất; b) Căn cứ tính thuế tiêu thụ đặc biệt áp dụng phương pháp tính thuế tuyệt đối là lượng hàng hóa chịu thuế và mức thuế tuyệt đối. 2. Phương pháp tính thuế:'
      trang_pdf: 4
    - dieu: 6
      noi_dung: 'Điều 6. Giá tính thuế 1. Giá tính thuế tiêu thụ đặc biệt đối với hàng hoá, dịch vụ là giá bán ra, giá cung ứng dich vụ chưa có thuê tiêu thụ đặc biệt, chưa có thuế bảo vệ môi trường và chưa có thuê giá trị gia tang được quy định như sau: a) Đối với hàng hóa sản xuất trong nước, hàng hóa nhập khâu là giá do tổ chức, cá nhân sản xuât, tô chức, cá nhân nhập khẩu bán ra.'
      trang_pdf: 5
    - dieu: 7
      noi_dung: Điều 7. Thời điểm xác định thuế tiêu thụ đặc biệt . Thời điểm xác định thuế tiêu thụ đặc biệt đối với hàng hóa là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dung hang hóa cho người mua, không phân biệt đã thu được tiễn hay chưa thu được tiền.
      trang_pdf: 6
    - dieu: 8
      noi_dung: 'Điều 8. Thuế suất và mức thuế tuyệt đối 1. Thuế suất và mức thuế tuyệt đối thuế tiêu thụ đặc biệt đối với hàng hoá, dịch vụ được quy định tại Biểu thuế tiêu thụ đặc biệt sau đây:'
      trang_pdf: 6
    - dieu: 9
      noi_dung: 'Điều 9. Hoàn thuế, khấu trừ thuế 1. Người nộp thuế tiêu thụ đặc biệt được hoàn thuế đã nộp trong các trường hợp sau đây: :'
      trang_pdf: 11
    - dieu: 10
      noi_dung: Điều 10. Giam thuế 1. Người nộp thuế sản xuất hàng hoá thuộc đối tượng chịu thuế tiêu thụ đặc biệt gặp khó khăn do thiên tai, tai nạn bất ngờ được giảm thuế. 2. Mức giảm thuế được xác định trên cơ sở tổn thất thực tế do thiên tai, tai nạn bất ngờ gây ra nhưng không quá 30% số thuế phải nộp của năm xảy ra thiệt hại và không vượt quá giá trị tài sản bị thiệt hại sau khi được bồi thường (nếu có).
      trang_pdf: 12
    - dieu: 11
      noi_dung: Điều 11. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026. 2. Luật Thuế tiêu thụ đặc biệt số 27/2008/QH12 đã được sửa đổi, bỗ sung một số điều theo Luật số 70/2014/QH13, Luật số 71/2014/QH13, Luật số 106/2016/QH13 và Luật số 03/2022/QH15 hết hiệu lực ké từ ngày Luật nay có hiệu lực thi hành. Luật này được Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam khoá XV. kỳ họp thứ 9 thông qua ngày 14 tháng 6 năm 2025. ie )
      trang_pdf: 13
