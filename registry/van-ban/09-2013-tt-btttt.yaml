  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Thông tư này ban hành Danh mục sản phẩm phần mềm và phần cứng, điện tử (sau đây gọi tắt là Danh mục), bao gồm: 1. Danh mục sản pham phan mém được quy định tai Phu lục số 01. 2. Danh mục sản phẩm phần cứng, điện tử được quy định tại Phụ lục số 02.'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Thông tư này áp dụng đối với các cơ quan, tổ chức, cá nhân tham gia hoạt động công nghiệp công nghệ thông tin, quản lý, sản xuất, kinh doanh sản phẩm phần mềm và phần cứng, điện tử tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: Điều 3. Nguyên tắc xây dựng và mục đích áp dụng Danh mục 1. Danh mục được xây dựng nhằm hình thành hệ thống sản phẩm chuyên ngành công nghiệp phần mềm và công nghiệp phan cứng, điện tử phục vụ cho việc đăng ký kinh doanh; hoạt động đầu tư; áp dụng các chính sách thuế; chính sách ưu đãi; quản lý xuất nhập khẩu; quản lý chất lượng và các hoạt động khác liên quan tới sản phẩm phần mềm và phan cứng, điện tử.
      trang_pdf: 1
    - dieu: 4
      noi_dung: Điều 4. Hiệu lực thi hành Thông tư này có hiệu lực thi hành kể từ ngày 23 tháng 5 năm 2013.
      trang_pdf: 2
    - dieu: 5
      noi_dung: Điều 5. Tổ chức thực hiện 1. Chánh Văn phòng, Vụ trưởng Vụ Công nghệ thông tin, Thủ trưởng các cơ quan, đơn vị thuộc Bộ Thông, tin và Truyền thông, Giám đốc Sở Thông tin và Truyền thông các tỉnh, thành phố trực thuộc Trung ương và các doanh nghiệp, tổ chức, cá nhân có liên quan nếu tại Điều 2 chịu trách nhiệm thi hành Thông tư này.
      trang_pdf: 2
