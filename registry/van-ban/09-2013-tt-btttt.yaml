danh_muc_khong_ma_hs: 'Phụ lục số 01 (Danh mục sản phẩm phần mềm) và Phụ lục số 02 (Danh mục sản phẩm phần cứng, điện tử) trên Công báo số 211+212 ngày 23/04/2013 (10 trang; sửa đổi bởi 20/2021/TT-BTTTT và Điều 4 11/2024/TT-BTTTT) chỉ có 2 cột Số TT và Tên sản phẩm phần mềm / phần cứng, điện tử phục vụ quản lý ngành CNTT theo Nghị định 71/2007/NĐ-CP — không gắn mã HS và không dẫn chiếu mã HS (danh mục sản phẩm CNTT đã qua sử dụng cấm nhập khẩu kèm mã HS được ban hành riêng tại 11/2018/TT-BTTTT và 63/2026/TT-BKHCN).'
