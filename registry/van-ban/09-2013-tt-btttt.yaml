  pham_vi: 'thẻ vanban.chinhphu.vn (docid=167379), Công báo (id=4337), toàn văn PDF/OCR (raw/download/datafiles.chinhphu.vn/09-2013-tt-btttt.pdf, wiki/sources/09-2013-tt-btttt.md) và cạnh ngược trong sổ: Thông tư 09/2013/TT-BTTTT ban hành 08-04-2013, có hiệu lực từ 23-05-2013 theo Điều 4 (5 Điều + Phụ lục số 01, 02); đã được sửa đổi, bổ sung và bãi bỏ một phần Phụ lục số 02 từ ngày 07-11-2024 bởi Điều 4 Thông tư 11/2024/TT-BTTTT'
