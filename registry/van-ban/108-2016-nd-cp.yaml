xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=185920) và toàn văn PDF ký số (108.signed.pdf): ban hành và có hiệu lực từ 01-07-2016, quy định điều kiện kinh doanh và nhập khẩu sản phẩm, dịch vụ an toàn thông tin mạng; đang còn hiệu lực.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh 1. Nghị định này quy định về: _ a) Điều kiện, quy trình, thủ tục, hồ sơ cấp Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng; b) Sản phẩm, dich vụ an toàn thông tin mang; c) Sản phẩm an toàn thông tin mạng nhập khẩu theo giấy phép. 2. Nghị định này không điều chỉnh hoạt động kinh doanh sản phẩm, dịch vụ mật mã dân sự và hoạt động kinh doanh dịch vụ chứng thực chữ ky điện tử.'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với tổ chức, doanh nghiệp trực tiếp tham gia hoặc có liên quan đến hoạt động sản xuất, nhập khẩu sản phẩm an toàn thông tin mạng và cung cấp địch vụ an toàn thông tin mạng tại Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Sản phẩm, dịch vụ an toàn thông tin mạng 1. San phẩm an toàn thông tin mạng gồm: a) San phẩm kiếm tra, đánh giá an toàn thông tin mạng là các thiết bị phần cứng, phần mềm có các chức năng cơ bản sau: Rà quét, kiểm tra, phân tích cau hình, hiện trạng, đữ liệu nhật ký của hệ thống thông tin; phát hiện lỗ hồng, điểm yếu; đưa ra đánh giá rủi ro an toàn thông tin;'
      trang_pdf: 1
    - dieu: 5
      noi_dung: Điều 5. Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng 1. Bộ Thông tin và Truyền thông cấp Giấy phép kinh doanh sản phẩm, địch vụ an toàn thông tin mạng. 2. Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng được cấp cho doanh nghiệp có thời hạn là 10 năm theo Mẫu số 01 tại Phụ lục ban hành kèm theo Nghị định này.
      trang_pdf: 3
    - dieu: 6
      noi_dung: Điều 6. Điều kiện cấp Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng 1. Doanh nghiệp được cấp Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng quy định tại Điều 3 Nghị định này khi đáp ứng đủ các điều kiện quy định tại Điều 42 Luật an toàn thông tin mạng và các điều kiện tại Nghị định này.
      trang_pdf: 3
    - dieu: 7
      noi_dung: Điều 7. Hồ sơ, trình tự thủ tục cấp Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng Hồ Sơ và trình tự thủ tục cấp, sửa đổi, bd sung, gia hạn, tạm đình chỉ, thu hồi và cấp lại Giấy phép, kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng theo quy định tại Điều 43, 44, 45 Luật an toàn thông tin mạng.
      trang_pdf: 5
    - dieu: 9
      noi_dung: Điều 9. Kiểm tra tính hợp lệ hồ sơ đề nghị cấp Giấy phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng
      trang_pdf: 5
    - dieu: 10
      noi_dung: Điều 10. Nộp, giải trình, bỗ sung hỗ sơ trong quá trình thấm định 1. Trong thời hạn thâm định hồ sơ, Bộ Thông tin và Truyền thông có quyền gửi thông báo yêu cầu doanh nghiệp bổ sung hồ sơ, giải trình bằng văn bản hoặc giải trình trực tiếp nếu hồ sơ dé nghị cap phép tương ứng không cung cap đủ thông tin, không đáp ứng đủ điều kiện theo quy định nhưng không quá 01 lần.
      trang_pdf: 6
    - dieu: 11
      noi_dung: Điều 11. Chế độ báo cáo của doanh nghiệp kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng Doanh nghiệp được cấp Giây phép kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng có trách nhiệm báo cáo đột xuất theo yêu cầu và báo cáo định kỳ hăng năm (trước ngày 31 tháng 12) về tình hình kinh doanh sản phẩm, dịch vụ an toàn thông tin mạng đến Bộ Thông tin và Truyền thông theo Mẫu số 05 tại Phụ lục ban hành kèm theo Nghị định này.
      trang_pdf: 7
    - dieu: 13
      noi_dung: Điều 13. Hiệu lực thi hành Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2016.
      trang_pdf: 7
