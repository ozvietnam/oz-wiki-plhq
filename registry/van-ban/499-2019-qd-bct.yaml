  pham_vi: 'Đã kiểm chứng tên nguyên văn, cơ quan (Bộ Công Thương), ngày ban hành 17/6/2019, hiệu lực 01/8/2019, nội dung (thay khoản kiểm định thuộc Cục Xăng dầu/Cục Hóa chất bằng KKT 18; bãi bỏ Biểu phí 2; mức phí kiểm tra chuyên ngành XNK theo % giá tính thuế nhập khẩu) theo trang chi tiết Thư viện Pháp luật. TVPL ghi trạng thái còn hiệu lực. Chưa đối chiếu bản gốc trên cổng vbpl.vn/congbao.chinhphu.vn.'
