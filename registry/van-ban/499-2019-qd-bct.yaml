ghi_chu: 'Nạp từ nhu cầu khách tra (issue miss) — đợt tập trung 6/11. Sửa đổi biểu phí kiểm tra chuyên ngành hàng XNK (xăng dầu, hóa chất, vật liệu nổ công nghiệp...) thuộc trách nhiệm quản lý của Bộ Công Thương — trực tiếp chi phí làm thủ tục nhập khẩu các mặt hàng này.'
