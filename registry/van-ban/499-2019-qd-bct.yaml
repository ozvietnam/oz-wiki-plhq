xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu trên Cổng Thông tin điện tử Bộ Công Thương (moit.gov.vn) và Cổng Thông tin điện tử Chính phủ (vanban.chinhphu.vn): Tương tự 326/2018/QĐ-BCT, theo Luật Ban hành VBQPPL 2015 và Luật Phí và lệ phí 2015, Bộ Công Thương không ban hành Quyết định QPPL quy định biểu phí kiểm tra chuyên ngành và không tồn tại Quyết định số 499/2019/QĐ-BCT trên Công báo hay CSDL Quốc gia vbpl.vn. Trong năm 2019, hai quyết định chính thức của Bộ trưởng Bộ Công Thương về danh mục mặt hàng kiểm tra chuyên ngành và cắt giảm kiểm tra chuyên ngành đối với hàng hóa XNK trên moit.gov.vn là Quyết định số 765/QĐ-BCT ngày 29-03-2019 và Quyết định số 1325A/QĐ-BCT ngày 20-05-2019 (được đăng tải kèm văn bản ngày 17-06-2019 trên moit.gov.vn). Giữ bản ghi với so_hieu_khac để bắt truy vấn khách tra nhầm số hiệu 499/2019/QĐ-BCT và điều hướng đúng sang Quyết định 1325A/QĐ-BCT và 765/QĐ-BCT.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
ghi_chu: 'Bản ghi giữ để bắt truy vấn khách tra nhầm số hiệu 499/2019/QĐ-BCT (issue miss đợt 6/11): theo Luật Ban hành VBQPPL 2015 và Luật Phí và lệ phí 2015, Bộ Công Thương không ban hành Quyết định QPPL về biểu phí KTCN; các quyết định thực tế năm 2019 của BCT về rà soát, cắt giảm và công bố danh mục mặt hàng KTCN trên moit.gov.vn là Quyết định 765/QĐ-BCT (29-03-2019) và Quyết định 1325A/QĐ-BCT (20-05-2019).'
toan_van: chua_co
