xac_minh:
  muc: NGUON_A
  pham_vi: 'đối chiếu Công báo (id=468676), wiki/sources/114-2025-qh15.md và quan hệ trong sổ: Luật Phòng bệnh số 114/2025/QH15 có hiệu lực thi hành từ 01-07-2026; đối chiếu đang còn hiệu lực (luật gốc của kiểm dịch y tế biên giới từ 01-07-2026, được quy định chi tiết về kiểm dịch y tế đối với hàng hóa xuất khẩu, nhập khẩu, quá cảnh bởi Nghị định 165/2026/NĐ-CP)'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: Điều 1. Phạm vi điều chỉnh, đối tượng áp dụng 1. Luật này quy định về phòng, chống bệnh truyền nhiễm; phòng, chống bệnh không lây nhiễm; phòng, chống rối loạn tâm thần; dinh dưỡng trong phòng bệnh; điều kiện bảo đảm để phòng bệnh. 2. Luật này áp dụng đối với cơ quan, tổ chức, cá nhân trong nước và nước ngoài tại Việt Nam.
      trang_pdf: 1
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 2
      noi_dung: 'Điều 2. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Phòng bệnh là hoạt động y tế dự phòng nhằm ngăn ngừa sự phát sinh, ngăn chặn sự lây lan, tiến triển, giảm thiểu hậu quả của bệnh và nâng cao sức khỏe cá nhân, cộng đồng.'
      trang_pdf: 1
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 3
      noi_dung: Điều 3. Chính sách của Nhà nước về phòng bệnh 1. Nhà nước giữ vai trò chủ đạo, định hướng và huy động cơ quan, tổ chức, doanh nghiệp, gia đình, cá nhân và toàn xã hội tham gia phòng bệnh, giải quyết toàn diện, đồng bộ các vấn đề về phòng bệnh. 2. Ngân sách nhà nước bảo đảm kinh phí chi thường xuyên, chi đầu tư cho y tế dự phòng.
      trang_pdf: 3
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 10
      noi_dung: Điều 10. Trách nhiệm thông tin, giáo dục, truyền thông về phòng bệnh 1. Cơ quan quản lý nhà nước về phòng bệnh có trách nhiệm hướng dẫn thông tin, giáo dục, truyền thông về phòng bệnh; phối hợp với các cơ quan, tổ chức, cá nhân thực hiện thông tin, giáo dục, truyền thông về phòng bệnh.
      trang_pdf: 7
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 16
      noi_dung: 'Điều 16. Các biện pháp phòng, chống bệnh truyền nhiễm 1. Các biện pháp phòng, chống bệnh truyền nhiễm bao gồm: a) Giám sát bệnh truyền nhiễm thực hiện theo quy định tại Điều 13 của Luật này;'
      trang_pdf: 10
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 20
      noi_dung: 'Điều 20. Kiểm dịch y tế 1. Kiểm dịch y tế được thực hiện tại cửa khẩu. Đối tượng phải kiểm dịch y tế bao gồm: a) Người nhập cảnh, xuất cảnh, quá cảnh Việt Nam; b) Phương tiện vận chuyển nhập cảnh, xuất cảnh, quá cảnh Việt Nam; c) Hàng hoá nhập khẩu, xuất khẩu, quá cảnh Việt Nam; d) Thi thể, hài cốt, tro cốt, mẫu bệnh phẩm, mô, bộ phận cơ thể người vận chuyển qua biên giới Việt Nam.'
      trang_pdf: 14
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 22
      noi_dung: 'Điều 22. Tiêm chủng 1. Hình thức thực hiện tiêm chủng bao gồm: a) Tiêm chủng bắt buộc là việc cá nhân phải tiêm chủng vắc xin, sinh phẩm theo danh mục bệnh phải sử dụng vắc xin, sinh phẩm bắt buộc và tiêm chủng chống dịch; b) Tiêm chủng tự nguyện là việc cá nhân tự quyết định việc tiêm chủng vắc xin, sinh phẩm không thuộc quy định tại điểm a khoản này.'
      trang_pdf: 15
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 27
      noi_dung: Điều 27. Khám sức khỏe định kỳ, khám sàng lọc miễn phí 1. Người dân được hưởng chính sách khám sức khỏe định kỳ hoặc khám sàng lọc miễn phí ít nhất mỗi năm một lần theo nhóm đối tượng và lộ trình ưu tiên.
      trang_pdf: 18
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 33
      noi_dung: 'Điều 33. Quyền và trách nhiệm của cơ quan, tổ chức, cá nhân trong phòng, chống rối loạn tâm thần 1. Người có nguy cơ mắc rối loạn tâm thần và người mắc rối loạn tâm thần có quyền và nghĩa vụ sau đây: a) Được khám sàng lọc để phát hiện sớm, theo dõi; được hỗ trợ tâm lý, xã hội; được quản lý điều trị và sử dụng các dịch vụ chăm sóc y tế, xã hội phù hợp; b) Được ưu tiên và không bị ngược đãi, kỳ thị, phân biệt đối xử trong chăm sóc, điều trị y tế;'
      trang_pdf: 20
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 39
      noi_dung: Điều 39. Chế độ đối với người làm công tác phòng, chống bệnh truyền nhiễm và người tham gia chống dịch bệnh 1. Người làm công tác phòng, chống bệnh truyền nhiễm được hưởng lương, các chế độ phụ cấp nghề nghiệp và các chế độ khác của vị trí công việc theo quy định của pháp luật. 2. Người tham gia chống dịch bệnh được hưởng chế độ phụ cấp chống dịch bệnh và được hưởng chế độ rủi ro nghề nghiệp khi bị lây nhiễm bệnh.
      trang_pdf: 23
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 45
      noi_dung: Điều 45. Hiệu lực thi hành 1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026. 2. Luật Phòng, chống bệnh truyền nhiễm số 03/2007/QH12 đã được sửa đổi, bổ sung một số điều theo Luật số 15/2008/QH12 và Luật số 35/2018/QH14 hết hiệu lực từ ngày Luật này có hiệu lực thi hành.
      trang_pdf: 27
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
    - dieu: 46
      noi_dung: Điều 46. Quy định chuyển tiếp Các hợp đồng đã được ký kết, các kế hoạch đã được phê duyệt sử dụng nguồn kinh phí từ Quỹ phòng, chống tác hại của thuốc lá trước ngày Luật này có hiệu lực được Quỹ Phòng bệnh bảo đảm thực hiện từ ngày 01 tháng 7 năm 2026 đến hết thời hạn của hợp đồng, kế hoạch. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XV, Kỳ họp thứ 10 thông qua ngày 10 tháng 12 năm 2025. CHỦ TỊCH QUỐC HỘI Trần Thanh Mẫn
      trang_pdf: 27
      sha256_pdf: b8e1ab9a89892502a04af16145da1b932876f63b49f13a364d352edd13ba4366
