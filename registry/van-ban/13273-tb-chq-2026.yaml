  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/5/VB_13273.pdf, id=102693, SHA-256 bf2fa43e67d39f4da7a53d5adc55220520bd291627d8e6b2408e8c198027482b): Thông báo số 13273/TB-CHQ ngày 04-03-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ toan áo phẫu thuật chỉnh hình cơ xương khớp chung Orthopedic Pack (ký, mã hiệu V-OPP-002; chất liệu vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, định lượng 43-65 gsm, ép nhiệt và cắt may, khử trùng bằng khí EO dùng 1 lần; bộ gồm 1 toan trải bàn dụng cụ lớn 180 x 200 cm, 1 toan trải bàn dụng cụ nhỏ 120 x 140 cm, 1 toan phẫu thuật chỉnh hình cơ xương khớp chung 200 x 274 cm, 1 toan phủ vải không dệt 150 x 180 cm, 1 bao phủ chi Impervious Stockinette, 4 băng dính 7,5 x 40 cm, 9 khăn thấm 30 x 40 cm và 4 áo choàng phẫu thuật), phân loại vào nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90; có hiệu lực từ ngày ký'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-22'
