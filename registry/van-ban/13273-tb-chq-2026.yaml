ghi_chu: 'Xác định trước mã số mặt hàng Bộ toan áo phẫu thuật chỉnh hình cơ xương khớp chung Orthopedic Pack (ký, mã hiệu V-OPP-002; vải không dệt thành phần chính polypropylene kháng máu, kháng nước, kháng cồn, chống tĩnh điện, tiệt trùng bằng khí EO dùng 1 lần trong phòng mổ; gồm toan trải bàn dụng cụ, toan phẫu thuật chỉnh hình 200 x 274 cm, toan phủ 150 x 180 cm, bao phủ chi, băng dính, khăn thấm và áo choàng phẫu thuật) thuộc nhóm 63.07, phân nhóm 6307.90, mã số 6307.90.90.'
