xac_minh:
  muc: NGUON_A
  pham_vi: 'Đối chiếu thẻ vanban.chinhphu.vn (docid=196022) và toàn văn PDF ký số (06.signed_01.pdf, Thủ tướng Nguyễn Xuân Phúc ký): ban hành 22-01-2019, có hiệu lực từ 10-03-2019 (khoản 1 Điều 40); thay thế Nghị định 32/2006/NĐ-CP và Nghị định 82/2006/NĐ-CP (chưa nạp vào sổ), bãi bỏ các quy định về quản lý gỗ, thực vật rừng tại Thông tư 27/2018/TT-BNNPTNT; đang còn hiệu lực, được sửa đổi, bổ sung một số điều bởi Nghị định 84/2021/NĐ-CP ngày 22-09-2021 (chưa nạp vào sổ).'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-14'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: 'Điều 1. Phạm vi điều chỉnh Nghị định này quy định Danh mục các loài thực vật rừng, động vật rừng nguy cấp, quý, hiếm; chế độ quản lý, bảo vệ, trình tự, thủ tục khai thác các loài thực vật rừng, động vật rừng nguy cấp, quý, hiểm; nuôi động vật rừng thông thường: thực thi Công ước về buôn bán quốc tế các loài động vật, thực vật hoang dã nguy cấp (sau đây viết tắt là CITES) tại Việt Nam.'
      trang_pdf: 1
    - dieu: 2
      noi_dung: Điều 2. Đối tượng áp dụng Nghị định này áp dụng đối với cơ quan nhà nước, tô chức, hộ gia đình, cá nhân trong nước; người Việt Nam định cư ở nước ngoài và tô chức, cá nhân nước ngoài có hoạt động liên quan đến thực vật rừng, động vật rừng nguy cấp, quý, hiếm và các loài động vật, thực vật hoang dã nguy cấp thuộc các Phu luc CITES; nuôi động vật rừng thông thường trên lãnh thé Việt Nam.
      trang_pdf: 1
    - dieu: 3
      noi_dung: 'Điều 3. Giải thích từ ngữ Trong Nghị định này, các từ ngữ được hiểu như sau: 1. Loài dùng dé chỉ một loài, một phân loài hoặc một quan thé động vật, thực vật cách biệt vê địa ly.'
      trang_pdf: 2
    - dieu: 10
      noi_dung: 'Điều 10. Xử lý mẫu vật các loài thực vật rừng, động vật rừng nguy cấp, quý, hiếm sau tịch thu 1. Xử lý mẫu vật sống: a) Việc xử lý tịch thu phải chăm sóc mẫu vật, tránh rủi ro dé mẫu vật bị chết;'
      trang_pdf: 7
    - dieu: 15
      noi_dung: 'Điều 15. Điều kiện nuôi, trồng các loài động vật, thực vật hoang dã nguy cấp thuộc Phụ lục CITES vì mục đích thương mại 1. Đối với động vật: a) Đảm bảo nguồn giống hợp pháp: Khai thác hợp pháp; mẫu vật sau xử lý tịch thu theo quy định của pháp luật; nhập khâu hợp pháp hoặc mẫu vật từ cơ sở nuôi hợp pháp khác;'
      trang_pdf: 9
    - dieu: 21
      noi_dung: Điều 21. Điều kiện quá cảnh mẫu vật sống động vật hoang dã nguy cấp thuộc Phụ lục CITES 1. Có giấy phép CITES xuat khẩu, tái xuất khâu do Cơ quan thâm quyền quản lý CITES nước xuất khâu cấp. _ 2. Gửi bản sao giấy phép CITES xuất khẩu, tái xuất khâu tới Co quan thâm quyên quản ly CITES Việt Nam 15 ngày làm việc trước khi làm thủ tục quá cảnh.
      trang_pdf: 14
    - dieu: 26
      noi_dung: 'Điều 26. Trình tự, thú tục cấp phép CITES nhập nội từ biển mẫu vật động vật, thực vật hoang dã nguy cấp thuộc Phụ lục I, II CITES 1. Cơ quan thấm quyền quản lý CITES Việt Nam có trách nhiệm cấp giấy phép CITES nhập nội từ biển. 2. Hồ sơ dé nghị cấp giấy phép: a) Đề nghị nhập nội từ biển mẫu vật theo Mẫu số 15 tại Phụ lục ban hành kèm theo Nghị định này;'
      trang_pdf: 19
    - dieu: 31
      noi_dung: 'Điều 31. Giám định mẫu vật các loài động vật, thực vật hoang dã nguy cấp thuộc Phụ lục CITES 1. Mẫu vật các loài động vật, thực vật hoang dã nguy cấp thuộc các Phụ lục CITES được giám định trong những trường hợp sau: a) Cần xác định chính xác loài, loài phụ hoặc quan thé động vật, thực vật hoang da dé áp dụng các quy định phù hợp của pháp luật Việt Nam và CITES;'
      trang_pdf: 22
    - dieu: 35
      noi_dung: 'Điều 35. Công bố hạn ngạch xuất khẩu quốc tế; xây dựng hạn ngạch khai thắc 1. Công bố hạn ngạch xuất khâu quốc tế: a) Cơ quan thấm quyền quan ly CITES Việt Nam công bố trên Công thông tin điện tử Chính phủ và của Bộ Nông nghiệp và Phát triển nông thôn hạn ngạch xuất khẩu do Ban thư ký CITES thông báo đối với những loài có hạn ngạch xuất khâu quốc tế;'
      trang_pdf: 26
    - dieu: 41
      noi_dung: Điều 41. Điều khoản chuyển tiếp 1. Các cơ sở nuôi, trồng không vì mục đích thương mại thành lập trước khi Nghị định này có hiệu lực thi hành, trong thời hạn 03 (ba) thang kế từ ngày Nghị định này có hiệu lực, chủ cơ sở thực hiện mở số, ghi chép và lưu giữ sô theo dối đầu vật nuôi theo Mẫu số 16, số theo đõi cơ sở trồng thực vật theo Mẫu số 17 tại Phụ lục ban hành kèm theo Nghị định này;
      trang_pdf: 30
ghi_chu: 'Nạp tham chiếu CITES theo #247 — ca gỗ dùng để check tên khoa học loài (Fagus sylvatica = beech không thuộc CITES). Song song NĐ 102/2020.'
