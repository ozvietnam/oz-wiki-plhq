xac_minh:
  muc: NGUON_A
  pham_vi: 'Đã đối chiếu toàn văn nguồn bậc A từ PDF Công báo số 559 ngày 22-10-2026 (raw/download/congbaocdn.chinhphu.vn/384-2026-nd-cp.pdf, 8 trang, trang 2–9 của số Công báo, có lớp chữ ký số bởi Văn phòng Chính phủ ngày 22-10-2026, SHA-256 d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec), thẻ vanban.chinhphu.vn (docid=219934), toàn văn PDF ký số ngày 09-10-2026 bởi Phó Thủ tướng Phạm Gia Túc (384_2026_nd-cp_09102026-signed.signed.pdf) và trang wiki/sources/384-2026-nd-cp.md: Nghị định 384/2026/NĐ-CP gồm 12 Điều quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước (tiêu chí xuất xứ thuần túy tại Điều 5, xuất xứ không thuần túy theo chuyển đổi mã số HS 4 số hoặc hàm lượng giá trị Việt Nam VVC >= 30% tại Điều 6); có hiệu lực thi hành từ ngày 01-01-2027.'
  hieu_luc_da_doi_chieu: true
  ngay: '2026-11-21'
  boi: tho-bo-ba-01@ozvietnam
  dieu_khoan:
    - dieu: 1
      noi_dung: '1. Nghị định này quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước, bao gồm: hàng hóa có xuất xứ, hàng hóa có xuất xứ thuần túy, hàng hóa có xuất xứ không thuần túy, công đoạn gia công, chế biến đơn giản; yếu tố không được xem xét khi xác định xuất xứ; trách nhiệm của cơ quan, tổ chức, cá nhân có liên quan. 2. Nghị định này không điều chỉnh đối với các nội dung sau: a) Việc xác định xuất xứ hàng hóa để áp dụng biện pháp chứng nhận xuất xứ hàng hóa đối với hàng hóa xuất khẩu, hàng hóa nhập khẩu; b) Quy định về cách ghi nhãn hàng hóa và cách thức trình bày các nội dung bắt buộc khác trên nhãn hàng hóa; c) Hoạt động truy xuất nguồn gốc sản phẩm, hàng hóa.'
      trang_pdf: 1
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 2
      noi_dung: 'Nghị định này áp dụng đối với: 1. Thương nhân tham gia hoạt động sản xuất và thương mại hàng hóa lưu thông trong nước. 2. Cơ quan quản lý nhà nước, tổ chức, cá nhân trong nước có liên quan.'
      trang_pdf: 2
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 3
      noi_dung: 'Theo Nghị định này, các từ ngữ dưới đây được hiểu như sau: 1. “Nguyên liệu” là bất cứ vật liệu hay chất liệu nào được sử dụng hoặc tiêu tốn trong quá trình sản xuất ra hàng hóa hoặc kết hợp tự nhiên thành một hàng hóa khác hoặc tham gia vào quy trình sản xuất ra một hàng hóa khác. 2. “Chuyển đổi mã số hàng hóa” là sự thay đổi về mã số HS ở cấp độ 04 số (theo Hệ thống hài hòa về mô tả và mã hóa hàng hóa của Tổ chức Hải quan Thế giới) từ nguyên liệu không có xuất xứ để sản xuất ra hàng hóa tại Việt Nam. 3. “Hàm lượng giá trị Việt Nam - Viet Nam Value Content” (sau đây gọi là hàm lượng VVC) là phần giá trị gia tăng của Việt Nam, được tính trên tổng giá trị của hàng hóa. 4. “Giá xuất xưởng” là: a) Giá hàng hóa được trả cho nhà sản xuất đã tham gia vào quá trình sản xuất hoặc gia công cuối cùng, với điều kiện giá đó bao gồm trị giá của nguyên liệu được sử dụng và các chi phí khác phát sinh trong quá trình sản xuất, trừ các loại thuế, phí sẽ hoặc có thể được hoàn lại khi bán sản phẩm cuối cùng ra thị trường nội địa; b) Trường hợp giá xuất xưởng không phản ánh đầy đủ chi phí phát sinh trong quá trình sản xuất thực tế tại Việt Nam, giá xuất xưởng là tổng chi phí trừ đi các loại thuế, phí sẽ hoặc có thể được hoàn lại khi hàng hóa cuối cùng được đưa vào hoạt động thương mại trên thị trường nội địa; c) Trường hợp công đoạn gia công hoặc sản xuất cuối cùng được thương nhân ký hợp đồng phụ thuê một nhà sản xuất khác gia công, sản xuất, thuật ngữ “nhà sản xuất” tại khoản này được hiểu là thương nhân đi thuê gia công hoặc sản xuất. 5. “Trị giá nguyên liệu” là trị giá hải quan tại thời điểm nhập khẩu hoặc giá thu mua tại Việt Nam, đã bao gồm chi phí mua nguyên liệu, chi phí vận tải và các chi phí khác có liên quan cho đến khi nguyên liệu được sử dụng để sản xuất hàng hóa lưu thông trong nước.'
      trang_pdf: 2
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 4
      noi_dung: '1. Hàng hóa có xuất xứ Việt Nam khi thuộc một trong các trường hợp sau: a) Hàng hóa có xuất xứ thuần túy Việt Nam theo quy định tại Điều 5 Nghị định này; b) Hàng hóa có xuất xứ không thuần túy Việt Nam theo quy định tại Điều 6 Nghị định này. 2. Trong trường hợp cần thiết, bộ, cơ quan ngang bộ xây dựng quy định riêng về hàng hóa có xuất xứ Việt Nam đối với mặt hàng có tính chất đặc thù thuộc phạm vi quản lý, đảm bảo phù hợp quy định tại Nghị định này.'
      trang_pdf: 3
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 5
      noi_dung: 'Hàng hóa có xuất xứ thuần túy Việt Nam khi thuộc một trong các trường hợp sau: 1. Cây trồng và các sản phẩm từ cây trồng được trồng và thu hoạch tại Việt Nam. 2. Động vật được sinh ra hoặc nuôi dưỡng tại Việt Nam. 3. Sản phẩm từ động vật nêu tại khoản 2 Điều này. 4. Sản phẩm thu được từ săn bắn, đặt bẫy, đánh bắt, nuôi trồng, thu lượm hoặc săn bắt tại Việt Nam. 5. Khoáng sản và chất sản sinh tự nhiên được chiết xuất hoặc lấy ra từ đất, nước, đáy biển hoặc dưới đáy biển của Việt Nam. 6. Sản phẩm lấy từ nước, đáy biển hoặc dưới đáy biển bên ngoài lãnh hải của Việt Nam, với điều kiện Việt Nam có quyền khai thác đối với vùng nước, đáy biển và dưới đáy biển theo luật pháp quốc tế. 7. Sản phẩm đánh bắt và hải sản khác đánh bắt từ vùng biển cả bằng tàu được đăng ký ở Việt Nam và được phép treo cờ của Việt Nam. 8. Sản phẩm được chế biến hoặc được sản xuất ngay trên tàu từ sản phẩm nêu tại khoản 7 Điều này được đăng ký ở Việt Nam và được phép treo cờ của Việt Nam. 9. Vật phẩm thu được trong quá trình sản xuất hoặc tiêu dùng ở Việt Nam hiện không còn thực hiện được chức năng ban đầu, không thể sửa chữa hay khôi phục được và chỉ có thể vứt bỏ hoặc dùng làm các nguyên liệu, vật liệu thô, hoặc sử dụng vào mục đích tái chế. 10. Hàng hóa thu được hoặc được sản xuất từ sản phẩm theo quy định từ khoản 1 đến khoản 9 Điều này.'
      trang_pdf: 3
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 6
      noi_dung: 'Hàng hóa có xuất xứ không thuần túy Việt Nam khi thuộc một trong các trường hợp sau: 1. Chuyển đổi mã số hàng hóa. 2. Có hàm lượng VVC tối thiểu 30% được xác định theo một trong hai công thức sau: a) Công thức trực tiếp: VVC = Trị giá nguyên liệu có xuất xứ Giá xuất xưởng x 100% b) Công thức gián tiếp: VVC = Giá xuất xưởng - Trị giá nguyên liệu không có xuất xứ Giá xuất xưởng x 100% 3. Trị giá của vật liệu đóng gói và bao bì chứa đựng hàng hóa là một phần cấu thành nên hàng hóa và được tính vào hàm lượng VVC. 4. Đối với hàng hóa thuộc lĩnh vực công nghệ thông tin và công nghệ số, các công đoạn tạo ra giá trị sản phẩm thực hiện tại Việt Nam được tính vào hàm lượng VVC, bao gồm: chi phí nghiên cứu, phát triển; chi phí thiết kế, lập trình, số hóa, tự động hóa; chi phí thử nghiệm kỹ thuật và kiểm thử phần mềm gắn liền với quy trình tạo ra sản phẩm. Công đoạn gia công, chế biến đơn giản quy định tại khoản 2 Điều 7 Nghị định này và yếu tố không được xem xét khi xác định xuất xứ quy định tại Điều 8 Nghị định này không áp dụng đối với khoản này. 5. Thương nhân lựa chọn công thức trực tiếp hoặc công thức gián tiếp, áp dụng trong năm tài chính.'
      trang_pdf: 4
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 7
      noi_dung: '1. Công đoạn gia công, chế biến đơn giản là công đoạn không sử dụng kỹ năng đặc biệt, máy móc, dây chuyền hoặc thiết bị chuyên dụng và không được xét khi xác định xuất xứ hàng hóa Việt Nam theo quy định tại Điều 4, Điều 5 và Điều 6 Nghị định này. 2. Các công đoạn sau đây khi được thực hiện riêng rẽ hoặc kết hợp với nhau được xem là gia công, chế biến đơn giản: a) Công đoạn bảo quản hàng hóa trong quá trình vận chuyển và lưu kho (thông gió, trải ra, sấy khô, làm lạnh, ngâm trong muối, xông lưu huỳnh hoặc thêm các phụ gia khác, loại bỏ các bộ phận bị hư hỏng và các công đoạn tương tự); b) Công đoạn như lau chùi, bụi bặm, tẩy rỉ, tẩy dầu mỡ, tẩy sơn hoặc tẩy các chất phủ bề mặt khác; c) Thay đổi bao bì đóng gói và tháo dỡ hay lắp ghép các lô hàng; đóng chai, lọ, đóng gói, bao, hộp và các công việc đóng gói bao bì đơn giản khác; d) Dán hoặc in nhãn hiệu, nhãn, mác, lô-gô và các dấu hiệu phân biệt tương tự lên sản phẩm hoặc bao bì của sản phẩm; đ) Giần, sàng, lựa chọn, phân loại, xếp loại, xếp nhóm hoặc trộn đơn giản (bao gồm cả việc trộn các sản phẩm khác loại) mà không làm thay đổi bản chất của hàng hóa; e) Chia tách hoặc lắp ráp đơn giản các lô hàng; lắp ráp đơn giản các bộ phận của sản phẩm để tạo nên một sản phẩm hoàn chỉnh hoặc tháo rời sản phẩm thành từng phần; g) Xay xát, bóc vỏ, tẩy trắng một phần hoặc toàn bộ, đánh bóng và làm láng ngũ cốc và gạo; nhuộm màu đường hoặc tạo đường miếng; rạch vỏ, trích hạt hoặc tróc hạt một cách đơn giản; h) Mài sắc, mài giũa đơn giản hoặc cắt đơn giản; là hoặc ép thẳng vải; i) Kiểm tra hoặc thử nghiệm một cách đơn giản; k) Giết, mổ động vật. 3. Trong trường hợp cần thiết, bộ, cơ quan ngang bộ xây dựng quy định riêng về công đoạn gia công, chế biến đơn giản đối với mặt hàng có tính chất đặc thù thuộc phạm vi quản lý, đảm bảo phù hợp quy định tại Nghị định này.'
      trang_pdf: 4
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 8
      noi_dung: 'Yếu tố sử dụng trong quá trình sản xuất, kiểm tra, hoặc thử nghiệm hàng hóa nhưng không tạo nên hàng hóa, hoặc yếu tố sử dụng trong việc bảo dưỡng nhà xưởng, hoặc vận hành thiết bị có liên quan tới việc sản xuất hàng hóa không được xem xét khi xác định xuất xứ Việt Nam theo quy định tại Điều 4, Điều 5 và Điều 6 Nghị định này, bao gồm các yếu tố sau: 1. Nhiên liệu và năng lượng. 2. Dụng cụ, khuôn rập và khuôn đúc. 3. Phụ tùng, vật liệu dùng để bảo dưỡng thiết bị và nhà xưởng. 4. Dầu nhờn, chất bôi trơn, hợp chất và các nguyên liệu khác dùng trong sản xuất hoặc dùng để vận hành thiết bị và nhà xưởng. 5. Găng tay, kính, giày dép, quần áo và các thiết bị an toàn. 6. Thiết bị, dụng cụ và máy móc dùng để kiểm tra hoặc thử nghiệm hàng hóa. 7. Chất xúc tác và dung môi. 8. Bất kỳ nguyên liệu nào khác không cấu thành hàng hóa nhưng việc sử dụng nguyên liệu phải được chứng minh là cần thiết trong quá trình sản xuất ra hàng hóa.'
      trang_pdf: 5
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 9
      noi_dung: '1. Thương nhân, tổ chức, cá nhân thể hiện xuất xứ Việt Nam trên nhãn hàng hóa hoặc trên tài liệu, vật phẩm chứa đựng thông tin liên quan đến hàng hóa có trách nhiệm tuân thủ quy định tại Nghị định này. Đối với hàng hóa được thương nhân, tổ chức, cá nhân xác định xuất xứ Việt Nam, thương nhân, tổ chức, cá nhân có trách nhiệm tuân thủ quy định pháp luật về ghi nhãn hàng hóa, bảo vệ quyền lợi người tiêu dùng, chất lượng sản phẩm, hàng hóa và quy định pháp luật khác liên quan. 2. Thương nhân, tổ chức, cá nhân thể hiện xuất xứ Việt Nam chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của thông tin đã công bố; thực hiện lưu trữ hồ sơ, chứng từ chứng minh xuất xứ hàng hóa (bao gồm hóa đơn đầu vào, bảng kê nguyên vật liệu, mô tả quy trình sản xuất và các tài liệu khác có liên quan) để phục vụ công tác thanh tra, kiểm tra của cơ quan có thẩm quyền. Việc lưu trữ dưới dạng dữ liệu điện tử và văn bản thực hiện theo quy định của pháp luật về kế toán và pháp luật về lưu trữ. 3. Thương nhân, tổ chức, cá nhân chịu trách nhiệm chứng minh hàng hóa có xuất xứ Việt Nam theo quy định tại Nghị định này khi cơ quan có thẩm quyền yêu cầu. 4. Thương nhân, tổ chức, cá nhân có trách nhiệm tuân thủ pháp luật Việt Nam về xuất xứ hàng hóa xuất khẩu và quy định của nước nhập khẩu đối với hàng hóa sản xuất, lưu thông trong nước sau đó được xuất khẩu.'
      trang_pdf: 6
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 10
      noi_dung: '1. Bộ Công Thương có trách nhiệm: a) Chủ trì, phối hợp với các bộ, cơ quan ngang bộ, cơ quan, tổ chức liên quan tổ chức thi hành Nghị định này; b) Là cơ quan đầu mối giúp Chính phủ quản lý nhà nước về xuất xứ hàng hóa sản xuất và lưu thông trong nước; c) Tham mưu, tổng hợp, trình Chính phủ ban hành quy định yêu cầu, khung kỹ thuật và tiêu chí chung tại Nghị định này; tham gia ý kiến đối với văn bản quy định xác định xuất xứ riêng do bộ, cơ quan ngang bộ chủ trì; tổng hợp văn bản hướng dẫn quy định xác định xuất xứ Việt Nam đối với hàng hóa thuộc lĩnh vực quản lý chuyên ngành của bộ, cơ quan ngang bộ ban hành theo quy định tại khoản 2 Điều 4 và khoản 3 Điều 7 Nghị định này và đăng tải công khai tại Cổng thông tin điện tử Bộ Công Thương; d) Xây dựng, ban hành quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước theo thẩm quyền để phục vụ yêu cầu quản lý của Bộ Công Thương; đ) Phối hợp với bộ, cơ quan ngang bộ triển khai thực hiện quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước thuộc phạm vi quản lý nhà nước của bộ, cơ quan ngang bộ để phục vụ yêu cầu quản lý của bộ, cơ quan ngang bộ; e) Phối hợp với bộ, cơ quan ngang bộ thực hiện kết nối, chia sẻ cơ sở dữ liệu về xuất xứ hàng hóa sản xuất và lưu thông trong nước. 2. Bộ, cơ quan ngang bộ có trách nhiệm: a) Xây dựng, ban hành quy định xác định hàng hóa có xuất xứ Việt Nam đối với mặt hàng có tính chất đặc thù thuộc phạm vi được sản xuất và lưu thông trong nước trong trường hợp cần thiết; b) Chủ trì, phối hợp với Bộ Công Thương và cơ quan có thẩm quyền trong công tác kiểm tra, thực hiện quy định về xuất xứ hàng hóa sản xuất và lưu thông trong nước thuộc phạm vi quản lý; c) Định kỳ báo cáo tình hình thực hiện quy định tại Nghị định này về Bộ Công Thương để kịp thời báo cáo Chính phủ. 3. Ủy ban nhân dân tỉnh, thành phố có trách nhiệm: a) Quản lý, kiểm tra và phối hợp với bộ, cơ quan ngang bộ thực hiện quy định về xuất xứ hàng hóa sản xuất và lưu thông tại địa phương; b) Tổng hợp, báo cáo cơ quan đầu mối về tình hình xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông tại địa phương.'
      trang_pdf: 6
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 11
      noi_dung: '1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2027. 2. Trường hợp văn bản quy phạm pháp luật dẫn chiếu trong Nghị định này được thay thế hoặc sửa đổi, bổ sung, Nghị định này áp dụng theo văn bản quy phạm pháp luật được thay thế hoặc sửa đổi, bổ sung. 3. Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trong phạm vi chức năng, nhiệm vụ của mình chịu trách nhiệm hướng dẫn và thi hành Nghị định này.'
      trang_pdf: 7
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
    - dieu: 12
      noi_dung: 'Hàng hóa có nhãn thể hiện xuất xứ Việt Nam theo đúng quy định pháp luật trước thời điểm Nghị định này có hiệu lực được tiếp tục sử dụng nhãn đó đến khi hàng hóa hết hạn sử dụng.'
      trang_pdf: 8
      sha256_pdf: d6c5f4f5b38d6004b36ec644e39852375132567b9a849f601bd6e7cd7445b3ec
ghi_chu: Quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước (ban hành 09-10-2026, có hiệu lực từ 01-01-2027) — tách bạch với xuất xứ hàng hóa xuất khẩu, nhập khẩu theo FTA.
