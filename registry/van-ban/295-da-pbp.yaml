ghi_chu: >-
  Cục Điện ảnh (Bộ VHTTDL) thông báo cho Tổng cục Hải quan về việc từ 01-01-2023 không cấp giấy phép nhập khẩu và biên
  bản giám định văn hóa phẩm không nhằm mục đích kinh doanh có nội dung là phim; việc nhập khẩu phim thực hiện theo Điều
  17 Luật Điện ảnh 2022 và khoản 5 Điều 21 Nghị định 131/2022/NĐ-CP.
