    ảnh ngày 15-06-2022 và Nghị định 131/2022/NĐ-CP ngày 31-12-2022 có hiệu lực, khoản 5 Điều 21 NĐ 131/2022/NĐ-CP bãi
    bỏ Nghị định 22/2022/NĐ-CP sửa đổi Nghị định 32/2012/NĐ-CP), Cục Điện ảnh không cấp giấy phép nhập khẩu văn hóa phẩm
    và biên bản giám định văn hóa phẩm không nhằm mục đích kinh doanh có nội dung là phim nhập khẩu qua Hải quan; tổ
    chức, cá nhân nhập khẩu phim thực hiện cam kết bằng văn bản về nội dung phim không vi phạm Điều 9 theo Điều 17 Luật
    Điện ảnh 2022
