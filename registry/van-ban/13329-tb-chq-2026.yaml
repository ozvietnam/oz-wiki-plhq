  pham_vi: 'đối chiếu toàn văn PDF ký số bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2026/3/5/VB_13329.pdf, id=102707, SHA-256 07a959ad99b31cae3c9e297a1a9341af905f5d3e865a654664855f8d6689c9f9): Thông báo số 13329/TB-CHQ ngày 04-03-2026 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Bộ cấp nguồn của đèn LED (ký, mã hiệu Model SLB450N801N1A, Part No PSNH450801D(L); cấu tạo gồm vỏ nhựa, dây điện, bản mạch gắn bộ lọc nhiễu điện từ EMI, đi-ốt chỉnh lưu cầu AC-DC, khối dao động chuyển đổi DC-DC cấu trúc LLC, MOSFET đóng mở tần số cao, biến áp xung cách ly hạ áp và tụ lọc; kích thước 186 x 31 x 22 mm, khối lượng 110 g, điện áp đầu vào 200-250 VAC 50/60 Hz công suất 47 W, điện áp đầu ra 23-50 VDC công suất 40 W), phân loại vào nhóm 85.04, phân nhóm 8504.40, mã số 8504.40.90; có hiệu lực từ ngày ký'
