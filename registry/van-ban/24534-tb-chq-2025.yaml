  muc: NGUON_A
  pham_vi: 'đối chiếu toàn văn PDF bậc A trên Cổng Hải quan (files.customs.gov.vn/CustomsCMS/TONG_CUC/2025/9/17/VBDI_24534.pdf, id=101352, SHA-256 ff82083ad6a4ec95320b137d619a719a414381c5df9793691bebd0c36dbb9bbc): Thông báo số 24534/TB-CHQ ngày 16-09-2025 của Cục Hải quan về kết quả xác định trước mã số đối với mặt hàng Thiết bị lưu trữ dữ liệu phân tán (ký, mã hiệu OceanStor Pacific 9920; cấu tạo gồm khung máy chính 2U 25 khe SSD kích thước 86.1 x 447 x 830 mm nặng 38 kg, 2 bộ xử lý điều khiển Kunpeng 920 48 core, bộ nhớ RAM 16GB DDR4 x 16, 2 ổ cứng M.2 SSD SATA 3.0 480GB lưu trữ hệ điều hành và phần mềm quản lý, 17 ổ cứng 30.72TB SSD NVMe Palm Disk unit lưu trữ dữ liệu, card mạng 1x100G Dual Port QSFP28-PCIe 4.0 kèm module quang 2xQSFP28-100G-SR4; hoạt động theo nguyên lý lưu trữ phân tán với cơ chế mã hóa xóa Erasure Coding, hỗ trợ đa giao thức SMB/CIFS, NFS, iSCSI, S3, HDFS, chuyên xử lý dữ liệu phi cấu trúc băng thông cao và độ trễ thấp cho doanh nghiệp và trung tâm dữ liệu), phân loại vào nhóm 84.71, phân nhóm 8471.70, mã số 8471.70.90; có hiệu lực từ ngày ký'
