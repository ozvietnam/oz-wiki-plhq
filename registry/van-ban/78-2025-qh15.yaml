  pham_vi: 'đối chiếu thẻ vanban.chinhphu.vn (docid=214606, người ký Chủ tịch Quốc hội Trần Thanh Mẫn, tệp đính kèm 78qh.signed.pdf) và các văn bản căn cứ trong sổ: Luật số 78/2025/QH15 của Quốc hội sửa đổi, bổ sung một số điều của Luật Chất lượng sản phẩm, hàng hóa số 05/2007/QH12, thông qua ngày 18-06-2025, có hiệu lực thi hành từ ngày 01-01-2026; đối chiếu đang còn hiệu lực (không có văn bản thay thế hoặc bãi bỏ trong sổ)'
