# Mapping mã HS từ văn bản pháp luật cũ → biểu thuế EN2022
# Ngày tạo: 2026-10-15
# Tác giả: Hermes (Sếp Thắng)
# Nguồn: 114 mã HS trong văn bản pháp luật VN không có trong biểu thuế EN2022
# Phân tích: dist/hs-index-theo-ma.json (canh_bao_ma = 114 mã)
# Mapping: 100% tự động + thủ công, tất cả mã đích có trong tax.json

thong_tin:
  ngay_tao: "2026-10-15"
  so_ma: 114
  phien_ban_cu: "AHTN 2017 / Biểu thuế VN trước EN2022"
  phien_ban_moi: "EN2022 (TT 31/2022/TT-BTC)"
