n Nhân dân Tối cao Việt Nam\"},\"foreign\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHi 8.js\",\"3911\",\"static/chunks/3911-317a706af8dde810.js\",\"1870\",\"static/chunks/1870-6c442a62b9aa4b08.js\",\"8510\",\"static/chunks/8510-5152690b3aa4b6a7.js\",\"956\",\"static/chunks/956-dcc326b2041b88f5.js\",\"119\",\"static/chunks/119-af8d6d47e84615fe.js\",\"6625\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:Taa7c,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003ctitle\u003eTHÔNG TU\u003c/title\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eTHÔNG TƯ\u003c/p\u003e\u003ci\u003e\n  \u003cp align=\"CENTER\"\u003eHướng dẫn thực hiện việc phân loại hàng hoá theo Danh mục hàng hoá xuất khẩu,\u003c/p\u003e\n  \u003cp align=\"CENTER\"\u003enhập khẩu và Biểu thuế nhập khẩu ưu đãi, Biểu thuế xuất khẩu\u003c/p\u003e\u003c/i\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eCăn cứ Luật Thuế xuất khẩu, thuế nhập khẩu đã được sửa đổi, bổ sung, được Quốc hội khoá 10 thông qua ngày 20 tháng 5 năm 1998; \u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eCăn cứ Luật Hải quan đã được Quốc Hội khoá 10 thông qua ngày 29 tháng 6 năm 2001;\u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eCăn cứ Quyết định số 49/QĐ-CTN ngày 06 tháng 3 năm 1998 của Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam về việc Việt Nam tham gia Công ước HS;\u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eCăn cứ các Nghị định 54/CP ngày 28/8/1993 và Nghị định 94/1998/NĐ-CP ngày 17/11/1998 của Chính phủ quy định chi tiết thi hành Luật Thuế xuất khẩu, thuế nhập khẩu;\u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eNghị định số 06/2003/NĐ-CP ngày 22 tháng 01 năm 2003 của Chính phủ quy định về việc phân loại hàng hoá xuất khẩu, nhập khẩu.\u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eCăn cứ Nghị định 77/2003/NĐ-CP ngày 1/7/2003 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Tài chính.\u003c/i\u003e\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003ci\u003eBộ Tài chính hướng dẫn thực hiện phân loại hàng hoá xuất khẩu, nhập khẩu như sau:\u003c/i\u003e\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eA. QUY ĐỊNH CHUNG\u003c/p\u003e\n \u003cp\u003eI. QUY ĐỊNH CHUNG:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1. Danh mục hàng hoá xuất nhập khẩu Việt Nam được xây dựng trên cơ sở Danh mục Hệ thống điều hoà mô tả và mã hoá hàng hoá của Tổ chức Hải quan thế giới (viết tắt là Danh mục HS) phiên bản 2002 và được chi tiết ở cấp mã tối thiểu 8 (tám) chữ số.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2. Các nguyên tắc phân loại hàng hoá quy định trong Thông tư này được áp dụng cho việc phân loại hàng hoá theo Danh mục hàng hoá xuất khẩu, nhập khẩu, Biểu thuế nhập khẩu ưu đãi, Biểu thuế xuất khẩu và các Danh mục hàng hoá được hưởng thuế suất ưu đãi đặc biệt mà Việt Nam cam kết với các nước hoặc các tổ chức kinh tế khu vực hoặc quốc tế.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3. Các quy định về phân loại hàng hoá xuất khẩu, nhập khẩu quy định trong Thông tư này được áp dụng trong lĩnh vực hải quan (gồm phân loại trước khi xuất khẩu, nhập khẩu hàng hoá, trong quá trình thực hiện thủ tục hải quan và kiểm tra sau thông quan), thuế, thống kê thương mại và các lĩnh vực quản lý nhà nước khác có liên quan đến hoạt động xuất khẩu, nhập khẩu hàng hoá.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eII. CẤU TẠO DANH MỤC HÀNG HOÁ XUẤT KHẨU, NHẬP KHẨU; BIỂU THUẾ NHẬP KHẨU ƯU ĐÃI; BIỂU THUẾ XUẤT KHẨU\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Danh mục hàng hoá xuất khẩu, nhập khẩu bao gồm:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.1. 6 quy tắc tổng quát (Phụ lục 1 ban hành kèm theo Thông tư này);\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.2. Các Chú giải bắt buộc (nằm ở đầu các phần, chương của Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam);\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.3. Danh mục hàng hoá chi tiết.\u003c/p\u003e\u003cb\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003cb\u003e2. Danh mục hàng hoá chi tiết và Biểu thuế nhập khẩu ưu đãi: \u003c/b\u003egồm có 21 Phần, 97 Chương (trong đó, Chương 77 là chương để dự phòng), các nhóm, phân nhóm và danh mục chi tiết các mặt hàng.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e3. Danh mục hàng hoá xuất khẩu, nhập khẩu và Biểu thuế nhập khẩu ưu đãi được chia thành 5 cột:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 1: là cột mã hiệu của nhóm hàng;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 2: là cột mã hiệu của phân nhóm hàng 6 số;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 3: là cột mã hiệu của phân nhóm hàng 8 số;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 4: là cột mô tả hàng hoá;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 5: Đơn vị tính (trong Danh mục hàng hoá xuất khẩu, nhập khẩu), hoặc thuế suất (trong Biểu thuế nhập khẩu ưu đãi).\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e4. Biểu thuế xuất khẩu:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eRiêng Biểu thuế xuất khẩu không xây dựng danh mục đầy đủ theo Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam mà chỉ chi tiết những nhóm mặt hàng chịu thuế xuất khẩu. Biểu thuế xuất khẩu được chia thành 4 cột:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 1, là cột số thứ tự của nhóm mặt hàng chịu thuế xuất khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 2, là cột mô tả hàng hoá.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 3, là nhóm, mã số có chứa nhóm mặt hàng chịu thuế xuất khẩu\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cột thứ 4, là cột thuế suất thuế xuất khẩu.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eIII. GIẢI THÍCH MỘT SỐ KHÁI NIỆM\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Nhóm hàng\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eTại Danh mục hàng hoá xuất khẩu, nhập khẩu, mỗi chương được chi tiết thành nhiều nhóm hàng, mỗi nhóm hàng được mã hoá bằng 4 chữ số.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Nhóm hàng \"Quặng kim loại quý và tinh quặng kim loại quý\" được mã hoá bằng mã hiệu 2616, trong đó hai chữ số đầu (26) là mã hiệu của chương (chương thứ 26 của Danh mục hàng hoá), hai chữ số sau (16) là mã hiệu xác định vị trí của nhóm đó trong chương (nhóm thứ 16 của chương).\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2. Phân nhóm hàng được mã hoá bằng 6 chữ số (phân nhóm 6 số)\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Mỗi nhóm hàng có thể được chi tiết hoặc không chi tiết thành nhiều phân nhóm 6 số.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Phân nhóm \"- cừu\" được mã hoá bằng mã hiệu 010410, trong đó hai chữ số đầu (01) là mã hiệu của chương (chương thứ 01), 2 chữ số tiếp theo (04) là mã hiệu xác định vị trí của nhóm đó trong chương (nhóm thứ 4 của chương), 2 chữ số tiếp theo (10) xác định vị trí của phân nhóm đó trong nhóm (phân nhóm thứ nhất của nhóm).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Có hai cách phân loại và mã hiệu cho phân nhóm hàng, còn gọi là phân nhóm cấp 1 và phân nhóm cấp 2. Trong đó:\u003c/p\u003e\u003cb\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003cb\u003ePhân nhóm cấp 1\u003c/b\u003e:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eCó chữ số cuối cùng của phân nhóm là chữ số 0 và được ký hiệu bằng 1 vạch (-) ở cột mô tả nhóm mặt hàng (cột 4).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: phân nhóm 0101.90, 1901.10, 8703.10.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp phân nhóm cấp 1 được chia tiếp thành phân nhóm cấp 2, thì phân nhóm cấp 1 này không được đánh mã số mà được ký hiệu bằng 1 vạch (-) ở cột mô tả nhóm mặt hàng vì phân nhóm này được chia tiếp thành 3 phân nhóm cấp 2, ví dụ: 1604.11, 1604.12, 1604.13.\u003c/p\u003e\u003cb\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e\u003cb\u003ePhân nhóm cấp 2\u003c/b\u003e:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eCó chữ số cuối cùng của phân nhóm là 1, 2, 3, 4, 5, 6, 7, 8, 9 và được ký hiệu bằng 2 vạch (--) ở cột mô tả nhóm mặt hàng.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: phân nhóm 1602.32, 2101.11, 2839.19.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e3. Phân nhóm hàng được mã hóa bằng 8 chữ số (phân nhóm 8 số)\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e3.1. Một số nhóm hàng trong Danh mục hàng hoá không chi tiết thành các phân nhóm 6 số mà chi tiết luôn thành các phân nhóm 8 số thì ngoài mã số nhóm hàng, các phân nhóm này được mã hoá thêm 4 chữ số: 00X0 (trong đó X là một trong các chữ số: 1, 2, 3, 4, 5, 6, 7, 8, 9).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Nhóm 7905 \" Kẽm ở dạng tấm, lá, dải và lá mỏng\", không chi tiết thành các phân nhóm 6 số nhưng có chi tiết thành các phân nhóm 8 số và được mã hoá thành: 7905.00.10 \"- Dây, thanh và que, chưa xử lý bề mặt\" và 7905.00.90 \"- Loại khác\".\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3.2. Nhiều phân nhóm 6 số trong Danh mục hàng hoá được chi tiết thành các phân nhóm 8 số theo hệ thống vạch như sau:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Các phân nhóm 8 số thuộc các phân nhóm 6 số cấp 1 (một vạch) sẽ bắt đầu bằng cấp độ hai vạch (- -) ở cột mô tả nhóm mặt hàng (cột 4);\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Các phân nhóm 8 số thuộc các phân nhóm 6 số cấp 2 (hai vạch) sẽ bắt đầu bằng cấp độ ba vạch (- - -) ở cột mô tả hàng hoá (cột 4).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: phân nhóm hàng \"- - cà rốt\" có mã số hàng hoá là 0706.10.10, thuộc phân nhóm 6 số cấp 1 (một vạch) 0706.10 và bắt đầu bằng 2 vạch ở cột mô tả hàng hoá. Trong đó hai chữ số đầu (07) là mã hiệu của chương: chương 07; hai chữ số tiếp theo (06) là vị trí của nhóm đó trong chương: nhóm thứ 06; hai chữ số tiếp theo (10) là vị trí của phân nhóm 6 số trong nhóm: vị trí thứ nhất; hai chữ số cuối (10) là vị trí của phân nhóm hàng cà rốt trong phân nhóm hàng 6 số: phân nhóm hàng 8 số thứ nhất.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3.3. Tuỳ theo mức độ chi tiết của hàng hoá mà các phân nhóm 8 số sẽ được chi tiết cụ thể thành các phân nhóm hàng: 8 số 3 vạch (- - -) ; 8 số 4 vạch (- - - -); 8 số 5 vạch (- - - - -); 8 số 6 vạch (- - - - - -).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Các mặt hàng thuộc nhóm 8704 được chi tiết đến cấp phân nhóm 8 số 5 vạch (8704.22.11, 8704.22.12...) và 8 số 6 vạch (8703.90.62, 8703.96.63...).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3.4. Trường hợp các phân nhóm 6 số không chi tiết thành các phân nhóm hàng tiếp theo thì sẽ được mã hoá thêm hai chữ số 0 (00).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: phân nhóm 0106.11 \"- - Bộ động vật linh trưởng\" được thêm 00 vào sau cùng thành 0106.11.00.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3.5. Trường hợp các nhóm hàng không chi tiết thành các phân nhóm hàng 6 số cũng như không chi tiết thành các phân nhóm hàng 8 số thì thêm 4 chữ số 0 (0000) vào sau cùng.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Nhóm 1004 \"Yến mạch\", không chi tiết thành phân nhóm hàng 6 số cũng như không chi tiết thành phân nhóm hàng 8 số nên sẽ thêm 4 chữ số 0 vào sau cùng thành; 1004.00.00.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e4. Thuế suất\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e4.1. Thuế suất thuế nhập khẩu:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eThuế suất được quy định trong Biểu thuế nhập khẩu là thuế suất ưu đãi do Bộ trưởng Bộ Tài chính ban hành. Thuế suất ưu đãi được quy định cho nhóm hàng nếu nhóm này không chia thành các phân nhóm hàng 6 số hoặc các phân nhóm hàng 8 số; hoặc cho phân nhóm hàng 6 số nếu phân nhóm này không chia thành các phân nhóm hàng 8 số; hoặc cho phân nhóm hàng 8 số nếu các nhóm hàng hoặc các phân nhóm hàng 6 số chia thành các phân nhóm hàng 8 số.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eNguyên tắc phân loại hàng hoá để áp dụng thuế suất thuế nhập khẩu thông thường, ưu đãi, ưu đãi đặc biệt thực hiện thống nhất theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e4.2. Thuế suất thuế xuất khẩu:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eCác nhóm mặt hàng không được ghi cụ thể tên và mã số trong Biểu thuế xuất khẩu là những nhóm mặt hàng có thuế suất thuế xuất khẩu 0% (không phần trăm). Các nhóm mặt hàng được ghi rõ tên trong Biểu thuế xuất khẩu là những nhóm mặt hàng chịu thuế xuất khẩu.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eB. PHÂN LOẠI HÀNG HOÁ THEO DANH MỤC HÀNG HOÁ XUẤT KHẨU, NHẬP KHẨU;\u003c/p\u003e\n \u003cp align=\"CENTER\"\u003eBIỂU THUẾ NHẬP KHẨU ƯU ĐÃI; BIỂU THUẾ XUẤT KHẨU\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003eI. NGUYÊN TẮC PHÂN LOẠI:\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Nguyên tắc chung:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.1. Khi phân loại hàng hoá xuất khẩu, nhập khẩu để xác định mã số của hàng hoá theo Danh mục hàng hoá xuất khẩu, nhập khẩu và Biểu thuế nhập khẩu ưu đãi, Biểu thuế xuất khẩu phải tuân thủ nguyên tắc:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Tuân thủ Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam; Biểu thuế nhập khẩu ưu đãi; Biểu thuế xuất khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Tuân thủ 6 Quy tắc tổng quát của Công ước HS;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Tuân thủ các Chú giải bắt buộc của Công ước HS;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.2. Ngoài các căn cứ nêu trên, khi phân loại hàng hoá cần tham khảo thêm Chú giải bổ sung của Danh mục thuế quan hài hoà Asean (AHTN) ban hành tại Phụ lục 2 kèm theo Thông tư này và Chú giải chi tiết Hệ thống hài hoà mô tả và mã hoá hàng hoá của Tổ chức Hải quan thế giới.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.3. Một mặt hàng sau khi phân loại phải có mã số đầy đủ là 8 chữ số và chỉ được xếp vào một mã số duy nhất theo Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.4. Đối với hàng hoá xuất khẩu: Trường hợp một mặt hàng xuất khẩu nào đó không được quy định chi tiết trong Danh mục Biểu thuế xuất khẩu thì khi làm thủ tục hải quan, người khai hải quan vẫn phải kê khai tên hàng và mã số của mặt hàng đó theo Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Mặt hàng \"củ hành giống\" không được chi tiết mã số và tên hàng trong Biểu thuế xuất khẩu. Khi làm thủ tục hải quan, người khai hải quan vẫn phải kê khai đầy đủ tên hàng, mã số 0703.10.11, thuế suất thuế xuất khẩu 0%.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2. Quy định riêng áp dụng cho một số hàng hoá nhập khẩu dưới đây:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1. Phân loại thiết bị toàn bộ, thiết bị đồng bộ\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.1. Nguyên tắc phân loại\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.1.1. Hàng hoá nhập khẩu là một tập hợp các máy móc thuộc các nhóm, phân nhóm hàng của các Chương 84, 85, 86, 88, 89, 90 của Biểu thuế nhập khẩu ưu đãi hiện hành được áp dụng nguyên tắc phân loại theo máy chính để tính thuế nhập khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eĐối với các trường hợp nhập khẩu lô hàng thiết bị toàn bộ gồm nhiều các tập hợp máy móc khác nhau hoặc nhiều dây chuyền khác nhau, trong đó mỗi tập hợp/dây chuyền này có một máy chính thì những trường hợp này cần phân loại lô hàng nhập khẩu thành từng nhóm các máy móc thiết bị tương ứng với từng dây chuyền để tính thuế theo đúng nguyên tắc đã hướng dẫn nêu trên.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp máy chính có mức thuế nhập khẩu cao hơn mức thuế nhập khẩu của các máy móc thiết bị khác trong tập hợp các máy móc nhập khẩu thì các doanh nghiệp được lựa chọn việc áp dụng cách phân loại theo máy chính hoặc phân loại theo từng máy.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eNếu lô hàng thiết bị toàn bộ, thiết bị đồng bộ nhập khẩu ngoài tập hợp các máy móc, thiết bị còn bao gồm cả vật tư, nguyên liệu, vật liệu, phụ liệu, nhiên liệu, nhà xưởng, ô tô thì chỉ áp dụng nguyên tắc phân loại theo máy chính để tính thuế nhập khẩu cho tập hợp các máy móc thuộc các Chương 84, 85, 86, 88, 89, 90 của Biểu thuế nhập khẩu ưu đãi hiện hành; không áp dụng nguyên tắc phân loại theo máy chính để tính thuế nhập khẩu đối với hàng hoá nhập khẩu là các vật tư, nguyên liệu, vật liệu, phụ liệu, nhiên liệu, nhà xưởng, ôtô (những mặt hàng này thực hiện theo nguyên tắc: phân loại đúng mã số quy định cho mặt hàng đó tại Biểu thuế nhập khẩu ưu đãi hiện hành).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.1.2. Tập hợp các máy móc được áp dụng nguyên tắc phân loại theo máy chính gồm ít nhất từ hai máy, thiết bị trở lên thuộc một hoặc nhiều nhóm, phân nhóm hàng của các Chương 84, 85, 86, 88, 89, 90 của Biểu thuế nhập khẩu ưu đãi hiện hành. Tập hợp các máy móc này có thể là một tổ hợp (ví dụ: tổ hợp các máy móc thiết bị truyền hình gồm thiết bị thu, thiết bị truyền, camera.., tổ hợp sản xuất thuốc lá điếu gồm máy chế biến thuốc lá, máy vê thuốc, kèm thiết bị đóng gói..) hoặc chúng có thể là một dây chuyền (Ví dụ: dây chuyền may quần áo gồm máy may, máy vắt sổ, máy thùa khuyết, máy đính cúc, máy thiết kế mẫu, bàn may, máy cắt, máy phát điện...). Các máy móc khác nhau của tập hợp các máy móc này có tính chất bổ trợ gắn kết với nhau để đồng thời hay gối đầu nhau nhằm thực hiện chức năng riêng của từng máy và của cả hệ thống.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.1.3. Tập hợp các máy móc được áp dụng nguyên tắc phân loại theo máy chính nêu tại điểm 2.1.1 và 2.1.2 có thể là:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003ea) Được nhập khẩu từ một hoặc nhiều thị trường khác nhau, có xuất xứ từ một hoặc nhiều khu vực hoặc từ nhiều nước khác nhau, nhập về cùng chuyến hoặc không cùng một chuyến nhưng tập hợp các máy móc, thiết bị nhập khẩu tạo thành một tổ hợp hoặc một dây chuyền với một chuỗi các máy móc, thiết bị liên kết với nhau, có tính chất bổ trợ cho nhau để đồng thời hay gối đầu nhau thực hiện các chức năng riêng biệt của từng máy và của cả hệ thống.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eb) Vừa nhập khẩu vừa tự sản xuất hoặc mua trong nước nhưng phải đáp ứng 3 điều kiện:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Máy chính phải là máy được nhập khẩu;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Tập hợp các máy móc, thiết bị vừa nhập khẩu vừa tự sản xuất hoặc mua trong nước tạo thành một tổ hợp hoặc một dây chuyền với một chuỗi các máy móc, thiết bị liên kết với nhau, có tính chất bổ trợ cho nhau để đồng thời hay gối đầu nhau nhằm thực hiện các chức năng riêng biệt của từng máy và của cả hệ thống;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Đối tượng sử dụng tập hợp các máy móc vừa nhập khẩu vừa tự sản xuất hoặc mua máy móc do trong nước sản xuất phải tự kê khai và chịu trách nhiệm trước pháp luật về loại máy móc tự sản xuất hoặc mua trong nước, tên đơn vị sản xuất hoặc đơn vị cung cấp máy và chịu trách nhiệm trước pháp luật về việc kê khai này. Trường hợp kê khai sai thì ngoài việc bị truy thu thuế nhập khẩu theo đúng mã số của từng máy móc thiết bị quy định của Biểu thuế nhập khẩu tại thời điểm truy thu còn bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự theo quy định hiện hành của Luật thuế xuất khẩu, thuế nhập khẩu và các văn bản pháp luật có liên quan.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2.1.2. Thủ tục hồ sơ để phân loại và tính thuế nhập khẩu theo máy chính.\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eHàng hoá nhập khẩu là thiết bị toàn bộ, thiết bị đồng bộ được tính thuế nhập khẩu theo máy chính phải có đủ các hồ sơ sau đây:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.2.1. Luận chứng kinh tế kỹ thuật hoặc Dự án đầu tư thiết bị toàn bộ hoặc thiết bị đồng bộ được cơ quan có thẩm quyền phê duyệt, trong đó ghi rõ tên máy móc thiết bị nhập khẩu, sản xuất hoặc mua trong nước. Doanh nghiệp xuất trình bản chính để cơ quan hải quan đối chiếu khi làm thủ tục nhập khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.2.2. Văn bản xác nhận của cơ quan quản lý chuyên ngành về máy chính của lô hàng thiết bị toàn bộ, thiết bị đồng bộ nhập khẩu. Doanh nghiệp nộp bản chính cho cơ quan hải quan khi làm thủ tục. Cơ quan quản lý chuyên ngành là cơ quan quản lý có tính chất chuyên ngành đối với việc sử dụng máy móc, thiết bị nhập khẩu, có thể cấp Bộ hoặc cấp Sở. Cơ quan quản lý chuyên ngành chịu trách nhiệm trước pháp luật về việc xác nhận của mình.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eVí dụ: Doanh nghiệp Cổ phần X thuộc Thành phố Hà Nội có nhập khẩu tập hợp máy móc làm bia, thì cơ quan xác nhận máy chính là Bộ Công nghiệp hoặc Sở Công nghiệp, không phải là Uỷ ban nhân dân các cấp. Công ty liên doanh B đóng tại địa phương Quảng Ninh có nhập một dây chuyền sản xuất gạch thì cơ quan xác nhận máy chính là Bộ Xây dựng, không phải Bộ hoặc Sở kế hoạch tỉnh.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp có vướng mắc trong việc xác nhận máy chính thì cơ quan quản lý chuyên ngành trao đổi với Bộ Tài chính và các Bộ, ngành có liên quan để xác định máy chính làm căn cứ tính thuế nhập khẩu các máy móc, thiết bị này.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.2.3. Hợp đồng nhập khẩu (trực tiếp hoặc uỷ thác), Bảng kê chi tiết lô hàng nhập khẩu (Packing list) và các chứng từ khác (nếu có) ghi rõ tên các loại máy móc thiết bị nhập khẩu (nộp bản chính cho cơ quan hải quan).\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2.1.3. Thực hiện việc tính thuế.\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.3.1. Căn cứ vào hồ sơ quy định tại điểm 2.1.2 trên đây và kết quả kiểm tra hàng hoá thực nhập khẩu, hoặc vừa nhập khẩu vừa tự sản xuất hoặc mua trong nước (nếu có) phù hợp quy định tại Thông tư này thì cơ quan hải quan nơi làm tục nhập khẩu sẽ tính thuế tập hợp các máy móc của thiết bị toàn bộ hoặc thiết bị đồng bộ theo máy chính và mở sổ để theo dõi hàng hoá thực nhập với Danh mục hàng hoá cần nhập khẩu đã được cơ quan phê duyệt Luận chứng kinh tế kỹ thuật hoặc Dự án đầu tư duyệt.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.3.2. Nếu nghi ngờ việc xác nhận của cơ quan có thẩm quyền là không chính xác, thì cơ quan hải quan làm thủ tục nhập khẩu vẫn thực hiện tạm tính thuế theo máy chính đã được xác nhận và phản ảnh ngay cho cơ quan xác nhận biết đồng thời báo cáo Tổng cục Hải quan giải quyết. Trường hợp còn vướng mắc, Tổng cục Hải quan sẽ báo cáo Bộ Tài chính để làm việc với các Bộ, ngành có liên quan giải quyết.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp xác nhận của cơ quan có thẩm quyền không phù hợp thì hàng hoá nhập khẩu sẽ được tính lại thuế. Nếu số tiền thuế nhập khẩu đã nộp nhiều hơn số thuế phải nộp theo mức thuế tính lại, đơn vị nhập khẩu thiết bị toàn bộ, thiết bị đồng bộ sẽ được hoàn thuế hoặc khấu trừ vào số thuế phải nộp của lô hàng sau. Nếu số tiền thuế đã nộp ít hơn số thuế phải nộp theo mức thuế tính lại, cơ quan hải quan sẽ thực hiện việc truy thu thuế đối với hàng hoá đã làm thủ tục.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eViệc thực hiện truy thu, truy hoàn hoặc khấu trừ thuế được thực hiện theo quy định của Luật thuế xuất khẩu, thuế nhập khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.3.3. Các trường hợp kê khai nhập khẩu tập hợp máy móc, thiết bị đồng bộ hoặc thiết bị toàn bộ để được tính và nộp thuế nhập khẩu theo máy chính nhưng thực tế không sử dụng máy móc thiết bị này thành một tổ hợp hoặc dây chuyền mà sử dụng theo máy riêng lẻ, thì ngoài việc truy thu thuế nhập khẩu theo đúng mức thuế nhập khẩu quy định cho từng máy, đơn vị còn bị xử lý hành chính hoặc truy cứu trách nhiệm hình sự theo quy định hiện hành của Luật thuế xuất khẩu, thuế nhập khẩu và các văn bản pháp luật liên quan.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.3.4. Bộ Tài chính sẽ phối hợp với các Bộ ngành có liên quan để xử lý cụ thể việc áp dụng nguyên tắc phân loại theo máy chính cho các trường hợp nhập khẩu tập hợp máy móc của thiết bị toàn bộ, thiết bị đồng bộ ngoài các máy móc, thiết bị thuộc các nhóm hoặc phân nhóm hàng của các chương 84, 85, 86, 88, 89, 90 của Biểu thuế nhập khẩu ưu đãi hiện hành. (Ví dụ: thiết bị toàn bộ đường ống dẫn khí).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1.3.5. Tập hợp các máy móc thiết bị thuộc các nhóm hàng, phân nhóm hàng của các chương 84, 85, 86, 88, 89, 90 của Biểu thuế nhập khẩu ưu đãi hiện hành nếu được áp dụng nguyên tắc phân loại theo máy chính để tính thuế nhập khẩu theo quy định của Thông tư này thì cũng được coi là thiết bị đồng bộ để làm căn cứ xác định đối tượng không chịu thuế giá trị gia tăng theo quy định của Luật thuế giá trị gia tăng.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.2. Phân loại linh kiện rời đồng bộ và không đồng bộ của các mặt hàng cơ khí, điện, điện tử:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eBộ linh kiện rời đồng bộ và không đồng bộ để lắp ráp các mặt hàng cơ khí, điện, điện tử (các chi tiết linh kiện rời có thể là những sản phẩm đã hoàn thiện nhưng chưa được lắp ráp hoặc chưa phải là sản phẩm hoàn thiện nhưng đã có đặc trưng cơ bản của thành phẩm để lắp ráp với nhau bằng các phương tiện lắp ráp đơn giản như vít, bu lông, ê cu hoặc có thể bằng đinh tán hoặc hàn), thực hiện phân loại theo nguyên tắc sau đây:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.2.1. Trường hợp nhập khẩu các chi tiết, linh kiện rời đồng bộ (nhập đầy đủ các chi tiết của một sản phẩm) được phân loại vào cùng nhóm/phân nhóm/mã số và mức thuế suất quy định cho mặt hàng nguyên chiếc.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.2.2. Trường hợp nhập khẩu các chi tiết, linh kiện rời không đồng bộ (nhập không đầy đủ các chi tiết rời của một sản phẩm) thì phân loại theo từng nhóm/phân nhóm/mã số và mức thuế suất quy định cho từng chi tiết, linh kiện.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.3. Phân loại bộ linh kiện của các mặt hàng cơ khí - điện - điện tử thực hiện chính sách ưu đãi thuế theo tỷ lệ nội địa hoá\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eĐối với bộ linh kiện không đồng bộ mà doanh nghiệp đăng ký thực hiện chính sách ưu đãi thuế theo tỷ lệ nội địa hoá, khi nhập khẩu sẽ được áp dụng chung một mức thuế suất ưu đãi theo tỷ lệ nội địa hoá cho toàn bộ danh mục chi tiết linh kiện nhập khẩu.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eII. CĂN CỨ PHÂN LOẠI\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eKhi thực hiện việc phân loại hàng hoá, tuỳ theo từng trường hợp cụ thể mà dựa vào một hay nhiều căn cứ dưới đây để phân loại:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1. Danh mục hàng hoá xuất khẩu, nhập khẩu Việt Nam; Biểu thuế nhập khẩu; Biểu thuế xuất khẩu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.2. Thực tế hàng hoá;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.3. Tài liệu kỹ thuật, mô tả chi tiết hàng hoá, catalogue minh hoạ hàng hoá;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.4. Kết quả phân tích, giám định hàng hoá.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eIII. PHÂN LOẠI HÀNG HOÁ TRONG KHI LÀM THỦ TUC HẢI QUAN\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Đối với người khai hải quan\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.1. Người khai Hải quan có trách nhiệm phân loại hàng hoá (xác định chính xác tên gọi, mô tả và mã số hàng hoá xuất khẩu, nhập khẩu) trên tờ khai hải quan và chịu trách nhiệm về việc phân loại đó.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.2. Trường hợp người khai hải quan không tự phân loại được hàng hoá, nếu không đề nghị cơ quan hải quan thực hiện phân loại trước khi làm thủ tục hải quan như quy định tại mục IV phần B dưới đây thì có thể đề nghị một cơ quan, tổ chức giám định chuyên ngành giám định làm cơ sở cho người khai hải quan thực hiện việc phân loại.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.3. Trường hợp người khai hải quan không nhất trí với kết luận phân loại của cơ quan hải quan thì thực hiện việc khiếu nại theo quy định tại phần D Thông tư này.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2. Đối với Chi cục Hải quan làm thủ tục xuất khẩu, nhập khẩu\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.1. Khi làm thủ tục hải quan cho hàng hoá xuất khẩu, nhập khẩu công chức hải quan phải căn cứ vào quy định tại Nghị định 06/2003/NĐ-CP ngày 22/01/2003 của Chính phủ và hướng dẫn tại Thông tư này để phân loại. Trường hợp không chấp nhận việc phân loại hàng hoá của người khai hải quan thì phải có cơ sở và phải thực hiện việc phân loại lại cho chính xác.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.2. Trường hợp có căn cứ cho rằng việc phân loại của người khai hải quan không chính xác nhưng Chi cục hải quan cũng không có khả năng phân loại thì đề nghị Trung tâm phân tích, phân loại hàng hoá trực thuộc Tổng cục Hải quan (sau đây gọi tắt là Trung tâm PTPL) thực hiện việc phân loại hàng hoá. Thủ tục trưng cầu Trung tâm PTPL phân loại thực hiện theo Quy chế phân tích, phân loại hàng hoá do Tổng cục Hải quan ban hành.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eKết luận phân loại hàng hoá của Trung tâm PTPL là cơ sở để Chi cục Hải quan làm thủ tục hải quan.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2.3. Trường hợp phát hiện kết quả phân loại hàng hoá của Trung tâm PTPL thiếu chính xác, không phù hợp với thực tế hàng hoá xuất khẩu, nhập khẩu thì báo cáo Tổng cục Hải quan để chỉ đạo.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eIV. PHÂN LOẠI HÀNG HOÁ TRƯỚC KHI XUẤT KHẨU, NHẬP KHẨU HÀNG HOÁ\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003ePhân loại hàng hoá trước khi xuất khẩu, nhập khẩu hàng hoá (dưới đây gọi tắt là phân loại trước) được áp dụng trong trường hợp người khai hải quan chưa làm thủ tục hải quan xuất khẩu, nhập khẩu hàng hoá.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Phân loại trước trong trường hợp đã có mẫu hàng\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.1. Thủ tục thực hiện:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Người khai hải quan có yêu cầu phân loại trước gửi Phiếu yêu cầu (mẫu tại Phụ lục 3 Thông tư này) kèm mẫu hàng và tài liệu liên quan cho Chi cục Hải quan nơi dự kiến sẽ làm thủ tục hải quan xuất khẩu, nhập khẩu hàng hoá để thực hiện phân loại.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Chi cục Hải quan tiếp nhận yêu cầu trên, thực hiện việc phân loại và ra Thông báo kết quả phân loại (mẫu tại Phụ lục 4 Thông tư này) cho người khai hải quan.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp không phân loại được thì Chi cục Hải quan đề nghị Trung tâm PTPL thực hiện phân loại.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.2. Hiệu lực của thông báo kết quả phân loại trước:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eThông báo kết quả phân loại trước có hiệu lực thực hiện trong 6 tháng kể từ ngày cơ quan hải quan ra Thông báo. Quá thời hạn trên mà người khai hải quan không làm thủ tục xuất khẩu, nhập khẩu hàng hoá thì Thông báo đó không còn giá trị thực hiện.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eĐối với những mặt hàng nhanh thay đổi, biến chất thì thời hạn hiệu lực ngắn hơn (tuỳ tính chất mặt hàng và điều kiện bảo quản mẫu, Chi cục Hải quan thực hiện việc phân loại quyết định thời hạn hiệu lực của thông báo phù hợp đối với từng trường hợp cụ thể).\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.3. Điều kiện áp dụng kết quả phân loại trước:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Mẫu lưu còn nguyên trạng. Mẫu này có thể được lưu tại Chi cục Hải quan hoặc tại doanh nghiệp hay kho của người vận tải nếu đáp ứng yêu cầu niêm phong hải quan và được Chi cục trưởng Chi cục Hải quan chấp nhận.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Thực tế hàng hoá xuất khẩu, nhập khẩu được Chi cục Hải quan xác định đúng là hàng hoá đã được phân loại trước;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Trong thời gian từ khi cơ quan hải quan Thông báo kết quả phân loại trước đến khi người khai hải quan làm thủ tục xuất khẩu, nhập khẩu thực tế hàng hoá, quy định của pháp luật về phân loại hàng hoá đối với mặt hàng phân loại trước không có sự thay đổi.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cơ quan hải quan không có phát hiện về sai sót hoặc khai báo không trung thực của người khai hải quan hoặc sai sót của cơ quan hải quan trong phân loại trước.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1.4. Quy định về lưu mẫu:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Trường hợp Chi cục Hải quan trực tiếp thực hiện việc phân loại thì thời gian lưu mẫu tại cửa khẩu là một năm kể từ ngày tiếp nhận mẫu. Đối với những mặt hàng nhanh bị thay đổi, biến chất thì thời gian lưu mẫu là thời hạn hiệu lực của Thông báo kết quả phân loại trước.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Trường hợp Chi cục Hải quan đề nghị Trung tâm PTPL thực hiện việc phân loại thì thời gian lưu mẫu tại Chi cục Hải quan thực hiện theo quy định tại Quy chế phân tích, phân loại hàng hoá của Tổng cục Hải quan ban hành kèm theo Quyết định số 710/TCHQ/QĐ/PTPL ngày 03/6/2003.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2. Phân loại trước trong trường hợp có mẫu hàng nhưng không thể lấy và lưu mẫu (hàng có khối lượng, kích thước lớn, hàng có yêu cầu bảo quản đặc biệt)\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eThủ tục đề nghị phân loại trước thực hiện như quy định tại tiết 1.1 trên đây.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eSau khi chấp nhận đề nghị của người khai hải quan và các tài liệu, thông tin cần thiết cho việc phân loại hàng hoá. Chi cục Hải quan cử kiểm hoá viên trực tiếp kiểm tra, chụp ảnh hàng hoá và thực hiện phân loại hàng hoá, thông báo kết quả phân loại cho người khai hải quan.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp không phân loại được thì Chi cục Hải quan đề nghị Trung tâm PTPL thực hiện phân loại.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e3. Phân loại trước trong trường hợp không có mẫu hàng.\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eThủ tục đề nghị phân loại trước thực hiện như đối với trường hợp có mẫu hàng. Trường hợp này, người khai hải quan cần mô tả chi tiết hàng hoá tại phiếu yêu cầu phân loại trước và cung cấp tài liệu, thông tin cần thiết cho Chi cục Hải quan. Nếu không đủ cơ sở phân loại, Chi cục Hải quan có quyền từ chối yêu cầu của người khai hải quan.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eThông báo kết quả phân loại trước trong trường hợp không có mẫu hàng lưu tại cơ quan hải quan có giá trị tham khảo khi làm thủ tục hải quan.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eC. QUYỀN HẠN, TRÁCH NHIỆM CỦA TỔ CHỨC,\u003c/p\u003e\n \u003cp align=\"CENTER\"\u003eCÁ NHÂN TRONG PHÂN LOẠI HÀNG HOÁ\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003eI. QUYỀN VÀ NGHĨA VỤ CỦA NGƯỜI KHAI HẢI QUAN\u003c/p\u003e\n \u003cp align=\"JUSTIFY\"\u003e1. Quyền của người khai hải quan:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Được cơ quan hải quan cung cấp thông tin, xem hàng hoặc lấy mẫu hàng phục vụ việc phân loại hàng hoá và khai báo hải quan;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Được cơ quan hải quan hướng dẫn việc phân loại hàng hoá khi có yêu cầu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Được quyền khiếu nại theo quy định của pháp luật và hướng dẫn tại phần D Thông tư này.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003e2. Nghĩa vụ của người khai hải quan:\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Thực hiện phân loại hàng hoá và khai báo hải quan theo đúng quy định của pháp luật và hướng dẫn tại Thông tư này, chịu trách nhiệm trước pháp luật về kết quả phân loại hàng hoá của mình.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Thực hiện quyết định phân loại hàng hoá của cơ quan hải quan trong quá trình làm thủ tục xuất khẩu, nhập khẩu hàng hoá.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e- Cung cấp mẫu hàng, chứng từ, tài liệu liên quan để phục vụ mục đích phân loại hàng hoá và tính thuế theo yêu cầu của cơ quan hải quan.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"JUSTIFY\"\u003eII. TRÁCH NHIỆM, QUYỀN HẠN CỦA CHI CỤC HẢI QUAN LÀM THỦ TỤC XUẤT KHẨU, NHẬP KHẨU HÀNG HOÁ.\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003e1. Kiểm tra kết quả khai báo phân loại hàng hoá, tính thuế và nộp thuế của người khai hải quan;\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2. Hướng dẫn người khai hải quan phân loại hàng hoá trong trường hợp người khai hải quan có yêu cầu.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3. Có quyền yêu cầu người khai hải quan cung cấp mẫu hàng, chứng từ, tài liệu liên quan để phục vụ mục đích phân loại hàng hoá và thu thuế.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e4. Thực hiện việc phân loại hàng hoá, áp dụng các chính sách thuế, chính sách quản lý khác có liên quan theo đúng quy định của pháp luật và hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e5. Báo cáo kết quả phân loại đối với những hàng hoá mới làm thủ tục xuất khẩu, nhập khẩu lần đầu tại Chi cục mình về Tổng cục Hải quan để tập hợp và chỉ đạo áp dụng chung trong toàn ngành hải quan.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eD. KHIẾU NẠI VÀ GIẢI QUYẾT KHIẾU NẠI\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eNgười khai hải quan không nhất trí với kết luận phân loại của cơ quan hải quan thì có quyền khiếu nại theo quy định của pháp luật và theo trình tự sau đây:\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e1. Người khai hải quan không đồng ý với kết luận phân loại của Chi cục Hải quan thì làm văn bản đề nghị Chi cục trưởng Chi cục Hải quan làm thủ tục lô hàng xem xét lại.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e2. Nếu người khai hải quan không đồng ý với giải quyết khiếu nại của Chi cục Hải quan theo quy định tại mục 1 trên đây thì gửi văn bản đề nghị Cục trưởng Cục Hải quan tỉnh, thành phố liên quan giải quyết.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e3. Nếu người khai hải quan không nhất trí với giải quyết khiếu nại của Cục trưởng Cục Hải quan tỉnh, thành phố quy định ở mục 2 trên đây thì làm văn bản đề nghị Tổng cục trưởng Tổng cục Hải quan giải quyết.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003e4. Nếu người khai hải quan không nhất trí với giải quyết của Tổng cục trưởng Tổng cục Hải quan quy định ở mục 3 trên đây thì làm văn bản đề nghị Bộ trưởng Bộ Tài chính giải quyết. Quyết định của Bộ trưởng Bộ Tài chính là quyết định cuối cùng.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrường hợp người khai hải quan không nhất trí với kết quả giải quyết khiếu nại của cơ quan hải quan các cấp thì có quyền khởi kiện tại Toà án theo quy định của pháp luật.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eThời hạn giải quyết khiếu nại thực hiện theo quy định của pháp luật về khiếu nại, tố cáo hiện hành.\u003c/p\u003e\u003cb\u003e\n \u003cp align=\"CENTER\"\u003eĐ. TỔ CHỨC THỰC HIỆN\u003c/p\u003e\u003c/b\u003e\n\u003cp align=\"JUSTIFY\"\u003eThông tư này có hiệu lực thi hành sau 15 ngày, kể từ ngày đăng Công báo. Bãi bỏ các quy định về việc phân loại hàng hoá xuất khẩu, nhập khẩu trước đây trái với quy định tại Thông tư này.\u003c/p\u003e\n\u003cp align=\"JUSTIFY\"\u003eTrong quá trình thực hiện nếu có phát sinh vướng mắc, đề nghị các đơn vị, tổ chức, cá nhân phản ảnh kịp thời về Bộ Tài chính để giải quyết./.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 85/2003/TT-BTC hướng dẫn thực hiện việc phân loại hàng hoá theo Danh mục hàng hoá xuất khẩu, nhập khẩu và Biểu thuế nhập khẩu ưu đãi, Biểu thuế xuất khẩu\\\",\\\"legislationIdentifier\\\":\\\"85/2003/TT-BTC\\\",\\\"legislationType\\\":\\\"Thông tư\\\",\\\"legislationDate\\\":\\\"2003-08-29T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Bộ Tài chính\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-85-2003-tt-btc-huong-dan-thuc-hien-viec-phan-loai-hang-hoa-theo-danh-muc-hang-hoa-xuat-khau-nhap-khau-va-bieu-thue-nhap-khau-uu-dai-bieu-thue-xuat-khau--16646\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Thông tư, Quản lý thuế, phí và lệ phí, Bộ Tài chính, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadcrumb-jsonld\",{\"type\":\"application/ld+json\",\"id\":\"breadcrumb-jsonld\",\"data-testid\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Trang chủ\\\",\\\"item\\\":\\\"https://vbpl.vn\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Văn bản trung ương\\\",\\\"item\\\":\\\"https://vbpl.vn/van-ban/trung-uong\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\
