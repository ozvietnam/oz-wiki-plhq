ệu gồm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1. Cơ sở dữ liệu về Danh mục hàng hóa, Biểu thuế đối với hàng hóa xuất nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Cơ sở dữ liệu về phân loại, áp dụng mức thuế đối với hàng hóa xuất nhập khẩu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Cơ sở dữ liệu về Danh mục hàng hóa, Biểu thuế đối với hàng hóa xuất nhập khẩu gồm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Mã số hàng hóa;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Mô tả tên hàng hóa bằng tiếng Anh, tiếng Việt;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.3. Đơn vị tính hàng hóa bằng tiếng Anh, tiếng Việt;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.4. Mức thuế suất của hàng hóa xuất khẩu, nhập khẩu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Cơ sở dữ liệu về phân loại, áp dụng mức thuế đối với hàng hóa xuất nhập khẩu gồm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.1. Mã số hàng hóa của Biểu thuế nhập khẩu ưu đãi;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.2. Mô tả tên hàng hóa xuất khẩu, nhập khẩu (tuỳ theo từng loại hàng, ghi rõ tính chất, đặc điểm về cấu tạo, thành phần, nguyên vật liệu cấu thành, chủng loại, công dụng… của hàng hoá);\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.3. Tờ khai hàng hoá xuất khẩu, nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.4. Thời gian (ngày…tháng… năm…) cập nhật thông tin;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.5. Hình ảnh hàng hoá (nếu có).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Cơ sở dữ liệu về Danh mục hàng hóa, Biểu thuế đối với hàng hóa xuất nhập khẩu được hình thành từ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4.1. Danh mục hàng hóa xuất nhập khẩu Việt Nam;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4.2. Biểu thuế xuất khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4.3. Biểu thuế nhập khẩu ưu đãi, ưu đãi đặc biệt;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4.4. Biểu thuế giá trị gia tăng;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4.5. Biểu thuế tiêu thụ đặc biệt.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e5. Cơ sở dữ liệu về phân loại hàng hóa, áp dụng mức thuế được hình thành từ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.1. Bản dịch Cơ sở dữ liệu về phân loại hàng hoá của WCO;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2. Kết quả phân loại hàng hóa, áp dụng mức thuế do Tổng cục Hải quan thu thập, cập nhật từ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2.1. Các văn bản giải quyết khiếu nại về phân loại hàng hóa, áp dụng mức thuế của Bộ Tài chính, Tổng cục Hải quan; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2.2. Các văn bản hướng dẫn về phân loại hàng hóa, áp dụng mức thuế của Bộ Tài chính, Tổng cục Hải quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2.3. Thông báo kết quả phân tích, phân loại của các Trung tâm Phân tích phân loại thuộc Tổng cục Hải quan đã được Tổng cục Hải quan thu thập, cập nhật vào Cơ sở dữ liệu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2.4. Kết quả kiểm tra, thanh tra thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5.2.5. Quyết định phân loại trước.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003eĐiều 26. Cập nhật, thay đổi, sửa chữa nội dung thông tin trong Cơ sở dữ liệu\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổng cục Hải quan có trách nhiệm cập nhật Cơ sở dữ liệu về phân loại hàng hoá, áp dụng mức thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Thông tin trong Cơ sở dữ liệu được thay đổi, sửa chữa khi thông tin từ nguồn của Cơ sở dữ liệu thay đổi.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Tổng cục trưởng Tổng cục Hải quan có thẩm quyền quyết định thay đổi, sửa chữa thông tin do Tổng cục Hải quan cập nhật vào Cơ sở dữ liệu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Tổng cục trưởng Tổng cục Hải quan quy định việc cập nhật, thay đổi, sửa chữa Cơ sở dữ liệu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 27. Khai thác, sử dụng Cơ sở dữ liệu\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Công chức hải quan khi phân loại hàng hóa, áp dụng mức thuế có trách nhiệm khai thác Cơ sở dữ liệu về phân loại hàng hóa, áp dụng mức thuế. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Sử dụng Cơ sở dữ liệu:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Cơ sở dữ liệu là một trong những căn cứ để phân loại hàng hóa, áp dụng mức thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Khi phân loại hàng hóa, nếu mặt hàng cần phân loại là mặt hàng đã có trong Cơ sở dữ liệu công bố trên trang thông tin điện tử của Tổng cục Hải quan thì phải áp dụng mã số theo Cơ sở dữ liệu; nếu mặt hàng cần phân loại tương tự với mặt hàng đã có trong Cơ sở dữ liệu và không phân loại được theo các quy tắc 1, 2 và 3 thì áp dụng Quy tắc 4 giải thích việc phân loại hàng hóa theo Danh mục hàng hóa xuất nhập khẩu Việt Nam.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương V\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eKHIẾU NẠI, GIẢI QUYẾT KHIẾU NẠI VÀ KHỞI KIỆN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eĐiều 28. Khiếu nại và giải quyết khiếu nại đối với kết luận phân loại hàng hóa, áp dụng mức thuế\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Người khai hải quan không đồng ý với kết luận phân loại hàng hóa, áp dụng mức thuế của cơ quan hải quan thì có quyền khiếu nại;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Thời hạn khiếu nại thực hiện theo quy định của pháp luật về khiếu nại, tố cáo. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Trình tự giải quyết khiếu nại thực hiện theo quy định của pháp luật về khiếu nại, tố cáo và các quy định của pháp luật có liên quan.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Trong thời gian giải quyết khiếu nại, người khai hải quan, người nộp thuế phải nộp thuế theo kết luận về phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu của cơ quan hải quan. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eĐiều 29. Khởi kiện\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003eNgười khai hải quan không đồng ý với giải quyết khiếu nại của cơ quan hải quan các cấp thì có quyền khởi kiện tại Toà án theo quy định của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eChương VI\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eTỔ CHỨC THỰC HIỆN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 30. Trách nhiệm thực hiện\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.1pt;\"\u003e1. Tổng cục trưởng Tổng cục Hải quan căn cứ vào Thông tư này ban hành quy trình thủ tục hải quan về phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu; quy chế xây dựng, thu thập, cập nhật Cơ sở dữ liệu và hướng dẫn các đơn vị hải quan thực hiện thống nhất, bảo đảm vừa tạo điều kiện thuận lợi cho hoạt động xuất khẩu, nhập khẩu vừa thực hiện tốt công tác quản lý nhà nước về hải quan.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Cơ quan hải quan, người khai hải quan, người nộp thuế và các tổ chức, cá nhân có liên quan có trách nhiệm thực hiện việc phân loại hàng hoá, áp dụng mức thuế theo đúng quy định hiện hành và hướng dẫn tại Thông tư này; Trường hợp phát sinh vướng mắc phản ánh về Bộ Tài chính, Tổng cục Hải quan để được xem xét, hướng dẫn giải quyết.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 31. Hiệu lực thi hành\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e1. Thông tư này có hiệu lực thi hành sau 45 ngày kể từ ngày ký, thay thế\u0026nbsp;Thông tư số 85/2003/TT-BTC ngày 29 tháng 08 năm 2003 của Bộ Tài chính và các văn bản hướng dẫn trước đây của Bộ Tài chính trái với Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Quá trình thực hiện, nếu các văn bản liên quan đề cập tại Thông tư này và các phụ lục kèm theo Thông tư này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản mới được sửa đổi, bổ sung hoặc thay thế đó./.\u003c/span\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 49/2010/TT-BTC Hướng dẫn việc phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu\\\",\\\"legislationIdentifier\\\":\\\"49/2010/TT-BTC\\\",\\\"legislationType\\\":\\\"Thông tư\\\",\\\"legislationDate\\\":\\\"2010-04-12T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Bộ Tài chính\\\"}
