iện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlin unks/119-af8d6d47e84615fe.js\",\"6625\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T151fe,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eTHÔNG TƯ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eHướng dẫn việc phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Luật Hải quan số 29/2001/QH10 ngày 29 tháng 6 năm 2001; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eLuật sửa đổi bổ sung một số điều của Luật hải quan số 42/2005/QH11 ngày 14 tháng 6 năm 2005; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eLuật thuế xuất khẩu, thuế nhập khẩu số 45/2005/QH11 ngày 14 tháng 6 năm 2005; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eLuật Thuế giá trị gia tăng số 13/2008/QH12 ngày 03 tháng 06 năm 2008;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eLuật thuế tiêu thụ đặc biệt số 27/2008/QH12 ngày 14 tháng 11 năm 2008; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eLuật Quản lý thuế số 78/2006/QH11 ngày 29 tháng 11 năm 2006 và các Nghị định quy định chi tiết thi hành các Luật nêu trên;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003eCăn cứ Quyết định số 49/QĐ-CTN ngày 06 tháng 3 năm 1998 của Chủ tịch nước Cộng hòa xã hội chủ nghĩa Việt Nam về việc Việt Nam tham gia Công ước HS;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Nghị định số 06/2003/NĐ-CP ngày 22 tháng 1 năm 2003 của Chính phủ quy định về việc phân loại hàng hóa xuất khẩu, nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003eCăn cứ Nghị định số 118/2008/NĐ-CP ngày 27 tháng 11 năm 2008 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Tài chính;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eThực hiện Nghị định thư quy định việc thực hiện Danh mục Biểu thuế hài hoà ASEAN (AHTN);\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eBộ Tài chính hướng dẫn thực hiện việc phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu như sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương I\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eNHỮNG QUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 1. Phạm vi điều chỉnh và đối tượng áp dụng\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Thông tư này hướng dẫn việc phân loại và áp dụng mức thuế (bao gồm mức thuế theo tỷ lệ phần trăm, mức thuế tuyệt đối) đối với hàng hóa xuất khẩu, nhập khẩu; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân xuất khẩu, nhập khẩu hàng hoá, cơ quan hải quan, công chức hải quan và các tổ chức, cá nhân khác khi thực hiện các công việc có liên quan đến phân loại và áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu là đối tượng thực hiện Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 2. Giải thích từ ngữ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003eCác từ ngữ sử dụng trong Thông tư này được hiểu như sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1. \u003ci\u003eDanh mục Biểu thuế quan hài hoà ASEAN\u003c/i\u003e(viết tắt là AHTN) là danh mục hàng hoá của các nước ASEAN, được xây dựng trên cơ sở Hệ thống hài hòa mô tả và mã hóa hàng hóa (viết tắt là HS) của Tổ chức Hải quan Thế giới (WCO).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2. \u003ci\u003eDanh mục hàng hóa xuất nhập khẩu Việt Nam, Biểu thuế xuất khẩu, Biểu thuế nhập khẩu, Biểu thuế giá trị gia tăng,\u003c/i\u003e \u003ci\u003eBiểu thuế tiêu thụ đặc biệt\u003c/i\u003e là văn bản quy phạm pháp luật do cơ quan có thẩm quyền ban hành và được hướng dẫn cụ thể tại \u003cb\u003ePhụ lục 1\u003c/b\u003e kèm theo Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;letter-spacing:0.2pt;\"\u003e3. \u003ci\u003ePhân tích, phân loại\u003c/i\u003e: là việc cơ quan hải quan kiểm tra thực tế hàng hoá xuất khẩu, nhập khẩu bằng máy móc, thiết bị kỹ thuật để xác định tên gọi, mã số hàng hóa theo Danh mục hàng hóa xuất nhập khẩu và các Biểu thuế đối với hàng hóa xuất khẩu, nhập khẩu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e4. \u003ci\u003ePhân loại hàng hóa trước khi làm thủ tục hải quan \u003c/i\u003e(sau đây viết tắt là “phân loại \u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003etrước”): là việc trước khi hàng hoá được xuất khẩu, nhập khẩu, theo đề nghị của người khai hải quan, cơ quan hải quan xác định tên gọi, mã số của một mặt hàng và ra quyết định để áp dụng có thời hạn tên gọi, mã số của mặt hàng đó.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e5. \u003ci\u003eCơ sở dữ liệu phân loại hàng hoá, áp dụng mức thuế \u003c/i\u003e(sau đây viết tắt là “Cơ sở dữ liệu”): là các thông tin liên quan đến phân loại hàng hoá, áp dụng mức thuế của hàng hoá xuất khẩu, nhập khẩu do cơ quan hải quan tổng hợp, thu thập, cập nhật, sử dụng để phục vụ công tác phân loại, áp dụng mức thuế đối với hàng hoá xuất khẩu, nhập khẩu. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003eĐiều 3. Quyền, nghĩa vụ của người khai hải quan, người nộp thuế trong phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1. Người khai hải quan có quyền:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.1. Được cơ quan hải quan cung cấp thông tin, được xem hàng hoặc lấy mẫu hàng dưới sự giám sát của công chức hải quan trước khi tiến hành thủ tục hải quan phục vụ cho việc khai hải quan, phân loại hàng hóa, áp dụng mức thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.2. Đề nghị cơ quan hải quan hướng dẫn việc phân loại, áp dụng mức thuế theo đúng quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.3. Khiếu nại, khởi kiện và được bồi thường thiệt hại theo quy định của pháp luật đối với các quyết định hành chính, hành vi hành chính của cơ quan hải quan, công chức hải quan và các tổ chức, cá nhân khác trong phân loại hàng hóa, áp dụng mức thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.4. Tố cáo các hành vi vi phạm pháp luật của cơ quan hải quan, công chức hải quan và tổ chức, cá nhân khác trong việc phân loại hàng hóa, áp dụng mức thuế theo quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003e1.5. Thực hiện các quyền khác theo quy định tại Điều 6 Luật quản lý thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e. Người khai hải quan có nghĩa vụ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.1. Tự kê khai chính xác, trung thực, đầy đủ tên hàng (mô tả rõđặc điểm, cấu tạo, tính chất, công dụng), mã số, mức thuế của hàng hoá xuất khẩu, nhập khẩu theo đúng quy định của pháp luật và chịu trách nhiệm trước pháp luật về việc khai báo, tính chính xác, trung thực, hợp pháp của các chứng từ, tài liệu nộp cho cơ quan hải quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Cung cấp mẫu hàng, chứng từ, tài liệu liên quan để phục vụ mục đích phân loại hàng hóa và kiểm tra thuế theo yêu cầu của cơ quan hải quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.3. Chấp hành quyết định hành chính về phân loại hàng hóa, ấn định mã số, mức thuế của cơ quan hải quan theo quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.4pt;\"\u003e2.4. Thực hiện các nghĩa vụ khác theo quy định tại Điều 7 Luật quản lý thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.5.\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e Xác nhận, ký tên, đóng dấu vào các chứng từ, tài liệu do mình lập\u003cspan style=\"color:blue;\"\u003e,\u003c/span\u003e các giấy tờ là bản sao, bản dịch thuộc hồ sơ phân loại trước nộp cho cơ quan hải quan theo hướng dẫn tại Thông tư này và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực, hợp pháp của các giấy tờ đó.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 4. Trách nhiệm, quyền hạn của cơ quan hải quan trong phân loại, áp dụng mức thuế đối với hàng hóa xuất khẩu, nhập khẩu \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1. Cơ quan hải quan có trách nhiệm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.1. Kiểm tra tên hàng, mã số hàng hoá, mức thuế do người khai hải quan khai báo theo quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.2.Thực hiện việc phân tích, phân loại hàng hóa, xác định mã số, áp dụng mức thuế theo đúng quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.3. Giải quyết khiếu nại, bồi thường thiệt hại đối với các quyết định hành chính, hành vi hành chính do cơ quan hải quan, công chức hải quan thực hiện trái quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.4. Giữ bí mật thông tin về hàng hóa xuất khẩu, nhập khẩu do người khai hải quan khai báo theo đúng quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.5. Cung cấp thông tin, h\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003eướng dẫn người khai hải quan phân loại, áp dụng mức thuế khi có đề nghị;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.3pt;\"\u003e1.6. Thực hiện các trách nhiệm khác theo quy định tại Điều 8 Luật quản lý thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2. Cơ quan hải quan, công chức hải quan có quyền:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.1. Yêu cầu người khai hải quan, người nộp thuế cung cấp mẫu hàng, chứng từ, tài liệu liên quan để phục vụ mục đích phân loại hàng hóa, áp dụng mức thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2.2. Ấn định thuế, thu đủ tiền thuế còn thiếu, xử phạt vi phạm hành chính đối với các trường hợp kê khai chưa đúng mã số, mức thuế theo đúng quy định của pháp luật và chịu trách nhiệm trước pháp luật về việc ấn định thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.4pt;\"\u003e2.3. Thực hiện các quyền hạn khác theo quy định tại Điều 9 Luật quản lý thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương II\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003ePHÂN LOẠI HÀNG HÓA, ÁP DỤNG MỨC THUẾ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eMỤC 1\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eNGUYÊN TẮC, CĂN CỨ PHÂN LOẠI HÀNG HÓA, ÁP DỤNG MỨC THUẾ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 5.\u003c/span\u003e\u003c/b\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003e Nguyên tắc phân loại hàng hoá\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Khi phân loại hàng hoá xuất khẩu, nhập khẩu, phải tuân thủ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1.\u003cspan style=\"font:7pt 'Times New Roman';\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003eDanh mục hàng hoá xuất nhập khẩu Việt Nam (các Chú giải Phần, Chương; Danh sách các Phần, Ch­ương, nhóm hàng, phân nhóm hàng);\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2.\u003cspan style=\"font:7pt 'Times New Roman';\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003eBiểu thuế nhập khẩu ưu đãi;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e1.3.\u003cspan style=\"font:7pt 'Times New Roman';\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e6 (sáu) Quy tắc tổng quát giải thích việc phân loại hàng hóa theo Hệ thống hài hoà mô tả và mã hoá hàng hoá (\u003cb\u003ePhụ lục 2\u003c/b\u003e kèm theo Thông tư này); \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.4.\u003cspan style=\"font:7pt 'Times New Roman';\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003eNghị định số \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e06/2003/NĐ-CP ngày 22 tháng 1 năm 2003 của Chính phủ quy định về việc phân loại hàng hóa xuất khẩu, nhập khẩu và hướng dẫn tại Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Ngoài các nguyên tắc nêu tại Khoản 1 \u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eĐiều\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e này, trong quá trình phân loại phải tham khảo các tài liệu sau đây:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Chú giải chi tiết HS; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Tuyển tập ý kiến phân loại của WCO; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.3. Danh mục phân loại hàng hoá theo Bảng chữ cái của WCO;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.4. Văn bản của cơ quan có thẩm quyền xác định đặc điểm, tính chất, cấu tạo, công dụng hoặc tiêu chuẩn kỹ thuật của hàng hóa;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.5. Chú giải bổ sung AHTN (\u003cb\u003ePhụ lục 3\u003c/b\u003e kèm theo Thông tư này).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Một mặt hàng sau khi phân loại phải có mã số đầy đủ theo số chữ số nhiều nhất của Biểu thuế nhập khẩu ưu đãi và chỉ được xếp vào một mã số duy nhất theo Biểu thuế nhập khẩu ưu đãi. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 6. Căn cứ phân loại hàng hóa\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eKhi phân loại hàng hóa phải\u0026nbsp;căn cứ vào \u003cspan style=\"color:black;\"\u003enguyên tắc phân loại hàng hóa quy định tại Điều 5 Thông tư này\u003c/span\u003e và tùy theo từng trường hợp cụ thể phải căn cứ vào một hay nhiều căn cứ sau đây: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Các tài liệu \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003etrong hồ sơ hải quan liên quan đến phân loại hàng hóa;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Thực tế hàng hóa xuất khẩu, nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. \u003cspan style=\"color:black;\"\u003eCác tài liệu kỹ thuật, catalogue của hàng hóa \u003c/span\u003ecần\u003cspan style=\"color:black;\"\u003e phân loại;\u003c/span\u003e\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e4. Mô tả tên hàng, mã số hàng hoá ghi tại Danh mục hàng hoá xuất nhập khẩu Việt Nam, Biểu thuế nhập khẩu \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003eưu đãi;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Cơ sở dữ liệu phân loại hàng hóa, áp dụng mức thuế công bố trên trang thông tin điện tử của Tổng cục Hải quan. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 7. Nguyên tắc, căn cứ, cách thức áp dụng mức thuế\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1. Nguyên tắc, căn cứ, cách thức áp dụng chung:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.1. Nguyên tắc, căn cứ: Trừ trường hợp quy định tại Khoản 2 Điều này, khi áp dụng mức thuế cho một mặt hàng, người khai hải quan, cơ quan hải quan và các tổ chức cá nhân có liên quan phải căn cứ vào: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.1.1. Kết quả phân loại hàng hoá; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.1.2. Biểu thuế tại thời điểm tính thuế và điều kiện, thủ tục, hồ sơ để được áp dụng mức thuế quy định tại các văn bản quy phạm pháp luật về thuế đối với hàng hóa xuất khẩu, nhập khẩu. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.2. Cách thức áp dụng: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.2.1. Từ mã số tìm được theo Biểu thuế nhập khẩu ưu đãi như quy định tại Khoản 3 Điều 5 Thông tư này, đối chiếu với mô tả tên hàng, mã số hàng hoá ghi tại Biểu thuế xuất khẩu, Biểu thuế nhập khẩu ưu đãi đặc biệt, Biểu thuế giá trị gia tăng, Biểu thuế tiêu thụ đặc biệt để tìm mã số cho mặt hàng đó theo từng Biểu thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1.2.2. Từ mã số tìm được theo từng Biểu thuế như quy định tại Điểm 1.2.1 Điều này, đối chiếu với điều kiện, thủ tục, hồ sơ quy định tại các văn bản quy phạm pháp luật về thuế đối với hàng hóa xuất khẩu, nhập khẩu để tìm mức thuế cho mặt hàng đó.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;letter-spacing:0.1pt;\"\u003e2. Đối với các trường hợp đã thực hiện áp dụng mức thuế theo quy định tại Khoản 1 Điều này nhưng là mặt hàng mới, dễ lẫn, phức tạp, khó phân loại hoặc Tổng cục Hải quan, Bộ Tài chính đã có văn bản hướng dẫn nhưng vẫn còn có nhiều ý kiến khác nhau, thì Bộ Tài chính có văn bản hướng dẫn áp dụng mức thuế đối với mặt hàng đó phù hợp với yêu cầu bảo hộ sản xuất có chọn lọc, có điều kiện, có thời hạn, khuyến khích đầu tư, sản xuất trong nước và bảo đảm bình ổn thị trường, tránh gây xáo trộn hoạt động sản xuất kinh doanh.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eMỤC 2\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003ePHÂN LOẠI TRƯỚC\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 8. Trường hợp thực hiện phân loại trước\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003ePhân loại trước được thực hiện trong các trường hợp đáp ứng đầy đủ các điều kiện sau đây: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1. Hàng hoá chưa được chi tiết tên cụ thể trong Danh mục hàng hoá xuất nhập khẩu Việt Nam hoặc Biểu thuế nhập khẩu ưu đãi; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e2. Hàng hoá có thể xác định được tên gọi, phân loại được mã số trên cơ sở căn cứ vào mô tả mặt hàng, tài liệu kỹ thuật, hình ảnh, mẫu hàng và các tài liệu khác trong hồ sơ phân loại trước, không phải dựa trên kết quả phân tích, giám định bằng trang thiết bị kỹ thuật; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e3. Hàng hoá chưa có trong Cơ sở dữ liệu phân loại hàng hoá, áp dụng mức thuế công bố trên trang thông tin điện tử của Tổng cục Hải quan. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 9. Hồ sơ phân loại trước \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1. Phiếu đề nghị phân loại trước, trong đó mô tả chi tiết hàng hoá yêu cầu phân loại trước và cam kết chịu trách nhiệm trước pháp luật nếu mô tả chi tiết hàng hóa và cung cấp các tài liệu kèm theo yêu cầu phân loại trước không đúng với hàng hóa thực tế xuất khẩu, nhập khẩu (theo mẫu tại \u003cb\u003ePhụ lục 4\u003c/b\u003e kèm theo Thông tư này): 01 bản chính;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;letter-spacing:-0.2pt;\"\u003e2. Tài liệu kỹ thuật, hình ảnh, catalogue hàng hoá: 01 bản chính. Trường hợp là bản sao phải có dấu sao y bản chính;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e3. Mẫu hàng hóa (nếu có);\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e4. Các giấy tờ, tài liệu khác có liên quan đến hàng hoá xuất khẩu, nhập khẩu cần phân loại trước: 01 bản chính. Trường hợp là bản sao phải có dấu sao y bản chính;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003eCác giấy tờ, tài liệu nêu tại khoản 1, 2 và 4 Điều này phải là bản tiếng Việt hoặc bản tiếng Anh, nếu là ngôn ngữ khác thì người khai hải quan phải nộp kèm bản dịch ra tiếng Việt và chịu trách nhiệm trước pháp luật về nội dung bản dịch.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e5. Bảng kê danh mục tài liệu của hồ sơ: 01 bản chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 10. Thẩm quyền và thủ tục phân loại trước\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e1. Tổng cục Hải quan (hoặc Cục Hải quan tỉnh, thành phố nơi thực hiện xử lý dữ liệu tập trung) tiếp nhận và kiểm tra hồ sơ phân loại trước do người yêu cầu phân loại trước gửi.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e2. Trường hợp nội dung mô tả trong Phiếu đề nghị phân loại trước hoặc các tài liệu do người yêu cầu phân loại trước cung cấp không đầy đủ thông tin để phân loại trước thì chậm nhất trong thời hạn 05 ngày làm việc kể từ ngày nhận được hồ sơ phân loại trước, Tổng cục Hải quan (hoặc Cục Hải quan tỉnh, thành phố nơi thực hiện xử lý dữ liệu tập trung) phải có văn bản thông báo để người yêu cầu phân loại trước cung cấp bổ sung.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e3. Trường hợp hồ sơ đã đầy đủ, nội dung mô tả trong Phiếu đề nghị phân loại trước hoặc các tài liệu do người yêu cầu phân loại trước cung cấp đã rõ ràng, có đủ thông tin cho việc phân loại trước thì chậm nhất trong thời hạn 30 ngày làm việc kể từ ngày nhận được hồ sơ phân loại trước, Tổng cục Hải quan (hoặc Cục Hải quan tỉnh, thành phố nơi thực hiện xử lý dữ liệu tập trung) phải có quyết định phân loại trước.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;color:black;\"\u003e4. Trường hợp hồ sơ đã đầy đủ, nội dung mô tả trong Phiếu đề nghị phân loại trước hoặc các tài liệu do người yêu cầu phân loại trước cung cấp đã rõ ràng, nhưng hàng hóa phải phân tích hoặc giám định mới đủ căn cứ để phân loại\u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003ethì chậm nhất trong thời hạn 05 ngày làm việc kể từ ngày nhận được hồ sơ phân loại trước, Tổng cục Hải quan (hoặc Cục Hải quan tỉnh, thành phố nơi thực hiện xử lý dữ liệu tập trung) phải có văn bản từ chối phân loại trước nêu rõ lý do không thực hiện phân loại trước và chuyển trả hồ sơ cho người yêu cầu phân loại biết.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐi\u003c/span\u003e\u003c/b\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eều 11. Thông báo, sử dụng kết quả phân loại trước\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Kết quả phân loại trước được gửi cho người khai hải quan (theo mẫu tại \u003cb\u003ePhụ lục 5\u003c/b\u003e kèm theo Thông tư này) \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003ekèm theo ảnh của hàng hoá phân loại và được cập nhật vào Cơ sở dữ liệu. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Kết quả phân loại trước có thời hạn sử dụng trong vòng 1 năm (tính tròn là 365 ngày), kể từ ngày ký quyết định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Người khai hải quan được sử dụng k\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003eết quả \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003ephân loại trước \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003enếu đáp ứng đầy đủ các điều kiện sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.1. Hàng hoá xuất khẩu, nhập khẩu đúng với mô tả của hàng hoá được phân loại trước tại Phiếu yêu cầu phân loại trước và hồ sơ phân loại trước;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.2. Trong thời gian từ khi có quyết định phân loại trước đến khi làm thủ tục hải quan, không có sự thay đổi các quy định của pháp luật liên quan đến mặt hàng được phân loại trước.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm 6pt 36pt;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eMỤC 3\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm 6pt 36pt;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003e\u0026nbsp;KIỂM TRA VIỆC PHÂN LOẠI HÀNG HÓA, ÁP DỤNG MỨC THUẾ TRONG KHI LÀM HỦ TỤC HẢI QUAN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003eĐiều 12. Nguyên tắc, mục đích, đối tượng, hình thức, mức độ kiểm tra\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Nguyên tắc kiểm tra: Cơ quan hải quan, công chức hải quan áp dụng phương pháp quản lý rủi ro để thực hiện kiểm tra kê khai của người khai hải quan về tên hàng (mô tả đặc điểm, cấu tạo, tính chất, thành phần, hàm lượng, công dụng), mã số, mức thuế của hàng hoá xuất khẩu, nhập khẩu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2. Mục đích kiểm tra: Việc kiểm tra hồ sơ hoặc kiểm tra thực tế hàng hoá, mức thuế nhằm xác định sự phù hợp về nội dung giữa khai báo của người khai hải quan với các chứng từ trong hồ sơ hải quan và giữa thực tế hàng hóa xuất khẩu, nhập khẩu với nội dung khai báo của người khai hải quan và các chứng từ trong hồ sơ hải quan, trên cơ sở đó xác định chính xác mã số, mức thuế của hàng hoá xuất khẩu, nhập khẩu cần phân loại, xác định mức thuế.\u0026nbsp;\u0026nbsp; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hình thức, mức độ kiểm tra: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eHình thức, mức độ kiểm tra: Thực hiện theo hướng dẫn tại khoản 3, 4, 6 Điều 3 Thông tư số 79/2009/TT-BTC ngày 20/4/2009 của Bộ Tài chính hướng dẫn về thủ tục hải quan; kiểm tra, giám sát hải quan; thuế xuất khẩu, thuế nhập khẩu và quản lý thuế đối với hàng hoá xuất khẩu, nhập khẩu (sau đây viết tắt là Thông tư số 79/2009/TT-BTC). \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 13. Nội dung kiểm tra và xử lý kết quả kiểm tra chi tiết hồ sơ hải quan\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Khi kiểm tra chi tiết hồ sơ hải quan, cơ quan hải quan thực hiện kiểm tra nội dung khai báo và kiểm tra tính chính xác, sự trung thực về tên hàng, mã số hàng hóa, mức thuế khai báo trên tờ khai hải quan với các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan. Cụ thể:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1. Tên hàng phải mô tả rõ ràng, đầy đủ thành phần, hàm lượng, tính chất, cấu tạo, đặc điểm và công dụng, đáp ứng được yêu cầu về phân loại và áp dụng mức thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Mã số hàng hoá phải được ghi rõ ràng, đầy đủ, chính xác theo mức độ chi tiết hàng hoá của mặt hàng cần phân loại tại Biểu thuế đối với hàng hoá xuất khẩu, nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.3. Mức thuế phải được ghi rõ ràng, đầy đủ, chính xác theo Biểu thuế áp dụng có hiệu lực tại thời điểm đăng ký tờ khai;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.4. Kiểm tra tính chính xác, sự trung thực về tên hàng, mã số hàng hóa khai báo trên tờ khai hải quan với các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan (như so sánh đối chiếu giữa tên hàng ghi trên hợp đồng, hóa đơn thương mại (invoice), phiếu đóng gói hàng hóa (packing list), vận đơn (bill of lading), catalogue, giới thiệu công dụng và hướng dẫn sử dụng của hàng hóa v.v. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Xử lý kết quả kiểm tra:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Trường hợp người khai hải quan khai báo tên hàng, mã số, mức thuế không rõ ràng, không đầy đủ thì yêu cầu người khai hải quan khai bổ sung;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Trường hợp người khai hải quan khai báo tên hàng, mã số, mức thuế rõ ràng, đầy đủ thì chuyển sang kiểm tra theo hướng dẫn tại Khoản 1.4 Điều này đồng thời đối chiếu với Cơ sở dữ liệu (khi đã có Cơ sở dữ liệu);\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2.3. Trường hợp sau khi kiểm tra theo hướng dẫn tại Khoản 1.4 Điều này và đối chiếu với Cơ sở dữ liệu mà có cơ sở để xác định việc kê khai của người khai hải quan là chưa chính xác, chưa trung thực, có sự sai lệch về tên hàng, mã số hàng hóa khai báo trên tờ khai hải quan với các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan thì thực hiện ấn định mã số hàng hóa, mức thuế, số tiền thuế phải nộp theo hướng dẫn tại Điều 23 Thông tư số 79/2009/TT-BTC, xử phạt hành vi vi phạm (nếu có) theo quy định của pháp luật;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.4. Trường hợp sau khi kiểm tra theo hướng dẫn tại Khoản 1.4 Điều này và đối chiếu với Cơ sở dữ liệu mà có dấu hiệu nghi ngờ nhưng chưa có cơ sở để xác định việc kê khai của người khai hải quan là chưa chính xác, chưa trung thực do có sự sai lệch với các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan nhưng hàng hóa chưa được kiểm tra thực tế thì thực hiện kiểm tra thực tế hàng hoá theo hướng dẫn tại Điều 14 Thông tư này để có cơ sở xác định về việc kê khai của người khai hải quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.5. Trường hợp sau khi kiểm tra theo hướng dẫn tại Khoản 1.4 Điều này và đối chiếu với Cơ sở dữ liệu mà xác định được việc kê khai của người khai hải\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e quan không có sự sai lệch về tên hàng, mã số hàng hóa với các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan thì chuyển sang thực hiện kiểm tra thuế theo hướng dẫn tại Điều 15 Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.3pt;\"\u003eĐiều 14. Nội dung kiểm tra và xử lý kết quả kiểm tra thực tế hàng hóa\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Việc kiểm tra thực tế hàng hóa (sau đây gọi là kiểm hóa) do công chức hải quan thực hiện trực tiếp (đối với những mặt hàng thực hiện mô tả được tên hàng, đặc tính kỹ thuật thông qua việc kiểm tra trực tiếp bằng mắt thường) hoặc bằng máy móc, thiết bị kỹ thuật (đối với những mặt hàng không thực hiện mô tả được tên hàng, đặc tính kỹ thuật thông qua việc kiểm tra trực tiếp bằng mắt thường) nhằm xác định tên gọi, thành phần, hàm lượng, tính chất, cấu tạo, đặc điểm, công dụng (sau đây gọi chung là đặc tính) và mã số của hàng hóa thực tế xuất khẩu, nhập khẩu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Khi kiểm tra thực tế hàng hoá, công chức hải quan thực hiện:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Đối chiếu tên hàng (kiểm tra mô tả cấu tạo, đặc điểm, thành phần, hàm lượng, tính chất, công dụng…), mã số hàng hoá ghi trên Tờ khai hải quan và các chứng từ khác có liên quan với hàng hoá thực tế kiểm tra;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Mô tả tên hàng, đặc tính và mã số của hàng hóa được kiểm tra trên tờ khai hải quan (phần kết quả kiểm tra của kiểm hoá viên) và chịu trách nhiệm trước pháp luật về việc mô tả này. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eĐối với hàng hoá không thể mô tả được tên hàng, đặc tính trực tiếp bằng mắt thường, Chi cục hải quan nơi làm thủ tục hải quan cùng chủ hàng lấy mẫu hoặc yêu cầu chủ hàng cung cấp tài liệu kỹ thuật (catalogue…) gửi Trung tâm Phân tích, phân loại hoặc Chi nhánh Trung tâm Phân tích, phân loại (sau đây gọi chung là Trung tâm Phân tích, phân loại) thuộc Tổng cục Hải quan (đối với các trường hợp Trung tâm Phân tích, phân loại có đủ điều kiện để phân tích, phân loại) hoặc thống nhất lựa chọn Công ty kinh doanh dịch vụ giám định hoạt động theo quy định của Luật Thương mại (sau đây gọi tắt là cơ quan giám định) thực hiện giám định (đối với các trường hợp Trung tâm Phân tích, phân loại chưa có đủ điều kiện để phân tích, phân loại hoặc không có tài liệu kỹ thuật) để thực hiện kiểm tra hàng hóa bằng máy móc, thiết bị kỹ thuật và sử dụng kết quả phân tích phân loại, kết quả giám định của các cơ quan này để có kết luận kiểm tra thực tế đối với hàng hoá xuất khẩu, nhập khẩu theo quy định. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Xử lý kết quả kiểm tra:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.1. Trường hợp kết quả kiểm tra xác định không có sự sai lệch về tên hàng, mã số khai báo trên tờ khai hải quan và các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan với hàng hóa thực tế xuất khẩu, nhập khẩu, thì chuyển sang thực hiện kiểm tra mức thuế theo hướng dẫn tại Điều 15 Thông tư này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.2. Trường hợp kết quả kiểm tra xác định có sự sai lệch về tên hàng, mã số khai báo trên tờ khai hải quan và các thông tin ghi trên các chứng từ trong bộ hồ sơ hải quan với hàng hóa thực tế xuất khẩu, nhập khẩu, cơ quan hải quan thực hiện ấn định mã số theo hàng hoá thực tế xuất khẩu, nhập khẩu, trên cơ sở đó xác định mức thuế và số tiền thuế phải nộp theo hướng dẫn tại Điều 23\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e Thông tư số 79/2009/TT-BTC và xử phạt hành vi vi phạm (nếu có) theo quy định của pháp luật;\u003cspan\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.3. Trường hợp người khai hải quan không nhất trí với kết luận của cơ quan hải quan nơi làm thủ tục hải quan về tên hàng, mã số hàng hóa thì cùng cơ quan hải quan lựa chọn tổ chức kỹ thuật được chỉ định kiểm tra phục vụ quản lý nhà nước (sau đây gọi tắt là tổ chức kỹ thuật) hoặc cơ quan giám định (đối với trường hợp tổ chức kỹ thuật có văn bản từ chối). Nếu người khai hải quan và cơ quan hải quan không thống nhất được việc lựa chọn tổ chức kỹ thuật hoặc cơ quan giám định, thì cơ quan hải quan lựa chọn tổ chức kỹ thuật hoặc cơ quan giám định. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.3.1. Kết luận của tổ chức kỹ thuật hoặc cơ quan giám định có giá trị để các bên thực hiện;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3.3.2. Nếu người khai hải quan không đồng ý với kết luận này thì thực hiện khiếu nại theo quy định của pháp luật. Tổ chức kỹ thuật hoặc cơ quan giám định chịu trách nhiệm về kết luận kiểm tra hàng hoá của mình;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e3.3.3. Trường hợp cơ quan hải quan không nhất trí hoặc có căn cứ để xác định kết quả kiểm tra hàng hoá của tổ chức kỹ thuật hoặc cơ quan giám định chưa đúng, chưa chính xác thì thực hiện theo hướng dẫn tại Điểm 9 Thông tư số 44/2001/TT-BKHCNMT ngày 25/7/2001 của Bộ Khoa học Công nghệ và môi trường (nay là Bộ Khoa học Công nghệ) hướng dẫn về hoạt động kiểm tra hàng hoá của các đơn vị sự nghiệp kỹ thuật phục vụ quản lý nhà nước.\u0026nbsp;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 15. Nội dung kiểm tra và xử lý kết quả kiểm tra mức thuế\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Kiểm tra mức thuế được tiến hành đồng thời với việc kiểm tra thuế theo hướng dẫn tại Khoản 2e Điều 14 Thông tư số 79/2009/TT-BTC. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eKhi kiểm tra mức thuế, cơ quan hải quan thực hiện kiểm tra thời điểm đăng ký tờ khai để xác định văn bản quy phạm pháp luật áp dụng, trên cơ sở đó thực hiện kiểm tra:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1. Mức thuế xuất khẩu đối với hàng hoá xuất khẩu thuộc đối tượng chịu thuế xuất khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Mức thuế nhập khẩu (ưu đãi, ưu đãi đặc biệt, hạn ngạch thuế quan, thuế tuyệt đối), thuế tiêu thụ đặc biệt, thuế giá trị gia tăng đối với hàng hoá nhập khẩu thuộc đối tượng chịu thuế nhập khẩu, thuế tiêu thụ đặc biệt, thuế giá trị gia tăng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Xử lý kết quả kiểm tra mức thuế:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Trường hợp có cơ sở để xác định việc kê khai của người khai hải quan là đúng thì thực hiện thông quan theo kê khai của người khai hải quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Trường hợp có cơ sở để xác định việc kê khai của người khai hải quan là không đúng thì thực hiện ấn định mức thuế và số tiền thuế phải nộp theo hướng dẫn tại Điều 23 Thông tư số 79/2009/TT-BTC và xử phạt hành vi vi phạm (nếu có) theo quy định của pháp luật.\u0026nbsp;\u0026nbsp; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eMỤC 4\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eKIỂM TRA VIỆC PHÂN LOẠI HÀNG HÓA, ÁP DỤNG MỨC THUẾ ĐỐI VỚI HÀNG HÓA ĐÃ THÔNG QUAN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 16. Nguyên tắc, đối tượng kiểm tra\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e\u0026nbsp;Cơ quan hải quan áp dụng phương pháp quản lý rủi ro để thực hiện kiểm tra hồ sơ hải quan; các chứng từ, tài liệu khác có liên quan đến hàng hóa xuất khẩu, nhập khẩu; hàng hóa xuất khẩu, nhập khẩu, nơi sản xuất nếu cần thiết và còn điều kiện thuộc một trong các trường hợp sau đây:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hàng hoá xuất khẩu, nhập khẩu chưa kiểm tra hồ sơ hoặc chưa kiểm tra thực tế hàng hoá, mức thuế trong quá trình làm thủ tục hải quan.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2. Cơ quan hải quan phát hiện hồ sơ thuế có nội dung cần làm rõ liên quan đến số tiền thuế phải nộp, số tiền thuế được miễn, được giảm, được hoàn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 17. Nội dung, cách thức kiểm tra và xử lý kết quả kiểm tra\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eKiểm tra việc phân loại hàng hoá, xác định mã số, mức thuế đối với hàng hoá xuất khẩu, nhập khẩu đã được thông quan được tiến hành như sau: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Đối với bộ phận phúc tập tại Chi cục hải quan:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e1.1. Kiểm tra hồ sơ hải quan, tên hàng, mã số, mức thuế khai báo và các tài liệu có liên quan đến việc phân loại hàng hoá, xác định mã số, mức thuế của hàng hóa xuất nhập khẩu thuộc diện chưa được kiểm tra chi tiết hồ sơ tại khâu thông quan\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Nội dung kiểm tra, trình tự kiểm tra được thực hiện tương tự theo hướng dẫn tại Điều 13, Điều 14, Điều 15 Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.3. Trong quá trình kiểm tra, nếu phát hiện các sai phạm về hồ sơ, chứng từ, nguyên tắc và căn cứ phân loại thì không chấp nhận tên hàng khai báo và thực hiện ấn định tên hàng, mã số, mức thuế, số tiền thuế phải nộp theo hướng dẫn tại Điều 23 Thông tư số 79/2009/TT-BTC và xử phạt hành vi vi phạm (nếu có) theo quy định của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTrường hợp phát hiện có nghi ngờ về hồ sơ hải quan, tên hàng, mã số, mức thuế khai báo nhưng chưa đủ căn cứ kết luận hành vi gian lận thì chuyển các nghi vấn sang bộ phận kiểm tra sau thông quan để tiếp tục xác minh, làm rõ theo quy định về kiểm tra sau thông quan. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Đối với bộ phận kiểm tra sau thông quan:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Trên cơ sở các nghi ngờ về hồ sơ, chứng từ hoặc mức thuế khai báo do bộ phận phúc tập chuyển hoặc qua đánh giá mức độ rủi ro theo mặt hàng, ngành hàng, theo doanh nghiệp nhập khẩu để tổ chức kiểm tra sau thông quan tại cơ quan hải quan hoặc trụ sở của doanh nghiệp.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Nội dung kiểm tra, trình tự kiểm tra, xử lý kết quả kiểm tra được thực hiện theo hướng dẫn về kiểm tra sau thông quan tại Phần VI Thông tư số 79/2009/TT-BTC. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Đối với bộ phận điều tra chống buôn lậu:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003eTổ chức, xác minh các vụ việc có dấu hiệu gian lận như: làm giả hồ sơ, chứng từ; móc ngoặc để đồng loạt khai sai tên hàng, khai thấp mức thuế suất do bộ phận kiểm tra sau thông quan chuyển hoặc những vụ việc gian lận nổi cộm, có tính chất hệ thống, phạm vi rộng do lực lượng chống buôn lậu phát hiện. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Đối với các lô hàng đã được kiểm tra tại khâu thông quan về phân loại hàng hoá, xác định mức thuế bao gồm cả các trường hợp\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e đã ấn định mã số, mức thuế nhưng qua công tác phúc tập, kiểm tra sau thông quan phát hiện các sai phạm hoặc trong khi thực hiện nhiệm vụ phòng chống buôn lậu, vận chuyển trái phép ... lực lượng điều tra chống buôn lậu phát hiện các sai phạm thì vẫn tiến hành xử lý hành vi vi phạm theo quy định của pháp luật, thực hiện thu đủ số tiền thuế thiếu, thuế trốn, gian lận và làm rõ trách nhiệm của bộ phận kiểm tra tại khâu thông quan, nếu có sai phạm thì xử lý kỷ luật theo quy định của ngành Hải quan và của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e5. Kết quả kiểm tra về phân loại hàng hoá, xác định mức thuế sau khi hàng hoá đã thông quan phải thông\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e báo cho khâu thông quan trong vòng 05 (năm) ngày làm việc kể từ ngày có kết quả kiểm tra để làm cơ sở thu thập, cập nhật Cơ sở dữ liệu. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương III\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003ePHÂN TÍCH, PHÂN LOẠI VÀ GIÁM ĐỊNH ĐỂ PHÂN LOẠI HÀNG HOÁ TRONG KHI LÀM THỦ TỤC HẢI QUAN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 18. Đối tượng, phân tích, giám định và việc gửi yêu cầu phân tích, giám định để phân loại hàng hóa\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Đối tượng phân tích, giám định để phân loại hàng hóa là mẫu hàng hóa xuất khẩu, nhập khẩu (sau đây gọi tắt là mẫu hàng hóa).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCơ quan hải quan nơi làm thủ tục xuất khẩu, nhập khẩu hàng hóa lấy mẫu hàng hóa gửi Trung tâm Phân tích, phân loại để phân tích, phân loại hoặc gửi cơ quan giám định hoạt động theo quy định của Luật Thương mại để trưng cầu giám định theo quy định tại Điều 20, Điều 21 Thông tư này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Gửi yêu cầu phân tích, giám định:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.1. Trung tâm Phân tích, phân loại thuộc Tổng cục Hải quan thực hiện phân tích, phân loại hàng hóa đối với những mặt hàng không phân biệt được bằng mắt thường, phải dùng máy móc, thiết bị kỹ thuật để xác định tên gọi và đặc tính của hàng hóa xuất khẩu, nhập khẩu;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.2. Các trường hợp phải phân tích, phân loại hàng hóa theo quy định tại Điểm 2.1 Điều này nhưng Trung tâm Phân tích, phân loại thuộc Tổng cục Hải quan chưa có đủ điều kiện để phân tích, phân loại hoặc không có tài liệu kỹ thuật thì cơ quan hải quan nơi làm thủ tục hải quan gửi mẫu hàng hóa đến cơ quan giám định để trưng cầu giám định theo đúng quy định của pháp luật và tham khảo kết quả giám định của các cơ quan này để kết luận kiểm tra hải quan về tên hàng, mã số, mức thuế của hàng hoá xuất khẩu, nhập khẩu. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTổng cục Hải quan công bố Danh mục những mặt hàng Trung tâm Phân tích, phân loại chưa đủ điều kiện phân tích, phân loại;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.3. Các trường hợp gửi yêu cầu phân tích, phân loại hoặc giám định và sử dụng kết quả phân tích, phân loại hoặc giám định trái với quy định tại Điều này thì không có giá trị pháp lý để làm căn cứ phân loại hàng hóa.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.3pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.3pt;\"\u003eĐiều 19. Hồ sơ yêu cầu phân tích, phân loại hoặc trưng cầu giám định\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hồ sơ yêu cầu phân tích, phân loại:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1. Hồ sơ yêu cầu phân tích, phân loại do Chi cục hải quan nơi làm thủ tục xuất khẩu, nhập khẩu hàng hóa lập, đóng dấu tròn giáp lai của đơn vị, gửi Trung tâm Phân tích, phân loại, gồm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Phiếu yêu cầu phân tích, phân loại\u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003e kiêm Biên bản lấy mẫu hàng hóa (theo mẫu tại \u003cb\u003ePhụ lục 6\u003c/b\u003e kèm theo Thông tư này): lập thành 02 bản \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003echính, đơn vị yêu cầu phân tích, phân loại lưu 01 bản và gửi cho Trung tâm Phân tích, phân loại: 01 bản;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Tài liệu kỹ thuật có liên quan: 01 bản sao;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Ngoài các tài liệu nêu tại khoản 1 Điều này, hồ sơ yêu cầu phân tích, phân loại còn phải có:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Tờ khai hải quan của hàng hóa xuất khẩu, nhập khẩu yêu cầu phân tích, phân loại. Trường hợp đã kiểm tra thực tế hàng hoá thì phải ghi rõ kết quả kiểm tra thực tế hàng hoá của kiểm hoá viên: 01 bản sao; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Hợp đồng thương mại (phần liên quan đến yêu cầu phân tích): 01 bản sao;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Chứng nhận xuất xứ hàng hóa (C/O): 01 bản sao;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Bảng kê danh mục tài liệu của hồ sơ: 01 bản chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hồ sơ \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003etrưng cầu giám định: Thực hiện theo quy định của văn bản về giám định hàng hoá.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 20. Lấy mẫu, lưu mẫu hàng hóa phục vụ yêu cầu phân tích, phân loại hoặc trưng cầu\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-size:10pt;\"\u003e \u003cb\u003egiám định\u003c/b\u003e\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Mẫu hàng hóa để phân tích, phân loại hoặc trưng cầu giám định phải được lấy từ chính lô hàng được kiểm tra việc phân loại, áp dụng mức thuế. Tổng cục Hải quan quy định cụ thể yêu cầu về mẫu hàng hóa và kỹ thuật lấy mẫu hàng hóa để phân tích, phân loại, trưng cầu giám định. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Thủ tục lấy mẫu hàng hóa, lưu mẫu hàng hóa thực hiện theo hướng dẫn tại Điều 15 Thông tư số 79/2009/TT-BTC.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 21. Giao, nhận mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại hoặc trưng cầu giám định\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Cơ quan hải quan yêu cầu phân tích, phân loại hoặc trưng cầu giám định trực tiếp chuyển hoặc gửi qua đường bưu điện, hoặc ủy quyền bằng văn\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e bản cho người khai hải quan chuyển mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại hoặc trưng cầu giám định tới Trung tâm Phân tích, phân loại hoặc cơ quan giám định. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2. Khi nhận được mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại, Trung tâm Phân tích, phân loại phải lập Phiếu tiếp nhận yêu cầu phân tích,\u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;letter-spacing:-0.1pt;\"\u003e phân loại (theo mẫu tại \u003cb\u003ePhụ lục 7\u003c/b\u003e kèm theo Thông tư này). Phiếu tiếp \u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003enhận yêu cầu phân tích, phân loại được lập thành 02 bản, Trung tâm Phân tích, phân loại lưu 01 bản, gửi cơ quan hải quan yêu cầu phân tích, phân loại 01 bản\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTrong thời hạn 03 ngày làm việc, Trung tâm Phân tích, phân loại phải gửi Phiếu tiếp nhận yêu cầu phân tích, phân loại cho cơ quan hải quan yêu cầu phân tích, phân loại để theo dõi.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Trường hợp mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại không đáp ứng quy định, Trung tâm Phân tích, phân loại phải thông báo bằng văn bản, trả lại mẫu hàng hóa và hồ sơ trong thời hạn 03 ngày làm việc, kể từ ngày nhận được. Cơ quan hải quan nơi yêu cầu phân tích, phân loại có trách nhiệm nhận lại hồ sơ và mẫu hàng hóa để bổ sung theo quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.3pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 22. Hủy mẫu, trả lại mẫu hàng hóa đã phân tích, phân loại hoặc trưng cầu giám định\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hủy mẫu hàng hóa đã phân tích, phân loại: \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.1. Trung tâm Phân tích, phân loại tiến hành thủ tục hủy đối với các mẫu hàng hóa đã hết hạn lưu giữ theo quy định, mẫu hàng hóa dễ gây nguy hiểm, mẫu hàng hóa đã bị biến chất hoặc mẫu hàng hóa không còn khả năng lưu giữ;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1.2. Việc hủy mẫu hàng hóa đã phân tích, phân loại phải có quyết định của Giám đốc Trung tâm Phân tích, phân loại và phải lập biên bản huỷ mẫu. Quyết định và biên bản hủy mẫu được lưu theo quy định về lưu giữ hồ sơ. \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Trả lại mẫu hàng hóa đã phân tích, phân loại:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e2.1. Trường hợp người khai hải quan có ghi rõ “yêu\u003c/span\u003e\u003cspan style=\"font-size:10pt;letter-spacing:-0.1pt;\"\u003e cầu trả lại mẫu” trong Phiếu yêu cầu phân tích phân loại đã được lập tại Chi cục Hải quan thì Trung tâm Phân tích, phân loại thực hiện trả lại mẫu cho Chi cục Hải quan hoặc cho người khai hải quan (nếu Chi cục Hải quan nơi yêu cầu phân tích uỷ quyền cho người khai hải quan nhận mẫu) đối với những mẫu có khả năng trả lại.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.2. Giám đốc Trung tâm Phân tích, phân loại quyết định việc trả lại mẫu hàng hóa đang lưu giữ và không chịu trách nhiệm về phẩm chất hàng hoá đối với những mẫu được trả lại do đã chịu tác động của quá trình phân tích mẫu để phân loại.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:0.2pt;\"\u003e2.3. Trường hợp trả lại mẫu hàng hóa còn đang trong thời hạn lưu, chủ hàng hóa phải có văn bản cam kết không khiếu nại về kết quả phân tích, phân loại.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2.4. Khi trả lại mẫu hàng hóa, phải lập biên bản trả mẫu (theo mẫu tại\u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003e \u003cb\u003ePhụ lục 8\u003c/b\u003e kèm theo Thông tư này).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Việc trả mẫu hàng hóa đã giám định thực hiện theo quy định của pháp luật hiện hành về giám định hàng hoá.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.3pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eĐiều 23. Thông báo kết quả phân tích, phân loại \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Trong thời hạn 15 ngày làm việc kể từ ngày tiếp nhận mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại đủ điều kiện theo quy định của Thông tư này, Trung tâm Phân tích, phân loại phải thông báo bằng văn bản kết quả phân\u003c/span\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003e tích, phân loại mẫu hàng hóa đã tiếp nhận \u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003e(theo mẫu tại \u003cb\u003ePhụ lục 9\u003c/b\u003e kèm theo Thông tư này) cho đơn vị yêu cầu phân tích, phân loại. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTrường hợp mẫu hàng hóa phức tạp hoặc hồ sơ yêu cầu phân tích phân loại có trên 02 mẫu hàng hóa, cần phải có thêm thời gian phân tích, phân loại thì trong thời hạn 10 ngày làm việc, kể từ ngày tiếp nhận mẫu hàng hóa và hồ sơ yêu cầu phân tích, phân loại đủ điều kiện theo quy định, Trung tâm Phân tích, phân loại phải thông báo bằng văn bản cho cơ quan hải quan nơi yêu cầu phân tích, phân loại biết và dự kiến thời gian trả lời kết quả phân tích, phân loại.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Thông báo kết quả phân tích, phân loại phải nêu rõ đặc tính, tên gọi và mã số của hàng hóa theo Danh mục hàng hóa xuất nhập khẩu Việt Nam và Biểu thuế nhập khẩu ưu đãi. \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Thông báo kết quả phân tích, phân loại do chuyên viên phân tích, phân loại lập, có đóng dấu và chữ ký của Giám đốc Trung tâm Phân tích, phân loại.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.3pt 6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;color:black;\"\u003eĐiều 24. Sử dụng kết quả phân tích, phân loại\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Kết quả phân tích, phân loại do Trung tâm Phân tích, phân loại thông báo là cơ sở để cơ quan hải quan xác định tên gọi, mã số, mức thuế của hàng hoá xuất nhập khẩu. Trung tâm Phân tích, phân loại chịu trách nhiệm về tính chính xác của kết quả phân tích, phân loại;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Trường hợp cơ quan hải quan nơi yêu cầu phân tích, phân loại có đủ cơ sở xác định mã số hàng hoá do Trung tâm Phân tích, phân loại thông báo chưa đúng với hồ sơ hải quan hoặc thực tế hàng hoá xuất khẩu, nhập khẩu, thì chậm nhất trong thời hạn 03 ngày làm việc kể từ khi nhận được Kết quả phân tích, phân loại do Trung tâm Phân tích, phân loại thông báo phải có văn bản nêu rõ nội dung, lý do chưa thống nhất gửi Trung tâm Phân tích, phân loại và Cục Hải quan tỉnh, thành phố; \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;letter-spacing:-0.2pt;\"\u003e3. Trong thời hạn 05 ngày làm việc, kể từ ngày nhận được văn bản nêu rõ nội dung và lý do chưa thống nhất của cơ quan hải quan nơi yêu cầu phân tích, phân loại, Trung tâm Phân tích, phân loại phải có ý kiến trả lời bằng văn bản;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Trường hợp Trung tâm Phân tích, phân loại và cơ quan hải quan nơi yêu cầu phân tích, phân loại đã trao đổi ý kiến nhưng chưa thống nhất thì trong thời hạn 10 ngày làm việc, kể từ ngày nhận được ý kiến của Trung tâm Phân tích phân loại, Cục Hải quan tỉnh, thành phố phải có văn bản báo cáo Tổng cục Hải quan nêu rõ ý kiến và lý do chưa thống nhất kèm theo toàn bộ hồ sơ có liên quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 4.5pt 6pt 0cm;line-height:16pt;text-align:justify;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Trong thời hạn 15 ngày làm việc, kể từ ngày nhận được đủ hồ sơ báo cáo của Cục Hải quan tỉnh, thành phố, Tổng cục Hải quan phải có văn bản hướng dẫn giải quyết về kết quả phân loại. Trường hợp phức tạp, cần có thời\u003c/span\u003e\u003cspan style=\"font-size:10pt;\"\u003egian trao đổi thêm với các cơ quan có liên quan, Tổng cục Hải quan có thể kéo dài thời hạn hướng dẫn, nhưng tối đa không quá 60 ngày.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương IV\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eCƠ SỞ DỮ LIỆU\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 25. Nội dung, nguồn của Cơ sở dữ liệu\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;line-height:16pt;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Cơ sở dữ li
