t Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"Sh /chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:Tbacd,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cp align=\"center\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNGHỊ ĐỊNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:0cm 0cm 0.0001pt;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eQuy định chi tiết Luật Thương mại về xuất xứ hàng hoá \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:0cm 0cm 0.0001pt;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e______________________\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eCHÍNH PHỦ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eCăn cứ Luật Tổ chức Chính phủ ngày 25 tháng 12 năm 2001;\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eCăn cứ Luật Thương mại ngày 14 tháng 6 năm 2005;\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTheo đề nghị của Bộ trưởng Bộ Thương mại,\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNGHỊ ĐỊNH:\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương I\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eQUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 1. Phạm vi điều chỉnh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNghị định này quy định về xuất xứ hàng hoá xuất khẩu, xuất xứ hàng hoá nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 2. Đối tượng áp dụng\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNghị định này áp dụng đối với:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Thương nhân.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Cơ quan quản lý nhà nước về xuất xứ hàng hoá; tổ chức cấp Giấy chứng nhận xuất xứ hàng hóa xuất khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Cơ quan kiểm tra xuất xứ hàng hoá xuất khẩu, nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Tổ chức giám định xuất xứ hàng hoá.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Tổ chức và cá nhân khác hoạt động có liên quan đến thương mại. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 3. Giải thích từ ngữ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTrong Nghị định này, các từ ngữ dưới đây được hiểu như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. “Xuất xứ hàng hóa” là nước hoặc vùng lãnh thổ nơi sản xuất ra toàn bộ hàng hóa hoặc nơi thực hiện công đoạn chế biến cơ bản cuối cùng đối với hàng hóa trong trường hợp có nhiều nước hoặc vùng lãnh thổ tham gia vào quá trình sản xuất ra hàng hóa đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. \"Quy tắc xuất xứ ưu đãi\" là các quy định về xuất xứ áp dụng cho hàng hóa có thoả thuận ưu đãi về thuế quan và ưu đãi về phi thuế quan.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. \"Quy tắc xuất xứ không ưu đãi\" là các quy định về xuất xứ áp dụng cho hàng hóa ngoài quy định tại khoản 2 Điều này và trong các trường hợp áp dụng các biện pháp thương mại không ưu đãi về đối xử tối huệ quốc, chống bán phá giá, chống trợ cấp, tự vệ, hạn chế số lượng hay hạn ngạch thuế quan, mua sắm chính phủ và thống kê thương mại.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. \"Giấy chứng nhận xuất xứ\" là văn bản do tổ chức thuộc quốc gia hoặc vùng lãnh thổ xuất khẩu hàng hoá cấp dựa trên những quy định và yêu cầu liên quan về xuất xứ, chỉ rõ nguồn gốc xuất xứ của hàng hoá đó. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. \"Chuyển đổi mã số hàng hóa\" là sự thay đổi về mã số HS (trong Biểu thuế xuất nhập khẩu) của hàng hóa được tạo ra ở một quốc gia hoặc vùng lãnh thổ trong quá trình sản xuất từ nguyên liệu không có xuất xứ của quốc gia hoặc vùng lãnh thổ này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e6. \"Tỷ lệ phần trăm của giá trị\" là phần giá trị gia tăng có được sau khi một quốc gia hoặc vùng lãnh thổ sản xuất, gia công, chế biến các nguyên liệu không có xuất xứ từ quốc gia hoặc vùng lãnh thổ này so với tổng trị giá của hàng hoá được sản xuất ra.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e7. \"Công đoạn gia công, chế biến hàng hoá\" là quá trình sản xuất chính tạo ra những đặc điểm cơ bản của hàng hóa. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e8. “Thay đổi cơ bản” là việc một hàng hoá được biến đổi qua một quá trình sản xuất, để hình thành một vật phẩm thương mại mới, khác biệt về hình dạng, tính năng, đặc điểm cơ bản, hoặc mục đích sử dụng so với hàng hoá ban đầu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e9. \"Sản xuất\" là các phương thức để tạo ra hàng hoá bao gồm trồng trọt, khai thác, thu hoạch, chăn nuôi, chiết xuất, thu lượm, thu nhặt, đánh bắt, đánh bẫy, săn bắn, chế tạo, chế biến, gia công hay lắp ráp.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e10. \"Nguyên liệu\" bao gồm nguyên liệu thô, thành phần, phụ tùng, linh kiện, bộ phận rời và các hàng hoá mà có thể hợp lại để cấu thành một hàng hoá khác sau khi trải qua một quá trình sản xuất.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e11. \"Sản phẩm\" là vật phẩm có giá trị thương mại, đã trải qua một hay nhiều quá trình sản xuất.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e12. Hàng hoá bao gồm nguyên liệu hoặc sản phẩm.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương II\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eQUY TẮC XUẤT XỨ ƯU ĐÃI\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 4. Quy tắc xuất xứ ưu đãi theo các điều ước quốc tế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eViệc xác định xuất xứ hàng hóa xuất khẩu, hàng hóa nhập khẩu để được hưởng chế độ ưu đãi về thuế quan và phi thuế quan được áp dụng theo các Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập và các văn bản quy phạm pháp luật có liên quan quy định chi tiết việc thi hành các Điều ước này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 5. Quy tắc xuất xứ ưu đãi theo chế độ ưu đãi thuế quan phổ cập và các ưu đãi đơn phương khác\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eViệc xác định xuất xứ hàng hoá xuất khẩu để được hưởng chế độ ưu đãi thuế quan phổ cập và các ưu đãi đơn phương khác được thực hiện theo quy tắc xuất xứ của nước nhập khẩu dành cho các ưu đãi này.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương III\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eQUY TẮC XUẤT XỨ KHÔNG ƯU ĐÃI\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 6. Hàng hoá có xuất xứ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eHàng hoá được coi là có xuất xứ khi thuộc một trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Xuất xứ thuần tuý.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Xuất xứ không thuần tuý.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 7. Xác định hàng hoá có xuất xứ thuần tuý\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eHàng hoá có xuất xứ thuần tuý nêu tại khoản 1 Điều 6 Nghị định này được công nhận có xuất xứ từ một quốc gia, vùng lãnh thổ khi thuộc một trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Cây trồng và các sản phẩm từ cây trồng được thu hoạch tại quốc gia hoặc vùng lãnh thổ đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Động vật sống được sinh ra và nuôi dưỡng tại quốc gia hoặc vùng lãnh thổ đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Các sản phẩm từ động vật sống nêu tại khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Các sản phẩm thu được từ săn bắn, đặt bẫy, đánh bắt, nuôi trồng, thu lượm hoặc săn bắt tại quốc gia hoặc vùng lãnh thổ đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Các khoáng sản và các chất sản sinh tự nhiên, không được liệt kê từ khoản 1 đến khoản 4 tại Điều này, được chiết xuất hoặc lấy ra từ đất, nước, đáy biển hoặc dưới đáy biển của quốc gia hoặc vùng lãnh thổ đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e6. Các sản phẩm lấy từ nước, đáy biển hoặc dưới đáy biển bên ngoài lãnh hải của quốc gia, vùng lãnh thổ, với điều kiện quốc gia, vùng lãnh thổ đó có quyền khai thác đối với vùng nước, đáy biển và dưới đáy biển theo luật pháp quốc tế.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e7. Các sản phẩm đánh bắt và các hải sản khác đánh bắt từ vùng biển cả bằng tàu được đăng ký với quốc gia đó và được phép treo cờ của quốc gia đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e8. Các sản phẩm được chế biến hoặc được sản xuất ngay trên tàu từ các sản phẩm nêu tại khoản 7 Điều này được đăng ký ở quốc gia, vùng lãnh thổ đó và được phép treo cờ của quốc gia, vùng lãnh thổ đó. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e9. Các vật phẩm có được ở quốc gia, vùng lãnh thổ đó hiện không còn thực hiện được những chức năng ban đầu và cũng không thể sửa chữa hay khôi phục được và chỉ có thể vứt bỏ hoặc dùng làm các nguyên liệu, vật liệu thô, hoặc sử dụng vào mục đích tái chế.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e10. Các hàng hoá có được hoặc được sản xuất từ các sản phẩm nêu từ khoản 1 đến khoản 9 Điều này ở quốc gia, vùng lãnh thổ đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 8. Xác định hàng hoá có xuất xứ không thuần tuý\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Hàng hóa có xuất xứ không thuần tuý nêu tại khoản 2 Điều 6 Nghị định này được công nhận có xuất xứ từ một quốc gia, vùng lãnh thổ khi quốc gia, vùng lãnh thổ đó thực hiện cộng đoạn chế biến cơ bản cuối cùng làm thay đổi cơ bản hàng hóa này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Tiêu chí \"Chuyển đổi mã số hàng hoá\" là tiêu chí chính để xác định sự thay đổi cơ bản của hàng hoá quy định tại khoản 1 Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTiêu chí “Tỉ lệ phần trăm của giá trị” và tiêu chí “Công đoạn gia công hoặc chế biến hàng hóa” được lấy làm các tiêu chí bổ sung hoặc thay thế khi xác định thay đổi cơ bản của hàng hoá.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Bộ Thương mại ban hành Danh mục hàng hoá sử dụng tiêu chí \"Tỷ lệ phần trăm của giá trị\" và tiêu chí \"Công đoạn gia công hoặc chế biến hàng hoá\" quy định tại khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 9. Những công đoạn gia công, chế biến giản đơn không được xét đến khi xác định xuất xứ hàng hoá\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNhững công đoạn gia công chế biến dưới đây, khi được thực hiện riêng rẽ hoặc kết hợp với nhau được xem là giản đơn và không được xét đến khi xác định xuất xứ hàng hoá:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Các công việc bảo quản hàng hoá trong quá trình vận chuyển và lưu kho (thông gió, trải ra, sấy khô, làm lạnh, ngâm trong muối, xông lưu huỳnh hoặc thêm các phụ gia khác, loại bỏ các bộ phận bị hư hỏng và các công việc tương tự).\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Các công việc như lau bụi, sàng lọc, chọn lựa, phân loại (bao gồm cả việc xếp thành bộ) lau chùi, sơn, chia cắt ra từng phần.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Thay đổi bao bì đóng gói và tháo dỡ hay lắp ghép các lô hàng; đóng chai, lọ, đóng gói, bao, hộp và các công việc đóng gói bao bì đơn giản khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Dán lên sản phẩm hoặc bao gói của sản phẩm các nhãn hiệu, nhãn, mác hay các dấu hiệu phân biệt tương tự.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Việc trộn đơn giản các sản phẩm, kể cả các thành phần khác nhau, nếu một hay nhiều thành phần cấu thành của hỗn hợp không đáp ứng điều kiện đã quy định để có thể được coi như có xuất xứ tại nơi thực hiện việc này.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e6. Việc lắp ráp đơn giản các bộ phận của sản phẩm để tạo nên một sản phẩm hoàn chỉnh.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e7. Kết hợp của hai hay nhiều công việc đã liệt kê từ khoản 1 đến khoản 6 Điều này. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e8. Giết, mổ động vật.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 10. Xác định xuất xứ của bao bì, phụ kiện, phụ tùng, dụng cụ, hàng hoá chưa được lắp ráp hoặc bị tháo rời\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Vật phẩm dùng để đóng gói, nguyên liệu đóng gói, và bao bì của hàng hoá được coi như có cùng xuất xứ đối với hàng hoá mà nó chứa đựng và thường dùng để bán lẻ.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Tài liệu giới thiệu, hướng dẫn sử dụng hàng hoá; phụ kiện, phụ tùng, dụng cụ đi kèm hàng hoá với chủng loại số lượng phù hợp cũng được coi là có cùng xuất xứ với hàng hoá đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Hàng hoá chưa được lắp ráp hoặc đang ở tình trạng bị tháo rời được nhập khẩu thành nhiều chuyến hàng do điều kiện vận tải hoặc sản xuất không thể nhập khẩu trong một chuyến hàng, nếu người nhập khẩu có yêu cầu, xuất xứ của hàng hóa trong từng chuyến hàng được coi là có cùng xuất xứ với hàng hoá đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 11. Các yếu tố gián tiếp không được xét đến khi xác định xuất xứ hàng hoá\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eXuất xứ của công cụ, máy móc, thiết bị, nhà xưởng, năng lượng được sử dụng để sản xuất hàng hóa hoặc nguyên liệu được sử dụng trong quá trình sản xuất nhưng không còn lại trong hàng hóa hoặc không được tạo nên một phần của hàng hóa không được xét đến khi xác định xuất xứ hàng hóa. \u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương IV\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eCẤP GIẤY CHỨNG NHẬN XUẤT XỨ HÀNG HÓA; THỦ TỤC KIỂM TRA XUẤT XỨ HÀNG HÓA\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 12. Cấp Giấy chứng nhận xuất xứ hàng hoá xuất khẩu \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Giấy chứng nhận xuất xứ do các tổ chức cấp Giấy chứng nhận xuất xứ cấp theo mẫu quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Người đề nghị cấp Giấy chứng nhận xuất xứ hàng hoá xuất khẩu phải nộp cho tổ chức cấp Giấy chứng nhận xuất xứ bộ hồ sơ đề nghị cấp Giấy chứng nhận xuất xứ hàng hóa và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực về nội dung bộ hồ sơ đó. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Tổ chức cấp Giấy chứng nhận xuất xứ tiến hành kiểm tra bộ hồ sơ, để xác định xuất xứ hàng hoá xuất khẩu và cấp Giấy chứng nhận xuất xứ trong thời gian không quá 03 ngày làm việc, kể từ thời điểm nhận được bộ hồ sơ đầy đủ và hợp lệ. Trong trường hợp cần phải kiểm tra thực tế thì thời hạn cấp có thể kéo dài nhưng không quá 05 ngày làm việc.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Giấy chứng nhận xuất xứ sẽ không được cấp nếu hàng hoá xuất khẩu không đáp ứng được tiêu chí về xuất xứ quy định tại Nghị định này hoặc bộ hồ sơ đề nghị cấp không hợp lệ.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Trong trường hợp cơ quan Hải quan, cơ quan có thẩm quyền của quốc gia, vùng lãnh thổ nhập khẩu hàng hoá của Việt Nam hoặc cơ quan có thẩm quyền của Việt Nam yêu cầu kiểm tra tính xác thực xuất xứ của hàng hoá, Tổ chức cấp Giấy chứng nhận xuất xứ có trách nhiệm xác minh xuất xứ của hàng hoá này và thông báo lại cho cơ quan đã yêu cầu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 13. Quy định các trường hợp Giấy chứng nhận xuất xứ hàng hoá nhập khẩu phải nộp cho cơ quan hải quan.\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTrong những trường hợp sau, Giấy chứng nhận xuất xứ đối với hàng hoá nhập khẩu phải nộp cho cơ quan Hải quan tại thời điểm làm thủ tục hải quan:\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Hàng hoá có xuất xứ từ nước hoặc nhóm nước được Việt Nam cho hưởng các ưu đãi về thuế quan và phi thuế quan theo quy định của pháp luật Việt Nam và theo các Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập, nếu người nhập khẩu muốn được hưởng các chế độ ưu đãi đó. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Hàng hóa có xuất xứ từ những nước được Việt Nam cho hưởng ưu đãi theo thuế suất tối huệ quốc Việt Nam trên cơ sở có đi có lại hoặc trên cơ sở đơn phương. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTrong trường hợp không có Giấy chứng nhận xuất xứ thì người nhập khẩu phải có cam kết hàng hóa có xuất xứ từ những nước đó và phải chịu trách nhiệm trước pháp luật về tính chính xác, trung thực về nội dung cam kết đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Hàng hoá thuộc diện phải tuân thủ theo các chế độ quản lý nhập khẩu theo quy định của pháp luật Việt Nam hoặc theo các Điều ước quốc tế hai bên hoặc nhiều bên mà Việt Nam và nước hoặc nhóm nước cùng là thành viên.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Hàng hoá thuộc diện do Việt Nam hoặc các tổ chức quốc tế thông báo đang ở trong thời điểm có nguy cơ gây hại đến an toàn xã hội, sức khoẻ của cộng đồng hoặc vệ sinh môi trường cần được kiểm soát.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Hàng hoá nhập khẩu từ các nước thuộc diện Việt Nam thông báo đang ở trong thời điểm áp dụng thuế chống bán phá giá, thuế chống trợ giá, các biện pháp tự vệ, biện pháp hạn ngạch thuế quan, biện pháp hạn chế số lượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 14. Xác nhận trước xuất xứ hàng hóa nhập khẩu\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eNgười nhập khẩu nếu có nhu cầu xác nhận trước xuất xứ cho hàng nhập khẩu phải gửi văn bản, tài liệu liên quan đề nghị cơ quan Hải quan xác nhận bằng văn bản về xuất xứ cho lô hàng sắp được nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 15. Thủ tục xác định và kiểm tra xuất xứ hàng hoá nhập khẩu \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Sau khi nhận được bộ hồ sơ đăng ký Tờ khai Hải quan của người nhập khẩu, cơ quan Hải quan tiến hành xem xét việc xác định xuất xứ của hàng hoá nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Đối với hàng hoá đã nhập khẩu phù hợp với hàng hoá được nêu trong xác nhận trước về xuất xứ, cơ quan Hải quan không xác định lại xuất xứ. Trường hợp phát hiện hàng hoá đã nhập khẩu không phù hợp với hàng hoá được nêu trong xác nhận trước về xuất xứ, cơ quan Hải quan căn cứ theo các quy định tại Nghị định này để xác định lại xuất xứ của hàng hoá nhập khẩu. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Trong trường hợp có nghi ngờ tính xác thực của chứng từ hoặc mức độ chính xác của thông tin liên quan đến xuất xứ của hàng hoá, cơ quan Hải quan có thể gửi yêu cầu kiểm tra cùng với Giấy chứng nhận xuất xứ có liên quan tới tổ chức cấp Giấy chứng nhận xuất xứ. Yêu cầu kiểm tra phải nêu rõ lý do và các thông tin nghi ngờ về tính xác thực của Giấy chứng nhận xuất xứ và xuất xứ của hàng hoá đang xem xét.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Trong khi chờ kết quả kiểm tra, hàng hóa không được hưởng ưu đãi thuế quan nhưng vẫn được phép thông quan theo các thủ tục hải quan thông thường.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e5. Việc kiểm tra được quy định tại khoản 3 Điều này phải được hoàn thành trong thời gian sớm nhất nhưng không quá 150 ngày, kể từ thời điểm người nhập khẩu nộp bộ hồ sơ đầy đủ và hợp lệ.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 16. Lưu trữ và giữ bí mật thông tin\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Hồ sơ liên quan đến việc cấp Giấy chứng nhận xuất xứ, xác định xuất xứ được tổ chức cấp Giấy chứng nhận xuất xứ, cơ quan Hải quan, người đề nghị cấp Giấy chứng nhận xuất xứ lưu trữ ít nhất trong ba (03) năm, kể từ ngày cấp hoặc ngày xác nhận.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Các thông tin và tài liệu dùng cho việc kiểm tra, xác định xuất xứ, phải được các cơ quan có liên quan giữ bí mật, trừ việc cung cấp cho cơ quan có thẩm quyền.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương V\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eQUẢN LÝ NHÀ NƯỚC VỀ XUẤT XỨ HÀNG HÓA\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 17. Nhiệm vụ, quyền hạn của Bộ Thương mại\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e\u0026nbsp;1. Xây dựng, trình cấp có thẩm quyền ban hành hoặc ban hành theo thẩm quyền các văn bản quy phạm pháp luật về xuất xứ hàng hóa.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Tổ chức việc thực hiện cấp Giấy chứng nhận xuất xứ hàng hóa xuất khẩu; trực tiếp cấp hoặc ủy quyền cho Phòng Thương mại và Công nghiệp Việt Nam và các tổ chức khác thực hiện việc cấp Giấy chứng nhận xuất xứ hàng hóa.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Quản lý hoạt động nghiên cứu, thực hiện hợp tác quốc tế trong lĩnh vực xuất xứ hàng hóa.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e4. Chủ trì đàm phán về Quy tắc xuất xứ theo các Điều ước quốc tế.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 18. Nhiệm vụ, quyền hạn của Bộ Tài chính:\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Xây dựng, trình cấp có thẩm quyền ban hành hoặc ban hành theo thẩm quyền các văn bản quy phạm pháp luật về kiểm tra xuất xứ đối với hàng hoá xuất khẩu, hàng hoá nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Tổ chức thực hiện quy chế kiểm tra xuất xứ đối với hàng hoá xuất khẩu, hàng hoá nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Tổ chức mạng lưới thông tin, chế độ báo cáo, xây dựng và quản lý hệ thống cơ sở dữ liệu phục vụ và tạo điều kiện thuận lợi cho các đơn vị thực hiện công tác kiểm tra xuất xứ hàng hóa xuất khẩu và hàng hóa nhập khẩu. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 19.\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e \u003cb\u003eNhiệm vụ, quyền hạn của các Bộ, cơ quan có liên quan\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eCác Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ có liên quan trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình có trách nhiệm phối hợp với Bộ Thương mại và Bộ Tài chính thực hiện quản lý nhà nước về xuất xứ hàng hoá theo quy định tại Nghị định này và các quy định pháp luật có liên quan.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương VI\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eXỬ LÝ VI PHẠM VÀ KHIẾU NẠI\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 20. Xử lý vi phạm\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Mọi hành vi vi phạm các quy định về Giấy chứng nhận xuất xứ quy định tại Nghị định này, tuỳ theo mức độ vi phạm sẽ bị xử lý hành chính hoặc truy cứu trách nhiệm hình sự theo quy định của pháp luật hiện hành. \u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Cán bộ, công chức và cá nhân thuộc các tổ chức được ủy quyền cấp Giấy chứng nhận xuất xứ, các cơ quan kiểm tra xuất xứ hàng hóa và cơ quan giám định hàng hoá vi phạm các quy định tại Nghị định này hoặc lợi dụng chức vụ, quyền hạn để cấp Giấy chứng nhận xuất xứ hàng hóa không đúng theo quy định của Nghị định này, hoặc gây khó khăn, cản trở trong việc cấp Giấy chứng nhận xuất xứ, kiểm tra xuất xứ hàng hoá, có hành vi vi phạm khác trong khi thi hành nhiệm vụ, tùy theo tính chất, mức độ, mà bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự. Trong trường hợp việc vi phạm gây thiệt hại đến lợi ích của Nhà nước hoặc của cơ quan, tổ chức, cá nhân thì phải bồi thường thiệt hại theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Giấy chứng nhận xuất xứ bị sử dụng sai mục đích hoặc được cấp do thực hiện những hành vi trái pháp luật sẽ bị thu hồi.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 21. Giải quyết khiếu nại đối với xuất xứ hàng hoá\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eTrong trường hợp bị từ chối cấp Giấy chứng nhận xuất xứ cho hàng hoá xuất khẩu hoặc bị từ chối công nhận xuất xứ của hàng hoá nhập khẩu, người đề nghị cấp giấy chứng nhận xuất xứ hoặc người nhập khẩu có quyền khiếu nại theo quy định của pháp luật về khiếu nại và tố cáo.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eChương VII\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐIỀU KHOẢN THI HÀNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003eĐiều 22. Hiệu lực thi hành\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e1. Nghị định này có hiệu lực sau 15 ngày, kể từ ngày đăng Công báo.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e2. Trừ các văn bản quy phạm pháp luật có liên quan đến xuất xứ ưu đãi nhằm thực thi các Điều ước quốc tế, các quy định về xuất xứ hàng hoá xuất khẩu, hàng hoá nhập khẩu trái với những quy định tại Nghị định này đều bị bãi bỏ.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin-top:6.0pt;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;text-align:justify;text-justify:inter-ideograph;\"\u003e\u003cspan style=\"font-size:10.0pt;font-family:Arial;\"\u003e3. Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm hướng dẫn và thi hành Nghị định này./.\u003c/span\u003e\u003cb\u003e \u003c/b\u003e\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Nghị định số 19/2006/NĐ-CP Quy định chi tiết Luật Thương mại về xuất xứ hàng hoá\\\",\\\"legislationIdentifier\\\":\\\"19/2006/NĐ-CP\\\",\\\"legislationType\\\":\\\"Nghị định\\\",\\\"legislationDate\\\":\\\"2006-02-20T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Chính phủ\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https:/
