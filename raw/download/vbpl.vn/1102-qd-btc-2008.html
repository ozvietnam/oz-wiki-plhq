ackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"  style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ Thông tư số: 40/2008/TT-BTC ngày 21 tháng 05 năm 2008 của Bộ Tài chính hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16 tháng 03 năm 2007 của Chính phủ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTheo đề nghị của Tổng cục trưởng Tổng cục Hải quan;\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003eQUYẾT ĐỊNH:\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"70d41eb0-3361-11f1-b41a-5f6251b3be97\" class=\"MsoNormal prov-article\" style=\"text-align: justify; text-indent: 36.0pt;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003eĐiều 1.\u003c/b\u003e \u003c/span\u003e\u003c/strong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003eBan hành kèm theo quyết định này Quy chế xây dựng, quản lý, sử dụng cơ sở dữ liệu giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"70d4e200-3361-11f1-ad72-dbf149128463\" class=\"MsoNormal prov-article\" style=\"text-align: justify; text-indent: 36.0pt;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003eĐiều 2.\u003c/b\u003e \u003c/span\u003e\u003c/strong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003eQuyết định này có hiệu l -variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; line-height: normal;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003eNguồn thông tin do Hải quan các nước, tổ chức Hải quan khu vực và quốc tế cung cấp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"margin-top: 8.0pt; text-indent: 36.0pt; tab-stops: 13.5pt;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ec) Nguồn thông tin từ danh mục quản lý rủi ro về giá: Bao gồm các thông tin giá \u003cspan style=\"mso-bidi-font-weight: bold; mso-bidi-font-style: italic;\"\u003ecủa một số mặt hàng, nhóm hàng trọng điểm, có khả năng gian lận thương mại cao. Các thông tin giá này được xây dựng trên cơ sở \u003c/span\u003ephân tích, tổng hợp từ các nguồn thông tin, dữ liệu có sẵn trên hồ sơ nhập khẩu và các nguồn thông tin dữ liệu khác do cơ quan Hải quan thu thập được.\u003cspan style=\"mso-bidi-font-weight: bold; mso-bidi-font-style: italic;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt; tab-stops: 13.5pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Nguồn thông tin về tình hình chấp hành pháp luật của doanh nghiệp: Bao gồm các nguồn thông tin liên quan đến tình hình chấp hành chế độ, chính sách của doanh nghiệp trong khai báo và xác định trị giá, số lần vi phạm và mức độ vi phạm do cơ quan Hải quan tổng hợp phân tích trên hệ thống quản lý rủi ro.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Nguồn thông tin dữ liệu giá tính thuế phải được thu thập, cập nhật đầy đủ, kịp thời, chính xác theo một hệ thống thống nhất, được lưu giữ tập trung tại Trung tâm dữ liệu của Tổng cục Hải quan và cung cấp cho các đơn vị trong ngành Hải quan khai thác, sử dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e3. Đối tượng thu thập, cập nhật, khai thác, sử dụng cơ sở dữ liệu giá là các cán bộ, công chức làm công tác giá tại:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chi Cục Hải quan cửa khẩu và tương đương;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cục Hải quan Tỉnh, Thành phố;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng cục Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 40.3pt; margin: 8.0pt 0cm .0001pt -4.3pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Các đơn vị được cập nhật, khai thác và sử dụng cơ sở dữ liệu giá phải phân quyền theo tên truy cập, mật khẩu riêng đến từng cán bộ, công chức phù hợp chức năng, nhiệm vụ của từng cán bộ, công chức được giao theo sự phân công của Lãnh đạo.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Việc trao đổi, cung cấp các thông tin trong cơ sở dữ liệu giá giữa các bộ phận trong đơn vị do Lãnh đạo đơn vị đó quyết định và phải tuân thủ các nguyên tắc về bảo mật và quản lý hệ thống. Nghiêm cấm việc cung cấp thông tin ra ngoài ngành Hải quan khi chưa được sự cho phép của Lãnh đạo đơn vị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; page-break-after: avoid; mso-outline-level: 2;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003eII. NỘI DUNG VỀ THU THẬP, CẬP NHẬT, KHAI THÁC VÀ SỬ DỤNG CƠ SỞ DỮ LIỆU GIÁ.\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Phương pháp thu thập các nguồn thông tin\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đối với nguồn thông tin từ hồ sơ nhập khẩu: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc thu thập thông tin phải căn cứ tài liệu, hồ sơ, chứng từ do doanh nghiệp khai báo, nộp cho cơ quan Hải quan khi làm thủ tục nhập khẩu và kết quả kiểm tra, kết quả xác định trị giá, kết quả tham vấn, kết quả điều chỉnh giá, kết quả kiểm tra sau thông quan,…do cơ quan Hải quan thực hiện tại khâu thông quan và khâu sau thông quan hàng hoá, được ghi chép, phản ánh trên hồ sơ lô hàng nhập khẩu hoặc các chứng từ có liên quan. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhương pháp thu thập đối với nguồn thông tin này được quy định cụ thể tại mục 1 của Phụ lục kèm theo Quy chế này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Đối với nguồn thông tin khác: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc thu thập thông tin phải căn cứ vào các tài liệu, chứng từ báo giá, kết quả tra cứu trên mạng internet, kết quả khảo sát giá…do doanh nghiệp, các cơ quan có liên quan cung cấp theo yêu cầu của cơ quan Hải quan hoặc do cơ quan Hải quan tự thu thập được trong quá trình kiểm tra, xác định giá tính thuế sau khi đã được kiểm tra, đánh giá mức độ tin cậy và đã được sử dụng để so sánh, kiểm tra trị giá khai báo. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhương pháp thu thập đối với nguồn thông tin này được quy định cụ thể tại mục 2 của Phụ lục kèm theo Quy chế này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Đối với nguồn thông tin từ danh mục quản lý rủi ro về giá: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec.1) Tổng cục Hải quan căn cứ tình hình thực tế, khả năng gian lận thương mại để công bố những mặt hàng thuộc danh mục quản lý rủi ro về giá theo từng giai đoạn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec.2) Cục Hải quan Tỉnh, Thành phố căn cứ danh mục những mặt hàng do Tổng cục Hải quan công bố để xây dựng mức giá kiểm tra trên cơ sở tổng hợp các nguồn thông tin từ hồ sơ nhập khẩu và các nguồn thông tin khác nhằm hỗ trợ công tác kiểm tra trị giá khai báo, tham vấn và xác định trị giá đối với những mặt hàng thuộc danh mục quản lý rủi ro đồng thời báo cáo về Tổng cục để tập hợp ban hành và áp dụng trên phạm vi toàn quốc.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhương pháp thu thập, phân tích, xây dựng và sử dụng danh mục dữ liệu quản lý rủi ro về giá được quy định cụ thể tại mục 3 của Phụ lục kèm theo quy chế này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u003c/span\u003ed) Đối với nguồn thông tin về tình hình chấp hành pháp luật doanh nghiệp:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eĐịnh kỳ hàng tháng, bộ phận thu thập phân tích và xử lý thông tin của hệ thống quản lý rủi ro cung cấp thông tin cho bộ phận trị giá cùng cấp những doanh nghiệp vi phạm trong quá trình khai báo và xác định trị giá để có biện pháp tăng cường công tác kiểm tra trị giá tại khâu trong thông quan đối với những doanh nghiệp này.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Phạm vi và phương pháp cập nhật các nguồn thông tin trong cơ sở dữ liệu giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Phạm vi cập nhật:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea.1) Đối với các Chi cục Hải quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cập nhật tất cả các thông tin có sẵn trên hồ sơ nhập khẩu theo quy định tại điểm a mục 1 phần I ngay trong ngày vào cơ sở dữ liệu giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cập nhật các nguồn thông tin khác ngoài hồ sơ nhập khẩu theo quy định tại điểm b mục 1 phần I ngay sau khi thông tin được thu thập và kiểm chứng mức độ tin cậy vào cơ sở dữ liệu giá.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea.2) Đối với các Cục Hải quan:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cập nhật các thông tin từ kết quả kiểm tra ngay sau khi thực hiện vào cơ sở dữ liệu giá bao gồm: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả kiểm tra trị giá;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả tham vấn giá;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả xử lý khiếu nại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả kiểm tra sau thông quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả thanh tra và kiểm tra trị giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cập nhật các nguồn thông tin khác theo quy định tại điểm b mục 1 phần I ngay sau khi thông tin được thu thập và kiểm chứng mức độ tin cậy vào cơ sở dữ liệu giá.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cập nhật danh mục mặt hàng trọng điểm do Cục trưởng quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea.3) Đối với Tổng cục:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cập nhật các thông tin từ kết quả kiểm tra ngay sau khi thực hiện vào cơ sở dữ liệu giá bao gồm: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả kiểm tra trị giá; phân luồng các lô hàng để đánh giá mức độ tin cậy của trị giá;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả xử lý khiếu nại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả kiểm tra sau thông quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Kết quả thanh tra và kiểm tra trị giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cập nhật các nguồn thông tin khác theo quy định tại điểm b mục 1 phần I ngay sau khi thông tin được thu thập và kiểm chứng mức độ tin cậy vào cơ sở dữ liệu giá.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cập nhật danh mục quản lý rủi ro về giá trong phạm vi toàn Ngành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Phương pháp cập nhật các nguồn thông tin trong cơ sở dữ liệu giá\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc cập nhật các nguồn thông tin đối với từng cấp theo phạm vi nêu trên được thực hiện theo tài liệu hướng dẫn sử dụng phần mềm cơ sở dữ liệu giá (GTT22). Riêng việc cập nhật danh mục dữ liệu quản lý rủi ro về giá được thực hiện theo hướng dẫn tại mục 3 của Phụ lục kèm theo Quy chế này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Khai thác, sử dụng cơ sở dữ liệu giá tính thuế: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Cơ sở dữ liệu giá được sử dụng để kiểm tra, xác định độ tin cậy, tính trung thực và chính xác của trị giá khai báo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea.1) Nguồn thông tin để kiểm tra trị giá khai báo: Là toàn bộ các thông tin có trong cơ sở dữ liệu giá bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin từ hồ sơ nhập khẩu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin từ nguồn khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin từ danh mục quản lý rủi ro về giá;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin về tình hình chấp hành pháp luật của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea.2) Phương pháp kiểm tra: So sánh, đối chiếu trị giá khai báo với các trị giá có trong cơ sở dữ liệu giá để xác định mức độ trung thực, chính xác của trị giá khai báo. Quá trình kiểm tra được thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh trị giá khai báo với các trị giá của lô hàng nhập khẩu giống hệt, tương tự do cơ quan Hải quan xác định trị giá tính thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh trị giá khai báo với các trị giá của các lô hàng nhập khẩu giống hệt, tương tự khác đã được cơ quan Hải quan chấp nhận trị giá tính thuế theo trị giá khai báo loại trừ các lô hàng đang trong diện nghi ngờ, chờ tham vấn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh trị giá khai báo với trị giá khai báo của linh kiện đồng bộ cùng loại nhập khẩu; Hoặc trị giá khai báo của nguyên liệu chính cấu thành nên sản phẩm hoàn chỉnh nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThời gian tìm kiếm dữ liệu để so sánh được thực hiện theo Thông tư hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ về việc xác định trị giá tính thuế đối với hàng hoá xuất khẩu, nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh trị giá khai báo với các trị giá của hàng hoá giống hệt, tương tự có trong danh mục quản lý rủi ro về giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh trị giá khai báo với trị giá hàng hoá giống hệt, tương tự do cơ quan Hải quan thu thập từ các nguồn thông tin khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrường hợp không tìm được hàng hoá giống hệt, hàng hoá tương tự theo quy định để so sánh, kiểm tra trị giá khai báo thì áp dụng linh hoạt, mở rộng hơn khái niệm hàng hoá giống hệt, tương tự quy định tại Thông tư hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ về việc xác định trị giá tính thuế đối với hàng hoá xuất khẩu, nhập khẩu. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kiểm tra thông tin về tình hình chấp hành trong khai báo và xác định trị giá của doanh nghiệp do bộ phận thu thập, xử lý thông tin cung cấp từ chương trình quản lý rủi ro để phân loại doanh nghiệp trọng điểm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc đánh giá mức độ tin cậy, tính trung thực chính xác của trị giá khai báo sau khi so sánh với cơ sở dữ liệu giá quy định tại điểm a nêu trên được thực hiện theo hướng dẫn cụ thể tại Thông tư hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ về việc xác định trị giá tính thuế đối với hàng hoá xuất khẩu, nhập khẩu và quy trình kiểm tra, xác định trị giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Cơ sở dữ liệu giá được sử dụng để hỗ trợ việc xác định trị giá tính thuế đối với các trường hợp cơ quan Hải quan phải xác định giá tính thuế theo quy định tại điểm 7 Điều 15 Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb.1) Nguồn thông tin hỗ trợ việc xác định trị giá: Bao gồm một số nguồn thông tin trong cơ sở dữ liệu giá, cụ thể:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trị giá tính thuế của các lô hàng nhập khẩu trước đó đã được cơ quan Hải quan chấp nhận trị giá khai báo theo các phương pháp xác định trị giá tính thuế quy định từ mục I đến mục VI phần II Thông tư hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ về việc xác định trị giá tính thuế đối với hàng hoá xuất khẩu, nhập khẩu loại trừ các lô hàng đang trong diện nghi ngờ, chờ tham vấn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trị giá tính thuế của các lô hàng nhập khẩu trước đó đã được cơ quan Hải quan xác định trị giá tính thuế theo các phương pháp xác định trị giá tính thuế quy định từ mục I đến mục VI phần II Thông tư hướng dẫn Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ về việc xác định trị giá tính thuế đối với hàng hoá xuất khẩu, nhập khẩu do bác bỏ trị giá khai báo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb.2) Phương pháp xác định giá: Việc sử dụng cơ sở dữ liệu giá để hỗ trợ công tác xác định giá tính thuế phải tuân thủ các nguyên tắc, trình tự cũng như phương pháp xác định trị giá quy định tại Điều 4 Nghị định số 40/2007/NĐ-CP ngày 16/3/2007 của Chính phủ, không dùng cơ sở dữ liệu giá để xác định trị giá ngay hoặc áp giá tính thuế. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003e\u003cspan\u003eIII. QUẢN LÝ, BẢO MẬT CƠ SỞ DỮ LIỆU GIÁ\u003c/span\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Quản lý cơ sở dữ liệu giá\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Trách nhiệm của Chi cục\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e-\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003eTổ chức thu thập, cập nhật các thông tin về giá vào hệ thống theo đúng chức năng, phạm vi và thẩm quyền của cấp Chi cục theo hướng dẫn tại tiết a.1 khoản a mục 2 phần II Quy chế này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm về tính chính xác, trung thực và kịp thời của các thông tin dữ liệu được thu thập và cập nhật vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm tổ chức khai thác, quản lý và sử dụng có hiệu quả nguồn thông tin dữ liệu hiện có tại cơ sở dữ liệu giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổ chức phân quyền đến từng bộ phận nghiệp vụ, từng cán bộ công chức theo đúng chức năng, nhiệm vụ của từng bộ phận, từng cán bộ công chức đã được Lãnh đạo phân công.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thực hiện truyền/nhận dữ liệu theo đúng thời gian quy định. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eGiao Chi cục trưởng chịu trách nhiệm tổ chức triển khai, quản lý có hiệu quả\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003etrong quá trình thu thập, cập nhật, khai thác và sử dụng cơ sở dữ liệu giá trong phạm vi do Chi cục quản lý. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Trách nhiệm của Cục Hải quan các Tỉnh, Thành phố.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổ chức thu thập, cập nhật các thông tin về giá vào hệ thống theo đúng chức năng, phạm vi và thẩm quyền của cấp Cục theo hướng dẫn tại tiết a.2 khoản a mục 2 phần II Quy chế này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm về tính chính xác, trung thực và kịp thời của các thông tin dữ liệu được thu thập và cập nhật vào hệ thống trong phạm vi toàn Cục.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm tổ chức khai thác, quản lý và sử dụng có hiệu quả nguồn thông tin dữ liệu hiện có trong phạm vi toàn Cục.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổ chức phân quyền đến từng cán bộ công chức theo đúng chức năng, nhiệm vụ được phân công trong quá trình khai thác và sử dụng hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổ chức đôn đốc, kiểm tra việc thu thập, cập nhật, khai thác và quản lý cơ sở dữ liệu giá tại các Chi cục trực thuộc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 8.0pt 0cm .0001pt 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thực hiện truyền/nhận dữ liệu theo đúng thời gian quy định \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 39.75pt; margin: 8.0pt 0cm .0001pt -3.75pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Đảm bảo sự vận hành thông suốt của hệ thống. Khắc phục các sự cố về vấn đề kỹ thuật, về máy móc thiết bị, đường truyền mạng, lỗi phần mềm… để duy trì sự hoạt động liên tục và có hiệu quả của hệ thống trong phạm vi toàn Cục. Trường hợp không khắc phục được sự cố thì trong vòng 03 ngày phải báo ngay về Tổng cục (Cục Công nghệ thông tin và thống kê hải quan; Vụ Kiểm tra thu thuế xuất nhập khẩu) để xem xét, xử lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eGiao Cục trưởng chịu trách nhiệm tổ chức triển khai, quản lý có hiệu quả\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003etrong quá trình thu thập, cập nhật, khai thác và sử dụng cơ sở dữ liệu giá trong phạm vi toàn Cục. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Trách nhiệm của Tổng cục Hải quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Tổ chức thu thập, cập nhật các thông tin giá vào hệ thống theo đúng chức năng, phạm vi và thẩm quyền của cấp Tổng cục quy định tại tiết a.3 khoản a mục 2 phần II Quy chế này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Quản lý về nội dung toàn bộ hệ thống cơ sở dữ liệu giá tính thuế của toàn ngành Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm chia sẻ thông tin về dữ liệu giá kịp thời, chính xác để các đơn vị trong toàn ngành khai thác và sử dụng có hiệu quả. Bảo mật các thông tin được chia sẻ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hướng dẫn, kiểm tra, đôn đốc các Cục Hải quan Tỉnh, Thành phố thu thập, cập nhật, truyền/nhận thông tin dữ liệu giá về trung tâm dữ liệu tại Tổng cục theo đúng thời gian quy định. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Xử lý các vấn đề nghiệp vụ phát sinh trong quá trình khai thác và sử dụng cơ sở dữ liệu giá trong toàn Ngành.\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Đảm bảo các yêu cầu về phần cứng trong suốt quá trình vận hành cơ sở dữ liệu giá trong toàn Ngành. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Quản lý, duy trì và đảm bảo kỹ thuật cho hoạt động của hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Đảm bảo an ninh, an toàn về mặt kỹ thuật, bảo mật số liệu đối với hệ thống thông tin dữ liệu giá tại Trung tâm dữ liệu của Tổng cục Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thực hiện truyền/nhận dữ liệu theo đúng thời gian quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiao Vụ trưởng Vụ Kiểm tra thu thuế xuất nhập khẩu, Cục trưởng Cục Công nghệ thông tin và thống kê hải quan chịu trách nhiệm tổ chức triển khai, quản lý có hiệu quả\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003etrong quá trình thu thập, cập nhật, khai thác và sử dụng cơ sở dữ liệu giá trong toàn Ngành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Trách nhiệm của cán bộ công chức Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cán bộ công chức Hải quan khi khai thác, sử dụng các thông tin dữ liệu giá trên hệ thống để hỗ trợ công tác xác định và quản lý giá tính thuế phải thực hiện theo đúng các văn bản pháp quy hiện hành hướng dẫn về quy trình xác định giá tính thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chịu trách nhiệm về tính chính xác, trung thực và kịp thời của các dữ liệu được thu thập, cập nhật vào hệ thống đối với mảng dữ liệu được phân công.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dữ liệu thông tin đưa vào máy tính phải được kiểm tra phù hợp với bộ hồ sơ nhập khẩu hoặc chứng từ có liên quan theo đúng các quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tuyệt đối tuân thủ quy trình quản lý trên máy tính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chỉ được khai thác và sử dụng mảng dữ liệu trong hệ thống liên quan đến công việc chuyên môn theo sự phân công của lãnh đạo đồng thời chịu trách nhiệm về tính bảo mật đối với mảng dữ liệu được phân công theo dõi quản lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bảo mật mã thẩm quyền riêng trong quá trình cập nhật, khai thác và sử dụng hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Bảo mật cơ sở dữ liệu giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cán bộ công chức thực hiện cập nhật số liệu vào hệ thống phải có mã số và quyền hạn riêng nhất định trong từng phân hệ chương trình. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phân rõ quyền hạn truy nhập vào hệ thống chương trình.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dữ liệu cập nhật hàng ngày của các đơn vị Hải quan cuối mỗi ngày hoặc mỗi buổi phải được lưu trữ thành một bản dự phòng. Bản dự phòng này có thể khôi phục được trong trường hợp có sự cố hỏng hóc thiết bị một cách khách quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dữ liệu dự phòng phải đảm bảo được lưu trên thiết bị lưu trữ thống nhất, bảo mật và an toàn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiao Cục trưởng Cục Công nghệ thông tin và thống kê hải quan tổ chức triển khai, hướng dẫn các đơn vị trong việc phân quyền, sao lưu dữ liệu dự phòng và lưu trữ cơ sở dữ liệu giá đảm bảo thống nhất, bảo mật và an toàn.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003e\u003cspan\u003eIV. TỔ CHỨC THỰC HIỆN\u003c/span\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Tổng cục trưởng Tổng cục Hải quan tổ chức xây dựng phần mềm cơ sở dữ liệu giá để thực hiện thống nhất việc cập nhật, khai thác, sử dụng và quản lý thông tin dữ liệu giá trong toàn Ngành. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Cục trưởng Cục Hải quan các Tỉnh, Thành phố căn cứ tình hình thực tế tại đơn vị mình để xây dựng và ban hành các quy định cụ thể phân cấp cho cán bộ, công chức trong quá trình thu thập, cập nhật, khai thác và sử dụng hệ thống dựa trên những quy định của quy chế này. Chỉ đạo các bộ phận nghiệp vụ có liên quan chia sẻ, cung cấp\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003ecác thông tin có liên quan đến công tác kiểm tra, xác định trị giá tính thuế như: Thông tin về tờ khai trên chương trình số liệu xuất nhập khẩu, thông tin về doanh nghiệp trên hệ thống quản lý rủi ro, thông tin vi phạm trên hệ thống xử lý vi phạm, thông tin về kiểm tra sau thông quan,…để nâng cao hiệu quả công tác khai thác thông tin trong toàn Ngành. Nghiêm cấm mọi hành vi làm sai lệch thông tin giá tính thuế, tự ý sửa chữa phần mềm cơ sở dữ liệu giá hoặc khai thác thông tin giá tính thuế vào các mục đích ngoài quy định của Quy chế này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-top: 8.0pt; text-align: justify; text-indent: 36.0pt;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Đơn vị, cá nhân vi phạm các quy định tại Quy chế này sẽ bị xử lý theo quy định của Ngành và của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"margin-top: 8.0pt; text-indent: 36.0pt;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e4. Trong quá trình thực hiện có khó khăn, vướng mắc, các đơn vị báo cáo về Bộ Tài chính (Tổng cục Hải quan) để hướng dẫn hoặc nghiên cứu điều chỉnh, bổ sung kịp thời./.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"margin-left: 180.0pt; text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003ci style=\"mso-bidi-font-style: normal;\"\u003e\u003c/i\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003ci style=\"mso-bidi-font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 6;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/i\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003cb style=\"mso-bidi-font-weight: normal;\"\u003e\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 6;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"text-align: center;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePHỤ LỤC\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003eQuy định cụ thể phương pháp thu thập các nguồn thông tin \u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003cb\u003etrong cơ sở dữ liệu giá\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"margin-left: 36.0pt; text-align: center;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Ban hành kèm theo Quyết định số: \u003cb style=\"mso-bidi-font-weight: normal;\"\u003e1102\u003c/b\u003e/QĐ-BTC \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"margin-left: 36.0pt; text-align: center; line-height: 150%;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003engày 21 tháng 05 năm 2008 của Bộ trưởng Bộ Tài chính\u003cspan style=\"mso-bidi-font-style: italic;\"\u003e)\u003c/span\u003e\u003ci style=\"mso-bidi-font-style: normal;\"\u003e\u003c/i\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px; color: #000000;\"\u003e\u003ci\u003e\u0026nbsp;\u003c/i\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e1. Phương pháp thu thập các nguồn thông tin từ hồ sơ nhập khẩu quy định tại điểm a mục 1 phần II.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea) Đối với dữ liệu trên tờ khai nhập khẩu, tờ khai trị giá : \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào các tiêu chí do doanh nghiệp khai báo trên tờ khai nhập khẩu, tờ khai trị giá sau khi đã được cơ quan hải quan kiểm tra, tiếp nhận đăng ký trong hồ sơ lô hàng nhập khẩu để cập nhật vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eb) Đối với thông tin chi tiết về hàng hoá: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào kết quả kiểm hoá do kiểm hoá viên xác định và ghi chép trên tờ khai nhập khẩu để cập nhật vào hệ thống. Thông tin chi tiết của hàng hoá phải đảm bảo phân biệt được mặt hàng này với mặt hàng khác, nhất là những mặt hàng doanh nghiệp khai báo chưa rõ ràng, cụ thể. Thực chất đây là phần bổ sung thêm các thông tin chi tiết về hàng hóa ngoài các thông tin đã khai báo ban đầu của doanh nghiệp, phục vụ cho việc tra cứu và so sánh các thông tin khi kiểm tra trị giá. Các thông tin cần cập nhật bổ sung bao gồm: Tên thư­ơng mại; Nhà sản xuất; Ký mã hiệu; Model; Năm sản xuất; Nguyên liệu; Thành phần; Hàm lư­ợng; Nhãn mác;... Tùy theo đặc điểm, cấu tạo, công dụng của từng mặt hàng, nhóm hàng và mục tiêu quản lý giá để bổ sung các thông tin trên vào hệ thống cho phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ec) Đối với thông tin về kết quả xác định giá tính thuế lô hàng: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào kết quả xác định giá tính thuế do cơ quan hải quan xác định trên tờ khai trị giá để cập nhật vào hệ thống bao gồm: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Chấp nhận trị giá khai báo đồng thời xác định mức độ tin cậy của trị giá khai báo theo một trong hai tình huống: Bình thường hoặc nghi ngờ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eDấu hiệu để xác định trị giá khai báo ở mức độ nghi ngờ được thực hiện theo quy định tại thông tư hướng dẫn xác định trị giá.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Không chấp nhận trị giá khai báo, trị giá khai báo được xác định theo phương pháp nào thì cập nhật vào hệ thống theo đúng mẫu tương ứng với phương pháp xác định trị giá…\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ed) Đối với thông tin về kết quả tham vấn lô hàng: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ kết quả tham vấn ghi tại biên bản tham vấn do cơ quan Hải quan kết luận: Chấp nhận trị giá khai báo hoặc bác bỏ trị giá khai báo, lý do chấp nhận hoặc bác bỏ trị giá khai báo để cập nhật vào hệ thống tại mục nhập kết quả kiểm tra trị giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eđ) Đối với thông tin về kết quả điều chỉnh giá tính thuế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u003c/span\u003eCăn cứ vào thông báo kết quả xác định giá tính thuế sau tham vấn, quyết định điều chỉnh thuế sau khi đã được ban hành (do điều chỉnh giá) để cập nhật vào hệ thống theo đúng phương pháp điều chỉnh, lý do điều chỉnh giá tính thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ee) Đối với thông tin về kết quả phúc tập: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào kết quả phúc tập ghi tại phiếu phúc tập hồ sơ để cập nhật kết quả phúc tập giá vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eg) Đối với thông tin về kết quả giải quyết khiếu nại: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào hồ sơ khiếu nại do doanh nghiệp gửi và kết quả giải quyết khiếu nại tại công văn hoặc quyết định giải quyết khiếu nại để cập nhật vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eh) Đối với thông tin về kết quả kiểm tra sau thông quan: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào biên bản kết luận kết quả kiểm tra sau thông quan, nếu có liên quan đến trị giá tính thuế của lô hàng nhập khẩu thì căn cứ kết quả xử lý để cập nhật vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u003c/span\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003ei) Đối với kết quả thanh tra và kiểm tra trị giá: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ vào kết luận của Đoàn thanh tra hoặc kết quả kiểm tra trị giá được ghi chép tại các biên bản kiểm tra, thanh tra về trị giá tính thuế và kết quả xử lý để cập nhật vào hệ thống.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e2. Phương pháp thu thập các nguồn thông tin khác quy định tại điểm b mục 1 phần II.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea) Đối với nguồn thông tin trên Internet: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCăn cứ nhu cầu cần tìm kiếm thông tin trên Internet phục vụ công tác nghiệp vụ giá, cán bộ công chức thừa hành tổ chức tra cứu thông tin trên mạng Internet, sau khi tìm thấy thông tin cần tìm kiếm thì thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- In thông tin vừa tìm thấy (chú ý thông tin về tên hàng, mức giá, …).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Lập tờ trình báo cáo Lãnh đạo (Lãnh đạo Chi cục; Lãnh đạo Phòng giá hoặc phòng nghiệp vụ; Lãnh đạo Vụ Kiểm tra thu thuế xuất nhập khẩu tuỳ theo từng cấp) để đánh giá mức độ tin cậy của mức giá đã tra cứu trên mạng, trong tờ trình cần nêu rõ lập luận, cơ sở để lựa chọn mức giá. Lãnh đạo có ý kiến “chấp nhận” hoặc “không chấp nhận” tại tờ trình.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cập nhật vào hệ thống đối với những trường hợp Lãnh đạo phê duyệt ý kiến “chấp nhận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eb) Đối với nguồn thông tin từ tạp chí, sách báo, các bản tin về giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ kế hoạch đặt mua các tạp chí, sách báo, bản tin về giá của đơn vị và nhu cầu khai thác sử dụng thông tin cho công tác quản lý giá, công chức làm công tác giá tiến hành phân tích, tổng hợp và lựa chọn những mặt hàng có mức giá phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Pho to những mức giá đã lựa chọn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Lập tờ trình báo cáo Lãnh đạo (Lãnh đạo Chi cục; Lãnh đạo Phòng giá hoặc Phòng nghiệp vụ; Lãnh đạo Vụ Kiểm tra thu thuế xuất nhập khẩu tuỳ theo từng cấp) trong đó cần nêu rõ lập luận, cơ sở để lựa chọn mức giá. Lãnh đạo có ý kiến “chấp nhận” hoặc “không chấp nhận” tại tờ trình. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e-\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003eCập nhật vào hệ thống đối với những trường hợp Lãnh đạo phê duyệt ý kiến “chấp nhận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ec) Đối với nguồn thông tin từ các thư chào hàng: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ các thư chào hàng do doanh nghiệp cung cấp hoặc do cơ quan Hải quan thu thập được từ các phương tiện thông tin, công chức làm công tác giá tiến hành phân tích, tổng hợp để đánh giá mức độ tin cậy của các thông tin được cung cấp hoặc thu thập được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Trên cơ sở kết quả phân tích, lập tờ trình báo cáo Lãnh đạo đề xuất cập nhật bổ sung vào hệ thống.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cập nhật bổ sung vào hệ thống đối với các trường hợp được Lãnh đạo phê duyệt “chấp nhận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ed) Đối với nguồn thông tin từ cơ quan thẩm định giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ vào nội dung trả lời bằng văn bản của các cơ quan thẩm định giá theo đề nghị của cơ quan của Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Lập tờ trình báo cáo Lãnh đạo đề xuất cập nhật bổ sung vào hệ thống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cập nhật bổ sung vào hệ thống theo ý kiến của lãnh đạo phê duyệt.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eđ) Đối với các nguồn thông tin từ giá bán thị trường nội địa:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ nhu cầu cần tìm kiếm thông tin giá bán trên thị trường nội địa phục vụ công tác nghiệp vụ giá, Lãnh đạo phân công 02 cán bộ tiến hành khảo sát giá bán tại thị trường nội địa. Khi tiến hành khảo sát giá, phải lập phiếu khảo sát giá bao gồm các yếu tố sau: Họ tên cán bộ khảo sát, địa chỉ khảo sát, thời gian khảo sát, tên hàng hoá cần khảo sát (mô tả chi tiết), đơn giá, cấp độ thương mại, các ghi chép khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ vào kết quả khảo sát tại phiếu khảo sát nêu trên, lập tờ trình báo cáo Lãnh đạo đề xuất cập nhật bổ sung vào nguồn dữ liệu giá. Lãnh đạo có ý kiến phê duyệt “chấp nhận” hoặc “không chấp nhận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cập nhật bổ sung vào hệ thống đối với các trường hợp được Lãnh đạo phê duyệt “chấp nhận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ee) Đối với các nguồn thông tin do các cơ quan khác cung cấp như: Thuế nội địa, ngân hàng,…\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Căn cứ vào công văn trả lời về mức giá của các cơ quan có liên quan theo đề nghị của Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Lập tờ trình báo cáo Lãnh đạo đề xuất cập nhật bổ sung vào hệ thống\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cập nhật bổ sung vào hệ thống theo ý kiến của lãnh đạo phê duyệt.\u003cspan style=\"mso-spacerun
