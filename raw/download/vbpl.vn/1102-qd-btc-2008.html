: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eg) Đối với các nguồn thông tin về giá do hải quan các nước, tổ chức hải quan khu vực và quốc tế cung cấp:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eCập nhật vào hệ thống căn cứ vào thư trả lời của Hải quan các nước, tổ chức hải quan khu vực và quốc tế cung cấp theo đề nghị của Hải quan Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e3. Phương pháp thu thập, cập nhật, xây dựng và sử dụng danh mục quản lý rủi ro về giá quy định tại điểm c mục 1 phần II.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea) Phương pháp thu thập xây dựng danh mục quản lý rủi ro về giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea.1) Nguyên tắc xây dựng danh mục quản lý rủi ro về giá: Việc xây dựng danh mục quản lý rủi ro về giá chỉ thực hiện đối với những nhóm hàng, mặt hàng có độ rủi ro cao về gian lận trị giá do Tổng cục quy định hoặc những mặt hàng trọng điểm có xu hướng gian lận thương mại cao tại các địa phương và được thực hiện theo những nguyên tắc sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Mức giá xây dựng phải được tổng hợp từ các nguồn thông tin có độ tin cậy cao, có căn cứ và cơ sở rõ ràng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Mức giá phải được xây dựng cho từng mặt hàng cụ thể với đầy đủ các thông tin chi tiết về tên hàng, mẫu mã, chủng loại, Model, năm sản xuất, công dụng, tính năng,…không xây dựng theo hình thức “gom khung” các mặt hàng có đặc điểm gần giống nhau hoặc xây dựng không cụ thể, rõ ràng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Mức giá phải thường xuyên được rà soát và sửa đổi kịp thời khi có sự biến động về giá tại các Cục Hải quan Tỉnh, Thành phố (trong vòng 1 tuần kể từ khi có sự biến động về giá).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 31.5pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea.2) Nguồn thông tin xây dựng danh mục quản lý rủi ro về giá bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e- Nguồn thông tin về giá trên hệ thống GTT22 bao gồm thông tin về giá khai báo của doanh nghiệp và các thông tin về giá điều chỉnh của cơ quan Hải quan đối với các trường hợp đã tham vấn và bác bỏ trị giá khai báo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nguồn thông tin về giá chào bán công khai trên mạng Internet.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các nguồn thông tin khác do cơ quan hải quan thu thập được như: Giá bán trên thị trường, giá do các nhà sản xuất trong nước cung cấp, giá do nhà xuất khẩu cung cấp,…\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nguồn thông tin giá đã được các cơ quan, tổ chức thẩm định giá trong hoặc ngoài nước cung cấp theo yêu cầu của cơ quan Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nguồn thông tin trong danh mục cơ sở dữ liệu quản lý rủi ro về giá do Tổng cục cung cấp sau khi tổng hợp từ các nguồn thông tin.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các nguồn thông tin khác do cơ quan Hải quan tự thu thập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003ea.3) Phương pháp xây dựng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc xây dựng danh mục quản lý rủi ro về giá được thực hiện trên cơ sở phân tích và tổng hợp các nguồn thông tin theo trình tự ưu tiên như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- So sánh với trị giá của mặt hàng giống hệt, tương tự nhập khẩu trước đó do\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003ecơ quan hải quan xác định trị giá. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- So sánh với trị giá khai báo của mặt hàng giống hệt, tương tự nhập khẩu trước đó đã được chấp nhận trị giá khai báo loại trừ các trường hợp thuộc diện nghi ngờ, chờ tham vấn. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh với trị giá khai báo của mặt hàng bộ linh kiện đồng bộ tương tự, cùng loại đã nhập khẩu, so sánh với trị giá khai báo của các nguyên liệu chính cấu thành nên sản phẩm đã nhập khẩu trước đó và không bị đánh dấu nghi ngờ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh với trị giá khai báo của hàng giống hệt, tương tự do nhà xuất khẩu cung cấp hoặc do nhà sản xuất trong nước cung cấp.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- So sánh với trị giá của hàng giống hệt, tương tự đã được các cơ quan, tổ chức thẩm định giá xác nhận theo yêu cầu của cơ quan Hải quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính toán từ giá chào bán trên mạng Internet như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003eLấy chào bán trên mạng (giá Invoice dealer) trừ đi chi phí đàm phán và các khoản thuế tại nước xuất khẩu (tuỳ từng trường hợp cụ thể để quyết định tỷ lệ khấu trừ hợp lý trong khoảng từ 10% đến 20%).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLưu ý: Khi lấy giá trên mạng Internet, phải lấy những mạng có địa chỉ tin cậy cao, hình thức bán hàng không bị hạn chế bởi những điều kiện nhất định có thể ảnh hưởng đến trị giá giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính toán từ giá bán thị trường nội địa trên cơ sở: Lấy giá bán thị trường nội địa (giá bán sau khi nhập khẩu) trừ đi chi phí phát sinh sau nhập khẩu. Chi phí phát sinh sau nhập khẩu bao gồm các khoản thuế phải nộp trong nước và chi phí chung được phép hạch toán vào giá vốn và lợi nhuận. Chi phí chung và lợi nhuận được phép khấu trừ tối đa không quá 20% giá bán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrường hợp lấy từ giá bán lẻ hoặc giá bán buôn thì quy đổi theo công thức:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eGiá bán sau nhập khẩu = Giá bán buôn/110% = Giá bán lẻ/115%\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" style=\"text-align: justify; text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"color: #000000; font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tham khảo các mức giá tương tự đã được quy định trước đó tại danh mục dữ liệu quản lý rủi ro của Tổng cục hoặc của đơn vị. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003eTrên cơ sở các kết quả so sánh từ các nguồn thông tin nêu trên, cán bộ giá tổng hợp và đề xuất mức giá phù hợp, nêu rõ cơ sở đề xuất đồng thời trình lãnh đạo ký duyệt ban hành để áp dụng trong phạm vi đơn vị và gửi ngay về Tổng cục để tổng hợp, ban hành và áp dụng trên phạm vi toàn quốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003eLưu ý: Trong quá trình xây dựng danh mục quản lý rủi ro về giá, tuỳ từng trường hợp cụ thể để thu thập và tổng hợp các nguồn thông tin nhằm đưa ra mức giá phù hợp với thực tế, không nhất thiết phải thu thập đầy đủ các nguồn thông tin nêu trên mới xây dựng mức giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003eb) Phương pháp cập nhật:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eCập nhật danh mục quản lý rủi ro về giá vào chương trình EXCEL theo mẫu do Tổng cục quy định bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Mẫu đề xuất xây dựng dữ liệu giá những mặt hàng quản lý rủi ro.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Mẫu đề xuất sửa đổi dữ liệu giá những mặt hàng quản lý rủi ro.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003ec) Truyền/nhận danh mục quản lý rủi ro về giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e-\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003eSau khi ban hành mức giá, Cục Hải quan địa phương phải gửi ngay đến các Chi cục trực thuộc để thực hiện và báo cáo về Tổng cục qua đường thư điện tử.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Tổng cục Hải quan sẽ tổng hợp các mức giá do các Cục Hải quan địa phương đã ban hành đồng thời gửi cho tất cả các đơn vị để áp dụng trên phạm vi toàn quốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003ed) Sử dụng danh mục quản lý rủi ro về giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eDanh mục quản lý rủi ro về giá được sử dụng để:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Kiểm tra trị giá khai báo của doanh nghiệp, xác định dấu hiệu nghi ngờ để xử lý tại các khâu kế tiếp theo quy trình nghiệp vụ xác định trị giá.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyTextIndent2\" style=\"text-indent: 0cm; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000; font-style: normal;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Nghiêm cấm việc sử dụng danh mục quản lý rủi ro về giá để áp đặt, xác định trị giá tính thuế.\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eđ)\u003cspan style=\"mso-spacerun: yes;\"\u003e\u0026nbsp; \u003c/span\u003eSửa đổi danh mục quản lý rủi ro về giá:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003eTrong quá trình thực hiện, trường hợp phát hiện mức giá quy định tại danh mục quản lý rủi ro về giá có sự tăng, giảm trên 10% thì xử lý như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e\u003cspan style=\"mso-tab-count: 1;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e- Cục Hải quan địa phương tự điều chỉnh lại mức giá phù hợp với thực tế đối với các mặt hàng thuộc danh mục trọng điểm do Cục trưởng Cục Hải quan Tỉnh, Thành phố quản lý đồng thời báo cáo về Tổng cục.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e- Cục Hải quan địa phương đề xuất sửa đổi mức giá đối với các trường hợp mức giá trong danh mục quản lý rủi ro về giá do Tổng cục ban hành (có mẫu kèm theo).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003e4. Quản lý và lưu trữ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText\" style=\"text-indent: 36.0pt; margin: 6.0pt 0cm 6.0pt 0cm;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif; color: #000000;\"\u003eToàn bộ hồ sơ thu thập các nguồn thông tin, hồ sơ xây dựng danh mục quản lý rủi ro về giá bao gồm: Cơ sở thu thập nguồn thông tin, tờ trình báo cáo lãnh đạo các mức giá đề xuất khi xây dựng danh mục quản lý rủi ro về giá, ý kiến phê duyệt của lãnh đạo phải được lưu trữ và bảo quản như đối với hồ sơ lô hàng nhập khẩu sau khi cập nhật vào hệ thống./.\u003ci\u003e\u003c/i\u003e\u003c/span\u003e\u003c/p\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Quyết định số 1102/QĐ-BTC Về việc xây dựng, quản lý, sử dụng cơ sở dữ liệu giá\\\",\\\"legislationIdentifier\\\":\\\"1102/QĐ-BTC\\\",\\\"legislationType\\\":\\\"Quyết định\\\",\\\"legislationDate\\\":\\\"2008-05-21T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"InForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\
