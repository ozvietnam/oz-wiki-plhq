icialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca href=\"/van-ban/chi-tiet/179702\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e163/2025/NĐ-CP\u003c/a\u003e của Chính phủ quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Dược;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca href=\"/van-ban/chi-tiet/e903ac50-76bb-11f1-8fea-b7ba0a214fc2\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e42/2025/NĐ-CP\u003c/a\u003e của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Y tế;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cem\u003eTheo đề nghị của Cục trưởng Cục Quản lý Dược;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cem\u003eBộ trưởng Bộ Y tế ban hành Thông tư quy định việc đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"39a1db9e-4c74-447c-987d-b2bee9690416\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương I\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"39a1db9e-4c74-447c-987d-b2bee9690416\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"c8bd8272-3666-461d-b4fd-98a46a2aa0bd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 1. Phạm vi điều chỉnh\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d63c3143-a67f-45ea-9431-656ce7d554d2\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thông tư này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Dược số \u003ca href=\"/van-ban/chi-tiet/101886\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e105/2016/QH13\u003c/a\u003e được sửa đổi, bổ sung bởi Luật số \u003ca href=\"/van-ban/chi-tiet/175084\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e44/2024/QH15\u003c/a\u003e (sau đây gọi tắt là Luật Dược), bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"64c4cafb-5edd-4b2f-9460-c71b29ceec72\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Quy định về dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả trong hồ sơ đăng ký thuốc và tiêu chí để xác định trường hợp miễn thử, miễn một số giai đoạn thử thuốc trên lâm sàng tại Việt Nam và thuốc phải yêu cầu thử lâm sàng giai đoạn 4 tại khoản 4 Điều 89 Luật Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8bc588f9-6913-4b08-9a66-6e3b279c6bf5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Quy định về hồ sơ, thủ tục cấp, gia hạn, thay đổi, bổ sung, thu hồi giấy đăng ký lưu hành thuốc hóa dược, vắc xin, sinh phẩm, thuốc dược liệu và nguyên liệu làm thuốc dùng cho người tại Việt Nam tại khoản 9 Điều 56 và khoản 2 Điều 58 Luật Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c57c66db-bfca-4311-9d25-8ef3ca65c40b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Quy định về nguyên tắc, tiêu chí phân loại thuốc không kê đơn tại khoản 27 Điều 2 Luật Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6f295578-5bc9-4506-b5d7-a17e7c3de479\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Quy định về báo cáo an toàn, hiệu quả của thuốc sau khi được cấp giấy đăng ký lưu hành để triển khai hoạt động cảnh giác dược theo quy định tại khoản 2 Điều 78 Luật Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c52357e2-561f-4ad4-ae94-27725be4235b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Quy định về tổ chức, hoạt động của Hội đồng tư vấn cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc (sau đây gọi tắt là Hội đồng); đơn vị tổ chức thẩm định, chuyên gia thẩm định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"73a86d5b-b97b-4402-b8c3-98404a1ded92\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thông tư này không điều chỉnh đối với thuốc cổ truyền, dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"a2ef9fb2-da93-4725-baf9-f9ce2cb56727\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 2. Giải thích từ ngữ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a2ef9fb2-da93-4725-baf9-f9ce2cb56727\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong Thông tư này, các từ ngữ dưới đây được hiểu như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"aa62a1f2-2dac-48d1-af4c-06a58f2d6268\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1.\u0026nbsp;\u003cem\u003eHồ sơ kỹ thuật chung ASEAN (ACTD)\u003c/em\u003e\u0026nbsp;là mẫu hồ sơ kỹ thuật chung về đăng ký thuốc của Hiệp hội các nước Đông Nam Á (ASEAN). \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0c683d8c-eb9f-49b1-a209-1954fa8fd2f2\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2.\u0026nbsp;\u003cem\u003eHồ sơ kỹ thuật chung ICH-CTD\u003c/em\u003e\u0026nbsp;là mẫu hồ sơ chung của Hội nghị quốc tế về hài hòa các thủ tục đăng ký dược phẩm sử dụng cho người.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"81ed269b-7567-476c-bc0a-886183db72ae\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3.\u0026nbsp;\u003cem\u003eThay đổi lớn\u003c/em\u003e\u0026nbsp;là những thay đổi có ảnh hưởng rõ rệt, trực tiếp đến chất lượng, an toàn và hiệu quả của thuốc được quy định tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"042f5ef4-c685-451e-bff1-32bd8d0b80a6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4.\u0026nbsp;\u003cem\u003eThay đổi nhỏ\u003c/em\u003e\u0026nbsp;là những thay đổi không ảnh hưởng hoặc ảnh hưởng rất ít đến hiệu quả, chất lượng và an toàn của thuốc được quy định tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"80e457cc-8d50-4144-9297-a7f60ee0b672\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5.\u0026nbsp;\u003cem\u003eCơ sở đăng ký thuốc\u003c/em\u003e là cơ sở đứng tên nộp đơn đề nghị cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"60c1ef2c-1977-4613-a880-4cd6fbc87440\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6.\u0026nbsp;\u003cem\u003eCơ sở sản xuất thuốc\u003c/em\u003e\u0026nbsp;là cơ sở thực hiện một, một số công đoạn hoặc toàn bộ quá trình sản xuất hoặc thực hiện việc xuất xưởng lô thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0f364504-9cf6-42c4-94a2-39967d460b58\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7.\u0026nbsp;\u003cem\u003eCơ sở sản xuất nguyên liệu làm thuốc\u003c/em\u003e\u0026nbsp;là cơ sở sản xuất ra nguyên liệu để sản xuất thuốc thành phẩm hoặc cơ sở thực hiện việc xuất xưởng lô nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"59a87877-203a-4e48-adb3-d2bf63bc57b1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8.\u0026nbsp;\u003cem\u003eGiấy chứng nhận sản phẩm dược phẩm\u003c/em\u003e\u0026nbsp;\u003cem\u003e(CPP)\u003c/em\u003e\u0026nbsp;là giấy chứng nhận được cấp theo Hệ thống chứng nhận chất lượng các sản phẩm dược phẩm lưu hành\u0026nbsp;trong thương mại quốc tế của Tổ chức Y tế thế giới (WHO).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a4f8a0e7-8005-47b5-bee0-a538bfd4c4cc\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e9.\u0026nbsp;\u003cem\u003eCơ quan quản lý dược phẩm Châu Âu (EMA) và Cơ quan quản lý dược chặt chẽ (SRA - Stringent Regulatory Authorities)\u003c/em\u003e\u0026nbsp;là các cơ quan bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0ef28952-79d2-4e5c-a93f-e2d9eb11a60d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Cơ quan quản lý dược phẩm Châu Âu (EMA);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"66ec8723-2aed-41f4-a5c8-c3c8809e1582\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cơ quan quản lý dược chặt chẽ (SRA - Stringent Regulatory Authorities) được Tổ chức Y tế thế giới (WHO) phân loại thuộc danh sách SRA, bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"66ec8723-2aed-41f4-a5c8-c3c8809e1582\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thành viên ICH trước ngày 23 tháng 10 năm 2015, bao gồm: Cơ quan Quản lý dược và thực phẩm Hoa Kỳ (US-FDA), Cơ quan quản lý dược của các nước thuộc Liên minh Châu\u0026nbsp;Âu (European Union), Cơ quan quản lý thuốc và các sản phẩm y tế của Vương quốc Anh (MHRA), Cơ quan quản lý dược và trang thiết bị y tế\u0026nbsp;Nhật Bản (PMDA);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"66ec8723-2aed-41f4-a5c8-c3c8809e1582\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thành viên quan sát của ICH trước ngày 23 tháng 10 năm 2015 bao gồm: Cơ quan quản lý dược thuộc Hiệp hội thương mại tự do Châu Âu (EFTA) với đại diện Cơ quan quản lý dược Thụy Sĩ (Swissmedic) và Bộ Y tế Canada (Health Canada);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"66ec8723-2aed-41f4-a5c8-c3c8809e1582\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thành viên có hiệp định liên kết, công nhận lẫn nhau với Thành viên ICH trước ngày 23 tháng 10 năm 2015 bao gồm: Úc, Iceland, Liechtenstein và Na Uy.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"89173f8c-79f7-43a4-85d0-595beac70538\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e10.\u003cem\u003e Chủ sở hữu giấy phép lưu hành thuốc (Product license holder/ Marketing authorization holder)\u003c/em\u003e\u0026nbsp;là cơ sở sở hữu giấy phép lưu hành thuốc được ghi trên Giấy chứng nhận sản phẩm dược phẩm (CPP) theo mẫu của WHO ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3713fcea-d854-4662-8869-a6d6e7f400d0\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e11. \u003cem\u003eGia công thuốc\u003c/em\u003e là hoạt động sản xuất thuốc theo hợp đồng gia công phù hợp với quy định pháp luật để cơ sở nhận gia công thực hiện một, một số hoặc toàn bộ các công đoạn trong quá trình sản xuất thuốc tại Việt Nam theo yêu cầu của cơ sở đặt gia công và nhận chi phí.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1e3a57dd-776f-4e73-972a-7afcedec2966\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e12. \u003cem\u003eChuyển giao công nghệ sản xuất thuốc\u003c/em\u003e là hoạt động chuyển nhượng quyền sở hữu công nghệ sản xuất thuốc hoặc chuyển giao quyền sử dụng công nghệ sản xuất thuốc thuộc quy định tại khoản 1 Điều 4 Luật Chuyển giao công nghệ số \u003ca href=\"/van-ban/chi-tiet/123514\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e07/2017/QH14\u003c/a\u003e được sửa đổi, bổ sung bởi Luật số 115/2025/QH15 (sau đây gọi tắt là Luật Chuyển giao công nghệ) từ cơ sở có quyền chuyển giao công nghệ sang cơ sở nhận công nghệ để thực hiện một, một số hoặc toàn bộ các công đoạn trong quá trình sản xuất thuốc tại Việt Nam theo hợp đồng giữa hai bên phù hợp với quy định pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"93d070e6-d5d9-4a9f-bc3d-394be3175d55\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e13. \u003cem\u003eCơ sở đặt gia công thuốc\u003c/em\u003e là bên cung cấp một phần hoặc toàn bộ nguyên liệu, vật liệu, quy trình sản xuất, hồ sơ kỹ thuật chứng minh thuốc bảo đảm chất lượng, an toàn, hiệu quả cho cơ sở nhận gia công thuốc để đặt gia công sản xuất thuốc theo hợp đồng gia công giữa hai bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9eca0437-5dd2-46ad-9218-a6165538abff\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e14. \u003cem\u003eCơ sở nhận gia công thuốc\u003c/em\u003e là bên sử dụng một phần hoặc toàn bộ nguyên liệu, vật liệu, quy trình sản xuất, hồ sơ kỹ thuật của cơ sở đặt gia công thuốc để thực hiện một, một số hoặc toàn bộ công đoạn sản xuất thuốc theo yêu cầu của cơ sở đặt gia công thuốc và nhận chi phí theo hợp đồng gia công giữa hai bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8467d8de-b38f-47a8-83de-918a60a26f2d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e15. \u003cem\u003eCơ sở chuyển giao công nghệ\u003c/em\u003e \u003cem\u003esản xuất thuốc\u003c/em\u003e là bên có quyền sở hữu công nghệ hoặc quyền sử dụng công nghệ sản xuất thuốc theo quy định của pháp luật thực hiện chuyển nhượng quyền sở hữu công nghệ hoặc chuyển giao quyền sử dụng công nghệ sản xuất thuốc cho cơ sở nhận chuyển giao công nghệ sản xuất thuốc để ứng dụng trong một, một số hoặc toàn bộ các công đoạn của quy trình sản xuất thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"74deb512-e8e4-44d3-8388-fed41c9c07ea\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e16. \u003cem\u003eCơ sở nhận chuyển giao công nghệ\u003c/em\u003e \u003cem\u003esản xuất thuốc\u003c/em\u003e là bên tiếp nhận quyền sở hữu công nghệ hoặc quyền sử dụng công nghệ sản xuất thuốc từ cơ sở chuyển giao công nghệ sản xuất thuốc theo hợp đồng giữa hai bên để ứng dụng trong một, một số hoặc toàn bộ các công đoạn của quy trình sản xuất thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1a1137ab-b04f-4ded-979a-1a8dd5caa64c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e17. \u003cem\u003eThuốc đặt gia công\u003c/em\u003e là thuốc đã có giấy đăng ký lưu hành tại Việt Nam hoặc đã được cấp phép lưu hành tại ít nhất một nước trên thế giới được cơ sở đặt gia công thuốc đặt sản xuất một, một số hoặc toàn bộ các công đoạn tại cơ sở nhận gia công thuốc theo hợp đồng gia công giữa hai bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4017e55c-e0f4-4868-9afa-1254c9c74288\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e18\u003cem\u003e. Thuốc gia công\u003c/em\u003e là thuốc được sản xuất một, một số hoặc toàn bộ các công đoạn bởi cơ sở nhận gia công thuốc cho cơ sở đặt gia công thuốc theo hợp đồng gia công giữa hai bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2f13ff4b-6e53-4e8d-8496-eb4ea9ae3129\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e19.\u003cem\u003e Thuốc trước chuyển giao công nghệ \u003c/em\u003elà thuốc đã có giấy đăng ký lưu hành tại Việt Nam hoặc đã được cấp phép lưu hành tại ít nhất một nước trên thế giới và được cơ sở chuyển giao công nghệ sản xuất thuốc chuyển nhượng quyền sở hữu công nghệ hoặc chuyển giao quyền sử dụng công nghệ cho cơ sở nhận chuyển giao công nghệ sản xuất thuốc để ứng dụng trong một, một số hoặc toàn bộ các công đoạn của quy trình sản xuất thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f4be209f-26cb-4a26-b49f-1860560497f5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e20. \u003cem\u003eThuốc chuyển giao công nghệ\u003c/em\u003e là thuốc được sản xuất một, một số hoặc toàn bộ các công đoạn của quy trình sản xuất sử dụng công nghệ được chuyển giao thuộc quy định tại khoản 1 Điều 4 Luật Chuyển giao công nghệ bởi cơ sở nhận chuyển giao công nghệ sản xuất thuốc từ cơ sở chuyển giao công nghệ sản xuất thuốc theo hợp đồng giữa hai bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"9c4890e6-5793-43c2-8d93-9d20037e1d71\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 3. Trách nhiệm của cơ sở đăng ký thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0ebc3c83-5e50-4c85-8a60-d77e3ce19f15\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Chịu trách nhiệm toàn diện trước pháp luật về tính chính xác, hợp pháp, trung thực của tất cả các tài liệu trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc, trừ trường hợp quy định tại khoản 1 Điều 4 Thông tư này. Phối hợp với cơ sở sản xuất, cơ quan có thẩm quyền trong nước, nước ngoài trong việc trả lời các văn bản của Cục Quản lý Dược đề nghị xác minh tính xác thực của các giấy tờ pháp lý trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ff505b83-d285-4d3a-b17a-e5216585f86d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Bảo đảm chất lượng, an toàn, hiệu quả của thuốc, nguyên liệu làm thuốc đúng với hồ sơ đăng ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"866a6bc8-246b-4f01-b16c-f8c876ad37f3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 15 ngày kể từ ngày có quyết định thu hồi giấy đăng ký lưu hành hoặc có quyết định thu hồi thuốc, nguyên liệu làm thuốc tại bất kỳ nước nào trên thế giới đối với thuốc, nguyên liệu làm thuốc đã được cấp giấy đăng ký lưu hành tại Việt Nam còn hiệu lực và nêu rõ lý do bị thu hồi, trừ trường hợp tự nguyện thu hồi giấy đăng ký lưu hành không liên quan đến chất lượng, an toàn, hiệu quả của thuốc tại các nước không phải nước cấp CPP nộp trong hồ sơ đăng ký lưu hành tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6c79f2df-13db-4a64-9bc7-4b970834f20c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Phối hợp chặt chẽ với cơ sở sản xuất thuốc thực hiện nghiên cứu hoặc cung cấp thêm thông tin liên quan đến thuốc đăng ký khi có thông tin hoặc bằng chứng liên quan đến an toàn và hiệu quả của thuốc trong quá trình lưu hành theo yêu cầu của cơ quan quản lý có thẩm quyền. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6ac9f78e-0bd0-4f37-8b3c-a1f879ce5e79\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Phối hợp với cơ sở sản xuất, nhập khẩu, phân phối thuốc thực hiện việc theo dõi, giám sát, thu thập, tổng hợp, đánh giá và gửi báo cáo đến Trung tâm Quốc gia về Thông tin thuốc và Theo dõi phản ứng có hại của thuốc (Trung tâm DI \u0026amp; ADR Quốc gia) thông tin các trường hợp phản ứng sau tiêm chủng, phản ứng có hại của thuốc theo quy định tại khoản 5 Điều 77 Luật Dược, các Hướng dẫn Quốc gia về cảnh giác dược do Bộ Y tế ban hành và các quy định có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"fa64a9ba-6ac4-49af-a7ba-5274e0a8279d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Chịu trách nhiệm về các vấn đề liên quan đến quyền sở hữu trí tuệ đối với thuốc, nguyên liệu làm thuốc do cơ sở đăng ký lưu hành tại Việt Nam theo quy định của pháp luật về sở hữu trí tuệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d6ec3226-ce6b-4f42-aa86-e861cdaf599d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Thực hiện kế hoạch quản lý nguy cơ đã được phê duyệt trong hồ sơ đăng ký đối với thuốc hóa dược mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9942ebc3-6bd5-494b-8309-282bb4b82082\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8. Cơ sở đăng ký thuốc gia công thực hiện các trách nhiệm theo quy định tại khoản 1, 2, 3, 4, 5, 6, 7 và 10 Điều này và các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"cd5f7cf3-a335-4e11-a770-a885014c09cf\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 30 ngày kể từ ngày cơ quan có thẩm quyền phê duyệt các thay đổi, bổ sung về công thức bào chế, quy trình sản xuất, tiêu chuẩn chất lượng nguyên liệu, tiêu chuẩn chất lượng thuốc thành phẩm của thuốc đặt gia công trong quá trình lưu hành đối với trường hợp thuốc gia công đáp ứng quy định tại khoản 1 Điều 9 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d38568ec-a4af-4395-ac5b-4c3f09a33565\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 15 ngày kể từ ngày có quyết định thu hồi giấy đăng ký lưu hành thuốc đặt gia công tại bất kỳ nước nào trên thế giới (trong thời hạn giấy đăng ký lưu hành của thuốc gia công còn hiệu lực), trừ trường hợp tự nguyện thu hồi giấy đăng ký lưu hành không liên quan đến chất lượng, an toàn, hiệu quả của thuốc tại các nước không phải nước cấp CPP đã nộp cho thuốc đặt gia công;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0abeafee-c6df-46e6-b04a-37ec8f24025c\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 30 ngày kể từ ngày thuốc đặt gia công ngừng sản xuất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"fd66d222-5baf-4c7f-b7e5-e45d5f970d02\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Đối với thuốc gia công đáp ứng quy định tại khoản 1 Điều 9 Thông tư này, khi thuốc đặt gia công đang được sản xuất, lưu hành tại Việt Nam hoặc ở nước sở tại có các thay đổi, bổ sung liên quan đến công thức bào chế thuốc; quy trình sản xuất; tiêu chuẩn chất lượng nguyên liệu; tiêu chuẩn chất lượng thuốc thành phẩm; tên thương mại, trong thời hạn 03 tháng kể từ ngày các nội dung trên được Cục Quản lý Dược hoặc cơ quan quản lý có thẩm quyền nước sở tại phê duyệt, cơ sở đăng ký phải nộp hồ sơ đề nghị thay đổi, bổ sung nội dung tương ứng với thay đổi, bổ sung của thuốc đặt gia công.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b284f5b0-237f-49cb-82b8-3a21cb2f29f0\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e9. Cơ sở đăng ký thuốc chuyển giao công nghệ thực hiện các trách nhiệm theo quy định tại khoản 1, 2, 3, 4, 5, 6, 7 và 10 Điều này và các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"96f344a4-567b-483d-b35c-ad298ae0196b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 30 ngày kể từ ngày cơ quan có thẩm quyền phê duyệt các thay đổi, bổ sung về công thức bào chế, quy trình sản xuất, tiêu chuẩn chất lượng nguyên liệu, tiêu chuẩn chất lượng thuốc thành phẩm của thuốc trước chuyển giao công nghệ trong quá trình lưu hành đối với trường hợp thuốc chuyển giao công nghệ đáp ứng quy định tại khoản 1 Điều 9 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"105a3417-6869-443f-96f4-f93ce2cb9fff\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 15 ngày kể từ ngày có quyết định thu hồi giấy đăng ký lưu hành thuốc trước chuyển giao công nghệ tại bất kỳ nước nào trên thế giới (trong thời hạn giấy đăng ký lưu hành của thuốc chuyển giao công nghệ còn hiệu lực), trừ trường hợp tự nguyện thu hồi giấy đăng ký lưu hành không liên quan đến chất lượng, an toàn, hiệu quả của thuốc tại các nước không phải nước cấp CPP đã nộp cho thuốc trước chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6e3a719d-2bd8-4c30-aa03-66fd340f8394\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 30 ngày kể từ ngày thuốc trước chuyển giao công nghệ ngừng sản xuất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0e74c434-4fb9-4050-bb5e-be01d57c70fc\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Đối với thuốc chuyển giao công nghệ đáp ứng quy định tại khoản 1 Điều 9 Thông tư này, khi thuốc trước chuyển giao công nghệ đang được sản xuất, lưu hành tại Việt Nam hoặc ở nước sở tại có các thay đổi, bổ sung liên quan đến công thức bào chế thuốc; quy trình sản xuất; tiêu chuẩn chất lượng nguyên liệu; tiêu chuẩn chất lượng thuốc thành phẩm; tên thương mại, trong thời hạn 03 tháng kể từ ngày các nội dung trên được Cục Quản lý Dược hoặc cơ quan quản lý có thẩm quyền nước sở tại phê duyệt, cơ sở đăng ký phải nộp hồ sơ đề nghị thay đổi, bổ sung nội dung tương ứng với thay đổi, bổ sung của thuốc trước chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"685550e4-ae88-4f36-a2e7-ffd957589553\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e10. Thực hiện các trách nhiệm khác theo quy định của pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f7bb716e-2315-4323-81bd-2fc15bd46a57\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 4. Trách nhiệm của cơ sở sản xuất thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"57395c42-6c35-4cea-8da7-476fc1a7767f\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Chịu trách nhiệm toàn diện trước pháp luật về tính chính xác, hợp pháp, trung thực của tất cả các tài liệu liên quan đến thuốc, nguyên liệu làm thuốc do cơ sở sản xuất thuốc, nguyên liệu làm thuốc cung cấp cho cơ sở đăng ký thuốc để đăng ký lưu hành tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"5d0840ea-8d1a-477d-8fe5-7d37035d45a6\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Phối hợp chặt chẽ với cơ sở đăng ký thuốc thực hiện quy định tại khoản 3 Điều 3 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b35e168e-2c9f-48f3-8f63-1443378c43c6\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Phối hợp với cơ sở đăng ký thuốc thực hiện các yêu cầu về kiểm tra, đánh giá cơ sở sản xuất khi có yêu cầu của cơ quan quản lý có thẩm quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f61088dd-9875-45e8-b112-3920d45ddc50\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Trường hợp cơ sở sản xuất bị thu hồi giấy phép sản xuất hoặc không đáp ứng thực hành tốt sản xuất thuốc, nguyên liệu làm thuốc theo thông báo của cơ quan quản lý có thẩm quyền nước sở tại, cơ sở phải thông báo bằng văn bản cho Cục Quản lý Dược trong thời hạn 15 ngày kể từ ngày có thông báo. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b50bf2f4-ecc1-40a0-a7fd-8a12f0e09aeb\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Lưu trữ đủ hồ sơ đăng ký thuốc, nguyên liệu làm thuốc và cung cấp hồ sơ cho cơ quan quản lý có thẩm quyền khi có yêu cầu bao gồm cả các tài liệu quy định tại điểm đ khoản 7 Điều 22 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a87112de-42ea-45d9-9825-60b3758f4557\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Thực hiện kế hoạch quản lý nguy cơ đã được phê duyệt trong hồ sơ đăng ký đối với thuốc hóa dược mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7157d709-f4ff-4b9b-a2d4-875f5148e1ab\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Cơ sở sản xuất là cơ sở nhận gia công thuốc thực hiện các trách nhiệm theo quy định tại khoản 1, 2, 3, 4, 5, 6 và 9 Điều này và các quy định sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d73674ec-db4c-4c71-a8d1-845efafa0338\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thực hiện các nghĩa vụ theo quy định tại\u0026nbsp;Điều 182 Luật Thương mại\u0026nbsp;số \u003ca href=\"/van-ban/chi-tiet/26117\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e36/2005/QH11\u003c/a\u003e và\u003c/span\u003e\u003cspan style=\"color: #000000; font-size: 13.0pt\"\u003e \u003c/span\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐiều 35 Nghị định số \u003ca href=\"/van-ban/chi-tiet/f6238f90-8674-11f1-9748-252a075b5c19\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003c/a\u003e\u003ca href=\"/van-ban/chi-tiet/6a55adf0-867d-11f1-b30e-ab09edcee484\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e292/2026/NĐ-CP\u003c/a\u003e của Chính phủ quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Quản lý ngoại thương;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7eaf69eb-60e1-4357-8108-427d6b68420f\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với thuốc gia công đáp ứng quy định tại khoản 1 Điều 9 Thông tư này, khi thuốc đặt gia công đang được sản xuất, lưu hành tại Việt Nam hoặc ở nước sở tại có các thay đổi, bổ sung liên quan đến công thức bào chế thuốc; quy trình sản xuất; tiêu chuẩn chất lượng nguyên liệu; tiêu chuẩn chất lượng thuốc thành phẩm; tên thương mại, trong thời hạn 03 tháng kể từ ngày các nội dung trên được Cục Quản lý Dược hoặc cơ quan quản lý có thẩm quyền nước sở tại phê duyệt, cơ sở sản xuất phải phối hợp với cơ sở đăng ký thuốc gia công nộp hồ sơ đề nghị thay đổi, bổ sung nội dung tương ứng với thay đổi, bổ sung của thuốc đặt gia công.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"76aeeaf3-032d-4a65-a96d-af24b6850b7b\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8. Cơ sở sản xuất là cơ sở nhận chuyển giao công nghệ sản xuất thuốc thực hiện các trách nhiệm theo quy định tại khoản 1, 2, 3, 4, 5, 6 và 9 Điều này và các quy định sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"12a16556-3ae1-4b70-aa07-8b34a2bd7802\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thực hiện các nghĩa vụ theo quy định tại Điều 26 Luật Chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2cdf23c5-e748-48c8-bac8-26fe2fc05e95\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với thuốc chuyển giao công nghệ đáp ứng quy định tại khoản 1 Điều 9 Thông tư này, khi thuốc trước chuyển giao công nghệ đang được sản xuất, lưu hành tại Việt Nam hoặc ở nước sở tại có các thay đổi, bổ sung liên quan đến công thức bào chế thuốc; quy trình sản xuất; tiêu chuẩn chất lượng nguyên liệu; tiêu chuẩn chất lượng thuốc thành phẩm; tên thương mại, trong thời hạn 03 tháng kể từ ngày các nội dung trên được Cục Quản lý Dược hoặc cơ quan quản lý có thẩm quyền nước sở tại phê duyệt, cơ sở sản xuất phải phối hợp với cơ sở đăng ký nộp hồ sơ đề nghị thay đổi, bổ sung nội dung tương ứng với thay đổi, bổ sung của thuốc trước chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1956797c-efdb-473c-a975-90c36b0f1ec2\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thực hiện thủ tục đăng ký chuyển giao công nghệ theo quy định tại Điều 31 Luật Chuyển giao công nghệ, Điều 20 Nghị định số 101/2026/NĐ-CP của Chính phủ quy định chi tiết một số điều và biện pháp để hướng dẫn thi hành Luật Chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"cbddfaf4-8b31-44f6-8b3f-04581d3c2365\" style=\"text-align: justify; margin: 1.0pt 0 1.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e9. Thực hiện các trách nhiệm khác theo quy định của pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"c608d298-f679-4303-99e8-149d3616f025\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 5. Trách nhiệm của cơ sở đặt gia công thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0c00342f-82a4-42a6-ad51-809111b55eb1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thực hiện đúng các nghĩa vụ của bên đặt gia công theo quy định tại Điều 181 Luật Thương mại số \u003ca href=\"/van-ban/chi-tiet/26117\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e36/2005/QH11\u003c/a\u003e và Điều 34 Nghị định số \u003ca href=\"/van-ban/chi-tiet/f6238f90-8674-11f1-9748-252a075b5c19\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003c/a\u003e\u003ca href=\"/van-ban/chi-tiet/6a55adf0-867d-11f1-b30e-ab09edcee484\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e292/2026/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d9723615-3289-442f-b94f-ac314fda27c6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cung cấp cho cơ sở nhận gia công thuốc: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9d38f92d-1ce6-4aa4-9a89-4fb5c43bda26\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Một phần hoặc toàn bộ nguyên liệu, vật liệu, hồ sơ kỹ thuật bao gồm quy trình sản xuất, tiêu chuẩn chất lượng và phương pháp kiểm nghiệm của nguyên liệu ban đầu, bán thành phẩm, thành phẩm, phụ liệu của công đoạn đặt gia công; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c44a8cdb-880b-4624-a5e3-8f5907001f7e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các hồ sơ, tài liệu khác liên quan đến việc đăng ký lưu hành thuốc gia công và gia công thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"540d83f6-9b92-4cec-8b46-8f1a7a6566ce\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Chịu trách nhiệm về tính chính xác, hợp pháp, trung thực đối với các hồ sơ kỹ thuật cung cấp cho cơ sở nhận gia công theo đúng hồ sơ của thuốc đặt gia công đã được cơ quan có thẩm quyền phê duyệt. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"43850aca-40da-420a-873f-69d0d57ef5cd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Phối hợp với cơ sở đăng ký thuốc gia công thực hiện các trách nhiệm quy định tại khoản 8 Điều 3 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"267545d9-2cea-49b7-a9d0-00305c0780c6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Thực hiện các trách nhiệm khác theo quy định của pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"7bd9c7e2-ccdc-4fcf-b980-821a5f0b69c1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 6. Trách nhiệm của cơ sở chuyển giao công nghệ sản xuất thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"57c6cab0-0bae-49de-a4d2-066b26eee081\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thực hiện đúng các nghĩa vụ của cơ sở chuyển giao công nghệ theo quy định tại khoản 2 Điều 25 Luật Chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2bbb3db9-0a0f-44fb-80d8-7f8ca465b07a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cung cấp cho cơ sở nhận chuyển giao công nghệ sản xuất thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"38f8f40f-0b4f-4e12-a4f5-95c075c8a9ea\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Hồ sơ kỹ thuật bao gồm quy trình sản xuất, tiêu chuẩn chất lượng và phương pháp kiểm nghiệm của nguyên liệu ban đầu, bán thành phẩm, thành phẩm, phụ liệu của công đoạn chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"32b32dc5-5983-4f01-880f-02651170d0c9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các hồ sơ, tài liệu khác liên quan đến việc đăng ký lưu hành thuốc chuyển giao công nghệ và chuyển giao công nghệ sản xuất thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8b687279-28e7-4314-b360-21c79cd7b2f9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Chịu trách nhiệm về tính chính xác, hợp pháp, trung thực đối với các hồ sơ kỹ thuật cung cấp cho cơ sở nhận chuyển giao công nghệ theo đúng hồ sơ của thuốc trước chuyển giao công nghệ đã được cơ quan có thẩm quyền phê duyệt. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0a9328a4-dfe5-4c50-b42c-146a6d3f0daf\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Phối hợp với cơ sở đăng ký thuốc chuyển giao công nghệ thực hiện các trách nhiệm quy định tại khoản 9 Điều 3 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"aff41dfc-8bf9-445f-be6f-c6d2770e12e8\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Thực hiện các trách nhiệm khác theo quy định của pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"e31078dd-4378-4bd7-80c2-44f40881d868\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 7. Hợp đồng gia công\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"e31078dd-4378-4bd7-80c2-44f40881d868\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eNgoài việc đáp ứng các nội dung quy định tại Điều 31 Nghị định số \u003ca href=\"/van-ban/chi-tiet/f6238f90-8674-11f1-9748-252a075b5c19\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003c/a\u003e\u003ca href=\"/van-ban/chi-tiet/6a55adf0-867d-11f1-b30e-ab09edcee484\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e292/2026/NĐ-CP\u003c/a\u003e, hợp đồng gia công thuốc phải có các nội dung sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"cdcbdcb7-8592-4411-b2a8-51ad70ec4869\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thỏa thuận việc cung ứng nguyên liệu, vật liệu. Việc cung cấp hồ sơ kỹ thuật của cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc bao gồm: quy trình sản xuất, tiêu chuẩn chất lượng, phương pháp kiểm nghiệm nguyên liệu ban đầu, bán thành phẩm, thành phẩm, phụ liệu và các tài liệu khác liên quan đến việc sản xuất gia công thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8b024d07-6076-4c9c-8c38-51ae3fbea5de\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Quyền và trách nhiệm của cơ sở đặt gia công thuốc, cơ sở nhận gia công thuốc và cơ sở đăng ký thuốc (nếu có):\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2b0f9e13-ba04-4764-8b09-bfdace9aabc3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Trong từng công đoạn của quá trình sản xuất thuốc gia công về quy trình sản xuất, kiểm tra chất lượng, bảo quản, vận chuyển nguyên liệu ban đầu, bán thành phẩm, thành phẩm, phụ liệu, quy trình đóng gói, in hoặc dán nhãn của thuốc gia công và quy định trách nhiệm của cơ sở ký phiếu kiểm nghiệm từng lô thành phẩm và phiếu xuất xưởng thuốc gia công;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f8aedfba-d67b-4cde-81f8-100e68cbf76e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Về việc lưu giữ các hồ sơ ghi chép về sản xuất, kiểm tra chất lượng, phân phối, lưu hành thuốc, việc lưu mẫu thuốc, giải quyết các vấn đề liên quan đến chất lượng, khiếu nại, thu hồi sản phẩm trên thị trường.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"92598311-09a4-4774-a8a2-079a0a74db5f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Trách nhiệm của cơ sở đặt gia công, cơ sở nhận gia công và cơ sở đăng ký thuốc (nếu có) đối với các vấn đề về sở hữu trí tuệ liên quan đến thuốc gia công.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a14f80b5-ca4b-49db-8473-6c278304587e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Quy trình, thủ tục kiểm tra, giám sát cơ sở sản xuất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3c08658b-f21a-417d-8dd6-0cccb9b72e4f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Các trường hợp hủy bỏ thỏa thuận và trách nhiệm do vi phạm thỏa thuận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"77cf6b26-f8c8-4e22-b75c-3bde861be0ee\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 8. Hợp đồng chuyển giao công nghệ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"77cf6b26-f8c8-4e22-b75c-3bde861be0ee\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eNgoài việc đáp ứng các nội dung quy định tại Điều 23 Luật Chuyển giao công nghệ, hợp đồng chuyển giao công nghệ sản xuất thuốc phải có các nội dung sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8417ba44-ff9c-485d-be2d-34fbf31ed976\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thỏa thuận về việc cung cấp hồ sơ kỹ thuật của cơ sở chuyển giao công nghệ sản xuất thuốc cho cơ sở nhận chuyển giao công nghệ sản xuất thuốc bao gồm: quy trình sản xuất, tiêu chuẩn chất lượng, phương pháp kiểm nghiệm nguyên liệu ban đầu, bán thành phẩm, thành phẩm, phụ liệu và các giấy tờ khác liên quan đến việc chuyển giao công nghệ sản xuất thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d37634d1-871f-4fc0-bb5c-9bd26b183954\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Trách nhiệm của cơ sở chuyển giao công nghệ sản xuất thuốc, cơ sở nhận chuyển giao công nghệ sản xuất thuốc và cơ sở đăng ký thuốc đối với các vấn đề về sở hữu trí tuệ liên quan đến thuốc chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"bc5c856e-71af-48a6-a766-62e0f2eef9bc\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Các trường hợp hủy bỏ thỏa thuận và trách nhiệm do vi phạm thỏa thuận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"386b1325-1dd8-4315-b2a2-d6f8be9391d2\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 9. Phân loại thuốc gia công, thuốc chuyển giao công nghệ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"386b1325-1dd8-4315-b2a2-d6f8be9391d2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThuốc gia công, thuốc chuyển giao công nghệ được phân loại như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4e00cac9-48ca-4b04-8a10-e6229f050c88\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thuốc gia công, thuốc chuyển giao công nghệ có cùng tên thương mại, cùng công thức bào chế, cùng tiêu chuẩn chất lượng nguyên liệu, cùng tiêu chuẩn chất lượng thuốc thành phẩm và tương tự về quy trình sản xuất so với thuốc đặt gia công, thuốc trước chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"4e00cac9-48ca-4b04-8a10-e6229f050c88\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp thuốc gia công, thuốc chuyển giao công nghệ có thay đổi một trong các tiêu chí nêu trên (trừ thay đổi tên thương mại) hoặc các thay đổi khác liên quan đến chất lượng của thuốc, cơ sở đăng ký phải cung cấp bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này và các tài liệu kỹ thuật tương ứng với từng nội dung thay đổi theo hướng dẫn tại Phụ lục II ban hành kèm theo Thông tư này để chứng minh tương đương về chất lượng so với thuốc đặt gia công, thuốc trước chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a6a092a5-0dbf-4f94-8c4d-d71d2af8188b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thuốc gia công, thuốc chuyển giao công nghệ khác không thuộc trường hợp quy định tại khoản 1 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"cfa1a6ce-7245-4a6c-80dd-4211cad9e43c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 10. Quy định về báo cáo theo dõi, đánh giá an toàn, hiệu quả\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"85afe312-e72c-4e4e-bcfe-108fe13c69aa\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Cơ sở đăng ký thuốc có trách nhiệm thực hiện báo cáo theo dõi an toàn, hiệu quả của thuốc trong quá trình lưu hành theo các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6d008193-aede-4a02-a217-8affb83d6da9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Báo cáo định kỳ đối với thuốc mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics) theo Mẫu 2A/TT tại Phụ lục IX ban hành kèm theo Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"050276a3-7c6b-4387-8190-22337b44849b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Báo cáo đơn lẻ tất cả các biến cố bất lợi (bao gồm phản ứng có hại của thuốc, sai sót liên quan đến thuốc, nghi ngờ thuốc giả hoặc thuốc không đạt tiêu chuẩn chất lượng và thuốc không có hoặc không đạt hiệu quả điều trị) xảy ra tại Việt Nam liên quan đến thuốc theo Mẫu 2B/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2a534e1a-4b07-4444-9193-c20071c6f4bf\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thời hạn thực hiện báo cáo: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"e00e5f4e-e3ff-4925-9307-2487cad6747b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với báo cáo định kỳ theo quy định tại điểm a khoản 1 Điều này: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"e00e5f4e-e3ff-4925-9307-2487cad6747b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKể từ ngày được cấp giấy đăng ký lưu hành, cơ sở đăng ký thực hiện báo cáo định kỳ 06 tháng một lần trong 02 năm đầu; từ năm thứ 03 đến năm thứ 05, cơ sở đăng ký thực hiện báo cáo định kỳ hàng năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"24757daa-e8eb-4907-931c-db32ed142583\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với báo cáo đơn lẻ thực hiện theo quy định tại điểm b khoản 1 Điều này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"24757daa-e8eb-4907-931c-db32ed142583\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký thực hiện báo cáo theo thời hạn quy định tại Hướng dẫn Quốc gia về cảnh giác dược và các quy định khác liên quan do Bộ Y tế ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a4f79d77-6ce4-46a4-b820-a0ead233e89b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Hình thức gửi báo cáo, nơi nhận báo cáo:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a4f79d77-6ce4-46a4-b820-a0ead233e89b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký thực hiện theo quy định tại Hướng dẫn Quốc gia về cảnh giác dược và các quy định khác liên quan do Bộ Y tế ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d55bda8c-c40a-4352-9a38-1d6989e7dcbc\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Việc xử lý, đánh giá báo cáo và cung cấp thông tin cho cơ quan quản lý nhà nước và các Hội đồng chuyên môn của Bộ Y tế phục vụ công tác quản lý về đăng ký lưu hành thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"d55bda8c-c40a-4352-9a38-1d6989e7dcbc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThực hiện theo quy định tại Hướng dẫn Quốc gia về cảnh giác dược và các quy định khác liên quan do Bộ Y tế ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"7e20fe7b-db4e-4080-a955-7e8aab54a42d\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 11. Ngôn ngữ, hình thức trình bày trong hồ sơ, số lượng và hình thức nộp hồ sơ, các trường hợp được nộp chung trong một hồ sơ đăng ký thuốc, nguyên liệu làm thuốc, hình thức thẩm định hồ sơ \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a566ad80-560e-4cc8-88be-95eeed54ad47\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Ngôn ngữ sử dụng trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a566ad80-560e-4cc8-88be-95eeed54ad47\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eHồ sơ đăng ký thuốc, nguyên liệu làm thuốc phải được viết bằng tiếng Việt hoặc tiếng Anh. Riêng tờ hướng dẫn sử dụng thuốc dự kiến lưu hành tại Việt Nam phải được viết bằng tiếng Việt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"750d2d56-61ca-455c-a89f-abe23605c2e8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hình thức trình bày:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"750d2d56-61ca-455c-a89f-abe23605c2e8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eHồ sơ đăng ký thuốc, nguyên liệu làm thuốc phải được chuẩn bị theo hướng dẫn ACTD hoặc ICH-CTD và các quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4fa3171a-d796-4547-bf2b-16698395f9e2\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Số lượng và hình thức nộp hồ sơ đăng ký thuốc, nguyên liệu làm thuốc: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"01fd28f1-2b38-43c3-8171-909c8ede4a29\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Số lượng hồ sơ đối với mỗi thủ tục hành chính quy định tại Thông tư này là 01 (một)\u0026nbsp;bộ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b57a7ed1-1a99-4d06-9294-06e62051f480\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trường hợp nộp hồ sơ trực tiếp hoặc thông qua dịch vụ bưu chính công ích, cơ sở đăng ký thuốc thực hiện nộp 01 bộ hồ sơ đầy đủ đến Cục Quản lý Dược theo quy định tại Điều 15 Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e của Chính phủ quy định về thực hiện thủ tục hành chính theo cơ chế một cửa, một cửa liên thông tại Bộ phận Một cửa và Cổng Dịch vụ công quốc gia được sửa đổi, bổ sung bởi Nghị định số \u003ca href=\"/van-ban/chi-tiet/187112\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e367/2025/NĐ-CP\u003c/a\u003e;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4f891dd2-5326-49ca-9182-e28372d2b1a3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Trường hợp nộp hồ sơ trên Cổng dịch vụ công trực tuyến của Bộ Y tế, cơ sở đăng ký thuốc thực hiện nộp 01 bộ hồ sơ đầy đủ theo quy định của Nghị định số \u003ca href=\"/van-ban/chi-tiet/141950\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e45/2020/NĐ-CP\u003c/a\u003e của Chính phủ về thực hiện thủ tục hành chính trên môi trường điện tử được sửa đổi, bổ sung bởi Nghị định số \u003ca href=\"/van-ban/chi-tiet/168208\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2024/NĐ-CP\u003c/a\u003e, Nghị định số \u003ca href=\"/van-ban/chi-tiet/168331\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e69/2024/NĐ-CP\u003c/a\u003e, Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"67d1058b-4efa-454d-ada9-3e15f9aa191c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Các trường hợp được nộp chung trong một hồ sơ đăng ký thuốc khi đáp ứng đồng thời các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a2abb35e-80ff-4c19-8517-b83a6efc8e2e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Cùng tên thuốc; dược chất, dược liệu; dạng bào chế;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a9afcfb4-8aa2-4657-9dfa-89f9a423e67e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cùng cơ sở sản xuất hoặc cùng cơ sở sản xuất nhưng khác cơ sở đóng gói, cơ sở xuất xưởng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ec2f9088-5f7a-44c3-ac93-35e2495fd369\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Cùng hàm lượng, nồng độ, khối lượng dược chất hoặc dược liệu trong một đơn vị liều.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1842a5a6-5297-4f6f-83e5-ca3ed1b41446\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Hình thức thẩm định hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d1a848d8-54e5-4370-8b99-171842b56545\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Hồ sơ đăng ký thuốc, nguyên liệu làm thuốc được xem xét theo các tiểu ban pháp chế, tiêu chuẩn chất lượng, bào chế, dược lý, lâm sàng, tương đương sinh học căn cứ theo các phần hồ sơ đã nộp đối với các hình thức đăng ký cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b1e3ef60-529e-40f5-baed-b48755bfce33\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các nội dung thẩm định về pháp chế, tiêu chuẩn chất lượng, bào chế, dược lý, lâm sàng, tương đương sinh học phải bảo đảm đầy đủ các nội dung theo hướng dẫn ACTD hoặc ICH-CTD và các quy định tại Thông tư này, bao gồm tên tài liệu cần thẩm định và yêu cầu phải đáp ứng tương ứng đối với từng nội dung thẩm định theo quy định tại Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"dac0cfc3-23e7-4f57-a5d3-ed404cbbad79\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Việc thẩm định hồ sơ đối với trường hợp quy định tại khoản 10 Điều 26 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"dac0cfc3-23e7-4f57-a5d3-ed404cbbad79\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thẩm định xác minh sự thống nhất của phần tài liệu kỹ thuật trong hồ sơ đăng ký thuốc nộp tại Việt Nam với tài liệu kỹ thuật của thuốc được cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này cấp phép lưu hành căn cứ tài liệu quy định tại khoản 10 Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"dac0cfc3-23e7-4f57-a5d3-ed404cbbad79\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thẩm định độc lập phần hồ sơ hành chính, các phần tài liệu kỹ thuật có báo cáo là khác nhau giữa hồ sơ đăng ký thuốc nộp tại Việt Nam so với tài liệu kỹ thuật của thuốc đã được cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này phê duyệt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4b2916e9-645c-4d06-bc59-d154e2b863b5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Khi xem xét cấp giấy đăng ký lưu hành thuốc mới có chỉ định sử dụng phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh, thuốc đăng ký không phải thẩm định hồ sơ kỹ thuật và không phải đánh giá việc đáp ứng thực hành tốt sản xuất trên cơ sở thừa nhận kết quả cấp phép bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"e44af330-fa12-48d0-b79d-dda790a01190\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 12. Hiệu lực, ký hiệu của giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, thời hạn nộp hồ sơ đăng ký\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9d4a5f54-452a-4725-9d96-1d4e3655dab5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hiệu lực của giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc là 05 năm kể từ ngày cấp hoặc gia hạn, trừ trường hợp quy định tại khoản 2 và khoản 3 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"eae85156-2139-4db0-96e9-9a0f0e06387d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hiệu lực của giấy đăng ký lưu hành thuốc là 03 năm kể\u0026nbsp;từ ngày cấp hoặc gia hạn đối với các thuốc có yêu cầu tiếp tục theo dõi an toàn, hiệu quả, bao gồm các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c3aecdd0-09b3-4d4b-96a1-6de42065d394\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics) lần đầu được cấp giấy đăng ký lưu hành tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5fd363d8-cbfe-4081-8c06-6f2aa837e4be\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc cùng dược chất, nồng độ, hàm lượng, dạng bào chế với thuốc mới mà thuốc mới đó chưa được cấp giấy đăng ký lưu hành với thời hạn 05 năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"195b4ee4-0d79-455d-bcd6-0165c8faeb69\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thuốc thuộc trường hợp quy định tại điểm a, b Khoản này nhưng thực tế không lưu hành trên thị trường trong thời hạn hiệu lực của giấy đăng ký lưu hành; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bf640561-e9a5-4449-a391-7f9a57e03d20\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Thuốc không thuộc trường hợp quy định tại điểm a, b và c Khoản này nhưng có yêu cầu của Hội đồng cần tiếp tục theo dõi an toàn, hiệu quả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8c407a34-f47f-4e5d-b0d5-c8396387b5d5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc khi hết thời hạn hiệu lực mà Cục Quản lý Dược đã tiếp nhận hồ sơ đề nghị gia hạn giấy đăng ký lưu hành theo quy định thì được tiếp tục sử dụng cho đến khi được gia hạn hoặc khi Cục Quản lý Dược có văn bản thông báo không gia hạn hoặc thông báo tạm dừng sử dụng giấy đăng ký lưu hành do phát hiện thuốc, nguyên liệu làm thuốc có nguy cơ không an toàn cho người sử dụng hoặc nghi ngờ giả mạo tài liệu pháp lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a7132b1e-0e1a-4f4e-a9e2-1829ec184425\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Mỗi hồ sơ đăng ký thuốc, nguyên liệu làm thuốc được cấp một giấy đăng ký lưu hành với một số đăng ký theo cấu trúc quy định tại\u0026nbsp;Phụ lục V\u0026nbsp;ban hành kèm theo Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a7132b1e-0e1a-4f4e-a9e2-1829ec184425\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eSố đăng ký nhằm mục đích tra cứu, tổng hợp và thống kê dữ liệu về thuốc, nguyên liệu làm thuốc đã được cấp giấy đăng ký lưu hành tại Việt Nam và được công bố công khai trên Cổng thông tin điện tử của Bộ Y tế và Trang thông tin điện tử của Cục Quản lý Dược. Việc phân loại và quản lý đối với các thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt thực hiện theo các văn bản quy phạm pháp luật liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"387d4f84-8060-4b92-89fb-321c223963f6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Hồ sơ đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc phải được nộp trước ngày giấy đăng ký lưu hành hết hiệu lực. Sau thời hạn giấy đăng ký lưu hành hết hiệu lực, Cục Quản lý Dược không tiếp nhận hồ sơ gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, cơ sở nộp hồ sơ theo hình thức đề nghị cấp giấy đăng ký lưu hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b30e2425-8f75-4878-bb26-e28435caa599\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Hồ sơ đăng ký thuốc thẩm định theo hình thức tham chiếu kết quả thẩm định phải được nộp tại Cục Quản lý Dược trong thời hạn không quá 05 năm kể từ ngày thuốc lần đầu được cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này phê duyệt tại báo cáo thẩm định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f6fd3d00-0605-4051-8646-3246ee500f37\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 13. Tiêu chí phân loại biệt dược gốc, sinh phẩm tham chiếu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"dd532a84-9b14-412f-ac61-fd79b801aacc\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Tiêu chí phân loại biệt dược gốc, sinh phẩm tham chiếu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c4f09f70-caae-46e6-805d-d5486ffeaa02\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc được cấp giấy đăng ký lưu hành đủ điều kiện được phân loại là biệt dược gốc khi đáp ứng đồng thời các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"c4f09f70-caae-46e6-805d-d5486ffeaa02\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc đầu tiên được cấp phép lưu hành trên cơ sở có đầy đủ dữ liệu về chất lượng, an toàn, hiệu quả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"c4f09f70-caae-46e6-805d-d5486ffeaa02\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Dữ liệu lâm sàng đáp ứng quy định tại Điều 18 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a19e6e41-3306-4594-916d-bbd496b2d333\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc được cấp giấy đăng ký lưu hành đủ điều kiện được phân loại là sinh phẩm tham chiếu khi đáp ứng đồng thời các tiêu chí sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"a19e6e41-3306-4594-916d-bbd496b2d333\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc được cấp phép lưu hành tại Việt Nam trên cơ sở có đầy đủ dữ liệu về chất lượng, an toàn, hiệu quả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"a19e6e41-3306-4594-916d-bbd496b2d333\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Dữ liệu lâm sàng đáp ứng quy định tại Điều 18 Thông tư này theo hướng phát triển một sản phẩm sinh học từ đầu, không phải phát triển theo hướng tương tự sinh học.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"37897a25-d501-49f7-af2d-1042a41380f8\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thuốc đã được phân loại biệt dược gốc, sinh phẩm tham chiếu khi thay đổi cơ sở sản xuất hoặc thay đổi địa điểm sản xuất và được cấp giấy đăng ký lưu hành mới tiếp tục được phân loại là biệt dược gốc, sinh phẩm tham chiếu nếu có cùng tên thương mại, cùng công thức bào chế, cùng tiêu chuẩn chất lượng nguyên liệu, cùng tiêu chuẩn chất lượng thuốc thành phẩm và tương tự về quy trình sản xuất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"37897a25-d501-49f7-af2d-1042a41380f8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp thuốc sản xuất tại cơ sở sản xuất mới hoặc địa điểm sản xuất mới có thay đổi một trong các tiêu chí tại Khoản này (trừ thay đổi tên thương mại) hoặc các thay đổi khác liên quan đến chất lượng của thuốc, các thay đổi này phải được phê duyệt bởi cơ quan quản lý dược đã cấp phép lưu hành thuốc đó hoặc cơ sở đăng ký phải cung cấp bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này và các tài liệu kỹ thuật tương ứng với từng nội dung thay đổi theo hướng dẫn tại Phụ lục II ban hành kèm theo Thông tư này để chứng minh tương đương về chất lượng so với biệt dược gốc, sinh phẩm tham chiếu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"37897a25-d501-49f7-af2d-1042a41380f8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐối với sinh phẩm tham chiếu khi thay đổi cơ sở sản xuất hoặc thay đổi địa điểm sản xuất phải có thêm tài liệu chứng minh tương đương chất lượng theo hướng dẫn của US-FDA, ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên, hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6df35bd8-a3d4-41c0-a441-293c6588b952\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Thuốc đặt gia công, thuốc trước chuyển giao công nghệ đã được phân loại biệt dược gốc, sinh phẩm tham chiếu hoặc chưa được phân loại biệt dược gốc, sinh phẩm tham chiếu nhưng có dữ liệu lâm sàng đáp ứng quy định tại điểm a hoặc điểm b khoản 1 Điều này được gia công hoặc chuyển giao công nghệ tại Việt Nam thì thuốc gia công, thuốc chuyển giao công nghệ được phân loại là biệt dược gốc, sinh phẩm tham chiếu nếu đáp ứng các tiêu chí tại khoản 2 Điều này và điểm d khoản 2 Điều 38 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b2b7d437-4bee-42bf-9c44-84c91bf26230\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Các trường hợp áp dụng phân loại biệt dược gốc, sinh phẩm tham chiếu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d8a71bd0-2fd9-45d1-be05-be58f7f5d0cc\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc có đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu khi nộp hồ sơ đề nghị cấp giấy đăng ký lưu hành:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"d8a71bd0-2fd9-45d1-be05-be58f7f5d0cc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu khi nộp hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc. Hồ sơ đề nghị cấp giấy đăng ký lưu hành được thẩm định và cấp giấy đăng ký lưu hành phải đáp ứng các tiêu chí quy định tại một trong các khoản 1, 2 hoặc 3 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f45977a7-cc1f-4981-9eb7-2328a41833ce\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc đã được cấp giấy đăng ký lưu hành có đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"f45977a7-cc1f-4981-9eb7-2328a41833ce\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eC
