 chung ASEAN (ACTD) hoặc hồ sơ kỹ thuật chung ICH-CTD và tuân thủ các quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"051b7dca-0ea1-4755-a053-661896d0ff76\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cấu trúc hồ sơ đăng ký thuốc hóa dược, vắc xin, sinh phẩm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"704fb92e-5af9-4306-9fe0-af2ddd437bdc\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Hồ sơ đăng ký thuốc hóa dược, vắc xin, sinh phẩm theo hồ sơ kỹ thuật chung ASEAN (ACTD) được bố cục như sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"704fb92e-5af9-4306-9fe0-af2ddd437bdc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần I: Hồ sơ hành chính. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"704fb92e-5af9-4306-9fe0-af2ddd437bdc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần II: Hồ sơ kĩ thuật (bao gồm: Hồ sơ chất lượng; Hồ sơ tiền lâm sàng; Hồ sơ lâm sàng);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7726a7a4-794b-48bb-9fc5-f4b8ed545e48\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Hồ sơ đăng ký thuốc hóa dược, vắc xin, sinh phẩm theo Hồ sơ kỹ thuật chung ICH-CTD được bố cục như sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"7726a7a4-794b-48bb-9fc5-f4b8ed545e48\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hợp phần I: Hồ sơ hành chính. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"7726a7a4-794b-48bb-9fc5-f4b8ed545e48\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hợp phần II: Hồ sơ kĩ thuật (bao gồm: Tóm tắt tổng quan về chất lượng, tiền lâm sàng, lâm sàng; Hồ sơ chất lượng; Hồ sơ tiền lâm sàng; Hồ sơ lâm sàng).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f82018e9-6d4c-499f-89aa-6d152402772c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Cấu trúc hồ sơ đăng ký thuốc dược liệu; thuốc dùng đường uống chứa thành phần dược liệu có phối hợp với dược chất là tinh dầu hoặc chất tinh khiết chiết xuất từ tinh dầu (bao gồm cả phương pháp tổng hợp hoặc bán tổng hợp); thuốc có chứa hoạt chất tinh khiết chiết xuất từ dược liệu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f1b9d3ec-b103-4a3d-b024-63a36e8d1633\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với thuốc dược liệu là thuốc mới; thuốc dùng đường uống chứa thành phần dược liệu có phối hợp với dược chất là tinh dầu hoặc chất tinh khiết chiết xuất từ tinh dầu (bao gồm cả phương pháp tổng hợp hoặc bán tổng hợp); thuốc có chứa hoạt chất tinh khiết chiết xuất từ dược liệu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"f1b9d3ec-b103-4a3d-b024-63a36e8d1633\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần I: Hồ sơ hành chính. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"f1b9d3ec-b103-4a3d-b024-63a36e8d1633\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần II: Hồ sơ kĩ thuật (bao gồm: Hồ sơ chất lượng thực hiện theo hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này; dữ liệu lâm sàng hoặc các dữ liệu trích dẫn theo quy định tại khoản 3 Điều 24 Thông tư này);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"dbff4598-14ff-4941-98fe-a2d45787ba37\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với thuốc dược liệu không phải là thuốc mới:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"dbff4598-14ff-4941-98fe-a2d45787ba37\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần I: Hồ sơ hành chính. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"dbff4598-14ff-4941-98fe-a2d45787ba37\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Phần II: Hồ sơ kĩ thuật (bao gồm: Hồ sơ chất lượng thực hiện theo hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này). \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"273a25f6-20e0-46c3-8e68-1c9c1f8be28a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Cấu trúc hồ sơ đăng ký nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"34f49f9d-497c-4bfa-9a85-49575362c3f8\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Phần I: Hồ sơ hành chính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2be0b7cd-5186-41e3-90ae-4da1c1046489\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Phần II: Hồ sơ kĩ thuật (bao gồm: Hồ sơ chất lượng thực hiện theo hướng dẫn tại Phụ lục IV ban hành kèm theo Thông tư này).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"00f80205-1d64-40d1-8681-dd524995be94\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 26. Quy định về hồ sơ hành chính\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8cb45ec1-dea0-414b-9683-161f96ee4dd8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Đơn đăng ký theo\u0026nbsp;Mẫu 4A/TT, Mẫu 4B/TT, Mẫu 4C/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1343898f-7e91-4178-806b-285d847d6e4a\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Các giấy ủy quyền trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7f197579-4b17-4e74-ac4e-edfad331d7a0\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Giấy ủy quyền đứng tên cơ sở đăng ký trong trường hợp cơ sở đăng ký không phải là cơ sở sản xuất, chủ sở hữu giấy phép lưu hành, cơ sở đặt gia công hoặc cơ sở chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a999435d-dc2b-49fe-81d8-489cd9bf3850\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Giấy ủy quyền ký tên trên hồ sơ đăng ký thuốc, nguyên liệu làm thuốc (nếu có).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d4bc92b9-d748-403b-8748-0ff847997d3b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. CPP (đối với hồ sơ đăng ký thuốc nhập khẩu). \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"d4bc92b9-d748-403b-8748-0ff847997d3b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐối với các trường hợp quy định tại tiết 1, 2 điểm a khoản 2 Điều 45 Thông tư này, cơ sở đăng ký nộp văn bản giải trình về việc chưa cung cấp được CPP trong hồ sơ tại thời điểm tiếp nhận hồ sơ lần đầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"893aeda0-b7ff-4876-9cef-b9d61abee9b8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Giấy phép sản xuất, kinh doanh thuốc tại nước sở tại; giấy phép thành lập Văn phòng đại diện tại Việt Nam (đối với cơ sở đăng ký nước ngoài).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"e2999f8f-19d2-4e95-938b-6f1af355cca6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Giấy chứng nhận đủ điều kiện kinh doanh dược (đối với cơ sở đăng ký của Việt Nam).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"06b22f97-d3b0-46fb-bb88-b218a13fb554\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Giấy tờ pháp lý của cơ sở sản xuất dược chất, tá dược, vỏ nang, dược liệu theo quy định tại khoản 7 Điều 22 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d6ae6d6b-0af1-4be6-8edd-ac0e11204d37\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Giấy chứng nhận nguyên liệu làm thuốc được phép sản xuất hoặc lưu hành ở nước sản xuất (đối với hồ sơ đăng ký nguyên liệu làm thuốc sản xuất tại nước ngoài).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3b9e939b-9b10-4263-bdde-81aa7942bc35\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8. Mẫu nhãn thuốc, nguyên liệu làm thuốc và tờ hướng dẫn sử dụng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"3fadb828-a8fe-48c4-8ed2-839a37ddfc74\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Của thuốc, nguyên liệu làm thuốc dự kiến lưu hành tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"3688b3db-8257-4f4f-a449-26699a7a4183\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Của thuốc lưu hành thực tế tại nước sản xuất hoặc nước cấp CPP đối với hồ sơ đăng ký thuốc nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"12860fe4-563e-4199-a253-65fe234ed700\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e9. Tóm tắt đặc tính sản phẩm hoặc tờ hướng dẫn sử dụng đã được phê duyệt tại nước cấp CPP đối với thuốc mới, vắc xin, sinh phẩm, thuốc đề nghị được áp dụng hình thức tham chiếu kết quả thẩm định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8120a076-5c0d-46fc-bfc0-b2299bc5cfbf\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e10. Đối với hồ sơ đề nghị áp dụng hình thức tham chiếu kết quả thẩm định hoặc trường hợp hồ sơ đề nghị cấp giấy đăng ký lưu hành của thuốc sản xuất tại nước không thuộc danh sách các nước có cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này nhưng chỉ nộp CPP được cấp bởi cơ quan có thẩm quyền cấp CPP của nước có cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này xác nhận thuốc được cấp phép và lưu hành thực tế tại nước đó thì phải có thêm các tài liệu sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1836dfd5-b643-435c-979f-fa7e3dfa9503\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Báo cáo thẩm định của cơ quan quản lý dược cấp CPP quy định tại khoản 9 Điều 2 Thông tư này phải đáp ứng yêu cầu tại Điều 30 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"38bd2d8e-08a9-4940-aebd-af659b16a5ea\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Bảng so sánh tính tương đồng giữa hồ sơ đăng ký thuốc tại Việt Nam với thông tin về thuốc đã được cấp phép tại nước sở tại, lập theo Mẫu 09/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"794cced8-dc51-4b26-be68-efe5d02ddc6b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 27. Quy định về hồ sơ chất lượng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"63f3f5d2-8744-4864-abeb-338b55c089aa\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Tài liệu chất lượng thực hiện theo hướng dẫn tại hồ sơ kỹ thuật chung Phần II của ACTD hoặc các hướng dẫn tại Hợp phần 2 và 3 của ICH-CTD và các hướng dẫn liên quan. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"63f3f5d2-8744-4864-abeb-338b55c089aa\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐối với sinh phẩm tương tự phải có đầy đủ hồ sơ, dữ liệu chứng minh tính tương tự về chất lượng với sinh phẩm tham chiếu theo hướng dẫn của WHO, US-FDA, EMA.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3a03e643-b1ca-4600-b72d-d19ae3269bd0\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ dược chất có thể được thay thế bằng việc nộp các tài liệu sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"829fcb0d-d2cf-41f8-b3ef-fffb167f5402\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Chứng nhận phù hợp chuyên luận Dược điển Châu Âu (CEP) theo quy định tại khoản 3 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a7389349-e01b-42f1-9eab-a4af36eeba54\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Số liệu phân tích lô dược chất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ef7cb3a2-c9c0-4350-b325-c035b6489277\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Trường hợp CEP không nêu thời hạn phải kiểm tra lại chất lượng của dược chất, nộp số liệu nghiên cứu độ ổn định của dược chất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"bbcf73d8-7908-4f7d-baeb-24dfd1d81e19\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Quy định đối với CEP trong hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f30b5601-eea1-4e29-abf9-f14172d72377\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) CEP nộp trong hồ sơ đăng ký thuốc phải còn hiệu lực tại thời điểm tiếp nhận hồ sơ do Cơ quan Châu Âu về Chất lượng Thuốc và Chăm sóc sức khỏe (EDQM) cấp, bao gồm toàn bộ phụ lục/tài liệu đính kèm CEP.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"f30b5601-eea1-4e29-abf9-f14172d72377\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp được cấp trước ngày 01 tháng 9 năm 2023, CEP phải có dấu xác nhận của cơ sở sản xuất thuốc thành phẩm hoặc cơ sở đăng ký; cơ sở xác nhận chịu trách nhiệm trước pháp luật về tính chính xác, hợp pháp, trung thực của tài liệu. CEP phải thể hiện đầy đủ tên cơ sở đăng ký hoặc cơ sở sản xuất được ủy quyền sử dụng CEP tại nội dung ủy quyền trong CEP.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"f30b5601-eea1-4e29-abf9-f14172d72377\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp được cấp kể từ ngày 01 tháng 9 năm 2023, CEP nộp trong hồ sơ đăng ký thuốc phải là bản điện tử có chữ ký điện tử hợp lệ do EDQM cấp, kèm theo thư ủy quyền của chủ sở hữu CEP cho cơ sở đăng ký hoặc cơ sở sản xuất được phép sử dụng CEP;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1803b668-1147-4e9f-aa8f-c7d2c012690b\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cơ sở đăng ký phải nộp kết quả tự tra cứu CEP từ cơ sở dữ liệu do EDQM công bố, kèm đường dẫn tra cứu và có xác nhận của cơ sở đăng ký. Kết quả tự tra cứu phải bao gồm các thông tin sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"1803b668-1147-4e9f-aa8f-c7d2c012690b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên nguyên liệu, thông tin chủ sở hữu CEP, số chứng nhận CEP, ngày cấp CEP, tình trạng hiệu lực, số chuyên luận Dược điển Châu Âu áp dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"1803b668-1147-4e9f-aa8f-c7d2c012690b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thời điểm phải gia hạn hoặc ngày hết hiệu lực (nếu có).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"841ffdcf-b11b-46b2-9a01-ca20e5521ebd\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Trường hợp cơ sở sản xuất sử dụng nguyên liệu làm thuốc đã được cấp giấy đăng ký lưu hành tại Việt Nam và sử dụng đúng theo các thông tin đã được phê duyệt về tên nguyên liệu, cơ sở sản xuất, tiêu chuẩn chất lượng và nguồn nguyên liệu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"71e08f24-ba51-4c5d-8ab6-dd4af912fec1\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Không yêu cầu phải nộp tài liệu chất lượng liên quan đến nguyên liệu và tài liệu quy định tại khoản 6 Điều 26 Thông tư này trong hồ sơ đăng ký thuốc thành phẩm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bc3da467-e03b-4fbe-ada1-b151092c962f\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cơ sở đăng ký phải nộp:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"bc3da467-e03b-4fbe-ada1-b151092c962f\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- 01 phiếu kiểm nghiệm nguyên liệu làm thuốc do cơ sở sản xuất thuốc thành phẩm kiểm nghiệm phải có đầy đủ các chỉ tiêu chất lượng với mức chất lượng tương đương hoặc chặt chẽ hơn mức chất lượng trong tiêu chuẩn của cơ sở sản xuất nguyên liệu. Trường hợp cơ sở sản xuất thuốc thành phẩm không đủ năng lực kiểm tra tất cả các chỉ tiêu chất lượng, cơ sở phải cung cấp phiếu phân tích các chỉ tiêu còn thiếu do Cơ quan kiểm nghiệm nhà nước hoặc cơ sở kinh doanh dịch vụ kiểm nghiệm thuốc, nguyên liệu làm thuốc đã được cấp giấy chứng nhận đủ điều kiện kinh doanh dược thực hiện;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"bc3da467-e03b-4fbe-ada1-b151092c962f\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- 01 phiếu kiểm nghiệm nguyên liệu làm thuốc do cơ sở sản xuất nguyên liệu kiểm nghiệm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6981c044-0306-4ed8-a50f-b55987bdb8a2\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Đối với vắc xin, huyết thanh có chứa kháng thể, dẫn xuất của máu và huyết tương người thực hiện theo quy định tại khoản 1 Điều này và các tài liệu sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7d278be6-96d7-4949-b20e-049598b60a30\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Giấy chứng nhận xuất xưởng lô được cấp bởi cơ quan có thẩm quyền nước cấp CPP theo quy định hoặc một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"75fa0746-3e81-4ba6-a4d3-7ba8e2acfea1\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Phiếu kiểm nghiệm, tiêu chuẩn chất lượng và phương pháp kiểm nghiệm có xác nhận bởi Viện Kiểm định Quốc gia Vắc xin và Sinh phẩm y tế hoặc cơ sở kiểm nghiệm thuốc của nhà nước được Bộ Y tế giao nhiệm vụ kiểm định, đánh giá và giám sát vắc xin, sinh phẩm y tế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"41836077-4105-4af1-8aa0-16335f0d258b\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Đối với thuốc hiếm, thuốc để đáp ứng nhu cầu cho quốc phòng, an ninh; phòng, chống dịch, bệnh, khắc phục hậu quả thiên tai, thảm họa và thuốc cho nhu cầu điều trị đặc biệt:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c8a1620e-bff5-419b-932a-185680c616dc\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc hiếm để điều trị bệnh hiếm gặp: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"c8a1620e-bff5-419b-932a-185680c616dc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eChấp nhận dữ liệu nghiên cứu độ ổn định sẵn có theo hướng dẫn của ASEAN hoặc của ICH;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"03e554cf-0dc8-4066-9d0a-1a4d37e4fa17\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc để\u0026nbsp;đáp ứng nhu cầu cho quốc phòng, an ninh; phòng, chống dịch, bệnh, khắc phục hậu quả thiên tai, thảm họa:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"03e554cf-0dc8-4066-9d0a-1a4d37e4fa17\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eChấp nhận dữ liệu nghiên cứu độ ổn định sẵn có tại thời điểm nộp hồ sơ đăng ký để xem xét hạn dùng của thuốc trên cơ sở ý kiến của Hội đồng trong trường hợp khoảng thời gian của dữ liệu nghiên cứu độ ổn định của thuốc chưa đáp ứng đủ quy định về thời gian nghiên cứu tối thiểu theo hướng dẫn của ASEAN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"03e554cf-0dc8-4066-9d0a-1a4d37e4fa17\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eSau khi được cấp giấy đăng ký lưu hành, cơ sở phải tiếp tục nộp hồ sơ nghiên cứu độ ổn định thành phẩm cho đến khi khoảng thời gian nghiên cứu độ ổn định tối thiểu thực tế đáp ứng theo hướng dẫn của ASEAN về Cục Quản lý Dược theo hình thức thay đổi, bổ sung quy định tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này để được xem xét và cập nhật hạn dùng theo quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"03e554cf-0dc8-4066-9d0a-1a4d37e4fa17\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp thuốc không đạt kết quả nghiên cứu độ ổn định theo đề cương trong hồ sơ đăng ký, cơ sở phải báo cáo ngay về Cục Quản lý Dược để trình Hội đồng xem xét về hạn dùng của thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"03e554cf-0dc8-4066-9d0a-1a4d37e4fa17\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrên cơ sở ý kiến tư vấn của Hội đồng, Cục Quản lý Dược xem xét, quyết định về hạn dùng của thuốc bao gồm cả các lô thuốc đã sản xuất căn cứ trên dữ liệu nghiên cứu độ ổn định thực tế;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8c5dbeef-45f8-4eb0-855c-2f10b17c7144\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thuốc cho nhu cầu điều trị đặc biệt: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"8c5dbeef-45f8-4eb0-855c-2f10b17c7144\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eChấp nhận dữ liệu nghiên cứu độ ổn định sẵn có theo hướng dẫn của ASEAN hoặc ICH được Bộ trưởng Bộ Y tế quyết định trên cơ sở ý kiến của Hội đồng trong trường hợp cơ sở đăng ký chứng minh thuốc không thể bảo quản ở điều kiện khí hậu vùng IVb theo hướng dẫn của ASEAN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"c67a4dc7-f4dc-4bb0-ac85-d07f063a848f\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Đối với trường hợp quy định tại khoản 2 Điều 13 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"c67a4dc7-f4dc-4bb0-ac85-d07f063a848f\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký phải nộp Bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này giữa thuốc trước khi thay đổi và thuốc sau khi thay đổi và các tài liệu kỹ thuật tương ứng với từng nội dung thay đổi theo hướng dẫn tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6eba9401-743e-4b6e-bc8a-9badb91c9924\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8. Đối với hồ sơ đề nghị cấp giấy đăng ký lưu hành của thuốc gia công, chuyển giao công nghệ đáp ứng quy định tại khoản 1 Điều 9 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"27c765ee-eb51-4011-9ade-ff1e637a0383\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Trường hợp thuốc đặt gia công hoặc thuốc trước chuyển giao công nghệ đã có dữ liệu độ ổn định vùng IVb, yêu cầu tối thiểu 06 tháng đối với dữ liệu nghiên cứu độ ổn định ở điều kiện dài hạn và lão hóa cấp tốc của thuốc đăng ký phù hợp Hướng dẫn của ASEAN áp dụng với trường hợp thay đổi, bổ sung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2a28c02e-9eba-4513-831a-d7a85a582294\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trường hợp thuốc đặt gia công hoặc thuốc trước chuyển giao công nghệ chưa có dữ liệu độ ổn định vùng IVb: yêu cầu dữ liệu nghiên cứu độ ổn định thuốc đăng ký ở vùng IVb phù hợp hướng dẫn của ASEAN về nghiên cứu độ ổn định của thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"098ecad8-d8ea-45fe-91e4-b1b427980861\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Đối với vắc xin, sinh phẩm yêu cầu dữ liệu độ ổn định thực hiện tương tự như các hướng dẫn của WHO, EMA, US-FDA đối với trường hợp thay đổi cơ sở sản xuất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ac6c6a13-d303-44ab-b3f1-34e8ada396bf\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Sau khi được cấp giấy đăng ký lưu hành, cơ sở sản xuất phải tiếp tục nghiên cứu độ ổn định thành phẩm theo đề cương nghiên cứu trong hồ sơ đăng ký đã nộp. Trường hợp thuốc không đạt kết quả nghiên cứu độ ổn định, cơ sở đăng ký phải báo cáo và đề xuất biện pháp xử lý phù hợp về Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"431ba0c6-4e42-4243-b266-4bf84d7dbffb\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e9. Đối với hồ sơ đề nghị cấp giấy đăng ký lưu hành của thuốc đã được cấp giấy đăng ký lưu hành khi thay đổi cơ sở sản xuất theo quy định tại điểm b khoản 2 Điều 55 Luật Dược có tài liệu chứng minh việc phê duyệt thay đổi cơ sở sản xuất của cơ quan quản lý có thẩm quyền nước sở tại và bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a0122706-449a-446e-bc89-445ece5a180c\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Yêu cầu tối thiểu 06 tháng đối với dữ liệu nghiên cứu độ ổn định ở điều kiện dài hạn và lão hóa cấp tốc của thuốc đăng ký phù hợp Hướng dẫn của ASEAN áp dụng với trường hợp thay đổi, bổ sung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a9f0a959-08d4-4373-b974-6589b2965b6e\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với vắc xin, sinh phẩm yêu cầu dữ liệu độ ổn định thực hiện tương tự như các hướng dẫn của WHO, EMA, US-FDA đối với trường hợp thay đổi cơ sở sản xuất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a2d2152e-af7f-441a-b996-2bfdba4884c8\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Sau khi được cấp giấy đăng ký lưu hành, cơ sở sản xuất phải tiếp tục nghiên cứu độ ổn định thành phẩm theo đề cương nghiên cứu trong hồ sơ đăng ký đã nộp. Trường hợp thuốc không đạt kết quả nghiên cứu độ ổn định, cơ sở đăng ký phải báo cáo và đề xuất biện pháp xử lý phù hợp về Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f5749a78-177f-4d37-8d71-5381b693981c\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 28. Quy định về hồ sơ tiền lâm sàng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"f5749a78-177f-4d37-8d71-5381b693981c\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTài liệu tiền lâm sàng thực hiện theo hướng dẫn tại Phần III của ACTD hoặc các hướng dẫn tại Hợp phần 2 và 4 của ICH-CTD và các hướng dẫn liên quan hoặc hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"c3580857-758f-449b-b15f-e8de62dd64e8\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 29. Quy định về hồ sơ lâm sàng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.5pt\" id=\"c3580857-758f-449b-b15f-e8de62dd64e8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTài liệu lâm sàng thực hiện theo hướng dẫn tại Phần IV của ACTD hoặc các hướng dẫn tại Hợp phần 2 và 5 của ICH-CTD và các hướng dẫn liên quan hoặc hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"bad7551e-eea3-4010-abd2-5eb7842d3b10\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 30. Quy định đối với tài liệu về kết quả thẩm định của cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này\u003c/strong\u003e \u003cstrong\u003etrong trường hợp áp dụng hình thức tham chiếu kết quả thẩm định\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d3b6048d-1c9f-4516-9853-bda697cee34d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Phải là báo cáo thẩm định chính thức được ban hành bởi cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này, trong đó trình bày chi tiết quá trình đánh giá, thẩm định về chất lượng, an toàn và hiệu quả của thuốc cũng như cơ sở khoa học và pháp lý cho việc cấp giấy phép lưu hành thuốc tại nước sở tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"611e6061-d497-4532-80ad-a515e6a35f7e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Báo cáo thẩm định phải là báo cáo cuối cùng được cơ quan quản lý về dược sử dụng để cấp phép lưu hành cho sản phẩm và báo cáo thẩm định, văn bản phê duyệt các nội dung thay đổi, bổ sung cho sản phẩm sau khi cấp phép lưu hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7ca633bf-5632-4678-a682-4f6813eef301\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Báo cáo thẩm định phải bao gồm các nội dung tối thiểu để sử dụng trong hình thức tham chiếu kết quả thẩm định như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a672ae15-7321-4405-ac31-dac300062dd8\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Về các thông tin hành chính phải bao gồm các thông tin:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a672ae15-7321-4405-ac31-dac300062dd8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thông tin về thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a672ae15-7321-4405-ac31-dac300062dd8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Danh sách toàn bộ các quy cách, đóng gói được phê duyệt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a672ae15-7321-4405-ac31-dac300062dd8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Nhóm dược lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a672ae15-7321-4405-ac31-dac300062dd8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thông tin về cơ sở sản xuất, cơ sở giữ giấy phép lưu hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"fbef04d4-837c-4ea5-99fa-9088549f996a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Về chất lượng phải bao gồm các thông tin:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"fbef04d4-837c-4ea5-99fa-9088549f996a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá về thành phần, quy trình sản xuất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"fbef04d4-837c-4ea5-99fa-9088549f996a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá về kiểm soát chất lượng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"fbef04d4-837c-4ea5-99fa-9088549f996a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá về độ ổn định, có kết luận về chất lượng sản phẩm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d0b668e2-7221-4edb-93ce-d8895a25ccfa\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Về an toàn, hiệu quả phải bao gồm các thông tin:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"d0b668e2-7221-4edb-93ce-d8895a25ccfa\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá tóm tắt về dữ liệu tiền lâm sàng chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"d0b668e2-7221-4edb-93ce-d8895a25ccfa\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá tóm tắt về dữ liệu lâm sàng chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"d0b668e2-7221-4edb-93ce-d8895a25ccfa\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Đánh giá về lợi ích, nguy cơ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"d0b668e2-7221-4edb-93ce-d8895a25ccfa\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Cơ sở cho các chỉ định được phê duyệt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"17045b3a-5638-4dfb-9f0a-447da29fd24f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Trường hợp báo cáo thẩm định của cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này không phải bằng tiếng Anh, yêu cầu nộp bản dịch công chứng sang tiếng Anh hoặc tiếng Việt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"e6ff921b-0b55-4d9e-a7fb-dd5f7444e466\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eMục 3\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"e6ff921b-0b55-4d9e-a7fb-dd5f7444e466\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH CỤ THỂ VỀ HỒ SƠ ĐỀ NGHỊ CẤP GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"e60694a8-1b4c-4013-87a1-b1d9b3c36aed\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 31. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại khoản 1, 2 và 6 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1da1970a-f727-42fd-878e-3324504d3202\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"1da1970a-f727-42fd-878e-3324504d3202\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"08cd9c2a-1cb4-4ea4-9ad8-74e34b5a51a8\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"08cd9c2a-1cb4-4ea4-9ad8-74e34b5a51a8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 27 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"82738830-1705-400b-be4a-d166aee2cf23\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Hồ sơ tiền lâm sàng: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"82738830-1705-400b-be4a-d166aee2cf23\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại khoản 1, 2, 6 và 7 Điều 24 Thông tư này và tuân thủ quy định tại Điều 28 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"35d69559-27ac-4418-9730-d2d592566678\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Hồ sơ lâm sàng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"35d69559-27ac-4418-9730-d2d592566678\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại khoản 1, 2, 6 và 7 Điều 24 Thông tư này và tuân thủ quy định tại Điều 29 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a9072b55-fafa-40a0-9249-14ad67dac5bc\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Kế hoạch quản lý nguy cơ đối với thuốc hóa dược mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics) theo\u0026nbsp;Mẫu 03/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"5ba0f57b-a8eb-4188-b514-71e5c3cc2540\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 32. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc generic và các thuốc quy định tại điểm b, c, d và h khoản 5 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7c79c588-c4b8-429c-b4bb-da61364115f0\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"7c79c588-c4b8-429c-b4bb-da61364115f0\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"022f08d6-a3ab-4248-be34-48d932cd2b84\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a11aa07e-23cc-45f5-91d5-3d809a7f5282\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu theo quy định tại Điều 27 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"77a57ca2-4231-4826-85dc-7b5b2c269847\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Tài liệu chứng minh thuốc có chứng minh tương đương sinh học đối với thuốc chứa dược chất hoặc dạng bào chế phải báo cáo số liệu nghiên cứu tương đương sinh học khi đăng ký lưu hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"ed255148-ce3f-4475-adb7-61964edb270b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 33. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại khoản 4 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"586e1e13-4576-4680-8bd1-1aad267fe368\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"586e1e13-4576-4680-8bd1-1aad267fe368\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1b8b2c75-b525-4cfb-b3d2-4950f5c54a02\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"510335c8-fd2c-4912-b22f-8897e2b7afbf\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu theo quy định tại Điều 27 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"eb0e9c38-3614-495b-babe-2209369d5bfd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Tài liệu chứng minh thuốc có chứng minh tương đương sinh học đối với thuốc chứa dược chất hoặc dạng bào chế phải báo cáo số liệu nghiên cứu tương đương sinh học khi đăng ký lưu hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2431add5-10ca-4bdb-b0d2-e566caa83421\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Hồ sơ lâm sàng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"2431add5-10ca-4bdb-b0d2-e566caa83421\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại khoản 4 Điều 24 Thông tư này và tuân thủ quy định tại Điều 29 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3a0bb4ec-604b-47f5-9f8a-f60b035529ee\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Tờ hướng dẫn sử dụng hoặc tóm tắt đặc tính sản phẩm của thuốc có cùng dược chất, hàm lượng, nồng độ, đường dùng, dạng bào chế được cấp phép lưu hành tại một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này trong trường hợp nộp dữ liệu lâm sàng tập hợp từ các công trình nghiên cứu công bố trong y văn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f523da14-ddff-41e5-bcb2-ca3c57686325\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Trong trường hợp cần thiết phải có thêm dữ liệu về an toàn, hiệu quả trên cơ sở ý kiến tư vấn của Hội đồng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f335ddc5-322f-4ecb-9812-75a01f3b8803\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 34. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại điểm đ và e khoản 5 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d0fd194a-b72d-49aa-95bf-a2ad2c7c17f5\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 3.0pt 0 2.7pt\" id=\"d0fd194a-b72d-49aa-95bf-a2ad2c7c17f5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"df129350-a621-469c-acc3-0e6241ff6760\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\" id=\"df129350-a621-469c-acc3-0e6241ff6760\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Phụ lục III ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"242fe7a2-6b8b-4bb5-9aa0-d1156df6c815\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 35. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại khoản 3 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8d2f5186-444d-413f-ab79-8ebbe3be02cc\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 2.0pt 0 2.7pt\" id=\"8d2f5186-444d-413f-ab79-8ebbe3be02cc\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"49dbd645-7e62-446a-a54d-0a77f96b510d\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\" id=\"49dbd645-7e62-446a-a54d-0a77f96b510d\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"c6deb08f-95f0-40f4-8bab-dd163d666a33\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Dữ liệu lâm sàng hoặc các dữ liệu trích dẫn theo quy định tại khoản 3 Điều 24 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"e5d413ce-e785-4402-b784-21d7d235e76b\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 36. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc quy định tại điểm g khoản 5 Điều 24 Thông tư này\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"662af6be-b250-4a1f-bac8-ebc68397acc2\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 2.0pt 0 2.7pt\" id=\"662af6be-b250-4a1f-bac8-ebc68397acc2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4431158a-793b-4104-9e14-69d768d4777e\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\" id=\"4431158a-793b-4104-9e14-69d768d4777e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo hướng dẫn tại Phụ lục III ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"e846b9c3-a5d6-40ff-a8ec-26d67b105f88\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 37. Hồ sơ đề nghị cấp giấy đăng ký lưu hành nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"356320f8-ee05-47db-b62e-e7744e117e12\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"margin: 2.0pt 0 2.7pt\" id=\"356320f8-ee05-47db-b62e-e7744e117e12\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Điều 26 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"29fe6f56-bc02-4e25-aa0c-9a7b7e7a370c\" style=\"margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.7pt\" id=\"29fe6f56-bc02-4e25-aa0c-9a7b7e7a370c\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu theo quy định tại Phụ lục IV ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"313ff0df-5d21-43af-95ce-ecd25002cc7f\" style=\"text-align: center; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eMục 4\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 2.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH CỤ THỂ VỀ HỒ SƠ ĐỀ NGHỊ CẤP GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC GIA CÔNG, THUỐC CHUYỂN GIAO CÔNG NGHỆ TẠI VIỆT NAM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"313ff0df-5d21-43af-95ce-ecd25002cc7f\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"a219acac-a45d-4ecc-ba6b-c8fc9d90c606\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 38. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, thuốc chuyển giao công nghệ là thuốc hóa dược, vắc xin, sinh phẩm \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0e2a22eb-296a-4312-8b9b-d08800792bcf\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d047d9ad-4def-4721-b33b-0bbd99fd172e\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu hành chính của thuốc gia công, thuốc chuyển giao công nghệ theo quy định tại Điều 26 Thông tư này. Không yêu cầu phải nộp giấy tờ pháp lý của cơ sở sản xuất dược chất, tá dược, vỏ nang, dược liệu trong trường hợp chỉ gia công hoặc chỉ chuyển giao công nghệ công đoạn đóng gói;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4c14512e-8ed2-4ff2-921a-b2f6f2bcdebb\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các tài liệu khác liên quan đến hoạt động gia công, chuyển giao công nghệ bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\" id=\"4c14512e-8ed2-4ff2-921a-b2f6f2bcdebb\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hợp đồng gia công hoặc hợp đồng chuyển giao công nghệ. Trường hợp cơ sở đặt gia công thuốc, cơ sở nhận gia công thuốc không phải là cơ sở đăng ký thuốc thì hợp đồng gia công thuốc phải có chữ ký của người đại diện theo pháp luật của cơ sở đặt gia công thuốc, cơ sở đăng ký thuốc và cơ sở nhận gia công thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\" id=\"4c14512e-8ed2-4ff2-921a-b2f6f2bcdebb\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Giấy chứng nhận đăng ký chuyển giao công nghệ theo quy định tại\u0026nbsp;Điều 31 Luật Chuyển giao công nghệ đối với hồ sơ đăng ký thuốc chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7507e5c2-9c6f-454a-85fd-60c4a93006a1\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.021\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) CPP của thuốc đặt gia công hoặc thuốc trước chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ là thuốc nhập khẩu chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành tại Việt Nam hết thời hạn hiệu lực tại thời điểm nộp hồ sơ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"949a989c-bff8-450a-aa02-0b555bc2d57f\" style=\"margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"17459d2b-129f-4ffe-8fb9-c9e7e97439d1\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu chất lượng của thuốc gia công, thuốc chuyển giao công nghệ, thuốc đặt gia công, thuốc trước chuyển giao công nghệ theo quy định tại Điều 31, 32, 33, 34 và 35 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9a603184-1b9c-4b29-8918-29075a60b306\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này giữa thuốc đặt gia công và thuốc gia công hoặc thuốc trước chuyển giao công nghệ và thuốc chuyển giao công nghệ và các tài liệu kỹ thuật tương ứng với từng nội dung thay đổi theo hướng dẫn tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d9c6e35a-11ef-4e7c-9363-3a2b0609b2ae\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Tài liệu chứng minh tương đương chất lượng của vắc xin, sinh phẩm gia công với vắc xin, sinh phẩm đặt gia công hoặc vắc xin, sinh phẩm chuyển giao công nghệ với vắc xin, sinh phẩm trước chuyển giao công nghệ đối với các trường hợp vắc xin, sinh phẩm được miễn nộp hồ sơ tiền lâm sàng, lâm sàng quy định tại khoản 3 Điều này theo hướng dẫn của US-FDA SUPAC, các hướng dẫn về thay đổi, bổ sung của ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên hoặc hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5467b05c-0746-477f-b533-36a3c0889a23\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Thuốc gia công, thuốc chuyển giao công nghệ đề nghị phân loại biệt dược gốc hoặc đề nghị phân loại thuốc có chứng minh tương đương sinh học phải nộp thêm các tài liệu chất lượng sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"5467b05c-0746-477f-b533-36a3c0889a23\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tài liệu báo cáo nghiên cứu tương đương sinh học của thuốc gia công, thuốc chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"5467b05c-0746-477f-b533-36a3c0889a23\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký có thể thay thế tài liệu báo cáo nghiên cứu tương đương sinh học của thuốc gia công, thuốc chuyển giao công nghệ bằng tài liệu báo cáo nghiên cứu tương đương độ hòa tan giữa thuốc gia công và thuốc đặt gia công hoặc giữa thuốc chuyển giao công nghệ và thuốc trước chuyển giao công nghệ nếu thuốc gia công và thuốc đặt gia công, thuốc chuyển giao công nghệ và thuốc trước chuyển giao công nghệ có cùng công thức bào chế thuốc; cùng quy trình sản xuất; cùng tiêu chuẩn chất lượng nguyên liệu; cùng tiêu chuẩn chất lượng thuốc thành phẩm theo hướng dẫn của US-FDA SUPAC, ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên hoặc hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"5467b05c-0746-477f-b533-36a3c0889a23\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp có thay đổi liên quan đến các nội dung trên mà các thay đổi này thuộc các mức không yêu cầu phải nộp báo cáo nghiên cứu tương đương sinh học của thuốc, cơ sở đăng ký phải nộp các hồ sơ, tài liệu phù hợp với mỗi thay đổi theo hướng dẫn của US-FDA SUPAC, ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên hoặc hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"5467b05c-0746-477f-b533-36a3c0889a23\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tài liệu báo cáo nghiên cứu tương đương sinh học của thuốc đặt gia công, thuốc trước chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa được phân loại thuốc có chứng minh tương đương sinh học tại Việt Nam và thuốc gia công, thuốc chuyển giao công nghệ đề nghị phân loại tương đương sinh học.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"49e84c8f-2d75-4e37-bf3e-6d176fa05f3b\" style=\"margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Hồ sơ tiền lâm sàng và lâm sàng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với thuốc gia công, thuốc chuyển giao công nghệ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu tiền lâm sàng theo quy định tại khoản 3 Điều 31 Thông tư này và tài liệu lâm sàng theo quy định tại khoản 4 Điều 31 Thông tư này trong trường hợp thuốc gia công, thuốc chuyển giao công nghệ là thuốc hóa dược mới, vắc xin, sinh phẩm. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKhông yêu cầu phải nộp tài liệu tiền lâm sàng và lâm sàng trong trường hợp:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc đặt gia công, thuốc trước chuyển giao công nghệ là thuốc hóa dược đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc đã nộp tài liệu tiền lâm sàng đáp ứng quy định tại khoản 3 Điều 31 Thông tư này và tài liệu lâm sàng theo quy định tại khoản 4 Điều 31 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc đặt gia công, thuốc trước chuyển giao công nghệ là sinh phẩm đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc đã nộp tài liệu tiền lâm sàng đáp ứng quy định tại khoản 3 Điều 31 Thông tư này, tài liệu lâm sàng theo quy định tại khoản 4 Điều 31 Thông tư này và có tài liệu chứng minh tương đương về chất lượng của thuốc gia công với thuốc đặt gia công hoặc thuốc chuyển giao công nghệ với thuốc trước chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2a93a9c2-457f-47e0-811f-76f3ed3ecb0b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc đặt gia công, thuốc trước chuyển giao công nghệ là vắc xin đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ và có tài liệu chứng minh tương đương về chất lượng của thuốc gia công với thuốc đặt gia công hoặc thuốc chuyển giao công nghệ với thuốc trước chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8f894b8e-1129-48fd-a30c-f050db2ea098\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với thuốc đặt gia công, thuốc trước chuyển giao công nghệ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"8f894b8e-1129-48fd-a30c-f050db2ea098\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu tiền lâm sàng theo quy định tại khoản 3 Điều 31 Thông tư này và tài liệu lâm sàng theo quy định tại khoản 4 Điều 31 Thông tư này trong trường hợp thuốc gia công, thuốc chuyển giao công nghệ là thuốc hóa dược mới, vắc xin, sinh phẩm hoặc thuốc gia công, thuốc chuyển giao công nghệ đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa được phân loại biệt dược gốc, sinh phẩm tham chiếu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3d2e053a-c066-47fc-8b13-6914402ab1a0\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Kế hoạch quản lý nguy cơ đối với thuốc hóa dược mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics) theo\u0026nbsp;Mẫu 03/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"a6b7e64d-9447-445b-904d-049898308c95\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 39. Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, thuốc chuyển giao công nghệ là thuốc dược liệu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8e3f976c-8626-400c-914b-1caca84990cc\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ hành chính: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ec2fac8c-cd31-4eb8-90de-748061f27985\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu hành chính của thuốc gia công, thuốc chuyển giao công nghệ theo quy định tại Điều 26 Thông tư này. Không yêu cầu phải nộp giấy tờ pháp lý của cơ sở sản xuất dược liệu, tá dược, vỏ nang trong trường hợp chỉ gia công hoặc chỉ chuyển giao công nghệ công đoạn đóng gói;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2f0d4873-e4bc-4ce0-a41e-8d08ae4dbd95\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các tài liệu khác liên quan đến hoạt động gia công, chuyển giao công nghệ bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2f0d4873-e4bc-4ce0-a41e-8d08ae4dbd95\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hợp đồng gia công hoặc hợp đồng chuyển giao công nghệ. Trường hợp cơ sở đặt gia công thuốc, cơ sở nhận gia công thuốc không phải là cơ sở đăng ký thuốc thì hợp đồng gia công thuốc phải có chữ ký của người đại diện theo pháp luật của cơ sở đặt gia công thuốc, cơ sở đăng ký thuốc và cơ sở nhận gia công thuốc. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"2f0d4873-e4bc-4ce0-a41e-8d08ae4dbd95\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Giấy chứng nhận đăng ký chuyển giao công nghệ theo quy định tại Điều 31 Luật Chuyển giao công nghệ đối với hồ sơ đăng ký thuốc chuyển giao công nghệ; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"545ab39f-5d89-475a-872e-7acb8c00bd44\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) CPP của thuốc đặt gia công hoặc thuốc trước chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ là thuốc nhập khẩu chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành tại Việt Nam hết thời hạn hiệu lực tại thời điểm nộp hồ sơ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"593f420c-3e48-4820-821b-da72b2e263f5\" style=\"margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hồ sơ chất lượng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b7f2c6b9-3652-4e22-b9fa-46225e496572\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các tài liệu chất lượng của thuốc gia công, thuốc chuyển giao công nghệ, thuốc đặt gia công, thuốc trước chuyển giao công nghệ theo quy định tại Điều 35 và Điều 36 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0b6ab89e-a2df-4357-92ff-5bae6a1d673a\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Bảng so sánh theo Mẫu 01/TT tại Phụ lục IX ban hành kèm theo Thông tư này giữa thuốc đặt gia công và thuốc gia công hoặc thuốc trước chuyển giao công nghệ và thuốc chuyển giao công nghệ và các tài liệu kỹ thuật tương ứng với từng nội dung thay đổi theo hướng dẫn tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3163ee15-8f0e-4979-bd08-c5bc251ec299\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Hồ sơ lâm sàng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9712eb6a-727f-4441-9ae8-fa5a94d6180e\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với thuốc gia công, thuốc chuyển giao công nghệ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"9712eb6a-727f-4441-9ae8-fa5a94d6180e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCác tài liệu lâm sàng theo quy định tại khoản 3 Điều 35 Thông tư này trong trường hợp thuốc gia công, thuốc chuyển giao công nghệ là thuốc mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"9712eb6a-727f-4441-9ae8-fa5a94d6180e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKhông yêu cầu phải nộp tài liệu lâm sàng trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ là thuốc dược liệu đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc đã nộp tài liệu lâm sàng đáp ứng quy định tại khoản 3 Điều 35 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"3f203570-4f6d-4649-8086-17e5c8c75cb8\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với thuốc đặt gia công, thuốc trước chuyển giao công nghệ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"3f203570-4f6d-4649-8086-17e5c8c75cb8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Các tài liệu lâm sàng theo quy định tại khoản 3 Điều 35 Thông tư này trong trường hợp thuốc gia công, thuốc chuyển giao công nghệ là thuốc mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\" id=\"3f203570-4f6d-4649-8086-17e5c8c75cb8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Các tài liệu lâm sàng theo quy định tại Điều 18 Thông tư này đối với thuốc gia công, thuốc chuyển giao công nghệ đề nghị phân loại biệt dược gốc trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa được phân loại biệt dược gốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"cabe2b2d-73b5-4944-b389-3aa5f805314b\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 40. Hồ sơ đề nghị cấp giấy đăng ký lưu hành đối với thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"42536eaa-785c-4e57-9ea0-38419a7b98b8\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Các tài liệu theo quy định tại Điều 38 hoặc Điều 39 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2ac04efa-0949-4ec5-b26e-9a34f651a5b9\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cơ sở đăng ký phải nộp đồng thời:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"da4e24f5-4a31-49da-9f22-207f7db5e325\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Hợp đồng gia công và hợp đồng chuyển giao công nghệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"e6972fce-e9ea-4ca4-9601-195894afae54\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.042\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Giấy chứng nhận đăng ký chuyển giao công nghệ theo quy định tại Điều 31 Luật Chuyển giao công nghệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"3f34a1e3-aa8c-4b0d-b439-02e4309522fe\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eMục 5\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH CỤ THỂ VỀ HỒ SƠ ĐỀ NGHỊ GIA HẠN, THAY ĐỔI, BỔ SUNG GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"3f34a1e3-aa8c-4b0d-b439-02e4309522fe\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f22bfd25-0e5d-4549-b1b0-b79b4290aa44\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 41. Hồ sơ đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ae5a4db4-7581-4662-8b00-0209a17b5fa1\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Đơn đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc theo\u0026nbsp;Mẫu 4B/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"21684c82-aed3-4a09-bab2-3769b425dfaf\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Giấy chứng nhận CPP còn thời hạn hiệu lực đối với thuốc nhập khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7ebf97d7-d314-4a7c-baef-0b36e51c480d\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Báo cáo an toàn, hiệu quả của thuốc trong quá trình lưu hành theo\u0026nbsp;Mẫu 2C/TT tại Phụ lục IX ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"ba831f1f-03c0-470a-b79c-9d762d179ea0\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 42. Hồ sơ đề nghị thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4a394bf2-f154-4a41-be51-b52fb6dc9a42\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Đơn đề nghị thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc theo\u0026nbsp;Mẫu 4C/TT tại Phụ lục IX ban hành kèm theo Thông tư này và giấy ủy quyền ký tên trên hồ sơ đăng ký (nếu có).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"584ca9eb-a91f-47ec-ae0a-edba0344d221\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Các tài liệu tương ứng với các nội dung thay đổi lớn, thay đổi nhỏ quy định tại Phụ lục II ban hành kèm theo Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"630d7a7c-93fe-416c-8372-129a637ef8c3\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Đối với các thay đổi, bổ sung liên quan đến công thức bào chế thuốc; quy trình sản xuất; tiêu chuẩn chất lượng nguyên liệu; tiêu chuẩn chất lượng thuốc thành phẩm; tên thương mại của thuốc gia công, thuốc chuyển giao công nghệ được công bố đáp ứng tiêu chí tại khoản 1 Điều 9 Thông tư này, cơ sở đăng ký thuốc gia công hoặc cơ sở đăng ký thuốc chuyển giao công nghệ phải cung cấp bằng chứng về việc các nội dung thay đổi đối với thuốc đặt gia công hoặc thuốc trước chuyển giao công nghệ đang được sản xuất, lưu hành ở nước sở tại đã được phê duyệt bởi cơ quan quản lý có thẩm quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"67594ddc-dd0c-462a-ba82-fe9d86ce8e44\" style=\"text-align: center; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương\u0026nbsp;IV\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eTHẨM QUYỀN, THỦ TỤC CẤP, GIA HẠN, THAY ĐỔI, BỔ SUNG GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"67594ddc-dd0c-462a-ba82-fe9d86ce8e44\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"33752c90-1b1d-4c1f-bea4-84da324868a5\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 43. Thẩm quyền cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"e4567b6c-7ef6-4bbd-a0c1-b7d075146d97\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Cục Quản lý Dược cấp; gia hạn; phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc trên cơ sở thẩm định hồ sơ, tư vấn của Hội đồng đối với các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7ace0552-6f23-41da-83ae-edfdfca7e88a\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"cf761efc-a6ee-49f7-9f4d-75c6254b14e2\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color
