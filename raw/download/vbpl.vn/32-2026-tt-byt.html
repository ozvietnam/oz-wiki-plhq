ơ sở đăng ký nộp hồ sơ đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu đối với thuốc đã được cấp giấy đăng ký lưu hành theo hình thức thay đổi, bổ sung quy định tại Phụ lục II ban hành kèm theo Thông tư này. Hồ sơ đề nghị thay đổi, bổ sung giấy đăng ký lưu hành được thẩm định và phê duyệt phải đáp ứng các tiêu chí quy định tại một trong các khoản 1, 2 hoặc 3 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1b95ab49-f5cb-4a73-bf0e-52cd11e44712\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Thuốc đã được phân loại biệt dược gốc, sinh phẩm tham chiếu tiếp tục được phân loại là biệt dược gốc, sinh phẩm tham chiếu khi xem xét gia hạn giấy đăng ký lưu hành hoặc xem xét thay đổi, bổ sung giấy đăng ký lưu hành. Cơ sở đăng ký không phải nộp hồ sơ đề nghị phân loại biệt dược gốc, sinh phẩm tham chiếu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"8e5b17ed-7f64-4b4c-815f-bd411a23d9a7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 14. Tiêu chí phân loại thuốc có chứng minh tương đương sinh học\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8e5b17ed-7f64-4b4c-815f-bd411a23d9a7\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThuốc được cấp giấy đăng ký lưu hành tại Việt Nam được phân loại là thuốc có chứng minh tương đương sinh học khi có báo cáo tương đương sinh học đáp ứng quy định tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/158387\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e07/2022/TT-BYT\u003c/a\u003e của Bộ trưởng Bộ Y tế quy định thuốc phải thử tương đương sinh học và các yêu cầu đối với hồ sơ báo cáo số liệu nghiên cứu tương đương sinh học trong đăng ký lưu hành thuốc tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"585e3d34-0479-4663-8286-30abd89fb599\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 15. Nguyên tắc, tiêu chí, phương pháp phân loại thuốc không kê\u003c/strong\u003e \u003cstrong\u003eđơn\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7ef7061d-e844-40d3-b829-ab6e88f8a98a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Nguyên tắc phân loại thuốc không kê đơn:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d86dd5fc-6c63-4424-aea7-52fb899d21ee\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Bảo đảm an toàn cho người sử dụng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4ea55afc-842c-4c76-8f84-4f42f4a66932\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Bảo đảm việc tiếp cận thuốc kịp thời cho người dân;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c0fc14cd-23a0-4e2a-aeba-bf2fb19169d1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Phù hợp với thực tế sử dụng, cung ứng thuốc của Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"93890719-127d-4bed-8179-338e28e7e3bd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Hòa hợp với các nguyên tắc, quy định phân loại thuốc không kê đơn của các nước trong khu vực và trên thế giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0ee86c03-94cc-4542-8003-4dc6f2f4b9c7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Tiêu chí xác định thuốc không kê đơn:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"0ee86c03-94cc-4542-8003-4dc6f2f4b9c7\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThuốc được phân loại là thuốc không kê đơn nếu đáp ứng tất cả các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"cd9bf682-ac8b-46e8-a871-1210efc21759\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc phải được chứng minh là an toàn và có hiệu quả trong việc phòng ngừa, giảm nhẹ hoặc điều trị các bệnh; có độ an toàn rộng để an toàn cho sức khỏe người sử dụng; có độc tính thấp, trong quá trình bảo quản và khi vào trong cơ thể người không tạo ra các sản phẩm phân hủy có độc tính, không gây độc tính liên quan đến sinh sản, độc tính di truyền hoặc gây ung thư, không có tác dụng không mong muốn cần có sự giám sát, theo dõi của bác sĩ hoặc nhân viên y tế khi tự sử dụng thuốc theo tờ hướng dẫn sử dụng và không có tương tác với các thuốc thường dùng hoặc các thực phẩm mà có thể dẫn đến các phản ứng bất lợi nghiêm trọng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9b22d168-39ee-49e7-9580-fac0bb54210d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc được chỉ định trong điều trị ngắn hạn đối với các bệnh mà người bệnh có thể tự điều trị, không nhất thiết phải có sự kê đơn và theo dõi của nhân viên y tế;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a4e9fcba-908a-46ff-8788-f7d07c1f8832\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thuốc ít có khả năng gây tình trạng lệ thuộc; ít có nguy cơ bị lạm dụng, sử dụng sai mục đích làm ảnh hưởng đến sự an toàn của người sử dụng; không làm che giấu các bệnh nghiêm trọng dẫn đến chậm trễ trong việc chẩn đoán và điều trị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6e66dd92-8f06-4c79-ba3d-ded93e978432\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Thuốc phải có dạng bào chế và đường dùng đơn giản mà người sử dụng có thể tự dùng mà không cần sự hỗ trợ kỹ thuật hoặc hướng dẫn của bác sĩ hoặc nhân viên y tế; không có yêu cầu đặc biệt về điều kiện bảo quản, xử lý thuốc trước và sau khi sử dụng thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6facb709-1094-453f-8f77-03ee474063a0\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Trong thành phần không chứa dược liệu thuộc Danh mục dược liệu độc do Bộ Y tế ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ef8443c6-1074-485f-ac17-bdffb6067023\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Phương pháp phân loại thuốc không kê đơn:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7e623dd1-3627-405b-bd98-8ffa2c6628d1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc generic phân loại là thuốc không kê đơn theo phân loại của biệt dược gốc đã được cấp phép lưu hành tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8f836ac4-11ec-4b79-bd77-924377d07a7c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trường hợp chưa có biệt dược gốc được cấp phép lưu hành tại Việt Nam, thuốc phân loại là thuốc không kê đơn theo phân loại của thuốc có cùng hoạt chất, dược liệu, hàm lượng, nồng độ, dạng bào chế với thuốc được cấp phép, lưu hành tại các nước có cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5ff875be-4c02-46b5-a637-7bfeb021dbd0\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thuốc phân loại là thuốc không kê đơn theo phân loại của thuốc có cùng hoạt chất, dược liệu, hàm lượng, nồng độ, dạng bào chế đã được cấp giấy đăng ký lưu hành tại Việt Nam nếu đáp ứng các nguyên tắc, tiêu chí quy định tại khoản 1 và khoản 2 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"cee18b16-ecbd-47cd-9b19-4953a9332a26\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Các trường hợp khác thực hiện theo ý kiến Hội đồng trên cơ sở nguyên tắc, tiêu chí quy định tại khoản 1 và khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"0a59f57b-8972-4e11-aede-a4a8325a838b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 16. Bảo hộ dữ liệu thử nghiệm đối với hồ sơ đăng ký thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"0a59f57b-8972-4e11-aede-a4a8325a838b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eViệc bảo hộ dữ liệu thử nghiệm trong hồ sơ đăng ký thuốc thực hiện theo quy định tại khoản 1, 2 và 3 Điều 128 Luật Sở hữu trí tuệ số \u003ca href=\"/van-ban/chi-tiet/16748\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003c/a\u003e\u003ca href=\"/van-ban/chi-tiet/17050\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e50/2005/QH11\u003c/a\u003e được sửa đổi, bổ sung bởi Luật số \u003ca href=\"/van-ban/chi-tiet/23823\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003c/a\u003e\u003ca href=\"/van-ban/chi-tiet/11716\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e36/2009/QH12\u003c/a\u003e, Luật số \u003ca href=\"/van-ban/chi-tiet/136041\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e42/2019/QH14\u003c/a\u003e, Luật số \u003ca href=\"/van-ban/chi-tiet/157722\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e07/2022/QH15\u003c/a\u003e, Luật số \u003ca href=\"/van-ban/chi-tiet/179265\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e93/2025/QH15\u003c/a\u003e và Luật số \u003ca href=\"/van-ban/chi-tiet/187492\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e131/2025/QH15\u003c/a\u003e (sau đây gọi tắt là Luật Sở hữu trí tuệ).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"4bdbdd8f-11f5-4628-8675-e12b3df1a4ce\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 17. Quy định về xác minh tính xác thực của giấy tờ pháp lý trong hồ sơ đề nghị cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b04abc0b-b834-4cda-b62b-e4385951f626\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Xác minh tính xác thực của CPP trong hồ sơ đề nghị cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành đối với các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"fb4f02b1-f8de-4e37-8c7e-83323e3b3ff7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) CPP có nội dung bị tẩy xóa, sửa chữa thông tin;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9699358d-865c-40e1-9944-7308480e9ace\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cơ sở sản xuất, cơ sở đăng ký đã bị cơ quan có thẩm quyền của Việt Nam xử phạt hành chính do vi phạm điểm d và h khoản 2 Điều 98 Nghị định số \u003ca href=\"/van-ban/chi-tiet/179702\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e163/2025/NĐ-CP\u003c/a\u003e. Thời hạn áp dụng việc xác minh tính xác thực CPP là 03 năm kể từ ngày có quyết định xử phạt hành chính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1b32e910-d811-4f46-8686-7d8f45926c39\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Cơ sở sản xuất lần đầu tiên có thuốc đăng ký lưu hành tại Việt Nam, bao gồm cả trường hợp cơ sở chỉ tham gia một hoặc một số công đoạn của quá trình sản xuất; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9c97278e-f799-40b7-bb4a-2ff1a1da706d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) CPP là bản điện tử của cơ quan có thẩm quyền các nước nhưng khi thẩm định hồ sơ không tra cứu được từ Trang thông tin điện tử hoặc cơ sở dữ liệu mà cơ sở đăng ký cung cấp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b85b4722-2ab1-4164-81e1-d77a14c038e8\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Các trường hợp do Hội đồng yêu cầu thực hiện việc xác thực.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"75557f8c-89b1-4a3a-9421-548682b74702\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Xác minh tính xác thực của giấy tờ pháp lý tại hồ sơ đăng ký thuốc, nguyên liệu làm thuốc trong một số trường hợp khác:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"626e16f9-5127-434f-aa5a-e3b2274f0f27\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với cơ sở đăng ký nước ngoài lần đầu có thuốc, nguyên liệu làm thuốc đăng ký lưu hành tại Việt Nam, Cục Quản lý Dược thực hiện xác minh tính xác thực giấy phép sản xuất, kinh doanh thuốc tại nước sở tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"52583cbd-4927-4659-b54c-ab1fea777751\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Giấy tờ pháp lý của cơ sở đăng ký, cơ sở sản xuất do cơ quan có thẩm quyền nước ngoài cấp chưa đáp ứng theo quy định tại điểm b khoản 1 Điều 22 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1a59d6a7-9996-479f-9f8e-16dbfeefcffd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Đối với thuốc đã được cấp giấy đăng ký lưu hành, Cục Quản lý Dược thực hiện xác minh tính xác thực của các giấy tờ pháp lý khi tiếp nhận thông tin phản ánh liên quan đến tình trạng cấp phép, lưu hành thuốc ở nước sở tại cần xác minh, làm rõ hoặc thông tin về việc không đáp ứng điều kiện hoạt động của cơ sở sản xuất thuốc, cơ sở đăng ký nước ngoài từ các nguồn thông tin sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"64d589f5-bc85-4ab7-a194-3108b080c594\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Văn bản gửi đến Cục Quản lý Dược bao gồm đầy đủ tên, địa chỉ của cơ quan, tổ chức, cá nhân gửi; kèm theo tài liệu liên quan đến thông tin phản ánh;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9d4caddc-534e-47c6-b066-f57a5bab1916\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thông tin từ phương tiện thông tin đại chúng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"dec79993-c45b-42d8-aac0-0b8f771c88be\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Hình thức thực hiện xác minh tính xác thực của CPP và giấy tờ pháp lý nộp trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c04d1dbe-0a1b-4abf-be92-89212eceeb89\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Xác minh tính xác thực giấy tờ pháp lý liên quan đến hợp pháp hóa lãnh sự: Cục Quản lý Dược phối hợp với Cục Lãnh sự - Bộ Ngoại giao hoặc các cơ quan ngoại giao có chức năng hợp pháp hóa lãnh sự của Việt Nam tại nước ngoài để xác minh thẩm quyền, thông tin liên quan đến hợp pháp hóa lãnh sự giấy tờ pháp lý nước ngoài sử dụng tại Việt Nam đối với các trường hợp quy định tại điểm c khoản 1 và điểm a khoản 2 Điều này, trừ trường hợp giấy tờ pháp lý được miễn hợp pháp hóa lãnh sự theo quy định tại điểm c khoản 1 Điều 22 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0005000e-2c78-427c-957f-0a154c3b99c6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Xác minh tính xác thực của nội dung giấy tờ pháp lý: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"0005000e-2c78-427c-957f-0a154c3b99c6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCục Quản lý Dược phối hợp với Cơ quan cấp, ban hành các giấy tờ pháp lý để xác minh các thông tin đã nêu trong các giấy tờ nêu trên đối với các trường hợp quy định tại điểm a, b, d và đ khoản 1 và điểm b khoản 2 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"92602f9f-524a-452a-b1af-2afb964bed98\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Việc xác minh tính xác thực giấy tờ pháp lý được thực hiện đồng thời với thủ tục thẩm định hồ sơ đăng ký thuốc, nguyên liệu làm thuốc hoặc khi tiếp nhận thông tin theo quy định tại khoản 3 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"279f1ac8-9690-47e3-9e46-8abff2f1bf5f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Văn bản đề nghị xác minh tính xác thực giấy tờ pháp lý được gửi đồng thời cho cơ sở đăng ký thuốc. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"641e0bf5-bde6-410f-9c06-a7ddbd045323\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Đối với hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc có giấy tờ pháp lý phải xác minh tính xác thực theo quy định tại khoản 1 và khoản 2 Điều này, thuốc, nguyên liệu làm thuốc chỉ được cấp giấy đăng ký lưu hành khi có kết quả xác minh tính xác thực đạt yêu cầu của cơ quan có thẩm quyền quy định tại khoản 4 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ed94fa03-17d5-4732-a7b5-02bd8ccd79fb\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Đối với hồ sơ đề nghị gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc có giấy tờ pháp lý phải xác minh tính xác thực theo quy định tại khoản 1 và khoản 2 Điều này, không bắt buộc phải có kết quả xác minh tính xác thực trước thời điểm gia hạn hoặc thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"6f9c1506-9440-4093-8850-928952fb33c2\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương II\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eYÊU CẦU VỀ DỮ LIỆU LÂM SÀNG ĐỂ BẢO ĐẢM AN TOÀN, HIỆU QUẢ VÀ\u003c/strong\u003e \u003cstrong\u003eTIÊU CHÍ XÁC ĐỊNH TRƯỜNG HỢP MIỄN THỬ, MIỄN MỘT SỐ GIAI ĐOẠN THỬ THUỐC TRÊN LÂM SÀNG, THUỐC PHẢI THỬ LÂM SÀNG GIAI ĐOẠN 4 TẠI VIỆT NAM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"6f9c1506-9440-4093-8850-928952fb33c2\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"1f900877-006b-4426-b2ae-4cd395ca6a4d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 18. Yêu cầu về dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"23465649-847c-4fdd-a4c2-7744df4de0d7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thuốc đăng ký lưu hành phải có dữ liệu lâm sàng đầy đủ để chứng minh thuốc bảo đảm an toàn, hiệu quả. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"47eb4967-3f78-4178-aa7d-072fba6f3454\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Dữ liệu lâm sàng đầy đủ là dữ liệu nghiên cứu được thực hiện, báo cáo và đánh giá phù hợp với các hướng dẫn của Bộ Y tế hoặc các tổ chức khác mà Việt Nam công nhận (ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên, hướng dẫn của cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f7c9331f-a853-4ce1-bc0a-fb08c25a77a2\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 19. Tiêu chí\u003c/strong\u003e \u003cstrong\u003eđể xác định trường hợp miễn thử lâm sàng tại Việt Nam\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"f7c9331f-a853-4ce1-bc0a-fb08c25a77a2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThuốc được miễn thử lâm sàng trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"675f4952-179b-4ef7-8ae2-a5039dfc3ccb\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thuốc generic đáp ứng một trong các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ba9b46f1-3b02-41eb-b5a0-ec2dc85e6166\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Có dữ liệu chứng minh tương đương sinh học theo hướng dẫn tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/158387\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e07/2022/TT-BYT\u003c/a\u003e;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"e2e26662-6b67-4814-add0-5bd9eab474bf\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Không thuộc trường hợp phải báo cáo số liệu nghiên cứu tương đương sinh học khi đăng ký lưu hành thuốc tại Việt Nam theo quy định tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/158387\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e07/2022/TT-BYT\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"db20e93d-2e94-44d5-a239-6170dc466df5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thuốc mới (trừ vắc xin) đáp ứng đồng thời các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"038582a3-fdf0-4ad9-8681-cbd125eb1649\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đã được cấp phép lưu hành tại ít nhất một nước trên thế giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8a559bef-6486-43fe-ba99-59a1b4b93299\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đã có dữ liệu lâm sàng đầy đủ theo quy định tại Điều 18 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"e5871097-090b-4c55-b73c-81a0a09142b5\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Dữ liệu nghiên cứu lâm sàng đã có đủ thông tin để phân tích, biện giải được về ảnh hưởng của yếu tố chủng tộc người châu Á liên quan đến an toàn, hiệu quả của thuốc theo hướng dẫn của ICH-E5.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"408b3ff1-1937-492b-b324-159fffca5f19\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Thuốc dược liệu đã được cấp giấy đăng ký lưu hành trước ngày 01 tháng 01 năm 2017.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"58c38012-9188-4f22-8961-2ed5d59e9004\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 20. Tiêu chí để xác định trường hợp miễn một số giai đoạn thử thuốc trên lâm sàng tại Việt Nam \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"77bbdf4c-380b-453b-bc6b-968bc89f8f05\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thuốc mới, vắc xin được Bộ trưởng Bộ Y tế xem xét quyết định miễn một số giai đoạn thử thuốc trên lâm sàng tại Việt Nam trên cơ sở ý kiến tư vấn của Hội đồng trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2594b9b2-3dc7-4e85-ac62-462fdad061c7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Để đáp ứng nhu cầu cấp bách cho quốc phòng, an ninh, phòng, chống dịch bệnh, khắc phục hậu quả thiên tai, thảm họa mà trên thị trường chưa có sẵn các thuốc khác có khả năng thay thế; điều trị các bệnh hiếm gặp; bệnh hiểm nghèo;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1a6430bd-f61e-4874-892d-c31cd694593c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đã được cấp phép lưu hành bởi ít nhất một trong số các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này dựa trên hồ sơ lâm sàng miễn giảm theo quy định của các cơ quan này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"551f0979-9853-448e-8557-fecaa6c0a81c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thuốc mới, vắc xin được áp dụng miễn một số giai đoạn thử thuốc trên lâm sàng tại Việt Nam phải đáp ứng đồng thời các tiêu chí sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ad4c032a-ca0b-4f7b-966d-7cf28f720fd9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đã được cấp phép lưu hành tại ít nhất một nước trên thế giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"30daad31-69bf-4a04-b773-c32c8ea8be07\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đã có dữ liệu lâm sàng nhưng chưa đầy đủ theo quy định tại Điều 18 Thông tư này hoặc đã có đầy đủ dữ liệu lâm sàng theo quy định tại Điều 18 Thông tư này nhưng chưa có đánh giá đầy đủ yếu tố chủng tộc có thể ảnh hưởng đến an toàn, hiệu quả của thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"d40f055c-2713-4da6-a4b8-9b0d39b97b4e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 21. Tiêu chí thuốc phải yêu cầu thử lâm sàng giai đoạn 4\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"d40f055c-2713-4da6-a4b8-9b0d39b97b4e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThuốc đã được cấp giấy đăng ký lưu hành nhưng cần đánh giá thêm về an toàn, hiệu quả trên cơ sở ý kiến tư vấn của Hội đồng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"6f9d3bfb-02df-4a3c-8ea1-1a3ecdf5a1de\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương III\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"6f9d3bfb-02df-4a3c-8ea1-1a3ecdf5a1de\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eHỒ SƠ ĐĂNG KÝ THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"3b71e864-845e-4a96-abac-6b1074a50d1b\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eMục 1 \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"3b71e864-845e-4a96-abac-6b1074a50d1b\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG ĐỐI VỚI CÁC TÀI LIỆU TRONG HỒ SƠ ĐĂNG KÝ THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"37c736c6-ad3d-4131-8c83-1a1baec3ec64\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 22. Quy định chung đối với tài liệu hành chính\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a1a4b1ab-7f7d-4799-a74c-8af1c16cb406\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Các tài liệu quy định tại khoản 3, 4, 5, 6 và 7 Điều 26 Thông tư này (sau đây gọi tắt là giấy tờ pháp lý) trong hồ sơ phải đáp ứng các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4c87dc08-7447-45c2-ab22-1d726cde46d9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Giấy tờ pháp lý nộp trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc phải là bản chính hoặc bản sao điện tử theo quy định tại Nghị định số \u003ca href=\"/van-ban/chi-tiet/141950\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e45/2020/NĐ-CP\u003c/a\u003e được sửa đổi, bổ sung bởi Nghị định số \u003ca href=\"/van-ban/chi-tiet/168208\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2024/NĐ-CP\u003c/a\u003e, Nghị định số \u003ca href=\"/van-ban/chi-tiet/168331\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e69/2024/NĐ-CP\u003c/a\u003e, Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e hoặc là bản sao theo quy định tại Nghị định số \u003ca href=\"/van-ban/chi-tiet/52553\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e23/2015/NĐ-CP\u003c/a\u003e của Chính phủ về cấp bản sao từ sổ gốc, chứng thực bản sao từ bản chính, chứng thực chữ ký và chứng thực hợp đồng, giao dịch;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"33539051-6821-4116-b32e-88a3adb7ab80\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Giấy tờ pháp lý có đầy đủ chữ ký, tên người ký, ngày cấp và dấu của cơ quan có thẩm quyền của nước cấp, trừ trường hợp giấy tờ pháp lý không có đủ các thông tin này theo quy định của nước cấp là hợp lệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"739b42f7-a1b3-4b53-ac04-c18513be04a3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Giấy tờ pháp lý do cơ quan có thẩm quyền nước ngoài cấp phải được hợp pháp hóa lãnh sự theo quy định của pháp luật về hợp pháp hóa lãnh sự, trừ các trường hợp được miễn hợp pháp hóa lãnh sự như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"739b42f7-a1b3-4b53-ac04-c18513be04a3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Giấy tờ, tài liệu được miễn hợp pháp hóa lãnh sự theo quy định tại khoản 1, 2 và 3 Điều 9 Nghị định số \u003ca href=\"/van-ban/chi-tiet/27045\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e111/2011/NĐ-CP\u003c/a\u003e của Chính phủ quy định về chứng nhận lãnh sự, hợp pháp hóa lãnh sự được sửa đổi, bổ sung bởi Nghị định số \u003ca href=\"/van-ban/chi-tiet/179275\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e196/2025/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"739b42f7-a1b3-4b53-ac04-c18513be04a3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Các trường hợp Cục Quản lý Dược tự xác định được tính xác thực của giấy tờ, tài liệu đó, bao gồm giấy tờ pháp lý được cung cấp trực tiếp bằng văn bản hoặc qua hòm thư điện tử của Bộ Y tế từ cơ quan có thẩm quyền của nước cấp; giấy tờ pháp lý được cơ quan có thẩm quyền của nước cấp hoặc cơ quan có thẩm quyền cấp khu vực vận hành công bố trên Trang thông tin điện tử hoặc công bố dưới dạng cơ sở dữ liệu tiếng Anh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"739b42f7-a1b3-4b53-ac04-c18513be04a3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký, cơ sở sản xuất nộp kết quả tự tra cứu có đóng dấu xác nhận của cơ sở kèm theo văn bản cung cấp thông tin về đường dẫn tra cứu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4f551e4f-ac81-4788-a2c4-57cea9cf6fa7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Giấy tờ pháp lý phải còn hiệu lực tại thời điểm tiếp nhận ghi trên Giấy tiếp nhận hồ sơ đối với giấy tờ pháp lý có ghi thời hạn hiệu lực. Trường hợp CPP không ghi thời hạn hiệu lực thì thời hạn hiệu lực được tính là 24 tháng kể từ ngày cấp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"edf905ca-00db-46f0-8b5c-32067e750102\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Quy định đối với CPP:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7af38641-11bc-465c-af78-68b978fdd716\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) CPP phải có đủ nội dung theo mẫu của WHO được công bố trên Trang thông tin điện tử của WHO (\u003c/span\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline; color: #000000; font-size: 14.0pt\"\u003ehttps://www.who.int\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8630ce11-562d-4087-b36a-5d2fac5f72ce\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) CPP phải được cấp bởi cơ quan có thẩm quyền của nước sản xuất hoặc bởi cơ quan có thẩm quyền cấp CPP của nước có cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này xác nhận thuốc được cấp phép và lưu hành thực tế tại nước đó;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"18c14530-1d06-4357-837a-ebae4a3d47d0\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Trường hợp để đáp ứng nhu cầu phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh, CPP có thể được thay thế bằng tài liệu khác do cơ quan có thẩm quyền cấp, trong đó xác nhận thuốc được phép lưu hành, sử dụng tại nước sở tại và thể hiện đầy đủ thông tin về tên, địa chỉ cơ sở sản xuất và điều kiện cấp phép;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"e54a75ca-b7eb-43dc-af5f-a069d541b8e3\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Trường hợp CPP chưa đáp ứng quy định tại điểm a, b Khoản này, Bộ trưởng Bộ Y tế xem xét quyết định trên cơ sở ý kiến tư vấn của Hội đồng khi thuốc được cấp phép lưu hành bởi cơ quan có thẩm quyền của ít nhất một nước trên thế giới và thuộc một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"e54a75ca-b7eb-43dc-af5f-a069d541b8e3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc, vắc xin, sinh phẩm để đáp ứng nhu cầu cho quốc phòng, an ninh; phòng, chống dịch, bệnh, khắc phục hậu quả thiên tai, thảm họa, thuốc phục vụ cho chương trình y tế của nhà nước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"e54a75ca-b7eb-43dc-af5f-a069d541b8e3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Vắc xin dùng cho chương trình tiêm chủng mở rộng quốc gia mà trên thị trường không sẵn có vắc xin khác có khả năng thay thế về mặt số lượng, chất lượng, an toàn, hiệu quả hoặc chi phí sử dụng vắc xin;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"e54a75ca-b7eb-43dc-af5f-a069d541b8e3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Các trường hợp đặc biệt khác có văn bản thỏa thuận, công nhận lẫn nhau giữa các cơ quan có thẩm quyền về điều kiện sản xuất, lưu hành thuốc, vắc xin, sinh phẩm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"42536697-9fe0-4de2-b1d5-4c22443394b9\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Các thông tin thể hiện trên CPP phải thống nhất với các thông tin có liên quan trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc. Trường hợp thông tin thể hiện trên CPP chưa thống nhất với tài liệu hành chính trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc, cơ sở đăng ký có văn bản giải trình kèm theo tài liệu chứng minh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b8651d74-a6b9-4283-8e83-745da15adab7\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Quy định đối với đơn đăng ký và hồ sơ, tài liệu hành chính khác:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c9dd72d6-31b0-4acc-9c30-57d51b194124\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đơn đăng ký và hồ sơ, tài liệu khác trong phần hồ sơ hành chính có liên quan phải được ký và đóng dấu (chấp nhận cả chữ ký số), không sử dụng chữ ký dấu; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c5fea898-cb77-420a-903d-b153b9a06c09\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các tài liệu trên phải được ký bởi một trong chức danh sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"c5fea898-cb77-420a-903d-b153b9a06c09\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Chủ tịch Hội đồng thành viên, hội đồng quản trị; tổng giám đốc; giám đốc điều hành; giám đốc cơ sở đăng ký, sản xuất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"c5fea898-cb77-420a-903d-b153b9a06c09\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Người được phân công theo quy định tại điều lệ công ty, văn bản phân công công việc hoặc tài liệu khác chứng minh về thẩm quyền ký của người ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"c5fea898-cb77-420a-903d-b153b9a06c09\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Người được những người quy định tại tiết 1 hoặc tiết 2 điểm này ủy quyền trực tiếp ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7f27ad9e-cf81-47ec-bc3f-9f776aab5d9d\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Quy định đối với thư ủy quyền:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thư ủy quyền đứng tên cơ sở đăng ký phải là bản chính có đầy đủ các nội dung sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên và địa chỉ chủ sở hữu giấy phép lưu hành hoặc cơ sở sản xuất ủy quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên và địa chỉ cơ sở đăng ký được ủy quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên thuốc; nồng độ, hàm lượng dược chất; dạng bào chế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Nội dung ủy quyền. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"10b69dd4-6912-4936-bbc4-86c43d9257c5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong trường hợp ủy quyền nhiều thuốc, thư ủy quyền phải kèm theo danh mục thuốc có đầy đủ thông tin quy định tại tiết 3 điểm này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thư ủy quyền ký tên trên hồ sơ đăng ký thuốc, nguyên liệu làm thuốc phải là bản chính có đầy đủ các nội dung sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên và địa chỉ cơ sở đăng ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên và chức danh người ủy quyền và người được ủy quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên thuốc; nồng độ, hàm lượng dược chất; dạng bào chế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Nội dung ủy quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hiệu lực của thư ủy quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"73be4fb6-f667-4f8b-bd08-9b9efe3b2647\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong trường hợp ủy quyền nhiều thuốc, thư ủy quyền phải kèm theo danh mục thuốc có đầy đủ thông tin quy định tại tiết 3 điểm này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"82a430cc-7dd5-4b2d-923b-4ca1fcf0ced6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Số\u0026nbsp;lượng thư ủy quyền trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"82a430cc-7dd5-4b2d-923b-4ca1fcf0ced6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Trường hợp cơ sở đăng ký khác cơ sở sản xuất, chủ sở hữu giấy phép lưu hành, cơ sở đặt gia công hoặc cơ sở chuyển giao công nghệ, mỗi hồ sơ đăng ký phải nộp kèm thư ủy quyền đứng tên cơ sở đăng ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"82a430cc-7dd5-4b2d-923b-4ca1fcf0ced6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Trường hợp chức danh của người ký tên trên hồ sơ không thuộc một trong các chức danh quy định tại điểm b khoản 3 Điều này, mỗi hồ sơ phải nộp kèm một thư ủy quyền ký tên trên hồ sơ đăng ký thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8e0dbda0-67cd-479b-b94b-d3fc3998335c\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Cơ sở đăng ký thuốc phải có một trong các giấy tờ pháp lý sau: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"69d664c8-8f93-4e66-ad8f-0c0883701616\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với cơ sở đăng ký thuốc của Việt Nam phải có giấy chứng nhận đủ điều kiện kinh doanh dược với một trong các phạm vi kinh doanh: sản xuất, bán buôn, xuất khẩu, nhập khẩu thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a9a8b1f8-f289-492c-9ae5-ae24d6f1a719\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với cơ sở đăng ký thuốc của nước ngoài phải có giấy phép sản xuất, kinh doanh thuốc do cơ quan quản lý nhà nước có thẩm quyền nước ngoài cấp với một trong các phạm vi kinh doanh: sản xuất, bán buôn, xuất khẩu, nhập khẩu thuốc, nguyên liệu làm thuốc và giấy phép thành lập Văn phòng đại diện tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a9a8b1f8-f289-492c-9ae5-ae24d6f1a719\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp tên, địa chỉ của cơ sở đăng ký trên giấy phép thành lập Văn phòng đại diện tại Việt Nam khác với tên, địa chỉ trên giấy tờ pháp lý của cơ sở đăng ký do cơ quan quản lý có thẩm quyền nước ngoài cấp thì phải cung cấp tài liệu chứng minh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a9a8b1f8-f289-492c-9ae5-ae24d6f1a719\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp cơ sở đăng ký thuốc đồng thời là cơ sở sản xuất thuốc ghi trên CPP thì không yêu cầu phải nộp giấy tờ pháp lý theo quy định tại điểm này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a9a8b1f8-f289-492c-9ae5-ae24d6f1a719\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp các nước không cấp giấy phép sản xuất, bán buôn, xuất khẩu, nhập khẩu thuốc, nguyên liệu làm thuốc thì phải có giấy phép thành lập hoặc đăng ký kinh doanh có phạm vi kinh doanh là ít nhất một trong các hình thức sau: sản xuất, bán buôn, xuất khẩu, nhập khẩu thuốc, nguyên liệu làm thuốc kèm theo giấy chứng nhận của cơ quan có thẩm quyền chứng nhận cơ sở đáp ứng điều kiện và đang hoạt động về dược hoặc một trong các giấy chứng nhận thực hành tốt sản xuất thuốc, thực hành tốt phân phối thuốc, thực hành tốt cung cấp thuốc, thực hành tốt bảo quản thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"a9a8b1f8-f289-492c-9ae5-ae24d6f1a719\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐối với cơ sở đăng ký nguyên liệu làm thuốc, trường hợp nước sở tại không cấp giấy phép kinh doanh dược cho các cơ sở kinh doanh nguyên liệu làm thuốc, chấp nhận các giấy phép theo quy định của nước sở tại trong đó có nội dung xác định phạm vi kinh doanh của cơ sở là một trong các hình thức: sản xuất, bán buôn, xuất khẩu, nhập khẩu nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"e43c79f3-c2fd-4447-806e-c91d82a2a9e1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Giấy chứng nhận nguyên liệu làm thuốc được phép sản xuất hoặc lưu hành ở nước sản xuất, bao gồm các thông tin bắt buộc sau: tên nguyên liệu; tên và địa chỉ\u0026nbsp;cơ sở sản xuất; nước sản xuất; chữ ký, dấu và họ tên của người ký giấy xác nhận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"41857c19-7b53-4fbf-ab54-12e51d5d2cf7\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Tài liệu chứng minh cơ sở sản xuất dược chất, tá dược, vỏ nang và dược liệu (để sản xuất thuốc dược liệu) đáp ứng thực hành tốt sản xuất nguyên liệu làm thuốc (GMP) có thể là một trong các loại giấy tờ sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c17976b7-2d30-4dcd-a420-1624dd5ffdfd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Giấy chứng nhận GMP;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"57a92447-7dcb-48d3-ab70-aa512f14335f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Giấy phép sản xuất có xác nhận nội dung cơ sở sản xuất đáp ứng GMP;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"860e923d-271f-4162-a51c-a76045da69fc\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) CPP đối với dược chất có nội dung đáp ứng GMP;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"558cf99f-b9a2-4a46-9c24-68bb6cc15f77\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Các giấy tờ pháp lý khác được cấp bởi cơ quan có thẩm quyền có các nội dung tối thiểu bao gồm: tên và địa chỉ nhà sản xuất, xác nhận cơ sở sản xuất đáp ứng GMP và tên của dược chất, dược liệu, tá dược, vỏ nang;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"af5a0a18-80e6-4bec-b8a0-bf4603927882\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Đối với tá dược trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc: Trường hợp không cung cấp được giấy tờ quy định tại một trong các điểm a, b và d Khoản này, cơ sở sản xuất thuốc thành phẩm, bán thành phẩm thực hiện tự đánh giá việc đáp ứng thực hành tốt sản xuất của cơ sở sản xuất tá dược theo quy định tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/179740\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e28/2025/TT-BYT\u003c/a\u003e của Bộ trưởng Bộ Y tế quy định về thực hành tốt sản xuất thuốc, nguyên liệu làm thuốc và tự công bố trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc về nguyên tắc, tiêu chuẩn thực hành tốt sản xuất mà cơ sở sản xuất tá dược đáp ứng và cam kết chịu trách nhiệm trước pháp luật về công bố này theo Mẫu 05/TT tại Phụ lục IX ban hành kèm theo Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c072f168-f44d-4f71-9951-4cfae026d5d3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ee) Đối với dược liệu trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"c072f168-f44d-4f71-9951-4cfae026d5d3\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp không cung cấp được giấy tờ quy định tại điểm a, b, d Khoản này, cơ sở cung cấp giấy chứng nhận đáp ứng thực hành tốt nuôi trồng thu hái dược liệu (GACP).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"78e64450-a9a0-4730-9dc5-90ebd4660f9d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e8. Mẫu nhãn thuốc, nguyên liệu làm thuốc và tờ hướng dẫn sử dụng thuốc dự kiến\u0026nbsp;lưu hành tại Việt Nam thực hiện theo quy định tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/129483\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2018/TT-BYT\u003c/a\u003e của Bộ trưởng Bộ Y tế quy định ghi nhãn thuốc, nguyên liệu làm thuốc và tờ hướng dẫn sử dụng thuốc được sửa đổi, bổ sung bởi Thông tư số \u003ca href=\"/van-ban/chi-tiet/166468\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e23/2023/TT-BYT\u003c/a\u003e và các quy định cụ thể sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"665244fb-c934-4e34-80af-5b57ddc23f0f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Mẫu nhãn, tờ hướng dẫn sử dụng dự kiến lưu hành phải có dấu xác nhận của Văn phòng đại diện tại Việt Nam hoặc cơ sở đăng ký hoặc cơ sở sản xuất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2034b33c-45d5-4d39-b7d1-f3a9f29fbd1f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Nhãn bao bì ngoài của thuốc, nguyên liệu làm thuốc phải được in mã vạch (Barcode), mã QR, mã DataMatrix hoặc các hình thức in mã khác theo quy định của pháp luật có liên quan trên bao bì ngoài của thuốc, nguyên liệu làm thuốc của các cơ sở sản xuất nhằm quản lý, nhận diện, truy xuất nguồn gốc thuốc, nguyên liệu làm thuốc lưu hành trên thị trường theo lộ trình quy định tại điểm h khoản 1 Điều 55 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9f290dd9-eb55-43e7-be9e-3a6b9940faf1\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Nhãn bao bì ngoài của thuốc, bán thành phẩm thuốc ghi đầy đủ tên và hàm lượng, khối lượng hoặc nồng độ của từng thành phần dược chất, dược liệu trong công thức thuốc, bán thành phẩm thuốc cho một đơn vị chia liều nhỏ nhất hoặc một đơn vị đóng gói nhỏ nhất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"73c6a430-2d19-41fc-9815-882db5aba36a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Đối với các dạng bào chế hoặc đóng gói phải thực hiện nghiên cứu độ ổn định sau khi mở nắp theo hướng dẫn của ACTD hoặc ICH-CTD, hướng dẫn sử dụng phải có thông tin về thời hạn sử dụng và điều kiện bảo quản sau khi mở nắp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"3153f051-4436-4b41-b41c-715129816675\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Đối với sinh phẩm tương tự phải ghi rõ trong mẫu nhãn và tờ hướng dẫn sử dụng là sinh phẩm tương tự với sinh phẩm tham chiếu nào.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"8ab42243-a529-4ae2-9b48-76423191289e\" style=\"margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 23. Quy định chung đối với tài liệu chất lượng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"69d0c9de-b720-434a-853e-8f58922b26e9\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Tiêu chuẩn chất lượng, phương pháp kiểm nghiệm, phiếu kiểm nghiệm và hồ sơ nghiên cứu độ ổn định (áp dụng đối với cả phần hồ sơ dược chất và thuốc thành phẩm) phải là bản chính có dấu xác nhận của cơ sở sản xuất, trường hợp có nhiều cơ sở sản xuất tham gia quá trình sản xuất thành phẩm, chấp nhận dấu của cơ sở chịu trách nhiệm về kiểm tra chất lượng thuốc hoặc xuất xưởng lô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"69d0c9de-b720-434a-853e-8f58922b26e9\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp cơ sở sản xuất không sử dụng con dấu mà sử dụng chữ ký số, cơ sở đăng ký phải thực hiện đóng dấu xác nhận và chịu trách nhiệm trước pháp luật về tính chính xác, hợp pháp, trung thực của tài liệu này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"69d0c9de-b720-434a-853e-8f58922b26e9\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp tài liệu chất lượng của phần hồ sơ dược chất trong hồ sơ đăng ký thuốc thành phẩm được cung cấp dưới dạng hồ sơ điện tử mà không có dấu xác nhận của cơ sở sản xuất dược chất, chấp nhận dấu xác nhận của cơ sở sản xuất thuốc thành phẩm hoặc cơ sở đăng ký; cơ sở xác nhận chịu trách nhiệm trước pháp luật về tính chính xác, hợp pháp, trung thực của tài liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"63e5abfe-a142-4cb2-87a2-c237a9ca5fc3\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Phiếu kiểm nghiệm của thuốc, nguyên liệu làm thuốc phải đáp ứng các yêu cầu sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"de13de5d-a251-44da-beb2-59cca813b6b6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Phiếu kiểm nghiệm phải được thể hiện bằng tiếng Việt hoặc tiếng Anh. Trường hợp Phiếu kiểm nghiệm chưa được thể hiện bằng tiếng Việt hoặc tiếng Anh, phải có bản dịch công chứng ra tiếng Việt hoặc tiếng Anh;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"66dc2a96-1e04-40e6-9d88-7c52e936d3cc\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trường hợp có từ 02 cơ sở trở lên tham gia sản xuất thuốc thì lô thuốc, nguyên liệu làm thuốc phải có phiếu kiểm nghiệm của cơ sở sản xuất hoặc của cơ sở đóng gói cuối cùng hoặc của cơ sở chịu trách nhiệm xuất xưởng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"724d4ed7-b417-4dde-85ea-9dc8a784ccda\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Phiếu kiểm nghiệm phải bao gồm các thông tin sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"724d4ed7-b417-4dde-85ea-9dc8a784ccda\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tên, địa chỉ cơ sở sản xuất, số phiếu kiểm nghiệm, tên và chữ ký của người được giao trách nhiệm, ngày phát hành phiếu kiểm nghiệm. Trường hợp phiếu kiểm nghiệm sử dụng chữ ký điện tử thì phải tuân thủ theo quy định của pháp luật về giao dịch điện tử. Trường hợp Phiếu kiểm nghiệm không thể hiện chữ ký của người được giao trách nhiệm thì chấp nhận phiếu kiểm nghiệm có dấu xác nhận của cơ sở sản xuất. Cơ sở đăng ký phải chịu hoàn toàn trách nhiệm trước pháp luật về tính chính xác, hợp lệ của Phiếu kiểm nghiệm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"724d4ed7-b417-4dde-85ea-9dc8a784ccda\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thông tin về mẫu thuốc, nguyên liệu làm thuốc bao gồm: tên sản phẩm; số lô; hạn dùng thuốc/hạn dùng hoặc thời hạn kiểm tra lại (retest date) đối với nguyên liệu làm thuốc; tiêu chuẩn chất lượng áp dụng; chỉ tiêu chất lượng; yêu cầu chất lượng; kết quả kiểm nghiệm; kết luận về chất lượng lô sản phẩm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"eb1e5fb5-6334-4327-a6fc-c3e280a31bc6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Quy định đối với phiếu kiểm nghiệm, kết quả thẩm định tiêu chuẩn chất lượng, phương pháp kiểm nghiệm bằng thực nghiệm tại cơ sở kiểm nghiệm thuốc, nguyên liệu làm thuốc của nhà nước theo yêu cầu của cơ quan quản lý:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"eb1e5fb5-6334-4327-a6fc-c3e280a31bc6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ePhiếu kiểm nghiệm, kết quả thẩm định tiêu chuẩn chất lượng, phương pháp kiểm nghiệm bằng thực nghiệm phải có xác nhận của cơ sở kiểm nghiệm thuốc, nguyên liệu làm thuốc của nhà nước đáp ứng GLP.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"bc82dc2a-06ff-471c-ac2f-de97b5ceb3e6\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 24. Quy định về tài liệu lâm sàng để bảo đảm an toàn, hiệu quả của thuốc trong hồ sơ đăng ký thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"e98c6741-4617-4d4b-abd8-8b4dd03061ec\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Đối với thuốc hóa dược mới, vắc xin, sinh phẩm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b9b533da-fe93-4df2-9061-df72c125fa28\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Phải có đầy đủ dữ liệu lâm sàng để chứng minh an toàn, hiệu quả đáp ứng các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\" id=\"b9b533da-fe93-4df2-9061-df72c125fa28\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Các nghiên cứu lâm sàng của thuốc, các dữ liệu trong hồ sơ lâm sàng phải phù hợp với hướng dẫn của ICH, Bộ Y tế hoặc hướng dẫn của các tổ chức khác mà Việt Nam công nhận (bao gồm: hướng dẫn của tổ chức quốc tế mà Việt Nam là thành viên, hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\" id=\"b9b533da-fe93-4df2-9061-df72c125fa28\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Dữ liệu lâm sàng (trừ sinh phẩm tương tự với sinh phẩm tham chiếu đã được cấp giấy đăng ký lưu hành tại Việt Nam) phải có đủ thông tin để phân tích, biện giải theo hướng dẫn của ICH-E5.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\" id=\"b9b533da-fe93-4df2-9061-df72c125fa28\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc có sự kết hợp mới của các dược chất phải có dữ liệu lâm sàng đầy đủ theo hướng dẫn phát triển lâm sàng thuốc phối hợp cố định liều của WHO, US-FDA, EMA theo quy định tại Phụ lục I ban hành kèm theo Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"342d62c5-7ae3-4749-981f-d2766da69a35\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Vắc xin có đầy đủ dữ liệu lâm sàng đánh giá tính an toàn, hiệu quả quy định tại điểm a Khoản này nhưng chưa được cấp phép, lưu hành bởi cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này thì phải có dữ liệu lâm sàng liên quan đến đánh giá tính an toàn và tính sinh miễn dịch trên quần thể đích tại Việt Nam trước khi được cấp phép lưu hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"69386d24-3131-452a-999d-7ac53a157aba\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Sinh phẩm tương tự phải có đầy đủ dữ liệu lâm sàng theo hướng dẫn về phát triển sinh phẩm tương tự do Bộ Y tế ban hành hoặc các hướng dẫn của WHO, US-FDA, EMA theo\u0026nbsp;quy định tại Phụ lục I\u0026nbsp;ban hành kèm theo Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"274d2ab0-2832-4b58-8193-9a7c6afceda5\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Đối với sinh phẩm khi thay đổi cơ sở sản xuất (bao gồm cả trường hợp thay đổi địa điểm sản xuất) phải có tài liệu chứng minh tương đương chất lượng của sinh phẩm được sản xuất tại cơ sở sản xuất cũ với sinh phẩm được sản xuất tại cơ sở sản xuất mới theo hướng dẫn của US-FDA, ICH, WHO, EMA, các tổ chức quốc tế mà Việt Nam là thành viên, hướng dẫn của cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"65b780c6-0eed-49c1-9f58-6a6b5b7437d5\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2.\u0026nbsp;Đối với thuốc hóa dược là thuốc mới không phải là biệt dược gốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\" id=\"65b780c6-0eed-49c1-9f58-6a6b5b7437d5\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ePhải có tài liệu lâm sàng đáp ứng một trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ea4b9ef8-29e3-4781-abe9-0bc74e3530d0\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Dữ liệu lâm sàng đáp ứng quy định tại điểm a khoản 1 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8ff1d5f9-48cd-4af2-beda-db02f3c8ed31\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Dữ liệu lâm sàng của thuốc tương tự có cùng dược chất, nồng độ, hàm lượng, dạng bào chế, đường dùng được cấp phép lưu hành bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này do chủ sở hữu dữ liệu lâm sàng cho phép sử dụng. Dữ liệu lâm sàng của thuốc tương tự phải đáp ứng quy định tại\u0026nbsp;điểm a khoản 1 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8404159a-96e2-4a31-a532-e03f8c873004\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Dữ liệu lâm sàng tập hợp từ các công trình nghiên cứu công bố trong tài liệu y khoa là tài liệu khoa học về lĩnh vực y học, bao gồm: các báo cáo nghiên cứu, thử nghiệm lâm sàng; bài báo khoa học; các tạp chí y khoa; tạp chí dược học; các sách chuyên ngành lĩnh vực y học, dược học (sau đây viết tắt là y văn) và dữ liệu về nghiên cứu tương đương sinh học so sánh với thuốc tương tự có cùng dược chất, nồng độ, hàm lượng, dạng bào chế, đường dùng được cấp phép lưu hành bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này và đáp ứng quy định về thuốc đối chứng trong nghiên cứu tương đương sinh học của Bộ Y tế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"36fa732d-1535-4fc1-9cc8-b38e17faf8af\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Đối với thuốc dược liệu là thuốc mới; thuốc dùng đường uống chứa thành phần dược liệu có phối hợp với dược chất là tinh dầu hoặc chất tinh khiết chiết xuất từ tinh dầu (bao gồm cả phương pháp tổng hợp hoặc bán tổng hợp); thuốc có chứa hoạt chất tinh khiết chiết xuất từ dược liệu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\" id=\"36fa732d-1535-4fc1-9cc8-b38e17faf8af\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ePhải có dữ liệu lâm sàng hoặc các dữ liệu trích dẫn từ các tài liệu đáp ứng một trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b7a95d98-79c7-4c5e-885b-979df60a41b1\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Các nghiên cứu lâm sàng của thuốc, các dữ liệu trong hồ sơ lâm sàng phải đáp ứng quy định tại Điều 18 Thông tư này hoặc phù hợp với Hướng dẫn nghiên cứu tiền lâm sàng và lâm sàng thuốc dược liệu của Bộ Y tế quy định tại Phụ lục III ban hành kèm theo Thông tư này hoặc của tổ chức khác mà Việt Nam công nhận, bao gồm: Hướng dẫn nghiên cứu đánh giá an toàn và hiệu quả thuốc dược liệu của WHO (Research guidelines for evaluating the safety and efficacy of herbal medicines) hoặc cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5dd990db-2327-4a2d-918f-9a8d9a3e056c\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Các chuyên luận thuốc, nguyên liệu làm thuốc trong các dược điển, dược thư của Việt Nam hoặc của các nước trên thế giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"038599ec-f611-4491-b695-60c53ce0149e\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Các bài báo đánh giá về tính an toàn, hiệu quả của thuốc được đăng tải trên các tạp chí quốc tế thuộc hệ thống WOS (Web of Science) và Scopus, các dữ liệu lâm sàng tập hợp từ các công trình nghiên cứu công bố trong y văn khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"ebc216b3-f5af-4f2a-ae5f-9df50cfbfa2f\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Báo cáo đánh giá tính an toàn, hiệu quả của đề\u0026nbsp;tài khoa học và công nghệ cấp quốc gia, cấp bộ hoặc cấp tỉnh đã được nghiệm thu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"abba0330-ea2e-4c80-a2f2-daf353796d3f\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Thuốc hóa dược có cùng dược chất, hàm lượng, nồng độ, đường dùng, dạng bào chế với thuốc được cấp phép lưu hành bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này, nhưng có thay đổi chỉ định, chế độ liều, sinh khả dụng hoặc dược động học của thuốc so với thuốc có cùng dược chất đã được cấp giấy đăng ký lưu hành tại Việt Nam thì phải có dữ liệu lâm sàng đáp ứng một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"29785284-100e-455c-942c-259a20637e40\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Dữ liệu lâm sàng đáp ứng quy định tại điểm a khoản 1 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"47609a12-649f-4281-9771-369b0f63be95\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Dữ liệu lâm sàng tập hợp từ các công trình nghiên cứu công bố trong y văn, kèm theo tờ hướng dẫn sử dụng hoặc tóm tắt đặc tính sản phẩm của thuốc có cùng dược chất, hàm lượng, nồng độ, đường dùng, dạng bào chế được cấp phép lưu hành tại một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bc76f76d-74d0-4534-a45e-1b2aec86f4da\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Dữ liệu lâm sàng theo hướng dẫn phát triển lâm sàng đối với thuốc có những cải tiến mới so với thuốc biệt dược gốc theo quy định tại Phụ lục I ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"be322320-27a6-4ce2-a4ee-cab051a6838f\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Các trường hợp được miễn nộp tài liệu an toàn, hiệu quả trong hồ sơ đăng ký thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7c9ea079-8857-4acf-b038-dc43532b1efa\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc generic;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f3e91399-2785-4b86-9fe6-75d2beba9c94\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc hóa dược có cùng dược chất, hàm lượng, nồng độ, đường dùng, dạng bào chế với thuốc được cấp phép lưu hành bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này (kể cả trường hợp thuốc đã ngừng lưu hành không liên quan đến chất lượng, an toàn, hiệu quả của thuốc) và không thuộc trường hợp quy định tại khoản 4 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bcee91ed-8aca-4bc0-802a-19aaf507f8d5\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Sinh phẩm probiotics có nguồn gốc, chủng vi khuẩn, nồng độ, hàm lượng, chỉ định, liều dùng tương tự sinh phẩm được cấp phép bởi một trong các cơ quan quản lý dược quy định tại\u0026nbsp;khoản 9 Điều 2 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d0edd6d6-1cc4-4b51-a36e-1b0916e4e5c0\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Thuốc hóa dược dùng ngoài có tác dụng tại chỗ và có cùng thành phần dược chất, hàm lượng, nồng độ, dạng bào chế, chỉ định với thuốc đã được cấp phép lưu hành tại Việt Nam tối thiểu 30 năm và đã có chuyên luận trong Dược điển Việt Nam hoặc dược điển tham chiếu hoặc Dược thư Quốc gia Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"71c4c20e-4563-4c97-860b-c4a54b968699\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Thuốc dùng ngoài có dược chất là tinh dầu hoặc chất tinh khiết chiết xuất từ tinh dầu (bao gồm cả phương pháp tổng hợp hoặc bán tổng hợp) có cùng thành phần dược chất, hàm lượng, nồng độ, dạng bào chế với thuốc đã được cấp phép lưu hành tại Việt Nam tối thiểu 10 năm hoặc đã được cấp phép và lưu hành tại ít nhất một nước khác trên thế giới tối thiểu 10 năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a246fdc3-ae81-4ceb-a6c6-a16d5a03383e\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ee) Thuốc dùng đường uống chứa thành phần dược liệu có phối hợp với dược chất là tinh dầu hoặc chất tinh khiết chiết xuất từ tinh dầu (bao gồm cả phương pháp tổng hợp hoặc bán tổng hợp) hoặc thuốc có chứa hoạt chất tinh khiết chiết xuất từ dược liệu có cùng thành phần dược chất, dược liệu, hàm lượng, nồng độ, dạng bào chế, chỉ định với thuốc đã được cấp phép lưu hành tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"abfc17c9-0c77-489c-a13f-3b774fffb899\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eg) Thuốc dược liệu có cùng thành phần dược liệu, hàm lượng, nồng độ, khối lượng dược liệu, dạng bào chế, chỉ định, đường dùng với thuốc được cấp phép lưu hành bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này hoặc thuốc đã được cấp giấy đăng ký lưu hành tại Việt Nam (bao gồm cả trường hợp giấy đăng ký lưu hành đã hết hiệu lực);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bea3d525-5300-44f2-9e76-90dcd7d56835\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eh) Thuốc mới (trừ vắc xin) sản xuất trong nước có chỉ định sử dụng phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh và có cùng hoạt chất, dạng bào chế, đường dùng, chỉ định với thuốc đã được cấp phép lưu hành hoặc cấp phép sử dụng trong trường hợp khẩn cấp hoặc cấp phép lưu hành, sử dụng có điều kiện bởi một trong các cơ quan quản lý dược quy định tại khoản 9 Điều 2 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8f32e99f-a7b7-4d43-bdf8-eb1c61011c14\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Các thuốc không thuộc trường hợp quy định tại các khoản 1, 2, 3, 4 và 5 Điều này khi đăng ký lưu hành phải có dữ liệu lâm sàng để bảo đảm an toàn, hiệu quả của thuốc phù hợp với hướng dẫn của ICH, WHO, US-FDA, EMA, Bộ Y tế hoặc hướng dẫn của các tổ chức khác mà Việt Nam công nhận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7573f9d5-72a7-4d54-b1bc-3452ac206325\" style=\"text-align: justify; margin: 3.0pt 0 4.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Trong trường hợp nghiên cứu lâm sàng được thực hiện trước thời điểm có quy định, hướng dẫn về nghiên cứu phát triển thuốc quy định tại điểm a khoản 1 và điểm a khoản 3 Điều này thì được xem xét chấp nhận dữ liệu của nghiên cứu để thẩm định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-section\" id=\"734fc6f0-179c-459f-90a1-1d12ee202efd\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eMục 2\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"734fc6f0-179c-459f-90a1-1d12ee202efd\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH VỀ CẤU TRÚC VÀ CÁC THÀNH PHẦN TRONG HỒ SƠ ĐĂNG KÝ THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"67826cf2-77a8-4408-aa2b-63a8ca10b8a9\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 25. Cấu trúc của bộ hồ sơ\u003c/strong\u003e \u003cstrong\u003eđăng ký thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b916f30e-4b2c-4940-8050-e58d9ff54a0c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ đăng ký thuốc thực hiện theo hồ sơ kỹ thuật
