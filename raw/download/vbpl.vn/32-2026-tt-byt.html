94d1-08d6e8a618f8\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành nguyên liệu làm thuốc: 10 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Kể từ ngày nhận được biên bản họp Hội đồng, Cục Quản lý Dược cấp giấy đăng ký lưu hành theo Mẫu 6A/TT tại Phụ lục IX ban hành kèm theo Thông tư này đối với hồ sơ đạt yêu cầu; có văn bản thông báo cho cơ sở đăng ký thuốc theo kết luận của Hội đồng đối với hồ sơ chưa đạt, không đạt trong thời hạn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc: 35 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc áp dụng hình thức tham chiếu kết quả thẩm định: 35 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ: 15 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ: 35 ngày đối với hồ sơ nộp lần đầu, 20 ngày đối với hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc mới có chỉ định sử dụng phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh: 02 ngày làm việc đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc thuộc trường hợp ưu tiên về thủ tục hành chính quy định tại khoản 5 Điều 7 Luật Dược: 15 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"fede8549-f588-417e-9d3e-e349ab2afa11\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành nguyên liệu làm thuốc: 15 ngày đối với hồ sơ nộp lần đầu hoặc hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"69c9d75f-a343-42f9-ad69-618bdd5a5543\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 46. Thủ tục gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"1a17522e-e5d7-4314-9c25-ac54da9cc680\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hình thức nộp hồ sơ: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"1a17522e-e5d7-4314-9c25-ac54da9cc680\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký thực hiện nộp hồ sơ theo quy định tại Điều 15 Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"c214ed72-74af-4065-9a3c-a79a7bfb55bb\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Tiếp nhận và thời gian giải quyết hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4d30c617-d448-4249-ba67-773052434590\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Tiếp nhận hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"4d30c617-d448-4249-ba67-773052434590\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKhi nhận đủ hồ sơ, Cục Quản lý Dược cấp cho cơ sở đăng ký thuốc giấy tiếp nhận hồ sơ theo quy định;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2ebf38e2-34fe-4be6-87ee-f790cd11271d\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thời gian giải quyết hồ sơ kể từ ngày tiếp nhận: không quá 03 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"004a8dab-6312-4162-9dec-8a6c10e4be08\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Tổ chức thẩm định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"9eed46c7-617a-4625-9dad-5444de5c3ea6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Trong thời hạn 03 ngày làm việc kể từ ngày tiếp nhận hồ sơ theo quy định tại khoản 2 Điều này, Cục Quản lý Dược tiến hành rà soát, phân loại và chuyển hồ sơ cho các chuyên gia thẩm định hoặc các đơn vị tổ chức thẩm định;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"08658bda-a754-4ae0-bb57-5ec0f7577513\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trong thời hạn 01 tháng kể từ ngày nhận được hồ sơ từ Cục Quản lý Dược, các chuyên gia và đơn vị tổ chức thẩm định tổ chức thẩm định, hoàn thành biên bản thẩm định và gửi Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"76bc0d7b-ea59-4869-a61e-6bd5c1f4cb27\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Xử lý sau thẩm định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"397e1eb4-60f2-4906-b6fa-7b64f86217f7\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với hồ sơ gia hạn quy định tại điểm b khoản 1 Điều 43 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"397e1eb4-60f2-4906-b6fa-7b64f86217f7\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong thời hạn 15 ngày kể từ ngày nhận được biên bản thẩm định, trên cơ sở tổng hợp ý kiến thẩm định của các chuyên gia, các đơn vị tổ chức thẩm định và các quy định hiện hành, Cục Quản lý Dược có văn bản thông báo cho cơ sở đăng ký thuốc để bổ sung tài liệu đối với các hồ sơ thẩm định chưa đạt yêu cầu hoặc chuyển Hội đồng đối với các hồ sơ có kết quả thẩm định đạt, không đạt, cần xin ý kiến và được Cục Quản lý Dược đề xuất gia hạn, không gia hạn hoặc xin ý kiến Hội đồng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"16d598c2-95c1-46ef-8df4-a2e1d3f75972\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với hồ sơ gia hạn quy định tại điểm a khoản 2 Điều 43 Thông tư này, trên cơ sở tổng hợp ý kiến thẩm định của các chuyên gia, các đơn vị tổ chức thẩm định và các quy định hiện hành, Cục Quản lý Dược thực hiện:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"16d598c2-95c1-46ef-8df4-a2e1d3f75972\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Có văn bản thông báo cho cơ sở đăng ký để bổ sung tài liệu đối với các hồ sơ thẩm định chưa đạt yêu cầu hoặc có văn bản thông báo không gia hạn đối với hồ sơ không đạt yêu cầu trong thời hạn 10 ngày.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"16d598c2-95c1-46ef-8df4-a2e1d3f75972\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Gia hạn giấy đăng ký lưu hành theo Mẫu 6B/TT tại Phụ lục IX ban hành kèm theo Thông tư này đối với hồ sơ đạt yêu cầu trong thời hạn 15 ngày.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4719f1b7-8253-41e0-96ae-e9735e1d8ba4\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Họp Hội đồng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"4719f1b7-8253-41e0-96ae-e9735e1d8ba4\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong thời hạn 15 ngày kể từ ngày nhận được tài liệu từ Cục Quản lý Dược, Văn phòng Hội đồng tổ chức họp Hội đồng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"05d15a5e-ca99-41c9-88ac-affebbfe7cbf\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Xử lý sau họp Hội đồng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"35421c18-37e8-4b90-a7c0-73dfa45097d4\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Trong thời hạn 10 ngày kể từ ngày họp Hội đồng, Văn phòng Hội đồng hoàn thiện và gửi biên bản họp Hội đồng về Cục Quản lý Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b3b0980f-7d3c-4922-bfcc-f6fc3cf88d36\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trong thời hạn 15 ngày kể từ ngày nhận được biên bản họp Hội đồng, Cục Quản lý Dược gia hạn giấy đăng ký lưu hành theo Mẫu 6B/TT tại Phụ lục IX ban hành kèm theo Thông tư này đối với hồ sơ đạt yêu cầu; có văn bản thông báo cho cơ sở đăng ký thuốc theo kết luận của Hội đồng đối với hồ sơ chưa đạt, không đạt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"67d6b5df-4b87-49f7-b20f-f04c986c3e60\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 47. Thủ tục thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3bff8014-1e2c-4a38-9535-1c5e41377afd\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hình thức nộp hồ sơ: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"3bff8014-1e2c-4a38-9535-1c5e41377afd\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký thực hiện nộp hồ sơ theo quy định tại Điều 15 Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"74a55f7d-edd7-4fdf-a422-135353660322\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Tiếp nhận và thời gian giải quyết hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2cacb39c-e97a-458a-927c-c6a291989c20\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Tiếp nhận hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"2cacb39c-e97a-458a-927c-c6a291989c20\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKhi nhận đủ hồ sơ, Cục Quản lý Dược cấp cho cơ sở đăng ký thuốc giấy tiếp nhận hồ sơ theo quy định;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8555a46f-6fce-4d0f-929f-eb0f38c95276\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thời gian giải quyết hồ sơ kể từ ngày tiếp nhận:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"8555a46f-6fce-4d0f-929f-eb0f38c95276\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại khoản 3 Điều 43 Thông tư này: không quá 20 ngày.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"8555a46f-6fce-4d0f-929f-eb0f38c95276\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại điểm c khoản 1 và điểm b khoản 2 Điều 43 Thông tư này: không quá 03 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0490fa0f-6920-4217-ad59-b06d82d1d94b\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Tổ chức thẩm định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"3478547d-f5fe-4bac-a7a6-cc1982213b6d\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Kể từ ngày tiếp nhận hồ sơ theo quy định tại khoản 2 Điều này, Cục Quản lý Dược thực hiện công khai đối với hồ sơ quy định tại khoản 3 Điều 43 Thông tư này trong thời hạn 20 ngày; tiến hành rà soát, phân loại và chuyển hồ sơ cho các chuyên gia thẩm định hoặc các đơn vị tổ chức thẩm định đối với hồ sơ quy định tại điểm c khoản 1 hoặc điểm b khoản 2 Điều 43 Thông tư này trong thời hạn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"3478547d-f5fe-4bac-a7a6-cc1982213b6d\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại điểm c khoản 1 Điều 43 Thông tư này: 03 ngày làm việc đối với hồ sơ nộp lần đầu, 02 ngày làm việc đối với hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"3478547d-f5fe-4bac-a7a6-cc1982213b6d\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại điểm b khoản 2 Điều 43 Thông tư này: 03 ngày làm việc đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c1ee3b8d-46d5-469c-8cbb-6cde5d35f5a9\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Kể từ ngày nhận được hồ sơ từ Cục Quản lý Dược, các chuyên gia và đơn vị tổ chức thẩm định tổ chức thẩm định, hoàn thành biên bản thẩm định và gửi Cục Quản lý Dược trong thời hạn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.5pt 0 2.5pt\" id=\"c1ee3b8d-46d5-469c-8cbb-6cde5d35f5a9\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại điểm c khoản 1 Điều 43 Thông tư này: 01 tháng đối với hồ sơ nộp lần đầu, 15 ngày đối với hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"c1ee3b8d-46d5-469c-8cbb-6cde5d35f5a9\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ quy định tại điểm b khoản 2 Điều 43 Thông tư này: 01 tháng đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"247a98f5-8326-4129-9332-c10b06dd0bc7\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Xử lý sau thẩm định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"adefb373-23e7-429a-b6a5-880a079eaf31\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với hồ sơ thay đổi, bổ sung quy định tại điểm c khoản 1 Điều 43 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"adefb373-23e7-429a-b6a5-880a079eaf31\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKể từ ngày nhận được biên bản thẩm định, trên cơ sở tổng hợp ý kiến thẩm định của các chuyên gia, các đơn vị tổ chức thẩm định và các quy định hiện hành, Cục Quản lý Dược ban hành văn bản thông báo cho cơ sở đăng ký thuốc để bổ sung tài liệu đối với các hồ sơ thẩm định chưa đạt yêu cầu hoặc chuyển Hội đồng đối với các hồ sơ có kết quả thẩm định đạt, không đạt, cần xin ý kiến và được Cục Quản lý Dược đề xuất phê duyệt, không phê duyệt hoặc xin ý kiến Hội đồng trong thời hạn: 15 ngày đối với hồ sơ nộp lần đầu, 10 ngày đối với hồ sơ nộp bổ sung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"6ea4f51c-3529-48ae-acc9-92da114984c6\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Đối với hồ sơ thay đổi, bổ sung quy định tại điểm b khoản 2 Điều 43 Thông tư này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"6ea4f51c-3529-48ae-acc9-92da114984c6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKể từ ngày nhận được biên bản thẩm định, trên cơ sở tổng hợp ý kiến thẩm định của các chuyên gia, các đơn vị tổ chức thẩm định và các quy định hiện hành, Cục Quản lý Dược ban hành văn bản thông báo cho cơ sở đăng ký để bổ sung tài liệu đối với các hồ sơ thẩm định chưa đạt yêu cầu và ban hành văn bản phê duyệt nội dung thay đổi, bổ sung giấy đăng ký lưu hành đối với hồ sơ đạt yêu cầu hoặc văn bản thông báo không phê duyệt đối với hồ sơ không đạt yêu cầu trong thời hạn: 25 ngày đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ab0e28bb-56b2-46a6-ba88-e0e2daf3aab4\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Họp Hội đồng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"ab0e28bb-56b2-46a6-ba88-e0e2daf3aab4\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong thời hạn 15 ngày kể từ ngày nhận được tài liệu từ Cục Quản lý Dược, Văn phòng Hội đồng tổ chức họp Hội đồng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7ecd478f-6d37-49c0-a60b-3fcf6660e131\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Xử lý sau họp Hội đồng:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b44f475f-7341-47f2-8fe0-c1ca43cd4724\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Trong thời hạn 10 ngày kể từ ngày họp Hội đồng, Văn phòng Hội đồng hoàn thiện và gửi biên bản họp Hội đồng về Cục Quản lý Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"73c32eab-95e6-438b-91e9-5b504864f9d2\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Trong thời hạn 15 ngày đối với hồ sơ nộp lần đầu và 08 ngày đối với hồ sơ nộp bổ sung kể từ ngày nhận được biên bản họp Hội đồng, Cục Quản lý Dược ban hành văn bản phê duyệt nội dung thay đổi, bổ sung giấy đăng ký lưu hành đối với hồ sơ đạt yêu cầu; có văn bản thông báo cho cơ sở đăng ký thuốc theo kết luận của Hội đồng đối với hồ sơ chưa đạt, không đạt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"a3de54ce-4fe9-466e-bff1-62e9beaf0d20\" style=\"text-align: center; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương V\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 2.0pt 0 2.0pt\" id=\"a3de54ce-4fe9-466e-bff1-62e9beaf0d20\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eHỒ SƠ, THỦ TỤC THU HỒI GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC, NGUYÊN LIỆU LÀM THUỐC\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"29526c97-12b7-47d2-b70f-0b84de11a8d8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-family: 'Times New Roman Bold', serif; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 48. Hồ sơ thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"5cd52607-6fe2-4ce1-a390-c0ef353d05ff\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thu hồi giấy đăng ký lưu hành thuốc quy định tại điểm a, b khoản 1 Điều 58 Luật Dược, hồ sơ bao gồm: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"5cd52607-6fe2-4ce1-a390-c0ef353d05ff\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eVăn bản thu hồi thuốc của cơ quan quản lý có thẩm quyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9a39d834-ca72-4adf-96f2-27a0169e73ea\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc quy định tại\u0026nbsp;điểm d, đ khoản 1 Điều 58 Luật Dược, hồ sơ bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"9a39d834-ca72-4adf-96f2-27a0169e73ea\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKết luận bằng văn bản của cơ quan quản lý có thẩm quyền về việc hồ sơ của thuốc đã được cấp giấy đăng ký lưu hành là hồ sơ giả mạo hoặc thuốc, nguyên liệu làm thuốc được sản xuất không đúng địa chỉ theo hồ sơ đăng ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"ac9bce42-6939-4c8a-9f61-ad9bdb74b184\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc quy định tại\u0026nbsp;điểm c khoản 1 Điều 58 Luật Dược, hồ sơ gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"ac9bce42-6939-4c8a-9f61-ad9bdb74b184\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThông báo của cơ quan có thẩm quyền cấp CPP về việc thu hồi CPP mà giấy đó là căn cứ để Cục Quản lý Dược cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"97e5fd42-861c-4d71-8de6-dafedc35561e\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc quy định tại\u0026nbsp;điểm e khoản 1 Điều 58 Luật Dược, hồ sơ gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"97e5fd42-861c-4d71-8de6-dafedc35561e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThông báo của WHO, cơ quan quản lý có thẩm quyền của Việt Nam hoặc nước xuất xứ của thuốc, nguyên liệu làm thuốc khuyến cáo không an toàn, hiệu quả cho người sử dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"82bcc824-17c2-4753-ad98-dd3b968dd266\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc quy định tại\u0026nbsp;điểm g khoản 1 Điều 58 Luật Dược, hồ sơ gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"82bcc824-17c2-4753-ad98-dd3b968dd266\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eĐơn đề nghị thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc tại Việt Nam của cơ sở sản xuất hoặc cơ sở đăng ký thuốc theo\u0026nbsp;Mẫu 07/TT tại Phụ lục IX ban hành kèm theo Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"896f1cfd-ae1b-42f6-a86b-b5781cf5df87\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-family: 'Times New Roman Bold', serif; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 49. Thủ tục thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"69bb6ded-782e-4a0b-866b-b8d32b95b042\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Trong thời hạn tối đa 30 ngày kể từ ngày nhận được hồ sơ quy định tại khoản 1 Điều 48 Thông tư này, Cục Quản lý Dược ra quyết định thu hồi giấy đăng ký lưu hành thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d33f7e60-b381-4c4c-9952-8a1ceaff2519\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Trong thời hạn tối đa 30 ngày kể từ ngày nhận được hồ sơ quy định tại khoản 2 Điều 48 Thông tư này, Cục Quản lý Dược ra quyết định thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"866e939a-28ef-4926-8247-2e6c8e5f4428\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Trong thời hạn tối đa 10 ngày kể từ ngày nhận được hồ sơ quy định tại khoản 3 và khoản 4 Điều 48 Thông tư này, Cục Quản lý Dược ra quyết định thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0325b94a-2a94-44af-8878-79028699ae56\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Trong thời hạn tối đa 20 ngày kể từ ngày nhận được hồ sơ quy định tại khoản 5 Điều 48 Thông tư này, Cục Quản lý Dược ra quyết định thu hồi giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"75417c84-6179-4858-babb-98910d5a1758\" style=\"text-align: center; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương VI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eQUY ĐỊNH VỀ TỔ CHỨC, HOẠT ĐỘNG CỦA HỘI ĐỒNG TƯ VẤN CẤP GIẤY ĐĂNG KÝ LƯU HÀNH THUỐC, NGUYÊN LIỆU LÀM THUỐC; ĐƠN VỊ TỔ CHỨC THẨM ĐỊNH, CHUYÊN GIA THẨM ĐỊNH\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"75417c84-6179-4858-babb-98910d5a1758\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"1a765451-1293-492b-9888-402025d98ef8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 50. Tổ chức, hoạt động của Hội đồng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d6bb53b6-c55e-4bf9-bc7e-ad90bc36e499\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Bộ trưởng Bộ Y tế thành lập Hội đồng tư vấn cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc. Thành viên Hội đồng là các chuyên gia có trình độ chuyên môn và kinh nghiệm phù hợp bảo đảm khả năng thẩm định hồ sơ, phản biện ý kiến của chuyên gia thẩm định, ý kiến đề xuất của Cục Quản lý Dược và tư vấn cho Bộ trưởng Bộ Y tế các vấn đề liên quan đến pháp chế dược, hồ sơ về chất lượng, an toàn, hiệu quả của thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"dc420ff3-91b5-4f03-9d67-1fb18aa8c11c\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Hội đồng có trách nhiệm tư vấn cho Bộ trưởng Bộ Y tế và chịu trách nhiệm trước Bộ trưởng Bộ Y tế và trước pháp luật về các ý kiến thẩm định, tư vấn trong việc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c8187ee1-db2a-42d5-b920-17c27b13a32a\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc trên cơ sở kết quả thẩm định của chuyên gia, ý kiến đề xuất của Cục Quản lý Dược và các vấn đề liên quan do Bộ trưởng Bộ Y tế yêu cầu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"561135b5-cd49-42b0-ad88-4fdb0a490db1\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Cấp giấy phép nhập khẩu thuốc chưa có giấy đăng ký lưu hành tại Việt Nam đối với các hồ sơ đề nghị cấp phép nhập khẩu thuốc do Bộ Y tế tiếp nhận và giải quyết trên cơ sở kết quả thẩm định của chuyên gia, ý kiến đề xuất của Cục Quản lý Dược và các vấn đề liên quan do Bộ trưởng Bộ Y tế yêu cầu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"804f250b-f938-4ac8-ab38-8c9bf170804a\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Đánh giá sự phù hợp của nguyên tắc, tiêu chuẩn Thực hành tốt sản xuất thuốc của nước xuất khẩu không thuộc một trong các nguyên tắc, tiêu chuẩn về sản xuất đã được Bộ trưởng Bộ Y tế ban hành hoặc thừa nhận áp dụng theo quy định tại điểm c khoản 1 Điều 97 Nghị định số \u003ca href=\"/van-ban/chi-tiet/179702\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e163/2025/NĐ-CP\u003c/a\u003e;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8425fcf6-16d0-45da-ab2b-3a565bfb19c0\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Đề xuất các chủ trương, chính sách liên quan đến cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, các vấn đề liên quan đến bảo đảm chất lượng, an toàn, hiệu quả của thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f993a08f-c697-4680-9cc9-ddb00eaa530b\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Tổ chức, hoạt động của Hội đồng, cơ chế phối hợp giữa Hội đồng và chuyên gia thẩm định trong quá trình giải quyết hồ sơ đăng ký thuốc, hồ sơ đề nghị cấp giấy phép nhập khẩu thuốc chưa có giấy đăng ký lưu hành tại Việt Nam quy định tại Phụ lục VI ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"17bd8499-ccd8-4ec7-8480-795bee329c5c\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Quản lý xung đột lợi ích của thành viên Hội đồng quy định tại Phụ lục VII ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"173c28fb-28ad-4129-addf-c04d1efa8081\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Kinh phí hoạt động của Hội đồng được thực hiện theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"51bad294-ca0c-4571-a2b6-68250f5f6b3e\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Thường trực Hội đồng đặt tại Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"da4cc50c-c6e0-494c-99e0-c06125997a3b\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 51. Tổ chức, hoạt động của đơn vị tổ chức thẩm định, chuyên gia thẩm định\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"2fcfa013-6bc5-4ab4-a558-6f669546db91\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Cục Quản lý Dược, đơn vị tổ chức thẩm định thành lập các tiểu ban chuyên gia thẩm định các tài liệu liên quan trong hồ sơ đăng ký thuốc, nguyên liệu làm thuốc về pháp chế, tiêu chuẩn chất lượng, bào chế, dược lý, lâm sàng, tương đương sinh học và danh sách chuyên gia trong các tiểu ban thẩm định hồ sơ đề nghị cấp, gia hạn, thay đổi, bổ sung thuốc, nguyên liệu làm thuốc. Cơ cấu các tiểu ban chuyên gia thẩm định phải phù hợp với phân loại sản phẩm đăng ký và hình thức đăng ký.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"16ee1600-faf8-466f-a00e-e219e090a0d4\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Trách nhiệm, tổ chức và hoạt động của đơn vị tổ chức thẩm định, chuyên gia thẩm định quy định tại Phụ lục VIII ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8d7ef3c4-4770-4ce5-b390-94ade885970e\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Quản lý xung đột lợi ích của chuyên gia thẩm định quy định tại Phụ lục VII ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"e87a61f4-54dd-4e47-80cf-c97282eac8a1\" style=\"text-align: justify; margin: 3.0pt 0 3.0pt; line-height: 1.05\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Kinh phí tổ chức thẩm định hồ sơ được thực hiện theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" id=\"7b1d3cda-f671-49e3-9a38-849238c9c713\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eChương VII\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 3.0pt 0 2.7pt\" id=\"7b1d3cda-f671-49e3-9a38-849238c9c713\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐIỀU KHOẢN THI HÀNH\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"f9172c76-0c1e-4cb8-a548-22de183d199a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 52. Hiệu lực thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"480070f4-1a8d-4d53-b77a-7a8f691362ec\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 10 năm 2026.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"bdb67bbb-36a8-4ebe-ad51-df2e7b73c278\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Các quy định và Thông tư sau đây hết hiệu lực kể từ ngày Thông tư này có hiệu lực:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"fadf4ce6-b02b-4219-9c26-9ae390418ba0\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thông tư số \u003ca href=\"/van-ban/chi-tiet/177797\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e12/2025/TT-BYT\u003c/a\u003e của Bộ trưởng Bộ Y tế quy định việc đăng ký lưu hành thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c20da973-0907-490b-b9a8-98b16412b351\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Tiết 1 điểm a khoản 1 Điều 16 và tiết 2 điểm c khoản 3 Điều 29 Thông tư số \u003ca href=\"/van-ban/chi-tiet/129483\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2018/TT-BYT\u003c/a\u003e;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"c45fbe5e-60ad-4869-9fe9-c5ceab40f38c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Khoản 8 Điều 1 và khoản 10 Điều 1 Thông tư số \u003ca href=\"/van-ban/chi-tiet/166468\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e23/2023/TT-BYT\u003c/a\u003e của Bộ trưởng Bộ Y tế sửa đổi, bổ sung một số điều tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/129483\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2018/TT-BYT\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"db314883-5ad2-4384-a92a-af3173e2fe31\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Đối với nguyên liệu làm thuốc là tá dược, vỏ nang chưa có giấy đăng ký lưu hành để sản xuất thuốc theo hồ sơ đăng ký thuốc được cấp giấy đăng ký lưu hành thuốc trước ngày 20 tháng 10 năm 2022 mà chưa được công bố trên Trang thông tin điện tử của Cục Quản lý Dược, cơ sở có nhu cầu nhập khẩu nguyên liệu làm thuốc là tá dược, vỏ nang về Việt Nam để sản xuất thuốc này:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"db314883-5ad2-4384-a92a-af3173e2fe31\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký cập nhật toàn bộ thông tin về nguyên liệu làm thuốc là tá dược, vỏ nang trong hồ sơ đã được phê duyệt lên hệ thống dịch vụ công trực tuyến của Cục Quản lý Dược. Trong thời gian 05 ngày làm việc kể từ ngày cơ sở cập nhật thông tin lên hệ thống, Cục Quản lý Dược phải hoàn thành việc công bố nguồn nguyên liệu làm thuốc là tá dược, vỏ nang trên Trang thông tin điện tử của Cục Quản lý Dược. Cơ sở đăng ký chịu trách nhiệm về tính chính xác của thông tin cập nhật so với thông tin trong hồ sơ đăng ký đã được phê duyệt và không bắt buộc phải cập nhật lại thông tin ở lần nhập khẩu tiếp theo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4ea9e4d0-42ef-41d6-8270-53a50b7e2d43\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Đối với thuốc, nguyên liệu làm thuốc đã được cấp giấy đăng ký lưu hành trước ngày 01 tháng 01 năm 2023, chậm nhất sau 12 tháng kể từ ngày thuốc, nguyên liệu làm thuốc được gia hạn giấy đăng ký lưu hành, nhãn thuốc, nguyên liệu làm thuốc phải ghi số đăng ký theo cấu trúc quy định tại Phụ lục V ban hành kèm theo Thông tư này. Trong thời gian 12 tháng kể từ ngày thuốc, nguyên liệu làm thuốc được gia hạn giấy đăng ký lưu hành, việc ghi số đăng ký được áp dụng như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"605fb422-9ec7-4da9-9a80-39cb4736bd93\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc, nguyên liệu làm thuốc sản xuất trong nước được tiếp tục sản xuất và lưu hành cho đến hết hạn dùng của thuốc với nhãn thuốc, nguyên liệu làm thuốc ghi số đăng ký cũ đã cấp trước khi gia hạn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"12773667-01dd-43bf-b53e-fefd2b2c98f2\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc, nguyên liệu làm thuốc nhập khẩu được phép tiếp tục nhập khẩu và lưu hành với nhãn thuốc, nguyên liệu làm thuốc ghi số đăng ký cũ đã cấp trước khi gia hạn trong trường hợp được giao hàng tại cảng đi của nước xuất khẩu trước ngày phải ghi số đăng ký theo quy định tại Khoản này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"69e68948-9244-447e-99e7-5fdbb89a984f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Các thuốc đã được phân loại là thuốc kê đơn, không kê đơn trước ngày Thông tư này có hiệu lực không phải thực hiện lại việc phân loại trong thời gian giấy đăng ký lưu hành còn hiệu lực. Thuốc sẽ được xem xét về phân loại thuốc kê đơn, không kê đơn theo quy định tại Thông tư này khi gia hạn giấy đăng ký lưu hành thuốc. Trường hợp có đề nghị thay đổi phân loại thuốc kê đơn, không kê đơn, cơ sở đăng ký thực hiện theo quy định tại Phụ lục II ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d374fc37-8796-457d-b4ce-edbf27ce7717\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Đối với hồ sơ đăng ký thuốc đã nộp tại Cục Quản lý Dược trước ngày Thông tư này có hiệu lực nhưng chưa được cấp, gia hạn giấy đăng ký lưu hành được xem xét về việc phân loại thuốc không kê đơn theo quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"95bfa043-9f66-437e-a1a4-2caba1501b48\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 53. Điều khoản chuyển tiếp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"33f2e1cd-e3e0-472c-9d0a-98b04a7b448b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hồ sơ đăng ký thuốc, nguyên liệu làm thuốc đã nộp trước ngày Thông tư này có hiệu lực thi hành được tiếp tục thực hiện theo quy định tại thời điểm nộp hồ sơ hoặc áp dụng quy định tại Thông tư này kể từ ngày Thông tư này có hiệu lực thi hành theo hướng thuận tiện, đơn giản hóa thủ tục hành chính cho doanh nghiệp, tổ chức, cá nhân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"7039e2a4-4d47-46ac-8060-ccf352d9197a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Thuốc đã được phân loại là biệt dược gốc; sinh phẩm tham chiếu; thuốc có chứng minh tương đương sinh học; thuốc được sản xuất toàn bộ các công đoạn tại Việt Nam trên dây chuyền sản xuất thuốc đáp ứng nguyên tắc, tiêu chuẩn EU-GMP hoặc tương đương và được cơ quan quản lý dược của nước thuộc danh sách SRA hoặc EMA cấp phép lưu hành trước ngày Thông tư này có hiệu lực thi hành được tiếp tục giữ phân loại trong thời hạn hiệu lực sử dụng của giấy đăng ký lưu hành, trừ trường hợp được Cục Quản lý Dược xem xét việc điều chỉnh, cập nhật thay đổi, bổ sung thông tin đã công bố trên Trang thông tin điện tử của Cục Quản lý Dược khi có đề nghị của cơ sở đăng ký thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"2d7190e1-1d00-4ce7-a76c-4d6e8e56af44\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 54. Điều khoản tham chiếu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"2d7190e1-1d00-4ce7-a76c-4d6e8e56af44\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong trường hợp các văn bản quy phạm pháp luật và các quy định được viện dẫn trong Thông tư này được sửa đổi, bổ sung hoặc thay thế thì áp dụng theo văn bản quy phạm pháp luật mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"722c91de-d35e-4051-a5b9-3638089d91de\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 55. Tổ chức thực hiện\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"5bc1bf90-a27e-4f19-b29b-a1842b915028\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Cục Quản lý Dược căn cứ chức năng, nhiệm vụ được giao và lộ trình hòa hợp ASEAN trong đăng ký thuốc, có trách nhiệm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"68a6c83d-274a-4cd5-af6c-eef9b3efb957\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Tổ chức hướng dẫn và thực hiện các quy định của Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5916c7cc-8219-40b6-8423-43c097ee23ee\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Công bố trên Trang thông tin điện tử của Cục Quản lý Dược:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"5916c7cc-8219-40b6-8423-43c097ee23ee\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Danh mục các thuốc, nguyên liệu làm thuốc được cấp, gia hạn giấy đăng ký lưu hành (bao gồm các thông tin của thuốc trước chuyển giao công nghệ đối với thuốc chuyển giao công nghệ sản xuất tại Việt Nam và thuốc đặt gia công đối với thuốc gia công sản xuất tại Việt Nam) trong thời hạn 05 ngày làm việc kể từ ngày cấp, gia hạn giấy đăng ký lưu hành kèm theo thông tin phân loại thuốc kê đơn hoặc không kê đơn và các thông tin về đăng ký lưu hành thuốc, nguyên liệu làm thuốc khác trên Trang thông tin điện tử của Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"5916c7cc-8219-40b6-8423-43c097ee23ee\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Danh mục các thuốc có chứng minh tương đương sinh học, thuốc được phân loại biệt dược gốc, sinh phẩm tham chiếu trong thời hạn 05 ngày làm việc kể từ ngày cấp giấy đăng ký lưu hành và các thông tin thay đổi, bổ sung của thuốc có chứng minh tương đương sinh học, thuốc được phân loại biệt dược gốc, sinh phẩm tham chiếu trong thời hạn 07 ngày làm việc kể từ ngày phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc trên Trang thông tin điện tử của Cục Quản lý Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"5916c7cc-8219-40b6-8423-43c097ee23ee\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Danh mục thuốc gia công, thuốc chuyển giao công nghệ theo Mẫu 8A/TT, Mẫu 8B/TT và Mẫu 8C/TT tại Phụ lục IX ban hành kèm theo Thông tư này trong thời hạn 07 ngày làm việc kể từ ngày cấp giấy đăng ký lưu hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"5916c7cc-8219-40b6-8423-43c097ee23ee\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc được sản xuất toàn bộ các công đoạn tại Việt Nam trên dây chuyền sản xuất thuốc đáp ứng nguyên tắc, tiêu chuẩn EU-GMP hoặc tương đương và được cơ quan quản lý dược của nước thuộc danh sách SRA hoặc EMA cấp phép lưu hành trong thời hạn 07 ngày làm việc kể từ ngày phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f607794c-5b06-4526-a770-1c23287f316e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Loại bỏ thuốc tại các danh mục thuốc biệt dược gốc; sinh phẩm tham chiếu; thuốc có chứng minh tương đương sinh học không còn đáp ứng các tiêu chí phân loại theo quy định tại Thông tư này trên cơ sở ý kiến tư vấn của Hội đồng; Loại bỏ thuốc được sản xuất toàn bộ các công đoạn tại Việt Nam trên dây chuyền sản xuất thuốc đáp ứng nguyên tắc, tiêu chuẩn EU-GMP hoặc tương đương và được cơ quan quản lý dược của nước thuộc danh sách SRA hoặc EMA cấp phép lưu hành đã được công bố không còn đáp ứng quy định tại Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8264a4f2-0dc9-4f7c-a1d8-92ffacf86b63\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Loại bỏ thuốc tại các danh mục thuốc gia công, thuốc chuyển giao công nghệ đã được công bố theo quy định tại tiết 3 điểm b Khoản này trên cơ sở ý kiến tư vấn của Hội đồng khi thuốc không còn đáp ứng quy định tại khoản 1 Điều 9 Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"129a0d64-66a4-4580-a9c2-b7a14728d9b6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Xây dựng, ban hành, tổ chức triển khai thực hiện các quy trình chuẩn trong đăng ký thuốc; tài liệu hướng dẫn việc đăng ký lưu hành thuốc, nguyên liệu làm thuốc; tài liệu hướng dẫn thẩm định hồ sơ đăng ký thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"f582b7bf-f8d2-44ad-848e-8877cafb7b54\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ee) Phối hợp với Cục Quản lý Y, Dược cổ\u0026nbsp;truyền trong việc gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc cổ truyền, dược liệu đã được cấp giấy đăng ký lưu hành theo quy định tại Thông tư số\u0026nbsp;\u003ca href=\"/van-ban/chi-tiet/66591\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e44/2014/TT-BYT\u003c/a\u003e\u0026nbsp;của Bộ trưởng Bộ Y tế quy định việc đăng ký thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"5b553d1c-1054-4a45-9d12-daffa64efc5d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eg) Trong trường hợp cần thiết, Cục Quản lý Dược tổ chức cuộc họp với cơ sở đăng ký, cơ sở sản xuất, chuyên gia thẩm định nhằm làm rõ các vướng mắc liên quan đến việc thẩm định hồ sơ đăng ký thuốc, nguyên liệu làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"48eb4bc4-2915-4f34-9925-b42d4c1cdd54\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eh) Xây dựng quy định việc áp dụng mã vạch (Barcode), mã QR, mã DataMatrix hoặc các hình thức in mã khác theo quy định của pháp luật có liên quan trên bao bì ngoài của thuốc, nguyên liệu làm thuốc của các cơ sở sản xuất nhằm quản lý, nhận diện, truy xuất nguồn gốc thuốc, nguyên liệu làm thuốc lưu hành trên thị trường và lộ trình thực hiện theo quy định của Bộ trưởng Bộ Y tế;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"07c92f42-fe5b-4bd8-ae3f-31a2435b6c3a\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ei) Trong thời hạn 15 ngày kể từ ngày cấp, gia hạn; 07 ngày làm việc kể từ ngày phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, Cục Quản lý Dược chia sẻ tiêu chuẩn chất lượng thuốc cho hệ thống kiểm nghiệm; chia sẻ thông tin về kế hoạch quản lý nguy cơ cho Trung tâm DI \u0026amp; ADR Quốc gia đối với hồ sơ đăng ký thuốc hóa dược mới, vắc xin, sinh phẩm (trừ sinh phẩm probiotics); công bố thông tin nguyên liệu đối với thuốc sản xuất trong nước; công bố danh mục thuốc được phân loại biệt dược gốc, sinh phẩm tham chiếu, thuốc có chứng minh tương đương sinh học;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"37d55dae-ce61-4de6-b058-1d98ee5ea5f3\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ek) Trong thời hạn 03 ngày làm việc kể từ ngày tiếp nhận hồ sơ đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, Cục Quản lý Dược công khai thông tin thuốc, nguyên liệu làm thuốc đã được tiếp nhận hồ sơ gia hạn theo quy định và được tiếp tục sử dụng giấy đăng ký lưu hành theo quy định tại điểm c khoản 8 Điều 56 Luật Dược trên Cổng thông tin điện tử của Bộ Y tế, Trang thông tin điện tử của Cục Quản lý Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"7c9997da-a03f-4e52-b628-bce5aaf41904\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003el) Đối với các thuốc, nguyên liệu làm thuốc đã được công khai trên Trang thông tin điện tử của Cục Quản lý Dược quy định tại điểm k Khoản này, trong thời hạn 03 ngày làm việc kể từ ngày Cục Quản lý Dược có văn bản thông báo không gia hạn hoặc thông báo tạm dừng sử dụng giấy đăng ký lưu hành do phát hiện thuốc, nguyên liệu làm thuốc có nguy cơ không an toàn cho người sử dụng hoặc nghi ngờ giả mạo tài liệu pháp lý, văn bản thông báo kết quả thẩm định hồ sơ gia hạn đã quá thời hạn bổ sung hồ sơ theo quy định tại khoản 1 Điều 44 Thông tư này, Cục Quản lý Dược công khai các thuốc, nguyên liệu làm thuốc không còn đáp ứng quy định tiếp tục sử dụng giấy đăng ký lưu hành trên Cổng thông tin điện tử của Bộ Y tế, Trang thông tin điện tử của Cục Quản lý Dược;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a97d87a0-9947-11f1-b459-d9bacd53e43f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003em) Công bố trên Trang thông tin điện tử của Cục Quản lý Dược các tài liệu kỹ thuật quy định tại Phụ lục I ban hành kèm theo Thông tư này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a97e23e0-9947-11f1-92e5-337b0c5fd238\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003en) Loại bỏ nguyên liệu làm thuốc đã được công bố trên Cổng thông tin điện tử của Bộ Y tế, Trang thông tin điện tử của Cục Quản lý Dược khi có văn bản của cơ quan nhà nước có thẩm quyền thông báo không được phép sử dụng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a97e9910-9947-11f1-a95b-b501d24fdf8e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eo) Công bố trên Cổng thông tin điện tử của Bộ Y tế, Trang thông tin điện tử của Cục Quản lý Dược thông tin của hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc nộp sau dựa vào việc một thuốc đã được cấp phép lưu hành hoặc dữ liệu chứng minh tính an toàn, hiệu quả của một thuốc đã được cấp phép lưu hành theo quy định tại khoản 3 Điều 128 Luật Sở hữu trí tuệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a97f0e40-9947-11f1-bb99-3b90400c58bd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ep) Trong thời hạn 01 tháng kể từ ngày Cục Quản lý Dược có văn bản thông báo cho cơ sở đăng ký về việc không cấp, gia hạn, thay đổi bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, trường hợp nhận được văn bản đề nghị của cơ sở đăng ký về việc xem xét lại kết quả xử lý hồ sơ, Cục Quản lý Dược có trách nhiệm rà soát, tổng hợp báo cáo Hội đồng hoặc chuyển chuyên gia thẩm định xem xét đề nghị của cơ sở. Quy trình xử lý được thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a97f0e40-9947-11f1-bb99-3b90400c58bd\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Trường hợp Hội đồng hoặc chuyên gia thẩm định đồng ý với giải trình và đồng ý cấp, gia hạn, thay đổi bổ sung giấy đăng ký lưu hành: Cục Quản lý Dược ban hành quyết định cấp, gia hạn giấy đăng ký lưu hành hoặc văn bản đồng ý thay đổi, bổ sung giấy đăng ký lưu hành; cơ sở đăng ký không phải nộp lại hồ sơ từ đầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a97f0e40-9947-11f1-bb99-3b90400c58bd\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Trường hợp Hội đồng hoặc chuyên gia thẩm định không đồng ý với giải trình: Cục Quản lý Dược có văn bản thông báo không đồng ý cấp, gia hạn, thay đổi bổ sung giấy đăng ký lưu hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a97f8370-9947-11f1-be04-8923f7a56380\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eq) Ban hành văn bản yêu cầu thử thuốc trên lâm sàng giai đoạn 4 theo quy định tại khoản 2 Điều 87 Luật Dược trên cơ sở ý kiến tư vấn của Hội đồng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a97ff8a0-9947-11f1-b715-211dbd1f37cb\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cơ sở sản xuất thuốc, nguyên liệu làm thuốc thực hiện việc ghi hạn dùng của thuốc, nguyên liệu làm thuốc trên nhãn phải tuân thủ các quy định về ghi nhãn tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/129483\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2018/TT-BYT\u003c/a\u003e và quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a97ff8a0-9947-11f1-b715-211dbd1f37cb\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eHạn dùng của thuốc, nguyên liệu làm thuốc trên nhãn không được dài hơn tuổi thọ của thuốc, nguyên liệu làm thuốc đã được phê duyệt trong hồ sơ đăng ký lưu hành nhưng không được ngắn hơn quá 31 ngày so với tuổi thọ của thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"a98046c0-9947-11f1-9bff-6f1401171e3e\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 56. Trách nhiệm thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"a98046c0-9947-11f1-9bff-6f1401171e3e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eChánh Văn phòng Bộ, Cục trưởng Cục Quản lý Dược, Thủ trưởng các đơn vị thuộc và trực thuộc Bộ Y tế; Giám đốc Sở Y tế các tỉnh, thành phố trực thuộc Trung ương; các cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các cơ quan, tổ chức, cá nhân phản ánh về Bộ Y tế (Cục Quản lý Dược) xem xét, giải quyết./.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable border=\"0\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"background-color: #FFFFFF; padding: 8px;\"\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e\u003cstrong\u003e\u003cem\u003eNơi nhận:\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Ban Bí thư Trung ương Đảng; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Thủ tướng, các Phó Thủ tướng Chính phủ; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Các bộ, cơ quan ngang bộ; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- HĐND, UBND các tỉnh, thành phố trực thuộc Trung ương; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Văn phòng Trung ương và các Ban của Đảng; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Văn phòng Tổng Bí thư; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Văn phòng Chủ tịch nước; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Hội đồng Dân tộc và các Ủy ban của Quốc hội; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Văn phòng Quốc hội; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Tòa án nhân dân tối cao; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Viện kiểm sát nhân dân tối cao; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Kiểm toán nhà nước; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Ngân hàng Chính sách xã hội; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Ngân hàng Phát triển Việt Nam; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Cơ quan Trung ương của các tổ chức chính trị - xã hội; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Bộ trưởng (để báo cáo); \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Các đ/c Thứ trưởng Bộ Y tế (để phối hợp chỉ đạo); \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Các Sở Y tế tỉnh, thành phố trực thuộc Trung ương; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Công báo; Cổng thông tin điện tử Chính phủ; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Các Vụ, Cục, Văn phòng Bộ - Bộ Y tế; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Cổng thông tin điện tử Bộ Y tế; \u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 11.0pt\"\u003e- Lưu: VT, QLD, PC.\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"background-color: #FFFFFF; padding: 8px;\"\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eKT. BỘ TRƯỞNG\u003cbr\u003e\n          THỨ TRƯỞNG\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\n          Nguyễn Tri Thức\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",
