: #000000; font-size: 14.0pt\"\u003eb) Gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc trên cơ sở thẩm định hồ sơ, tư vấn của Hội đồng đối với các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"cf761efc-a6ee-49f7-9f4d-75c6254b14e2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc quy định tại khoản 2 Điều 12 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"cf761efc-a6ee-49f7-9f4d-75c6254b14e2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc, nguyên liệu làm thuốc có quyết định thu hồi bắt buộc hoặc thu hồi tự nguyện do không đạt tiêu chuẩn chất lượng trong thời gian lưu hành kể từ lần cấp, gia hạn giấy đăng ký lưu hành gần nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"cf761efc-a6ee-49f7-9f4d-75c6254b14e2\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thuốc có thông tin báo cáo trong Mẫu 2C/TT tại Phụ lục IX ban hành kèm theo Thông tư này xuất hiện biến cố bất lợi mới hoặc biến cố bất lợi đã biết nhưng tần suất cao hơn tần suất ghi trong tờ hướng dẫn sử dụng thuốc đã được phê duyệt hoặc biến cố bất lợi đã biết nhưng cần có đánh giá thêm; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"cbd41aca-53d8-4065-94d5-9f065fb17ac4\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc theo quy định tại Phụ lục II ban hành kèm theo Thông tư này đối với các trường hợp: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"cbd41aca-53d8-4065-94d5-9f065fb17ac4\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ePhân loại thuốc kê đơn, không kê đơn, thay đổi, bổ sung chỉ định, liều dùng, đường dùng, đối tượng dùng; phân loại biệt dược gốc, sinh phẩm tham chiếu, thuốc có chứng minh tương đương sinh học.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"85e1fe88-e4b0-4d78-b8cc-fcd5a29d555d\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Cục Quản lý Dược gia hạn; phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc trên cơ sở thẩm định hồ sơ mà không yêu cầu thẩm định hồ sơ, tư vấn của Hội đồng đối với các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"4b619cc4-4592-4cab-bc2a-318419bbe39f\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc không thuộc trường hợp quy định tại điểm b khoản 1 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bbaf512a-806f-4d1d-9a77-eb14a0aab5cb\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Phê duyệt thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc không thuộc trường hợp quy định tại điểm c khoản 1 và khoản 3 Điều này và cập nhật tờ hướng dẫn sử dụng theo biệt dược gốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"009e1a45-7df8-4847-92a4-d96c6d3e144b\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Cục Quản lý Dược công khai trên Cổng thông tin điện tử của Bộ Y tế và Trang thông tin điện tử của Cục Quản lý Dược nội dung thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc không yêu cầu thẩm định hồ sơ đối với thay đổi nhỏ chỉ yêu cầu thông báo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"cca74e2d-7a32-4e41-b8a5-1b5232beb2fe\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 44. Quy định về bổ sung hồ sơ, các tài liệu được cập nhật trong quá trình thẩm định, các trường hợp không yêu cầu nộp hồ sơ đề nghị thay đổi, bổ sung, thời hạn thực hiện đối với nội dung cũ trước khi được phê duyệt hoặc công bố nội dung thay đổi, bổ sung\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b2867b5d-8b37-4a27-b128-c9688ad47adb\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Trong thời hạn 06 tháng kể từ ngày Cục Quản lý Dược có văn bản thông báo, cơ sở đăng ký phải nộp tài liệu bổ sung theo yêu cầu. Sau thời hạn này, cơ sở đăng ký không nộp tài liệu bổ sung thì hồ sơ đã nộp không còn giá trị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"b2867b5d-8b37-4a27-b128-c9688ad47adb\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eThời gian kể từ khi có văn bản thông báo của Cục Quản lý Dược đến khi cơ sở đăng ký nộp tài liệu bổ sung không được tính vào thời hạn quy định tại khoản 6 Điều 56 Luật Dược.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"04834c1f-fa1c-4684-812a-fd369723f11e\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Số lần bổ sung hồ sơ đề nghị cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"2d6438a1-a557-41b7-8952-fcf3f544133e\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Đối với các hồ sơ đề nghị cấp, gia hạn, thay đổi, bổ sung giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc, cơ sở đăng ký chỉ được phép nộp hồ sơ bổ sung không quá 02 lần. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"2d6438a1-a557-41b7-8952-fcf3f544133e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp hồ sơ bổ sung lần 02 mà chuyên gia thẩm định chưa đạt, Cục Quản lý Dược trình Hội đồng xem xét không đồng ý cấp, gia hạn giấy đăng ký lưu hành, không đồng ý phê duyệt hồ sơ thay đổi, bổ sung đối với thuốc thuộc quy định tại khoản 1 Điều 43 Thông tư này hoặc có văn bản thông báo không đồng ý gia hạn giấy đăng ký lưu hành, không đồng ý phê duyệt hồ sơ thay đổi, bổ sung đối với thuốc thuộc quy định tại khoản 2 Điều 43 Thông tư này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"2d6438a1-a557-41b7-8952-fcf3f544133e\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrường hợp hồ sơ bổ sung lần 02 mà chuyên gia thẩm định chưa đạt, do có nội dung phát sinh so với nội dung yêu cầu trước đó, Cục Quản lý Dược trình Hội đồng xem xét cho phép cơ sở đăng ký bổ sung thêm 01 lần để giải trình ý kiến chuyên gia đối với thuốc thuộc quy định tại khoản 1 Điều 43 Thông tư này hoặc có văn bản thông báo bổ sung thêm 01 lần đối với thuốc thuộc quy định tại khoản 2 Điều 43 Thông tư này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8bdc01db-0a2d-4267-ae53-9a3116484e50\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Hồ sơ nộp bổ sung theo yêu cầu của Hội đồng không tính vào số lần được bổ sung hồ sơ theo quy định tại điểm a Khoản này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f827b8fb-2cbb-4a64-86f1-a799d6307085\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Đối với hồ sơ đang trong quá trình thẩm định, cơ sở đăng ký không được thay đổi, bổ sung các nội dung so với hồ sơ đã nộp nếu không có yêu cầu của Cục Quản lý Dược, trừ các tài liệu sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"65076dc0-b1d9-496e-b778-22d2e12004c2\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Tài liệu cập nhật an toàn, hiệu quả trong tờ hướng dẫn sử dụng thuốc đối với hồ sơ đề nghị cấp, thay đổi, bổ sung giấy đăng ký lưu hành thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"28eb86b2-8838-4959-aea0-c7997b89b0df\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Tài liệu cập nhật nội dung hành chính về tên, địa chỉ của cơ sở đăng ký và người ký tên trên hồ sơ đăng ký nhưng không thay đổi cơ sở đăng ký đối với hồ sơ đề nghị cấp, thay đổi, bổ sung giấy đăng ký lưu hành thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d599e7ca-16c3-4c12-9f0c-4f144523aaf3\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Tài liệu cập nhật nội dung hành chính về tên, cách ghi địa chỉ của cơ sở sản xuất nhưng không thay đổi cơ sở sản xuất và địa điểm sản xuất đối với hồ sơ đề nghị cấp, thay đổi, bổ sung giấy đăng ký lưu hành thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b75517c5-49fe-468e-8120-8f3502b633d8\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Tài liệu cập nhật thông tin về tình trạng lưu hành thực tế của thuốc tại Việt Nam đối với hồ sơ đề nghị gia hạn giấy đăng ký lưu hành thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"aecd32cd-c9c7-485e-bd0f-2e1bf6dd259c\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e4. Đối với hồ sơ đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc quy định tại Điều 41 Thông tư này, cơ sở đăng ký chỉ được phép thay đổi tên thuốc trong hồ sơ đề nghị gia hạn và ghi rõ trong đơn đề nghị gia hạn giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"87dd0c6e-eebf-4047-bcf7-475200e5b3c0\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e5. Cơ sở đăng ký thuốc, cơ sở sản xuất thuốc chịu trách nhiệm tự cập nhật trên nhãn, hướng dẫn sử dụng thuốc và không yêu cầu phải nộp hồ sơ đề nghị thay đổi, bổ sung hoặc thông báo cho Cục Quản lý Dược, bao gồm các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"a603e1a5-6461-4470-a785-d163b7980c85\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thay đổi vị trí, thông tin cơ sở nhập khẩu thuốc, nguyên liệu làm thuốc ghi trên nhãn hoặc tờ hướng dẫn sử dụng thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"93286532-ee1a-4dc6-bb19-c7e2e87b2425\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thực hiện việc ghi nhãn thuốc, nguyên liệu làm thuốc, hướng dẫn sử dụng thuốc theo quy định tại\u0026nbsp;khoản 2 Điều 35 Thông tư số \u003ca href=\"/van-ban/chi-tiet/129483\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2018/TT-BYT\u003c/a\u003e;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0a711435-b851-4734-ac6f-586447b868ad\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ec) Thực hiện việc thay đổi, bổ sung nội dung nhãn, hướng dẫn sử dụng thuốc theo công văn của Cục Quản lý Dược trên cơ sở ý kiến tư vấn của Hội đồng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"1c40a1ea-9f6e-4986-aad6-ae8f1d0eb25a\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ed) Ngoài những trường hợp phải nộp lại mẫu nhãn, hướng dẫn sử dụng thuốc khi có thay đổi, bổ sung theo quy định tại\u0026nbsp;Phụ lục II\u0026nbsp;ban hành kèm theo Thông tư này, các thay đổi khác liên quan đến các thông tin trên nhãn, hướng dẫn sử dụng thuốc, cơ sở đăng ký, cơ sở sản xuất phải tự cập nhật khi đã được Cục Quản lý Dược phê duyệt đối với các thay đổi, bổ sung này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"df65cf72-3923-4c2c-beb1-cea6187bfd5a\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eđ) Các nội dung khác:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"df65cf72-3923-4c2c-beb1-cea6187bfd5a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Sửa lỗi chính tả trên nhãn, tờ hướng dẫn sử dụng thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 2.0pt 0 2.0pt\" id=\"df65cf72-3923-4c2c-beb1-cea6187bfd5a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thay đổi bố cục trình bày các mục trong tờ hướng dẫn sử dụng nhưng không thay đổi nội dung tờ hướng dẫn sử dụng thuốc đã được phê duyệt theo đúng quy định đối với tờ hướng dẫn sử dụng thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"df65cf72-3923-4c2c-beb1-cea6187bfd5a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Thay đổi, bổ sung thông tin về tiêu chuẩn chất lượng trên nhãn, hướng dẫn sử dụng thuốc theo hồ sơ đã được Cục Quản lý Dược phê duyệt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"df65cf72-3923-4c2c-beb1-cea6187bfd5a\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Bỏ các thông tin không bắt buộc trên nhãn, hướng dẫn sử dụng thuốc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6e8b145b-cdf7-40a4-bdc5-f712e9234e22\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e6. Cơ sở đăng ký thuốc, cơ sở sản xuất thuốc thực hiện nội dung thay đổi, bổ sung mới được phê duyệt chậm nhất 12 tháng kể từ ngày Cục Quản lý Dược ban hành công văn phê duyệt; thực hiện ngay kể từ ngày tiếp nhận hồ sơ hoặc chậm nhất 12 tháng kể từ ngày Cục Quản lý Dược công bố đối với thay đổi nhỏ chỉ yêu cầu thông báo. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"6e8b145b-cdf7-40a4-bdc5-f712e9234e22\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong thời gian 12 tháng kể từ ngày Cục Quản lý Dược ban hành công văn phê duyệt hoặc công bố nội dung thay đổi, bổ sung, việc áp dụng nội dung thay đổi, bổ sung được thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"56c4884e-c3db-4831-9b3a-1edbca6469cd\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc, nguyên liệu làm thuốc nhập khẩu được phép tiếp tục nhập khẩu và lưu hành đến hết hạn dùng của thuốc với các nội dung cũ trước khi nội dung thay đổi, bổ sung được phê duyệt hoặc công bố trong trường hợp được giao hàng tại cảng đi của nước xuất khẩu trước ngày phải áp dụng nội dung thay đổi, bổ sung mới theo quy định;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"46d1577c-5287-4def-ad99-5dadc22d28ac\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc, nguyên liệu làm thuốc sản xuất tại Việt Nam được tiếp tục lưu hành cho đến hết hạn dùng của thuốc với các nội dung cũ trước khi nội dung thay đổi, bổ sung được phê duyệt hoặc công bố trong trường hợp được sản xuất trước ngày phải áp dụng nội dung thay đổi, bổ sung mới theo quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9c193f2b-59e4-4f81-847b-1d07f4d1cf34\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e7. Chậm nhất sau 12 tháng kể từ ngày được gia hạn giấy đăng ký lưu hành trong trường hợp thuốc, nguyên liệu làm thuốc có thay đổi tên, thuốc, nguyên liệu làm thuốc phải sử dụng tên mới đã được phê duyệt khi gia hạn giấy đăng ký lưu hành. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"9c193f2b-59e4-4f81-847b-1d07f4d1cf34\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eTrong thời gian 12 tháng kể từ ngày được gia hạn giấy đăng ký lưu hành, việc sử dụng tên thuốc được áp dụng như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"04799650-9f17-4995-b186-7cfe918eb69c\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Thuốc, nguyên liệu làm thuốc nhập khẩu được phép tiếp tục nhập khẩu và lưu hành đến hết hạn dùng của thuốc với tên cũ trước khi được gia hạn giấy đăng ký lưu hành trong trường hợp được giao hàng tại cảng đi của nước xuất khẩu trước ngày phải sử dụng tên mới đã được phê duyệt khi gia hạn giấy đăng ký lưu hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b1d47418-81a1-4d57-ae5a-0bcba12649eb\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thuốc, nguyên liệu làm thuốc sản xuất tại Việt Nam được tiếp tục lưu hành cho đến hết hạn dùng của thuốc với tên cũ trước khi được gia hạn giấy đăng ký lưu hành trong trường hợp được sản xuất trước ngày phải sử dụng tên mới đã được phê duyệt theo quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"48f3c452-c6da-4d7b-aaea-6c7a20cc3fde\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e\u003cstrong\u003eĐiều 45. Thủ tục cấp giấy đăng ký lưu hành thuốc, nguyên liệu làm thuốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b58bd21a-1531-4328-95b6-a57744834ff6\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e1. Hình thức nộp hồ sơ: \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"b58bd21a-1531-4328-95b6-a57744834ff6\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCơ sở đăng ký thực hiện nộp hồ sơ theo quy định tại Điều 15 Nghị định số \u003ca href=\"/van-ban/chi-tiet/178283\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e118/2025/NĐ-CP\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4562e05b-7298-41c2-a8bc-0b2fe61ece47\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e2. Tiếp nhận và thời gian giải quyết hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Tiếp nhận hồ sơ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eKhi nhận đủ hồ sơ, Cục Quản lý Dược cấp cho cơ sở đăng ký thuốc giấy tiếp nhận hồ sơ theo quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eCục Quản lý Dược tiếp nhận hồ sơ mà không bắt buộc phải nộp tại thời điểm nộp hồ sơ đối với các tài liệu sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- CPP đối với thuốc mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- CPP đối với trường hợp quy định tại điểm d khoản 2 Điều 22 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Tài liệu quy định tại điểm b khoản 5 Điều 27 Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"bf761c74-cabc-45be-a448-cabbc1c63e13\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eChậm nhất tại lần bổ sung thứ 2 theo quy định tại điểm a khoản 2 Điều 44 Thông tư này, cơ sở đăng ký phải nộp tài liệu tại điểm này để được xem xét cấp giấy đăng ký lưu hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Thời gian giải quyết hồ sơ kể từ ngày tiếp nhận:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc: không quá 12 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc áp dụng hình thức tham chiếu kết quả thẩm định: không quá 09 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ: không quá 03 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ: không quá 09 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc mới có chỉ định sử dụng phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh: không quá 15 ngày.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc thuộc trường hợp ưu tiên về thủ tục hành chính quy định tại khoản 5 Điều 7 Luật Dược: không quá 06 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"8ad28ec5-5e35-4feb-b1e7-7a6d180d3b25\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành nguyên liệu làm thuốc: không quá 06 tháng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0766c315-e6c2-4b15-94b8-730cc2bcdd72\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e3. Tổ chức thẩm định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003ea) Kể từ ngày tiếp nhận hồ sơ, Cục Quản lý Dược tiến hành rà soát, phân loại và chuyển hồ sơ cho các chuyên gia thẩm định hoặc các đơn vị tổ chức thẩm định trong thời hạn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc: 10 ngày đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc áp dụng hình thức tham chiếu kết quả thẩm định: 10 ngày đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công đã có giấy đăng ký lưu hành tại Việt Nam còn hiệu lực tại thời điểm nộp hồ sơ: 03 ngày làm việc đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc gia công, chuyển giao công nghệ trong trường hợp thuốc đặt gia công, thuốc trước chuyển giao công nghệ chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ hoặc thuốc gia công có chuyển giao công nghệ sản xuất thuốc từ cơ sở đặt gia công thuốc cho cơ sở nhận gia công thuốc trong trường hợp thuốc đặt gia công chưa có giấy đăng ký lưu hành tại Việt Nam hoặc giấy đăng ký lưu hành hết hiệu lực tại thời điểm nộp hồ sơ: 10 ngày đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc mới có chỉ định sử dụng phòng, điều trị bệnh truyền nhiễm thuộc nhóm A đã được thông tin dịch bệnh theo quy định của pháp luật về phòng bệnh: 01 ngày làm việc đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc thuộc trường hợp ưu tiên về thủ tục hành chính quy định tại khoản 5 Điều 7 Luật Dược: 03 ngày làm việc đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"87de7573-9d16-4882-90b8-d988d4fd9045\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành nguyên liệu làm thuốc: 03 ngày làm việc đối với hồ sơ nộp lần đầu và hồ sơ nộp bổ sung; \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"23149e44-1081-4337-9717-54c1a62bdd37\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003eb) Kể từ ngày nhận được hồ sơ từ Cục Quản lý Dược, các chuyên gia và đơn vị tổ chức thẩm định tổ chức thẩm định, hoàn thành biên bản thẩm định và gửi Cục Quản lý Dược trong thời hạn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 3.0pt 0 2.7pt\" id=\"23149e44-1081-4337-9717-54c1a62bdd37\"\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt\"\u003e- Hồ sơ đề nghị cấp giấy đăng ký lưu hành thuốc: 07 tháng đối với hồ sơ nộp lần đầu, 02 tháng đối với hồ sơ nộp bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=
