 Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircl strong\u003e\u003cstrong\u003eƯ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003cstrong\u003eổ\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;sung Danh mục chi tiết theo mã\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003esố\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003eHS của hàng hóa xuất khẩu, nhập\u003cbr\u003e\n     khẩu quy định tại một số Thông tư của Bộ Công Thương\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eCăn cứ Luật Quản lý ngoại thương ngày 12 tháng 6 năm 2017;\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca\u003e98/2017/NĐ-CP\u003c/a\u003e ngày 18 tháng 8 năm 2017 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Công Thương;\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca\u003e69/2018/NĐ-CP\u003c/a\u003e ngày 15 tháng 5 năm 2018 của Chính phủ quy định chi tiết một số điều của Luật Quản lý ngoại thương;\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eThực hiện Quyết định số 1254/QĐ-TTg ngày 26 tháng 9 năm 2018 của Thủ tướng Chính phủ về việc phê duyệt Kế hoạch hành động thúc đẩy Cơ chế một cửa quốc gia, Cơ chế một cửa\u0026nbsp;\u003c/em\u003e\u003cem\u003eASEAN,\u0026nbsp;\u003c/em\u003e\u003cem\u003ecải cách công tác kiểm tra chuyên ngành đối với hàng hóa xuất khẩu, nhập khẩu và tạo thuận lợi thương mại giai đoạn 2018-2020;\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eTheo đề nghị của Cục trư\u003c/em\u003e\u003cem\u003eở\u003c/em\u003e\u003cem\u003eng Cục Xuất nhập khẩu,\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eBộ trưởng Bộ Công Thương ban hành Thông tư bổ sung Danh mục chi tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu quy định tại một số Thông tư của Bộ Công Thương, cụ thể như sau\u003c/em\u003e\u003cem\u003e:\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"eb5dd58a-eb7d-11f0-89f5-a935d9b454e9\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 1. Thông tư số \u003ca\u003e30/2018/TT-BCT\u003c/a\u003e ngày 01 tháng 10 năm 2018 của Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của Nghị định số \u003ca\u003e107/2018/NĐ-CP\u003c/a\u003e ngày 15 tháng 8 năm 2018 của Chính phủ về kinh doanh xuất khẩu gạo (Thông tư số \u003ca\u003e30/2018/TT-BCT\u003c/a\u003e)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"01ff0190-2393-11f1-8a00-41a779f4dec5\" class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003eBan hành kèm theo Thông tư này Phụ lục I - Danh mục chi tiết theo mã HS đối với thóc, gạo xuất khẩu quy định tại Thông tư số \u003ca\u003e30/2018/TT-BCT\u003c/a\u003e.\u003c/p\u003e\n  \u003cp id=\"eb5dd594-eb7d-11f0-ac1e-c12ef742f35e\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 2. Thông tư số \u003ca\u003e10/2011/TT-BCT\u003c/a\u003e ngày 30 tháng 3 năm 2011 của Bộ trưởng Bộ Công Thương sửa đổi, bổ sung, bãi bỏ một số quy định về thủ tục hành chính trong lĩnh vực xuất, nhập khẩu theo Nghị quyết số 59/NQ-CP ngày 17 tháng 12 năm 2010 của Chính phủ về việc đơn giản hóa thủ tục hành chính thuộc phạm vi chức năng quản lý của Bộ Công Thương (Thông tư số \u003ca\u003e10/2011/TT-BCT\u003c/a\u003e)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"0202f930-2393-11f1-8578-29474e827daa\" class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003eBan hành kèm theo Thông tư này Phụ lục II - Danh mục chi tiết theo mã HS đối với tinh dầu xá xị tạm nhập, tái xuất quy định tại Thông tư số \u003ca\u003e10/2011/TT-BCT\u003c/a\u003e.\u003c/p\u003e\n  \u003cp id=\"eb5dd59e-eb7d-11f0-90f8-297d62a0fb19\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\" type=\"1:3d91fee3-9d07-4a31-9e31-605660a3a035\"\u003e\u003cstrong\u003eĐiều 3. Thông tư li (Thông tư số \u003ca\u003e12/2016/TT-BCT\u003c/a\u003e)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"02062d8a-2393-11f1-b8b7-c33f8b91f658\" class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003eBổ sung mã HS chi tiết đối với khoáng sản xuất khẩu quy định tại Phụ lục 1 Thông tư số \u003ca\u003e12/2016/TT-BCT\u003c/a\u003e như tại Phụ lục V - Danh mục chi tiết theo mã HS đối với khoáng sản xuất khẩu ban hành kèm theo Thông tư này. Những nội dung khác về tiêu chuẩn chất lượng, thời hạn xuất khẩu thực hiện theo quy định tại Phụ lục 1 Thông tư số \u003ca\u003e12/2016/TT-BCT\u003c/a\u003e và các quy định của pháp luật có liên quan.\u003c/p\u003e\n  \u003cp id=\"eb5dfc90-eb7d-11f0-bde3-25bfb52f0665\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 6. Thông tư số \u003ca\u003e57/2018/TT-BCT\u003c/a\u003e ngày 26 tháng 12 năm 2018 của Bộ trưởng Bộ Công Thương quy định chi tiết một số điều của các Nghị định liên quan đến kinh doanh thuốc lá (Thông tư số \u003ca\u003e57/2018/TT-BCT\u003c/a\u003e)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"eb5dfc9a-eb7d-11f0-9a13-d17ac14e2680\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e1. Ban hành kèm theo Thông tư này Phụ lục VI - Danh mục chi tiết theo mã HS đối với nguyên liệu thuốc lá, giấy cuốn điếu thuốc lá quy định tại Thông tư số \u003ca\u003e57/2018/TT-BCT\u003c/a\u003e.\u003c/p\u003e\n  \u003cp id=\"eb5dfca4-eb7d-11f0-8e51-155279f9439d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e2. Bổ sung mã HS chi tiết đối với máy móc, thiết bị chuyên ngành thuốc lá quy định tại Phụ lục 72 Thông tư số \u003ca\u003e57/2018/TT-BCT\u003c/a\u003e như tại Phụ lục VII - Danh mục chi tiết theo mã HS đối với máy móc, thiết bị chuyên ngành thuốc lá ban hành kèm theo Thông tư này.\u003c/p\u003e\n  \u003cp id=\"eb5dfcae-eb7d-11f0-ba44-45c077d654fb\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 7. Thông tư số \u003ca\u003e15/2013/TT-BCT\u003c/a\u003e ngày 15 tháng 7 năm 2013 của Bộ trưởng Bộ Công Thương quy định về xuất khẩu than (Thông tư số \u003ca\u003e15/2013/TT-BCT\u003c/a\u003e)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"02549ba0-2393-11f1-88f9-e181664246e1\" class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003eBổ sung mã HS chi tiết đối với than xuất khẩu quy định tại Phụ lục I Thông tư số \u003ca\u003e15/2013/TT-BCT\u003c/a\u003e như tại Phụ lục VIII - Danh mục chi tiết theo mã HS đối với than xuất khẩu ban hành kèm theo Thông tư này. Những nội dung khác về cờ hạt, độ tro khô, trị số tỏa nhiệt, tiêu chuẩn chất lượng, thời hạn xuất khẩu thực hiện theo quy định tại Phụ lục I Thông tư số \u003ca\u003e15/2013/TT-BCT\u003c/a\u003e và các quy định của pháp luật có liên quan.\u003c/p\u003e\n  \u003cp id=\"eb5dfcb8-eb7d-11f0-8982-3bab18fae23e\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 8. Nguyên tắc áp dụng danh mục\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"eb5dfcc2-eb7d-11f0-bfe2-373bf0a4af66\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e1. Trường hợp chỉ liệt kê mã HS 4 số thì toàn bộ các mã HS 8 số thuộc nhóm HS 4 số này đều được áp dụng.\u003c/p\u003e\n  \u003cp id=\"eb5dfccc-eb7d-11f0-bfaf-ad35888233fa\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e2. Trường hợp chỉ liệt kê mã HS 6 số thì toàn bộ các mã HS 8 số thuộc phân nhóm HS 6 số này đều được áp dụng.\u003c/p\u003e\n  \u003cp id=\"eb5dfcd6-eb7d-11f0-856e-492dd4241d37\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e3. Trường hợp liệt kê chi tiết đến mã HS 8 số thì chỉ mã HS 8 số đó mới được áp dụng.\u003c/p\u003e\n  \u003cp id=\"eb5dfce0-eb7d-11f0-b1d7-03fb9049be3f\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 9. Hiệu lực thi hành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"eb5dfcea-eb7d-11f0-9051-b7c67a14b85a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e1. Thông tư này có hiệu lực thi hành kể từ ngày 29 tháng 01 năm 2020.\u003c/p\u003e\n  \u003cp id=\"eb5dfcf4-eb7d-11f0-a91a-d185f4fef17a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e2. Trong quá trình thực hiện Thông tư này, nếu có phát sinh vướng mắc, thương nhân, các cơ quan, tổ chức, cá nhân có liên quan phản ánh về Bộ Công Thương để xử lý./.\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 301px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eNơi nhận:\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Thủ tướng, các Phó Thủ tướng Chính phủ;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;UBND các tỉnh, TP trực thuộc TW;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Văn phòng Tổng bí thư , Văn phòng Chủ\u0026nbsp;tịch nước, Văn phòng Quốc hội, Văn phòng TW và các Ban của Đảng;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Viện KSND tối cao, Tòa án ND tối cao;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Bộ Tư pháp (Cục Kiểm tra VBQPPL);\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Kiểm toán Nhà nước;\u003c/p\u003e\n      \u003cp\u003e- Ủy ban Chỉ đạo quốc gia về Cơ chế một cửa\u0026nbsp;ASEAN,\u0026nbsp;Cơ chế một cửa quốc gia và tạo thuận lợi thương mại;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Tổng cục Hải quan;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Công báo;\u003c/p\u003e\n      \u003cp\u003e-\u0026nbsp;Cổng thông tin điện tử Chính phủ;\u003c/p\u003e\n      \ \u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eTHIẾT BỊ CHUYÊN NGÀNH THUỐC LÁ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e(Ban hành kèm theo Thông tư số \u003ca\u003e41/2019/TT-BCT\u003c/a\u003e ngày 16 tháng 12 năm 2019\u003c/p\u003e\n  \u003cp align=\"center\"\u003ecủa Bộ Công Thương)\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 38px;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eMã hàng\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 38px;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eMô tả hàng hóa\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e8478.10.10\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eI. Dây chuyền chế biến nguyên liệu lá thuốc lá\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eA. Công đoạn chế biến lá\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"5\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Máy cắt đầu lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Xy lanh làm ẩm\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Hầm ủ lá (xy lô trữ và ủ lá)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e4. Máy sấy lá (sấy, làm nguội, làm dịu)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e5. Hệ thống cân và đóng (ép) kiện lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eB. Công đoạn chế biến cọng\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Xy lanh làm ẩm cọng lần 1\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"4\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Xy lanh làm ẩm cọng lần 2\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Hệ thống tước cọng, tách lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e4. Máy sấy cọng (sấy, làm nguội, làm dịu)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e5. Máy phân loại, làm sạch cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e6. Hệ thống cân và đóng (ép) kiện cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e8478.10.10\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eII. Dây chuyền chế biến sợi thuốc lá\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eA. Công đoạn lá\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"11\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Thiết bị hấp chân không\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Máy cắt kiện lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Xy lanh làm ẩm lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e4. Xy lanh gia liệu\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e5. Hầm ủ lá (xy lô trữ và ủ lá)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e6. Thiết bị dò kim loại\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e7. Máy thái lá\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e8. Thiết bị trương nở sợi\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e9. Thiết bị sấy\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e10. Thiết bị phân ly sợi\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e11. Hệ thống các cân định lượng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eB. Công đoạn cọng\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"11\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Máy tước cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Thiết bị gia ẩm cọng lần 1\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Hầm ủ cọng (xy lô trữ và ủ cọng)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e4. Thiết bị gia ẩm cọng lần 2\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e5. Thiết bị cán cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e6. Máy thái cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e7. Thiết bị trương nở cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e8. Thiết bị sấy cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e9. Thiết bị phân ly cọng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e10. Hầm ủ cọng (xy lô ủ sợi cọng)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e11. Hệ thống các cân định lượng\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eC. Công đoạn phối trộn sợi\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"3\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Thiết bị phun hương\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Hầm ủ sợi (xy lô ủ sợi)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 38px;\"\u003e\n      \u003cp\u003e3. Hệ thống vận chuyển sợi thuốc lá đến máy cuốn điếu (bằng khí động học hoặc cơ học)\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 38px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e8478.10.10\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 38px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eIII. Dây chuyền chế biến thuốc lá tấm và các chế phẩm thay thế khác dùng để sản xuất các sản phẩm thuốc lá\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e8478.10.10\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eIV. Máy móc thiết bị sản xuất thuốc lá điếu\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eA. Công đoạn cuốn điếu - ghép đầu lọc\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"3\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Máy cuốn điếu\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Máy ghép đầu lọc\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Máy nạp khay\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003e\u003cem\u003eB. Công đoạn đóng bao\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"5\" style=\"width: 388px; height: 29px;\"\u003e\n      \u003cp\u003e8478.90.10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e1. Máy đóng bao\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e2. Máy đóng bóng kính bao\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e3. Máy đóng tút\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e4. Máy đóng bóng kính tút\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 513px; height: 29px;\"\u003e\n      \u003cp\u003e5. Máy đóng thùng carton.\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"clear: both;\"\u003e\n   \u0026nbsp;\n  \u003c/div\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003ePhụ lục VIII\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eDANH MỤC CHI TIẾT THEO MÃ HS ĐỐI VỚI THAN XUẤT KHẨU\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e(Ban hành kèm theo Thông tư số \u003ca\u003e41/2019/TT-BCT\u003c/a\u003e ngày 16 tháng 12 năm 2019\u003c/p\u003e\n  \u003cp align=\"center\"\u003ecủa Bộ Công Thương)\u003c/p\u003e\n  \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 149px; height: 48px;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eMã hàng\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 752px; height: 48px;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eMô tả hàng hóa\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd rowspan=\"3\" style=\"width: 149px; height: 48px;\"\u003e\n      \u003cp align=\"center\"\u003e2701.11.00\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 752px; height: 48px;\"\u003e\n      \u003cp\u003eThan cục các loại\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 752px; height: 48px;\"\u003e\n      \u003cp\u003eThan cám 1, 2\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 752px; height: 48px;\"\u003e\n      \u003cp\u003eThan cám 3\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"clear: both;\"\u003e\n   \u0026nbsp;\n  \u003c/div\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":
