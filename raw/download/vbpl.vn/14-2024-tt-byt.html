\u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e88/2023/NĐ-CP\u003c/a\u003e ngày 11 tháng 12 năm 2023 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e54/2017/NĐ-CP\u003c/a\u003e ngày 08 tháng 5 năm 2017 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật dược và Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e155/2018/NĐ-CP\u003c/a\u003e ngày 12 tháng 11 năm 2018 của Chính phủ sửa đổi, bổ sung một số quy định liên quan đến điều kiện đầu tư kinh doanh thuộc phạm vi quản lý nhà nước của Bộ Y tế;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e95/2022/NĐ-CP\u003c/a\u003e ngày 15 tháng 11 năm 2022 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Y tế;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eTheo đề nghị của Cục trưởng Cục Quản lý Y, Dược cổ truyền,\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eBộ trưởng Bộ Y tế ban hành Thông tư hướng dẫn phương pháp chế biến dược liệu và vị thuốc cổ truyền.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda5039a-df40-11f0-b6f0-91e0e7f82f64\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 1. Phạm vi điều chỉnh và đối tượng áp dụng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda5039a-df40-11f0-b6f0-91e0e7f82f64\" class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThông tư này hướng dẫn phương pháp chế biến dược liệu và vị thuốc cổ truyền tại các cơ sở khám bệnh, chữa bệnh bằng y dược cổ truyền; cơ sở sản xuất, kinh doanh dược liệu, vị thuốc cổ truyền, thuốc cổ truyền, thuốc dược liệu (sau đây viết tắt là cơ sở).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503a4-df40-11f0-a2b9-7d5563b1a99b\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 2. Giải thích từ ngữ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503a4-df40-11f0-a2b9-7d5563b1a99b\" class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrong Thông tư này, những từ ngữ dưới đây được hiểu như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503ae-df40-11f0-930f-537bfb329208\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. \u003cem\u003eChế biến dược liệu\u003c/em\u003e là quá trình sơ chế hoặc phức chế dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503b8-df40-11f0-84d0-2fdf2f057535\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. \u003cem\u003eSơ chế dược liệu\u003c/em\u003e là quá trình thực hiện một hoặc nhiều thao tác sau: loại tạp, ngâm, rửa, ủ, cắt đoạn, thái phiến, phơi, sấy để tạo thành dược liệu sơ chế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503c2-df40-11f0-b47e-9f8c1ebcf128\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. \u003cem\u003ePhức chế dược liệu\u003c/em\u003e là quá trình chế biến theo lý luận của y học cổ truyền hoặc kinh nghiệm dân gian làm thay đổi về chất, lượng và bản chất của dược liệu để tạo thành vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503cc-df40-11f0-9960-3f40af07c65c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.\u003cem\u003e Phụ liệu dùng trong chế biến dược liệu\u003c/em\u003e là những nguyên liệu được dùng thêm trong các giai đoạn của quá trình chế biến dược liệu nhằm tăng thêm tác dụng điều trị hoặc hạn chế tác dụng không mong muốn hoặc thay đổi mùi, vị của dược liệu, vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503d6-df40-11f0-a1c3-e7b73e9d9278\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 3. Ban hành phương pháp chế biến dược liệu và vị thuốc cổ truyền\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503e0-df40-11f0-82ec-af2e126348bd\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Phương pháp chung chế biến dược liệu, vị thuốc cổ truyền quy định tại Phụ lục I ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503ea-df40-11f0-ae0d-75fb9360bbc4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Phương pháp chế biến cụ thể của một số vị thuốc cổ truyền quy định tại Phụ lục II ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503f4-df40-11f0-afdd-33af2f347686\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 4. Hướng dẫn sử dụng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda503fe-df40-11f0-a972-d35f17de196f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Phương pháp chế biến dược liệu, vị thuốc cổ truyền ban hành kèm theo Thông tư này làm căn cứ để cơ sở xây dựng quy trình sản xuất dược liệu, vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50408-df40-11f0-b765-b324973beab3\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Trường hợp cơ sở sử dụng phương pháp chế biến chưa có hoặc chưa dược quy định tại Phụ lục II ban hành kèm theo Thông tư này thì cơ sở tham khảo phương pháp chế biến được ghi trong Dược điển Việt Nam hoặc Dược điển các nước trên thế giới hoặc trong sách đào tạo dược sĩ, bác sĩ y học cổ truyền để xây dựng phương pháp chế biến dược liệu, vị thuốc cổ truyền tại cơ sở và tự chịu trách nhiệm trước pháp luật về chất lượng, an toàn, hiệu quả của sản phẩm sau chế biến.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50412-df40-11f0-8dbf-71771dea701e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 5. Hiệu lực thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda5041c-df40-11f0-8ca5-fff293cb6b92\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thông tư này có hiệu lực kể từ ngày 28 tháng 10 năm 2024.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50426-df40-11f0-adc8-c33bf69ef903\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Thông tư số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e30/2017/TT-BYT\u003c/a\u003e ngày 11 tháng 07 năm 2017 của Bộ trưởng Bộ Y tế hướng dẫn phương pháp chế biến các vị thuốc cổ truyền hết hiệu lực kể từ ngày Thông tư này có hiệu lực.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50430-df40-11f0-a414-f30a40ab41e7\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 6. Điều khoản chuyển tiếp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda5043a-df40-11f0-bbee-15cdf6cda1ab\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Các lô thuốc, vị thuốc cổ truyền đã sản xuất theo Giấy đăng ký lưu hành được cấp trước ngày Thông tư này có hiệu lực thì được tiếp tục lưu hành đến hết hạn dùng theo quy định, kể cả phương pháp chế biến dược liệu khác so với phương pháp chế biến dược liệu quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50444-df40-11f0-a0fb-9f20f6602812\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các thuốc, vị thuốc cổ truyền đã được cấp Giấy đăng ký lưu hành trước ngày Thông tư này có hiệu lực mà trong quy trình sản xuất thuốc, bán thành phẩm có phương pháp chế biến dược liệu khác so với phương pháp chế biến dược liệu quy định tại Thông tư này; cơ sở đăng ký phải thực hiện cập nhật, chỉnh sửa, bổ sung công thức, quy trình sản xuất và các thông tin liên quan trong thời gian chậm nhất 02 năm từ ngày cấp Giấy đăng ký lưu hành hoặc trước ngày 31 tháng 12 năm 2026.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda5044e-df40-11f0-a027-09aafe00c37a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Trường hợp thuốc, vị thuốc cổ truyền đã nộp hồ sơ đề nghị cấp Giấy đăng ký lưu hành trước ngày Thông tư này có hiệu lực nhưng chưa được cấp Giấy đăng ký lưu hành; cơ quan có thẩm quyền xem xét cấp Giấy đăng ký lưu hành thuốc theo quy định, trong đó các quy định về chế biến dược liệu áp dụng theo quy định tại Thông tư số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e30/2017/TT-BYT\u003c/a\u003e ngày 11 tháng 07 năm 2017 của Bộ trưởng Bộ Y tế hướng dẫn phương pháp chế biến các vị thuốc cổ truyền; trừ trường hợp cơ sở tự nguyện thực hiện theo quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50458-df40-11f0-9612-1d4767d06ead\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Trường hợp thuốc, vị thuốc cổ truyền nộp hồ sơ đăng ký theo quy định tại khoản 3 Điều này nhưng chưa tự nguyện thực hiện theo quy định tại Thông tư này và được cấp Giấy đăng ký lưu hành thuốc; trong thời hạn tối đa 02 năm kể từ ngày cấp Giấy đăng ký lưu hành, cơ sở phải thực hiện cập nhật, chỉnh sửa, bổ sung công thức, quy trình sản xuất và các thông tin liên quan trong hồ sơ đăng ký theo quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50462-df40-11f0-ba5e-cff0a8c9f9c1\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 7. Trách nhiệm thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cda50462-df40-11f0-ba5e-cff0a8c9f9c1\" class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChánh Văn phòng Bộ; Cục trưởng Cục Quản lý Y, Dược cổ truyền; Thủ trưởng các đơn vị thuộc và trực thuộc Bộ Y tế; Giám đốc Sở Y tế các tỉnh, thành phố trực thuộc Trung ương; Thủ trưởng cơ quan y tế các Bộ, ngành và các cơ quan tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. Trong quá trình thực hiện, nếu có khó khăn vướng mắc, cơ quan, tổ chức, cá nhân phản ánh kịp thời về Bộ Y tế (Cục Quản lý Y, Dược cổ truyền) để xem xét giải quyết.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif;\"\u003eTrong quá trình thực hiện, nếu có khó khăn vướng mắc, cơ quan, tổ chức, cá nhân phản ánh kịp thời về Bộ Y tế (Cục Quản lý Y, Dược cổ truyền) để xem xét giải quyết./.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100%; border-collapse: collapse; border-spacing: 0px;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 52.84%;\"\u003e\n      \u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47.16%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eKT. BỘ TRƯỞNG\u003cbr\u003e\n          THỨ TRƯỞNG\u003cbr\u003e\u003cem\u003e(đã ký)\u003c/em\u003e\u003cbr\u003e\n          Đỗ Xuân Tuyên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ePHỤ LỤC I\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ePHƯƠNG PHÁP CHUNG CHẾ BIẾN DƯỢC LIỆU, VỊ THUỐC CỔ TRUYỀN\u003c/strong\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003e(Ban hành kèm theo Thông tư số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e14/2024/TT-BYT\u003c/a\u003e ngày 06 tháng 9 năm 2024 của Bộ trưởng Bộ Y tế)\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3f578f80-2825-11f1-a767-37d12563da15\" style=\"text-align: center;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif;\"\u003e\u003cstrong\u003eChương I\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ePHƯƠNG PHÁP SƠ CHẾ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3f57b690-2825-11f1-a007-65e20abfeb48\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif;\"\u003e\u003cstrong\u003eĐiều 1. Phương pháp loại tạp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3f5804b0-2825-11f1-9e90-bbfc89d34715\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bỏ những bộ phận không dùng, không đủ tiêu chuẩn làm thuốc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại những bộ phận gây ra tác dụng không mong muốn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bỏ những tạp chất lẫn vào trong quá trình phơi sấy và tạp chất độc;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo ra sự đồng đều về mặt kích thước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Tiến hành loại bỏ các bộ phận không dùng làm thuốc (rễ phụ, đầu rễ, lõi rễ, lông, lớp bần...).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3f5804ba-2825-11f1-bbfd-bfdfc3277364\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-size: 14px; font-family: 'times new roman', times, serif;\"\u003e\u003cstrong\u003eĐiều 2. Phương pháp rửa\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm sạch dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm mềm dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khử mùi hôi tanh của một số dược liệu (dùng nước sắc của một số dược liệu có tinh dầu);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tác dụng không mong muốn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Rửa bằng nước sinh hoạt để loại bỏ tạp cơ học (đất, cát, sỏi...). Có thể rửa 1 - 3 lần tùy từng loại dược liệu. Để ráo nước, phơi, sấy đến khi khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 3. Phương pháp ngâm\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm mềm dược liệu để dễ thái, chặt và chế biến;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại muối bám vào dược liệu, loại tạp chất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm độc tính, loại nhớt ngứa, giảm tác dụng không mong muốn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng dẫn thuốc vào kinh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Rửa sạch dược liệu, sau đó ngâm dược liệu ngập trong nước (thường để nước ngấm vào khoảng 3/10 dược liệu). Thời gian ngâm tùy thuộc vào bản chất, kích thước, mục đích sử dụng và nhiệt độ của mùa. Quá trình ngâm phải thường xuyên khuấy đảo và thay nước nhiều lần.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 4. Phương pháp ủ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm mềm dược liệu để dễ thái, chặt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Lên men dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm thơm dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo dáng ngay sau thu hái;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Để phụ liệu ngấm vào dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Rửa sạch dược liệu, cho vào trong thiết bị kín để ủ, trong quá trình ủ đảo đều hoặc phun nước, phụ liệu đến khi đạt yêu cầu. Lấy ra, để ráo nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 5. Phương pháp thái phiến, cắt đoạn\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Phân chia dược liệu đến kích thước thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Rửa, ngâm, ủ hoặc làm mềm dược liệu trước khi thái phiến, cắt đoạn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTùy theo đặc tính của dược liệu và yêu cầu riêng, tiến hành thái phiến hoặc cắt đoạn dược liệu bằng các thiết bị phù hợp đến kích thước thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 6. Phương pháp phơi\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Làm khô dược liệu, bảo quản dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Phơi âm can (không trực tiếp dưới nắng): áp dụng đối với các dược liệu chứa tinh dầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDược liệu sau khi thái, cắt được tãi đều ra khay, tiến hành phơi dưới bóng mát, nơi thoáng gió đến khi đạt độ ẩm thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Phơi trực tiếp dưới nắng: áp dụng đối với tất cả các dược liệu, trừ dược liệu chứa tinh dầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDược liệu sau khi thái, cắt được tãi đều ra khay, tiến hành phơi ngoài trời nắng đến khi đạt độ ẩm thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 7. Phương pháp sấy\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Làm khô dược liệu, bảo quản dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỹ thuật sơ chế: Cho dược liệu vào các khay sấy, cài đặt nhiệt độ, thời gian cho phù hợp từng loại dược liệu. Sấy đến khi đạt độ ẩm thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChương II\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ePHƯƠNG PHÁP PHỨC CHẾ VÀ PHỤ LIỆU CHẾ BIẾN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eMục I. Phương pháp phức chế\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 8. Phương pháp sao qua\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo mùi thơm cho vị thuốc cổ truyền;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm khô, hạn chế mốc, mọt nhằm bảo quản vị thuốc cổ truyền;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Diệt enzyme, giúp ổn định thành phần hóa học.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 50 - 80°C, cho dược liệu vào, đảo nhanh, đều đến khi dược liệu khô, mùi thơm, lấy ra, để nguội. Đối với dược liệu chứa tinh dầu phải sao ở nhiệt độ thấp hơn 60°C.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 9. Phương pháp sao vàng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính hàn của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm tăng dẫn thuốc vào kinh tỳ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm khô dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo mùi thơm cho vị thuốc cổ truyền;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm một số tác dụng không mong muốn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 100 - 150°C, cho dược liệu vào, đảo đều đến khi mặt ngoài dược liệu có màu vàng hoặc màu sẫm hơn so với dược liệu lúc chưa sao, bẻ dược liệu, bên trong vẫn giữ nguyên màu. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Lưu ý: Nhiệt độ tăng từ từ, đều, không quá nhanh gây cháy xém. Những dược liệu có màu tối hơn màu vàng (như: màu nâu, xanh, lục, vàng cam, đỏ...) quá trình sao phải không có khói do cháy; vị thuốc cổ truyền phải có màu khác rõ rệt so với màu dược liệu khi chưa sao nhưng không được có màu đen do cháy.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 10. Phương pháp sao vàng cháy cạnh\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm tăng tác dụng tiêu thực;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm tăng dẫn thuốc vào kinh tỳ, vị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khử các mùi khó chịu của dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 170 - 200°C, cho dược liệu vào, đảo đều đến khi có khói nhẹ, mặt ngoài vị thuốc cổ truyền có màu vàng, cạnh vị thuốc cổ truyền có màu nâu đen, mùi thơm cháy, lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 11. Phương pháp sao vàng hạ thổ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo sự cân bằng âm - dương;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm bớt “hỏa độc”;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm mùi vị khó chịu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Chuẩn bị hố đất, mỗi chiều dài khoảng 25 - 30 cm, trải lớp vải thô, cho dược liệu đã được sao vàng vào hố, phủ lớp vải lên trên. Để khoảng 30 phút. Lấy ra, dàn mỏng, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 12. Phương pháp sao đen\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng tiêu thực;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính mãnh liệt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính hàn của dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 180 - 240°C, cho dược liệu vào, đảo đều và chậm đến khi có khói bay lên; mặt ngoài có màu đen; bên trong có màu vàng; mùi thơm cháy. Có thể phun ít nước vào để làm nguội, đảo thêm chừng 2 - 3 phút. Lấy ra, để nguội. Khi sao đen, giai đoạn đầu điều chỉnh nhiệt như sao vàng, giai đoạn sau tăng nhiệt độ đến khoảng 180 - 240°C.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 13. Phương pháp sao cháy\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng cầm máu hoặc tạo ra tác dụng mới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm độc tính hoặc giảm tác dụng không mong muốn (gây ngứa...).\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 220 - 300°C, cho dược liệu vào, đảo đều như sao vàng sau đó tăng nhiệt độ 220 - 300°C, đảo nhanh đến khi có khói bay lên, mặt ngoài vị thuốc cổ truyền màu đen, bên trong màu nâu đen, mùi thơm cháy. Có thể phun nước sạch vào, đảo thêm vài phút. Đổ ra khay, tãi đều. Để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 14. Phương pháp chích rượu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm thay đổi tác dụng của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dẫn thuốc đi lên;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm tăng tác dụng hoạt huyết thông lạc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu đã thái, chặt: phun hoặc trộn đều rượu, ủ khoảng 1 - 2 giờ cho thấm hết rượu, thỉnh thoảng đảo cho rượu thấm đều vào dược liệu; cho dược liệu đã thấm rượu vào thiết bị sao, điều chỉnh nhiệt độ, sao tới khi dược liệu khô, chuyển màu sẫm, có mùi thơm. Lấy ra, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 15. Phương pháp chích gừng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính hàn, làm tăng tác dụng hòa vị chỉ ẩu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giảm độc tính và tăng tác dụng của dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu đã thái, chặt: phun hoặc trộn đều nước gừng vào dược liệu đã thái, chặt, ủ khoảng 60 phút cho thấm hết nước gừng, thỉnh thoảng đảo cho nước gừng thấm đều vào dược liệu, điều chỉnh nhiệt độ, sao đến khi dược liệu khô, chuyển màu vàng hoặc sẫm hơn, có mùi thơm. Lấy ra, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 16. Phương pháp chích muối\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp bảo quản dược liệu, hạn chế mốc, mọt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng khả năng dẫn tới thận, bàng quang, xuống hạ tiêu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng cường tác dụng ích can thận, tăng tác dụng tư âm giáng hỏa, lợi thủy.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu đã thái, chặt: phun hoặc trộn đều nước muối với dược liệu, ủ khoảng 1 - 2 giờ cho thấm hết nước muối, đảo cho nước muối thấm đều vào dược liệu. Sau đó, cho dược liệu vào thiết bị sao, điều chỉnh nhiệt độ, đảo đều khoảng 15 - 20 phút cho đến khi dược liệu khô, mùi thơm, màu vàng hoặc sẫm hơn, lấy ra, tãi cho nguội. Có thể sao dược liệu đến hơi vàng rồi mới phun nước muối và sao đến khi dược liệu khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 17. Phương pháp chích giấm\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng dẫn thuốc vào kinh can đờm, tăng tác dụng hành khí, hoạt huyết, khử ứ, chỉ thống;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hòa hoãn dược tính (hòa hoãn tác dụng tả hạ để giảm độc của thuốc trục thủy);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Acid hóa môi trường, có thể tăng khả năng hòa tan một số thành phần trong vị thuốc cổ truyền (alcaloid);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trung hòa Ca(OH)\u003csub\u003e2\u003c/sub\u003e trong một số dược liệu (Cửu khổng, Mẫu lệ, Trân châu mẫu...) (sử dụng giấm để tôi).\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu đã thái, chặt: phun hoặc trộn đều giấm với dược liệu đã thái, chặt theo tỷ lệ quy định, ủ khoảng 1 - 2 giờ cho thấm hết, đảo cho giấm thấm đều vào dược liệu. Sau đó cho dược liệu vào thiết bị sao, sao cho tới khi dược liệu có mùi thơm, bề mặt trở nên vàng hoặc sẫm màu hơn. Lấy ra, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 18. Phương pháp chích mật ong\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp bảo quản dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm vị đắng, chát;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng kiện tỳ, ích khí, chỉ ho, nhuận phế của dược liệu và hòa hoãn tính dược (giảm bớt độc tính);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hiệp đồng tác dụng trong bài thuốc để trị các bệnh đường tiêu hóa.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Pha loãng mật ong với nước, sau đó tẩm hoặc trộn đều vào dược liệu, ủ khoảng 1 - 2 giờ cho thấm hết, trong quá trình ủ thỉnh thoảng đảo cho mật ong thấm đều vào dược liệu. Sau đó, cho dược liệu vào thiết bị sao, điều chỉnh nhiệt độ và đảo đều liên tục cho đến khi dược liệu có mùi thơm, bề mặt đều màu, sờ không dính tay. Lấy ra, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 19. Phương pháp sao cám\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng kiện tỳ, hòa vị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính chất khô táo của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khử mùi hôi của một số dược liệu là côn trùng như Bạch cương tàm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ sao khoảng 140 - 160°C, cho cám gạo vào, đảo đều đến khi có mùi thơm của cám gạo, có khói trắng bay lên thì cho dược liệu vào sao cùng, đảo nhanh, đều đến khi vị thuốc cổ truyền màu vàng hoặc màu vàng thẫm lại. Đổ ra, rây/sàng bỏ cám, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 20. Phương pháp sao cách gạo\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Tăng tác dụng kiện tỳ, vị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Làm nóng thiết bị sao, điều chỉnh nhiệt độ, cho gạo và dược liệu vào thiết bị, đảo đều đến khi dược liệu có màu vàng, mùi thơm, đổ ra, sàng bỏ gạo, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 21. Phương pháp sao cách bột văn cáp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Làm chín một số dược liệu dễ bị kết dính khi sao.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Cho bột văn cáp vào thiết bị, điều chỉnh nhiệt độ và đảo đều đến khi bột văn cáp nóng khoảng 200 - 250°C hoặc khi đảo thấy bột chuyển động linh hoạt, cho dược liệu vào đảo đến khi vị thuốc cổ truyền đạt tiêu chuẩn chất lượng đề ra. Sàng bỏ văn cáp, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 22. Phương pháp sao cách cát\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nâng cao nhiệt độ sao;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Truyền nhiệt đều vào các dược liệu có góc cạnh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Cho cát vào thiết bị, điều chỉnh nhiệt độ sao khoảng 250 - 300°C, đảo đều đến khi thấy cát chuyển động linh hoạt, cho dược liệu vào, đảo đều và nhanh đến khi vị thuốc cổ truyền đạt tiêu chuẩn chất lượng đề ra. Sàng bỏ cát, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 23. Phương pháp sao cách đất\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Tăng tác dụng kiện tỳ, an vị, chống nôn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Đất sét màu vàng (hoàng thổ) sao đến khi nóng đều (khoảng 60 - 100°C), cho dược liệu vào, đảo đều tay đến khi dược liệu được bám một lớp bột đất màu vàng trên bề mặt vị thuốc cổ truyền, mùi thơm, đổ ra, rây bỏ đất, xoa đến khi hết bột đất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 24. Phương pháp nung kín\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Làm thay đổi thể chất của dược liệu (làm giòn, xốp) để nghiền, tán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Cho dược liệu vào thiết bị nung, đậy nắp kín, điều chỉnh nhiệt độ khoảng 300 - 500°C, giữ nhiệt độ nung đến khi vị thuốc cổ truyền đạt tiêu chuẩn chất lượng đề ra. Lấy ra, để nguội, tán, rây lấy bột mịn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 25. Phương pháp nung hở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Làm thay đổi thể chất của dược liệu (làm giòn, xốp) để nghiền, tán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Rải các lớp xen kẽ nhau theo thứ tự sau: nhiên liệu (cấp nhiệt) - dược liệu - nhiên liệu. Đốt nhiên liệu cho cháy âm ỉ đến khi nóng đỏ đều dược liệu. Phủ lên trên cùng một lớp tro dày khoảng 5 cm. Để khoảng 4 - 10 giờ đến khi nguội. Lấy dược liệu, làm sạch tro, tán, rây lấy bột. Nhiên liệu thường dùng là: vỏ trấu lúa, mạt gỗ. Có thể rải thêm một lớp than gỗ xen kẽ để tăng thời gian lưu nhiệt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 26. Phương pháp hỏa phi\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm thay đổi cấu trúc, tính chất của một số dược liệu là khoáng vật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bỏ nước dưới dạng liên kết hóa học trong dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Điều chỉnh nhiệt độ trong thiết bị đạt khoảng 200 - 250°C, cho dược liệu vào đảo đều hoặc không đảo (phèn phi), đến khi vị thuốc cổ truyền đạt tiêu chuẩn chất lượng đề ra. Để nguội, tán, rây lấy bột mịn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 27. Phương pháp nướng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm chín dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tính ấm, tăng dẫn thuốc vào kinh tỳ, vị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính mãnh liệt của dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Hơ dược liệu trên than, bếp hoặc vùi trong tro nóng đến khi vị thuốc cổ truyền đạt tiêu chuẩn chất lượng đề ra. Có thể bọc bên ngoài dược liệu một lớp cám mỏng hoặc giấy bản (đã được thấm ẩm) trước khi hơ lửa.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 28. Phương pháp thủy phi\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm độc tính của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bớt một số tạp chất hòa tan trong nước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Lấy bột thật mịn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm nhiệt độ khi tán làm biến đổi thành phần hóa học của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Cho dược liệu vào dụng cụ tán là sành, sứ... (không dùng dụng cụ bằng kim loại như sắt, đồng, tôn...), đổ nước ngập dược liệu (thường lượng nước gấp 10 lần lượng dược liệu). Sau khi tán kỹ, hớt bỏ bụi rác bên trên, gạn lấy lớp nước bột huyền phù sang một dụng cụ khác, phần còn lại tiếp tục làm như thế nhiều lần. Gộp tất cả nước bột, để lắng, gạn bỏ lớp nước, lấy cắn đem phơi âm can hoặc sấy nhẹ đến khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 29. Phương pháp chưng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuyển hóa tác dụng, thay đổi tính vị của dược liệu theo mục đích điều trị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo mùi vị thơm, giảm vị đắng chát;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp dễ hấp thu, đạt hiệu quả điều trị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu được phun hoặc trộn đều với dịch phụ liệu theo tỷ lệ quy định (hoặc hỗn dịch) cho thấm hết. Đảo đều, ủ cho mềm, sau đó cho vào dụng cụ bằng inox hoặc nhôm, đặt vào nồi có sẵn nước, đậy kín và đun cách thủy trong nhiều giờ và có thể nhiều ngày (tùy yêu cầu của từng vị thuốc cổ truyền). Thường xuyên duy trì nhiệt độ sôi âm ỉ, dược liệu được tiếp xúc đủ với dịch phụ liệu để dịch phụ liệu thấm đều vào dược liệu, thi thoảng đảo đều. Bổ sung nước cách thủy tránh cạn. Sau khi chưng, lấy dược liệu ra, để nguội, thái phiến, tẩm và sấy tới hết dịch chưng rồi sấy khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 30. Phương pháp đồ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm mềm dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Diệt các enzym để ổn định hoạt chất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp thuốc dễ được hấp thu, dễ chuyển hóa và phát huy tác dụng tốt hơn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu được xếp lên vỉ bằng nhôm, thép không rỉ...: loại to xếp dưới, loại nhỏ xếp ở trên. Nếu có phụ liệu thì xếp xen kẽ từng lớp. Giữa vỉ và nước trong thiết bị có khoảng cách để dược liệu không tiếp xúc với nước. Đồ cho tới khi dược liệu được chín đều. Lấy ra thái hoặc bào lát và sấy khô. Thời gian đồ tùy thuộc vào tính chất, độ dày dược liệu nhưng phải đảm bảo đủ mềm tới bên trong dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 31. Phương pháp nấu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích: Tạo tính năng, tác dụng của vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu được làm mềm, cho vào thiết bị nấu: loại to xếp dưới, loại nhỏ xếp ở trên. Đổ ngập nước hoặc dịch phụ liệu ngập trên dược liệu 5 cm. Sau khi đun sôi thì duy trì nấu ở nhiệt độ sôi âm ỉ cho tới khi dược liệu chín kỹ. Thường xuyên đảo và bổ sung nước trong quá trình nấu để dịch phụ liệu được tiếp xúc đều với dược liệu. Khi dược liệu đã chín, tiếp tục đun đến khi dịch nấu cạn còn khoảng 1/3, lấy dịch nấu để riêng. Dược liệu để nguội, thái lát (dày 2 - 4 mm). Tẩm dịch nấu (nếu có) và sấy cho tới khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 32. Phương pháp tôi\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nhằm làm giòn dược liệu để nghiền, tán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khử các mùi khó chịu của dược liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Dược liệu được rang cách cát hoặc nung tới khi đạt yêu cầu, khi đổ ra khi còn đang nóng thì nhúng ngập nhanh vào nước hoặc vào một dung dịch phụ liệu như như giấm hoặc nước Hoàng liên...Lấy ra phơi hoặc sấy khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 33. Phương pháp rán dầu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giảm độc tính của dược liệu (đối với Mã tiền);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm cho dược liệu trở nên giòn để nghiền, tán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các bước thực hiện: Thường sử dụng dầu lạc, dầu vừng. Đun sôi dầu, cho dược liệu vào rán cho đến khi có màu hơi vàng, dược liệu nổi lên, thể chất giòn, xốp. Vớt ra cho nhỏ hết dầu. Lượng dầu so với dược liệu thường có tỷ lệ khoảng 20 % đến 30 %.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eMục II. Phụ liệu chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 34. Phụ liệu dùng trong chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Cám gạo\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Cám gạo (nếp hoặc tẻ) mới xay, màu hơi vàng nhạt, mịn, thơm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng kiện tỳ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giảm tính khô táo của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giảm tác dụng không mong muốn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm cho vị thuốc cổ truyền khô đều, vàng đều, có mùi thơm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Bạch truật, Thương truật, Xương bồ...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Gạo\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng gạo nếp hoặc gạo tẻ, thường dùng gạo nếp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm khô dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm thơm và vàng đều vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Nhung hươu, Nhân sâm...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Nước vo gạo\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Nước gạo mới vo của gạo tẻ hoặc gạo nếp; nước có màu trắng, đặc, không có mùi chua, hoặc mùi lạ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng kiện tỳ, hòa vị, tăng tính nhu nhuận, giảm tính táo của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bớt vị chát trong dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp dễ uống hơn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Hà thủ ô đỏ, Hà thủ ô trắng, Thạch xương bồ, Xạ can...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Giấm\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Giấm có thể chất trong, không màu hoặc hơi vàng, có vị chua, có mùi đặc trưng của giấm, nồng độ acid acetic từ 3,6 - 5,0 %, không được có các chất độc hại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dẫn thuốc vào kinh can;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng cường hoạt huyết, khứ ứ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hành khí, giảm đau “thố chế trú can chi nhiệm thống”;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hòa hoãn tính dược, giảm tác dụng phụ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giòn các dược liệu có thể chất cứng rắn, khử mùi hôi, tanh như xương động vật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tôi một số dược liệu như Cửu khổng, Mẫu lệ, Trân châu mẫu...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Diên hồ sách, Tam lăng, Nga truật, Hương phụ, Miết giáp...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Rượu hoặc ethanol dược dụng\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng rượu trắng hoặc ethanol dược dụng có hàm lượng ethanol 30 - 40%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dẫn thuốc lên thượng tiêu (làm thăng dương khí);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính hàn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng cường hoạt huyết, thông kinh, hoạt lạc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Hoàng liên, Hoàng bá, Đại hoàng, Sơn thù du, Thục địa, Hà thủ ô đỏ, Ngưu tất, Xuyên khung, Đan sâm...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Dầu vừng\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Chất lỏng, sánh, mùi thơm đặc trưng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm độc (khi rán dầu);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm cho dược liệu trở nên giòn, xốp, dễ nghiền tán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Mã tiền, Tam thất...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Dịch Gừng tươi (Sinh khương)\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Gừng tươi, già (chắc, thơm), rửa sạch, thái mỏng, giã nát, vắt lấy nước cốt, giã tiếp, thêm nước vài lần, vắt cho đến khi có đủ lượng dịch để tẩm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tính ấm cho dược liệu (tăng tính dương);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng chỉ ho, hóa đờm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm giảm tính ngứa, tính kích thích cổ họng của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm sạch và thơm dược liệu (xương động vật).\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Bán hạ, Thục địa, Đảng sâm...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e8. Mật ong\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Mật ong có vị thơm ngọt, màu hơi vàng, sánh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng kiện tỳ, bổ khí;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng nhuận phế, chỉ ho, hóa đờm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hòa hoãn dược tính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bảo quản vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Tang bạch bì, Tử uyển, Khoản đông hoa, Tiền hồ, Bách hợp, Tỳ bà diệp, Cam thảo, Hoàng kỳ, Ma hoàng...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e9. Văn cáp (bột vỏ hàu, hến) hoặc hoạt thạch\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Vỏ hàu, hến ngâm, rửa sạch, phơi, nung ở nhiệt độ cao, tán lấy bột mịn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Để sao khô các dược liệu là cao được chế biến từ động vật, tránh dính vào nhau hoặc chạm đáy thiết bị;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hạn chế mùi hôi, tanh của các dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Làm cho dược liệu trở nên giòn, dễ tán thành bột khi bào chế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến A giao, cao Ban long...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e10. Muối ăn\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng muối ăn sạch có thành phần chủ yếu là Natri clorid (NaCl), tiến hành pha với nước sinh hoạt theo tỷ lệ thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm tính độc của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dẫn thuốc vào kinh thận, tăng cường tác dụng bổ can thận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng nhuận hạ, lợi tiểu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng tác dụng tư âm, giáng hỏa.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế Phụ tử, Ba kích, Trạch tả, Hoàng bá...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e11. Phèn chua\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng phèn chua sạch, tiến hành hòa tan với nước sinh hoạt theo tỷ lệ thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tẩy rửa các chất độc, các chất gây ngứa, kích thích họng, chất nhớt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bảo quản vị thuốc cổ truyền khỏi bị hỏng, thối rữa, hạn chế ôi thiu trong chế biến;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giúp định hình vị thuốc cổ truyền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Thiên nam tinh, Bán hạ, Hoài sơn...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e12. Nước vôi\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng vôi tôi sạch có thành phần chủ yếu là Calci hydroxyd (Ca(OH)\u003csub\u003e2\u003c/sub\u003e), thêm nước để pha loãng theo tỷ lệ thích hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại bớt các chất ngứa, hạn chế hỏng, thối rữa (khi chế biến dược liệu có nhiều tinh bột);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Loại hết phần thịt, tủy, mỡ... ở xương trước khi nấu cao động vật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế Bán hạ, Hoài sơn...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e13. Cát\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng cát sạch đã được rửa nhiều lần bằng nước sinh hoạt, loại bỏ tạp chất, phơi khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dùng cát làm vật liệu trung gian để nâng nhiệt độ sao lên cao (220 - 250°C);\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Truyền nhiệt đều cho dược liệu khi chế biến.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Mạch môn, Cẩu tích, Cốt toái bổ, Mã tiền...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e14. Đất\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Dùng đất sét vàng sạch ở tầng sâu (những nơi ruộng sạch không có mùn, bùn, dư phẩm thuốc trừ sâu, phân hóa học...), phơi khô, tán mịn, sấy khô;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ngoài ra, dùng đất lòng bếp (phục long can) hoặc đất lòng lò gạch làm phụ liệu chế biến.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích: Tăng tác dụng kiện tỳ, hòa vị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Bạch truật, Hoài sơn...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e15. Dịch vị thuốc cổ truyền\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Đặc điểm của phụ liệu: Sử dụng dịch của một hay nhiều dược liệu (dịch Cam thảo, Sa nhân...) để chế biến các dược liệu độc hoặc phối hợp với các phụ liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Mục đích:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giảm độc hoặc tác dụng không mong muốn của dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hiệp đồng tăng cường hiệu quả;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tạo thêm tác dụng (mới) cho dược liệu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tăng hiệu lực điều trị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Ứng dụng: Chế biến Phụ tử, Bán hạ...\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ePHỤ LỤC II\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePHƯƠNG PHÁP CHẾ BIẾN CỤ THỂ CỦA MỘT SỐ VỊ THUỐC CỔ TRUYỀN\u003c/span\u003e\u003cbr\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003e(Ban hành kèm theo Thông tư số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e14/2024/TT-BYT\u003c/a\u003e ngày 06 tháng 9 năm 2024 của Bộ trưởng Bộ Y tế)\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 9.34%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eSTT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 28.72%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eTên vị t
