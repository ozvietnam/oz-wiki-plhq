u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e560 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMuối ăn (NaCl)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e480 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐất đỏ\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003evừa đủ\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến (mô tả cho 1 lô sản xuất 3,750 kg Thủy ngân):\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChuẩn bị hỗn hợp bao gồm: 2,100 kg Đảm phàn (CuSO\u003csub\u003e4\u003c/sub\u003e. 5H\u003csub\u003e2\u003c/sub\u003eO); 1,800 kg Muối ăn (NaCl), thêm 1,8kg nước trộn đều, sau đó thêm 3,750 kg Thủy ngân, trộn đều như cháo và 10 bát đất đỏ, trộn đều một lần nữa thành một khối ẩm, chia thành 10 phần, nặn thành 10 cục hình cầu. Lấy 10 nồi bằng đáy, trong mỗi nồi xếp một lớp cát và các cục hình cầu. Đậy vung và dùng đất mềm sạch trát thật kín.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSử dụng than củi để đun 10 nồi trên, khi than đã đỏ và cháy đều nhưng không có ngọn lửa, vùi kín lại và ủ trong vòng 22 giờ, lấy ra, để nguội, mở nồi sẽ thấy những tinh thể Khinh phấn bám quanh nồi, tiến hành thu Khinh phấn bám quanh nồi bằng chổi lông sạch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền dạng bột, mùi nhẹ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e88. KHOẢN ĐÔNG HOA CHÍCH MẬT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Khoản đông hoa chích mật:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhoản đông hoa đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMật ong\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e200 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy mật ong hòa loãng với nước sôi được khoảng 180 ml, trộn đều dịch mật với Khoản đông hoa đã sơ chế, ủ khoảng 30 - 60 phút cho mật thấm đều, cho vào thiết bị, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi vị thuốc có màu vàng nâu, bề mặt có các chấm đậm màu, sờ không dính tay. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là các cụm hoa đơn độc, dài 2 - 2,5 cm, phần trên rộng hơn và phần dưới thon dần. Màu nâu nhạt nhưng không đều, bề mặt có các chấm đậm màu, mùi thơm đặc trưng, vị hơi đắng và cay, hơi ngọt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e89. KHỔ HẠNH NHÂN SAO VÀNG GIỮ VỎ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Khổ hạnh nhân đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao tới khi toàn bộ phía ngoài vỏ có màu vàng đều. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có vỏ hơi nhăn nheo, màu vàng đậm, vị đắng đặc trưng của Khổ hạnh nhân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e90. KHỔ HẠNH NHÂN SAO VÀNG BỎ VỎ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgâm Khổ hạnh nhân đã sơ chế trong nước sạch cho trương nở (1 - 2 giờ), sau đó trần qua nước 90 - 100°C trong 3-5 phút, loại bỏ cây mầm, xát bỏ vỏ, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khô. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên ngoài hạt nhẵn có màu hơi vàng. Nhấm có vị đắng nhẹ đặc trưng của Khổ hạnh nhân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e91. KHỔ HẠNH NHÂN ÉP LOẠI DẦU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Khổ hạnh nhân đã sơ chế giã dập, bọc trong giấy bản hoặc trong vải xô ép bỏ dầu. Lấy ra, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khô. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những mảnh to nhỏ không đều, vị đắng đặc trưng của Khổ hạnh nhân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e92. KIM ANH SAO VÀNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKim anh đã sơ chế (bỏ hạt) cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao khi toàn bộ phía ngoài vỏ quả có màu vàng nâu. Lấy ra, chà xát, sàng bỏ hết các gai trên vỏ quả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những mảnh của một nửa vỏ quả, có dạng lòng máng, màu vàng nâu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e93. KIM ANH CHÍCH MUỐI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Kim anh chích muối:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKim anh đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMuối ăn\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e8 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMuối ăn hòa trong 180 ml nước. Trộn đều dịch muối ăn với Kim anh đã bỏ hạt. Ủ 30 phút cho ngấm đều. Lấy ra đồ chín khoảng 1 giờ. Phơi hoặc sấy khô, rồi chà xát, sàng bỏ hết các gai trên vỏ quả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những mảnh của một nửa vỏ quả, có dạng lòng máng, vị chua, chát se, hơi ngọt hoặc hơi mặn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e94. KINH GIỚI SAO CHÁY\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSàng toàn bộ phần Kinh giới đã được cắt thành đoạn dài 2 - 3 cm, lấy phần trên sàng, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 220 - 300°C, đảo đều, sao đến khi vị thuốc ngả màu nâu sẫm, cho nốt phần dược liệu dưới sàng vào thiết bị sao, tiếp tục sao theo nhiệt độ đã cài đặt cho bên ngoài phiến thuốc trở thành màu đen, bên trong màu nâu đen, giảm bớt nhiệt độ sao, phun một ít nước, đảo đều đến khi có khói trắng bốc lên, đổ toàn bộ dược liệu ra thiết bị sạch, đậy kín. Sau khoảng 15 - 20 phút, mở ra, tãi đều, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eChú ý: \u003c/em\u003eKhi đổ dược liệu ra cần đậy kín ngay tránh bốc lửa gây hỏa hoạn, vị thuốc bị đốt thành tro mất tác dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có màu đen nhưng không được cháy thành tro. Các cành bên ngoài có màu đen, bên trong có màu nâu đen, lá và hoa thường bị vụn nát, màu đen. Mùi thơm đặc trưng. Không lẫn tạp chất khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e95. LIÊN NHỤC SAO VÀNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Liên nhục đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khi có màu thẫm lại, có chấm đen. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là hạt hình trái xoan. Mặt ngoài còn màng mỏng màu nâu thẫm, có chấm đen, mùi thơm, vị hơi chát. Không còn tâm sen.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e96. LIÊN TÂM SAO QUA\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Liên tâm đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi có mùi thơm bốc lên. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền dài khoảng 1 cm, phần trên là chồi mầm màu lục sẫm có đốm vàng hoặc hơi xém, thân mầm hình trụ màu vàng nhạt, mùi thơm đặc trưng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e97. LƯU HOÀNG CHẾ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Lưu hoàng chế:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLưu hoàng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐậu phụ\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Lưu hoàng sạch đun cùng đậu phụ cho đến khi đậu phụ chuyển sang màu xanh đen, lấy ra, rửa sạch và phơi âm can.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền dạng bột, màu vàng, không mùi, không vị.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e98. MA HOÀNG CHÍCH MẬT ONG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ma hoàng chích mật ong:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMa hoàng đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMật ong\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e100 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHòa tan mật ong với đồng lượng nước sôi, trộn đều với Ma hoàng đã sơ chế, ủ khoảng 30 - 60 phút đến khi ngấm đều, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khi khô, sờ không dính tay. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền màu hơi vàng nâu, vị đắng, hơi ngọt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e99. MÃ TIỀN RANG CÁT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy cát vàng rửa sạch bằng nước sạch, phơi khô. Ngâm Mã tiền đã sơ chế bằng nước vo gạo hoặc nước sạch trong 24 giờ (8 tiếng thay nước một lần), luộc sôi hạt Mã tiền cho mềm, lấy ra cạo sạch vỏ hạt, bỏ mầm, thái lát. Sấy và phơi đến gần khô. Lấy cát sạch đun nóng, đổ các lát Mã tiền vào tiếp tục rang, đảo đều cho các mảnh hạt phồng lên và có màu nâu hoặc màu nâu đậm (rang khoảng 5 giờ), lấy ra để nguội, sàng loại bỏ hết cát, tán bột.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những lát có màu nâu hoặc nâu đậm, vị đắng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e100. MÃ TIỀN RÁN DẦU VỪNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgâm Mã tiền đã sơ chế vào nước vo gạo, đổ ngập 2 - 3 cm, ngâm trong 3 ngày đêm, hàng ngày thay nước vo gạo 1 lần. Lấy ra, rửa sạch nước vo gạo, nếu hạt chưa mềm có thể đun sôi cho hạt mềm, cạo bỏ lớp vỏ hạt, bỏ mầm, rửa sạch, sấy khô ở nhiệt độ dưới 60°C. Đun sôi dầu vừng, cho Mã tiền vào, tiếp tục đun cho đến khi hạt Mã tiền nổi lên thì vớt ra ngay, dùng giấy bản thấm sạch dầu vừng. Thái nhỏ, sấy khô, bảo quản kín.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những lát nhỏ có màu nâu hoặc nâu đậm, vị đắng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e101. MÃ TIỀN NGÂM RƯỢU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMã tiền đã sơ chế được thái lát hoặc giã nát, ngâm với rượu 40° sau một tuần dùng để xoa bóp (không được uống).\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDịch ngâm có màu nâu hoặc nâu đậm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e102. MẠN KINH TỬ SAO VÀNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Mạn kinh tử đã sơ chế, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi khô, có mùi thơm. Chà xát, loại cho hết màng trắng và đài hoa còn sót lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền mặt ngoài màu xám đen hoặc nâu đen. Thể chất nhẹ và cứng. Mùi thơm đặc trưng, vị nhạt, hơi cay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e103. MẪU ĐƠN BÌ SAO VÀNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Mẫu đơn bì bỏ lõi, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao tới khi toàn bộ phía ngoài có màu vàng hoặc hơi vàng, có mùi thơm đặc trưng của Mẫu đơn bì. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những đoạn nhỏ hoặc mảnh vỏ rễ có kích thước, dài khoảng 3 - 5 cm, có màu vàng, có mùi thơm đặc trưng của Mẫu đơn bì.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e104. MẪU ĐƠN BÌ CHÍCH RƯỢU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Mẫu đơn bì chích rượu:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMẫu đơn bì bỏ lõi\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eRượu\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e180 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMẫu đơn bì đã bỏ lõi được trộn với rượu trắng, ủ 30 phút - 1 giờ cho ngấm hết rượu, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao tới khô, có mùi thơm đặc trưng của Mẫu đơn bì. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những đoạn nhỏ hoặc mảnh vỏ rễ có kích thước, dài khoảng 3 - 5 cm, có màu vàng, có mùi thơm đặc trưng của Mẫu đơn bì.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e105. MẪU LỆ NUNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eXếp Mẫu lệ đã sơ chế trực tiếp lên lò nung, nung cho đến khi mảnh Mẫu lệ nóng hồng đều, có màu trắng xám, lấy ra tãi, nguội, tán thành bột mịn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là bột mịn, có vị mặn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e106. MIẾT GIÁP CHẾ GIẤM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Miết giáp chế giấm:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMiết giáp đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiấm trắng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e0,2 lít\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy cát sạch, cho vào thiết bị rang, rang cho tới khi cát tơi rời, cho Miết giáp đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao cho tới khi mặt ngoài hơi vàng, lấy ra ngay, sàng bỏ cát, đổ Miết giáp ngay vào trong thiết bị chứa giấm trắng để sẵn. Vớt ra, phơi khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những mảnh rời, màu hơi vàng, một số miếng có mép ngoài hơi cháy sém. Mùi hơi chua, vị chua mặn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e107. MỘC MIẾT TỬ SƯƠNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy hạt gấc, tách bỏ áo hạt và phần vỏ hạch cứng, lấy nhân, rửa sạch, sấy khô, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khô, lấy ra, để nguội, nghiền nát, bọc vào giấy bản và ép để loại hết chất dầu được bột trắng như sương.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là bột trắng, không còn chất dầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e108. NGA TRUẬT CHÍCH GIẤM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Nga truật chích giấm:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNga truật đã sơ \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Nga truật đã sơ chế vào giấm và nước sạch, đun sôi nhỏ lửa cho đến cạn. Đổ ra để nguội, thái phiến dày 3 - 5 mm. Phơi khô hoặc sấy khô ở nhiệt độ 60°C tới khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những phiến dày 2 - 3 mm, thể chất giòn, vị đắng, hơi cay, hơi chua.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e110. NGẢI CỨU CHÍCH RƯỢU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngải cứu chích rượu:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgải cứu đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\ ze: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngải cứu chích giấm:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgải cứu đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiấm ăn\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e200 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrộn đều Ngải cứu đã thái, cắt đoạn với giấm. Ủ 30 phút đến 1 giờ, cho ngấm hết giấm, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi phía ngoài có màu hơi đen (khoảng 7 phần 10). Lấy ra, tãi mỏng, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những đoạn ngọn thân hoặc những mảnh lá xốp, màu hơi đen, có mùi thơm đặc trưng của Ngải cứu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e112. NGẢI CỨU SAO CHÁY\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Ngải cứu đã thái, cắt đoạn vào thiết bị sao, điều chỉnh nhiệt độ từ 220 - 300°C, đảo đều, sao đến khi toàn bộ phía ngoài, có màu đen, có mùi cháy. Lấy ra, tãi mỏng, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là những đoạn ngọn thân hoặc những mảnh lá xốp, màu đen, có mùi thơm đặc trưng của Ngải cứu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e113. NGÔ CÔNG CHẾ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003ea) Phương pháp chế biến Ngô công để dùng ngoài: \u003c/em\u003eRết được làm sạch và ngâm nguyên cả con trong bình kín với cồn 90° (5 con/100 ml). Ngâm ít nhất sau một tháng mới dùng được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eb) Phương pháp chế biến Ngô công để dùng trong (đường uống):\u003c/em\u003e Rửa sạch, bỏ đầu đuôi, chân, rút ruột, phun hoặc tẩm với rượu 35° (tỷ lệ 10:1) để khử hết mùi tanh, tẩm với 5% dịch ép gừng tươi, sấy nhẹ đến khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003ea) Ngô công để dùng ngoài: \u003c/em\u003eDịch ngâm có màu nâu hoặc nâu đậm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eb) Ngô công để dùng ngoài:\u003c/em\u003e Vị thuốc cổ truyền có màu xám, thể chất giòn, dễ gãy, mùi hơi cay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e114. NGÔ THÙ DU CHÍCH CAM THẢO\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngô thù du chích Cam thảo:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgô thù du đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCam thảo\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e60 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChế biến dịch Cam thảo: lấy Cam thảo phiến sắc 2 lần với nước, mỗi lần khoảng 300 ml nước, đun sôi 1 giờ. Gộp dịch sắc Cam thảo, cô còn khoảng 160 ml.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChích Cam thảo: trộn đều dịch Cam thảo với Ngô thù du đã giã hơi dập. Ủ 1 giờ cho ngấm hết dịch Cam thảo. Lấy ra, để khô se, phơi khô hoặc cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao tới khô cho mùi thơm đặc trưng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có màu xám hơi vàng, có mùi thơm đặc trưng của Ngô thù du, nhấm có vị cay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e115. NGÔ THÙ DU CHÍCH GIẤM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngô thù du chích giấm:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgô thù du đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiấm ăn\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e160 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgô thù du giã hơi dập, trộn đều với giấm. Ủ 6 - 12 giờ cho ngấm hết. Lấy ra phơi khô hoặc cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao tới khô cho mùi thơm đặc trưng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền màu hơi xám, có mùi đặc trưng của Ngô thù du.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e116. NGÔ THÙ DU CHÍCH MUỐI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngô thù du chích muối:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgô thù du đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDung dịch muối ăn 5 %\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e160 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐem nước muối trộn đều vào Ngô thù du đã giã hơi dập. Ủ 1 giờ cho ngấm hết. Lấy ra phơi khô hoặc cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao tới khô cho mùi thơm đặc trưng của Ngô thù du.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền màu hơi xám, có mùi đặc trưng của Ngô thù du.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e117. NGŨ VỊ TỬ CHÍCH MẬT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngũ vị tử chích mật:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgũ vị tử đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMật ong\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e100 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHòa tan mật ong với đồng lượng nước sôi, trộn đều với Ngũ vị tử đã sơ chế, ủ 1 - 2 giờ, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 100 - 150°C, đảo đều, sao đến khi khô, không dính tay và phồng rộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có vỏ quả màu tím, đỏ tối. Cùi quả phồng rộp bám vào hạt. Cùi có mùi đặc biệt, vị chua, ngọt. Đập vỡ hạt ngửi thấy mùi thơm, vị cay và hơi đắng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e118. NGŨ VỊ TỬ TẨM GIẤM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngũ vị tử tẩm giấm:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgũ vị tử đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiấm trắng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e200 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Ngũ vị tử đã sơ chế, trộn với giấm cho thấm đều, đậy kín, để yên 1 - 2 giờ. Cho vào thiết bị đồ, đồ đến khi có màu đen, đem ra phơi hoặc sấy khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có vỏ quả màu đỏ tím, đỏ tối. Cùi quả mềm nhuyễn. Cùi có mùi đặc biệt, vị chua. Đập vỡ hạt ngửi thấy mùi thơm, vị cay và hơi đắng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e119. NGƯU BÀNG TỬ SAO\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Ngưu bàng tử đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi thấy hạt hơi phồng, có mùi thơm. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền mặt ngoài màu xám vàng, có đốm màu đen, hơi phồng. Mùi thơm nhẹ, vị đắng, hơi cay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e120. NGƯU TẤT CHÍCH RƯỢU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngưu tất chích rượu:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgưu tất đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eRượu\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e0,15 lít\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgưu tất đã sơ chế tẩm rượu trắng, trộn đều, đậy kín, ủ trong khoảng 30 phút cho thấm hết rượu, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi có mùi thơm của rượu bốc lên, phiến thuốc có màu nâu nhạt. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có màu nâu nhạt, mùi thơm đặc trưng của Ngưu tất và của rượu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e121. NGƯU TẤT CHÍCH MUỐI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Ngưu tất chích muối:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgưu tất đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMuối ăn\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e10 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHòa tan muối ăn trong 150 ml nước, tẩm vào Ngưu tất đã sơ chế, trộn đều, ủ trong khoảng 30 phút cho thấm hết nước muối, cho vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi bắt đầu có muối kết tinh ở đáy thiết bị, phiến thuốc có màu nâu nhạt. Lấy ra, để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có màu nâu nhạt, mùi thơm đặc trưng của Ngưu tất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e122. NHỤC THUNG DUNG CHƯNG RƯỢU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến 1,0 kg Nhục thung dung chưng rượu:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNhục thung dung đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eRượu\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e300 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLấy Nhục thung dung đã thái, chặt, thêm rượu, trộn đều, cho vào trong dụng cụ bằng inox thích hợp, đậy kín, nấu cách thủy (chưng) trong 24 - 48 giờ đến màu đen hoặc nâu vàng, lấy ra, phơi khô.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền hình tròn hoặc tròn vát. Mặt ngoài và phiến thuốc màu nâu đen có những đốm nâu nhạt, chất thịt hơi dẻo. Mùi thơm nhẹ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e123. PHÒNG ĐẢNG SÂM CHƯNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eRễ Phòng đảng sâm rửa sạch, tẩm nước, ủ trong 1 - 2 giờ (tùy vào kích thước rễ và nhiệt độ môi trường ủ), trong quá trình ủ đảo đều và phun thêm nước cho thấm đều, cho rễ to xuống dưới, rễ nhỏ phía trên vào một dụng cụ chưng (nếu có nồi nấu bằng hơi thì cho trực tiếp vào nồi). Chưng cách thủy trong 2 giờ. Lấy ra, để nguội. Rễ to thái phiến dài 2 - 3 cm, dày 2 - 3 mm, rễ nhỏ cắt thành đoạn 2 - 3 cm, phơi hoặc sấy ở 45 °C cho se, tẩm nốt nước chưng (nếu có). Phơi hoặc sấy đến khô kiệt ở nhiệt độ dưới 70°C.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền màu nâu đen thể chất thịt, giữa có lõi gỗ. Mùi thơm, vị ngọt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e124. PHÙ BÌNH SAO QUA\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCho Phù bình đã sơ chế vào thiết bị sao, điều chỉnh nhiệt độ từ 50 - 100°C, đảo đều, sao đến khi có mùi thơm bốc lên, vị thuốc ngả màu sẫm là được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền có phiến lá nhăn nheo hơi cháy xém. Thể chất khô giòn, dễ bóp vụn. Mùi thơm nhẹ, vị hơi mặn, cay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e125. HẮC PHỤ TỬ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến Hắc phụ tử từ 1,0 kg Phụ tử:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhụ tử đã sơ chế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMagnesi clorid (MgCl\u003csub\u003e2\u003c/sub\u003e.6H\u003csub\u003e2\u003c/sub\u003eO)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e400 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐường đỏ\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e30 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDầu hạt cải\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e15 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHòa tan Magnesi clorid trong nước. Ngâm Phụ tử đã sơ chế 3 - 5 ngày đêm trong dung dịch này. Đun sôi với dịch ngâm đến khi chín mềm tới lõi (khoảng 30 phút). Rửa sạch, để cả vỏ, thái dọc củ thành phiến dày 0,3 - 0,5 cm. Ngâm tiếp với 2 lít nước trong 12 - 14 giờ. Rửa lại bằng nước (3 lần) đến khi còn vị tê nhẹ. Để ráo nước, sấy ở 55 - 60°C đến khi khô se. Tẩm dịch đường đỏ (30 g đường đỏ hòa tan trong 20 ml nước sôi), 15 g dầu hạt cải. Trộn đều, ủ 12 - 14 giờ. Đồ khoảng 20 phút. Lấy ra, sấy đến khô. Để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là phiến nhẵn bóng, màu nâu xám. Xung quanh phiến có màu nâu đen của vỏ củ. Vị mặn đặc trưng của muối Magnesi clorid, vị tê nhẹ hoặc không tê.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e126. BẠCH PHỤ TỬ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Công thức chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông thức chế biến Bạch phụ tử từ 1,0 kg Phụ tử:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhụ tử\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1,0 kg\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMagnesi clorid (MgCl\u003csub\u003e2\u003c/sub\u003e.6H\u003csub\u003e2\u003c/sub\u003eO)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e400 g\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 33.34%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNước\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66.66%;\"\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e200 ml\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Quy trình chế biến:\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHòa tan Magnesi clorid trong nước. Ngâm Phụ tử đã sơ chế trong 3 - 5 ngày. Đun sôi với dịch ngâm đến khi chín mềm tới lõi (khoảng 30 phút). Vớt ra, bóc bỏ vỏ, thái dọc củ thành phiến dày 0,2 - 0,3 cm. Rửa bằng nước đến khi còn vị tê nhẹ hoặc không tê. Hấp chín, phơi hoặc sấy ở 60°C đến khô. Để nguội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Yêu cầu cảm quan\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVị thuốc cổ truyền là phiến màu trắng vàng, trong mờ, không có vỏ ngoài. Vị mặn đặc trưng của muối Magnesi clorid, vị tê nhẹ hoặc không tê.\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e127. QUA LÂU NHÂN SAO\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Phương pháp chế biến\u003c/strong\u003e\u003c/
