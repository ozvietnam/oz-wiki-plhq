unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\":\"Lược đồ văn bản\",\"icon\":\"FileTextOutlined\"}]}},\"mostViewed\":{\"title\":\"Văn bản được xem nhiều\",\"viewCount\":\"Lượt xem  \u003cp align=\"center\"\u003e\u003cstrong\u003eTHÔNG TƯ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eBAN HÀNH “QUY CHUẨN KỸ THUẬT QUỐC GIA VỀ XÁC THỰC LƯU TRỮ TÀI LIỆU SỐ LÂU DÀI CỦA CÁC CƠ QUAN ĐẢNG, NHÀ NƯỚC”\u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Luật Tiêu chuẩn và Quy chuẩn kỹ thuật ngày 29 tháng 6 năm 2006;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Luật Giao dịch điện tử ngày 22 tháng 6 năm 2023;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Luật Lưu trữ ngày 21 tháng 6 năm 2024;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e127/2007/NĐ-CP\u003c/a\u003e ngày 01 tháng 8 năm 2007 của Chính phủ quy định chi tiết thi hành một số điều của Luật Tiêu chuẩn và Quy chuẩn kỹ thuật; Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e78/2018/NĐ-CP\u003c/a\u003e ngày 16 tháng 5 năm 2018 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e127/2007/NĐ-CP\u003c/a\u003e ngày 01 tháng 8 năm 2007 của Chính phủ quy định chi tiết thi hành một số điều của Luật Tiêu chuẩn và Quy chuẩn kỹ thuật;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Nghị định số 09/2014/NĐ-CP ngày 27 tháng 01 năm 2014 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Ban Cơ yếu Chính phủ;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2022/NĐ-CP\u003c/a\u003e ngày 30 tháng 11 năm 2022 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Quốc phòng; Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e03/2025/NĐ-CP\u003c/a\u003e ngày 28 tháng 02 năm 2025 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e01/2022/NĐ-CP\u003c/a\u003e ngày 30 tháng 11 năm 2022 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Quốc phòng;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2024/NĐ-CP\u003c/a\u003e ngày 25 tháng 6 năm 2024 của Chính phủ quy định về chữ ký số chuyên dùng công vụ;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eTheo đề nghị của Trưởng ban Ban Cơ yếu Chính phủ;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cem\u003eBộ trưởng Bộ Quốc phòng ban hành Thông tư quy định Quy chuẩn kỹ thuật quốc gia về xác thực lưu trữ tài liệu số lâu dài của các cơ quan Đảng, Nhà nước.\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"ac05a1ea-e157-11f0-bb0d-c970d5fe0655\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif; text-align: justify;\"\u003e\u003cstrong\u003eĐiều 1. \u003c/strong\u003eBan hành kèm theo Thông tư này Quy chuẩn kỹ thuật quốc gia về xác thực lưu trữ tài liệu số lâu dài của các cơ quan Đảng, Nhà nước.\u003c/p\u003e\n  \u003cp id=\"ac05a1ea-e157-11f0-bb0d-c970d5fe0655\" class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003eKý hiệu: QCVN 16:2025/BQP.\u003c/p\u003e\n  \u003cp id=\"ac05a1f4-e157-11f0-8435-17de3f301482\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cstrong\u003eĐiều 2. \u003c/strong\u003eThông tư này có hiệu lực thi hành kể từ ngày 02 tháng 9 năm 2025.\u003c/p\u003e\n  \u003cp id=\"ac05a1fe-e157-11f0-8f17-b5d984870f94\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif; text-align: justify;\"\u003e\u003cstrong\u003eĐiều 3. \u003c/strong\u003eTrưởng ban Ban Cơ yếu Chính phủ, Thủ trưởng các cơ quan, đơn vị, tổ chức và cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này./.\u003c/p\u003e\n  \u003cp style=\"text-align: right;\"\u003e\u003cstrong\u003eBỘ TRƯỞNG\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif; text-align: right;\"\u003e\u003cstrong\u003e(đã ký)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif; text-align: right;\"\u003e\u003cstrong\u003eĐại tướng Phan Văn Giang\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQCVN 16:2025/BQP\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eQUY CHUẨN KỸ THUẬT QUỐC GIA VỀ XÁC THỰC LƯU TRỮ TÀI LIỆU SỐ LÂU DÀI CỦA CÁC CƠ QUAN ĐẢNG, NHÀ NƯỚC\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cem\u003eNational technical regulation on authentication long-term in digital document archives of party and state agencies\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eMỤC LỤC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1 QUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e1.1 Phạm vi điều chỉnh\u003c/p\u003e\n  \u003cp\u003e1.2 Đối tượng áp dụng\u003c/p\u003e\n  \u003cp\u003e1.3 Tài liệu viện dẫn\u003c/p\u003e\n  \u003cp\u003e1.4 Giải thích từ ngữ\u003c/p\u003e\n  \u003cp\u003e1.5 Chữ viết tắt\u003c/p\u003e\n  \u003cp\u003e1.6 Ký hiệu\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e2 QUY ĐỊNH KĨ THUẬT\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e2.1 Quy định về khuôn dạng chữ ký số\u003c/p\u003e\n  \u003cp\u003e2.1.1 Khuôn dạng chữ ký số\u003c/p\u003e\n  \u003cp\u003e2.1.2 Thông tin bắt buộc phải có trong các khuôn dạng chữ ký số\u003c/p\u003e\n  \u003cp\u003e2.2 Quy định về khuôn dạng dữ liệu phục vụ xác thực lâu dài\u003c/p\u003e\n  \u003cp\u003e2.3 Quy định về thuật toán mật mã\u003c/p\u003e\n  \u003cp\u003e2.3.1 Quy định về các thuật toán mật mã được sử dụng\u003c/p\u003e\n  \u003cp\u003e2.3.2 Quy định về thời gian sử dụng các thuật toán mật mã\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e3 QUY ĐỊNH VỀ QUẢN LÝ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e4 TRÁCH NHIỆM CỦA CƠ QUAN, TỔ CHỨC, CÁ NHÂN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e5 TỔ CHỨC THỰC HIỆN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTÀI LIỆU THAM KHẢO\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLời nói đầu\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eQCVN 16:2025/BQP do Cục Chứng thực số và Bảo mật thông tin - Ban Cơ yếu Chính phủ biên soạn, Ban Cơ yếu Chính phủ trình duyệt, Bộ Khoa học và Công nghệ thẩm định, Bộ trưởng Bộ Quốc phòng ban hành theo kèm Thông tư số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e76/2025/TT-BQP\u003c/a\u003e ngày 18 tháng 7 năm 2025.\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY CHUẨN KỸ THUẬT QUỐC GIA VỀ XÁC THỰC LƯU TRỮ TÀI LIỆU SỐ LÂU DÀI CỦA CÁC CƠ QUAN ĐẢNG, NHÀ NƯỚC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003e\u003cem\u003eNational technical regulation on authentication long-term in digital document archives of party and state agencies\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1 QUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.1 Phạm vi điều chỉnh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eQuy chuẩn kỹ thuật quốc gia này quy định mức giới hạn các đặc tính kỹ thuật về xác thực trong hoạt động nghiệp vụ lưu trữ đối với tài liệu lưu trữ số được ký số bằng chứng thư chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.2 Đối tượng áp dụng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eQuy chuẩn kỹ thuật quốc gia này áp dụng đối với các cơ quan, tổ chức, cá nhân có liên quan khi quản lý, sử dụng dịch vụ chứng thực chữ ký số chuyên dùng công vụ trong hoạt động nghiệp vụ lưu trữ đối với tài liệu lưu trữ số.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.3 Tài liệu viện dẫn\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eCác Tài liệu viện dẫn sau là cần thiết cho việc áp dụng Quy chuẩn này. Trường hợp các Tài liệu viện dẫn được sửa đổi, bổ sung hoặc thay thế thì áp dụng phiên bản mới nhất.\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn ISO 14533-1:2022, Quy trình, phần tử dữ liệu và tài liệu trong thương mạI, công nghiệp và quản trị - hồ sơ chữ ký dài hạn, Phần 1: Hồ sơ chữ ký điện tử nâng cao CMS (CAdES).\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn ISO 14533-2:2021, Quy trình, phần tử dữ liệu và tài liệu trong thương mại, công nghiệp và quản trị - hồ sơ chữ ký dài hạn, Phần 2: Hồ sơ chữ ký điện tử nâng cao XML (XadES).\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn ISO 14533-3:2017, Quy trình, phần tử dữ liệu và tài liệu trong thương mại, công nghiệp và quản trị - Hồ sơ chữ ký dài hạn, Phần 3: Hồ sơ chữ ký dài hạn cho Chữ ký Điện tử Nâng cao PDF (PAdES).\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn ISO 14533-4:2019, Quy trình, phần tử dữ liệu và tài liệu trong thương mại, công nghiệp và quản tộ - Hồ sơ chữ ký dài hạn, Phần 4: Thuộc tính trỏ đến đối tượng chỉ bằng chứng (bên ngoài) của sự tồn tại được sử dụng trong các định dạng chữ ký dài hạn (PoEAttributes).\u003c/p\u003e\n  \u003cp\u003eTCVN 11816-3:2017 (ISO/IEC 10118-3:2004) “Công nghệ thông tin - Các kỹ thuật an toàn - Hàm băm - Phần 3: Hàm băm chuyên dụng”.\u003c/p\u003e\n  \u003cp\u003eKhuyến nghị RFC 3161, Giao thức dấu thời gian (TSP).\u003c/p\u003e\n  \u003cp\u003eKhuyến nghị RFC 6960, Giao thức kiểm tra trạng thái chứng thư chữ ký số trực tuyến (OCSP).\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn của Viện tiêu chuẩn và Công nghệ quốc gia Hoa Kỳ, FIPS 186- 4, Tiêu chuẩn về chữ ký số (DSS), tháng 7 năm 2013.\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn của Viện tiêu chuẩn và Công nghệ quốc gia Hoa Kỳ, FIPS 180- 4, Tiêu chuẩn về Hàm băm an toàn (SHS), tháng 8 năm 2015.\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn của Viện tiêu chuẩn và Công nghệ quốc gia Hoa Kỳ, FIPS 202, Tiêu chuẩn SHA-3: Hàm băm dựa trên hoán vị và hàm đầu ra có thể mở rộng, tháng 8 năm 2015.\u003c/p\u003e\n  \u003cp\u003eTiêu chuẩn của tổ chức IETF, Bảo vệ dữ liệu bằng mật mã trên thiết bị lưu trữ theo khối, tháng 10 năm 2018.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4 Giải thích từ ngữ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eTrong Quy chuẩn này, các từ ngữ dưới đây được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.1. Khuôn dạng dữ liệu phục vụ xác thực lâu dài\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà một loại dữ liệu có cấu trúc, được tham chiếu đến hồ sơ, tài liệu lưu trữ nhằm chứng minh sự tồn tại (thời điểm bắt đầu đưa vào lưu trữ), toàn vẹn của hồ sơ, tài liệu đó.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.2. Mật mã\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà những quy tắc, quy ước riêng dùng để thay đổi hình thức biểu hiện thông tin nhằm bảo đảm bí mật, xác thực, toàn vẹn của nội dung thông tin.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.3. Kỹ thuật mật mã\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà phương pháp, phương tiện có ứng dụng mật mã để bảo vệ thông tin,\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.4. Mã hóa\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà quá trình dùng kỹ thuật mật mã để thay đổi hình thức biểu hiện thông tin.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.5. Giải mã\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà phép biến đổi ngược của quá trình mã hóa tương ứng.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.6. Khóa\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà dãy ký tự điều khiển hoạt động của biến đổi mật mã.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.7. Mật mã không đối xứng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà mật mã trong đó khóa được sử dụng cho phép mã hóa hoặc giải mã gồm hai thành phần là khóa công khai và khóa bí mật với đặc tính có thể dễ dàng tính toán được khóa công khai nếu biết khóa bí mật nhưng không khả thi về mặt tính toán để tính được khóa bí mật từ khỏa công khai.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.8. Thuật toán băm\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà thuật toán thực hiện quá trình biến đổi chuỗi dữ liệu đầu vào có độ dài bất kỳ thành một chuỗi dữ liệu đầu ra đặc trưng có độ dài cố định.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.9. Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà Cục Chứng thực số và Bảo mật thông tin trực thuộc Ban Cơ yếu Chính phủ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.4.10. Chứng thư chữ ký số\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eLà chứng thư chữ ký điện tử đối với chữ ký số.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e1.5 Chữ viết tắt\u003c/strong\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 18.7%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eChữ viết tắt\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 40.58%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eTên tiếng anh\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 40.72%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eTên tiếng việt\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd sty \u003c/td\u003e\n     \u003ctd style=\"width: 45.1%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eLoại\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 42.28%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eTham chiếu\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 12.62%;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 45.1%;\"\u003e\n      \u003cp align=\"center\"\u003eCAdES\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 42.28%;\"\u003e\n      \u003cp align=\"center\"\u003eISO 14533-1:2022\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 12.62%;\"\u003e\n      \u003cp align=\"center\"\u003e2\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 45.1%;\"\u003e\n      \u003cp align=\"center\"\u003eXadES\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 42.28%;\"\u003e\n      \u003cp align=\"center\"\u003eISO 14533-2:2021\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 12.62%;\"\u003e\n      \u003cp align=\"center\"\u003e3\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 45.1%;\"\u003e\n      \u003cp align=\"center\"\u003ePAdES\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 42.28%;\"\u003e\n      \u003cp align=\"center\"\u003eISO 14533-3:2017\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cstrong\u003e2.1.2 Thông tin bắt buộc phải có trong các khuôn dạng chữ ký số\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e- Chứng thư chữ ký số chuyên dùng công vụ của chủ thể thực hiện ký số và danh sách chứng thư chữ ký số bị thu hồi (CRL) hoặc trạng thái chứng thư chữ ký số trực tuyến (OCSP) được công bố bởi Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ tại thời điểm đưa vào lưu trữ;\u003c/p\u003e\n  \u003cp\u003e- Chứng thư chữ ký số chuyên dùng công vụ trung gian (nếu có) và danh sách chứng thư chữ ký số bị thu hồi (CRL) hoặc trạng thái chứng thư chữ ký số trực tuyến (OCSP) được công bố bởi Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ tại thời điểm đưa vào lưu trữ;\u003c/p\u003e\n  \u003cp\u003e- Chứng thư chữ ký số chuyên dùng công vụ gốc và danh sách chứng thư chữ ký số bị thu hồi (CRL) hoặc trạng thái chứng thư chữ ký số trực tuyến (OCSP) được công bố bởi Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ tại thời điểm đưa vào lưu trữ.\u003c/p\u003e\n  \u003cp\u003e- Dấu thời gian hợp lệ trước thời điểm đưa vào lưu trữ; địa chỉ máy chủ dấu thời gian được công bố bởi Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e2.2 Quy định về khuôn dạng dữ liệu phục vụ xác thực lâu dài\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eSử dụng khuôn dạng dữ liệu của thành phần phục vụ xác thực lâu dài cho tài liệu lưu trữ như sau:\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eBảng 2 - Khuôn dạng dữ liệu phục vụ xác thực lâu dài được phép sử dụng\u003c/strong\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 8.82%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eSTT\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 38.08%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eLoại\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 53.1%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eTham chiếu\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 8.82%;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u u003e\n     \u003ctd style=\"width: 6.78%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eSTT\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 59.38%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eThuật toán\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 16.1%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eSử dụng đến năm\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 17.76%;\"\u003e\n      \u003cp align=\"center\"\u003e\u003cstrong\u003eTài liệu tham chiếu\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 6.78%;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 59.38%;\"\u003e\n      \u003cp\u003eSHA-256, SHA-384, SHA-512/256, SHA-512\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 16.1%;\"\u003e\n      \u003cp align=\"center\"\u003e2027\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 17.76%;\"\u003e\n      \u003cp align=\"center\"\u003eQCVN 15:2023/BQP\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 6.78%;\"\u003e\n      \u003cp align=\"center\"\u003e2\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 59.38%;\"\u003e\n      \u003cp\u003eSHA3-256, SHA3-384, SHA3-512\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 16.1%;\"\u003e\n      \u003cp align=\"center\"\u003e2027\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 17.76%;\"\u003e\n      \u003cp align=\"center\"\u003eQCVN 15:2023/BQP\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cstrong\u003e3 QUY ĐỊNH VỀ QUẢN LÝ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e3.1\u003c/strong\u003e Các mức giới hạn đặc tính kỹ thuật của chữ ký số chuyên dùng công vụ nêu tại Quy chuẩn này phục vụ quản lý tài liệu lưu trữ số lâu dài theo quy định của Luật Lưu trữ số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e33/2024/QH15\u003c/a\u003e ngày 21 tháng 6 năm 2024.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e3.2\u003c/strong\u003e Dịch vụ chứng thực chữ ký số chuyên dùng công vụ thuộc phạm vi điều chỉnh trong Mục 1.1 Quy chuẩn này phải đáp ứng quy định kỹ thuật trong Quy chuẩn này.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e3.3\u003c/strong\u003e Hoạt động kiểm tra, đánh giá tình hình sử dụng chữ ký số chuyên dùng công vụ phục vụ xác thực tài liệu lưu trữ số lâu dài của các cơ quan Đảng, Nhà nước được thực hiện theo quy định tại Nghị định số \u003ca target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2024/NĐ-CP\u003c/a\u003e ngày 25 tháng 6 năm 2024 của Chính phủ quy định về chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e4 TRÁCH NHIỆM CỦA CƠ QUAN, TỔ CHỨC, CÁ NHÂN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e4.1\u003c/strong\u003e Các cơ quan, tổ chức, cá nhân liên quan khi sử dụng dịch vụ chứng thực chữ ký fsố chuyên dùng công vụ để xác thực trong hoạt động nghiệp vụ lưu trữ của các cơ quan Đảng, Nhà nước phải tuân thủ quy định trong Quy chuẩn này.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e4.2\u003c/strong\u003e Các cơ quan, tổ chức, cá nhân liên quan có trách nhiệm thực hiện các quy định về chứng nhận hợp quy, công bố hợp quy và chịu sự kiểm tra của cơ quan quản lý nhà nước theo các quy định hiện hành.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e5 TỔ CHỨC THỰC HIỆN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e5.1\u003c/strong\u003e Ban Cơ yếu Chính phủ chỉ đạo Cục Chứng thực số và Bảo mật thông tin hướng dẫn, tổ chức triển khai quản lý theo Quy chuẩn này.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e5.2\u003c/strong\u003e Trong trường hợp các văn bản quy phạm pháp luật quy định tại Quy chuẩn kỹ thuật này có sự thay đổi, bổ sung hoặc được thay thế thì thực hiện theo các văn bản mới. Trong trường hợp các tiêu chuẩn được viện dẫn trong Quy chuẩn này có sự thay đổi, bổ sung, thay thế thì thực hiện theo hướng dẫn của Bộ Quốc phòng.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e5.3\u003c/strong\u003e Trong quá trình triển khai thực hiện Quy chuẩn này, nếu có vấn đề phát sinh, vướng mắc, các cơ quan, đơn vị, tổ chức, cá nhân có liên quan kịp thời phản ánh bằng văn bản về Bộ Quốc phòng (qua Ban Cơ yếu Chính phủ) đề xem xét, quyết định./.\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eTÀI LIỆU THAM KHẢO\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e[1]. National Institute of Standards and Technology, Special Publication 800-131A “\u003cem\u003eTransitioning the Use of Cryptographic Algorithms and Key Lengths\u003c/em\u003e”, March 2019.\u003c/p\u003e\n  \u003cp\u003e[2]. \u003cem\u003eISO 17068:2017 Information and documentation - Trusted third party repository for digital records\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e[3]. \u003cem\u003eISO 14721:2012 The Reference Model for an Open Archival Information System (OAIS)\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e[4]. Recommendation ITU-T X.509 (2008)/ISO/IEC 9594-8 (2008): \"\u003cem\u003eInformation technology - Open Systems Interconnection - The Directory: Public-key and Attribute Certificate trameworks\u003c/em\u003e\".\u003c/p\u003e\n  \u003cp\u003e[5]. ETF RFC 3280 (2002): \"\u003cem\u003eInternet X.509 Public Key Intrastructure Certificate and Certificate Revocation List (CRL) Profile\u003c/em\u003e\".\u003c/p\u003e\n  \u003cp\u003e[6]. IETF RFC 2560 (1999): \"\u003cem\u003eX.509 Internet Public Key Intrastructure Online Certificate Status Protocol - OCSP\u003c/em\u003e\".\u003c/p\u003e\n  \u003cp\u003e[7]. \u003cem\u003eIETF RFC 3852 (2004): \"Cryptographic Message Syntax (CMS)\".\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e[8]. \u003cem\u003eIETF RFC 3161 (2001): \"Intern uctures (ESI); XAdES digital signatures; Part 1: Building blocks and XAdES baseline signatures\".\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e[33]. \u003cem\u003eETSI EN 319 132-2: \"Electronic Signatures and Infrastructures (ESI); XAdES digital signatures; Part 2: Extended XAdES signatures\".\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cdiv\u003e\n   \u003cdiv style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n     \u003cdiv style=\"font-weight: bold; text-transform: uppercase; line-height: 1.3;\"\u003e\n      BỘ TRƯỞNG\n     \u003c/div\u003e\n     \u003cdiv style=\"font-style: italic; font-weight: bold;\"\u003e\n      (Đã ký)\n     \u003c/div\u003e\n     \u003cdiv style=\"font-weight: bold; margin-top: 16px;\"\u003e\n      Đại tướng Phan Văn Giang\n     \u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 76/2025/TT-BQP Quy định Quy chuẩn kỹ thuật quốc gia về xác thực lưu trữ tài liệu số lâu dài của các cơ quan Đảng, Nhà nước\\\",\\\"legislationIdentifier\\\":\\\"76/2025/TT-BQP\\\",\\\"legislationType\\\":\\\"Thông tư\\\",\\\"legislationDate\\\":\\\"2025-07-18T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"InForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Bộ Quốc phòng\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-76-2025-tt-bqp-quy-dinh-quy-chuan-ky-thuat-quoc-gia-v
