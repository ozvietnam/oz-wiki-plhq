name: kiem-tra
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Ghim image Ubuntu (không dùng ubuntu-latest) + ghim bản poppler-utils ở env bên dưới:
    # cùng một dữ liệu phải cho cùng một kết quả trích nguyên văn, không trôi theo image mới (OZV-2290).
    runs-on: ubuntu-26.04
    env:
      # Poppler 26.01.0 là bản CI đã đối chiếu khớp ở OZV-2288 (PR #764).
      # Bản deb có trong kho ubuntu-26.04: Release 26.01.0-2build2, Updates/Security 26.01.0-2ubuntu0.3.
      # Khi cần đổi bản: tra `apt-cache madison poppler-utils` trên runner rồi sửa đây;
      # đổi Ubuntu LTS thì sửa cả runs-on. CI đỏ ở bước cài = bản ghim không còn trong kho, cập nhật có ý thức.
      POPPLER_UTILS_VERSION: "26.01.0-2ubuntu0.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cài pdftotext (poppler-utils) để đối chiếu nguyên văn điều khoản
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "poppler-utils=${POPPLER_UTILS_VERSION}"
          # In bản đang dùng ra log + summary để lộ ngay lệch bản poppler giữa CI và máy soát (OZV-2290).
          INSTALLED="$(dpkg-query -W -f='${Version}' poppler-utils)"
          echo "poppler-utils (deb) : ${INSTALLED}"
          pdftotext -v 2>&1 | head -1
          { echo "## Bản poppler trên CI"; echo "poppler-utils ${INSTALLED}"; pdftotext -v 2>&1 | head -1; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${INSTALLED}" != "${POPPLER_UTILS_VERSION}" ]; then
            echo "::error::poppler-utils cài được (${INSTALLED}) khác bản ghim (${POPPLER_UTILS_VERSION}) — cập nhật POPPLER_UTILS_VERSION trong .github/workflows/kiem-tra.yml"
            exit 1
          fi
      - run: npm ci
      - name: Kiểm nguyên văn điều khoản với PDF (bắt buộc có pdftotext)
        shell: bash
        run: |
          set -euo pipefail
          # Thiếu pdftotext thì bộ kiểm tự bỏ qua êm — trên CI phải ĐỎ.
          if ! command -v pdftotext >/dev/null 2>&1; then
            echo "::error::Thiếu pdftotext trên CI — không đối chiếu được điều khoản với PDF"
            exit 1
          fi
          pdftotext -v 2>&1 | head -1
          # Chạy MỘT lần (~1 phút) ra JSON rồi tự in tóm tắt + chặn.
          node tools/kiem-tra-dieu-khoan.mjs --json > kiem-tra-dieu-khoan.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("kiem-tra-dieu-khoan.json", "utf8"));
            const k = r.thongKe;
            for (const e of r.loi) console.log(`LỖI       ${e.file}: ${e.msg}`);
            const tomTat = `kiem-tra-dieu-khoan: ${k.soVanBanCoDieuKhoan} văn bản có điều khoản (${k.soDieuKhoan} mục) · khớp nguyên văn ${k.soDieuKhoanKhop}/${k.soDieuKhoanDaDoiChieu} đã đối chiếu · bỏ qua scan ${k.soDieuKhoanBoQuaPdfScan} · bỏ qua vì thiếu pdftotext ${k.soDieuKhoanBoQuaThieuPdftotext} · ${r.loi.length} lỗi`;
            console.log(tomTat);
            require("fs").writeFileSync("kiem-tra-dieu-khoan.txt", tomTat + "\n");
            const loi = [];
            if (k.soDieuKhoanBoQuaThieuPdftotext > 0) loi.push(`${k.soDieuKhoanBoQuaThieuPdftotext} văn bản bị bỏ qua vì thiếu pdftotext`);
            if (!(k.soDieuKhoanDaDoiChieu > 0)) loi.push("không đối chiếu được điều khoản nào (0 mục)");
            if (r.loi.length) loi.push(`${r.loi.length} lỗi điều khoản`);
            if (loi.length) { for (const m of loi) console.log(`::error::${m}`); process.exit(1); }
          '
          { echo '## Kiểm nguyên văn điều khoản'; tail -1 kiem-tra-dieu-khoan.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Kiểm sổ + công cụ + wiki
        run: npm test
      - name: Báo cáo điểm mù (không chặn)
        run: |
          node tools/diem-mu.mjs --stdout > diem-mu.md
          { echo '## Điểm mù sau thay đổi này'; head -30 diem-mu.md; } >> "$GITHUB_STEP_SUMMARY"
