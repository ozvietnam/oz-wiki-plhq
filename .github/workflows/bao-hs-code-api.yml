name: dung-lai-va-bao-hs-code-api
# Sau mỗi lần gộp vào main:
#   1. dựng lại tệp sinh tự động (dist/registry.json, bao-cao/*) từ registry/ + wiki/ + nhu-cau/ và commit nếu đổi
#      → PR không cần (và không nên) commit dist/ hay bao-cao/: đó là nguyên nhân chính khiến các PR xung đột nhau;
#   2. dist/registry.json hay dist/hs-index.json đổi so với HEAD → tạo GitHub Release gắn thẻ dist-YYYY-MM-DD
#      (hậu tố .N nếu trùng ngày), đính kèm hai tệp + SHA256SUMS — bản chụp bất biến cho bên dùng (docs/tich-hop.md);
#   3. báo hs-code-api đồng bộ ngay (repository_dispatch "plhq-updated" → workflow plhq-sync bên đó).
#      Không có token thì bỏ qua — hs-code-api vẫn tự đồng bộ mỗi ngày lúc 08:17 giờ VN.
# Token: secret HS_CODE_API_DISPATCH_TOKEN = fine-grained PAT, repo ozvietnam/hs-code-api, quyền Contents: Read and write.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'bao-cao/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dung-lai
  cancel-in-progress: false
jobs:
  dung-lai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dựng lại dist + báo cáo
        run: |
          node tools/dung.mjs
          node tools/diem-mu.mjs
      - name: Tạo Release nếu dist đổi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cu() { git show "HEAD:$1" 2>/dev/null | sha256sum | cut -d' ' -f1 || echo none; }
          truoc_reg=$(cu dist/registry.json); truoc_idx=$(cu dist/hs-index.json)
          sau_reg=$(sha256sum dist/registry.json | cut -d' ' -f1)
          sau_idx=$(sha256sum dist/hs-index.json | cut -d' ' -f1)
          if [ "$truoc_reg" = "$sau_reg" ] && [ "$truoc_idx" = "$sau_idx" ]; then
            echo "dist không đổi so với HEAD — không tạo release"; exit 0
          fi
          (cd dist && sha256sum registry.json hs-index.json > SHA256SUMS)
          tag="dist-$(date +%F)"
          n=1
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do n=$((n+1)); tag="dist-$(date +%F).$n"; done
          ghi_chu="Bản chụp dist sau ${GITHUB_SHA::7} — kiểm tra bằng SHA256SUMS. URL thẻ là bất biến; bản cũ không bị xoá (docs/tich-hop.md)."
          gh release create "$tag" dist/registry.json dist/hs-index.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$ghi_chu"
          echo "Đã tạo release $tag"
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add dist bao-cao
          if git diff --cached --quiet; then echo "Tệp sinh tự động đã khớp"; exit 0; fi
          git commit -q -m "chore(dung): dựng lại dist + bao-cao sau $(git log -1 --format=%h HEAD)"
          # main có thể vừa có commit mới trong lúc chạy — kéo về rồi đẩy (tệp sinh tự động sẽ được dựng lại ở lần chạy sau).
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::Không đẩy được commit dựng lại"; exit 1
      - name: Báo hs-code-api đồng bộ
        env:
          TOKEN: ${{ secrets.HS_CODE_API_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::Chưa có HS_CODE_API_DISPATCH_TOKEN — hs-code-api sẽ đồng bộ theo lịch hằng ngày."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ozvietnam/hs-code-api/dispatches \
            -d "{\"event_type\":\"plhq-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
          echo "Đã báo hs-code-api đồng bộ (sha $GITHUB_SHA)"
