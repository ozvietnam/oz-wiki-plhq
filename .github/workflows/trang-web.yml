name: trang-web
# Dựng và phát hành cổng tra cứu web tĩnh (thư mục site/) lên GitHub Pages.
# Chỉ phục vụ tra cứu hiệu lực VBQPPL, wiki nghiệp vụ, điều khoản bậc A và hóa chất CAS (NĐ 24/2026);
# không phân loại mã HS hay tính thuế suất (ranh giới 0% trùng lặp với hs-code-api).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dung
      - run: npm run dung:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Triển khai GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
