    nguon_can_cu_ky_vong: "Điều 3 (Danh mục sản phẩm, hàng hóa rủi ro cao — bắt buộc chứng nhận hợp quy dựa trên kết quả thử nghiệm của tổ chức được công nhận và đăng ký kiểm tra nhà nước trước thông quan), Điều 4 (Danh mục rủi ro trung bình — không kiểm tra khi nhập khẩu, công bố hợp quy trước lưu thông), Điều 5 (đáp ứng đủ các QCVN nếu thuộc nhiều quy chuẩn mà không đánh giá trùng lặp), Điều 6–7 (hiệu lực từ 01/07/2026 và chuyển tiếp hồ sơ đăng ký KTNN trước 01/07/2026) TT 36/2026/TT-BKHCN; Điều 82, 83, 84, 86 (khung rủi ro trung bình/cao, thời hạn xử lý 01/07/05 ngày làm việc, chế độ giảm kiểm tra 02 năm sau 03 lần đạt liên tiếp và điều kiện không công bố lại) NĐ 37/2026/NĐ-CP."
