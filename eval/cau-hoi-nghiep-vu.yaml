    cau_hoi: Từ ngày 01/07/2026, Thông tư 36/2026/TT-BKHCN và Nghị định 37/2026/NĐ-CP phân loại và áp dụng biện pháp quản lý chất lượng đối với hàng hóa nhập khẩu thuộc Bộ Khoa học và Công nghệ (mức độ rủi ro cao vs rủi ro trung bình), xử lý trường hợp chịu nhiều QCVN đồng thời, miễn/giảm kiểm tra khi tái nhập cùng loại và chuyển tiếp hồ sơ trước 01/07/2026 như thế nào?
